# markdownlint-cli2 configuration.
#
# Scoped to every Markdown file in the workspace. Naming the whole tree and
# listing the exceptions is the smaller list and the safe one: a page added
# anywhere is checked from the moment it is written, where a list of
# directories leaves a page outside it as prose nothing checks.

config:
  fenced-code-language: false
  ul-style:
    style: dash
  line-length:
    line_length: 90
    tables: false
  no-duplicate-heading:
    siblings_only: true
  descriptive-link-text: false
  first-line-heading: false
  no-inline-html:
    allowed_elements: []

gitignore: true

globs:
  - "**/*.md"
  - "**/*.mdx"

# `gitignore: true` above keeps the build outputs and the installed packages
# out. It does not cover `.git` itself, because git does not ignore its own
# directory, and a repository is not prose. The environments and the build and
# scratch directories a workspace makes are left out whether or not a
# `.gitignore` names them. A path a project leaves out beyond these, such as a
# submodule with gates of its own, is added here, to `cspell.json`'s
# `ignorePaths` and to `.prettierignore` together, so the gates never disagree
# about a path.
ignores:
  - ".git/**"
  - "**/.venv/**"
  - "**/build/**"
  - "tmp/**"
  - "cold-storage/**"
  - "tasks/**/done/**"
  - ".claude/workflows/**"
  - ".claude/worktrees/**"
  - "crates/gg/src/probe_fixtures/**"
  - "crates/gg/src/sandbox/guests/**"
  - "crates/foray-core/schemas/*.json"
  - "crates/lattice-core/schemas/*.json"
  - "test-cases/performance/hard/lattice/*/cases/*.json"
  - "crates/*/testdata/definitions/**"
  - "**/*.hbs"
  - "**/.build/**"
  - "**/.spago/**"
  - "**/.vendor/**"
  - "**/vendor/**"
  - "**/.gg/**"
  - "packages/gg-sandbox-purescript/output/**"
  - "runs/**"
  - "tcab-store/**"
  - "tcab-artifacts/**"
  - ".tcab-driver/**"
  - "reference-previews/**"
