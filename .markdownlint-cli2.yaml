# markdownlint-cli2 configuration.
#
# Scoped to every Markdown file in the workspace. Naming the whole tree and
# listing the exceptions is the smaller list and the safe one: a page added
# anywhere is checked from the moment it is written, where a list of
# directories leaves a page outside it as prose nothing checks.
#
# `.nyxsis/.markdownlint-cli2.yaml` repeats `config` below for the issue files,
# leaving their fenced blocks out of the line-length rule; change both together.

config:
  fenced-code-language: false
  ul-style:
    style: dash
  line-length:
    line_length: 90
    tables: false
  no-duplicate-heading:
    siblings_only: true
  descriptive-link-text: false
  first-line-heading: false
  no-inline-html:
    allowed_elements: []

gitignore: true

globs:
  - "**/*.md"
  - "**/*.mdx"

# `gitignore: true` above keeps the build outputs and the installed packages
# out. It does not cover `.git` itself, because git does not ignore its own
# directory, and a repository is not prose. The environments and the build and
# scratch directories a workspace makes are left out whether or not a
# `.gitignore` names them. A path a project leaves out beyond these, such as a
# submodule with gates of its own, is added here, to `cspell.json`'s
# `ignorePaths` and to `.prettierignore` together, so the gates never disagree
# about a path.
#
# markdownlint-cli2 reads each pattern relative to the checkout's root, the
# directory it runs in, so `.git/**` is the repository's own `.git` and
# `**/build/**` a `build` directory inside the checkout, wherever the checkout
# stands. A checkout may itself sit under a `.git` or a `build` directory, as a
# worktree added under the repository's `.git` does. cspell matches a pattern
# opening with `**` against the whole path instead, which is why `cspell.json`
# writes the same paths anchored, as `/.git/**` and `/**/build/**`: unanchored,
# they leave every file of such a checkout out, and the gate fails on checking
# no file.
ignores:
  - ".git/**"
  - "**/.venv/**"
  - "**/build/**"
  - "tmp/**"
  - "cold-storage/**"
  - "client-tauri/**"
  - "contracts/**"
  - "engines/**"
  - "gg/**"
  - "gg.rocks/**"
  - "microservice-arena/**"
  - "microservice-artifacts/**"
  - "microservice-dispatcher/**"
