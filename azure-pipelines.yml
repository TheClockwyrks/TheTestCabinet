# Azure DevOps CI pipeline for The Test Cabinet — the primary CI system.
#
# Validates the project's headless components: every Rust crate except the Tauri
# desktop shell (the `tcab` CLI, the `tcab-backend` server, the
# `tcab-dispatcher`/`tcab-driver`/`tcab-artifacts` services, and the libraries they
# share) plus the TypeScript front ends (the gallery, the
# operator web console, and these docs). The Tauri desktop app is deliberately not
# built in this per-change CI, so runners need no GUI system libraries; it is
# built and bundled for every platform in the GitHub Release workflow
# (.github/workflows/release.yml) instead. Every job delegates to a shared script
# under scripts/ci/, so the GitHub workflows run exactly the same checks (see
# scripts/ci/README.md).
#
# Azure is the primary CI and covers Linux and Windows; macOS validation lives in
# GitHub because Azure has no macOS agents. The `binary` job release-builds and
# smoke-tests the shipped `tcab` binary on Linux and Windows so a release can
# never publish a binary that is flat-out broken; macOS gets the same check on
# GitHub, on demand (its `binary-macos.yml` workflow), since those runners are
# costly and only needed at release time.
#
# The YAML's only responsibilities are provisioning toolchains (Rust ships with
# the Microsoft-hosted Ubuntu and Windows images; Node is installed via UseNode),
# reclaiming disk on the near-full hosted Ubuntu agents before the cargo jobs
# (scripts/ci/free-disk-linux.sh), and caching.

trigger:
  branches:
    include:
      - master
      - staging

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-24.04

variables:
  # Stable, colorized logs; disable incremental artifacts that only bloat the
  # cache on single-shot CI builds.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info is by far the largest thing the dev/test build writes: measured on
  # this workspace it is ~84% of a test executable, and the workspace's ~290 test
  # binaries dominate `target/`. CI never attaches a debugger — it only needs
  # readable panic backtraces — so emit line tables alone. That keeps file:line in
  # backtraces while dropping the type/variable DWARF (`.debug_info`/`.debug_str`),
  # cutting test executables ~69% and the whole `target/` from ~36 GB to ~14 GB.
  # Without this the tree plus the tar the cache save writes beside it no longer
  # fits on the hosted agent, which is what broke the "Cache cargo target" save.
  # `test` inherits `dev`, but set both so the intent survives a profile change.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  - job: rust
    displayName: "Rust: lint, build & test (CLI, backend, dispatcher/driver/artifacts, core)"
    steps:
      - checkout: self
        fetchDepth: 1
      # The hosted Ubuntu image ships ~95% full; free unused SDKs so the cargo
      # target/ build and its cache save do not run the OS disk out of room.
      - script: ./scripts/ci/free-disk-linux.sh
        displayName: Reclaim agent disk
      - task: Cache@2
        displayName: Cache cargo home
        inputs:
          key: 'cargo-home | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-home | "$(Agent.OS)"
          path: $(HOME)/.cargo
      - task: Cache@2
        displayName: Cache cargo target
        inputs:
          # The debug level is part of the key: artifacts built at a different
          # `debug` setting have a different fingerprint, so cargo rebuilds them
          # but never evicts the originals — restoring a full-debug cache into a
          # line-tables build would leave both in `target/` and put the disk
          # straight back over the edge. Keying on it namespaces each setting to
          # its own cache instead.
          key: 'cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
          restoreKeys: |
            cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
          path: target
      # Installs the channel + components pinned by rust-toolchain.toml on first
      # cargo use; print what resolved for easier debugging.
      - script: rustup show
        displayName: Show Rust toolchain
      - script: ./scripts/ci/rust-lint.sh
        displayName: Lint (rustfmt + clippy)
      - script: ./scripts/ci/install-nextest.sh
        displayName: Install cargo-nextest
      - script: ./scripts/ci/rust-test.sh
        displayName: Build & test

  - job: binary
    displayName: "Binary: release build & smoke"
    # The shipped binary is release-mode, so it is validated on every target
    # platform Azure can run. macOS is validated on GitHub (no macOS agents
    # here). Each leg release-builds `tcab`, runs the suite in release mode, and
    # smoke-runs the produced binary; see scripts/ci/binary-smoke.sh.
    strategy:
      matrix:
        linux:
          imageName: ubuntu-24.04
        windows:
          imageName: windows-2022
    pool:
      vmImage: $(imageName)
    variables:
      # Pin a per-agent CARGO_HOME so the cache path is identical on Linux and
      # Windows (the predefined $(HOME) is not set on Windows agents).
      CARGO_HOME: $(Pipeline.Workspace)/.cargo
    steps:
      - checkout: self
        fetchDepth: 1
      # Linux only: reclaim the near-full hosted Ubuntu disk before the release
      # target/ build and cache. The Windows agent's disk is not affected and the
      # paths are Ubuntu-image specific, so it skips this.
      - bash: ./scripts/ci/free-disk-linux.sh
        displayName: Reclaim agent disk
        condition: eq(variables['Agent.OS'], 'Linux')
      - task: Cache@2
        displayName: Cache cargo home
        inputs:
          key: 'cargo-home-release | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-home-release | "$(Agent.OS)"
          path: $(CARGO_HOME)
      - task: Cache@2
        displayName: Cache cargo target
        inputs:
          key: 'cargo-target-release | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-target-release | "$(Agent.OS)"
          path: target
      - script: rustup show
        displayName: Show Rust toolchain
      # `bash` runs Git Bash on the Windows agent, so the one script drives every
      # platform identically — including the cross-platform nextest install.
      - bash: ./scripts/ci/install-nextest.sh
        displayName: Install cargo-nextest
      - bash: ./scripts/ci/binary-smoke.sh
        displayName: Release build & smoke

  - job: web
    displayName: "Front ends: type-check & build (gallery, web console, docs)"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(HOME)/.npm
      - script: ./scripts/ci/web-build.sh
        displayName: Build website

  # The front-end unit suites, and the two type-checks no build covers (the
  # short-link Worker and the gallery's Pages Functions). Its own job rather than
  # steps on `web`, so a failing assertion reports as a failing test rather than as
  # a failing build, and so it runs in parallel with it: the tests need only the
  # small workspace runtime packages, not the app bundles.
  - job: webtest
    displayName: "Front ends: unit tests (vitest)"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(HOME)/.npm
      - script: ./scripts/ci/web-test.sh
        displayName: Test front ends

  - job: specs
    displayName: "Specs: markdown & spelling"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - script: ./scripts/ci/specs-lint.sh
        displayName: Lint specs

  # Needs no toolchain and no history: the check reads the checked-out index, so
  # a shallow clone is enough.
  - job: frozen
    displayName: "Frozen: test-case versions with recorded runs are unchanged"
    steps:
      - checkout: self
        fetchDepth: 1
      - script: ./scripts/ci/frozen-check.sh
        displayName: Verify frozen directories

  - job: contract
    displayName: "Contract: regenerate & check for drift"
    # Regenerates the TS bindings + JSON Schemas from the Rust source and fails on
    # any diff, so the contract's three representations can never drift apart.
    # Needs both Rust (the generator) and Node (Prettier), so it runs on its own.
    steps:
      - checkout: self
        fetchDepth: 1
      # Frees unused SDKs before the codegen build populates cargo target/; the
      # Node toolcache is left intact for UseNode below.
      - script: ./scripts/ci/free-disk-linux.sh
        displayName: Reclaim agent disk
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - task: Cache@2
        displayName: Cache cargo home
        inputs:
          key: 'cargo-home | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-home | "$(Agent.OS)"
          path: $(HOME)/.cargo
      - task: Cache@2
        displayName: Cache cargo target
        inputs:
          # The debug level is part of the key: artifacts built at a different
          # `debug` setting have a different fingerprint, so cargo rebuilds them
          # but never evicts the originals — restoring a full-debug cache into a
          # line-tables build would leave both in `target/` and put the disk
          # straight back over the edge. Keying on it namespaces each setting to
          # its own cache instead.
          key: 'cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
          restoreKeys: |
            cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
          path: target
      - script: rustup show
        displayName: Show Rust toolchain
      - script: ./scripts/ci/contract-drift.sh
        displayName: Regenerate & check for drift
