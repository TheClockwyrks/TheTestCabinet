# Azure Pipelines CI/CD for The Test Cabinet: the one pipeline that gates a commit,
# mirrors it to GitHub, builds its images into the Test Cabinet Azure Container
# Registry, and rolls it onto the staging or production cluster by branch.
#
# Three stages, each after the one before it has passed:
#
#   gates   every check a commit has to pass, on every branch. On master, staging
#           and tags it also builds the static gg binaries and, on a tag, fails when
#           `gg --version` differs from the tag. Its `mirror` job then pushes a gated
#           master, staging or nightly commit, or a tag, to GitHub.
#   images  master and staging: every service image and every run-container image,
#           built natively on amd64 and arm64 and pushed to testcabinet.azurecr.io
#           tagged by the commit sha. Master and tags: gg's binaries and reference
#           documents uploaded to the `gg-releases` blob container.
#   deploy  staging rolls the staging cluster and master the production cluster to
#           the commit's images, and both deploy the docs site.
#
# A feature branch therefore runs the gates and nothing else. Pull requests are not
# triggered from this file: Azure Repos ignores a `pr:` block, so pull requests into
# master and staging run the gates through build validation policies on those
# branches.
#
# Every job delegates to a script under scripts/ci/ (see scripts/ci/README.md). The
# YAML names the CI image a job runs inside, its caches, and the credentials a step
# runs under, and nothing else. The gates run as parallel tracks (one job each for
# the Rust build and tests, rustdoc, the Rust lints, the release binaries, the web
# front ends and the compiler-free checks), each inside a CI image that
# azure-pipelines-ci-images.yml builds from ci/images/ and that carries every
# toolchain the track needs. Nothing here holds a credential of its own:
#
#   tcab-acr         Docker Registry service connection (workload identity
#                    federation) holding AcrPush on the registry, which the gates
#                    also pull their CI images through. Both clusters' kubelets
#                    hold AcrPull, so the overlays need no pull secret.
#   tcab-deploy      Azure Resource Manager connection (workload identity federation)
#                    holding "Azure Kubernetes Service RBAC Admin" on each cluster's
#                    application namespace and the custom "Test Cabinet AKS Command
#                    Invoke" role on each cluster, and nothing else. The API servers
#                    are private, so the deploy runs kubectl through
#                    `az aks command invoke`.
#   tcab-gg-publish  Azure Resource Manager connection (workload identity federation)
#                    holding Storage Blob Data Contributor on testcabinetartifacts.
#   github-mirror-key  secure file: a deploy key with write access to the GitHub
#                    mirror and nothing else.
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_AUDIO_R2_BUCKET,
#   CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID, CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY
#                    secret pipeline variables: the docs deploy and the read-only
#                    presign keys the audio store is staged with.
#
# The clusters' nodes are arm64 and a Microsoft-hosted Linux agent is x86_64, so every
# arm64 build runs natively on the organisation's arm64 agent pool rather than under
# emulation. The run images compile Rust and wasm inside their builds, which is far too
# slow emulated.

trigger:
  branches:
    include:
      - master
      - staging
      - nightly
  tags:
    include:
      - v*

# The submodule repositories a job may reach. The project protects YAML pipeline
# repository access, so a job token reaches only the repositories its job names under
# `uses:`, and each of them is listed here.
resources:
  repositories:
    - repository: cold-storage
      type: git
      name: the-test-cabinet/cold-storage
  # The CI images the Linux gate jobs run inside. Each tag is content-addressed
  # over the image's inputs (`scripts/ci/ci-image.sh reference <track>` prints the
  # current one) and is pasted here by hand once azure-pipelines-ci-images.yml has
  # pushed it; the `checks` job fails when a tag here is stale. ci/images/README.md
  # says what each image holds and how a change to one rolls out.
  containers:
    - container: rust
      image: testcabinet.azurecr.io/ubuntu-test-cabinet-rust-cicd:v1-d2a8c87cfc10
      endpoint: tcab-acr
    - container: web
      image: testcabinet.azurecr.io/ubuntu-test-cabinet-web-cicd:v1-e075d8b79774
      endpoint: tcab-acr

pool:
  vmImage: ubuntu-24.04

variables:
  # Stable, colorized logs; disable incremental artifacts that only bloat the
  # cache on single-shot CI builds.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info is by far the largest thing the dev/test build writes: measured on
  # this workspace it is ~84% of a test executable, and the workspace's ~290 test
  # binaries dominate `target/`. CI never attaches a debugger — it only needs
  # readable panic backtraces — so emit line tables alone. That keeps file:line in
  # backtraces while dropping the type/variable DWARF (`.debug_info`/`.debug_str`),
  # cutting test executables ~69% and the whole `target/` from ~36 GB to ~14 GB.
  # Without this the tree plus the tar the cache save writes beside it no longer
  # fits on the hosted agent, which is what broke the "Cache cargo target" save.
  # `test` inherits `dev`, but set both so the intent survives a profile change.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # The organisation's arm64 agent pool, which every arm64 build runs on natively.
  arm64Pool: pool-dev-linux-arm64-wus3-4c-eph-01
  # The two architectures every image and gg binary is built for.
  architectures: amd64,arm64
  # The hash partitions gg's test suite runs as, one `gg_tests_<k>` job each.
  # Most of gg's tests compile a program, and the whole suite outgrows a job, so
  # it is split: each entry is a `k/N` nextest accepts, and N is their count.
  ggTestPartitions: 1/4,2/4,3/4,4/4
  # The targets of deployments/images/services.Dockerfile, plus the web console.
  services: backend,auth,dispatcher,driver,artifacts,arena,publisher,web

stages:
  - stage: gates
    displayName: Gates
    jobs:
      # THE TRACKS. The gates run as parallel jobs, one per track, so the stage
      # costs its slowest job rather than their sum, and every step is one
      # command whose duration is a number of its own:
      #
      #   rust            build, then test, every crate but gg: the Rust critical path
      #   gg_tests_<k>    build gg and its tests, then one partition of its suite
      #   rustdoc         rustdoc and the doctests, off the critical path
      #   rustlint        rustfmt and clippy, off the critical path
      #   binary_linux    the release build, tests and smoke of `tcab`
      #   binary_windows  the same on Windows
      #   web             install, packages, validators, tests, builds: the web critical path
      #   checks          the lints and consistency checks that need no compiler
      #   gg_<arch>       the static gg binaries, on master, staging and tags
      #
      # Every Linux job runs inside a CI image (`resources.containers` above)
      # that carries its toolchains, so no job installs one; ci/images/README.md
      # says what each image holds. No job sets a timeout: the 60-minute default
      # is the budget, and a job that outgrows it is split, not extended.

      - job: rust
        displayName: "Rust: build & test"
        container: rust
        steps:
          - checkout: self
            fetchDepth: 1
          # On the host, not in the container: the hosted image ships ~95% full,
          # and the reclaim needs the host's sudo and docker. The CI image is in
          # use by this very job, so the image prune leaves it alone.
          - script: ./scripts/ci/free-disk-linux.sh
            displayName: Reclaim agent disk
            target: host
          - task: Cache@2
            displayName: Cache cargo target
            inputs:
              # The debug level is part of the key: artifacts built at a
              # different `debug` setting have a different fingerprint, so cargo
              # rebuilds them but never evicts the originals, and restoring a
              # full-debug cache into a line-tables build would leave both in
              # `target/` and run the disk out. Keying on it namespaces each
              # setting to its own cache.
              key: 'cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
              restoreKeys: |
                cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
              path: target
          - script: ./scripts/ci/toolchains.sh
            displayName: Show the toolchains
          # Building crates/gg reflects two of its catalogues with the pinned
          # `typescript` that lives in the npm workspace.
          - script: ./scripts/ci/npm-install.sh
            displayName: Install the npm workspace
          - script: ./scripts/ci/rust-build.sh
            displayName: Build
          # Every crate but gg, whose suite is the gg_tests jobs below.
          - script: ./scripts/ci/rust-test.sh
            displayName: Test
          # The contract gate rides here rather than on a job of its own: its
          # generator is a workspace binary the Build step has just compiled.
          - script: ./scripts/ci/contract-drift.sh
            displayName: Regenerate the contract & check for drift
          - script: ./scripts/ci/seeded-contract-check.sh
            displayName: Seeded contract names nothing about evaluation

      # gg's suite, one job per entry of `ggTestPartitions`. Each job compiles
      # gg and its tests itself, under a cargo target cache of its own, and then
      # runs its partition; the mirror job below depends on every one of them.
      - ${{ each partition in split(variables.ggTestPartitions, ',') }}:
          - job: gg_tests_${{ replace(partition, '/', '_of_') }}
            displayName: "gg: tests (${{ partition }})"
            container: rust
            steps:
              - checkout: self
                fetchDepth: 1
              - script: ./scripts/ci/free-disk-linux.sh
                displayName: Reclaim agent disk
                target: host
              - task: Cache@2
                displayName: Cache cargo target
                inputs:
                  key: 'cargo-target-gg | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
                  restoreKeys: |
                    cargo-target-gg | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
                  path: target
              - script: ./scripts/ci/toolchains.sh
                displayName: Show the toolchains
              # Building crates/gg reflects two of its catalogues with the pinned
              # `typescript` that lives in the npm workspace.
              - script: ./scripts/ci/npm-install.sh
                displayName: Install the npm workspace
              - script: ./scripts/ci/gg-test-build.sh
                displayName: Build
              - script: ./scripts/ci/gg-test.sh ${{ partition }}
                displayName: Test

      # rustdoc and the doctests: both compile the workspace at the test profile
      # and neither is on the way to a test result, so they share a job off the
      # critical path. The doctests run whether or not rustdoc passed, so a
      # broken link never hides a broken example.
      - job: rustdoc
        displayName: "Rust: rustdoc & doctests"
        container: rust
        steps:
          - checkout: self
            fetchDepth: 1
          - script: ./scripts/ci/free-disk-linux.sh
            displayName: Reclaim agent disk
            target: host
          - task: Cache@2
            displayName: Cache cargo target
            inputs:
              key: 'cargo-target-doc | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
              restoreKeys: |
                cargo-target-doc | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
              path: target
          - script: ./scripts/ci/toolchains.sh
            displayName: Show the toolchains
          - script: ./scripts/ci/npm-install.sh
            displayName: Install the npm workspace
          - script: ./scripts/ci/rust-doc.sh
            displayName: Documentation (warnings denied)
          - script: ./scripts/ci/rust-doctest.sh
            displayName: Doctests
            condition: succeededOrFailed()

      # rustfmt and clippy. Clippy compiles the whole workspace and takes twenty
      # minutes doing it, which is why this is a job of its own rather than the
      # first step of `rust`. Clippy runs whether or not rustfmt passed.
      - job: rustlint
        displayName: "Rust: rustfmt & clippy"
        container: rust
        steps:
          - checkout: self
            fetchDepth: 1
          - script: ./scripts/ci/free-disk-linux.sh
            displayName: Reclaim agent disk
            target: host
          - task: Cache@2
            displayName: Cache cargo target
            inputs:
              key: 'cargo-target-clippy | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
              restoreKeys: |
                cargo-target-clippy | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
              path: target
          - script: ./scripts/ci/toolchains.sh
            displayName: Show the toolchains
          - script: ./scripts/ci/npm-install.sh
            displayName: Install the npm workspace
          - script: ./scripts/ci/rust-fmt.sh
            displayName: rustfmt
          - script: ./scripts/ci/rust-clippy.sh
            displayName: Clippy (warnings denied)
            condition: succeededOrFailed()

      # The shipped binary is release-mode, so it is validated on Linux and
      # Windows: each leg release-builds `tcab` and its tests, runs them, and
      # smoke-runs the produced binary. On a tag, that smoke-tested binary is kept
      # as the run's `tcab-<platform>` artifact, which is how a release of `tcab`
      # is published. Two jobs rather than a matrix, because only the Linux leg
      # runs inside a CI image; the Windows leg runs on the hosted image, which
      # is the one place a Rust job still installs its test runner per run.
      - job: binary_linux
        displayName: "Binary: release build & smoke (linux)"
        container: rust
        steps:
          - checkout: self
            fetchDepth: 1
          - script: ./scripts/ci/free-disk-linux.sh
            displayName: Reclaim agent disk
            target: host
          - task: Cache@2
            displayName: Cache cargo target
            inputs:
              key: 'cargo-target-release | "$(Agent.OS)" | Cargo.lock'
              restoreKeys: |
                cargo-target-release | "$(Agent.OS)"
              path: target
          - script: ./scripts/ci/toolchains.sh
            displayName: Show the toolchains
          - script: ./scripts/ci/release-build.sh
            displayName: Release build
          - script: ./scripts/ci/release-test.sh
            displayName: Release tests
          - script: ./scripts/ci/release-doctest.sh
            displayName: Release doctests
          - script: ./scripts/ci/binary-smoke.sh
            displayName: Smoke
          - script: |
              set -euo pipefail
              mkdir -p tcab-dist
              cp target/release/tcab tcab-dist/
            displayName: Stage the tcab binary
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
          - publish: tcab-dist
            artifact: tcab-linux
            displayName: Publish tcab
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))

      - job: binary_windows
        displayName: "Binary: release build & smoke (windows)"
        pool:
          vmImage: windows-2022
        variables:
          # A CARGO_HOME under the workspace, so the cache has a path the agent
          # can name (the predefined $(HOME) is not set on Windows agents).
          CARGO_HOME: $(Pipeline.Workspace)/.cargo
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Cache@2
            displayName: Cache cargo home
            inputs:
              key: 'cargo-home-release | "$(Agent.OS)" | Cargo.lock'
              restoreKeys: |
                cargo-home-release | "$(Agent.OS)"
              path: $(CARGO_HOME)
          - task: Cache@2
            displayName: Cache cargo target
            inputs:
              key: 'cargo-target-release | "$(Agent.OS)" | Cargo.lock'
              restoreKeys: |
                cargo-target-release | "$(Agent.OS)"
              path: target
          - script: rustup show
            displayName: Show Rust toolchain
          # `bash` runs Git Bash on the Windows agent, so the same scripts drive
          # both legs, the cross-platform nextest install included.
          - bash: ./scripts/ci/install-nextest.sh
            displayName: Install cargo-nextest
          - bash: ./scripts/ci/release-build.sh
            displayName: Release build
          - bash: ./scripts/ci/release-test.sh
            displayName: Release tests
          - bash: ./scripts/ci/release-doctest.sh
            displayName: Release doctests
          - bash: ./scripts/ci/binary-smoke.sh
            displayName: Smoke
          # Staged inside the checkout, because Git Bash would have to translate
          # the staging directory's drive-letter path.
          - bash: |
              set -euo pipefail
              mkdir -p tcab-dist
              cp target/release/tcab.exe tcab-dist/
            displayName: Stage the tcab binary
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
          - publish: tcab-dist
            artifact: tcab-windows
            displayName: Publish tcab
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))

      # The web critical path: one install, one build of the workspace packages,
      # then the validators' type-check, the unit suites and the front-end builds
      # as steps of their own. The three run whichever of the others failed, so
      # one run reports every failure, but none runs without the install and the
      # packages behind it.
      - job: web
        displayName: "Web: validators, tests & builds"
        container: web
        variables:
          npm_config_cache: $(Pipeline.Workspace)/.npm
          # `astro build` records telemetry under $HOME/.config/astro without
          # awaiting the write, so a home it cannot create fails the docs build
          # as an unhandled rejection rather than a warning. Disabling it makes
          # the docs build depend on the checkout alone, and keeps the gate from
          # phoning out.
          ASTRO_TELEMETRY_DISABLED: "1"
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm
          - script: ./scripts/ci/toolchains.sh
            displayName: Show the toolchains
          - script: ./scripts/ci/npm-install.sh
            displayName: Install the npm workspace
          - script: ./scripts/ci/npm-build-packages.sh
            displayName: Build the workspace packages
          - script: echo "##vso[task.setvariable variable=webReady]true"
            displayName: Ready to check
          - script: ./scripts/ci/validators-typecheck.sh
            displayName: Type-check every case's validator projects
            condition: eq(variables['webReady'], 'true')
          - script: ./scripts/ci/web-test.sh
            displayName: Unit tests (vitest)
            condition: eq(variables['webReady'], 'true')
          - script: ./scripts/ci/web-build.sh
            displayName: Build the gallery, web console and docs
            condition: eq(variables['webReady'], 'true')

      # Everything that needs the npm workspace or nothing at all, and no
      # compiler: one job, one install, and every check runs whichever of the
      # others failed. The submodule check fetches each submodule's `master`
      # through the job token, which reaches only the repositories named under
      # `uses:`.
      - job: checks
        displayName: "Checks: lints, formats, manifests, pins"
        container: web
        uses:
          repositories:
            - cold-storage
        variables:
          npm_config_cache: $(Pipeline.Workspace)/.npm
        steps:
          - checkout: self
            fetchDepth: 1
            submodules: false
          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm
          - script: ./scripts/ci/npm-install.sh
            displayName: Install the npm workspace
          - script: echo "##vso[task.setvariable variable=checksReady]true"
            displayName: Ready to check
          - script: ./scripts/ci/ci-image-pins.sh
            displayName: CI image pins are current
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/specs-lint.sh
            displayName: Specs, briefs and docs (markdownlint + cspell)
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/format-check.sh
            displayName: Formatting (prettier)
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/spec-vocabulary-check.sh
            displayName: Seeded specs and prompts name nothing about evaluation
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/audio-packs-lint.sh
            displayName: Every version declares packs that resolve
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/build-context.sh
            displayName: Every Dockerfile COPY can see its source
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/frozen-check.sh
            displayName: Frozen test-case versions are unchanged
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/k8s-manifests.sh
            displayName: Every overlay renders and each deploy is namespaced
            condition: eq(variables['checksReady'], 'true')
          - script: ./scripts/ci/submodule-pins.sh
            displayName: Every submodule pin is on its master
            condition: eq(variables['checksReady'], 'true')
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      # gg's static musl binaries, one per architecture, built natively. They are
      # built on master and staging for the run-image builds, and on master and
      # tags for the upload to the `gg-releases` blob container. On a tag the
      # version gate runs here, so a tag whose gg reports another version fails
      # the gates and nothing after them runs.
      #
      # The amd64 leg runs inside the Rust CI image, which carries the musl
      # toolchain and gg's program-language toolchains. The arm64 leg runs on the
      # organisation's arm64 pool, for which no CI image is built, and provisions
      # its toolchains itself from the same pinned installers.
      - ${{ each arch in split(variables.architectures, ',') }}:
          - job: gg_${{ arch }}
            displayName: "gg: static build (${{ arch }})"
            condition: >-
              or(
                eq(variables['Build.SourceBranch'], 'refs/heads/master'),
                eq(variables['Build.SourceBranch'], 'refs/heads/staging'),
                startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
              )
            ${{ if eq(arch, 'amd64') }}:
              container: rust
            ${{ else }}:
              pool:
                name: $(arm64Pool)
            steps:
              - checkout: self
                fetchDepth: 1
              - ${{ if eq(arch, 'amd64') }}:
                  - script: ./scripts/ci/free-disk-linux.sh
                    displayName: Reclaim agent disk
                    target: host
                  - script: ./scripts/ci/toolchains.sh
                    displayName: Show the toolchains
              - ${{ else }}:
                  - task: UseNode@1
                    displayName: Use Node 24
                    inputs:
                      version: 24.16.0
                  # musl-gcc links the C that `ring` and `wasmtime` compile for
                  # the musl target, and gg's Ruby arm reflects its catalogue
                  # with YARD.
                  - script: sudo apt-get update && sudo apt-get install -y musl-tools ruby
                    displayName: Install the musl toolchain and Ruby
                  - script: |
                      set -euo pipefail
                      if ! command -v rustup >/dev/null 2>&1; then
                        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                          | sh -s -- -y --profile minimal --default-toolchain none
                        echo "##vso[task.prependpath]$HOME/.cargo/bin"
                      fi
                    displayName: Install rustup
                  - script: rustup show
                    displayName: Show Rust toolchain
                  - script: |
                      set -euo pipefail
                      ./scripts/ci/install-gg-toolchains.sh
                      ./scripts/ci/install-gg-build-toolchains.sh
                      echo "##vso[task.prependpath]$HOME/.local/bin"
                    displayName: Install gg's program-language toolchains
              - script: ./scripts/ci/npm-install.sh
                displayName: Install the npm workspace
              - script: ./scripts/ci/gg-dist.sh "$(Build.ArtifactStagingDirectory)/gg"
                displayName: Build gg (static musl)
              - script: >-
                  ./scripts/ci/gg-version-gate.sh
                  "$(Build.ArtifactStagingDirectory)/gg/gg-$(uname -m)-unknown-linux-musl"
                  "$(Build.SourceBranch)"
                displayName: gg version matches the tag
                condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
              - publish: $(Build.ArtifactStagingDirectory)/gg
                artifact: gg-${{ arch }}
                displayName: Keep gg for the images stage

      # GitHub holds a force-pushed mirror that only this job writes to, so the
      # mirror holds gated commits and nothing else. It waits on every gate. The
      # gg builds are skipped on nightly, which is why the condition asks for no
      # failure rather than for every dependency to have succeeded.
      - job: mirror
        displayName: GitHub mirror
        dependsOn:
          - rust
          - ${{ each partition in split(variables.ggTestPartitions, ',') }}:
              - gg_tests_${{ replace(partition, '/', '_of_') }}
          - rustdoc
          - rustlint
          - binary_linux
          - binary_windows
          - web
          - checks
          - ${{ each arch in split(variables.architectures, ',') }}:
              - gg_${{ arch }}
        condition: >-
          and(
            not(failed()),
            not(canceled()),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/master'),
              eq(variables['Build.SourceBranch'], 'refs/heads/staging'),
              eq(variables['Build.SourceBranch'], 'refs/heads/nightly'),
              startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
            )
          )
        steps:
          # GitHub refuses a push from a shallow clone, and a branch carries its tags.
          - checkout: self
            fetchDepth: 0
            fetchTags: true
            submodules: false
          - task: DownloadSecureFile@1
            name: mirrorKey
            displayName: Fetch the mirror's deploy key
            inputs:
              secureFile: github-mirror-key
          - script: ./scripts/ci/mirror.sh "$(mirrorKey.secureFilePath)" "$(Build.SourceBranch)"
            displayName: Push to the GitHub mirror

  - stage: images
    displayName: Images
    dependsOn: gates
    condition: >-
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/master'),
          eq(variables['Build.SourceBranch'], 'refs/heads/staging'),
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
        )
      )
    jobs:
      # Every image is built natively once per architecture and pushed as
      # `<image>:<sha>-<arch>`; a manifest job then fuses the two into the multi-arch
      # `<image>:<sha>` a deployment pins. `:latest` is never pushed.
      - ${{ each arch in split(variables.architectures, ',') }}:
          # The audio store the driver image bakes, ahead of everything else.
          - job: audiostore_${{ arch }}
            displayName: "Audio store (${{ arch }})"
            condition: >-
              or(
                eq(variables['Build.SourceBranch'], 'refs/heads/master'),
                eq(variables['Build.SourceBranch'], 'refs/heads/staging')
              )
            pool:
              ${{ if eq(arch, 'amd64') }}:
                vmImage: ubuntu-24.04
              ${{ else }}:
                name: $(arm64Pool)
            steps:
              - checkout: self
                fetchDepth: 1
              - task: UseNode@1
                displayName: Use Node 22
                inputs:
                  version: 22.23.1
              - task: Docker@2
                displayName: Log in to the registry
                inputs:
                  command: login
                  containerRegistry: tcab-acr
              - script: |
                  set -euo pipefail
                  npm ci
                  ./scripts/ci/audio-store-image.sh "$(Build.SourceVersion)"
                displayName: Build and push the audio store
                env:
                  CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
                  CLOUDFLARE_AUDIO_R2_BUCKET: $(CLOUDFLARE_AUDIO_R2_BUCKET)
                  CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID: $(CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID)
                  CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY: $(CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY)

          # Every run-container image, gated on `gg selfcheck` inside each `-gg`
          # environment before it is pushed. Uses the gg the gates stage built.
          - job: runimages_${{ arch }}
            displayName: "Run-container images (${{ arch }})"
            dependsOn: []
            condition: >-
              or(
                eq(variables['Build.SourceBranch'], 'refs/heads/master'),
                eq(variables['Build.SourceBranch'], 'refs/heads/staging')
              )
            timeoutInMinutes: 360
            pool:
              ${{ if eq(arch, 'amd64') }}:
                vmImage: ubuntu-24.04
              ${{ else }}:
                name: $(arm64Pool)
            steps:
              - checkout: self
                fetchDepth: 1
              - ${{ if eq(arch, 'amd64') }}:
                  - script: ./scripts/ci/free-disk-linux.sh
                    displayName: Reclaim agent disk
              - download: current
                artifact: gg-${{ arch }}
                displayName: Fetch gg
              - task: Docker@2
                displayName: Log in to the registry
                inputs:
                  command: login
                  containerRegistry: tcab-acr
              - script: |
                  set -euo pipefail
                  gg="$(Pipeline.Workspace)/gg-${{ arch }}/gg-$(uname -m)-unknown-linux-musl"
                  chmod 0755 "$gg"
                  ./scripts/ci/run-images.sh "$gg" "$(Build.SourceVersion)"
                displayName: Build, self-check and push the run images

          # One job per service image, so each reports and retries on its own. The
          # driver bakes the audio store this run pushed, so it waits for it.
          - ${{ each service in split(variables.services, ',') }}:
              - job: service_${{ service }}_${{ arch }}
                displayName: "Service image: ${{ service }} (${{ arch }})"
                ${{ if eq(service, 'driver') }}:
                  dependsOn: audiostore_manifest
                ${{ else }}:
                  dependsOn: []
                condition: >-
                  and(
                    succeeded(),
                    or(
                      eq(variables['Build.SourceBranch'], 'refs/heads/master'),
                      eq(variables['Build.SourceBranch'], 'refs/heads/staging')
                    )
                  )
                timeoutInMinutes: 240
                pool:
                  ${{ if eq(arch, 'amd64') }}:
                    vmImage: ubuntu-24.04
                  ${{ else }}:
                    name: $(arm64Pool)
                steps:
                  - checkout: self
                    fetchDepth: 1
                  - ${{ if eq(arch, 'amd64') }}:
                      - script: ./scripts/ci/free-disk-linux.sh
                        displayName: Reclaim agent disk
                  - task: Docker@2
                    displayName: Log in to the registry
                    inputs:
                      command: login
                      containerRegistry: tcab-acr
                  - script: ./scripts/ci/service-image.sh ${{ service }} "$(Build.SourceVersion)"
                    displayName: Build and push ${{ service }}

      - job: audiostore_manifest
        displayName: "Audio store: multi-arch tag"
        dependsOn:
          - ${{ each arch in split(variables.architectures, ',') }}:
              - audiostore_${{ arch }}
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Docker@2
            displayName: Log in to the registry
            inputs:
              command: login
              containerRegistry: tcab-acr
          - script: ./scripts/ci/manifest.sh "$(Build.SourceVersion)" test-cabinet-audio-store
            displayName: Fuse the architectures

      - job: runimages_manifest
        displayName: "Run-container images: multi-arch tags"
        dependsOn:
          - ${{ each arch in split(variables.architectures, ',') }}:
              - runimages_${{ arch }}
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Docker@2
            displayName: Log in to the registry
            inputs:
              command: login
              containerRegistry: tcab-acr
          # The set a run resolves, plus the gg toolchain builder the `-gg` variants
          # copy out of.
          - script: |
              set -euo pipefail
              mapfile -t images < <(./containers/image-names.sh | sed 's/^/test-cabinet-/')
              ./scripts/ci/manifest.sh "$(Build.SourceVersion)" "${images[@]}" test-cabinet-gg-toolchains
            displayName: Fuse the architectures

      - job: services_manifest
        displayName: "Service images: multi-arch tags"
        dependsOn:
          - ${{ each service in split(variables.services, ',') }}:
              - ${{ each arch in split(variables.architectures, ',') }}:
                  - service_${{ service }}_${{ arch }}
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Docker@2
            displayName: Log in to the registry
            inputs:
              command: login
              containerRegistry: tcab-acr
          - script: >-
              ./scripts/ci/manifest.sh "$(Build.SourceVersion)"
              tcab-backend tcab-auth-service tcab-dispatcher tcab-driver
              tcab-artifacts tcab-arena tcab-publisher tcab-web
            displayName: Fuse the architectures

      # gg's release artifacts, on master and tags. The upload re-runs the version gate
      # before it writes anything, so a tag whose gg reports another version uploads
      # nothing.
      - job: gg_publish
        displayName: "gg: upload to gg-releases"
        dependsOn: []
        condition: >-
          or(
            eq(variables['Build.SourceBranch'], 'refs/heads/master'),
            startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
          )
        steps:
          - checkout: self
            fetchDepth: 1
          - ${{ each arch in split(variables.architectures, ',') }}:
              - download: current
                artifact: gg-${{ arch }}
                displayName: Fetch gg (${{ arch }})
          - task: AzureCLI@2
            displayName: Upload gg's binaries and reference documents
            inputs:
              azureSubscription: tcab-gg-publish
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                dist="$(Agent.TempDirectory)/gg"
                mkdir -p "$dist"
                cp "$(Pipeline.Workspace)"/gg-amd64/* "$(Pipeline.Workspace)"/gg-arm64/* "$dist"/
                ./scripts/ci/publish-gg.sh "$dist" "$(Build.SourceBranch)"

  - stage: deploy
    displayName: Deploy
    dependsOn: images
    condition: >-
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/master'),
          eq(variables['Build.SourceBranch'], 'refs/heads/staging')
        )
      )
    jobs:
      # staging rolls the staging cluster and master the production cluster. Neither
      # environment has an approval check. `tcab-deploy` may run commands in each
      # cluster through `az aks command invoke` and write that cluster's application
      # namespace, and nothing else, so the cluster-scoped prerequisites are applied by
      # hand (see
      # deployments/k8s/README.md). deploy.sh waits for every rollout and undoes one
      # that does not become ready. Each entry below is `<environment>:<branch>`.
      - ${{ each target in split('staging:staging,prod:master', ',') }}:
          - deployment: deploy_${{ split(target, ':')[0] }}
            displayName: "Roll ${{ split(target, ':')[0] }}"
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/${{ split(target, ':')[1] }}')
            environment: tcab-${{ split(target, ':')[0] }}
            timeoutInMinutes: 60
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      fetchDepth: 1
                      submodules: false
                    - task: AzureCLI@2
                      displayName: Apply and wait for every rollout
                      inputs:
                        azureSubscription: tcab-deploy
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: ./scripts/ci/deploy.sh ${{ split(target, ':')[0] }} "$(Build.SourceVersion)"

      # The docs site, to the Cloudflare Pages project for this branch.
      - job: docs
        displayName: Docs site
        steps:
          - checkout: self
            fetchDepth: 1
          - task: UseNode@1
            displayName: Use Node 22
            inputs:
              version: 22.23.1
          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(HOME)/.npm
          - script: ./scripts/ci/deploy-docs.sh "$(Build.SourceBranchName)"
            displayName: Build and deploy the docs
            env:
              CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
