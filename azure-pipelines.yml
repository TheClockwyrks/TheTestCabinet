# Azure DevOps CI pipeline for The Test Cabinet — the primary CI system.
#
# Validates every component the project ships: the Rust crates (the `tcab` CLI,
# the `tcab-backend` server, the `tcab-dispatcher`/`tcab-driver`/`tcab-artifacts`
# services, and the libraries they share), the TypeScript front ends (the
# gallery, the operator web console, and these docs). Every job delegates to a
# shared script under scripts/ci/, so the GitHub workflows run exactly the same
# checks (see scripts/ci/README.md).
#
# Azure is the primary CI and covers Linux and Windows; macOS validation lives in
# GitHub because Azure has no macOS agents. The `binary` job release-builds and
# smoke-tests the shipped `tcab` binary on Linux and Windows so a release can
# never publish a binary that is flat-out broken; macOS gets the same check on
# GitHub, on demand (its `binary-macos.yml` workflow), since those runners are
# costly and only needed at release time.
#
# The YAML's only responsibilities are provisioning toolchains (Rust ships with
# the Microsoft-hosted Ubuntu and Windows images; Node is installed via UseNode),
# reclaiming disk on the near-full hosted Ubuntu agents before the cargo jobs
# (scripts/ci/free-disk-linux.sh), and caching. One toolchain set is provisioned by
# a script rather than by a task because it is pinned by this repository: the eleven
# gg program-language toolchains, which scripts/ci/install-gg-toolchains.sh installs
# for every job that compiles test-cabinet-gg — gg's build script reflects a
# signature catalogue out of each language's SDK and its artifact crates COMPILE each
# language's guest, so the toolchains are as much a build dependency as rustc is. A
# second, separate list (scripts/ci/install-gg-build-toolchains.sh) carries the one
# thing only the C# link needs and no gg run does. See the `rust` job.

trigger:
  branches:
    include:
      - master
      - staging

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-24.04

variables:
  # Stable, colorized logs; disable incremental artifacts that only bloat the
  # cache on single-shot CI builds.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info is by far the largest thing the dev/test build writes: measured on
  # this workspace it is ~84% of a test executable, and the workspace's ~290 test
  # binaries dominate `target/`. CI never attaches a debugger — it only needs
  # readable panic backtraces — so emit line tables alone. That keeps file:line in
  # backtraces while dropping the type/variable DWARF (`.debug_info`/`.debug_str`),
  # cutting test executables ~69% and the whole `target/` from ~36 GB to ~14 GB.
  # Without this the tree plus the tar the cache save writes beside it no longer
  # fits on the hosted agent, which is what broke the "Cache cargo target" save.
  # `test` inherits `dev`, but set both so the intent survives a profile change.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  - job: rust
    displayName: "Rust: lint, build & test (CLI, backend, dispatcher/driver/artifacts, core)"
    steps:
      - checkout: self
        fetchDepth: 1
      # The hosted Ubuntu image ships ~95% full; free unused SDKs so the cargo
      # target/ build and its cache save do not run the OS disk out of room.
      - script: ./scripts/ci/free-disk-linux.sh
        displayName: Reclaim agent disk
      - task: Cache@2
        displayName: Cache cargo home
        inputs:
          key: 'cargo-home | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-home | "$(Agent.OS)"
          path: $(HOME)/.cargo
      - task: Cache@2
        displayName: Cache cargo target
        inputs:
          # The debug level is part of the key: artifacts built at a different
          # `debug` setting have a different fingerprint, so cargo rebuilds them
          # but never evicts the originals — restoring a full-debug cache into a
          # line-tables build would leave both in `target/` and put the disk
          # straight back over the edge. Keying on it namespaces each setting to
          # its own cache instead.
          key: 'cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
          restoreKeys: |
            cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
          path: target
      # Node, in the Rust job, because compiling test-cabinet-gg needs it — see the
      # toolchain step below. The npm cache is the same one the `web` job uses.
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(HOME)/.npm
      # Installs the channel + components pinned by rust-toolchain.toml on first
      # cargo use; print what resolved for easier debugging.
      - script: rustup show
        displayName: Show Rust toolchain
      # EVERY gg PROGRAM-LANGUAGE TOOLCHAIN, AND IT HAS TO BE BEFORE THE LINT.
      #
      # gg tells a model what each of its eleven program languages offers by embedding a
      # signature catalogue reflected out of that language's own SDK by that language's
      # own documentation tool. Those catalogues are no longer committed: crates/gg's
      # build script generates all eleven on every build, so a gg binary cannot describe
      # a surface the guest in its own checkout does not export. A machine that compiles
      # test-cabinet-gg is therefore a machine that has `tsc`, griffe, YARD, `purs`, a
      # JDK, the Kotlin compiler, the wasm32 std, Swift, wasi-sdk and .NET.
      #
      # This job compiles it TWICE, and the first time is the lint: rust-lint.sh runs
      # clippy and rustdoc over `--workspace`, which
      # includes test-cabinet-gg, and both fully compile it (build scripts run under
      # clippy like any other build). rust-test.sh installs the same toolchains itself,
      # idempotently, but it runs after — so without this step the job would die in its
      # first minute, before a single lint had been reported.
      #
      # `npm ci` is part of the same prerequisite rather than a separate concern: the
      # pinned `typescript` that reflects the TypeScript and JavaScript arms is a
      # workspace devDependency, and the reflector says so by name if node_modules is
      # absent.
      #
      # THE SECOND LIST, AND WHY IT IS HERE RATHER THAN ONLY IN rust-test.sh. gg's eleven
      # arms' ARTIFACTS — the guest components, the SDK jars, the library archives — are
      # generated by the build now instead of being committed, so `cargo build -p
      # test-cabinet-gg` re-links the C# guest, and THAT needs a whole .NET SDK and an
      # unpruned wasi-sdk, which the eleven-arm run list deliberately does not install (a
      # gg RUN needs neither; see install-gg-build-toolchains.sh's header). Clippy runs
      # build scripts like any other build, so the lint below is where that first bites.
      # Leaving it out does not fail the job — packages/gg-sandbox-csharp/build.sh falls
      # back to fetching the same ~1.4 GB into its own .build/ — so this is not about
      # bytes but about WHERE they land: the fallback re-fetches per checkout, is not
      # idempotent across jobs, and reports its failures from inside a cargo build script
      # rather than from a step named after what it was doing.
      #
      # DISK. The two lists install ~3.3 GB under $HOME (835 MB of it Swift, after its
      # installer prunes a 3.3 GB toolchain, and ~1.4 GB the C# link), on an agent whose
      # image ships ~95% full — which is
      # why the reclaim step above stays first and stays load-bearing. It leaves ~40 GB,
      # so the toolchains are affordable; what would not be is caching them. Neither
      # Cache@2 path covers $HOME/.local, deliberately: a 1.9 GB cache entry has to be
      # tarred into a file beside itself on the same disk, which is exactly the failure
      # ("Wrote only N of M bytes") that free-disk-linux.sh and the line-tables debug cap
      # exist to prevent. Re-downloading them each run is the cheaper half of that trade.
      #
      # AND THAT SAME MEASUREMENT IS WHY THIS JOB DOES NOT HYDRATE FROM AN IMAGE. GitHub's
      # ci.yml now seeds these toolchains from a published image before running the same
      # installer (scripts/ci/hydrate-gg-toolchains.sh + containers/gg-ci/Dockerfile),
      # which trades five upstream CDNs for one registry pull. Azure is deliberately left
      # on the download path, for reasons that are all about THIS agent rather than about
      # the idea: pulling a ~2 GB image has the identical disk problem the paragraph above
      # measured, only sooner; free-disk-linux.sh reclaims space on the agent HOST, so
      # moving the work into a container job would step around the one thing keeping this
      # job green; and this is the pipeline that runs rust-lint.sh BEFORE rust-test.sh and
      # therefore needs the toolchains earlier than either script installs them, which is
      # why this step exists at all. Overturning that needs a measurement on a real agent
      # that nobody has taken — not an argument.
      - script: |
          set -euo pipefail
          ./scripts/ci/install-gg-toolchains.sh
          ./scripts/ci/install-gg-build-toolchains.sh
          npm ci
          # Later steps are separate processes, so the installers' bin directory has to
          # be prepended for the job rather than exported for this script: `purs` and
          # `uv` are resolved from PATH.
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install gg's program-language toolchains
      - script: ./scripts/ci/rust-lint.sh
        displayName: Lint (rustfmt + clippy)
      - script: ./scripts/ci/install-nextest.sh
        displayName: Install cargo-nextest
      - script: ./scripts/ci/rust-test.sh
        displayName: Build & test

  - job: binary
    displayName: "Binary: release build & smoke"
    # The shipped binary is release-mode, so it is validated on every target
    # platform Azure can run. macOS is validated on GitHub (no macOS agents
    # here). Each leg release-builds `tcab`, runs the suite in release mode, and
    # smoke-runs the produced binary; see scripts/ci/binary-smoke.sh.
    strategy:
      matrix:
        linux:
          imageName: ubuntu-24.04
        windows:
          imageName: windows-2022
    pool:
      vmImage: $(imageName)
    variables:
      # Pin a per-agent CARGO_HOME so the cache path is identical on Linux and
      # Windows (the predefined $(HOME) is not set on Windows agents).
      CARGO_HOME: $(Pipeline.Workspace)/.cargo
    steps:
      - checkout: self
        fetchDepth: 1
      # Linux only: reclaim the near-full hosted Ubuntu disk before the release
      # target/ build and cache. The Windows agent's disk is not affected and the
      # paths are Ubuntu-image specific, so it skips this.
      - bash: ./scripts/ci/free-disk-linux.sh
        displayName: Reclaim agent disk
        condition: eq(variables['Agent.OS'], 'Linux')
      - task: Cache@2
        displayName: Cache cargo home
        inputs:
          key: 'cargo-home-release | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-home-release | "$(Agent.OS)"
          path: $(CARGO_HOME)
      - task: Cache@2
        displayName: Cache cargo target
        inputs:
          key: 'cargo-target-release | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-target-release | "$(Agent.OS)"
          path: target
      - script: rustup show
        displayName: Show Rust toolchain
      # `bash` runs Git Bash on the Windows agent, so the one script drives every
      # platform identically — including the cross-platform nextest install.
      - bash: ./scripts/ci/install-nextest.sh
        displayName: Install cargo-nextest
      - bash: ./scripts/ci/binary-smoke.sh
        displayName: Release build & smoke

  - job: web
    displayName: "Front ends: type-check & build (gallery, web console, docs)"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(HOME)/.npm
      - script: ./scripts/ci/web-build.sh
        displayName: Build website

  # The front-end unit suites. Its own job rather than steps on `web`, so a failing
  # assertion reports as a failing test rather than as a failing build, and so it
  # runs in parallel with it: the tests need only the small workspace runtime
  # packages, not the app bundles.
  - job: webtest
    displayName: "Front ends: unit tests (vitest)"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(HOME)/.npm
      - script: ./scripts/ci/web-test.sh
        displayName: Test front ends

  - job: specs
    displayName: "Specs: markdown & spelling"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - script: ./scripts/ci/specs-lint.sh
        displayName: Lint specs

  # Formatting over the whole checkout. Needs Node for the pinned `prettier`; no
  # Rust and no credentials.
  - job: format
    displayName: "Format: prettier over the whole checkout"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - script: ./scripts/ci/format-check.sh
        displayName: Check formatting

  # The only thing that ever compiles a case's validators. They are never built,
  # never bundled and never seeded — they are staged into a produced tree and run
  # by vitest, which transpiles without checking types — so nothing else in this
  # repository would notice a validator that does not compile until it failed
  # every point it decides, on every run of its case. Needs Node (the pinned
  # `typescript`, and the packages the validators import) but no Rust and no
  # credentials.
  - job: validators
    displayName: "Validators: type-check every case's validator projects"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - script: ./scripts/ci/validators-typecheck.sh
        displayName: Type-check validators

  # Needs no toolchain and no history: the check reads the checked-out index, so
  # a shallow clone is enough.
  - job: frozen
    displayName: "Frozen: test-case versions with recorded runs are unchanged"
    steps:
      - checkout: self
        fetchDepth: 1
      - script: ./scripts/ci/frozen-check.sh
        displayName: Verify frozen directories

  # The only gate on the rule that every non-frozen full-stack version and every
  # game jam declares `[audio] packs`, and the only place a declared ref is resolved
  # against containers/sample-packs/ for name, version, kind and published clips —
  # manifest resolution cannot do that, because it also runs at backend ingest,
  # where that directory is absent. Needs Node (the lint parses TOML through the
  # workspace's smol-toml) but no Rust and no credentials.
  - job: audiopacks
    displayName: "Audio: every version declares packs that resolve"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - script: ./scripts/ci/audio-packs-lint.sh
        displayName: Check audio pack declarations

  # The spec counterpart of seeded-contract-check.sh (which runs in `contract`,
  # after the generator): every non-frozen version's prompt.hbs and specs/, and
  # the shared preambles prompt.rs prepends, name nothing about evaluation or this
  # project. Hits in frozen versions are reported, not failed — they cannot be
  # edited. Needs Node for the checker but no `npm ci`, no Rust and no history.
  - job: specvocabulary
    displayName: "Specs: seeded specs and prompts name nothing about evaluation"
    steps:
      - checkout: self
        fetchDepth: 1
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - script: ./scripts/ci/spec-vocabulary-check.sh
        displayName: Check seeded spec vocabulary

  # Also needs no toolchain and no history — it reads Dockerfiles against
  # .dockerignore. It runs here rather than with the image builds because those live
  # on a GitHub workflow that only fires on master/staging: a COPY that cannot see
  # its source would otherwise land, and be found by whoever next needs a run
  # container rather than by the change that broke it.
  - job: buildcontext
    displayName: "Containers: every Dockerfile COPY can see its source"
    steps:
      - checkout: self
        fetchDepth: 1
      - script: ./scripts/ci/build-context.sh
        displayName: Verify build contexts

  - job: contract
    displayName: "Contract: regenerate & check for drift"
    # Regenerates the TS bindings + JSON Schemas from the Rust source and fails on
    # any diff, so the contract's three representations can never drift apart.
    # Needs both Rust (the generator) and Node (Prettier), so it runs on its own.
    steps:
      - checkout: self
        fetchDepth: 1
      # Frees unused SDKs before the codegen build populates cargo target/; the
      # Node toolcache is left intact for UseNode below.
      - script: ./scripts/ci/free-disk-linux.sh
        displayName: Reclaim agent disk
      - task: UseNode@1
        displayName: Use Node 22
        inputs:
          version: 22.23.1
      - task: Cache@2
        displayName: Cache cargo home
        inputs:
          key: 'cargo-home | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-home | "$(Agent.OS)"
          path: $(HOME)/.cargo
      - task: Cache@2
        displayName: Cache cargo target
        inputs:
          # The debug level is part of the key: artifacts built at a different
          # `debug` setting have a different fingerprint, so cargo rebuilds them
          # but never evicts the originals — restoring a full-debug cache into a
          # line-tables build would leave both in `target/` and put the disk
          # straight back over the edge. Keying on it namespaces each setting to
          # its own cache instead.
          key: 'cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)" | Cargo.lock'
          restoreKeys: |
            cargo-target | "$(Agent.OS)" | "$(CARGO_PROFILE_DEV_DEBUG)"
          path: target
      - script: rustup show
        displayName: Show Rust toolchain
      - script: ./scripts/ci/contract-drift.sh
        displayName: Regenerate & check for drift
      - script: ./scripts/ci/seeded-contract-check.sh
        displayName: Seeded contract names nothing about evaluation
