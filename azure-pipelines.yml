# The pipeline: every gate a commit has to pass and, for a commit on the
# staging branch, the publish and the deploy that follow.
#
# The gates run inside purpose-built CI images, one per track, pulled from
# testcabinet.azurecr.io through the `the-test-cabinet-acr` service connection.
# This pipeline builds none of them: it names an image and the agent pulls it
# before the job starts. Each image is tagged with the commit whose run of
# azure-pipelines-ci-images.yml built it, so the reference written below is a
# reviewable statement of which images this commit ran in, which a floating tag
# could never be. That pipeline is what builds and pushes them, and
# ci/images/README.md says what is in each and why.
#
# The commit is not written in this file. It lives in ci/images/tags.yml, a
# variables template this pipeline includes, as its one variable,
# `ciImageTag`. The template renders it carrying forty zeros rather than a
# commit any image was built from, and the commit a workspace writes over them
# is the workspace's own edit of it, which a template update carries through
# its merge, so this file stays exactly what the template renders. Each job
# names its image with a compile-time expression reading `ciImageTag` out of
# that file, so the tag is written into the job before Azure pulls anything.
#
# The loop, when a commit changes a file an image is built from: push it, and
# the image pipeline's run on it pushes each track's image under that commit;
# once that run has finished, write the commit into ci/images/tags.yml as
# `ciImageTag` and push that, and the second commit's gates run in the new
# images. Until the pin follows, the gates run in the images it names, so a
# change to an image's files is complete when the pin follows it. Before this
# pipeline's first run the same holds: queue the image pipeline, then pin the
# commit it ran on.
#
# The tool versions are the ones .devcontainer/docker-compose.yml pins: the CI
# images read that same file for them, which is what keeps a gate passing here
# exactly when it passes for a developer.
#
# Two tracks, not one. The Rust toolchain and the web toolchain wait on each
# other for nothing — neither reads what the other writes — so the checks are
# split between a job per toolchain and the two run at once.
#
# One check, one step. A step is the unit Azure times and reports, so a step
# that ran several checks would say only what they cost together, and the one
# getting slower could not be picked out of it. Every check therefore gets a
# step of its own, named after the check, and no step is ever given a second
# one. A check has a step in exactly one of the two tracks, which is what stops
# one being dropped or run twice; ci/tests/test_wiring.py fails when one has a
# step in neither or in both.
#
# A gate's step runs it the way `make gate` and a commit hook run it, through
# the runner of the `ci` project (see ci/README.md). The hook framework's own
# upstream checks have no gate script, so those run as `pre-commit run <id>`,
# one step each, on the web track.
#
# The publish and the deploy stages follow the gates in the same run, and run
# for the staging branch alone: one pipeline, with stages
# conditioned on the branch, rather than a second pipeline started by the
# first. One file is one `az pipelines create`, and a stage that follows the
# gates builds the commit the gates passed by construction, with no resource
# trigger naming a pipeline by a name the project has to keep in step. The
# publish stage builds and pushes the image, and the deploy stage
# rolls the staging overlay onto it; a commit on any other
# branch runs the gates and nothing more.
#
# The variables below are the deployment's own, named from the project's slug
# by the fleet's convention, so nothing in them is filled in by hand. A project
# whose Azure names differ edits them here, and a template update carries the
# edit. The deployment documentation under
# apps/docs/src/content/docs/deployment/ says what each one names.
#
# What the project runs beyond the template's work is not written here but in
# the files under .azure/project/, which this pipeline includes and which
# belong to the project: its setup and its steps in each gate job, its jobs in
# the gates stage, its steps before and after the deploy script, and its
# stages after this file's. The template renders nothing under .azure/project/,
# so what the project adds to its pipeline lives there, and this file keeps to
# the template's shape plus the includes and the names above.
#
# Pull requests are not triggered from this file. Azure Repos ignores a `pr:`
# block, and runs a pipeline on a pull request only through a build validation
# policy on the target branch.

trigger:
  # One run for the pushes that arrive while a run is in flight, so a burst of
  # commits to a branch costs one pass over the gates.
  batch: true
  branches:
    include:
      - master
      - staging
      - nightly

# The images the gate tracks run inside are named on each job, below, rather
# than as container resources, because a job's `container:` accepts the
# compile-time expression that reads the pinned commit out of ci/images/tags.yml.
# `the-test-cabinet-acr` is a Docker Registry service connection to
# testcabinet.azurecr.io holding push rights on it; push implies pull, so the one
# connection serves this pipeline's pull and the image pipeline's push and
# there is no second connection to keep in step. The pipeline is permitted to
# use it the first time a run asks. Nothing here logs in: the agent pulls with
# the connection's credentials before a job's first step runs, which is why
# these jobs need no docker CLI and the images carry none.
#
# Each tag is the full forty-character id of the commit whose image pipeline
# run pushed the image. A run pushes under its own commit alone and `latest` is
# never used, so a reference names one image for as long as the registry keeps
# it. The forty zeros are the placeholder a render carries; see the header.

pool:
  vmImage: ubuntu-24.04

# A list rather than a mapping, because a variables template is included only
# from a list.
variables:
  # `ciImageTag`, the commit every CI image this pipeline pulls was built
  # from, which the workspace writes over the placeholder the template renders.
  # See the header.
  - template: ci/images/tags.yml
  # The directory on the agent's disk the Rust track keeps cargo's registry
  # and git checkouts in, which is what its cache saves. The target directory
  # is deliberately not under here: the test gate writes its JUnit report
  # beneath the checkout's own `target/`, and moving CARGO_TARGET_DIR would
  # leave the report where nothing publishes it.
  - name: ciCache
    value: $(Pipeline.Workspace)/ci-cache
  # The registry the staging overlay pulls from, which the
  # publish stage pushes to under the same name. Its first label is the registry's name,
  # which is what `az acr login` takes.
  - name: registry
    value: testcabinet.azurecr.io
  # The resource group the cluster the deploy stage rolls sits in, and the
  # cluster's name.
  - name: resourceGroup
    value: testcabinet-staging-westus2-rg
  - name: cluster
    value: testcabinet-staging-westus2-aks
  # The service connection the publish and deploy stages sign in through: a
  # workload identity federation connection to an identity that may push to
  # the registry and run commands on the cluster, and nothing else.
  - name: serviceConnection
    value: tcab-deploy
  # The environment the deploy stage records each run against, which is where
  # the history of what the cluster ran is read. A project creates it, with a
  # branch control check on it; Azure DevOps creates one a pipeline names and
  # it did not, but creates it with no check.
  - name: deployEnvironment
    value: tcab-staging

stages:
  - stage: gates
    displayName: Gates
    jobs:
      # The Rust track: every check that compiles the workspace, and nothing
      # else. The image carries no Node, so nothing here may reach for one.
      - job: rust
        displayName: Rust
        # Every step of this job runs inside the Rust CI image, at the commit
        # ci/images/tags.yml pins, which is what `container:` means: Azure
        # pulls it with the `the-test-cabinet-acr` credentials before the
        # first step, mounts the work directory into it, and runs each step
        # there. Nothing in the job starts or stops a
        # container of its own. A step that has to run on the agent instead
        # says so with `target: host`, and the disk cleanup below is the one
        # that does.
        container:
          image: testcabinet.azurecr.io/ubuntu-the-test-cabinet-rust-cicd:${{ variables.ciImageTag }}
          endpoint: the-test-cabinet-acr
        # The most a Microsoft-hosted agent gives a private project.
        timeoutInMinutes: 60
        variables:
          # The registry and the git checkouts, under the directory the cache
          # task saves, which is the whole reason CARGO_HOME moves at all.
          #
          # The toolchain is deliberately NOT under here. It lives at
          # RUSTUP_HOME and CARGO_HOME inside the image, under /usr/local, and
          # /usr/local/cargo/bin is on the image's PATH — so repointing
          # CARGO_HOME leaves cargo, rustup and cargo-nextest exactly where
          # they are, and `cargo nextest` still resolves, because cargo looks
          # for a `cargo-<name>` subcommand on PATH. That is a contract with
          # ci/images/rust.Dockerfile, stated there too.
          CARGO_HOME: $(ciCache)/cargo-home
          # Full debug information and incremental state are most of a target
          # directory and no gate reads either. Line tables are kept, so a
          # failed test's backtrace still names its lines.
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true

          # On the agent, not in the container, which is what `target: host`
          # says. The SDKs it removes are the hosted image's own and are in no
          # CI image, so run inside the container the step would free nothing
          # and fail on a `sudo` these images deliberately do not carry.
          - script: scripts/ci/free-disk.sh
            displayName: Free disk space on the agent
            target: host

          # Two caches rather than one, because they are saved under different
          # keys and restored at different rates: the registry changes only
          # with the lockfile, while the build output changes with every
          # commit. Each restore key is a shorter prefix of the one above it,
          # so a miss restores the nearest earlier entry and warms the compile
          # rather than starting from nothing.
          - task: Cache@2
            displayName: Restore the cargo registry
            inputs:
              key: 'cargo-home | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
              restoreKeys: |
                cargo-home | v1 | "$(Agent.OS)" | rust-toolchain.toml
              path: $(ciCache)

          - task: Cache@2
            displayName: Restore the build output
            inputs:
              key: 'cargo-target | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
              restoreKeys: |
                cargo-target | v1 | "$(Agent.OS)" | rust-toolchain.toml
              path: target

          # The build output cache restores `target/` whole, the reports the
          # last run's gates left under it among it. A gate that failed before
          # writing its report would otherwise leave that run's report where
          # this run's is read, so both report directories start empty.
          - script: rm -rf target/gate-artifacts target/test-results
            displayName: Clear the reports the cache restored

          # The project's own setup for this job, before its first check.
          - template: .azure/project/setup-steps.yml
            parameters:
              job: rust

          # Setup is done, and every check below carries this variable as its
          # condition instead of the implicit `succeeded()`. That is what makes
          # a run report all of its failures rather than stop at the first, the
          # way `make gate --keep-going` does for a developer. Setting a
          # variable here, rather than writing `succeededOrFailed()` on each
          # check, is what stops all of them running, and failing, when the
          # setup above did not finish. A variable a step sets belongs to the
          # job that set it, so each track sets its own.
          - script: echo "##vso[task.setvariable variable=checksReady]true"
            displayName: Ready to run the checks

          # One step per check, each run the way `make gate` runs it. A gate
          # added under ci/gates/ needs a step here or on the web track, and
          # ci/tests/test_wiring.py fails when it has none.
          - script: uv run --quiet --project ci gate run rust-fmt
            displayName: cargo fmt (--check)
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run rust-clippy
            displayName: cargo clippy (warnings denied)
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run rust-doc
            displayName: cargo doc (warnings denied)
            condition: eq(variables['checksReady'], 'true')

          # Naming an artifact directory is what has the test gate use
          # nextest's `ci` profile and leave its JUnit report there. The path
          # is relative to the checkout, which the gate finds for itself:
          # every gate enters the workspace root before it does anything else.
          - script: uv run --quiet --project ci gate run rust-test
            displayName: cargo nextest (workspace)
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/rust-test

          - task: PublishTestResults@2
            displayName: Publish the Rust test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              # Where the step above told its gate to leave the report.
              testResultsFiles: $(Build.SourcesDirectory)/target/gate-artifacts/rust-test/junit.xml
              testRunTitle: Rust tests
              failTaskOnMissingResultsFile: false

          # The doctests, which nextest cannot run, through the same runner.
          # Stable cargo writes no report for them, so there is none to publish.
          - script: uv run --quiet --project ci gate run rust-doctest
            displayName: cargo doctests
            condition: eq(variables['checksReady'], 'true')

          # This project's own gates on this track, one step each like every
          # gate above.
          - script: uv run --quiet --project ci gate run contract-drift
            displayName: "generated contract drift"
            condition: eq(variables['checksReady'], 'true')

          # The project's own steps for this job, after its last check and
          # before the job's test results, which every job running a test gate
          # ends with.
          - template: .azure/project/steps.yml
            parameters:
              job: rust

          # The job's test results, as the artifact a run's results are read
          # from: every JUnit report a gate above left, in a folder named by
          # the gate, and nothing else, so the screenshots and the coverage
          # stay in the artifacts that already carry them. Both steps run
          # whether the tests passed or failed, since a failing run is the one
          # whose results matter most. The script sets `testResultsCollected`
          # once it copied a report, and a job that wrote none publishes
          # nothing. The name carries the job attempt, so a rerun publishes
          # beside its first attempt rather than colliding with it.
          - script: scripts/ci/collect-test-results.sh
            displayName: Collect the test results
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'))

          - publish: $(Build.SourcesDirectory)/target/test-results
            displayName: Publish the test results
            artifact: test-results-rust-$(System.JobAttempt)
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'), eq(variables['testResultsCollected'], 'true'))

      # The web track: the interface's checks, the documentation site's, and
      # every check neither toolchain owns. The last group is the whole of the
      # lint, format and prose checking and costs about a minute, so it rides
      # the shorter track rather than paying a third job's setup for a track of
      # its own.
      - job: web
        displayName: Web
        # As on the Rust track above, with the web image instead.
        container:
          image: testcabinet.azurecr.io/ubuntu-the-test-cabinet-web-cicd:${{ variables.ciImageTag }}
          endpoint: the-test-cabinet-acr
        timeoutInMinutes: 60
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true

          - script: scripts/ci/free-disk.sh
            displayName: Free disk space on the agent
            target: host

          # The web track's checks *are* the npm workspace — eslint, tsc,
          # vitest, prettier, markdownlint, cspell and astro all run out of
          # node_modules — so it installs it. The script refuses a Node other
          # than the one .devcontainer/docker-compose.yml pins, which is the
          # same pin the image was built from.
          - script: scripts/ci/npm-install.sh
            displayName: Install the npm workspace

          # pre-commit builds a hook's environment the first time it runs that
          # hook. Doing them all here keeps that cost out of whichever check
          # would otherwise have paid it, so each check's step reports the time
          # its own check took and nothing else.
          - script: pre-commit install-hooks
            displayName: Install the hook environments

          # The project's own setup for this job, before its first check.
          - template: .azure/project/setup-steps.yml
            parameters:
              job: web

          - script: echo "##vso[task.setvariable variable=checksReady]true"
            displayName: Ready to run the checks

          # The hook framework's own checks, from the pinned upstream
          # repositories at the top of .pre-commit-config.yaml. They have no
          # gate script, so each runs as the hook it is, over every file.
          - script: pre-commit run check-added-large-files --all-files --show-diff-on-failure
            displayName: Check for added large files
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-case-conflict --all-files --show-diff-on-failure
            displayName: Check for case conflicts
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-executables-have-shebangs --all-files --show-diff-on-failure
            displayName: Check that executables have shebangs
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-illegal-windows-names --all-files --show-diff-on-failure
            displayName: Check for illegal Windows names
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-json --all-files --show-diff-on-failure
            displayName: Check JSON
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-merge-conflict --all-files --show-diff-on-failure
            displayName: Check for merge conflicts
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run end-of-file-fixer --all-files --show-diff-on-failure
            displayName: Newline at end of file
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-shebang-scripts-are-executable --all-files --show-diff-on-failure
            displayName: Check that shebang scripts are executable
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-symlinks --all-files --show-diff-on-failure
            displayName: Check for broken symlinks
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-toml --all-files --show-diff-on-failure
            displayName: Check TOML
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-vcs-permalinks --all-files --show-diff-on-failure
            displayName: Check VCS permalinks
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-xml --all-files --show-diff-on-failure
            displayName: Check XML
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-yaml --all-files --show-diff-on-failure
            displayName: Check YAML
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run shellcheck --all-files --show-diff-on-failure
            displayName: shellcheck
            condition: eq(variables['checksReady'], 'true')

          # This workspace's own gates, one step each, in
          # .pre-commit-config.yaml's order.
          - script: uv run --quiet --project ci gate run no-nul-bytes
            displayName: NUL bytes in text files
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run devcontainer-declaration
            displayName: devcontainer declaration
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run shell-tests
            displayName: shell tests
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run web-lint
            displayName: web lint (eslint)
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run web-typecheck
            displayName: web typecheck (tsc -b)
            condition: eq(variables['checksReady'], 'true')

          # As the Rust job's test step does, the web tests name an artifact
          # directory, which has the gate leave vitest's JUnit report there.
          - script: uv run --quiet --project ci gate run web-test
            displayName: web tests (vitest)
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/web-test

          - task: PublishTestResults@2
            displayName: Publish the web test results
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'))
            inputs:
              testResultsFormat: JUnit
              # Where the web tests step told its gate to leave the report.
              testResultsFiles: $(Build.SourcesDirectory)/target/gate-artifacts/web-test/junit.xml
              testRunTitle: Web tests
              failTaskOnMissingResultsFile: false

          # As the Rust job's test step does, the browser tests name an
          # artifact directory, which has the gate leave its JUnit report there
          # and has the suite give each browser instance a directory of its own
          # beneath it for what a test attached: among it the screenshot an
          # engine takes of a test that failed, which is otherwise lost with
          # the rest of the working directory.
          - script: uv run --quiet --project ci gate run web-browser-test
            displayName: web browser tests (vitest, playwright)
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/web-browser-test

          # Both whether the suite passed or failed, since a failure is when
          # they are read. The artifact's name carries the job attempt, so a
          # rerun of the job publishes beside its first attempt rather than
          # colliding with it.
          - publish: $(Build.SourcesDirectory)/target/gate-artifacts/web-browser-test
            displayName: Publish the web browser tests' report and screenshots
            artifact: web-browser-test-$(System.JobAttempt)
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'))

          - task: PublishTestResults@2
            displayName: Publish the web browser test results
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'))
            inputs:
              testResultsFormat: JUnit
              # Where the browser tests step told its gate to leave the report.
              testResultsFiles: $(Build.SourcesDirectory)/target/gate-artifacts/web-browser-test/junit.xml
              testRunTitle: Web browser tests
              failTaskOnMissingResultsFile: false

          - script: uv run --quiet --project ci gate run web-build
            displayName: web build (vite build)
            condition: eq(variables['checksReady'], 'true')

          # Rendered only for a project that deploys to Kubernetes, because
          # the gate it runs is rendered only then. A step for a gate that is
          # not there would fail every run of this track.
          - script: uv run --quiet --project ci gate run k8s-manifests
            displayName: kubernetes manifests
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run markdownlint
            displayName: markdownlint
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run cspell
            displayName: cspell
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run format
            displayName: prettier (--check)
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run docs-typecheck
            displayName: docs typecheck (astro check)
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run docs-build
            displayName: docs build (astro build)
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run python-lint
            displayName: ruff (check, format)
            condition: eq(variables['checksReady'], 'true')

          # The runner's own tests, which pytest reports as JUnit in the
          # artifact directory the step names, as every test gate's does.
          - script: uv run --quiet --project ci gate run ci-tests
            displayName: ci tests (pytest)
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/ci-tests

          - task: PublishTestResults@2
            displayName: Publish the CI test results
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'))
            inputs:
              testResultsFormat: JUnit
              # Where the ci tests step told its gate to leave the report.
              testResultsFiles: $(Build.SourcesDirectory)/target/gate-artifacts/ci-tests/junit.xml
              testRunTitle: CI tests
              failTaskOnMissingResultsFile: false

          # This project's own gates on this track, one step each like every
          # gate above.
          - script: uv run --quiet --project ci gate run frozen-paths
            displayName: "frozen test-case versions"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run seeded-contract
            displayName: "seeded contract vocabulary"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run spec-vocabulary
            displayName: "seeded spec vocabulary"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run spec-prose
            displayName: "spec prose (markdownlint, cspell)"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run audio-packs
            displayName: "audio pack declarations"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run build-context
            displayName: "Dockerfile build contexts"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run k8s-deploy-sets
            displayName: "kubernetes deploy sets"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run ci-image-pins
            displayName: "project jobs pin the Rust CI image"
            condition: eq(variables['checksReady'], 'true')

          # As the web tests do, the two test gates below name an artifact
          # directory, which has each leave its JUnit report there for the
          # collection at the end of the job.
          - script: uv run --quiet --project ci gate run scripts-test
            displayName: "script library tests (node --test)"
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/scripts-test

          - script: uv run --quiet --project ci gate run workspace-test
            displayName: "npm workspace tests (vitest)"
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/workspace-test

          - script: uv run --quiet --project ci gate run validators-typecheck
            displayName: "validator projects typecheck (tsc)"
            condition: eq(variables['checksReady'], 'true')

          - script: uv run --quiet --project ci gate run site-build
            displayName: "gallery build (vite build)"
            condition: eq(variables['checksReady'], 'true')

          # The project's own steps for this job, after its last check and
          # before the job's test results.
          - template: .azure/project/steps.yml
            parameters:
              job: web

          # As at the end of the Rust job, the job's test results as the
          # artifact a run's results are read from, pass or fail.
          - script: scripts/ci/collect-test-results.sh
            displayName: Collect the test results
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'))

          - publish: $(Build.SourcesDirectory)/target/test-results
            displayName: Publish the test results
            artifact: test-results-web-$(System.JobAttempt)
            condition: and(succeededOrFailed(), eq(variables['checksReady'], 'true'), eq(variables['testResultsCollected'], 'true'))

      # The project's own jobs in the gates stage.
      - template: .azure/project/jobs.yml

  # The one image, the server's with the web app's bundle inside it, built
  # and pushed under the commit's tag and `latest`. The staging branch
  # alone, and only once the gates passed. The condition is
  # this file's own, and every branch the trigger names may edit it; what holds
  # a branch out is the branch control check on the service connection and on
  # the environment, both set in the project's settings.
  - stage: publish
    displayName: Publish
    dependsOn: gates
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))
    jobs:
      - job: server
        displayName: the-test-cabinet-backend
        timeoutInMinutes: 60
        steps:
          - template: .azure/publish-image.yml
            parameters:
              image: the-test-cabinet-backend
              dockerfile: deployments/images/backend.Dockerfile
              serviceConnection: ${{ variables.serviceConnection }}

  # Once the image is in the registry. A deployment job records each run
  # against the environment, which is where the history of what the cluster
  # ran is read.
  - stage: deploy
    displayName: Deploy
    dependsOn: publish
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))
    jobs:
      - deployment: staging
        displayName: staging
        timeoutInMinutes: 30
        environment: ${{ variables.deployEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                # The project's own steps before the deploy script.
                - template: .azure/project/deploy-steps.yml
                  parameters:
                    phase: before
                    serviceConnection: ${{ variables.serviceConnection }}

                # The cluster is private, so the script reaches it through
                # `az aks command invoke` rather than through a kubeconfig,
                # signed in through the service connection.
                - task: AzureCLI@2
                  displayName: Apply the overlay and wait for the rollout
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: scripts/ci/deploy.sh "$(Build.SourceVersion)"
                  env:
                    THE_TEST_CABINET_REGISTRY: $(registry)
                    THE_TEST_CABINET_RESOURCE_GROUP: $(resourceGroup)
                    THE_TEST_CABINET_CLUSTER: $(cluster)

                # The project's own steps after the deploy script.
                - template: .azure/project/deploy-steps.yml
                  parameters:
                    phase: after
                    serviceConnection: ${{ variables.serviceConnection }}

  # The project's own stages, after this file's.
  - template: .azure/project/stages.yml
