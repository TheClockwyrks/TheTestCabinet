# The Test Cabinet model catalog entry.
#
# Site-facing metadata for a single model: how it is named, who provides it, how
# it maps onto OpenRouter for pricing, and which model IDs identify it in run
# records. This file has no bearing on how a run is executed; see
# `docs/test-cases.md` for the test case catalog it mirrors.

# Human-readable display name.
name = "Claude Sonnet 4.6"

# The provider that serves the model.
provider = "Anthropic"

# The slug OpenRouter lists the model under. Used to build the model's OpenRouter
# page link and to look up comparable per-token pricing.
openrouter_slug = "anthropic/claude-sonnet-4.6"

# Site-facing prose, relative to this catalog directory.
description = "claude-sonnet-4-6.md"

# The model ID strings as they appear in run records (`subject.modelId`), used
# to map a run back to this model. Claude Code reports the bare Anthropic id
# (version dashes, e.g. `claude-opus-4-8`); the OpenRouter slug (dotted, e.g.
# `anthropic/claude-opus-4.8`) is listed too for the price lookup.
model_ids = ["claude-sonnet-4-6", "anthropic/claude-sonnet-4.6"]
