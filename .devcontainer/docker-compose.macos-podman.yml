# Host override for Podman on macOS (`podman machine`). Copy this to
# docker-compose.local.yml (see README.md), paired with `.env.macos-podman`.
# THE MACHINE MUST BE ROOTFUL — `setup-host.sh` checks, and README.md says why.
#
# Everything that differs from the Docker row (docker-compose.macos-docker.yml)
# follows from one rule: A BIND MOUNT'S SOURCE IS A PATH ON YOUR MAC. It is not a
# path in the VM. `podman machine` shares your home directory in, so a source
# under $HOME resolves; anything else is checked and refused on the Mac side,
# ending the whole `up` before a container exists —
# `Error: statfs <path>: no such file or directory`. (podman-compose applies the
# rule twice over: its own bind handling calls `os.path.exists` and then
# `os.makedirs` on the source, on the Mac, before podman ever sees it.)
#
# Two consequences: the checkout has to live under $HOME, and the host runtime
# socket — which lives in the VM, at /run/podman/podman.sock — cannot be reached
# by naming it. The volume at the bottom of this file is how it is reached
# instead.
x-podman:
  # podman-compose otherwise places the project's containers in a pod. The Dev
  # Containers extension drives the container it created directly (`podman
  # inspect`, `podman exec`), and a pod's shared infra container is one more
  # thing between it and them. Same reason the Linux Podman variant sets it.
  in_pod: false

services:
  dev:
    # NOTE WHAT IS NOT HERE: `userns_mode: keep-id`, which the Linux Podman row
    # uses to map the host user onto the image's. keep-id is rootless-only —
    # podman refuses it outright on a rootful machine — and a rootful machine is
    # what this row requires. The equivalent is done by NUMBER instead: the
    # workspace arrives over virtiofs owned by your Mac account's real UID/GID,
    # and DEVCONTAINER_UID/DEVCONTAINER_GID in .env build the image's user with
    # those same numbers. `setup-host.sh` reads them out of the machine rather
    # than guessing, because virtiofs passes macOS's numbering through unchanged
    # and a Mac's first account is 501:20, not 1000:1000.

    security_opt:
      # podman machine's VM is Fedora CoreOS with SELinux ENFORCING, which the
      # Linux Podman variant (a NixOS host) has no equivalent of. Nothing here
      # relabels its mounts with `:z`/`:Z` — you cannot relabel virtiofs — so the
      # container is run unconfined instead. Without it the runtime socket below
      # is mounted and unreachable.
      - label=disable

    environment:
      # Where tools/docker-socket-access.sh finds the host runtime socket on this
      # row, so it can link /var/run/docker.sock at it. Everything downstream —
      # the `docker` client, `k3d`, deployments/local's Makefile — then works
      # unchanged, at the path they all already expect.
      - TCAB_HOST_RUNTIME_SOCKET=/run/host-podman/podman.sock

    volumes:
      # DOCKER-OUTSIDE-OF-DOCKER, THE ONLY WAY IT CAN BE DONE HERE. The other
      # three host rows bind the runtime socket straight in. This one cannot: by
      # the rule at the top of this file, /run/podman/podman.sock names a Mac path
      # that does not exist, and the Mac-side socket `podman machine inspect`
      # prints is a live endpoint rather than a file — sharing its inode over
      # virtiofs shares nothing the guest can connect to.
      #
      # A NAMED VOLUME IS RESOLVED ON THE OTHER SIDE. Compose does not hand the
      # runtime a path here; it asks it to create a volume, and the bind-backed
      # local driver below (`type: none` + `o: bind`) does its own bind INSIDE the
      # VM, where /run/podman is exactly what it looks like. Nothing is validated
      # against the Mac, because nothing about it is a Mac path.
      - host-podman-run:/run/host-podman

volumes:
  host-podman-run:
    driver: local
    driver_opts:
      type: none
      o: bind
      # The rootful machine's runtime directory, holding podman.sock. Overridable
      # from .env only because this file cannot be tested from the machine that
      # writes it; `podman machine ssh 'ls /run/podman'` is the check.
      device: ${PODMAN_SOCKET_DIR:-/run/podman}
