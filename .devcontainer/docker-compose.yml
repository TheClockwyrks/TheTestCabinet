# The container every workspace of this project is developed in.
#
# devcontainer.json names this file and the service below rather than the
# Dockerfile, because a compose file states what a container is run with for
# every service it comes to hold rather than for the one the JSON knew about: a
# project that grows a database, a queue or a second container beside the
# workspace declares it here and nothing about how the first one starts has to
# move first.
#
# The image is built on the images the template publishes, and the anchor below
# names them, rendered from the template's version, in place of the pins they
# hold: moving the template moves the workspace onto the images its version
# names. Beside them it pins what the Dockerfile's own steps read, in the
# Dockerfile's order, and the dev service's build arguments merge it whole. A
# version is decided in one place, so a script that asserts one reads it from
# here rather than carrying a copy of it. `build_arg` in scripts/ci/lib.sh reads
# one value out of the anchor for a script, and ci/images/build-args.sh reads
# out the set one CI image consumes and hands it to that image's build, so the
# images the gates run inside are built on the same toolchain image.
x-devcontainer-build-args: &devcontainer-build-args
  # The published images, each a full reference with its tag. The toolchain
  # image holds the system packages, the account `dev` at uid and gid 1000 and
  # every language and tool a workspace carries; each other holds one optional
  # toolchain's files alone, which the Dockerfile copies over it. See "What the
  # image carries" in README.md.
  TOOLCHAIN_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/toolchain:ad5bf224e0e39ab7
  # The browser engines the web app's tests run in. Its tag is the Playwright
  # version that downloaded them, and apps/web/package.json's `playwright`
  # decides which build the tests ask for, so the two move together;
  # ci/gates/web-browser-test.py reads this line and fails with both values
  # when they disagree.
  PLAYWRIGHT_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/playwright:1.63.0
  # The wasm-components language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  WASM_COMPONENTS_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/wasm-components:wasmtime-49.0.1_wit-bindgen-0.62.0_wasm-tools-1.259.0_wac-0.11.0_b6aa00c1
  # The wasi-sdk language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  WASI_SDK_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/wasi-sdk:34.0_1ba18c77
  # The python language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  PYTHON_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/python:3.14.6_componentize-py-0.25.1_8017a918
  # The jvm language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  JVM_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/jvm:jdk-21.0.12.1-1_kotlin-2.4.20_gradle-9.8.0_dokka-2.2.0_teavm-0.13.1_a2c210db
  # The dotnet language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  DOTNET_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/dotnet:10.0.401_componentize-0.8.0-preview00011_fsharp-core-10.1.401_docfx-2.81.0_fsharp-formatting-22.2.0_77e46f07
  # The ruby language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  RUBY_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/ruby:ruby-wasm-2.10.1_yard-0.9.45_binaryen-133_12ced05e
  # The swift language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  SWIFT_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/swift:6.4.0_wasm-sdk-6.4.0_35cffd1c
  # The purescript language image the Dockerfile copies over the toolchain image.
  # See "The language toolchains" in README.md.
  PURESCRIPT_IMAGE: nyxsisdev.azurecr.io/nyxsis-template-k8s-standard/purescript:0.15.16_spago-1.0.4_5e57dcfb
  # Whether system/cuda.sh installs the CUDA toolkit, which is several GB. Off
  # unless something in this checkout compiles CUDA sources; a host with an
  # NVIDIA GPU behind its runtime turns it on in `.env`. See "GPU access" in
  # README.md.
  INSTALL_CUDA: ${INSTALL_CUDA:-false}
  # No argument names the host user's ids or the group that owns the host's
  # runtime socket. The account is the published image's, and a host whose own
  # account has other ids is mapped onto it by the user namespace below. Which
  # group owns the socket differs per host and is known only once the socket
  # is bound in, and an argument the tool starting the container decides would
  # build one image per tool that starts it, so
  # tools/docker-socket-access.sh aligns the socket with the container user at
  # every start instead.
  # The two coding-agent CLIs (ai/codex.sh, ai/claude.sh). Both publish often
  # and both install from an endpoint that serves the current release by
  # default, so a pin here is what keeps a rebuild reproducible.
  CODEX_VERSION: 0.153.4
  CLAUDE_CODE_VERSION: 2.1.236
  # The project's own pins of two tools the toolchain image holds, for the jobs
  # that run outside every image built on it: no Dockerfile step reads either.
  # scripts/ci/provision-node.sh installs Node at NODE_VERSION on the hosted
  # agents the jobs that need one outside an image run on (gg's
  # scripts/ci/gg-ci-toolchains.sh pins the same version, and its
  # gg-image-toolchains.test.sh checks the two agree), and the
  # repository kit's install-nextest.sh, which the rendered repositories'
  # Windows jobs run, holds cargo-nextest at NEXTEST_VERSION
  # (scripts/repos/test_render.py checks the two agree). Each is the version
  # the TOOLCHAIN_IMAGE above holds, so a template update that moves that image
  # onto another Node or cargo-nextest moves the line here with it.
  NODE_VERSION: 24.16.0
  NEXTEST_VERSION: 0.9.140
  # gg's program-language toolchains, which the last of the Dockerfile's own steps
  # bakes into the image with languages/gg/install.sh, are pinned elsewhere on
  # purpose: each arm's gg/packages/gg-sandbox-*/<lang>-version.sh, in the gg
  # checkout, is the one pin gg's pipeline, the run images and this image all
  # install from, and the Rust arm's defers to gg's rust-toolchain.toml. Where an arm's toolchain is one of the
  # language images named above, that step links the image's tree rather than
  # downloading the arm, so the arm's pin is the version the image's tag names:
  # the step fails when the image lacks it, and
  # gg/scripts/ci/gg-image-toolchains.test.sh fails the shell-tests gate when a tag
  # here and a pin disagree. A template update that moves one of those images
  # therefore moves the arm's pin with it. The project's other steps read no
  # argument: helm is pinned in tools/helm.sh, and the system packages
  # system/packages.sh installs are Ubuntu's own.

# The pod podman-compose would put this project's services in, which it is told
# not to create. podman-compose from 1.1.0 on creates one for every project
# unless told otherwise, and Podman refuses a container created in a pod under a
# user namespace of its own, so the dev service's `keep-id` mapping on a
# rootless Podman host fails `up` with `--userns and --pod cannot be set
# together` before any container exists. The choice is stated here rather than
# in PODMAN_COMPOSE_IN_POD, because an editor's Reopen in Container sets no
# environment of its own. A compose provider that is not podman-compose ignores
# a top-level `x-` key, so Docker Compose starts the same containers either way.
x-podman:
  in_pod: false

services:
  # The container an editor's Reopen in Container and `devcontainer up` start.
  dev:
    build:
      # The repository root rather than this directory. The image's last layer
      # installs gg's program-language toolchains with gg's own installers,
      # scripts/ci/install-gg-toolchains.sh and
      # scripts/ci/install-gg-build-toolchains.sh in the gg/ checkout, which
      # read their pins from beside the arms under its packages/, so the build
      # has to see them, and gg/ has to be checked out before it starts. The root
      # .dockerignore is an allowlist and decides what it sees; every COPY in
      # the Dockerfile is written from the root. See "The build context" in
      # README.md.
      context: ..
      dockerfile: ./.devcontainer/ubuntu.dockerfile
      args:
        <<: *devcontainer-build-args
    # Keeps the container alive after the build's entrypoint exits. A compose
    # service runs the command it declares, where a container built from a
    # Dockerfile alone took one the devcontainer CLI substituted for it.
    command: sleep infinity
    # An init process, which reaps the processes the container's tools leave
    # behind.
    init: true
    # The user namespace. Rootless Podman maps the host user to root inside the
    # container unless told otherwise, and a checkout written through that
    # mapping comes out owned by root on the host. The image's account is
    # 1000:1000 on every machine, so such a host answers with
    # `keep-id:uid=1000,gid=1000` here, which maps its own account onto the
    # image's whatever its own ids are, and a file the container writes into
    # the checkout belongs to that account on the host. See "Host files" in
    # README.md.
    userns_mode: ${DEVCONTAINER_USERNS:-host}
    environment:
      # The socket the docker and podman clients in here drive, which is where
      # tools/host-runtime.sh publishes the host's runtime.
      - CONTAINER_HOST=unix:///var/run/docker.sock
      # Where that publisher and tools/ssh-agent.sh reach the host when no
      # socket can be bound in, which is what a Mac running Podman is. Unset is
      # the ordinary case, and each publisher then publishes nothing rather
      # than bridging.
      - DEVCONTAINER_RUNTIME_TCP=${DEVCONTAINER_RUNTIME_TCP:-}
      # The credential a host guarding that endpoint states this container,
      # which the publisher presents on every connection. It is given to this
      # service alone, so no other service reaches the runtime through it.
      - DEVCONTAINER_RUNTIME_CREDENTIAL=${DEVCONTAINER_RUNTIME_CREDENTIAL:-}
      - DEVCONTAINER_SSH_AGENT_TCP=${DEVCONTAINER_SSH_AGENT_TCP:-}
    extra_hosts:
      # A route to the host's loopback. `k3d` stands a cluster up on the HOST
      # container runtime, so its API server is published on a host port, and
      # `kubectl` in here reaches it at host.docker.internal:<port>.
      - "host.docker.internal:host-gateway"
    volumes:
      # The checkout, at the folder devcontainer.json works in. The two are one
      # path built from the project's slug, so they agree whatever the checkout
      # directory on the machine is named; mounting it anywhere else starts a
      # container whose working directory does not exist.
      - ..:/workspaces/the-test-cabinet:rw
      # The host's container runtime and its SSH agent, which
      # tools/host-runtime.sh and tools/ssh-agent.sh publish inside at every
      # start. A host that can bind neither leaves both at the default
      # /dev/null and bridges them over the two TCP variables above.
      - ${DEVCONTAINER_RUNTIME_SOCKET:-/var/run/docker.sock}:/run/host/runtime.sock
      - ${DEVCONTAINER_SSH_AUTH_SOCK:-/dev/null}:/run/host/ssh-agent.sock
