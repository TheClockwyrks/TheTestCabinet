x-devcontainer-build-args: &devcontainer-build-args
  USERNAME: ${DEVCONTAINER_USERNAME:-vscode}
  USER_UID: ${DEVCONTAINER_UID:-1000}
  USER_GID: ${DEVCONTAINER_GID:-1000}
  DOCKER_GID: ${DOCKER_GID:-999}
  LAZYGIT_VERSION: 0.61.1
  NODE_VERSION: 24.16.0
  RUST_VERSION: 1.96.0
  TZ: ${TZ:-UTC}

services:
  # Devcontainer used by VS Code.
  dev:
    build:
      args:
        <<: *devcontainer-build-args
      context: .
      dockerfile: ./ubuntu.dockerfile
    # Keep the container alive after the build's entrypoint exits.
    command: sleep infinity
    init: true
    environment:
      - TZ=${TZ:-UTC}
      # Cargo's target dir lives on a native named volume (the `cargo-target`
      # volume below), NOT under the host-mounted workspace. On a macOS host
      # (e.g. OrbStack) the workspace is a virtiofs mount, and concurrent rustc
      # jobs writing crate metadata there race on file visibility, causing
      # intermittent "E0463: can't find crate" failures at high parallelism; a
      # coherent filesystem eliminates the race so builds run at full -j.
      - CARGO_TARGET_DIR=/cargo-target/the-test-cabinet
    stdin_open: true
    tty: true
    volumes:
      - ..:/workspaces/the-test-cabinet:rw
      # Off-virtiofs cargo target dir (see CARGO_TARGET_DIR above).
      - cargo-target:/cargo-target

volumes:
  # Cargo build artifacts, kept off the host-mounted workspace; survives
  # container restarts and rebuilds.
  cargo-target:
  # The Grafana LGTM stack no longer lives here. It now runs IN THE CLUSTER as the
  # local k3d overlay's `components/observability` (deployments/k8s/components/
  # observability/), the same way it runs in staging/prod — so local development
  # observes telemetry through the exact stack a deployment uses. Bring the cluster
  # up with `make -C deployments/local local-up` and reach Grafana (and the OTLP
  # collector, for binaries run here in the devcontainer) with
  # `make -C deployments/local local-grafana`. See .devcontainer/README.md and
  # development/observability.md.
