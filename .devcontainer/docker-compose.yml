x-devcontainer-build-args: &devcontainer-build-args
  USERNAME: ${DEVCONTAINER_USERNAME:-vscode}
  USER_UID: ${DEVCONTAINER_UID:-1000}
  USER_GID: ${DEVCONTAINER_GID:-1000}
  DOCKER_GID: ${DOCKER_GID:-999}
  LAZYGIT_VERSION: 0.61.1
  NODE_VERSION: 24.16.0
  RUST_VERSION: 1.96.0
  TZ: ${TZ:-UTC}

services:
  # Devcontainer used by VS Code.
  dev:
    build:
      args:
        <<: *devcontainer-build-args
      context: .
      dockerfile: ./ubuntu.dockerfile
    # Keep the container alive after the build's entrypoint exits.
    command: sleep infinity
    init: true
    environment:
      - TZ=${TZ:-UTC}
      # Cargo's target dir lives on a native named volume (the `cargo-target`
      # volume below), NOT under the host-mounted workspace. On a macOS host
      # (e.g. OrbStack) the workspace is a virtiofs mount, and concurrent rustc
      # jobs writing crate metadata there race on file visibility, causing
      # intermittent "E0463: can't find crate" failures at high parallelism; a
      # coherent filesystem eliminates the race so builds run at full -j.
      - CARGO_TARGET_DIR=/cargo-target/the-test-cabinet
    stdin_open: true
    tty: true
    volumes:
      - ..:/workspaces/the-test-cabinet:rw
      # Off-virtiofs cargo target dir (see CARGO_TARGET_DIR above).
      - cargo-target:/cargo-target

  # ── Local observability (OPT-IN) ─────────────────────────────────────────────
  #
  # Grafana LGTM (Loki / Grafana / Tempo / Mimir) all-in-one OTLP collector +
  # backend + dashboards, for inspecting OpenTelemetry traces, metrics, and logs
  # emitted by the workspace binaries during development.
  #
  # This service is OPT-IN: it costs nothing until something points
  # OTEL_EXPORTER_OTLP_ENDPOINT at it (see the per-process `.env.*.example`
  # files), and it only starts the next time the devcontainer is (re)built. To
  # activate it, run **Dev Containers: Rebuild Container** after pulling this
  # change — no other config is required for the `dev` service.
  #
  # Endpoints (note the duality — pick the address by WHERE the process runs):
  #   • From INSIDE the devcontainer (backend + web UI run here) use the compose
  #     service DNS name `lgtm`:
  #         OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317   (gRPC)
  #         OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318   (HTTP/protobuf)
  #   • From the HOST (worker + CLI run there, and the browser runs on the host)
  #     use `localhost` against the published ports below:
  #         OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317   (gRPC)
  #         OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318   (HTTP/protobuf)
  #     The Rust binaries export over HTTP/protobuf (:4318); the browser also
  #     uses the HTTP endpoint on localhost:4318.
  #
  # Grafana UI: http://localhost:3000 (anonymous admin; no login needed).
  lgtm:
    image: grafana/otel-lgtm:latest
    init: true
    ports:
      # Published to the HOST so host-side processes (worker, CLI, browser) can
      # reach the collector at localhost. In-container processes reach it by the
      # `lgtm` service name on the same compose network.
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
      - "3000:3000" # Grafana UI
    volumes:
      # Persist Grafana's dashboards/state across container rebuilds. Telemetry
      # (traces/metrics/logs) in the LGTM stores is intentionally ephemeral.
      - lgtm-grafana:/data/grafana

volumes:
  # Cargo build artifacts, kept off the host-mounted workspace; survives
  # container restarts and rebuilds.
  cargo-target:
  lgtm-grafana:
