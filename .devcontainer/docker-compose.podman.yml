# Host override for rootless Podman (for example on a NixOS host). Copy this to
# docker-compose.local.yml (see README.md).
#
# - userns_mode keep-id maps the host user onto the container user so the mounted
#   workspace stays writable. uid/gid match .env.podman.
# - label=disable avoids SELinux relabeling of the bind-mounted workspace.
services:
  dev:
    build:
      args:
        BUILDARCH: amd64
    security_opt:
      - label=disable
    userns_mode: keep-id:uid=1000,gid=100
