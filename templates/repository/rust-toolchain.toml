# The Rust toolchain every checkout builds with. Pinned to an exact patch release
# rather than `stable` so a new stable never silently changes what the gate
# enforces: tracking `stable` lets a widened lint fail the gate on code nobody
# had touched. Bump this deliberately, together with the `RUST_VERSION` build
# argument in .devcontainer/docker-compose.yml, which installs the same compiler
# into the image; the two must stay on the same version.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
