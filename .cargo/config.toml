# Cargo configuration for The Test Cabinet.
#
# The default build is a normal dynamically linked glibc build, which targets
# mainstream Linux (Ubuntu and similar). This file does NOT change that default.
#
# It only adds convenience aliases for portable, fully static builds of the
# headless binaries via the musl target. A static binary has no dynamic linker,
# so it runs on distributions that do not ship the generic FHS loader — notably
# NixOS — as well as on mainstream distributions.
#
# The portably-buildable binaries:
#   - `tcab`            — the CLI (`build-portable`)
#   - `tcab-backend`    — the definition/run store + API + run queue (`build-portable-backend`)
#   - `tcab-dispatcher` — claims queued runs, creates one driver Job each (`build-portable-dispatcher`)
#   - `tcab-driver`     — the per-run executor (`build-portable-driver`)
#   - `tcab-artifacts`  — the produced-run-tree server (`build-portable-artifacts`)
#   - `gg`              — the first-party in-container coding harness (`build-portable-gg`)
#
# For `gg` the static build is not merely a portability convenience: gg runs INSIDE
# the run container, whose images span glibc Debian bookworm AND the Ubuntu blender
# image, so a static-musl gg is the one binary that runs across all of them (a
# glibc gg built on a newer host fails with `GLIBC_… not found` in an older image).
# The `x86_64` alias below is the release/CI build; to build gg for the HOST arch
# (e.g. aarch64 in this dev container, for a local k3d cluster) use the arch-adaptive
# `scripts/build-gg-static.sh`, which the driver image's build stage also runs.
# All share `test-cabinet-core` and so the same prerequisites. The backend also
# pulls in SeaORM's SQLite driver with bundled `libsqlite3-sys`, which compiles
# SQLite from vendored C source via the same musl toolchain — so it links
# statically too (its PostgreSQL driver is pure Rust over rustls).
#
# Prerequisites (see https://docs.testcabinet.ai/development/building/#portable-static-builds):
#   rustup target add x86_64-unknown-linux-musl
#   a musl C toolchain on PATH (musl-gcc), e.g. Debian/Ubuntu `musl-tools`,
#   needed because the `ring` TLS backend (and bundled SQLite) compile a little C.
#
# Build with:
#   cargo build-portable             # -> target/x86_64-unknown-linux-musl/release/tcab
#   cargo build-portable-backend     # -> .../release/tcab-backend
#   cargo build-portable-dispatcher  # -> .../release/tcab-dispatcher
#   cargo build-portable-driver      # -> .../release/tcab-driver
#   cargo build-portable-artifacts   # -> .../release/tcab-artifacts
#
# NOTE: under its `cli` runtime `tcab-driver` drives a run by shelling out to a
# container runtime, so the host it runs on then still needs Podman or Docker on
# PATH (the static binary removes only the glibc/loader dependency, not the runtime
# it orchestrates). Under the `kubernetes` runtime it talks to the API instead and
# needs neither.

[alias]
build-portable = "build -p test-cabinet-cli --release --target x86_64-unknown-linux-musl"
build-portable-backend = "build -p test-cabinet-backend --release --target x86_64-unknown-linux-musl"
build-portable-dispatcher = "build -p test-cabinet-dispatcher --release --target x86_64-unknown-linux-musl"
build-portable-driver = "build -p test-cabinet-driver --release --target x86_64-unknown-linux-musl"
build-portable-artifacts = "build -p test-cabinet-artifacts --release --target x86_64-unknown-linux-musl"
build-portable-gg = "build -p test-cabinet-gg --release --target x86_64-unknown-linux-musl"

# rustdoc documents private items too, so the `rust-doc` gate resolves the
# intra-doc links in private doc comments as well as public ones; without it a
# broken link in a private item goes unchecked. The template's gate runs a plain
# `cargo doc --workspace --no-deps`, so the flag lives here rather than in the gate.
#
# Its scope is every cargo run under this repository, not the gate alone: the
# `rust-doc` gate, the doctests, `packages/gg-sandbox-rust/signatures.sh`'s
# `cargo rustdoc` (whose catalogue is byte-identical with and without it), the
# services image's gg build, and `cargo doc` in a test-case workspace checked out
# beneath the repository. A `RUSTDOCFLAGS` in the environment, even an empty one,
# takes precedence over it.
[build]
rustdocflags = ["--document-private-items"]

# BEGIN the patch table: generated by `scripts/repos/sources.py patch-table --write`.

# Each repository's manifests name a dependency on another repository by its
# public git source, the GitHub mirror, which is what lets a repository build
# on its own. The `[patch]` tables below redirect every one of those sources
# to the sibling checkout, so a build inside the superrepo links the working
# trees rather than the pushed revisions. The Repositories development page
# states the rule; the `dependency-graph` gate holds these tables to the
# repositories.
#
# A table for a repository that is not checked out is a comment: cargo loads
# every patch path eagerly, so an entry for a missing directory would fail
# every build under the superrepo, the monorepo's own included.

[patch."https://github.com/TheClockwyrks/contracts"]
contract-codegen = { path = "contracts/crates/contract-codegen" }
test-cabinet-contracts = { path = "contracts/crates/contracts" }
test-cabinet-suites = { path = "contracts/crates/suites" }

# engines is not checked out; the table joins once it is bootstrapped:
#   [patch."https://github.com/TheClockwyrks/engines"]
#   test-cabinet-engines = { path = "engines/crates/engines" }

# gg is not checked out; the table joins once it is bootstrapped:
#   [patch."https://github.com/TheClockwyrks/gg"]
#   test-cabinet-gg = { path = "gg/crates/gg" }

# platform is not checked out; the table joins once it is bootstrapped:
#   [patch."https://github.com/TheClockwyrks/platform"]
#   test-cabinet-cli = { path = "platform/crates/cli" }

# web is not checked out; the table joins once it is bootstrapped:
#   [patch."https://github.com/TheClockwyrks/web"]
#   test-cabinet-console-app = { path = "web/crates/console-app" }

# the-spec-cabinet is not checked out; the table joins once it is bootstrapped:
#   [patch."https://github.com/TheClockwyrks/the-spec-cabinet"]
#   test-cabinet-spec-cabinet = { path = "the-spec-cabinet/crates/spec-cabinet" }

# Cargo still fetches a patched git source to resolve the lock file, so the
# source has to be reachable even though nothing is built from it. While the
# mirrors are private, `scripts/repos/sources.py rewrites --apply` rewrites
# each public source to the Azure remote in the user's git configuration,
# which the command-line fetch below honours and cargo's built-in one would
# not.
[net]
git-fetch-with-cli = true

# END the patch table.
