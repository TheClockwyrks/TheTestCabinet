# Cargo configuration for The Test Cabinet.
#
# The default build is a normal dynamically linked glibc build, which targets
# mainstream Linux (Ubuntu and similar). This file does NOT change that default.
#
# It only adds convenience aliases for portable, fully static builds of the
# headless binaries via the musl target. A static binary has no dynamic linker,
# so it runs on distributions that do not ship the generic FHS loader — notably
# NixOS — as well as on mainstream distributions.
#
# The portably-buildable binaries:
#   - `tcab`            — the CLI (`build-portable`)
#   - `tcab-backend`    — the definition/run store + API + run queue (`build-portable-backend`)
#   - `tcab-dispatcher` — claims queued runs, creates one driver Job each (`build-portable-dispatcher`)
#   - `tcab-driver`     — the per-run executor (`build-portable-driver`)
#   - `tcab-artifacts`  — the produced-run-tree server (`build-portable-artifacts`)
# All share `test-cabinet-core` and so the same prerequisites. The backend also
# pulls in SeaORM's SQLite driver with bundled `libsqlite3-sys`, which compiles
# SQLite from vendored C source via the same musl toolchain — so it links
# statically too (its PostgreSQL driver is pure Rust over rustls). The
# Tauri desktop shell is NOT portable to musl: its Linux backend links system
# WebKitGTK/GTK shared libraries that have no musl-static build (see building.md).
#
# Prerequisites (see https://docs.testcabinet.ai/development/building/#portable-static-builds):
#   rustup target add x86_64-unknown-linux-musl
#   a musl C toolchain on PATH (musl-gcc), e.g. Debian/Ubuntu `musl-tools`,
#   needed because the `ring` TLS backend (and bundled SQLite) compile a little C.
#
# Build with:
#   cargo build-portable             # -> target/x86_64-unknown-linux-musl/release/tcab
#   cargo build-portable-backend     # -> .../release/tcab-backend
#   cargo build-portable-dispatcher  # -> .../release/tcab-dispatcher
#   cargo build-portable-driver      # -> .../release/tcab-driver
#   cargo build-portable-artifacts   # -> .../release/tcab-artifacts
#
# NOTE: under its `cli` runtime `tcab-driver` drives a run by shelling out to a
# container runtime, so the host it runs on then still needs Podman or Docker on
# PATH (the static binary removes only the glibc/loader dependency, not the runtime
# it orchestrates). Under the `kubernetes` runtime it talks to the API instead and
# needs neither.

[alias]
build-portable = "build -p test-cabinet-cli --release --target x86_64-unknown-linux-musl"
build-portable-backend = "build -p test-cabinet-backend --release --target x86_64-unknown-linux-musl"
build-portable-dispatcher = "build -p test-cabinet-dispatcher --release --target x86_64-unknown-linux-musl"
build-portable-driver = "build -p test-cabinet-driver --release --target x86_64-unknown-linux-musl"
build-portable-artifacts = "build -p test-cabinet-artifacts --release --target x86_64-unknown-linux-musl"
