# Production on managed PostgreSQL.
#
# The base with the components/postgres conversion layered on: the backend and auth
# service run as stateless Deployments backed by an Azure Database for PostgreSQL —
# Flexible Server instance instead of embedded SQLite. Its namespace is tcab-prod and
# its TCAB_ENV is `prod`, the base's. The local overlay keeps the SQLite shape.
#
# The pipeline's prod stage deploys it from `master` through
# scripts/ci/deploy-environment.sh, which pins a temporary copy of it with
# scripts/ci/pin-images.sh: every Test Cabinet image in the `images:` block below, and
# the dispatcher's driver and publisher images and run-container registry and tag, at
# the commit being deployed. Applied as it stands, every image is at `unpinned`, a tag
# nothing pushes, so it fails to pull rather than running an unknown build.
#
# Every object it renders is namespaced, because the deploy identity may write the
# tcab-prod namespace and nothing else. The Namespace and the other cluster-scoped
# objects it depends on are ../../cluster/azure-prod, applied by hand by a cluster
# administrator (see "Cluster prerequisites" in ../../README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcab-prod

resources:
  - ../../base

components:
  - ../../components/postgres
  # The in-cluster Grafana LGTM stack. Listed AFTER postgres so it layers onto the
  # backend/auth Deployments postgres swaps in; patch-otel.yaml below sets each
  # workload's OTEL_EXPORTER_OTLP_ENDPOINT to the `tcab-lgtm` Service it adds.
  - ../../components/observability
  # Populate the deployment's Kubernetes Secrets from Azure Key Vault via the
  # Secrets Store CSI driver + Workload Identity (no real Secret manifests in git).
  # Fill REPLACE_IDENTITY_CLIENT_ID in the component after creating the managed
  # identity; see the runbook.
  - ../../components/keyvault-csi
  # Serve the web console in-cluster and expose it + the four services over an
  # INTERNAL (VPN-reachable, never public) ingress-nginx at host-per-service
  # `*.testcabinet.ai` names with cert-manager TLS. Adds the tcab-web Deployment +
  # Service, the five Ingress routes, and the ingress-source NetworkPolicy. The
  # component defaults to the prod hostnames; this overlay patches the runtime console
  # + backend URLs below (patch-web-config.yaml / patch-backend-public-urls.yaml). The
  # ingress-nginx + cert-manager controllers and the Let's Encrypt ClusterIssuer are
  # cluster prerequisites ("Cluster prerequisites" in ../../README.md).
  - ../../components/internal-ingress
  # Passwordless (Microsoft Entra managed-identity) Postgres auth for backend + auth.
  # ENABLED at the v0.6.0-rc2 cutover (2026-07-26): the pods run the db-auth service
  # image, the in-DB Entra login roles exist on the private server (tcab-backend-db-prod
  # / tcab-auth-db-prod, each a member of prod's tcab_backend_app / tcab_auth_app owner
  # role — note prod's owner roles are the *_app names, not the runbook's bare
  # tcab_backend/tcab_auth), and the Key Vault DB-URL secrets carry the passwordless
  # role@host form. prod's DB-auth identity clientIDs are baked into the component, so no
  # per-env patch is needed. See components/postgres-azure-ad and the deployment runbook
  # for the cutover order.
  - ../../components/postgres-azure-ad

# Every Test Cabinet image, at the Test Cabinet ACR and the tag `unpinned`, which
# nothing pushes: applied as it stands, the overlay fails to pull rather than running
# whatever a moving tag last named. scripts/ci/pin-images.sh rewrites each newTag to
# the commit being deployed (and adds the dispatcher's run-image environment) before
# anything applies it. The backend's repository is `the-test-cabinet-backend`, the name
# the workspace template's publish and deploy stages use; the other seven keep their
# `tcab-*` names.
images:
  - name: REPLACE_REGISTRY/tcab-backend
    newName: testcabinet.azurecr.io/the-test-cabinet-backend
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-auth-service
    newName: testcabinet.azurecr.io/tcab-auth-service
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-dispatcher
    newName: testcabinet.azurecr.io/tcab-dispatcher
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-driver
    newName: testcabinet.azurecr.io/tcab-driver
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-artifacts
    newName: testcabinet.azurecr.io/tcab-artifacts
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-arena
    newName: testcabinet.azurecr.io/tcab-arena
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-publisher
    newName: testcabinet.azurecr.io/tcab-publisher
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-web
    newName: testcabinet.azurecr.io/tcab-web
    newTag: unpinned

patches:
  - path: patch-otel.yaml
  # Enable subscription auth (Codex + Claude Code) by mounting the
  # tcab-driver-subscription Secret into each driver Job.
  - path: patch-dispatcher-subscription.yaml
  # Enable in-cluster publishing: the publisher credential Secret and the prod publish
  # targets. The publisher image itself is set by scripts/ci/pin-images.sh.
  - path: patch-dispatcher-publisher.yaml
  # Repoint the backend's advertised data-plane URLs (TCAB_ARTIFACTS_PUBLIC_URL /
  # TCAB_ARENA_PUBLIC_URL — env VALUES the images: transformer can't reach) to the
  # internal-ingress https hostnames so console media resolves over the VPN.
  - path: patch-backend-public-urls.yaml
  # Set the in-cluster console's runtime backend/auth URLs (TCAB_WEB_BACKEND_URL /
  # TCAB_WEB_AUTH_URL on the internal-ingress tcab-web pod) to the https hostnames.
  - path: patch-web-config.yaml
  # Lock down Grafana (disable the otel-lgtm image's anonymous-admin default, set
  # admin creds from the tcab-grafana-admin Secret) since the internal-ingress
  # component now exposes it at grafana.tcab.testcabinet.ai over the VPN ingress.
  - path: patch-grafana-auth.yaml
  # Hold telemetry for 3 days rather than the component's 24h default — a prod issue
  # is often investigated a day or more after the run that caused it.
  - path: patch-lgtm-retention.yaml
  # Catalog ingest sidecar in the backend pod (shares /state, POSTs /ingest over
  # localhost) — the base CronJob can't reach the backend or share its checkout volume.
  - path: patch-backend-ingest.yaml
  # …and suspend that now-superseded base CronJob so it stops failing every 30 min.
  - path: patch-suspend-ingest-cronjob.yaml
