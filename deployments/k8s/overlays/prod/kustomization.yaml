# Production on managed PostgreSQL.
#
# The base with the components/postgres conversion layered on: the backend runs as a
# stateless Deployment backed by an Azure Database for PostgreSQL —
# Flexible Server instance instead of embedded SQLite. Its namespace is tcab-prod and
# its TCAB_ENV is `prod`, the base's. The local overlay keeps the SQLite shape.
#
# The pipeline's prod stage deploys it from `master` through
# scripts/ci/deploy-environment.sh, which pins a temporary copy of it with
# scripts/ci/pin-images.sh: every Test Cabinet image in the `images:` block below, and
# the dispatcher's driver and publisher images and run-container registry and tag, at
# the commit being deployed. Applied as it stands, every image is at `unpinned`, a tag
# nothing pushes, so it fails to pull rather than running an unknown build.
#
# Every object it renders is namespaced, because the deploy identity may write the
# tcab-prod namespace and nothing else. The Namespace and the other cluster-scoped
# objects it depends on are ../../cluster/azure-prod, applied by hand by a cluster
# administrator (see "Cluster prerequisites" in ../../README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcab-prod

resources:
  - ../../base

components:
  - ../../components/postgres
  # The in-cluster Grafana LGTM stack. Listed AFTER postgres so it layers onto the
  # backend Deployment postgres swaps in; patch-otel.yaml below sets each
  # workload's OTEL_EXPORTER_OTLP_ENDPOINT to the `tcab-lgtm` Service it adds.
  - ../../components/observability
  # Populate the deployment's Kubernetes Secrets from Azure Key Vault via the
  # Secrets Store CSI driver + Workload Identity (no real Secret manifests in git).
  # Fill REPLACE_IDENTITY_CLIENT_ID in the component after creating the managed
  # identity; see the runbook.
  - ../../components/keyvault-csi
  # The edge: the tcab-cloudflared tunnel connector routing console.testcabinet.ai by
  # path to the console and the three services, and grafana.testcabinet.ai to
  # Grafana, with the nested components/web console workload and the NetworkPolicy
  # admitting the connector. The component's defaults are prod's tunnel and
  # hostnames, so this overlay patches none of it. The Cloudflare side (the
  # tcab-prod tunnel, the hostnames, the Access applications) is set up out of band;
  # see apps/docs/src/content/docs/deployment/kubernetes/edge.md.
  - ../../components/edge
  # Passwordless (Microsoft Entra managed-identity) Postgres auth for the backend.
  # ENABLED at the v0.6.0-rc2 cutover (2026-07-26): the pod runs the db-auth service
  # image, the in-DB Entra login role exists on the private server (tcab-backend-db-prod,
  # a member of prod's tcab_backend_app owner role — note prod's owner role is the
  # *_app name, not the runbook's bare tcab_backend), and the Key Vault DB-URL secret
  # carries the passwordless role@host form. prod's DB-auth identity clientID is baked
  # into the component, so no per-env patch is needed. See components/postgres-azure-ad and the deployment runbook
  # for the cutover order.
  - ../../components/postgres-azure-ad

# Every Test Cabinet image, at the Test Cabinet ACR and the tag `unpinned`, which
# nothing pushes: applied as it stands, the overlay fails to pull rather than running
# whatever a moving tag last named. scripts/ci/pin-images.sh rewrites each newTag to
# the commit being deployed (and adds the dispatcher's run-image environment) before
# anything applies it. The backend's repository is `the-test-cabinet-backend`, the name
# the workspace template's publish and deploy stages use; the arena's is
# `microservice-arena`, the artifacts service's
# `microservice-artifacts`, the repos service's `microservice-repos`, the
# dispatcher's `microservice-dispatcher` and the driver's
# `microservice-driver`, the console's `console.testcabinet.ai` and the
# publisher's `microservice-publisher`, the repositories they are built in, each
# pinned to the commit its submodule pointer names.
images:
  - name: REPLACE_REGISTRY/tcab-backend
    newName: testcabinet.azurecr.io/the-test-cabinet-backend
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-dispatcher
    newName: testcabinet.azurecr.io/microservice-dispatcher
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-driver
    newName: testcabinet.azurecr.io/microservice-driver
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-artifacts
    newName: testcabinet.azurecr.io/microservice-artifacts
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-repos
    newName: testcabinet.azurecr.io/microservice-repos
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-arena
    newName: testcabinet.azurecr.io/microservice-arena
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-publisher
    newName: testcabinet.azurecr.io/microservice-publisher
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-web
    newName: testcabinet.azurecr.io/console.testcabinet.ai
    newTag: unpinned

patches:
  - path: patch-otel.yaml
  # Enable subscription auth (Codex + Claude Code) by mounting the
  # tcab-driver-subscription Secret into each driver Job.
  - path: patch-dispatcher-subscription.yaml
  # Enable in-cluster publishing: the publisher credential Secret and the prod
  # Cloudflare Pages project the dispatcher forwards into publish Jobs (the GitHub
  # org is the repos service's, patch-repos-github.yaml). The publisher image itself
  # is set by scripts/ci/pin-images.sh.
  - path: patch-dispatcher-publisher.yaml
  # The Access application the backend, artifacts and arena verify the edge's
  # assertion against.
  - path: patch-access.yaml
  # The artifacts service's Blob identity: the managed identity's client id on its
  # ServiceAccount and the workload-identity label on its pod. The base
  # names prod's storage account.
  - path: patch-artifacts-identity.yaml
  # The repos service's Blob identity, as the artifacts service's: the managed
  # identity's client id on its ServiceAccount, the workload-identity label on its
  # pod. The base names prod's storage account.
  - path: patch-repos-identity.yaml
  # The repos service's GitHub organization and its token (tcab-repos-secrets, synced
  # from the Key Vault by the keyvault-csi component).
  - path: patch-repos-github.yaml
  # Lock down Grafana (disable the otel-lgtm image's anonymous-admin default, set
  # admin creds from the tcab-grafana-admin Secret) since the edge component routes
  # grafana.testcabinet.ai to it.
  - path: patch-grafana-auth.yaml
  # Hold telemetry for 3 days rather than the component's 24h default — a prod issue
  # is often investigated a day or more after the run that caused it.
  - path: patch-lgtm-retention.yaml
  # Catalog ingest sidecar in the backend pod (shares /state, POSTs /ingest over
  # localhost) — the base CronJob can't reach the backend or share its checkout volume.
  - path: patch-backend-ingest.yaml
  # …and suspend that now-superseded base CronJob so it stops failing every 30 min.
  - path: patch-suspend-ingest-cronjob.yaml
