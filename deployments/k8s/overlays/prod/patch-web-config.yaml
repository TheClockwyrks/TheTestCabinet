# Set the in-cluster web console's runtime config to the internal-ingress https
# hostnames.
#
# The single tcab-web image is environment-agnostic (one build per git-sha), so the
# backend URL is injected at RUNTIME via env: the image's entrypoint `envsubst`s a
# /config.js the SPA reads (window.__TCAB_CONFIG__). The components/web Deployment
# (pulled in by the internal-ingress component) ships the env key with an empty
# default; this overlay patches it to the prod https name the ingress routes
# (api.tcab.testcabinet.ai → tcab-backend).
#
# It is an env VALUE the kustomize `images:` transformer cannot reach, hence a patch
# (same rationale as the dispatcher image-value patches).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: TCAB_WEB_BACKEND_URL
              value: "https://api.tcab.testcabinet.ai"
