# The artifacts service's Blob identity in PROD: the user-assigned managed identity
# holding Storage Blob Data Contributor on the run-tree container, federated to
# system:serviceaccount:tcab-prod:tcab-artifacts through the testcabinet-prod-westus2-aks
# OIDC issuer (Run plane, apps/docs/src/content/docs/deployment/kubernetes/run-plane.md
# "Artifacts service"; the prerequisites in deployment/kubernetes/overview.md).
#
#   Storage account tcabprodstore (RG testcabinet-prod-westus2-rg), private container run-trees
#   Identity        tcab-artifacts-prod
#
# The client id below is `unprovisioned` until that identity exists, and neither the
# account nor the identity exists yet. Applied as it is, the webhook would project an
# AZURE_CLIENT_ID no tenant knows, the service's start-up listing of the container
# would be refused and the pod would never become ready; a brand-new Deployment has
# no revision to roll back to, and the deploy retires the StatefulSet it replaces
# first, so prod would be left with no artifacts service. scripts/ci/deploy-environment.sh
# (and pre-deploy.sh) therefore refuse any overlay that renders this value, before
# retiring or applying anything (tcab-lib.sh's ci_assert_identities_provisioned):
# the prod stage fails and prod keeps running what it runs.
#
# Before promoting to master: create the account, the container, the identity, its
# role assignment and its federated credential; replace the value below with the
# identity's clientId; and copy the run trees on prod's claim artifacts-tcab-artifacts-0
# (unpublished runs awaiting review among them) into the container, since the
# Deployment reads the container only.
#
# The `azure.workload.identity/use` pod label is what makes the webhook project the
# identity's token and variables. The local overlay carries neither, so its pod signs
# with Shared Key against Azurite.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-artifacts
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
  annotations:
    azure.workload.identity/client-id: "unprovisioned"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-artifacts
  namespace: tcab-prod
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
