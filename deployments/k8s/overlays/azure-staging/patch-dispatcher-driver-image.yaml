# The dispatcher's TCAB_DRIVER_IMAGE is a plain env VALUE, not a container `image:`
# field, so kustomize's `images:` transformer does not rewrite it. Patch it here to the
# staging driver SERVICE image (keep it in lockstep with the dispatcher image tag).
#
# TCAB_CONTAINER_TAG pins the RUN-CONTAINER images the driver resolves per sandbox pod.
# Like TCAB_DRIVER_IMAGE it is an env value the driver reads at run time and the
# dispatcher forwards into every driver Job. It is pinned SEPARATELY from the service
# images because it decides the image every future RUN executes inside — it advances
# with a rehearsed release, not with every service roll.
#
# It stays CONVERGED with the driver SERVICE image, now at `49654d1b` (v0.6.3-rc5). The
# two pins first re-converged at `31568780` (v0.6.2-rc1), closing a gap that had been open
# since beta4 while `build-containers` was still path-filtered; both workflows have run
# unfiltered on every master/staging push since 5ef86c1d, so every build now publishes the
# service images and all 27 run images at one sha and the pins can simply move together.
# containers/ did not change between 711c71d8 and this sha, so the run images are rebuilds
# of the same Dockerfiles rather than new content of ours — only upstream base layers
# moved. Keep the two pins in lockstep rather than letting them drift again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DRIVER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-driver:49654d1b228be0a3dc3f54b412d46ba4426d0eef"
            - name: TCAB_CONTAINER_TAG
              value: "49654d1b228be0a3dc3f54b412d46ba4426d0eef"
