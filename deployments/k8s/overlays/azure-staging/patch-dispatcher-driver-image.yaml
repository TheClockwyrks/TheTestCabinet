# The dispatcher's TCAB_DRIVER_IMAGE is a plain env VALUE, not a container `image:`
# field, so kustomize's `images:` transformer does not rewrite it. Patch it here to the
# staging driver SERVICE image (keep it in lockstep with the dispatcher image tag).
#
# TCAB_CONTAINER_TAG pins the RUN-CONTAINER images the driver resolves per sandbox pod.
# Like TCAB_DRIVER_IMAGE it is an env value the driver reads at run time and the
# dispatcher forwards into every driver Job. It is pinned SEPARATELY from the service
# images because it decides the image every future RUN executes inside — it advances
# with a rehearsed release, not with every service roll.
#
# It sits at `e6afbee6` (v0.6.0-beta4) while the driver SERVICE image is at `e376e0fa`
# (v0.6.1-rc5). That gap is a leftover of `build-containers` having been path-filtered:
# it published at beta2 (8c80dd94), skipped beta2.1/beta3, re-converged at beta4, then
# skipped every build since (v0.6.0-rc1, rc2 and v0.6.1-rc1, rc4, rc4.1, rc5) — so there
# was simply no newer sha carrying run images to pin to. It stayed benign only because
# containers/ happened not to change in that window; a change there would have shipped
# silently stale run images. Both image workflows now run unfiltered on every
# master/staging push, so run images exist at EVERY sha and this can be re-pinned
# alongside the service images at the next rc. Do that rather than letting it drift.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DRIVER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-driver:e376e0fa9e228b62d60e60a60cdfbd27549d686b"
            - name: TCAB_CONTAINER_TAG
              value: "e6afbee63a8093a7c717b5195cd8dcae85d77fdf"
