# The dispatcher's TCAB_DRIVER_IMAGE is a plain env VALUE, not a container `image:`
# field, so kustomize's `images:` transformer does not rewrite it. Patch it here to the
# staging driver SERVICE image (keep it in lockstep with the dispatcher image tag).
#
# TCAB_CONTAINER_TAG pins the RUN-CONTAINER images the driver resolves per sandbox pod.
# Like TCAB_DRIVER_IMAGE it is an env value the driver reads at run time and the
# dispatcher forwards into every driver Job. It is pinned SEPARATELY from the service
# images (the run images only rebuild when `build-containers` runs), so this tracks the
# latest sha at which `build-containers` published multi-arch run images. The
# v0.6.0-beta2.1 (5171a923) and beta3 (ae3859f7) builds ran only `build-service-images`,
# NOT `build-containers`, so the run-container tag stayed pinned at beta2 (8c80dd94) while
# the driver SERVICE image moved ahead. The v0.6.0-beta4 build ran `build-containers`
# again, so both RE-CONVERGED onto `e6afbee6`. Every build since — v0.6.0-rc1, rc2 and
# v0.6.1-rc1 and rc4 — ran only `build-service-images`, so the driver SERVICE image moves
# ahead to v0.6.1-rc4 (ba3ab20d) while the run-container tag stays pinned at beta4
# (e6afbee6). The widening divergence is benign: nothing under containers/ has changed on
# `staging` since e6afbee6, so the beta4 run images still match what the branch would
# build today.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DRIVER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-driver:ba3ab20d029b2d72b9c96a0de3092964b72b3051"
            - name: TCAB_CONTAINER_TAG
              value: "e6afbee63a8093a7c717b5195cd8dcae85d77fdf"
