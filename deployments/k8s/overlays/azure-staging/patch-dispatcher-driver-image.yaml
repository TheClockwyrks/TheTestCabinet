# The dispatcher's TCAB_DRIVER_IMAGE is a plain env VALUE, not a container `image:`
# field, so kustomize's `images:` transformer does not rewrite it. Patch it here to the
# staging driver SERVICE image (keep it in lockstep with the dispatcher image tag).
#
# TCAB_CONTAINER_TAG pins the RUN-CONTAINER images the driver resolves per sandbox pod.
# Like TCAB_DRIVER_IMAGE it is an env value the driver reads at run time and the
# dispatcher forwards into every driver Job. It is pinned SEPARATELY from the service
# images because it decides the image every future RUN executes inside — it advances
# with a rehearsed release, not with every service roll.
#
# It is now CONVERGED with the driver SERVICE image at `31568780` (v0.6.2-rc1), closing a
# gap that had been open since beta4. That gap was a leftover of `build-containers` having
# been path-filtered: it published at beta2 (8c80dd94), skipped beta2.1/beta3, re-converged
# at beta4 (e6afbee6), then skipped every build since — so there was simply no newer sha
# carrying run images to pin to. It stayed benign only because containers/ happened not to
# change in that window; a change there would have shipped silently stale run images.
# Both image workflows now run unfiltered on every master/staging push (5ef86c1d), and
# v0.6.2-rc1 is the first build under that rule: it published all 27 run images at the same
# sha as the services, so both pins move together here. containers/ did not change between
# e6afbee6 and this sha, so the run images are rebuilds of the same Dockerfiles rather than
# new content of ours — only upstream base layers moved. Keep the two pins in lockstep from
# here rather than letting this drift again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DRIVER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-driver:31568780009adf70ba3369feb05cb6313048286f"
            - name: TCAB_CONTAINER_TAG
              value: "31568780009adf70ba3369feb05cb6313048286f"
