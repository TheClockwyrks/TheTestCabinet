# Enable in-cluster publishing and point it at the STAGING publish targets.
#
# TCAB_PUBLISHER_IMAGE (an env VALUE the images: transformer can't reach) selects the
# per-publish tcab-publisher Job image; TCAB_DISPATCHER_PUBLISHER_SECRETS names the
# Secret the dispatcher envFrom-mounts into each publish Job (tcab-publisher-secrets:
# GH_TOKEN for `gh`, CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID for `wrangler`),
# synced from the staging Key Vault by the keyvault-csi component.
#
# TCAB_GITHUB_ORG + TCAB_PAGES_PROJECT are the crux of publish decoupling:
# core::publish::PublishConfig::from_env requires both (no compiled-in fallback), so
# every environment names its own targets — prod sets TheClockwyrks / test-cabinet-runs,
# and staging MUST set its own here or it would publish into the prod org/project. The
# dispatcher forwards both into every publish Job (PUBLISHER_PASSTHROUGH_VARS), where
# from_env reads them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_PUBLISHER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-publisher:32a551de82dc3237ee32554a71e189a2bc534aa2"
            - name: TCAB_DISPATCHER_PUBLISHER_SECRETS
              value: "tcab-publisher-secrets"
            - name: TCAB_GITHUB_ORG
              value: "TheClockwyrks-Staging"
            - name: TCAB_PAGES_PROJECT
              value: "test-cabinet-runs-staging"
