# Retag TCAB_ENV from the base's `prod` to `staging` on every workload and point each
# at the in-cluster Grafana LGTM collector (OTEL_EXPORTER_OTLP_ENDPOINT). Each doc is a
# strategic-merge patch keyed by the workload name + container; kustomize merges the env
# list by `name`, so only the named vars are touched.
#
# backend/auth are `kind: Deployment` here (components/postgres replaced their
# StatefulSets). The backend's client-facing *_PUBLIC_URLs move to the https ingress
# hostnames in patch-backend-public-urls.yaml, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-backend
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-auth
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: auth
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-artifacts
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: artifacts
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-arena
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: arena
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
            # The base names sandbox pods in tcab-prod; retarget to the staging namespace.
            - name: TCAB_K8S_NAMESPACE
              value: "tcab-staging"
            - name: TCAB_DISPATCHER_NAMESPACE
              value: "tcab-staging"
