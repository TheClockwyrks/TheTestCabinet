# Catalog ingest sidecar (azure-staging) — identical to azure-prod EXCEPT the pinned
# commit differs (each env ingests the commit ITS images were built from).
#
# The shipped base `tcab-ingest` CronJob cannot work in this deployment (the
# default-deny NetworkPolicy blocks a standalone pod from reaching tcab-backend:8787,
# and it clones into its own emptyDir the backend never reads). This co-locates ingest
# INSIDE the backend pod as a sidecar: it shares the `state` volume (writing the
# /state/checkout the backend ingests) and calls POST /ingest over localhost — intra-pod
# traffic, so the NetworkPolicy never applies and no service token / extra route is
# needed. It runs a ONE-SHOT ingest on backend start to self-heal the ephemeral
# (emptyDir) store after a reschedule, then idles.
#
# COMMIT: ingest the EXACT commit the service images were built from, so the served
# catalog always matches the deployed code — never a branch tip (which can run ahead of
# the built images) and never a release tag like `v0.5.0` that does not exist while the
# release is still being tested on staging. CI tags every image with its git SHA, so
# this pin MUST equal this overlay's image `newTag` in kustomization.yaml; re-pin both
# together at every roll. (`scripts/reingest-cluster.sh` reads the deployed image's tag
# so the manual re-ingest matches whatever is running without a second copy of the SHA.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: ingest
          image: alpine:3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # Keep in lockstep with kustomization.yaml's image newTag (same git SHA).
              COMMIT=32a551de82dc3237ee32554a71e189a2bc534aa2
              until apk add --no-cache git curl; do
                echo "ingest: apk add failed, retrying in 5s"; sleep 5
              done
              REPO=https://github.com/TheClockwyrks/TheTestCabinet.git
              CHECKOUT=/state/checkout
              # One-shot: check out the pinned commit the backend ingests from, then
              # trigger a single ingest. No periodic loop. Fetch the commit by SHA
              # (reachable from a branch, so GitHub serves it) into the live checkout if
              # one survives a lone sidecar restart, else init a fresh one.
              if [ -d "$CHECKOUT/.git" ]; then
                echo "ingest: fetching commit $COMMIT"
                git -C "$CHECKOUT" fetch --depth 1 "$REPO" "$COMMIT" \
                  && git -C "$CHECKOUT" reset --hard FETCH_HEAD \
                  || echo "ingest: fetch failed"
              else
                echo "ingest: checking out commit $COMMIT into $CHECKOUT"
                rm -rf "$CHECKOUT" && mkdir -p "$CHECKOUT" \
                  && git -C "$CHECKOUT" init -q \
                  && git -C "$CHECKOUT" fetch --depth 1 "$REPO" "$COMMIT" \
                  && git -C "$CHECKOUT" reset --hard FETCH_HEAD \
                  || echo "ingest: checkout failed"
              fi
              echo "ingest: waiting for backend healthz"
              until curl -fsS -o /dev/null http://127.0.0.1:8787/healthz; do sleep 3; done
              n=0
              until curl -fsS -X POST http://127.0.0.1:8787/ingest \
                     -H 'content-type: application/json' -d '{}' >/dev/null; do
                n=$((n + 1))
                if [ "$n" -ge 10 ]; then
                  echo "ingest: POST /ingest failed 10x; giving up (run scripts/reingest-cluster.sh --env staging)"
                  break
                fi
                echo "ingest: POST /ingest failed, retry $n in 10s"; sleep 10
              done
              [ "$n" -lt 10 ] && echo "ingest: triggered ok"
              exec sleep infinity
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
