# Repoint the backend's advertised data-plane URLs to the staging internal-ingress
# https hostnames so console media resolves over the VPN (mirrors azure-prod, staging
# hosts).
#
# TCAB_ARTIFACTS_PUBLIC_URL / TCAB_ARENA_PUBLIC_URL are the base URLs the backend
# reports to the console via GET /config; the console then fetches artifact media +
# arena views directly from the data plane at those URLs. The base sets them to
# cluster-internal Service DNS, which a laptop on the VPN cannot resolve — so they are
# repointed here to the per-host ingress https names the internal-ingress component
# routes.
#
# TCAB_BACKEND_AUTH_URL (the backend's SERVER-SIDE token-verify URL) is deliberately
# NOT touched — it stays the in-cluster http://tcab-auth:8789. Only the client-facing
# *_PUBLIC_URLs (and the console's own URLs, in patch-web-config.yaml) move to https.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: TCAB_ARTIFACTS_PUBLIC_URL
              value: "https://artifacts.staging.tcab.testcabinet.ai"
            - name: TCAB_ARENA_PUBLIC_URL
              value: "https://arena.staging.tcab.testcabinet.ai"
            # Grafana's base URL, reported through the same GET /config so a run
            # can link to the traces it emitted. Unlike the two above this is not a
            # data-plane URL — nothing fetches from it — it is only ever opened in
            # the reader's browser. Same VPN-only ingress as the console itself, so
            # anyone who can see the link can follow it.
            - name: TCAB_GRAFANA_PUBLIC_URL
              value: "https://grafana.staging.tcab.testcabinet.ai"
            # The PUBLIC READ base of the snapshot bucket, reported through the
            # same GET /config so the console can load an asset-generation case's
            # published reference frames (media/references/…). Distinct from
            # TCAB_R2_ENDPOINT, which is the S3 WRITE endpoint the backend uploads
            # through — this is the CDN hostname those objects are served from, and
            # it is the same value the static site is built with as
            # TCAB_SNAPSHOT_URL (see scripts/lib/env.sh).
            #
            # Unlike the two data-plane URLs above this one is NOT VPN-only: the
            # bucket is public-read, which is what lets the public gallery work at
            # all. Left unset, the console simply shows no Reference tab for
            # asset-generation cases.
            - name: TCAB_SNAPSHOT_PUBLIC_URL
              value: "https://snapshot.staging.testcabinet.ai"
