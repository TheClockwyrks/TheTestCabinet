# Local repos-service override: tag the environment and point the service at the
# overlay's Azurite (azurite.yaml) instead of the environment's Blob account. Endpoint
# and key together select Shared Key, so the service needs no workload identity here,
# and it creates its bundle container at start-up. No GitHub organization or token is
# named, so a local publish answers 503 and nothing local reaches GitHub. Everything
# else (bind address, container name, backend URL, replicas) carries over from the
# base manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-repos
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: repos
          env:
            - name: TCAB_ENV
              value: "local"
            # Export to the in-cluster Grafana LGTM stack (the observability component).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
            - name: TCAB_REPOS_BLOB_ACCOUNT
              value: "devstoreaccount1"
            - name: TCAB_REPOS_BLOB_ENDPOINT
              value: "http://tcab-azurite:10000/devstoreaccount1"
            # Azurite's well-known development key, published with the emulator.
            - name: TCAB_REPOS_BLOB_KEY
              value: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==" # cspell:disable-line
