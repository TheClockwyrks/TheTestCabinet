# Local backend overrides: tag the environment, and ingest the catalog straight from
# a read-only mount of the repository (the cluster's ingest CronJob is not part of the
# local overlay). The Makefile maps the repo to `/repo` on the k3d node via `k3d
# cluster create --volume`; this mounts that into the pod at `/checkout`. The SQLite
# DB + definition store still live on the `state` PVC the base manifest declares.
#
# Neither TCAB_ACCESS_TEAM_DOMAIN nor TCAB_ACCESS_AUDIENCE is set here (nor on the
# artifacts service or the arena): locally no edge sits in front of the services, so
# each takes the identity from the `Cf-Access-Authenticated-User-Email` header the
# console's dev server adds, `dev@local` by default. See Identity,
# apps/docs/src/content/docs/components/auth/overview.md#configuration.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-backend
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: TCAB_ENV
              value: "local"
            # Offer experimental (still-being-iterated-on) test cases to the UI.
            # This is the local development cluster brought up by the Makefile, so
            # a case flagged `experimental = true` is visible and runnable here. No
            # other overlay sets this, so experimental cases stay hidden in
            # staging and production and are never run or published.
            - name: TCAB_BACKEND_ALLOW_EXPERIMENTAL
              value: "true"
            # Also ingest the test suite previews The Spec Cabinet writes to the
            # suites checkout's `.previews/` folder. The repository mount below is
            # live, so a preview written on the host is visible to the next ingest
            # without a pod restart. Previews are experimental and exist only in the
            # checkout they were written to, so no other overlay sets this.
            - name: TCAB_BACKEND_INGEST_PREVIEWS
              value: "true"
            # Export to the in-cluster Grafana LGTM stack (the observability
            # component). In-namespace Service DNS; the same value in every overlay.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
            # The test suites checkout of the mounted superproject.
            - name: TCAB_BACKEND_CHECKOUT
              value: "/checkout/test-suites"
          volumeMounts:
            - name: checkout
              mountPath: /checkout
              readOnly: true
      volumes:
        - name: checkout
          hostPath:
            path: /repo
            type: Directory
