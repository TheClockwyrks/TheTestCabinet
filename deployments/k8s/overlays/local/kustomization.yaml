# Local k3d overlay — the development mirror of a Kubernetes deployment.
#
# It deploys the WHOLE run topology — the backend (stateful), the dispatcher,
# the artifact and repos services, and the driver/dispatcher RBAC — reusing the same flat
# manifests staging/prod use and overriding only what differs locally: the
# namespace, locally-built images, the TCAB_ENV tag, dev secrets, a read-only
# mount of the repository checkout the backend ingests from, and an Azurite blob
# emulator in place of the environment's Blob containers and R2 bucket. The repos
# service names no GitHub organization or token here, so a local publish answers
# 503 and nothing local reaches GitHub.
#
# With the dispatcher + driver/artifacts in the cluster, a run enqueued at the
# backend schedules as a per-run driver Job in-cluster — full local/deploy parity,
# no host worker. (The cluster's ingest CronJob and NetworkPolicies are omitted —
# see the delete patches below: the Makefile ingests from the mounted checkout, and
# a local single-node CNI usually does not enforce NetworkPolicy.)
#
# Brought up/down with one command via ../../../local/Makefile (`make local-up`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcab-local

# Compose from the shared base directory, exactly as the staging/prod overlays do
# (the base lives in a sibling `base/` dir, not a parent, so kustomize does not
# flag an overlay→ancestor cycle). The shared Namespace object from ../../cluster is
# renamed to `tcab-local` by the `namespace:` directive above, so the overlay needs
# no namespace.yaml of its own.
resources:
  - ../../base
  # The Namespace and the observability stack's node-metrics grant are cluster-scoped,
  # so they live under ../../cluster rather than in the base and its components.
  - ../../cluster/namespace
  - ../../cluster/observability
  # The Azurite blob emulator: the object store of the artifacts and repos services
  # here, the artifacts service's run-tree container and the public dataset's
  # container (patch-artifacts.yaml), and the repos service's bundle container
  # (patch-repos.yaml).
  - azurite.yaml

# Stand the in-cluster Grafana LGTM stack up alongside the run topology (it replaces
# the LGTM the devcontainer's docker-compose used to ship). The patch-*.yaml files
# below point every workload's OTEL_EXPORTER_OTLP_ENDPOINT at its `tcab-lgtm` Service,
# so a `make local-up` cluster observes its own traces/metrics/logs. Reach Grafana
# (and the OTLP port, for host/devcontainer processes) with
# `make -C deployments/local local-grafana`.
#
# The web console is deliberately NOT served in the cluster locally (staging and prod
# serve it behind the edge component). Baking the console
# into an in-cluster pod forces a full image rebuild + re-import on every UI edit,
# which makes iterating on the console painfully slow. Locally we run it straight from
# source instead: `npm run dev` in console.testcabinet.ai/ serves it on 127.0.0.1:1430 and proxies
# `/api`, `/artifacts` and `/arena` of its own origin to the backend/artifacts/arena
# `make local-forward` exposes on localhost (that repository's apps/web/vite.config.ts), adding the
# `Cf-Access-Authenticated-User-Email` header (`dev@local` by default) that each
# service takes the identity from, since this overlay sets no TCAB_ACCESS_* variable.
components:
  - ../../components/observability

# Use the images the Makefile builds and `k3d image import`s into the cluster.
# A non-`:latest` tag makes the kubelet's default pull policy IfNotPresent, so it
# uses the imported image instead of trying to pull from a registry.
images:
  - name: REPLACE_REGISTRY/tcab-backend
    newName: tcab-backend
    newTag: local
  - name: REPLACE_REGISTRY/tcab-dispatcher
    newName: tcab-dispatcher
    newTag: local
  - name: REPLACE_REGISTRY/tcab-driver
    newName: tcab-driver
    newTag: local
  - name: REPLACE_REGISTRY/tcab-artifacts
    newName: tcab-artifacts
    newTag: local
  - name: REPLACE_REGISTRY/tcab-repos
    newName: tcab-repos
    newTag: local
  - name: REPLACE_REGISTRY/tcab-arena
    newName: tcab-arena
    newTag: local

# Secrets are deliberately NOT generated here — a secretGenerator would bake the
# values into this tracked file. The Makefile creates them in-cluster from the host
# ENVIRONMENT instead (`make -C deployments/local secrets`, run automatically by
# `local-up`), so no API key or token is ever written to disk:
#   - tcab-backend-secrets / tcab-dispatcher-secrets — the shared
#     TCAB_BACKEND_SERVICE_TOKEN (a fixed dev default, overridable via $SERVICE_TOKEN),
#     so the dispatcher can claim jobs; the backend's copy also carries
#     TCAB_OPENROUTER_API_KEY (from $OPENROUTER_API_KEY, when set) so model
#     probes work locally.
#   - tcab-driver-secrets — the harness provider API key(s) read from
#     $ANTHROPIC_API_KEY / $OPENAI_API_KEY / $OPENROUTER_API_KEY.
# The manifests reference these by fixed name; the Makefile creates them with those
# exact names (no hash suffix), so the references match. The backend's R2
# keys stay absent locally (the backend skips the snapshot upload when unset), and
# the artifacts service's public store is an Azurite container instead.

patches:
  # Per-environment overrides for the always-on workloads (TCAB_ENV, the repo mount,
  # the local namespaces + driver image, etc.).
  - path: patch-backend.yaml
  - path: patch-dispatcher.yaml
  - path: patch-artifacts.yaml
  - path: patch-repos.yaml
  - path: patch-arena.yaml

  # Drop the base resources the local stack does without. The Makefile force-ingests
  # the catalog from the mounted checkout, so the ingest CronJob is redundant; and a
  # single-node k3d CNI does not enforce NetworkPolicy, so the base policies are
  # inert here — remove them rather than ship dead objects. Each delete targets a
  # single resource by kind+name so it matches regardless of namespace.
  - target:
      kind: CronJob
      name: tcab-ingest
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: tcab-ingest
  - target:
      kind: NetworkPolicy
      name: tcab-default-deny-ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tcab-default-deny-ingress
  - target:
      kind: NetworkPolicy
      name: tcab-allow-services-from-runners
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tcab-allow-services-from-runners
  - target:
      kind: NetworkPolicy
      name: tcab-allow-artifacts-from-drivers
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tcab-allow-artifacts-from-drivers
  - target:
      kind: NetworkPolicy
      name: tcab-allow-repos-from-callers
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tcab-allow-repos-from-callers
  - target:
      kind: NetworkPolicy
      name: tcab-allow-driver-from-sandbox
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tcab-allow-driver-from-sandbox
  # The observability component's allow-lgtm policy is likewise inert on k3d's CNI;
  # drop it too rather than ship a dead object (the LGTM Service is still reachable —
  # nothing enforces the default-deny it would punch through).
  - target:
      kind: NetworkPolicy
      name: tcab-allow-lgtm-from-producers
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: tcab-allow-lgtm-from-producers
