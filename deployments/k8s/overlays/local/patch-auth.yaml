# Local auth-service override: tag the environment. Everything else (its own
# `state` PVC, bind address, SQLite accounts DB) carries over from the base
# manifest unchanged.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-auth
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: auth
          env:
            - name: TCAB_ENV
              value: "local"
            # Export to the in-cluster Grafana LGTM stack (the observability component).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
