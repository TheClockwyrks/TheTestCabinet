# Local dispatcher overrides: tag the environment, point the namespaces at the
# local namespace, set TCAB_DRIVER_IMAGE to the locally-imported driver image (an
# env value, so the kustomize images transformer cannot reach it), and raise the
# sandbox pod's memory limit above the base 4Gi so the heaviest cases fit. Everything
# else (the service token from the generated secret, the remaining resource
# passthroughs) carries over from the base manifest unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_ENV
              value: "local"
            # Export to the in-cluster Grafana LGTM stack (the observability
            # component). The dispatcher forwards this endpoint (and TCAB_ENV) into
            # every per-run driver Job, so run/driver spans land in LGTM too.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
            - name: TCAB_DISPATCHER_NAMESPACE
              value: "tcab-local"
            - name: TCAB_K8S_NAMESPACE
              value: "tcab-local"
            # Raise the per-sandbox memory limit above the base 4Gi (the request stays
            # at the base 1Gi, so scheduling is unaffected — this only lifts the OOM
            # ceiling). The heaviest cases blow past 4Gi: a dual-contouring field
            # samples at a 0.5 cell, so the `double`-size variant of a DC case (e.g.
            # aegis-dc-anim at 240x220x300) is a ~129M-node field — ~1.5GB per part for
            # the field arrays plus the DC vertex grid, before the extracted mesh, the
            # Mesa/llvmpipe preview renderer, and the agent process share the same pod.
            # At 4Gi those runs get OOM-killed, which surfaces as an Infrastructure
            # failure. Forwarded verbatim into each driver Job like the base passthrough.
            # The k3d node is the host Docker daemon, so the host must have the RAM.
            - name: TCAB_K8S_RUN_MEMORY_LIMIT
              value: "8Gi"
            # The driver image the Makefile builds + imports (tag `local` ⇒ the
            # kubelet's IfNotPresent default uses the imported image, no pull).
            - name: TCAB_DRIVER_IMAGE
              value: "tcab-driver:local"
            # Resolve the RUN-CONTAINER images from the locally-built+imported set the
            # `run-images` target produces, instead of the compiled default
            # (ghcr.io/theclockwyrks/…:latest). The dispatcher forwards these into
            # every driver Job, where core's resolve_run_image composes
            # <registry>/test-cabinet-<kind>:<tag> — e.g.
            # docker.io/library/test-cabinet-voxel-animation:local — matching the
            # names `run-images` imports (RUN_IMAGE_PREFIX/RUN_IMAGE_TAG). The `local`
            # tag (not `latest`) is what makes the kubelet's IfNotPresent default use
            # the imported image rather than trying to pull it. Without this override a
            # run pod would pull the published ghcr image and a local change to the
            # baked-in tooling (voxel-anim/draw/…) would never reach a run.
            - name: TCAB_CONTAINER_REGISTRY
              value: "docker.io/library"
            - name: TCAB_CONTAINER_TAG
              value: "local"
            # Subscription auth: point the dispatcher at the OPTIONAL
            # tcab-driver-subscription Secret the Makefile's `secrets` target builds
            # from the host's signed-in CLI credential files. The Secret is mounted
            # with optional:true, so when it is absent (no subscription creds on the
            # host) driver pods still run API-key-only. Leaving the mode at Auto is
            # enough to exercise it locally: with the subscription creds present and
            # no API key, the engine prefers subscription on its own — so
            # TCAB_DISPATCHER_DRIVER_AUTH_MODE stays commented.
            - name: TCAB_DISPATCHER_DRIVER_SUBSCRIPTION_SECRET
              value: "tcab-driver-subscription"
            - name: TCAB_DISPATCHER_DRIVER_SUBSCRIPTION_DIR
              value: "/var/run/tcab/subscription"
            # - name: TCAB_DISPATCHER_DRIVER_AUTH_MODE
            #   value: "subscription"
