# Local dispatcher overrides: tag the environment, point the namespaces at the
# local namespace, and set TCAB_DRIVER_IMAGE to the locally-imported driver image
# (an env value, so the kustomize images transformer cannot reach it). Everything
# else (the service token from the generated secret, the resource passthroughs)
# carries over from the base manifest unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_ENV
              value: "local"
            - name: TCAB_DISPATCHER_NAMESPACE
              value: "tcab-local"
            - name: TCAB_K8S_NAMESPACE
              value: "tcab-local"
            # The driver image the Makefile builds + imports (tag `local` ⇒ the
            # kubelet's IfNotPresent default uses the imported image, no pull).
            - name: TCAB_DRIVER_IMAGE
              value: "tcab-driver:local"
            # Subscription auth: point the dispatcher at the OPTIONAL
            # tcab-driver-subscription Secret the Makefile's `secrets` target builds
            # from the host's signed-in CLI credential files. The Secret is mounted
            # with optional:true, so when it is absent (no subscription creds on the
            # host) driver pods still run API-key-only. Leaving the mode at Auto is
            # enough to exercise it locally: with the subscription creds present and
            # no API key, the engine prefers subscription on its own — so
            # TCAB_DISPATCHER_DRIVER_AUTH_MODE stays commented.
            - name: TCAB_DISPATCHER_DRIVER_SUBSCRIPTION_SECRET
              value: "tcab-driver-subscription"
            - name: TCAB_DISPATCHER_DRIVER_SUBSCRIPTION_DIR
              value: "/var/run/tcab/subscription"
            # - name: TCAB_DISPATCHER_DRIVER_AUTH_MODE
            #   value: "subscription"
