# TCAB_DRIVER_IMAGE is an env value (not a container image: field), so the images
# transformer cannot reach it — patch it to the driver image the staging cluster
# pulls. Keep it in lockstep with the dispatcher image tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DRIVER_IMAGE
              value: "testcabinet.azurecr.io/tcab-driver:REPLACE_SHA"
            # The run-container images come from the same commit, pulled from the
            # compiled default registry (testcabinet.azurecr.io).
            - name: TCAB_CONTAINER_TAG
              value: "REPLACE_SHA"
