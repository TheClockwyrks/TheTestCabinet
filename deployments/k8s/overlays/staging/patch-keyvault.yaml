# Repoint the shared keyvault-csi component at the STAGING Key Vault + STAGING managed
# identity. The component bakes in prod's vault name (testcabinet-clockwyrks) and
# managed-identity clientID (8a5a62e4…); these strategic-merge patches override the two
# values that differ per environment while leaving the `objects`/`secretObjects` maps
# (identical to prod) untouched. The tenantId is the SAME directory, so it is not
# patched.
#
#   Staging vault:     testcabinet-staging     (RG testcabinet-staging-westus2-rg)
#   Staging identity:  tcab-keyvault-sync-staging
#     clientID:        6ba7f9a0-6d87-463a-ae2f-4d88cf0670d8
#     federated to:    system:serviceaccount:tcab-staging:tcab-keyvault-sync
#     granted:         Key Vault Secrets User on the staging vault
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tcab-keyvault
  # the component pins tcab-prod; this overlay's `namespace:` directive retargets it
  namespace: tcab-prod
spec:
  parameters:
    keyvaultName: "testcabinet-staging"
    clientID: "6ba7f9a0-6d87-463a-ae2f-4d88cf0670d8"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-keyvault-sync
  namespace: tcab-prod
  annotations:
    # The staging managed identity's CLIENT id (same value as the SecretProviderClass
    # clientID above).
    azure.workload.identity/client-id: "6ba7f9a0-6d87-463a-ae2f-4d88cf0670d8"
