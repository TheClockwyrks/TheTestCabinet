# The repos service's Blob identity in STAGING: the user-assigned managed identity
# holding Storage Blob Data Contributor on the bundle container, federated to
# system:serviceaccount:tcab-staging:tcab-repos through the testcabinet-staging-westus2-aks
# OIDC issuer (Run plane, apps/docs/src/content/docs/deployment/kubernetes/run-plane.md
# "Repos service"; the repos service's page, components/repos/overview.md "Storage").
#
#   Storage account tcabstagingstore (RG testcabinet-staging-westus2-rg), private container bundles
#   Identity        tcab-repos-staging
#   Federated cred  tcab-staging-tcab-repos
#
# The container is provisioned with the account, so the service only lists it at
# start-up (an identity not provisioned or not federated keeps the pod unready).
#
# The `azure.workload.identity/use` pod label is what makes the webhook project the
# identity's token and variables. The local overlay carries neither, so its pod signs
# with Shared Key against Azurite.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-repos
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
  annotations:
    azure.workload.identity/client-id: "bc2b3532-ff1a-4366-b6c8-11d8a16c49e4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-repos
  namespace: tcab-prod
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      containers:
        - name: repos
          env:
            - name: TCAB_REPOS_BLOB_ACCOUNT
              value: "tcabstagingstore"
