# Set the in-cluster web console's runtime backend URL to the backend's route on the
# environment's origin, https://console.staging.testcabinet.ai/api, which the edge routes to tcab-backend.
#
# The single tcab-web image is environment-agnostic (one build per git-sha), so the
# backend URL is injected at RUNTIME via env: the image's entrypoint `envsubst`s a
# /config.js the SPA reads (window.__TCAB_CONFIG__). The components/web Deployment
# (nested in the edge component) ships the env key with an empty default.
#
# Interim: the console is same-origin with every service it uses and is to address
# them relatively, carrying no service URL (Edge page, "Hostnames and paths"); this
# patch and the variable go once the console does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: TCAB_WEB_BACKEND_URL
              value: "https://console.staging.testcabinet.ai/api"
