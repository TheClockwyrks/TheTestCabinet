# Set the in-cluster web console's runtime config to the staging internal-ingress https
# hostnames (mirrors prod, staging hosts).
#
# The single tcab-web image is environment-agnostic (one build per git-sha), so the
# backend URL is injected at RUNTIME via env: the image's entrypoint `envsubst`s a
# /config.js the SPA reads (window.__TCAB_CONFIG__). The components/web Deployment
# (pulled in by the internal-ingress component) ships the env key with an empty
# default; this patches it to the staging https name the ingress routes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: TCAB_WEB_BACKEND_URL
              value: "https://api.staging.tcab.testcabinet.ai"
