# Staging overlay.
#
# Staging is the SAME manifests prod uses, so it rehearses prod faithfully; only
# the namespace, the TCAB_ENV tag, and the image tag differ. The `namespace`
# directive rewrites every resource (including the Namespace object) to
# `tcab-staging`; the patches retag TCAB_ENV; the images block pins every image to
# the Test Cabinet ACR at REPLACE_SHA, the staging commit whose images to run.
#
# Apply with:  kubectl apply -k deployments/k8s/overlays/staging
# (after creating the real Secrets — see deployments/k8s/base/secrets.example.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcab-staging

resources:
  - ../../base
  # The Namespace and the observability stack's node-metrics grant are cluster-scoped,
  # so they live under ../../cluster rather than in the base and its components.
  - ../../cluster/namespace
  - ../../cluster/observability

# Run the observability stack (Grafana LGTM) in-cluster. patch-env.yaml sets each
# workload's OTEL_EXPORTER_OTLP_ENDPOINT to the `tcab-lgtm` Service this adds.
components:
  - ../../components/observability

# Retag TCAB_ENV (which the base sets to `prod`) and the dispatcher's driver-image
# env value to staging values, and point every workload at the in-cluster collector.
# patch-env.yaml is a multi-doc strategic merge, one doc per workload keyed by name,
# so kustomize merges only the named env vars.
patches:
  - path: patch-env.yaml
  - path: patch-dispatcher-driver-image.yaml
  # Enable in-cluster publishing: point the dispatcher at the tcab-publisher image
  # (an env VALUE the images: transformer can't reach) and its credential Secret.
  - path: patch-dispatcher-publisher.yaml

images:
  - name: REPLACE_REGISTRY/tcab-backend
    newName: testcabinet.azurecr.io/tcab-backend
    newTag: REPLACE_SHA
  - name: REPLACE_REGISTRY/tcab-auth-service
    newName: testcabinet.azurecr.io/tcab-auth-service
    newTag: REPLACE_SHA
  - name: REPLACE_REGISTRY/tcab-dispatcher
    newName: testcabinet.azurecr.io/tcab-dispatcher
    newTag: REPLACE_SHA
  - name: REPLACE_REGISTRY/tcab-driver
    newName: testcabinet.azurecr.io/tcab-driver
    newTag: REPLACE_SHA
  - name: REPLACE_REGISTRY/tcab-artifacts
    newName: testcabinet.azurecr.io/tcab-artifacts
    newTag: REPLACE_SHA
  - name: REPLACE_REGISTRY/tcab-arena
    newName: testcabinet.azurecr.io/tcab-arena
    newTag: REPLACE_SHA
  # The publisher image is referenced as an env VALUE (TCAB_PUBLISHER_IMAGE in
  # patch-dispatcher-publisher.yaml), not a container image: field, so this entry
  # rewrites nothing today — it is kept so the registry/tag set stays complete.
  - name: REPLACE_REGISTRY/tcab-publisher
    newName: testcabinet.azurecr.io/tcab-publisher
    newTag: REPLACE_SHA
