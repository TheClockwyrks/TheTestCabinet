# Staging on managed PostgreSQL — a faithful mirror of overlays/prod.
#
# Same components and patches as prod, so staging rehearses prod exactly; only the
# namespace, TCAB_ENV, the resources it points at (staging Key Vault, staging
# Postgres, *.staging.tcab.testcabinet.ai hostnames, the staging GitHub org +
# Cloudflare Pages project) differ.
#
# Kustomize applies `components` before this overlay's own `patches`, and the
# `namespace:` directive retargets every resource (and every patch target, which
# is matched BEFORE the namespace transformer runs) to tcab-staging.
#
# The pipeline deploys it from `staging`, in the workspace template's deployment job:
# scripts/ci/pre-deploy.sh pins it in place with scripts/ci/pin-images.sh (every Test
# Cabinet image in the `images:` block below, and the dispatcher's run images, at the
# commit being deployed), the template's scripts/ci/deploy.sh applies it and waits on
# the-test-cabinet-backend, and scripts/ci/post-deploy.sh settles the rest. Applied as
# it stands, every image is at `unpinned`, a tag nothing pushes, so it fails to pull.
# Every object it renders is namespaced; the Namespace and the other cluster-scoped
# objects are ../../cluster/azure-staging, applied by hand (see "Cluster
# prerequisites" in ../../README.md).
#
# Prerequisites (out of band, mirroring prod / the runbook):
#   - the staging Key Vault holds every secret the keyvault-csi SecretProviderClass
#     lists (see .env.staging + the upload commands), and the tcab-keyvault-sync
#     managed identity (clientID in patch-keyvault.yaml) is federated + granted get;
#   - ingress-nginx (internal Azure LB) + cert-manager are Helm-installed on the
#     staging cluster, and the *.staging.tcab.testcabinet.ai names resolve to the
#     internal LB over the VPN via Azure Private DNS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcab-staging

resources:
  - ../../base

components:
  - ../../components/postgres
  # In-cluster Grafana LGTM stack. Listed AFTER postgres so it layers onto the
  # backend/auth Deployments postgres swaps in; patch-env sets each workload's
  # OTEL_EXPORTER_OTLP_ENDPOINT to the tcab-lgtm Service it adds.
  - ../../components/observability
  # Populate the Kubernetes Secrets from the STAGING Key Vault via the Secrets Store
  # CSI driver + Workload Identity. patch-keyvault.yaml repoints the vault name +
  # managed-identity clientID from prod's to staging's.
  - ../../components/keyvault-csi
  # Serve the console + expose the four services over the INTERNAL (VPN-only) ingress
  # at *.staging.tcab.testcabinet.ai. The component defaults to the prod hostnames;
  # the JSON6902 patches below retarget each Ingress host, and patch-web-config.yaml /
  # patch-backend-public-urls.yaml repoint the runtime URLs.
  - ../../components/internal-ingress
  # Passwordless (Microsoft Entra managed-identity) Postgres auth for backend + auth.
  # ENABLED at the staging CUTOVER (v0.6.0): the pinned image carries the db-auth
  # code, the in-DB Entra service principals (tcab-{backend,auth}-db-staging) exist,
  # and the DB-URL Secret is the passwordless form. See components/postgres-azure-ad
  # and the deployment runbook. Paired with patch-db-workload-identity below (which
  # repoints the baked-in prod DB-auth clientIDs to the staging identities).
  - ../../components/postgres-azure-ad

# Every Test Cabinet image, at the Test Cabinet ACR and the tag `unpinned`, which
# nothing pushes: applied as it stands, the overlay fails to pull rather than running
# whatever a moving tag last named. scripts/ci/pin-images.sh rewrites each newTag to
# the commit being deployed (and adds the dispatcher's run-image environment) before
# anything applies it. The backend's repository is `the-test-cabinet-backend`, the name
# the workspace template's publish and deploy stages use; the other seven keep their
# `tcab-*` names.
images:
  - name: REPLACE_REGISTRY/tcab-backend
    newName: testcabinet.azurecr.io/the-test-cabinet-backend
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-auth-service
    newName: testcabinet.azurecr.io/tcab-auth-service
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-dispatcher
    newName: testcabinet.azurecr.io/tcab-dispatcher
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-driver
    newName: testcabinet.azurecr.io/tcab-driver
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-artifacts
    newName: testcabinet.azurecr.io/tcab-artifacts
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-arena
    newName: testcabinet.azurecr.io/tcab-arena
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-publisher
    newName: testcabinet.azurecr.io/tcab-publisher
    newTag: unpinned
  - name: REPLACE_REGISTRY/tcab-web
    newName: testcabinet.azurecr.io/tcab-web
    newTag: unpinned

patches:
  # Retag TCAB_ENV to staging + point every workload at the in-cluster collector, and
  # retarget the dispatcher's sandbox/Job namespace to tcab-staging.
  - path: patch-env.yaml
  # In-cluster publishing: the publisher credential Secret, plus the STAGING
  # GitHub org + Cloudflare Pages project the dispatcher forwards into publish Jobs.
  - path: patch-dispatcher-publisher.yaml
  # Subscription auth (Codex + Claude Code), identical to prod.
  - path: patch-dispatcher-subscription.yaml
  # Repoint the backend's advertised data-plane URLs to the staging https hostnames.
  - path: patch-backend-public-urls.yaml
  # Set the in-cluster console's runtime backend/auth URLs to the staging https names.
  - path: patch-web-config.yaml
  # Lock down Grafana (identical to prod) before the ingress exposes it.
  - path: patch-grafana-auth.yaml
  # Catalog ingest sidecar in the backend pod (tracks the `staging` branch tip so pushed
  # catalog/reference changes refresh on demand) + suspend the superseded base CronJob.
  - path: patch-backend-ingest.yaml
  - path: patch-suspend-ingest-cronjob.yaml
  # Repoint the keyvault-csi SecretProviderClass + sync SA at the staging vault +
  # staging managed identity (prod's are baked into the shared component).
  - path: patch-keyvault.yaml
  # Repoint the postgres-azure-ad workload-identity SAs at the staging DB identities.
  # ENABLED with the ../../components/postgres-azure-ad line above at the staging
  # cutover (a patch for an absent SA would otherwise error).
  - path: patch-db-workload-identity.yaml
  # Retarget each internal-ingress host from *.tcab to *.staging.tcab.testcabinet.ai.
  # JSON6902 (not strategic merge) so the single-element rules/tls lists are replaced
  # surgically rather than merged.
  - target: { kind: Ingress, name: tcab-console }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: console.staging.tcab.testcabinet.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: console.staging.tcab.testcabinet.ai
  - target: { kind: Ingress, name: tcab-api }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.tcab.testcabinet.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.tcab.testcabinet.ai
  - target: { kind: Ingress, name: tcab-auth }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.staging.tcab.testcabinet.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth.staging.tcab.testcabinet.ai
  - target: { kind: Ingress, name: tcab-artifacts }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: artifacts.staging.tcab.testcabinet.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: artifacts.staging.tcab.testcabinet.ai
  - target: { kind: Ingress, name: tcab-arena }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: arena.staging.tcab.testcabinet.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: arena.staging.tcab.testcabinet.ai
  - target: { kind: Ingress, name: tcab-grafana }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: grafana.staging.tcab.testcabinet.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: grafana.staging.tcab.testcabinet.ai
