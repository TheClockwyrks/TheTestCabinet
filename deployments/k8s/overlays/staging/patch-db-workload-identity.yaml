# Repoint the postgres-azure-ad component's workload-identity ServiceAccount at the
# STAGING managed identity. The component bakes prod's DB-auth identity clientID;
# this strategic-merge patch overrides just the clientID annotation, exactly as
# patch-keyvault.yaml does for the secret-sync SA.
#
#   Staging identity (RG testcabinet-staging-westus2-rg):
#     tcab-backend-db-staging  clientID 4b10688a-40ae-42d0-9437-03f0af85ce6f
#       → mapped Postgres role on database tcab_backend
#   Federated to system:serviceaccount:tcab-staging:tcab-backend via the staging
#   cluster's OIDC issuer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-backend
  # the component pins tcab-prod; this overlay's `namespace:` directive retargets it
  namespace: tcab-prod
  annotations:
    azure.workload.identity/client-id: "4b10688a-40ae-42d0-9437-03f0af85ce6f"
