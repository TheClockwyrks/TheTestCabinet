# Catalog ingest sidecar (staging): the two values ../../components/catalog-ingest leaves
# to the overlay. The component's kustomization.yaml and its ingest.sh describe the
# sidecar itself; the prod overlay's copy of this patch differs in these values alone.
#
# Every pipeline deploy changes the backend's image tag, so every deploy starts a new
# backend pod and the sidecar with it. The sidecar brings /state/checkout to the tip
# of the branch below on the GitHub mirror, which the pipeline pushed before it
# deployed, and its cold-storage submodule to the commit that tip pins, then asks the
# backend for one forced ingest. The deploy checks that both are fetchable before it
# applies anything, and reads the sidecar's result once the rollout is ready
# (scripts/ci/catalog-ingest.sh); a sidecar that could not fetch ingests nothing, so
# the backend keeps the catalog and the baselines it had.
#
# /state is a PVC (components/postgres/deployment-backend.yaml). On a warm volume the
# store is already populated, so the backend is ready and serving while the sidecar
# works, and stays so when it fails. On a cold one (a first deploy, a replaced disk)
# the sidecar's ingest is what fills the store, and /readyz holds the backend out of
# its Service until it lands.
#
# The sidecar ingests once per pod start. Catalog changes between deploys are
# published on demand with `scripts/reingest-cluster.sh --env staging`.
#
# TCAB_INGEST_BRANCH is `staging`, the branch the pipeline deploys to staging: a stable
# branch, never a release tag. Keep it == TCAB_INGEST_BRANCH in scripts/lib/env.sh,
# which scripts/reingest-cluster.sh and the deploy's checks read.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-test-cabinet-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: ingest
          env:
            - name: TCAB_INGEST_BRANCH
              value: staging
            - name: TCAB_INGEST_ENV
              value: staging
