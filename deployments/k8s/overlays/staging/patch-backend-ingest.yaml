# Catalog ingest sidecar (staging) — identical to prod EXCEPT the branch
# differs (staging ingests `staging`, prod ingests `master`).
#
# The shipped base `tcab-ingest` CronJob cannot work in this deployment (the
# default-deny NetworkPolicy blocks a standalone pod from reaching tcab-backend:8787,
# and it clones into its own emptyDir the backend never reads). This co-locates ingest
# INSIDE the backend pod as a sidecar: it shares the `state` volume (writing the
# /state/checkout the backend ingests) and calls POST /ingest over localhost — intra-pod
# traffic, so the NetworkPolicy never applies and no service token / extra route is
# needed. It runs a ONE-SHOT forced ingest on backend start, then idles; every pipeline
# deploy starts a new backend pod, so every deploy re-ingests the branch tip it shipped
# (see the prod copy of this patch). /state is a PVC (see
# components/postgres/deployment-backend.yaml), so on a cold volume (first deploy,
# replaced disk) this is what fills the store, and /readyz holds the pod out of its
# Service until it lands.
#
# SUBMODULES: after the superproject, the sidecar updates its two submodules, each in
# its own step: cold-storage shallowly (the baseline media), and the test suites at the
# commit the branch names. .gitmodules names the test suites repository relative to
# the superproject (`../test-suites`), so against the GitHub mirror this clones from it
# resolves to the mirror's sibling repository. The sidecar rewrites that address to the
# Azure Repos HTTPS one and answers git's credential request from the read-only token
# mounted out of the `tcab-test-suites-credential` Secret (keyvault-csi, uploaded by
# deployments/k8s/secrets/upload-test-suites-credential.sh). The rewrite and the helper
# live in this container's global git config, so the on-demand refresh `tcab ingest
# --env staging` runs through `kubectl exec` authenticates the same way.
#
# BRANCH: ingest the `staging` branch TIP, so a fresh pod, `tcab ingest --env staging`,
# and a publish to staging from The Spec Cabinet pick up pushed catalog, test suite, and
# reference-build lockfile updates on demand. It is a stable BRANCH, never a release tag
# like `v0.5.0`, which does not exist while that release is still being tested on
# staging. Keep BRANCH == TCAB_INGEST_BRANCH in scripts/lib/env.sh.
#
# The refresh commands below are the ones crates/core/src/remote_backend.rs
# (`refresh_commands`) runs on demand; keep the two in step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-test-cabinet-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: ingest
          image: alpine:3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # Keep == TCAB_INGEST_BRANCH in scripts/lib/env.sh (the branch a refresh fetches).
              BRANCH=staging
              until apk add --no-cache git curl; do
                echo "ingest: apk add failed, retrying in 5s"; sleep 5
              done
              REPO=https://github.com/TheClockwyrks/TheTestCabinet.git
              CHECKOUT=/state/checkout
              # The test suites submodule's address as `../test-suites` resolves against
              # REPO, and the Azure Repos HTTPS address the read-only token authenticates to.
              SUITES_MIRROR=https://github.com/TheClockwyrks/test-suites
              SUITES_HTTPS=https://dev.azure.com/genyume/the-test-cabinet/_git/test-suites
              TOKEN_FILE=/var/run/secrets/test-suites/token
              export GIT_TERMINAL_PROMPT=0
              git config --global url."$SUITES_HTTPS".insteadOf "$SUITES_MIRROR"
              git config --global credential."https://dev.azure.com".helper \
                "!f() { if [ \"\$1\" = get ]; then echo username=tcab; printf 'password=%s\n' \"\$(cat $TOKEN_FILE)\"; fi; }; f"
              [ -s "$TOKEN_FILE" ] || echo "ingest: $TOKEN_FILE is empty or absent; the test suites submodule cannot be fetched"
              # One-shot: check out the catalog branch tip and its submodules, then
              # trigger a single forced ingest. No periodic loop. Refresh the live checkout
              # if one survives a lone sidecar restart, else clone the branch fresh.
              if [ -d "$CHECKOUT/.git" ]; then
                echo "ingest: refreshing $CHECKOUT to origin/$BRANCH"
                git -C "$CHECKOUT" fetch --depth 1 origin "$BRANCH" \
                  && git -C "$CHECKOUT" reset --hard FETCH_HEAD \
                  || echo "ingest: refresh failed"
              else
                echo "ingest: cloning catalog branch $BRANCH into $CHECKOUT"
                rm -rf "$CHECKOUT" \
                  && git clone --depth 1 --branch "$BRANCH" "$REPO" "$CHECKOUT" \
                  || echo "ingest: clone failed"
              fi
              # Sync first so a moved submodule URL reaches the persistent checkout.
              git -C "$CHECKOUT" submodule sync --recursive \
                || echo "ingest: submodule sync failed"
              # The cold-storage submodule holds every version's baseline validation
              # media, which ingest copies into the store. Fetch the pinned commit
              # shallowly on every refresh. `.gitmodules` names it relative to the
              # superproject, so it resolves to the mirror's sibling repository. A
              # failure still ingests, with no baseline media, rather than leaving the
              # store empty.
              echo "ingest: updating the cold-storage submodule"
              git -C "$CHECKOUT" submodule update --init --depth 1 cold-storage \
                || echo "ingest: cold-storage update failed; ingesting without baselines"
              # The test suites submodule, at the commit the branch names. Its own step,
              # so a missing token costs the suites and not the baselines or the catalog.
              echo "ingest: updating the test suites submodule"
              git -C "$CHECKOUT" submodule update --init --recursive --force test-suites \
                || echo "ingest: test suites update failed; ingesting without them"
              git -C "$CHECKOUT" submodule status --recursive || true
              # Wait on /healthz (LIVENESS), never /readyz: readiness is 503 until the
              # store is populated, which is what the POST below is about to do, so
              # gating on it would deadlock the sidecar against itself.
              echo "ingest: waiting for backend healthz"
              until curl -fsS -o /dev/null http://127.0.0.1:8787/healthz; do sleep 3; done
              n=0
              until curl -fsS -X POST http://127.0.0.1:8787/ingest \
                     -H 'content-type: application/json' -d '{"force": true}' >/dev/null; do
                n=$((n + 1))
                if [ "$n" -ge 10 ]; then
                  echo "ingest: POST /ingest failed 10x; giving up (run tcab ingest --env staging)"
                  break
                fi
                echo "ingest: POST /ingest failed, retry $n in 10s"; sleep 10
              done
              [ "$n" -lt 10 ] && echo "ingest: triggered ok"
              exec sleep infinity
          volumeMounts:
            - name: state
              mountPath: /state
            - name: test-suites-credential
              mountPath: /var/run/secrets/test-suites
              readOnly: true
          resources:
            # MEMORY REQUEST == LIMIT, and the ceiling raised from 128Mi to 256Mi —
            # same reasoning as the prod overlay's copy of this patch, and staging is
            # where the 82Mi peak that motivated it was actually measured.
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        # Optional, so a backend whose credential has not been uploaded yet still starts
        # and ingests the rest of the catalog; the sidecar names the missing token.
        - name: test-suites-credential
          secret:
            secretName: tcab-test-suites-credential
            optional: true
