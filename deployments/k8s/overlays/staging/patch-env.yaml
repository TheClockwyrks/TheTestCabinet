# Retag TCAB_ENV from the base's `prod` to `staging` on every workload, and point
# each at the in-cluster Grafana LGTM collector (the observability component) by
# setting OTEL_EXPORTER_OTLP_ENDPOINT. Each doc is a strategic-merge patch keyed by
# the workload name + its container name; kustomize merges the env list by the
# `name` field, so only the named vars are touched.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-backend
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
            - name: TCAB_ARTIFACTS_PUBLIC_URL
              value: "http://tcab-artifacts:8790"
            - name: TCAB_ARENA_PUBLIC_URL
              value: "http://tcab-arena:8791"
---
apiVersion: apps/v1
