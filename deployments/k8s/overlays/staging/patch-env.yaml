# Retag TCAB_ENV from the base's `prod` to `staging` on every workload and point each
# at the in-cluster Grafana LGTM collector (OTEL_EXPORTER_OTLP_ENDPOINT). Each doc is a
# strategic-merge patch keyed by the workload name + container; kustomize merges the env
# list by `name`, so only the named vars are touched.
#
# The backend is `kind: Deployment` here (components/postgres replaced its
# StatefulSet). The Access team domain and audience are in patch-access.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-test-cabinet-backend
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-artifacts
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: artifacts
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-arena
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: arena
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_ENV
              value: "staging"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
            # The base names sandbox pods in tcab-prod; retarget to the staging namespace.
            - name: TCAB_K8S_NAMESPACE
              value: "tcab-staging"
            - name: TCAB_DISPATCHER_NAMESPACE
              value: "tcab-staging"
