# Desktop-app artifact-service override: tag the environment. Everything else (its
# own `artifacts` PVC, bind address, backend/auth URLs) carries over from the base
# manifest unchanged.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-artifacts
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: artifacts
          env:
            - name: TCAB_ENV
              value: "desktop"
