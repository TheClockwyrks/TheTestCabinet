# Production on managed PostgreSQL.
#
# overlays/prod with the components/postgres conversion layered on: the backend and
# auth service run as stateless Deployments backed by an Azure Database for
# PostgreSQL — Flexible Server instance instead of embedded SQLite. Apply INSTEAD of
# overlays/prod. The base and all SQLite overlays (staging, local, app) are untouched.
#
# Same namespace, TCAB_ENV (`prod`, from the base), and image registry as
# overlays/prod; the only difference is the database shape the component supplies.
#
# Apply with:  kubectl apply -k deployments/k8s/overlays/azure-prod
# (after creating the real Secrets — base/secrets.example.yaml for the backend's R2 /
# token keys, and components/postgres/secrets.postgres.example.yaml for the two
# Postgres connection strings, ideally synced from Azure Key Vault.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcab-prod

resources:
  - ../../base

components:
  - ../../components/postgres
  # The in-cluster Grafana LGTM stack. Listed AFTER postgres so it layers onto the
  # backend/auth Deployments postgres swaps in; patch-otel.yaml below sets each
  # workload's OTEL_EXPORTER_OTLP_ENDPOINT to the `tcab-lgtm` Service it adds.
  - ../../components/observability
  # Populate the deployment's Kubernetes Secrets from Azure Key Vault via the
  # Secrets Store CSI driver + Workload Identity (no real Secret manifests in git).
  # Fill REPLACE_IDENTITY_CLIENT_ID in the component after creating the managed
  # identity; see the runbook.
  - ../../components/keyvault-csi
  # Serve the web console in-cluster and expose it + the four services over an
  # INTERNAL (VPN-reachable, never public) ingress-nginx at host-per-service
  # `*.testcabinet.ai` names with cert-manager TLS. Adds the tcab-web Deployment +
  # Service, the five Ingress routes, the Let's Encrypt ClusterIssuer, and the
  # ingress-source NetworkPolicy. The component defaults to the prod hostnames /
  # ClusterIssuer email; this overlay patches the runtime console + backend URLs
  # below (patch-web-config.yaml / patch-backend-public-urls.yaml). The ingress-nginx
  # + cert-manager controllers are a Helm-installed cluster prerequisite (task-4).
  - ../../components/internal-ingress
  # Passwordless (Microsoft Entra managed-identity) Postgres auth for backend + auth.
  # COMMENTED until the prod CUTOVER, which is gated on the v0.5.0 image roll (the
  # service pins above still carry db-auth-less images). Turning it on requires that
  # image, the in-DB Entra roles, and the passwordless DB-URL Secret; prod's DB-auth
  # identity clientIDs are baked into the component, so no per-env patch is needed.
  # See components/postgres-azure-ad and the deployment runbook for the cutover order.
  # - ../../components/postgres-azure-ad

# TCAB_DRIVER_IMAGE is an env value, not a container image: field, so the images
# transformer can't reach it — patch it to match the driver image.
patches:
  - path: patch-dispatcher-driver-image.yaml
  - path: patch-otel.yaml
  # Enable subscription auth (Codex + Claude Code) by mounting the
  # tcab-driver-subscription Secret into each driver Job.
  - path: patch-dispatcher-subscription.yaml
  # Enable in-cluster publishing: point the dispatcher at the tcab-publisher image
  # (an env VALUE the images: transformer can't reach) and its credential Secret.
  - path: patch-dispatcher-publisher.yaml
  # Repoint the backend's advertised data-plane URLs (TCAB_ARTIFACTS_PUBLIC_URL /
  # TCAB_ARENA_PUBLIC_URL — env VALUES the images: transformer can't reach) to the
  # internal-ingress https hostnames so console media resolves over the VPN.
  - path: patch-backend-public-urls.yaml
  # Set the in-cluster console's runtime backend/auth URLs (TCAB_WEB_BACKEND_URL /
  # TCAB_WEB_AUTH_URL on the internal-ingress tcab-web pod) to the https hostnames.
  - path: patch-web-config.yaml
  # Lock down Grafana (disable the otel-lgtm image's anonymous-admin default, set
  # admin creds from the tcab-grafana-admin Secret) since the internal-ingress
  # component now exposes it at grafana.tcab.testcabinet.ai over the VPN ingress.
  - path: patch-grafana-auth.yaml
  # Catalog ingest sidecar in the backend pod (shares /state, POSTs /ingest over
  # localhost) — the base CronJob can't reach the backend or share its checkout volume.
  - path: patch-backend-ingest.yaml
  # …and suspend that now-superseded base CronJob so it stops failing every 30 min.
  - path: patch-suspend-ingest-cronjob.yaml

# Same image registry pinning as overlays/prod — pin an immutable :<git-sha> tag
# rather than :latest in a real deployment.
#
# All service images are pinned to ONE git-sha so they version together, currently
# `b3c2b322` (the v0.4.1 build — the changelog-tip commit whose push batch also
# carried the v0.4.1 UI fixes plus the backend/core/entities/migration crate changes,
# so `build-service-images` rebuilt and published multi-arch (amd64+arm64) for every
# service at that sha; the docs-only tip commit shares the push, so the tag rides on
# it). Bumped from the v0.4.0 pin `ba19bd69`.
#
# The RUN-CONTAINER images (test-cabinet-base/-base-wasm/-sprite/-sprite-sheet/-adversarial/
# -performance, plus the voxel/mesh/skin/ui/material/particle/audio kinds) are pinned
# SEPARATELY via TCAB_CONTAINER_TAG in patch-dispatcher-driver-image.yaml and are NOT
# generally in lockstep with the service images — they only rebuild when
# `build-containers` runs. As of the v0.4.1 roll they have DIVERGED: the changes since
# v0.4.0 touched only service crates (backend/core/entities/migration) and the web/UI,
# none of the asset-generation/foray crates `build-containers` watches, so no new run
# image was published and TCAB_CONTAINER_TAG stays at `ba19bd69` while the service
# images move to `b3c2b322`. Still re-pin TCAB_CONTAINER_TAG only to a sha at which
# `build-containers` actually published. Roll the service images — staging before
# prod — when promoting a build.
images:
  - name: REPLACE_REGISTRY/tcab-backend
    newName: ghcr.io/theclockwyrks/tcab-backend
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
  - name: REPLACE_REGISTRY/tcab-auth-service
    newName: ghcr.io/theclockwyrks/tcab-auth-service
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
  - name: REPLACE_REGISTRY/tcab-dispatcher
    newName: ghcr.io/theclockwyrks/tcab-dispatcher
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
  - name: REPLACE_REGISTRY/tcab-driver
    newName: ghcr.io/theclockwyrks/tcab-driver
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
  - name: REPLACE_REGISTRY/tcab-artifacts
    newName: ghcr.io/theclockwyrks/tcab-artifacts
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
  - name: REPLACE_REGISTRY/tcab-arena
    newName: ghcr.io/theclockwyrks/tcab-arena
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
  # The publisher image is referenced as an env VALUE (TCAB_PUBLISHER_IMAGE in
  # patch-dispatcher-publisher.yaml), not a container image: field, so this entry
  # rewrites nothing today — it is kept for parity so the registry/tag set stays
  # complete and a future container-image reference to the publisher is covered.
  - name: REPLACE_REGISTRY/tcab-publisher
    newName: ghcr.io/theclockwyrks/tcab-publisher
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
  # The in-cluster web console image (the internal-ingress component's tcab-web
  # Deployment). One environment-agnostic build per git-sha; the per-env backend/auth
  # URLs are injected at runtime via env, not baked. GHCR package is Public/anonymously
  # pullable.
  - name: REPLACE_REGISTRY/tcab-web
    newName: ghcr.io/theclockwyrks/tcab-web
    newTag: b3c2b32239a21aa9a324d58313a1d56361a25bcd
