# Set the in-cluster web console's runtime config to the internal-ingress https
# hostnames.
#
# The single tcab-web image is environment-agnostic (one build per git-sha), so the
# backend + auth URLs are injected at RUNTIME via env: the image's entrypoint
# `envsubst`s a /config.js the SPA reads (window.__TCAB_CONFIG__). The
# internal-ingress component (web.yaml) ships these env keys with empty defaults; this
# overlay patches them to the prod https names the ingress routes
# (api.tcab.testcabinet.ai → tcab-backend, auth.tcab.testcabinet.ai → tcab-auth).
#
# These are env VALUES the kustomize `images:` transformer cannot reach, hence a patch
# (same rationale as the dispatcher image-value patches). The console then learns the
# artifacts/arena URLs from the backend's GET /config, whose *_PUBLIC_URLs are
# repointed to https in patch-backend-public-urls.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: TCAB_WEB_BACKEND_URL
              value: "https://api.tcab.testcabinet.ai"
            - name: TCAB_WEB_AUTH_URL
              value: "https://auth.tcab.testcabinet.ai"
