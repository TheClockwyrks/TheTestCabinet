# Enable in-cluster publishing: point the dispatcher at the tcab-publisher image and
# its credential Secret so it claims queued publish jobs and turns each into one
# per-publish tcab-publisher Job.
#
# TCAB_PUBLISHER_IMAGE is a plain env VALUE, not a container `image:` field, so
# kustomize's `images:` transformer cannot rewrite it (the same reason
# patch-dispatcher-driver-image.yaml exists for TCAB_DRIVER_IMAGE). Patch it here to
# the registry + tag the publisher image is published under, and keep it in lockstep
# with the dispatcher/driver image tags so they version together. Pin an immutable
# :<git-sha> tag here once the image is built rather than :latest in a real deploy.
#
# TCAB_DISPATCHER_PUBLISHER_SECRETS names the Secret(s) the dispatcher mounts (envFrom)
# into each publish Job's pod — tcab-publisher-secrets, materialised from Key Vault by
# the keyvault-csi component, carrying GH_TOKEN (for `gh`) and CLOUDFLARE_API_TOKEN
# (for `wrangler`). The publisher needs NO Kubernetes API access; the dispatcher's
# build_publish_job sets no ServiceAccount, so the Job runs under the namespace
# `default` SA (explicitly NOT the pod-creating tcab-driver SA).
#
# TCAB_GITHUB_ORG / TCAB_PAGES_PROJECT are deliberately left UNSET: the publisher's
# core::publish::PublishConfig::from_env defaults them to TheClockwyrks /
# test-cabinet-runs. Set them here only to override those defaults (confirm the real
# Cloudflare Pages project name with the operator first).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_PUBLISHER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-publisher:deefcb40373aff87b96ce20f5835d12677579346"
            - name: TCAB_DISPATCHER_PUBLISHER_SECRETS
              value: "tcab-publisher-secrets"
