# Enable in-cluster publishing and point it at the prod publish targets.
#
# TCAB_DISPATCHER_PUBLISHER_SECRETS names the Secret the dispatcher envFrom-mounts into
# each publish Job (tcab-publisher-secrets: GH_TOKEN for `gh`, CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID for `wrangler`), synced from the prod Key Vault by the
# keyvault-csi component. The publisher needs no Kubernetes API access.
#
# TCAB_PUBLISHER_IMAGE, which enables the publish path, is set by the pipeline's deploy
# (scripts/ci/deploy.sh) to the tcab-publisher image of the commit being deployed.
#
# TCAB_GITHUB_ORG + TCAB_PAGES_PROJECT are the crux of publish decoupling:
# core::publish::PublishConfig::from_env requires both (no compiled-in fallback), so
# every environment names its own org and Cloudflare Pages project. The dispatcher
# forwards both into every publish Job (PUBLISHER_PASSTHROUGH_VARS), where from_env
# reads them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  # the base pins tcab-prod; this overlay's `namespace:` directive retargets it on build
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DISPATCHER_PUBLISHER_SECRETS
              value: "tcab-publisher-secrets"
            - name: TCAB_GITHUB_ORG
              value: "TheClockwyrks"
            - name: TCAB_PAGES_PROJECT
              value: "test-cabinet-runs"
