# Catalog ingest sidecar (azure-prod).
#
# The shipped base `tcab-ingest` CronJob cannot work in this deployment:
#   1. the base `tcab-default-deny-ingress` NetworkPolicy blocks a standalone pod
#      from reaching tcab-backend:8787 (only the labeled runners are admitted), so
#      its POST /ingest times out; and
#   2. it clones into its OWN emptyDir, but POST /ingest makes the backend read its
#      OWN /state/checkout — a different pod's volume — so nothing is ingested.
#
# This co-locates ingest INSIDE the backend pod as a sidecar instead: it shares the
# `state` volume (writing the /state/checkout the backend ingests) and calls
# POST /ingest over localhost — intra-pod traffic, so the NetworkPolicy never applies
# and no service token / extra route is needed. It runs a ONE-SHOT ingest on backend
# start, then idles.
#
# /state is a PVC (see components/postgres/deployment-backend.yaml), so the store
# normally SURVIVES a reschedule and this one-shot is a cheap refresh: the sidecar
# takes its `git fetch` path over an existing checkout and the scan skips versions
# already present. It still matters on a genuinely cold volume — a first deploy or a
# replaced disk — where it is what fills the store at all, and the backend stays out
# of its Service (/readyz) until it lands.
# It deliberately does NOT re-ingest on a schedule: a periodic force re-ingest
# rewrites every version and briefly leaves each one manifest-less, 404-ing any run
# that resolves its version mid-cycle. Catalog changes are published on demand with
# `scripts/reingest-cluster.sh --env prod` (a force re-ingest, kept safe by the backend's atomic
# version swap). The base CronJob is suspended in patch-suspend-ingest-cronjob.yaml.
#
# BRANCH: ingest the `master` branch TIP, so a fresh pod and `scripts/reingest-cluster.sh`
# pick up pushed test-case edits and reference-build lockfile updates on demand — that
# on-demand catalog refresh (no roll) is the whole point of the ingest. The service CODE
# version is pinned separately by this overlay's image `newTag`; reingest right after a
# roll keeps the catalog and code aligned (master only advances on merges). Keep BRANCH
# == TCAB_INGEST_BRANCH in scripts/lib/env.sh.
#
# Targets kind: Deployment because the postgres component converts the backend
# StatefulSet to a Deployment; the strategic-merge patch appends the `ingest`
# container (merged by name) alongside `backend` and reuses the `state` volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: ingest
          # Matches the base CronJob's proven approach (alpine + apk add git/curl,
          # which clones the public GitHub mirror fine). Pin a digest in time.
          image: alpine:3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # Keep == TCAB_INGEST_BRANCH in scripts/lib/env.sh (the branch reingest fetches).
              BRANCH=master
              until apk add --no-cache git curl; do
                echo "ingest: apk add failed, retrying in 5s"; sleep 5
              done
              REPO=https://github.com/TheClockwyrks/TheTestCabinet.git
              CHECKOUT=/state/checkout
              # One-shot: check out the catalog branch tip, then trigger a single ingest.
              # No periodic loop — see the header. Refresh the live checkout when one is
              # already on the /state PVC (the normal case, including across a
              # reschedule), else clone the branch fresh onto a cold volume.
              if [ -d "$CHECKOUT/.git" ]; then
                echo "ingest: refreshing checkout ($BRANCH)"
                git -C "$CHECKOUT" fetch --depth 1 origin "$BRANCH" \
                  && git -C "$CHECKOUT" reset --hard FETCH_HEAD \
                  || echo "ingest: fetch failed"
              else
                echo "ingest: cloning catalog branch $BRANCH into $CHECKOUT"
                rm -rf "$CHECKOUT" \
                  && git clone --depth 1 --branch "$BRANCH" "$REPO" "$CHECKOUT" \
                  || echo "ingest: clone failed"
              fi
              # Wait on /healthz (LIVENESS), never /readyz: readiness is 503 until the
              # store is populated, which is what the POST below is about to do, so
              # gating on it would deadlock the sidecar against itself.
              echo "ingest: waiting for backend healthz"
              until curl -fsS -o /dev/null http://127.0.0.1:8787/healthz; do sleep 3; done
              # A bare scan (no force): a cold volume ingests everything, while a store
              # carried over on the PVC skips already-ingested versions instead of
              # re-rendering them. Retry a stuck POST a few times so a slow-to-ready
              # backend does not leave the store empty.
              n=0
              until curl -fsS -X POST http://127.0.0.1:8787/ingest \
                     -H 'content-type: application/json' -d '{}' >/dev/null; do
                n=$((n + 1))
                if [ "$n" -ge 10 ]; then
                  echo "ingest: POST /ingest failed 10x; giving up (run scripts/reingest-cluster.sh --env prod)"
                  break
                fi
                echo "ingest: POST /ingest failed, retry $n in 10s"; sleep 10
              done
              [ "$n" -lt 10 ] && echo "ingest: triggered ok"
              # Idle forever: an exited container would be restarted by the pod and
              # re-run the one-shot, so park instead of looping or exiting.
              exec sleep infinity
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
