# The dispatcher's TCAB_DRIVER_IMAGE is a plain env VALUE, not a container `image:`
# field, so kustomize's `images:` transformer does not rewrite it. Patch it here to
# the same registry + tag the driver image is published under. Keep it in lockstep
# with the dispatcher image tag so they version together.
#
# TCAB_CONTAINER_TAG pins the RUN-CONTAINER images (test-cabinet-base/-base-wasm/-sprite/
# -sprite-sheet/-adversarial/-performance) the driver resolves for each sandbox pod.
# Like TCAB_DRIVER_IMAGE it is an env value, not an `image:` field — the driver reads
# it at run time (core::harness::resolve_run_image) and the dispatcher forwards it
# into every driver Job (PASSTHROUGH_K8S_VARS). It is pinned SEPARATELY from the
# service images and is NOT kept in lockstep: the run images only rebuild when the
# `build-containers` workflow runs, so this tracks the latest sha at which that
# workflow published multi-arch (amd64+arm64) run images — required for the arm64
# nodes — which is `ba19bd69` (the v0.4.0 roll, when `build-containers` last published
# because v0.4.0 reworked the run-container tooling). As of v0.4.1 this has DIVERGED
# from the service-image pin (`b3c2b322`): the v0.4.1 changes touched only service
# crates and the web/UI, none of the asset-generation/foray crates `build-containers`
# watches, so no new run image exists and TCAB_CONTAINER_TAG stays at `ba19bd69`. Note
# TCAB_DRIVER_IMAGE below is the driver SERVICE image and DOES move with the service
# pin. Without this the base default (latest) would leave the run images tracking the
# mutable tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DRIVER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-driver:b3c2b32239a21aa9a324d58313a1d56361a25bcd"
            - name: TCAB_CONTAINER_TAG
              value: "ba19bd69c95402df6e443b08d94250a8aac73eab"
