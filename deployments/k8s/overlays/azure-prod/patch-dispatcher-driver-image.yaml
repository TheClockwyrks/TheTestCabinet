# The dispatcher's TCAB_DRIVER_IMAGE is a plain env VALUE, not a container `image:`
# field, so kustomize's `images:` transformer does not rewrite it. Patch it here to
# the same registry + tag the driver image is published under. Keep it in lockstep
# with the dispatcher image tag so they version together.
#
# TCAB_CONTAINER_TAG pins the RUN-CONTAINER images (test-cabinet-base/-base-wasm/-sprite/
# -sprite-sheet/-adversarial/-performance) the driver resolves for each sandbox pod.
# Like TCAB_DRIVER_IMAGE it is an env value, not an `image:` field — the driver reads
# it at run time (core::harness::resolve_run_image) and the dispatcher forwards it
# into every driver Job (PASSTHROUGH_K8S_VARS). It is pinned SEPARATELY from the
# service images: it decides the image every future RUN executes inside, so it moves
# with a release that was rehearsed on staging, not with a service roll.
#
# It stays CONVERGED with the driver SERVICE image, now at `49654d1b` (v0.6.3-rc5).
# The two pins first re-converged at `31568780` (v0.6.2-rc1), closing a gap that had been
# open since `e6afbee6` (v0.6.0-beta4) while `build-containers` was still path-filtered
# and left no run images to pin to. Both workflows have run unfiltered on every
# master/staging push since `5ef86c1d`, so every build now publishes the service images
# and all 27 run images at one sha and the pins can simply move together. Nothing under
# containers/ changed between `31568780` and this sha, so the run images are rebuilds of
# identical Dockerfiles rather than new content of ours — only upstream base layers
# moved. staging has been on this pin since 2026-08-18; keep the two in lockstep.
#
# Note TCAB_DRIVER_IMAGE below is the driver SERVICE image and DOES move with the
# service pin. Without this patch the base default (latest) would leave the run
# images tracking the mutable tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: TCAB_DRIVER_IMAGE
              value: "ghcr.io/theclockwyrks/tcab-driver:49654d1b228be0a3dc3f54b412d46ba4426d0eef"
            - name: TCAB_CONTAINER_TAG
              value: "49654d1b228be0a3dc3f54b412d46ba4426d0eef"
