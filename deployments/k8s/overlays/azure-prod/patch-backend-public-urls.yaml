# Repoint the backend's advertised data-plane URLs to the internal-ingress https
# hostnames so console media resolves over the VPN.
#
# TCAB_ARTIFACTS_PUBLIC_URL / TCAB_ARENA_PUBLIC_URL are the base URLs the backend
# reports to the console via GET /config; the console then fetches artifact media +
# arena views directly from the data plane at those URLs. The base (and the postgres
# component's Deployment) set them to cluster-internal Service DNS
# (http://tcab-artifacts:8790 / http://tcab-arena:8791), which a laptop on the VPN
# cannot resolve — so they are repointed here to the per-host ingress https names the
# internal-ingress component routes (artifacts.tcab.testcabinet.ai → tcab-artifacts,
# arena.tcab.testcabinet.ai → tcab-arena).
#
# These are env VALUES, not container `image:` fields, so kustomize's `images:`
# transformer cannot reach them — same rationale as patch-dispatcher-driver-image.yaml
# / patch-dispatcher-publisher.yaml, hence a patch.
#
# TCAB_BACKEND_AUTH_URL is the backend's SERVER-SIDE token-verify URL and is
# deliberately NOT touched here — it stays the in-cluster http://tcab-auth:8789. Only
# the client-facing *_PUBLIC_URLs (and the console's own backend/auth URLs, set on the
# tcab-web pod in patch-web-config.yaml) move to the https hostnames.
#
# The azure-prod overlay's postgres component swaps the base's tcab-backend
# StatefulSet for a Deployment, so this patch targets the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: TCAB_ARTIFACTS_PUBLIC_URL
              value: "https://artifacts.tcab.testcabinet.ai"
            - name: TCAB_ARENA_PUBLIC_URL
              value: "https://arena.tcab.testcabinet.ai"
            # Grafana's base URL, reported through the same GET /config so a run
            # can link to the traces it emitted. Unlike the two above this is not a
            # data-plane URL — nothing fetches from it — it is only ever opened in
            # the reader's browser. Same VPN-only ingress as the console itself, so
            # anyone who can see the link can follow it.
            - name: TCAB_GRAFANA_PUBLIC_URL
              value: "https://grafana.tcab.testcabinet.ai"
            # The PUBLIC READ base of the snapshot bucket, reported through the
            # same GET /config so the console can load an asset-generation case's
            # published reference frames (media/references/…). Distinct from
            # TCAB_R2_ENDPOINT, which is the S3 WRITE endpoint the backend uploads
            # through — this is the CDN hostname those objects are served from, and
            # it is the same value the static site is built with as
            # TCAB_SNAPSHOT_URL (see scripts/lib/env.sh).
            #
            # Unlike the two data-plane URLs above this one is NOT VPN-only: the
            # bucket is public-read, which is what lets the public gallery work at
            # all. Left unset, the console simply shows no Reference tab for
            # asset-generation cases.
            - name: TCAB_SNAPSHOT_PUBLIC_URL
              value: "https://snapshot.testcabinet.ai"
            # The SHORT-LINK domain, reported through the same GET /config so the
            # console can offer a share control on a published run. Like Grafana's
            # above this is not a data-plane URL — nothing fetches from it — it is
            # only ever copied to a clipboard and opened in a browser.
            #
            # It is per-environment rather than compiled into the console because a
            # short code addresses one corpus of PUBLISHED runs: a staging console
            # handing out a tcab.ai link would point at a different run, or at
            # none. So only prod names the production short domain. Left unset (as
            # staging leaves it), the console offers no share control at all.
            - name: TCAB_SHARE_BASE_URL
              value: "https://tcab.ai"
