# Point every workload at the in-cluster Grafana LGTM collector (the observability
# component) by setting OTEL_EXPORTER_OTLP_ENDPOINT. The base already tags TCAB_ENV
# as `prod`, so this patch only adds the exporter endpoint (mirrors
# overlays/prod/patch-otel.yaml). Difference from overlays/prod: backend and auth are
# `kind: Deployment` here, because components/postgres replaced their StatefulSets —
# a patch's `kind` must match its target.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-auth
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: auth
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-artifacts
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: artifacts
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-arena
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: arena
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
---
# The dispatcher forwards this endpoint (and TCAB_ENV) into every per-run driver
# Job, so run/driver spans reach LGTM alongside the long-lived services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tcab-lgtm:4318"
