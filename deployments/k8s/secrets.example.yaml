# Secret + ConfigMap templates — PLACEHOLDER VALUES ONLY, never commit real
# secrets. In a real deployment, create these from your secret manager (e.g.
# `kubectl create secret`, External Secrets, Sealed Secrets) rather than applying
# this file. The repo-root .env.backend.example / .env.auth.example /
# .env.worker.example remain the authoritative reference for every variable.
#
# stringData is shown for readability; Kubernetes stores it base64-encoded.

# ── Backend secrets: R2 credentials + the gallery deploy hook ────────────────
apiVersion: v1
kind: Secret
metadata:
  name: tcab-backend-secrets
  namespace: tcab-prod
type: Opaque
stringData:
  TCAB_R2_ACCOUNT_ID: "REPLACE_ME"
  TCAB_R2_ACCESS_KEY_ID: "REPLACE_ME"
  TCAB_R2_SECRET_ACCESS_KEY: "REPLACE_ME"
  TCAB_SITE_DEPLOY_HOOK_URL: "https://REPLACE_ME"
---
# ── Worker secrets: the harness API key(s) it runs + publish credentials ─────
# The worker injects the harness key into each run pod it creates. Include only
# the harness key(s) this worker will run.
apiVersion: v1
kind: Secret
metadata:
  name: tcab-worker-secrets
  namespace: tcab-prod
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  # OPENAI_API_KEY: "REPLACE_ME"        # codex (injected into the run pod as CODEX_API_KEY)
  # OPENROUTER_API_KEY: "REPLACE_ME"    # cline, goose, kilo, opencode, pi
  # Publish credentials (only if this worker publishes runs):
  # GITHUB_TOKEN: "REPLACE_ME"
  # CLOUDFLARE_API_TOKEN: "REPLACE_ME"
  # CLOUDFLARE_ACCOUNT_ID: "REPLACE_ME"
---
# ── If the run-container images are in a private registry ────────────────────
# Reference this from the worker's TCAB_K8S_IMAGE_PULL_SECRETS so run pods can
# pull them. Create it for real with:
#   kubectl create secret docker-registry tcab-registry \
#     --docker-server=<registry> --docker-username=<user> --docker-password=<token> \
#     -n tcab-prod
apiVersion: v1
kind: Secret
metadata:
  name: tcab-registry
  namespace: tcab-prod
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"REPLACE_REGISTRY":{"username":"REPLACE_ME","password":"REPLACE_ME"}}}'
