# The in-cluster web console (apps/web, packaged as the tcab-web image — a static
# SPA served by nginx, see deployments/images/web.Dockerfile). Serving it inside the
# cluster means there is a real URL to visit rather than each operator running the
# console locally and pointing it at a `kubectl port-forward`ed backend. In prod the
# `internal-ingress` component fronts it at a private hostname
# (console.tcab.testcabinet.ai); in local dev the overlay serves it over a
# `kubectl port-forward` (see the components/web kustomization for both consumers).
#
# The single tcab-web image is environment-agnostic (one build per git-sha, like the
# publisher image), so the backend + auth URLs are injected at RUNTIME via env: the
# image's entrypoint `envsubst`s a /config.js the SPA reads (window.__TCAB_CONFIG__).
# The placeholders below are empty defaults — each consumer patches the real URLs
# (prod sets TCAB_WEB_BACKEND_URL=https://api.tcab.testcabinet.ai etc.; local points
# them at the host-forwarded http://127.0.0.1:8787 / :8789).
#
# It is a DATA-plane peer like the other services: a ClusterIP Service is the only
# in-cluster surface, and (in prod) the ingress — never a LoadBalancer here — is the
# boundary.
apiVersion: v1
kind: Service
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  selector:
    app.kubernetes.io/name: tcab-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
  # ClusterIP only — the internal ingress is the boundary; never a LoadBalancer here.
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  # Stateless static-asset server: it holds no per-pod state, so it could scale out,
  # but one replica is plenty for the operator console. Bump replicas, not state.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-web
        app.kubernetes.io/part-of: test-cabinet
    spec:
      containers:
        - name: web
          image: REPLACE_REGISTRY/tcab-web:latest # CI publishes ghcr.io/<owner>/tcab-web; pin a :<git-sha> tag
          resources:
          # MEMORY REQUEST == LIMIT. The scheduler packs a node by requests and
            # ignores limits, so a gap between them is memory promised twice; an
            # unbounded container is worse still, because it makes the sum of a node's
            # limits unknowable and so removes the only guarantee that a run pod cannot
            # be killed to satisfy someone else's growth. See the `TCAB_K8S_RUN_MEMORY_*`
            # commentary in base/dispatcher.yaml for the full argument.
            #
            # Sized from prod, 2026-08-18: each container's cgroup high-water mark
            # (`memory.peak`) over the pods' then ~4-day lifetime, cross-checked against
            # the anon/file split in `memory.stat`. Peak totals include reclaimable page
            # cache, which cgroup v2 evicts under limit pressure rather than OOM-killing
            # for, so the ceilings below are sized against anonymous memory plus slab
            # with headroom, not against the cache-inflated peak.
            #
            # Prod peak 8Mi — it is nginx serving a static bundle. 256Mi is ~32x that.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          ports:
            - containerPort: 8080
          env:
            # The console reads these at container start (the entrypoint emits
            # /config.js from them). Empty by default so an unset env yields a valid
            # (empty) config; each overlay patches the real https URLs (task-3).
            - name: TCAB_WEB_BACKEND_URL
              value: ""
            - name: TCAB_WEB_AUTH_URL
              value: ""
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          # Static assets only — no host mounts, no Kubernetes API, no privilege.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # nginx writes /config.js + its cache/run dirs
            capabilities:
              drop: ["ALL"]
