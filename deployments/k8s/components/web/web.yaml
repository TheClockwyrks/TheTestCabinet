# The in-cluster web console (the console.testcabinet.ai repository, packaged as the
# tcab-web image — a static SPA served by nginx, see that repository's Dockerfile;
# its pipeline pushes it as testcabinet.azurecr.io/console.testcabinet.ai:<commit>,
# pinned to the console.testcabinet.ai submodule pointer). In the staging and
# prod overlays the edge component (components/edge) nests this one and routes the
# environment's origin to it: `/` of console[.staging].testcabinet.ai reaches
# tcab-web:8080 through the Cloudflare Tunnel. The local overlay does not include
# it; locally the console runs from source.
#
# The tcab-web container takes no runtime configuration: the console carries no
# service URL and addresses /api, /artifacts and /arena of its own origin, which the
# edge routes to the services, so it has no environment and no overlay patches it
# beyond the image.
#
# It is a DATA-plane peer like the other services: a ClusterIP Service is the only
# in-cluster surface, and the edge, never a LoadBalancer here, is the boundary.
apiVersion: v1
kind: Service
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  selector:
    app.kubernetes.io/name: tcab-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  # ClusterIP only — the edge is the boundary; never a LoadBalancer here.
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  # Two interchangeable replicas of a stateless static-asset server, so a planned
  # disruption of one leaves the other serving (Planned disruption, in
  # deployment/kubernetes/control-plane.md). A deploy starts the new pod and waits
  # for it to be Ready before terminating an old one.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-web
        app.kubernetes.io/part-of: test-cabinet
    spec:
      # Prefer the two replicas on different nodes, so one node's loss leaves the
      # console served.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tcab-web
      # nginx stops on its image's stop signal, SIGQUIT, its graceful shutdown: it
      # finishes the requests in flight, each a static file, well inside this.
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: REPLACE_REGISTRY/tcab-web:latest # the staging and prod overlays name testcabinet.azurecr.io/console.testcabinet.ai
          resources:
            # MEMORY REQUEST == LIMIT. The scheduler packs a node by requests and
            # ignores limits, so a gap between them is memory promised twice; an
            # unbounded container is worse still, because it makes the sum of a node's
            # limits unknowable and so removes the only guarantee that a run pod cannot
            # be killed to satisfy someone else's growth. See the dispatcher
            # container's own `resources` commentary in base/dispatcher.yaml for the
            # always-on argument; the RUN pods (driver + sandbox) deliberately take the
            # opposite shape — a request and NO limit — for the reasons given there.
            #
            # Sized from prod, 2026-08-18: each container's cgroup high-water mark
            # (`memory.peak`) over the pods' then ~4-day lifetime, cross-checked against
            # the anon/file split in `memory.stat`. Peak totals include reclaimable page
            # cache, which cgroup v2 evicts under limit pressure rather than OOM-killing
            # for, so the ceilings below are sized against anonymous memory plus slab
            # with headroom, not against the cache-inflated peak.
            #
            # Prod peak 8Mi — it is nginx serving a static bundle. 256Mi is ~32x that.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            # Hold the pod while its endpoint's removal from the Service
            # propagates, so no new request is routed to a stopping replica.
            preStop:
              sleep:
                seconds: 5
          # Static assets only — no host mounts, no Kubernetes API, no privilege.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # nginx writes its pid and temp files, the base entrypoint its conf.d
            capabilities:
              drop: ["ALL"]
---
# Planned disruption: a drain evicts one replica and waits for its replacement to
# be Ready before evicting the other. The selector is the service's own name label,
# so the budget reaches no run pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tcab-web
  namespace: tcab-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-web
