# Web-console component — the in-cluster tcab-web console Deployment + ClusterIP
# Service, as a reusable, environment-agnostic unit.
#
# The edge component (components/edge) nests it, so the staging and prod overlays
# serve the console in-cluster behind the Cloudflare Tunnel; an overlay can also
# include it directly to serve the console without the edge. The local overlay
# includes neither: locally the console runs from source against a port-forwarded
# backend.
#
# The including overlay's `namespace:` directive retargets the resources here and its
# `images:` transformer rewrites the tcab-web image, exactly as for the base.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - web.yaml
