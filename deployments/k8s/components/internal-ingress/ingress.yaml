    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.tcab.testcabinet.ai
      secretName: tls-api
  rules:
    - host: api.tcab.testcabinet.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tcab-backend
                port:
                  number: 8787
