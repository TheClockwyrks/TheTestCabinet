# Prometheus configuration for the otel-lgtm all-in-one, mounted over the image's
# own /otel-lgtm/prometheus.yaml.
#
# WHY THIS FILE EXISTS: the image ships Prometheus as a pure OTLP *sink* — it has no
# `scrape_configs` at all, so the only metrics it holds are the ones our services
# push to the collector. That covers application telemetry and nothing else: there
# is no per-container CPU or memory history, which is exactly what is needed to size
# a run pod's resource requests and limits against what runs actually consume rather
# than against a guess. This file adds one scrape job for the kubelet's cAdvisor
# endpoint to close that gap.
#
# VERSION-COUPLED: everything above `scrape_configs` is a VERBATIM copy of the config
# baked into grafana/otel-lgtm:0.29.1 — Prometheus takes a single config file, so
# adding a scrape job means replacing the whole thing, and dropping the `otlp` block
# would silently stop promoting the resource attributes every existing dashboard
# groups by. When the image pin in lgtm.yaml moves, diff this against the new
# image's copy and re-sync it (same discipline as loki-config.yaml):
#   kubectl exec -n <ns> tcab-lgtm-0 -- cat /otel-lgtm/prometheus.yaml
---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

# --- Added by this repo ------------------------------------------------------
scrape_configs:
  # Per-container CPU and memory, straight from each node's kubelet. This is the
  # data behind "how much memory does a run pod ACTUALLY use" — the question that
  # decides whether a memory limit is a safe ceiling or a scheduled OOM kill.
  - job_name: kubelet-cadvisor
    # cAdvisor recomputes its stats on the kubelet's housekeeping interval (~10-15s),
    # so scraping faster than this only resamples the same numbers. Peak detection
    # does not depend on the interval anyway — see the `max_usage` note below.
    scrape_interval: 30s
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      # The kubelet's serving certificate is issued by the cluster CA (AKS runs with
      # kubelet serving-certificate rotation on), and its SANs cover the node IP we
      # connect to, so the chain verifies against the CA bundle the ServiceAccount
      # already projects. Verified with:
      #   curl --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
      #        https://<node-ip>:10250/metrics/cadvisor
      # which returns 403 (an authorization answer) rather than a TLS error.
      #
      # Much guidance for this scrape job reaches for `insecure_skip_verify: true`,
      # which is unnecessary here — do not add it back without re-checking the above,
      # since it would silently accept any certificate on the node network.
      #
      # The trade-off to know: a node whose serving cert has not yet been issued
      # fails this scrape with a TLS error instead of being scraped insecurely. That
      # is the correct failure — a missing target is visible, a spoofable one is not.
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      # `role: node` already points `__address__` at the kubelet, but pin it
      # explicitly so the target does not shift if the discovery default changes.
      - source_labels: [__meta_kubernetes_node_address_InternalIP]
        regex: (.+)
        target_label: __address__
        replacement: $1:10250
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # Keep ONLY the series needed to size resources. cAdvisor exposes a few
      # hundred metrics per container, and run/driver pods are per-run and therefore
      # churn their pod names constantly — keeping everything would bloat the TSDB
      # with series that are never queried and are dead within the hour.
      #
      # `memory_max_usage_bytes` is the load-bearing one: it is the cgroup's own
      # high-water mark, maintained continuously by the kernel, so it captures a
      # spike that occurred BETWEEN two scrapes. Working-set is what the kubelet
      # actually evicts on, and the `spec_*` series record what the pod was
      # configured with, so a query can compare real peaks against the declared
      # ceiling without cross-referencing manifests.
      #
      # The cfs throttling counters are here to check the other half of the resource
      # story: CPU oversubscription is only acceptable while throttling stays low,
      # and this is the data that says whether it does.
      - source_labels: [__name__]
        regex: container_(memory_working_set_bytes|memory_max_usage_bytes|spec_memory_limit_bytes|cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|cpu_cfs_throttled_seconds_total|spec_cpu_quota|spec_cpu_shares)
        action: keep
      # cAdvisor emits a series per named container AND one for the pod's own cgroup
      # and its `pause` sandbox, both carrying `container=""`. Dropping those halves
      # the volume and removes the double-counting that would otherwise make a
      # `sum by (pod)` read twice the real figure.
      - source_labels: [container]
        regex: ""
        action: drop
