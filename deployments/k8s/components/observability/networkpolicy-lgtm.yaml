# Let the telemetry producers reach the in-cluster collector. The base's
# default-deny-ingress policy (base/networkpolicy.yaml) blocks all inbound traffic
# in the namespace, so the LGTM pod is unreachable without this explicit allow —
# the workloads' OTLP export would silently fail (export failure is never fatal, so
# it would look like "no telemetry" rather than an error). Needs a NetworkPolicy-
# enforcing CNI (Calico, Cilium, …) to take effect; on a single-node k3d CNI it is
# inert and the local overlay deletes it.
#
# Admits OTLP on :4317/:4318 from the two kinds of telemetry producer:
#   - the long-lived services (app.kubernetes.io/part-of: test-cabinet)
#   - each per-run driver Job pod (app.kubernetes.io/managed-by: tcab-dispatcher)
# Grafana's :3000 is reached by operators via `kubectl port-forward`, which rides
# the API server rather than the pod network, so it needs no ingress rule here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-allow-lgtm-from-producers
  namespace: tcab-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcab-lgtm
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: test-cabinet
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tcab-dispatcher
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
