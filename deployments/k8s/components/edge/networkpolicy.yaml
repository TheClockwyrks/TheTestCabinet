# Admit the tunnel's connector through the base's default-deny-ingress to each
# service its ingress rules route to (config.yaml), on that service's port. These
# are additive; the base policies are left intact (see "NetworkPolicy" in
# apps/docs/src/content/docs/deployment/kubernetes/overview.md). Needs a
# NetworkPolicy-enforcing CNI to take effect.

# The backend, the artifacts service and the arena, each on its bind port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-allow-services-from-edge
  namespace: tcab-prod
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["tcab-backend", "tcab-artifacts", "tcab-arena"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-cloudflared
      ports:
        - protocol: TCP
          port: 8787 # tcab-backend
        - protocol: TCP
          port: 8790 # tcab-artifacts
        - protocol: TCP
          port: 8791 # tcab-arena
---
# The console. The edge is tcab-web's only caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-allow-web-from-edge
  namespace: tcab-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcab-web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-cloudflared
      ports:
        - protocol: TCP
          port: 8080
---
# Grafana, on the observability component's tcab-lgtm. That component's own policy
# admits only the OTLP ports from the telemetry producers; this unions in the
# Grafana host's route. Inert in an overlay without the observability component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-allow-lgtm-from-edge
  namespace: tcab-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcab-lgtm
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-cloudflared
      ports:
        - protocol: TCP
          port: 3000
