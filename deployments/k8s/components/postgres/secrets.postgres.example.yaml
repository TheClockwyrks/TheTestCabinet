# Managed-PostgreSQL connection strings — PLACEHOLDER VALUES ONLY, never commit real
# secrets. As with base/secrets.example.yaml, this is a template: in a real
# deployment create these Secrets from your secret manager (Azure Key Vault via the
# Secrets Store CSI driver / External Secrets, or `kubectl create secret`), not by
# applying this file. It is deliberately NOT a resource of this component.
#
# Create these in EACH environment's namespace, each pointing at that environment's
# OWN database — staging and prod must NOT share a database. The namespace below is
# shown as tcab-prod; create the tcab-staging copies the same way against a separate
# database (e.g. tcab_backend_staging) or a separate server. Per-namespace Secrets
# keep the two environments' credentials isolated.
#
# Azure note: you do NOT need two servers — one Azure Database for PostgreSQL —
# Flexible Server with separate databases is enough. Flexible Server enforces TLS,
# so keep `sslmode=require`. Use a dedicated, least-privileged role per database.
#
# The Deployments read each URL via secretKeyRef, so the KEY NAMES below must stay
# exactly as shown.

# ── Backend secret ────────────────────────────────────────────────────────────
# This is the SAME Secret as in base/secrets.example.yaml (R2 creds, the deploy
# hook, and the shared service token) — create it with ALL of those keys PLUS the
# Postgres URL below. Only the database key is shown here; see base/secrets.example.yaml
# for the rest.
apiVersion: v1
kind: Secret
metadata:
  name: tcab-backend-secrets
  namespace: tcab-prod # ...and a tcab-staging copy against a separate database
type: Opaque
stringData:
  TCAB_BACKEND_DATABASE_URL: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_SERVER.postgres.database.azure.com:5432/tcab_backend?sslmode=require"
  # ...plus TCAB_R2_*, TCAB_SITE_DEPLOY_HOOK_URL, TCAB_BACKEND_SERVICE_TOKEN
  #    from base/secrets.example.yaml.
---
# ── Auth secret (new on Postgres) ─────────────────────────────────────────────
# On SQLite the auth service carried no Secret; on managed Postgres it needs one for
# its connection string. The auth Deployment references this by name.
apiVersion: v1
kind: Secret
metadata:
  name: tcab-auth-secrets
  namespace: tcab-prod # ...and a tcab-staging copy against a separate database
type: Opaque
stringData:
  TCAB_AUTH_DATABASE_URL: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_SERVER.postgres.database.azure.com:5432/tcab_auth?sslmode=require"
