# Managed-PostgreSQL component — the reusable, environment-agnostic conversion of
# the backend from its default embedded-SQLite shape to a managed
# database. Layered onto an environment overlay via its `components:` list; today
# both overlays/prod and overlays/staging include it, so the staging↔prod
# parity the base+overlay split buys is preserved (one definition of the Postgres
# shape, applied to both). See deployment/kubernetes/control-plane.md#backend and
# deployment/backups.md#managed-postgresql for the why.
#
# A Component (not an overlay) so it carries no namespace/images/env of its own —
# the including overlay supplies those. Kustomize applies a component AFTER the
# overlay's `resources:` are accumulated but BEFORE the overlay's own transformers,
# so the overlay's namespace directive and any TCAB_ENV patch still reach the
# Deployments this component swaps in (staging retags TCAB_ENV by targeting
# `kind: Deployment`).
#
# What it does:
#   1. Deletes the base's `tcab-backend` StatefulSet (a kind change can't be a
#      patch). Its ClusterIP Service and everything else in the base are untouched;
#      the replacement Deployment reuses the same selector labels, so the Service
#      keeps routing.
#   2. Adds the replacement backend Deployment, two replicas rolled one at a time,
#      and the PodDisruptionBudget that keeps one of them through a drain, with the
#      connection string wired from the environment's Secret. See
#      secrets.postgres.example.yaml. Each backend pod keeps ONE volume — an
#      ephemeral volume of its own for its definition store + ingest checkout, which
#      its ingest sidecar fills while the pod is held unready (see
#      deployment-backend.yaml).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - deployment-backend.yaml

patches:
  - target:
      kind: StatefulSet
      name: tcab-backend
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: tcab-backend
