# Backend, managed-PostgreSQL shape: a stateless Deployment of two replicas, and their
# PodDisruptionBudget, that replace the base's single-replica StatefulSet + PVC
# (deleted by this component's kustomization). The base's `tcab-backend` ClusterIP
# Service is kept and still selects these pods by their
# `app.kubernetes.io/name: tcab-backend` label. TCAB_ENV defaults to `prod` here
# (matching the base); the staging overlay patches it to `staging`.
#
# The Deployment itself is named `the-test-cabinet-backend`, the name the workspace
# template's deploy script (scripts/ci/deploy.sh) waits on and rolls back. Only the
# name changed: its selector and pod labels are still `tcab-backend`, so the Service
# and every NetworkPolicy select it as before. A namespace that still runs the old
# `tcab-backend` Deployment has it deleted before each deploy
# (scripts/ci/retire-legacy-backend.sh), because its pod carries the label the
# Service selects, so the Service would keep routing to it.
#
# With the record store on managed PostgreSQL the database leaves local disk, so the
# single-writer pin goes away and the backend runs two replicas (Planned disruption,
# in deployment/kubernetes/control-plane.md). Work one replica does on behalf of all
# is claimed through the database (Replicas, in components/backend/overview.md). Two
# base constraints still hold (see deployment/kubernetes/control-plane.md#backend),
# and shape this manifest:
#   - The image must still ship a headless Chromium for reference rendering — same
#     `tcab-backend` image as the base (deployments/images/services.Dockerfile,
#     `--target backend`).
#   - The definition store and ingest checkout still live on local disk, so /state
#     stays mounted — on an ephemeral volume of each pod's own.
#
# Why /state is per-pod and ephemeral. Everything on it is regenerable: losing it
# costs a re-ingest, not data, and it is not a backup target (deployment/backups.md).
# A shared ReadWriteOnce claim pinned the backend to one pod at a time under
# `Recreate`, so every deploy and every node drain was an outage. Each pod now has
# a volume of its own, created with it and deleted with it, which its ingest sidecar
# fills while the pod is held unready (/readyz). The rolling update retires an old
# pod only once the new one is Ready, and the budget below keeps one replica through
# a drain, so the multi-minute cold ingest of a new pod is paid while the other
# replica serves, never as an outage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-test-cabinet-backend
  namespace: tcab-prod
spec:
  # Two replicas: everything durable is in PostgreSQL or the artifacts service, and
  # work done on behalf of all replicas is claimed through the database, so a
  # planned disruption of one leaves the other serving. A deploy starts the new pod
  # and waits for it to be Ready (its store ingested) before terminating an old one.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-backend
        app.kubernetes.io/part-of: test-cabinet
    spec:
      # Prefer the two replicas on different nodes, so one node's loss leaves a
      # backend serving.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tcab-backend
      # Sized to the longest request the backend answers; the console's event
      # streams are closed at SIGTERM, so the client reconnects to a ready replica.
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: REPLACE_REGISTRY/tcab-backend:latest # the staging and prod overlays name testcabinet.azurecr.io/the-test-cabinet-backend
          ports:
            - containerPort: 8787
          env:
            - name: TCAB_BACKEND_BIND
              value: "0.0.0.0:8787"
            # The managed PostgreSQL connection string, from the Secret (NOT inline).
            # See secrets.postgres.example.yaml.
            - name: TCAB_BACKEND_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tcab-backend-secrets
                  key: TCAB_BACKEND_DATABASE_URL
            # Definition store + ingest checkout still live on local disk (the
            # pod's own ephemeral volume mounted at /state below).
            - name: TCAB_BACKEND_STORE
              value: "/state/tcab-store"
            # The test suites checkout inside the superproject's clone, with the
            # cold-storage checkout beside it.
            - name: TCAB_BACKEND_CHECKOUT
              value: "/state/checkout/test-suites"
            # The artifact service as THIS POD reaches it, for pruning a deleted run's
            # tree and sweeping the trees no run row references. This Deployment
            # replaces the base StatefulSet wholesale, so the base's copy of this
            # variable does not reach the postgres overlays and it is repeated here.
            - name: TCAB_ARTIFACTS_URL
              value: "http://tcab-artifacts:8790"
            # The repos service as this pod reaches it, to read a run's bundle for a
            # console's download and to prune a deleted run's bundle; repeated here
            # for the same reason as TCAB_ARTIFACTS_URL.
            - name: TCAB_REPOS_URL
              value: "http://tcab-repos:8792"
            # The shared service token the dispatcher claims queued jobs with; MUST
            # match the dispatcher's TCAB_BACKEND_SERVICE_TOKEN or the queue never
            # drains. From the backend secret below.
            - name: TCAB_BACKEND_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tcab-backend-secrets
                  key: TCAB_BACKEND_SERVICE_TOKEN
            - name: TCAB_ENV
              value: "prod"
          envFrom:
            - secretRef:
                name: tcab-backend-secrets
          lifecycle:
            # Hold the pod while its endpoint's removal from the Service
            # propagates, so no new request is routed to a stopping replica.
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: state
              mountPath: /state
          # Sized from observed prod behaviour: this container sits near-idle on CPU
          # (well under 100m) and holds ~650Mi resident, with periodic bursts to
          # roughly a core when the publisher rebuilds the public snapshot.
          #
          # Requests exist mostly so the scheduler stops treating this pod as free.
          # With no requests at all it lands in BestEffort — the first thing evicted
          # under node pressure — which is a poor fit for a pod whose every move
          # costs a multi-minute cold ingest before its replacement can serve.
          #
          # The ceilings are deliberately loose rather than tight. Throttling this
          # container surfaces directly as console latency, so the CPU limit is a
          # runaway backstop, not a shaping tool — normal snapshot bursts must fit
          # under it comfortably. Memory gets 3x the observed resident set because
          # the snapshot refresh materializes every run record at once, so its peak
          # grows with the catalog; a snug limit would turn that growth into
          # OOMKills long before anyone noticed the trend.
          resources:
            # MEMORY REQUEST == LIMIT. The 768Mi request under a 2Gi ceiling was memory
            # a node could promise to three pods and honour for one; the scheduler packs
            # by requests and never consults limits. Equalising them is what makes the
            # ceiling above a reservation rather than an aspiration — see the
            # `TCAB_K8S_RUN_MEMORY_*` commentary in base/dispatcher.yaml.
            #
            # The 2Gi ceiling itself is unchanged and is corroborated by prod, 2026-08-18:
            # this container's cgroup high-water mark had reached 2.9Gi over ~4 days, but
            # the split at the time was 717Mi anon + 108Mi slab against 1027Mi of file
            # cache. Under a limit cgroup v2 reclaims that cache rather than OOM-killing
            # for it, so 2Gi is ~2.4x the figure that actually decides a kill. The pod had
            # no ceiling at all in prod — this manifest's resources block had never been
            # applied there — which is why it was free to grow to 2.9Gi.
            #
            # CPU keeps its gap on purpose: over-limit CPU is throttled, not killed, so
            # the failure mode is console latency rather than a lost control plane.
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "1500m"
              memory: 2Gi
          # Readiness and liveness MUST stay on different endpoints — and this shape
          # is exactly why. The definition store on /state starts EMPTY in every new
          # pod — its volume is created with it — and the ingest fills it over
          # minutes. /readyz stays 503 for that whole window, holding the pod out of the
          # tcab-backend Service until it can actually resolve a test case. Both
          # probes previously pointed at /healthz, which is always 200 while the
          # process serves: the pod joined the Service seconds after start with an
          # empty store, and every run launched until the ingest landed failed with a
          # spurious "is not ingested" 404.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
            # No failureThreshold ceiling on purpose: an unready pod is only held out
            # of the Service, never restarted, so a long first ingest is free to run
            # as long as it needs. Liveness below must NOT be moved to /readyz — it
            # would kill the pod mid-ingest and never converge.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 20
      # The definition store + ingest checkout: a generic ephemeral volume, a claim
      # of each pod's own that Kubernetes creates with the pod and deletes with it
      # (`<pod>-state`). A disk rather than an emptyDir, so a store and a checkout
      # with cold storage beside it never fill the node's own disk; the only data
      # of record lives in managed PostgreSQL.
      volumes:
        - name: state
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  app.kubernetes.io/name: tcab-backend
                  app.kubernetes.io/part-of: test-cabinet
              spec:
                accessModes: ["ReadWriteOnce"]
                # The size of each pod's /state, for staging and prod alike: no
                # overlay patches it. A new size reaches each pod as the deploy
                # replaces it, since every pod starts on a new volume.
                resources:
                  requests:
                    storage: 16Gi
                # storageClassName: <your-block-storage-class>   # defaults to the cluster's default
---
# Planned disruption: a drain evicts one replica and waits for its replacement to
# be Ready before evicting the other. The selector is the service's own name label,
# so the budget reaches no run pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-backend
