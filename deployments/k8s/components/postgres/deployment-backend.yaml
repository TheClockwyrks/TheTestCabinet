# Backend, managed-PostgreSQL shape: a stateless Deployment that replaces the
# base's single-replica StatefulSet + PVC (deleted by this component's kustomization).
# The base's `tcab-backend` ClusterIP Service is kept and still selects this pod by
# its `app.kubernetes.io/name: tcab-backend` label. TCAB_ENV defaults to `prod` here
# (matching the base); the azure-staging overlay patches it to `staging`.
#
# With the record store on managed PostgreSQL the database leaves local disk, so the
# single-writer pin goes away. Two base constraints still hold (see
# deployment/kubernetes.md#backend), and shape this manifest:
#   - The image must still ship a headless Chromium for reference rendering — same
#     `tcab-backend` image as the base (deployments/images/backend.Dockerfile).
#   - The definition store and ingest checkout still live on local disk, so /state
#     stays mounted — and on a PersistentVolumeClaim, not an emptyDir.
#
# Why /state is durable even though everything on it is regenerable. It is still not
# a backup target: losing it costs a re-ingest, not data (deployment/backups.md). But
# "regenerable" is not "free". Regenerating means cloning the catalog and re-ingesting
# every version, which runs for minutes, and until it finishes the backend cannot
# resolve a single test case — it is held out of its Service by /readyz for that whole
# window, so the queue stalls. An emptyDir paid that cost on EVERY reschedule, and
# reschedules are not rare: AKS node-image auto-upgrade drains nodes on its own
# schedule and moved this pod repeatedly. A 10Gi disk that survives the move turns a
# multi-minute cold rebuild into an attach.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tcab-backend-state
  namespace: tcab-prod
spec:
  # ReadWriteOnce is correct here and requires the Deployment's `Recreate` strategy:
  # one pod at a time, old fully terminated before the new one attaches. A rolling
  # update would deadlock on the disk (new pod Pending on attach, old pod never
  # released) — which is another reason not to relax `Recreate` below.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: <your-block-storage-class>   # defaults to the cluster's default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  # Postgres lifts the SQLite single-writer pin. Kept at 1 because this pod still
  # coordinates publishes and owns the run queue, and POST /ingest targets one pod
  # through the Service; revisit the ingest fan-out and any single-coordinator
  # assumptions before scaling out.
  replicas: 1
  # Never run two backends at once (single active coordinator); Recreate tears the
  # old pod down before the new one starts rather than overlapping on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-backend
        app.kubernetes.io/part-of: test-cabinet
      annotations:
        # Single active coordinator (replicas: 1, Recreate) — cannot be scaled out.
        # Keep the cluster autoscaler from consolidating a node out from under it:
        # each move is a ~1-2 min outage (Recreate + 640MB image pull + disk
        # reattach). Now that /state is a PVC the move no longer also costs a full
        # re-ingest, but it is still an outage worth not inviting. Planned node
        # upgrades do not honor this annotation and still move the pod — which is
        # exactly why /state must survive the move.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      containers:
        - name: backend
          image: REPLACE_REGISTRY/tcab-backend:latest # CI publishes ghcr.io/<owner>/tcab-backend; pin a :<git-sha> tag
          ports:
            - containerPort: 8787
          env:
            - name: TCAB_BACKEND_BIND
              value: "0.0.0.0:8787"
            # The managed PostgreSQL connection string, from the Secret (NOT inline).
            # See secrets.postgres.example.yaml.
            - name: TCAB_BACKEND_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tcab-backend-secrets
                  key: TCAB_BACKEND_DATABASE_URL
            # Definition store + ingest checkout still live on local disk (the
            # emptyDir mounted at /state below).
            - name: TCAB_BACKEND_STORE
              value: "/state/tcab-store"
            - name: TCAB_BACKEND_CHECKOUT
              value: "/state/checkout"
            # The auth service this backend verifies tokens against.
            - name: TCAB_BACKEND_AUTH_URL
              value: "http://tcab-auth:8789"
            # Console-facing data-plane base URLs the backend reports via GET /config
            # (bytes never transit the backend — these are just the URLs the console
            # fetches from). Same in-cluster Service DNS the base uses.
            - name: TCAB_ARTIFACTS_PUBLIC_URL
              value: "http://tcab-artifacts:8790"
            - name: TCAB_ARENA_PUBLIC_URL
              value: "http://tcab-arena:8791"
            # The shared service token the dispatcher claims queued jobs with; MUST
            # match the dispatcher's TCAB_BACKEND_SERVICE_TOKEN or the queue never
            # drains. From the backend secret below.
            - name: TCAB_BACKEND_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tcab-backend-secrets
                  key: TCAB_BACKEND_SERVICE_TOKEN
            - name: TCAB_ENV
              value: "prod"
          envFrom:
            - secretRef:
                name: tcab-backend-secrets
          volumeMounts:
            - name: state
              mountPath: /state
          # Readiness and liveness MUST stay on different endpoints — and this shape
          # is exactly why. /state is an emptyDir here, so the definition store starts
          # EMPTY on every reschedule and the ingest sidecar refills it over minutes.
          # /readyz stays 503 for that whole window, holding the pod out of the
          # tcab-backend Service until it can actually resolve a test case. Both
          # probes previously pointed at /healthz, which is always 200 while the
          # process serves: the pod joined the Service seconds after start with an
          # empty store, and every run launched until the ingest landed failed with a
          # spurious "is not ingested" 404.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
            # No failureThreshold ceiling on purpose: an unready pod is only held out
            # of the Service, never restarted, so a long first ingest is free to run
            # as long as it needs. Liveness below must NOT be moved to /readyz — it
            # would kill the pod mid-ingest and never converge.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 20
      # The definition store + ingest checkout. Durable so a reschedule does not
      # force a multi-minute cold re-ingest before the backend can serve (see the
      # header); the only data of record still lives in managed PostgreSQL.
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tcab-backend-state
