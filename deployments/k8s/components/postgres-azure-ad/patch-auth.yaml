# Convert the auth-service Deployment (added by components/postgres) to passwordless
# Azure AD Postgres auth: run under the workload-identity ServiceAccount, carry the
# webhook label, and flip TCAB_AUTH_DB_AZURE_AD so the service mints an Entra access
# token as the Postgres password. Strategic merge — the `auth` container and the env
# list merge by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-auth
  namespace: tcab-prod
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: tcab-auth
      containers:
        - name: auth
          env:
            - name: TCAB_AUTH_DB_AZURE_AD
              value: "true"
