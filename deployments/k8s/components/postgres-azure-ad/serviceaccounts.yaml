# The workload-identity ServiceAccount for the backend, so its pod authenticates to
# Azure Database for PostgreSQL as its OWN user-assigned managed identity
# (passwordless Microsoft Entra auth) rather than with a shared password.
#
# It is federated (an `az identity federated-credential`) to a managed identity that
# is a mapped Postgres role on the backend's database:
#   tcab-backend ↔ tcab-backend-db-<env>  → role on the backend database
# Least privilege: the identity can reach only the backend DB. (The keyvault-csi
# component's tcab-keyvault-sync SA is separate — it reads Key Vault, not Postgres.)
#
# The clientID annotation is PROD's identity; overlays/staging patches
# it to the staging identity (patch-db-workload-identity.yaml), exactly as
# patch-keyvault.yaml does for the secret-sync identity. `namespace: tcab-prod` is
# retargeted by the including overlay's `namespace:` directive.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-backend
  namespace: tcab-prod
  annotations:
    # tcab-backend-db-prod client id.
    azure.workload.identity/client-id: "a6955ea2-3bf0-4e9b-ab31-6ef38b037fd5"
