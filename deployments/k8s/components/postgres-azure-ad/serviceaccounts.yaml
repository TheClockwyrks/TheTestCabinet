# Workload-identity ServiceAccounts for the backend and auth service, so each pod
# authenticates to Azure Database for PostgreSQL as its OWN user-assigned managed
# identity (passwordless Microsoft Entra auth) rather than with a shared password.
#
# Each is federated (an `az identity federated-credential`) to a per-workload
# managed identity that is a mapped Postgres role on that service's database:
#   tcab-backend ↔ tcab-backend-db-<env>  → role on the backend database
#   tcab-auth    ↔ tcab-auth-db-<env>     → role on the auth database
# Least privilege: the backend identity can reach only the backend DB, the auth
# identity only the auth DB. (The keyvault-csi component's tcab-keyvault-sync SA is
# separate — it reads Key Vault, not Postgres.)
#
# The clientID annotations are PROD's identities; overlays/azure-staging patches
# them to the staging identities (patch-db-workload-identity.yaml), exactly as
# patch-keyvault.yaml does for the secret-sync identity. `namespace: tcab-prod` is
# retargeted by the including overlay's `namespace:` directive.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-backend
  namespace: tcab-prod
  annotations:
    # tcab-backend-db-prod client id.
    azure.workload.identity/client-id: "a6955ea2-3bf0-4e9b-ab31-6ef38b037fd5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-auth
  namespace: tcab-prod
  annotations:
    # tcab-auth-db-prod client id.
    azure.workload.identity/client-id: "b035c3a6-52a6-4489-a57e-5c47829a5f40"
