# The `ingest` container, appended to the backend Deployment beside `backend` (a
# strategic-merge patch merges containers and volumes by name). `namespace` is the
# base's, which is what a patch target is matched on before an overlay's namespace
# transformer runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-test-cabinet-backend
  namespace: tcab-prod
spec:
  template:
    spec:
      containers:
        - name: ingest
          # A stock alpine; ingest.sh installs git and curl with apk, which keeps
          # this decoupled from the service images. Pin a digest in time.
          image: alpine:3
          command: ["/bin/sh", "/ingest/ingest.sh"]
          env:
            # The size the state volume's claim asks for, which the component's
            # replacement copies here from the claim itself, so it is declared in
            # one place. ingest.sh waits for room only while the filesystem is
            # smaller than this, which is a resize that has yet to land.
            - name: TCAB_INGEST_STATE_SIZE
              value: copied-from-the-claim
          # No probe of any kind, on purpose. This container shares the backend's
          # pod, so a readiness probe that failed here would take the backend out of
          # its Service, and a liveness probe would restart a container whose one-shot
          # must not run twice. Its outcome is read from its result file instead.
          volumeMounts:
            - name: state
              mountPath: /state
            - name: catalog-ingest
              mountPath: /ingest
              readOnly: true
          resources:
            # MEMORY REQUEST == LIMIT (see base/dispatcher.yaml for the argument): a
            # 32Mi request under a 128Mi ceiling let a node seat four of these and
            # honour one. This sidecar shares the backend's pod, so its overrun is
            # charged to a pod the deployment cannot afford to lose.
            #
            # 256Mi is about three times the 82Mi peak staging measured for this
            # container, which runs a git checkout whose cost grows with the catalog.
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: catalog-ingest
          configMap:
            name: tcab-catalog-ingest
