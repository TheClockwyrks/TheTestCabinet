# The always-on pod that materialises the Key Vault → Kubernetes Secret sync.
#
# The Secrets Store CSI driver only creates and refreshes the Kubernetes Secrets
# declared in a SecretProviderClass's `secretObjects` (secretproviderclass.yaml)
# while a pod that MOUNTS that SecretProviderClass volume is scheduled and running.
# None of the workloads mount it directly (they consume the materialised Secrets by
# secretKeyRef/envFrom — and the per-run driver Jobs, templated by the dispatcher,
# cannot be given a CSI volume), so this minimal Deployment exists solely to keep the
# volume mounted and therefore the four Secrets present. It runs a pause container —
# it serves no traffic.
#
# It authenticates to Key Vault with Azure Workload Identity: the pod carries the
# `azure.workload.identity/use: "true"` label and runs under the
# tcab-keyvault-sync ServiceAccount, whose `azure.workload.identity/client-id`
# annotation names the user-assigned managed identity federated to this
# (namespace, ServiceAccount) subject. See the runbook for the `az identity
# federated-credential` + Key Vault role-assignment commands.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-keyvault-sync
  namespace: tcab-prod # retargeted by the including overlay's `namespace:` directive
  labels:
    app.kubernetes.io/name: tcab-keyvault-sync
    app.kubernetes.io/part-of: test-cabinet
  annotations:
    # The user-assigned managed identity's CLIENT id (same value as the
    # SecretProviderClass's clientID). Filled from the runbook.
    azure.workload.identity/client-id: "8a5a62e4-7a86-4571-acc5-73107be6e015"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-keyvault-sync
  namespace: tcab-prod
  labels:
    app.kubernetes.io/name: tcab-keyvault-sync
    app.kubernetes.io/part-of: test-cabinet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-keyvault-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-keyvault-sync
        app.kubernetes.io/part-of: test-cabinet
        # Triggers the azure-workload-identity webhook to project the federated token.
        azure.workload.identity/use: "true"
      annotations:
        # The CSI driver only keeps the materialised Secrets (that backend/auth/dispatcher
        # consume) present while a pod mounting this SecretProviderClass volume is running.
        # Don't let the cluster autoscaler drain a node out from under this sole mounter
        # during scale-down consolidation, or secret sync lapses. Planned node upgrades,
        # which don't honor this annotation, still move the pod.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: tcab-keyvault-sync
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tcab-keyvault
