# Key Vault → Kubernetes Secret sync, via the Secrets Store CSI driver.
#
# The azure-* overlays' Deployments/StatefulSets read their configuration from
# native Kubernetes Secrets (tcab-backend-secrets, tcab-auth-secrets,
# tcab-dispatcher-secrets, tcab-driver-secrets) by secretKeyRef/envFrom. This
# SecretProviderClass mirrors the values out of Azure Key Vault into exactly those
# Secrets so nothing sensitive is ever committed to git: the CSI driver fetches each
# Key Vault secret and `secretObjects` materialises it into a Kubernetes Secret with
# the env-var key names the services expect.
#
# Key Vault secret names cannot contain underscores, so they are named with dashes
# here (objectName) and mapped to the services' underscored env keys (key) below.
#
# IMPORTANT: the Azure provider fails the volume mount if ANY listed `objects` entry
# is absent from the vault. So this lists only the secrets that exist today. To turn
# on public-gallery publishing or the Anthropic harness, add the commented entries
# below AND create the matching vault secrets (see the runbook), then restart the
# tcab-keyvault-sync pod.
#
# Authentication is Azure Workload Identity: the sync pod (secret-sync.yaml) runs
# under the tcab-keyvault-sync ServiceAccount, federated to a user-assigned managed
# identity that has `get` on the vault. `clientID` below is that identity's CLIENT id.
#
# Materialisation caveat: the CSI driver only creates/maintains these Kubernetes
# Secrets while a pod mounting this SecretProviderClass volume is running — that pod
# is the always-on tcab-keyvault-sync Deployment in secret-sync.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tcab-keyvault
  namespace: tcab-prod # retargeted by the including overlay's `namespace:` directive
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # The user-assigned managed identity's CLIENT id (not object/principal id).
    clientID: "8a5a62e4-7a86-4571-acc5-73107be6e015"
    keyvaultName: "testcabinet-clockwyrks"
    tenantId: "75cb0429-bfe6-4871-bdef-aee2f90fa515"
    # Every Key Vault secret this deployment consumes, fetched by its (dashed) name.
    # Each MUST exist in the vault or the mount fails.
    objects: |
      array:
        - |
          objectName: tcab-backend-database-url
          objectType: secret
        - |
          objectName: tcab-auth-database-url
          objectType: secret
        - |
          objectName: tcab-backend-service-token
          objectType: secret
        - |
          objectName: openrouter-api-key
          objectType: secret
        # Subscription credentials (Codex + Claude Code), uploaded by
        # scripts/upload-subscription-creds.sh. Re-run that script when the tokens
        # refresh (Claude Code ~daily, Codex ~weekly).
        - |
          objectName: codex-auth-json
          objectType: secret
        - |
          objectName: claude-config-json
          objectType: secret
        - |
          objectName: claude-credentials-json
          objectType: secret
        # ── Enable the Anthropic (claude) harness: create `anthropic-api-key` in the
        #    vault, then uncomment. ──
        # - |
        #   objectName: anthropic-api-key
        #   objectType: secret
        # Public-gallery publishing: the backend uploads the snapshot to R2 and fires
        # the Pages deploy hook to rebuild the gallery (crates/backend config.rs).
        - |
          objectName: tcab-r2-account-id
          objectType: secret
        - |
          objectName: tcab-r2-bucket
          objectType: secret
        - |
          objectName: tcab-r2-access-key-id
          objectType: secret
        - |
          objectName: tcab-r2-secret-access-key
          objectType: secret
        - |
          objectName: tcab-r2-endpoint
          objectType: secret
        - |
          objectName: tcab-site-deploy-hook-url
          objectType: secret
        # In-cluster publishing: the per-publish tcab-publisher Job releases the run's
        # source to a public GitHub repo (`gh`, reads GH_TOKEN) and deploys the playable
        # build to Cloudflare Pages (`wrangler`, reads CLOUDFLARE_API_TOKEN +
        # CLOUDFLARE_ACCOUNT_ID). All MUST exist in the vault before this overlay is
        # applied or the mount fails:
        #   github-pat                  — value from the repo .env GITHUB_PAT.
        #   cloudflare-pages-api-token  — a real Cloudflare API token with Pages: Edit
        #                                 (the operator mints this; see the runbook).
        #   cloudflare-account-id       — the Cloudflare account id (repo .env
        #                                 CLOUDFLARE_ACCOUNT_ID). Without it `wrangler`
        #                                 tries to auto-discover the account via
        #                                 /memberships, which a Pages-scoped token can't
        #                                 read, and the deploy fails to authenticate.
        - |
          objectName: github-pat
          objectType: secret
        - |
          objectName: cloudflare-pages-api-token
          objectType: secret
        - |
          objectName: cloudflare-account-id
          objectType: secret
        # cert-manager DNS-01 solver token (Zone:DNS:Edit on testcabinet.ai) for the
        # internal-ingress ClusterIssuer. A NEW vault secret distinct from the
        # Pages-scoped cloudflare-pages-api-token above; uploaded from the repo .env
        # CLOUDFLARE_DNS_API_TOKEN. MUST exist in the vault before this overlay applies.
        - |
          objectName: cloudflare-dns-token
          objectType: secret
        # Grafana admin credentials for the in-cluster observability stack (tcab-lgtm),
        # consumed by the azure-prod overlay's patch-grafana-auth.yaml once Grafana is
        # exposed over the internal ingress (it disables the otel-lgtm anonymous-admin
        # default). BOTH MUST exist in the vault before this overlay applies, or the
        # mount fails (all-or-nothing) — mint a strong password and upload both.
        - |
          objectName: grafana-admin-user
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
  # Fan the fetched values into the Secrets the workloads reference by name.
  secretObjects:
    # Backend: the managed-PostgreSQL connection string and the shared service token.
    # (R2 creds + the deploy hook are added here when publishing is enabled — the
    # backend treats them as optional and simply skips publishing without them.)
    - secretName: tcab-backend-secrets
      type: Opaque
      data:
        - objectName: tcab-backend-database-url
          key: TCAB_BACKEND_DATABASE_URL
        - objectName: tcab-backend-service-token
          key: TCAB_BACKEND_SERVICE_TOKEN
        - objectName: tcab-r2-account-id
          key: TCAB_R2_ACCOUNT_ID
        - objectName: tcab-r2-bucket
          key: TCAB_R2_BUCKET
        - objectName: tcab-r2-access-key-id
          key: TCAB_R2_ACCESS_KEY_ID
        - objectName: tcab-r2-secret-access-key
          key: TCAB_R2_SECRET_ACCESS_KEY
        - objectName: tcab-r2-endpoint
          key: TCAB_R2_ENDPOINT
        - objectName: tcab-site-deploy-hook-url
          key: TCAB_SITE_DEPLOY_HOOK_URL
    # Auth service: its own managed-PostgreSQL connection string.
    - secretName: tcab-auth-secrets
      type: Opaque
      data:
        - objectName: tcab-auth-database-url
          key: TCAB_AUTH_DATABASE_URL
    # Dispatcher: the shared service token — MUST equal the backend's copy above
    # (same Key Vault secret), or the queue never drains.
    - secretName: tcab-dispatcher-secrets
      type: Opaque
      data:
        - objectName: tcab-backend-service-token
          key: TCAB_BACKEND_SERVICE_TOKEN
    # Driver: the harness provider key the dispatcher mounts (envFrom) into every
    # per-run driver Job. OpenRouter covers the cline/goose/kilo/opencode/pi
    # harnesses; add ANTHROPIC_API_KEY (from anthropic-api-key, uncommented above)
    # for the claude harness.
    - secretName: tcab-driver-secrets
      type: Opaque
      data:
        - objectName: openrouter-api-key
          key: OPENROUTER_API_KEY
        # - objectName: anthropic-api-key
        #   key: ANTHROPIC_API_KEY
    # Driver SUBSCRIPTION credentials — the harness sign-in files the dispatcher
    # mounts (as a read-only volume, not env) into each driver Job. The keys are the
    # credential BASENAMES the driver projects into the sandbox; refresh the values
    # with scripts/upload-subscription-creds.sh.
    - secretName: tcab-driver-subscription
      type: Opaque
      data:
        - objectName: codex-auth-json
          key: auth.json
        - objectName: claude-config-json
          key: .claude.json
        - objectName: claude-credentials-json
          key: .credentials.json
    # Publisher: the GitHub + Cloudflare credentials the dispatcher mounts (envFrom,
    # via TCAB_DISPATCHER_PUBLISHER_SECRETS) into each per-publish tcab-publisher Job.
    # The keys are the env-var names the publisher's tools read: `gh` reads GH_TOKEN
    # and `wrangler` reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (the account id
    # lets wrangler skip the /memberships auto-discovery a Pages-scoped token can't do).
    # If you add keys to an already-synced Secret, `kubectl delete secret
    # tcab-publisher-secrets` then restart tcab-keyvault-sync (the CSI driver won't
    # add keys to an already-synced Secret on remount).
    - secretName: tcab-publisher-secrets
      type: Opaque
      data:
        - objectName: github-pat
          key: GH_TOKEN
        - objectName: cloudflare-pages-api-token
          key: CLOUDFLARE_API_TOKEN
        - objectName: cloudflare-account-id
          key: CLOUDFLARE_ACCOUNT_ID
    # cert-manager's Cloudflare DNS-01 token, for the internal-ingress
    # letsencrypt-internal ClusterIssuer (apiTokenSecretRef → name cert-manager-cloudflare,
    # key api-token). The ClusterIssuer is cluster-scoped; cert-manager is installed with
    # --set clusterResourceNamespace=tcab-prod so it resolves this Secret from tcab-prod
    # (where the CSI sync materialises it) instead of the cert-manager namespace. NEW
    # Secret, so it syncs cleanly on the next tcab-keyvault-sync rollout.
    - secretName: cert-manager-cloudflare
      type: Opaque
      data:
        - objectName: cloudflare-dns-token
          key: api-token
    # Grafana admin credentials — the tcab-lgtm StatefulSet reads these by secretKeyRef
    # (azure-prod patch-grafana-auth.yaml) as GF_SECURITY_ADMIN_USER / _PASSWORD once
    # anonymous access is disabled. NEW Secret, so it syncs cleanly on the next
    # tcab-keyvault-sync rollout.
    - secretName: tcab-grafana-admin
      type: Opaque
      data:
        - objectName: grafana-admin-user
          key: admin-user
        - objectName: grafana-admin-password
          key: admin-password
