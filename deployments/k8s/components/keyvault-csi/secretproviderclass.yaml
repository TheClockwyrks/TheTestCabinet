# Key Vault → Kubernetes Secret sync, via the Secrets Store CSI driver.
#
# The azure-* overlays' Deployments/StatefulSets read their configuration from
# native Kubernetes Secrets (tcab-backend-secrets, tcab-auth-secrets,
# tcab-dispatcher-secrets, tcab-driver-secrets) by secretKeyRef/envFrom. This
# SecretProviderClass mirrors the values out of Azure Key Vault into exactly those
# Secrets so nothing sensitive is ever committed to git: the CSI driver fetches each
# Key Vault secret and `secretObjects` materialises it into a Kubernetes Secret with
# the env-var key names the services expect.
#
# Key Vault secret names cannot contain underscores, so they are named with dashes
# here (objectName) and mapped to the services' underscored env keys (key) below.
#
# IMPORTANT: the Azure provider fails the volume mount if ANY listed `objects` entry
# is absent from the vault. So this lists only the secrets that exist today. To turn
# on public-gallery publishing or the Anthropic harness, add the commented entries
# below AND create the matching vault secrets (see the runbook), then restart the
# tcab-keyvault-sync pod.
#
# Authentication is Azure Workload Identity: the sync pod (secret-sync.yaml) runs
# under the tcab-keyvault-sync ServiceAccount, federated to a user-assigned managed
# identity that has `get` on the vault. `clientID` below is that identity's CLIENT id.
#
# Materialisation caveat: the CSI driver only creates/maintains these Kubernetes
# Secrets while a pod mounting this SecretProviderClass volume is running — that pod
# is the always-on tcab-keyvault-sync Deployment in secret-sync.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tcab-keyvault
  namespace: tcab-prod # retargeted by the including overlay's `namespace:` directive
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # The user-assigned managed identity's CLIENT id (not object/principal id).
    clientID: "8a5a62e4-7a86-4571-acc5-73107be6e015"
    keyvaultName: "testcabinet-clockwyrks"
    tenantId: "75cb0429-bfe6-4871-bdef-aee2f90fa515"
    # Every Key Vault secret this deployment consumes, fetched by its (dashed) name.
    # Each MUST exist in the vault or the mount fails.
    objects: |
      array:
        - |
          objectName: tcab-backend-database-url
          objectType: secret
        - |
          objectName: tcab-auth-database-url
          objectType: secret
        - |
          objectName: tcab-backend-service-token
          objectType: secret
        - |
          objectName: openrouter-api-key
          objectType: secret
        # ── Enable the Anthropic (claude) harness: create `anthropic-api-key` in the
        #    vault, then uncomment. ──
        # - |
        #   objectName: anthropic-api-key
        #   objectType: secret
        # ── Enable public-gallery publishing: create these four in the vault, then
        #    uncomment (and the matching tcab-backend-secrets keys below). ──
        # - |
        #   objectName: tcab-r2-account-id
        #   objectType: secret
        # - |
        #   objectName: tcab-r2-access-key-id
        #   objectType: secret
        # - |
        #   objectName: tcab-r2-secret-access-key
        #   objectType: secret
        # - |
        #   objectName: tcab-site-deploy-hook-url
        #   objectType: secret
  # Fan the fetched values into the four Secrets the workloads reference by name.
  secretObjects:
    # Backend: the managed-PostgreSQL connection string and the shared service token.
    # (R2 creds + the deploy hook are added here when publishing is enabled — the
    # backend treats them as optional and simply skips publishing without them.)
    - secretName: tcab-backend-secrets
      type: Opaque
      data:
        - objectName: tcab-backend-database-url
          key: TCAB_BACKEND_DATABASE_URL
        - objectName: tcab-backend-service-token
          key: TCAB_BACKEND_SERVICE_TOKEN
        # - objectName: tcab-r2-account-id
        #   key: TCAB_R2_ACCOUNT_ID
        # - objectName: tcab-r2-access-key-id
        #   key: TCAB_R2_ACCESS_KEY_ID
        # - objectName: tcab-r2-secret-access-key
        #   key: TCAB_R2_SECRET_ACCESS_KEY
        # - objectName: tcab-site-deploy-hook-url
        #   key: TCAB_SITE_DEPLOY_HOOK_URL
    # Auth service: its own managed-PostgreSQL connection string.
    - secretName: tcab-auth-secrets
      type: Opaque
      data:
        - objectName: tcab-auth-database-url
          key: TCAB_AUTH_DATABASE_URL
    # Dispatcher: the shared service token — MUST equal the backend's copy above
    # (same Key Vault secret), or the queue never drains.
    - secretName: tcab-dispatcher-secrets
      type: Opaque
      data:
        - objectName: tcab-backend-service-token
          key: TCAB_BACKEND_SERVICE_TOKEN
    # Driver: the harness provider key the dispatcher mounts (envFrom) into every
    # per-run driver Job. OpenRouter covers the cline/goose/kilo/opencode/pi
    # harnesses; add ANTHROPIC_API_KEY (from anthropic-api-key, uncommented above)
    # for the claude harness.
    - secretName: tcab-driver-secrets
      type: Opaque
      data:
        - objectName: openrouter-api-key
          key: OPENROUTER_API_KEY
        # - objectName: anthropic-api-key
        #   key: ANTHROPIC_API_KEY
