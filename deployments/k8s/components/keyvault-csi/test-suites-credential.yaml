# The read-only test suites credential: Key Vault → the `tcab-test-suites-credential`
# Kubernetes Secret (key `token`), which the backend pod's ingest sidecar mounts as a
# file (patch-backend-ingest.yaml in the staging and prod overlays) to fetch the test
# suites submodule. It is an Azure DevOps personal access token scoped to Code (Read)
# on the test suites repository, uploaded by
# deployments/k8s/secrets/upload-test-suites-credential.sh.
#
# WHY A SEPARATE SecretProviderClass AND MOUNTER: the Azure provider fails a volume
# mount when ANY object its SecretProviderClass lists is absent from the vault
# (all-or-nothing). Listed in the shared `tcab-keyvault` class, a token not yet
# uploaded would stop that class's only mounter, tcab-keyvault-sync, from mounting on
# its next start, and with it the maintenance of every Secret the backend, auth
# service, dispatcher and drivers read. Here its absence costs only this credential:
# tcab-keyvault-sync-test-suites waits in ContainerCreating (its events name the
# missing `test-suites-read-token`), the deploy's settle step reports it, the backend
# starts anyway (its volume of this Secret is optional) and ingests without the
# suites, and the pod mounts once the script has uploaded the token.
#
# It reuses the tcab-keyvault-sync ServiceAccount (secret-sync.yaml), so the same
# federated identity and vault grant serve both classes; the staging overlay's
# patch-keyvault.yaml repoints both classes at the staging vault and identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tcab-keyvault-test-suites
  namespace: tcab-prod # retargeted by the including overlay's `namespace:` directive
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # The same values as the tcab-keyvault class (secretproviderclass.yaml).
    clientID: "8a5a62e4-7a86-4571-acc5-73107be6e015"
    keyvaultName: "testcabinet-clockwyrks"
    tenantId: "75cb0429-bfe6-4871-bdef-aee2f90fa515"
    objects: |
      array:
        - |
          objectName: test-suites-read-token
          objectType: secret
  secretObjects:
    # Mounted as a file rather than read as env, so a rotated token is read on the
    # sidecar's next fetch.
    - secretName: tcab-test-suites-credential
      type: Opaque
      data:
        - objectName: test-suites-read-token
          key: token
---
# The pod that keeps the class above mounted, and so the Secret materialised, exactly
# as tcab-keyvault-sync does for the shared class (see secret-sync.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-keyvault-sync-test-suites
  namespace: tcab-prod
  labels:
    app.kubernetes.io/name: tcab-keyvault-sync-test-suites
    app.kubernetes.io/part-of: test-cabinet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-keyvault-sync-test-suites
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-keyvault-sync-test-suites
        app.kubernetes.io/part-of: test-cabinet
        azure.workload.identity/use: "true"
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: tcab-keyvault-sync
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            # Memory request == limit, as on tcab-keyvault-sync.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tcab-keyvault-test-suites
