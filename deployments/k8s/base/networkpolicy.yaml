# Optional NetworkPolicy. Nothing outside the cluster connects in (the edge's
# tunnel is outbound), so reachability is already limited to the cluster network;
# this tightens it. The console reaches the backend, the artifacts service and the
# arena through the edge, so no console-to-service flow exists here: the edge
# component (components/edge) adds the flows from its tunnel's pods. Your cluster
# needs a NetworkPolicy-enforcing CNI (Calico, Cilium, etc.) for these to take
# effect.
#
# Pod labels this policy selects on (set by the dispatcher + driver):
#   - dispatcher pod:  app.kubernetes.io/name: tcab-dispatcher
#   - driver Job pods: app.kubernetes.io/managed-by: tcab-dispatcher (the Jobs it creates)
#   - sandbox pods:    app.kubernetes.io/managed-by: tcab-driver     (created by a driver)
#   - artifact pods:   app.kubernetes.io/name: tcab-artifacts
#   - repos pods:      app.kubernetes.io/name: tcab-repos
#
# Publish Job pods carry the driver Job pods' label (the dispatcher creates both),
# so every flow from a driver below admits the publisher too.
#
# Sandbox pods need NO inbound access except the driver's exec/preview connections —
# exec rides the API server, preview is the driver pod reaching the sandbox pod —
# and only the egress their harness needs.

# Default-deny ingress for the namespace; allow egress (DNS, model APIs, registries).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-default-deny-ingress
  namespace: tcab-prod
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  # No ingress rules => deny all inbound by default; add explicit allows below.
---
# Let the control-plane callers reach the backend: the dispatcher (claim + status),
# the driver Job pods (stream events/preview/status, push the record), the artifact
# and repos services (verify a driver's per-job or a publisher's per-publish-job
# token; the repos service also reads a published run's record) and the arena.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-allow-services-from-runners
  namespace: tcab-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcab-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # The dispatcher.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-dispatcher
        # Every driver Job pod (the dispatcher labels them managed-by itself).
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tcab-dispatcher
        # The artifact service (forwards a driver's per-job token to the backend).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-artifacts
        # The repos service (forwards a driver's per-job or a publisher's
        # per-publish-job token to the backend, and reads the record a publish
        # stamps its commit with).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-repos
        # The arena service (fetches controller inputs from the backend and persists
        # finished tournaments + replays back to it).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-arena
---
# Let the artifact service's two callers in: a driver Job pod uploading its produced
# run tree, and the backend managing that tree's lifetime (pruning a deleted run's
# tree, and listing + sweeping the trees no run row references).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Named for the driver flow it was created for. Keep the name: a rename strands the
  # old object in every live cluster (a kustomize apply does not prune) and breaks the
  # local overlay's delete patch, which targets this policy by name.
  name: tcab-allow-artifacts-from-drivers
  namespace: tcab-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcab-artifacts
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Every driver Job pod (the dispatcher labels them managed-by itself).
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tcab-dispatcher
        # The backend, over TCAB_ARTIFACTS_URL. Without this the prune and the sweep
        # are refused by the default-deny ingress as a connection timeout, which reads
        # as an artifact-service outage rather than a policy refusal, and a deleted
        # run's tree occupies the volume forever.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-backend
---
# Let the repos service's callers in: a driver Job pod uploading the run's bundle, a
# publish Job pod asking for the public push (both labelled managed-by the
# dispatcher), and the backend reading a bundle for a console's download and
# deleting a deleted run's bundle. The service's own traffic out (its Blob
# container, GitHub and the backend) is egress, which no policy here restricts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-allow-repos-from-callers
  namespace: tcab-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcab-repos
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Every driver and publish Job pod (the dispatcher labels them managed-by
        # itself).
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tcab-dispatcher
        # The backend, over TCAB_REPOS_URL.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tcab-backend
---
# Let a sandbox pod reach its driver: the live asset-preview stream and the run-tree
# collection both have the sandbox connect back to the driver pod's IP, so the driver
# pod is the ingress target. Collection is not best-effort — a run whose tree cannot
# reach its driver fails — so this policy is load-bearing wherever policies are enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcab-allow-driver-from-sandbox
  namespace: tcab-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: tcab-dispatcher
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tcab-driver
