# Auth service: the same single-replica StatefulSet + PersistentVolumeClaim shape
# as the backend (its own SQLite accounts database is single-writer), plus a
# ClusterIP Service. Point TCAB_AUTH_DATABASE_URL at a postgres:// instance to run
# it as a plain stateless Deployment instead. It renders nothing, so its image
# (deployments/images/auth.Dockerfile) ships no browser.
apiVersion: v1
kind: Service
metadata:
  name: tcab-auth
  namespace: tcab-prod
spec:
  selector:
    app.kubernetes.io/name: tcab-auth
  ports:
    - name: http
      port: 8789
      targetPort: 8789
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-auth
  namespace: tcab-prod
spec:
  serviceName: tcab-auth
  replicas: 1 # single-writer SQLite accounts store
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-auth
        app.kubernetes.io/part-of: test-cabinet
    spec:
      containers:
        - name: auth
          image: REPLACE_REGISTRY/tcab-auth-service:latest # CI publishes ghcr.io/<owner>/tcab-auth-service; pin a :<git-sha> tag
          resources:
          # MEMORY REQUEST == LIMIT. The scheduler packs a node by requests and
            # ignores limits, so a gap between them is memory promised twice; an
            # unbounded container is worse still, because it makes the sum of a node's
            # limits unknowable and so removes the only guarantee that a run pod cannot
            # be killed to satisfy someone else's growth. See the `TCAB_K8S_RUN_MEMORY_*`
            # commentary in base/dispatcher.yaml for the full argument.
            #
            # Sized from prod, 2026-08-18: each container's cgroup high-water mark
            # (`memory.peak`) over the pods' then ~4-day lifetime, cross-checked against
            # the anon/file split in `memory.stat`. Peak totals include reclaimable page
            # cache, which cgroup v2 evicts under limit pressure rather than OOM-killing
            # for, so the ceilings below are sized against anonymous memory plus slab
            # with headroom, not against the cache-inflated peak.
            #
            # Prod peak 8Mi. 256Mi is ~32x that: the auth service holds sessions and
            # little else, and the headroom costs a node almost nothing.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          ports:
            - containerPort: 8789
          env:
            - name: TCAB_AUTH_BIND
              value: "0.0.0.0:8789"
            - name: TCAB_AUTH_DATABASE_URL
              value: "sqlite:///state/tcab-auth.sqlite?mode=rwc"
            - name: TCAB_ENV
              value: "prod"
          volumeMounts:
            - name: state
              mountPath: /state
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        # storageClassName: <your-block-storage-class>
