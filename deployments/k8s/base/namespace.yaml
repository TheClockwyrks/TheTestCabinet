# One namespace per environment. Apply with the name for the environment you are
# building — `tcab-staging` or `tcab-prod` — and pass `-n <name>` (or edit each
# manifest's metadata.namespace) when applying the rest.
#
#   kubectl apply -f deployments/k8s/base/namespace.yaml
#
# Tearing an environment down is `kubectl delete namespace tcab-<env>`.
apiVersion: v1
kind: Namespace
metadata:
  name: tcab-prod
  labels:
    app.kubernetes.io/part-of: test-cabinet
    # Tag the environment; mirror this into TCAB_ENV on each workload.
    tcab.dev/env: prod
