# Secret + ConfigMap templates — PLACEHOLDER VALUES ONLY, never commit real
# secrets. In a real deployment, create these from your secret manager (e.g.
# `kubectl create secret`, External Secrets, Sealed Secrets) rather than applying
# this file. The repo-root .env.backend.example / .env.auth.example /
# .env.dispatcher.example / .env.artifacts.example remain the authoritative
# reference for every variable.
#
# stringData is shown for readability; Kubernetes stores it base64-encoded.

# ── Backend secrets: R2 credentials, the gallery deploy hook, and the shared ──
# ── dispatcher service token ─────────────────────────────────────────────────
# TCAB_BACKEND_SERVICE_TOKEN must MATCH the dispatcher's copy (tcab-dispatcher-secrets,
# defined in dispatcher.yaml) — the dispatcher authenticates its job claim with it.
apiVersion: v1
kind: Secret
metadata:
  name: tcab-backend-secrets
  namespace: tcab-prod
type: Opaque
stringData:
  TCAB_R2_ACCOUNT_ID: "REPLACE_ME"
  TCAB_R2_ACCESS_KEY_ID: "REPLACE_ME"
  TCAB_R2_SECRET_ACCESS_KEY: "REPLACE_ME"
  TCAB_SITE_DEPLOY_HOOK_URL: "https://REPLACE_ME"
  TCAB_BACKEND_SERVICE_TOKEN: "REPLACE_ME" # must equal the dispatcher's token
---
# ── Dispatcher secrets: the shared service token it claims jobs with ──────────
# The SAME value the backend carries above. The dispatcher reaches the backend's
# job-queue endpoints with it; mismatched values mean the queue never drains.
apiVersion: v1
kind: Secret
metadata:
  name: tcab-dispatcher-secrets
  namespace: tcab-prod
type: Opaque
stringData:
  TCAB_BACKEND_SERVICE_TOKEN: "REPLACE_ME" # must equal the backend's token
---
# ── Driver secrets: the harness API key(s) the run injects into its sandbox ───
# The dispatcher mounts this Secret into every driver Job's env (via
# TCAB_DISPATCHER_DRIVER_SECRETS); the run engine reads the harness provider key
# from the driver's environment and injects it into the sandbox pod it creates.
# Include only the harness key(s) this deployment will run.
apiVersion: v1
kind: Secret
metadata:
  name: tcab-driver-secrets
  namespace: tcab-prod
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  # OPENAI_API_KEY: "REPLACE_ME"        # codex (injected into the sandbox pod as CODEX_API_KEY)
  # OPENROUTER_API_KEY: "REPLACE_ME"    # cline, goose, kilo, opencode, pi
---
# ── Driver SUBSCRIPTION credentials: the harness sign-in files (option 1) ─────
# An OPTIONAL, additive parallel to tcab-driver-secrets above. The dispatcher
# mounts this Secret as a READ-ONLY VOLUME (not env) into each driver Job at
# TCAB_DISPATCHER_DRIVER_SUBSCRIPTION_DIR (default /var/run/tcab/subscription),
# with optional:true so a missing Secret never wedges API-key-only driver pods.
# The driver maps each key (a credential BASENAME) back to the harness's full
# container path and authenticates the subscription without a host home — the only
# way to run the subscription-only Antigravity harness on the cluster path.
#
# One shared subscription per deployment (per-account vaults are a deferred
# follow-up). Create it for real from a TRUSTED host where the harness CLIs are
# signed in, e.g.:
#   kubectl -n tcab-prod create secret generic tcab-driver-subscription \
#     --from-file=.credentials.json="$HOME/.claude/.credentials.json" \
#     --from-file=auth.json="$CODEX_HOME/auth.json" \
#     --from-file=antigravity-oauth-token="$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
# Each key below is the credential BASENAME; the comment names its harness and the
# full container path the driver projects it to. Include only the harness(es) this
# deployment runs under subscription.
apiVersion: v1
kind: Secret
metadata:
  name: tcab-driver-subscription
  namespace: tcab-prod
type: Opaque
stringData:
  # claude  → /home/node/.claude/.credentials.json (required)
  .credentials.json: "REPLACE_ME"
  # claude  → /home/node/.claude.json (optional CLI state)
  # .claude.json: "REPLACE_ME"
  # codex   → /home/node/.codex/auth.json (required)
  # auth.json: "REPLACE_ME"
  # antigravity → /home/node/.gemini/antigravity-cli/antigravity-oauth-token (required; subscription-ONLY harness)
  # antigravity-oauth-token: "REPLACE_ME"
---
# ── Publisher secrets: the GitHub + Cloudflare creds the per-publish Job uses ──
# OPTIONAL, opt-in per overlay (see each overlay's patch-dispatcher-publisher.yaml,
# which sets TCAB_DISPATCHER_PUBLISHER_SECRETS=tcab-publisher-secrets). When enabled,
# the dispatcher envFrom-mounts this Secret into every tcab-publisher Job:
#   GH_TOKEN              → `gh`       (create/push the per-run public repo)
#   CLOUDFLARE_API_TOKEN  → `wrangler` (deploy the playable build to Cloudflare Pages)
# Create it for real from your secret manager. On the Azure overlays it is instead
# synced from Key Vault by the keyvault-csi component (github-pat /
# cloudflare-pages-api-token map to these two keys).
apiVersion: v1
kind: Secret
metadata:
  name: tcab-publisher-secrets
  namespace: tcab-prod
type: Opaque
stringData:
  GH_TOKEN: "REPLACE_ME"
  CLOUDFLARE_API_TOKEN: "REPLACE_ME"
---
# ── If the run-container images are in a private registry ────────────────────
# Reference this from the dispatcher's TCAB_K8S_IMAGE_PULL_SECRETS so the sandbox
# pods can pull them. Create it for real with:
#   kubectl create secret docker-registry tcab-registry \
#     --docker-server=<registry> --docker-username=<user> --docker-password=<token> \
#     -n tcab-prod
apiVersion: v1
kind: Secret
metadata:
  name: tcab-registry
  namespace: tcab-prod
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"REPLACE_REGISTRY":{"username":"REPLACE_ME","password":"REPLACE_ME"}}}'
