# Arena service: runs adversarial matches and tournaments (CPU-bound in-process
# wasm) on demand, so the heavy compute lives off the single-replica control-plane
# backend.
#
# This is a DATA-plane peer, deliberately separate from the backend: the console
# POSTs a match/tournament here and streams live tournament progress from here; the
# service fetches every controller input from the backend and records each
# tournament, its matches and their replays through it over HTTP as it plays, and
# resumes the unfinished ones on start. It is STATELESS — no database, no PVC — so
# it is a plain Deployment, NOT a StatefulSet. It binds 0.0.0.0:8791 and is reached
# over the cluster network, and by the console through the edge at `/arena/` of the
# environment's origin, where it verifies the Access assertion (TCAB_ACCESS_TEAM_DOMAIN
# / TCAB_ACCESS_AUDIENCE, set by the staging and prod overlays' patch-access.yaml;
# unset locally).
#
# It needs NO Kubernetes API access — it only talks HTTP to the backend. It IS the
# CPU-bound pod of the topology, so it carries real CPU requests/limits.
apiVersion: v1
kind: Service
metadata:
  name: tcab-arena
  namespace: tcab-prod
spec:
  selector:
    app.kubernetes.io/name: tcab-arena
  ports:
    - name: http
      port: 8791
      targetPort: 8791
  # ClusterIP only — the console reaches it over the cluster network; the deployment
  # supplies any public boundary, never a raw LoadBalancer here.
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcab-arena
  namespace: tcab-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-arena
  namespace: tcab-prod
spec:
  # MUST stay 1: a tournament's live NDJSON progress channel is in-memory and
  # per-pod, and one arena owns resuming every unfinished tournament the backend
  # records, so two replicas would drive one tournament twice. Scale the cap
  # (TCAB_ARENA_MAX_CONCURRENT) and the pod's CPU, not the replica count.
  replicas: 1
  # The old pod stops (recording the match each tournament is on) before the new
  # one starts and resumes them, so no tournament is ever driven by two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-arena
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-arena
        app.kubernetes.io/part-of: test-cabinet
    spec:
      serviceAccountName: tcab-arena # no API access — its own identity only
      # On SIGTERM the arena finishes and records the match each tournament is on
      # within TCAB_ARENA_SHUTDOWN_GRACE_SECONDS (50), then exits; this leaves the
      # preStop hook's five seconds and a margin before the kubelet kills it.
      terminationGracePeriodSeconds: 60
      containers:
        - name: arena
          image: REPLACE_REGISTRY/tcab-arena:latest # the staging and prod overlays name testcabinet.azurecr.io/microservice-arena
          ports:
            - containerPort: 8791
          # Fails once the arena is shutting down, so its endpoint leaves the
          # Service; liveness stays on /healthz.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8791
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8791
            periodSeconds: 10
          lifecycle:
            # Hold the pod while its endpoint's removal from the Service
            # propagates, so no new request is routed to a stopping replica.
            preStop:
              sleep:
                seconds: 5
          env:
            - name: TCAB_ARENA_BIND
              value: "0.0.0.0:8791"
            # The backend it fetches controller inputs from and records tournaments
            # through.
            - name: TCAB_BACKEND_URL
              value: "http://tcab-backend:8787"
            # The shared service token the arena presents on every backend call: every
            # backend read needs an identity, and recording a tournament takes the
            # service token. The same secret the backend verifies it against; without
            # it the backend refuses every call the arena makes.
            - name: TCAB_BACKEND_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tcab-backend-secrets
                  key: TCAB_BACKEND_SERVICE_TOKEN
            # The capacity guard: matches/tournaments running CPU-bound wasm at once
            # before the service rejects with 503. Tune with the CPU limit below.
            - name: TCAB_ARENA_MAX_CONCURRENT
              value: "2"
            # How long after SIGTERM the arena waits for each tournament's match in
            # progress to finish and be recorded; below terminationGracePeriodSeconds.
            - name: TCAB_ARENA_SHUTDOWN_GRACE_SECONDS
              value: "50"
            - name: TCAB_ENV
              value: "prod"
          resources:
            # This is the CPU-bound pod of the topology — a match is in-process wasm.
            # Give it real headroom (two concurrent matches by default); a request that
            # would exceed the cap is rejected with 503 rather than throttled.
            # Memory request == limit (see base/dispatcher.yaml): the 256Mi request
            # under a 512Mi ceiling let a node seat two of these and honour one. The
            # ceiling itself is unchanged — it is sized for concurrent wasm matches,
            # not for the 4Mi prod has actually peaked at, because prod has yet to run
            # a heavy tournament and the sandbox is what this pod exists to hold.
            #
            # CPU keeps its gap deliberately: this is the CPU-bound pod of the topology
            # and throttling is the correct pressure response for it.
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
