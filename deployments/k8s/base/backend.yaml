# Backend: a single-replica StatefulSet with a PersistentVolumeClaim for state,
# plus a ClusterIP Service. SQLite is single-writer, so replicas stays 1; point
# TCAB_BACKEND_DATABASE_URL at a postgres:// instance to drop that pin and the
# volume (see deployment/backups.md). The image must include a headless Chromium
# (deployments/images/backend.Dockerfile).
apiVersion: v1
kind: Service
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  selector:
    app.kubernetes.io/name: tcab-backend
  ports:
    - name: http
      port: 8787
      targetPort: 8787
  # ClusterIP only — never expose the backend with a public Ingress/LoadBalancer.
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tcab-backend
  namespace: tcab-prod
spec:
  serviceName: tcab-backend
  replicas: 1 # SQLite is single-writer; do not scale out.
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-backend
        app.kubernetes.io/part-of: test-cabinet
    spec:
      containers:
        - name: backend
          image: REPLACE_REGISTRY/tcab-backend:latest # CI publishes ghcr.io/<owner>/tcab-backend; pin a :<git-sha> tag
          ports:
            - containerPort: 8787
          env:
            - name: TCAB_BACKEND_BIND
              value: "0.0.0.0:8787"
            - name: TCAB_BACKEND_DATABASE_URL
              value: "sqlite:///state/tcab-backend.sqlite?mode=rwc"
            - name: TCAB_BACKEND_STORE
              value: "/state/tcab-store"
            - name: TCAB_BACKEND_CHECKOUT
              value: "/state/checkout"
            # The auth service this backend verifies tokens against.
            - name: TCAB_BACKEND_AUTH_URL
              value: "http://tcab-auth:8789"
            # The public base URL of the artifact service, reported to the console via
            # GET /config so it can resolve a pre-publish run's playable build and its
            # proof/asset media against the data plane. The artifact BYTES never transit
            # the backend — this is just the URL the console fetches them from.
            - name: TCAB_ARTIFACTS_PUBLIC_URL
              value: "http://tcab-artifacts:8790"
            # The public base URL of the arena service, reported to the console via
            # GET /config so it can POST adversarial matches/tournaments and stream
            # live tournament progress against the data plane. The arena talks HTTP
            # back to this backend; only this URL crosses to the console.
            - name: TCAB_ARENA_PUBLIC_URL
              value: "http://tcab-arena:8791"
            # The shared service token the dispatcher claims queued jobs with. MUST
            # match the dispatcher's TCAB_BACKEND_SERVICE_TOKEN (tcab-dispatcher-secrets)
            # or the queue never drains. Without it the dispatcher endpoints are
            # disabled. From the backend secret below.
            - name: TCAB_BACKEND_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tcab-backend-secrets
                  key: TCAB_BACKEND_SERVICE_TOKEN
            - name: TCAB_ENV
              value: "prod"
          envFrom:
            - secretRef:
                name: tcab-backend-secrets
          volumeMounts:
            - name: state
              mountPath: /state
          # Give the scheduler something to reserve. Without requests this container
          # is BestEffort — the first thing evicted under node pressure — which is
          # the wrong class for a single-writer pod that cannot be replaced by a
          # second replica while it restarts.
          #
          # The figures come from a populated deployment: near-idle CPU with bursts
          # to roughly a core while the publisher rebuilds the public snapshot, and
          # ~650Mi resident. Both ceilings are intentionally loose — CPU because
          # throttling this container shows up directly as console latency, memory
          # because the snapshot refresh materializes every run record at once, so
          # the peak tracks catalog size. Treat them as a runaway backstop, and
          # revisit them (rather than the other way round) if a deployment
          # legitimately outgrows them.
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1500m"
              memory: 2Gi
          # Readiness and liveness MUST stay on different endpoints. /readyz is 503
          # until the definition store holds versions, which on a store that starts
          # empty means until an ingest has filled it — minutes for a cold catalog.
          # Pointing liveness at that signal would kill the pod mid-ingest; pointing
          # readiness at /healthz (which is always 200 while the process serves)
          # admits traffic to an empty store, where every run dies on a spurious
          # "is not ingested" 404.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
            # No failureThreshold ceiling on purpose: an unready pod is only held out
            # of the Service, never restarted, so a long first ingest is free to run
            # as long as it needs.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName: <your-block-storage-class>   # avoid NFS/SMB for SQLite
