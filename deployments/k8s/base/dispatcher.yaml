# Dispatcher: a single-replica Deployment that drains the backend's run queue.
#
# The dispatcher is a thin, STATELESS controller — it holds no durable state of
# its own (the backend's `job` table is the source of truth), so it is a plain
# Deployment, not a StatefulSet, and needs no volume. It claims queued jobs from
# the backend with the shared service token, turns each into ONE driver Job (under
# the `tcab-driver` ServiceAccount, in this namespace), watches those Jobs, and
# reports a dead driver pod's failure back to the backend. Run execution then lives
# entirely in those per-run driver Jobs — there is no worker pool and no headless
# Service. Keep replicas at 1: a single drainer avoids two dispatchers racing the
# same claim (the backend's claim is atomic, so a second replica is merely wasted
# work, not a correctness risk). It binds no socket, so it has no Service.
#
# It runs under the `tcab-dispatcher` ServiceAccount (deployments/k8s/base/rbac.yaml),
# which grants exactly jobs create/get/list/watch/delete plus pods + pods/log get
# for failure reporting. See deployment/kubernetes/run-plane.md and the dispatcher's
# config docs (crates/dispatcher/src/config.rs) for every variable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcab-dispatcher
  namespace: tcab-prod
spec:
  replicas: 1 # one drainer; do not scale out (claims are atomic, extra replicas waste work)
  selector:
    matchLabels:
      app.kubernetes.io/name: tcab-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcab-dispatcher
        app.kubernetes.io/part-of: test-cabinet
    spec:
      serviceAccountName: tcab-dispatcher # RBAC to create+watch driver Jobs
      containers:
        - name: dispatcher
          image: REPLACE_REGISTRY/tcab-dispatcher:latest # the Azure pipeline publishes testcabinet.azurecr.io/tcab-dispatcher:<git-sha>
          resources:
            # MEMORY REQUEST == LIMIT, as on every ALWAYS-ON service. The scheduler
            # packs a node by requests and ignores limits, so a gap between them is
            # memory promised twice, and an unbounded service is worse still: it could
            # be what crowds a run pod off its node. A service that hits its ceiling is
            # restarted, not lost, so bounding it costs nothing a run pod pays for. The
            # RUN pods (driver + sandbox) are the deliberate exception — request and NO
            # limit — see the `TCAB_K8S_RUN_MEMORY_*` commentary below.
            #
            # Sized from prod, 2026-08-18: each container's cgroup high-water mark
            # (`memory.peak`) over the pods' then ~4-day lifetime, cross-checked against
            # the anon/file split in `memory.stat`. Peak totals include reclaimable page
            # cache, which cgroup v2 evicts under limit pressure rather than OOM-killing
            # for, so the ceilings below are sized against anonymous memory plus slab
            # with headroom, not against the cache-inflated peak.
            #
            # Prod peak 7Mi. It claims jobs and creates jobs; it never handles a run's
            # data. 256Mi is ~36x the observed peak.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          env:
            # The backend the dispatcher claims jobs from and reports driver deaths to.
            - name: TCAB_BACKEND_URL
              value: "http://tcab-backend:8787"
            # The shared service token authenticating the claim. The backend reads the
            # same value (its tcab-backend-secrets) — they MUST match for the queue to
            # drain. Stored in the dispatcher's own secret below.
            - name: TCAB_BACKEND_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tcab-dispatcher-secrets
                  key: TCAB_BACKEND_SERVICE_TOKEN
            # The driver image each created Job's pod runs. Pin the same :<git-sha>
            # the dispatcher image is pinned to so they version together.
            - name: TCAB_DRIVER_IMAGE
              value: "REPLACE_REGISTRY/tcab-driver:latest"
            # The namespace the dispatcher creates driver Jobs in (defaults to its own
            # namespace when unset; set explicitly to be unambiguous).
            - name: TCAB_DISPATCHER_NAMESPACE
              value: "tcab-prod"
            # The ServiceAccount assigned to each driver pod — the tcab-driver identity
            # (rbac.yaml) that can create/exec/delete the untrusted sandbox pods.
            - name: TCAB_DISPATCHER_DRIVER_SA
              value: "tcab-driver"
            # Queue admission: the most non-terminal driver Jobs kept in flight.
            - name: TCAB_DISPATCHER_MAX_INFLIGHT
              value: "8"
            # Back-off after an empty claim or a full in-flight cap, in seconds.
            - name: TCAB_DISPATCHER_POLL_INTERVAL_SECONDS
              value: "2"
            # ttlSecondsAfterFinished on each driver Job, for automatic cleanup.
            - name: TCAB_DISPATCHER_JOB_TTL_SECONDS
              value: "300"
            # Secret(s) mounted into each driver Job's env (comma-separated names).
            # This is how the harness provider API key (e.g. ANTHROPIC_API_KEY) reaches
            # the run engine, which reads it from the driver pod's own environment —
            # exactly as the worker did. tcab-driver-secrets is defined in
            # deployments/k8s/base/secrets.example.yaml.
            - name: TCAB_DISPATCHER_DRIVER_SECRETS
              value: "tcab-driver-secrets"
            # ── Subscription auth (ADDITIVE, parallel to the API-key path above) ──
            # The operator-provided Secret holding the harness SUBSCRIPTION
            # credential files (keyed by credential basename). When set, the
            # dispatcher mounts it as a READ-ONLY VOLUME (not env) into every driver
            # Job at the dir below, with optional:true so a missing Secret never
            # wedges API-key-only driver pods, and forwards that dir to the driver.
            # The kubelet projects the Secret as files — no RBAC Secret-read needed.
            # Leave commented (and create no Secret) for an API-key-only deployment;
            # uncomment + create tcab-driver-subscription (secrets.example.yaml) to
            # unblock subscription harnesses, including the subscription-only
            # Antigravity. Console-requested subscription runs set auth_mode on the
            # launch request; TCAB_DISPATCHER_DRIVER_AUTH_MODE force-locks it cluster-wide.
            # - name: TCAB_DISPATCHER_DRIVER_SUBSCRIPTION_SECRET
            #   value: "tcab-driver-subscription"
            # - name: TCAB_DISPATCHER_DRIVER_SUBSCRIPTION_DIR
            #   value: "/var/run/tcab/subscription"
            # - name: TCAB_DISPATCHER_DRIVER_AUTH_MODE
            #   value: "subscription"
            # ── Passed THROUGH into each driver Job verbatim ──────────────────────
            # The dispatcher does not consume these; the driver does. They scope the
            # SANDBOX pods the driver creates, not the driver pod or the dispatcher.
            # Namespace the driver creates sandbox pods in.
            - name: TCAB_K8S_NAMESPACE
              value: "tcab-prod"
            # Resource requests/limits applied to each sandbox pod.
            #
            # MEMORY: A REQUEST AND NO LIMIT, DELIBERATELY. This is the opposite of the
            # always-on services above, and the reason is what a run pod is. A memory
            # limit is a cgroup ceiling the kernel enforces by SIGKILL: a sandbox that
            # reaches it is dead that instant, deterministically, however much memory
            # the node still has free. A run may hold a sandbox for hours and spend
            # real money on harness API calls the whole time, so a sandbox OOM-killed
            # mid-run destroys a run that has already paid for every one of them. That
            # is the failure this deployment must never produce, and a limit on a run
            # pod is precisely the mechanism that produces it. (An earlier revision set
            # the limit equal to the request so a node's arithmetic was exact; the
            # first run to outgrow the ceiling was OOM-killed — exit 137 — by its own
            # cgroup, the very outcome the ceiling existed to prevent.) The same rule
            # applies to the driver pod: see DEFAULT_DRIVER_MEMORY_REQUEST in
            # crates/dispatcher/src/config.rs, which is the canonical argument.
            #
            # The REQUEST does the work instead, and it must be sized to the real peak
            # of the heaviest case the deployment will run:
            #   - the scheduler packs a node by requests, so a node admits a sandbox
            #     only when the full 4Gi is actually there;
            #   - a request keeps the pod out of BestEffort, where it would be the
            #     first thing evicted and OOM-killed;
            #   - a sandbox that grows past its request is NOT killed for doing so; it
            #     spends memory the node was not holding for it, and survives whenever
            #     the node actually has that memory spare.
            # What removing the limit does NOT do is make node memory pressure
            # harmless. If the node itself runs short, the kubelet evicts the pod
            # furthest above its request first, and the kernel's OOM killer weighs a
            # large resident set heavily — a sandbox that has outgrown its request on a
            # full node is still the likely victim (Evicted rather than OOMKilled, and
            # just as dead). The limit was a CERTAIN kill at a fixed ceiling regardless
            # of node headroom; what remains is a kill only when the node is genuinely
            # out of memory. Closing that gap is a sizing job: the request must cover
            # the real peak so the scheduler never seats a run on a node that cannot
            # hold it. Size it from `container_memory_max_usage_bytes` (the
            # observability component's cAdvisor scrape) over a window wide enough to
            # contain the rare heavy case.
            #
            # The cost is density, and it is charged in whole nodes. Node allocatable
            # is what is left after the kubelet's reservation (on AKS `Standard_D2ps_v6`,
            # 5766Mi of 7.7Gi capacity), and the DaemonSets request ~984Mi of that, so
            # ~4782Mi is actually schedulable: exactly ONE 4Gi sandbox pod per node,
            # with room for its driver pod beside it only if the driver's own request
            # stays under ~686Mi (today's 2Gi does not, by choice, so a driver lands on
            # a different node than the sandbox it drives and the two can never contend
            # for one node's memory). A 16Gi node fits three.
            #
            # CPU is oversubscribed on purpose and is not symmetric with this. A pod
            # over its CPU limit is throttled, not killed, so the failure mode is a
            # slower run rather than a destroyed one — worth trading for the density.
            #
            # WHEN RAISING THE REQUEST: the new value must still fit one node's
            # schedulable space, or the sandbox sits Pending forever. The heaviest
            # cases exceed 4Gi (a dual-contouring `double` variant needs ~8Gi — see
            # overlays/local/patch-dispatcher.yaml). Those do NOT fit an 8Gi node
            # whatever the manifest says: they no longer die at the 4Gi ceiling, but
            # they will still be evicted when the node runs short. Running them needs
            # nodes that can seat an 8Gi request, and the request raised to match.
            #
            # TCAB_K8S_RUN_MEMORY_LIMIT is intentionally NOT set. Set it only if a
            # namespace LimitRange or ResourceQuota refuses pods without one, and then
            # far above any real peak.
            - name: TCAB_K8S_RUN_CPU_REQUEST
              value: "500m"
            - name: TCAB_K8S_RUN_CPU_LIMIT
              value: "2"
            - name: TCAB_K8S_RUN_MEMORY_REQUEST
              value: "4Gi"
            # Pull secret(s) for the run-container images, if the registry is private
            # (comma-separated dockerconfigjson Secret names). Forwarded to each Job.
            # - name: TCAB_K8S_IMAGE_PULL_SECRETS
            #   value: "tcab-registry"
            # The registry + tag the driver resolves the run-container images from
            # (test-cabinet-base/-base-wasm/-sprite/-sprite-sheet/-adversarial/-performance).
            # Forwarded into every driver Job, where core's resolve_run_image reads
            # them; unset there falls back to the compiled defaults
            # (testcabinet.azurecr.io / latest). The Azure pipeline pushes each run
            # image as testcabinet.azurecr.io/<image>:<git-sha> and never :latest, so
            # every deployment pins TCAB_CONTAINER_TAG to the commit its service
            # images come from: scripts/ci/deploy.sh sets it for the azure-* overlays.
            - name: TCAB_CONTAINER_TAG
              value: "latest"
            # The artifact service each driver uploads its produced run tree to before
            # reporting terminal status. Forwarded into every driver Job. Unset skips
            # the upload (a single-box cluster with no artifact service).
            - name: TCAB_ARTIFACTS_URL
              value: "http://tcab-artifacts:8790"
            - name: TCAB_ENV
              value: "prod"
# The tcab-dispatcher-secrets Secret this reads (TCAB_BACKEND_SERVICE_TOKEN) lives
# in secrets.example.yaml alongside the other placeholders; its value MUST equal the
# backend's copy or the queue never drains.
