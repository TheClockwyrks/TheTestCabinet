# nginx server for the static web console (tcab-web).
#
# Single-page app: serve the hashed assets directly, and fall back to index.html
# for any path that is not a file on disk so client-side routes (deep links) load.
# Listens on 8080 — the unprivileged port the base image and the Deployment
# (task-2) expect. No upstreams here: the console talks to the backend/auth
# services directly over their own ingress hostnames (config injected at runtime).
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress the SPA's text assets on the way out. The console ships its app as
    # a handful of large hashed JS/CSS bundles, and nginx's `gzip` default is off,
    # so without this every first load pulls them verbatim — the dominant cost of
    # opening the console over a thin link (a VPN, hotel wifi, a phone tether).
    # These types compress by roughly an order of magnitude.
    #
    # `gzip_types` never needs `text/html`: nginx always compresses it when gzip is
    # on, and naming it here would only warn about a duplicate. Images and fonts
    # are deliberately absent — PNG/WOFF2 are already compressed, so encoding them
    # again costs CPU and returns slightly larger bytes.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        image/svg+xml;

    # SPA fallback: a real file wins; otherwise hand back index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is rendered per-container at start (see 30-render-config.sh), so it
    # must never be cached — a stale copy would point the console at the wrong
    # backend. index.html is the SPA shell that pulls in hashed (immutable) assets,
    # so it too should always be revalidated.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
