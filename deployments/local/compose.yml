# Local backend — a minimal one-service stack.
#
# This brings up the backend in a container, with a local volume for its state (its
# SQLite DB + definition store + ingest checkout). It is a quick way to exercise the
# control plane and the read APIs without a cluster. No edge stands in front of it,
# so it sets no TCAB_ACCESS_* variable and takes the identity from the
# `Cf-Access-Authenticated-User-Email` header a request presents.
#
#   docker compose -f deployments/local/compose.yml up backend
#
# Run EXECUTION is not part of this minimal stack: a run is a per-run Kubernetes
# Job (the dispatcher creates one driver Job per run), so to exercise runs locally
# use the k3d stack instead, which brings up the dispatcher + driver + artifact
# service alongside it: `make -C deployments/local local-up`. See
# apps/docs/src/content/docs/development/running.md.

services:
  backend:
    # Built from the same image used in the cluster, so the local
    # backend has the headless Chromium it needs to render references at ingest.
    build:
      context: ../..
      dockerfile: deployments/images/services.Dockerfile
      target: backend
    # The backend loads .env.backend (copied from the repo-root example). The
    # in-container paths below override the file's host-oriented defaults.
    env_file:
      - ../../.env.backend
    environment:
      TCAB_BACKEND_BIND: "0.0.0.0:8787"
      TCAB_BACKEND_DATABASE_URL: "sqlite:///state/tcab-backend.sqlite?mode=rwc"
      TCAB_BACKEND_STORE: "/state/tcab-store"
      TCAB_BACKEND_CHECKOUT: "/checkout"
      TCAB_ENV: "local"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Persistent state across restarts.
      - backend-state:/state
      # The repository, ingested via `POST /ingest`. Mounted read-only.
      - ../..:/checkout:ro

volumes:
  backend-state:
