#cloud-config
# First-boot provisioning for a worker VM (or VM Scale Set instance).
#
#   az vm create -g rg-tcab-<env> -n tcab-worker-1 \
#     --image Ubuntu2404 --size <size> \
#     --custom-data deployments/azure/worker-cloud-init.yaml
#
# Replace every <placeholder> before use. Do NOT commit real secrets here —
# cloud-init data is readable from instance metadata; pass the Tailscale auth key
# and any API keys from your secret store at `az vm create` time, e.g. by
# templating this file.
#
# This brings the node up with Docker, the harness images, the tcab-worker
# service, and a private-network address. Each worker is addressed individually
# (see deployment/azure.md) — there is no shared load balancer.

package_update: true
packages:
  - ca-certificates
  - curl

write_files:
  # The worker's environment. Mirrors deployments/env/worker.<env>.env.example;
  # the repo-root .env.worker.example is the authoritative variable reference.
  - path: /etc/test-cabinet/worker.env
    permissions: "0600"
    content: |
      TCAB_BACKEND_URL=http://<backend-private-address>:8787
      TCAB_WORKER_BIND=0.0.0.0:8788
      TCAB_ENV=<staging-or-prod>
      # Only the key(s) for the harness(es) this worker runs:
      ANTHROPIC_API_KEY=<set-from-secret-store>
      # If this worker also publishes runs:
      # GITHUB_TOKEN=<set-from-secret-store>
      # CLOUDFLARE_API_TOKEN=<set-from-secret-store>
      # CLOUDFLARE_ACCOUNT_ID=<set-from-secret-store>

  # systemd unit (a copy of deployments/systemd/tcab-worker.service).
  - path: /etc/systemd/system/tcab-worker.service
    permissions: "0644"
    content: |
      [Unit]
      Description=The Test Cabinet worker (tcab-worker)
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=simple
      EnvironmentFile=/etc/test-cabinet/worker.env
      WorkingDirectory=/var/lib/test-cabinet
      ExecStart=/usr/local/bin/tcab-worker
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── Docker (the worker runs each test case in a container) ──
  - curl -fsSL https://get.docker.com | sh

  # ── tcab-worker binary ──
  # Replace with the release asset URL for your target (static musl build).
  - curl -fsSL -o /usr/local/bin/tcab-worker "<tcab-worker-binary-url>"
  - chmod +x /usr/local/bin/tcab-worker
  - mkdir -p /var/lib/test-cabinet

  # ── Harness container images ──
  # Pull the images this worker may run from your registry. The worker resolves
  # images per its TCAB_CONTAINER_REGISTRY configuration (see containers/README.md).
  - docker pull <registry>/test-cabinet-base:latest
  - docker pull <registry>/test-cabinet-claude:latest

  # ── Private network (Tailscale) ──
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --auth-key "<tailscale-auth-key>" --hostname "tcab-worker-<env>-1"

  # ── Start the worker ──
  - systemctl daemon-reload
  - systemctl enable --now tcab-worker.service
