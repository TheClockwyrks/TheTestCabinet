# Example Azure Container App definition for the backend.
#
#   az containerapp create -g rg-tcab-<env> -n tcab-backend \
#     --environment <containerapps-env> \
#     --yaml deployments/azure/containerapp.yaml
#
# Placeholders in <angle brackets> must be filled in. Secrets (R2 keys, deploy
# hook) are referenced from the Container App's secret store, NOT inlined here.
# Non-secret env values come from deployments/env/backend.<env>.env.example.
#
# The three rules that matter (see deployment/azure.md):
#   1. ONE replica — SQLite is single-writer.
#   2. A persistent volume mounted at the DB / store / checkout paths.
#   3. Internal ingress only — never a public FQDN.

properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false          # internal ingress only — private network reach
      targetPort: 8787
      transport: http
    secrets:
      - name: r2-account-id
        value: "<set-via-az-containerapp-secret-set>"
      - name: r2-bucket
        value: "<set-via-az-containerapp-secret-set>"
      - name: r2-access-key-id
        value: "<set-via-az-containerapp-secret-set>"
      - name: r2-secret-access-key
        value: "<set-via-az-containerapp-secret-set>"
      - name: site-deploy-hook-url
        value: "<set-via-az-containerapp-secret-set>"
    registries:
      - server: "<registry>.azurecr.io"
        identity: system
  template:
    # Pin to exactly one replica — do not autoscale this service.
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes:
      - name: backend-state
        storageType: AzureFile      # prefer an NFS Azure Files share for SQLite
        storageName: "<containerapps-azurefile-storage-name>"
    containers:
      - name: tcab-backend
        image: "<registry>.azurecr.io/tcab-backend:<tag>"
        resources:
          cpu: 1.0
          memory: 2.0Gi
        volumeMounts:
          - volumeName: backend-state
            mountPath: /state
        env:
          # ── Non-secret (mirror deployments/env/backend.<env>.env.example) ──
          - name: TCAB_BACKEND_BIND
            value: "0.0.0.0:8787"
          - name: TCAB_BACKEND_DB
            value: "/state/tcab-backend.sqlite"
          - name: TCAB_BACKEND_STORE
            value: "/state/tcab-store"
          - name: TCAB_BACKEND_CHECKOUT
            value: "/state/checkout"
          - name: TCAB_ENV
            value: "<staging-or-prod>"
          # ── Secret references ──
          - name: TCAB_R2_ACCOUNT_ID
            secretRef: r2-account-id
          - name: TCAB_R2_BUCKET
            secretRef: r2-bucket
          - name: TCAB_R2_ACCESS_KEY_ID
            secretRef: r2-access-key-id
          - name: TCAB_R2_SECRET_ACCESS_KEY
            secretRef: r2-secret-access-key
          - name: TCAB_SITE_DEPLOY_HOOK_URL
            secretRef: site-deploy-hook-url
