# pre-commit configuration for The Test Cabinet.
#
# Most of these are fast, trivial gates that run on every `git commit`. The two
# deliberate exceptions are clippy (rust-clippy) and rustdoc (rust-doc): both
# compile the workspace and so are slower, but they guard against landing lint
# failures locally. They share their compilation artifacts, so running the pair
# costs little more than clippy alone. The remaining slow gates (the test suite,
# the web/docs builds) still live only in CI (scripts/ci/*, driven by
# azure-pipelines.yml and .github/workflows/ci.yml).
#
# Note rust-doc is not doctests: it checks that doc comments' intra-doc links
# resolve, which no other gate sees. Doctests (`cargo test --doc`) run the code
# examples inside those comments and stay CI-only — every doctest in this
# workspace is currently `ignore`/`text`, so running them locally would cost
# ~35s to execute zero tests.
#
# Setup is a single idempotent command: `scripts/setup-hooks.sh` (also run
# automatically when the devcontainer is created). If a hook ever blocks a commit
# you know is fine, `git commit --no-verify` bypasses it; CI remains the backstop.
#
# Revisions are pinned; refresh them with `pre-commit autoupdate`.
minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Committed case media are an intentional binary category that routinely
        # exceeds the 500KB default; exempt those dirs. `validation-baseline/` holds
        # the webm/png baseline clips synthesized by `tcab publish-reference
        # --baselines-only`; `reference/screenshots/` holds the per-variant reference
        # renders of a case's authored mockups (a full-detail gameplay frame is a
        # large PNG). `reference-impl/<variant>/assets/` holds the sprites, particle
        # systems, and audio the reference build produced with the asset-generation
        # tools (a music bed is several MB of WAV). All are generated wholesale and
        # tracked deliberately.
        exclude: '(^|/)(validation-baseline|reference/screenshots)/|(^|/)reference-impl/[^/]+/assets/'
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
        # tsconfig, devcontainer.json, and VSCode's .json are JSON-with-comments
        # (JSONC), which this strict JSON parser rejects; skip them.
        exclude: '(^|/)tsconfig[^/]*\.json$|(^|/)devcontainer\.json$|(^|/)\.vscode/.*\.json$'
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        # Rust files open with inner attributes like `#![forbid(unsafe_code)]`,
        # which this hook mistakes for a shebang; opt them out entirely.
        exclude: '\.rs$'
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
        # The VSCode workspace file documents where the settings schema lives
        # with deliberate links to a vscode *release branch* (the line numbers
        # track that release), not a commit — exempt it from the permalink rule.
        exclude: '(^|/)[^/]*\.code-workspace$'
      - id: check-xml
      - id: check-yaml
        # The Kubernetes manifests under deployments/ are multi-document YAML
        # (several resources separated by `---`); allow that.
        args: ["--allow-multiple-documents"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # `-x` lets shellcheck follow a `# shellcheck source=…` directive into the
        # sourced file. Without it every script that sources scripts/lib/env.sh
        # (reingest-cluster.sh, backfill-run-media.sh, …) trips SC1091 "not
        # following", which shellcheck exits non-zero on — so the gate failed the
        # moment any of them was touched, unrelated to the edit.
        args: [-x]
        # The per-case reference implementations under */reference-impl/ are
        # authored, frozen build artifacts (game-asset generators full of
        # intentional word-splitting); CI never shellcheck-linted them, so keep
        # them out of the commit gate. Maintained tooling is still checked.
        exclude: '(^|/)reference-impl/'

  # Repo-specific gates. Their logic lives in committed scripts / this committed
  # config (never an untracked local file) so every clone runs the same checks.
  - repo: local
    hooks:
      - id: frozen-paths
        name: frozen test-case versions
        description: Reject changes to a test-case version that already has runs recorded against it.
        entry: scripts/hooks/frozen-paths.sh
        language: script
        # Verifies every `.frozen` directory's recorded digest, so it must run
        # even when nothing under one is staged (a deletion is a change too).
        always_run: true
        pass_filenames: false

      - id: rust-fmt
        name: cargo fmt (--check)
        description: Enforce rustfmt formatting across the workspace.
        entry: scripts/hooks/rust-fmt.sh
        language: script
        # rustfmt operates on the whole workspace, not individual files; trigger
        # whenever any Rust source is staged, but don't pass file paths.
        files: '\.rs$'
        pass_filenames: false

      - id: rust-clippy
        name: cargo clippy (warnings denied)
        description: Run Clippy across the workspace with warnings denied (mirrors CI's rust-lint).
        entry: scripts/hooks/rust-clippy.sh
        language: script
        # Clippy operates on the whole workspace, not individual files; trigger
        # whenever any Rust source is staged, but don't pass file paths.
        files: '\.rs$'
        pass_filenames: false

      - id: rust-doc
        name: cargo doc (warnings denied)
        description: Run rustdoc across the workspace with warnings denied, catching broken intra-doc links.
        entry: scripts/hooks/rust-doc.sh
        language: script
        # rustdoc operates on the whole workspace, not individual files; trigger
        # whenever any Rust source is staged, but don't pass file paths.
        files: '\.rs$'
        pass_filenames: false

      # The two spec-lint gates below run the npm workspace's own locked
      # markdownlint-cli2/cspell (via scripts/hooks/) rather than copies declared
      # with `additional_dependencies`. pre-commit installs those into an isolated
      # node env that resolves each tool's transitive dependencies fresh at
      # hook-install time, ignoring package-lock.json — so the versions here drift
      # from the ones `npm ci` gives CI. That drift is not theoretical: a
      # @cspell/dict-en_us one patch newer than the locked 4.4.35 knows
      # "misattributed", so this gate passed a commit the pipeline's cspell then
      # rejected. Deferring to the `spell`/`lint:md` npm scripts makes the local
      # verdict and the CI verdict the same by construction.
      - id: markdownlint
        name: markdownlint
        description: Lint the test-case/game-jam specs' Markdown style (shares .markdownlint-cli2.yaml).
        entry: scripts/hooks/specs-markdownlint.sh
        language: script
        # .markdownlint-cli2.yaml's globs drive the file set (mirroring
        # `npm run lint:md`), so don't pass paths; trigger whenever a spec
        # Markdown file is staged, the way rust-fmt keys off staged Rust — or
        # whenever the rule config itself changes, since that re-judges every
        # spec, not just the staged ones.
        files: '^(test-cases|game-jams)/.*\.md$|^\.markdownlint-cli2\.yaml$'
        pass_filenames: false

      - id: cspell
        name: cspell
        description: Spell-check the test-case/game-jam specs (shares cspell.json + the project dictionary).
        entry: scripts/hooks/specs-spell.sh
        language: script
        # cspell.json's `files` globs drive the file set (mirroring
        # `npm run spell`), so don't pass paths; trigger whenever a spec file in
        # one of those extensions is staged — or whenever the config or the
        # project dictionary changes, since deleting a word there can unmask a
        # spelling anywhere in the corpus, not just in what is staged.
        files: '^(test-cases|game-jams)/.*\.(md|html|css|toml|hbs)$|^cspell\.json$|^\.cspell/'
        pass_filenames: false
