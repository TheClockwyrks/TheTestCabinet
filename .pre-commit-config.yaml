# pre-commit configuration.
#
# Every check this workspace runs is a gate: one file under `ci/gates/` whose
# stem is the gate's id, run through the `gate` runner of the `ci` uv project
# (see ci/README.md). Each local hook below runs exactly one of them, so an id
# is the one name a commit, an issue and a pipeline step all call a check by,
# and a failing check is one red hook named for the check. `make gate` runs
# every gate over the whole tree through the same runner.
#
# Each local hook is triggered by the files it judges: its sources, its
# configuration and its own gate script. A gate reads its own file set from the
# tool's configuration rather than from the staged paths, so all but the
# NUL-byte gate pass no filenames.
#
# Clippy (rust-clippy), rustdoc (rust-doc), the test suite (rust-test) and the
# doctests (rust-doctest) compile the workspace and so are the slow hooks. They
# share their compilation artifacts, so running them costs little more than
# clippy alone. rust-doc is not doctests: it checks that doc comments'
# intra-doc links resolve, which no other gate sees, and rust-doctest runs the
# examples in those comments, which nextest cannot.
#
# The web and documentation hooks (web-lint, web-typecheck, web-test,
# web-browser-test, web-build, markdownlint, cspell, format, docs-typecheck,
# docs-build) run the npm workspace's own locked tools, so they need `npm ci` to
# have run; each says so when it has not. web-browser-test also needs the
# browser engines, which the devcontainer image carries rather than the npm
# workspace, and it says which ones are missing when they are not there.
# web-build is the other slow hook: it is Vite's production
# build, which is what the server's image embeds.
#
# Setup is a single idempotent command: `scripts/setup-hooks.sh`, which the
# devcontainer runs when it is created. If a hook ever blocks a commit you know
# is fine, `git commit --no-verify` bypasses it.
#
# Revisions are pinned; refresh them with `pre-commit autoupdate`. The version
# below is the framework's own, and .devcontainer/tools/uv.sh is where it is
# decided: bump it there first and match this floor and scripts/setup-hooks.sh's
# fallback install to it.
minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
        # tsconfig, devcontainer.json, and VSCode's .json are JSON-with-comments
        # (JSONC), which this strict JSON parser rejects; skip them.
        exclude: '(^|/)tsconfig[^/]*\.json$|(^|/)devcontainer\.json$|(^|/)\.vscode/.*\.json$'
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # Every text file ends with a newline, which nothing else here checks.
        # A reviewer that has to notice a missing one is being spent on what a
        # hook settles. Binary assets are left alone.
        exclude: '\.(svg|png|ico|woff2?)$'
      - id: check-shebang-scripts-are-executable
        # Rust files open with inner attributes like `#![forbid(unsafe_code)]`,
        # which this hook mistakes for a shebang; opt them out entirely.
        exclude: '\.rs$'
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        # Kubernetes manifests are multi-document YAML (several resources
        # separated by `---`); allow that.
        args: ["--allow-multiple-documents"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # `-x` lets shellcheck follow a `# shellcheck source=…` directive into the
        # sourced file. Without it every script that sources a shared helper trips
        # SC1091 "not following", which shellcheck exits non-zero on.
        args: [-x]

  # This workspace's own gates. Their logic lives in committed scripts
  # (ci/gates/, one per hook id, see ci/README.md) / this committed config
  # (never an untracked local file) so every clone runs the same checks. Each
  # hook runs its gate through the `gate` runner of the `ci` uv project, which
  # is also how `make gate` and the pipeline run it.
  - repo: local
    hooks:
      - id: no-nul-bytes
        name: NUL bytes in text files
        description: Reject a NUL byte in a file that is not a declared binary format, which makes grep and rg report zero matches in it.
        # The one hook that runs its gate script directly: `gate run` takes
        # gate ids and nothing else, and this gate is handed the paths.
        entry: uv run --quiet --project ci python ci/gates/no-nul-bytes.py
        language: system
        # Takes the staged paths and skips the ones .gitattributes declares
        # binary. It cannot use git's own binary judgment instead, because git
        # infers that FROM a NUL byte — see the gate's header.
        types: [file]
        # One batch of paths at a time: batches run side by side would each
        # have uv check the same environment.
        require_serial: true

      - id: devcontainer-declaration
        name: devcontainer declaration
        description: Assert the devcontainer mounts the checkout at the folder the container works in.
        entry: uv run --quiet --project ci gate run devcontainer-declaration
        language: system
        # Reads both halves of the declaration itself, so it takes no paths:
        # the folder is devcontainer.json's and the mount the compose file's,
        # and either one moving alone is what this catches. A configuration
        # under a subdirectory and an override it lists are read too. The
        # check's own script, and the JSONC reader beside it, re-judge the
        # declaration too.
        files: '^\.devcontainer/([^/]+/)?devcontainer\.json$|^\.devcontainer/docker-compose(\.[^/]+)?\.yml$|^scripts/(check-devcontainer|jsonc)\.py$|^ci/gates/devcontainer-declaration\.py$'
        pass_filenames: false

      - id: shell-tests
        name: shell tests
        description: Run every *.test.sh under scripts/, each of which drives its script through stubs.
        entry: uv run --quiet --project ci gate run shell-tests
        language: system
        # A test reads its script beside it, and the pipeline scripts read
        # both compose files and the declaration that names them, so a change
        # to any of them re-judges the tests. Runs every test, so it takes no
        # paths.
        files: '^scripts/.*\.(sh|py)$|^ci/images/|^\.devcontainer/([^/]+/)?devcontainer\.json$|^\.devcontainer/docker-compose(\.[^/]+)?\.yml$|^\.pre-commit-config\.yaml$|^ci/gates/shell-tests\.py$'
        pass_filenames: false

      - id: rust-fmt
        name: cargo fmt (--check)
        description: Enforce rustfmt formatting across the workspace.
        entry: uv run --quiet --project ci gate run rust-fmt
        language: system
        # rustfmt operates on the whole workspace, not individual files; trigger
        # whenever any Rust source or the formatter's configuration is staged,
        # but don't pass file paths.
        files: '\.rs$|^rustfmt\.toml$|^rust-toolchain\.toml$|^ci/gates/rust-fmt\.py$'
        pass_filenames: false

      - id: rust-clippy
        name: cargo clippy (warnings denied)
        description: Run Clippy across the workspace with warnings denied.
        entry: uv run --quiet --project ci gate run rust-clippy
        language: system
        # The manifests and the lockfile are here because a lint policy in
        # Cargo.toml or a `--locked` mismatch changes the verdict for every
        # source.
        files: '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^ci/gates/rust-clippy\.py$'
        pass_filenames: false

      - id: rust-doc
        name: cargo doc (warnings denied)
        description: Run rustdoc across the workspace with warnings denied, catching broken intra-doc links.
        entry: uv run --quiet --project ci gate run rust-doc
        language: system
        files: '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^ci/gates/rust-doc\.py$'
        pass_filenames: false

      # rust-test and rust-doctest have no hook: the project answered that its
      # suite is too slow for a commit. They run in the pipeline's Rust track
      # and in `make gate`.

      # The web app's gates. Each runs an npm script, which reads its own
      # configuration for its file set, so none of them takes the staged paths.
      # They trigger on the sources those tools read and on the configuration
      # that decides their verdict: the root package.json and the lockfile pin
      # the tools, and each gate's own script is an input to it.
      - id: web-lint
        name: web lint (eslint)
        description: Lint the TypeScript with the workspace's own locked ESLint configuration.
        entry: uv run --quiet --project ci gate run web-lint
        language: system
        # The rules live in the root eslint.config.js, so a commit that only
        # edits the configuration changes the verdict for every source under
        # it and has to run.
        files: '^apps/web/.*\.(ts|tsx|m?js|json)$|^eslint\.config\.js$|^tsconfig\.base\.json$|^package(-lock)?\.json$|^ci/gates/web-lint\.py$'
        pass_filenames: false

      - id: web-typecheck
        name: web typecheck (tsc -b)
        description: Typecheck the web app against its own tsconfig.
        entry: uv run --quiet --project ci gate run web-typecheck
        language: system
        files: '^apps/web/.*\.(ts|tsx|json)$|^tsconfig\.base\.json$|^package(-lock)?\.json$|^ci/gates/web-typecheck\.py$'
        pass_filenames: false

      - id: web-test
        name: web tests (vitest)
        description: Run the web app's tests under jsdom.
        entry: uv run --quiet --project ci gate run web-test
        language: system
        files: '^apps/web/.*\.(ts|tsx|json)$|^tsconfig\.base\.json$|^package(-lock)?\.json$|^ci/gates/web-test\.py$'
        pass_filenames: false

      # The browser suite, which drives the engines apps/web/vite.config.ts
      # names at two viewport widths each. It is a gate of its own rather than
      # part of web-test because what it states is what only a real engine
      # decides: the layout a width selects, the color the cascade resolves,
      # and whether the document overflows itself. It fires on the app's
      # sources and its configuration, on its own script, and on the engines'
      # pin and the scripts that install them, because a bump there is the
      # change most likely to break the suite.
      - id: web-browser-test
        name: web browser tests (vitest, playwright)
        description: Run the web app's browser tests in the engines its test configuration names.
        entry: uv run --quiet --project ci gate run web-browser-test
        language: system
        files: '^apps/web/.*\.(ts|tsx|css|html|json)$|^package(-lock)?\.json$|^ci/gates/web-browser-test\.py$|^\.devcontainer/(docker-compose\.yml|tools/browsers\.sh|system/browser-deps\.sh)$'
        pass_filenames: false

      - id: web-build
        name: web build (vite build)
        description: Build the web app's bundle, which is what the server's image embeds.
        entry: uv run --quiet --project ci gate run web-build
        language: system
        # The entry HTML and everything under public/ are inputs to the bundle
        # and to nothing above, which is why they are here alone.
        files: '^apps/web/.*\.(ts|tsx|css|html|json|m?js)$|^tsconfig\.base\.json$|^package(-lock)?\.json$|^ci/gates/web-build\.py$'
        pass_filenames: false

      - id: k8s-manifests
        name: kubernetes manifests
        description: Render every deployment overlay and assert what the manifests are only correct if they hold.
        entry: uv run --quiet --project ci gate run k8s-manifests
        language: system
        # An overlay is what gets applied, so the whole of deployments/k8s is
        # the input: a change to the base, to a component or to an overlay all
        # change what an overlay renders. Renders each one and checks the
        # output, so it takes no paths.
        files: '^deployments/k8s/|^ci/gates/k8s-manifests\.py$'
        pass_filenames: false

      # The two prose gates below run the npm workspace's own locked
      # markdownlint-cli2/cspell (via their gates under ci/gates/) rather than
      # copies declared with `additional_dependencies`. pre-commit installs those
      # into an isolated node env that resolves each tool's transitive
      # dependencies fresh at hook-install time, ignoring package-lock.json, so
      # those versions drift from the ones `npm ci` gives you. Deferring to the
      # `spell`/`lint:md` npm scripts makes the two verdicts the same by
      # construction.
      - id: markdownlint
        name: markdownlint
        description: Lint the Markdown style (shares .markdownlint-cli2.yaml).
        entry: uv run --quiet --project ci gate run markdownlint
        language: system
        # .markdownlint-cli2.yaml's globs drive the file set (mirroring
        # `npm run lint:md`), so don't pass paths; trigger whenever a linted
        # Markdown file is staged, or whenever the rule config itself changes,
        # since that re-judges every document.
        files: '^apps/docs/src/content/docs/.*\.mdx?$|^tasks/.*\.md$|^[^/]*\.md$|^\.[^/]+/.*\.md$|^\.markdownlint-cli2\.yaml$|^ci/gates/markdownlint\.py$'
        pass_filenames: false

      - id: cspell
        name: cspell
        description: Spell-check the prose (shares cspell.json + the project dictionary).
        entry: uv run --quiet --project ci gate run cspell
        language: system
        # cspell.json's `files` globs drive the file set (mirroring
        # `npm run spell`), so don't pass paths; trigger whenever a checked file
        # is staged, or whenever the config or the project dictionary changes,
        # since deleting a word there can unmask a spelling anywhere.
        files: '^apps/docs/src/content/docs/.*\.mdx?$|^tasks/.*\.md$|^[^/]*\.md$|^\.[^/]+/.*\.md$|^cspell\.json$|^\.cspell/|^ci/gates/cspell\.py$'
        pass_filenames: false

      - id: format
        name: prettier (--check)
        description: Check formatting with Prettier across everything .prettierignore does not exclude.
        entry: uv run --quiet --project ci gate run format
        language: system
        # .prettierignore, not this regex, decides what the gate covers. The
        # regex names every extension Prettier has a parser for, including ones
        # that are then ignored, because a hook that runs when it need not costs
        # a second while a hook that fails to run lets a badly formatted file
        # through. The last three alternatives are Prettier's own configuration
        # and this gate's script: any of them re-judges every file in the
        # workspace, not just the staged ones.
        files: '\.(m|c)?(j|t)sx?$|\.(css|html|json|ya?ml|astro)$|^\.prettierrc\.yaml$|^\.prettierignore$|^ci/gates/format\.py$'
        pass_filenames: false

      # The documentation site's two gates. The typecheck reads each page's
      # frontmatter against the content schema; the build resolves the sidebar,
      # the routes and the links between them, which nothing else does.
      - id: docs-typecheck
        name: docs typecheck (astro check)
        description: Typecheck the documentation site against its content schema.
        entry: uv run --quiet --project ci gate run docs-typecheck
        language: system
        files: '^apps/docs/|^package(-lock)?\.json$|^ci/gates/docs-typecheck\.py$'
        pass_filenames: false

      - id: docs-build
        name: docs build (astro build)
        description: Build the documentation site.
        entry: uv run --quiet --project ci gate run docs-build
        language: system
        files: '^apps/docs/|^package(-lock)?\.json$|^ci/gates/docs-build\.py$'
        pass_filenames: false

      # The Python every uv project is written in, the gates' first. ruff reads
      # its settings from ci/pyproject.toml, which every other project extends
      # and which so re-judges every file of all of them, and the tests read
      # every script under ci/gates/, so a gate is an input to both.
      - id: python-lint
        name: ruff (check, format)
        description: Lint and check the formatting of the Python every uv project is written in.
        entry: uv run --quiet --project ci gate run python-lint
        language: system
        files: '^ci/.*\.py$|^ci/pyproject\.toml$'
        pass_filenames: false

      - id: ci-tests
        name: ci tests (pytest)
        description: Run the tests of the gate runner and the metrics.
        entry: uv run --quiet --project ci gate run ci-tests
        language: system
        # The pipelines and this file are inputs too: ci/tests/test_wiring.py
        # reads all three and holds the gates, the hooks and the pipeline
        # steps to one another.
        files: '^ci/|^azure-pipelines(-ci-images)?\.yml$|^\.pre-commit-config\.yaml$|^scripts/ci/ci-image\.sh$'
        pass_filenames: false

      # The project's own gates, which the `extra_gates` answer names; each is
      # a script under ci/gates/ the project writes. A gate the answer gives no
      # hook runs in the pipeline and in `make gate` only.
      - id: frozen-paths
        name: "frozen test-case versions"
        entry: uv run --quiet --project ci gate run frozen-paths
        language: system
        files: '(^|/)\.frozen$|^(test-cases|game-jams)/|^scripts/(freeze|lib/frozen)\.sh$|^ci/gates/frozen-paths\.py$'
        pass_filenames: false

      - id: seeded-contract
        name: "seeded contract vocabulary"
        entry: uv run --quiet --project ci gate run seeded-contract
        language: system
        files: '^packages/|^scripts/stage-tcab-packages\.mjs$|^scripts/ci/seeded-contract-check\.sh$|^ci/gates/seeded-contract\.py$'
        pass_filenames: false

      - id: spec-vocabulary
        name: "seeded spec vocabulary"
        entry: uv run --quiet --project ci gate run spec-vocabulary
        language: system
        files: '^(test-cases|game-jams)/.*/v[0-9]+\.[0-9]+\.[0-9]+/(prompt\.hbs$|specs/)|^crates/core/src/prompt\.rs$|^scripts/ci/spec-vocabulary-check\.mjs$|^ci/gates/spec-vocabulary\.py$'
        pass_filenames: false

      - id: spec-prose
        name: "spec prose (markdownlint, cspell)"
        entry: uv run --quiet --project ci gate run spec-prose
        language: system
        files: '^(test-cases|game-jams|test-case-groups)/.*\.(md|html|css|toml|hbs)$|^\.cspell/|^\.markdownlint-cli2\.yaml$|^ci/gates/spec-prose\.py$'
        pass_filenames: false

      - id: audio-packs
        name: "audio pack declarations"
        entry: uv run --quiet --project ci gate run audio-packs
        language: system
        files: '^(test-cases|game-jams)/.*/(test-case|game-jam)\.toml$|^containers/sample-packs/|^scripts/ci/audio-packs-check\.mjs$|^scripts/lib/audio-packs\.mjs$|^ci/gates/audio-packs\.py$'
        pass_filenames: false

      - id: build-context
        name: "Dockerfile build contexts"
        entry: uv run --quiet --project ci gate run build-context
        language: system
        files: '(^|/)[^/]*[Dd]ockerfile[^/]*$|(^|/)\.dockerignore$|^rust-toolchain\.toml$|^packages/gg-sandbox|^scripts/stage-tcab-packages\.mjs$|^scripts/ci/build-context\.sh$|^ci/gates/build-context\.py$'
        pass_filenames: false

      - id: k8s-deploy-sets
        name: "kubernetes deploy sets"
        entry: uv run --quiet --project ci gate run k8s-deploy-sets
        language: system
        files: '^deployments/k8s/|^scripts/ci/(deploy-environment|pin-images|pre-deploy|post-deploy|settle-workloads|retire-legacy-backend|k8s-deploy-sets|tcab-lib)\.sh$|^ci/gates/k8s-deploy-sets\.py$'
        pass_filenames: false

      - id: ci-image-pins
        name: "project jobs pin the Rust CI image"
        entry: uv run --quiet --project ci gate run ci-image-pins
        language: system
        files: '^ci/images/tags\.yml$|^\.azure/project/jobs\.yml$|^scripts/ci/tcab-image-pin\.sh$|^ci/gates/ci-image-pins\.py$'
        pass_filenames: false

      - id: scripts-test
        name: "script library tests (node --test)"
        entry: uv run --quiet --project ci gate run scripts-test
        language: system
        files: '^scripts/lib/.*\.m?js$|^ci/gates/scripts-test\.py$'
        pass_filenames: false
