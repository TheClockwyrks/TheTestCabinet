[workspace]
resolver = "2"
members = [
	"crates/core",
	"crates/cli",
	"crates/contract-codegen",
	"crates/draw",
	"crates/foray-core",
	"crates/foray-host",
	"crates/foray-cli",
	"crates/foray-controller-sdk",
	"crates/foray-ref-random",
	"crates/foray-ref-greedy-raider",
	"crates/foray-ref-border-soldier",
	"crates/foray-fuel-probe",
	"crates/lattice-core",
	"crates/lattice-host",
	"crates/lattice-cli",
	"crates/lattice-sdk",
	"crates/lattice-ref-naive",
	"crates/lattice-ref-transport",
	"crates/desktop",
	"crates/backend",
	"crates/driver",
	"crates/dispatcher",
	"crates/worker",
	"crates/artifacts",
	"crates/auth-service",
	"crates/telemetry",
	"crates/entities",
	"crates/migration",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

# Warnings-as-errors, baked into the manifests for every member crate that opts
# in with `[lints] workspace = true`. CI already denies warnings on the clippy
# command line (`scripts/ci/rust-lint.sh` runs `cargo clippy … -- -D warnings`),
# but that flag only fires under that one invocation; defining the policy here
# means a plain `cargo build` or `cargo clippy` enforces it locally too — no flag
# required — and keeps the rule in one place instead of scattered across scripts.
[workspace.lints.rust]
warnings = "deny"

# Clippy lints live in their own `clippy::` namespace, so denying rustc's
# `warnings` group above does not reach them. Deny the default `all` group here
# to mirror what `-D warnings` already does under the clippy driver in CI.
[workspace.lints.clippy]
all = "deny"

# `foray-core` is a `cdylib` (it compiles to `wasm32-unknown-unknown` for the
# browser playback ABI — see `crates/foray-core/Cargo.toml`). On the NATIVE host
# the same `cdylib` is still emitted as an (otherwise unused) `.so`, and rustc's
# *incremental* codegen for a `cdylib` split across the dev profile's many codegen
# units intermittently drops a `*.rcgu.o` object, so the linker fails with
# "cannot find …rcgu.o: No such file or directory" on a second incremental build.
# Pinning this one package to a single codegen unit makes incremental codegen emit
# one object and removes the race; it only affects `foray-core`'s native compile,
# not the wasm build the browser performs.
[profile.dev.package.foray-core]
codegen-units = 1

# `lattice-core` is a `cdylib` for the identical reason `foray-core` is (above):
# it is retained as a `cdylib` for parity and a future browser replay renderer,
# so on the NATIVE host rustc emits an (otherwise unused) `.so`, and incremental
# codegen split across the dev profile's many codegen units intermittently drops
# a `*.rcgu.o` object, failing the linker on a second incremental build. Pinning
# this package to a single codegen unit removes the race — see the `foray-core`
# rationale above. It only affects the native compile, not the wasm build.
[profile.dev.package.lattice-core]
codegen-units = 1

# The two reference engines are `cdylib`s (they compile to
# `wasm32-unknown-unknown` to load in the sandbox), so on the NATIVE host `cargo
# test` hits the same intermittent incremental-codegen `*.rcgu.o` race the
# `foray-core`/`lattice-core` pins above describe. Pin each to one codegen unit
# for the dev profile so the native test build is reliable; it does not affect the
# wasm release build the validator and container produce.
[profile.dev.package.lattice-ref-naive]
codegen-units = 1

[profile.dev.package.lattice-ref-transport]
codegen-units = 1

# The desktop shell's library target is built as a `cdylib`/`staticlib` (the Tauri
# v2 convention — see `crates/desktop/Cargo.toml`) in addition to the plain `lib`.
# On the NATIVE host `cargo test` compiles this library (incrementally, split
# across the dev profile's many codegen units), and rustc intermittently drops one
# of the `*.rcgu.o` objects on a second incremental build, so assembling the rlib
# fails with "failed to build archive … failed to open object file: No such file or
# directory". This is the same incremental-codegen race already pinned away for
# `foray-core` above. Forcing a single codegen unit makes codegen emit one object
# and removes the race; it is dev-profile only and does not affect the release
# bundle Tauri ships.
[profile.dev.package.test-cabinet-desktop]
codegen-units = 1

[workspace.dependencies]
# Shared runtime dependencies inherited by member crates via { workspace = true }.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# Terminal styling for the CLI's live event stream. `anstream` auto-detects
# whether the destination is a TTY (honoring NO_COLOR / CLICOLOR) and strips the
# `anstyle` escape sequences when it is not, so output is colored only when a
# terminal is attached.
anstyle = "1"
anstream = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# Loads API keys (and other configuration) from a `.env` file so the CLI can be
# driven without exporting variables into every shell. `dotenvy` is the
# maintained fork of `dotenv`; it does not override variables already present in
# the environment, so an explicitly exported key still wins over the file.
dotenvy = "0.15"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "0.8"
# Renders each test case's `prompt.hbs` template into the instruction handed to
# the harness, interpolating the in-container workspace and seeded spec paths so
# they are never hard-coded into a specification.
handlebars = "6"
tempfile = "3"
# PNG decoding for the validator's reference-comparison similarity score. The
# `png` crate is a small, pure-Rust decoder with no system dependencies, keeping
# the workspace buildable on minimal hosts.
png = "0.17"
# Base64 for inlining a live asset-generation preview frame into the JSON event a
# worker streams (or the desktop shell emits) to the run monitor: the run host
# receives the rendered PNG bytes from the drawing binary and base64-encodes them
# so the frame travels in the same JSON transport as every other live update.
base64 = "0.22"
# JSON Schema generation. Two uses, both feature-gated so normal/CLI/desktop/wasm
# builds never compile it: the `schema` feature of `foray-core`/`lattice-core`
# emits the per-tick contract schemas each adversarial/performance test case seeds
# verbatim (a drift test asserts the on-disk copies never diverge from the engine
# types), and the `contract` feature of `core`/`worker`/`backend` (driven by the
# `contract-codegen` generator) emits the published API/run-record JSON Schemas.
schemars = "1"
# TypeScript binding generation from Rust types. Pulled in only behind the
# `contract` feature of `core`/`worker`/`backend` (and the `contract-codegen`
# generator that drives them), so normal/CLI/desktop/wasm builds never compile it.
# Paired with `schemars` on the same types so the TS bindings and the JSON Schemas
# are generated from one source of truth and can never drift apart.
ts-rs = "12"
# Cross-platform PATH lookup for the container runtime binary. A hand-rolled
# search misses the `.exe`/`PATHEXT` resolution Windows needs; `which` handles
# that and the Unix case behind one API.
which = "8"
# HTTP client for fetching OpenRouter model prices. rustls avoids a system
# OpenSSL dependency so the workspace builds cleanly on minimal hosts (NixOS).
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
] }

# The wasm host for the Foray adversarial case (`crates/foray-host`). wasmtime is
# pure Rust (no system packages), so it builds on the same minimal hosts as the
# rest of the workspace. The host loads the two competing controller modules,
# meters each per-tick invocation with fuel, and caps linear memory. `cranelift`
# is the JIT (default); `cache` is dropped because matches run in ephemeral run
# containers where a compile cache buys nothing. Pinned to the major version the
# host was written against so an automatic minor bump never silently changes the
# fuel/epoch semantics the sandbox relies on.
wasmtime = { version = "45", default-features = false, features = [
	"cranelift",
	"runtime",
] }

# Desktop shell. Pinned to Tauri v2 so the desktop crate can inherit them.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Backend HTTP server. Axum is the settled web framework; `tower-http` supplies
# the request-tracing/limit middleware and the CORS layer the browser UIs need to
# reach a backend/worker on a different localhost port. The backend and worker are
# the only crates that bind a socket, so these stay out of the leaner crates.
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The backend's system of record, accessed through SeaORM so one connection URL
# selects the driver: SQLite for local/dev/tests, PostgreSQL for deployments.
# `default-features = false` drops SeaORM's native-tls runtime; we re-add only the
# two SQLx drivers and the rustls runtime so the backend keeps building statically
# under musl with no system OpenSSL (the `cargo build-portable-backend` alias).
# `libsqlite3-sys` is named with `bundled` so the SQLite C source is vendored and
# compiled — the same no-system-libsqlite stance the old `rusqlite` had.
sea-orm = { version = "1", default-features = false, features = [
	"macros",
	"sqlx-sqlite",
	"sqlx-postgres",
	"runtime-tokio-rustls",
] }
sea-orm-migration = { version = "1", default-features = false, features = [
	"sqlx-sqlite",
	"sqlx-postgres",
	"runtime-tokio-rustls",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# The entity definitions and schema migration for the SeaORM store, factored into
# their own crates per SeaORM convention so the migration can run at startup and
# the entities are reusable.
test-cabinet-entities = { path = "crates/entities" }
test-cabinet-migration = { path = "crates/migration" }
# SigV4 signing for R2's S3-compatible API (the backend holds the only write
# credential). Implemented directly over `hmac`/`sha2` rather than pulling the
# full AWS SDK, since R2 only needs PutObject.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
percent-encoding = "2"

# The standalone auth service hashes passwords with Argon2id (the password-hashing
# competition winner; memory-hard, the settled default for new password stores)
# and mints opaque bearer tokens from OS randomness. `argon2` re-exports the
# `password-hash` PHC-string machinery so a stored hash carries its own salt and
# parameters. `rand` supplies the `OsRng` used for both the per-password salt and
# the token bytes; its `rand_core` matches the one `password-hash` expects. Only
# `crates/auth-service` pulls these in, so the leaner crates never compile them.
argon2 = "0.5"
rand = "0.8"

# Worker HTTP server. The worker streams a run's live harness events back to the
# caller as the run proceeds; `futures-util` adapts an mpsc receiver into the
# `Stream` axum's `Body::from_stream` consumes, and `bytes` frames each NDJSON
# line. Both are already in the dependency graph (transitively, via axum/tokio),
# so naming them here adds no new fetch.
futures-util = "0.3"
bytes = "1"

# OpenTelemetry. These crates move in lockstep across the `opentelemetry`
# ecosystem and are pinned together here so the whole workspace shares one
# mutually-compatible set; bumping one means bumping all. They are consumed
# through `crates/telemetry` (`test-cabinet-telemetry`), which splits the light
# propagation deps (default features) from the heavy exporter/init deps (the
# `otlp` feature). Transport is OTLP over HTTP/protobuf (collector port 4318),
# using a non-blocking `reqwest` client with rustls so we inherit the same TLS
# stack as the rest of the workspace and need no system OpenSSL or `protoc`.
#
# `http` is named here so the propagation helpers can speak in terms of
# `http::HeaderMap` without leaning on a transitive copy from axum/reqwest.
http = "1"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
	"http-proto",
	"reqwest-blocking-client",
	"trace",
	"metrics",
	"logs",
] }
# `reqwest-rustls` routes the OTLP exporter's reqwest client through rustls,
# matching the workspace's no-system-OpenSSL stance. The propagation helpers use
# only the no-default-feature core (the `HeaderExtractor`/`HeaderInjector`).
opentelemetry-http = { version = "0.32", default-features = false }
# `semconv_experimental` exposes the stabilized-but-feature-gated keys we use,
# notably `deployment.environment.name`.
opentelemetry-semantic-conventions = { version = "0.32", features = [
	"semconv_experimental",
] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
