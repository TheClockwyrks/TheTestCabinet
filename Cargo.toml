[workspace]
resolver = "2"
members = [
	"crates/core",
	"crates/cli",
	"crates/desktop",
	"crates/backend",
	"crates/worker",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[workspace.dependencies]
# Shared runtime dependencies inherited by member crates via { workspace = true }.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# Terminal styling for the CLI's live event stream. `anstream` auto-detects
# whether the destination is a TTY (honoring NO_COLOR / CLICOLOR) and strips the
# `anstyle` escape sequences when it is not, so output is colored only when a
# terminal is attached.
anstyle = "1"
anstream = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# Loads API keys (and other configuration) from a `.env` file so the CLI can be
# driven without exporting variables into every shell. `dotenvy` is the
# maintained fork of `dotenv`; it does not override variables already present in
# the environment, so an explicitly exported key still wins over the file.
dotenvy = "0.15"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "0.8"
# Renders each test case's `prompt.hbs` template into the instruction handed to
# the harness, interpolating the in-container workspace and seeded spec paths so
# they are never hard-coded into a specification.
handlebars = "6"
tempfile = "3"
# PNG decoding for the validator's reference-comparison similarity score. The
# `png` crate is a small, pure-Rust decoder with no system dependencies, keeping
# the workspace buildable on minimal hosts.
png = "0.17"
# Cross-platform PATH lookup for the container runtime binary. A hand-rolled
# search misses the `.exe`/`PATHEXT` resolution Windows needs; `which` handles
# that and the Unix case behind one API.
which = "8"
# HTTP client for fetching OpenRouter model prices. rustls avoids a system
# OpenSSL dependency so the workspace builds cleanly on minimal hosts (NixOS).
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
] }

# Desktop shell. Pinned to Tauri v2 so the desktop crate can inherit them.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Backend HTTP server. Axum is the settled web framework; `tower-http` supplies
# the request-tracing/limit middleware. The backend is the only crate that binds
# a socket, so these stay out of the leaner runner crates.
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Embedded SQLite (the backend's system of record). `bundled` compiles SQLite
# from source so the backend builds on a host without a system libsqlite.
rusqlite = { version = "0.32", features = ["bundled"] }
# SigV4 signing for R2's S3-compatible API (the backend holds the only write
# credential). Implemented directly over `hmac`/`sha2` rather than pulling the
# full AWS SDK, since R2 only needs PutObject.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
percent-encoding = "2"

# Worker HTTP server. The worker streams a run's live harness events back to the
# caller as the run proceeds; `futures-util` adapts an mpsc receiver into the
# `Stream` axum's `Body::from_stream` consumes, and `bytes` frames each NDJSON
# line. Both are already in the dependency graph (transitively, via axum/tokio),
# so naming them here adds no new fetch.
futures-util = "0.3"
bytes = "1"
