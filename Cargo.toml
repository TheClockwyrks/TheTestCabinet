[workspace]
resolver = "2"
members = [
	"crates/core",
	"crates/code-analysis",
	"crates/cli",
	"crates/gg",
	# The shared build-script body behind every gg program-language ARTIFACT crate, and the arm
	# crates that use it. Each arm crate builds one program language's compile inputs — a guest
	# component, an SDK jar, a compiler — into its own `OUT_DIR` and publishes the directory to
	# `crates/gg`, which `include_bytes!`s them from there. They are ten crates rather than ten
	# steps of `crates/gg/build.rs` so that each arm has its own rerun set; the argument is
	# in `gg-artifact-build`'s header, along with the recipe for adding one.
	#
	# The list arrived one arm at a time, each entry landing on the change that stopped committing
	# that arm's bytes — never before, because an arm crate here is a crate whose build script runs
	# on `cargo build --workspace`, and running an arm's toolchain to produce bytes nothing embeds is
	# pure cost. It is complete now: ten packages serving eleven arms, `packages/gg-sandbox` serving
	# TypeScript and JavaScript from one build exactly as `scripts/gg-arms.sh` does. Nothing under
	# `crates/gg/src/sandbox/guests/` is committed any more, and what is left beside it under
	# `checkers/` is gg's own hand-written Java and its pins.
	"crates/gg-sandbox-artifacts/build-support",
	"crates/gg-sandbox-artifacts/typescript",
	"crates/gg-sandbox-artifacts/python",
	"crates/gg-sandbox-artifacts/ruby",
	"crates/gg-sandbox-artifacts/java",
	"crates/gg-sandbox-artifacts/kotlin",
	"crates/gg-sandbox-artifacts/purescript",
	"crates/gg-sandbox-artifacts/rust",
	"crates/gg-sandbox-artifacts/swift",
	"crates/gg-sandbox-artifacts/cpp",
	"crates/gg-sandbox-artifacts/csharp",
	"crates/contract-codegen",
	"crates/draw",
	"crates/model-core",
	"crates/voxel",
	"crates/voxel-anim",
	"crates/voxel-mesh",
	"crates/mc",
	"crates/mc-anim",
	"crates/sn",
	"crates/sn-anim",
	"crates/dc",
	"crates/dc-anim",
	"crates/paint",
	"crates/model-skin",
	"crates/mc-skin",
	"crates/sn-skin",
	"crates/dc-skin",
	"crates/particle-core",
	"crates/particle-2d",
	"crates/particle-3d",
	"crates/audio-core",
	"crates/sfx-synth",
	"crates/sfx-sample",
	"crates/music",
	"crates/foray-core",
	"crates/foray-host",
	"crates/foray-cli",
	"crates/foray-controller-sdk",
	"crates/foray-ref-random",
	"crates/foray-ref-greedy-raider",
	"crates/foray-ref-border-soldier",
	"crates/foray-fuel-probe",
	"crates/lattice-core",
	"crates/lattice-host",
	"crates/lattice-cli",
	"crates/lattice-sdk",
	"crates/lattice-ref-naive",
	"crates/lattice-ref-transport",
	"crates/desktop",
	"crates/backend",
	"crates/driver",
	"crates/dispatcher",
	"crates/publisher",
	"crates/artifacts",
	"crates/arena",
	"crates/auth-service",
	"crates/db-auth",
	"crates/telemetry",
	"crates/entities",
	"crates/migration",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

# Warnings-as-errors, baked into the manifests for every member crate that opts
# in with `[lints] workspace = true`. CI already denies warnings on the clippy
# command line (`scripts/ci/rust-lint.sh` runs `cargo clippy … -- -D warnings`),
# but that flag only fires under that one invocation; defining the policy here
# means a plain `cargo build` or `cargo clippy` enforces it locally too — no flag
# required — and keeps the rule in one place instead of scattered across scripts.
[workspace.lints.rust]
warnings = "deny"

# Clippy lints live in their own `clippy::` namespace, so denying rustc's
# `warnings` group above does not reach them. Deny the default `all` group here
# to mirror what `-D warnings` already does under the clippy driver in CI.
[workspace.lints.clippy]
all = "deny"

# `foray-core` is a `cdylib` (it compiles to `wasm32-unknown-unknown` for the
# browser playback ABI — see `crates/foray-core/Cargo.toml`). On the NATIVE host
# the same `cdylib` is still emitted as an (otherwise unused) `.so`, and rustc's
# *incremental* codegen for a `cdylib` split across the dev profile's many codegen
# units intermittently drops a `*.rcgu.o` object, so the linker fails with
# "cannot find …rcgu.o: No such file or directory" on a second incremental build.
# Pinning this one package to a single codegen unit makes incremental codegen emit
# one object and removes the race; it only affects `foray-core`'s native compile,
# not the wasm build the browser performs.
[profile.dev.package.foray-core]
codegen-units = 1

# `lattice-core` is a `cdylib` for the identical reason `foray-core` is (above):
# it is retained as a `cdylib` for parity and a future browser replay renderer,
# so on the NATIVE host rustc emits an (otherwise unused) `.so`, and incremental
# codegen split across the dev profile's many codegen units intermittently drops
# a `*.rcgu.o` object, failing the linker on a second incremental build. Pinning
# this package to a single codegen unit removes the race — see the `foray-core`
# rationale above. It only affects the native compile, not the wasm build.
[profile.dev.package.lattice-core]
codegen-units = 1

# The two reference engines are `cdylib`s (they compile to
# `wasm32-unknown-unknown` to load in the sandbox), so on the NATIVE host `cargo
# test` hits the same intermittent incremental-codegen `*.rcgu.o` race the
# `foray-core`/`lattice-core` pins above describe. Pin each to one codegen unit
# for the dev profile so the native test build is reliable; it does not affect the
# wasm release build the validator and container produce.
[profile.dev.package.lattice-ref-naive]
codegen-units = 1

[profile.dev.package.lattice-ref-transport]
codegen-units = 1

# The desktop shell's library target is built as a `cdylib`/`staticlib` (the Tauri
# v2 convention — see `crates/desktop/Cargo.toml`) in addition to the plain `lib`.
# On the NATIVE host `cargo test` compiles this library (incrementally, split
# across the dev profile's many codegen units), and rustc intermittently drops one
# of the `*.rcgu.o` objects on a second incremental build, so assembling the rlib
# fails with "failed to build archive … failed to open object file: No such file or
# directory". This is the same incremental-codegen race already pinned away for
# `foray-core` above. Forcing a single codegen unit makes codegen emit one object
# and removes the race; it is dev-profile only and does not affect the release
# bundle Tauri ships.
[profile.dev.package.test-cabinet-desktop]
codegen-units = 1

# Cranelift compiles the ~13 MB responses-as-code sandbox component
# (`crates/gg/src/sandbox`) on first use in every process that runs a sandbox
# test, and `cargo nextest` runs ONE PROCESS PER TEST. Unoptimised that compile
# takes 7.6s; with these five packages optimised it takes 1.2s on a many-core
# machine and 7.9s on one core — the difference between a comfortable margin and
# brushing the 120s per-test cap (`.config/nextest.toml`) on a small runner. The
# cost is one slower first build. These are the code generator's own hot crates,
# not workspace members, so optimising them changes no behaviour under test.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[workspace.dependencies]
# Shared runtime dependencies inherited by member crates via { workspace = true }.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# Terminal styling for the CLI's live event stream. `anstream` auto-detects
# whether the destination is a TTY (honoring NO_COLOR / CLICOLOR) and strips the
# `anstyle` escape sequences when it is not, so output is colored only when a
# terminal is attached.
anstyle = "1"
anstream = "1"
# Collision-resistant unique identifiers. CUID2 ids are short, URL-safe strings
# generated from entropy plus a per-process fingerprint, so `create_id()` is a
# drop-in for the stringified UUIDs we previously used for run/job/token ids.
cuid2 = "0.1"
# Loads API keys (and other configuration) from a `.env` file so the CLI can be
# driven without exporting variables into every shell. `dotenvy` is the
# maintained fork of `dotenv`; it does not override variables already present in
# the environment, so an explicitly exported key still wins over the file.
dotenvy = "0.15"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "0.8"
# Renders each test case's `prompt.hbs` template into the instruction handed to
# the harness, interpolating the in-container workspace and seeded spec paths so
# they are never hard-coded into a specification.
handlebars = "6"
tempfile = "3"
# Gzip framing, shared by every crate on the **run-tree artifact** path: a run's
# whole-run analysis documents (`replay.json.gz`, `code-analysis.json.gz`) are
# written compressed at the tree root, mirrored into the backend store as opaque
# bytes, and served back content-negotiated on the request's `Accept-Encoding` —
# so the writer (the run host), the store's reader (the backend) and the archive
# service all need the same codec. Promoted here from `crates/artifacts`, which
# pinned it privately for the run-archive download. Default features keep the
# pure-Rust `miniz_oxide` backend — no zlib, so no system dependency, matching the
# `png`/`gif` stance on keeping the workspace buildable on minimal hosts.
flate2 = "1"
# PNG decoding for the validator's reference-comparison similarity score, and PNG
# encoding for the drawing/voxel binaries and the shared mesh preview renderer. The
# `png` crate is a small, pure-Rust decoder/encoder with no system dependencies,
# keeping the workspace buildable on minimal hosts.
png = "0.17"
# GIF encoding for the particle binaries' animated preview (the packed effect.gif
# the reviewer plays). The in-repo animation GIF export is TypeScript-only
# (`packages/ui`'s `gifenc`), so the Rust `particle-core` render path packs its
# simulated preview frames with this pure-Rust encoder (LZW via `weezl`, palette
# quantization via `color_quant`) — no system dependency, matching the `png` stance.
# Only the particle binaries pull it in, behind `particle-core`'s `cli` feature.
gif = "0.14"
# The headless mesh preview renderer (`test-cabinet-model-core`'s `render` module,
# behind its `cli` feature). `wgpu` targets Mesa lavapipe (software Vulkan) to draw
# offscreen with no GPU or window; `glam` builds the camera matrices; `bytemuck`
# casts vertex/uniform structs to GPU bytes; `pollster` blocks on wgpu's async
# device/queue calls. Only the voxel-family binaries pull these in — the
# backend/driver release builds link `model-core` without its `cli` feature.
# On Linux the native Vulkan (Mesa lavapipe) and GLES backends are compiled in by
# wgpu-hal's target defaults — they are not cargo features — so the default feature
# set (which includes `wgsl` for the shader) is what the renderer needs.
wgpu = "24"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# Base64 for inlining a live asset-generation preview frame into the JSON event the
# driver streams (or the desktop shell emits) to the run monitor: the run host
# receives the rendered PNG bytes from the drawing binary and base64-encodes them
# so the frame travels in the same JSON transport as every other live update.
base64 = "0.22"
# JSON Schema generation. Two uses, both feature-gated so normal/CLI/desktop/wasm
# builds never compile it: the `schema` feature of `foray-core`/`lattice-core`
# emits the per-tick contract schemas each adversarial/performance test case seeds
# verbatim (a drift test asserts the on-disk copies never diverge from the engine
# types), and the `contract` feature of `core`/`backend` (driven by the
# `contract-codegen` generator) emits the published API/run-record JSON Schemas.
schemars = "1"
# TypeScript binding generation from Rust types. Pulled in only behind the
# `contract` feature of `core`/`backend` (and the `contract-codegen`
# generator that drives them), so normal/CLI/desktop/wasm builds never compile it.
# Paired with `schemars` on the same types so the TS bindings and the JSON Schemas
# are generated from one source of truth and can never drift apart.
ts-rs = "12"
# Cross-platform PATH lookup for the container runtime binary. A hand-rolled
# search misses the `.exe`/`PATHEXT` resolution Windows needs; `which` handles
# that and the Unix case behind one API.
which = "8"
# HTTP client for fetching OpenRouter model prices. rustls avoids a system
# OpenSSL dependency so the workspace builds cleanly on minimal hosts (NixOS).
# `stream` exposes `Response::bytes_stream`, which gg's streaming model transport
# reads server-sent events off so its loop detector can abandon a reply while the
# model is still writing it (`crates/gg/src/client.rs`).
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
	"stream",
] }

# The wasm host for the Foray adversarial case (`crates/foray-host`). wasmtime is
# pure Rust (no system packages), so it builds on the same minimal hosts as the
# rest of the workspace. The host loads the two competing controller modules,
# meters each per-tick invocation with fuel, and caps linear memory. `cranelift`
# is the JIT (default); `cache` is dropped because matches run in ephemeral run
# containers where a compile cache buys nothing. Pinned to the major version the
# host was written against so an automatic minor bump never silently changes the
# fuel/epoch semantics the sandbox relies on.
#
# `gc` and `gc-null` are here for **gg's C++ program language**, and they are the one entry in
# this file that a language arm asked for. C++ exceptions compile to the wasm exception-handling
# proposal, and wasmtime gates that proposal behind `Config::wasm_exceptions`, which is
# `#[cfg(feature = "gc")]` — an exception reference is a GC-managed value, so the runtime will not
# even build the setter without GC support, and it refuses to build an `Engine` at all when `gc`
# is on and no collector is. `gc-null` is the cheapest collector there is: it allocates nothing
# and collects nothing, which is exactly right for a feature whose only user here allocates no GC
# objects. Without both, a C++ program that so much as links libc++'s `eh` build is refused with
# *exceptions proposal not enabled* — measured, on this pinned release.
#
# Cargo features are additive across a workspace, so this reaches `foray-host` and `lattice-host`
# too. What it changes for them is that `WasmFeatures::default()` gains `GC_TYPES`, which would
# widen what a submitted controller may contain; both now turn it back off explicitly on their own
# `Config`, so the modules they accept are what they were. gg's engine is a third, separate
# `Engine` — see `crates/gg/src/sandbox/engine.rs` — and it is the only one that opts in.
wasmtime = { version = "45", default-features = false, features = [
	"cranelift",
	"gc",
	"gc-null",
	"runtime",
] }

# The WASI preview-2 host implementation gg's responses-as-code sandbox links into
# every guest (`crates/gg/src/sandbox.rs`). Only the `p2` feature: the default set
# additionally pulls the preview-1 adapter and `wiggle`, which no guest here imports.
# Same major version as `wasmtime` above, and it requires the patch release it names,
# so adding it moves the whole workspace's wasmtime to that patch — including the two
# wasm hosts, which also inherit the `async` feature `p2` turns on. Neither uses an
# async entry point, so this changes their build surface and not their behaviour.
wasmtime-wasi = { version = "45", default-features = false, features = ["p2"] }

# Turning a core wasm module into a **component**, in process, on the turn path
# (`crates/gg/src/sandbox/language/rust.compile.rs`). The Rust program language compiles a
# model's program with `rustc --target wasm32-unknown-unknown`, which emits a core module
# carrying the `component-type` custom section `wit-bindgen` put there; this crate reads that
# section and encodes the component gg's engine then instantiates. It is the same step the
# `wasm-tools component new` CLI performs, taken as a library so no second binary has to be
# installed in a run container and no artifact has to round-trip through a file.
#
# Pinned to the wasmparser line `wasmtime` 45 is built on (0.248), so the whole workspace
# resolves ONE `wasmparser`/`wasm-encoder` pair: an encoder from a newer line may emit a
# component feature the runtime's validator does not know, and the failure would be a
# validation error on a program nobody wrote wrong.
wit-component = "0.248"
# The WIT parser `wit-component` is built on, at the same pin for the same reason: gg stamps the
# `component-type` section of the JVM arms' modules from its own Rust (`sandbox/language/jvm.rs`),
# which needs a `Resolve` and a `WorldId` — types that must come from the very crate the encoder
# reads them with.
wit-parser = "0.248"
# The source-map reader gg resolves a guest frame through
# (`crates/gg/src/sandbox/locate.rs`). The invariants allow a location to be reached through a
# source map and by no other means, so the arms whose compilers emit JavaScript hand the guest a
# source carrying its own map and gg reads the map with the library the ecosystem reads them with
# rather than with a VLQ decoder of its own.
sourcemap = "9"

# Desktop shell. Pinned to Tauri v2 so the desktop crate can inherit them.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Backend HTTP server. Axum is the settled web framework; `tower-http` supplies
# the request-tracing/limit middleware, the CORS layer the browser UIs need to
# reach the backend on a different localhost port, and the response compression
# the run listings need (their JSON runs to megabytes, which is punishing over a
# slow link). The backend, auth, and artifact services are the socket-binding
# crates, so these stay out of the leaner crates.
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "limit",
    "cors",
    "compression-gzip",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The backend's system of record, accessed through SeaORM so one connection URL
# selects the driver: SQLite for local/dev/tests, PostgreSQL for deployments.
# `default-features = false` drops SeaORM's native-tls runtime; we re-add only the
# two SQLx drivers and the rustls runtime so the backend keeps building statically
# under musl with no system OpenSSL (the `cargo build-portable-backend` alias).
# `libsqlite3-sys` is named with `bundled` so the SQLite C source is vendored and
# compiled — the same no-system-libsqlite stance the old `rusqlite` had.
sea-orm = { version = "1", default-features = false, features = [
	"macros",
	"sqlx-sqlite",
	"sqlx-postgres",
	"runtime-tokio-rustls",
] }
sea-orm-migration = { version = "1", default-features = false, features = [
	"sqlx-sqlite",
	"sqlx-postgres",
	"runtime-tokio-rustls",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# The entity definitions and schema migration for the SeaORM store, factored into
# their own crates per SeaORM convention so the migration can run at startup and
# the entities are reusable.
test-cabinet-entities = { path = "crates/entities" }
test-cabinet-migration = { path = "crates/migration" }
# SigV4 signing for R2's S3-compatible API (the backend holds the only write
# credential). Implemented directly over `hmac`/`sha2` rather than pulling the
# full AWS SDK, since R2 only needs PutObject, ListObjectsV2 and DeleteObjects.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# S3's batch `DeleteObjects` authenticates its request body with a `Content-MD5`
# header — the one place the R2 client needs a digest other than SHA-256. Same
# RustCrypto family as `sha2`/`hmac`, so it costs no new dependency tree.
md-5 = "0.10"
percent-encoding = "2"

# The standalone auth service hashes passwords with Argon2id (the password-hashing
# competition winner; memory-hard, the settled default for new password stores)
# and mints opaque bearer tokens from OS randomness. `argon2` re-exports the
# `password-hash` PHC-string machinery so a stored hash carries its own salt and
# parameters. `rand` supplies the `OsRng` used for both the per-password salt and
# the token bytes; its `rand_core` matches the one `password-hash` expects. Only
# `crates/auth-service` pulls these in, so the leaner crates never compile them.
argon2 = "0.5"
rand = "0.8"

# The operating system's entropy, at the version `wasmtime-wasi` already pulls in, so gg's own
# reads and WASI's `random_get` come from one generator.
getrandom = "0.3"

# Streaming HTTP bodies. The backend relays a run's live harness events to the
# console as the run proceeds; `futures-util` adapts an mpsc receiver into the
# `Stream` axum's `Body::from_stream` consumes, and `bytes` frames each NDJSON
# line. Both are already in the dependency graph (transitively, via axum/tokio),
# so naming them here adds no new fetch.
futures-util = "0.3"
bytes = "1"

# OpenTelemetry. These crates move in lockstep across the `opentelemetry`
# ecosystem and are pinned together here so the whole workspace shares one
# mutually-compatible set; bumping one means bumping all. They are consumed
# through `crates/telemetry` (`test-cabinet-telemetry`), which splits the light
# propagation deps (default features) from the heavy exporter/init deps (the
# `otlp` feature). Transport is OTLP over HTTP/protobuf (collector port 4318),
# using a non-blocking `reqwest` client with rustls so we inherit the same TLS
# stack as the rest of the workspace and need no system OpenSSL or `protoc`.
#
# `http` is named here so the propagation helpers can speak in terms of
# `http::HeaderMap` without leaning on a transitive copy from axum/reqwest.
http = "1"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
	"http-proto",
	"reqwest-blocking-client",
	"trace",
	"metrics",
	"logs",
] }
# `reqwest-rustls` routes the OTLP exporter's reqwest client through rustls,
# matching the workspace's no-system-OpenSSL stance. The propagation helpers use
# only the no-default-feature core (the `HeaderExtractor`/`HeaderInjector`).
opentelemetry-http = { version = "0.32", default-features = false }
# `semconv_experimental` exposes the stabilized-but-feature-gated keys we use,
# notably `deployment.environment.name`.
opentelemetry-semantic-conventions = { version = "0.32", features = [
	"semconv_experimental",
] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"

# BPE tokenizer for gg's context-window token accounting (`crates/gg`'s `context`
# module). gg tags every context contribution with a source and an estimated token
# count so it can report what fills the window (context visibility) and trigger
# compaction on fullness. Exact per-provider counts are not available cross-provider,
# so gg counts with a fixed BPE base (o200k) as a documented cross-model approximation;
# the estimator is swappable so a later phase can refine it per model family.
# `tiktoken-rs` embeds the BPE vocab (no network, no system deps), matching the
# workspace's minimal-host stance. Only `crates/gg` pulls it in.
tiktoken-rs = "0.7"

# The TypeScript/JSX front end `crates/code-analysis` parses a produced source tree with.
# Pinned to the 0.141 line that crate is written against: oxc's parser and AST move between
# minor releases, and a silent bump would change what the analyzer reports.
oxc = { version = "0.141" }

