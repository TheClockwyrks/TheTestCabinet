[workspace]
resolver = "3"
members = [
	"crates/backend",
	"crates/publisher",
	"crates/artifacts",
	"crates/arena",
	"crates/db-auth",
	"crates/entities",
	"crates/migration",
]
# The repositories checked out as submodules carrying a crate (contracts, engines,
# gg, microservice-dispatcher, microservice-driver, microservice-repos,
# tool-model-core, tool-paint, tool-particle, tool-sprite, tool-voxel, tool-mc,
# tool-sn, tool-dc, tool-audio-core, tool-sfx-synth, tool-sfx-sample, tool-music,
# ui-common) are workspaces of their own. The contracts and engines crates are
# named under `[workspace.dependencies]` by their public source, and the patch
# table of `.cargo/config.toml` builds them from the checkouts. No member depends
# on the other repositories' source (gg's, the microservices', the tools' or
# ui-common's), nor on every crate of engines; the patch table names their crates
# all the same, and the lock records them as unused.
exclude = ["contracts", "engines", "gg", "microservice-dispatcher", "microservice-driver", "microservice-repos", "tool-model-core", "tool-paint", "tool-particle", "tool-sprite", "tool-voxel", "tool-mc", "tool-sn", "tool-dc", "tool-audio-core", "tool-sfx-synth", "tool-sfx-sample", "tool-music", "ui-common"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

# Warnings-as-errors, baked into the manifests for every member crate that opts
# in with `[lints] workspace = true`. CI already denies warnings on the clippy
# command line (the `rust-clippy` gate runs `cargo clippy … -- -D warnings`), but
# that flag only fires under that one invocation; defining the policy here
# means a plain `cargo build` or `cargo clippy` enforces it locally too — no flag
# required — and keeps the rule in one place instead of scattered across scripts.
[workspace.lints.rust]
warnings = "deny"

# Clippy lints live in their own `clippy::` namespace, so denying rustc's
# `warnings` group above does not reach them. Deny the default `all` group here
# to mirror what `-D warnings` already does under the clippy driver in CI.
[workspace.lints.clippy]
all = "deny"

# `foray-core` and `lattice-core`, from the engines repository, are `cdylib`s (each
# compiles to `wasm32-unknown-unknown` for the browser playback ABI), so on the native
# host rustc's incremental codegen for the otherwise unused `.so`, split across the dev
# profile's codegen units, intermittently drops a `*.rcgu.o` object and fails the link.
# One codegen unit removes the race. `lattice-core` is the Lattice oracle, written for
# clarity rather than speed, so the performance validator's tests run it optimised;
# its integer fixed-point answers are the same at either level. The engines
# repository's own manifest carries the same pins and their full account.
[profile.dev.package.foray-core]
codegen-units = 1

[profile.dev.package.lattice-core]
codegen-units = 1
opt-level = 3

# Cranelift compiles wasm modules in test processes: the Foray and Lattice hosts of the
# engines repository, which the arena links through the match runner,
# compile each controller with wasmtime, and `cargo nextest` runs ONE PROCESS PER TEST.
# These are the crates that compile a module and read its debug information —
# Cranelift, wasmtime's compile path and the DWARF readers — none of them workspace
# members, so optimising them changes no behaviour under test and makes each compile
# cheaper; the cost is one slower first build. gg's own manifest carries the same pins
# for its sandbox's components.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-codegen-shared]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-native]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmtime-internal-core]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.gimli]
opt-level = 3

[profile.dev.package.addr2line]
opt-level = 3

[profile.dev.package.object]
opt-level = 3

[workspace.dependencies]
# The crates of the contracts repository, named by its public source, the GitHub
# mirror, at the tag its dependents pin (`TAGS` in `scripts/repos/render.py`), as
# the Repositories page's "How a dependency is named" states. No manifest names a
# path into `contracts/`: inside the superrepo the patch table of
# `.cargo/config.toml` sends this source to the sibling checkout, which may hold
# crates and changes the tag does not yet carry.
test-cabinet-contracts = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }
test-cabinet-suites = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }
test-cabinet-telemetry = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }
test-cabinet-redact = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }
test-cabinet-backend-client = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }
# The crates of the engines repository, named the same way at its tag. The engine
# catalog, the match runner, and the Foray rules the arena records a match in.
test-cabinet-engines = { git = "https://github.com/TheClockwyrks/engines", tag = "v1.1.2" }
test-cabinet-match-play = { git = "https://github.com/TheClockwyrks/engines", tag = "v1.1.2" }
foray-core = { git = "https://github.com/TheClockwyrks/engines", tag = "v1.1.2" }
# Shared runtime dependencies inherited by member crates via { workspace = true }.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Collision-resistant unique identifiers. CUID2 ids are short, URL-safe strings
# generated from entropy plus a per-process fingerprint, so `create_id()` is a
# drop-in for the stringified UUIDs we previously used for run/job/token ids.
cuid2 = "0.1"
# Loads API keys (and other configuration) from a `.env` file so the CLI can be
# driven without exporting variables into every shell. `dotenvy` is the
# maintained fork of `dotenv`; it does not override variables already present in
# the environment, so an explicitly exported key still wins over the file.
dotenvy = "0.15"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tempfile = "3"
# Gzip framing, shared by every crate on the **run-tree artifact** path: a run's
# whole-run analysis documents (`replay.json.gz`, `code-analysis.json.gz`) are
# written compressed at the tree root, mirrored into the backend store as opaque
# bytes, and served back content-negotiated on the request's `Accept-Encoding` —
# so the writer (the run host), the store's reader (the backend) and the archive
# service all need the same codec. Promoted here from `crates/artifacts`, which
# pinned it privately for the run-archive download. Default features keep the
# pure-Rust `miniz_oxide` backend — no zlib, so no system dependency, matching the
# `png` stance on keeping the workspace buildable on minimal hosts.
flate2 = "1"
# Base64 for inlining a live asset-generation preview frame into the JSON event the
# driver streams to the run monitor: the run host
# receives the rendered PNG bytes from the drawing binary and base64-encodes them
# so the frame travels in the same JSON transport as every other live update.
base64 = "0.22"
# HTTP client for fetching OpenRouter model prices. rustls avoids a system
# OpenSSL dependency so the workspace builds cleanly on minimal hosts (NixOS).
# `stream` is for `Body::wrap_stream`, which is how the driver uploads a
# produced run tree without holding the tarball in memory (microservice-driver's
# `crates/driver/src/artifacts.rs`); a driver killed for exceeding its memory
# ceiling mid-upload destroys a run that has already paid for every one of its
# harness API calls, so the upload body is read off disk a chunk at a time.
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
	"stream",
] }


# Backend HTTP server. Axum is the settled web framework; `tower-http` supplies
# the request-tracing/limit middleware, the CORS layer the browser UIs need to
# reach the backend on a different localhost port, and the response compression
# the run listings need (their JSON runs to megabytes, which is punishing over a
# slow link). The backend, auth, and artifact services are the socket-binding
# crates, so these stay out of the leaner crates.
axum = "0.8"
# Verifies the Cloudflare Access assertion in the backend (`crates/backend/src/access.rs`):
# RS256 against the team's published keys. `rust_crypto` is the pure-Rust backend, so
# the portable musl build needs no C toolchain; no PEM parsing, since the keys arrive
# as JWK components.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "limit",
    "cors",
    "compression-gzip",
] }
tracing = "0.1"
# The backend's system of record, accessed through SeaORM so one connection URL
# selects the driver: SQLite for local/dev/tests, PostgreSQL for deployments.
# `default-features = false` drops SeaORM's native-tls runtime; we re-add only the
# two SQLx drivers and the rustls runtime so the backend keeps building statically
# under musl with no system OpenSSL (the `cargo build-portable-backend` alias).
# `libsqlite3-sys` is named with `bundled` so the SQLite C source is vendored and
# compiled — the same no-system-libsqlite stance the old `rusqlite` had.
sea-orm = { version = "1", default-features = false, features = [
	"macros",
	"sqlx-sqlite",
	"sqlx-postgres",
	"runtime-tokio-rustls",
] }
sea-orm-migration = { version = "1", default-features = false, features = [
	"sqlx-sqlite",
	"sqlx-postgres",
	"runtime-tokio-rustls",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# The entity definitions and schema migration for the SeaORM store, factored into
# their own crates per SeaORM convention so the migration can run at startup and
# the entities are reusable.
test-cabinet-entities = { path = "crates/entities" }
test-cabinet-migration = { path = "crates/migration" }
# SigV4 signing for R2's S3-compatible API (the backend holds the only write
# credential). Implemented directly over `hmac`/`sha2` rather than pulling the
# full AWS SDK, since R2 only needs PutObject, ListObjectsV2 and DeleteObjects.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# S3's batch `DeleteObjects` authenticates its request body with a `Content-MD5`
# header — the one place the R2 client needs a digest other than SHA-256. Same
# RustCrypto family as `sha2`/`hmac`, so it costs no new dependency tree.
md-5 = "0.10"
percent-encoding = "2"

# The operating system's entropy.
getrandom = "0.3"

# Streaming HTTP bodies. The backend relays a run's live harness events to the
# console as the run proceeds; `futures-util` adapts an mpsc receiver into the
# `Stream` axum's `Body::from_stream` consumes, and `bytes` frames each NDJSON
# line. Both are already in the dependency graph (transitively, via axum/tokio),
# so naming them here adds no new fetch.
futures-util = "0.3"
bytes = "1"
# `tokio-util`'s `io` feature carries `ReaderStream`, which turns the driver's
# finished tarball file into the `Stream` `reqwest::Body::wrap_stream` consumes —
# the read side of the same "never buffer a whole run tree" rule. Already in the
# graph transitively (via reqwest/hyper), so naming it here adds no new fetch.
tokio-util = { version = "0.7", features = ["io"] }

# OpenTelemetry. These crates move in lockstep across the `opentelemetry`
# ecosystem and are pinned together here so the whole workspace shares one
# mutually-compatible set; bumping one means bumping all, here and in the
# contracts repository's workspace. They are consumed through its telemetry
# crate (`test-cabinet-telemetry`), which splits the light propagation deps
# (default features) from the heavy exporter/init deps (the `otlp` feature). Transport is OTLP over HTTP/protobuf (collector port 4318),
# using a non-blocking `reqwest` client with rustls so we inherit the same TLS
# stack as the rest of the workspace and need no system OpenSSL or `protoc`.
#
# `http` is named here so the propagation helpers can speak in terms of
# `http::HeaderMap` without leaning on a transitive copy from axum/reqwest.
http = "1"
opentelemetry = "0.32"

# Line tables alone as the debug info of a development build, which the test
# profile inherits. A panic message and a backtrace keep their files and lines,
# and the compilers and the linkers hold less memory and write a smaller target
# directory than under full debug info: measured on a workspace of this
# template, linker peaks about 40% lower, rustc peaks 11-14% lower, a target
# directory 37% smaller and a build 16% faster. A debugger reads no variables
# from such a build; `CARGO_PROFILE_DEV_DEBUG=true` restores them for a command.
[profile.dev]
debug = "line-tables-only"
