name: Check catalog

# Guards against the committed catalog dataset drifting from the specs it is
# generated from. The deploy regenerates the catalog itself, so the live site is
# never stale — but the committed test-cases.json is what local dev and code
# review see, so this check keeps that snapshot honest. It regenerates the
# dataset with `tcab catalog` and fails if the committed test-cases.json differs.
#
# Only test-cases.json is compared: the catalog also rewrites reference PNGs
# (whose bytes vary by Chromium build) and model prices (which change over time),
# neither of which is reproducible byte-for-byte, whereas test-cases.json is fully
# determined by the specs.
on:
  push:
    branches: [master]
    paths:
      - "test-cases/**"
      - "crates/**"
      - "apps/site/src/data/test-cases.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/catalog-check.yml"
  pull_request:
    paths:
      - "test-cases/**"
      - "crates/**"
      - "apps/site/src/data/test-cases.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/catalog-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Regenerate the catalog and fail if the committed dataset drifted. The
      # script (shared with the Azure DevOps pipeline) installs the Chromium build
      # the bundled Playwright driver needs and uses the runner's preinstalled
      # stable toolchain via rust-toolchain.toml.
      - run: ./scripts/ci/catalog-check.sh
