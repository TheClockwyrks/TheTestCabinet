name: Deploy site

# Builds the static gallery (apps/site) and deploys it to GitHub Pages. The
# bundled model dataset (models.json) is regenerated from models/ as part of the
# build so model prices stay current; the test-case and run data the gallery
# shows come from the backend's public R2 snapshot, fetched at build time by the
# snapshot plugin (a backend deploy hook rebuilds the site when that changes).
# Runs on pushes that touch the site, the shared UI it renders, the run-record
# contract it is built from, the model catalog, or the catalog command itself,
# and on demand. Dormant until the repository is mirrored to GitHub with Pages
# enabled.
on:
  push:
    branches: [master]
    paths:
      - "apps/site/**"
      - "packages/ui/**"
      - "packages/run-record/**"
      - "models/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Regenerate the bundled model dataset (models.json) from models/ so the
      # deployed gallery shows current model prices. No browser is needed — the
      # command only reads the model catalog and OpenRouter. Uses the runner's
      # preinstalled stable toolchain via rust-toolchain.toml.
      - run: cargo run --locked -p test-cabinet-cli -- catalog
      # The site imports built run-record types/JS, so build that package first.
      - run: npm run build -w @test-cabinet/run-record
      - run: npm run build -w @test-cabinet/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
