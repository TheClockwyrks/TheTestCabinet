name: Deploy site

# Builds the static gallery (apps/site) and deploys it to GitHub Pages. The
# catalog datasets are regenerated from test-cases/ and models/ as part of the
# build, so the deployed site always reflects the current specs rather than a
# committed snapshot. Runs on pushes that touch the site, the run-record contract
# it is built from, the catalog sources, or the catalog command itself, and on
# demand. Dormant until the repository is mirrored to GitHub with Pages enabled.
on:
  push:
    branches: [master]
    paths:
      - "apps/site/**"
      - "packages/run-record/**"
      - "test-cases/**"
      - "models/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The catalog renders reference screenshots through the bundled Playwright
      # driver, so install the Chromium build it expects (with its OS deps). Run
      # it from the browser-driver workspace that pins Playwright: it is installed
      # there, not hoisted to the root, so a bare `npx playwright` would miss it
      # and fetch a different version whose Chromium revision the driver can't find.
      - run: npm exec -w @test-cabinet/browser-driver -- playwright install --with-deps chromium
      # Regenerate test-cases.json / models.json (and the public/catalog assets)
      # from the catalog sources so the deployed site reflects the current specs.
      # Uses the runner's preinstalled stable toolchain via rust-toolchain.toml.
      - run: cargo run --locked -p test-cabinet-cli -- catalog
      # The site imports built run-record types/JS, so build that package first.
      - run: npm run build -w @test-cabinet/run-record
      - run: npm run build -w @test-cabinet/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
