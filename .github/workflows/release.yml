name: Release

# On-demand release pipeline for The Test Cabinet's distributable artifacts:
# the headless binaries — the `tcab` CLI, the `tcab-backend` store/API, and the
# `tcab-dispatcher`/`tcab-driver`/`tcab-artifacts` run-topology services — the `gg`
# in-container coding harness, plus the
# Tauri desktop app, each built for every platform. Public releases are cut on GitHub (the Azure DevOps repository is
# private to the org), so this is where downloadable artifacts are built and
# published.
#
# It is deliberately manual and two-phase, matching how releases are cut: run
# this workflow to build, smoke-test, and publish the artifacts as a PRERELEASE;
# download and exercise them; then finalize with the "Release (promote)" workflow
# once they are trusted. Promotion does not rebuild, so the exact artifacts that
# were tested are the ones published.
#
# Even though Azure already smoke-tests the Linux and Windows CLI binaries
# continuously, this re-runs the same check (scripts/ci/smoke-binary.sh) on every
# platform's actual shipped `tcab`: a green Azure run must never be the only
# thing standing between a broken binary and users. The backend and the
# dispatcher/driver/artifacts services need a runtime/store/cluster to do anything,
# so a clean build is their gate; the desktop app is exercised by hand from the
# published prerelease. `gg` gets a smoke check of its own — it is built natively on
# each architecture's runner, so the shipped binary can be executed here, and what it
# reports for `--version` is what a run record will claim produced its result.
#
# Dormant until the repository is mirrored to GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Build every platform even if one fails, so a single platform's break does
      # not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          # Linux ships the static musl builds (the `cargo build-portable*`
          # targets): no dynamic loader, so they run on any distro including
          # NixOS. All three headless binaries link statically this way.
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe: ""
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            exe: ".exe"
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            exe: ""
    steps:
      - uses: actions/checkout@v6
      # The musl target needs a musl C toolchain because the `ring` TLS backend
      # and the backend's bundled SQLite each compile a little C.
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      # All the headless binaries share `test-cabinet-core`, so one compile
      # produces the whole set.
      - name: Build release binaries
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p test-cabinet-cli -p test-cabinet-backend
          -p test-cabinet-dispatcher -p test-cabinet-driver -p test-cabinet-artifacts
      # Re-run the shared smoke check on the exact `tcab` about to be shipped. The
      # servers have no equivalent dependency-free smoke (they bind ports and need
      # a runtime/store), so a clean build is their release gate.
      - name: Smoke-test tcab
        shell: bash
        run: ./scripts/ci/smoke-binary.sh "target/${{ matrix.target }}/release/tcab${{ matrix.exe }}"
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          for bin in tcab tcab-backend tcab-dispatcher tcab-driver tcab-artifacts; do
            tar -czf "dist/${bin}-${VERSION}-${{ matrix.name }}.tar.gz" \
              -C "target/${{ matrix.target }}/release" "$bin"
          done
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($bin in "tcab", "tcab-backend", "tcab-dispatcher", "tcab-driver", "tcab-artifacts") {
            Compress-Archive -Path "target/${{ matrix.target }}/release/$bin.exe" `
              -DestinationPath "dist/$bin-$env:VERSION-${{ matrix.name }}.zip"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  gg:
    name: gg (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # BOTH musl architectures, because the download side picks the triple from
          # the arch of the machine asking: `core::gg_exec` resolves
          # `{ARCH}-unknown-linux-musl` from the *driver's* own architecture, so an
          # arm64 driver pod asks for `gg-aarch64-unknown-linux-musl` and an amd64 one
          # for the x86_64 asset. Publishing only one leg would leave half the
          # deployments unable to install gg at all.
          #
          # Each leg builds NATIVELY on a runner of its own architecture (no
          # cross-compilation): scripts/build-gg-static.sh targets the host arch, which
          # is also how the driver image bakes gg in, so the release asset and the
          # image's binary come off the identical build path.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
      # musl-gcc: `ring` (via rustls/reqwest) and `wasmtime` each compile a little C
      # that has to be built for the musl target. `ruby` rides along because gg's Ruby
      # arm reflects its signature catalogue with YARD (see the next step), and the
      # interpreter is the one prerequisite install-gg-toolchains.sh cannot install for
      # itself — it needs root. The x86_64 runner image ships one; rather than find out
      # the hard way whether the arm64 image does, on the job that publishes a release,
      # ask for it on both legs. apt makes an already-installed package a no-op.
      - name: Install musl toolchain and Ruby
        run: sudo apt-get update && sudo apt-get install -y musl-tools ruby
      # WHY A RELEASE BUILD OF ONE STATIC BINARY NOW PULLS IN ~2 GB OF COMPILERS.
      #
      # gg drives a model in one of eleven program languages, and what a model is told
      # each language offers is a signature catalogue reflected out of that language's
      # own SDK by that language's own documentation tool — `tsc`, griffe, YARD, `purs`,
      # javadoc, the Kotlin front end, rustdoc, `swiftc -emit-symbol-graph`,
      # `clang++ -ast-dump=json`, Roslyn. Nothing about that is new; what changed is
      # that the eleven catalogues are no longer committed. crates/gg's build script
      # reflects them on every build, so the binary this job publishes cannot describe a
      # surface the guest SDKs in the same tag do not export — which matters most
      # exactly here, since this is the artifact a run container downloads and the only
      # gg most people ever execute.
      #
      # So a machine that builds gg is a machine that has all eleven toolchains, and
      # install-gg-toolchains.sh is the one pinned list of them: the same script the
      # devcontainer, the CI jobs and the driver image's gg stage run. It installs
      # ~1.9 GB under $HOME (835 MB of that Swift, after its installer prunes a 3.3 GB
      # toolchain down to what a wasm cross-compile actually runs), and it must succeed
      # on BOTH legs of this matrix — the aarch64 leg included, which is the one where a
      # toolchain that publishes no arm64 build would be found.
      #
      # The same is true of what a program is compiled AGAINST, which stopped being
      # committed the same way: this build bakes four language runtimes and links six
      # compile targets, so it needs those toolchains to RUN and not merely to be read.
      # One of them is not on the eleven-arm list at all — see the second call below.
      #
      # `npm ci` is part of the same prerequisite: the pinned `typescript` that reflects
      # the TypeScript and JavaScript arms is a workspace devDependency, so a checkout
      # nobody installed has no reflector for two of the eleven.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install gg's program-language toolchains
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/install-gg-toolchains.sh
          # And the C# arm's BUILD toolchains, which the eleven-arm list deliberately excludes
          # (~1.4 GB no gg RUN needs). Building gg means building every arm's artifacts now,
          # not only reflecting their catalogues, and this arm's guest is Mono's IL interpreter
          # relinked with a whole .NET SDK against an unpruned wasi-sdk. Without it the arm's
          # build.sh fetches both itself, which works and costs the same download twice over
          # the two matrix legs — see that installer's header for why it is a second prefix.
          ./scripts/ci/install-gg-build-toolchains.sh
          npm ci
          # The build step below is a separate process, so the installers' bin directory
          # is prepended for the job rather than exported here: `purs` and `uv` are
          # resolved from PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # gg is shipped as a fully STATIC musl binary — not a portability nicety but the
      # thing that makes it work at all: it executes INSIDE the run container, whose
      # images span glibc Debian bookworm and the Ubuntu blender image, so one static
      # binary is the only build that runs across all of them.
      - name: Build gg (static musl)
        shell: bash
        run: |
          # The build script derives its target from the runner's architecture, so a
          # mislabelled matrix leg would silently publish (say) an x86_64 binary under
          # the aarch64 asset name — a failure that would only surface as an "Exec
          # format error" inside somebody's run container. Assert the pairing instead.
          if [ "$(uname -m)" != "${{ matrix.arch }}" ]; then
            echo "runner is $(uname -m) but this leg builds ${{ matrix.target }}" >&2
            exit 1
          fi
          ./scripts/build-gg-static.sh "dist/gg-${{ matrix.target }}"
      # Native build on a native runner, so the shipped binary itself can be run. This
      # is the gate on the version coupling the whole release rests on: `gg --version`
      # is read out of the run container by `core` and recorded as a run's
      # `subject.harnessVersion`, and `core` asks GitHub for a release named by ITS own
      # version. Cutting `v0.8.0` without bumping `crates/gg` would publish a binary
      # that reports the old version and mislabels every run made with it, so fail the
      # release here instead. A prerelease tag (`v0.7.0-rc1`) legitimately carries the
      # base crate version, hence prefix rather than equality.
      - name: Smoke-test gg
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          reported="$("dist/gg-${{ matrix.target }}" --version)"
          echo "$reported"
          built="${reported#gg }"
          expected="${VERSION#v}"
          case "$expected" in
            "$built"|"$built"-*) ;;
            *)
              echo "gg reports version '$built' but this release is '$expected' — bump crates/gg and crates/core" >&2
              exit 1
              ;;
          esac
      # Uploaded as a BARE executable named `gg-<target>`, not an archive like the
      # other binaries: the install inside a run container is a single `curl` (see
      # `core::gg_exec::release_asset_url`) in an image that is not guaranteed to have
      # `tar`, and the triple in the filename is what lets one release serve both
      # architectures.
      - uses: actions/upload-artifact@v6
        with:
          name: dist-gg-${{ matrix.target }}
          path: dist/gg-${{ matrix.target }}
          if-no-files-found: error
      # gg's REFERENCE DOCUMENTS — the twelve JSON files `tcab-backend` serves at
      # /gg/reference, which it reads from disk because it cannot link the crate that
      # projects them. A backend run from the tarballs above therefore needs this asset
      # unpacked and TCAB_GG_REFERENCE pointed at it, or its reference endpoints answer
      # 503 (the container images bake the same files instead — see
      # deployments/images/services.Dockerfile). `development/releasing.md` says so where
      # an operator will read it.
      #
      # ONE ASSET, FROM ONE LEG, AND NOT BUNDLED INTO THE FIVE BACKEND ARCHIVES. The
      # output is JSON projected from data compiled into gg — no host paths, no
      # timestamps, no map iteration order in it — so there is nothing arch-dependent to
      # ship five times over. Two projections from one binary were measured byte-identical;
      # the two matrix legs were not compared, which is precisely why only one of them
      # publishes rather than both publishing an asset under the same name. Bundling it
      # instead would mean making `build` (musl, Windows, macOS — none of which has a
      # single gg toolchain) wait on this Linux-only job for a file identical in all five,
      # which is a serialization bought with nothing. The x86_64 leg is the arbitrary but
      # stated choice of the two.
      - name: Package gg's reference documents
        if: matrix.arch == 'x86_64'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          "dist/gg-${{ matrix.target }}" reference --out dist/gg-reference
          tar -czf "dist/gg-reference-${VERSION}.tar.gz" -C dist gg-reference
      - uses: actions/upload-artifact@v6
        if: matrix.arch == 'x86_64'
        with:
          name: dist-gg-reference
          path: dist/gg-reference-*.tar.gz
          if-no-files-found: error

  # Gate the desktop build on the service images actually existing at this commit.
  #
  # The desktop job below bakes TCAB_DESKTOP_IMAGE_TAG=<github.sha> into the app, and
  # the bundled `overlays/app` pins all six services to that tag — so if no images
  # were published at this sha, the build still succeeds and produces installers that
  # cannot pull a single image, failing only in a user's hands at first launch.
  # build-service-images.yml is unfiltered on master/staging precisely so this can
  # never be a missing build, but it can still be an in-flight or failed one, and a
  # release can be dispatched at any ref. Ten seconds of manifest lookups turn a
  # ship-broken installer into a fast, legible CI failure.
  images:
    name: Verify service images exist at this commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # Public GHCR packages resolve unauthenticated, but a private (or not-yet-made-
      # public) package would 404 identically to a missing tag, so authenticate and
      # keep the failure meaning exactly one thing.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # The six images `overlays/app` pins — the exact set the app's k3d cluster
      # pulls. Check them all before failing, so one dispatch reports every gap
      # rather than only the first.
      - name: Inspect ${{ github.sha }} manifests
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          registry="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          missing=()
          for image in tcab-backend tcab-auth-service tcab-dispatcher \
                       tcab-driver tcab-artifacts tcab-arena; do
            if docker buildx imagetools inspect "$registry/$image:$SHA" >/dev/null 2>&1; then
              echo "ok      $image:$SHA"
            else
              echo "MISSING $image:$SHA"
              missing+=("$image")
            fi
          done
          if (( ${#missing[@]} )); then
            echo
            echo "::error::No service images at $SHA for: ${missing[*]}."
            echo "::error::The desktop app would ship pinned to tags that do not exist."
            echo "::error::Run build-service-images.yml at this ref, then re-dispatch."
            exit 1
          fi

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: [images]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The desktop shell links the system web view, so it builds against the
          # host's native toolchain (no musl) and ships the platform's installer:
          # a .deb on Linux, a .dmg on macOS, and both an .msi and an NSIS .exe on
          # Windows.
          # `target` is the host Rust triple — used to name the k3d/kubectl sidecar
          # binaries Tauri's externalBin expects (`<name>-<triple>`); it matches the
          # triple Tauri resolves for the host, so the bundled sidecar is found.
          # Built on ubuntu-22.04 ON PURPOSE, unlike the musl `build` job above:
          # this app links the system glibc (x86_64-unknown-linux-gnu) plus the
          # WebKitGTK/GTK stack, and glibc is backward- but not forward-compatible
          # — a binary linked against a newer glibc pulls in symbol versions the
          # older loader lacks and dies with `version 'GLIBC_2.xx' not found`. The
          # build host sets the compatibility FLOOR, so building on 22.04 (glibc
          # 2.35) keeps the .deb runnable on 22.04 AND everything newer; 24.04
          # (glibc 2.39) would raise the floor and lock 22.04 users out.
          # Ubuntu 22.04 is EOL 2027-04; once it is no longer supported, bump this
          # back to ubuntu-24.04 (and drop this comment).
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
    steps:
      - uses: actions/checkout@v6
      # Tauri v2's Linux backend compiles against the system WebKitGTK/GTK/tray
      # libraries. The devcontainer already curates exactly this package set, so
      # reuse it rather than duplicating the list. macOS and Windows ship their
      # web view with the OS.
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: ./.devcontainer/languages/rust/tauri.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      # The Tauri CLI drives the build (UI + Rust shell + installer); it is a
      # Cargo subcommand, matching how the app is built locally.
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Install npm workspace
        run: npm ci
      # The desktop UI (via @clockwyrks/ui) imports the compiled types of the
      # workspace runtime packages, so they have to be built before the Tauri
      # build runs the UI's own `tsc -b && vite build` (its beforeBuildCommand) —
      # otherwise those imports resolve to nothing and the UI's typecheck fails.
      #
      # Which packages, and in what order, is the root `build:packages` script's
      # to know — the same one `scripts/ci/web-build.sh` and `web-test.sh` defer
      # to. This step used to inline the list, and that is precisely how it broke:
      # `run-stats` was added to the root script and not to this copy, so the
      # release built the desktop app against a package it had never built and all
      # three platforms failed in `tsc -b` with ~100 unresolved-import errors.
      # Never inline the list again.
      - name: Build workspace type packages
        run: npm run build:packages
      # The shipped app stands up its own k3d cluster, so it bundles the k3d and
      # kubectl CLIs as externalBin sidecars. Fetch the host-triple build of each
      # into crates/desktop/binaries/ before the bundle runs (the committed config
      # omits externalBin so a plain `cargo tauri build`/`dev` needs no binaries —
      # they are added via --config below).
      - name: Fetch cluster sidecars (k3d, kubectl)
        run: node scripts/fetch-desktop-sidecars.mjs ${{ matrix.target }}
      # Run from the crate that holds tauri.conf.json so the CLI resolves it.
      # `--bundles` narrows the config's "all" targets to this platform's chosen
      # installer(s) — notably skipping Linux AppImage, whose builder reaches out
      # to the network and is the flaky one in CI. `--config` (bash on every
      # platform, for consistent quoting) stamps the release version, adds the
      # sidecar externalBin entries, and — via TCAB_DESKTOP_IMAGE_TAG, baked into
      # the binary at compile time — pins the GHCR service images the app pulls to
      # the set published for THIS commit (an immutable `:<git-sha>` tag), so an
      # installer is coupled to a known-good image set rather than a moving `latest`.
      - name: Build desktop app
        working-directory: crates/desktop
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TCAB_DESKTOP_IMAGE_TAG: ${{ github.sha }}
        run: |
          version_number="${VERSION#v}"
          cargo tauri build --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"${version_number}\",\"bundle\":{\"externalBin\":[\"binaries/k3d\",\"binaries/kubectl\"]}}"
      # Tauri writes installers under target/release/bundle/<type>/ with a
      # product-named, spaced filename; rename each to the same scheme as the
      # binary archives so the release assets are uniform and shell-safe.
      - name: Collect installers
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "dist/test-cabinet-desktop-${VERSION}-${{ matrix.name }}.${f##*.}"
            done
      - uses: actions/upload-artifact@v6
        with:
          name: dist-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: [build, gg, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          # Checksum every shipped asset (binary archives + desktop installers),
          # null-delimited so product-named installers survive. Exclude the
          # SHA256SUMS file itself so it never hashes its own (empty) self.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # Idempotent: re-running for the same candidate refreshes its assets rather
        # than failing because the prerelease already exists.
        run: |
          # The macOS .dmg is not yet code-signed or notarized, so Gatekeeper
          # reports the freshly downloaded app as "damaged". Tell downloaders how
          # to clear the quarantine attribute until signing is in place.
          macos_note=$'\n\n### macOS: "“The Test Cabinet” is damaged and can’t be opened"\n\nThe macOS app is not yet signed or notarized, so after downloading it macOS quarantines it and shows this (misleading) message — the app is fine, just unsigned. After dragging it to Applications, clear the quarantine attribute once:\n\n```sh\nxattr -dr com.apple.quarantine \"/Applications/The Test Cabinet.app\"\n```\n\nThen open it normally.'
          notes="Candidate build of ${VERSION}: the tcab CLI, the backend server, the dispatcher/driver/artifacts services, the gg coding harness (static musl, x86_64 and aarch64), gg's reference documents (\`gg-reference-${VERSION}.tar.gz\`, arch-independent — unpack it and point the backend's TCAB_GG_REFERENCE at it so \`GET /gg/reference\` serves), and the desktop app, for every platform. Download and test these artifacts, then finalize with the \"Release (promote)\" workflow. Each platform's tcab was smoke-tested during build, and each gg binary was checked to report ${VERSION}.${macos_note}"
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" --repo "$REPO" --clobber dist/*
          else
            gh release create "$VERSION" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "$VERSION" \
              --prerelease \
              --notes "$notes" \
              dist/*
          fi
