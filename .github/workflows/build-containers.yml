name: Build containers

# Builds the run-container images (the shared base, then one per agent harness)
# and pushes them to GHCR, pinned by digest. Runners resolve these published
# images directly from their own registry configuration (default
# ghcr.io/theclockwyrks on the latest tag); the backend plays no part — see
# docs/components/core/execution.md.
#
# This is the one CI job that lives on GitHub Actions rather than the primary
# Azure DevOps pipeline, by deliberate exception: the images are meant for anyone
# who clones the repo to pull, so building them in public makes the supply chain
# visible, and GH Actions authenticates to GHCR for free via the built-in
# GITHUB_TOKEN (no PAT to manage). Dormant until the repository is mirrored to
# GitHub, like the other workflows here.
#
# One-time setup: after the first successful push, set each published package's
# visibility to Public in the org's GHCR package settings so unauthenticated
# runners can pull them.
on:
  push:
    branches: [master]
    paths:
      - "containers/**"
      - ".github/workflows/build-containers.yml"
  workflow_dispatch:
    inputs:
      harnesses:
        description: "Space-separated harness slugs to build (empty = all)."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# One container build at a time; let an in-progress run finish so a later push
# doesn't race it to the latest tag.
concurrency:
  group: build-containers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Authenticate to GHCR with the built-in token (packages: write above).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build.sh builds the base + each harness FROM it, pushes to IMAGE_REGISTRY,
      # and prints each pinned digest. The registry namespace is the repository
      # owner, lowercased (GHCR requires lowercase), which is the resolver's
      # default for the canonical repo. The harness list comes from the dispatch
      # input (passed via env to avoid shell injection); empty builds all.
      - name: Build and push images
        env:
          PUSH: "1"
          DOCKER: docker
          HARNESSES: ${{ github.event.inputs.harnesses }}
          OWNER: ${{ github.repository_owner }}
        run: |
          registry="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "Pushing to $registry"
          IMAGE_REGISTRY="$registry" ./containers/build.sh $HARNESSES
