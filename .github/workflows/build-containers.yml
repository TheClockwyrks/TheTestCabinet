name: Build containers

# Builds the run-container images and pushes them to GHCR, pinned by digest:
#   - the base image, used by every end-to-end run;
#   - the sprite image (the base plus the baked-in `draw` binary), used by every
#     single-sprite asset-generation run;
#   - the sprite-sheet image (the base plus the baked-in `draw-sheet` binary),
#     used by every sprite-sheet asset-generation run;
#   - the voxel image (the base plus the baked-in `voxel` binary), used by every
#     static voxel-model asset-generation run;
#   - the voxel-animation image (the base plus the baked-in `voxel-anim` binary),
#     used by every animated voxel-animation asset-generation run; and
#   - the adversarial image (the base plus the wasm toolchain and the Foray tooling
#     compiled from crates/ — the `foray` CLI, the controller buildkit, and the
#     reference modules + map), used by every adversarial run.
# (plus the performance image — the base plus the wasm toolchain and the Lattice
# tooling). All are built by containers/build.sh in one invocation (the sprite,
# sprite-sheet, adversarial, and performance images are built FROM the base built
# alongside them). Runners resolve the image for a run's test type and asset kind
# directly from their own registry configuration (default ghcr.io/theclockwyrks on
# the latest tag); the backend plays no part — see docs/components/core/execution.md.
#
# Each image is published MULTI-ARCH (linux/amd64 + linux/arm64): the `build` job
# below runs build.sh once per architecture on a native runner (pushing an
# arch-suffixed tag) and the `manifest` job fuses those into both the `:latest` and
# an immutable `:<git-sha>` manifest list (mirroring build-service-images.yml), so a
# deployment can pin the run images by sha via TCAB_CONTAINER_TAG and promote them
# on the same staging→prod flow as the services. arm64 is not optional — the
# deployments run on arm64 nodes, and an amd64-only image makes every run pod die at
# startup with `exec format error` (the seeding `tar` exec into the dead container
# then fails). Build natively per arch rather than cross-building under QEMU: the
# Rust/wasm compiles in the non-base images are far too slow emulated.
#
# None is a per-harness image: a run installs the selected harness's CLI into the
# image at run time (see harnesses/README.md), so the images never need rebuilding
# when a harness publishes a new version.
#
# This is the one CI job that lives on GitHub Actions rather than the primary
# Azure DevOps pipeline, by deliberate exception: the image is meant for anyone
# who clones the repo to pull, so building it in public makes the supply chain
# visible, and GH Actions authenticates to GHCR for free via the built-in
# GITHUB_TOKEN (no PAT to manage). Dormant until the repository is mirrored to
# GitHub, like the other workflows here.
#
# One-time setup: after the first successful push, set EACH published package's
# visibility to Public in the org's GHCR package settings so unauthenticated runners
# can pull them — one `test-cabinet-<name>` package per name in containers/image-names.sh
# (base, every asset-generation kind including blender, adversarial, and performance).
# A newly-added image needs this the first time it is published.
on:
  # DELIBERATELY UNFILTERED, for the same reason as build-service-images.yml: every
  # push to master/staging must leave a COMPLETE `:<git-sha>` run-image set behind,
  # because the deployments pin the run images by the sha of a commit
  # (TCAB_CONTAINER_TAG in the azure-staging/azure-prod overlays), not by "the last
  # sha that happened to build". With a path filter, most release shas had no run
  # images at all, which is why the two pins drifted apart for entire release trains
  # — the overlays sat on a months-old TCAB_CONTAINER_TAG while the service images
  # moved ahead, and every roll had to first go hunting for a sha at which this
  # workflow actually published.
  #
  # The filter was also a standing correctness trap on its own: it hand-enumerated
  # the crates baked into the images, so it silently went stale every time an image
  # gained a source. It had already drifted — it listed every `foray-*` crate for the
  # adversarial image but NONE of the `lattice-*` crates the performance image bakes,
  # so a change to the Lattice engine shipped a stale performance image with no
  # signal. A filter that has to be maintained in lockstep with every Dockerfile is
  # a filter that will be wrong again. Do not reintroduce `paths:`.
  #
  # The cost is real here (these images compile Rust and wasm, uncached), but
  # master/staging only move at rc/release cadence, and a stale or missing run image
  # is paid for by every run that lands on it.
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One container build at a time; let an in-progress run finish so a later push
# doesn't race it to the latest tag.
concurrency:
  group: build-containers
  cancel-in-progress: false

jobs:
  # Build every image once per target architecture, each on a NATIVE runner, and
  # push an arch-suffixed tag (e.g. test-cabinet-base:latest-arm64). Building
  # natively rather than cross-building under QEMU matters here: the sprite,
  # sprite-sheet, adversarial, and performance images compile Rust (and the
  # adversarial/performance images a wasm toolchain) inside the build, which is
  # punishingly slow under emulation — a native arm64 runner builds them at the
  # same speed as amd64. The `manifest` job below then fuses the two arch-tags into
  # the multi-arch `:latest` tag the runner actually resolves. Both architectures
  # are required because the deployments run on arm64 nodes (Azure prod) while
  # contributors and the amd64 cloud pull the amd64 variant.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      # `build.sh` runs `scripts/presign-sample-pack.mjs` (node-only, no npm install)
      # to mint the R2 download URL for the sfx-sample/music audio packs.
      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2

      # Authenticate to GHCR with the built-in token (packages: write above).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build.sh (no args) builds EVERY run image — base, every asset-generation kind
      # including blender, adversarial, and performance — natively for this runner's
      # architecture, pushes them to IMAGE_REGISTRY under the arch-suffixed tag, and
      # prints their pinned digests. Both build.sh and the `manifest` job below take
      # their image set from containers/image-names.sh, so each built image is
      # guaranteed to get fused into its multi-arch `:latest`/`:<sha>`.
      # The registry namespace is the repository owner, lowercased (GHCR requires
      # lowercase), which is the resolver's default for the canonical repo. Only the
      # arch tag is written here; the bare `:latest` manifest list is created by the
      # manifest job, so a half-finished matrix never leaves `:latest` single-arch.
      #
      # The CLOUDFLARE_AUDIO_R2_* values let build.sh presign a READ-only download of
      # the sfx-sample and music images' audio packs (see build_audio_image). They are
      # read-scoped — CI never writes the bucket; publishing is a local step. They are
      # REQUIRED: a pack that is not pinned (or that cannot be presigned) fails the
      # build rather than shipping an image with an empty palette, so these must be set.
      - name: Build and push images
        env:
          PUSH: "1"
          DOCKER: docker
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: latest-${{ matrix.arch }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUDIO_R2_BUCKET: ${{ vars.CLOUDFLARE_AUDIO_R2_BUCKET }}
          CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID }}
          CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY }}
        run: |
          registry="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "Pushing $IMAGE_TAG images to $registry"
          IMAGE_REGISTRY="$registry" ./containers/build.sh

  # Fuse the per-arch tags into the multi-arch manifest lists every runner resolves:
  # `:latest` (DEFAULT_CONTAINER_TAG) AND an immutable `:<git-sha>` a deployment can
  # pin (TCAB_CONTAINER_TAG), mirroring build-service-images.yml so the run images
  # promote on the same staging→prod sha flow as the services. `imagetools create`
  # assembles each list purely from registry references — no builder, no pulls — so
  # it is fast and runs on any architecture; it records the per-arch *digests*, so
  # the `:<git-sha>` list immutably pins exactly this run's build even though the
  # intermediate `:latest-<arch>` source tags are mutable. Runs only after BOTH arch
  # builds succeed, so `:latest` flips to the new build atomically and is never left
  # pointing at a single architecture.
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Needed only for containers/image-names.sh — the single source of truth for the
      # image set this job fuses (kept in lockstep with build.sh's ALL_NAMES).
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: |
          registry="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # The image set comes from containers/image-names.sh, the same list build.sh
          # builds from — so a newly-added image can never be built-but-never-fused.
          while read -r name; do
            repo="$registry/test-cabinet-$name"
            echo "==> assembling $repo:latest + $repo:$GIT_SHA from :latest-amd64 + :latest-arm64"
            docker buildx imagetools create \
              -t "$repo:latest" \
              -t "$repo:$GIT_SHA" \
              "$repo:latest-amd64" "$repo:latest-arm64"
            docker buildx imagetools inspect "$repo:$GIT_SHA"
          done < <(./containers/image-names.sh)
