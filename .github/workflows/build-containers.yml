name: Build containers

# Builds the run-container images and pushes them to GHCR, pinned by digest:
#   - the base image, used by every end-to-end run;
#   - the sprite image (the base plus the baked-in `draw` binary), used by every
#     single-sprite asset-generation run;
#   - the sprite-sheet image (the base plus the baked-in `draw-sheet` binary),
#     used by every sprite-sheet asset-generation run;
#   - the voxel image (the base plus the baked-in `voxel` binary), used by every
#     static voxel-model asset-generation run;
#   - the voxel-animation image (the base plus the baked-in `voxel-anim` binary),
#     used by every animated voxel-animation asset-generation run; and
#   - the adversarial image (the base plus the wasm toolchain and the Foray tooling
#     compiled from crates/ — the `foray` CLI, the controller buildkit, and the
#     reference modules + map), used by every adversarial run.
# (plus the performance image — the base plus the wasm toolchain and the Lattice
# tooling). All are built by containers/build.sh in one invocation (the sprite,
# sprite-sheet, adversarial, and performance images are built FROM the base built
# alongside them). Runners resolve the image for a run's test type, asset kind, and
# asset dimension directly from their own registry configuration (default
# ghcr.io/theclockwyrks on the latest tag); the backend plays no part — see
# docs/components/core/execution.md.
#
# Each image is published MULTI-ARCH (linux/amd64 + linux/arm64): the `build` job
# below runs build.sh once per architecture on a native runner (pushing an
# arch-suffixed tag) and the `manifest` job fuses those into both the `:latest` and
# an immutable `:<git-sha>` manifest list (mirroring build-service-images.yml), so a
# deployment can pin the run images by sha via TCAB_CONTAINER_TAG and promote them
# on the same staging→prod flow as the services. arm64 is not optional — the
# deployments run on arm64 nodes, and an amd64-only image makes every run pod die at
# startup with `exec format error` (the seeding `tar` exec into the dead container
# then fails). Build natively per arch rather than cross-building under QEMU: the
# Rust/wasm compiles in the non-base images are far too slow emulated.
#
# None is a per-harness image: a run installs the selected harness's CLI into the
# image at run time (see harnesses/README.md), so the images never need rebuilding
# when a harness publishes a new version. The `-gg` variants are the one exception, and
# they are also the reason this job now builds a `gg` binary before it builds an image:
# those variants bake in eleven language compilers, and the `build` job GATES them on
# `gg selfcheck` — every arm's real bootstrap turn, driven inside the freshly-built image
# as the unprivileged run user, between that image's build and its push. See the step
# comments below, and containers/build.sh's header for what went wrong without it.
#
# This is the one CI job that lives on GitHub Actions rather than the primary
# Azure DevOps pipeline, by deliberate exception: the image is meant for anyone
# who clones the repo to pull, so building it in public makes the supply chain
# visible, and GH Actions authenticates to GHCR for free via the built-in
# GITHUB_TOKEN (no PAT to manage). Dormant until the repository is mirrored to
# GitHub, like the other workflows here.
#
# One-time setup: after the first successful push, set EACH published package's
# visibility to Public in the org's GHCR package settings so unauthenticated runners
# can pull them — one `test-cabinet-<name>` package per name in containers/image-names.sh
# (base, every asset-generation kind including blender, adversarial, and performance),
# PLUS `test-cabinet-gg-toolchains`, which build.sh pushes but that list deliberately does
# not name (see the manifest job at the bottom for why).
# A newly-added image needs this the first time it is published — and it is two packages
# per image, not one, because every run image has a `-gg` variant with a package of its
# own. `test-cabinet-full-stack-3d` and `test-cabinet-full-stack-3d-gg` are the most
# recent pair; both default to Private on their first push, and a run scheduled onto a
# Private package fails at pull time with a 403 that says nothing about visibility.
on:
  # DELIBERATELY UNFILTERED, for the same reason as build-service-images.yml: every
  # push to master/staging must leave a COMPLETE `:<git-sha>` run-image set behind,
  # because the deployments pin the run images by the sha of a commit
  # (TCAB_CONTAINER_TAG in the azure-staging/azure-prod overlays), not by "the last
  # sha that happened to build". With a path filter, most release shas had no run
  # images at all, which is why the two pins drifted apart for entire release trains
  # — the overlays sat on a months-old TCAB_CONTAINER_TAG while the service images
  # moved ahead, and every roll had to first go hunting for a sha at which this
  # workflow actually published.
  #
  # The filter was also a standing correctness trap on its own: it hand-enumerated
  # the crates baked into the images, so it silently went stale every time an image
  # gained a source. It had already drifted — it listed every `foray-*` crate for the
  # adversarial image but NONE of the `lattice-*` crates the performance image bakes,
  # so a change to the Lattice engine shipped a stale performance image with no
  # signal. A filter that has to be maintained in lockstep with every Dockerfile is
  # a filter that will be wrong again. Do not reintroduce `paths:`.
  #
  # The inputs also reach well outside `containers/`, which is the other half of the
  # same argument: `.dockerignore` is an allowlist, so the fix for a `COPY` that
  # cannot see its source is an edit to that file alone; the `-gg` variants bake what
  # `scripts/ci/install-*.sh` installs; and each arm's pin lives with the arm
  # (`packages/gg-sandbox-*/*-version.sh`, plus the PureScript package set in
  # `spago.yaml` and the wit-bindgen release in the Rust arm's `Cargo.lock`). Every
  # one of those changed what an image contains while naming no path a filter listed.
  #
  # The cost is real here (these images compile Rust and wasm, uncached), but
  # master/staging only move at rc/release cadence, and a stale or missing run image
  # is paid for by every run that lands on it.
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One container build at a time; let an in-progress run finish so a later push
# doesn't race it to the latest tag.
concurrency:
  group: build-containers
  cancel-in-progress: false

jobs:
  # Build every image once per target architecture, each on a NATIVE runner, and
  # push an arch-suffixed tag (e.g. test-cabinet-base:latest-arm64). Building
  # natively rather than cross-building under QEMU matters here: the sprite,
  # sprite-sheet, adversarial, and performance images compile Rust (and the
  # adversarial/performance images a wasm toolchain) inside the build, which is
  # punishingly slow under emulation — a native arm64 runner builds them at the
  # same speed as amd64. The `manifest` job below then fuses the two arch-tags into
  # the multi-arch `:latest` tag the runner actually resolves. Both architectures
  # are required because the deployments run on arm64 nodes (Azure prod) while
  # contributors and the amd64 cloud pull the amd64 variant.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      # Node serves two things here. `build.sh` runs `scripts/presign-sample-pack.mjs`
      # (node-only) to mint the R2 download URL for the sfx-sample/music audio packs; and
      # building `gg` below reflects the TypeScript and JavaScript arms' signature
      # catalogues with the workspace's PINNED `typescript`, which is a devDependency, so
      # `npm ci` is a build prerequisite for two of the eleven arms. The version matches
      # ci.yml's and release.yml's rather than the 20.x this step used to pin for the
      # presign script alone — one Node for the job, and the one the rest of CI builds gg
      # with.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      # Authenticate to GHCR with the built-in token (packages: write above). It comes
      # BEFORE the toolchain hydration below rather than after, because that step pulls a
      # published package from this same registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # A `gg` binary for the self-check gate
      # ------------------------------------------------------------------
      # WHY THIS JOB NOW BUILDS A COMPILER-HARNESS BINARY BEFORE IT BUILDS IMAGES.
      #
      # The `-gg` variants carry eleven language toolchains, and building one asks nothing
      # about whether those toolchains RUN in the image they were copied into. They did
      # not: `csc` aborted at CLR start-up in every Debian-lineage variant for want of an
      # ICU the toolchain did not carry, twenty-five images shipped with a dead C# arm, and
      # every gate the arm had was green because every one of them ran somewhere else — in
      # the devcontainer, or in the builder stage that installs the dependency it then
      # exports without. The gate that answers the actual question is `gg selfcheck` run
      # INSIDE a built variant, so this job has to have a `gg` to run.
      #
      # The four steps below are the same sequence `ci.yml`'s `rust` job and `release.yml`'s
      # `gg` job already use, in the same order and for the same reasons; read either of
      # those for the longer argument. In brief: `crates/gg/build.rs` reflects each arm's
      # signature catalogue out of that arm's own SDK on every build and compiles every
      # arm's artifacts, so a machine that builds gg is a machine with all eleven
      # toolchains (~1.9 GB) plus the C# arm's build-only ones (~1.4 GB more). Hydrating
      # from the published CI image replaces five upstream CDNs with one registry pull;
      # the pinned installer still runs afterwards and still owns every pin.
      - name: Install the musl toolchain and Ruby
        run: sudo apt-get update && sudo apt-get install -y musl-tools ruby
      # `:build-latest`, NOT `:latest`. The two tags differ by ~1.4 GB, and the bigger one
      # is what a job that COMPILES test-cabinet-gg needs — the C# arm's guest is relinked
      # from a whole .NET SDK against an unpruned wasi-sdk at build time. Pulling `:latest`
      # would still work and be strictly worse: the arm's own build.sh would fetch both
      # itself on every run. `containers/gg-ci/Dockerfile` carries the two-tag argument.
      # The step is best-effort by design (no image on a first run or a fork, a version
      # behind between a pin bump and the rebuild); it degrades to the full install.
      - name: Hydrate gg's program-language toolchains
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          ./scripts/ci/hydrate-gg-toolchains.sh "ghcr.io/${owner}/$(./containers/gg-ci/image-name.sh):build-latest"
      - name: Install gg's program-language toolchains
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/install-gg-toolchains.sh
          # And the C# arm's BUILD toolchains, deliberately excluded from the eleven-arm
          # list (~1.4 GB no gg RUN needs) — see that installer's header.
          ./scripts/ci/install-gg-build-toolchains.sh
          npm ci
          # The build below is a separate process, so the installers' bin directory is
          # prepended for the job rather than exported here: `purs` and `uv` come off PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # STATIC MUSL IS NOT A PORTABILITY NICETY HERE, IT IS THE ONLY BUILD THAT WOULD RUN.
      # The runners are ubuntu-24.04 (glibc 2.39) and the images this binary is about to be
      # executed inside are Debian bookworm (2.36) and Ubuntu 26.04 — a dynamically linked
      # build would fail to load in the very image it is meant to gate. It is also exactly
      # the artifact a deployment installs: `core`'s gg_exec copies this same static binary
      # into a run container. The script derives its target from the runner's architecture,
      # which is why this matrix builds natively per arch.
      - name: Build gg (static musl)
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-gg-static.sh "$RUNNER_TEMP/gg"
          # And then give the disk back. This job builds twenty-seven `-gg` variants after
          # this step, on a runner whose image store and whose `target/` share one
          # filesystem; a release build of gg leaves several gigabytes of intermediate
          # artifacts behind and the binary itself has already been copied out to
          # $RUNNER_TEMP. Nothing downstream reads `target/` — the images compile inside
          # their own build contexts, and the repo-root `.dockerignore` excludes it — so
          # this is free, and an out-of-space failure forty minutes into an image build is
          # not. The `df` is for the log: it is the number to read first if this job ever
          # dies during a build with something unhelpful about no space left.
          rm -rf target
          df -h /

      # build.sh (given no image NAMES — the one flag it takes is below) builds EVERY run
      # image — base, every asset-generation kind
      # including blender, adversarial, performance, and the `-gg` variants that carry
      # gg's language toolchains — natively for this runner's
      # architecture, pushes them to IMAGE_REGISTRY under the arch-suffixed tag, and
      # prints their pinned digests. Both build.sh and the `manifest` job below take
      # their image set from containers/image-names.sh, so each built image is
      # guaranteed to get fused into its multi-arch `:latest`/`:<sha>`.
      # The registry namespace is the repository owner, lowercased (GHCR requires
      # lowercase), which is the resolver's default for the canonical repo. Only the
      # arch tag is written here; the bare `:latest` manifest list is created by the
      # manifest job, so a half-finished matrix never leaves `:latest` single-arch.
      #
      # The CLOUDFLARE_AUDIO_R2_* values let build.sh presign a READ-only download of
      # the sfx-sample and music images' audio packs (see build_audio_image). They are
      # read-scoped — CI never writes the bucket; publishing is a local step. They are
      # REQUIRED: a pack that is not pinned (or that cannot be presigned) fails the
      # build rather than shipping an image with an empty palette, so these must be set.
      #
      # `--gg-selfcheck` is what makes this job a gate on the `-gg` variants rather than
      # only a publisher of them: build.sh drives every language arm's real bootstrap turn
      # inside each environment representative it builds — as the unprivileged run user,
      # from this static binary — BETWEEN that image's build and its push, so a variant
      # carrying a dead arm cannot reach the registry. Five images cover all twenty-seven
      # variants: `/opt/gg` is byte-identical across them, so what differs is the
      # environment it runs in — the image the lineage is rooted at plus every package the
      # run images install on the way down, which is five groups and not the two parents it
      # looks like. build.sh's GG_SELFCHECK_IMAGES carries the argument and its
      # `assert_gg_environments` re-derives the grouping from the Dockerfiles on every
      # gated build.
      #
      # The output is teed because the step AFTER this one asserts the gate actually ran.
      # `set -euo pipefail` is written out rather than assumed: an unqualified `run:` on
      # Linux is `bash -e`, with no `pipefail`, so build.sh's exit status would be thrown
      # away by the pipe into `tee` and a failed gate would land as a green step.
      - name: Build and push images
        env:
          PUSH: "1"
          DOCKER: docker
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: latest-${{ matrix.arch }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUDIO_R2_BUCKET: ${{ vars.CLOUDFLARE_AUDIO_R2_BUCKET }}
          CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_AUDIO_R2_PRESIGN_ACCESS_KEY_ID }}
          CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_AUDIO_R2_PRESIGN_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          registry="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "Pushing $IMAGE_TAG images to $registry"
          IMAGE_REGISTRY="$registry" ./containers/build.sh --gg-selfcheck "$RUNNER_TEMP/gg" \
            2>&1 | tee "$RUNNER_TEMP/build-containers.log"

      # THE GATE HAS TO HAVE RUN, NOT MERELY HAVE BEEN ASKED FOR.
      #
      # Everything above is one command line, and the way this whole mechanism stops being
      # worth anything is a refactor that drops the flag from it: the build would still pass
      # and would publish exactly the images the check exists to hold back, with nothing in
      # the log to say so. So the per-image `gg selfcheck ok:` lines build.sh prints are
      # required here by name. A skipped gate is now a red step, which is the difference
      # between a gate and a habit.
      #
      # The names are written out rather than read from build.sh, deliberately: this is an
      # independent statement of what must have been checked, and a list derived from the
      # thing under test would agree with it however wrong it became.
      - name: Assert the gg self-check ran in every environment
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-containers.log"
          for image in sprite-gg base-wasm-gg voxel-gg full-stack-3d-gg blender-gg; do
            if ! grep -Fq "gg selfcheck ok: $image" "$log"; then
              echo "::error::containers/build.sh published without running gg selfcheck in $image." >&2
              echo "The images built here carry gg's eleven language toolchains, and building one" >&2
              echo "asks nothing about whether they RUN in it — which is how twenty-five images" >&2
              echo "once shipped with a dead C# arm. Restore the --gg-selfcheck flag on the build" >&2
              echo "step above; see containers/build.sh's header." >&2
              exit 1
            fi
            echo "gg selfcheck ran in $image"
          done

  # Fuse the per-arch tags into the multi-arch manifest lists every runner resolves:
  # `:latest` (DEFAULT_CONTAINER_TAG) AND an immutable `:<git-sha>` a deployment can
  # pin (TCAB_CONTAINER_TAG), mirroring build-service-images.yml so the run images
  # promote on the same staging→prod sha flow as the services. `imagetools create`
  # assembles each list purely from registry references — no builder, no pulls — so
  # it is fast and runs on any architecture; it records the per-arch *digests*, so
  # the `:<git-sha>` list immutably pins exactly this run's build even though the
  # intermediate `:latest-<arch>` source tags are mutable. Runs only after BOTH arch
  # builds succeed, so `:latest` flips to the new build atomically and is never left
  # pointing at a single architecture.
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Needed only for containers/image-names.sh — the single source of truth for the
      # image set this job fuses (kept in lockstep with build.sh's ALL_NAMES).
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: |
          registry="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # The image set comes from containers/image-names.sh, the same list build.sh
          # builds from — so a newly-added image can never be built-but-never-fused.
          while read -r name; do
            repo="$registry/test-cabinet-$name"
            echo "==> assembling $repo:latest + $repo:$GIT_SHA from :latest-amd64 + :latest-arm64"
            docker buildx imagetools create \
              -t "$repo:latest" \
              -t "$repo:$GIT_SHA" \
              "$repo:latest-amd64" "$repo:latest-arm64"
            docker buildx imagetools inspect "$repo:$GIT_SHA"
          done < <(./containers/image-names.sh)

          # And the one image build.sh pushes that image-names.sh does not list: the gg
          # LANGUAGE-TOOLCHAIN builder. It is not a run image — nothing resolves it, nothing
          # executes in it, it is only ever a `COPY --from` source for the `-gg` variants — and
          # image-names.sh is the set of images a run resolves. The Rust suite would tolerate an
          # entry (`every_resolvable_image_is_one_the_build_publishes` keeps a NOT_A_RUN_IMAGE
          # list, which already holds `base`); build.sh would not, because `build_one` dispatches
          # on that list by name. So the loop above stays special-case-free and this one image is
          # fused by name. See containers/gg-toolchains/Dockerfile's header.
          #
          # It is fused rather than left as two arch tags for the same reason everything above is:
          # a `:latest` that is single-arch is a pull that either 404s or silently hands somebody
          # the wrong architecture's compilers. Why it is published at all is argued where
          # GG_TOOLCHAINS_IMAGE is defined in containers/build.sh.
          repo="$registry/test-cabinet-gg-toolchains"
          echo "==> assembling $repo:latest + $repo:$GIT_SHA from :latest-amd64 + :latest-arm64"
          docker buildx imagetools create \
            -t "$repo:latest" \
            -t "$repo:$GIT_SHA" \
            "$repo:latest-amd64" "$repo:latest-arm64"
          docker buildx imagetools inspect "$repo:$GIT_SHA"
