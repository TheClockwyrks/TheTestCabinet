name: Build service images

# Builds the long-running *service* images and pushes them to GHCR:
#   - tcab-backend       — the backend (tcab-backend) plus a headless Chromium and
#                          the fonts it renders reference screenshots with, and gg's
#                          reference documents (projected by the gg-build stage's own
#                          binary) which it serves at /gg/reference;
#   - tcab-auth-service  — the auth service (tcab-auth-service), a slim runtime
#                          with no browser and no fonts;
#   - tcab-dispatcher    — the dispatcher (tcab-dispatcher), a slim controller that
#                          claims queued jobs and creates one driver Job per run via
#                          the Kubernetes API; no container engine of its own;
#   - tcab-driver        — the per-run driver (tcab-driver); under
#                          TCAB_DRIVER_RUNTIME=kubernetes it spawns one sandbox pod
#                          per run via the API and needs no container engine; and
#   - tcab-artifacts     — the artifact service (tcab-artifacts), a slim runtime
#                          that serves produced run trees off a persistent volume;
#                          and
#   - tcab-arena         — the arena service (tcab-arena), a slim STATELESS runtime
#                          that runs adversarial matches/tournaments (CPU-bound wasm)
#                          and talks HTTP to the backend only (no volume, no browser);
#                          and
#   - tcab-publisher     — the per-publish publisher (tcab-publisher); the dispatcher
#                          creates one publisher Job per publish, which releases a
#                          reviewed run to a public GitHub repo + Cloudflare Pages and
#                          so carries git + gh + a pinned wrangler (no browser); and
#   - tcab-web           — the web console (apps/web) served as STATIC assets by
#                          nginx; the one NON-Rust image here (a `vite build` behind
#                          nginx, no crate compiled), fronted in-cluster by the
#                          internal-only ingress. Its backend/auth URLs are injected
#                          at container start (envsubst /config.js), not baked, so the
#                          one shared image works for every environment.
# The seven Rust images are all `--target` stages of the single shared
# deployments/images/services.Dockerfile (one cargo build stage for every service —
# see that file's header for why); tcab-web has its own Dockerfile and npm-builds
# the console from the workspace. All are built with the repository root as the
# build context and tagged both `:latest` and `:<git-sha>` so a deployment can pin an
# immutable digest/tag. The Kubernetes manifests under deployments/k8s/ pull these
# from the registry the cluster is pointed at (see deployment/kubernetes/overview.md).
#
# Note the deliberate trade-off in the matrix below: because the Rust legs share one
# build stage, each leg compiles ALL seven service binaries rather than just its own.
# The legs run concurrently on separate runners, so wall-clock is roughly unchanged,
# and each keeps its own GitHub Actions cache scope (below) so a repeat run reuses
# its whole build. The win this buys is local: `make images` builds the six services
# sequentially against one BuildKit cache, where the shared stage is computed once.
#
# These are NOT the run-container images a run executes inside — those (base,
# sprite, sprite-sheet, adversarial, performance) are built by the separate
# build-containers.yml workflow and documented in containers/README.md.
#
# Like build-containers.yml this lives on GitHub Actions rather than the primary
# Azure DevOps pipeline by deliberate exception: the images are meant for anyone
# running their own deployment to pull, so building them in public makes the
# supply chain visible, and GH Actions authenticates to GHCR for free via the
# built-in GITHUB_TOKEN (no PAT to manage). Dormant until the repository is
# mirrored to GitHub, like the other workflows here.
#
# One-time setup: after the first successful push, set each published package's
# visibility (tcab-backend, tcab-auth-service, tcab-dispatcher, tcab-driver,
# tcab-artifacts, tcab-arena, tcab-publisher, tcab-web) to Public in the org's GHCR
# package settings if the cluster should
# pull them unauthenticated; otherwise reference them through an imagePullSecret
# (see deployments/k8s/base/secrets.example.yaml).
on:
  # DELIBERATELY UNFILTERED: every push to master/staging rebuilds, whether or not
  # it touched a source path. The `:<git-sha>` tag is not a convenience — it is the
  # contract every consumer pins by, and each of them pins by the sha of a COMMIT,
  # not by "the last sha that happened to build": the azure-staging/azure-prod
  # overlays pin `images:` + TCAB_DRIVER_IMAGE to a release sha, so a roll needs
  # that sha to exist.
  # A path filter makes that contract conditional on the release merge's contents:
  # a merge touching only test-cases/, game-jams/, or apps/docs/ (an entirely normal
  # release) published NOTHING, and the only thing standing between that and a broken
  # release was remembering to dispatch this workflow by hand. Rebuilding an
  # unchanged tree is cheap here — the per-image, per-arch GHA cache below makes it a
  # near-no-op — and master/staging only move at rc/release cadence, so the wasted
  # work is small and the guarantee is absolute. Do not reintroduce `paths:`.
  #
  # A filter would also have to reach much further than the obvious sources to be
  # right, which is the second argument against one. The driver image bakes `gg` and
  # the backend image bakes the reference documents that same gg projects
  # (`gg reference --out`, served at /gg/reference), and building gg reflects a
  # signature catalogue out of each of its eleven program languages' SDKs — so a
  # doc-comment fix in (say) `packages/gg-sandbox-swift/`, or a pin bump in one of the
  # `scripts/ci/install-*.sh` installers, changes what this workflow ships while
  # touching nothing under `crates/`.
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One service-image build at a time; let an in-progress run finish so a later push
# doesn't race it to the latest tag.
concurrency:
  group: build-service-images
  cancel-in-progress: false

# The images are published multi-arch (linux/amd64 + linux/arm64) so they run on
# both x86-64 servers and Apple-Silicon / arm64 hosts, such as a local k3d cluster
# on an arm64 Mac, which otherwise can't pull them ("no match for platform in
# manifest"). Each arch is built on its own NATIVE
# runner (no QEMU emulation, so the Rust release builds stay fast), pushed BY DIGEST,
# then the two digests are stitched into one manifest-list tag in the `merge` job.
jobs:
  build:
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      # Build them all even if one fails, so a single broken image (or arch) doesn't
      # hide the status of the others.
      fail-fast: false
      matrix:
        # Every Rust service is a `--target` in the shared services.Dockerfile (see
        # that file's header); only the web console has a Dockerfile of its own, and
        # it takes no target. BuildKit builds just the stages a target depends on, so
        # asking for `arena` never runs the gg or npm stages. TWO targets depend on the
        # gg stage now, not one: the driver bakes the gg binary, and the backend bakes
        # the reference documents that binary projects (see the COPY in its stage) —
        # so those two legs are the long ones and the other six are unaffected.
        image:
          - name: backend
            image: tcab-backend
            dockerfile: deployments/images/services.Dockerfile
            target: backend
          - name: auth
            image: tcab-auth-service
            dockerfile: deployments/images/services.Dockerfile
            target: auth
          - name: dispatcher
            image: tcab-dispatcher
            dockerfile: deployments/images/services.Dockerfile
            target: dispatcher
          - name: driver
            image: tcab-driver
            dockerfile: deployments/images/services.Dockerfile
            target: driver
          - name: artifacts
            image: tcab-artifacts
            dockerfile: deployments/images/services.Dockerfile
            target: artifacts
          - name: arena
            image: tcab-arena
            dockerfile: deployments/images/services.Dockerfile
            target: arena
          - name: publisher
            image: tcab-publisher
            dockerfile: deployments/images/services.Dockerfile
            target: publisher
          - name: web
            image: tcab-web
            dockerfile: deployments/images/web.Dockerfile
            target: ""
        # Each arch builds on a runner of that architecture, natively. (GitHub-hosted
        # arm64 runners are free on public repositories.)
        arch:
          - name: amd64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      # Authenticate to GHCR with the built-in token (packages: write above).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry namespace is the repository owner, lowercased (GHCR requires
      # lowercase), which is the namespace the deployment manifests pull from.
      - name: Compute registry namespace
        id: registry
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${{ matrix.image.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build from the repository root (the Dockerfiles compile their crate from
      # source, so the context must include crates/); the repo-root .dockerignore
      # keeps it lean. Push BY DIGEST (no tag) for this single arch — the `merge` job
      # assembles the per-arch digests into the `:latest`/`:<git-sha>` tags. GitHub
      # Actions cache makes the otherwise-cold release Rust build incremental across
      # runs (scoped per image AND arch so the legs don't clobber each other).
      - name: Build and push ${{ matrix.image.image }} (${{ matrix.arch.name }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch.name }}
          # Stamp the provenance commit into the binary. The build context omits
          # `.git` (the repo-root .dockerignore is an allowlist that never
          # re-includes it), so crates/core/build.rs can't resolve it from git; pass
          # the commit in so run records attribute to this build rather than
          # recording an "unknown" commit. Harmless for the non-Rust web image, which
          # declares no such ARG.
          build-args: |
            TCAB_BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.registry.outputs.ref }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=service-${{ matrix.image.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.image.name }}-${{ matrix.arch.name }}

      # Hand the freshly pushed per-arch digest to the merge job as an artifact named
      # by image+arch (the file itself is the bare digest hex).
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch each image's per-arch digests into a single multi-arch manifest list and
  # push it as the `:latest` and `:<git-sha>` tags. One leg per image; each pulls only
  # its own digests.
  merge:
    runs-on: ubuntu-24.04
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            image: tcab-backend
          - name: auth
            image: tcab-auth-service
          - name: dispatcher
            image: tcab-dispatcher
          - name: driver
            image: tcab-driver
          - name: artifacts
            image: tcab-artifacts
          - name: arena
            image: tcab-arena
          - name: publisher
            image: tcab-publisher
          - name: web
            image: tcab-web
    steps:
      - name: Download this image's per-arch digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute registry namespace
        id: registry
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${{ matrix.image.image }}" >> "$GITHUB_OUTPUT"

      # Build a manifest list from the per-arch digests (the artifact filenames are the
      # bare hexes) and push it under both tags.
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          ref='${{ steps.registry.outputs.ref }}'
          docker buildx imagetools create \
            -t "${ref}:latest" \
            -t "${ref}:${{ github.sha }}" \
            $(printf "${ref}@sha256:%s " *)

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect '${{ steps.registry.outputs.ref }}:${{ github.sha }}'
