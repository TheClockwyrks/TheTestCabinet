name: CI

# Critical validation mirrored from the Azure DevOps pipeline (the primary CI).
# Azure runs the full suite, including linting; GitHub runs only the checks that
# would otherwise let a genuinely broken change through — the CLI build/tests and
# the website build — so a green GitHub run still means the v1.0 components
# actually build and pass. Linting and spec checks are left to Azure.
#
# Both jobs call the same scripts/ci/ scripts the Azure pipeline uses. Dormant
# until the repository is mirrored to GitHub (the same condition as the deploy
# and catalog workflows).
#
# GitHub also owns macOS validation: Azure has no macOS agents, so the
# `macos-binary` job is the only place the shipped binary is release-built and
# smoke-tested on macOS. Azure covers the Linux and Windows legs of that same
# check (see scripts/ci/binary-smoke.sh).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: CLI (build & test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The runner ships a stable Rust toolchain; rust-toolchain.toml selects it.
      - run: ./scripts/ci/rust-test.sh

  web:
    name: Website (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: ./scripts/ci/web-build.sh

  macos-binary:
    name: CLI binary (macOS release & smoke)
    # Azure has no macOS agents, so this is the sole macOS validation: it
    # release-builds tcab, runs the suite, and smoke-runs the binary so a release
    # can never ship a broken macOS build. Azure runs the same check on Linux and
    # Windows.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # The runner ships a stable Rust toolchain; rust-toolchain.toml selects it.
      - run: ./scripts/ci/binary-smoke.sh
