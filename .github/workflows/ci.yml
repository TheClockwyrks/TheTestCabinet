name: CI

# Critical validation mirrored from the Azure DevOps pipeline (the primary CI).
# Azure runs the full suite, including linting; GitHub runs only the checks that
# would otherwise let a genuinely broken change through — the headless Rust crates
# (build/tests), the front-end build, the front-end unit tests, the desktop app
# (whose runner image matches the one release.yml bundles on), the validator
# type-check (the only thing anywhere that compiles a case's validators), the
# frozen-version gate (which protects already-recorded run results, needs no
# toolchain, and takes seconds), the audio-pack gate (the only enforcement anywhere of the rule that
# every non-frozen full-stack version and every game jam declares the packs its
# runs are staged with — a version that declares none is staged with none, which
# no other check would notice), and the container build-context gate (which
# protects the image builds that live in this same CI system) — so a green GitHub
# run still means the components actually build and pass. Style linting and the
# spec prose checks are left to Azure.
#
# Both jobs call the same scripts/ci/ scripts the Azure pipeline uses. Dormant
# until the repository is mirrored to GitHub (the same condition as the deploy
# and catalog workflows).
#
# The one thing these jobs do that the Azure pipeline does not is SEED gg's eleven
# program-language toolchains from a published image before running the pinned
# installer (build-gg-ci-image.yml publishes it; hydrate-gg-toolchains.sh copies it in).
# The `rust` job compiles test-cabinet-gg and therefore needs ~1.9 GB of compilers on
# disk before the first cargo invocation, and fetching that from five upstreams every
# run is five ways for a red build to mean nothing about the change. The installer still
# runs afterwards and still owns the pins; the image only saves it the download. Azure
# stays on the download path deliberately — see the disk paragraph in its own toolchain
# step for why that is about its agents rather than about the approach.
#
# It is ONE job now, not two: the `contract` job hydrated as well for as long as the
# contract generator projected the backend's committed gg reference by running gg. That
# artifact is gone (gg writes its reference documents itself and the backend reads them at
# run time), so that job compiles no gg and installs no toolchain — see the note where its
# step used to be.
#
# macOS validation of the shipped binary is NOT here: it is costly and only
# needed at release time, so it lives in the on-demand `binary-macos.yml`
# workflow (manual or release-invoked). Azure covers the Linux and Windows legs
# of that binary check continuously.
on:
  push:
    branches: [master, staging]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust crates (build & test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Node in a Rust job, and a repo-root install, because compiling
      # test-cabinet-gg needs both. gg's build script reflects a signature catalogue
      # out of each of its eleven program languages' SDKs — nothing is committed any
      # more — and the TypeScript and JavaScript arms are reflected through the pinned
      # `typescript` that lives in the npm workspace. rust-test.sh installs the other
      # ten toolchains itself (scripts/ci/install-gg-toolchains.sh, which is
      # idempotent), but no script can install a workspace this job never checked out
      # the node_modules for, so it is done here.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      # And the toolchains the step above could not install: the ones `rust-test.sh` fetches
      # through scripts/ci/install-gg-toolchains.sh, seeded here from the published CI image
      # rather than downloaded from five upstreams. That installer still runs inside
      # rust-test.sh and still owns every pin — this step runs BEFORE it and only seeds the
      # disk, so the installer still checks every pin and repairs anything the image had at
      # an older version.
      #
      # THIS IS THE ONLY JOB THAT HYDRATES. The `contract` job used to carry an identical
      # step; it no longer compiles gg at all, and the note where its step was says why.
      #
      # `:build-latest`, NOT `:latest`, AND THE DIFFERENCE IS ~1.4 GB OF PULL. The two tags were
      # split when only a job that re-cut the C# guest by hand needed the bigger one. Building gg
      # re-cuts it now — every arm's ARTIFACTS are generated by the build, not just its catalogue —
      # so every job that compiles test-cabinet-gg needs the build-capable prefix, and this one
      # does. Pulling `:latest` would still work and would be strictly worse: the arm's build.sh
      # falls back to fetching a whole .NET SDK and an unpruned wasi-sdk itself, on every run,
      # which is the same bytes over a slower path. `containers/gg-ci/Dockerfile` carries the
      # two-tag argument; this is the consumer half of it.
      #
      # It is allowed to fail and says so in its own log. On the first run there is no image
      # (`build-gg-ci-image.yml` publishes it, and only from master/staging), on a fork the
      # owner's namespace has never had one, and between a pin bump and the rebuild that follows
      # it the published image is a version behind for one arm. Every one of those degrades to
      # exactly the behaviour this job had before the image existed — the full install from
      # upstream — which is slower and just as correct. See the script's header.
      #
      # The image reference is derived from the repository owner rather than hard-coded, the same
      # way build-containers.yml and build-service-images.yml derive theirs (GHCR requires the
      # namespace to be lowercase, hence the `tr`).
      - name: Hydrate gg's program-language toolchains
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # The package name comes from containers/gg-ci/image-name.sh, which the publishing
          # workflow pushes under; only the registry namespace is composed here.
          ./scripts/ci/hydrate-gg-toolchains.sh "ghcr.io/${owner}/$(./containers/gg-ci/image-name.sh):build-latest"
      # The runner ships a stable Rust toolchain; rust-toolchain.toml selects it.
      - run: ./scripts/ci/install-nextest.sh
      - run: ./scripts/ci/rust-test.sh

  web:
    name: Front ends (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: ./scripts/ci/web-build.sh

  web-test:
    name: Front ends (unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: ./scripts/ci/web-test.sh

  # The Tauri desktop app, both halves (apps/desktop + crates/desktop). Azure runs
  # the same script on Linux and Windows; this leg is here anyway, and pinned to
  # ubuntu-22.04, because that is the EXACT image release.yml's desktop job builds
  # on. A release once failed on all three of its platforms in the desktop UI's
  # `tsc -b`; running the same build on the same runner image on every change is
  # what makes that unrepeatable.
  desktop:
    name: Desktop app (build & test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # Tauri v2's Linux backend compiles against the system WebKitGTK/GTK/tray
      # libraries; the devcontainer curates exactly that package set.
      - run: ./.devcontainer/languages/rust/tauri.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      # The runner ships a stable Rust toolchain; rust-toolchain.toml selects it.
      - run: ./scripts/ci/install-nextest.sh
      - run: ./scripts/ci/desktop-build.sh

  # The only thing anywhere that compiles a case's validators. They are staged
  # into a produced tree and run by vitest, which transpiles without checking
  # types, so a validator that does not compile is invisible until it fails every
  # review point it decides, on every run of its case — which is exactly the
  # class of genuinely broken change this workflow exists to stop.
  validators:
    name: Validators (type-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: ./scripts/ci/validators-typecheck.sh

  frozen:
    name: Frozen test-case versions (unchanged)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/ci/frozen-check.sh

  # The only gate on the rule that every non-frozen full-stack version and every
  # game jam declares `[audio] packs`. It also resolves every declared ref against
  # containers/sample-packs/ — a check manifest resolution cannot make, because it
  # also runs at backend ingest, where that directory is absent. Mirrors the frozen
  # job: it reads the checked-out tree, needs no credentials and no Rust.
  audio-packs:
    name: Audio packs (declared, resolvable, published)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: ./scripts/ci/audio-packs-lint.sh

  # Mirrored here rather than left to Azure because the thing it protects lives on
  # GitHub: `build-containers.yml` builds the run images, only on master/staging,
  # and a `COPY` whose source the .dockerignore allowlist excludes fails that build
  # with no other gate in the repository able to see it.
  build-context:
    name: Container build contexts (every COPY can see its source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/ci/build-context.sh

  contract:
    name: Contract (regenerate & check for drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The runner ships a stable Rust toolchain; rust-toolchain.toml selects it.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      # NO gg TOOLCHAIN HYDRATION HERE, and that is a deliberate absence rather than an
      # oversight — the `rust` job above still needs them and hydrates from the published
      # image (its step carries the whole argument: the `:build-latest` tag, and why the pull
      # is allowed to fail), so the asymmetry is worth stating.
      #
      # This job used to need them too, because `npm run gen:contract`'s first step ran
      # `cargo run -p test-cabinet-gg -- reference` to project the backend's committed
      # gg_reference.json, and building gg reflects all eleven signature catalogues out of their
      # guest SDKs and compiles every arm's artifacts. That artifact is gone: gg writes its
      # reference documents itself (`gg reference --out`), the backend image bakes them, and
      # tcab-backend reads them at run time. What `contract-drift.sh` compiles now is
      # test-cabinet-core plus test-cabinet-backend, and the backend links neither gg nor
      # anything gg pulls.
      #
      # If this step ever needs to come back, the thing to check first is whether something
      # taught the contract generator to build gg again.
      - run: ./scripts/ci/contract-drift.sh
      # Runs after the drift check, so it greps a package the generator has just
      # re-emitted rather than whatever was committed.
      - run: ./scripts/ci/seeded-contract-check.sh
