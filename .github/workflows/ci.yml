name: CI

# Critical validation mirrored from the Azure DevOps pipeline (the primary CI).
# Azure runs the full suite, including linting; GitHub runs only the checks that
# would otherwise let a genuinely broken change through — the headless Rust crates
# (build/tests), the front-end build, the frozen-version gate (which protects
# already-recorded run results, needs no toolchain, and takes seconds), and the
# container build-context gate (which protects the image builds that live in this
# same CI system) — so a green GitHub run still means the components actually build
# and pass. Linting and spec checks are left to Azure.
#
# Both jobs call the same scripts/ci/ scripts the Azure pipeline uses. Dormant
# until the repository is mirrored to GitHub (the same condition as the deploy
# and catalog workflows).
#
# macOS validation of the shipped binary is NOT here: it is costly and only
# needed at release time, so it lives in the on-demand `binary-macos.yml`
# workflow (manual or release-invoked). Azure covers the Linux and Windows legs
# of that binary check continuously.
on:
  push:
    branches: [master, staging]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust crates (build & test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Node in a Rust job, and a repo-root install, because compiling
      # test-cabinet-gg needs both. gg's build script reflects a signature catalogue
      # out of each of its eleven program languages' SDKs — nothing is committed any
      # more — and the TypeScript and JavaScript arms are reflected through the pinned
      # `typescript` that lives in the npm workspace. rust-test.sh installs the other
      # ten toolchains itself (scripts/ci/install-gg-toolchains.sh, which is
      # idempotent), but no script can install a workspace this job never checked out
      # the node_modules for, so it is done here.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      # The runner ships a stable Rust toolchain; rust-toolchain.toml selects it.
      - run: ./scripts/ci/install-nextest.sh
      - run: ./scripts/ci/rust-test.sh

  web:
    name: Front ends (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: ./scripts/ci/web-build.sh

  frozen:
    name: Frozen test-case versions (unchanged)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/ci/frozen-check.sh

  # Mirrored here rather than left to Azure because the thing it protects lives on
  # GitHub: `build-containers.yml` builds the run images, only on master/staging,
  # and a `COPY` whose source the .dockerignore allowlist excludes fails that build
  # with no other gate in the repository able to see it.
  build-context:
    name: Container build contexts (every COPY can see its source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/ci/build-context.sh

  contract:
    name: Contract (regenerate & check for drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The runner ships a stable Rust toolchain; rust-toolchain.toml selects it.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: ./scripts/ci/contract-drift.sh
