slug = "ironward"
name = "Ironward Siege Tank"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "vehicle"]
summary = """
Sculpt and rig the Ironward Siege Tank: a 40x30x80 opaque-voxel tank whose turret \
swivels to aim its forward gun, built by painting discrete cells one recorded \
operation at a time. The model invents whatever parts and joints it needs; the \
fixed contract is a single animation it must author — a game-triggered \
`turret_sweep` that swings the turret through its full traverse — the reviewer can \
play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 40
height = 30
depth = 80
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (a game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model authors
# each animation's F-curves at run time with `voxel-anim
# define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations
# so the contract exists from the first operation.
[model]

# `turret_sweep` — the TURRET traverse. A game-triggered playable (not self-playing)
# that swings the turret smoothly through its full traverse — center → left → center
# → right → center — and loops, so a reviewer can watch the gun aim across its arc
# without dragging a slider. The gun swings with the turret; the hull stays put.
[[model.animation]]
name = "turret_sweep"
loop = true
auto_play = false

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Ironward siege tank \
and poses correctly — a low, tracked hull carrying a turret that swivels on its \
mount without detaching while the hull stays put, a long gun that stays attached to \
the turret and swings with it, and the disciplined Ironward palette."""

[[review_item]]
id = "reads-as-tank"
title = "Reads as a siege tank"
text = """
From more than one angle the model reads unmistakably as a heavy tank: a low, \
boxy hull riding on a pair of tracks down its sides, a turret sitting on top, \
and a long gun barrel projecting forward from the turret. It is a tracked \
fighting vehicle, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "turret-swivels"
title = "Turret swivels cleanly on its mount"
text = """
Playing `turret_sweep` swings the turret smoothly left and right about a vertical \
mount at the top-center of the hull, aiming the gun across its arc and easing at the \
extremes rather than sliding at a constant rate. Across the full traverse no part of \
the turret tears away from its mount or clips down into the hull — the turret and its \
gun rotate together as one solid piece about a single vertical axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "hull-fixed"
title = "Hull stays put; only the turret moves"
text = """
The tracked hull is the fixed base of the machine: it stays put, never carried along \
by the turret. When `turret_sweep` plays, the turret (and the gun with it) swings \
while the hull and its tracks hold still. Nothing but the moving turret assembly \
moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "gun-attached"
title = "Gun stays attached to the turret"
text = """
The long gun projects forward from the turret and swings with it as `turret_sweep` \
plays — riding the turret's rotation as though bolted to it, always meeting the \
turret with no gap and never floating free or detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Ironward palette discipline"
text = """
Uses only the Ironward colors from the brief (olive hull, dark olive underside, \
dark track, gunmetal gun, and the warm accent) with no out-of-palette colors \
and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
