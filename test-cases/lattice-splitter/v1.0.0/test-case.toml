slug = "lattice-splitter"
experimental = true
name = "Lattice Splitter"
difficulty = "medium"
tags = ["sprite-sheet", "belt"]
summary = """
Draw the Lattice splitter — the two-tile belt balancer — as a 32x64 sprite sheet: \
a top-down housing spanning two tile cells with an animated belt surface of amber \
chevrons scrolling East, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# Each frame is its own 32x64 transparent canvas (a separate file). An East-flowing
# splitter occupies one tile in the flow direction by two tiles across it, so the
# frame is 32 wide x 64 tall = two stacked 32x32 tile cells.
[canvas]
width = 32
height = 64
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x64 file — and the named
# animation sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "splitter-flow"
name = "Splitter — balancing"
frames = [0, 1, 2, 3, 4, 5, 6, 7]
fps = 12

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lattice splitter — a single \
two-tile balancer spanning both cells, the amber belt surface scrolling East in a \
seamless loop and matching the belt look, the central divider and grey-blue housing \
that mark it as a balancer rather than plain belt, and the pinned belt-family \
palette."""

[[review_item]]
id = "one-two-tile-device"
title = "One two-tile splitter"
text = """
The whole 32x64 frame reads as a SINGLE splitter spanning both stacked 32x32 tile \
cells — one 2-wide device, not two separate belts or two unrelated tiles. The \
housing brackets both cells so they clearly belong to the same machine."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "belt-scrolls-east"
title = "Belt surface scrolls East"
text = """
Playing frames 0 through 7 shows the amber chevron surface scrolling steadily to \
the right (East) by a fixed step each frame and looping seamlessly — frame 7 hands \
off to frame 0 with no jump — exactly like a running transport belt."""
sequences = ["splitter-flow"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "matches-belt-look"
title = "Matches the belt family"
text = """
The moving surface reads as the same belt as a plain Lattice transport belt — rows \
of amber chevrons pointing East over the dark belt metal — so the splitter and a \
belt visibly carry the same items in the same style."""
sequences = ["splitter-flow"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "divider-and-housing"
title = "Divider and housing read as a balancer"
text = """
A static grey-blue machine housing frames the two cells and a central seam runs \
along the flow between them, distinguishing the device from a plain belt at a \
glance. The moving belt stays visible through and between the housing — the housing \
sits on top of the surface, not covering it."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Belt-family palette"
text = """
Uses only the brief's pinned palette — dark outline, belt metal base/mid/edge, \
amber chevron with its highlight and shadow, and the grey-blue housing with the \
amber hazard-stripe accent — with no out-of-palette colors and no anti-aliased \
fringe of stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
The device fills the 32x64 frame with only small margins, centered across both \
cells, and the belt surface lines up at the left and right edges so it tiles \
seamlessly with an adjoining belt rather than sitting tiny or clipped."""
weight = 1
domain = "fidelity"
