# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`;
# see `docs/test-cases.md`.

# Human-readable display name for this test case.
name = "Coil"

# Relative difficulty of this case, surfaced on the site. Coil's rules are
# simple, but a polished, playable build with a correct fixed-timestep loop,
# grid-locked turning, a decaying combo, multiple modes, and several states is a
# real front-end task — so it sits at the easy end of the scale, alongside Carom.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "grid", "score-attack"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A neon grid serpent that grows with every pellet, where eating in quick \
succession builds a decaying combo multiplier — so the real game is planning \
the most efficient route, not just staying alive."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in seconds, for the harness session before the run
# is stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. Coil is an easy case, so 30 minutes is comfortably more than a
# healthy build needs while still catching a session that never terminates.
max_runtime_seconds = 1800

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the
# build to commit a `package-lock.json`, so the validated build installs exactly
# what the deploy will. Both commands are required — there are no defaults, so
# every case states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant of this case, at the `dest` path within
# the run workspace. The specification is decomposed by concern so that
# mode-specific material can be seeded per variant (see `[[variant]]` below).
# These five files are always present, so the mode specs may reference them
# freely; the common specs, in turn, must never reference a mode spec that a
# given variant does not seed (only `modes/standard.md` is always present). All
# common specs are plain Markdown and are seeded verbatim.
[[spec]]
source = "specs/overview.md"
dest = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"
dest = "specs/playfield.md"

[[spec]]
source = "specs/mechanics.md"
dest = "specs/mechanics.md"

[[spec]]
source = "specs/flow.md"
dest = "specs/flow.md"

[[spec]]
source = "specs/modes/standard.md"
dest = "specs/modes/standard.md"

# Asset files or directories (relative to this folder) seeded alongside the
# specs. Coil draws everything in code, so it needs none.
assets = []

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each variant seeds the common specs above plus its own additive specs. The base
# variant is listed first, so it is the default. The variants differ in which
# mode spec (if any) they add on top of the always-present Classic mode, and in
# their `title` reference — the main menu lists a different set of modes per
# variant, so each variant declares its own menu mockup for the `title` view:
#   - base  — Classic mode only.
#   - wrap  — adds Wrap mode, where the board edges become wrapping tunnels.
#   - maze  — adds Maze mode, with fixed fatal interior obstacles.
#   - feast — adds Feast mode, with a periodic, time-limited bonus orb.
#
# A variant's `reference` array is additive on top of the common references
# below, exactly like `spec`. Each variant supplies the `title` view; the
# `gameplay` and `game-over` views are common to every variant. A view slug must
# not appear both here and among the common references.
[[variant]]
slug = "base"
name = "Base"
description = "Classic mode only."
reference = [{ view = "title", path = "reference/menu-base.html" }]

[[variant]]
slug = "wrap"
name = "Wrap"
description = "Classic plus Wrap mode, where the board edges wrap into tunnels."
spec = [{ source = "specs/modes/wrap.md", dest = "specs/modes/wrap.md" }]
reference = [{ view = "title", path = "reference/menu-wrap.html" }]
review_item = [
  { id = "wrap-tunnels", title = "Wrapping edges", text = "In Wrap the four perimeter edges are open tunnels, not solid walls: a snake that leaves one edge reappears on the opposite edge of the same row or column, there is no wall death, and only the snake's own body can end the round." },
]

[[variant]]
slug = "maze"
name = "Maze"
description = "Classic plus Maze mode, with fixed fatal interior obstacles."
spec = [{ source = "specs/modes/maze.md", dest = "specs/modes/maze.md" }]
reference = [{ view = "title", path = "reference/menu-maze.html" }]
review_item = [
  { id = "maze-obstacles", title = "Fatal obstacles", text = "A Maze match adds fixed interior obstacle bars, drawn in the obstacle color, that are fatal on contact exactly like walls; the layout is point-symmetric about the board center, the snake's start row is left clear, and pellets never spawn on an obstacle cell." },
]

[[variant]]
slug = "feast"
name = "Feast"
description = "Classic plus Feast mode, with a periodic, time-limited bonus orb."
spec = [{ source = "specs/modes/feast.md", dest = "specs/modes/feast.md" }]
reference = [{ view = "title", path = "reference/menu-feast.html" }]
review_item = [
  { id = "feast-bonus-orb", title = "Bonus orb", text = "A Feast match periodically shows a single time-limited bonus orb alongside the ordinary pellet (first at 8 s, staying 6 s, blinking faster in its final 2 seconds before it despawns). Eating it scores 50 x M and counts as a combo eat, but does not grow the snake or replace the pellet." },
]

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup; the harness renders it to a screenshot that is seeded into the run as a
# visual target for the model. The reference source is rendered, then never
# seeded directly. References are not validated unless a `[[check]]` below names
# them. The `title` view is variant-specific (declared per variant above) because
# the main menu differs by variant; `gameplay` and `game-over` look the same in
# every variant, so they are common.
[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Validation checks (opt-in). Only the checks declared here run. Each drives the
# built implementation through `actions`, screenshots it, and compares against the
# rendered screenshot of `reference`. Only the title screen is deterministic
# enough to validate for Coil: it is whatever the game shows on load, so it needs
# no actions. Gameplay and game-over depend on live state and input, so they are
# seeded as references but not validated.
[[check]]
view = "title"
name = "Title Screen"
reference = "title"
actions = []

# Reviewer checklist items, common to every variant. These are the major,
# observable requirements a reviewer must explicitly check by playing the build —
# the things validation cannot judge and that are easy to miss at a glance. They
# are reporter-side material: never seeded into a run, so the model never sees the
# checklist; each one restates a requirement the seeded specification already
# states. A variant adds its own items (see the `review_item` arrays above) for
# the mode it introduces. The reviewer records a pass/fail/na verdict for each
# before the run can be published; the final rating stays the reviewer's call.
[[review_item]]
id = "combo-multiplier"
title = "Combo multiplier"
text = "Eating pellets in quick succession raises the combo multiplier by one per pellet (capped at x5) while the combo window is open; a pellet eaten after the window has lapsed resets the multiplier to 1. Each pellet scores 10 x M using the updated multiplier."

[[review_item]]
id = "combo-window"
title = "Combo window"
text = "The 2.4-second combo window reopens on every eat and drains as a thin bar beneath the multiplier in the HUD. The combo readout and bar appear only while the multiplier is at least x2 and are absent at x1, and wandering until the window lapses drops the multiplier back to 1."

[[review_item]]
id = "fixed-tick"
title = "Constant tick rate"
text = "The snake advances exactly one cell per tick at a constant 8 ticks per second; it never speeds up as it grows or as the score rises, and rendering stays smooth and independent of the fixed simulation tick."

[[review_item]]
id = "turning-rules"
title = "Turning and reversal"
text = "A turn takes effect on the next tick and only perpendicular to the current direction; a reversal back into the neck is ignored, and at most one turn is applied per tick, so a rapid double-press (e.g. down then left while moving right) can never fold the snake onto itself."

[[review_item]]
id = "tail-follow"
title = "Tail-follow rule"
text = "On a normal tick the head may safely enter the cell the tail is vacating, so the snake can chase its own tail; but on a growth tick — when the tail does not retract — moving the head into any body cell, including the current tail cell, is fatal."

[[review_item]]
id = "collision-immediate"
title = "Immediate death"
text = "The head entering a wall cell or any solid body cell ends the round immediately, with no grace frames, forgiveness window, or second chance."

[[review_item]]
id = "growth-spawn"
title = "Growth and pellet spawn"
text = "Eating a pellet grows the snake by exactly one cell and immediately spawns exactly one new pellet at a random valid cell — never on a wall, the snake, an obstacle, or another pellet/orb — so exactly one pellet is on the board at any time."

[[review_item]]
id = "high-score"
title = "Persistent high score"
text = "The BEST score persists across sessions via localStorage with no backend, is shown on the title screen and during play, and updates live the instant the current score passes it; nothing other than the high score persists between sessions."

[[review_item]]
id = "states-complete"
title = "Game states"
text = "Every game state is reachable and behaves correctly: title menu, how-to-play, playing, pause (resume/restart/quit to menu, with the tick frozen while paused), and game-over (play again/menu) showing the final score and BEST."

[[review_item]]
id = "board-cleared"
title = "Board-cleared win"
text = "If the snake grows to fill every interior cell, the round ends cleanly on a BOARD CLEARED screen — the game-over screen with that heading and the same choices — without the game crashing or attempting an impossible pellet placement."

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The entire 1280x720 stage — the whole board, every wall, the full HUD, and every menu item — stays visible, fitted, and centered at any window size and pixel density, including on load before any input, letterboxed with the background color and never clipped."

[[review_item]]
id = "crisp-grid"
title = "Crisp grid and snake"
text = "Cells render as crisp, un-blurred squares on the faintly gridded board, and the snake's brighter head is always distinguishable from its dimmer body segments."
