<!doctype html>
<!--
  Sunfront — in-match frame (common across variants).
  Rendered by the harness at 1280x720 as the `gameplay` view target. One example
  moment: a mid-match battle at the front line, the player's staging yard with
  placed spawners and the build palette, and the fog blacking out the enemy yard
  and the far lane. The exact units, placements, and values are illustrative.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- ================= LANE ================= -->
      <div class="lane"></div>

      <!-- player base (left) with a health bar -->
      <div class="base player"></div>
      <div class="hp" style="left: 8px; top: 168px; width: 72px"></div>

      <!-- player Reliquary, slightly damaged -->
      <div class="reliquary" style="left: 336px"></div>
      <div class="hp" style="left: 336px; top: 210px; width: 54px"></div>

      <!-- the front line: two armies meeting just right of center, inside vision -->
      <!-- player (Ember) advancing right -->
      <div class="unit ember" style="left: 560px; top: 150px"></div>
      <div class="unit ember" style="left: 540px; top: 210px"></div>
      <div class="unit big ember" style="left: 590px; top: 250px"></div>
      <div class="unit ember" style="left: 548px; top: 300px"></div>
      <div class="unit ember" style="left: 566px; top: 360px"></div>
      <div class="unit ember" style="left: 512px; top: 400px"></div>
      <!-- enemy (Azure) advancing left — visible because they are in player vision -->
      <div class="unit azure" style="left: 660px; top: 170px"></div>
      <div class="unit azure" style="left: 690px; top: 240px"></div>
      <div class="unit big azure" style="left: 700px; top: 290px"></div>
      <div class="unit azure" style="left: 664px; top: 350px"></div>
      <!-- a lone Sunhawk (bigger, high) crossing over the line -->
      <div class="unit ember" style="left: 720px; top: 110px; transform: scale(1.3)"></div>

      <!-- fog creeping over the far right: the enemy base and Reliquary sit under
           it and are NOT drawn -->
      <div class="lane-fog"></div>

      <!-- ================= HUD STRIP ================= -->
      <div class="hud-strip"></div>
      <div class="hud-sol">412 <small>+31/s</small></div>
      <div class="hud-wave">
        <div class="num">WAVE 6</div>
        <div class="timer">0:28</div>
      </div>
      <div class="hud-base-bar player">
        <div class="fill" style="left: 0; width: 84%; background: var(--hp-good)"></div>
        <div class="label">YOUR BASE</div>
      </div>
      <div class="hud-base-bar enemy">
        <div class="fill" style="left: 0; width: 61%; background: var(--hp-good)"></div>
        <div class="label">ENEMY BASE</div>
      </div>

      <!-- ================= STAGING YARDS ================= -->
      <div class="yard"></div>
      <!-- enemy yard fully fogged: their build is never visible -->
      <div class="yard-fog"></div>

      <!-- build palette -->
      <div class="palette">
        <h4>BUILD</h4>
        <div class="item armed"><span>1 Scarab</span><span class="cost">60</span></div>
        <div class="item"><span>2 Sentinel</span><span class="cost">100</span></div>
        <div class="item"><span>3 Flakhound</span><span class="cost">150</span></div>
        <div class="item"><span>4 Lancer</span><span class="cost">180</span></div>
        <div class="item"><span>5 Bulwark</span><span class="cost">200</span></div>
        <div class="item"><span>6 Sunhawk</span><span class="cost">240</span></div>
        <div class="item"><span>7 Bombard</span><span class="cost">280</span></div>
        <div class="item dim"><span>8 Lumen</span><span class="cost">160</span></div>
        <div class="item dim"><span>9 Monolith</span><span class="cost">900</span></div>
      </div>

      <!-- selected-spawner panel -->
      <div class="inspect">
        <div class="name">SENTINEL FOUNDRY</div>
        <div class="row">Level 2 &middot; +30%</div>
        <div class="row">Emits: Sentinel</div>
        <div>
          <span class="btn">Upgrade 75</span>
          <span class="btn">Sell 90</span>
        </div>
      </div>

      <!-- placed spawners on the visible right columns of the player grid -->
      <div class="spawner" style="left: 384px; top: 492px">Scarab</div>
      <div class="spawner selected" style="left: 456px; top: 492px">
        Sentinel<span class="pips">II</span>
      </div>
      <div class="spawner" style="left: 528px; top: 492px">
        Lancer<span class="pips">I</span>
      </div>
      <div class="spawner" style="left: 384px; top: 564px">
        Bulwark<span class="pips">I</span>
      </div>
      <div class="spawner" style="left: 456px; top: 564px">Flak</div>
      <div class="spawner" style="left: 528px; top: 564px">
        Bombard<span class="pips">II</span>
      </div>
    </div>
  </body>
</html>
