<!doctype html>
<!--
  Sunfront — title screen (base variant).
  Canonical mockup of the main menu, rendered by the harness at 1280x720 as the
  `title` view target. Source is never seeded; only the screenshot is. The menu
  chrome sits over a neutral viewport; the real build renders the 3D battlefield
  (dimmed) behind the menu itself, so it is not faked here in flat CSS.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="center">
        <h1 class="title">SUNFRONT</h1>
        <div class="tagline">TUG-OF-WAR ON THE DUNE FRONT</div>
        <nav class="menu">
          <div class="menu-item selected">SKIRMISH</div>
          <div class="menu-item">HOW TO PLAY</div>
        </nav>
      </div>
      <div class="hint">&uarr;&darr; SELECT &nbsp;&nbsp; ENTER CONFIRM</div>
    </div>
  </body>
</html>
