slug = "sunfront-sentinel-foundry"
name = "Sunfront Sentinel Foundry"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Sentinel Foundry: a 56x72x56 opaque-voxel assembly \
tower whose stamping press pistons down and drive gear spins on their own auto-play \
animations while the base stays fixed, built and rigged one recorded operation at a \
time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 56
height = 72
depth = 56
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts, joints, and animations; at run time it MAY add
# further parts, joints, and animations of its own (recorded in rig.json) beyond
# what this table requires. `pivot` is `[x, y, z]` in voxel coordinates. `rig.json`
# is pre-seeded from this table so the contract exists from the first operation.
[model]

# The foundry tower and foundation: the root part (no parent), fixed to the world.
[[model.part]]
name = "base"
pivot = [0, 0, 0]

# The stamping press head, riding in the tower's throat. It hammers straight down
# and back up on the auto-driven `piston_stamp`.
[[model.part]]
name = "piston"
parent = "base"
pivot = [28, 50, 28]

# The drive gear, mounted on the tower's flank. It turns on its own on the
# auto-driven `gear_spin`.
[[model.part]]
name = "gear"
parent = "base"
pivot = [42, 40, 20]

# The stamping press's own looping stamp. An `auto` joint driven by the
# same-named `[[model.animation]]`, a downward translation along `y` so the press
# hammers on its own without a caller. `rest = 0` is fully raised; `min = -8` is the
# bottom of the stamp.
[[model.joint]]
name = "piston_stamp"
part = "piston"
kind = "translation"
axis = "y"
pivot = [28, 50, 28]
min = -8.0
max = 0.0
rest = 0.0
drive = "auto"

# The drive gear's own looping spin. An `auto` joint driven by the same-named
# `[[model.animation]]`, a full rotation about `z` so the gear turns on its own
# without a caller.
[[model.joint]]
name = "gear_spin"
part = "gear"
kind = "rotation"
axis = "z"
pivot = [42, 40, 20]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "auto"

# The required decorative animations — one per animated part, so the foundry runs
# on its own. Each is a DECLARATION only (`auto_play = true`, looping): the case
# fixes the animation's identity and intent, and the model authors the motion (the
# F-curve keyframes) at run time with the `voxel-anim`
# `define-animation`/`add-keyframe` subcommands. There are NO keyframes here. The
# press drops down and rises back; the gear turns a full revolution and loops.
[[model.animation]]
name = "piston_stamp"
period_ms = 1200
loop = true
auto_play = true
joints = ["piston_stamp"]

[[model.animation]]
name = "gear_spin"
period_ms = 1800
loop = true
auto_play = true
joints = ["gear_spin"]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Sentinel \
Foundry and runs correctly — a tall assembly tower whose stamping press hammers \
down and back up while the drive gear spins on their own auto-play animations and \
the base stays put, with a clear solar-amber energy accent and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-foundry"
title = "Reads as a foundry tower"
text = """
From more than one angle the model reads unmistakably as a Duneforged assembly \
tower: a tall, blocky masonry structure with a stamping press riding in its throat \
and a toothed drive gear mounted on its flank. It is a working foundry building, \
not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Press stamps and gear spins on their own"
text = """
The animated elements cycle on their own via their auto-play animations while the \
`base` stays fixed: the `piston_stamp` animation drives the press straight down \
and back up in its throat, and the `gear_spin` animation turns the drive gear a \
full revolution. The motion carries weight — the press eases into the bottom of \
each stamp rather than sliding linearly. Across each cycle no voxel of the press \
or gear tears away from its mount or clips into the tower — each moves as one solid \
piece about the correct axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Base stays fixed"
text = """
Only the moving parts move: the press as it stamps and the gear as it spins. The \
tower base and its foundation stay put — they are the fixed root of the rig, not \
carried along by the press or the gear."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Press and gear stay attached"
text = """
Each child stays attached to the base across its joint's range: the press meets \
the tower's throat at its mount as it hammers up and down, and the gear meets the \
tower's flank at its hub as it turns, with no gap and never floating free or \
detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a clear \
amber accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
