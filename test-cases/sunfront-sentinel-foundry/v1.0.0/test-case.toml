slug = "sunfront-sentinel-foundry"
name = "Sunfront Sentinel Foundry"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Sentinel Foundry: a 56x76x56 opaque-voxel assembly \
tower whose stamping press hammers down and drive gear spins on their own \
self-playing animations while the structure stays put — painted cell by cell with \
the `voxel-anim` tool, one recorded operation at a time. The model invents whatever \
parts and joints it needs; the fixed contract is two self-playing animations it must \
author — a hammering `piston_stamp` and a turning `gear_spin` — the reviewer can play \
back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 56
height = 76
depth = 56
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (a game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model authors
# each animation's F-curves at run time with `voxel-anim
# define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations
# so the contract exists from the first operation.
[model]

# `piston_stamp` — the STAMPING PRESS. A self-playing idle that hammers the press
# straight down to the bottom of its stroke and back up, on its own, so the foundry
# runs without any caller.
[[model.animation]]
name = "piston_stamp"
loop = true
auto_play = true

# `gear_spin` — the DRIVE GEAR. A self-playing idle that turns the drive gear a full
# revolution continuously, on its own, so the foundry runs without any caller.
[[model.animation]]
name = "gear_spin"
loop = true
auto_play = true

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Sentinel \
Foundry and runs correctly — a tall assembly tower whose stamping press hammers \
down and back up while the drive gear spins on their own self-playing animations and \
the tower stays put, with a clear solar-amber energy accent and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-foundry"
title = "Reads as a foundry tower"
text = """
From more than one angle the model reads unmistakably as a Duneforged assembly \
tower: a tall, blocky masonry structure with a stamping press riding in its throat \
and a toothed drive gear mounted on its flank. It is a working foundry building, \
not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Press stamps and gear spins on their own"
text = """
The two moving elements cycle on their own, continuously, while the tower stands \
still: playing `piston_stamp` drives the press straight down to the bottom of its \
stroke and back up in the throat, and playing `gear_spin` turns the drive gear a \
full revolution. The motion carries weight — the press eases into the bottom of \
each stamp with a thump rather than sliding linearly, and the gear turns at a steady \
rate that loops seamlessly. Across each cycle no part of the press or the gear tears \
away or clips into the tower; each moves as one solid piece about a single clean \
axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Tower stays put; only the moving parts move"
text = """
The masonry tower and its foundation are the fixed base of the machine: they stay \
put, never carried along by the press or the gear. When `piston_stamp` plays, the \
press hammers while the tower holds; when `gear_spin` plays, the gear turns while the \
tower holds. Nothing but the two moving elements moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Press and gear stay attached"
text = """
Each moving element stays attached to the tower across its full range of motion: the \
press meets the tower's throat where it seats as it hammers up and down, and the gear \
meets the tower's flank at its hub as it turns, with no gap and never floating free \
or detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a clear \
amber accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
