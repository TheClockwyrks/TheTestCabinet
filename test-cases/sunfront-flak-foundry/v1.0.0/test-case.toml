slug = "sunfront-flak-foundry"
name = "Sunfront Flak Foundry"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Flak Foundry: an opaque-voxel works crowned \
with a sweeping radar dish and carrying a bobbing piston on its flank — painted cell \
by cell with the `voxel-anim` tool, one recorded operation at a time. The model \
invents whatever parts and joints it needs; the fixed contract is two self-playing \
animations it must author — a `dish_sweep` that turns the dish and a `piston_bob` \
that pumps the piston — while the works body stays fixed."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt and rig the SAME works at three sizes — `base` (this
# case's volume), `half` (each extent halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 56
height = 80
depth = 56
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log and renders nothing — rendering is on request via `voxel-anim render`.
# Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author and whether each is a game-triggered playable
# or a self-playing idle. The model defines its own parts and joints with `voxel-anim
# define-part`/`define-joint` and authors each animation's F-curves at run time with
# `voxel-anim define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these
# declarations so the contract exists from the first operation.
[model]

# `dish_sweep` — the radar sweep. A self-playing idle that turns the crowning radar
# dish a full, continuous revolution about its vertical mast on its own, with no
# caller, while the works body stays put.
[[model.animation]]
name = "dish_sweep"
loop = true
auto_play = true

# `piston_bob` — the charging piston's pump. A self-playing idle that drives the
# flank piston straight down and back up on its own, with no caller, while the works
# body stays put.
[[model.animation]]
name = "piston_bob"
loop = true
auto_play = true

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected size.
# The seeded dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Flak Foundry \
and runs correctly — a blocky works crowned with a radar dish that sweeps around \
while a flank piston bobs up and down on their own self-playing animations and the \
works body stays put, with a clear solar-amber energy accent and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-foundry"
title = "Reads as a flak works"
text = """
From more than one angle the model reads unmistakably as a Duneforged works: a \
tall, blocky masonry structure crowned with a broad radar dish and carrying a \
charging piston on its flank. It is a working foundry building, not an abstract \
stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Dish sweeps and piston bobs on their own"
text = """
The animated elements cycle on their own, continuously, with no caller: `dish_sweep` \
turns the radar dish a full revolution around its vertical axis so it scans the sky, \
and `piston_bob` drives the piston straight down and back up so it pumps. Across each \
cycle no part of the dish or piston tears away from its mount or clips into the works \
below — each moves as one solid piece about the correct axis, with an eased, weighted \
cadence rather than a mechanical linear slide."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Works body stays fixed"
text = """
Only the moving elements move — the dish as it sweeps and the piston as it bobs. The \
masonry works and its foundation stay put throughout: they are the fixed base of the \
machine, never carried along, twisted, or dragged by the dish or the piston."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Dish and piston stay attached"
text = """
The dish and the piston each stay attached to the works across the whole of their \
motion: the dish meets its mast at the crown as it sweeps, and the piston meets the \
works' flank at its mount as it bobs, with no gap and never floating free or \
detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a clear \
amber accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
