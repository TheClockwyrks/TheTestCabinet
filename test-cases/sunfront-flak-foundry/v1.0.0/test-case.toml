slug = "sunfront-flak-foundry"
name = "Sunfront Flak Foundry"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Flak Foundry: a 56x76x56 opaque-voxel works crowned \
with a sweeping radar dish that turns and a bobbing piston, both cycling on their \
own decorative auto-play animations while the base stays fixed, built and rigged \
one recorded operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 56
height = 76
depth = 56
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts, joints, and animation declarations; at run time it
# MAY add further parts, joints, and auto-play animations of its own (recorded in
# rig.json) beyond what this table requires. `pivot` is `[x, y, z]` in voxel
# coordinates. `rig.json` is pre-seeded from this table so the contract exists from
# the first operation.
[model]

# The foundry works and foundation: the root part (no parent), fixed to the world.
[[model.part]]
name = "base"
pivot = [0, 0, 0]

# The radar dish crowning the works. It sweeps around on its own on the
# auto-driven `dish_sweep`, animated by the decorative auto-play `dish_sweep`.
[[model.part]]
name = "dish"
parent = "base"
pivot = [28, 64, 28]

# The charging piston, riding on the works' flank. It bobs up and down on its own
# on the auto-driven `piston_bob`, animated by the decorative auto-play `piston_bob`.
[[model.part]]
name = "piston"
parent = "base"
pivot = [40, 34, 24]

# The radar dish's own looping sweep. An `auto` joint driven by the decorative
# auto-play `dish_sweep` animation, a full rotation about `y` so the dish scans the
# sky on its own without a caller.
[[model.joint]]
name = "dish_sweep"
part = "dish"
kind = "rotation"
axis = "y"
pivot = [28, 64, 28]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "auto"

# The piston's own looping bob. An `auto` joint driven by the decorative auto-play
# `piston_bob` animation, a downward translation along `y` so the piston pumps on its
# own without a caller. `rest = 0` is fully raised; `min = -5` is the bottom of the
# bob.
[[model.joint]]
name = "piston_bob"
part = "piston"
kind = "translation"
axis = "y"
pivot = [40, 34, 24]
min = -5.0
max = 0.0
rest = 0.0
drive = "auto"

# The required animations — one decorative auto-play idle per animated part, so the
# foundry runs on its own. Each is a DECLARATION only: name, period, loop, auto_play,
# and the joint it must drive. It carries NO keyframes/tracks — the model authors the
# motion as F-curves at run time with the `voxel-anim` animation subcommands
# (`define-animation` then `add-keyframe`; see the brief). Both are `auto_play = true`
# (continuously-playing decorative idles) and `loop = true`. The dish turns a full
# revolution; the piston drops down and rises back. `rig.json` is pre-seeded with
# these declarations so the contract exists from the first operation.
[[model.animation]]
name = "dish_sweep"
period_ms = 3000
loop = true
auto_play = true
joints = ["dish_sweep"]

[[model.animation]]
name = "piston_bob"
period_ms = 1200
loop = true
auto_play = true
joints = ["piston_bob"]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Flak Foundry \
and runs correctly — a blocky works crowned with a radar dish that sweeps around \
while a piston bobs up and down on their own decorative auto-play animations and \
the base stays put, with a clear solar-amber energy accent and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-foundry"
title = "Reads as a flak works"
text = """
From more than one angle the model reads unmistakably as a Duneforged works: a \
tall, blocky masonry structure crowned with a broad radar dish and carrying a \
charging piston on its flank. It is a working foundry building, not an abstract \
stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Dish sweeps and piston bobs on their own"
text = """
The animated elements cycle on their own via their auto-play animations while the \
`base` stays fixed: the `dish_sweep` joint turns the radar dish a full revolution around \
its vertical mast, and the `piston_bob` joint drives the piston straight down and \
back up. Across each cycle no voxel of the dish or piston tears away from its \
mount or clips into the works — each moves as one solid piece about the correct \
axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Base stays fixed"
text = """
Only the moving parts move: the dish as it sweeps and the piston as it bobs. The \
works base and its foundation stay put — they are the fixed root of the rig, not \
carried along by the dish or the piston."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Dish and piston stay attached"
text = """
Each child stays attached to the base across its joint's range: the dish meets \
its mast at the crown of the works as it sweeps, and the piston meets the works' \
flank at its mount as it bobs, with no gap and never floating free or \
detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a clear \
amber accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
