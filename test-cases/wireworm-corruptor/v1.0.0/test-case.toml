name = "Wireworm Corruptor"
difficulty = "medium"
tags = ["asset-generation", "2d", "sprite-sheet", "enemy"]
summary = """
Draw the corruptor — the leggy crawler that scuttles across the Wireworm \
circuit board charging every node it touches — as a 32x32 four-frame sprite sheet: \
a low, wide, toxic-green segmented crawler with a red-eyed head and an amber charge \
stinger, its legs cycling a scuttle, produced one drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one crawler
# sized to a grid cell. Fixing the size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — four separate 32x32 frames of the corruptor's crawl
# cycle — and the named sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.sequence]]
slug = "crawl"
name = "Corruptor — crawl"
frames = [0, 1, 2, 3]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated corruptor matches the brief — a low, wide, \
toxic-green segmented crawler with a red-eyed head and an amber charge stinger, \
its legs cycling a steady scuttle across four frames, in the tight palette on \
transparency, and clearly distinct from the data-worm."""

[[review_item]]
id = "leggy-crawler"
title = "Reads as a leggy crawler, not the worm"
text = """
The sprite reads as a low, wide, many-legged crawler scuttling horizontally — a \
segmented green body with visible legs beneath it and a red-eyed head at the \
leading edge — clearly a different beast from the tall, legless, magenta-seamed \
data-worm. It is not just a recolored worm segment."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "charge-stinger"
title = "Amber charge stinger"
text = """
It carries a short stinger rising from its rear tipped with an amber glow — the \
same amber the board's nodes show at critical charge — marking it as the beast \
that pours charge into the nodes. The stinger tip stays lit in every frame."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "crawl"
title = "Steady scuttle"
text = """
Played as a loop, the four frames read as a steady horizontal scuttle: the body, \
head, and stinger hold constant while the legs step through an alternating stride \
(frames 0 and 2 the two extremes, 1 and 3 the passes) with a ~1 px body bob — a \
walk cycle, not random twitching or a sprite that travels or resizes."""
sequences = ["crawl"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette-and-transparency"
title = "Corruptor palette on transparency"
text = """
Uses only the corruptor palette from the brief (carapace mid/dark/edge, the amber \
stinger glow, and the red eye) on full transparency — no out-of-palette pixels, no \
anti-aliased fringes, and no opaque background fill; only the crawler's pixels are \
opaque so it composites onto the dark board."""
weight = 1
domain = "fidelity"
