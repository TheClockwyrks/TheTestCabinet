# The default (and only) variant for this case: the standard Descent run on the
# one board, with no per-variant overrides beyond its own title-menu mockup.
# Listed first in the manifest's `variants`, so it is the default. Every path here
# resolves against the version folder, like the manifest.
slug = "base"
name = "Base"
description = "The standard Descent run: the data-worm down the one board across all 12 levels."

# Variant-specific reference: the title view lists this variant's menu (DESCEND,
# then HOW TO PLAY). `gameplay` and `game-over` are common (in test-case.toml).
reference = [{ view = "title", path = "reference/menu-base.html" }]
