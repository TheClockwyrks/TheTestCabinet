<!DOCTYPE html>
<!--
  Wireworm — in-game reference mockup (representative mid-level frame).
  Canonical view slug: gameplay
  Render at a 1280x720 viewport. See ../specs/overview.md (coordinate system,
  palette), ../specs/playfield.md (board grid, player band, HUD),
  ../specs/charge.md (node charge, the chain-arc discharge, critical dive),
  ../specs/worm.md (winding and splitting), and ../specs/foes.md (the foes).

  Board objects use board-local coordinates (the board sits at stage y=80). A
  node or worm segment fills one 32x32 tile: tile (c,r) has left=32c, top=32r
  within the board. The field, charges, worm, and foes shown are one example
  moment, used for a soft palette/layout comparison, not a strict pixel match.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wireworm — Gameplay</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- ===================== HUD bar ===================== -->
      <div class="hud">
        <div class="block">
          <div class="k">SCORE</div>
          <div class="v score">14&#8202;820</div>
        </div>
        <div class="block">
          <div class="k">LIVES</div>
          <div class="lives"><span class="pip"></span><span class="pip"></span></div>
        </div>
        <div class="block hazard">&#9888; CORRUPTOR CROSSING</div>
        <div class="block" style="align-items: flex-end">
          <div class="k">LEVEL</div>
          <div class="v level">6 / 12</div>
        </div>
      </div>

      <!-- ===================== Board ===================== -->
      <div class="board">
        <div class="playband"></div>

        <!-- ===== Node field (varied charge). Tile (c,r): left=32c, top=32r. ===== -->
        <!-- Corruptor wake: a fresh line of criticals along row 2. -->
        <div class="node c-3" style="left: 160px; top: 64px">
          <div class="can"></div><div class="core"></div>
          <div class="spark" style="left: 15px; top: 4px"></div>
          <div class="spark" style="left: 8px; top: 27px"></div>
        </div>
        <div class="node c-3" style="left: 224px; top: 64px">
          <div class="can"></div><div class="core"></div>
          <div class="spark" style="left: 16px; top: 5px"></div>
          <div class="spark" style="left: 22px; top: 26px"></div>
        </div>

        <!-- Scattered inert / low / mid nodes across the upper-mid board. -->
        <div class="node c-0" style="left: 448px; top: 96px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-2" style="left: 704px; top: 96px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-1" style="left: 320px; top: 128px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 896px; top: 128px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-2" style="left: 576px; top: 160px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 128px; top: 160px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-1" style="left: 1056px; top: 160px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 768px; top: 224px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-2" style="left: 384px; top: 224px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-1" style="left: 640px; top: 256px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 960px; top: 256px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 512px; top: 320px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 832px; top: 320px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-1" style="left: 1088px; top: 352px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 704px; top: 384px"><div class="can"></div><div class="core"></div></div>

        <!-- ===== A critical cluster mid-detonation (the signature). ===== -->
        <div class="node c-3" style="left: 256px; top: 288px">
          <div class="can"></div><div class="core"></div>
          <div class="spark" style="left: 15px; top: 4px"></div>
        </div>
        <div class="node c-3" style="left: 288px; top: 288px">
          <div class="can"></div><div class="core"></div>
          <div class="spark" style="left: 16px; top: 5px"></div>
        </div>
        <div class="node c-3" style="left: 320px; top: 320px">
          <div class="can"></div><div class="core"></div>
          <div class="spark" style="left: 8px; top: 27px"></div>
        </div>
        <!-- Arcs leaping between the detonating cluster, plus the flash. -->
        <div class="arc" style="left: 272px; top: 304px; width: 34px; transform: rotate(2deg)"></div>
        <div class="arc" style="left: 300px; top: 306px; width: 40px; transform: rotate(28deg)"></div>
        <div class="flash" style="left: 288px; top: 304px"></div>

        <!-- ===== Worm A: the leading worm, winding right along row 5. ===== -->
        <div class="seg head" style="left: 832px; top: 160px">
          <div class="plate"></div><div class="seam"></div><div class="eye"></div><div class="mand"></div>
        </div>
        <div class="seg" style="left: 800px; top: 160px"><div class="plate"></div><div class="seam"></div></div>
        <div class="seg" style="left: 768px; top: 160px"><div class="plate"></div><div class="seam"></div></div>
        <div class="seg" style="left: 736px; top: 160px"><div class="plate"></div><div class="seam"></div></div>
        <div class="seg tail" style="left: 704px; top: 160px"><div class="plate"></div><div class="seam"></div></div>

        <!-- ===== Worm B: the trailing worm after a split — a NEW head leads it. ===== -->
        <div class="seg head" style="left: 480px; top: 192px">
          <div class="plate"></div><div class="seam"></div><div class="eye"></div><div class="mand"></div>
        </div>
        <div class="seg" style="left: 448px; top: 192px"><div class="plate"></div><div class="seam"></div></div>
        <div class="seg tail" style="left: 416px; top: 192px"><div class="plate"></div><div class="seam"></div></div>

        <!-- A lone segment diving straight down a critical column toward the band. -->
        <div class="seg" style="left: 288px; top: 384px"><div class="plate"></div><div class="seam"></div></div>

        <!-- ===== Foes ===== -->
        <!-- Corruptor crawling right along the top row, laying its critical line. -->
        <div class="foe corruptor" style="left: 288px; top: 64px"><div class="body"></div></div>
        <!-- Glitch skittering the lower-right board. -->
        <div class="foe glitch" style="left: 992px; top: 352px"><div class="body"></div></div>

        <!-- ===== Player cursor in its band, firing up at the critical cluster. ===== -->
        <div class="cursor" style="left: 272px; top: 602px"><div class="hull"></div><div class="ccore"></div></div>
        <div class="bolt" style="left: 286px; top: 540px"></div>
        <div class="bolt" style="left: 286px; top: 450px"></div>
      </div>
    </div>
  </body>
</html>
