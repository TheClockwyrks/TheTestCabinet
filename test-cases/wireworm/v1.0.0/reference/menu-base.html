<!DOCTYPE html>
<!--
  Wireworm — title / main-menu reference mockup (base variant).
  Canonical view slug: title (variant-specific: this variant's menu is DESCEND).
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states — title menu)
  and ../specs/standard.md (the DESCEND entry). A dim slice of board shows
  behind the menu for atmosphere.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wireworm — Title</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Dim board furniture behind the menu, for atmosphere. -->
      <div class="board dim">
        <div class="node c-1" style="left: 160px; top: 96px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-2" style="left: 320px; top: 160px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-0" style="left: 928px; top: 128px"><div class="can"></div><div class="core"></div></div>
        <div class="node c-3" style="left: 1056px; top: 224px">
          <div class="can"></div><div class="core"></div><div class="spark" style="left: 15px; top: 4px"></div>
        </div>
        <div class="node c-1" style="left: 224px; top: 320px"><div class="can"></div><div class="core"></div></div>
        <div class="seg head" style="left: 1056px; top: 96px"><div class="plate"></div><div class="seam"></div><div class="eye"></div><div class="mand"></div></div>
        <div class="seg" style="left: 1024px; top: 96px"><div class="plate"></div><div class="seam"></div></div>
        <div class="seg tail" style="left: 992px; top: 96px"><div class="plate"></div><div class="seam"></div></div>
      </div>

      <!-- Title, tagline, and the menu. -->
      <div class="center">
        <div class="title">WIREWORM</div>
        <div class="tagline">CUT THE CURRENT</div>
        <div class="menu">
          <div class="menu-item selected">DESCEND</div>
          <div class="menu-item">HOW TO PLAY</div>
        </div>
      </div>
      <div class="hint">&#9650; &#9660; SELECT &nbsp;&nbsp; ENTER START</div>
    </div>
  </body>
</html>
