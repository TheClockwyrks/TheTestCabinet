slug = "sunfront-monolith"
name = "Sunfront Monolith"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "mech"]
summary = """
Sculpt and rig the Sunfront Monolith: an opaque-voxel super-heavy bipedal \
war-mech that strides on two legs and works a giant cannon carried on its right arm \
— built not from a fixed skeleton but by painting discrete opaque cells with the \
`voxel-anim` tool one recorded operation at a time. The model invents whatever parts \
and joints it needs; the fixed contract is two animations it must author — a slow, \
heavy, planted `walk` and a weapon-only `fire` recoil — the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME war-mech at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 50
height = 80
depth = 50
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton a walking, firing mech needs and is judged on whether it works
# out the right pieces, attaches them where they belong, and animates them
# convincingly. What is fixed is the set of NAMED ANIMATIONS the model must author (a
# game plays them by name) and whether each is a game-triggered playable or a
# self-playing idle. The model authors each animation's F-curves at run time with the
# voxel-anim `define-animation`/`add-keyframe` subcommands; `rig.json` is pre-seeded
# with these declarations so the contract exists from the first operation.
[model]

# `walk` — the WALK. A game-triggered playable (not self-playing) that strides the
# mech forward on its two legs: each foot plants flat and still on the ground while
# the body passes over it, then lifts, swings forward, and plants again, so the
# machine pushes itself forward rather than flailing. The two legs step in opposite
# phase, one supporting while the other swings. Authored IN PLACE: the body does not
# translate across the scene (the leg cycle carries the stride; a game supplies the
# real travel).
[[model.animation]]
name = "walk"
loop = true
auto_play = false

# `fire` — the WEAPON showcase. A game-triggered playable that works the giant
# arm-cannon while the mech stands its ground: the cannon snaps into a recoil nod,
# overshoots back, and settles, while the legs hold planted.
[[model.animation]]
name = "fire"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected size
# (`{{voxel.width}}`×`{{voxel.height}}`×`{{voxel.depth}}`). The seeded dest drops the
# `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Monolith and \
poses correctly — a super-heavy bipedal war-mech whose giant right arm-cannon aims \
up and down and recoils under `fire` without detaching while its two articulated \
legs stride with a slow, heavy, planted `walk` and the torso stays put, with a clear \
solar-amber core accent and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-mech"
title = "Reads as a super-heavy war-mech"
text = """
From more than one angle the model reads unmistakably as a towering bipedal \
war-mech: a massive armored torso with a head on top, a pair of thick jointed legs \
planted beneath the hips, and a giant cannon carried on the right arm. It is a \
hulking walking fighting machine, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride with a heavy, planted gait"
text = """
Playing `walk` strides the mech forward on its two legs. The clip is authored \
IN PLACE — the body holds its ground and does not drift across the scene; the \
forward stride is carried entirely by the legs, so played on its own the feet cycle \
and the planted foot slides straight back under the body (a treadmill) while a game \
supplies the real movement. Each foot has a clear \
PLANTED STANCE — flat and still on the ground while the body passes over it — then \
lifts clear, swings forward, and plants again with weight; the two legs step in \
opposite phase so the machine is always supported and pushes itself forward, NOT \
flailing its legs in a continuous arc. The feet stay flat as they carry the body \
(they don't tip onto toe or heel), no foot is dragged or driven down through the \
ground, and the legs stay attached to the body across the whole cycle. The knee \
bends the right way (a reverse/digitigrade fold). The model had to invent an \
articulated leg (more than one segment and joint) for this to read as walking rather \
than swinging rigid poles."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "cannon-aims-and-fires"
title = "Cannon aims cleanly and recoils under fire"
text = """
The giant cannon carried on the mech's right arm reads as an aimable weapon: it \
tilts up and down as one solid piece about its shoulder mount. Playing `fire` works \
it convincingly — the cannon snaps into a recoil nod through that hinge, overshoots \
back, and settles — with no geometry tearing away from the arm or clipping into the \
torso as it moves, while the legs hold still."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "torso-fixed"
title = "Torso stays fixed; only the moving parts move"
text = """
The armored torso and head are the fixed base of the machine: they stay put, never \
carried along by the cannon or the legs. When `fire` plays, the cannon works while \
the legs stay planted; when `walk` plays, the legs stride while the cannon holds. \
Nothing but the moving parts moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Legs and cannon stay attached"
text = """
The legs and the arm-cannon stay attached to the body across their full range of \
motion: no gap opens where a segment meets its neighbor, and nothing floats free or \
detaches as the legs stride under `walk` and the cannon works under `fire`."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (massive brass and bronze plating, \
iron joints and cannon, and the solar-amber core accent) with a clear amber chest \
core and shoulder lights, no out-of-palette colors, and no stray voxels drifting \
off the parts."""
weight = 1
domain = "fidelity"
