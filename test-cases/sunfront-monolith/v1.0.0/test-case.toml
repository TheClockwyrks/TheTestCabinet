name = "Sunfront Monolith"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "mech"]
summary = """
Sculpt and rig the Sunfront Monolith: a 64x80x56 opaque-voxel super-heavy bipedal \
war-mech whose giant right arm-cannon aims up and down on a caller-driven \
weapon_pitch joint while its two independent, two-jointed legs walk with a slow, \
heavy, planted stride the model authors as F-curves — built and rigged one \
recorded operation at a time, with a caller weapon_pitch, a required walk, and a \
weapon-only fire the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 64
height = 80
depth = 56
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts, joints, and animations; at run time it MAY add
# further parts, joints, and animations of its own (recorded in rig.json) beyond
# what this table requires. `pivot` is `[x, y, z]` in voxel coordinates. `rig.json`
# is pre-seeded from this table so the contract exists from the first operation.
#
# The rig has two kinds of moving part, and the drive of each is deliberate:
#   * The giant arm-cannon aims on the caller-driven `weapon_pitch` — a game (and
#     the review viewer's `fire` animation) drives it by name; at rest it holds
#     level.
#   * Every leg joint is `auto` — driven by the required `walk` animation the model
#     authors, so the mech strides when a game plays `walk`.
[model]

# The mech's massive upper body and head: the root part (no parent), fixed to the
# world.
[[model.part]]
name = "torso"
pivot = [0, 0, 0]

# --- The two legs. Each leg is THREE parts (an upper thigh + a lower shin + a
# short, FLAT foot) with two moving joints (a hip on the torso and a knee between
# thigh and shin) plus an ankle that keeps the foot flat. The legs are INDEPENDENT
# — each is its own chain on its own hip directly above its own foot (x,z held
# constant down the chain; only y descends) so no shared pivot drags a foot through
# the ground. Left (l) and right (r), mirrored across the centerplane. ---

# Left thigh, hung from the left hip under the torso.
[[model.part]]
name = "thigh_l"
parent = "torso"
pivot = [20, 34, 28]

# Left shin, hung from the left knee down toward the foot.
[[model.part]]
name = "shin_l"
parent = "thigh_l"
pivot = [20, 18, 28]

# Left foot: a short, flat foot hung from the left ankle onto the ground.
[[model.part]]
name = "foot_l"
parent = "shin_l"
pivot = [20, 3, 28]

# Right thigh, mirroring the left.
[[model.part]]
name = "thigh_r"
parent = "torso"
pivot = [44, 34, 28]

# Right shin.
[[model.part]]
name = "shin_r"
parent = "thigh_r"
pivot = [44, 18, 28]

# Right foot.
[[model.part]]
name = "foot_r"
parent = "shin_r"
pivot = [44, 3, 28]

# The giant right arm-cannon, mounted at the shoulder. It aims up and down on the
# caller-driven `weapon_pitch`.
[[model.part]]
name = "weapon"
parent = "torso"
pivot = [44, 52, 32]

# --- Joints ---

# The two hip joints: each swings its whole leg fore-and-aft about the hip — the big
# stride sweep. `auto`, driven by the `walk` animation the model authors. rot x,
# range ±0.5, rest 0.
[[model.joint]]
name = "hip_l"
part = "thigh_l"
kind = "rotation"
axis = "x"
pivot = [20, 34, 28]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

[[model.joint]]
name = "hip_r"
part = "thigh_r"
kind = "rotation"
axis = "x"
pivot = [44, 34, 28]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

# The two knee joints: each folds the shin (reverse / digitigrade direction) to lift
# the foot clear on its swing and to extend/fold while the foot is planted. `auto`,
# driven by `walk`. The rest is a clearly BENT knee (rest = -0.7), never a straight
# column — a near-straight leg cannot keep its foot planted as the body passes over
# it. rot x, range -1.4..0.2.
[[model.joint]]
name = "knee_l"
part = "shin_l"
kind = "rotation"
axis = "x"
pivot = [20, 18, 28]
min = -1.4
max = 0.2
rest = -0.7
drive = "auto"

[[model.joint]]
name = "knee_r"
part = "shin_r"
kind = "rotation"
axis = "x"
pivot = [44, 18, 28]
min = -1.4
max = 0.2
rest = -0.7
drive = "auto"

# The two ankle joints: each tilts its short foot only ±~15°, counter-rotating
# against the shin to keep the foot FLAT across the whole cycle (never on toes or
# heels). `auto`, driven by `walk`. rot x, range -0.3..0.3, rest 0.
[[model.joint]]
name = "foot_l"
part = "foot_l"
kind = "rotation"
axis = "x"
pivot = [20, 3, 28]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

[[model.joint]]
name = "foot_r"
part = "foot_r"
kind = "rotation"
axis = "x"
pivot = [44, 3, 28]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

# The required caller-driven joint: a game addresses `weapon_pitch` by name to aim
# the giant arm-cannon up and down about its shoulder mount. `rest = 0` levels the
# cannon straight forward (+z); `min`/`max` tilt it down and up. Only the weapon
# moves on this joint.
[[model.joint]]
name = "weapon_pitch"
part = "weapon"
kind = "rotation"
axis = "x"
pivot = [44, 52, 32]
min = -0.7
max = 0.7
rest = 0.0
drive = "caller"

# --- Required animations (the model authors each one's F-curve keyframes at run
# time with the voxel-anim `define-animation`/`add-keyframe` subcommands; the case
# declares only each animation's identity and intent, NOT its keyframes). ---

# `walk`: the required WALK. It drives all six leg joints — the two hips sweep
# fore-and-aft, the two knees fold to lift each foot and extend/fold to hold it
# planted, and the two ankles keep the feet flat — in a slow, heavy, opposite-phase
# biped gait (left and right legs a half period apart). It touches NO weapon joint,
# so the cannon holds at rest. Period 1100 — a slow, ponderous capstone stride.
[[model.animation]]
name = "walk"
period_ms = 1100
loop = true
auto_play = false
joints = ["hip_l", "knee_l", "foot_l", "hip_r", "knee_r", "foot_r"]

# `fire`: the WEAPON showcase — a viewer play button. It drives only `weapon_pitch`,
# snapping the cannon into a quick recoil nod, overshooting back, and settling. It
# touches NO leg joint, so the legs hold still. Period 600.
[[model.animation]]
name = "fire"
period_ms = 600
loop = true
auto_play = false
joints = ["weapon_pitch"]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Monolith and \
poses correctly — a super-heavy bipedal war-mech whose giant right arm-cannon aims \
up and down on its shoulder mount without detaching while its two independent, \
two-jointed legs stride with a slow, heavy, planted `walk` and the torso stays put, \
with a clear solar-amber core accent and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-mech"
title = "Reads as a super-heavy war-mech"
text = """
From more than one angle the model reads unmistakably as a towering bipedal \
war-mech: a massive armored torso with a head on top, a pair of thick jointed legs \
planted beneath the hips, and a giant cannon carried on the right arm. It is a \
hulking walking fighting machine, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride with a heavy, planted gait"
text = """
Playing `walk` strides the mech on its two legs: each leg swings on its own `hip_*` \
joint and folds at its own `knee_*` so the foot lifts clear on its swing and plants \
flat, the two legs stepping in opposite phase — not as one rigid swing. There is a \
planted stance segment where a flat foot sits still on the ground while the body \
passes over it (the machine pushes itself forward, it does not flail), the knee \
bends the right way (a reverse/digitigrade fold), and no foot is dragged or driven \
down through the ground. Each shin stays attached to its thigh, each thigh and foot \
to its chain, across the whole cycle."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "weapon-pitches"
title = "Cannon aims cleanly on its hinge"
text = """
Driving the `weapon_pitch` joint tilts the giant right arm-cannon cleanly up and \
down about its shoulder mount, with no voxel of the weapon tearing away from the \
arm or clipping into the torso across the full range. Playing `fire` recoils the \
cannon through that same hinge while the legs hold still."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "torso-fixed"
title = "Torso stays fixed"
text = """
Only the moving parts move: the cannon when `weapon_pitch` is driven or `fire` \
plays, and the legs when `walk` plays. The torso and head stay put — they are the \
fixed root of the rig, not carried along by the weapon or the legs. When `walk` \
plays only the legs move and the cannon holds; when `fire` plays only the cannon \
moves and the legs hold."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Legs and cannon stay attached"
text = """
Each leg chain and the cannon stay attached to the torso across their joints' \
ranges: each thigh meets its hip, each shin its knee, each foot its ankle, and the \
cannon the right shoulder, with no gap and never floating free or detaching as the \
legs stride and the cannon pitches."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (massive brass and bronze plating, \
iron joints and cannon, and the solar-amber core accent) with a clear amber chest \
core and shoulder lights, no out-of-palette colors, and no stray voxels drifting \
off the parts."""
weight = 1
domain = "fidelity"
