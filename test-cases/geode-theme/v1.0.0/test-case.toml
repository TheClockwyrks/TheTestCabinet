slug = "geode-theme"
experimental = true
name = "Geode Theme"
difficulty = "medium"
tags = ["music", "naval", "geode"]
summary = """
Compose the Geode faction theme: a ~30-second crystalline, resonant, otherworldly \
cue for the fleet-command game's amethyst-and-magenta resonance power — glassy, \
ethereal, and alive — sequenced note by note as instrument tracks over the \
gm-lite bank."""
description = "description.md"
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "music"

variants = ["variants/base.toml"]

# The output format the rendered clip is fixed to. A music case names the baked
# instrument bank it plays; `gm-lite@0.1.0` is a name@version palette baked into
# the run-container image, never a path in this repo.
[audio]
sample_rate = 44100                 # output sample rate in Hz (required)
channels = "stereo"                 # "mono" | "stereo" (required)
max_duration_ms = 30000             # cap on the rendered clip's length in ms (required, positive) — about 30 seconds
instrument_bank = "gm-lite@0.1.0"   # music ONLY: the baked instrument bank (name@version)

# The sequencer. `music` is the only way to shape sound; it records every
# operation to the action log and renders the waveform + spectrogram + piano-roll
# only when you run `render`. Run `music --help` to see the operations; no
# operations schema is seeded.
[tool]
binary = "music"
preview = "waveform.png"

# The recorded action log — the authoritative output the clip is regenerated
# from. Core emits the rendered clip.wav (and a portable clip.mid) automatically.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the clip reads as the Geode faction theme the brief describes — \
a crystalline, resonant, otherworldly cue for an amethyst-and-magenta power that \
runs on resonance: glassy and bell-like over a humming, pulsing undercurrent, \
ethereal and mysterious, alive as if charged."""

[[domain]]
id = "craft"
name = "Craft"
description = """
Musicianship in the writing — a coherent tonality and pulse, sensible instrument \
choices and voicings from the gm-lite bank that conjure crystalline resonance, a \
clean loopable ending, and a wide, enveloping stereo mix with real space and \
depth."""

[[review_item]]
id = "crystalline-resonant"
title = "Crystalline and resonant"
text = """
The clip reads at once as crystalline and resonant — glassy, bell-like, \
harmonically rich tones ringing over a humming undercurrent that swells and \
pulses like a living network — evoking faceted crystal catching light, not iron, \
steel, or a conventional march."""
weight = 3
domain = "fidelity"

