slug = "sunfront-scarab"
name = "Sunfront Scarab"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "walker"]
summary = """
Sculpt and rig the Sunfront Scarab: a 48x28x56 opaque-voxel four-legged war-beetle \
that walks on its legs so every foot lifts clear of the ground and plants flat, and \
snaps its front mandibles on demand — painted cell by cell with the voxel-anim tool, \
one recorded operation at a time. The model invents whatever parts and joints it \
needs; the fixed contract is two animations it must author — a walking `walk` and a \
weapon `bite` — the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 48
height = 28
depth = 56
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# part the model defines), the authoritative output each part's regenerated model
# is rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (a game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model authors
# each animation's F-curves at run time with `voxel-anim define-animation`/`add-keyframe`;
# `rig.json` is pre-seeded with these declarations so the contract exists from the
# first operation.
[model]

# `walk` — the WALK. A game-triggered playable (not self-playing) that strides the
# beetle forward on its legs: feet plant flat and still on the ground while the body
# passes over them, then lift, swing forward, and plant again, so the beetle pushes
# itself forward rather than flailing. The jaws hold shut while it walks. Authored IN
# PLACE: the body does not translate across the scene (the leg cycle carries the
# stride; a game supplies the real travel).
[[model.animation]]
name = "walk"
loop = true
auto_play = false

# `bite` — the WEAPON showcase. A game-triggered playable that snaps the front
# mandibles wide open then shut and holds them shut, so a reviewer can watch the jaws
# work without dragging a slider, while the legs stay planted.
[[model.animation]]
name = "bite"
loop = true
auto_play = false

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Scarab and \
poses correctly — a low, wide four-legged war-beetle striding on independent legs \
whose feet lift clear of the ground and plant flat, whose front mandibles snap open \
and shut on demand without detaching, and whose body stays put, with a clear \
solar-amber eye accent and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-scarab"
title = "Reads as a war-beetle"
text = """
From more than one angle the model reads unmistakably as a scarab-like war-beetle: \
a low, wide domed carapace body, four jointed legs splayed out at its corners (each \
bending down to a flat foot), and a pair of snapping mandibles projecting forward from \
the head. It is a scuttling insect machine, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride on planted feet without clipping the ground"
text = """
Playing `walk` strides the beetle forward on its legs. The clip is authored \
IN PLACE — the body holds its ground and does not drift across the scene; the \
forward stride is carried entirely by the legs, so played on its own the feet cycle \
and the planted foot slides straight back under the body (a treadmill) while a game \
supplies the real movement. Each foot has a clear PLANTED \
STANCE — flat and still on the ground while the beetle passes over it — then lifts \
clear, swings forward, and plants again with weight; the legs cycle so the beetle is \
always supported and pushes itself forward, NOT flailing its legs as one rigid bank in \
a continuous arc. The feet stay flat as they carry the body (they don't tip onto toe or \
heel), no foot is dragged or driven down through the ground, and the legs stay attached \
across the whole cycle. The model had to invent an articulated leg (more than one \
segment and joint) for this to read as walking rather than swinging rigid poles."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "mandibles-snap"
title = "Mandibles snap on their hinge"
text = """
Playing `bite` swings the front jaws open and shut about their hinge cleanly, with no \
voxel of the mandibles tearing away from the head or clipping into the body across the \
full range. Only the mandibles move as they bite; the legs stay planted."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "body-fixed"
title = "Body stays fixed; only the moving parts move"
text = """
Only the moving parts move: the mandibles when `bite` plays, and the legs when `walk` \
plays. The carapace body stays put — it is the fixed root of the rig, not carried along \
by the jaws or the legs. When `bite` plays the jaws work while the legs stay planted; \
when `walk` plays the legs stride while the jaws hold shut."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze shell, iron legs, \
and the solar-amber eye accent) with a clear amber eye-cluster on the head, no \
out-of-palette colors, and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
