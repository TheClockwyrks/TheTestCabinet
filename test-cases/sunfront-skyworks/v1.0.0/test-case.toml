slug = "sunfront-skyworks"
name = "Sunfront Skyworks"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Skyworks: a 70x60x70 opaque-voxel open launch-pad \
hangar whose turbine spins fast overhead and launch door raises and lowers on their \
own auto-play animations while the pad stays fixed — painted cell by cell one \
recorded operation at a time. The model invents whatever parts and joints it needs; \
the fixed contract is two self-playing animations it must author — a `turbine_spin` \
and a `launch_door_raise`."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 70
height = 60
depth = 70
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (the game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model authors
# each animation's F-curves at run time with `voxel-anim`
# `define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations
# so the contract exists from the first operation.
[model]

# `turbine_spin` — the decorative turbine sweep. A self-playing idle that turns the
# turbine continuously overhead, on its own, without a caller.
[[model.animation]]
name = "turbine_spin"
loop = true
auto_play = true

# `launch_door_raise` — the decorative launch-door cycle. A self-playing idle that
# slides the launch door up, holds it open, then lowers it back, looping on its own
# without a caller.
[[model.animation]]
name = "launch_door_raise"
loop = true
auto_play = true

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Skyworks \
and runs correctly — an open launch-pad hangar whose turbine spins fast overhead \
and launch door raises and lowers on their own auto-play animations while the \
pad stays put, with a clear solar-amber energy accent and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-skyworks"
title = "Reads as a launch-pad hangar"
text = """
From more than one angle the model reads unmistakably as a Duneforged Skyworks: a \
broad, open launch-pad hangar with a bladed turbine mounted high over its center \
mast and a heavy launch door set in its front face. It is a working launch-pad \
building — a masonry pad rooted to the ground, open above so the turbine reads high \
overhead — not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Turbine spins and door raises on their own"
text = """
The animated elements cycle continuously on their own while the pad stays fixed. \
Playing `turbine_spin` turns the turbine a full revolution overhead about its \
vertical axis, evenly and looping. Playing `launch_door_raise` slides the launch \
door straight up in the front face, holds it open, then lowers it back down, with \
weight rather than a linear slide. Across each cycle no part of the turbine or the \
door tears away from its mount or clips into the pad — each moves as one solid \
piece about the right axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "The pad stays put; only the moving parts move"
text = """
The masonry pad and its foundation are the fixed base of the building: they stay \
put, never carried along by the turbine or the door. Only the turbine (as it spins \
under `turbine_spin`) and the launch door (as it raises under `launch_door_raise`) \
move; nothing else does."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Turbine and door stay attached"
text = """
The moving elements stay attached to the pad across their whole range of motion: \
the turbine meets its center mast at its hub as it spins, and the launch door \
meets the pad's front face as it slides up and back down, with no gap and never \
floating free or detaching. The model had to invent a mast the turbine seats on \
and a runner or frame the door rides in for these to read as mounted rather than \
drifting."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a \
clear amber accent, no out-of-palette colors, and no stray voxels drifting off \
the parts."""
weight = 1
domain = "fidelity"
