description = "The hurt cue plays on any tick the lamplighter takes contact damage, at most once on that tick."
[[review.categories.items]]
id = "cue-level-up"
title = "level-up plays when a level-up overlay opens"
description = "The level-up cue plays on each opening of the level-up overlay, a queued second overlay included."
[[review.categories.items]]
id = "cue-choose"
title = "choose plays when an offer is accepted"
description = "The choose cue plays on each accepted offer."
[[review.categories.items]]
id = "cue-chest"
