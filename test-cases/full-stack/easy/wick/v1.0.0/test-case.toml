[[review.categories.items]]
id = "death-on-tick"
title = "An enemy at or below 0 dies on that tick"
description = "An enemy whose hp is at or below 0 is removed on that tick with the kill count up by one and its drop at its center."
[[review.categories.items]]
id = "taper-facing-slash"
title = "Taper slashes in the facing direction from the player's x"
description = "Taper's slash is a width × height rectangle whose near vertical edge is at the player's x, extending width in the facing direction, centered vertically, hitting on the tick it fires alone."
[[review.categories.items]]
id = "taper-second-side"
title = "Taper at amount 2 slashes both sides"
description = "From level 3, or with Mirror, a second slash fires the same tick on the opposite side, and any amount above TAPER_MAX_AMOUNT (2) adds nothing."
[[review.categories.items]]
id = "taper-table"
title = "Taper honors its level table"
description = "At level 1 the slash is damage 10, cooldown 1.35, 120 × 40, amount 1; at level 8 it is damage 30, cooldown 1.2, 160 × 56, amount 2, as TAPER_LEVELS gives."
[[review.categories.items]]
id = "ember-nearest"
title = "Ember fires at the nearest enemy"
description = "Ember's bolt leaves the player's center toward the nearest enemy's center at the tick of firing and flies straight for its duration."
[[review.categories.items]]
id = "ember-amount-distinct"
title = "Ember's amount fires at distinct nearest enemies"
description = "With amount n, n bolts fire on the same tick at the n nearest distinct enemies, fewer if fewer exist."
[[review.categories.items]]
id = "ember-table"
title = "Ember honors its level table"
description = "At level 1 the bolt is damage 10, cooldown 1.2, speed 400, radius 8, pierce 0, duration 2, amount 1; at level 8 it is damage 25, cooldown 0.8, speed 450, radius 10, pierce 2, amount 3, as EMBER_LEVELS gives."
[[review.categories.items]]
id = "pin-facing-spread"
title = "Pin fires darts in the facing direction, spread vertically"
description = "Pin's darts fly horizontally in the facing direction, and dart i of n starts at player.y + (i − (n − 1) / 2) × PIN_SPREAD (10)."
[[review.categories.items]]
id = "pin-fires-alone"
title = "Pin fires whether or not any enemy exists"
description = "Pin's darts fire on an empty field, with no target required."
[[review.categories.items]]
id = "pin-table"
title = "Pin honors its level table"
description = "At level 1 the dart is damage 6, cooldown 0.5, speed 600, radius 6, pierce 1, duration 1.5, amount 1; at level 8 it is damage 15, cooldown 0.35, speed 700, radius 7, pierce 3, amount 5, as PIN_LEVELS gives."
[[review.categories.items]]
id = "lantern-orbit"
title = "Lanterns orbit the player and follow it"
description = "On firing, amount lanterns appear evenly spaced on a circle of radius orbit around the player, lantern i at i × 360 / amount degrees from +x, and revolve at LANTERN_ANGULAR_SPEED (180) degrees per second clockwise, following the player."
[[review.categories.items]]
id = "lantern-fires-alone"
title = "Lantern fires whether or not any enemy exists"
description = "A Lantern set appears on an empty field, with no target required."
[[review.categories.items]]
id = "lantern-duration"
title = "Lanterns vanish when their duration is due"
description = "A Lantern set's zones are removed exactly when a ttl of duration is due."
[[review.categories.items]]
id = "lantern-timer"
title = "Lantern's timer covers the set and the gap"
description = "On firing, Lantern's cooldown timer is set to duration plus its current cooldown, so the next set appears once the previous set has been gone for the cooldown."
[[review.categories.items]]
id = "lantern-rehit"
title = "Each lantern re-hits every LANTERN_REHIT"
description = "Each lantern damages a given enemy at most once per LANTERN_REHIT (0.5), and re-hits on exactly that interval while overlapping."
[[review.categories.items]]
id = "lantern-table"
title = "Lantern honors its level table"
description = "At level 1 it is damage 10, cooldown 3, orbit 90, radius 14, duration 3, amount 1; at level 8 it is damage 25, cooldown 2.5, orbit 120, radius 20, duration 4, amount 4, as LANTERN_LEVELS gives."
[[review.categories.items]]
id = "halo-aura-zone"
title = "Halo is a permanent aura centered on the player"
description = "From the first playing tick Halo is held, one aura zone of radius follows the player's center on every tick for as long as Halo is held."
[[review.categories.items]]
id = "halo-pulse"
title = "Halo pulses every cooldown"
description = "Halo pulses on the first playing tick it is held and on every tick its timer is due, each pulse damaging every enemy whose circle overlaps the aura; amount is ignored."
[[review.categories.items]]
id = "halo-radius-per-tick"
title = "Halo's radius follows its level and areaMul each tick"
description = "The aura's radius in a snapshot is the current level's table radius × areaMul, changing on the tick after a Halo or Glass level is gained."
[[review.categories.items]]
id = "halo-table"
title = "Halo honors its level table"
description = "At level 1 the aura is damage 3, pulse 1, radius 80; at level 8 it is damage 8, pulse 0.6, radius 120, as HALO_LEVELS gives."
[[review.categories.items]]
id = "oil-scatter"
title = "Oil Splash scatters puddles at random near the player"
description = "On firing, amount puddles land at independent uniformly random points within OIL_SCATTER (400) of the player and stay where they landed for their duration."
[[review.categories.items]]
id = "oil-fires-alone"
title = "Oil Splash fires whether or not any enemy exists"
description = "Oil Splash's puddles land on an empty field, with no target required."
[[review.categories.items]]
id = "oil-pulse"
title = "A puddle pulses every OIL_PULSE"
description = "A puddle damages every enemy overlapping it on the tick it appears and on every OIL_PULSE (0.3) interval of ticks after, for its life."
[[review.categories.items]]
id = "oil-table"
title = "Oil Splash honors its level table"
description = "At level 1 a puddle is damage 4, cooldown 3, radius 50, duration 2.5, amount 1; at level 8 it is damage 8, cooldown 2, radius 70, duration 4, amount 4, as OIL_SPLASH_LEVELS gives."
[[review.categories.items]]
id = "spark-random-target"
title = "Spark strikes random enemies within SPARK_RANGE"
description = "Each strike lands on a distinct enemy chosen uniformly at random among those within SPARK_RANGE (600) of the player, fewer if fewer exist."
[[review.categories.items]]
id = "spark-none-in-range"
title = "Spark restarts its cooldown with nothing in range"
description = "With enemies alive but none within SPARK_RANGE (600), Spark fires nothing and its timer is set to its current cooldown."
[[review.categories.items]]
id = "spark-splash"
title = "A strike splashes over its area"
description = "A strike deals damage to its target and to every other enemy within area of the target's center on the tick it lands."
[[review.categories.items]]
id = "spark-no-lingering-hitbox"
title = "A strike damages nothing after landing"
description = "A strike zone holds SPARK_FLASH (0.2) and deals no damage on any tick after the one it landed on."
[[review.categories.items]]
id = "spark-table"
title = "Spark honors its level table"
description = "At level 1 a strike is damage 15, cooldown 2, area 40, amount 1; at level 8 it is damage 40, cooldown 1.4, area 70, amount 4, as SPARK_LEVELS gives."
[[review.categories.items]]
id = "shard-aims"
title = "A shard flies toward the nearest enemy or the facing direction"
description = "A shard leaves the player's center toward the nearest enemy, or in the facing direction when no enemy exists, so Shard fires on an empty field."
[[review.categories.items]]
id = "shard-bounces"
title = "A shard bounces off the edges of the view"
description = "When a shard's center would leave the 1280 × 720 view centered on the player's position of that tick, that velocity component reverses and the position clamps to the edge."
[[review.categories.items]]
id = "shard-rehit"
title = "A shard re-hits every SHARD_REHIT"
description = "A shard has infinite pierce and damages a given enemy at most once per SHARD_REHIT (0.5), re-hitting on exactly that interval while overlapping."
[[review.categories.items]]
id = "shard-spread"
title = "Shards spread by SHARD_SPREAD"
description = "Amount n shards fire on the same tick with directions rotated by (i − (n − 1) / 2) × SHARD_SPREAD (15) degrees."
[[review.categories.items]]
id = "shard-table"
title = "Shard honors its level table"
description = "At level 1 a shard is damage 8, cooldown 2.5, speed 500, radius 8, duration 3, amount 1; at level 8 it is damage 20, cooldown 1.8, speed 600, radius 10, duration 5, amount 3, as SHARD_LEVELS gives."
[[review.categories.items]]
id = "sconce-decel-return"
title = "A sconce decelerates and comes back past its launch point"
description = "A sconce launches toward the nearest enemy at speed under constant acceleration −SCONCE_DECEL (600) along its launch direction, reverses at speed / 600 seconds, and returns past its launch point for its duration."
[[review.categories.items]]
id = "sconce-rehit"
title = "A sconce re-hits every SCONCE_REHIT"
description = "A sconce has infinite pierce and damages a given enemy at most once per SCONCE_REHIT (0.5), re-hitting on exactly that interval while overlapping."
[[review.categories.items]]
id = "sconce-spread"
title = "Sconces spread by SCONCE_SPREAD"
description = "Amount n sconces launch on the same tick with directions rotated by (i − (n − 1) / 2) × SCONCE_SPREAD (20) degrees."
[[review.categories.items]]
id = "sconce-table"
title = "Sconce honors its level table"
description = "At level 1 a sconce is damage 12, cooldown 2, speed 600, radius 12, duration 2.5, amount 1; at level 8 it is damage 30, cooldown 1.4, radius 16, amount 4, as SCONCE_LEVELS gives."
[[review.categories.items]]
id = "flare-all-in-radius"
title = "Flare hits every enemy within its radius"
description = "On firing, every enemy whose center is within radius of the player takes damage on that tick, and amount is ignored."
[[review.categories.items]]
id = "flare-burst-drawn"
title = "Flare's burst is drawn for FLARE_FLASH"
description = "A burst zone holds FLARE_FLASH (0.4), is drawn for that long, and deals no damage on any tick after the one it fired on."
[[review.categories.items]]
id = "flare-fires-alone"
title = "Flare fires whether or not any enemy exists"
description = "Flare's cooldown runs and its burst fires on an empty field, with no target required."
[[review.categories.items]]
id = "flare-table"
title = "Flare honors its level table"
description = "At level 1 the burst is damage 100, cooldown 60, radius 640; at level 8 it is damage 500, cooldown 40, radius 640, as FLARE_LEVELS gives."
[[review.categories.items]]
id = "effects-at-hitbox"
title = "Every weapon effect is drawn where its shape is"
description = "Each of the sixteen weapons' effects is drawn over the live shape it damages, at the scaled size, for exactly as long as the zone or projectile exists."

# --- Passives -------------------------------------------------------------------
[[review.categories]]
id = "passives"
title = "Passives"
[[review.categories.items]]
id = "wick-damage"
title = "Wick multiplies weapon damage"
description = "Every weapon's damage per hit is its table damage × (1 + WICK_DAMAGE_PER_LEVEL (0.1) × wick level), a real number."
[[review.categories.items]]
id = "oil-cooldown"
title = "Oil shortens every cooldown, floored at MIN_COOLDOWN"
description = "Every weapon's cooldown, Halo's and Corona's pulse and Flare's burst interval included, is max(MIN_COOLDOWN (0.1), table cooldown × (1 − OIL_COOLDOWN_PER_LEVEL (0.08) × oil level)), read each time a timer is set."
[[review.categories.items]]
id = "glass-area"
title = "Glass scales every weapon length when a shape is created"
description = "Every radius, width, height, orbit, and area a weapon's table gives, projectile collision radii included, is the table value × (1 + GLASS_AREA_PER_LEVEL (0.1) × glass level) read when the shape is created, and a Glass level gained afterward leaves a live projectile, puddle, slash, or Lantern set as it was."
[[review.categories.items]]
id = "glass-area-permanent"
title = "Glass resizes the auras and Chandelier every tick"
description = "The Halo or Corona aura's radius and a Chandelier lantern's orbit and radius follow the areaMul in force on each tick, changing on the tick after a Glass level is gained."
[[review.categories.items]]
id = "brass-armor"
title = "Brass adds flat armor"
description = "armor is BRASS_ARMOR_PER_LEVEL (1) × brass level, up to Brass's max level 3, and reduces every contact hit as specs/world.md states."
[[review.categories.items]]
id = "mirror-amount"
title = "Mirror adds to every amount"
description = "Every weapon with an amount fires table amount + MIRROR_AMOUNT_PER_LEVEL (1) × mirror level projectiles, puddles, strikes, or lanterns, while Halo, Corona, and Flare ignore it and Taper and Pyre cap at 2."
[[review.categories.items]]
id = "bellows-speed"
title = "Bellows multiplies move speed"
description = "moveSpeed is MOVE_SPEED (180) × (1 + BELLOWS_SPEED_PER_LEVEL (0.1) × bellows level), with diagonal speed still equal to cardinal."
[[review.categories.items]]
id = "tallow-hp"
title = "Tallow raises max health and current health together"
description = "maxHp is BASE_MAX_HP (100) + TALLOW_HP_PER_LEVEL (15) × tallow level, and each Tallow level gained raises hp by 15 on the same tick, through whichever path grants it."
[[review.categories.items]]
id = "tinder-recovery"
title = "Tinder adds continuous recovery"
description = "recovery is BASE_RECOVERY (0) + TINDER_RECOVERY_PER_LEVEL (0.5) × tinder level health per second, applied every tick and capped at maxHp."
[[review.categories.items]]
id = "soot-xp"
title = "Soot multiplies experience from gems"
description = "A collected gem adds GEM_VALUES[tier] × (1 + SOOT_XP_PER_LEVEL (0.1) × soot level) experience, a real number."
[[review.categories.items]]
id = "lure-pickup"
title = "Lure widens the pickup radius"
description = "pickupRadius is PICKUP_RADIUS (48) × (1 + LURE_PICKUP_PER_LEVEL (0.25) × lure level), read on every tick, so a gem outside the base radius is attracted on the first tick Lure brings it inside."
[[review.categories.items]]
id = "passive-max-levels"
title = "Each passive stops at its max level"
description = "Wick, Oil, Glass, Bellows, Tallow, Tinder, Soot, and Lure level to 5, Brass to 3, and Mirror to 2, as PASSIVES gives, and a passive at its max is never offered again."
[[review.categories.items]]
id = "speed-duration-fixed"
title = "Projectile speed and duration are never modified"
description = "Every projectile's speed and duration, every re-hit and pulse interval, and every spread and scatter distance are used as written at every passive level."

# --- Progression ----------------------------------------------------------------
[[review.categories]]
id = "progression"
title = "Progression"
[[review.categories.items]]
id = "xp-curve"
title = "The experience curve is XP_BASE + XP_STEP × (level − 1)"
description = "Leaving level 1 takes XP_BASE (5) experience, level 2 takes 15, level 3 takes 25, and so on by XP_STEP (10), so 500 collected experience reaches level 11."
[[review.categories.items]]
id = "overflow-carries"
title = "Overflow experience carries into the next level"
description = "When xp reaches xpToNext, xp falls by xpToNext and level rises by 1, and the remainder counts toward the next level."
[[review.categories.items]]
id = "multiple-levelups-queue"
title = "One gem can queue several level-ups"
description = "A gain that crosses several thresholds at once raises the level that many times and queues that many level-ups in pendingLevelUps."
[[review.categories.items]]
id = "overlay-same-tick"
title = "The level-up overlay opens on the tick the first level-up queues"
description = "A playing tick that ends with pendingLevelUps above 0 runs to completion and opens the levelup overlay with menuIndex 0, freezing the world exactly as that tick left it."
[[review.categories.items]]
id = "chest-before-levelup"
title = "A chest collected on a level-up tick opens first"
description = "A tick that both collects a chest and queues a level-up opens the chest overlay, and the level-up overlay opens at the end of the next playing tick."
[[review.categories.items]]
id = "pool-held-items"
title = "The pool offers +1 level on held items below max"
description = "Every held base weapon below MAX_WEAPON_LEVEL (8) and every held passive below its own max level is a candidate, as a +1 level offer."
[[review.categories.items]]
id = "pool-new-weapons"
title = "The pool offers new base weapons only while a weapon slot is free"
description = "With a weapon slot free, every base weapon not held whose evolution is not held is a candidate; with all WEAPON_SLOTS (6) filled, no new weapon is offered."
[[review.categories.items]]
id = "pool-new-passives"
title = "The pool offers new passives only while a passive slot is free"
description = "With a passive slot free, every passive not held is a candidate; with all PASSIVE_SLOTS (6) filled, no new passive is offered."
[[review.categories.items]]
id = "pool-excludes-evolved"
title = "Evolved weapons and their bases are never candidates"
description = "An evolved weapon is never offered, and while it is held the base weapon it came from is not a candidate either."
[[review.categories.items]]
id = "offers-three-distinct"
title = "An overlay offers OFFER_COUNT distinct candidates"
description = "Each overlay presents OFFER_COUNT (3) distinct candidates drawn uniformly at random without replacement, and every candidate of a pool smaller than 3."
[[review.categories.items]]
id = "pool-recomputed"
title = "A queued second overlay draws from a fresh pool"
description = "When level-ups remain queued after a choice, the next overlay opens immediately with a pool computed from the slots as the acceptance left them."
[[review.categories.items]]
id = "lamp-oil-fallback"
title = "An empty pool offers lamp-oil alone"
description = "When no candidate exists the overlay offers exactly one item, lamp-oil, tagged NEW, which heals LAMP_OIL_HEAL (30) capped at maxHp and fills no slot."
[[review.categories.items]]
id = "offer-tags"
title = "Each offer shows icon, name, and NEW or LEVEL n"
description = "Every offer shows the item's produced icon, its display name, and OFFER_NEW_TEXT (NEW) for an item not held or LEVEL_LABEL (LEVEL) with the level it would become."
[[review.categories.items]]
id = "accept-new-item"
title = "Accepting a new item fills the first free slot at level 1"
description = "A new weapon or passive enters the first free slot of its kind at level 1, and a new weapon's cooldown timer starts at 0."
[[review.categories.items]]
id = "accept-level"
title = "Accepting a held item raises it one level"
description = "A held item's level rises by 1, its table row and derived-stat terms read the new level from the next tick, and a weapon's running timer keeps counting."
[[review.categories.items]]
id = "overlay-navigation"
title = "The overlay is navigated with wrap and confirm"
description = "up and down move the highlight with wrap at both ends, confirm accepts the highlighted offer, and back and pause do nothing on the overlay."
[[review.categories.items]]
id = "slots-limit"
title = "Slots hold six weapons and six passives in acquisition order"
description = "weapons and passives each fill in slot order to WEAPON_SLOTS (6) and PASSIVE_SLOTS (6), and an item keeps its slot for the run."

# --- Evolutions -----------------------------------------------------------------
[[review.categories]]
id = "evolutions"
title = "Evolutions"
[[review.categories.items]]
id = "recipe-eligibility"
title = "A recipe needs the maxed base plus its passive at any level"
description = "A base weapon evolves only when held at MAX_WEAPON_LEVEL (8) with its recipe passive held at any level and a chest is opened; a weapon below 8 or without its passive stays as it is."
[[review.categories.items]]
id = "chest-first-in-slot-order"
title = "A chest evolves the first eligible weapon in slot order"
description = "Opening a chest checks the held weapons first slot first and evolves the first eligible one only, so one chest evolves at most one weapon."
[[review.categories.items]]
id = "evolved-takes-slot"
title = "An evolved weapon replaces its base in the same slot"
description = "The evolved weapon takes the base's slot with level 1, and the base weapon is gone from the loadout."
[[review.categories.items]]
id = "evolved-timer-zero"
title = "An evolved weapon's timer starts at 0"
description = "The evolved weapon's cooldown timer is 0 on evolution, so it fires on the first playing tick it is held."
[[review.categories.items]]
id = "recipe-passive-kept"
title = "The recipe passive stays held"
description = "After an evolution the recipe passive is still in its slot at its level."
[[review.categories.items]]
id = "chest-fallback-level"
title = "A chest with nothing eligible levels a random held item"
description = "When no weapon is eligible the chest grants one level to a uniformly random held weapon below 8 or passive below its max, and chestResult reports the item and the level it became."
[[review.categories.items]]
id = "chest-fallback-heal"
title = "A chest with nothing to level heals CHEST_HEAL"
description = "When no held item is below its max the chest heals CHEST_HEAL (30) capped at maxHp and chestResult reports the heal."
[[review.categories.items]]
id = "pyre"
title = "Pyre: Taper's slash on both sides that heals per hit"
description = "Pyre (Taper at 8 plus Wick) slashes 200 × 60 on both sides every firing at damage 60 and cooldown 1.2, and each enemy hit heals the lamplighter PYRE_HEAL (1), capped at maxHp."
[[review.categories.items]]
id = "beacon"
title = "Beacon: Ember's bolt, fast and piercing"
description = "Beacon (Ember at 8 plus Oil) fires at the nearest enemy every 0.25 seconds: damage 20, speed 500, radius 10, pierce 2, duration 2, amount 1 plus amountBonus, as BEACON_STATS gives."
[[review.categories.items]]
id = "hail"
title = "Hail: Pin's dart in a fan of six"
description = "Hail (Pin at 8 plus Mirror) fires 6 plus amountBonus darts in the facing direction spread by PIN_SPREAD: damage 15, cooldown 0.5, speed 700, radius 7, pierce 3, duration 1.5, as HAIL_STATS gives."
[[review.categories.items]]
id = "chandelier"
title = "Chandelier: Lantern's orbit made permanent"
description = "Chandelier (Lantern at 8 plus Glass) keeps 4 plus amountBonus lanterns of radius 20 on an orbit of 120 at all times with ttl null and its timer at 0, at damage 25 and re-hit LANTERN_REHIT (0.5), as CHANDELIER_STATS gives."
[[review.categories.items]]
id = "chandelier-respaces"
title = "Chandelier replaces its lanterns when amount changes"
description = "On the tick Chandelier's amount changes, its lantern zones are replaced by amount new zones with fresh ids and empty hits, evenly spaced from the angle the lowest-id lantern held."
[[review.categories.items]]
id = "corona"
title = "Corona: Halo's aura that heals per kill"
description = "Corona (Halo at 8 plus Tinder) pulses a radius-150 aura every 0.5 seconds for 12 damage, keeps the hum, and heals the lamplighter CORONA_HEAL (1) per enemy a pulse kills, as CORONA_STATS gives."
[[review.categories.items]]
id = "corona-new-zone"
title = "Corona replaces the Halo aura zone"
description = "On the first playing tick after Halo evolves, the aura zone with weapon halo is gone and one with weapon corona and a fresh id is present."
[[review.categories.items]]
id = "blaze"
title = "Blaze: Oil Splash's puddles, five at a time"
description = "Blaze (Oil Splash at 8 plus Soot) scatters 5 plus amountBonus puddles of radius 70 every 2 seconds, each lasting 4 seconds and dealing 8 every BLAZE_PULSE (0.2), as BLAZE_STATS gives."
[[review.categories.items]]
id = "passives-apply-to-evolved"
title = "Passives still apply to evolved weapons"
description = "damageMul, cooldownMul, areaMul, and amountBonus apply to an evolved weapon's fixed row exactly as to a base weapon's table row."
[[review.categories.items]]
id = "evolved-never-leveled"
title = "An evolved weapon is never leveled further"
description = "An evolved weapon has a single level, is never a level-up offer, and is never the item a chest's fallback levels."

