# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "wick"

# Human-readable display name for this test case.
name = "Wick"

# Relative difficulty, surfaced on the site. Easy: the case is a great deal of
# BREADTH, not depth of reasoning. Every rule is a table row or a one-line
# formula; there is no physics to tune, no opponent to model, and no solver.
# What it measures is whether a build carries sixteen weapons, ten passives,
# thirteen enemies, a twenty-window schedule, and a full produced asset set all
# the way through without dropping or blurring a row. The size of the job is
# accounted for in `max_runtime_hours`, not here.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["survival", "action", "2d", "roster"]

# Short site-facing abstract, shown on the test case card. NOT seeded.
summary = """
A survival game of one lamplighter against a moth-choked night: the player \
only moves, sixteen weapons fire on their own, thirteen enemies arrive on a \
ten-minute schedule that ends with the Dark, and the build draws every sprite \
and produces every sound itself."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded.
description = "description.md"

# Required per-version changelog entry. NOT seeded.
changelog = "changelog.md"

# Handlebars prompt template, rendered per run and handed to the model as the
# build instruction. It branches on `engine.slug`, exactly as the specs do, so a
# run on each engine is told what it is handed and what it must write. The
# harness prepends the standing full-stack asset-quality preamble at render time,
# so this template does not restate it.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, before the harness session is stopped.
# Wick is a large build by count: ten weapons with eight-row tables and six
# evolved rows, ten derived stats, thirteen enemy behaviors, a spawn director
# with twenty windows and seven events, the level-up economy, nine screens, the
# debug surface, and a produced set of some forty sprites and sheets, twenty-seven
# icons, fourteen cues, and a music bed. Eight hours is comfortably more than a
# healthy build needs while still bounding a runaway session.
max_runtime_hours = 8

# The test type: an end-to-end playable game whose assets the model also
# produces during the run, on the full-stack-2d image that this case's default
# `asset_dimension` selects, with the six 2D asset tools on PATH. A root key, so
# it sits above the first table header.
type = "full-stack"

# Init command, run in the container once the workspace and specs are seeded and
# before the harness starts. `npm install` (not `npm ci`) because an engine run
# writes the vendored engine's `file:` dependency into `package.json` at seed
# time, so the lockfile completes here; the same command downloads the Playwright
# Chromium build so the model can look at its game in a browser.
init = "npm install && npx playwright install chromium"

# NOTE: no `assets = [...]` of pre-made art, deliberately: the model produces the
# game's sprites and audio itself, during the run (`specs/assets.md`). And no
# `packages`: Wick plays no particle system, so no runtime library ships into the
# run; any flourish beyond the produced sprites is drawn in code.

# Variants: exactly one runs per run. Wick declares exactly ONE: every run is
# the same game, and the roster is content within it, not variants. Nothing in
# the seeded set branches on the variant; the only axis the specs branch on is
# `engine.slug`. A root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on: the frame loop and the delta time it hands the game, the input
# actions a player drives it with, the audio bus with its looping cues, asset
# loading, and the on-screen diagnostics; one of them also owns rendering, the
# camera, and the gameplay framework the game is written inside. It is a run
# dimension, chosen per run alongside the model, the harness, and the variant,
# and recorded on the run; it is not a property of the game.
#
# Wick supports three, and the game is the same night under all of them: every
# contact is the simulation's own circle and rectangle math over the state on
# EVERY engine, so no engine collider or collision event stands in for the rules
# `specs/world.md` and `specs/weapons.md` fix. What differs is how much of the
# build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the fixed-tick loop, the canvas fit, the keyboard, the audio
#                     with its two loops, the overlay, and the `window.__wick`
#                     surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the entry module
#                     around it (`src/main.ts`, plus the `src/game.ts` the build
#                     writes: the state, the debug surface `initialize` returns
#                     beside it, and the game's update and render).
#   - `structured-2d` vendors its framework engine the same way and seeds the same
#                     entry module; the build writes its game module (the game
#                     definition, the single level, its mode, its state and its
#                     actors) and the debug surface its instance's `initialize`
#                     returns.
# What does NOT differ is the asset-production pass. Every engine run still
# produces the sprites, the sheets, the icons, the cues, and the music bed with
# the on-`PATH` binaries, because no engine supplies art or sound;
# `specs/assets.md` is the same contract under all three.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. `min_version` is the 1.0.0 contract the specs
# are written against, and there is deliberately no `max_version`, so a later 1.x
# or 2.x from the host package store is accepted as it lands. Widening or moving
# a range means a new case version, so the pin is the statement that THIS spec
# set matches THIS contract.
#
# This declaration deliberately does not describe an engine. An engine ships its
# own documentation from its own package and seeding puts it in the run for the
# model to read, so the specs seeded from this folder never restate an engine's
# API. Where a spec speaks of the runtime it states only what is specific to
# THIS game under it: which surfaces the build still supplies, Wick's action
# list, and Wick's cue names.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same TypeScript, lint, format and test configuration
# the `[toolchain]` commands below run against and an `index.html` holding the
# 1280 x 720 stage canvas. What differs is how much of the build is supplied with
# them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own fixed-tick loop, canvas
#                     fit, keyboard input, audio with looping cues, diagnostics
#                     overlay and `window.__wick` surface, and every figure this
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the two case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes:
#                     the stage and the tick, the lamplighter's figures, every
#                     weapon table and evolved row, the passive terms, the
#                     progression figures, the enemy rows, the spawn windows and
#                     events, the screen copy, the action bindings, the cue
#                     names, and the paths the produced files land at; the look
#                     is NOT among them) and `src/main.ts` (the browser entry).
#                     The build writes `src/game.ts`: the state, the debug
#                     surface its `initialize` returns beside that state, and the
#                     game's update and render.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules (its `constants.ts`
#                     also carries the level name and the tag vocabulary). The
#                     build writes `src/game.ts`: the game definition the engine
#                     drives, its single level, its mode, its live state, and its
#                     actors, and the debug surface its instance's `initialize`
#                     returns.
#
# Under both engines the seeded `src/game.ts` is a stub written against types the
# build has yet to declare, so a freshly seeded workspace does not type-check:
# that failing typecheck is the starting point rather than a broken seed. Under
# every engine the produced assets are committed under `assets/` at the root of
# the run and loaded from there.
#
# This table must name EXACTLY the engines the case supports; the resolver checks
# both directions. The seeded files land at the run root
# (`workspaces/none/package.json` seeds to `package.json`). There is one starter
# project per engine and no per-variant set: the single `base` variant declares
# no `[workspaces]` override of its own.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# The audio packs the run container is staged with. `sfx-sample` and `music` see
# these and nothing else, and a tool config that names no pack plays the first
# pack of that kind.
#
# `combat-core` is the sample pack the night's hits, kills, and hurts are layered
# over, carrying the snaps, short impacts, and fire crackle a lamp under siege
# needs at the rate the late night plays them. The bed has to hold a ten-minute
# run without wearing out (`specs/assets.md`) and the city it plays under is a
# gothic one, so `cinematic` is the bank: sustained strings, choir, harp, and
# taiko sit under a run the way a score does. A general-MIDI band and a synth
# rack would each put the city in a different century, so neither is staged.
[audio]
packs = ["combat-core@0.1.0", "cinematic@0.1.0"]

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. `npm ci` is deliberate: it requires a committed lockfile.
# The build must be self-contained: it bundles the committed produced assets
# without invoking the asset tools, which are on `PATH` only while the run is live
# (`specs/assets.md`).
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once the install
# has completed. `typecheck` GATES: a non-zero exit rates the run broken. The
# other three are recorded; `test` additionally records the count and coverage
# the build's own suite reports. These four are exactly the commands
# `specs/overview.md` tells the build will be run over the finished repository.
# The three seeded `.prettierignore` files exclude Markdown (so `specs/` and the
# engine's docs), the vendored engine, and the produced assets, so `format` walks
# the build's own files alone.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded `specs/instrumentation.md`
# documents the same surface independently, as an ordinary debugging feature the
# game needs. It is what every review item below poses its scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__wick` once the game has initialized, so the
# handle is what a person opening the console of such a build finds. An engine run
# has NO global at all: the build writes the surface, its `initialize` returns it
# (beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d`), and a caller reads it back off `engine.debug`. One handle,
# three ways to reach the same operations.
#
# `tick_hz` is Wick's fixed simulation rate. The engineless surface advances the
# game in whole frames (`step(ticks)`), each a tick on `playing`, rather than in
# seconds, so there is no rounding and no ambiguity about what a step means, and
# this is the rate the validation runtime relates that stepping back to real time
# with: one tick is 1/60 of a second, so a second of simulated time is 60 ticks.
# Under an engine it is the step a scripted clock takes by default, so the same
# scenario walks the same number of ticks on all three engines and one tolerance
# covers every suite. It matches the timestep `specs/overview.md` and
# `specs/world.md` fix, and every timer on the checklist (the 81-tick Taper
# cooldown, the 30-tick contact re-hit, the 18-tick oil pulse, the 6-tick walk
# frame) is stated in these ticks.
[instrumentation]
handle = "__wick"
tick_hz = 60

# The specs. Every one is a COMMON spec, seeded for EVERY run; the single variant
# declares none of its own. The specification is decomposed by concern:
# `overview` the game and the project, `world` the plane, the camera, the order
# of a tick, the timer rule, the lamplighter, contact, the endings, and the gems
# and pickups, `weapons` the ten base weapons and their tables, `evolutions` the
# six recipes, the chest result, and the evolved rows, `passives` the ten
# passives and the derived stats, `progression` xp, slots, offers, and the two
# overlays, `enemies` the roster and the spawn director, `controls` the actions,
# `state` the state shape, `instrumentation` the debug surface and the driver
# switches, `ui` the screens and audio, and `assets` the production contract.
#
# A source is an `.hbs` template only where it actually branches, and the one
# axis to branch on is `engine.slug`: what the build is handed and what it must
# write. A spec's `dest` defaults to its `source` with a trailing `.hbs`
# stripped, so an `.md.hbs` source seeds to the same `.md` path and a plain `.md`
# source is seeded verbatim. Nothing branches on the variant.
[[spec]]
source = "specs/overview.md.hbs"

# The world: the plane, the camera, the order of a tick and the timer rule, the
# lamplighter's movement, facing, health, contact damage and recovery, the two
# endings, and the gems and pickups. Unbranched: the world is the same simulation
# under every engine.
[[spec]]
source = "specs/world.md"

[[spec]]
source = "specs/weapons.md"

[[spec]]
source = "specs/evolutions.md"

[[spec]]
source = "specs/passives.md"

[[spec]]
source = "specs/progression.md"

[[spec]]
source = "specs/enemies.md"

# The actions a player drives the game with and the keys bound to them. It
# branches on the engine, because an engine run declares Wick's actions on the
# engine's input map while an engineless build listens for the key events itself.
[[spec]]
source = "specs/controls.md.hbs"

# What the game's state carries. It branches on the engine: an engineless build
# shapes its own state around the contract, a `simple-2d` build declares the
# `WickState` value the engine holds, and a `structured-2d` build declares it as
# a class extending the engine's game state.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a render-free,
# fixed-timestep core, the nine driver switches, an API to pose and inspect the
# game from code, and a read-only debug overlay. It branches on the engine, for how the
# surface is reached, what shape its operations take, and the `setAutoStep`,
# `step`, and `advance` trio only an engineless build carries (under an engine the
# runtime's own clock is driven instead).
[[spec]]
source = "specs/instrumentation.md.hbs"

# The screens, the HUD, and the audio. It branches on the engine for how the cues
# and the two loops are played and muted.
[[spec]]
source = "specs/ui.md.hbs"

# The asset-production contract: the sprites, sheets, icons, cues, and music bed
# the model must PRODUCE with the on-PATH binaries during the run, the path each
# file lands at, the bar each is held to, and how it is loaded and animated. It
# branches on the engine, because an engineless build loads and decodes its own
# files while an engine run goes through the engine's asset loader and cue bus.
# This is the defining spec of a full-stack case.
[[spec]]
source = "specs/assets.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for
# how motion is captured (a gzipped recording from the engine's own draw-command
# recorder on an engine run, screenshots and a short clip under `none`); it
# seeds to `specs/showcase.md`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`. Wick fixes no palette,
# no sprite artwork, and no screen styling: every build is expected to look
# different, so there is no honest picture to compare against. Every piece of
# evidence a reviewer sees is captured from the build itself by the validators
# below, beside the same capture from the reference build.

# Scoring domains. A run is rated on each independently, and the run's overall
# rating is the WORST across them: a beautiful night cannot mask a weapon that
# never fires, and a correct roster cannot mask placeholder sprites. Each review
# item below names the domains its failure lowers and how far, through `domains`
# and `failure_cap`; the reviewer's judgement lives in the separate AESTHETIC
# rating, which is the look, the polish, and the feel.
[[domain]]
id = "survival"
name = "Survival"
description = "Movement, contact, and pressure: walking the lamplighter through a closing crowd, taking and recovering damage, and the arc of a night from the first moth to the Dark and dawn."

[[domain]]
id = "arsenal"
name = "Arsenal"
description = "How the weapons and passives feel and read: each tool firing on its own rhythm at the target and shape the specification gives it, a new level or passive visibly changing the fight, and an evolution reading as a transformation."

[[domain]]
id = "progression"
name = "Progression"
description = "Level-ups, offers, chests, and evolutions: gems filling the bar, the overlay's choices, slots filling in order, and a chest paying off a maxed weapon carried beside its passive."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "The produced sprites, animation, icons, and audio, and the HUD and screens they sit in: the night's look and its originality, thirteen silhouettes told apart, effects drawn where they hit, and the sound of the night."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY, a bare name grouping the points a
# reviewer grades, and each `[[review.categories.items]]` under it is one graded
# review item, worth one point (the default weight), so a category is worth the
# number of items it holds and there is no fractional scoring. A category carries
# no prose of its own; each review item states in `description` the claim checked
# against the build, and its verdict is recorded under the composite id
# `<category id>.<item id>`. The checklist is reporter-side material, never
# seeded into a run, so the model never sees it; each item restates a requirement
# the seeded specification already states, in its vocabulary.
#
# EVERY item names its validator. `validation.script` is the suite that decides
# the item, at `validation/<engine>/<category id>/<item id>.test.ts` for the
# engine the run selected: the path is relative to the engine's validator
# project, so the same path serves all three suites and a point cannot be decided
# under one engine and left to the reviewer under another. `outputs` names the
# media the suite captures for the reviewer, a still (`image`) where a posed state
# is the evidence and a recording (`replay`) where motion is. Every item is cut to
# ONE observable behavior in ONE direction, posed through the instrumentation
# surface and read back, so a build fails exactly the rule it breaks: each
# movement key is its own item, each screen transition is its own item, each
# weapon table row is its own item, each passive formula, each enemy row, each
# spawn window, each scripted event, each cue, and each edge case the rules imply
# (the inclusive attraction boundary, the coincident spawn heading, the cap met
# with a swarm due, the chest collected on the ending tick) is an item of its own.
# Every threshold traces to a figure or rule in the seeded specs, with the
# one-tick tolerance the timer rule of `specs/world.md` implies.
#
# EVERY item carries `domains` and `failure_cap`. `domains` names the scoring
# domains a failure lowers: a rule of the world, the enemies, the director, the
# screens' flow, or the run's endings lowers `survival`; a weapon or passive rule
# lowers `arsenal`; a rule of experience, offers, slots, chests, or evolutions
# lowers `progression`; an item about what is drawn or heard lowers
# `presentation`; and the surface every other item is driven through lowers all
# four. `failure_cap` is the highest functional rating those domains may reach
# while the item fails; each domain takes the LOWEST cap among its failing items,
# and a domain with no failing item is flawless. The caps are graded by how much
# of the game a failure takes away: `broken` where the game cannot be played as
# intended (no debug surface, a snapshot that cannot be read, a lamplighter that
# does not move, a weapon that never fires, an enemy that never dies or never
# hurts, an enemy that never spawns, a gem that never levels the lamp, a run that
# cannot start or never ends); `scuffed` where a rule the game is built on is
# noticeably wrong (a table row, a formula, a targeting rule, a spawn window, an
# evolution that does not happen, a cue that never plays); `passable` where the
# fault is a tolerance, an edge case, a ceiling, or a secondary path; and `great`
# where it is a cosmetic detail (a second key bound to an action a first key
# already covers, a piece of screen copy, a frame of an animation). No item caps
# at `flawless`: a failure always costs something.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The surface every other point is driven through, and a deliverable of the
# case in its own right. Each operation is posed and read back one at a time,
# each screen setScreen reaches is its own point, each of the nine driver
# switches is checked alone, each refusal the specification states is a point of
# its own, the two rectangle readings are decided on what they report rather
# than on what the pointer does with them, and the four overlay points close the
# category, so a surface that is missing, hollow, or wired to nothing fails
# here by name rather than only as every other suite failing to run. Under an
# engine the clock is the harness's ConstantClock and the overlay's toggle is
# the engine's, so the points that name setAutoStep, step, advance, and the
# backtick pass by construction there and are decided in full under none.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"

[[review.categories.items]]
id = "surface-present"
title = "The debug and automation surface is present"
description = "Every operation specs/instrumentation.md names is present as a function on the surface, reached as window.__wick in an engineless build and off engine.debug in an engine build, version reads 1, and the surface is live: a pose changes the running game and snapshot reads the change back."
domains = ["survival", "arsenal", "progression", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [ { id = "surface", name = "The driven surface", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed run holding enemies, projectiles, zones, gems, pickups, held weapons, and held passives, snapshot returns every field specs/instrumentation.md documents with its documented type, the nested player, enemy, projectile, zone, gem, pickup, weapon, and passive entries and the almanacTab, almanacScroll, and run.hurtFlash fields included, with values matching what was posed."
domains = ["survival", "arsenal", "progression", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [ { id = "posed", name = "The posed run", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-fixed-shape"
title = "The snapshot shape is fixed on every screen"
description = "The snapshot carries every documented field with its documented type on whichever of the nine screens the game stands on, so the shape a reader reads is the same one everywhere: no field appears only on some screens and none is dropped on others."
domains = ["survival", "arsenal", "progression", "presentation"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-fixed-shape.test.ts", outputs = [ { id = "screens", name = "The screen sweep", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-derived-stats"
title = "The snapshot derives the lamplighter's stats from the loadout"
description = "With Tallow 2, Brass 1, Bellows 3, and Lure 2 posed and the level posed to 4, the snapshot reads maxHp 130, armor 1, moveSpeed 234, pickupRadius 72, and xpToNext 35, each computed from the formulas specs/instrumentation.md tables."
domains = ["arsenal", "progression"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-derived-stats.test.ts", outputs = [ { id = "stats", name = "The derived stats read off the posed loadout", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-derives-time"
title = "The snapshot derives time from the clock"
description = "With the tick posed to 4500, the snapshot reads time 75, the tick over TICK_HZ."
domains = ["survival"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-derives-time.test.ts", outputs = [ { id = "time", name = "time derived from the posed tick", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-derives-spawn-window"
title = "The snapshot derives spawnWindow from the clock"
description = "With the tick posed to 4500, the snapshot reads spawnWindow 2, min(19, floor(time / SPAWN_WINDOW))."
domains = ["survival"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-derives-spawn-window.test.ts", outputs = [ { id = "window", name = "spawnWindow derived from the posed tick", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-derives-alive-commons"
title = "The snapshot derives aliveCommons from the field"
description = "With a moth, two gnats, and a mothwing alive, the snapshot reads aliveCommons 1, the count that excludes gnats, elites, and the Dark."
domains = ["survival"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-derives-alive-commons.test.ts", outputs = [ { id = "commons", name = "aliveCommons over a posed field", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-pool-on-levelup"
title = "The snapshot reports the candidate pool on levelup"
description = "On levelup, pool lists the candidate pool of specs/progression.md computed from the slots as they stand, each id once, in BASE_WEAPON_IDS order then PASSIVE_IDS order, and offers is a subset of it."
domains = ["progression"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-pool-on-levelup.test.ts", outputs = [ { id = "pool", name = "The pool beside the offers drawn from it", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-reports-almanac-tab"
title = "The snapshot reports the almanac's tab"
description = "On almanac, almanacTab reads the tab the screen shows, 0 on arriving and the tab reached after a real tab change."
domains = ["survival", "arsenal", "progression", "presentation"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-reports-almanac-tab.test.ts", outputs = [ { id = "tab", name = "The almanac tab read back", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-reports-almanac-scroll"
