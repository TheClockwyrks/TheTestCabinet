description = "The Dark spawns with the ENEMIES row for dark, its hp exactly 10000 and unscaled."
[[review.categories.items]]
id = "chase-recomputes-heading"
title = "A chaser re-aims at the lamplighter every tick"
description = "A chasing enemy's heading is the unit vector from its center to the lamplighter's center, recomputed on every tick before it steps speed × TICK_DT along it, so it turns as the lamplighter moves."
[[review.categories.items]]
id = "gnat-drift"
title = "A gnat keeps the heading it spawned with"
description = "A gnat advances speed × TICK_DT along its spawn heading on every tick and never re-targets, so one that misses flies on until it despawns."
[[review.categories.items]]
id = "wisp-weave"
title = "A wisp weaves beside its chasing anchor"
description = "A wisp's anchor chases the lamplighter and its position is the anchor plus the perpendicular (heading rotated +90 degrees) times WISP_AMPLITUDE (40) × sin(2π × age / WISP_PERIOD (1))."
[[review.categories.items]]
id = "small-gem-drops"
title = "Moth, bat, rat, and gnat drop a small gem"
description = "Each of the four small-gem rows drops one small gem at its center on the tick it dies."
[[review.categories.items]]
id = "medium-gem-drops"
title = "Beetle, wisp, spider, crow, and shade drop a medium gem"
description = "Each of the five medium-gem rows drops one medium gem at its center on the tick it dies."
[[review.categories.items]]
id = "large-gem-drops"
title = "A hound drops a large gem"
description = "A hound drops one large gem at its center on the tick it dies."
[[review.categories.items]]
id = "elite-drops-chest"
title = "Mothwing and the Owl drop a chest"
description = "A mothwing or an owl drops one chest at its center on the tick it dies, and no gem."
[[review.categories.items]]
id = "dark-drops-nothing"
title = "The Dark drops nothing"
description = "The Dark's death leaves no gem, no chest, no bread, and no draft."
[[review.categories.items]]
id = "elites-never-despawn"
title = "Elites and the Dark never despawn by distance"
description = "A mothwing, an owl, and the Dark stay on the field farther than DESPAWN_DISTANCE (1200) from the lamplighter."
[[review.categories.items]]
id = "dark-flare-immune"
title = "The Dark is immune to Flare"
description = "A Flare burst deals the Dark no damage, as FLARE_IMMUNE lists, while every other weapon damages it as any enemy."
[[review.categories.items]]
id = "hp-scaling"
title = "Common health scales by HP_SCALE_PER_MINUTE at spawn"
description = "A common enemy spawns with maxHp = row hp × (1 + HP_SCALE_PER_MINUTE (0.15) × floor(time / 60)), a real number kept for its life whatever the clock does afterward."
[[review.categories.items]]
id = "spawn-ring"
title = "Spawns land on the ring at SPAWN_DISTANCE"
description = "A director spawn lands exactly SPAWN_DISTANCE (760) from the lamplighter's center at a uniformly random angle."
[[review.categories.items]]
id = "despawn"
title = "Commons beyond DESPAWN_DISTANCE are removed"
description = "A common enemy, gnats included, farther than DESPAWN_DISTANCE (1200) from the lamplighter is removed with no gem, no kill, and no cue."
[[review.categories.items]]
id = "window-table"
title = "Each window spawns its types at its interval"
description = "In window min(19, floor(time / SPAWN_WINDOW (30))) the director spawns one enemy of a type chosen uniformly from that window's types every interval seconds, from moths every 1.0 second in window 0 to hound, shade, spider every 0.1 in window 19, as SPAWN_WINDOWS gives."
[[review.categories.items]]
id = "spawn-timer-resets"
title = "The spawn timer is 0 at run start and on every window change"
description = "A spawn lands on the first tick of a run and on the first tick of every window, then every interval seconds between."
[[review.categories.items]]
id = "spawn-cap"
title = "The cap holds the timer's spawns"
description = "With aliveCommons, the live commons other than gnats, at or above the window's cap, the timer rests at 0 and no window spawn lands until there is room."
[[review.categories.items]]
id = "outside-the-cap"
title = "Gnats, elites, and the Dark stand outside the cap"
description = "Gnats, mothwings, the Owl, and the Dark are never counted in aliveCommons and spawn whether or not the cap is full."
[[review.categories.items]]
id = "gnat-swarm"
title = "A gnat swarm lines up and drifts across the lamplighter"
description = "At 1:00, 4:00, and 7:00, SWARM_SIZE (24) gnats spawn at once, evenly spaced along a SWARM_LINE (720) line centered SPAWN_DISTANCE from the lamplighter perpendicular to a random direction d, all heading −d."
[[review.categories.items]]
id = "elite-events"
title = "Mothwings arrive at 2:00 and 5:00 and the Owl at 7:30"
description = "A mothwing spawns at a spawn point on the exact tick of 2:00 and again at 5:00 whether or not the first lives, and an owl at 7:30, each once per run."
[[review.categories.items]]
id = "dark-event"
title = "The Dark arrives at 9:00"
description = "The Dark spawns at a spawn point on the exact tick of 9:00, once per run, and pursues the lamplighter until dawn."
[[review.categories.items]]
id = "events-only-with-director"
title = "Scripted events fire only while the director runs"
description = "Every event in EVENTS fires on exactly its tick and only while autoSpawn is true, is recorded in firedEvents, and never fires twice."
[[review.categories.items]]
id = "auto-spawn-off"
title = "Turning the director off stops spawns and events"
description = "With autoSpawn false no window spawn and no scripted event fires, nothing already alive is removed, and turning it back on resumes where the timer and fired events stand."

# --- Gems and pickups -----------------------------------------------------------
[[review.categories]]
id = "pickups"
title = "Gems and pickups"
[[review.categories.items]]
id = "gem-values"
title = "Gem tiers are worth GEM_VALUES"
description = "A collected small gem adds 1, a medium 3, and a large 10 experience before Soot, as GEM_VALUES gives."
[[review.categories.items]]
id = "gem-attract"
title = "A gem within the pickup radius becomes attracted"
description = "A gem whose center is within pickupRadius (PICKUP_RADIUS (48) with no Lure) of the lamplighter becomes attracted on that tick and stays attracted."
[[review.categories.items]]
id = "gem-flight"
title = "An attracted gem flies at GEM_SPEED"
description = "An attracted gem moves GEM_SPEED (600) × TICK_DT toward the lamplighter's center on every tick."
[[review.categories.items]]
id = "gem-stops-at-center"
title = "An attracted gem stops at the lamplighter's center"
description = "An attracted gem closer than one tick's flight to the lamplighter's center lands on the center rather than passing it."
[[review.categories.items]]
id = "gem-collect"
title = "A gem collects at COLLECT_RADIUS"
description = "A gem is removed and its experience added on the tick, after it moves, on which it is within COLLECT_RADIUS (8) of the lamplighter's center."
[[review.categories.items]]
id = "chest-collect"
title = "A chest is collected on contact"
description = "A chest is collected on the tick the distance between its center and the lamplighter's is less than PICKUP_ITEM_RADIUS (16) plus PLAYER_RADIUS, at every Lure level."
[[review.categories.items]]
id = "chest-opens-overlay"
title = "Collecting a chest opens the chest overlay"
description = "The tick that collects a chest runs to completion and ends with screen chest and chestResult set."
[[review.categories.items]]
id = "one-chest-per-tick"
title = "One chest is collected per tick"
description = "When two chests meet the collection condition on one tick, the lowest-id chest alone is collected and the other waits for the next playing tick."
[[review.categories.items]]
id = "bread-heals"
title = "Bread heals BREAD_HEAL on contact"
description = "Collecting bread heals BREAD_HEAL (30) capped at maxHp."
[[review.categories.items]]
id = "draft-attracts-all"
title = "A draft attracts every gem on the field"
description = "Collecting a draft makes every gem on the field attracted at once."
[[review.categories.items]]
id = "drop-draws"
title = "A common kill draws for bread, then for a draft"
description = "Each common kill draws once from the seeded generator for bread with probability BREAD_CHANCE (0.02) and, only when bread did not drop, once more for a draft with DRAFT_CHANCE (0.005), so at most one of the two drops beside the gem."
[[review.categories.items]]
id = "pickups-persist"
title = "Gems and pickups never despawn"
description = "A gem or pickup stays on the field at any distance until it is collected."

# --- Screens --------------------------------------------------------------------
[[review.categories]]
id = "screens"
title = "Screens"
[[review.categories.items]]
id = "title-copy"
title = "The title screen shows its copy and menu"
description = "The game opens on TITLE_TEXT (WICK), TAGLINE_TEXT (KEEP THE LIGHT), and TITLE_ITEMS (LIGHT THE LAMP, HOW TO PLAY) with menuIndex 0."
[[review.categories.items]]
id = "title-navigation"
title = "The title menu wraps and confirms"
description = "On title, up and down move the highlight with wrap at both ends, confirm takes the highlighted item, and back does nothing."
[[review.categories.items]]
id = "howto-screen"
title = "The how-to screen explains the game"
description = "HOW TO PLAY says, in a player's words, that only movement is steered, that tools fire on their own, that gems level the lamp with a choice of one from three, the six tool and six trinket slots, chests transforming a maxed tool beside its trinket, dawn at 10:00, and the controls with their key names."
[[review.categories.items]]
id = "howto-back"
title = "back leaves the how-to screen"
description = "back on howto returns to title with menuIndex 0."
[[review.categories.items]]
id = "hud-health"
title = "The HUD shows health as a bar with numbers"
description = "A bar filled to hp / maxHp with both numbers beside it is legible over the world."
[[review.categories.items]]
id = "hud-experience"
title = "The HUD shows experience with the level"
description = "A bar filled to xp / xpToNext, labeled LEVEL_LABEL (LEVEL) and the current level, is legible over the world."
[[review.categories.items]]
id = "hud-clock"
title = "The HUD clock counts up as m:ss"
description = "The run clock shows as m:ss from 0:00 in whole seconds with two-digit seconds, and reads 10:00 at dawn."
[[review.categories.items]]
id = "hud-kills"
title = "The HUD shows the kill count"
description = "The kill count is shown and rises by one on every enemy death."
[[review.categories.items]]
id = "hud-slots"
title = "The HUD shows twelve slots in slot order"
description = "WEAPON_SLOTS (6) and PASSIVE_SLOTS (6) slots show in slot order, each held item as its produced icon and an empty slot visibly empty."
[[review.categories.items]]
id = "hud-level-pips"
title = "Each held item shows one pip per level"
description = "Every held weapon and passive on the HUD shows exactly as many pips as its level."
[[review.categories.items]]
id = "hud-evolved-icon"
title = "An evolved weapon's icon replaces its base's"
description = "After an evolution the slot shows the evolved weapon's icon in place of the base weapon's."
[[review.categories.items]]
id = "hud-cooldowns"
title = "Each weapon's cooldown state is readable"
description = "Each weapon slot shows how much of its cooldown timer is still to run, from all of it on the tick it fires to none on the tick it fires again."
[[review.categories.items]]
id = "levelup-overlay"
title = "The level-up overlay"
description = "The overlay shows LEVEL_UP_TEXT (THE LAMP BURNS BRIGHTER) and the offers listed vertically over the frozen world, with the highlighted offer drawn distinctly."
[[review.categories.items]]
id = "chest-overlay"
title = "The chest overlay"
description = "The overlay shows CHEST_TEXT (A CHEST OPENS) and the result in chestResult (the evolved weapon's icon and name, the item leveled with its new level, or the heal) over the frozen world."
[[review.categories.items]]
id = "chest-overlay-confirm"
title = "confirm alone closes the chest overlay"
description = "On chest, confirm sets screen to playing and chestResult to null, and up, down, back, and pause do nothing."
[[review.categories.items]]
id = "paused-screen"
title = "The pause screen"
description = "pause on playing shows PAUSED_TEXT (PAUSED) over the held world with the HUD."
[[review.categories.items]]
id = "pause-resumes"
title = "pause resumes from the pause screen"
description = "pause on paused returns to playing with the world exactly as it was."
[[review.categories.items]]
id = "pause-abandons"
title = "back on the pause screen abandons the run"
description = "back on paused returns to title with menuIndex 0 and the idle run."
[[review.categories.items]]
id = "pause-inert-on-overlays"
title = "pause does nothing on an overlay"
description = "pause on levelup or chest leaves the screen as it is."
[[review.categories.items]]
id = "fallen-screen"
title = "The fallen screen"
description = "A run ending fallen shows FALLEN_TEXT (THE LIGHT WENT OUT), the time survived as m:ss, the level, the kills, and END_ITEMS (TRY AGAIN, TITLE) with menuIndex 0."
[[review.categories.items]]
id = "dawn-screen"
title = "The dawn screen"
description = "A run ending at dawn shows DAWN_TEXT (DAWN), the same figures, and the same menu."
[[review.categories.items]]
id = "end-try-again"
title = "TRY AGAIN starts a fresh run"
description = "On fallen and dawn, confirming TRY AGAIN starts a fresh run on playing."
[[review.categories.items]]
id = "end-title"
title = "TITLE returns to the title screen"
description = "On fallen and dawn, confirming TITLE returns to title with menuIndex 0."
[[review.categories.items]]
id = "end-back"
title = "back on an end screen returns to the title"
description = "On fallen and dawn, back does what TITLE does."
[[review.categories.items]]
id = "fresh-run-state"
title = "A fresh run starts from the specified state"
description = "LIGHT THE LAMP and TRY AGAIN each begin with the clock at 0:00, the lamplighter at the origin facing right with BASE_MAX_HP (100), level 1 with xp 0 and kills 0, Taper alone at level 1, and the director on with its timer at 0."
[[review.categories.items]]
id = "fresh-run-discards"
title = "A fresh run discards the previous run"
description = "Nothing alive or lying on the field, no offer, no queued level-up, and no chest result carries from the previous run into a fresh one."
[[review.categories.items]]
id = "menu-index-resets"
title = "menuIndex is 0 on entering every screen"
description = "Every arrival on any screen sets menuIndex to 0, and on a screen with no menu it stays 0."
[[review.categories.items]]
id = "mute-toggles"
title = "Mute toggles from any screen"
description = "The mute action toggles all sound from every screen, and muted mirrors the runtime's bit in the next snapshot."
[[review.categories.items]]
id = "mute-loop-returns"
title = "A muted loop returns in place"
description = "A loop running when mute is toggled on keeps looping silently and is audible again in place when toggled off."
[[review.categories.items]]
id = "mute-playable"
title = "The game stays playable muted"
description = "Every screen and every action works with sound muted."

# --- Audio ----------------------------------------------------------------------
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "cue-hit"
