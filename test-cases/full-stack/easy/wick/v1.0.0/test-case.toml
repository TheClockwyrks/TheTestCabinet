[[review.categories.items]]
id = "fixed-tick-division"
title = "A span of game time runs the same ticks however it is divided"
description = "From one isolated posed run holding a chasing moth and a flying bolt, 0.5 s delivered as one frame, as fifty frames of 0.01 s, and as thirty frames of TICK_DT each leave run.tick 30 higher, the moth thirty chase steps closer, and the bolt thirty steps along, within the project's motion tolerance, so the simulation advances in whole ticks and drawing advances nothing."
