description = "The pickup cue plays on collecting bread or a draft, and not on a gem or a chest."
[[review.categories.items]]
id = "cue-fallen"
title = "fallen plays when the run ends fallen"
description = "The fallen cue plays on the tick the run ends with the light out."
[[review.categories.items]]
id = "cue-dawn"
title = "dawn plays when the run ends at dawn"
description = "The dawn cue plays on the tick the run reaches DAWN_TIME."
[[review.categories.items]]
id = "cue-menu-move"
title = "menu-move plays when a highlight moves"
description = "The menu-move cue plays on every move of a menu highlight, on the title, the overlays, and the end screens."
[[review.categories.items]]
id = "cue-menu-confirm"
title = "menu-confirm plays when a menu item is confirmed"
description = "The menu-confirm cue plays on every confirmed menu item."
[[review.categories.items]]
id = "music-starts-on-run"
title = "The music starts with a fresh run"
description = "music is looping from the tick a fresh run starts."
[[review.categories.items]]
id = "music-through-overlays"
title = "The music persists through overlays and pause"
description = "music keeps looping through levelup, chest, and paused."
[[review.categories.items]]
id = "music-stops-on-end"
title = "The music stops when the run ends"
description = "music stops on the tick the run ends fallen or at dawn."
[[review.categories.items]]
id = "music-stops-on-abandon"
title = "The music stops when a run is abandoned"
description = "music stops when back on paused abandons the run."
[[review.categories.items]]
id = "music-silent-on-title"
title = "The music is silent off the run"
description = "music is not looping on title or howto."
[[review.categories.items]]
id = "hum-loop"
title = "The hum loops exactly while Halo or Corona is held on playing"
description = "hum is looping on every update exactly when screen is playing and a held weapon is halo or corona: it starts when both first hold, whether Halo was just acquired or play resumed, and stops when either stops holding."
[[review.categories.items]]
id = "cues-distinct"
title = "The thirteen one-shot cues are distinct files"
description = "Each of the thirteen one-shot cues is bound to a different produced file, and no two of those files are identical."

# --- Presentation ---------------------------------------------------------------
[[review.categories]]
id = "presentation"
title = "Presentation"
[[review.categories.items]]
id = "stage-fit"
title = "The stage is fitted and centered"
description = "The whole STAGE_W x STAGE_H (1280 x 720) stage is inside the window at its own aspect ratio, centered, with even letterboxing in the stage background color, at any window size and pixel density."
[[review.categories.items]]
id = "lamplighter-reads"
title = "The lamplighter is animated and faces its way"
description = "The lamplighter at the stage center plays its walk cycle while moving, its idle sprite while still, and faces the way facing says."
[[review.categories.items]]
id = "enemies-distinguishable"
title = "The thirteen enemies are told apart by form"
description = "Each enemy type has its own silhouette, told apart from every other at a glance by form rather than hue alone, at about the size of its collision circle."
[[review.categories.items]]
id = "elites-larger"
title = "The elites and the Dark read as larger"
description = "Mothwing, the Owl, and the Dark read as larger and heavier than any common enemy."
[[review.categories.items]]
id = "evolved-effects-distinct"
title = "An evolved weapon's effect is visibly distinct from its base's"
description = "Pyre, Beacon, Hail, Chandelier, Corona, and Blaze each read at a glance as a transformed version of their base weapon's effect."
[[review.categories.items]]
id = "gems-by-size"
title = "Gem tiers are told apart by size"
description = "Small, medium, and large gems are distinguishable by size and form, small under medium under large."
[[review.categories.items]]
id = "pickups-distinct"
title = "Chest, bread, and draft are told apart"
description = "The three pickups are distinguishable from each other and from any gem."
[[review.categories.items]]
id = "overlays-quiet-world"
title = "Overlays read over a quieted world"
description = "The level-up overlay, the chest overlay, and the pause screen read over the frozen world beneath them, with that world visibly quieted."
[[review.categories.items]]
id = "text-legible"
title = "Every piece of text is legible"
description = "Screen copy, the HUD, offers, and menus are legible against whatever sits behind them at the logical stage size."

# --- Produced assets ------------------------------------------------------------
[[review.categories]]
id = "produced-assets"
title = "Produced assets"
[[review.categories.items]]
id = "lamplighter-sprites"
title = "The lamplighter's walk sheet and idle sprite are produced"
description = "A draw-sheet walk cycle of 4 to 6 frames and a draw idle sprite, about 24 x 32, are produced and the game animates the walk while moving."
[[review.categories.items]]
id = "common-enemy-sheets"
title = "Each common enemy has a produced walk cycle"
description = "Each of the ten common enemies has a draw-sheet walk cycle of 2 to 4 frames sized about twice its radius, and every enemy visibly walks on its frames for as long as it lives."
[[review.categories.items]]
id = "elite-sheets"
title = "Mothwing and the Owl have produced walk cycles"
description = "Mothwing (about 56 x 56) and the Owl (about 72 x 72) each have a draw-sheet walk cycle of 2 to 4 frames that plays while they live."
[[review.categories.items]]
id = "dark-sheet"
title = "The Dark has a produced walk cycle"
description = "The Dark has a draw-sheet walk cycle of 2 to 4 frames about 80 x 80 that plays while it lives."
[[review.categories.items]]
id = "death-puff"
title = "A shared death puff plays once on every death"
description = "A draw-sheet puff of 3 to 4 frames about 24 x 24 plays once through at the position an enemy died and is then gone, damaging nothing."
[[review.categories.items]]
id = "base-weapon-effects"
title = "The ten base weapon effects are produced"
description = "The slash, bolt, dart, lantern, aura ring, puddle, strike sheet, shard, spinning sconce sheet, and flare burst sheet are produced sprites drawn over their shapes, the strike and burst playing once over their flash time and the sconce spinning for its life."
[[review.categories.items]]
id = "evolved-weapon-effects"
title = "The six evolved weapon effects are produced"
description = "Pyre, Beacon, Hail, Chandelier, Corona, and Blaze each have a produced effect of the same form as its base's and distinct from it."
[[review.categories.items]]
id = "icons-produced"
title = "The twenty-seven icons are produced"
description = "Sixteen weapon icons, ten passive icons, and the lamp-oil icon, about 24 x 24 each, are produced draw sprites."
[[review.categories.items]]
id = "icons-distinct"
title = "The icons are told apart at a glance"
description = "Each of the twenty-seven icons is distinguishable from every other, and an evolved icon reads as a transformed version of its base's."
[[review.categories.items]]
id = "icons-drawn"
title = "The HUD and overlays draw the produced icons"
description = "Every held slot, every level-up offer, and the chest overlay's result show the item's produced icon."
[[review.categories.items]]
id = "gem-sprites"
title = "The three gem sprites are produced"
description = "Small, medium, and large gems are produced draw sprites about 8, 12, and 16 across."
[[review.categories.items]]
id = "pickup-sprites"
title = "The chest, bread, and draft sprites are produced"
description = "Chest, bread, and draft are produced draw sprites about 24 x 24."
[[review.categories.items]]
id = "ground-tile"
title = "The ground tile is produced and tiles seamlessly"
description = "A produced draw tile about 64 x 64 sits flush against itself on all four sides and is repeated in world space as the ground."
[[review.categories.items]]
id = "pixel-art-scale"
title = "Sprites are drawn at one unit per pixel, sampled nearest-neighbor"
description = "Every produced sprite stands as many units wide as it is pixels wide and is drawn with image smoothing off, so it stays crisp at the stage's fit."
[[review.categories.items]]
id = "produced-cues"
title = "Every cue is a produced sound"
description = "Each of the thirteen one-shot cues and the hum plays a produced .wav from sfx-synth or sfx-sample."
[[review.categories.items]]
id = "produced-music"
title = "The music bed is produced with its .mid committed"
description = "The music is a music-tool bed with its .mid committed beside the .wav, and the .wav's last and first samples are continuous."
[[review.categories.items]]
id = "hum-loops-cleanly"
title = "The hum loops cleanly"
description = "The hum's .wav is authored to loop, its last and first samples continuous."
[[review.categories.items]]
id = "assets-page-relative"
title = "Produced files load page-relative and the build invokes no tool"
description = "Every committed file is referenced relative to the page so the build runs from a sub-path, the built site fetches nothing outside its own dist/, and npm ci and npm run build invoke no asset tool."
