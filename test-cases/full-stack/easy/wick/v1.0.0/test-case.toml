# --- Showcase (read off the produced tree, not off the running game) ----------
# The showcase is the store-page presentation of the finished game: a
# player-facing description and an ordered carousel of captured media, shipped
# in a `showcase/` directory at the root of the produced repository, which
# `specs/showcase.md` defines. It is worth THREE points rather than one, because
# it is a deliverable of its own — a whole file of the specification, and the
# one piece of a run a person meets before they meet the game — where every
# other point on this checklist is one behavior of the game itself.
#
# Its cap is `great` all the same: a build that shipped no showcase plays
# exactly as well as one that did.
#
# NOTHING ABOUT THE MEDIA IS GRADED HERE, and no other item on this checklist
# says anything about it. Whether the description reads like a game worth
# playing, and whether the carousel opens on the strongest view of the night,
# is the reviewer's judgement and is rated through the domains.
[[review.categories]]
id = "showcase"
title = "Showcase"

[[review.categories.items]]
id = "exists"
title = "The game ships its showcase"
description = "showcase/showcase.md and showcase/showcase.toml are present at the root of the produced repository, and at least one file the carousel names is present in showcase/."
weight = 3
domains = ["presentation"]
failure_cap = "great"
validation = { script = "showcase/exists.test.ts", outputs = [ { id = "carousel", name = "A screenshot from the build's showcase", kind = "image" } ] }
