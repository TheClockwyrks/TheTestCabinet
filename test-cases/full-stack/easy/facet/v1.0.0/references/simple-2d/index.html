<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facet</title>
    <!--
      An inline, empty icon: without one the browser requests /favicon.ico on
      its own and the dev server answers 404, logging a console error the game
      did not cause.
    -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /*
        The canvas simply fills the window. The engine fits the fixed 1280x720
        logical stage inside it, the uniform scale, the centered letterbox, and
        the device pixel ratio, so there is no sizing code here or in the game.

        `touch-action: none` keeps the browser from claiming a drag across the
        canvas as a scroll or a zoom, which matters here because a swap can be
        requested by dragging from one gem onto its neighbor.
      */
      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
