# --- Audio --------------------------------------------------------------------
# specs/ui.md names nine cues and the event each answers, so there are ten cue
# points — `land` carries two, because it is the only cue with a threshold on it
# and a build that plays it on every fall is wrong in a way its own point cannot
# see — plus the music bed and the one thing muting must not change. Every cue
# event is driven through a real input edge or a real frame rather than posed,
# because the specification says a cue is played by a frame and never by a pose
# of the debug surface — and the pointer verbs are input rather than poses, so a
# press, a drag and a release drive the board's own cues exactly as a hand does.
#
# Under `none` the cue NAMES live inside the build's own code, so no reading
# there can say which cue sounded, only that a sound went out on a frame. What
# makes that enough here is the spacing the specification gives the events: an
# accepted swap holds for SWAP_SECONDS before its first step resolves, so the
# accepting frame clears nothing and the one cue it is entitled to is `swap`; and
# a step whose fall is long enough to sound `land` sounds it at least three times
# FALL_SECONDS_PER_ROW after the frame the step resolved on, so `clear` and
# `land` never share a frame either. Each point below names the frame it reads
# and what that frame is entitled to raise. The two engine copies read every cue
# by name.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "cue-select"
title = "Select cue"
description = "The select cue sounds when a cell is selected, and on no frame before it."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: arm audio with a real gesture, then press on a cell with
# nothing selected through the real pointer path and advance the frame that
# carries it, asserting a sound across the press and that frame and none before
# it. Selecting exchanges nothing and opens no chain, so it is the only cue that
# frame is entitled to. See validation/<engine>/audio/cue-select.test.ts.
validation = { script = "audio/cue-select.test.ts", outputs = [
  { id = "select", name = "The selection whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-swap"
title = "Swap cue"
description = "The swap cue sounds when a swap is accepted, and on no frame before it."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: arm audio, pose a selection and an offer whose exchange
# is productive, release the pointer, and assert a sound across the release and
# the frame that carries it and none between the selection's own cue and it. The
# accepting frame is entitled to `swap` alone: the exchange enters `swapping` and
# clears nothing for SWAP_SECONDS, so nothing else can be sounding there — which
# is what makes the point decidable under `none` as well as by name under an
# engine. See validation/<engine>/audio/cue-swap.test.ts.
validation = { script = "audio/cue-swap.test.ts", outputs = [
  { id = "swap", name = "The accepted swap whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-refuse"
title = "Refuse cue"
description = "The refuse cue sounds when a swap is refused, and on no frame before it."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: arm audio, pose a selection and an offer on neighbors
# whose exchange makes no run, release the pointer, and assert a sound across the
# release and the frame that carries it and none before it. A refusal clears
# nothing and starts no swap, so that frame too is entitled to one cue. See
# validation/<engine>/audio/cue-refuse.test.ts.
validation = { script = "audio/cue-refuse.test.ts", outputs = [
  { id = "refuse", name = "The refused swap whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-clear"
title = "Clear cue"
description = "The clear cue sounds on the frame a chain step clears its set, and on no frame before it."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: arm audio, drive a two-step chain, and read the frame
# step 2 resolves on — a frame carrying no swap, no refusal, no landing and no
# level change, so a sound there is the clear — asserting one sounded and that
# the frames between the two steps were silent. Step 2's frame is chosen over
# step 1's because step 1 arrives SWAP_SECONDS after a swap that sounded its own
# cue, and a landing is impossible on a resolving frame: `land` waits on a fall
# of more than LAND_MIN_ROWS rows, which is at least three times
# FALL_SECONDS_PER_ROW away. See validation/<engine>/audio/cue-clear.test.ts.
validation = { script = "audio/cue-clear.test.ts", outputs = [
  { id = "clear", name = "The second step whose cue is checked", kind = "replay" },
] }
