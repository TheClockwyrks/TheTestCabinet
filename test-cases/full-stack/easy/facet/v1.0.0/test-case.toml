# --- Pointer Controls ---------------------------------------------------------
# A move is a hold: a press takes hold of a gem, a move while held offers it into
# a neighbor, and the RELEASE is the only thing that reaches the move rules. The
# category splits along that gesture rather than by verb, so a build fails the
# stage of the hold it broke.
#
# The press table's five rows are five points — select with nothing held, re-grab
# the held gem, offer into a neighbor, move the selection, and the press that
# falls off the board — because each is a distinct outcome evaluated in order and
# a build can wire any one of them and not the rest. The release is three more:
# the release that plays a standing offer, what that release leaves behind, and
# the release with nothing offered, which must play nothing at all. The drag is
# four: the offer a move makes, the withdrawal that carrying it home performs,
# the whole undone gesture, and the whole completed one. The undone gesture is
# its own point because it is the promise the hold model makes to a player — a
# gem carried out and back plays nothing — and a build that swaps on the first
# neighbor the pointer crosses breaks exactly that and nothing else.
#
# `press-miss` reads the sentence as specs/controls.md spells it out — the
# selection and any offer are cleared and the board stands — rather than as
# "changes nothing" literally, because the snapshot's `pointer` field mirrors
# every press on every screen by design, and is `pointer-mirrored`'s subject.
# That last point is the one here driven through the REAL pointer verbs for their
# own sake: a build whose update ends by reading the runtime's pointer, which is
# exactly what "refreshed in every update" asks for, discards a posed position on
# the next frame.
#
# `touch-plays-a-move` runs the finished gesture again under `device` `touch`. It
# is a point of its own because specs/controls.md says a mouse, a pen and a
# finger all drive the pointer and the game reads them the same way, so a build
# that listens for mouse events alone answers every point above it and leaves a
# touchscreen dead.
[[review.categories]]
id = "pointer"
title = "Pointer Controls"
[[review.categories.items]]
id = "press-selects"
title = "A press selects the cell it targets"
description = "A press within GEM_HIT_R (36) of a cell's center, with nothing selected, selects that cell with no offer standing."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: with nothing selected, press at a cell's exact center
# and again at a point inside GEM_HIT_R of it and outside every other cell's,
# and assert that cell is selected each time and no offer stands. Every point is
# posed at an exact stage coordinate, so there is no sampling noise to tolerate.
# Capped at `broken` because the press is the first link of every input path
# Facet has: a build whose press selects nothing has no move to make, by drag
# or by tap. See validation/<engine>/pointer/press-selects.test.ts.
validation = { script = "pointer/press-selects.test.ts", outputs = [
  { id = "select", name = "A cell selected by the pointer", kind = "image" },
] }
