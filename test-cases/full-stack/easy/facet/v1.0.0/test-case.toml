# --- Move Rules (R1-R3) -------------------------------------------------------
# The three move rules are split by clause rather than by rule, so a build that
# enforces adjacency and forgets productivity fails one point instead of the
# category. R1 contributes two — the accepted shape and the refused one — R2 two,
# because a board in motion is in motion under `swapping` as well as under
# `resolving` and a build can guard one and not the other, and R3 two, because
# the prism exemption is a separate sentence from the run requirement and a build
# can get either wrong on its own.
#
# The refusal itself is two more points, its mark and its lifetime.
# `refusal-marked` compares the reported pair as a SET: specs/rules.md fixes
# that a refused swap names its two cells and specs/instrumentation.md fixes the
# reported shape, but the engineless build is told nothing about which of the two
# is reported as `a`, so a build that reports them in the other order is
# conformant on every word that was written to it.
#
# An accepted swap does not clear anything on the frame that accepts it: it
# enters `swapping` and holds there for SWAP_SECONDS of game time. So every
# scenario here that accepts a swap drives that interval before the first step's
# result is readable, and the acceptance itself is read as the phase the frame
# left behind.
[[review.categories]]
id = "moves"
title = "Move Rules (R1-R3)"
# ONE ITEM PER AXIS. R1 names two shapes an exchange may take, and a build can
# wire one of them and not the other — a drag reader that answers a sideways
# gesture and drops an upright one, a release that only ever trades with the
# cell to the right. Such a build leaves half of every board unplayable, and
# under one item it would grade exactly as a build that accepts neither.
[[review.categories.items]]
id = "r1-adjacent-accepted-horizontal"
title = "R1 accepts an exchange one column apart"
description = "A productive swap of two cells differing by 1 in column and 0 in row is accepted: phase becomes swapping with the two cells exchanged and no refusal standing, and SWAP_SECONDS (0.18) later the step resolves at chainStep 1."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: pose a board on which a horizontal neighbor exchange
# makes a run, request it, assert the phase is `swapping` with no refusal and
# the two cells exchanged, then drive past SWAP_SECONDS and assert the phase is
# `resolving` at chain step 1. That the swap HOLDS for its own span before
# resolving is `chain`'s two points, and what is read here is only that the
# acceptance path was opened at all. Capped at `broken` because every move Facet
# has begins with an orthogonal exchange: a build that refuses them cannot be
# played. See validation/<engine>/moves/r1-adjacent-accepted-horizontal.test.ts.
validation = { script = "moves/r1-adjacent-accepted-horizontal.test.ts", outputs = [
  { id = "swap", name = "An accepted sideways swap", kind = "replay" },
] }
