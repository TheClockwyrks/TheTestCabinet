# --- Pointer Targets ----------------------------------------------------------
# A pointer target is an axis-aligned rectangle a screen is operated through, and
# this case fixes not one of them. specs/controls.md names the ids each screen
# carries and the order they are reported in, states four requirements every one
# of them meets — a minimum width, a minimum height, lying wholly on the stage,
# and no two on a screen overlapping — and then hands the LAYOUT to the build,
# because where a menu item sits is part of the look and the look is the build's
# throughout this case. So the build REPORTS its targets: `targets` is the
# rectangle set the game actually hit-tests against, and what is graded is the
# four requirements applied to whatever the build reported.
#
# That is what makes the category decidable at all. A case that fixed the
# rectangles would be grading every build against one design; a case that fixed
# nothing could not ask for a control a fingertip can hit. Reporting them splits
# the question in two, and both halves are graded: the geometry the build chose
# is held to the four requirements here, and every BEHAVIOR point is driven at
# the coordinates the build itself named, so a target reported where nothing is
# drawn fails `appearance`'s two control points and a control drawn where nothing
# is reported fails the press and release points here.
#
# Twelve points: four on the reported geometry, one on the pause control keeping
# clear of the board, four on the highlight-arm-take gesture every target is
# worked by, two on the two targets that are not menu items, and one that runs
# the gesture again with a finger. The gesture is four points rather than one
# because a touchscreen has no hover: the press is what moves the highlight and
# arms, and the release is what takes. A build that takes the item on the press
# has a menu that works under a mouse and fails both `press-arms-target` and
# `release-outside-takes-nothing` — the point that lets a player slide off a
# control they did not mean to press.
[[review.categories]]
id = "targets"
title = "Pointer Targets"
[[review.categories.items]]
id = "targets-reported"
title = "Every screen reports the targets it carries"
description = "Each screen reports exactly the target ids specs/controls.md names for it, in that order: menu-0 and menu-1 on title, paused, levelclear and gameover, back on howto, and pause on playing."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: reach each of the six screens in turn through the poses
# specs/instrumentation.md gives for them and assert the reported `targets` ids
# are exactly the list that file names for that screen, in that order. Every
# other point in this category and both control points in `appearance` aim at
# these rectangles, so a build that reports none of them is unreadable on all of
# them — which is what the `broken` cap says. The ids are asserted in ORDER
# because `menu-<i>` is defined by its index into the screen's item list, and a
# build that reported the pair reversed would highlight the wrong item. See
# validation/<engine>/targets/targets-reported.test.ts.
validation = { script = "targets/targets-reported.test.ts", outputs = [
  { id = "targets", name = "The title screen's reported targets", kind = "image" },
] }
