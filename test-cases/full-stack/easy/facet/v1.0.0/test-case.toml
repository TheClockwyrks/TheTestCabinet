# --- Audio --------------------------------------------------------------------
# specs/ui.md names eight cues and the event each answers, so there are eight
# cue points, plus the music bed and the one thing muting must not change. Every
# cue event is driven through a real key rather than posed, because the
# specification says a cue is played by a frame and never by a pose of the debug
# surface — a posed event is entitled to raise nothing, while a key is read once
# by the frame as a press edge.
#
# Under `none` the cue NAMES live inside the build's own code, so no reading
# there can say which cue sounded, only that a sound went out on a frame. That
# is enough for the events whose frame the specification entitles to nothing
# else, and it is NOT enough for `cue-swap`: R3 accepts a swap only when the
# board it produces carries a run or touches a prism, and R5 then always seeds a
# non-empty clear set, so an accepted swap always shares its frame with a clear.
# Under `none` that point therefore decides only that the accepting frame sounds
# and that nothing sounded before it; the two engine copies decide it by name.
