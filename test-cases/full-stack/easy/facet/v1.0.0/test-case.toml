domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: pose a board whose only maximal run after the swap is a
# horizontal three, with nothing flawed and no cut gem beside it so R6 adds
# nothing, drive past the swap animation, and assert three cells cleared, each of
# the three columns shifted down by one, and every other column untouched. See
# validation/<engine>/runs/r4-horizontal-run.test.ts.
validation = { script = "runs/r4-horizontal-run.test.ts", outputs = [
  { id = "clear", name = "A horizontal three clearing", kind = "replay" },
] }
[[review.categories.items]]
id = "r4-vertical-run"
