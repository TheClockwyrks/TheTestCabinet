] }

# --- The Chain Step -----------------------------------------------------------
# The chain is checked as its three outcomes — it runs on, it holds the board
# for STEP_SECONDS between steps, and it ends — plus the one consequence of the
# step's ORDER that is separately observable: R8 creates before R9 settles, so a
# created gem falls in the same step it was made in.
#
# `chain-second-step` and `score-multiplier` both compute their expectation from
# the board the first step actually settled, read back out of the snapshot,
# rather than from a prediction. That is what keeps R9's random refill out of
# the assertion: the check derives the clear set the spec gives for exactly the
# board in front of it, whatever the build's generator dealt into it.
[[review.categories]]
id = "chain"
title = "The Chain Step"
[[review.categories.items]]
id = "chain-second-step"
title = "A chain runs on into a second step"
description = "When the board a step settles carries a maximal run, chainStep rises to 2 and that board's clear set is removed."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: pose a board where clearing a run drops survivors into a
# fresh run, read the settled board out of the snapshot, compute the R5/R6 clear
# set the specification gives for that exact board, advance past STEP_SECONDS,
# and assert the chain step rose to 2 and that set's size was taken. See
# validation/<engine>/chain/chain-second-step.test.ts.
validation = { script = "chain/chain-second-step.test.ts", outputs = [
  { id = "chain", name = "A chain running on into its second step", kind = "replay" },
] }
[[review.categories.items]]
id = "chain-cadence"
title = "A step holds the board for STEP_SECONDS"
description = "After a step resolves, the board and chainStep are unchanged until stepTimer reaches STEP_SECONDS (0.25) of game time, and the next step resolves once it does."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: set up a two-step chain, advance to just inside
# STEP_SECONDS and assert the chain step is still 1 with every cell unchanged,
# then past it and assert the step resolved. The frame schedule stays clear of
# the exact boundary tick, which "reaches" leaves open, and the reading after
# the boundary is that the timer is below STEP_SECONDS rather than at a value,
# because what becomes of the overrun is not fixed either. See
# validation/<engine>/chain/chain-cadence.test.ts.
validation = { script = "chain/chain-cadence.test.ts", outputs = [
  { id = "cadence", name = "The board held for one step's length", kind = "replay" },
] }
[[review.categories.items]]
id = "chain-ends-idle"
title = "A chain ends when nothing more clears"
description = "When the board a step settles seeds no clear set, phase returns to idle with chainStep 0 and stepTimer 0."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: drive a single-step chain, advance past STEP_SECONDS and
# assert the phase is idle with the chain step and the timer at 0, then advance
# further and assert nothing more moves. See
# validation/<engine>/chain/chain-ends-idle.test.ts.
validation = { script = "chain/chain-ends-idle.test.ts", outputs = [
  { id = "settled", name = "The board settling back to idle", kind = "replay" },
] }
[[review.categories.items]]
id = "created-gem-settles"
title = "A created gem settles with the board"
description = "A gem R8 creates is placed at the cell the removal left empty and then falls under R9 in the same step, coming to rest at the lowest empty cell below that placement."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: pose a vertical run of four so R8 places the created
# brilliant with emptied cells beneath it, and assert it comes to rest at the
# lowest of them rather than at the placement cell — the step's order, read from
