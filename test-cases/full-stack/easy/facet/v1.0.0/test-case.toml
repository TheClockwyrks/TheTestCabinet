# --- Scoring ------------------------------------------------------------------
# The two per-gem rates are two points, the multiplier a third, and where the
# points land a fourth, because a build can compute the sum correctly and add it
# to one figure only. `last-step-reported` covers the two readouts the HUD and
# the reviewer both read the step through.
#
# MAX_MULTIPLIER's clamp is NOT covered here, and deliberately: M only stops
# rising at chain step 9, `chainStep` is not writable, and every step past the
# first depends on R9's refill, so a nine-step chain can only be reached by
# hunting a seed that works on one particular build — which would be a validator
# derived from a reference. `score-multiplier` stays inside the unclamped range
# and says so.
[[review.categories]]
id = "scoring"
title = "Scoring"
[[review.categories.items]]
id = "score-base-rate"
title = "A clean gem scores BASE_SCORE"
description = "On chain step 1, each cleared gem carrying strain 0, 1 or 2 adds BASE_SCORE (10) times the step's multiplier of 1."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: clear a run of three carrying strains 0, 1 and 2 with
# nothing for R6 to expand and no flawed gem in the set, reading `score` either
# side of the swap, and assert the step added MATCH_MIN x BASE_SCORE at a
# multiplier of 1. The reading is the score the step moved rather than the
# `lastPoints` it reported, which is `last-step-reported`'s point. See
# validation/<engine>/scoring/score-base-rate.test.ts.
validation = { script = "scoring/score-base-rate.test.ts", outputs = [
  { id = "score", name = "A clean three scoring thirty", kind = "replay" },
] }
[[review.categories.items]]
id = "score-flawed-rate"
title = "A flawed gem scores FLAWED_SCORE"
description = "On chain step 1, each cleared gem at strain 3 adds FLAWED_SCORE (20) times the step's multiplier."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: clear the same run of three twice, the second time with
# one flawed gem of another kind drawn in beside it by R6, and assert the
# difference between what the two steps added to `score` is FLAWED_SCORE — one
# flawed gem's own share, measured rather than reckoned from the other rate. The
# two rates are separate points because a build that scores every gem at one rate
# fails the one it got wrong. See
# validation/<engine>/scoring/score-flawed-rate.test.ts.
validation = { script = "scoring/score-flawed-rate.test.ts", outputs = [
  { id = "score", name = "A flawed stone paying double", kind = "replay" },
] }
[[review.categories.items]]
id = "score-multiplier"
title = "A later chain step scores by its multiplier"
description = "A step's points are its clear set's points times M = min(chainStep, MAX_MULTIPLIER), so a step 2 clear scores twice what the same set would score at step 1, and multiplier reports 2."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: drive a two-step chain, compute each step's clear set
# from the board that step actually reads — both of them made of gems below
# MAX_STRAIN, so one rate covers every cell — and assert step 2 added twice per
# cleared cell what step 1 added, with the multiplier reporting 2. The rates
# themselves are the two points above; this one compares the steps with each
# other. Step 2 is inside the unclamped range on purpose; the clamp itself is not
# this point's. See validation/<engine>/scoring/score-multiplier.test.ts.
validation = { script = "scoring/score-multiplier.test.ts", outputs = [
  { id = "chain", name = "A second step paying double", kind = "replay" },
] }
[[review.categories.items]]
id = "score-adds-to-both"
title = "A step's points add to score and levelScore"
description = "A step's points are added to both score and levelScore."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: pose a non-zero score and level score, both short of the
# target the round reports, drive one step, and assert both figures rose by the
# SAME amount and that the amount is not zero. What the step was worth is the
# rate points' business, so no rate is named here. See
