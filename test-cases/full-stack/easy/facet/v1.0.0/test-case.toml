# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "facet"

# Human-readable display name for this test case.
name = "Facet"

# The test type: a playable game whose art, effects, and sound the model also
# PRODUCES during the run, with the six 2D asset-generation binaries on the run
# image's `PATH`. The type is the only declaration needed to select that image —
# there is no manifest key naming it — and it is what makes `packages` below and
# `specs/assets.md` load-bearing rather than decorative.
type = "full-stack"

# Relative difficulty of this case, surfaced on the site. Facet is a lot of
# separate *work* — nine numbered rules, a chain resolver, seven gem kinds across
# four cuts and four strain states, five screens, and a full production pass over
# its own art and audio — but none of it is hard to reason about: the board is
# `8x8`, there is no physics, no opponent, and no clock to tune, and every figure
# is stated exactly. Difficulty rates how demanding the *thinking* is, not how
# long the build takes; `max_runtime_hours` below is where the size of the job is
# accounted for. So easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["puzzle", "match-3", "grid", "2d"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A gem-matching puzzle on a lapidary's bench, where every clear cracks the stones \
left standing and a stone cracked through goes with whatever goes beside it."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected engine) and handed to the model as
# the build instruction. It injects absolute in-container paths through template
# variables rather than hardcoding them. The harness prepends the standing
# full-stack asset-quality directive to whatever this renders to, so the prompt
# never restates it.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Facet asks for a rules engine that resolves a chain step in
# one fixed order, a seeded deal that owes the player an opening board with a
# legal swap on it, a legal-swap search, pointer and keyboard input over one
# selection model, five screens, and — under the engineless run — the whole
# runtime layer beneath all of that. On top of the game sits a full production
# pass: the seven kinds at four strain states, a break sheet each, the cut
# treatments, the particle bursts, the cue set, and the music. Four hours is
# comfortably more than a healthy build of that size needs while still catching a
# session that never terminates.
max_runtime_hours = 4

# Init command, run in the run container once the workspaces and specs are seeded
# and before the harness starts. `npm install` rather than `npm ci`, because
# `packages` below injects the `@test-cabinet/particle-runtime` `file:` dependency
# and the lockfile is completed at seed time. The same command installs the
# seeded project's dependencies — the TypeScript toolchain the `[toolchain]`
# commands invoke, the headless canvas the model's own vitest tests can draw
# through, and, on an engine run, the vendored engine — and downloads the
# Playwright Chromium build (the base image ships the OS libraries Chromium links
# against, but not the browser binary), so the model can build the game and look
# at it in a browser without any further setup.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the
# whole point of a full-stack case: the model PRODUCES the gems, the break sheets,
# the bursts, the cues, and the music itself, during the run, with the six
# binaries on the run image's `PATH` (see `type` above and `specs/assets.md`).

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same
# library the review UI plays a produced effect with; core bakes it into the run
# image and each seeded workspace `package.json` depends on it via its baked-in
# `file:` path, so the build imports it (its `/canvas` binding) like any other
# dependency and plays each produced `system.json` by simulating it live. The
# clear burst, the flawed detonation, and the cut-gem flash are all produced
# `particle-2d` systems played this way; `specs/assets.md` carries the consumption
# contract. (A root key, so it must sit above the first `[table]` header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Facet declares exactly ONE, so every run of this case is the same game.
#
# There is one board, one rule set, one selection model and one round shape here,
# and nothing in the seeded spec set branches on the variant at all — the only
# axis the specs branch on is `engine.slug`, which changes what the build is
# handed rather than what it is asked to make.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics; one of them also owns rendering and the gameplay
# framework the game is written inside. It is a *run dimension*, chosen per run
# alongside the model, the harness, and the variant, and recorded on the run; it
# is not a property of the game.
#
# Facet supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop, the canvas fit, the keyboard and
#                     pointer input, the audio, the overlay and the
#                     `window.__facet` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around it (`src/constants.ts`, `src/main.ts`, and the
#                     `src/game.ts` the build writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes its
#                     game module — the game definition, its mode, its state and
#                     its actors — and the debug surface its instance's
#                     `initialize` returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable
# differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to *this game* under it —
# which surfaces the build still supplies, Facet's action list, and Facet's cue
# names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the canvas, and the `@test-cabinet/particle-runtime` dependency the
# produced effects are played through. What differs is how much of the build is
# supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     keyboard and pointer input, audio, diagnostics overlay and
#                     `window.__facet` surface, and every figure the specification
#                     fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`: the `FacetState`, the debug surface its
#                     `initialize` returns beside that state, and the game's
#                     update and render.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules. The build writes
#                     `src/game.ts`: the game definition the engine drives — its
#                     mode, its live `FacetState`, and its actors — and the debug
#                     surface its instance's `initialize` returns.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`). There is deliberately NO single `workspace` key beside this
# table: `workspace` is the engineless spelling, one directory standing for a
# whole case that names no engine, and the two are exclusive. A case that seeds
# a different project per engine states them here instead.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`,
# `build/`, or `out/`. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. It also means the produced art, effects, and audio must be COMMITTED
# files the build copies into the site, because no asset tool runs here. Both
# commands are required; there are no defaults, so every case states exactly how
# its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. A full-stack build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# `specs/instrumentation.md`). It is what every validation script this case gains
# poses its scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__facet` once the game has initialized, so the
# handle is what a person opening the console of such a build finds. An engine run
# has NO global at all: the build writes the surface, its `initialize` returns it —
# beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view, its
# surface is written in the shape of `update` — a pose takes the current state and
# returns the next, applied through `engine.apply`, and a reading takes the state
# and returns what it read, called with `engine.state`. `structured-2d` holds the
# world live, so its poses take only their own arguments and act on it at the call,
# and its readings return plain data. One handle, three ways to reach the same
# operations.
#
# There is deliberately no `tick_hz`. Facet mandates no fixed timestep: the one
# cadence it has, the chain step, is stated in seconds of game time and integrated
# against the delta time the frame hands it, and the surface's poses and pointer
# operations take effect the moment they are called rather than being sampled once
# per tick, so there is no case-wide step size to state. The key is optional
# precisely so a case clocked this way omits it.
[instrumentation]
handle = "__facet"

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. The single variant declares
# none of its own: there is one game here, so there is one spec set.
#
# The specification is decomposed by concern, and each file is self-contained
# enough to be read on its own while naming its siblings where a fact lives
# elsewhere: `overview.md` the game and the project it is built in, `board.md` the
# grid geometry, the gem kinds, the cuts, strain, and the notation boards are
# written in, `rules.md` the nine numbered rules and the chain step they resolve
# in, `controls.md` the selection model and the key actions, `state.md` what the
# game's state carries, `instrumentation.md` the debug and automation surface,
# `ui.md` the five screens and the audio cues, `assets.md` the production contract
# for the art, the effects, and the sound, and `showcase.md` the store-page
# presentation the finished game ships.
#
# Every `.hbs` source is rendered before it lands, and ONE axis is branched on:
# `engine.slug`, which selects what the build is handed and what it must write.
# `overview.md.hbs` (the runtime, what is implemented, where the figures come
# from), `controls.md.hbs` (where the pointer and the actions come from),
# `state.md.hbs` (the build's own shape versus the exact `FacetState` declaration
# each engine run writes), `instrumentation.md.hbs` (the global versus
# `engine.debug`, and the clock operations only an engineless build needs),
# `ui.md.hbs` (where cues are played) and `showcase.md.hbs` (how motion is
# captured for the carousel) all branch on it. `board.md`, `rules.md` and
# `assets.md` carry no engine-dependent sentence and are seeded verbatim.
# Nothing branches on the variant. A spec's `dest` defaults to its `source` with a
# trailing `.hbs` stripped, so an `.md.hbs` source seeds to the same `.md` path and
# a plain `.md` source is seeded verbatim.
[[spec]]
source = "specs/overview.md.hbs"

# The board: the grid, the cell center formula every position in the game derives
# from, the seven gem kinds, the four cuts, strain, and the notation `rules.md` and
# the debug surface's `loadBoard` both speak. Seeded verbatim: nothing in it
# differs by engine.
[[spec]]
source = "specs/board.md"

# The ruleset: R1 through R3, the move rules checked when a swap is requested, and
# R4 through R9, the resolution rules a chain step evaluates over the board, plus
# the order a step resolves them in, the scoring, and the level and end
# conditions. It is the heart of the case and is seeded verbatim.
[[spec]]
source = "specs/rules.md"

# How a player operates the game: the pointer table that selects, deselects, moves
# the selection and requests a swap, the drag gesture, the cursor, and the
# registered key actions. It branches on the engine only to say which layer
# delivers the pointer and the actions: the engine on an engine run, the runtime
# layer the build writes on an engineless one.
[[spec]]
source = "specs/controls.md.hbs"

# The shape of the game's state. Under `simple-2d` this is the `FacetState`
# declaration the build writes into `src/game.ts` verbatim, stated by the case
# rather than by the seeded stub, and under `structured-2d` it is the equivalent
# declaration in that engine's idiom, a live `FacetState` class the world holds as
# its game state, written into `src/game.ts` verbatim as well. Under `none` the
# build owns the shape and the file lists only what the state must carry, because
# the rest of the specification is written against those facts.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# render-free core; an API to pose a board, drive the game through its own real
# input path, and read it back; and a read-only debug overlay. Framed as an
# ordinary developer affordance of the game. It branches on the engine for how the
# surface is reached and for the clock operations only an engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The five screens (`title`, `howto`, `playing`, `paused`, `gameover`), the menus
# and their items, the readouts the playing screen carries, and the eight audio
# cues.
[[spec]]
source = "specs/ui.md.hbs"

# The production contract for everything the game plays: which tool produces which
# file, what is drawn in code instead, and how the produced files are wired into
# the build. Seeded verbatim — the tools on `PATH` are the same under every engine.
[[spec]]
source = "specs/assets.md"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured (a gzipped recording from the engine's own draw-command
# recorder on an engine run, screenshots and a short clip under `none`); it seeds
# to `specs/showcase.md`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`.
#
# Facet deliberately fixes no palette, no font, no gem artwork and no background:
# the look of the bench is the build's own design, and it is the build that DRAWS
# the gems as produced files rather than receiving them. A reference view is a
# picture a build is compared AGAINST, so there is no honest one to seed here —
# every build is expected to look different, and a screenshot diff would score the
# build that copied the mockup best rather than the build that produced the best
# bench. What the specification fixes about appearance is stated as legibility a
# player depends on: seven kinds told apart by hue and by silhouette, the four
# strain states readable at a glance, a cut readable from its plain stone, and the
# readouts clear of the board's extent.
#
# `[[proof]]` is likewise empty: no proof media is asked of the build. Every piece
# of media a reviewer sees beside a verdict is captured by this case's own
# validation suites, from scenarios the case controls. The showcase spec above does
# ask for media, but as the game's own store-page presentation rather than as
# evidence any point is judged on. The automated load check still runs.

# Scoring domains. A domain carries the validator-decided FUNCTIONAL rating, and
# the run's overall functional rating is the WORST across the domains.
#
# Facet declares exactly ONE, and that is deliberate. Everything a validator can
# decide here is one game: the board, the nine rules, the strain that spreads
# through it, the three cuts, the chain that resolves them, the scoring and the
# levels it feeds, and the screens the round is played across. They are not
# separable — a build whose strain is wrong has a wrong chain, a wrong score and a
# wrong end condition — so splitting them would only spread one failure across
# several ratings. The case's PRESENTATION is not a domain either: the look, the
# polish, the feel of the bench, and the produced art, effects and sound are judged
# by the run-wide AESTHETIC rating rather than through a domain of their own.
[[domain]]
id = "gameplay"
name = "Gameplay"
description = "The whole game the rules describe: the 8x8 board and its geometry, the swap rules and the runs they seed, strain spreading to the survivors of every clear, the brilliant, star and prism cuts, the chain that resolves them step by step, the score and the levels it fills, and the five screens a round is played across."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY — a bare name grouping the points a
# reviewer grades — and each `[[review.categories.items]]` under it is one
# graded review item, worth one point (the default weight), so a category is
# worth the number of items it holds. A category carries no prose of its own;
# each item states in `description` the claim its validator checks. The
# checklist is reporter-side material — never seeded into a run, so the model
# never sees it; each item restates a rule the seeded specification already
# states, and every threshold a validator asserts is derived from a figure or a
# rule in the specs plus an honest tolerance.
#
# EVERY item carries a validation script, and every item is ONE observable
# behavior, so a build fails exactly the rule it breaks: R4 horizontal and R4
# vertical are two points, not one, and a build that gets the cursor's four
# directions right and its clamp wrong loses one point rather than five. Every
# item names `gameplay`, because this case declares exactly one domain.
#
# Each script is a vitest suite under `validation/<engine>/<category>/`, named
# for the item. The `<engine>` level is the ENGINE the suite is written against
# — a validator speaks one engine's vocabulary — so this case ships one
# directory per supported engine: `validation/none/` drives the built site in
# Chromium through the `__facet` handle, and `validation/simple-2d/` and
# `validation/structured-2d/` each stand their engine up in process against the
# build's own game module. The three hold the same scenarios; only how they
# reach the build differs, and where an architecture makes one of them decide
# less, the item's comment says so. The directory for the run's engine is what
# gets staged into the built workspace at `validation/`.
#
# THE MEDIA an item declares is produced by its own suite, from the scenario the
# case controls: an `image` is a still of the posed or driven game, a `replay` a
# recording across the frames the point is about.
#
# Three things the specification leaves open bound this checklist, and each is
# recorded above the category it touches rather than worked around: R7's cap is
# unreachable, because R6 removes every flawed gem before R7 runs;
# MAX_MULTIPLIER's clamp is unreachable, because it first bites at chain step 9
# and no nine-step chain can be posed; and which of a refused swap's two cells
# is reported as `a` is not fixed, so the pair is compared as a set.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# Every other point on this checklist reaches the build through the debug
# surface, so the surface itself is checked first and a missing one caps the run
# at `broken`: a build that never installs it is not merely unrated on this
# category, it is unreadable on all eighteen. What `debug-api` decides is
# presence and shape only — reflection can report a `typeof` and nothing more —
# and what each operation DOES is the subject of the item that owns that
# behavior (`loadBoard` is `board/load-board`, `requestSwap` is the `moves`
# items, and so on).
#
# The clock is checked here too, as two separate points, because the two claims
# come apart. `delta-time-independent` asks that one interval of game time reach
# one outcome however it is divided; `advances-in-real-time` asks that the game
# carry itself forward when nothing outside it is stepping. Under `none` the
# loop is the build's own, so the second point reads a real wall clock; under an
# engine the loop is the engine's, so what is the build's there — that the
# simulation and the chain ride that loop — is what the engine copies decide.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "debug-api"
title = "Debug and automation API present"
description = "Every operation specs/instrumentation.md names is present as a function on the debug surface, version reports FACET_DEBUG_VERSION (1), each operation poses or reads the running game, and snapshot() reports the full documented shape with current values."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: reflect over the surface for every operation
# specs/instrumentation.md names, read the version's value in both places that
# file fixes it, then pose a board exercising all seven kinds, a prism, both cut
# letters and all four strain digits and assert a snapshot carries every
# documented field at the documented type with all 64 cells in reading order.
# See validation/<engine>/instrumentation/debug-api.test.ts.
validation = { script = "instrumentation/debug-api.test.ts", outputs = [
  { id = "state", name = "The driven board the surface was inspected against", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-resting-values"
title = "Snapshot resting values with no board in play"
description = "With no board in play the snapshot reports board {cols: 0, rows: 0, cells: []}, selection and refusal null, phase idle with chainStep and stepTimer 0, and menuIndex 0."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: reset and read a snapshot on the title screen, asserting
# every resting value field by field — the point is that a field with nothing to
# report holds its resting value rather than going missing. See
# validation/<engine>/instrumentation/snapshot-resting-values.test.ts.
validation = { script = "instrumentation/snapshot-resting-values.test.ts", outputs = [
  { id = "title", name = "The title screen the resting snapshot was read on", kind = "image" },
] }
[[review.categories.items]]
id = "cell-geometry"
title = "Cell centers follow the board formulas"
description = "Every cell the snapshot reports carries the x and y the cellX/cellY formulas give for its column and row, so cell centers run x 388..892 and y 144..648."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose a full board and compare all 64 reported cell
# centers against the cellX/cellY formulas within 0.001. The geometry is what
# every pointer point aims at, so it is decided once here rather than assumed
# there. See validation/<engine>/instrumentation/cell-geometry.test.ts.
validation = { script = "instrumentation/cell-geometry.test.ts", outputs = [
  { id = "board", name = "The posed board whose geometry was read", kind = "image" },
] }
[[review.categories.items]]
id = "reset-restores"
title = "reset restores the title-screen state"
description = "reset() puts the game on title with menuIndex 0, no board in play, phase idle, chainStep, stepTimer, score, levelScore, lastCleared, lastPoints and simTime 0, level 1, cursor (0,0), no selection, no refusal and the pointer up, and options.seed seeds rngState, defaulting to DEFAULT_SEED (1)."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: drive a round dirty — a posed board, an accepted swap, a
# posed score and level, a standing selection — then reset and assert every
# field the operation lists is back at its stated value. No figure is required of
# `lastCleared` or `lastPoints` before the reset: what they report of a step is
# `scoring/last-step-reported`'s point. Also assert that a bare reset and
# reset({ seed: 1 }) reach the same rngState, and that a second seed reaches a
# different one. See validation/<engine>/instrumentation/reset-restores.test.ts.
validation = { script = "instrumentation/reset-restores.test.ts", outputs = [
  { id = "reset", name = "The title screen after reset", kind = "image" },
] }
[[review.categories.items]]
id = "seeded-determinism"
title = "The same seed reproduces the same deal"
description = "reset({seed}) followed by start() deals the identical opening board and reaches the identical rngState every time, and a different seed deals a different board."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: deal from one seed twice, from a fresh instance each
# time, and assert the 64 cells and rngState match exactly; then deal from an
# adjacent seed and assert the board differs. The two seeds are adjacent on
# purpose — a build that quantized its seed, or read only its high bits,
# reproduces its own deal perfectly and would answer a widely separated pair.
# See validation/<engine>/instrumentation/seeded-determinism.test.ts.
validation = { script = "instrumentation/seeded-determinism.test.ts", outputs = [
  { id = "deal", name = "The board dealt from the recorded seed", kind = "image" },
] }
[[review.categories.items]]
id = "delta-time-independent"
title = "The simulation advances on elapsed time, not on frames"
description = "One chain driven over the same interval of game time in one frame and in sixty frames reaches the same board, the same chainStep, the same phase, the same score and the same simTime."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: from the same seed and the same posed board, cover one
# interval of game time as a single frame in one drive and as sixty in the
# other, and compare the board, the chain step, the phase and the score. The
# interval is chosen to carry exactly one STEP_SECONDS boundary however it is
# divided. `stepTimer` is deliberately not compared: specs/rules.md says the
# timer returns to 0 when it reaches STEP_SECONDS and does not say what becomes
# of the overrun, so two compliant builds legitimately hold different remainders
# after a boundary. See
# validation/<engine>/instrumentation/delta-time-independent.test.ts.
validation = { script = "instrumentation/delta-time-independent.test.ts", outputs = [
  { id = "drive", name = "The chain driven under a coarse clock", kind = "replay" },
] }
[[review.categories.items]]
id = "advances-in-real-time"
title = "The game advances itself in real time"
description = "On a real wall clock, with nothing stepping the game from outside, a resolving chain's simTime and stepTimer advance over a stretch of real time."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: pose a board, accept a swap so a chain is resolving,
# then let real time pass with nothing advancing the game and assert simTime
# grew and the chain moved on. Under `none` this is a real wall clock the build
# measures itself; under an engine the loop belongs to the engine, so what the
# check decides there is that the simulation and the chain ride that loop rather
# than only a poke from outside. See
# validation/<engine>/instrumentation/advances-in-real-time.test.ts.
validation = { script = "instrumentation/advances-in-real-time.test.ts", outputs = [
  { id = "before", name = "The instant the chain begins", kind = "image" },
  { id = "after", name = "Moments later, on the build's own clock", kind = "image" },
] }

# --- The Board ----------------------------------------------------------------
# `loadBoard` is the operation every rule point poses its scenario through, so
# it is checked head-on and capped at `broken`: a build that poses a board
# approximately makes every R1-R9 point read a fiction. `board-rests` is its
# companion — a posed board that started resolving itself would silently rewrite
# the fixture out from under the check that posed it.
#
# The opening board's three stated properties are three points, not one, so a
# deal that carries a run fails exactly that and not the two beside it. Each
# sweeps twelve seeds and asserts nothing about any particular one; every seed
# swept is positive, because specs/instrumentation.md fixes what `options.seed`
# DOES and not what values it may take, and a build over a shift-register
# generator is entitled to be stuck at zero.
[[review.categories]]
id = "board"
title = "The Board"
[[review.categories.items]]
id = "load-board"
title = "loadBoard poses the written board exactly"
description = "loadBoard(rows) moves to playing with phase idle, chainStep and stepTimer 0, no selection and no refusal, and every one of the 64 cells carries exactly the kind, cut and strain its token named, a prism reporting kind null."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: pose a board using all seven kind letters, X, both cut
# letters and all four strain digits, compare the reported cells token by token,
# and assert the screen, phase, chain step, timer, selection and refusal are as
# the operation states. The clearing half is posed from a dirty game — mid-step,
# with a selection standing and a refusal raised — because every one of those
# fields already rests at its stated value on a title screen, so a pose from
# rest could not decide them. See validation/<engine>/board/load-board.test.ts.
validation = { script = "board/load-board.test.ts", outputs = [
  { id = "posed", name = "The posed board", kind = "image" },
] }
[[review.categories.items]]
id = "board-rests"
title = "A posed board rests until a swap is accepted"
description = "A board posed with a maximal run already standing on it stays exactly as written across a stretch of game time, with phase idle, chainStep 0 and score unchanged."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose a board that already carries a maximal run, let
# several seconds of game time pass, and assert every cell, the phase, the chain
# step and the score are untouched. A run is only read when a swap is accepted
# on the board, never because it was written there. See
# validation/<engine>/board/board-rests.test.ts.
validation = { script = "board/board-rests.test.ts", outputs = [
  { id = "resting", name = "The posed board resting with a run on it", kind = "image" },
] }
[[review.categories.items]]
id = "opening-no-runs"
title = "The opening board holds no run"
description = "The board start() deals holds no maximal run under R4."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: deal over twelve seeds and scan every row and column for
# three or more consecutive cells of one kind. See
# validation/<engine>/board/opening-no-runs.test.ts.
validation = { script = "board/opening-no-runs.test.ts", outputs = [
  { id = "deal", name = "A freshly dealt opening board", kind = "image" },
] }
[[review.categories.items]]
id = "opening-legal-swap"
title = "The opening board carries a legal swap"
description = "The board start() deals carries at least one legal swap, and the snapshot reports legalSwap true."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: deal over twelve seeds, search every orthogonally
# adjacent pair for an exchange R1 and R3 both accept, and read `legalSwap`
# back. The search is the half that discriminates; the reported flag is weak on
# an opening board, where a compliant deal carries many legal swaps, and its own
# derivation is `levels/legal-swap-derived`'s point. Both are asserted because
# the item states both. See
# validation/<engine>/board/opening-legal-swap.test.ts.
validation = { script = "board/opening-legal-swap.test.ts", outputs = [
  { id = "deal", name = "A freshly dealt opening board", kind = "image" },
