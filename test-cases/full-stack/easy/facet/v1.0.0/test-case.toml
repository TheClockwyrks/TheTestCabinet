# --- Settling and Refill (R9) -------------------------------------------------
# R9 is the rule every other rule's evidence passes through, which is why the
# fall itself is capped at `broken` — a build that settles wrongly cannot be
# read correctly on R4 through R8 either. Four points: where a survivor lands,
# what it carries with it, what fills the cells nothing landed in, and that the
# board is whole again by the time the step ends.
#
# What the refill's kind is drawn FROM is asserted (one of GEM_KINDS, plain, at
# strain 0); that the draw is UNIFORM is not, because deciding a distribution
# off a settled board would take either the build's own generator or a
# statistical test, and this case ships neither an opinionated validator nor one
# tuned to a reference.
[[review.categories]]
id = "settling"
title = "Settling and Refill (R9)"
[[review.categories.items]]
id = "r9-gems-fall"
title = "Surviving gems fall into the gap"
description = "Within each column every surviving gem falls to the lowest empty cell below it, keeping the order its column held it in."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: pose one column with distinct kinds stacked above a
# vertical run of three, clear it, and assert the survivors appear at the
# column's bottom in the same top-to-bottom order, shifted down by exactly
# three. A column holding no empty cell is read whole and asserted unchanged,
# which is what "falls to the lowest empty cell below it" says when there is
# none. See validation/<engine>/settling/r9-gems-fall.test.ts.
validation = { script = "settling/r9-gems-fall.test.ts", outputs = [
  { id = "fall", name = "A column falling into its gap", kind = "replay" },
] }
[[review.categories.items]]
id = "r9-carries-strain-and-cut"
