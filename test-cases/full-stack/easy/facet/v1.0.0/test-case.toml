# --- Visibility ---------------------------------------------------------------
# These points check PRESENCE and TELLING APART only. Palette, font, layout and
# style are never asserted: specs/board.md hands the presentation to the build
# and states what it fixes as legibility a player depends on, so what is decided
# here is that no two things a player must tell apart are drawn the same.
#
# Every gem reading poses the two gems under test in the SAME cell of the same
# otherwise quiet board, one after the other, so the measured patch differs by
# the gem and by nothing else — same neighbors, same surroundings, same box of
# pixels. The cell-mark points read each cell through two boxes, the gem's own
# and the whole cell's, and take the larger distance, because specs/board.md
# confines a GEM's form to GEM_R of the center while specs/ui.md marks the CELL
# and says nothing about where the mark may lie.
#
# specs/board.md says a cut gem is never still, so any reading that involves a
# brilliant, a star or a prism is taken across a SWEEP of frames rather than off
# one, and the control that fixes what "the same" means is measured on a plain
# gem, which is the only kind entitled to stand still.
#
# Three points are about MOTION rather than about a still, and each is read as
# one arrangement of a board measured against another arrangement of the same
# board: the offered pair against the board it would settle into, a swap caught
# mid-flight against both the board it left and the board it settles into, and a
# fresh deal's first frame against the same deal once its fall has run. Reading
# motion as a difference between two arrangements is what keeps the assertion
# clear of HOW a build draws it — nothing here fixes an easing, a path or a frame
# count, only that a gem in transit is somewhere other than the cell it is bound
# for.
#
# The two control points are the weakest readings in the category, and they say
# so. specs/controls.md fixes that a control is drawn inside its reported target
# and fixes nothing about how it is drawn, and a text draw's coordinates cannot
# be trusted against a build that translates its context first — which is
# entirely legitimate — so each reads the copy off the frame and then asserts
# that the reported rectangle is not a flat patch of whatever sits behind it. A
# build that decorated its background under an empty rectangle would answer
# spuriously, which is a false pass and never a false failure.
