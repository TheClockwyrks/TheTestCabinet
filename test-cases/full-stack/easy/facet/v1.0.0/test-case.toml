# --- Strain (R7) --------------------------------------------------------------
# R7 is one sentence with four separable claims — who gains, the two ways a gem
# falls outside that, and how much — so it is four points plus the accumulation
# that reaches MAX_STRAIN. The rule's subject is "every gem outside the clear set
# that is orthogonally adjacent to" it, and the two qualifiers rule out different
# gems: a diagonal neighbor is outside the set but out of reach, and a cleared
# gem is in reach but inside the set.
#
# R7's "capped at MAX_STRAIN" clause is deliberately not a point of its own,
# because it is not observable: R6 runs first and draws every flawed gem
# orthogonally adjacent to the clear set INTO it, so a gem already at MAX_STRAIN
# is never a gem R7 sees. Combined with the at-most-one-per-step bound, the
# largest strain R7 can ever be caught producing is MAX_STRAIN whether the build
# clamps or not. `r7-reaches-flawed` therefore asserts the half that has an
# answer.
[[review.categories]]
id = "strain"
title = "Strain (R7)"
[[review.categories.items]]
id = "r7-neighbors-gain"
title = "Gems beside a clear gain one strain"
description = "Every gem outside the clear set that is orthogonally adjacent to at least one cell in it gains 1 strain."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose a horizontal run of three at strain 0 with distinct
# unflawed gems above it, below it and at each end, then follow each marked gem
# to where R9 left it and assert it carries strain 1. See
# validation/<engine>/strain/r7-neighbors-gain.test.ts.
validation = { script = "strain/r7-neighbors-gain.test.ts", outputs = [
  { id = "strain", name = "The stones around a clear taking strain", kind = "replay" },
] }
[[review.categories.items]]
id = "r7-diagonal-no-gain"
title = "A gem only diagonally beside a clear gains nothing"
description = "A gem diagonally adjacent to the clear set and not orthogonally adjacent to it keeps the strain it had."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: on the same board, mark a gem diagonally off the run's
# end with no orthogonal contact with the clear set and assert it still reports
# strain 0 after the step. See
# validation/<engine>/strain/r7-diagonal-no-gain.test.ts.
validation = { script = "strain/r7-diagonal-no-gain.test.ts", outputs = [
  { id = "strain", name = "A diagonal neighbor left clean", kind = "image" },
] }
[[review.categories.items]]
id = "r7-clear-set-exempt"
title = "A gem inside the clear set gains no strain"
description = "R7 raises the strain of the gems outside the clear set only, so a step that clears a gem at strain 2 leaves nothing flawed and sounds no flaw."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: play the same run of three with the pointer twice, once
# with every gem at strain 0 and once with the run's left cell — a cell the step
# clears — posed at MAX_STRAIN - 1, and assert the frame the step resolved on
# sounded no more in the second drive than in the first. The step order is what
# leaves that the only reading: the clear set scores at step 3, R7 raises at step
# 4 and the removal follows at step 5, so a cleared gem's strain reaches neither
# the score nor the board, and a raise it should not have had shows only as the
# flaw specs/ui.md's cue table plays when a gem reaches MAX_STRAIN. The frame
# read is the one the step resolves on rather than the release that requested the
# swap, because the release is SWAP_SECONDS ahead of it and clears nothing. Under
# an engine the cue is read by name. See
# validation/<engine>/strain/r7-clear-set-exempt.test.ts.
validation = { script = "strain/r7-clear-set-exempt.test.ts", outputs = [
  { id = "strain", name = "A clear leaving the stones it takes unstrained", kind = "replay" },
] }
[[review.categories.items]]
id = "r7-once-per-step"
title = "A gem beside two cleared cells gains only one strain"
description = "A gem orthogonally adjacent to two or more cells of the clear set gains exactly 1 strain in the step, not one per neighbor."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose an L of a horizontal and a vertical run sharing a
# corner so one marked gem is orthogonally adjacent to two cells of the clear
# set, and assert it reports strain 1, not 2. See
# validation/<engine>/strain/r7-once-per-step.test.ts.
validation = { script = "strain/r7-once-per-step.test.ts", outputs = [
  { id = "strain", name = "A gem cornered by two arms of one clear", kind = "replay" },
] }
[[review.categories.items]]
id = "r7-reaches-flawed"
title = "Strain accumulates to flawed"
description = "A gem at strain 2 orthogonally adjacent to the clear set reaches MAX_STRAIN (3) and is thereafter flawed."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose a gem at MAX_STRAIN - 1 orthogonally beside a run
# of three and assert it comes out of the step at exactly MAX_STRAIN and answers
# specs/board.md's own definition of flawed. What a flawed gem then DOES is
# other points' — that it is drawn into the next clear set is
# `expansion/r6-flawed-adjacent-taken`, that it scores FLAWED_SCORE is
# `scoring/score-flawed-rate` — so none of it is asserted here. See
# validation/<engine>/strain/r7-reaches-flawed.test.ts.
validation = { script = "strain/r7-reaches-flawed.test.ts", outputs = [
  { id = "flaw", name = "A stone cracking through to flawed", kind = "replay" },
] }

# --- Cuts (R8) ----------------------------------------------------------------
# Seven points: one per creation row, the priority between them, the run
# placement rule, the star's intersection, and the sentence that a prism-seeded
# step creates nothing at all. Priority and placement are separate points from
# creation because a build can make the right gem and put it in the wrong cell,
# or make the wrong one of two that both apply.
#
# R8 (step 6) and R9 (step 7) both fall inside the step a swap resolves on, and
# the snapshot is the only reading the surface offers, so there is no
# observation of the board between placement and the fall. Every placement
# scenario is therefore posed on a HORIZONTAL run, where each of the run's
# columns loses exactly one cell and the created gem provably cannot be moved by
# R9 — which means a vertical-run placement is not observable under this surface
# at all.
