# --- HUD ----------------------------------------------------------------------
# Three readouts and one absence. specs/ui.md fixes each readout's label and the
# state field it shows, and fixes no numeric format, so every scenario poses the
# surrounding figures such that the digits under test are the only ones of their
# value that can be on the frame — a level whose target carries no digit of the
# score, a zeroed level score, and so on. A build free to draw a numeral the
# specification never mentions could still answer such a reading spuriously,
# which is a false pass and never a false failure.
