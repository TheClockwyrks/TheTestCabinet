description = "The same press and release posed with device touch takes the menu item, and the snapshot reports the pointer device as touch."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: drive `release-takes-target`'s press and release again
# with both calls carrying `device` `touch`, and assert the round began and the
# reported device is `touch`. The whole reason the press arms and the release
# takes is that a finger has no hover, so a build whose menus answer a mouse and
# not a finger has missed the point of the model and is unusable on the device it
# was designed for. See
# validation/<engine>/targets/touch-takes-a-menu-item.test.ts.
validation = { script = "targets/touch-takes-a-menu-item.test.ts", outputs = [
  { id = "touch", name = "A menu item taken with a finger", kind = "image" },
] }

# --- Screens and Navigation ---------------------------------------------------
# Six screens and the ways between them. A transition whose point is the SCREEN
# it reaches — PLAY, HOW TO PLAY, RESUME, CONTINUE, QUIT — is driven through the
# pose specs/instrumentation.md gives for that choice, so no menu's ordering
# enters a check that is not about the menu; the two points that ARE about the
# menu drive real keys, and the points about reaching a choice with the pointer
# are the `targets` category's. PLAY and PLAY AGAIN are one point, and QUIT from
# the pause and game-over menus is one, because the specification says each pair
# is the same choice.
#
# The frame readings here decide only that a piece of copy is on screen, which
# is all specs/ui.md fixes — it fixes the words and no font, layout or call
# count. A text search cannot tell a menu ENTRY from the same word in prose, so
# a build that dropped an entry whose word appears elsewhere on the screen would
# answer; localizing a draw by position is the only way to separate them, and
# this case does not assert layout.
#
# `levelclear` carries five of the eighteen, because it is a whole screen: it
# shows, it holds the game still, it draws each of the two figures the level was
# measured by, and it refuses the `back` action that leaves the two other screens
# a player can back out of. What its two menu items DO is the `levels` category's
# — the screen and the level transition are separable faults.
[[review.categories]]
id = "screens"
title = "Screens and Navigation"
[[review.categories.items]]
id = "title-copy"
title = "The title screen shows its title, tagline and menu"
description = "The title frame draws TITLE_TEXT (FACET), TAGLINE_TEXT (PRESSURE FINDS THE FLAW) and every item of TITLE_ITEMS."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: reset, render, and search the frame's text for the
# title, the tagline and both menu items. That `reset()` leaves the game on the
# title with its first item highlighted is
# `instrumentation/reset-restores-every-field`'s point, and is read here only as
# the fixture that says the frame is the title's. Capped at `scuffed` because
# the menu a round is started from has to be readable: a build that draws the
# heading and never the menu leaves a player with no way to see what `confirm`
# would take. See validation/<engine>/screens/title-copy.test.ts.
validation = { script = "screens/title-copy.test.ts", outputs = [
  { id = "title", name = "The title screen", kind = "image" },
] }
[[review.categories.items]]
id = "menu-highlight-down"
title = "down moves the menu highlight on"
description = "On a screen carrying a vertical menu, down moves menuIndex on by one item."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: on the title, press ArrowDown from the first item and
# assert the second is highlighted. `up` is the point beside this one, so a
# build that reads one of the two keys and not the other loses one point rather
# than both. The title menu has exactly two entries, so a step-size error trips
# this point and the wrap points alike; the converse does not hold, which is
# what keeps them apart. See
# validation/<engine>/screens/menu-highlight-down.test.ts.
validation = { script = "screens/menu-highlight-down.test.ts", outputs = [
  { id = "menu", name = "The title menu with the second item highlighted", kind = "image" },
] }
[[review.categories.items]]
id = "menu-highlight-up"
title = "up moves the menu highlight back"
description = "On a screen carrying a vertical menu, up moves menuIndex back by one item."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: on the title, pose the highlight on the second item with
# `setMenuIndex`, press ArrowUp and assert the first is highlighted. The pose is
# what keeps this independent of `down`: a build whose `down` never worked is
# still asked this question. See
# validation/<engine>/screens/menu-highlight-up.test.ts.
validation = { script = "screens/menu-highlight-up.test.ts", outputs = [
  { id = "menu", name = "The title menu with the first item highlighted again", kind = "image" },
] }
[[review.categories.items]]
id = "menu-highlight-wraps-up"
title = "The menu highlight wraps at the top"
description = "up from the first menu item highlights the last."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: on the title, press ArrowUp from the first item and
# assert the last is highlighted. A build that clamps at the top instead of
# wrapping fails here and passes the step points. The bottom end is the point
# beside this one, because clamping at the top and clamping at the bottom are
# two different mistakes. See
# validation/<engine>/screens/menu-highlight-wraps-up.test.ts.
validation = { script = "screens/menu-highlight-wraps-up.test.ts", outputs = [
  { id = "menu", name = "The title menu wrapped to its last item", kind = "image" },
] }
[[review.categories.items]]
id = "menu-highlight-wraps-down"
title = "The menu highlight wraps at the bottom"
description = "down from the last menu item highlights the first."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: on the title, pose the highlight on the last item with
# `setMenuIndex`, press ArrowDown and assert the first is highlighted. The pose
# is what keeps this independent of the top end and of `up`. See
# validation/<engine>/screens/menu-highlight-wraps-down.test.ts.
validation = { script = "screens/menu-highlight-wraps-down.test.ts", outputs = [
  { id = "menu", name = "The title menu wrapped back to its first item", kind = "image" },
] }
