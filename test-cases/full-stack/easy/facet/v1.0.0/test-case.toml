# --- Levels and the End of a Round --------------------------------------------
# The round's arc is six points: the derived target, the advance, what the
# advance keeps, the derived legal-swap flag, the end condition, and the
# priority between the last two — a board that is both complete and dead
# resolves as a level, not as a game over, and a build that tests them in the
# other order fails exactly that point.
#
# `gameover-no-legal-swap` and the two points that share its route reach a dead
# board the only way the specification allows: a chain is opened, the board is
# rewritten underneath the holding step with `setGem` (which leaves the phase
# and the screen standing), and the step then reads a board that seeds nothing.
# A board posed with `loadBoard` cannot be relied on to still be dead after a
# chain has resolved on it, because R9's refill is the build's own draw.
[[review.categories]]
id = "levels"
title = "Levels and the End of a Round"
[[review.categories.items]]
id = "level-target-derived"
title = "The level target is 2000 times the level"
description = "levelTarget reports LEVEL_TARGET_STEP (2000) times level, so level 1 asks 2000 and level 4 asks 8000."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: pose several levels in turn and read the target back
# against LEVEL_TARGET_STEP x level. See
# validation/<engine>/levels/level-target-derived.test.ts.
validation = { script = "levels/level-target-derived.test.ts", outputs = [
  { id = "hud", name = "The level readout at a posed level", kind = "image" },
] }
[[review.categories.items]]
id = "level-advances"
title = "Reaching the target opens the next level"
description = "When phase returns to idle with levelScore at or past levelTarget, level rises by 1, levelScore returns to 0, and a fresh opening board is dealt that holds no run and carries a legal swap."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose the level score at the target the round REPORTS —
# what that figure ought to be is `level-target-derived`'s point — accept a swap,
# advance until the phase returns to idle, and assert the level rose, the level
# score returned to 0, the screen is still playing, and the fresh board carries
# no maximal run and a legal swap. That the dealt board is FRESH is read through
# the opening board's own definition — R7 guarantees the settled board carries
# strain and an opening board carries none. See
# validation/<engine>/levels/level-advances.test.ts.
validation = { script = "levels/level-advances.test.ts", outputs = [
  { id = "levelup", name = "The next level's fresh board", kind = "replay" },
] }
[[review.categories.items]]
id = "level-score-carries"
title = "The score carries across a level"
description = "score keeps what the round earned when the level rises."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: pose a score, pose the level score at the target the
# round reports, drive one scoring step, READ the score that step left, and
# assert that same figure is still standing after the level rose and the level
# score returned to 0. The board is rewritten under the running step so the chain
# ends after its one scoring step and no refill draw can move the figure between
# the two readings; what the step was worth is not named here. See
