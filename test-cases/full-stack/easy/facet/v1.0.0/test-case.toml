# --- Runs and Seeding (R4, R5) ------------------------------------------------
# R4 decides what a run IS and R5 what a step is seeded with, so they share a
# category and split into seven points: the two orientations, a run that is
# maximal at four, the prism that joins nothing, the union of every run on the
# board, and R5's two prism seedings, which are separate sentences and
# separately breakable.
#
# Nothing on the surface exposes the clear set itself, or the board between the
# removal of a step's clear set and the settling that ends the step, so "exactly
# those cells were emptied" is evidenced through where R9's fall left the
# survivors. Two consequences, both honest: a build with a correct R4/R5 and a
# broken R9 fails these points as well, and a cell whose post-step occupant is a
# gem R7 strained is left unread here rather than annexing `strain`'s behavior
# into a `runs` point.
#
# Every scenario here accepts a swap, so every one of them drives SWAP_SECONDS
# of game time before the settled board is read: the frame that accepts a swap
# clears nothing.
[[review.categories]]
id = "runs"
title = "Runs and Seeding (R4, R5)"
[[review.categories.items]]
id = "r4-horizontal-run"
