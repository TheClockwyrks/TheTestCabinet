# --- Cuts (R8) ----------------------------------------------------------------
# Seven points: one per creation row, the priority between them, the run
# placement rule, the star's intersection, and the sentence that a prism-seeded
# step creates nothing at all. Priority and placement are separate points from
# creation because a build can make the right gem and put it in the wrong cell,
# or make the wrong one of two that both apply.
#
# R8 (step 6) and R9 (step 7) both fall inside the step a swap resolves on, and
# the snapshot is the only reading the surface offers, so there is no
# observation of the board between placement and the fall. Every placement
# scenario is therefore posed on a HORIZONTAL run, where each of the run's
# columns loses exactly one cell and the created gem provably cannot be moved by
# R9 — which means a vertical-run placement is not observable under this surface
# at all.
[[review.categories]]
id = "cuts"
title = "Cuts (R8)"
[[review.categories.items]]
