# --- Levels and the End of a Round --------------------------------------------
# The round's arc is ten points. Six cover the rules that decide where a settled
# board sends the player: the derived target, the level ending, what the ending
# keeps, the derived legal-swap flag, the end condition, and the priority between
# the last two — a board that is both complete and dead resolves as a completed
# level, not as a game over, and a build that tests them in the other order fails
# exactly that point. Four more cover the two choices the level-clear menu
# offers, because reaching that screen is only half of a level ending: the next
# level has to be opened, dealt, and measured from zero, or the round abandoned.
#
# What the level-clear screen DRAWS is the `screens` category's; what the level
# transition DOES is here. The two are separate because a build can raise the
# right screen and open the next level wrongly, or the other way about.
#
# `gameover-no-legal-swap` and the two points that share its route reach a dead
# board the only way the specification allows: a chain is opened, the board is
# rewritten underneath the holding step with `setGem` (which leaves the phase
# and the screen standing), and the step then reads a board that seeds nothing.
# A board posed with `loadBoard` cannot be relied on to still be dead after a
# chain has resolved on it, because R9's refill is the build's own draw.
[[review.categories]]
id = "levels"
title = "Levels and the End of a Round"
[[review.categories.items]]
id = "level-target-derived"
title = "The level target is 2000 times the level"
description = "levelTarget reports LEVEL_TARGET_STEP (2000) times level, so level 1 asks 2000 and level 4 asks 8000."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: pose several levels in turn and read the target back
# against LEVEL_TARGET_STEP x level. See
# validation/<engine>/levels/level-target-derived.test.ts.
validation = { script = "levels/level-target-derived.test.ts", outputs = [
  { id = "hud", name = "The level readout at a posed level", kind = "image" },
] }
[[review.categories.items]]
id = "level-advances"
title = "Reaching the target ends the level"
description = "When phase returns to idle with levelScore at or past levelTarget, screen becomes levelclear with menuIndex 0, and level, levelScore, bestChain and bestMove hold what the level left them at with the board standing as the chain left it."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: pose the level score at the target the round REPORTS —
# what that figure ought to be is `level-target-derived`'s point — accept a swap,
# advance until the phase returns to idle, and assert the screen is `levelclear`
# with the menu at its first item, that the level did NOT rise, that the level
# score was not zeroed, and that the settled board is the one the chain left
# rather than a fresh deal. The board is read through the opening board's own
# definition: R7 guarantees a settled board carries strain and a fresh deal
# carries none, so a build that dealt on reaching the target rather than holding
# the screen is caught here. What CONTINUE then does is
# `continue-opens-next-level`'s. Capped at `broken` because a build that never
# raises this screen has no route past its first level: the round simply keeps
# playing on a board it has already won. See
# validation/<engine>/levels/level-advances.test.ts.
validation = { script = "levels/level-advances.test.ts", outputs = [
  { id = "levelup", name = "A level ending on the board it was won on", kind = "replay" },
] }
[[review.categories.items]]
id = "level-score-carries"
title = "The score carries across a level"
description = "score keeps what the round earned when the next level is opened."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: pose a score, pose the level score at the target the
# round reports, drive one scoring step, READ the score that step left, take
# CONTINUE, and assert that same figure is still standing once the next level's
# board is dealt and the level score has returned to 0. The board is rewritten
# under the running step so the chain ends after its one scoring step and no
# refill draw can move the figure between the two readings; what the step was
# worth is not named here. See
# validation/<engine>/levels/level-score-carries.test.ts.
validation = { script = "levels/level-score-carries.test.ts", outputs = [
  { id = "levelup", name = "The score standing through a level change", kind = "replay" },
] }
