# --- Expansion (R6) -----------------------------------------------------------
# R6's three additions are three points, plus the clause that clips the
# brilliant's ring at a board edge and the least-fixed-point sentence that
# closes the set. The closure is checked as a point of its own because a build
# can implement all three additions correctly and still apply them in one pass,
# which is a different rule.
#
# Every membership scenario here is read through R9's fall, for the reason given
# above the `runs` category: the snapshot carries the SIZE of the last clear set
# and nothing about its membership. The brilliant scenarios are therefore posed
# at the BOTTOM of the board — a clear at the top of a column moves no survivor,
# so the settled board would say nothing about which cells were emptied.
#
# The three wave points are the exception, and they are read directly, because
# R6's wave numbering is exactly what `lastWaves` reports. A wave changes nothing
# about which cells the set holds, what it scores, or what is removed — it is
# what times the shattering — so each of the three poses a set whose membership
# is already fixed by a point above and reads only the figure the numbering
# gives: a seed alone is 0, one addition out is 1, and an addition reached
# through another addition is 2. That ladder is what separates a build that
# numbers waves from one that reports a constant.
[[review.categories]]
id = "expansion"
title = "Expansion (R6)"
[[review.categories.items]]
id = "r6-brilliant-ring"
title = "A brilliant takes the eight cells around it"
description = "A brilliant in the clear set adds each of the eight cells surrounding it that lies on the board."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose a brilliant well inside the board sitting in the
# run the swap completes, its eight neighbors ordinary, unflawed and uncut, and
# assert the run's cells plus all eight ring cells were taken, counting the
# overlap once. See validation/<engine>/expansion/r6-brilliant-ring.test.ts.
validation = { script = "expansion/r6-brilliant-ring.test.ts", outputs = [
  { id = "clear", name = "A brilliant taking its ring", kind = "replay" },
] }
[[review.categories.items]]
