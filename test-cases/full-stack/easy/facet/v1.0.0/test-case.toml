# and again at a point inside GEM_HIT_R of it and outside every other cell's,
# and assert that cell is selected each time. Every point is posed at an exact
# stage coordinate, so there is no sampling noise to tolerate. See
# validation/<engine>/pointer/press-selects.test.ts.
validation = { script = "pointer/press-selects.test.ts", outputs = [
  { id = "select", name = "A cell selected by the pointer", kind = "image" },
