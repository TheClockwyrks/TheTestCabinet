# --- Settling and Refill (R9) -------------------------------------------------
# R9 is the rule every other rule's evidence passes through, which is why the
# fall itself is capped at `broken` — a build that settles wrongly cannot be
# read correctly on R4 through R8 either. Eight points: four on where the gems
# end up — where a survivor lands, what it carries with it, what fills the cells
# nothing landed in, and that the board is whole again by the time the step ends
# — and four on `fell`, the figure R9 leaves on every gem saying how far it came.
#
# `fell` is split into four points because R9's table has four rows and a build
# can answer one and not the next: an exact drop, an unmoved gem, a refill from
# above the board, and a board that was written rather than fallen into. The
# refill row states a FLOOR and not a figure, and only that floor is asserted,
# because specs/rules.md hands the choice above it to the build.
#
# What the refill's kind is drawn FROM is asserted (one of GEM_KINDS, plain, at
# strain 0); that the draw is UNIFORM is not, because deciding a distribution
# off a settled board would take either the build's own generator or a
# statistical test, and this case ships neither an opinionated validator nor one
# tuned to a reference.
