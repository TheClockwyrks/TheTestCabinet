# --- The Chain Step -----------------------------------------------------------
# A move has two halves in time — the swap travelling between its two cells, and
# the chain resolving behind it — and this category holds both, because the
# second cannot be read without the first. Nine points. Three cover the swap:
# that it holds without clearing anything, that it resolves into step 1 when
# SWAP_SECONDS is up, and that its timer runs; a fourth, that a second swap over
# it is refused, sits in `moves` where R2 lives. Five cover the step: it runs on,
# it holds the board for its OWN length rather than a fixed one, that length
# answers to the fall, it ends, and R8 creates before R9 settles so a created gem
# falls in the step it was made in. The ninth, `step-hold-derived`, reads the
# arithmetic that gives a step its length.
#
# The step's hold is the figure the whole category turns on. specs/rules.md
# derives it from what the step itself did — the depth of the shattering and the
# height of the fall — so `chain-cadence` reads the step's own reported
# `stepHold` rather than a constant, and `step-waits-for-the-fall` poses a fall
# long enough that a build holding a flat STEP_SECONDS resolves its next step
# early and fails there while passing everything else. That is the whole reason
# the two are separate points.
#
# `chain-second-step` and `score-multiplier` both compute their expectation from
# the board the first step actually settled, read back out of the snapshot,
# rather than from a prediction. That is what keeps R9's random refill out of
# the assertion: the check derives the clear set the spec gives for exactly the
# board in front of it, whatever the build's generator dealt into it.
[[review.categories]]
id = "chain"
title = "The Chain Step"
[[review.categories.items]]
