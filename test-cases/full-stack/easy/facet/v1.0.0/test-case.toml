# board, advance past the step's reported `stepHold`, and assert the chain step
# rose to 2 and that set's size was taken. See
# validation/<engine>/chain/chain-second-step.test.ts.
validation = { script = "chain/chain-second-step.test.ts", outputs = [
  { id = "chain", name = "A chain running on into its second step", kind = "replay" },
] }
