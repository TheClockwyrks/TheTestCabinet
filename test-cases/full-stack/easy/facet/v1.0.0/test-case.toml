# --- Produced Assets ----------------------------------------------------------
# This is the full-stack half of the case: the build DRAWS its own gem sprites,
# break sheets, particle systems and sound during the run rather than receiving
# them. Six points read the built tree, and three read the running game, because
# a produced file that never loads is not a produced asset.
#
# No spec sentence fixes a file or directory NAME anywhere under `assets/`,
# which bounds what a script can decide and is worth a reviewer knowing. A
# single sprite and one frame of a sheet are indistinguishable on disk, so the
# sprite count is taken per directory and the largest is read, which counts a
# build that keeps its sprites together and not its sequences' frames; a build
# that split its sprites across several directories would be failed although it
# is compliant. For the same reason the prism's idle turn cannot be told from a
# break sheet on disk, so the seven-sequence floor is met by six break sheets
