# --- Keyboard Controls --------------------------------------------------------
# Every one of these drives a real key through the input path rather than posing
# the action, because specs/controls.md fixes the whole binding table for a
# build of EVERY engine — the keys are the game's, not the runtime's — so one
# key is the route under all three. The four movement directions are four
# points, since a build can invert one axis and not the other, and the four rows
# of the press table that `confirm` acts through are four more, since they are
# four distinct outcomes evaluated in order.
#
# `cursor-stays-on-board` poses the cursor at each corner rather than walking it
# there. Walking would make the clamp point also assert that the movement
# actions work at all, which is precisely the four points above it, and would
# charge one build two points for one fault. The consequence is stated plainly:
# a build with a dead keyboard passes this one point and fails the five around
# it.
