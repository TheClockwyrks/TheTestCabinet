# --- Pointer Controls ---------------------------------------------------------
# The press table's four rows are four points here as well, since a pointer
# press and a `confirm` reach them by different paths and a build can wire one
# and not the other. `press-miss` covers the GEM_HIT_R door itself, and the drag
# is two points: that it requests the swap, and that it requests at most one.
#
# `press-miss` reads the sentence as specs/instrumentation.md spells it out —
# the board and the selection stand as they were — rather than as "changes
# nothing" literally, because the snapshot's `pointer` field mirrors every press
# on every screen by design, and is `pointer-mirrored`'s subject. That last
# point is the one here driven through the REAL pointer verbs: a build whose
# update ends by reading the runtime's pointer, which is exactly what "refreshed
# in every update" asks for, discards a posed position on the next frame.
[[review.categories]]
id = "pointer"
title = "Pointer Controls"
[[review.categories.items]]
