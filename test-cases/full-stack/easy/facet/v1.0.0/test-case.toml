domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: run the same scenario with the brilliant on a left edge
# (five neighbors on the board) and again at a bottom corner (three), asserting
# the count matches the on-board neighbors each time. Both are posed mid-column
# or lower so the emptying is legible through the fall. See
# validation/<engine>/expansion/r6-brilliant-edge.test.ts.
validation = { script = "expansion/r6-brilliant-edge.test.ts", outputs = [
  { id = "clear", name = "A brilliant clipped by the board edge", kind = "replay" },
] }
