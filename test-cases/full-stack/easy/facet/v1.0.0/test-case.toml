failure_cap = "passable"
# Automated validation: drive a step of a counted size and value and read both
# readouts, then drive a larger, differently valued step and assert both moved
# to that step's figures. What the two fields hold BETWEEN boards is never read:
# the specification puts them at 0 under `reset` and does not name them among
