# --- The Board ----------------------------------------------------------------
# `loadBoard` is the operation every rule point poses its scenario through, so
# it is checked head-on and capped at `broken`: a build that poses a board
# approximately makes every R1-R9 point read a fiction. `board-rests` is its
# companion — a posed board that started resolving itself would silently rewrite
# the fixture out from under the check that posed it.
#
# The opening board's four stated properties are four points, not one, so a deal
# that carries a run fails exactly that and not the three beside it. Each sweeps
# twelve seeds and asserts nothing about any particular one; every seed swept is
# positive, because specs/instrumentation.md fixes what `options.seed` DOES and
# not what values it may take, and a build over a shift-register generator is
# entitled to be stuck at zero.
#
# `opening-falls-in` reads the fourth of those properties, that the whole board
# is dealt in from above. It asserts the FLOOR specs/rules.md states and no more:
# which figure at or above `row + 1` a dealt gem carries is the build's, because
# that is what decides the shape a column fills in.
[[review.categories]]
id = "board"
title = "The Board"
# TWO ITEMS, because `loadBoard` makes two claims and a build can hold one
# without the other. What it WRITES is the board; what it LEAVES is everything
# else. A build that writes the cells correctly and quietly settles the chain
# with them rewrites the world under every scenario that poses a board over a
# move already in motion, and it would grade identically to a correct build if
# the two claims shared a point.
