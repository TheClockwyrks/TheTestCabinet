# --- Scoring ------------------------------------------------------------------
# The two per-gem rates are two points, the multiplier a third, and where the
# points land a fourth, because a build can compute the sum correctly and add it
# to one figure only. `last-step-reported` covers the two readouts the HUD and
# the reviewer both read the step through.
#
# The three figures a level is measured by are three more, and they are separate
# from the sum because each is a different accumulation over it: `moveScore` runs
# over one move and empties at the next accepted swap, `bestMove` is a maximum
# taken when a move ends, and `bestChain` is a maximum taken at every step. A
# build can hold any one of them and not the others, and `levelclear` shows two
# of them to the player, so each is worth its own point.
#
# MAX_MULTIPLIER's clamp is NOT covered here, and deliberately: M only stops
# rising at chain step 9, `chainStep` is not writable, and every step past the
# first depends on R9's refill, so a nine-step chain can only be reached by
# hunting a seed that works on one particular build — which would be a validator
# derived from a reference. `score-multiplier` stays inside the unclamped range
# and says so. `bestChain` is writable through `setBestChain`, but that operation
# poses the figure rather than the chain, so it opens no route to the clamp
# either.
[[review.categories]]
id = "scoring"
title = "Scoring"
[[review.categories.items]]
id = "score-base-rate"
title = "A clean gem scores BASE_SCORE"
description = "On chain step 1, each cleared gem carrying strain 0, 1 or 2 adds BASE_SCORE (10) times the step's multiplier of 1."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: clear a run of three carrying strains 0, 1 and 2 with
