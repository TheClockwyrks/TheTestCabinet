validation = { script = "audio/mute-preserves-play.test.ts", outputs = [
  { id = "muted", name = "A chain driven with sound muted", kind = "replay" },
] }
[[review.categories.items]]
id = "music-plays"
title = "Music plays under the game"
description = "A produced music piece is playing on the title screen, and a further piece starts when the round begins, so one of the two is under every screen."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: arm audio on the title, where no cue event can fire, and
# assert a sound goes out there — which answers that a piece is playing — then
# pose the round beginning and assert a further looping start on the frames that
# follow. Under `none` a bed started from an asynchronous decode begins between
# frames and is attributable to none of them, which is why the title half reads
# that a sound went out at all rather than reading the looping channel. See
# validation/<engine>/audio/music-plays.test.ts.
validation = { script = "audio/music-plays.test.ts", outputs = [
  { id = "music", name = "The title screen the theme was heard on", kind = "image" },
] }
