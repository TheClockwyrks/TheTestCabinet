domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: complete a maximal run of exactly four, bounded by other
# kinds, with no crossing run and nothing for R6 to expand, and assert the
# settled board holds exactly one more brilliant than before, of the run's kind,
# at strain 0. See validation/<engine>/cuts/r8-brilliant-from-four.test.ts.
validation = { script = "cuts/r8-brilliant-from-four.test.ts", outputs = [
  { id = "cut", name = "A brilliant cut from a run of four", kind = "replay" },
] }
