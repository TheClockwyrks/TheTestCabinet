domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose gems at strain 1 and 2 and a brilliant two or more
# rows above the clearing run, so none of them is orthogonally adjacent to the
# clear set and R7 adds nothing to confuse the reading, then find each at its
# new cell and assert its strain and its cut are what they were. See
# validation/<engine>/settling/r9-carries-strain-and-cut.test.ts.
validation = { script = "settling/r9-carries-strain-and-cut.test.ts", outputs = [
  { id = "fall", name = "Marked stones falling with their strain and cut", kind = "replay" },
] }
[[review.categories.items]]
id = "r9-refill-plain-zero"
title = "Refilled cells hold plain gems at strain 0"
description = "Every cell still empty after the fall is filled from the top of its column with a plain gem at strain 0 whose kind is one of GEM_KINDS."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: drive a step that empties a counted number of cells from
# several columns and assert the topmost cells of each report cut `plain`,
# strain 0 and a kind among the seven. Every survivor in those columns is posed
# at strain 2, so a refill and a survivor can never be mistaken for one another
# and the "from the top of its column" clause is decidable. See
# validation/<engine>/settling/r9-refill-plain-zero.test.ts.
validation = { script = "settling/r9-refill-plain-zero.test.ts", outputs = [
  { id = "refill", name = "Fresh stones dropping in from the top", kind = "replay" },
] }
[[review.categories.items]]
