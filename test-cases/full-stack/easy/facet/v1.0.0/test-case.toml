[[review.categories.items]]
id = "mute-preserves-play"
title = "Muting does not change play"
description = "With the mute bit set from the mute key, a drive reaches the same board, the same score, the same phase and the same elapsed game time as the same drive unmuted, and the events on the way still land."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: drive one scenario twice from one seed, once muted from
# the bound key and once not, and assert the two agree on the board written back
# in the board notation, the screen, the phase, the chain step, both scores, the
# level, the last step's figures, the level's best move and longest chain, the
# legal-swap flag, the selection and the offer, and on the frames taken and the
# game time covered since the board was posed — with the mute flag the one field
# that differs. Silence itself is not read: the specification puts muting on the
# runtime, so a muted frame is entitled to raise its cue and let the runtime zero
# it. See validation/<engine>/audio/mute-preserves-play.test.ts.
validation = { script = "audio/mute-preserves-play.test.ts", outputs = [
  { id = "muted", name = "A chain driven with sound muted", kind = "replay" },
] }
[[review.categories.items]]
id = "music-title"
title = "The title theme plays on the title screen"
description = "A produced music piece is playing on the title screen."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: arm audio on the title, where no cue event can fire, and
# assert a piece is playing there. The engine suites read the looping channel,
# which their engine's cue bus separates from one-shots; under `none` the whole
# audio layer is inside the build and a bed started from an asynchronous decode
# begins between frames, so the `none` script reads that a sound went out at all.
# On this screen the two answer the same question, because no cue event can fire
# there. The play bed is `audio/music-round`'s point: a build that ships a title
# theme and no bed passes here and fails there. See
# validation/<engine>/audio/music-title.test.ts.
validation = { script = "audio/music-title.test.ts", outputs = [
  { id = "music", name = "The title screen the theme was heard on", kind = "image" },
] }
[[review.categories.items]]
id = "music-round"
title = "The play bed sits under a round"
description = "A further produced music piece starts when the round begins and stays under the round across a screen change."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: warm the build's audio on the title, pose the round
# beginning, and assert a further looping start on the frames that follow. Which
# of the four play screens the bed is under is not read one by one: specs/ui.md
# gives the two pieces one boundary between them, at the round beginning.
#
# THE TWO ENGINE SUITES DECIDE ONE READING MORE THAN `none` DOES. Their engine's
# cue bus announces a bed STOPPING as well as starting, so they carry a second
# reading over a pause and hold a build to the play bed surviving a screen change
# inside the round — the other half of "a bed that sits under a round", and one
# requirement with it rather than a point of its own. An engineless build owns
# its whole audio layer and nothing outside it announces a source being cut off,
# so a build that carried its bed across and one that simply stopped it are the
# same reading from there. The `none` script therefore stops at the round's own
# start, and says so in its header. The asymmetry is the honest one: the
# alternative is an assertion the harness cannot see. See
# validation/<engine>/audio/music-round.test.ts.
validation = { script = "audio/music-round.test.ts", outputs = [
  { id = "music", name = "The bed running once the round had begun", kind = "image" },
] }
[[review.categories.items]]
id = "cue-land"
title = "Land cue"
description = "A chain step whose longest fall was more than LAND_MIN_ROWS (2) rows sounds the land cue as its gems land, on the frame stepTimer crosses LAND_AT."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: arm audio, drive a step that clears low in a tall column
# so its survivors and its refill fall well past LAND_MIN_ROWS, read the step's
# own reported lastWaves and lastFall to work out where LAND_AT falls, and assert
# a sound went out on the frame the step timer crossed it and that the frames
# between the step resolving and that one were silent. The silent run in between
# is what attributes the sound to the landing rather than to the clear the step
# already sounded. See validation/<engine>/audio/cue-land.test.ts.
validation = { script = "audio/cue-land.test.ts", outputs = [
  { id = "land", name = "A column of stone arriving at the bottom", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-land-only-for-a-long-fall"
title = "A short fall sounds no land cue"
description = "The land cue answers to the step's own longest fall, so a chain step whose lastFall is at or under LAND_MIN_ROWS (2) rows plays no land cue at all."
domains = ["gameplay"]
failure_cap = "great"
# Automated validation: drive the step that moves the board least — a horizontal
# run of three along the top row, which leaves no survivor to fall and refills
# three cells at row 0 — read the step's OWN reported `lastFall`, and assert the
# land cue sounded on that step exactly when that figure is more than
# LAND_MIN_ROWS: nothing between the resolving frame and the end of the hold when
# it is not, and a sound at that step's LAND_AT when it is. The reading has to be
# conditional on the build's figure, because no arrangement can hold `lastFall`
# down from the outside: specs/rules.md hands each refilled gem's own `fell` to
# the build above a floor of row + 1, so a build that deals its refill from high
# above the board is entitled to the knock even here. What the point decides
# either way is the THRESHOLD — that the cue answers to the step's fall rather
# than sounding on every step — which is exactly what a build that plays it
# unconditionally fails. See
# validation/<engine>/audio/cue-land-only-for-a-long-fall.test.ts.
validation = { script = "audio/cue-land-only-for-a-long-fall.test.ts", outputs = [
  { id = "quiet", name = "A short fall landing quietly", kind = "replay" },
] }

# --- Showcase -----------------------------------------------------------------
# specs/showcase.md asks the finished game for its store-page presentation: a
# `showcase/` directory holding a description, a carousel, and the media the two
# name. It is a deliverable of the build like any other, so it carries a point.
#
# ONE point, and it grades EXISTENCE alone, WEIGHTED at 3 because what fails is a
# whole deliverable rather than one behavior of the game. Whether the description
# reads like something a player would want to play, whether the carousel opens on
# the strongest view of live play, and whether the media is worth looking at is a
# reviewer's judgement, and belongs to the AESTHETIC rating rather than to an
# assertion. The validator's whole verdict is that the two files are there and
# that the carousel points at a file that is there with them: not a dimension,
# not a byte of a picture, not a word of the prose. No other item on this
# checklist asserts anything about the media.
#
# Capped at `great`: a missing showcase leaves the game itself exactly as
# playable as it was, which is what that cap is for.
#
# The script drives nothing. It reads the produced tree with `node:fs`, so one
# suite stands unchanged in all three engine directories and the point means the
# same thing whichever engine the run selected. What it hands back as evidence is
# a `.png` copied out of the build's own showcase, so a reviewer sees the picture
# the build chose to present its game with beside the verdict.
[[review.categories]]
id = "showcase"
title = "Showcase"
[[review.categories.items]]
id = "exists"
title = "The game ships its showcase"
description = "showcase/showcase.md and showcase/showcase.toml are present at the root of the produced repository, and at least one file the carousel names is present in showcase/."
weight = 3
domains = ["gameplay"]
failure_cap = "great"
# Automated validation: read the produced tree, confirm the description and the
# carousel are both there, and confirm the carousel names a file present beside
# them; the still handed back is a `.png` copied out of the showcase itself.
# Nothing about the media is checked beyond its being there. See
# validation/<engine>/showcase/exists.test.ts.
validation = { script = "showcase/exists.test.ts", outputs = [
  { id = "carousel", name = "A screenshot from the build's showcase", kind = "image" },
] }
