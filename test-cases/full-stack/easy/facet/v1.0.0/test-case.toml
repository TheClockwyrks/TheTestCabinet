# --- Move Rules (R1-R3) -------------------------------------------------------
# The three move rules are split by clause rather than by rule, so a build that
# enforces adjacency and forgets productivity fails one point instead of the
# category. R1 contributes two — the accepted shape and the refused one — R2
# one, and R3 two, because the prism exemption is a separate sentence from the
# run requirement and a build can get either wrong on its own.
#
# The refusal itself is two more points, its mark and its lifetime.
# `refusal-marked` compares the reported pair as a SET: specs/rules.md fixes
# that a refused swap names its two cells and specs/instrumentation.md fixes the
# reported shape, but neither says which of the two is reported as `a`, so a
# build that reports them in the other order is conformant on every word that
# was written.
