# --- HUD ----------------------------------------------------------------------
# Three readouts and one absence. specs/ui.md fixes each readout's label and the
# state field it shows, and fixes no numeric format, so every scenario poses the
# surrounding figures such that the digits under test are the only ones of their
# value that can be on the frame — a level whose target carries no digit of the
# score, a zeroed level score, and so on. A build free to draw a numeral the
# specification never mentions could still answer such a reading spuriously,
# which is a false pass and never a false failure.
#
# `hud-chain-shown` requires the frame to carry the multiplier the build's own
# state reports at that moment, because that is what the readout is defined as
# showing. Whether that value is the min(chainStep, MAX_MULTIPLIER) the rules
# derive is `scoring/score-multiplier`'s point, not this one's.
[[review.categories]]
id = "hud"
title = "HUD"
[[review.categories.items]]
id = "hud-score"
title = "The score is drawn"
description = "A frame of the playing screen draws HUD_SCORE_LABEL (SCORE) and the current score, and the figure changes with it."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose a three-digit score, render, and find the label and
# the figure among the frame's text; pose a second three-digit score and assert
# the drawn figure followed. Three digits keep any thousands separator a build
# might use out of the figure. See validation/<engine>/hud/hud-score.test.ts.
