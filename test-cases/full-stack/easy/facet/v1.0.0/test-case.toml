# --- Expansion (R6) -----------------------------------------------------------
# R6's three additions are three points, plus the clause that clips the
# brilliant's ring at a board edge and the least-fixed-point sentence that
# closes the set. The closure is checked as a point of its own because a build
# can implement all three additions correctly and still apply them in one pass,
# which is a different rule.
#
# Every scenario here is read through R9's fall, for the reason given above the
# `runs` category: the snapshot carries the SIZE of the last clear set and
# nothing about its membership. The brilliant scenarios are therefore posed at
# the BOTTOM of the board — a clear at the top of a column moves no survivor, so
# the settled board would say nothing about which cells were emptied.
