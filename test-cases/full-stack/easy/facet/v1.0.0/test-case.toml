description = "A swap that puts MATCH_MIN (3) gems of one kind on consecutive cells of a single column clears exactly those three cells."
domains = ["gameplay"]
failure_cap = "broken"
# Automated validation: the same scenario turned through ninety degrees — a
# vertical three with nothing flawed or cut adjacent — asserting three cells
# cleared and that column's survivors fell by three. The two orientations are
# two points because a build can index rows and columns wrongly in one and not
# the other. See validation/<engine>/runs/r4-vertical-run.test.ts.
validation = { script = "runs/r4-vertical-run.test.ts", outputs = [
  { id = "clear", name = "A vertical three clearing", kind = "replay" },
] }
