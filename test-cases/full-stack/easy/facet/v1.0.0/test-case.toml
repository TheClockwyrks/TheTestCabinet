# which a gem beside the clear reaches MAX_STRAIN and one in which every
# neighbor is at strain 0, and assert the flawing frame sounded more than the
# control. Matching the sizes is what makes the difference attributable to the
# flaw rather than to the clear. Under an engine the cue is read by name
# instead. See validation/<engine>/audio/cue-flaw.test.ts.
validation = { script = "audio/cue-flaw.test.ts", outputs = [
  { id = "flaw", name = "The stone cracking through whose cue is checked", kind = "replay" },
] }
