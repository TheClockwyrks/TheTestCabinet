# resting value is never asserted against a fixed value, because the
# specification does not fix it. The second press is
# `keyboard/mute-key-flips-back`'s point: a build that only ever mutes passes
# here and fails there. See validation/<engine>/keyboard/mute-key-flips.test.ts.
validation = { script = "keyboard/mute-key-flips.test.ts", outputs = [
  { id = "mute", name = "The first frame drawn with the mute bit flipped", kind = "image" },
] }
[[review.categories.items]]
