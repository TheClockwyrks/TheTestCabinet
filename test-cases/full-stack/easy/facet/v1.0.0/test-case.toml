# TWO ITEMS, one per precedence relation. A build that resolves one of them and
# not the other hands the player the wrong cut on one class of board, and would
# grade exactly as a build that resolves neither if the two shared one point.
# Each asserts that exactly one gem was created, which is R8's own sentence.
[[review.categories.items]]
id = "r8-priority-prism-over-star"
title = "A contested cell takes a prism rather than a star"
description = "Where R8's prism row and its star row both apply to one cell, the prism wins, and that cell takes exactly one created gem."
domains = ["gameplay"]
failure_cap = "passable"
# Automated validation: pose a cell lying in a run of five and in a run of
