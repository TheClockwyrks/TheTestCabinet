# --- Keyboard Controls --------------------------------------------------------
# The keyboard drives the menus and nothing else: the board is played with the
# pointer alone. So this category holds the two actions that act outside a menu
# — `pause` and `mute` — the two keys `Escape` fires on the screens it acts on,
# and the negative that keeps the board clear of all of it. The menu movement
# `up` and `down` drive, and the choices `confirm` takes, are the `screens`
# category's, because what they decide is a screen.
#
# Every one of these drives a real key through the input path rather than posing
# the action, because specs/controls.md fixes the whole binding table for a build
# of EVERY engine — the keys are the game's, not the runtime's — so one key is
# the route under all three.
#
# `pause` carries two keys and they are two points, because each fires the action
# on its own and a build can bind one and miss the other. `Escape` fires `back`
# as well as `pause`, and the specification keeps the two apart by screen — the
# pair never both act on one screen — so `pause-escape` is read on `playing` and
# `back-key` on `howto`, and neither can be answered by the other's wiring.
[[review.categories]]
id = "keyboard"
title = "Keyboard Controls"
# specs/controls.md binds `confirm` to `Enter` and `Space` and `pause` to
# `Escape` and `KeyP`, then states that "each key listed for an action fires that
# action on its own". A two-key action is therefore two points: a build that
# wires one key and misses the other owes exactly one of them, and a build that
# misses both owes two. The `mute` key is one key and two points for the other
# reason — its effect table entry says "toggles", so the press that mutes and
# the press that restores sound are two behaviors a build can get one of.
[[review.categories.items]]
id = "pause-key"
title = "KeyP pauses a live board"
description = "Pressing KeyP while the screen is playing sets screen to paused with menuIndex 0."
domains = ["gameplay"]
failure_cap = "scuffed"
# Automated validation: pose a live board, press KeyP through the input path,
# advance one frame and assert the screen is paused with the menu at its first
# item. See validation/<engine>/keyboard/pause-key.test.ts.
validation = { script = "keyboard/pause-key.test.ts", outputs = [
  { id = "paused", name = "The pause menu opened by KeyP", kind = "image" },
] }
[[review.categories.items]]
id = "mute-key-flips"
title = "KeyM flips the mute bit"
description = "Pressing KeyM flips the snapshot's muted flag away from where it rested."
domains = ["gameplay"]
failure_cap = "great"
# Automated validation: pose a live board, read the resting `muted` flag, press
