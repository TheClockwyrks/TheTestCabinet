# --- Screens and Navigation ---------------------------------------------------
# Five screens and the ways between them. A transition whose point is the SCREEN
# it reaches — PLAY, HOW TO PLAY, RESUME, QUIT — is driven through the pose
# specs/instrumentation.md gives for that choice, so no menu's ordering enters a
# check that is not about the menu; the two points that ARE about the menu drive
# real keys. PLAY and PLAY AGAIN are one point, and QUIT from both menus is one,
# because the specification says each pair is the same choice.
#
# The frame readings here decide only that a piece of copy is on screen, which
# is all specs/ui.md fixes — it fixes the words and no font, layout or call
# count. A text search cannot tell a menu ENTRY from the same word in prose, so
# a build that dropped an entry whose word appears elsewhere on the screen would
# answer; localizing a draw by position is the only way to separate them, and
# this case does not assert layout.
