# Maze mode: the grid-serpent run on a board laced with fixed fatal interior
# obstacles. Threading the obstacle course is a distinct skill, so it is rated on its
# own scoring domain alongside the common gameplay and presentation domains. This
# variant seeds no mode spec of its own (the Maze mode is the `maze` branch of the
# common `specs/gameplay.md.hbs`); it supplies its own `title` menu and the review
# item that rolls up to the `maze` domain.
slug = "maze"
name = "Maze"
description = "Maze mode: the grid-serpent run on a board laced with fixed fatal interior obstacles to thread."

# This variant seeds no spec of its own: the mode — its menu entry (`MAZE`), the
# board, and the fixed course of fatal interior obstacles the snake must thread — is
# the `maze` branch of the common `specs/gameplay.md.hbs`, selected by the variant
# slug when that template is rendered for this variant.

# This variant's three views, all captured from a playable Maze build and served as-is
# (the former `menu-maze.html` mockup is gone): the title menu (`MAZE` / `HOW TO PLAY`,
# with the obstacle course dimmed behind it), the in-play board — laced with the fixed,
# fatal obstacle bars this mode is about — and the game-over panel, through which those
# bars and the `MAZE` HUD tag are still visible.
reference = [
  { view = "title", media = "reference/screenshots/maze/title.png" },
  { view = "gameplay", media = "reference/screenshots/maze/gameplay.png" },
  { view = "game-over", media = "reference/screenshots/maze/game-over.png" },
]

# The authored, *correct* playable build of this variant — the Maze-mode reference-impl. It is a
# copy of the `base` project with its single mode flipped to Maze (the one line in `src/mode.ts`),
# so it laces the board with the four fixed, fatal obstacle bars. A directory (resolved against
# the version folder) holding a buildable web project, built with this case's install/build
# commands and deployed like a published run build, then shown on the case's "Reference" tab. It
# is **never seeded into a run**. This is a full-stack case, so this build also PRODUCED its own
# snake sprites and audio during authoring (committed under `reference-impl/maze/assets/`); the
# build itself only loads them, so `npm ci && npm run build` is self-contained. Its three
# reference screenshots above were captured from this very build.
reference_implementation = "reference-impl/maze"

[[domain]]
id = "maze"
name = "Maze"
description = "The Maze mode: fixed fatal interior obstacles the snake must navigate around."

# The Maze mode's own review items, in the categories grammar inherited from the case
# manifest (`[review] format = 2` is declared there; a variant only adds
# `[[review.categories]]` and must not repeat the format). The single v1 `maze-obstacles`
# point is split into four narrow, single-behavior items — one broad point per rule the
# reviewer would otherwise have to hold in mind at once — each recorded under the composite
# id `maze.<item id>`. They are absent for the Classic (`base`) variant, which has no
# obstacles.
[[review.categories]]
id = "maze"
title = "Maze"
[[review.categories.items]]
id = "obstacles-fatal"
title = "Obstacles are fatal like walls"
description = "The head advancing into an interior obstacle cell ends the round immediately as a death, exactly like a wall."
# Automated validation: pose the head one cell from an obstacle facing it, step, and
# confirm the round ended dead. See validation/maze/obstacles-fatal.mjs.
validation = { script = "validation/maze/obstacles-fatal.mjs", outputs = [
  { id = "obstacle", name = "A fatal obstacle hit", kind = "video" },
] }
[[review.categories.items]]
id = "obstacles-layout"
title = "The obstacle layout is the fixed, symmetric course"
description = "The board carries the fixed course of interior obstacle cells, point-symmetric about the board center, with the snake's start row left clear."
# Automated validation: read the obstacle set back and confirm it is the fixed course,
# point-symmetric, with the start row clear. See validation/maze/obstacles-layout.mjs.
validation = { script = "validation/maze/obstacles-layout.mjs", outputs = [
  { id = "layout", name = "The fixed obstacle course", kind = "image" },
] }
[[review.categories.items]]
id = "pellet-avoids-obstacles"
title = "Pellets never spawn on an obstacle"
description = "A respawned pellet never lands on an obstacle cell: obstacle cells are excluded from pellet placement."
# Automated validation: force many spawns and confirm no pellet ever lands on an
# obstacle cell. See validation/maze/pellet-avoids-obstacles.mjs.
validation = { script = "validation/maze/pellet-avoids-obstacles.mjs", outputs = [
  { id = "avoid", name = "Pellets avoiding the obstacle course", kind = "video" },
] }
[[review.categories.items]]
id = "obstacle-color"
title = "Obstacles are a distinct color"
description = "The interior obstacles render in a distinct, visible color — clearly different from the board background and from the snake — so an obstacle is not mistaken for a body segment."
# Automated validation: sample the rendered obstacle, the snake, and the board, and
# confirm the obstacle stands apart from both. See validation/maze/obstacle-color.mjs.
validation = { script = "validation/maze/obstacle-color.mjs", outputs = [
  { id = "scene", name = "The posed scene showing the obstacle color", kind = "image" },
] }
