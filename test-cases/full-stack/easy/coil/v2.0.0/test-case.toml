# --- Audio --------------------------------------------------------------------
# Two halves again. The produced files are read off the workspace and measured
# against the figures specs/assets.md fixes, and each cue is confirmed to be
# asked for on the tick its event resolves and on no tick before it. What the
# sounds actually sound like is rated through the presentation domain.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "eat-file-produced"
title = "The eat cue ships a produced sound"
description = "assets/audio/eat.wav exists, decodes as a WAV of non-zero length, and carries audible signal rather than silence."
domains = ["presentation"]
failure_cap = "scuffed"
# Automated validation: read the WAV off the built workspace, parse its header,
# and measure its peak amplitude. The check reads a file and drives nothing, so
# its evidence is a still of the round the cue belongs to rather than a
# recording of a drive it never makes. See
# validation/<engine>/audio/eat-file-produced.test.ts.
validation = { script = "audio/eat-file-produced.test.ts", outputs = [
  { id = "eat", name = "The round the produced eat cue plays in", kind = "image" },
] }
