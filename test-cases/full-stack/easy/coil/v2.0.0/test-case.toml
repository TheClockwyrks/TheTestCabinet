# --- Scoring ------------------------------------------------------------------
# The persistent high score (specs/ui.md). The live-update point is fully
# automated; the cross-session persistence point is automated in part (BEST survives
# a reset in the same session) and spot-checked across a real reload by the reviewer.
[[review.categories]]
id = "scoring"
title = "Scoring"
[[review.categories.items]]
id = "high-score-live"
title = "BEST updates live when passed"
description = "The BEST score updates the instant the current score passes it during play, not only at the end of the round."
# Automated validation: establish a BEST, start a new round just below it, and drive a
# real eat that crosses it — confirming BEST updates that tick. See validation/scoring/high-score-live.mjs.
validation = { script = "validation/scoring/high-score-live.mjs", outputs = [
  { id = "best", name = "BEST rising live as the score passes it", kind = "video" },
] }
[[review.categories.items]]
id = "high-score-persists"
title = "BEST persists (localStorage)"
description = "The BEST score persists across sessions via localStorage with no backend — it survives returning to the title and is restored on reload. Nothing else persists between sessions."
# Automated validation: establish a BEST and confirm it survives a reset within the
# session; the reviewer spot-checks that it survives a real page reload too. See
# validation/scoring/high-score-persists.mjs. Two stills, in order: the round that
# earned the BEST and the title reached from it, so the reviewer reads the same number
# in both places rather than taking a lone menu figure on trust.
validation = { script = "validation/scoring/high-score-persists.mjs", outputs = [
  { id = "live", name = "The BEST earned in play", kind = "image" },
  { id = "persist", name = "The same BEST carried over to the title", kind = "image" },
] }

