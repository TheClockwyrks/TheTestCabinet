slug = "coil"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which engines
# a run may select, how the produced implementation is built and checked, and what a
# reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Coil"

# Test type. Coil is a `full-stack` case: an end-to-end (playable-browser-game) case
# with one addition — the model under test must PRODUCE some of the game's own assets
# DURING the run, using the asset-generation binaries on the run image's `PATH`, and
# then build a game that uses them. Here that produced set is the snake's full sprite
# set and the game's sound and music; everything else (the board, walls, obstacles,
# pellet, and HUD) is still drawn in code. The `full-stack` type schedules the run onto
# the `test-cabinet-full-stack-2d` image, which carries six binaries on `PATH` —
# `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`, `sfx-sample`, and `music` — and no
# others; `specs/assets.md` is the production contract. A root identity field, so it
# sits above the first table.
type = "full-stack"

# Relative difficulty of this case, surfaced on the site. Coil's rules are simple: a
# polished, playable build with a correct fixed-timestep loop, grid-locked turning, a
# decaying combo, and several states. It also asks the model to PRODUCE the snake's
# sprite set (an animated biting head plus body and corner sprites) and the game's sound
# and music with the on-`PATH` tools, but that production pass sits over a small, simple
# game, so the case belongs at the easy end of the full-stack scale.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "grid", "score-attack"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A neon grid serpent that grows with every pellet, where eating in quick \
succession builds a decaying combo multiplier — so the real game is planning \
the most efficient route, not just staying alive — and the build must produce \
its own snake sprites and sound with the on-PATH asset tools."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. The game itself is small, but producing the snake's sprite set and the
# game's audio with the on-`PATH` tools is a real added pass, so Coil gets three
# hours — comfortably more than a healthy build needs while still bounding a session
# that never terminates.
max_runtime_hours = 3

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order — the
# first is the default. Neither variant seeds a mode spec of its own: what differs
# between them — the mode's menu entry, its HUD label and, for maze, the interior
# obstacle course — is branched by variant slug inside the common
# `specs/mode.md.hbs` template.
# Each variant is exactly one mode:
#   - base — Classic mode: the grid-serpent run on the open board.
#   - maze — Maze mode: the run on a board laced with fixed fatal interior obstacles to
#            thread (declares its own `maze` domain).
# This list is a root key, so it must precede the first table header.
variants = [
  "variants/base.toml",
  "variants/maze.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the input
# actions a player drives it with, the audio bus, asset loading, and the on-screen
# diagnostics; one of them also owns rendering and the gameplay framework the game
# is written inside. It is a *run dimension*, chosen per run alongside the model,
# the harness, and the variant, and recorded on the run; it is not a property of
# the game.
#
# Coil supports three, and the game is the same grid serpent under all of them.
# What differs is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the fixed-tick loop, the canvas fit, the keyboard input, the
#                     audio, the overlay and the `window.__coil` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the entry module
#                     around it (`src/main.ts`, plus the `src/game.ts` the build
#                     writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds the same
#                     entry module; the build writes its game module — the game
#                     definition, its mode, its state and its actors — and the debug
#                     surface its instance's `initialize` returns.
# What does NOT differ is the asset-production pass. Every engine run still produces
# the snake's sprite set and the game's sound and music with the on-`PATH` binaries,
# because no engine supplies art or audio; `specs/assets.md` is the same contract
# under all three.
#
# `none` supplies no package and therefore carries no version, so it is named in the
# bare `engines` list; `simple-2d` and `structured-2d` each carry a range and are
# named in `[[engine]]` tables. `min_version` is the 1.0.0 contract the specs and the
# validators are written against, and there is deliberately no `max_version`, so a
# later 1.x or 2.x from the host package store is accepted as it lands. Widening or
# moving a range means a new case version, so the pin is the statement that THIS spec
# set matches THIS contract.
#
# This declaration deliberately does not describe an engine. An engine ships its own
# documentation from its own package and seeding puts it in the run for the model to
# read, so the specs seeded from this folder never restate an engine's API. Where a
# spec speaks of the runtime it states only what is specific to *this game* under it —
# which surfaces the build still supplies, Coil's action list, and Coil's cue names.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same TypeScript, lint, format and test configuration
# the `[toolchain]` commands below run against, an `index.html` holding the canvas,
# and the project-local `playwright` dependency the model drives the built game
# through. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own fixed-tick loop, canvas fit,
#                     keyboard input, audio, diagnostics overlay and `window.__coil`
#                     surface, and every figure this specification fixes, from the
#                     specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored in
#                     at seed time so the build imports it by its bare package name,
#                     and seeds the one case-owned module around the game,
#                     `src/main.ts` (the browser entry). Every figure the
#                     specification fixes is named in the specs and declared by the
#                     build, because two of them — the mode's menu entry and its
#                     obstacle course — differ between the variants that share this
#                     one workspace. The build writes
#                     `src/game.ts`: the state, the debug surface its `initialize`
#                     returns beside that state, and the game's update and render.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same one case-owned module. The build writes
#                     `src/game.ts`: the game definition the engine drives — its mode,
#                     its live state, and its actors — and the debug surface its
#                     instance's `initialize` returns.
#
# This table must name EXACTLY the engines the case supports; the resolver checks
# both directions. The seeded files land at the run root
# (`workspaces/none/package.json` seeds to `package.json`). Neither variant overrides
# it: the difference between Classic and Maze is a rule of the game, not a difference
# in the project it is built in.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the
# build to commit a `package-lock.json`, so the validated build installs exactly
# what the deploy will. Both commands are required — there are no defaults, so
# every case states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. A full-stack build is written in TypeScript, and the seeded
# workspace ships the configuration each of these commands reads (`tsconfig.json`,
# `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so what is checked here
# is the code the model wrote against configuration the case fixed. The commands run
# host-side over the collected tree after the run's container is gone, so a slow suite
# costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does not
# compile is not reviewable. The other three are recorded and gate nothing — `test`
# additionally records the count and coverage the build's own suite reports, which is
# how a build that ships tests is told apart from one that ships none. Each is spelled
# `npx` rather than `npm run <script>` so the check is the case's own statement of what
# is run and does not depend on the model leaving the seeded scripts intact. These four
# are exactly the commands `specs/overview.md` tells the build will be run over the
# finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once here.
# It is reporter-side and never seeded; the seeded specification documents the surface
# independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its scenario
# through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__coil` once the game has initialized, so the
# handle is what a person opening the console of such a build finds. An engine run has
# NO global at all: the build writes the surface, its `initialize` returns it — beside
# the state as `[state, debug]` under `simple-2d`, alone under `structured-2d` — and a
# caller reads it back off `engine.debug`. Because `simple-2d` holds the state by value
# and hands every reader a read-only view, its surface is written in the shape of
# `update` — a pose takes the current state and returns the next, applied through
# `engine.apply`, and a reading takes the state and returns what it read, called with
# `engine.state`. `structured-2d` holds the world live, so its poses take only their own
# arguments and act on it at the call, and its readings return plain data. One handle,
# three ways to reach the same operations.
#
# There is deliberately no `tick_hz`. Coil is clocked at a fixed 8 Hz and its engineless
# surface moves time in seconds and frames, leaving the simulation to consume them into
# whole ticks, but a validator now builds its own clock and drives it directly rather
# than asking the runtime to convert ticks back into real seconds, so the case has
# nothing left to state here.
[instrumentation]
handle = "__coil"

# Common specs: seeded for EVERY variant of this case, at the `dest` path within the
# run workspace. Every one of these is common: neither variant declares a spec of its
# own, because the difference between Classic and Maze is a rule of the same game
# rather than a different game, and a rule belongs beside the rules it sits with.
#
# The specification is decomposed by concern: the overview, the board geometry, the
# movement simulation, the scoring and the combo, the mode and its menu entry, the
# controls, the screens and the audio, the produced-asset contract, the
# debugging/automation surface, and the showcase the build ships.
#
# A source is an `.hbs` template only where it actually branches, and there are two
# axes to branch on. `variant.slug` selects the mode — its menu entry and, for Maze,
# the fixed course of fatal interior obstacles — so a variant's rendered set describes
# exactly one mode and reads as fully self-contained. `engine.slug` selects what the
# build is handed and what it must write. A spec's `dest` defaults to its `source`
# (with a trailing `.hbs` stripped), so an `.md.hbs` source seeds to the same `.md`
# path and a plain `.md` source is seeded verbatim.
[[spec]]
source = "specs/overview.md.hbs"

[[spec]]
source = "specs/board.md"

[[spec]]
source = "specs/movement.md"

[[spec]]
source = "specs/scoring.md"

[[spec]]
source = "specs/mode.md.hbs"

[[spec]]
source = "specs/controls.md.hbs"

[[spec]]
source = "specs/ui.md.hbs"

# The asset-production contract: the assets the model must PRODUCE with the on-PATH
# binaries during the run — the snake's sprite set and the game's cues and music —
# where each file lands in the workspace, how it is loaded, and the bar each is held
# to; and what stays drawn in code. It branches on the engine, because an engineless
# build loads and decodes its own files while an engine run goes through the engine's
# asset loader and cue bus. This is the defining spec of a full-stack case.
[[spec]]
source = "specs/assets.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# steppable core, an API to drive and inspect the game from code, and a read-only debug
# overlay. Seeded for every run and framed as an ordinary developer affordance of the
# game. It branches on both axes — the variant, for the snapshot's `mode` value and for
# the pair of operations that clear and place the obstacle cells only Maze lays, and the
# engine, for how the surface is reached and what shape its operations take.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished build ships beside its source: a `showcase/` directory
# holding a player-facing description and a short carousel of captured media. It
# branches on the engine, because an engineless build records motion as a `.webm`
# clip while an engine run records it as a replay through the engine's recorder.
[[spec]]
source = "specs/showcase.md.hbs"

# Scoring domains. A reviewer rates each declared domain independently while playing
# the build, and the run's overall rating is the WORST across them — a flawless snake
# game cannot mask crude, un-produced art or silence, and a beautiful produced snake
# cannot mask a game that does not play correctly; every case must declare at least one.
# Domains are case-level; an individual review item rolls up to one through its optional
# `domain`, while a general item (states, window fit) omits it. The Maze variant adds
# its own `maze` domain (see `variants/maze.toml`).
[[domain]]
id = "gameplay"
name = "Gameplay"
description = "The single-player snake game itself: the fixed-tick movement, grid-locked turning, growth and collision, the decaying combo, scoring, and the states — how it plays."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "The genuinely tool-produced assets and how the build presents them: the snake's produced sprite set — an animated head that bites when it eats, and body and corner sprites that render the snake turning — rendered crisp on the board, and the produced sound effects and music bed the game plays."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name
# grouping the points a reviewer grades — and each `[[review.categories.items]]`
# under it is one graded review item, worth one point (the default weight), so a
# category is worth the number of items it holds (no fractional scoring). A category
# carries no prose of its own; each review item states its own requirement in
# `description`, and its verdict is recorded under the composite id
# `<category id>.<item id>`. The taxonomy is narrow on purpose: one observable
# behavior per item, so a build fails exactly the rule it breaks rather than an
# averaged-away whole. Categories here are common to every variant; the points the
# Maze mode adds live in that variant's own file (`variants/maze.toml`). The
# checklist is reporter-side material — never seeded into a run, so the model never
# sees it; each item restates a requirement the seeded specification already states.
# Every point is decided by its validator, through the domains it rolls up to and the
# failure cap it applies while it fails, and a reviewer may override a verdict.
[review]
format = 2

# --- Movement -----------------------------------------------------------------
# The fixed-tick grid movement (specs/movement.md), split so a build that moves at
# the wrong rate, or speeds up as it grows, fails exactly that point.
[[review.categories]]
id = "movement"
title = "Movement"
[[review.categories.items]]
id = "one-cell-per-tick"
title = "One cell per tick"
description = "Each fixed tick advances the snake's head exactly one cell in the direction it faces, and every following segment takes the cell ahead of it — no more, no less."
# Automated validation: pose the snake in a clear lane, step exactly one tick, and
# read back that the head advanced one cell and the body followed. See
# validation/movement/one-cell-per-tick.mjs.
validation = { script = "validation/movement/one-cell-per-tick.mjs", outputs = [
  { id = "move", name = "The snake advancing one cell per tick", kind = "video" },
] }
[[review.categories.items]]
id = "constant-rate"
title = "Constant 8 ticks per second"
description = "The snake advances at a constant 8 ticks per second: one second of play is exactly eight ticks and eight cells of head travel."
# Automated validation: step exactly one second of game time and confirm the head
# advanced eight cells over eight ticks. See validation/movement/constant-rate.mjs.
validation = { script = "validation/movement/constant-rate.mjs", outputs = [
  { id = "rate", name = "Eight ticks in one second", kind = "video" },
] }
[[review.categories.items]]
id = "no-speedup-when-long"
title = "No speed-up as the snake grows"
description = "A long snake advances at the same fixed rate as a short one — growth never speeds the tick up. Stepping one second still moves a 30-cell snake exactly eight cells."
# Automated validation: pose a 30-cell snake in a clear lane, step one second, and
# confirm it still advanced exactly eight cells. See
# validation/movement/no-speedup-when-long.mjs.
validation = { script = "validation/movement/no-speedup-when-long.mjs", outputs = [
  { id = "speed", name = "A long snake at the same fixed rate", kind = "video" },
] }

# --- Turning ------------------------------------------------------------------
# The grid-locked turning rules (specs/movement.md), one behavior per item so a
# build that folds on a double-press, or turns on the wrong tick, fails just that.
[[review.categories]]
id = "turning"
title = "Turning"
[[review.categories.items]]
id = "next-tick"
title = "A turn takes effect on the next tick"
description = "Requesting a turn does not move the snake immediately; the new direction is applied on the next tick, when the head then advances that way."
# Automated validation: request a perpendicular turn, confirm the facing is unchanged
# before a tick, then step one tick and confirm the head turned. See
# validation/turning/next-tick.mjs.
validation = { script = "validation/turning/next-tick.mjs", outputs = [
  { id = "turn", name = "A buffered turn applied on the next tick", kind = "video" },
] }
[[review.categories.items]]
id = "perpendicular-only"
title = "Only perpendicular turns are accepted"
description = "Only a turn perpendicular to the current direction is accepted; a request to keep going straight is a no-op and the snake keeps its heading."
# Automated validation: while moving right, confirm the two perpendicular turns are
# accepted and a straight request is a no-op. See validation/turning/perpendicular-only.mjs.
validation = { script = "validation/turning/perpendicular-only.mjs", outputs = [
  { id = "perp", name = "Perpendicular turns accepted, straight ignored", kind = "video" },
] }
[[review.categories.items]]
id = "reversal-ignored"
title = "A reversal into the neck is ignored"
description = "A request to reverse straight back into the neck (the opposite of the current direction) is ignored; the snake keeps moving the way it was."
# Automated validation: while moving right, request left (a reversal), step, and
# confirm the snake kept moving right. See validation/turning/reversal-ignored.mjs.
validation = { script = "validation/turning/reversal-ignored.mjs", outputs = [
  { id = "reversal", name = "A reversal ignored", kind = "video" },
] }
[[review.categories.items]]
id = "one-per-tick"
title = "At most one turn per tick — no self-fold"
description = "At most one buffered turn is applied per tick, so a rapid double-press (down then left while moving right) turns down on one tick and left on the next rather than folding the snake onto itself."
# Automated validation: while moving right, request down then left within one tick,
# step twice, and confirm down applied first and left next with no death. See
# validation/turning/one-per-tick.mjs.
validation = { script = "validation/turning/one-per-tick.mjs", outputs = [
  { id = "double", name = "A double-press resolving one turn per tick", kind = "video" },
] }

# --- Growth & Pellets ---------------------------------------------------------
# Eating and pellet spawning (specs/board.md), split so a build that grows by the
# wrong amount, or spawns an invalid pellet, fails exactly that point.
[[review.categories]]
id = "growth"
title = "Growth & Pellets"
[[review.categories.items]]
id = "grows-by-one"
title = "Eating grows the snake by exactly one"
description = "Eating a pellet grows the snake by exactly one cell (the tail does not retract that tick); a following normal tick keeps the length constant."
# Automated validation: place a pellet a short run ahead, step up to it, step the eat
# and confirm length +1, then park the pellet and step a normal tick to confirm the
# length holds. See validation/growth/grows-by-one.mjs.
validation = { script = "validation/growth/grows-by-one.mjs", outputs = [
  { id = "grow", name = "The snake growing by one on an eat", kind = "video" },
] }
[[review.categories.items]]
id = "pellet-respawn-valid"
title = "A respawned pellet is always valid"
description = "After every eat exactly one new pellet spawns at an interior cell that is never on the snake (and, in Maze, never on an obstacle) — so there is always exactly one valid pellet on the board."
# Automated validation: force many eats and, after each auto-spawn, confirm the pellet
# is interior and clear of the snake and obstacles. See validation/growth/pellet-respawn-valid.mjs.
# Recorded rather than captured: the claim is about EVERY respawn, and one still shows
# one pellet in one legal spot — which is what a build that spawns badly most of the
# time also shows. The clip carries all eight spawns the assertions scored.
validation = { script = "validation/growth/pellet-respawn-valid.mjs", outputs = [
  { id = "pellet", name = "Pellets respawning validly across a run of eats", kind = "video" },
] }
[[review.categories.items]]
id = "first-pellet-valid"
title = "The first pellet is valid"
description = "The first pellet of a round spawns after the snake is placed, at an interior cell that does not overlap the starting body."
# Automated validation: start a seeded round and confirm the first pellet is interior
# and clear of the start body. See validation/growth/first-pellet-valid.mjs.
validation = { script = "validation/growth/first-pellet-valid.mjs", outputs = [
  { id = "first", name = "A valid first pellet", kind = "image" },
] }

# --- Collision ----------------------------------------------------------------
# The immediate-death and tail rules (specs/movement.md), one case per item so a
# build that mishandles the growth-tick tail, or forgives a wall hit, fails just it.
[[review.categories]]
id = "collision"
title = "Collision"
[[review.categories.items]]
id = "wall-fatal"
title = "Hitting a wall is immediately fatal"
description = "The head advancing into a wall cell ends the round immediately — that same tick, with no grace frame — on the game-over screen with the death reason."
# Automated validation: pose the head one cell from a wall facing it, step one tick,
# and confirm the round ended dead with no extra move. See validation/collision/wall-fatal.mjs.
validation = { script = "validation/collision/wall-fatal.mjs", outputs = [
  { id = "wall", name = "An immediately fatal wall hit", kind = "video" },
] }
[[review.categories.items]]
id = "self-fatal"
title = "Hitting the body is fatal"
description = "The head advancing into a solid body cell ends the round immediately as a death."
# Automated validation: pose the snake so its head advances into a body cell, step,
# and confirm the round ended dead. See validation/collision/self-fatal.mjs.
validation = { script = "validation/collision/self-fatal.mjs", outputs = [
  { id = "self", name = "A fatal self-collision", kind = "video" },
] }
[[review.categories.items]]
id = "tail-follow-safe"
title = "Chasing the vacating tail is safe"
description = "On a normal (non-growth) tick the head may safely enter the cell the tail is vacating that tick, so the snake can chase its own tail without dying."
# Automated validation: pose a loop where the head follows the vacating tail on a
# normal tick, step, and confirm no death and the head took the old tail cell. See
# validation/collision/tail-follow-safe.mjs.
validation = { script = "validation/collision/tail-follow-safe.mjs", outputs = [
  { id = "tail", name = "The head safely chasing the vacating tail", kind = "video" },
] }
[[review.categories.items]]
id = "growth-tail-fatal"
title = "Entering the tail on a growth tick is fatal"
description = "On a growth tick the tail does not retract, so the whole body — including the current tail cell — is solid: moving the head into the tail cell while eating there is fatal."
# Automated validation: pose the head to advance into the tail cell with a pellet
# there (a growth tick), step, and confirm the round ended dead. See
# validation/collision/growth-tail-fatal.mjs.
validation = { script = "validation/collision/growth-tail-fatal.mjs", outputs = [
  { id = "growthtail", name = "A fatal tail entry on a growth tick", kind = "video" },
] }

# --- Combo --------------------------------------------------------------------
# The decaying combo multiplier and its window (specs/combo.md), split so a build
# that mis-caps, mis-scores, or mis-times the window fails exactly that point.
[[review.categories]]
id = "combo"
title = "Combo"
[[review.categories.items]]
