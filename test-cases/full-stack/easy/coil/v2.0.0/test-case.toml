# --- Color (sampled from the rendered canvas) ---------------------------------
# Each point samples the pixels the build actually RENDERS at a known cell (the head,
# a body segment, the pellet) and confirms the element is drawn in a distinct, visible
# color — reading what is painted, not any value the game reports, so a build cannot
# pass by claiming a color it does not draw. The exact palette is the model's own;
# only that the head, body, and pellet are told apart by color is scored.
[[review.categories]]
id = "color"
title = "Color"
[[review.categories.items]]
id = "head"
title = "The head is a distinct color"
