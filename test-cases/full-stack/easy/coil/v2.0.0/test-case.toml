# --- Presentation -------------------------------------------------------------
# Matters of craft and produced art that reading pixels cannot settle: they roll up
# to the presentation domain. They carry no validation script yet, so they do not yet
# resolve under the validator-rated grammar this version adopts.
[[review.categories]]
id = "presentation"
title = "Presentation"
[[review.categories.items]]
id = "crisp-grid"
title = "Crisp board and snake"
description = "The board renders as a crisp, un-blurred grid of cells, and the snake's produced sprites are sampled crisply (nearest-neighbor, not smoothed) and stay pixel-aligned to the grid, so the look is sharp and blocky rather than soft."
[[review.categories.items]]
id = "window-fit"
title = "Window fit"
description = "The entire 1280x720 stage — the whole board, every wall, the full HUD, and every menu item — stays visible, fitted, and centered at any window size and pixel density, including on load before any input, letterboxed with the background color and never clipped."
[[review.categories.items]]
id = "produced-snake-sprites"
title = "Produced snake sprites"
description = "The snake is rendered from a sprite set the build produced with draw/draw-sheet — genuine pixel art: a head sprite, a straight-body sprite, and corner/turn sprites — not code-drawn rounded rectangles. The corner sprites are used where the snake bends, so the body reads as a continuous turning coil, and the head is always distinguishable from the body."
[[review.categories.items]]
id = "produced-head-bite"
title = "Produced head-bite animation"
description = "The head is an animated sprite sheet the build produced with draw-sheet — genuine per-frame pixel art — that plays a bite/chomp when the snake eats a pellet (the mouth opens and closes on the eat) and otherwise shows the resting head, advanced on a timer; not a single static head sprite and not an ad-hoc code-drawn mouth."

# --- Audio --------------------------------------------------------------------
# The genuinely produced sound and music (specs/assets.md), each mandated cue its own
# review item so a build fails exactly the cue it omits or never wires, rather than an
# averaged-away "produced-sfx". Every check is a reporter-side Web Audio probe (see
# `api.audio` and validation/_helpers.mjs `armAudio`/`audioCount`): the build must not
# autoplay, so audio is armed FIRST with a genuine browser gesture (a real key press
# AND a corner click — a debug `press` would leave a conformant build's AudioContext
# uncreated, since it may unlock only from a real DOM event), and a cue is confirmed by
# the Web Audio source log growing across the driven event. Only that a cue plays is
# scored automatically; its DISTINCTNESS, timbre, and overall craft against the other
# cues stays for the reviewer, from the media the validator captured.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "eat"
title = "Eat cue"
description = "A short cue, produced with the audio tools (sfx-synth and/or sfx-sample) and played via Web Audio, plays when a pellet is eaten."
# Automated validation: pose a clear eat, arm audio, and confirm a Web Audio source
# starts across the eat. See validation/audio/eat.mjs.
validation = { script = "validation/audio/eat.mjs", outputs = [
  { id = "eat", name = "The eat whose cue is checked", kind = "video" },
] }
[[review.categories.items]]
id = "combo-up"
title = "Combo-up cue"
description = "A brighter cue, produced with the audio tools and played via Web Audio, plays when the combo multiplier increases."
