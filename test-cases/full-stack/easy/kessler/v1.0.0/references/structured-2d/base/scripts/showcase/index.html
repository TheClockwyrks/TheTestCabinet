<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The engine resolves an asset path against the page, so this rig is based
      at the project root: `assets/sprites/planet.png` has to reach the produced
      file the game loads, not one under `scripts/showcase/`.
    -->
    <base href="/" />
    <title>Kessler — showcase capture</title>
    <!--
      An inline, empty icon: without one the browser requests /favicon.ico on
      its own and the dev server answers 404, logging a console error the game
      did not cause.
    -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        background: #05070d;
      }
      #stage {
        display: block;
        width: 1000px;
        height: 1000px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/scripts/showcase/capture.ts"></script>
  </body>
</html>
