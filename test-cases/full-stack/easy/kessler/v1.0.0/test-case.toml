# --- Showcase -----------------------------------------------------------------
# ONE point, and it grades EXISTENCE alone. Whether the description reads like
# something a player would want to play, whether the carousel opens on the
# strongest view of live play, and whether the media is worth looking at is a
# reviewer's judgement, and belongs to the AESTHETIC half of the presentation
# domain rather than to an assertion. The validator's whole verdict is that the
# two files are there and that the carousel points at a file that is there with
# them: not a dimension, not a byte of a picture, not a word of the prose, and
# not how many entries the carousel holds.
#
# It carries a `weight` of 3 against the default 1 every other item carries,
# because the showcase is a deliverable of the build in its own right rather
# than one rule of the simulation, and one ordinary point would price it below
# a single contact radius. `great` is its cap: a build that ships no showcase
# is still played exactly as intended.
#
# The script drives nothing. It reads the produced tree with `node:fs`, so one
# suite stands unchanged in all three engine directories and the point means
# the same thing whichever engine the run selected. What it hands back as
# evidence is a `.png` copied out of the build's own showcase, so a reviewer
# sees the picture the build chose to present its game with beside the verdict.
[[review.categories]]
id = "showcase"
title = "Showcase"

[[review.categories.items]]
id = "exists"
title = "The game ships its showcase"
description = "showcase/showcase.md and showcase/showcase.toml are present at the root of the produced repository, and every file the carousel names is present in showcase/."
weight = 3
domains = ["presentation"]
failure_cap = "great"
validation = { script = "showcase/exists.test.ts", outputs = [ { id = "carousel", name = "A screenshot from the build's showcase", kind = "image" } ] }
