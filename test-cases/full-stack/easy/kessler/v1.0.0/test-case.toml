# --- Field --------------------------------------------------------------------
# The two fixed surfaces that bound play: the containment field the ball comes
# back from, and the planet it burns up on. The containment reflection is where
# the pipeline's renormalize and orbital-decay steps are read cleanly, with no
# ring in the scene.
[[review.categories]]
id = "field"
title = "Field"

