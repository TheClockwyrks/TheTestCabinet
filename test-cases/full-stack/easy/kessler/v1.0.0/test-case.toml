slug = "kessler"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which engines
# a run may select, how the produced implementation is built and checked, and what a
# reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Kessler"

# Test type. Kessler is a `full-stack` case: an end-to-end (playable-browser-game)
# case with one addition — the model under test must PRODUCE some of the game's own
# assets DURING the run, using the asset-generation binaries on the run image's
# `PATH`, and then build a game that uses them. Here that produced set is the planet
# and salvage-pod sprites, the ball's six-frame spin sheet, the three particle
# systems (the destruction burst, the impact spark, and the burn-up), and the game's
# thirteen audio cues and two music beds; the rings and their derelicts, the
# deflector, the shield ring, the containment field, the starfield, and the HUD are
# all still drawn in code. The `full-stack` type, with `asset_dimension` left at its
# `2d` default, schedules the run onto the `test-cabinet-full-stack-2d` image, which
# carries six binaries on `PATH` — `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`,
# `sfx-sample`, and `music` — and no others; `specs/assets.md` is the production
# contract. A root identity field, so it sits above the first table.
type = "full-stack"

# Relative difficulty (easy | medium | hard), surfaced on the site. Kessler is easy:
# everything lives in polar coordinates around one center, so every rule is a table
# row or a short formula over an angle and a radius — a contact is a crossing event
# with a direction gate, and the deflector bounce is a fixed four-step pipeline
# (specular reflection, english from the contact offset, an exit-angle clamp, and the
# wave's ball speed) with a spelled-out decay-and-kick pipeline on every other
# surface. Around that core sit three orbiting rings with per-wave speed formulas, a
# seeded salvage-pod stream feeding five distinct effects, waves, lives, and six
# screens — all of them exactly specified, with no physics to tune, no opponent to
# model, and no subsystem large enough to need splitting out behind an interface.
# What it measures is whether a build carries the specified loop through without
# blurring a row. The produced-asset pass — two sprite sets and a sheet, three
# particle systems, thirteen cues and two seamless music beds — is what the runtime
# budget below accounts for, not the difficulty.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "orbital", "score-attack"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
An orbital demolition arcade game: the deflector rides a circular track above \
a planet, batting a ball outward through three rings of derelict satellites \
while caught salvage pods grant tools and any ball it misses burns up below. \
Where the ball meets the deflector decides the angle it leaves at, so the real \
game is steering the bounce — and the build must produce its own sprites, \
particle systems, sound, and music with the on-PATH asset tools."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. Six hours is calibrated to Kessler's own scale: the polar simulation
# and its contact pipelines are a real build beyond Coil's grid serpent, and the
# produced-asset pass covers sprites, a sheet, three particle systems, and fifteen
# audio files — clearly more than Coil's three hours cover — while the game is still
# one field and one loop, well short of the world simulation that earns Deepcore its
# eight.
max_runtime_hours = 6

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. `npm install` — NOT `npm ci` — because `packages` injects
# the `@test-cabinet/particle-runtime` `file:` dependency this build plays its produced
# particle systems with, and an engine run has its engine package vendored in the same
# way, so the lockfile is completed at seed time; the same command downloads the
# Playwright Chromium build (the base image ships the OS libraries Chromium links
# against, but not the browser binary), so the model can build the game and look at it
# in a browser without any further setup.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the whole
# point of a full-stack case: the model PRODUCES the game's art, animation, and audio
# itself, during the run, with the six binaries on the run image's `PATH` (see `type`
# above and `specs/assets.md`). Nothing pictorial is seeded, and no rendered mockup is
# shown to the model or to the reviewer: every piece of evidence a reviewer sees is
# captured from the build itself.

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and the
# seeded workspace `package.json` depends on it via its baked-in `file:` path, so the
# build imports it (its `/canvas` binding) like any other dependency and plays each
# produced `system.json` by simulating it live. Kessler's three VFX — the destruction
# burst at a broken derelict, the impact spark at deflector, containment, and shield
# contacts, and the burn-up at the planet — are all produced `particle-2d` systems
# played this way; see `specs/assets.md` for the consumption contract. It is declared
# for every engine: neither engine draws particles, and both hand the game a raw 2D
# context to play a produced system through. (A root key, so it must sit above the
# first `[table]` header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Kessler offers a single `base` variant — the endless score-attack expedition through
# the rings — declared in its own file under `variants/`. Nothing about the game is a
# variant axis here: the wave progression is the game's own difficulty curve, and the
# five pod effects are in-game tools rather than modes, so one variant carries the
# whole case. This list is a root key, so it must sit above the first `[table]`
# header below.
variants = [
  "variants/base.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the input
# actions a player drives it with, the audio bus, asset loading, and the on-screen
# diagnostics; one of them also owns rendering and the gameplay framework the game
# is written inside. It is a *run dimension*, chosen per run alongside the model,
# the harness, and the variant, and recorded on the run; it is not a property of
# the game.
#
# Kessler supports three, and the game is the same orbital demolition under all of
# them — the collision is simulation-owned polar math on EVERY engine, so no engine
# collider or collision event stands in for the crossing rules the specs fix. What
# differs is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the fixed-tick loop, the canvas fit, the keyboard input, the
#                     audio, the overlay and the `window.__kessler` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the entry module
#                     around it (`src/main.ts`, plus the `src/game.ts` the build
#                     writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds the same
#                     entry module; the build writes its game module — the game
#                     definition, its mode, its state and its actors — and the debug
#                     surface its instance's `initialize` returns.
# What does NOT differ is the asset-production pass. Every engine run still produces
# the sprites, the particle systems, and the audio with the on-`PATH` binaries,
# because no engine supplies art or sound; `specs/assets.md` is the same contract
# under all three.
#
# `none` supplies no package and therefore carries no version, so it is named in the
# bare `engines` list; `simple-2d` and `structured-2d` each carry a range and are
# named in `[[engine]]` tables. `min_version` is the 1.0.0 contract the specs are
# written against, and there is deliberately no `max_version`, so a later 1.x or 2.x
# from the host package store is accepted as it lands. Widening or moving a range
# means a new case version, so the pin is the statement that THIS spec set matches
# THIS contract.
#
# This declaration deliberately does not describe an engine. An engine ships its own
# documentation from its own package and seeding puts it in the run for the model to
# read, so the specs seeded from this folder never restate an engine's API. Where a
# spec speaks of the runtime it states only what is specific to *this game* under it —
# which surfaces the build still supplies, Kessler's action list, and Kessler's cue
# names.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same TypeScript, lint, format and test configuration
# the `[toolchain]` commands below run against, an `index.html` holding the
# 1000x1000 stage canvas, the `@test-cabinet/particle-runtime` dependency `packages`
# injects, and the project-local `playwright` dependency the model drives the built
# game through. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own fixed-tick loop, canvas fit,
#                     keyboard input, audio, diagnostics overlay and
#                     `window.__kessler` surface, and every figure this
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored in
#                     at seed time so the build imports it by its bare package name,
#                     and seeds the two case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes —
#                     the stage and polar geometry, every contact radius, the
#                     deflector's rate and span, the bounce pipeline's figures, the
#                     ring tables and orbit formulas, the pod draw and kind weights,
#                     the effect durations, the scores, the screen copy, the action
#                     bindings, the cue names, and the paths the produced files land
#                     at; the look is NOT among them) and `src/main.ts` (the browser
#                     entry). The build writes `src/game.ts`: the state, the debug
#                     surface its `initialize` returns beside that state, and the
#                     game's update and render.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules (its `constants.ts` also
#                     carries the level name and the tag vocabulary). The build
#                     writes `src/game.ts`: the game definition the engine drives —
#                     its mode, its live state, and its actors — and the debug
#                     surface its instance's `initialize` returns.
#
# Under both engines the seeded `src/game.ts` is a stub written against types the
# build has yet to declare, so a freshly seeded workspace does not type-check: that
# failing typecheck is the starting point rather than a broken seed.
#
# This table must name EXACTLY the engines the case supports; the resolver checks
# both directions. The seeded files land at the run root
# (`workspaces/none/package.json` seeds to `package.json`). There is one starter
# project per engine and no per-variant set: the single `base` variant declares no
# `[workspaces]` override of its own.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# The audio packs the run container is staged with. `sfx-sample` and `music`
# reach these and nothing else, and a tool config that names no pack plays the
# first pack of that kind.
#
# `combat-core` is the sample pack the demolition cues are layered from: the
# metal impacts, clangs, and debris a ball chipping a derelict, a derelict
# breaking, and a pod burning up are made of. `specs/assets.md` holds the
# thirteen cues and the two beds to one cold, glassy, spacey palette, and two
# banks answer that description from different sides. `synthwave` leads for the
# analog pads, sub bass, and FM bell a spacey bed is built on, and `gm-lite`
# follows it for the glockenspiel, vibraphone, and music box that carry the
# glassy half. `cinematic` is an orchestra, which is not a sound this game makes
# anywhere, so it is not staged.
[audio]
packs = ["combat-core@0.1.0", "synthwave@0.1.0", "gm-lite@0.1.0"]

# How the validator (and the per-run static deploy) turns a produced implementation
# into a served static site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`,
# `build/`, or `out/`. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy will.
# Both commands are required; there are no defaults. The build must be
# self-contained: it bundles the committed produced assets without invoking the
# asset tools, which are on `PATH` only while the run is live (`specs/assets.md`).
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. A full-stack build is written in TypeScript, and the seeded
# workspace ships the configuration each of these commands reads (`tsconfig.json`,
# `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so what is checked here
# is the code the model wrote against configuration the case fixed. The commands run
# host-side over the collected tree after the run's container is gone, so a slow suite
# costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does not
# compile is not reviewable. The other three are recorded and gate nothing — `test`
# additionally records the count and coverage the build's own suite reports, which is
# how a build that ships tests is told apart from one that ships none. Each is spelled
# `npx` rather than `npm run <script>` so the check is the case's own statement of what
# is run and does not depend on the model leaving the seeded scripts intact. These four
# are exactly the commands `specs/overview.md` tells the build will be run over the
# finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once here.
# It is reporter-side and never seeded; the seeded specification documents the surface
# independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is what every review item's validator suite below
# poses its scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__kessler` once the game has initialized, so the
# handle is what a person opening the console of such a build finds. An engine run has
# NO global at all: the build writes the surface, its `initialize` returns it — beside
# the state as `[state, debug]` under `simple-2d`, alone under `structured-2d` — and a
# caller reads it back off `engine.debug`. One handle, three ways to reach the same
# operations.
#
# `tick_hz` is Kessler's fixed simulation rate. The engineless debug surface advances
# the game in whole ticks (`step(ticks)`) rather than in seconds, so there is no
# rounding and no ambiguity about what a step means, and this is the rate the
# validation runtime relates that stepping back to real time with: one tick is 1/60 of
# a second, so a second of simulated time is 60 ticks. Under an engine it is the step
# a scripted clock takes by default, so the same scenario walks the same number of
# ticks on all three engines and one tolerance covers every suite. It matches the
# timestep `specs/field.md` and `specs/instrumentation.md` fix, and every timer on
# the checklist — the 600-tick effects, the 360-tick pierce, the 180-tick
# interstitial, the 5-tick sprite frame — is stated in these ticks.
[instrumentation]
handle = "__kessler"
tick_hz = 60

# Common specs: seeded for EVERY run, at the `dest` path within the run workspace.
# Every one of these is common, because the case has a single variant and the whole
# game is one mode.
#
# The specification is decomposed by concern: the overview, the field's polar
# geometry and tick, the deflector and the ball, the rings and their derelicts, the
# salvage pods and their effects, the scoring, the screens, the controls, the
# produced-asset contract, the debugging/automation surface, and the showcase the
# build ships.
#
# A source is an `.hbs` template only where it actually branches, and the one axis to
# branch on is `engine.slug` — what the build is handed and what it must write. A
# spec's `dest` defaults to its `source` (with a trailing `.hbs` stripped), so an
# `.md.hbs` source seeds to the same `.md` path and a plain `.md` source is seeded
# verbatim.
[[spec]]
source = "specs/overview.md.hbs"

# The field: the 1000x1000 stage and its polar mapping, the geometry table with every
# contact radius, the containment field and the planet, the order a tick resolves in,
# and the determinism statement. Unbranched: the field is the same simulation under
# every engine.
[[spec]]
source = "specs/field.md"

[[spec]]
source = "specs/deflector-and-ball.md"

[[spec]]
source = "specs/rings.md"

[[spec]]
source = "specs/pods.md"

[[spec]]
source = "specs/scoring.md"

[[spec]]
source = "specs/screens.md"

# The actions a player drives the game with and the keys bound to them. It branches
# on the engine, because an engine run declares Kessler's actions on the engine's
# input map while an engineless build listens for the key events itself.
[[spec]]
source = "specs/controls.md.hbs"

# The asset-production contract: the assets the model must PRODUCE with the on-PATH
# binaries during the run — the planet and pod sprites, the ball's spin sheet, the
# three particle systems, the thirteen cues and the two music beds — where each file
# lands in the workspace, how it is loaded and played, and the bar each is held to;
# and what stays drawn in code. It branches on the engine, because an engineless
# build loads and decodes its own files while an engine run goes through the engine's
# asset loader and cue bus (the particle systems play through
# `@test-cabinet/particle-runtime` on all three). This is the defining spec of a
# full-stack case.
[[spec]]
source = "specs/assets.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# seedable core, an API to pose and inspect the game from code, and a read-only debug
# overlay. Seeded for every run and framed as an ordinary developer affordance of the
# game. It branches on the engine, for how the surface is reached, what shape its
# operations take, and the `step`/`setAutoStep` pair only an engineless build carries
# (under an engine the runtime's own clock is driven instead); the engineless branch
# also carries the viewport contract a browser driver inverts the stage mapping with.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished build ships beside its source: a `showcase/` directory
# holding a player-facing description and a short carousel of captured media. It
# branches on the engine, because an engineless build records motion as a `.webm`
# clip while an engine run records it as a replay through the engine's recorder.
[[spec]]
source = "specs/showcase.md.hbs"

# Scoring domains. A run is rated on each independently, and the run's overall
# rating is the WORST across them: a flawless orbital simulation cannot mask crude,
# un-produced art or silence, and a beautiful produced field cannot mask a game that
# does not play correctly. Every case must declare at least one. Each review item
# below names the domains its failure lowers and how far, through `domains` and
# `failure_cap`; the reviewer's judgement lives in the separate AESTHETIC rating of
# each domain, which is the look, the polish and the feel.
[[domain]]
id = "gameplay"
name = "Orbital Play"
description = "The demolition game itself, and how it plays: the fixed-tick polar simulation, the deflector and its bounce pipeline, serving and losing balls, the three rings and their orbits, target contacts and destruction, the seeded salvage pods and the five effects they grant, scoring, waves, lives, and the screens' rules."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "Everything a player sees and hears. The produced assets first: the planet and the five salvage-pod sprites, the ball's six-frame spin sheet, the destruction burst, impact spark and burn-up particle systems, and the thirteen produced cues and two seamless music beds the game plays. Then the rings and their derelicts, the deflector, the shield, the containment field, the starfield, the HUD and the screens the build draws in code around them."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY, a bare name grouping the points a reviewer
# grades, and each `[[review.categories.items]]` under it is one graded review item,
# worth one point unless it declares a `weight` of its own; the single showcase
# item is the only one that does, at 3. A category carries no prose of its
# own; each review item states in `description` the claim checked against the build,
# and its verdict is recorded under the composite id `<category id>.<item id>`. The
# checklist is reporter-side material, never seeded into a run, so the model never
# sees it; each item restates a requirement the seeded specification already states.
#
# EVERY ITEM CARRIES A `validation` SCRIPT. Each item declares its
# `validation/<engine>/<category>/<item id>.test.ts` suite — one Vitest project per
# engine, the same relative path under each — and the media the suite writes; the
# suites were captured against the three reference implementations under
# `references/<engine>/base/`. A handful of items add `engines = ["none"]` to that
# table, which scopes the item to the engines where the behavior is the build's own
# work: the debug overlay and its backtick toggle, the press-edge contract, and the
# stage fit are the engine's under `simple-2d` and `structured-2d`, and grading them
# there would hand every build the point. The checklist was authored first so the suites are
# written TO these claims rather than the claims drifting to fit what a suite
# happened to check. Every item is cut to that standard: ONE observable behavior, posed
# through the instrumentation surface and read back, so a build fails exactly the
# rule it breaks. Each rotation key is its own item, each screen transition is its
# own item in one direction, and each edge case the rules imply is an item of its
# own — the inclusive span boundary, the both-keys-held stalemate, the ball already
# inside the deflector's radius, the cap met mid-multiball.
#
# EVERY item carries `domains` and `failure_cap`. `domains` names the scoring
# domains a failure lowers: a rule of the simulation lowers `gameplay`, an item
# about what is drawn or heard lowers `presentation`, and the surface every other
# item is driven through lowers both. `failure_cap` is the highest functional rating
# those domains may reach while the item fails; each domain takes the LOWEST cap
# among its failing items, and a domain with no failing item is flawless. The caps
# are graded by how much of the game a failure takes away: `broken` where the game
# cannot be played as intended (no debug surface, a snapshot that cannot be read, a
# planet that never costs a ball, a deflector that does not turn, a bounce that
# never resolves, a ball that cannot be served or launched, a session that cannot be
# started, a lost ball that is never parked again); `scuffed` where a rule the game is built
# on is noticeably wrong (a contact rule, a formula, a draw from the seeded stream,
# an effect that does not apply); `passable` where the fault is a tolerance, an edge
# case, a ceiling or a secondary path; and `great` where it is a cosmetic detail (a
# second key bound to an action a first key already covers, the distinctness of a
# damaged derelict). No item caps at `flawless`: a failure always costs something.
[review]
format = 2

# Kessler review checklist — fragment K1
# Categories: instrumentation, field, paddle, serve, bounce, controls.
# [[review.categories]] / [[review.categories.items]] blocks; each item's
# validation key names its suite under validation/<engine>/.

# --- Instrumentation ----------------------------------------------------------
# The surface every other point is driven through, and a deliverable of the case
# in its own right. Each control operation is posed and read back one at a time,
# the two driver switches are checked alone, and the overlay points close
# the category, so a surface that is missing, hollow, or wired to nothing fails
# here by name rather than only as every other suite failing to run.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"

[[review.categories.items]]
id = "debug-api-present"
title = "The debug and automation surface is present"
description = "Every operation specs/instrumentation.md names for this mode is present as a function on the surface: window.__kessler in an engineless build, the surface initialize returns and engine.debug hands back in an engine build."
domains = ["gameplay", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/debug-api-present.test.ts", outputs = [ { id = "surface", name = "The Surface As Installed", kind = "image" } ] }

[[review.categories.items]]
id = "debug-api-live"
title = "The debug and automation surface is live"
description = "The surface drives the running game: a pose changes it and snapshot reads the change back."
domains = ["gameplay", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/debug-api-live.test.ts", outputs = [ { id = "driven", name = "The Driven Surface", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed session holding balls, targets on every ring, a falling pod, a running effect timer, and the shield, snapshot returns every field specs/instrumentation.md documents with its documented type, including seed, interstitialTicks, and the nested paddle, balls, rings, pods, effects, and menu objects, with values matching what was posed."
domains = ["gameplay"]
failure_cap = "broken"
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [ { id = "posed", name = "The Posed Session", kind = "image" } ] }

[[review.categories.items]]
id = "snapshot-fixed-shape"
title = "The snapshot shape is fixed on every screen"
description = "The snapshot carries every documented field on each of the six screens, with rings always holding three entries, paddle.angleDeg and every ring angleDeg normalized into [0, 360), and menu.index resting at 0 on a screen with no menu."
domains = ["gameplay"]
failure_cap = "passable"
validation = { script = "instrumentation/snapshot-fixed-shape.test.ts", outputs = [ { id = "screens", name = "The Screen Sweep", kind = "image" } ] }

[[review.categories.items]]
id = "reset-restores"
title = "reset restores the boot state"
description = "From a thoroughly disturbed session, reset() returns the game to its boot state: the title screen with menu.index 0, score 0, 3 lives, wave 1, ticks 0, the deflector at angle 90 with span 48, every slot filled at full hit points with every ring angle at 0 and the wave-1 speeds, no balls, no pods, no timed effect, no shield, the interstitial timer at 0, and both driver switches on."
