# WHICH CUE SOUNDED, AND WHY THOSE POINTS RUN UNDER THE ENGINES ALONE.
# `specs/ui.md` binds fifteen NAMED cues to fifteen events, one per event, and the
# three points above read only that a sound was emitted and on which tick —
# the strongest reading every engine of this case can make. Under `simple-2d` and
# `structured-2d` the game plays each cue "through the engine's cue bus", asking
# for it BY NAME, and the bus announces the name and the gain it sounded at; under
# `none` the build owns its whole audio layer, the specification fixes no file
# name to read a cue back by, and a sound arriving at the Web Audio API carries no
# name at all. So the points below are scoped to the two engines whose runtime
# reports the identity, exactly as the manifest grammar intends: a point whose
# validator does not cover the run's engine is left out of that run's checklist
# and adds no weight to its score.
#
# EVERY ONE OF THEM POSES A HALL IN WHICH ONLY ITS OWN EVENT CAN HAPPEN, arms the
# audio with a real gesture, lets the music bed get up before the probe opens, and
# reads the cues stamped with the tick the event resolved on. A pose sounds
# nothing — "the cues a scenario hears come from the ticks run after it" — so what
# is read always comes from a stepped tick. Where two of the specification's own
# events genuinely land on one tick, such as a core reaching the intake and the
# cell that spend costs, both cues are expected on it and each point reads its
# own.
[[review.categories.items]]
id = "fire-cue-named"
title = "The shot sounds the fire cue"
description = "The cue the injector's shot plays is the one named fire."
domains = ["presentation"]
failure_cap = "great"
# Automated validation: over a hall posed so nothing else can sound, raise the
# fire control and confirm the cue named `fire` sounded on the firing tick, once.
# That a cue sounds on that tick at all is audio/fire-cue's point, which every
# engine decides; this one is the identity.
validation = { script = "audio/fire-cue-named.test.ts", engines = ["simple-2d", "structured-2d"], outputs = [
  { id = "fire", name = "The shot whose cue is named", kind = "replay" },
] }
[[review.categories.items]]
id = "seat-cue"
title = "An insertion sounds the seat cue"
description = "The cue named seat plays on the tick a projectile is inserted into the train."
domains = ["presentation"]
failure_cap = "great"
# Automated validation: pose two cores of DIFFERENT charges so the insertion
# completes no run of three and nothing is extracted, fire a third charge into
# them, and confirm `seat` sounded on the tick the projectile seated, once.
validation = { script = "audio/seat-cue.test.ts", engines = ["simple-2d", "structured-2d"], outputs = [
  { id = "seat", name = "A core seating into the train", kind = "replay" },
] }
