# --- Levels, cells and the run ------------------------------------------------
# The shape of a run. The three per-level tables are graded as three points, one
# per column, so a build that carries the quotas and drops the feed speeds fails
# exactly that. The two endings and the two ways a level leaves play are each
# their own point, because the fail path is the one a build is most likely to
# leave unfinished. The six rows of the table a spent cell sets the run back by
# are six points for the same reason: a build that empties the channel and leaves
# a sightline running has to grade differently from one that does neither, and
# each row is implemented somewhere else in a build.
