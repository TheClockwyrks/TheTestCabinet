# THE ENDING AND WHAT IT RESTORES. `specs/progression.md` states one sentence —
# "An ending holds until it is dismissed, and dismissing it returns the game to
# the title screen with every value of a fresh run restored" — and it is a dozen
# separate observables: the ending not timing out, the press that leaves it on
# each of the two devices it is bound to, and each value a fresh run holds. They
# are a dozen points for the reason the cell-spend set beside them is seven: a
# build that returns to the title carrying the ended run's score has to grade
# differently from one that never leaves `gameover` at all, and a single item can
# only fail once.
#
# EVERY ONE OF THEM POSES THE ENDING RATHER THAN DRIVING TO IT. `setScreen`
# "changes nothing else: no level is opened, no channel is seeded, no timer is
# started", so the hall stands on `gameover` carrying exactly the run each point
# posed around it — which keeps these points from also failing whenever
# `progression/game-over`'s own requirement fails.
[[review.categories.items]]
id = "ending-holds"
title = "An ending holds until something dismisses it"
description = "An ending stays on screen for as long as nothing dismisses it."
domains = ["progression"]
failure_cap = "passable"
# Automated validation: setScreen("gameover") over a posed hall, step a second of
# play with nothing pressed, and confirm the screen is still gameover. A build
# whose ending times out reaches the title with nothing having dismissed it, which
# would leave every point below deciding nothing. See
# validation/<engine>/progression/ending-holds.test.ts.
validation = { script = "progression/ending-holds.test.ts", outputs = [
  { id = "held", name = "An ending holding on its own", kind = "replay" },
] }
