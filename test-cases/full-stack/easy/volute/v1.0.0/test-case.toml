# --- Machinery ----------------------------------------------------------------
# The four kinds a marked core grants. The cadence that places a mark, the cycle
# that names it, and the grant that fires it are three separate rules, and each of
# the four effects is graded on its own because a build can implement one
# faithfully and stub another.
[[review.categories]]
id = "machinery"
title = "Machinery"
[[review.categories.items]]
id = "mark-cadence"
title = "Every twelfth core is marked"
description = "Every twelfth core of a level carries a mark, counting the twelve the level opens with."
domains = ["progression"]
failure_cap = "scuffed"
# Automated validation: startLevel(1), confirm the twelfth core — the tail of the
# opening train, at s = 0 — is marked and the other eleven are not, then step
# until 24 cores have entered the level and confirm the 24th is marked and the
# 13th through 23rd are not. See validation/<engine>/machinery/mark-cadence.test.ts.
validation = { script = "machinery/mark-cadence.test.ts", outputs = [
  { id = "marked", name = "The marked cores of a level", kind = "image" },
] }
[[review.categories.items]]
id = "mark-cycle"
title = "The marks cycle in order"
description = "The marks of a level come up as choke, then backflow, then bore, then sightline."
domains = ["progression"]
failure_cap = "passable"
# Automated validation: on level 5, whose quota of 90 reaches a fourth mark, walk
# the mark counter with setQuotaRemaining and clearTrain so the inlet emits the
# 12th, 24th, 36th and 48th core of the level one at a time, and read each core's
# mark off the snapshot. Confirm they are choke, backflow, bore and sightline in
# that order. The cycle is read from the marks themselves rather than through the
# grants they would produce, so a build with a correct cycle and a broken grant
# fails one point and not three; what a bore does when it is granted belongs to
# bore-radius. See validation/<engine>/machinery/mark-cycle.test.ts.
validation = { script = "machinery/mark-cycle.test.ts", outputs = [
  { id = "cycle", name = "Four marks taken in turn", kind = "replay" },
] }
