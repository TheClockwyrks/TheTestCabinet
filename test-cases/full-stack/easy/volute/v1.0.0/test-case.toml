# --- Screens and controls -----------------------------------------------------
# The frame around the hall. Pause is bound to two interchangeable keys, so
# opening it and closing it are two points on each key rather than one on either:
# a build that bound only `Escape` is told apart from one that bound both. What a
# pause actually does to the train is a point of its own, because a build can show
# a pause screen over a hall that never stopped riding. Starting a run is two
# points for the same reason, one for the keyboard and one for the pointer, since
# a build reachable by keyboard alone is not the same build as one reachable by
# both.
[[review.categories]]
id = "screens"
title = "Screens and controls"
[[review.categories.items]]
id = "title"
title = "The hall opens on its title"
description = "A fresh hall opens on the title screen."
domains = ["progression"]
failure_cap = "scuffed"
