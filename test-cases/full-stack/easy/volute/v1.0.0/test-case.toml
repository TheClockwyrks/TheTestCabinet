# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity, recorded in every run and the key the definition
# store holds this case under.
slug = "volute"

# Human-readable display name for this test case.
name = "Volute"

# Test type. Volute is a `full-stack` case: an end-to-end (playable-browser-game)
# case with one addition — the model under test must PRODUCE the game's own art,
# effects, and audio DURING the run, with the asset-generation binaries on the run
# image's `PATH`, and then build a game around them. The type schedules the run
# onto the `test-cabinet-full-stack-2d` image, which carries exactly six binaries
# on `PATH` — `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`, `sfx-sample`, and
# `music` — and no others. `specs/assets.md` is the production contract. A root
# identity field, so it sits above the first table header.
type = "full-stack"

# Relative difficulty (easy | medium | hard), surfaced on the site. Volute is
# easy: every rule is a table row or a one-line formula over a single fixed
# polyline, with no physics to tune, no opponent to model, and no subsystem large
# enough to need splitting out behind an interface. What it measures is whether a
# build carries an exactly specified arcade loop — a train walking an arc-length
# channel, an injector inserting into it, matching, chaining, four machineries,
# five levels — all the way through without blurring a row, and produces the
# hall's art and sound alongside it. The asset pass is what the runtime budget
# below accounts for, not the difficulty.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "puzzle", "score-attack"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A geothermal pump hall where mineral cores ride a winding channel toward the \
intake, and an injector at its center fires cores into the train to group like \
charges and pull them out before the intake takes them — with every sprite, \
effect, and sound produced during the build."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Per-version changelog entry (Markdown, relative to this version folder),
# recording what changed in THIS version — a first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs, the selected variant, and the run's engine) and
# handed to the model as the build instruction. It injects absolute in-container
# paths through template variables rather than hardcoding them. The harness
# prepends the standing full-stack asset-quality directive to the rendered prompt,
# so this template does not restate it.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). Volute is an easy build, but a full-stack one: the
# game plus a produced set of fifteen sprites, three sheets, four particle
# systems, and fifteen cues. Six hours is comfortably more than a healthy build
# needs while still bounding a session that never terminates.
max_runtime_hours = 6

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. `npm install` — NOT `npm ci` — because
# `packages` below writes the `@test-cabinet/particle-runtime` `file:` dependency
# into the seeded `package.json` at seed time (and an engine run's vendored engine
# alongside it), so the lockfile is completed here; `[build].install` stays
# `npm ci` because by then the lockfile the model committed is what a rebuild must
# install. The same command downloads the Playwright Chromium build — the base
# image ships the OS libraries Chromium links against, but not the browser binary
# — so the model can build the game and drive it in a browser without further
# setup.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the
# whole point of a full-stack case: the model produces the hall's art, effects,
# and audio itself, during the run, with the six binaries on the run image's
# `PATH` (see `type` above and `specs/assets.md`).

# The Test Cabinet runtime libraries installed into the run so the build can play
# the particle systems it produces. `@test-cabinet/particle-runtime` is the same
# library the review UI plays a produced effect with: core stages it into the run
# and the seeded workspace `package.json` depends on it through its baked-in
# `file:` path, so the build imports it by its bare name like any other dependency
# and plays each produced `system.json` by simulating it live. Volute's four
# effects — the extraction burst, the bore detonation, the intake swallow spray,
# and the pickup shimmer — are all played this way through the runtime's
# `./canvas` binding; `specs/assets.md` is the consumption contract. Every
# workspace under `workspaces/` already declares the dependency at exactly the
# `file:./.tcab/packages/@test-cabinet/particle-runtime` path resolution requires.
# A root key, so it must precede the first table header.
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Volute offers exactly one, so no spec branches on the
# variant and no seeded file names a mode, an alternative, or a difficulty
# setting: a run's seeded set describes one game.
#   - base — the five-level hall run.
# This list is a root key, so it must precede the first table header.
variants = [
  "variants/base.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# canvas fit, the input actions, the audio bus, asset loading, and the on-screen
# diagnostics; one of them also owns rendering, collision detection, and the
# gameplay framework the game is written inside. It is a run dimension, chosen per
# run alongside the model, the harness, and the variant, and recorded on the run;
# it is not a property of the game.
#
# Volute supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop, the canvas fit, keyboard and pointer
#                     input, audio with looping cues, the loading of the produced
#                     files, the debug overlay, and the `window.__volute` surface
#                     itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around the game (`src/constants.ts` and `src/main.ts`); the
#                     build writes `src/game.ts`, its state, and the debug surface
#                     its `initialize` returns.
#   - `structured-2d` vendors its framework engine the same way and seeds the same
#                     two modules; the build writes the game module — the levels,
#                     the game mode holding the hall's rules, the actors and the
#                     controllers — and the debug surface its instance's
#                     `initialize` returns.
# The game they describe is the same one, so the checklist below is the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable
# differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# at `engine/` for the model to read, so the specs seeded from this folder never
# restate an engine's API and never fall out of date when it changes. Where a spec
# speaks of the runtime it does so only to state what is specific to Volute under
# it — which surfaces the build still supplies, Volute's actions, and Volute's cue
# names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the canvas, and the `@test-cabinet/particle-runtime` dependency the
# produced effects are played through. What differs is how much of the build is
# supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     input, audio, asset loading, diagnostics overlay and
#                     `window.__volute` surface, and every figure this
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules. The build writes the
#                     game the engine drives: its levels, the game mode holding
#                     the hall's rules, its actors and controllers, and the debug
#                     surface its instance's `initialize` returns.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`). The single variant declares no `[workspaces]` of its own, so
# every run of this case is seeded from this table.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# The audio packs the run container is staged with, and the boundary of what
# `sfx-sample` and `music` can reach. A tool config that names no pack plays the
# first pack of that kind.
#
# Eight of Volute's cues are `sfx-sample` by name in `specs/assets.md`: the five
# extraction steps, the intake, the level clear, and the lost cell. `combat-core`
# is where a pump hall's material lives for all of them, in its sub rumble, metal
# clank, ratchet, diesel idle, and servo. Both beds are the same hall heard calm
# and then under strain, and `specs/assets.md` asks for a slow, low, mechanical
# one, which `synthwave` carries as a drone on its sub bass and analog pads. The
# orchestral and general-MIDI banks put a melody in front of the machinery, so
# neither is staged.
[audio]
packs = ["combat-core@0.1.0", "synthwave@0.1.0"]

# How the validator (and the per-run static deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. Both commands are required; there are no defaults, so every case states
# exactly how its implementation is built.
#
# Nothing here invokes an asset-generation binary, and nothing may: the binaries
# are on `PATH` only while the run is live, so the produced files are committed
# and this build merely bundles them. `specs/assets.md` and `specs/overview.md`
# state the same requirement to the model.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. The seeded workspace ships the configuration each command
# reads (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`,
# `vitest.config.ts`), so what is checked here is the code the model wrote against
# configuration the case fixed. The commands run host-side over the collected tree
# after the run's container is gone, so a slow suite costs the run none of its
# runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken` and scores it zero,
# because code that does not compile is not reviewable. The other three are
# recorded and gate nothing — `test` additionally records the count and coverage
# the build's own suite reports, which is how a build that ships tests is told
# apart from one that ships none. Each is spelled `npx` rather than
# `npm run <script>` so the check is the case's own statement of what is run and
# does not depend on the model leaving the seeded scripts intact. The same four
# commands are what `specs/overview.md` tells the model the repository must pass.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. The handle is required as soon as any review item declares a `validation`
# script, which every one below does. It names the ENGINELESS contract: an
# engineless build writes the surface itself and installs it on `window.__volute`,
# so the handle is what a person opening the console of such a build finds. An
# engine run has no global at all — the build writes the surface, its `initialize`
# returns it, and a validator reads it back off `engine.debug`. The seeded
# specification documents the same handle independently as an ordinary game debug
# feature (see specs/instrumentation.md); this entry is reporter-side and never
# seeded.
#
# `tick_hz` is Volute's fixed simulation rate. The engineless debug surface
# advances the game in whole ticks (`step(ticks)`) rather than in seconds, so
# there is no rounding and no ambiguity about what a step means, and this is the
# rate the validation runtime relates that stepping back to real time with: one
# tick is 1/60 of a second, so a second of simulated time is 60 ticks. Under an
# engine it is the step a scripted clock takes by default, so the same scenario
# walks the same number of ticks on all three engines and one tolerance covers
# every suite. It matches the timestep `specs/instrumentation.md` mandates.
[instrumentation]
handle = "__volute"
tick_hz = 60

# The specs: every one is seeded for EVERY run, at the `dest` path within the run
# workspace. The specification is decomposed by concern — the overview and the
# field, the channel with its train and pressure, the injector and insertion,
# matching and chaining, the machinery, the levels and cells, the controls, the
# screens and audio, the game's state, the debug surface, and the asset-production
# contract — so a reader can predict a file's contents from its name and find a
# given rule in exactly one file.
#
# There is no per-variant spec and no variant branch anywhere in the set, because
# the case offers one variant: a seeded set asserts exactly one game, with no
# cross-variant language for the model to read.
#
# Six of the eleven are `.hbs` templates rendered before they land, and they
# branch on `engine.slug` alone — on what the build is handed and what it writes.
# `specs/overview.md.hbs` (the runtime under the game and the modules the build
# owns), `specs/controls.md.hbs` (a written input layer against the engine's
# registered actions), `specs/ui.md.hbs` (how cues and the two looping beds are
# played and muted), `specs/state.md.hbs` (the state contract, or the framework
# objects that hold it), `specs/instrumentation.md.hbs` (how the surface is
# reached and the shape its operations take), and `specs/assets.md.hbs` (where the
# produced files land and how each is loaded and drawn). The remaining five state
# rules that are the same under every runtime and are seeded verbatim. A spec's
# `dest` defaults to its `source` with a trailing `.hbs` stripped, so an `.md.hbs`
# source seeds to the same `.md` path and these need only name their source.

# The overview: the game, the runtime beneath it, what the build owns, the checks
# the repository passes, the build interface, the fixed 960 x 540 field and its
# angle convention, and the five charges.
[[spec]]
source = "specs/overview.md.hbs"

# The channel: the twelve-vertex polyline and its arc-length measure, the train
# and its segments, advance, merging, emission, the seeded twelve, pressure, and
# the order a tick resolves in.
[[spec]]
source = "specs/channel.md"

# The injector: where it sits, the aim, firing and its cooldown, the loaded and
# queued charges, a projectile's flight, which core a shot strikes, and where the
# struck core seats.
[[spec]]
source = "specs/injector.md"

# Matching and extraction: runs, the two events that extract one, the recoil a
# removal leaves behind, the chain step, and what an extraction pays.
[[spec]]
source = "specs/extraction.md"

# Machinery: the marks every twelfth core carries, the cycle they follow, how a
# grant happens, the four kinds, and the rule that decides which one is active.
[[spec]]
source = "specs/machinery.md"

# Progression: the five levels and their charge sets, quotas and feed speeds, the
# clear condition and its bonus, the cells a run spends at the intake, the
# interludes and endings, and the danger condition.
[[spec]]
source = "specs/progression.md"

# The controls: the actions, their bindings, how the pointer and the turn actions
# resolve into the aim, and what each screen reads. It branches on the engine for
# whether the input layer is written or registered with the engine.
[[spec]]
source = "specs/controls.md.hbs"

# The screens, the HUD, and the audio: the seven screens and what each shows, what
# advances on each, the six HUD readouts, the fifteen cues and the two looping
# beds, and mute. It branches on the engine for how a cue is played and muted.
[[spec]]
source = "specs/ui.md.hbs"

# The shape of the game's state: what a core, a segment, a projectile, and the
# machinery carry, and the whole value a tick advances. It branches on the engine
# for whether the build holds one state value the engine advances or the framework
# objects the engine owns.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build exposes: a deterministic,
# steppable core, the operations that pose and read the running game, the snapshot
# shape, and the read-only debug overlay. Framed as an ordinary developer
# affordance of the game. It branches on the engine for how the surface is reached
# (`window.__volute` under `none`, `engine.debug` under either engine) and for the
# shape its operations take.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The asset-production contract: every sprite, sheet, particle system, and cue the
# game needs, which of the six on-PATH binaries produces it, where the file lands
# in the workspace, how the build reaches it, and the bar it meets. Seeded for
# every run so the produced-asset points below and this spec stay in lockstep.
# This is the defining spec of a full-stack case. It branches on the engine for
# where the files land and how each is loaded and drawn.
[[spec]]
source = "specs/assets.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`: the specification fixes
# behavior, not appearance, so there is no visual target to seed or to score
# against. Every piece of evidence a reviewer sees comes from this case's own
# validators, which pose each scenario against the game the build wrote and
# capture what it renders. The automated load check still runs.

# Scoring domains. A run is rated on each independently, and the run's overall
# functional rating is the WORST across them — a flawless channel cannot mask an
# injector that never seats a shot. Every case must declare at least one. This
# case is on the engine format, so it is validator-rated: each domain's FUNCTIONAL
# rating is decided by the validators behind the checklist below (every point
# names the domains its failure lowers and how far — see `domains` and
# `failure_cap` there), and the reviewer's judgement lives in the separate
# AESTHETIC rating: how the hall looks, sounds, and feels to play.
#
# `presentation` is a first-class domain rather than a note on the others, because
# this is a full-stack case: the produced art, motion, effects, and audio are half
# of what a run delivers, and a build that ships a correct simulation behind
# placeholder art has not finished the job.
[[domain]]
id = "channel"
name = "Channel"
description = "The train riding the channel: advance, catch-up, merging, extraction, chains, and pressure."

[[domain]]
id = "injector"
name = "Injector"
description = "The injector: aiming, firing, the loaded and queued charges, a shot's flight, and where it seats in the train."

[[domain]]
id = "progression"
name = "Progression"
description = "The shape of a run: the five levels, cells, quotas, the screens, scoring, and the machinery."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "The produced art, motion, effects, and audio, and how the hall reads and sounds while it is played."

# Reviewer checklist, common to every run, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare
# name grouping the points a reviewer reads — and each
# `[[review.categories.items]]` under it is one graded review item, worth one
# point (the default weight), so a category is worth the number of items it holds
# and there is no fractional scoring. A category carries no prose of its own; each
# item states in `description` the claim its validator checks. Eighty-five items
# across eleven categories, all common: the case has one variant, so no point
# lives in a variant file.
#
# The checklist is reporter-side material, never seeded into a run, so the model
# never sees it. Each item restates a rule the seeded specification already
# states, and every threshold a validator asserts is derived from a figure or a
# rule in the specs plus an honest numeric tolerance — never from a reference
# implementation. A validator that passes on the reference and fails a different
# spec-compliant build is worse than no validator.
#
# EVERY point carries a validation script, and every point is one observable
# behavior, so a build fails exactly the rule it breaks: seating ahead of a struck
# core and seating behind it are two points, not one, and the same goes for the
# left and right turn actions. Each script is a vitest suite under
# `validation/<engine>/<category>/<item id>.test.ts`. The `<engine>` level is the
# ENGINE the suite is written against — a validator speaks one engine's
# vocabulary, so this case, which supports three, ships one directory per engine:
# `validation/none/` drives the build in Chromium through `window.__volute`, and
# `validation/simple-2d/` and `validation/structured-2d/` each run in process
# against their vendored engine. The three walk the same scenarios; only how they
# reach the build differs, and the `script` path declared here must resolve in all
# three projects.
#
# Every drive follows one shape. `reset`, `startLevel(n)`, `clearTrain()`,
# `poseTrain(cores)` and the other setters pose an isolated hall, and then the
# real systems are stepped — `step(ticks)` engineless, a scripted engine clock
# under an engine — and what the drive asserts is read back from `snapshot`. No
# pose decides an outcome: every extraction, every score, and every chain a
# validator reads comes from stepping the game, which is what
# `instrumentation.pose-decides-nothing` holds the build to directly.
#
# STANDING TOLERANCES, unless a point's own description states otherwise. A tick
# is 1/60 s (`tick_hz` above), so stepped ticks convert to simulated seconds
# exactly.
#   arc position or field distance   ±0.5 units
#   speed, over at least 30 ticks    ±2% of the stated figure
#   duration or cadence              ±2 ticks
#   angle                            ±1 degree
#   pressure                         ±0.05
#   count, score, charge id, screen  exact
#   two sampled pixels told apart    RGB distance above 50 on a 0-441 scale
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls: an `image` output is a captured frame and a `replay` output the
# draw-command recording the suite takes across the drive. A recorded clip is a
# browser drive's output and this case has no browser drive: all three validator
# projects arm the recorder themselves, the engineless one over the 2D context it
# injects, so motion is handed back as a replay. Both are evidence beside the
# verdict rather than any part of it — a point passes or fails on its assertions
# alone.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers — a point about the
# train lowers `channel`, a point about a shot lowers `injector`, a point about
# both lowers both. `failure_cap` is the highest functional rating those domains
# may reach while the point fails; each domain takes the LOWEST cap among its
# failing points, and a domain with no failing point is flawless. The caps are
# graded by how much of the game a failure takes away: `broken` for a
# gameplay-critical rule (the debug surface, the advance, an insertion, an
# extraction, the fail condition); `scuffed` for a secondary rule (a machinery
# effect, a level figure, a screen transition, the legibility of the charges); and
# `passable` for polish (a tolerance, an edge case, a cue, a produced-asset
# detail). No point caps at `great` or at `flawless`: a failure always costs.
#
# Rules the specification states that no point below decides are deliberate
# omissions rather than oversights. Each is either the complement of a graded
# point — a run of two spanning a merge, a shot fired at or after the cooldown,
# a second press of mute — or a secondary effect of one already graded, such as
# backflow suppressing emission or a bore leaving the chain where it stands.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The build writes the debug surface, so these two points check that it is there
# and that it is honest. Every other point below poses its scenario through the
# same surface, which means a surface the build hollowed out also shows up as
# those points failing to run; the first point names that fault plainly, and the
# second holds the surface to the rule that makes every other verdict meaningful.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "debug-surface"
title = "Debug and automation surface present"
description = "Every operation specs/instrumentation.md names is present as a function on the debug surface, each poses or reads the running game, and a snapshot reports the full documented shape with live values."
domains = ["channel", "injector", "progression", "presentation"]
failure_cap = "broken"
# Automated validation: reflect that every named operation is installed as a
# function, call each against a started run, and confirm a snapshot reports every
# documented field with values that move when the game is stepped. See
# validation/<engine>/instrumentation/debug-surface.test.ts.
validation = { script = "instrumentation/debug-surface.test.ts", outputs = [
  { id = "state", name = "The posed hall the surface was read against", kind = "image" },
] }
[[review.categories.items]]
id = "pose-decides-nothing"
title = "A pose decides no outcome"
description = "Posing a run of three matching cores in one segment extracts nothing on its own: the three stay on the channel and the score stays 0 until a real insertion or merge."
domains = ["channel"]
failure_cap = "scuffed"
# Automated validation: startLevel(1), setQuotaRemaining(0), clearTrain(), pose
# three halide cores at s = 100, 128 and 156, step 60 ticks, and confirm the core
