id = "recoil-hold"
title = "The recoiled train holds"
description = "A recoiled group stays put for 0.4 s of simulation time before it advances again."
domains = ["channel"]
failure_cap = "scuffed"
# Automated validation: immediately after the extraction, step 23 ticks (0.383 s)
