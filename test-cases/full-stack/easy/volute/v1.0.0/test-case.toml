# Automated validation: from the title, land a real touch contact at the field's
# center through a touchscreen context and confirm the screen is playing with
# level 1 under way. A build that reads mouse events alone is reachable by neither
# a phone nor a tablet, and passes screens/start-pointer while failing here.
