# control and confirm `swap` sounded on that tick, once.
validation = { script = "audio/swap-cue.test.ts", engines = ["simple-2d", "structured-2d"], outputs = [
  { id = "swap", name = "The exchange whose cue is checked", kind = "replay" },
] }
