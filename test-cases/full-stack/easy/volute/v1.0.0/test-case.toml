# --- Extraction and chains ----------------------------------------------------
# What a run of three pays and what it leaves behind. The threshold is graded from
# both sides — three extracts, two does not — because a build that extracts every
# pair is a different game rather than a slightly wrong one. The chain is graded
# as three points, the step a merge adds, the step an insertion takes it back to,
# and the lapse the quiet hall pays, since a build can step the chain up
# correctly and never let it fall back.
#
# The OTHER half of the threshold — specs/extraction.md's "a run that reaches 3
# cores by any other means stays on the channel" — is graded where the game
# itself assembles such a run mid-play, which it does in two ways: a removal's
# recoil pushes a trailing group onto a train pinned at the inlet, and backflow
# packs the whole channel up from the back. Neither is an insertion and neither is
# a merge, and a build that sweeps its train for runs instead of extracting at the
# two events passes every point above while playing a different game. (The third
# way a run simply STANDS there — a level's seeded twelve are each drawn at random
# from three or four charges — is graded by `instrumentation/pose-decides-nothing`,
# which poses exactly that hall.)
[[review.categories]]
id = "extraction"
title = "Extraction and chains"
[[review.categories.items]]
id = "extract-three"
title = "A run of three is extracted"
