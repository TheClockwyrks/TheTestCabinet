# --- Produced art and the HUD -------------------------------------------------
# The produced half of the deliverable. These points assert only that a thing is
# present and told apart, never a color value, a palette, a font, or a layout:
# how the hall looks is what the reviewer's aesthetic rating judges, and a
# validator that asserted a hex value would fail a perfectly good build. What is
# graded here is what the specification actually fixes — that the five charges are
# told apart, that they are told apart without color, that the cores are produced
# sprites rather than code-drawn discs, that the produced sheet and the produced
# particle system play, and that the HUD carries its six readouts.
[[review.categories]]
id = "presentation"
title = "Produced art and the HUD"
[[review.categories.items]]
id = "charges-distinct"
title = "The five charges are told apart"
description = "The five charges are mutually distinguishable where they stand on the channel."
domains = ["presentation"]
failure_cap = "scuffed"
# Automated validation: pose one core of each charge at known arc positions on the
# straight top run, render, take each core's mean RGB over the disc of radius 13
# around its center — a mean rather than one pixel, since every core carries a
# glyph over its face — and confirm all ten pairwise RGB distances exceed 50 on a
# 0-441 scale. See
# validation/<engine>/presentation/charges-distinct.test.ts.
