[[review.categories.items]]
id = "recoil-distance"
title = "The trailing train recoils"
description = "After a run is drawn out, the cores behind it fall back 42 units of arc, clamped at no less than arc position 0."
domains = ["channel"]
failure_cap = "scuffed"
# Automated validation: startLevel(1), setPressure(0), setQuotaRemaining(0), pose
# one segment of seven cores — three of one charge at the head and four of another
# behind them — record the trailing tail's arc distance, seat a shot into the head
# three to extract them, and confirm the tail fell by 69.63 (±0.2) across that
# tick: the 28 units the insertion shifted the whole train back plus the 42 units
# of recoil, less the 0.37 the segment advanced at the feed. The 42 is not
# separately readable, because the insertion's shift lands on the same tick. Then
# the clamp: pose two segments so a merge extraction leaves one trailing group
# whose last core stands 23.2 units out, and confirm that group falls to arc
# position 0 rather than past it. See
# validation/<engine>/extraction/recoil-distance.test.ts.
validation = { script = "extraction/recoil-distance.test.ts", outputs = [
  { id = "recoil", name = "The train recoiling behind an extraction", kind = "replay" },
] }
