<!DOCTYPE html>
<!--
  Hollowdeep — in-colony reference mockup (representative frame).
  Canonical view slug: gameplay
  Render at a 1280x720 viewport. See ../specs/overview.md (coordinate system,
  visual design), ../specs/world.md (tiles, camera), ../specs/gas.md (the gas
  overlay), ../specs/flow.md (the HUD dashboard), and ../specs/assets.md (these
  are stand-ins for PRODUCED sprites, animations, and particle overlays).

  The colony layout, gas spread, and delver positions vary at runtime; this
  frame is a representative moment for a soft palette/layout comparison, not a
  strict pixel match. Objects inside .colony use FIELD-LOCAL coordinates (a tile
  at field row r sits at top = r * 24; the field itself starts at stage y=64).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hollowdeep — Gameplay</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- ================= Top HUD: colony vitals ======================= -->
      <div class="topbar">
        <div class="vital">
          <span class="k">OXYGEN</span>
          <span class="v good">68%</span>
          <div class="meter"><span class="ox" style="width: 68%"></span></div>
        </div>
        <div class="vital">
          <span class="k">CO2</span>
          <span class="v warn">14%</span>
          <div class="meter"><span class="co" style="width: 14%"></span></div>
        </div>
        <div class="vital">
          <span class="k">POWER</span>
          <span class="v warn">2.4 / 3.0kW</span>
          <div class="meter"><span class="pw" style="width: 80%"></span></div>
        </div>
        <div class="vital"><span class="k">ORE</span><span class="v">14</span></div>
        <div class="vital"><span class="k">MATERIAL</span><span class="v">26</span></div>
        <div class="vital"><span class="k">FOOD</span><span class="v food">9</span></div>

        <div class="spacer"></div>

        <div class="alert-chip">&#9888; LOW O2 &mdash; SECTOR B</div>
        <div class="clock">
          <span class="cycle">CYCLE 6</span>
          <span class="speed">&#9654;&#9654; 2x</span>
        </div>
      </div>

      <!-- ================= Colony view (camera onto the tile world) ===== -->
      <div class="colony">
        <!-- Bedrock floor band across the bottom (indestructible border). -->
        <div class="region stone" style="--c: 0; --r: 20; --w: 54; --h: 5"></div>

        <!-- Main dug chamber (open space). -->
        <div class="region open" style="--c: 6; --r: 6; --w: 30; --h: 9"></div>
        <!-- Upper dig shaft, opened toward the surface cap. -->
        <div class="region open" style="--c: 14; --r: 2; --w: 5; --h: 4"></div>
        <!-- Approach tunnel dug toward the ore seam. -->
        <div class="region open" style="--c: 36; --r: 9; --w: 4; --h: 2"></div>

        <!-- Ore seam in the rock, being mined into. -->
        <div class="region ore" style="--c: 40; --r: 8; --w: 4; --h: 6"></div>

        <!-- Chamber floor (a walkable surface across the open span). -->
        <div class="region" style="--c: 6; --r: 14; --w: 30; --h: 1;
             background: var(--steel-2); border-top: 3px solid var(--steel)"></div>

        <!-- A wall partition holding good air in the left of the chamber. -->
        <div class="cell wall" style="--c: 30; --r: 7"></div>
        <div class="cell wall" style="--c: 30; --r: 8"></div>
        <div class="cell wall" style="--c: 30; --r: 9"></div>
        <div class="cell wall" style="--c: 30; --r: 10"></div>
        <div class="cell wall" style="--c: 30; --r: 11"></div>
        <div class="cell wall" style="--c: 30; --r: 12"></div>
        <div class="cell wall" style="--c: 30; --r: 13"></div>

        <!-- Ladder up from the chamber floor to the dig shaft. -->
        <div class="cell ladder" style="--c: 16; --r: 7"></div>
        <div class="cell ladder" style="--c: 16; --r: 8"></div>
        <div class="cell ladder" style="--c: 16; --r: 9"></div>
        <div class="cell ladder" style="--c: 16; --r: 10"></div>
        <div class="cell ladder" style="--c: 16; --r: 11"></div>
        <div class="cell ladder" style="--c: 16; --r: 12"></div>
        <div class="cell ladder" style="--c: 16; --r: 13"></div>

        <!-- Power wiring along the floor from generator to diffuser/pump. -->
        <div class="cell wire" style="--c: 11; --r: 13"></div>
        <div class="cell wire" style="--c: 12; --r: 13"></div>
        <div class="cell wire" style="--c: 13; --r: 13"></div>
        <div class="cell wire" style="--c: 14; --r: 13"></div>
        <div class="cell wire" style="--c: 15; --r: 13"></div>

        <!-- Dig designations mining into the ore seam. -->
        <div class="dig" style="--c: 40; --r: 9"></div>
        <div class="dig" style="--c: 40; --r: 10"></div>
        <div class="dig" style="--c: 41; --r: 9"></div>
        <div class="dig" style="--c: 41; --r: 10"></div>

        <!-- Machines on the chamber floor. -->
        <div class="machine" style="--c: 9; --r: 12">&#9881;</div>
        <div class="machine diffuser on" style="--c: 22; --r: 12">O&#8322;</div>
        <div class="machine on" style="--c: 26; --r: 12">&#8645;</div>

        <!-- Gas overlays: oxygen collects high, CO2 settles low (buoyancy). -->
        <div class="gas oxygen" style="--c: 7; --r: 6; --w: 22; --h: 5"></div>
        <div class="gas co2" style="--c: 7; --r: 12; --w: 22; --h: 3"></div>
        <div class="gas co2" style="--c: 37; --r: 10; --w: 3; --h: 1"></div>

        <!-- Delvers (produced, animated sprites). Positioned at stage pixels so
             they stand on the floor row (floor top = 64 + 14*24 = 400). -->
        <div class="delver" style="left: 300px; top: 378px"></div>
        <div class="delver" style="left: 388px; top: 300px"></div>
        <div class="delver" style="left: 852px; top: 290px"></div>
      </div>

      <!-- ================= Bottom HUD: roster + build palette =========== -->
      <div class="bottombar">
        <div class="roster">
          <div class="crew">
            <span class="face"></span>
            <div class="needs">
              <div class="needbar"><span class="ox" style="width: 74%"></span></div>
              <div class="needbar"><span class="st" style="width: 52%"></span></div>
              <div class="needbar"><span class="hu" style="width: 61%"></span></div>
              <span class="job">DIGGING</span>
            </div>
          </div>
          <div class="crew">
            <span class="face"></span>
            <div class="needs">
              <div class="needbar"><span class="ox" style="width: 88%"></span></div>
              <div class="needbar"><span class="st" style="width: 40%"></span></div>
              <div class="needbar"><span class="hu" style="width: 70%"></span></div>
              <span class="job">HAULING</span>
            </div>
          </div>
          <div class="crew">
            <span class="face"></span>
            <div class="needs">
              <div class="needbar"><span class="low" style="width: 22%"></span></div>
              <div class="needbar"><span class="st" style="width: 66%"></span></div>
              <div class="needbar"><span class="hu" style="width: 33%"></span></div>
              <span class="job">FLEEING O2</span>
            </div>
          </div>
        </div>

        <div class="palette">
          <div class="tool selected">&#9935;</div>
          <div class="tool">&#9639;</div>
          <div class="tool">&#8801;</div>
          <div class="tool">&#8942;</div>
          <div class="tool">&#10005;</div>
        </div>
      </div>
    </div>
  </body>
</html>
