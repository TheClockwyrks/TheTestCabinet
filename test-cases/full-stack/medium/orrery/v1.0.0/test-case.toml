# --- Presentation -------------------------------------------------------------
# What a player must be able to see and tell apart, and whether the build draws
# the art it produced: every mote, filament, glyph, hub, gripper, mount, and
# aperture painted from its produced file, at its authored canvas and at the pose
# specs/assets.md fixes; the sky, the field, the arms, the wheel, the track, and
# the rise and set patterns drawn in code around them; the three particle systems
# playing at their events; the stage fitted to the window; and every piece of
# screen text legible. Whether the produced FILES exist, measure their canvases,
# and differ from one another is decided under Produced Assets; how GOOD the sky
# looks — the palette, the type, the originality of the design — is the run-wide
# aesthetic rating's and is not scored here.
