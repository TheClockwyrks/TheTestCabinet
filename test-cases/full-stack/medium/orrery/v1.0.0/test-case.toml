# --- The editor ---------------------------------------------------------------
# The screen a machine is built on: the five stage regions and the rectangles
# presses are targeted by, the tray, selection on the field, the three drag
# shapes the snapshot reports (place, move, lay), the tape panel and its derived
# scroll, cursor editing, and the undo history. Placement legality belongs to
# the parts category, the instruction table and the two macro expansions to the
# tapes category, and the run controls to the runs category; this category
# checks only what the editor itself does with a pointer, a key, and a cursor.
[[review.categories]]
id = "editor"
title = "The editor"
# --- Regions ------------------------------------------------------------------
[[review.categories.items]]
id = "heading-press-changes-nothing"
title = "The heading is display only"
description = "A press anywhere in the heading region, y below HEADING_H (48), leaves editor.selected, editor.cursor, and editor.drag exactly as they stand, because the heading holds no interactive geometry."
domains = ["workshop"]
failure_cap = "great"
validation = { script = "editor/heading-press-changes-nothing.test.ts", outputs = [ { id = "heading", name = "A heading press leaving the selection standing", kind = "image" } ] }
[[review.categories.items]]
id = "readout-press-changes-nothing"
title = "The readout is display only"
description = "A press in the readout region, x from READOUT_X0 (1008) to STAGE_W (1280) and y from HEADING_H (48) to TAPE_Y0 (560), leaves editor.selected, editor.cursor, and editor.drag exactly as they stand, so it neither clears a selection nor begins a drag."
domains = ["workshop"]
failure_cap = "great"
validation = { script = "editor/readout-press-changes-nothing.test.ts", outputs = [ { id = "readout", name = "A readout press leaving the selection standing", kind = "image" } ] }
[[review.categories.items]]
id = "readout-tracks-the-runs-live-figures"
title = "The readout follows the run's live figures"
description = "During a run the readout region, x READOUT_X0 (1008) to STAGE_W (1280) and y HEADING_H (48) to TAPE_Y0 (560), is drawn differently for each of a changed sim.status, a changed sim.cycle, a changed editor.period, a changed sim.speed and a changed tally, so it shows the five figures specs/editor.md names rather than resting."
domains = ["workshop", "presentation"]
failure_cap = "passable"
validation = { script = "editor/readout-tracks-the-runs-live-figures.test.ts", outputs = [
  { id = "readout", name = "The readout across five posed figures", kind = "image" },
] }
[[review.categories.items]]
id = "region-boundaries-are-half-open"
title = "A region includes its lower bound and excludes its upper"
description = "A press at x 223 within the tray's y span is a tray press and leaves editor.selected standing, and a press at x TRAY_REGION_W (224), y HEADING_H (48) is a field press off every hex and clears the selection, because every rectangle specs/editor.md fixes includes its lower bound and excludes its upper."
domains = ["workshop"]
failure_cap = "great"
validation = { script = "editor/region-boundaries-are-half-open.test.ts", outputs = [ { id = "tray-side", name = "The press at x 223 read as a tray press", kind = "image" }, { id = "field-side", name = "The press at x 224 read as a field press", kind = "image" } ] }
[[review.categories.items]]
id = "tape-panel-owns-the-shared-corner"
title = "The tape panel owns the corner it shares with the field and the tray"
description = "A press at exactly x TRAY_REGION_W (224), y TAPE_Y0 (560) sets editor.focus to tape, because that point is the tape panel's included lower corner and the field's excluded upper one."
domains = ["workshop"]
failure_cap = "great"
validation = { script = "editor/tape-panel-owns-the-shared-corner.test.ts", outputs = [ { id = "corner", name = "The shared corner press setting tape focus", kind = "image" } ] }
