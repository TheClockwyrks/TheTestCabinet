# --- Field, motes, and filaments ----------------------------------------------
# The geometry every pointer position, every collision and every drawn sprite is
# measured against, and the material a machine moves: the fifteen mote types, the
# filaments that join them into constellations, the fixtures a wheel's ring
# carries once it is raised, and the pattern placement a rise and a set are posed
# by. Each formula and each tie-break is its own point, because a build that steps
# q correctly and r wrongly must score differently from one that steps neither.
# The refusal a debug operation raises when a pose would break one of these rules
# is graded under Instrumentation, which owns every surface refusal. The wheel's
# own anatomy is graded under Parts and placement, and what a mote or a filament
# looks like on screen under Presentation.
