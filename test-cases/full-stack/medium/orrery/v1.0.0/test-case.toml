# --- Instructions and tapes ---------------------------------------------------
# The program layer: which of the ten instructions each part kind can execute and
# what a tape cell that it cannot execute does at the fetch, the blank cell as a
# rest, how a tape's length is measured, the one period every tape loops on, and
# the two editor macros cell by cell. An instruction a part cannot execute faults
# at the fetch, and that refusal is graded here, one instruction and one part kind
# at a time. What an instruction does to the field once the motion step begins is
# the simulation category's, and the collision rule, the freeze rule and the fault
# payload table are the collision category's.
[[review.categories]]
id = "instructions"
title = "Instructions and tapes"
[[review.categories.items]]
id = "instruction-set-complete"
title = "All ten instructions are writable into a tape"
description = "INSTRUCTIONS holds exactly grab, drop, rotate-cw, rotate-ccw, pivot-cw, pivot-ccw, extend, retract, advance and recede, and each of the ten written into a cell is held there and read back as that instruction."
domains = ["workshop"]
failure_cap = "broken"
validation = { script = "instructions/instruction-set-complete.test.ts", outputs = [ { id = "ten-cells", name = "A tape holding all ten instructions", kind = "image" } ] }
[[review.categories.items]]
id = "any-tape-may-carry-any-instruction"
title = "Any tape accepts any instruction"
description = "Writing extend into a wheel's tape, or advance into the tape of an arm on no track, is accepted by the editor and held in the cell; nothing about the executing part restricts what a cell may hold."
domains = ["workshop"]
failure_cap = "passable"
validation = { script = "instructions/any-tape-may-carry-any-instruction.test.ts", outputs = [ { id = "wheel-tape", name = "A wheel's tape holding extend", kind = "image" } ] }
[[review.categories.items]]
