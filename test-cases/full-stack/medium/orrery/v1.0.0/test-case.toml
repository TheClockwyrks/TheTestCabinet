# --- Parts and placement ------------------------------------------------------
# The roster a machine is built from and the rules that govern where a part may
# sit: the five arm anatomies and their spokes, the zodiac wheel and its fixture
# ring, track and what mounting means, rises and sets as placed parts, the six
# placement rules of specs/parts.md one edge case at a time, and PART_COSTS.
# Each item is one anatomy fact, one legality decision, or one figure of the cost
# table, because a build whose triarm carries the wrong spokes is broken in a
# different way from one that lets two tracks share a hex. What a placed part
# looks like on the field is graded under Presentation.
