# --- Simulation and motion ----------------------------------------------------
# The cycle every tape loops on and what one cycle does to the field: the order
# of its five steps, the motion each instruction imposes on the part and on what
# the part carries, the grips that survive from cycle to cycle, motes off the
# field, and the rule that decides whether a constellation held by several
# grippers moves or tears. Each point is one row of the motion table, one step
# boundary, or one form of agreement, checked on its own, because a build that
# rotates but does not carry is broken in a different way from one that carries
# but does not land on hex centers. Every scenario is posed through the
# operations of specs/instrumentation.md on a field cleared with clearMotes and
# holding only the parts and motes the point concerns. The faults these rules
# raise are graded in the Collision and faults category.
[[review.categories]]
id = "simulation"
title = "Simulation and motion"
[[review.categories.items]]
id = "fetch-precedes-the-grippers"
title = "A fetch fault halts the cycle before any gripper moves"
description = "Fetch is the first step of the cycle, so when any part's cell raises a fetch fault no gripper of any part opens or closes and nothing moves that cycle: a machine whose one part is given extend on a plain arm while a second part is given grab over a mote ends the cycle faulted with sim.grips still empty."
domains = ["campaign", "extras", "workshop"]
failure_cap = "passable"
validation = { script = "simulation/fetch-precedes-the-grippers.test.ts", outputs = [ { id = "faulted", name = "The cycle faulted at the fetch with no grip taken", kind = "image" } ] }
[[review.categories.items]]
id = "earliest-faulting-part-wins"
title = "One fetch raises the earliest faulting part's fault"
description = "When more than one part faults at one fetch, the run raises the fault of the earliest such part in placement order and names that part, so of two parts placed in a known order and both given an instruction they cannot perform, the fault reports the kind and the id of the first one placed."
domains = ["campaign", "extras", "workshop"]
failure_cap = "passable"
validation = { script = "simulation/earliest-faulting-part-wins.test.ts", outputs = [ { id = "faulted", name = "The earlier-placed part named by the fault", kind = "image" } ] }
[[review.categories.items]]
id = "grabs-precede-motion"
title = "A grab taken this cycle rides this cycle's motion"
description = "The grab step runs before the motion step, so a gripper whose cell is grab holds the constellation for that same cycle's motion: an arm given grab over a mote of a constellation another part is rotating this cycle raises torn in that cycle rather than the next."
domains = ["campaign", "extras", "workshop"]
failure_cap = "passable"
validation = { script = "simulation/grabs-precede-motion.test.ts", outputs = [ { id = "torn", name = "A grab entering the same cycle's agreement check", kind = "image" } ] }
[[review.categories.items]]
id = "motion-precedes-the-boundary"
title = "The boundary reads the field the motion left"
description = "The motion step completes before the boundary, so a sigil acts on where the motion put the motes: an arm that carries an essence onto a wane seat with rotate-cw finds it dust at that same cycle's boundary rather than one cycle later."
domains = ["campaign", "extras", "workshop"]
failure_cap = "scuffed"
validation = { script = "simulation/motion-precedes-the-boundary.test.ts", outputs = [ { id = "waned", name = "A carried essence waned at the boundary of the cycle that delivered it", kind = "replay" } ] }
[[review.categories.items]]
id = "rotate-cw-turns-the-part"
title = "rotate-cw turns the part one step clockwise about its base"
description = "A part whose cell is rotate-cw ends the cycle with its live rotation one direction index higher modulo 6, its base unmoved and its length unchanged, so each gripper sits on base plus length times DIRS of its new spoke."
domains = ["campaign", "extras", "workshop"]
failure_cap = "broken"
validation = { script = "simulation/rotate-cw-turns-the-part.test.ts", outputs = [ { id = "turn", name = "An arm turning one step clockwise", kind = "replay" } ] }
[[review.categories.items]]
id = "rotate-ccw-turns-the-part"
title = "rotate-ccw turns the part one step counterclockwise about its base"
description = "A part whose cell is rotate-ccw ends the cycle with its live rotation one direction index lower modulo 6, its base unmoved and its length unchanged."
domains = ["campaign", "extras", "workshop"]
failure_cap = "broken"
validation = { script = "simulation/rotate-ccw-turns-the-part.test.ts", outputs = [ { id = "turn", name = "An arm turning one step counterclockwise", kind = "replay" } ] }
[[review.categories.items]]
id = "rotate-cw-carries-the-constellation"
title = "rotate-cw turns the held constellation about the same base"
