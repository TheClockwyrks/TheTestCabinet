# --- Produced Assets ----------------------------------------------------------
# The production contract of specs/assets.md, row by row: every produced file at
# its named path, at the canvas the contract fixes, decoding to paint or to sound,
# distinct from its siblings, and bound to the thing that plays it. Then the build
# itself: every file decoded before the first frame, no generation tool at build
# time, every asset URL resolved against the page, and a game that survives a file
# it cannot load. Where each file is PAINTED, and how the sky drawn in code around
# it reads, is graded under Presentation; when a cue is asked for, under Audio.
[[review.categories]]
id = "assets"
title = "Produced Assets"
