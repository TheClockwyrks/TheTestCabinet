# --- Showcase -----------------------------------------------------------------
# The presentation the finished build ships beside its source: `specs/showcase.md`
# asks for a `showcase/` directory holding a description, a carousel, and the
# media the two name. ONE point, and it asks only whether that showcase EXISTS —
# the two files, and one carousel entry naming a file that is actually there. Not
# a dimension, not a byte of a picture, not a word of the prose, and no other item
# anywhere above says anything about the media.
#
# It is worth `weight = 3` rather than the ordinary one, because what is missing
# when it fails is a whole deliverable rather than one behavior of the game.
# Whether the description reads like something a player would want to play, and
# whether the carousel opens on the strongest view of live play, is the reviewer's
# judgement and reaches the run through the `presentation` domain's aesthetic
# rating.
#
# The check drives nothing: it reads the produced tree with `node:fs`, so the one
# suite stands unchanged in all three projects and the point means the same thing
# whichever engine the run selected. There is no `engines` here for that reason.
# What it hands back is a `.png` copied out of the build's own showcase, so the
# picture the build chose to present its game with stands beside the verdict.
[[review.categories]]
id = "showcase"
title = "Showcase"
[[review.categories.items]]
id = "exists"
title = "The game ships its showcase"
description = "showcase/showcase.md and showcase/showcase.toml are present at the root of the produced repository, and at least one file the carousel names is present in showcase/."
weight = 3
domains = ["presentation"]
failure_cap = "great"
validation = { script = "showcase/exists.test.ts", outputs = [ { id = "carousel", name = "A screenshot from the build's showcase", kind = "image" } ] }
