# --- Sigils, rises and sets ---------------------------------------------------
# Every footprint, condition and effect the engraved sigils carry, and the two
# that are not transformations: the rise that delivers a reagent and the set that
# receives a product. One item per observable behavior, so a sigil that binds but
# does not merge, or a set that consumes without tallying, fails by name. Each
# condition a sigil states is its own item in the direction that refuses, since a
# build that honors unbonded and not unheld must score differently from one that
# honors neither. Every item is posed through specs/instrumentation.md: a custom
# challenge is loaded, the machine cleared, completion switched off, the run
# started and its motes cleared, and then the one sigil and the motes the item is
# about are placed by hand and one cycle is advanced onto the boundary.

[[review.categories]]
id = "sigils"
title = "Sigils, Rises and Sets"
[[review.categories.items]]
id = "unsatisfied-condition-waits"
title = "An unsatisfied sigil waits"
description = "A sigil whose condition does not hold at a boundary waits: no fault is raised and sim.status stays running, so a machine carrying an idle sigil keeps cycling."
domains = ["workshop"]
failure_cap = "broken"
validation = { script = "sigils/unsatisfied-condition-waits.test.ts", outputs = [ { id = "idle", name = "The idle sigil's boundary", kind = "image" } ] }
[[review.categories.items]]
id = "acts-at-every-boundary"
title = "A sigil acts at every boundary its condition holds at"
