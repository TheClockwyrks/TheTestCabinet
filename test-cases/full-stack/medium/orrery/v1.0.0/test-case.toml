# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "orrery"

# Human-readable display name for this test case.
name = "Orrery"

# The test type. Orrery is FULL-STACK: the build writes the game AND produces the
# art and sound it ships, during the run, rather than being handed a pre-drawn
# asset set. The type, with `asset_dimension` left at its `2d` default, schedules
# the run onto the `test-cabinet-full-stack-2d` image, which carries six binaries
# on `PATH` — `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`, `sfx-sample`, and
# `music` — and no others; `specs/assets.md` is the production contract that says
# what each one produces, where the file lands, and the bar it is held to. A root
# identity field, so it sits above the first table.
type = "full-stack"

# Relative difficulty of this case, surfaced on the site. Orrery is both a great
# deal of work AND genuinely demanding to reason about, which is what separates it
# from an easy case like Kessler: simultaneous rigid motion with a sampled sweep
# collision rule, a multi-hold consistency rule, an ordered sigil pipeline with
# consuming and producing footprints, exact constellation matching (repeating
# products included), two editor macros computed from an arm's own pose history,
# and a direct-manipulation editor with drags, tapes, focus routing, and undo. On
# top of the mechanics the build designs its own campaign and must actually SOLVE
# every challenge it ships, the fixed Extras included, because every challenge
# carries a reference solution the debug surface exposes. The produced-asset pass
# — fifty-seven stills and sheet frames, three particle systems, six cues and a
# seamless bed — is what the runtime budget below accounts for, not the
# difficulty. Hard is reserved for cases stacking real-time systems on top of this
# kind of rule load, so medium.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["puzzle", "logic", "2d", "automation"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A machine-building puzzle of brass arms and celestial motes on a hex field: \
engrave sigils, write looping tapes, and deliver constellations cheaply, \
quickly, and compactly — without letting two motes collide. The build draws \
its own sky and sounds its own brass with the asset tools on its PATH."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected engine) and handed to the model as
# the build instruction. It injects absolute in-container paths through template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Orrery carries two loads at once. The code is a simulation
# with simultaneous motion, sampled collision, and an ordered sigil pipeline; a
# full direct-manipulation editor with tapes, macros, and undo; a course of the
# build's own challenges; and a reference solution for every challenge shipped,
# which means actually solving the ten Extras and the build's own campaign. On top
# of it sits a production pass that must draw, sequence and mix the whole asset
# set `specs/assets.md` fixes before a frame can be composed. Eight hours is what
# the two together ask for, and is comfortably more than a healthy build of that
# size needs while still catching a session that never terminates.
max_runtime_hours = 8

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, the
# `@test-cabinet/particle-runtime` the produced particle systems are played
# through, and, on an engine run, the vendored engine — and downloads the
# Playwright Chromium build (the base image ships the OS libraries Chromium links
# against, but not the browser binary), so the model can build the game and look
# at it in a browser without any further setup. It is `npm install` and NOT
# `npm ci`: the `file:` dependencies are injected at seed time, and this is where
# the lockfile is completed, while `[build].install` stays `npm ci`.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the
# whole point of a full-stack case: the model PRODUCES the game's art, animation,
# and audio itself, during the run, with the six binaries on the run image's
# `PATH` (see `type` above and `specs/assets.md`). Nothing pictorial is seeded, and
# no rendered mockup is shown to the model or to the reviewer: every piece of
# evidence a reviewer sees is captured from the build itself.

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and
# every seeded workspace `package.json` depends on it via its baked-in `file:` path,
# so the build imports it (its `./canvas` binding) like any other dependency and
# plays each produced `system.json` by simulating it live. Orrery's three effects —
# the delivery burst at a set, the fault at the mote or part that stopped the run,
# and the completion burst — are all produced `particle-2d` systems played this way;
# `specs/assets.md` is the consumption contract. It is declared for every engine:
# no engine supplies particles, and each hands the game a 2D drawing context to play
# a produced system through. (A root key, so it must sit above the first `[table]`
# header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Orrery declares exactly ONE, so every run of this case is the same game.
#
# Campaign and Extras are NOT variants. They are the two ways to play, chosen by
# the player from the title menu and reported by the state as `mode`, exactly as
# Refract's Campaign and Cascade are modes inside its single variant. Both modes
# ship in every build, so nothing in the seeded spec set branches on the variant
# at all — the only axis the specs branch on is `engine.slug`, which changes what
# the build is handed rather than what it is asked to make.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the input
# actions a player drives it with, the audio bus, asset loading, and the on-screen
# diagnostics; one of them also owns rendering and the gameplay framework the game
# is written inside. It is a *run dimension*, chosen per run alongside the model,
# the harness, and the variant, and recorded on the run; it is not a property of
# the game.
#
# Orrery supports three, and the game is the same machine-building puzzle under all
# of them — the cycle, the sampled collision rule and the sigil pipeline are
# simulation-owned on EVERY engine, so no engine collider or engine tween stands in
# for the rules `specs/simulation.md` fixes. What differs is how much of the build
# is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the frame loop, the canvas fit, the keyboard and pointer
#                     input, the audio, the overlay and the `window.__orrery`
#                     surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the entry module
#                     around it (`src/constants.ts` and `src/main.ts`, plus the
#                     `src/game.ts` the build writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds the same
#                     entry module; the build writes its game module — the game
#                     definition, its mode, its state and its actors — and the debug
#                     surface its instance's `initialize` returns.
# What does NOT differ is the asset-production pass. Every engine run still produces
# the sprites, the sheets, the particle systems and the audio with the on-`PATH`
# binaries, because no engine supplies art or sound; `specs/assets.md` is the same
# contract under all three.
#
# `none` supplies no package and therefore carries no version, so it is named in the
# bare `engines` list; `simple-2d` and `structured-2d` each carry a range and are
# named in `[[engine]]` tables. `min_version` is the 1.0.0 contract the specs are
# written against, and there is deliberately no `max_version`, so a later 1.x or 2.x
# from the host package store is accepted as it lands. Widening or moving a range
# means a new case version, so the pin is the statement that THIS spec set matches
# THIS contract.
#
# This declaration deliberately does not describe an engine. An engine ships its own
# documentation from its own package and seeding puts it in the run for the model to
# read, so the specs seeded from this folder never restate an engine's API. Where a
# spec speaks of the runtime it states only what is specific to *this game* under it —
# which surfaces the build still supplies, Orrery's action list, and Orrery's cue
# names.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite, TypeScript, ESLint, Prettier and Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the stage canvas, the `@test-cabinet/particle-runtime` dependency
# `packages` injects, and the project-local `playwright` dependency the model
# drives the built game through. What differs is how much of the build is supplied
# with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     keyboard and pointer input, audio, diagnostics overlay and
#                     `window.__orrery` surface, and every figure this
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the two case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes —
#                     the stage and hex geometry, the part roster and its costs,
#                     the instruction set, the collision and targeting radii, the
#                     speeds, the screen copy, the action bindings, the cue names,
#                     and the paths the produced files land at; the look is NOT
#                     among them) and `src/main.ts` (the browser entry). The build
#                     writes `src/game.ts`: the state, the debug surface its
#                     `initialize` returns beside that state, and the game's update
#                     and render.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules. The build writes
#                     `src/game.ts`: the game definition the engine drives — its
#                     mode, its live state, and its actors — and the debug surface
#                     its instance's `initialize` returns.
#
# Under both engines the seeded `src/game.ts` is a stub written against types the
# build has yet to declare, so a freshly seeded workspace does not type-check: that
# failing typecheck is the starting point rather than a broken seed.
#
# This table must name EXACTLY the engines the case supports; the resolver checks
# both directions. The seeded files land at the run root
# (`workspaces/none/package.json` seeds to `package.json`). There is one starter
# project per engine and no per-variant set: the single `base` variant declares no
# `[workspaces]` override of its own.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# The audio packs this case's run container is staged with — the palette `sfx-sample`
# and `music` may reach. A tool config that names no pack plays the first pack of that
# kind.
#
# The field is brass under a celestial fiction, so `combat-core` is the sample pack
# behind `place`, `erase`, `start`, `halt`, `constellation` and `complete`, in its
# mechanical impacts and clicks. The bed runs under the machine as it solves and is
# specified as a clean loop at least thirty seconds long (`specs/assets.md`), which
# `cinematic`'s sustained strings and low brass hold without putting a melody over the
# arms. `gm-lite` would make an orrery a parlour piece and `synthwave` would make it
# neon, and Orrery is neither, so neither is staged.
[audio]
packs = ["combat-core@0.1.0", "cinematic@0.1.0"]

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`,
# `build/`, or `out/`. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. Both commands are required; there are no defaults, so every case states
# exactly how its implementation is built. The build must be self-contained: it
# bundles the committed produced assets without invoking the asset tools, which
# are on `PATH` only while the run is live (`specs/assets.md`).
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. A full-stack build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is what every review item's validator suite below
# poses its scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__orrery` once the game has initialized, so
# the handle is what a person opening the console of such a build finds. An engine
# run has NO global at all: the build writes the surface, its `initialize` returns
# it — beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view,
# that surface is written in the shape of `update` — a pose takes the current
# state and returns the next, applied through `engine.apply`, and a reading takes
# the state and returns what it read, called with `engine.state`. One handle,
# three ways to reach the same operations.
#
# There is deliberately no `tick_hz`. Orrery's simulation unit is the cycle, but
# cycles advance at a player-chosen SPEEDS rate integrated against the delta time
# the frame hands the game, so there is no fixed case-wide ticks-per-second to
# state. The key is optional precisely so a case clocked this way omits it.
[instrumentation]
handle = "__orrery"

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. The single variant declares
# none of its own: there is one game here, so there is one spec set.
#
# The specification is decomposed by concern, and each file is self-contained
# enough to be read on its own while naming its siblings where a fact lives
# elsewhere: `overview.md` the game and the project it is built in, `field.md` the
# hex geometry and the mote roster, `parts.md` the mechanisms and placement,
# `sigils.md` every sigil's footprint and effect, `instructions.md` the tapes and
# the two macros, `simulation.md` the cycle, motion, collision, faults, and
# metrics, `controls.md` the input, `editor.md` the machine editor,
# `formats.md` the challenge and solution documents, `challenges.md` the ten
# fixed Extras, `state.md` the game's state, `instrumentation.md` the debug
# surface, `ui.md` the screens and audio, `assets.md` the art and sound the build
# produces, `modes/campaign.md` and `modes/extras.md` the two ways to play, and
# `showcase.md` the presentation the finished game ships beside its source.
#
# The two mode files are common specs like any other. Both modes ship in every
# build and both are reachable from the title menu, so both files are seeded into
# every run and each names the other where the game genuinely crosses between them.
#
# Every `.hbs` source is rendered before it lands, and ONE axis is branched on:
# `engine.slug`, which selects what the build is handed and what it must write.
# `overview.md.hbs` (the runtime, what is implemented, where the figures come
# from), `controls.md.hbs` (where the pointer layer sits), `state.md.hbs` (the
# build's own shape versus the exact `OrreryState` declaration),
# `instrumentation.md.hbs` (the global versus `engine.debug`, and the clock
# operations only an engineless build needs), `ui.md.hbs` (where cues are played),
# `assets.md.hbs` (how files are loaded and how a particle system reaches the
# screen) and `showcase.md.hbs` (whether motion is recorded as a clip or as a
# replay through the engine's recorder) all branch on it. Nothing branches on the
# variant. A spec's `dest` defaults to its `source` with a trailing `.hbs`
# stripped, so an `.md.hbs` source seeds to the same `.md` path and a plain `.md`
# source is seeded verbatim.
[[spec]]
source = "specs/overview.md.hbs"

# The field: the axial hex geometry, the rotation formulas every moving part uses,
# the pointer targeting rule, the full mote roster with the planetary ladder, and
# filaments. Seeded verbatim: nothing in it differs by engine.
[[spec]]
source = "specs/field.md"

# The mechanisms: the five arm variants and their spokes, the zodiac wheel and its
# fixture ring, track and mounting, rises and sets as placeable parts, the
# placement rules, and the cost table. Seeded verbatim: nothing in it differs by
# engine.
[[spec]]
source = "specs/parts.md"

# Every sigil's footprint, condition, and effect, rises and sets included, with
# the exact terms (unbonded, unheld, vacant) the conditions are stated in. Seeded
# verbatim: nothing in it differs by engine.
[[spec]]
source = "specs/sigils.md"

# The instruction set, tapes and the shared period, and the `reset` and `repeat`
# editor macros with their exact expansions. Seeded verbatim: nothing in it
# differs by engine.
[[spec]]
source = "specs/instructions.md"

# The heart of the case: the run lifecycle, the cycle order, motion and carrying,
# the torn rule, the sampled collision rule with its worked examples, every fault,
# the sigil phase order, completion, and the three metrics.
[[spec]]
source = "specs/simulation.md"

# How a player operates the game: where the pointer comes from, the focus rule,
# and the full action and binding tables. It branches on the engine only to say
# which layer delivers the pointer.
[[spec]]
source = "specs/controls.md.hbs"

# The machine editor: the five stage regions and their fixed geometry, the tray,
# selection, drags and ghosts, laying track, the tape panel and its scroll rules,
# undo and redo, the run controls, and per-challenge machine stashes.
[[spec]]
source = "specs/editor.md"

# The two JSON documents the game speaks — challenges and solutions — used by the
# fixed Extras, the build's own campaign data, and the debug surface.
[[spec]]
source = "specs/formats.md"

# The ten fixed Extras challenges, in the challenge format. It is authoritative
# for every one of them, so it is seeded verbatim and the build transcribes it
# exactly.
[[spec]]
source = "specs/challenges.md"

# The shape of the game's state. Under an engine this is the `OrreryState`
# declaration the build writes into `src/game.ts` verbatim, stated by the case
# rather than by the seeded stub. Under `none` the build owns the shape and the
# file lists only what the state must carry, because the rest of the specification
# is written against those facts.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# render-free core; an API to drive and inspect the game from code through its own
# real input path; and a read-only debug overlay. Framed as an ordinary developer
# affordance of the game. It branches on the engine for how the surface is reached
# and for the clock operations only an engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The screens, the solved panel and the fault display, menu navigation, and the
# seven audio cues.
[[spec]]
source = "specs/ui.md.hbs"

# The assets this build produces: what to make, which tool on the `PATH` makes it,
# where the file lands under `assets/`, how the build wires it in, and the bar each
# is held to. It branches on the engine for how files are loaded and how a particle
# system reaches the screen. This is the defining spec of a full-stack case.
[[spec]]
source = "specs/assets.md.hbs"

# Campaign: the course the build designs itself — count bounds, solvability with
# shipped reference solutions, whole-vocabulary coverage, the unlock rule, and its
# select screen.
[[spec]]
source = "specs/modes/campaign.md"

# Extras: the fixed ten-challenge shelf, open from the start, with records.
[[spec]]
source = "specs/modes/extras.md"

# The showcase the finished build ships beside its source: a `showcase/` directory
# holding a player-facing description and a short carousel of media captured from
# the game as it plays. It branches on the engine, because an engineless build
# records motion as a `.webm` clip while an engine run records it as a replay
# through the engine's recorder. It carries exactly one graded point, the
# `showcase` category at the end of the checklist below, and that point asks only
# whether the showcase is THERE. What it says and how well it presents the game
# are the reviewer's, read off the run's Play page.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`.
#
# Orrery fixes no palette, no font, no rendered artwork and no background: the look
# of the sky and the machine is the build's own design, drawn and sounded with the
# tools on its `PATH` under the contract `specs/assets.md` sets. A reference view is
# a picture a build is compared AGAINST, so there is no honest one to seed here —
# every build is expected to look different, and a screenshot diff would score the
# build that copied a mockup best rather than the build that designed the best sky.
# What the specification does fix about appearance is the canvas each produced file
# is drawn at, where it is painted, and the legibility a player depends on (mote
# classes told apart, an arm's grip visible, a sigil's footprint readable, the
# tape's glyphs distinguishable), all of which the checklist below decides from the
# built game and the committed files.
#
# `[[proof]]` is likewise empty: nothing is asked of the build beyond the game
# itself, the assets it ships, and the showcase it presents them with, all of
# which are read from the produced tree rather than declared as a proof. The
# automated load check still runs.

# Scoring domains. A run is rated on each independently, and the run's overall
# rating is the WORST across them — an immaculate Extras shelf cannot mask a
# campaign of unsolvable challenges, and neither can mask crude, un-produced art
# or silence. Every case must declare at least one. Each review item below names
# the domains its failure lowers and how far, through `domains` and `failure_cap`;
# the reviewer's judgement lives in the separate AESTHETIC rating of each domain,
# which is the look, the polish and the feel.
#
# One domain per mode, because a build can plausibly get one right and the other
# wrong, plus the two things that cut across both: the workshop feel the whole
# game is operated through, and the presentation this case hands entirely to the
# build.
[[domain]]
id = "campaign"
name = "Campaign"
description = "The course the build designed: whether its challenges teach the machine one idea at a time, grow in difficulty, and end somewhere worth reaching."

[[domain]]
id = "extras"
name = "Extras"
description = "The fixed shelf: whether the ten challenges play exactly as specified and reward returning for better records."

[[domain]]
id = "workshop"
name = "Workshop"
description = "How building and running feels: moving between the game's screens, placing and dragging parts, laying track, writing tapes, and watching a machine run, fault, and complete."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "Everything a player sees and hears. The produced assets first: the fifteen mote sprites and the two filament strips, the twelve sigil glyphs and the ten instruction glyphs, the arm and piston hubs, the two grippers, the wheel hub and fixture mount, the rise and set aperture sheets, the delivery, fault and completion particle systems, and the six produced cues and the seamless music bed the game plays. Then the sky, the hex field, the arms' shafts and spokes, the track, the tray, the tape panel, and the screens the build draws in code around them."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY, a bare name grouping the points a reviewer
# grades, and each `[[review.categories.items]]` under it is one graded review
# item, worth one point unless it declares a `weight`, and there is no fractional
# scoring. One item declares one: `showcase.exists` is worth three, because what is
# missing when it fails is a whole deliverable rather than one behavior of the
# game. Every other item rides the default, so every other category is worth the
# number of items it holds. A category carries no prose of its own; each review
# item states in `description` the claim checked against the build, and its
# verdict is recorded under the composite id
# `<category id>.<item id>`. The checklist is reporter-side material, never seeded
# into a run, so the model never sees it; each item restates a requirement the
# seeded specification already states, in the spec's own vocabulary and naming the
# spec's own constants.
#
# EVERY ITEM CARRIES A `validation` SCRIPT. Each item declares its
# `validation/<engine>/<category>/<item id>.test.ts` suite — one Vitest project per
# engine, the same relative path under each: `validation/none/` drives the built
# game in Chromium through `window.__orrery`, and `validation/simple-2d/` and
# `validation/structured-2d/` run in process against the vendored engine, reaching
# the same operations off `engine.debug`. Almost every scenario has the same shape:
# load a small challenge, clear the machine, switch completion off, start the run,
# clear the motes, place by hand exactly the parts and motes the point is about,
# advance the clock, and read the verdict back off the snapshot. The checklist was
# authored first so the suites are written TO these claims rather than the claims
# drifting to fit what a suite happened to check.
#
# SEVEN ITEMS NARROW THEIR VALIDATION WITH `engines`, and every one of them names
# `["none"]`. They are the four debug-overlay points and the three stage-fit
# points: `specs/instrumentation.md` and `specs/overview.md` hand drawing and
# toggling the overlay, and fitting the stage to the window, to the runtime, and
# under an engine that runtime is the engine rather than anything the build wrote.
# A scoped item's suite ships only in the projects of the engines it names, so
# those seven files sit in `validation/none/` alone; every other suite stands in all
# three. `showcase/exists.test.ts` is the one suite that drives nothing at all — it
# reads the produced tree with `node:fs` and so covers every engine unchanged.
#
# EVERY item carries `domains` and `failure_cap`. `domains` names the scoring
# domains a failure lowers: a rule of the machine lowers `workshop`, a rule of a
# course lowers that mode, an item about what is drawn, produced or heard lowers
# `presentation`, and the surface every other item is driven through lowers the
# domains the points it carries would. `failure_cap` is the highest functional
# rating those domains may reach while the item fails; each domain takes the LOWEST
# cap among its failing items, and a domain with no failing item is flawless. The
# caps are graded by how much of the game a failure takes away: `broken` where the
# game cannot be played as intended (no debug surface, a machine that cannot be
# built, a run that cannot be started, a cycle that never advances, a build that
# shells out to an asset tool); `scuffed` where a rule the game is built on is
# noticeably wrong (a motion row, a sigil effect, a fault that never fires, a
# produced file that is missing entirely); `passable` where the fault is a
# tolerance, an edge case, a ceiling or a secondary path (a duplicated sprite, an
# off-spec canvas); and `great` where it is a cosmetic or authoring detail. No item
# caps at `flawless`: a failure always costs something.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug and automation surface every other category is driven through: that
# it is present and live, that each operation poses exactly the one thing its row
# names, that the snapshot reports the whole documented shape, that an illegal
# argument fails loudly, and that the core underneath is deterministic. An
# operation that cannot be driven fails its own point here as well as leaving the
# point it was meant to reach undecided.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug and automation surface is present"
description = "Every operation specs/instrumentation.md names is present as a function on the surface — window.__orrery in an engineless build, the surface initialize returns and engine.debug hands back in an engine build, with setAutoStep and advance under none alone — and each accepts the arguments its row names."
domains = ["campaign", "extras", "workshop"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [ { id = "surface", name = "The surface on a running game", kind = "image" } ] }
[[review.categories.items]]
id = "surface-drives-the-running-game"
