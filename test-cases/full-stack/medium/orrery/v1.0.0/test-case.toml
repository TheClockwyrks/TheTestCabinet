domains = ["campaign", "extras", "workshop"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-drives-the-running-game.test.ts", outputs = [ { id = "driven", name = "The posed part and mote on the drawn field", kind = "image" } ] }
[[review.categories.items]]
