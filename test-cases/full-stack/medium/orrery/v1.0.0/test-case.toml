# what a fault names. The faults an instruction a part cannot execute raises are
# graded under Instructions and tapes. Every scenario is posed through the
# surface of specs/instrumentation.md: a small loaded challenge, `clearMachine`,
# `setCompletion(false)`, `startRun`, `clearMotes`, then the one or two parts and
# the motes the requirement is about, `setGrip` for a hold with no `grab` ever
# running, and the clock advanced one cycle. Each item reads its verdict from
# `sim.status`, `sim.fault` and `sim.fraction`.
[[review.categories]]
id = "collision"
title = "Collision and faults"
[[review.categories.items]]
id = "freeze-at-first-sample"
title = "The fault is raised at the first sample within 38"
description = "The samples are evaluated in order from t = 1/8, so a faulting run freezes at the first sample within 38 even when a later sample is nearer: example A of specs/simulation.md is first within at 36.10 at t = 3/8 and nearest at 35.14 at t = 4/8, and the run stops at t = 3/8."
domains = ["workshop"]
failure_cap = "passable"
validation = { script = "collision/freeze-at-first-sample.test.ts", outputs = [
  { id = "frozen", name = "The machine frozen at the first violating sample", kind = "image" },
] }
