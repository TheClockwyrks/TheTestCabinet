# --- Campaign -----------------------------------------------------------------
# The course the build designs itself: what the shipped challenge data must be,
# what every challenge owes, how the ladder opens, and what a completed run
# leaves behind. The data requirements are checkable because openChallenge opens
# a locked row like any other and referenceSolution hands back the build's own
# solution for every challenge, so a validator reads the whole course without
# solving anything, then replays each solution to a checked outcome.
[[review.categories]]
id = "campaign"
title = "Campaign"
# The course as shipped data, against specs/modes/campaign.md's bounds and
# specs/formats.md's challenge format. One rule of the format per item, because a
# course can be well formed in every way but one.
[[review.categories.items]]
id = "course-within-bounds"
title = "The course holds between eight and sixteen challenges"
description = "campaign.count is at least CAMPAIGN_MIN (8) and at most CAMPAIGN_MAX (16)."
domains = ["campaign"]
failure_cap = "scuffed"
validation = { script = "campaign/course-within-bounds.test.ts", outputs = [ { id = "select", name = "The campaign select screen listing the whole course", kind = "image" } ] }
[[review.categories.items]]
