# --- Extras -------------------------------------------------------------------
# The fixed shelf of specs/modes/extras.md and the ten challenges
# specs/challenges.md gives verbatim: that each one is built as written, that the
# build's own reference solution for each one really completes it, that nothing
# on the shelf locks, and that solved state and the three records behave per
# challenge for the session. The shelf is the one place where the whole course is
# fixed by the specification rather than chosen by the build, so each of the ten
# challenges is transcribed exactly and each of the build's ten reference
# solutions must really finish its own. The select screen's shared menu mechanics
# and the solved panel are graded under Screens.
[[review.categories]]
id = "extras"
title = "Extras"
