# The stage, its text, and the two panels drawn over a run.
#
# The three fit points below are scoped to `none`. `specs/overview.md` gives the
# fit — the uniform scale that preserves the aspect ratio, the letterboxed
# centering, and the device pixel ratio — to the runtime, and under an engine that
# runtime is the engine: the seeded `src/main.ts` hands it the 1280 x 720 stage
# and is marked not to be edited, and the seeded `index.html` sizes the canvas by
# CSS alone. Under `none` the runtime is the layer the build writes, so that is
# where these three are decided. The bars' color below stays unscoped, because
# `BACKGROUND` is the build's own under every engine.
