[[review.categories.items]]
id = "snapshot-changes-nothing"
title = "Taking a snapshot changes nothing"
description = "snapshot is a reading: taking one leaves every field of the game as it was, so a scenario may read as often as it likes without disturbing what it is measuring."
domains = ["construction"]
failure_cap = "great"
validation = { script = "instrumentation/snapshot-changes-nothing.test.ts", outputs = [
  { id = "snapshot-is-a-reading", name = "The run fifty-two readings left", kind = "image" },
] }

