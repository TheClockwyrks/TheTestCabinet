# openSite(0) (par cost 2400, time 18, budget 3000), clearObstacles, pose a
# ready crane whose cost lands between 2400 and 3000, and add a tape whose
# one move step drives an axis at a low enough rate that the run lasts longer
# than 18 seconds. startRun, setLoadPhase(0, "placed"), then advance until
# run.phase leaves "running". — run.phase reads "cleared" with run.time above
# 18 and the crane's cost above 2400, and cleared[0] reads true: neither par
# figure refuses the clear.
# From specs/sites.md, the preamble on par figures.
[[review.categories.items]]
id = "par-gates-nothing"
title = "A clear that misses par is still a clear"
description = "The par cost and par time are targets shown beside a clear's score and gate nothing: a run that ends with every load placed clears the site, and records its clear, whether or not its cost and its time beat the site's par figures."
