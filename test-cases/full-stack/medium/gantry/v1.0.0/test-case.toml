[[review.categories.items]]
id = "cable-tension-formula"
title = "The cable's tension is the bob's mass times its acceleration less gravity"
description = "The cable's tension vector is T = m * (a - g) with m the bob's mass, so hanging at rest it is m * GRAVITY up the cable, and the force it puts on the structure is -T, the bob's weight straight down."
