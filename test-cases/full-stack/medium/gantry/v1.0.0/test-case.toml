domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/cable-snap-at-the-bound-passes.test.ts", outputs = [
  { id = "state", name = "A tension of exactly HOIST_CABLE_CAP does not snap", kind = "image" },
] }

# Clear the loads and the obstacles so nothing can attach, pose a crane,
