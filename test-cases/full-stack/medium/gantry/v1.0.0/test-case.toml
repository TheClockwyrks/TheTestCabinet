[[review.categories.items]]
id = "surface-is-live"
title = "A pose through the surface reaches the game"
description = "The surface is the game's own, not a stub beside it: a posed edit lands in the state the game holds and every reading reports it."
domains = ["construction"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-is-live.test.ts", outputs = [
  { id = "ring-posed", name = "The ring the pose put in the game's own state", kind = "image" },
] }

# Open site 0 through openSite(0) and reflect over the surface for each
