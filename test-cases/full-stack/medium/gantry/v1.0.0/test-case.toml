# setLoadPhase("attached") on a heavy load, or setBobVelocity — so that
# run.forces shows two or more members crossing 0.8 from below on that tick.
# Record the cues on it. — Exactly one creak sounds on that tick, however
# many members crossed.
# From specs/ui.md § Audio, the `creak` row: "at most one `creak` across the
# structure per `CREAK_COOLDOWN` (`0.5`) run-clock seconds".
[[review.categories.items]]
id = "creak-once-across-the-structure-on-a-tick"
title = "Two members crossing on one tick sound one creak"
description = "The creak gate is across the structure, not per member: a tick on which two or more members cross CREAK_THRESHOLD from below sounds the creak cue once."
domains = ["presentation", "simulation"]
failure_cap = "passable"
validation = { script = "audio/creak-once-across-the-structure-on-a-tick.test.ts", outputs = [
  { id = "together", name = "The tick two members crossed together", kind = "image" },
] }

# Drive a creak on a known tick, then bring a member across 0.8 from below on
# the tick 10 later, on the tick 30 later, and on the tick 40 later,
# recording the cues on each. — The tick at +10 is silent, a creak sounds at
# +30, and +40 is silent — a build that restarted the cooldown at the
# suppressed +10 crossing is silent at +30 and creaks at +40 instead.
# From specs/ui.md § Audio, the `creak` row: "a tick that has an eligible
# member but falls inside the cooldown plays nothing and starts no new
# cooldown: the first tick eligible again is CREAK_COOLDOWN * TICK_HZ (30)
# ticks after that one".
[[review.categories.items]]
id = "creak-inside-cooldown-starts-nothing"
title = "A tick inside the cooldown starts no new cooldown"
description = "A tick that has an eligible member but falls inside the cooldown plays nothing and starts no new cooldown, so the next creak still falls 30 ticks after the creak that did play, not 30 ticks after the crossing that was suppressed."
domains = ["presentation", "simulation"]
failure_cap = "passable"
validation = { script = "audio/creak-inside-cooldown-starts-nothing.test.ts", outputs = [
  { id = "cooldown", name = "The three crossings after the first creak", kind = "image" },
] }

# On an isolated site pose a crane and a tape whose swing carries members
# across 0.8 several times unaided, and run it twice from a fresh open: once
# at speed index 0 and once at index 2, advancing frame by frame and reading
# run.tick before and after each frame so every sound is bracketed by the
# ticks its frame covered. — The two runs sound the same number of creaks,
# and each creak of the speed-0 run falls inside the tick window of a frame
# the speed-2 run creaked on. A build whose cooldown counts seconds of wall
# clock creaks about four times as often at index 2.
