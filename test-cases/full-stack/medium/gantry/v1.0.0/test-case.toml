# whose track is a single rail member from (2, 8, 0) to (10, 8, 0), so the
# track origin is (2, 8, 0). Start a run and, with no command live,
# setAxis("trolley", 0), 3 and 8 in turn, advancing one tick after each and
# reading run.pivot. — run.pivot reads the track origin advanced along the
# track's direction by the trolley axis's value — (2, 8, 0), (5, 8, 0) and
# (10, 8, 0) — within 1e-6.
# From specs/rigging.md § The pivot and the bob.
[[review.categories.items]]
id = "pivot-follows-the-trolley-along-the-track"
title = "The pivot stands at the trolley's position along the rail track"
description = "The hoist cable hangs from the pivot, which is the trolley point: the point on the rail track at the trolley axis's distance from the track origin. Driving the trolley moves the pivot along the track by exactly that distance."
domains = ["simulation"]
failure_cap = "broken"
validation = { script = "rigging/pivot-follows-the-trolley-along-the-track.test.ts", outputs = [
  { id = "pivot", name = "The yard with the trolley part-way along the track", kind = "image" },
] }

# Clear the loads and the obstacles, pose a crane of struts and rails only
# with the trolley at the track origin so the cable force lands wholly on
# that node, and attach a load bringing the bob's mass to a known m. Read
# run.forces at rest; read it again on a tick where the bob was posed with a
# purely radial velocity u the constraint removes within that tick; and read
# it once more on the same crane carrying one counterweight
# (COUNTERWEIGHT_MASS, 80) on the track-origin node. — The member forces on
# the posed tick differ from the at-rest reading by exactly m * u / dt /
# (COUNTERWEIGHT_MASS * GRAVITY) times the change the counterweight makes, so
# the tension carried a = (v - v_prev) / dt and not a smoothed or analytic
# acceleration.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "bob-acceleration"
title = "The bob's acceleration is the change in its velocity over the tick"
description = "The bob's acceleration for the tick is a = (v - v_prev) / dt, with v_prev its velocity at the end of the previous tick, and it is that figure the tension carries."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/bob-acceleration.test.ts", outputs = [
  { id = "accel", name = "The tick the bob fell from the horizontal", kind = "image" },
] }

# Clear the loads and the obstacles, pose a crane, start a run and run a
# single hoist move from HOIST_START to 6 at HOIST_MAX_RATE, reading
# run.axes.hoist.value and the distance from run.pivot to run.bob.pos at
# every tick. — At every tick the distance equals that tick's own hoist value
# within 1e-6, never the tick before's — the two differ by up to
# HOIST_MAX_RATE * dt while the move runs.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "constraint-uses-the-ticks-cable-length"
title = "The constraint holds the bob at the tick's own cable length"
description = "The tick's cable length L is the hoist axis's value after that tick's axis motion, so a hoist move draws the bob in or lets it out by exactly the distance the axis moved on that tick."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/constraint-uses-the-ticks-cable-length.test.ts", outputs = [
  { id = "hoist", name = "The bob drawn in through a hoist move", kind = "image" },
] }

# Clear the loads and the obstacles, pose a crane whose pivot stands well
# above the ground, startRun, setBobVelocity(0, -1000, 0) — a purely radial
# velocity the constraint removes within the tick — and advance one tick.
# Then repeat, posing the same velocity after the run's first tick instead of
# on it. — The first tick leaves run.phase reading running, because a is zero
# on it; the identical pose on a later tick ends the run as cable-snap.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "first-tick-acceleration-zero"
title = "On a run's first tick the bob's acceleration is zero"
description = "On a run's first tick the acceleration is zero whatever velocity the pendulum steps leave, so the tension that tick is m * GRAVITY up the cable however sharply the pivot or the bob moved."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/first-tick-acceleration-zero.test.ts", outputs = [
  { id = "first", name = "The first tick absorbing the posed velocity", kind = "image" },
] }

# Pose a bob off the sphere with zero velocity, advance one tick and read
# run.bob.pos. — The bob stands on the ray from the pivot through its drifted
# position, at exactly L from the pivot.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-constraint-position"
title = "The constraint places the bob at the pivot plus L times the direction"
description = "Step 4 of the pendulum tick puts the bob back on the sphere: p = P + L * n, with P the tick's pivot and L the tick's cable length, so the cable is inextensible."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-constraint-position.test.ts", outputs = [
  { id = "state", name = "The driven state this point decides", kind = "image" },
] }

# Clear the loads and the obstacles, hold every axis still, and after the
# run's first tick setBob exactly at run.pivot and setBobVelocity(0, GRAVITY
# / TICK_HZ, 0), so step 1 cancels the velocity to zero and step 2 leaves p
# on the pivot. Advance one tick. — The bob comes to rest at the pivot minus
# (0, L, 0), with no NaN in any reported field.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-degenerate-direction"
title = "A bob coinciding with the pivot takes the direction straight down"
description = "Step 3 sets n = (p - P) / |p - P|, and if the drifted p coincides with P the direction is (0, -1, 0) instead of a division by zero."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-degenerate-direction.test.ts", outputs = [
  { id = "degenerate", name = "The bob resolved from the pivot itself", kind = "image" },
] }

# Pose a bob with a known horizontal velocity under a still pivot, advance
# one tick and read the bob's position. — The position is the drifted point
# projected onto the constraint sphere, matching the steps applied in that
# order within 1e-6.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-drift-step"
title = "The pendulum drifts the position by the velocity before constraining"
description = "Step 2 is p = p + v * dt, taken before the constraint direction is read, so the direction n is read off the drifted position."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-drift-step.test.ts", outputs = [
  { id = "state", name = "The driven state this point decides", kind = "image" },
] }

# Clear the loads and the obstacles, pose a crane, start a run whose first
# tape step drives the trolley, advance exactly one tick and read run.pivot
# and run.bob.vel. — The velocity carries a pivot velocity taken against the
# run-start pivot — the trolley at 0 and the slew at 0 — matching the closed
# form; a build that seeded P_prev with the tick's own pivot leaves vP zero
# on that tick.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-first-tick-pivot-prev"
title = "On a run's first tick P_prev is the run-start pivot"
description = "On a run's first tick the previous pivot position is the pivot at the run's starting posture, so a first tick that moves the pivot still carries a pivot velocity."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-first-tick-pivot-prev.test.ts", outputs = [
  { id = "first", name = "The first tick with the trolley already driving", kind = "image" },
] }

# Clear the loads and the obstacles, hold every axis still, and after the
# run's first tick pose the bob at rest on the constraint sphere with the
# cable horizontal — the pivot plus (L, 0, 0). Advance one tick and read
# run.bob.vel and run.bob.pos. — Both match the closed form of the seven
# steps within 1e-9, whose only source of motion is the -GRAVITY * dt term on
# y; a build that skips step 1 leaves the bob exactly where it was posed, at
# rest.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-gravity-step"
title = "The pendulum tick begins by applying gravity to the velocity"
description = "Step 1 of the pendulum tick is v = v + g * dt with g = (0, -GRAVITY, 0) and dt = 1 / TICK_HZ, which is the only thing that sets a hanging bob swinging."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-gravity-step.test.ts", outputs = [
  { id = "fall", name = "The bob starting to fall from the horizontal", kind = "image" },
] }

# Clear the loads and the obstacles and run the same posed crane twice past
# the run's first tick, once with every axis still and once with the trolley
# cruising at a constant known rate, posing the same bob position and
# velocity in each and advancing one tick. — Both ticks match the closed form
# of the seven steps within 1e-9, and the difference between the two
# velocities is exactly the pivot's displacement over dt on the cruising run.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-pivot-velocity"
title = "The constraint takes the pivot's own velocity from the tick's motion"
description = "Step 5 is vP = (P - P_prev) / dt: the pivot's velocity for the tick is its displacement over that tick divided by dt, so a still pivot contributes nothing and a moving one contributes exactly its displacement over dt."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-pivot-velocity.test.ts", outputs = [
  { id = "carry", name = "The bob carried by the cruising trolley", kind = "image" },
] }

# Pose a bob on the sphere with a velocity purely along the cable, advance
# one tick and read the velocity. — The bob's velocity relative to the pivot
# has no component along the cable direction, within 1e-6.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-radial-velocity-removed"
title = "The radial part of the relative velocity is removed"
description = "Step 6 takes vr = v - vP and removes the radial part, vr = vr - dot(vr, n) * n, so the bob's velocity relative to the pivot is tangential."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-radial-velocity-removed.test.ts", outputs = [
  { id = "state", name = "The driven state this point decides", kind = "image" },
] }

# Pose a run whose pivot is moving and whose bob is swinging, advance a tick
# and read the bob's velocity. — The velocity equals the pivot velocity plus
# the constrained, damped relative velocity, within 1e-6.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-recompose"
title = "The bob's velocity is the pivot's plus the damped relative velocity"
description = "Step 7 of the pendulum tick recomposes the velocity from the pivot's own and the constrained relative part, v = vP + vr, so the bob carries the pivot's motion with it."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-recompose.test.ts", outputs = [
  { id = "carry", name = "The bob carried by the cruising trolley", kind = "image" },
] }

# Clear the loads and the obstacles, hold every axis still so the pivot does
# not move, and after the run's first tick pose the bob on the constraint
# sphere off the vertical with a known tangential velocity. Advance one tick
# and read run.bob.vel. — The velocity the tick leaves equals the vector
# steps 1 to 6 give before damping, multiplied by exactly (1 - SWING_DAMPING
# * dt), within 1e-9; an undamped build leaves the vector undamped and a
# build damping the whole velocity rather than the relative one differs
# again.
# From specs/rigging.md § The pendulum tick.
[[review.categories.items]]
id = "pendulum-swing-damping"
title = "The swing is damped by SWING_DAMPING each tick"
description = "Step 6 damps the relative velocity by the factor (1 - SWING_DAMPING * dt), with SWING_DAMPING 0.05, after the radial part has been removed and before the recomposition."
domains = ["simulation"]
failure_cap = "passable"
validation = { script = "rigging/pendulum-swing-damping.test.ts", outputs = [
  { id = "swing", name = "The damped swing over the tick read", kind = "image" },
] }

# Clear the loads and the obstacles, pose a crane of struts and rails with
# the trolley at the track origin, and read run.forces at rest three ways:
# with the bare hook; with a load of mass 75 attached; and with the bare hook
