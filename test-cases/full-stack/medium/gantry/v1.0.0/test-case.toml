# On site index 0 (First Lift), clearStructure and build the reference rig: a
# fully braced box tower from the four anchors to the ring's bottom flange at
# (0,4,0) (a vertical leg under each bottom-flange node, the four
# bottom-flange horizontals plus one horizontal diagonal, and inclined anchor
# braces at two of the four corners, so the two remaining corners carry a
# vertical leg and horizontal members only), and a triangulated jib on the
# top flange carrying the rails (2,6,0)-(4,6,0), (4,6,0)-(6,6,0),
# (6,6,0)-(8,6,0), each outboard rail node hung from a mast head at (2,10,0)
# by one cable and braced sideways by one horizontal member back to (2,6,2).
# check reports issues [] and stable true., whose bottom-flange horizontals
# are struts of length 2, loaded so some of them carry compression. Read
# check and structure.members. — Each length-2 strut in compression reports
# utilization equal to minus its force divided by 2400, within 1e-9 - not
# divided by 2400 * (4/2)^2 = 9600.
# From specs/structure.md § Members.
[[review.categories.items]]
id = "buckling-not-applied-below-the-reference"
title = "A strut shorter than BUCKLE_REF gets no buckling bonus"
description = "The reduction is min(1, (BUCKLE_REF / L)^2), so a strut shorter than BUCKLE_REF (4) is utilized against exactly its compression capacity, 2400, and not against an enlarged one."
