id = "produced-music"
title = "The music bed is produced"
description = "The title and select screens carry a music-tool bed that suits a machine yard, with its .mid committed beside the .wav."

# --- Screens and audio -----------------------------------------------------------
[[review.categories]]
id = "screens"
title = "Screens and audio"
[[review.categories.items]]
id = "title-screen"
title = "The title screen"
description = "The game opens on TITLE_TEXT (GANTRY), TAGLINE_TEXT (RIG THE CRANE. RUN THE TAPE.), and TITLE_ITEMS (SITES, HOW TO PLAY) with menuIndex 0, navigated and confirmed by the registered actions with wrapping."
[[review.categories.items]]
id = "howto"
title = "The how-to screen explains the game"
description = "HOW TO PLAY covers reading a site, the tools and parts, the tape and axes, the speed/stress/swing trade-off, and the set-down tolerances, in a player's words, naming the key bindings; back returns to title."
[[review.categories.items]]
id = "select-behavior"
title = "The select screen lists, highlights, and enters"
description = "All six sites show number, name, and state without relying on hue alone, plus best scores; the highlight arrives on the site last entered or cleared; confirm enters open sites only; back returns to title."
[[review.categories.items]]
id = "build-readouts"
title = "The build screen's readouts and check"
description = "Site name, cost against budget, the tool palette with bindings and selection, and the tape's step count all show; check displays readiness issues or static utilizations until the next edit; a refused edit is visible in the moment."
[[review.categories.items]]
id = "program-editor"
title = "The tape editor covers the tape"
description = "The program screen shows the steps in order, each legible, and offers add, edit, reorder, and remove, with the same yard visible behind."
[[review.categories.items]]
id = "run-readouts"
title = "The run screen's readouts"
description = "Axis values with live targets, step m / n, the run clock, the cost, the speed, and the utilization legend all show over the live scene."
[[review.categories.items]]
id = "failure-copy"
title = "A failed run reads its cause"
description = "A failed run stays on the scene as it stood and shows exactly the FAIL_TEXT copy for its cause; back returns to build."
[[review.categories.items]]
id = "results-and-par"
title = "Results shows score against par"
description = "A cleared run shows CLEARED_TEXT with cost and time beside the site's par figures and offers NEXT SITE (except on site 6), REPLAY, and SITE SELECT in that order."
[[review.categories.items]]
id = "speed-toggle"
title = "Watch speed changes only the watching"
description = "speed cycles 1x, 2x, 4x on the run screen; the run's outcome, verdict tick, and clock are identical at every speed."
[[review.categories.items]]
id = "cue-timing"
title = "Cues play on their events"
description = "place, delete, run-start, attach, placed, break, collapse, complete, and fail each play on the tick of their event, at most once on that tick, and creak respects its threshold and cooldown."
[[review.categories.items]]
id = "motor-loop"
title = "The motor loop tracks motion"
description = "The motor sound loops while any axis's rate is nonzero and is silent when the crane is still."
[[review.categories.items]]
id = "mute"
title = "Mute works from any screen"
description = "The mute action toggles all sound from any screen and the game stays fully playable muted."
