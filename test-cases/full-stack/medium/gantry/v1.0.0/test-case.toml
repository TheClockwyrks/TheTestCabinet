# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "surface-operations-present"
title = "Every operation the surface carries is present as a function"
description = "The surface carries version and every operation the specification names for this build: the readings, the run and screen poses, the structure poses, the tape poses, the site poses and the run-in-progress poses, and on an engineless build the clock, project and input operations too, each present as a function."
domains = ["construction"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-operations-present.test.ts", outputs = [
  { id = "surface-operations", name = "The build carrying the whole documented surface", kind = "image" },
] }

