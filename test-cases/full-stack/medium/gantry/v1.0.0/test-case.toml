validation = { script = "presentation/hoist-cable-drawn-pivot-to-bob.test.ts", outputs = [
  { id = "cable", name = "The cable drawn at two hoist lengths", kind = "image" },
] }

# Open site 0, clearStructure, clearLoads and clearObstacles, park the
# pointer at the far corner of the stage so nothing is picked, and capture
# the build screen. Then setPendingNode(4, 0, 4), run a frame and capture
# again, with the camera untouched throughout. — Pixels sampled inside a
# 12-logical-pixel disc around the projected point of (4, 0, 4) differ
# between the two frames by more than 50 of 441 in RGB distance, while a
# control disc around the projected point of (8, 0, 4) is unchanged, and
# snapshot().pendingNode reads that node.
# From specs/ui.md § Build; specs/controls.md § The build tools.
[[review.categories.items]]
id = "pending-node-marked"
title = "A pending first node is visibly marked"
description = "The first click of a strut, cable or rail placement holds a node pending and marks it visibly on the build screen, so the player sees which node the second click will run the member from."
domains = ["presentation", "construction"]
failure_cap = "passable"
validation = { script = "presentation/pending-node-marked.test.ts", outputs = [
  { id = "pending", name = "The node held pending", kind = "image" },
] }

# Open site 0, clearLoads and clearObstacles, and capture the build screen at
# the start camera pose. Then addObstacle(4, 0, 4, 4, 6, 4) and capture again
# with the camera untouched. — The pixels at the projected centre of the
# box's near face, and at the projected centres of its top face and its two
# visible vertical edges, differ between the two frames by more than 50 of
# 441 in RGB distance, while a control point projected 20 units away from the
# box on the ground is unchanged.
# From specs/ui.md § Build; specs/world.md § Obstacles.
[[review.categories.items]]
id = "obstacles-drawn"
title = "Each obstacle is drawn in the yard as its box"
description = "The build screen draws the site's obstacles, each at the axis-aligned box its minimum corner and size give it, so the player reads what the crane and the load must clear before anything is built."
domains = ["presentation", "construction"]
failure_cap = "scuffed"
validation = { script = "presentation/obstacles-drawn.test.ts", outputs = [
  { id = "obstacle", name = "The yard with one obstacle standing in it", kind = "image" },
] }

# Take a snapshot, toggle the overlay on and advance sixty frames, then take
# another. — Every field but simTime is unchanged by the overlay being shown.
# From specs/instrumentation.md § Diagnostics.
[[review.categories.items]]
id = "overlay-is-read-only"
title = "Showing the overlay leaves the game as it is"
description = "Every diagnostic source is a pure read, so watching the overlay leaves the game as it is."
domains = ["presentation"]
failure_cap = "great"
validation = { script = "presentation/overlay-is-read-only.test.ts", outputs = [
  { id = "read-only", name = "The stage with the overlay shown", kind = "image" },
] }

# Load the game, capture the first frame before any input, then press
# Backquote, run a frame and capture again. — The first frame carries no
# panel: the region the second frame's panel occupies is unchanged from a
# frame captured with the overlay hidden, and more than 2 per cent of the
# stage's pixels differ between the two frames.
# From specs/instrumentation.md § Diagnostics.
[[review.categories.items]]
id = "overlay-off-until-toggled"
title = "The debug overlay is off until it is toggled"
description = "The debug overlay is not drawn until the backtick key is pressed, so the game's own display is what a player sees on load."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "presentation/overlay-off-until-toggled.test.ts", outputs = [
  { id = "off", name = "The stage with the overlay hidden", kind = "image" },
] }

# Load the game, press Backquote and run a frame, capture; press Backquote
# again, run a frame, capture. — The first capture differs from the pre-press
# frame over more than 2 per cent of the stage's pixels, and the second
# capture matches the pre-press frame within 50 of 441 at every sampled
# point.
# From specs/instrumentation.md § Diagnostics.
[[review.categories.items]]
id = "overlay-toggled-by-backquote"
title = "The backtick key shows and hides the debug overlay"
description = "Pressing the backtick key (KeyboardEvent.code Backquote) shows the debug overlay, and pressing it again hides it."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "presentation/overlay-toggled-by-backquote.test.ts", outputs = [
  { id = "on", name = "The stage with the overlay shown", kind = "image" },
] }
