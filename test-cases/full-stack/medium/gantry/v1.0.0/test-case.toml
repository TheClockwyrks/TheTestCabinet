title = "A member standing inside an obstacle ends the run though nothing moves"
description = "The test is on each tick's geometry rather than on any motion, so a tower member — which stands at its lattice position whatever the slew — standing inside an obstacle posed over it ends the run as structure-struck-obstacle on the first tick the collision stage runs, with no axis having moved."
domains = ["simulation"]
failure_cap = "scuffed"
validation = { script = "collisions/still-member-inside-a-posed-obstacle-ends-the-run.test.ts", outputs = [
  { id = "standing", name = "The tower member standing inside the posed block", kind = "image" },
] }

# clearObstacles, clearLoads, addLoad("crate", 40, ...), addObstacle(x, 0, z,
# w, 4, d) a block standing on the ground; build a crane and startRun;
# setLoadPhase(0, "attached"), set the hoist and setBob so the crate's lift
# point sits at y 1.5 inside the block's plan — its box occupying y
# -0.5..1.5, inside the block and below the ground at once — then advance one
# tick. — run.phase reads failed with cause load-struck-obstacle.
# From specs/statics.md § The failure causes; specs/program.md § The tick
# pipeline.
[[review.categories.items]]
id = "load-obstacle-strike-precedes-the-ground-strike"
title = "A load's obstacle strike is reported before its ground strike on the same tick"
description = "The collision stage tests the load against obstacles before it tests it against the ground, so a tick on which the attached load's box both reaches inside an obstacle and dips below y 0 ends the run as load-struck-obstacle and not as load-struck-ground."
domains = ["simulation", "choreography"]
failure_cap = "passable"
validation = { script = "collisions/load-obstacle-strike-precedes-the-ground-strike.test.ts", outputs = [
  { id = "both", name = "The load inside the block and below the yard floor", kind = "image" },
] }

# clearObstacles, clearLoads, addLoad("crate", 40, ...); build a crane;
# addObstacle as one box that both an arm member's segment and the hanging
