failure_cap = "passable"
validation = { script = "simulation/buckling-not-applied-below-the-reference.test.ts", outputs = [
  { id = "short-struts", name = "The minimal crane, whose short struts carry compression", kind = "image" },
] }

# On site index 0 (First Lift), clearStructure and build the reference rig: a
