[[review.categories]]
id = "controls"
title = "Keys, the camera, and the pointer"

# THE FOUR MENU-POINTER POINTS BELOW ALL AIM AT A REGION THE BUILD REPORTS.
# specs/ui.md leaves the menu layout to the build and fixes only that each entry
# occupies a hit region reported by menuItemRect, so every one of these asks the
# build where it drew the entry and drives the pointer or a contact at the middle
# of what it answered. Nothing here knows a menu coordinate.

# setScreen("title"), setMenuIndex(0), then move the pointer to the middle of
# menuItemRect(1) and advance a frame. — menuIndex reads 1, and screen still
# reads title: the hover moved the highlight and took nothing.
# From specs/ui.md § The screens.
