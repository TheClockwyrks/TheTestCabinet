# the hoist and setBob so the crate's box sits inside the box on the same
# tick the member does, then advance one tick. — run.phase reads failed with
# cause structure-struck-obstacle.
# From specs/statics.md § The failure causes; specs/program.md § The tick
# pipeline.
[[review.categories.items]]
id = "member-strike-precedes-a-load-strike"
title = "A member strike is reported before a load strike on the same tick"
description = "The collision stage tests members, then the load, then the ground, and a failed run carries the first cause the pipeline reached, so a tick on which a member's segment and the attached load's box both reach inside an obstacle ends the run as structure-struck-obstacle and not as load-struck-obstacle."
domains = ["simulation", "choreography"]
failure_cap = "passable"
validation = { script = "collisions/member-strike-precedes-a-load-strike.test.ts", outputs = [
  { id = "both", name = "The member and the load both inside the one block", kind = "image" },
] }

