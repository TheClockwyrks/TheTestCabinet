description = "During a run each member's color follows its utilization on a monotone ramp with a legend, a member near 1 stands out, and a broken member is unmistakable."
[[review.categories.items]]
id = "text-legible"
title = "Every piece of text is legible"
description = "Screen copy, readouts, and menus are legible against whatever sits behind them at the logical stage size."
[[review.categories.items]]
id = "designed-yard"
title = "The yard is designed rather than left plain"
description = "The build presents a considered construction yard with a look of its own — ground, sky, light, and chrome — rather than default shapes on an empty field."
[[review.categories.items]]
id = "original"
title = "The game is original to itself"
description = "The name, the look, the assets, and the branding are Gantry's own and reproduce no existing product."

# --- Produced assets -------------------------------------------------------------
[[review.categories]]
id = "produced-assets"
title = "Produced assets"
[[review.categories.items]]
id = "part-models"
title = "The five part models are produced and placed"
description = "The ring, trolley, hook, counterweight, and mount are genuine voxel-tool models — not code-drawn boxes — drawn at their subjects at the 1/VOXELS_PER_UNIT (1/8) scale: ring on the slew axis turning with the arm, trolley on the track, hook at the bob, counterweights and mounts at their nodes."
[[review.categories.items]]
id = "load-models"
title = "The three load models fill their classes"
description = "The crate, container, and drum are produced voxel models that read as their subjects and fill their class boxes, drawn at each load's pose through waiting, hanging, and placed."
[[review.categories.items]]
id = "models-via-runtime"
title = "Models load through the runtime the project provides"
description = "No part of the build decodes glTF itself: an engineless build decodes each committed .glb with @test-cabinet/voxel-runtime's parseGlb and renders it through the package's three binding, and an engine build loads each one through the engine's own asset loader under its asset root. Either way the files are referenced page-relative, so the build runs from a sub-path."
[[review.categories.items]]
id = "produced-cues"
title = "The cues are produced audio"
description = "Every cue in specs/ui.md plays a distinct produced .wav — not silence and not a hand-oscillated stand-in — including a motor loop that loops cleanly while an axis moves."
[[review.categories.items]]
id = "produced-music"
title = "The music bed is produced"
description = "The title and select screens carry a music-tool bed that suits a machine yard, with its .mid committed beside the .wav."

# --- Screens and audio -----------------------------------------------------------
[[review.categories]]
id = "screens"
title = "Screens and audio"
[[review.categories.items]]
id = "title-screen"
title = "The title screen"
description = "The game opens on TITLE_TEXT (GANTRY), TAGLINE_TEXT (RIG THE CRANE. RUN THE TAPE.), and TITLE_ITEMS (SITES, HOW TO PLAY) with menuIndex 0, navigated and confirmed by the registered actions with wrapping."
[[review.categories.items]]
id = "howto"
title = "The how-to screen explains the game"
description = "HOW TO PLAY covers reading a site, the tools and parts, the tape and axes, the speed/stress/swing trade-off, and the set-down tolerances, in a player's words, naming the key bindings; back returns to title."
[[review.categories.items]]
id = "select-behavior"
title = "The select screen lists, highlights, and enters"
description = "All six sites show number, name, and state without relying on hue alone, plus best scores; the highlight arrives on the site last entered or cleared; confirm enters an open or cleared site and does nothing on a locked one; back returns to title."
[[review.categories.items]]
id = "build-readouts"
title = "The build screen's readouts"
description = "Site name, cost against budget, the tool palette with bindings and selection, and the tape's step count all show, and a refused edit is visible in the moment it is refused."
[[review.categories.items]]
id = "check-on-build"
title = "The build screen draws what check reports"
description = "check displays the issues that would refuse a run by name and, on a structure with no readiness issue, whether it stands, coloring each member by its static utilization on the ramp when it stands and none when it does not — so a ready crane with an empty tape shows empty-program and the utilizations together."
[[review.categories.items]]
id = "check-result-lifetime"
title = "A shown check result describes the crane on screen"
description = "What check displayed goes back to none as soon as the structure or the tape changes, so the build screen never shows a result taken over a crane or a tape that has since been edited."
[[review.categories.items]]
id = "program-editor"
title = "The tape editor covers the tape"
description = "The program screen shows the steps in order, each legible, and offers add, edit, reorder, and remove, with the same yard visible behind."
[[review.categories.items]]
id = "run-readouts"
title = "The run screen's readouts"
description = "Axis values with live targets, step m / n, the run clock, the cost, the speed, and the utilization legend all show over the live scene."
[[review.categories.items]]
id = "failure-copy"
title = "A failed run reads its cause"
description = "A failed run stays on the scene as it stood and shows exactly the FAIL_TEXT copy for its cause; back returns to build."
[[review.categories.items]]
id = "results-and-par"
title = "Results shows score against par"
description = "A cleared run shows CLEARED_TEXT with cost and time beside the site's par figures and offers NEXT SITE (except on site 6), REPLAY, and SITE SELECT in that order."
[[review.categories.items]]
id = "speed-toggle"
title = "Watch speed changes only the watching"
description = "speed cycles 1x, 2x, 4x on the run screen; the run's outcome, verdict tick, and clock are identical at every speed."
[[review.categories.items]]
id = "cue-timing"
title = "Cues play on their events"
description = "place, delete, run-start, attach, placed, break, collapse, complete, and fail each play on the event that raises it, at most once on a given tick or edit, and creak respects its threshold and cooldown."
[[review.categories.items]]
id = "motor-loop"
title = "The motor loop tracks motion"
description = "The motor sound loops while any axis's rate is nonzero and is silent when the crane is still."
[[review.categories.items]]
id = "mute"
title = "Mute works from any screen"
description = "The mute action toggles all sound from any screen and the game stays fully playable muted."
