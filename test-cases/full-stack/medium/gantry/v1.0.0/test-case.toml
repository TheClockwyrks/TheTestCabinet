failure_cap = "passable"
validation = { script = "rigging/cable-force-on-the-structure-is-negated.test.ts", outputs = [
  { id = "loaded", name = "The crane loaded by the hanging bob", kind = "image" },
] }

# Attach a load whose weight with the hook exceeds 3000 force units and
