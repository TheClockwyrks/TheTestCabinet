# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "gantry"

# Human-readable display name for this test case.
name = "Gantry"

# Relative difficulty, surfaced on the site. Medium, and a demanding one: a 3D
# structural solver (two direct-stiffness solves per tick, slack cables, a
# breakage cascade), a kinetostatic load model driven by programmed motion, an
# exactly-specified pendulum, a 3D lattice editor with pointer picking, an
# instruction-tape editor, six authored sites — and, on top of the code, a
# produced set of eight voxel models and a full cue list. The thinking is genuinely
# hard (assembling and factoring a stiffness system, keeping a 3D truss from being
# a mechanism), which is what separates this from an easy case; the sheer size of
# the job is accounted for in `max_runtime_hours`.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["puzzle", "simulation", "3d", "construction", "physics"]

# Short site-facing abstract, shown on the test case card. NOT seeded.
summary = """
A 3D crane-building puzzle: rig a tower crane from struts, cables, and rails, \
write an instruction tape for its four axes, and run it under a real \
structural simulation — every member carries a computed force, speed swings \
the load, and the build produces its own voxel models and sound."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded.
description = "description.md"

# Required per-version changelog entry. NOT seeded.
changelog = "changelog.md"

# Handlebars prompt template, rendered per run and handed to the model as the
# build instruction. The harness prepends the standing full-stack asset-quality
# preamble at render time, so this template does not restate it.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, before the harness session is stopped.
# Gantry is a large build: the solver and its cascade, the pendulum, the axis
# controllers, a 3D editor and scene, the tape editor, six sites, the debug
# surface, and a full asset-production pass through four tools. Eight hours is
# comfortably more than a healthy build needs while still bounding a runaway
# session.
max_runtime_hours = 8

# The test type: an end-to-end playable game whose assets the model also
# produces during the run. A root key, so it sits above the first table header.
type = "full-stack"

# The dimension the produced art is in, which is what picks between the two
# full-stack run images. `3d` schedules onto `test-cabinet-full-stack-3d`, whose
# `PATH` carries `voxel`, `voxel-anim`, and `particle-3d` on top of the 2D set —
# and `voxel` is what `specs/assets.md` produces all eight models with, so the
# default `2d` image would leave the contract unbuildable. A root key, so it sits
# above the first table header, and a property of the whole version: every
# variant runs in the one image.
asset_dimension = "3d"

# Init command, run in the container once the workspace and specs are seeded and
# before the harness starts. `npm install` (not `npm ci`) because seeding writes
# baked-in `file:` dependencies into the workspace's `package.json` — the
# `packages` runtime below and the selected engine — so the lockfile completes
# at seed time rather than being committed
# ahead of it; the same command downloads the Playwright Chromium build so the
# model can look at its game in a browser without further setup.
init = "npm install && npx playwright install chromium"

# NOTE: no `assets = [...]` of pre-made art, deliberately: the model produces the
# game's models and audio itself, during the run (`specs/assets.md`).

# Test Cabinet runtime libraries installed into the run. `voxel-runtime` is the
# same library the review UI renders a produced voxel model with, and it is the
# ENGINELESS build's glTF decoder: that build reads its committed `.glb`s with
# `parseGlb` and puts them on screen through the package's `three` binding. Only
# `workspaces/none/package.json` declares it, via its baked-in `file:` path under
# `.tcab/packages/` — the two engine workspaces declare their engine alone,
# because both 3D engines' asset loaders decode glTF themselves. The key is
# case-wide with no per-engine scope, so the library is staged into every run and
# an engine run simply never imports it; resolution only requires that a shipped
# workspace `package.json` carry the `file:` spec, which `none`'s does. (A root
# key, so it sits above the first table header.)
packages = ["@test-cabinet/voxel-runtime"]

# Variants: exactly one runs per run. Gantry declares exactly ONE — every run is
# the same game, and the six sites are content within it, not variants. Nothing
# in the seeded set branches on the variant; the only axis the specs branch on is
# `engine.slug`. A root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The starter project seeded into the root of every run, one per engine. All
# three carry the same Vite/TypeScript/ESLint/Prettier/Vitest configuration the
# `[toolchain]` commands run against, an `index.html` holding the canvas, and
# `three` for the 3D scene. What differs is how much of the build is supplied.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     input, audio, diagnostics overlay and `window.__gantry`
#                     surface, and every figure the specification fixes, from
#                     the specs alone. `@test-cabinet/voxel-runtime` is its
#                     glTF decoder, declared in its `package.json`.
#   - `simple-3d`     declares the engine in its `package.json`, which is
#                     vendored in at seed time so the build imports it by its
#                     bare package name, and seeds the case-owned modules around
#                     the game: `src/constants.ts` (every figure this
#                     specification fixes, which a validator imports) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`: `GantryState`, `GantryDebugApi`, the three
#                     functions, and the `BACKGROUND` color.
#   - `structured-3d` declares that engine the same way and seeds the same two
#                     modules. The build writes `src/game.ts`: the
#                     `GameDefinition` the engine drives — its level, its game
#                     mode, its actors and controllers — the `GantryState` class
#                     the world holds, the debug surface its instance's
#                     `initialize` returns, and `BACKGROUND`.
#
# Naming one directory per engine is also what makes the case VALIDATOR-RATED:
# every graded point below declares `validation`, `failure_cap` and `domains`,
# and the same point is decided by the same-named suite in each engine's
# project under `validation/<engine>/`.
engines = ["none"]

[[engine]]
slug = "simple-3d"
min_version = "1.0.0"

[[engine]]
slug = "structured-3d"
min_version = "1.0.0"

[workspaces]
none = "workspaces/none"
"simple-3d" = "workspaces/simple-3d"
"structured-3d" = "workspaces/structured-3d"

# The audio packs the run container is staged with, and everything `sfx-sample`
# and `music` may reach. A tool config that names no pack plays the first pack of
# that kind.
#
# The yard is steel under load, so `combat-core` is the sample pack behind the
# `attach` clunk, the `creak`, the `break`, the `collapse`, and the `motor` loop,
# in its metal impacts, clangs, rubble, servo, and diesel idle. The bed plays
# under the title and select screens alone and is specified as steady and
# unhurried (`specs/assets.md`), which `gm-lite`'s piano, marimba, and nylon
# guitar carry as a working yard's own music. `cinematic` would make a lift
# heroic and `synthwave` would make it neon, and Gantry is neither, so neither is
# staged.
[audio]
packs = ["combat-core@0.1.0", "gm-lite@0.1.0"]

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. `npm ci` is deliberate: it requires a committed lockfile.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once the install
# has completed. `typecheck` GATES: a non-zero exit rates the run broken. The
# other three are recorded; `test` additionally records the count and coverage
# the build's own suite reports. These four are exactly the commands
# `specs/overview.md` tells the build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface, named once here.
# Reporter-side and never seeded; the seeded `specs/instrumentation.md` documents
# the same surface as an ordinary debugging feature.
#
# The handle names the ENGINELESS contract (`window.__gantry`); an engine run
# reaches the same operations off `engine.debug`. `tick_hz` is declared because
# Gantry runs on a fixed simulation tick: a run advances in whole `1/60`-second
# ticks, which is what lets a validation runtime convert stepped ticks into
# simulated time.
[instrumentation]
handle = "__gantry"
tick_hz = 60

# The specs. Every one is a COMMON spec, seeded for EVERY run; the single variant
# declares none of its own. The specification is decomposed by concern:
# `overview` the game and the project, `world` the frame and the site anatomy,
# `structure` the members, materials, parts, and editor rules, `statics` the
# solve and failure, `rigging` the cable, pendulum, attach, and release,
# `program` the axes, the tape, and the run, `controls` the camera, picking, and
# key actions, `state` the state shape, `instrumentation` the debug surface,
# `ui` the screens and audio, `sites` the six fixed sites, and `assets` the
# production contract.
#
# The `.hbs` sources branch on ONE axis, `engine.slug`, which selects what the
# build is handed and what it must write. Nothing branches on the variant.
[[spec]]
source = "specs/overview.md.hbs"

[[spec]]
source = "specs/world.md"

[[spec]]
source = "specs/structure.md"

[[spec]]
source = "specs/statics.md"

[[spec]]
source = "specs/rigging.md"

[[spec]]
source = "specs/program.md"

[[spec]]
source = "specs/controls.md.hbs"

[[spec]]
source = "specs/state.md.hbs"

[[spec]]
source = "specs/instrumentation.md.hbs"

[[spec]]
source = "specs/ui.md"

[[spec]]
source = "specs/sites.md"

[[spec]]
source = "specs/assets.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`. Gantry fixes no
# palette, no models, and no scene styling: every build is expected to look
# different, so there is no honest picture to compare against. What the
# specification fixes about appearance is stated as legibility
# (`specs/overview.md`), checked by a reviewer, and the produced assets are
# judged in play.

# Scoring domains. A reviewer rates each independently while playing the build;
# the run's overall rating is the WORST across them, so a beautiful yard cannot
# mask a solver that stands mechanisms up, and a correct solver cannot mask
# placeholder models.
[[domain]]
id = "construction"
name = "Construction"
description = "Building the crane: the lattice editor and its picking, the placement rules and refusals, the camera, undo, the static check, and whether rigging a crane feels precise rather than fiddly."

[[domain]]
id = "simulation"
name = "Simulation"
description = "The structural story: forces that read believably, mechanisms and overloads failing the way the check and the run report, breakage and collapse that are legible, and the swing behaving like a real hanging load."

[[domain]]
id = "choreography"
name = "Choreography"
description = "The tape: authoring steps and commands, watching a run play out, the speed/stress/swing trade-off being real, and the cleared-versus-failed loop pulling the player back to improve cost and time."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "The produced voxel models and audio and the 3D scene they sit in: the yard's look, the members and their utilization ramp, the screens and readouts, and the sound."

# Reviewer checklist, in the categories grammar. Reporter-side material —
# never seeded, so the model never sees it; every point restates a requirement
# the seeded specification already states, in its vocabulary.
#
# The case is VALIDATOR-RATED: it names one `[workspaces]` directory per engine,
# so every graded point declares `validation`, `failure_cap` and `domains`, and
# the same point is decided by the same-named suite in each engine's validator
# project under `validation/<engine>/`. The three suites are the same files:
# the three harnesses export one async API, so a point is graded identically
# whichever runtime the run selected.
#
# 797 points across 13 categories. Each asserts ONE
# observable behavior, because a build that gets half of a compound point right
# must score differently from one that gets all of it right. A domain's rating is
# the worst cap among its failures, so the count weights nothing — what the split
# buys is a grade that names the requirement a build missed.
[review]
format = 2

# ----------------------------------------------------------------------------
# Instrumentation — 122 points
# ----------------------------------------------------------------------------
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"

# openSite(0), clearLoads, addLoad("drum", 200, 0, 3, 0, 45),
# addObstacle(0,0,0, 4,4,4); then openSite(1) and read site.loads and
# site.obstacles; then openSite(0) again and read them. — Site 2 reports its
# two authored crates and no obstacle, and site 1 reports its one authored
# crate at (10, 2, 0) yaw 0 and no obstacle.
# From specs/state.md § The open site; specs/instrumentation.md § The site.
[[review.categories.items]]
id = "posed-loads-do-not-reach-another-site"
title = "A load posed on one site is not carried onto the next"
description = "The open site's loads and obstacles are its own copies of the fixed set specs/sites.md gives, so nothing the state holds points into that set: loads and obstacles posed on one site leave every other site's authored yard exactly as written."
domains = ["construction"]
failure_cap = "passable"
validation = { script = "instrumentation/posed-loads-do-not-reach-another-site.test.ts", outputs = [
  { id = "sites-intact", name = "The neighboring site's authored yard", kind = "image" },
] }

# reset, setCleared(0, true) and read cleared[0] and best[0]; then setBest(2,
# 4000, 60) and read cleared[2] and best[2]; then clearBest(2) and read
# cleared[2]. — best[0] reads null with cleared[0] true; cleared[2] reads
# false with best[2] carrying the score; and clearBest leaves cleared[2]
# false without touching cleared[0].
# From specs/state.md § The session; specs/instrumentation.md § The run and
# the screens.
[[review.categories.items]]
id = "cleared-and-best-are-independent"
title = "A site's cleared mark and its best score are set independently"
description = "Whether a site has been cleared this session and the best score recorded on it are two facts: a site can be marked cleared without a score and can carry a score without being marked cleared."
domains = ["construction"]
failure_cap = "great"
validation = { script = "instrumentation/cleared-and-best-are-independent.test.ts", outputs = [
  { id = "independent", name = "The two per-site facts", kind = "image" },
] }

# Call setTool("hammer"), setScreen("pause"), addMember with material "beam",
# addMoveStep with axis "boom", addLoad with class "pallet" and setLoadPhase
# with phase "floating". — Every call throws and the snapshot is unchanged
# after each.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "invalid-enumerated-argument-fails-loudly"
title = "An argument outside a stated domain fails loudly"
description = "An argument outside the domain its operation states — a tool, a material, a screen, an axis, a load class or a load phase the specification does not name — is invalid, and the call fails loudly rather than guessing what was meant."
domains = ["construction"]
failure_cap = "passable"
validation = { script = "instrumentation/invalid-enumerated-argument-fails-loudly.test.ts", outputs = [
  { id = "invalid-enumerated-argument", name = "The run the six refused calls left untouched", kind = "image" },
] }

# On a three-member crane whose ids are 0, 1 and 2, call removeMember(7) and
# removeMember(-1). — Both calls throw and structure.members still carries
# the three members.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "invalid-member-id-fails-loudly"
title = "An id no member carries fails loudly"
description = "An id no member carries is invalid, so removeMember fails loudly on one — unlike a removal with nothing to remove, which is a silent refusal."
domains = ["construction"]
failure_cap = "passable"
validation = { script = "instrumentation/invalid-member-id-fails-loudly.test.ts", outputs = [
  { id = "member-ids-intact", name = "The three members the two bad removals left standing", kind = "image" },
] }

# Call openSite(6), openSite(-1), setCleared(9, true), setBest(6, 1, 1) and
# clearBest(-1). — Every call throws and siteIndex, cleared and best are
# unchanged.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "invalid-site-index-fails-loudly"
title = "An index no site carries fails loudly"
description = "An index no site carries is invalid, so openSite, setCleared, setBest and clearBest fail loudly on one."
domains = ["construction"]
failure_cap = "passable"
validation = { script = "instrumentation/invalid-site-index-fails-loudly.test.ts", outputs = [
  { id = "site-indices-intact", name = "The open site the five refused calls left standing", kind = "image" },
] }

# On a three-step tape and a one-load yard, call removeStep(3), addCommand(7,
# ...), setLoadTarget(2, ...) and, during a run, setLoadPhase(4, "attached").
# — Every call throws and the tape and the loads are unchanged.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "invalid-step-or-load-index-fails-loudly"
title = "An index no tape step or load carries fails loudly"
description = "An index no tape step and no load carries is invalid, so removeStep, addCommand, setLoadTarget, setLoadPose and setLoadPhase fail loudly on one."
domains = ["choreography"]
failure_cap = "passable"
validation = { script = "instrumentation/invalid-step-or-load-index-fails-loudly.test.ts", outputs = [
  { id = "step-and-load-indices-intact", name = "The tape and the load the four refused calls left as they were", kind = "image" },
] }

# Open site 0 and clear the structure. Call setPendingNode(0, 1, 0),
# addMember(0,0,0, 0,1,0,"strut"), setRing(1,2,0), addCounterweight(0,3,0)
# and removeCounterweight(0,0,1), each with one coordinate off the pitch. —
# Every one of those calls throws, and snapshot().structure is unchanged
# after each: no member, no ring, no counterweight, and historyDepth unmoved.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "lattice-coordinate-off-the-pitch-is-invalid"
title = "A coordinate off the lattice pitch is an invalid argument"
description = "Every operation whose table names a lattice node takes a lattice node: a coordinate that is not a multiple of LATTICE_PITCH (2) is outside the domain and the call fails loudly, rather than being taken and refused as an edit."
domains = ["construction"]
failure_cap = "passable"
validation = { script = "instrumentation/lattice-coordinate-off-the-pitch-is-invalid.test.ts", outputs = [
  { id = "error-messages", name = "The empty structure the five off-pitch calls left", kind = "image" },
] }

# On a posed site with a crane, a tape, a pending node and a camera pose,
# take a snapshot, call setTool("cable"), and take another; repeat for
# setCamera, setPendingNode, setAxis during a run, and setLoadPose. — Each
# pair of snapshots differs only in the field the pose names — tool, camera,
# pendingNode, that axis's value, that load's pose — and every other field,
# the pending node and the history included, is identical.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "pose-changes-only-what-it-names"
title = "A pose changes only the thing it names"
description = "A pose sets one thing and leaves the rest of the game as it stands: a whole-snapshot comparison across a pose differs in the field that pose names and in nothing else."
domains = ["construction", "choreography"]
failure_cap = "scuffed"
validation = { script = "instrumentation/pose-changes-only-what-it-names.test.ts", outputs = [
  { id = "pose-isolation", name = "The run the five single-field poses left otherwise untouched", kind = "image" },
] }

# Pose a crane, a tape, a load and a run in progress, then take snapshot()
# and the check reading and round-trip each through JSON.stringify and
# JSON.parse. — Each round-tripped value deep-equals the original, and every
# leaf is a number, string, boolean, null, plain array or plain object.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "readings-return-plain-values"
title = "The readings return plain numbers, strings, booleans and objects"
description = "Everything the surface hands back is plain data: a snapshot and a check reading survive a JSON round trip unchanged, carrying no class instances, no engine vectors, and no functions."
domains = ["construction"]
failure_cap = "scuffed"
validation = { script = "instrumentation/readings-return-plain-values.test.ts", outputs = [
  { id = "plain-readings", name = "The run the two readings were taken over", kind = "image" },
] }

# On the title screen read menuItemRect(0) and menuItemRect(1), then move the
# pointer to the middle of each in turn, advancing a frame after each, and read
# menuIndex. — Each reading is a { x, y, w, h } inside the stage, the two
# regions do not overlap, and the highlight follows the pointer onto the entry
# each region was reported for.
# From specs/instrumentation.md § Readings; specs/ui.md § The screens.
[[review.categories.items]]
id = "menu-item-rect-reports-the-entry-region"
title = "menuItemRect reports the region the entry is selected from"
description = "menuItemRect reports an entry's hit region in logical stage units, and it is the region that entry is actually selected from: the pointer moved into it highlights that entry."
domains = ["presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/menu-item-rect-reports-the-entry-region.test.ts", outputs = [
  { id = "state", name = "The driven state this point decides", kind = "image" },
] }

# Call menuItemRect(0) on the howto, build, program and run screens, and
# menuItemRect(2) and menuItemRect(-1) on the title screen, whose menu carries
# two entries. — Every one of those calls throws and the snapshot is unchanged
# after each.
# From specs/instrumentation.md § Readings.
[[review.categories.items]]
id = "menu-item-rect-off-a-menu-fails-loudly"
title = "menuItemRect fails loudly where no such entry is showing"
description = "menuItemRect is called on a screen carrying a menu, for an entry that menu has: a screen with no menu and an index outside the menu's entry count are both outside the operation's domain, and the call fails loudly."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "instrumentation/menu-item-rect-off-a-menu-fails-loudly.test.ts", outputs = [
  { id = "state", name = "The driven state this point decides", kind = "image" },
] }

# During a run with a load attached, take a snapshot, take fifty more, and
