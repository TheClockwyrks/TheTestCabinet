description = "On an engine build the surface is engine.debug and nothing is installed on the page, so window carries no __gantry; on an engineless build the surface is window.__gantry, installed as soon as the game has initialized."
domains = ["construction"]
failure_cap = "passable"
validation = { script = "instrumentation/surface-reached-only-the-documented-way.test.ts", outputs = [
  { id = "surface-handle", name = "The build carrying its surface on the documented handle", kind = "image" },
] }

# Read the surface's version field. — It reads the number 1.
# From specs/instrumentation.md § The operations.
[[review.categories.items]]
id = "surface-version-field"
title = "The surface carries version 1"
description = "The surface carries version, a plain number equal to GANTRY_DEBUG_VERSION (1)."
domains = ["construction"]
failure_cap = "passable"
