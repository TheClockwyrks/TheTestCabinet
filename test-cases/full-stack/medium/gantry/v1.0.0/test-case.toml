] }

# Clear the loads and the obstacles and pose a crane of struts and rails only
# (no cables, so the solve is linear), with the trolley at the track origin
# so the cable force lands wholly on that node. Read run.forces at rest three
# ways: with the bare hook (bob mass HOOK_MASS, 5); with a load of mass 75
# attached (bob mass 80); and with the bare hook on the same crane carrying
# one counterweight (COUNTERWEIGHT_MASS, 80) on the track-origin node. — The
# change every member force takes from attaching the load is exactly 750 /
# 800 of the change the counterweight makes at the same node, and in the same
# direction, so at rest the cable force is the bob's mass times GRAVITY.
