<!DOCTYPE html>
<!--
  Junction — bankruptcy reference mockup.
  Canonical view slug: game-over
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Bankruptcy).
  Objects in .city use field-local coordinates (top = map row * 24).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Junction — Bankruptcy</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- A dim slice of the failed city behind the panel. -->
      <div class="city">
        <div class="region water dim" style="--c: 39; --r: 17; --w: 15; --h: 8"></div>
        <div class="cell road dim" style="--c: 8; --r: 11"></div>
        <div class="cell road dim" style="--c: 9; --r: 11"></div>
        <div class="cell road dim" style="--c: 10; --r: 11"></div>
        <div class="cell road dim" style="--c: 11; --r: 11"></div>
        <div class="cell road dim" style="--c: 12; --r: 11"></div>
        <div class="cell road dim" style="--c: 13; --r: 11"></div>
        <div class="cell road dim" style="--c: 14; --r: 11"></div>
        <!-- Half the districts have abandoned back to empty zoned lots. -->
        <div class="bldg res t1 dim" style="--c: 5; --r: 12"></div>
        <div class="bldg res t1 dim" style="--c: 6; --r: 12"></div>
        <div class="zone res dim" style="--c: 4; --r: 13; --w: 4; --h: 2"></div>
        <div class="bldg com t1 dim" style="--c: 21; --r: 8"></div>
        <div class="zone com dim" style="--c: 20; --r: 7; --w: 3; --h: 3"></div>
        <div class="bldg ind t1 dim" style="--c: 41; --r: 13"></div>
        <div class="zone ind dim" style="--c: 40; --r: 12; --w: 4; --h: 3"></div>
        <div class="haze dim" style="--c: 38; --r: 11; --w: 9; --h: 6"></div>
      </div>

      <div class="overlay"></div>

      <div class="panel">
        <p class="panel-eyebrow">THE MONEY RAN OUT</p>
        <h2 class="panel-title">BANKRUPT</h2>
        <p class="panel-stat">PEAK POPULATION 8,410</p>
        <p class="panel-sub">SURVIVED 41 MONTHS &nbsp;&middot;&nbsp; FINAL DEBT &minus;$18,200</p>
        <nav class="menu">
          <div class="menu-item selected">TRY AGAIN</div>
          <div class="menu-item">MENU</div>
        </nav>
      </div>
    </div>
  </body>
</html>
