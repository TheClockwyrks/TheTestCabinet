slug = "valence"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Valence"

# Test type. Valence is a `full-stack` case: an end-to-end (playable-browser-game)
# case with one addition — the model under test must PRODUCE the game's own assets
# DURING the run, using the asset-generation binaries on the run image's `PATH`, and
# then build a game that uses them. It is NOT the older two-run pattern where a
# separate asset-gen run makes an asset a later game merely consumes; here one model
# both produces the art/effects/audio and builds the game around it. The `full-stack`
# type schedules the run onto the `test-cabinet-full-stack-2d` image, which carries
# exactly six binaries on `PATH` — `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`,
# `sfx-sample`, and `music` — and no others; every asset the game needs is produced
# with one of them (`specs/assets.md` is the production contract). A root identity
# field, so it sits above the first table.
type = "full-stack"

# Relative difficulty (easy | medium | hard), surfaced on the site. Valence is
# medium: it asks for a real-time tower-defense simulation — matter flowing along a chosen map's
# paths (an easy single path, a medium branching fork, or a hard set of multiple separate
# paths, in curved or straight/right-angle styles), free Bloons-style tower placement, a hit-point / damage-type
# (energy, kinetic, nuclear) / stackable-trait (bonded, heavy, inert) model with seven
# general-purpose towers each choosing one of two upgrade branches, detection of camo-like
# inert matter from several sources, a live economy of energy/interest/integrity, and an
# escalating round campaign with a fragmenting boss — AND, on top of that, for the model to
# author every sprite, animation, particle effect, and sound the game plays. The
# interacting simulation plus a full asset-production pass make this a demanding
# medium case.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["tower-defense", "strategy", "2d", "chemistry"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A chemistry-themed tower defense: pick a map — a single path, a branching fork of \
lanes, or multiple separate paths — and freely place towers beside its conduits to \
break unstable matter down before it reaches the collector — chip bonded clusters \
open, crack energy-immune heavies with kinetic or nuclear damage, and detect \
camouflaged inert matter — with seven general-purpose towers and branching upgrades, \
while producing every sprite, effect, and sound with the on-PATH asset tools."""

# Site-facing prose describing the case, relative to this version folder. NOT seeded
# into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version folder),
# recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run (with
# the seeded specs and the selected variant) and handed to the model as the build
# instruction. Injects absolute in-container paths via template variables. The
# harness auto-prepends the standing full-stack asset-quality preamble to the
# rendered prompt, so this template does NOT restate a global quality directive.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Valence is a large build — a real-time TD simulation with a multi-phase
# decomposition model plus a full asset-production pass through six tools — so it
# gets eight hours: comfortably more than a healthy build needs while still bounding
# a runaway session.
max_runtime_hours = 8

# Starter workspace seeded into the root of every run before the specs. It gives the
# model a baseline project to build on: a `package.json` that pins `playwright` as a
# dev dependency and declares the produced-effect runtime (`packages`, below) as a
# baked-in `file:` dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. `npm install` — NOT `npm ci` — because `packages`
# injects the `@test-cabinet/particle-runtime` `file:` dependency this build plays
# its produced particle systems with, so the lockfile is completed at seed time; the
# same command downloads the Playwright Chromium build (the base image ships the OS
# libraries Chromium links against, but not the browser binary), so the model can
# build and verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the
# whole point of a full-stack case: the model PRODUCES the game's art, effects, and
# audio itself, during the run, with the six binaries on the run image's `PATH` (see
# `type` above and `specs/assets.md`). The `reference/` screenshots below are
# harness-side visual targets declared via `[[reference]]` — captured from this case's
# own reference-impl build and seeded as images, not seeded game assets.

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and
# the seeded workspace `package.json` depends on it via its baked-in `file:` path, so
# the build imports it (its `/canvas` binding) like any other dependency and plays
# each produced `system.json` by simulating it live. The damage/decomposition bursts (the
# strip spark, the bond-snap shards, the split flash, the neutralize burst, the reveal pulse)
# and tower muzzle effects are all produced `particle-2d` systems played this way;
# see `specs/assets.md` for the consumption contract. (A root key, so it must sit
# above the first `[table]` header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order — the
# first is the default. No variant seeds a spec of its own: the single Containment
# campaign start — its menu entry and its starting energy and integrity — is folded
# into the common `specs/gameplay.md`. Each variant still supplies its own `title`
# menu reference (the main menu lists the campaign start; `gameplay` and `game-over`
# are common):
#   - base — the standard containment campaign.
# This list is a root key, so it must sit above the first `[table]` header below.
variants = [
  "variants/base.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named once
# here so a review item's `validation` driver (and the validator that runs it) knows
# which `window` global to drive. The seeded specification documents the same handle
# independently as an ordinary game debug feature (see specs/instrumentation.md);
# this entry is reporter-side and never seeded. It is required because review items
# below declare `validation` scripts.
[instrumentation]
handle = "__valence"
# The fixed simulation rate, in Hz. Valence's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation
# runtime uses to relate that exact stepping back to real time — one tick is
# 1/60 of a second, so a second of game time is 60 ticks. It must match the
# timestep the seeded `specs/controls.md` mandates.
tick_hz = 60

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern: the overview, the board, the
# matter, the towers, the controls, the gameplay (the campaign start, the economy,
# integrity, the round progression and victory, scoring, and the key behaviors), the
# UI (the game states, the required menus, the HUD, and what is out of scope), the
# asset-production contract, the debugging/automation surface, and the proof captures.
# The single Containment campaign start is folded into `specs/gameplay.md` rather than
# seeded from a separate per-variant file, so each variant's set reads as one
# self-contained game. The common specs reference each other by name and never name a
# variant. All common specs are plain Markdown, seeded verbatim. A spec's `dest`
# defaults to its `source` (with a trailing `.hbs` stripped), so these need only name
# the source they seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/board.md"

[[spec]]
source = "specs/matter.md"

[[spec]]
source = "specs/towers.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/gameplay.md"

[[spec]]
source = "specs/ui.md"

# The asset-production contract: every asset the game needs, which of the six
# on-PATH binaries produces it, where it lands in the workspace, and how it is wired
# into the build. Seeded for every variant so the produced-asset review items and
# this spec stay in lockstep. This is the defining spec of a full-stack case.
[[spec]]
source = "specs/assets.md"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable, seedable core; a `window.__valence` API to drive and inspect the game
# from code (select a map, place towers, spawn matter, run rounds); and a read-only
# debug overlay. Seeded for every variant and framed as an ordinary developer
# affordance of the game. It underpins the automated-validation scripts a review item
# drives, and it doubles as the surface the build uses to verify itself and to stage
# the proof captures.
[[spec]]
source = "specs/instrumentation.md"

# Proof of implementation: instructs the build to capture evidence at the exact paths
# the `[[proof]]` entries below declare. The paths in this spec and in the `[[proof]]`
# entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl build — the
# authored, correct game under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. The `title` view is variant-specific (declared per variant
# below) because the menu differs by variant; `gameplay` and `game-over` look the
# same in every variant.
[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest` path
# (relative to the run workspace root) the build must write a screenshot or `.webm`
# clip to; `specs/proof.md` instructs the build to produce them at exactly these
# paths. Validation records whether each turned up (informational). The media kind is
# inferred from the extension: `.png` is an image, `.webm` a video (the format
# Playwright records natively; the public gallery transcodes it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "Live board"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Containment failed"
dest = "proof/game-over.png"

[[proof]]
id = "systems"
name = "Decomposition clip"
dest = "proof/systems.webm"

[[proof]]
id = "pressure"
name = "Late-round pressure clip"
dest = "proof/pressure.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The reference
# screenshots are seeded as illustrative examples of the screens, not layouts to
# reproduce, so menus and screens are left to the model's design and are reviewed by
# a human rather than scored against a baseline. The automated load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build, and
# the run's overall rating is the WORST across them — flawless simulation cannot mask
# crude, un-produced art, and gorgeous produced art cannot mask matter that does not
# decompose. These qualitative per-domain ratings are the reviewer's own call, kept
# separate from the point checklist below (which is scored globally in the categories
# grammar and attaches no domain to a point). Every case must declare at least one.
[[domain]]
id = "simulation"
name = "Reaction Systems"
description = "How the reactor actually plays: the map select and its paths, the matter that flows along them, and the hit-point / damage-type / stackable-trait model that decides what each unit on screen demands. It also covers the seven freely placed towers with their two-branch upgrades and automatic targeting, the support auras, the energy / interest / integrity economy, and the escalating round campaign with its fragmenting boss."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "What the build looks and sounds like: the tool-produced matter, tower, projectile, and path-track sprites and their animated cycles, the live particle bursts, and the produced sound effects and reactor music bed. It also covers the in-code HUD, map-select previews, and build panel, and whether a player can tell at speed what each unit on screen demands."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name
# grouping the points a reviewer grades — and each `[[review.categories.items]]`
# under it is one graded review item, worth one point (the default weight). A
# category carries no prose of its own; each item states its own requirement in
# `description`. This is a narrow, single-behavior taxonomy: one observable fact per
# item, so a build fails exactly the rule it breaks rather than an averaged bundle.
# The checklist is reporter-side material — never seeded into a run, so the model
# never sees it; each item restates a requirement the seeded specification already
# states. An item with a `validation` script is decided automatically (the reviewer
# can override); one without is reviewed by a person. The genuinely subjective points —
# produced-sprite quality, animation feel, audio, the HUD's at-a-glance readability,
# window fit — carry no validation. The `states` captures carry a script too, but
# only to REACH and capture each screen through the debug API (its auto-verdict
# confirms the state is reachable); how each screen reads and lays out is still reviewed
# by a person from the capture. Every automatable item drives the real deterministic
# simulation through `window.__valence` (see specs/instrumentation.md): control ops
# only ESTABLISH preconditions, then `step()` runs the real systems forward and
# `snapshot()`/`pixel()` read the outcome back — nothing fabricates a result.
[review]
format = 2

# =============================================================================
# Debug & Automation API
# =============================================================================
# Placed first because it is the gate. Almost every automated item below poses matter
# and towers on the SCENARIO ROUND that `startScenario` opens (specs/instrumentation.md)
# and then runs the real simulation over it. A build that does not open one fails this
# item, by name, and the automated verdicts below it are untested rather than answered —
# which is the difference between reading a result and investigating one.

# --- The scenario board ------------------------------------------------------
[[review.categories]]
id = "instrumentation"
title = "Debug & Automation API"
[[review.categories.items]]
id = "scenario-round"
title = "The debug API opens a live scenario round"
description = "`startScenario` opens a live round the wave system leaves empty and that does not end on its own: the run enters the round phase without advancing the round number, no wave is sent into it, matter posed on it flows and is fired on by a tower in range exactly as it would mid-round, and the round does not clear back to the build phase when the board empties."
validation = { script = "validation/instrumentation/scenario-round.mjs", outputs = [{ id = "scenario", name = "A posed unit flowing and under fire on an empty scenario round", kind = "video" }] }

