<!DOCTYPE html>
<!--
  Valence — title / main menu reference mockup (standard variant).
  Canonical view slug: title (variant: standard)
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Title / main menu)
  and ../specs/mode.md (the CONTAINMENT start this variant seeds). The menu lists the
  variant's start, then HOW TO PLAY. A dim slice of board shows behind for atmosphere.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Valence — Main menu</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Dim board furniture behind the menu. -->
      <div class="board dim" style="top: 0; height: 720px; width: 1280px">
        <div class="seg" style="left: 120px; top: 500px; width: 300px"></div>
        <div class="seg v" style="left: 412px; top: 320px; height: 188px"></div>
        <div class="seg" style="left: 420px; top: 320px; width: 420px"></div>
        <div class="tower ion" style="left: 260px; top: 500px">I</div>
        <div class="tower cat" style="left: 640px; top: 320px">C</div>
        <div class="atom e1" style="left: 500px; top: 320px"></div>
        <div class="heavy-atom" style="left: 780px; top: 500px"></div>
      </div>

      <div class="center">
        <h1 class="title">VALENCE</h1>
        <p class="tagline">BREAK IT DOWN</p>
        <div class="menu">
          <div class="menu-item selected">CONTAINMENT</div>
          <div class="menu-item">HOW TO PLAY</div>
        </div>
      </div>
      <div class="hint">&#8593;&#8595; SELECT &nbsp;&nbsp; ENTER CONFIRM</div>
    </div>
  </body>
</html>
