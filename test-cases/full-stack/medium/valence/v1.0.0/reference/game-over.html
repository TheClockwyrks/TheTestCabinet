<!DOCTYPE html>
<!--
  Valence — containment-failed reference mockup.
  Canonical view slug: game-over
  Render at a 1280x720 viewport. See ../specs/flow.md (the Containment-failed state:
  final score, round reached, PLAY AGAIN / MENU). Shown when integrity reaches zero.
  The board furniture behind the panel is dimmed and illustrative only.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Valence — Containment failed</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Dimmed live board behind the panel, for atmosphere. -->
      <div class="topbar dim">
        <div class="stat"><span class="k">ENERGY</span><span class="v energy">180</span></div>
        <div class="stat"><span class="k">INTEGRITY</span><span class="v low">0</span></div>
        <div class="round">ROUND 14 <span class="prog">/ 20</span></div>
        <div class="spacer"></div>
        <div class="ctrls"><div class="ctrl">&#9654; 1x</div><div class="ctrl">&#10073;&#10073;</div></div>
      </div>
      <div class="board dim">
        <div class="seg" style="left: 24px; top: 324px; width: 176px"></div>
        <div class="seg v" style="left: 192px; top: 150px; height: 182px"></div>
        <div class="seg" style="left: 200px; top: 142px; width: 600px"></div>
        <div class="seg v" style="left: 192px; top: 332px; height: 182px"></div>
        <div class="seg" style="left: 200px; top: 506px; width: 600px"></div>
        <div class="seg" style="left: 800px; top: 324px; width: 150px"></div>
        <div class="collector" style="left: 958px; top: 332px">&#9633;</div>
        <div class="tower ion" style="left: 300px; top: 120px">I</div>
        <div class="tower cleaver" style="left: 120px; top: 300px">K</div>
        <div class="tower reactor" style="left: 760px; top: 300px">R</div>
        <div class="heavy-atom" style="left: 900px; top: 332px"></div>
        <div class="molecule" style="left: 520px; top: 514px">
          <span class="a e2"></span><span class="b"></span><span class="a e1"></span>
        </div>
      </div>

      <div class="overlay"></div>
      <div class="panel-modal">
        <p class="panel-eyebrow">CONTAINMENT FAILED</p>
        <h1 class="panel-title">BREACH</h1>
        <p class="panel-stat">REACHED ROUND 14 / 20</p>
        <p class="panel-sub">SCORE 18,640</p>
        <div class="panel-actions">
          <div class="action primary">TRY AGAIN</div>
          <div class="action">MENU</div>
        </div>
      </div>
    </div>
  </body>
</html>
