# Reference-similarity checks (opt-in) are intentionally not declared. The reference
# screenshots are seeded as illustrative examples of the screens, not layouts to
# reproduce, so menus and screens are left to the model's design and are reviewed by a
# human rather than scored against a baseline. The automated load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build, and
# the run's overall rating is the WORST across them — a flawless mining sim cannot mask
# a stiff, un-produced miner, and a gorgeous animated character cannot mask a mine that
# does not dig or an economy that cannot be won. Domains are case-level; an individual
# review item rolls up to one through its optional `domain`, while a general item
# (states, window fit) omits it.
[[domain]]
id = "simulation"
name = "Mine & Expedition Systems"
description = "The interacting Motherload-style systems: the character drilling down/left/right (never up) and falling/thrusting through a banded tile mine over a vertical camera; the fuel budget that makes every dig a round-trip gamble, with refuel and repair BOUGHT with Credits at the surface (never free); the weight-and-lift model where ore has weight, the jetpack lifts a load only up to a tier limit (an overloaded miner cannot climb and must DROP ore from the inventory), and a heavier haul climbs slower and burns more fuel; the ore-to-Credits economy (six ores rising steeply in value with depth plus three rarer GEMSTONES — one per band below the topsoil, worth 3x and weighing 2x that band's signature ore — value-per-kg climbing with depth, a SLOT-limited cargo bay with weight the jetpack must separately lift, selling at the market) funding a seven-track upgrade shop (fuel, drill, cargo, hull, jetpack, radiator, scanner); the four depth bands whose hardness gates the descent behind drill tiers; the two guaranteed-but-hidden exotic materials found via the scanner; depth-scaling gas/lava hazards cut by the radiator, plus fall impact; the unstable Core Sample extracted from the bottom on a 90-second detonation timer; the five-component escape rocket (two bought, two needing a material, one needing the Core Sample) that is the only win; the explicit single-slot SAVE (only at the surface Save Pad) with a CONTINUE on the main menu; and the Standard (restore from your last save on death) vs Hardcore (permadeath, save deleted) death modes, installed rocket parts durable across both."

[[domain]]
id = "presentation"
name = "Presentation & Character Animation"
description = "The genuinely tool-produced assets and how the build presents them: above all the ANIMATED MINER — the suited prospector with drill and jetpack animating distinctly for idle, walk, drill-down, drill-side, jetpack-ascend, fall, hurt, and out-of-fuel, mirrored to face its direction — plus the four band rock tiles and the carved tunnels, the six ore veins and the three faceted gemstones and the two material nodes and the glowing core, the gas and lava hazards (lava shimmering), the six surface buildings (including the Save Pad and Supply Depot) and the escape rocket that visibly assembles component by component, the produced particle VFX (drill debris, jetpack exhaust, ore sparkle, gas explosion, lava embers, core extraction and detonation, launch exhaust, death), and the produced audio (drill/thrust loops, pickups, explosions, alarms, launch roar, and a lonely descent music bed), all wired in, with the in-code HUD, scanner indicator, core countdown, and building panels reading the state at a glance."

# Reviewer checklist items, common to every variant. The major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss. Reporter-side material: never
# seeded into a run, so the model never sees the checklist; each restates a requirement
# the seeded specification already states. Each item is worth `weight` points toward
# the run's score; the reviewer records a pass/fail verdict for each before the run can
# be published. The per-domain ratings stay the reviewer's call.

# --- Mine & Expedition Systems --------------------------------------------------
[[review_item]]
id = "dig-and-move"
title = "Drill down/left/right (never up), fall cheap, thrust burns fuel"
text = "The miner drills the tile it moves into — DOWN, LEFT, and RIGHT — but NEVER up: the ceiling is solid, so the only way to gain height is the jetpack through tunnels already carved. Falling through open tunnel is free and fast; jetpack thrust is the only way up and burns fuel. Drilling a tile takes a time set by the tile's band hardness and the drill tier, leaving an empty tunnel; a held-down shaft descends SMOOTHLY — the miner sinks into the tile as it drills and arrives flush on the next one as it breaks, never teleport-snapping a whole tile down at once. Movement is smooth and continuous (hold a direction), the miner fits one tile, and it falls whenever unsupported."
weight = 1
domain = "simulation"
proof = "mine"

[[review_item]]
id = "depth-bands-hardness"
title = "Four depth bands whose hardness gates the descent"
text = "The mine is banded — Topsoil (soft), Rockbed, Deepstone, Coreshell (very hard) — each visibly distinct (its own rock fill, a rising glow toward the core) so depth reads from the world, not just the meter, and each harder to drill than the last. A tile whose hardness exceeds the drill's power still drills but PUNISHINGLY slowly, so reaching the deepstone and coreshell at a workable pace requires buying up the drill tier — one of the ways the economy paces the descent. Depth is shown in meters. UNBREAKABLE STONE boulders are scattered through the rock (denser with depth) as an obstacle no drill breaks: the miner must route AROUND them (a straight shaft has to jog sideways), and generation never seals the only route down or to a material with stone. A tile being drilled shows a damage-crack overlay that deepens with progress."
weight = 1
domain = "simulation"
proof = "mine"

[[review_item]]
id = "fuel-round-trip"
title = "The fuel/weight round-trip gamble"
text = "Fuel drains from jetpack thrust (fastest), lateral air drift, a passive underground trickle, and each tile drilled, and is BOUGHT with Credits at the surface Fuel Depot (per unit, never free, never refilling on its own). The thrust burn is SPEED-SCALED, not flat: full rate (6/s) while lifting off or grinding up heavy, easing toward a cheaper cruise rate (2.2/s) once climbing at speed — so an EMPTY/light ascent is fast and cheap while a heavy one, throttled to a slow climb, keeps paying the full rate the whole way. The climb speeds and rates are tuned so a MATCHED jetpack can dive to its band, mine, and lift an ~80%-weight haul back out on a sensible fuel budget (the bands are deep). Ore has WEIGHT: the jetpack lifts a load only up to a per-tier limit — an overloaded miner cannot climb at all and must open the inventory (I / the BAG control) and DROP ore to fly out — and a heavier haul climbs slower and so burns more fuel over the same shaft (the empty climb speed rises only gently across jetpack tiers; a tier lifts MORE WEIGHT rather than flying faster). The tension of every dig is getting back before Fuel hits 0 — running dry underground strands the miner and is a DEATH (handled by the mode). A low-fuel warning (gauge alert color + alarm) shows under 20%, and an OVERLOAD warning shows when the load exceeds the jetpack's lift. Bigger fuel-tank tiers reach deeper; bigger jetpack tiers lift heavier hauls. Hull is likewise BOUGHT-back (repaired per point with Credits at the depot; death at 0)."
weight = 1
domain = "simulation"
proof = "loop"

[[review_item]]
id = "ore-economy-upgrades"
title = "Ore → Credits → upgrades economy"
text = "Drilling an ore vein adds one unit to a SLOT-limited cargo bay (a fixed number of ore slots, one unit per slot — when the bay is full by slots the drilled tile still clears cleanly but the ore is left behind, never a hard-lock); the six ores rise steeply in value with depth (Ferron 28 → Adamite 1900) while weight rises only gently, so value-per-kg climbs with depth (the cheapest ore still clears a dig's fuel cost, so a dig always nets a surplus). Scattered among the ore from the rockbed down is one GEMSTONE per band (Verdite/Roselite/Aurite — none in the topsoil), a GENUINELY RARE find (well under 1% of a band's tiles — never several on screen at once), worth 3× and weighing 2× that band's signature ore (Argenite/Voltite/Pyronium), drawn as a faceted CUT JEWEL clearly distinct from the ore smears — a rich but heavy prize that behaves like ore otherwise (slotted, weighed, sold). Weight is a SEPARATE limit (what the jetpack must lift, above), not a cap on how many pieces fit. Selling the cargo at the Ore Market is the ONLY Credit source; Credits are spent at the Upgrade Shop on seven tracks (fuel tank, drill, cargo bay, hull, jetpack, radiator, scanner), each five tiers bought in order at the pinned prices, and on the rocket. Starting Credits are 0; the loop is dig → fill cargo → climb → sell → refuel/repair → upgrade → deeper."
weight = 1
domain = "simulation"
proof = "surface"

[[review_item]]
id = "materials-scanner"
title = "Guaranteed-but-hidden exotic materials and the scanner"
text = "Two buried materials — Resonite in the Rockbed band, Cryenite in the Deepstone band — are placed at RANDOM positions within their band but GUARANTEED to exist there (the Terraria model), and are located by an always-on SCANNER that points (direction + distance) to the nearest material the player still needs, within a range set by the scanner tier. Materials ride in a separate satchel — never sold, weighing nothing and never filling the cargo bay. A run can never be soft-locked by an unlucky map. Because the mine is wider than the viewport (only ~16 of 32 columns on screen), a material off to one side is out of view until the scanner points the way and the player digs across — the scanner is a genuine tool, not a freebie."
weight = 1
domain = "simulation"
proof = "mine"

[[review_item]]
id = "hazards"
title = "Gas, lava, and impact hazards"
text = "The deep dig is a gauntlet with NO enemies — the mine itself is the adversary. Drilling into a gas pocket DETONATES it in a VIOLENT blast (a big produced explosion larger than the tile + a boom + a screen shake + a hull hit + a hard knockback — it should feel like a real mistake, not a weak puff) whose damage SCALES WITH DEPTH (~20 hull in the rockbed rising to ~120 near the Core). Gas is HIDDEN — a pocket is drawn with the same dirt texture as ordinary band rock, betrayed only by a SUBTLE produced gas-seep particle wisp fired over each on-screen pocket in round-robin turn (so a watched tile visibly breathes within a second or two, yet a hurried dig still misses it) — so it is a trap the player learns to read rather than a coloured tile they simply see (deliberately unlike lava). The FIRST gas detonation and the FIRST lava burn each raise a one-time, dismissible, non-blocking alert card explaining the 'random' hull loss. Lava is unminable, plainly visible, and drains hull fast on contact, so it must be routed around (it never fully seals the way down); it is drawn dirt-fringed so it meets rock through dirt, not a hard square seam. Both gas and lava damage are cut by the RADIATOR tier (0%–80%), so the deep bands demand hull AND radiator investment. Landing too fast deals impact hull damage scaled to the excess speed, rewarding feathering the descent. Gas appears from the rockbed down and lava from the deepstone down, denser and more damaging with depth."
weight = 1
domain = "simulation"
proof = "core-run"

[[review_item]]
id = "core-run-timer"
title = "The unstable Core Sample and its 90-second timer"
text = "At the bottom (the Core chamber past the coreshell's lava) the miner extracts the unstable CORE SAMPLE, which starts a 90-second destabilization countdown that does NOT pause. It must be hauled up and installed as the Ignition Core before the timer expires; if it expires it DETONATES for lethal damage (killing the miner — the deliberate replacement for a boss fight). Dying while carrying it DESTROYS the sample regardless of mode, so a failed core run means returning for a fresh one. The timer forces the fuel/hull upgrades to be in place first."
weight = 1
domain = "simulation"
proof = "core-run"

[[review_item]]
id = "rocket-victory"
title = "The five-component escape rocket is the only win"
text = "Winning means fabricating and installing five rocket components at the Launch Pad, in order: Hull Frame and Fuel Cells (Credits only), Guidance Unit (Credits + 1 Resonite), Thruster Assembly (Credits + 1 Cryenite), and Ignition Core (Credits + the Core Sample). Because the deep parts cannot be bought at any price, the shallows alone can't win — the rocket forces the full descent. Fabricating consumes the Credits and the material and visibly adds the part to the rocket on the pad; installing all five enables LAUNCH → Victory. There is no boss and no other ending."
weight = 1
domain = "simulation"
proof = "surface"

[[review_item]]
id = "modes-death"
title = "Standard vs Hardcore modes change only death"
text = "After NEW EXPEDITION, a MODE SELECT offers Standard and Hardcore, each stating its death rule. There is NO respawn and NO dropped cache in either mode: a death ends the run at a Game Over summary screen. In STANDARD, the save survives — if one exists, Game Over offers CONTINUE FROM SAVE to restore the last save; in HARDCORE, death DELETES the save (permadeath, Game Over → PLAY AGAIN fresh). Everything else — world, economy, hazards, goal — is identical across modes, and the Core Sample never survives a death, while installed rocket parts always do."
weight = 1
domain = "simulation"
proof = "game-over"

[[review_item]]
id = "save-continue-inventory"
title = "Explicit save, continue, and the inventory"
text = "Saving is EXPLICIT and RESTRICTED: the surface SAVE PAD is the only way to save (no autosave, no saving underground), there is exactly ONE save slot (saving overwrites it), and a CONTINUE entry appears on the main menu when a save exists and resumes it exactly. Saving is refused while carrying the unstable Core Sample. The single save is the game's one piece of persisted progress and drives the death rules (Standard restores from it; Hardcore deletes it). Separately, the INVENTORY (cargo hold) opens anywhere — surface or mid-dig (I / the BAG control) — showing each ore held with its count and weight, the slots/load readout, and a per-ore DROP that ditches one unit (lost, not sold) so an overloaded miner can shed weight. Drilling an ore vein with the bay full by slots must NOT hard-lock — the tile clears and the ore is simply left behind."
weight = 1
domain = "simulation"
proof = "surface"

# --- Presentation & Character Animation ------------------------------------------
[[review_item]]
id = "produced-miner-animation"
title = "The produced, animated miner (the headline)"
text = "The prospector is drawn from sprite-sheet cycles the build PRODUCED with draw-sheet, and it visibly ANIMATES a distinct cycle for each thing it does — idle (a breathing/lamp bob), walk, drill-down, drill-side, jetpack-ascend (with a flame flicker), fall, hurt (a sharp flinch on damage), and out-of-fuel slump — mirrored to face left/right, with a consistent suited silhouette and its drill and jetpack across the set. This is half of what the build is judged on: a stiff, single-frame miner is a failed build, not a placeholder to excuse."
weight = 1
domain = "presentation"
proof = "loop"

[[review_item]]
id = "produced-environment"
title = "Produced band tiles, ore, materials, and hazards"
text = "The four band rock tiles (topsoil earth, rockbed stone, deepstone, red-glowing coreshell) — each drawn from SEVERAL tile variants chosen per cell so a wall of one band does NOT visibly repeat a single texture, and each a roughly UNIFORM dirt grain (not a few large clear blotches that look patchy) — the bedrock border, the UNBREAKABLE STONE boulder (a distinct harder-looking material), the carved tunnels (rendered inset with a dirt lip and rounded corners so a shaft is slightly narrower than a full tile, joins its neighbors orthogonally, and stays separate from diagonally-touching holes), the six ore veins (each an embedded SMEAR of its mineral run through the dirt, spreading to the tile edges, NOT a discrete dot on top), the three GEMSTONES (Verdite, Roselite, Aurite — each a faceted CUT JEWEL, visually distinct from the ore smears and from the material crystals), the two material nodes (Resonite, Cryenite) and the glowing core, the DRILL-DAMAGE crack overlay (frames that deepen with the cut), and the dirt-fringed lava tile are all drawn from sprites the build produced with draw/draw-sheet (the lava shimmering), in the palette — so the band a player is in, an ore vein against plain rock, a faceted gemstone against an ore smear, a material against ore, an unbreakable boulder against diggable rock, and lava against safe ground all read at a glance. Gas has NO distinct tile (it uses the band rock, hidden). Not flat rectangles, a single repeated tile, or ad-hoc canvas fills."
weight = 1
domain = "presentation"
proof = "mine"

[[review_item]]
id = "produced-buildings-rocket"
title = "Produced surface buildings and the assembling rocket"
text = "The six surface buildings (Fuel Depot, Ore Market, Save Pad, Upgrade Shop, Supply Depot, Launch Pad) are produced sprites that read clearly as what they are on the scrapped surface under the dusk sky, and the escape ROCKET on the pad visibly GAINS each installed component as it is fabricated (assembly-stage frames or stacked per-component sprites) from bare pad to launch-ready — the player's win-progress read and a bespoke centerpiece asset."
weight = 1
domain = "presentation"
proof = "surface"

[[review_item]]
id = "produced-vfx"
title = "Produced particle VFX"
text = "The subtle gas seep (the faint tell over a hidden gas pocket), drill debris, jetpack exhaust, ore sparkle, material shimmer, gas explosion, lava embers, impact dust, core extraction pulse, the big core detonation, the launch exhaust, and the death burst are particle systems the build authored with particle-2d and plays live through @test-cabinet/particle-runtime's canvas binding — simulated bursts fired at the moment and position of each event, VARYING shot to shot, not flat flashes or hand-coded loops. The gas seep in particular is SUBTLE but must actually READ against the grey rock (the only tell that hidden gas is there — faint enough a hurried dig misses it, opaque enough a watching eye catches it); the gas explosion, core detonation, and launch exhaust read as dramatic, produced effects."
weight = 1
domain = "presentation"
proof = "core-run"

[[review_item]]
id = "produced-audio"
title = "Produced sound and music"
text = "The mine has real audio the build produced with the audio tools: a drill loop, a jetpack thrust loop, an ore pickup, a material chime, a gas explosion, a lava sizzle, an impact thud, a purchase/fabricate confirm, a launch roar, a death cue, and the low-fuel and core-timer alarms (sfx-synth and/or sfx-sample), plus a lonely industrial descent music bed (music), played via Web Audio on the matching events and looping the bed — not silence, and not a downloaded or hand-oscillated stand-in. Audio does not autostart before the player interacts, and a mute toggle is present."
weight = 1
domain = "presentation"
proof = "core-run"

[[review_item]]
id = "readable-hud"
title = "Readable HUD, scanner, and panels"
text = "A player can tell at a glance — Fuel and Hull (turning to the alert color as they run low), the cargo as SLOTS used/capacity with the load in kg alongside (turning to alert when the bay is full and reading OVERLOAD when the haul is too heavy for the jetpack to lift), Credits, Depth in meters, and which materials are in the satchel — and read the SCANNER indicator (direction + distance to the nearest needed material), shown ONLY when the scanner is locked on to something in range (no idle 'no signal' clutter otherwise), the prominent CORE-SAMPLE COUNTDOWN while carrying it, the INVENTORY overlay (held ore + weights + per-ore DROP), and the surface panels (the Ore Market cargo breakdown, the Upgrade Shop's seven tracks and prices, the Supply Depot's field supplies, the Launch Pad rocket checklist — while the Save Pad saves directly with no menu). The HUD, scanner, countdown, panels, and tile grid are drawn in code in the palette; only their small icons may be produced sprites."
weight = 1
domain = "presentation"
proof = "surface"

# --- General (states, window fit) — no domain -----------------------------------
[[review_item]]
id = "states-complete"
title = "Game states"
text = "Every game state is reachable and behaves correctly: title menu (NEW EXPEDITION, HOW TO PLAY, plus CONTINUE when a save exists), mode select (Standard/Hardcore, or back to the menu), how-to-play, the live in-mine state with its HUD, the surface building panels (Fuel Depot, Ore Market, Upgrade Shop, Supply Depot, Launch Pad — while the Save Pad saves directly with no menu), and the inventory overlay, the Esc pause menu (resume/restart/quit to menu), Victory after a launch (run summary, PLAY AGAIN in the same mode, MENU), and Game Over on death (in Standard with a save: CONTINUE FROM SAVE + MENU; otherwise PLAY AGAIN + MENU). Each end screen shows the run summary."
weight = 1
proof = "title"

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The entire 1280x720 stage — the top status bar and the full mine viewport, all four edges — stays visible, fitted, and centered at any window size and pixel density, including on load before any input. The mine world is WIDER than the viewport (32 columns of 80px, ~16 on screen at once), so the camera follows the miner in BOTH axes — scrolling horizontally across the mine as well as vertically down the shaft — clamped so it never scrolls past the world's edges. Vertically the camera LEADS the miner's motion BY ITS SPEED rather than pinning it dead-centre, and the response is eased so slow motion barely shifts the view: a fast plunge down a shaft rides the miner toward the TOP of the view so what's below shows earlier; a brisk climb rides toward the BOTTOM; and a slow motion — including boring straight down, which is braced and barely moves — keeps the miner CENTRED (a slow descent must not jerk the view), easing back to centre at rest. The whole width can never be seen at once, which is what makes the scanner worth having."
weight = 1
