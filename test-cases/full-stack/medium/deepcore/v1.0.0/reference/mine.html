<!DOCTYPE html>
<!--
  Deepcore — live mine reference mockup (representative mid-dig frame).
  Canonical view slug: mine (common to every variant)
  Render at a 1280x720 viewport. See ../specs/overview.md (coordinate system, palette,
  stage layout), ../specs/world.md (the 48px tile grid, the four depth bands, the tile
  kinds, the bedrock border), ../specs/character.md (the miner: falls/thrusts/drills
  down-left-right-never-up, fuel & hull), ../specs/mining.md (ore veins, cargo, the two
  exotic materials + the scanner), ../specs/hazards.md (gas, lava), and ../specs/assets.md
  (these are stand-ins for PRODUCED band tiles, ore, the ANIMATED miner, and live
  particle VFX — drill debris here).

  This frame depicts a dig across a ROCKBED -> DEEPSTONE band transition: the miner has
  drilled a vertical shaft with two side branches, is braced mid-drill at the bottom of
  the shaft (drilling the tile below) with a drill-debris spray, and the scanner points
  off toward a Resonite node. Ore veins of several types, a Resonite crystal, a gas
  pocket, and a lava pool are scattered through the rock. The exact mine, ore scatter,
  and miner pose are ONE representative moment (../specs/world.md seeds the mine per
  game), not a strict pixel match. Objects in .mine use MINE-LOCAL coords (viewport
  starts at stage y=56).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deepcore — In the mine</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- ================= Top status bar ============================== -->
      <div class="topbar">
        <div class="stat">
          <span class="ico fuel">&#9679;</span>
          <div class="col"><span class="k">FUEL</span><span class="gauge fuel"><i style="width: 60%"></i></span></div>
          <span class="v">105</span>
        </div>
        <div class="stat">
          <span class="ico hull">&#9670;</span>
          <div class="col"><span class="k">HULL</span><span class="gauge hull"><i style="width: 80%"></i></span></div>
          <span class="v">80</span>
        </div>
        <div class="stat">
          <span class="ico cargo">&#9635;</span>
          <div class="col"><span class="k">CARGO</span><span class="v cargo">12 / 15</span></div>
        </div>
        <div class="stat">
          <span class="ico credits">$</span>
          <div class="col"><span class="k">CREDITS</span><span class="v credits">340</span></div>
        </div>
        <div class="stat">
          <span class="ico depth">&#8595;</span>
          <div class="col"><span class="k">DEPTH</span><span class="v depth">235 m</span></div>
        </div>
        <div class="stat">
          <div class="col"><span class="k">SATCHEL</span>
            <div class="satchel">
              <span class="mk res on">R</span>
              <span class="mk cry off">C</span>
            </div>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="ctrls">
          <div class="ctrl">&#10073;&#10073;</div>
          <div class="ctrl">&#128266;</div>
        </div>
      </div>

      <!-- ================= Mine viewport ============================== -->
      <div class="mine">
        <!-- Depth bands: rockbed above, deepstone below, with a visible seam. -->
        <div class="band rockbed" style="top: 0; height: 430px"></div>
        <div class="band deepstone" style="top: 430px; height: 234px"></div>
        <div class="band-seam" style="top: 430px"></div>

        <!-- The faint 48px tile grid over the produced rock. -->
        <div class="grid"></div>

        <!-- Unminable bedrock border (letterbox margin + edge columns). -->
        <div class="bedrock l"></div>
        <div class="bedrock r"></div>

        <!-- The carved shaft (col 12) + two side branches the miner dug. -->
        <div class="carve" style="left: 640px; top: 0; width: 48px; height: 408px"></div>
        <div class="carve" style="left: 400px; top: 144px; width: 288px; height: 48px"></div>
        <div class="carve" style="left: 640px; top: 240px; width: 288px; height: 48px"></div>

        <!-- Ore veins scattered through the rock (mix of types; value rises with depth). -->
        <div class="cell vein ferron" style="left: 256px; top: 96px"></div>
        <div class="cell vein cuprite" style="left: 832px; top: 96px"></div>
        <div class="cell vein argenite" style="left: 928px; top: 288px"></div>
        <div class="cell vein voltite" style="left: 784px; top: 480px"></div>
        <div class="cell vein adamite" style="left: 304px; top: 528px"></div>

        <!-- A Resonite material node embedded in the rockbed (a prize, not routine ore);
             the scanner is homing in on it. -->
        <div class="cell node resonite" style="left: 304px; top: 288px"><span class="xtal"></span></div>

        <!-- Hazards: a faintly glowing gas pocket, and a lava pool down in the deepstone. -->
        <div class="cell gas" style="left: 544px; top: 336px"></div>
        <div class="lava" style="left: 448px; top: 576px; width: 240px; height: 44px"></div>

        <!-- The miner, braced mid-drill at the bottom of the shaft, drilling the tile
             below. A produced, animated character in the real build; a stand-in here. -->
        <div class="miner drill-down" style="left: 641px; top: 356px">
          <span class="pack"></span>
          <span class="flame"></span>
          <span class="helmet"><span class="visor"></span></span>
          <span class="lamp"></span>
          <span class="torso"></span>
          <span class="leg a"></span>
          <span class="leg b"></span>
          <span class="drill"><span class="shaft"></span><span class="bit"></span></span>
        </div>

        <!-- Drill-debris VFX (produced particle system): rock chips off the bit. -->
        <div class="vfx debris" style="left: 664px; top: 456px"></div>

        <!-- The scanner indicator (drawn in code): an arrow + distance toward the
             nearest needed material. -->
        <div class="scanner" style="left: 470px; top: 372px">
          <span class="arrow">&#9664;</span>
          <span><span class="lbl">RESONITE</span> &middot; <span class="dist">30 m</span></span>
        </div>
      </div>
    </div>
  </body>
</html>
