# --- Produced Assets (human-judged) -------------------------------------------
[[review.categories]]
id = "presentation"
title = "Produced Assets"
[[review.categories.items]]
id = "miner-animation"
title = "The produced, animated miner (the headline)"
description = "The suited prospector is drawn from produced sprite-sheet cycles and visibly animates a distinct, characterful cycle for each thing it does — idle, walk, drill-down, drill-side, jetpack-ascend, fall, hurt, and out-of-fuel — mirrored to face its direction, with a consistent silhouette, drill, and jetpack across the set. A stiff, single-frame miner is a failed build."
validation = { script = "validation/presentation/miner-animation.mjs", outputs = [{ id = "states", name = "The miner in its several animation states", kind = "video" }] }
[[review.categories.items]]
id = "tiles-ore"
title = "Produced band tiles, ore, and gems"
description = "The four band rock tiles (each drawn from several variants so a wall does not repeat one texture, in a roughly uniform grain), the ten ore veins (each an embedded smear, distinguishable from one another), and the three faceted gemstones are drawn from produced sprites and read at a glance against one another."
[[review.categories.items]]
id = "tunnel-shaping"
title = "Carved-tunnel shaping"
description = "A carved tunnel is rendered inset with a dirt lip and rounded corners so a shaft is slightly narrower than a full tile, joins its neighbors orthogonally, and stays separate from diagonally-touching holes."
[[review.categories.items]]
id = "buildings-rocket"
title = "Produced buildings and the assembling rocket"
description = "The six surface buildings read clearly as what they are under the dusk sky, and the escape rocket on the pad visibly gains each component as it is fabricated, from bare pad to launch-ready."
[[review.categories.items]]
id = "buildings-placed"
title = "The six buildings sit on the surface, spread apart"
description = "The six surface buildings sit ON the surface — above the ground, under the open sky — never sunk into the ground, and each stands on its own stretch of camp: their footprints do not overlap and adjacent buildings leave clear ground between them (specs/world.md), read through the debug buildings() API."
validation = { script = "validation/presentation/buildings-placed.mjs", outputs = [{ id = "camp", name = "The six buildings laid out across the surface camp", kind = "image" }] }
[[review.categories.items]]
id = "vfx"
title = "Produced particle VFX"
description = "The produced particle systems fire at the moment and place of each event and vary shot to shot — the subtle-but-readable gas seep, drill debris, jetpack exhaust, ore sparkle, gas explosion, lava embers, impact dust, core extraction and detonation, launch exhaust, and death burst — played live rather than flat flashes or hand-coded loops."
