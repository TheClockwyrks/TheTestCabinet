# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "deepcore"

# Human-readable display name for this test case.
name = "Deepcore"

# Test type. Deepcore is a `full-stack` case: an end-to-end (playable-browser-game)
# case with one addition — the model under test must PRODUCE the game's own assets
# DURING the run, using the asset-generation binaries on the run image's `PATH`, and
# then build a game that uses them. It is NOT the older two-run pattern where a
# separate asset-gen run makes an asset a later game merely consumes; here one model
# both produces the art/animation/audio and builds the game around it. The `full-stack`
# type schedules the run onto the `test-cabinet-full-stack-2d` image, which carries
# exactly six binaries on `PATH` — `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`,
# `sfx-sample`, and `music` — and no others; every asset the game needs is produced
# with one of them (`specs/assets.md` is the production contract). A root identity
# field, so it sits above the first table.
type = "full-stack"

# Relative difficulty (easy | medium | hard), surfaced on the site. Deepcore is
# medium: it asks for a Motherload-style dig-and-build — a delta-time simulation of a
# character drilling and falling and jetpacking through a banded tile mine wider than
# the viewport over a both-axis scrolling camera, a fuel-and-hull budget and a
# weight-vs-lift jetpack model that make
# the descent a round-trip gamble, an ore-to-Credits economy with a seven-track upgrade
# shop, a guaranteed-but-hidden exotic-material hunt with a scanner, depth-scaling
# gas/lava/impact hazards (with a radiator), an unstable Core Sample
# on a countdown, a five-component escape-rocket win condition, Standard and Hardcore
# death modes, and multiple states — AND, on top of that, for the model to author every
# sprite, animation, particle effect, and sound the game plays, with the produced
# ANIMATED MINER CHARACTER as the headline. The interacting simulation plus a full
# asset-production pass make this a demanding medium case.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["mining", "resource-management", "2d"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A subterranean dig-and-build: drill a character down through banded rock, haul ore up \
against a jetpack-fuel budget to sell and upgrade, hunt two buried exotic materials \
with a scanner, and race an unstable core sample up from the bottom on a 90-second \
timer — all to fabricate a five-part escape rocket and launch — while you produce \
every asset, above all the animated miner across drilling, thrusting, falling, and \
hurt, with the on-PATH tools."""

# Site-facing prose describing the case, relative to this version folder. NOT seeded
# into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version folder),
# recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run (with
# the seeded specs and the selected variant) and handed to the model as the build
# instruction. Injects absolute in-container paths via template variables. The
# harness auto-prepends the standing full-stack asset-quality preamble to the
# rendered prompt, so this template does NOT restate a global quality directive.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Deepcore is a large build — a real-time mining simulation with tile physics,
# a fuel/hull/ore/Credits economy with weight-and-lift jetpack physics, a seven-track
# upgrade shop, a scanner-driven material hunt, depth-scaling hazards, an unstable-core
# timed climax, a five-part rocket win condition, two death
# modes, and multiple states, plus a full asset-production pass through six tools with an
# animated character at its center — so it gets eight hours: comfortably more than a
# healthy build needs while still bounding a runaway session.
max_runtime_hours = 8

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. `npm install` — NOT `npm ci` — because `packages` injects
# the `@test-cabinet/particle-runtime` `file:` dependency this build plays its produced
# particle systems with, and an engine run has its engine package vendored in the same
# way, so the lockfile is completed at seed time; the same command downloads the
# Playwright Chromium build (the base image ships the OS libraries Chromium links
# against, but not the browser binary), so the model can build the game and look at it
# in a browser without any further setup.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the whole
# point of a full-stack case: the model PRODUCES the game's art, animation, and audio
# itself, during the run, with the six binaries on the run image's `PATH` (see `type`
# above and `specs/assets.md`). Nothing pictorial is seeded, and no rendered mockup is
# shown to the model or to the reviewer: every piece of evidence a reviewer sees is
# captured by a validator from the build itself.

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and the
# seeded workspace `package.json` depends on it via its baked-in `file:` path, so the
# build imports it (its `/canvas` binding) like any other dependency and plays each
# produced `system.json` by simulating it live. The VFX — drill debris, jetpack exhaust,
# gas explosions, lava embers, ore sparkle, core extraction and detonation, launch
# exhaust, and death bursts — are all produced `particle-2d` systems played this way;
# see `specs/assets.md` for the consumption contract. It is declared for every engine:
# neither engine draws particles, and both hand the game a raw 2D context to play a
# produced system through. (A root key, so it must sit above the first `[table]`
# header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Deepcore offers a single `base` variant (the standard expedition), declared in its
# own file under `variants/`. Standard vs Hardcore is an IN-GAME MODE menu — it changes
# only what happens on death — not a variant, so there is no per-variant mode file; the
# single expedition / campaign start is folded into the common `specs/gameplay.md`, and
# the expedition is one and the same in both modes (`specs/modes.md`). Quick, Standard
# and Marathon are likewise a world-size choice made on the same in-game menu, not a
# variant. This list is a root key, so it must sit above the first `[table]` header
# below.
variants = [
  "variants/base.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced game
# is built on — the frame loop and the delta time it hands the game, the input actions a
# player drives it with, the audio bus, asset loading, and the on-screen diagnostics;
# one of them also owns rendering, a camera, and the gameplay framework. It is a *run
# dimension*, chosen per run alongside the model, the harness, and the variant, and
# recorded on the run; it is not a property of the game.
#
# Deepcore supports three, and the mine is the same under all of them. What differs is
# how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes the
#                     frame loop, the canvas fit, the keyboard input, the audio,
#                     the overlay, the scrolling camera transform, and the
#                     `window.__deepcore` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules around it
#                     (`src/constants.ts`, `src/main.ts`, and the `src/game.ts` the
#                     build writes, debug surface included). It owns the loop, the fit,
#                     the input, the audio and the overlay, but NOT rendering and NOT a
#                     camera, so the build still draws the mine itself and applies its
#                     own scroll transform to the 2D context it is handed.
#   - `structured-2d` vendors its framework engine the same way and seeds the same two
#                     modules; the build writes its game module — the game definition,
#                     its mode, its state, its actors, and the debug surface its
#                     instance's `initialize` returns. This engine owns rendering and a
#                     camera, so the vertical scroll down the shaft is the engine's
#                     camera rather than a transform the game applies.
# The game they describe is the same one, so the review items are the same for every
# engine and a score recorded under one is comparable with a score recorded under
# another; the specs and the validators branch only where the deliverable differs.
#
# `none` supplies no package and therefore carries no version, so it is named in the
# bare `engines` list; `simple-2d` and `structured-2d` each carry a range and are named
# in `[[engine]]` tables. `min_version` is the 1.0.0 API this specification and these
# validators are written against, and there is deliberately no `max_version`, so a later
# 1.x or 2.x from the host package store is accepted as it lands. Widening or moving a
# range means a new case version, so the pin is the statement that THIS spec set matches
# THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine ships
# its own documentation from its own package, and seeding puts it in the run for the
# model to read, so the specs seeded from this folder never restate an engine's API and
# never fall out of date when it changes.
#
# `engines` is a root key, so it must sit above the first `[table]` header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest configuration
# the `[toolchain]` commands below run against, an `index.html` holding the canvas, and
# a `package.json` declaring `@test-cabinet/particle-runtime` by its baked-in `file:`
# path. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no `src/`:
#                     the build writes its own frame loop, canvas fit, keyboard
#                     input, audio, diagnostics overlay, camera transform and
#                     `window.__deepcore` surface, and every figure the specification
#                     fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored in at
#                     seed time so the build imports it by its bare package name, and
#                     seeds the case-owned modules around the game: `src/constants.ts`
#                     (every figure this specification fixes, which a validator imports;
#                     the look is NOT among them) and `src/main.ts` (the browser entry).
#                     The build writes `src/game.ts`: the mine's state, the debug
#                     surface its `initialize` returns beside that state, and the game's
#                     update and render.
#   - `structured-2d` declares that engine in its `package.json` the same way and seeds
#                     the same two case-owned modules. The build writes `src/game.ts`:
#                     the game definition the engine drives — its mode, its live state,
#                     and its actors — and the debug surface its instance's `initialize`
#                     returns.
#
# The table must name EXACTLY the engines the case supports; the resolver checks both
# directions. The seeded files land at the run root (`workspaces/none/package.json`
# seeds to `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation into a
# served static site. These run verbatim from the build's repository root: dependencies
# are installed, then the static build is produced into `dist/`, `build/`, or `out/`.
# `npm ci` is deliberate — it requires the build to commit a `package-lock.json`, so the
# validated build installs exactly what the deploy will. Both commands are required;
# there are no defaults. The build must be self-contained: it bundles the committed
# produced assets without invoking the asset tools, which are on `PATH` only while the
# run is live (`specs/assets.md`).
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s install
# has completed. The seeded workspace ships the configuration each of these commands
# reads (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case fixed.
# The commands run host-side over the collected tree after the run's container is gone,
# so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does not
# compile is not reviewable. The other three are recorded and gate nothing — `test`
# additionally records the count and coverage the build's own suite reports, which is how
# a build that ships tests is told apart from one that ships none. Each is spelled `npx`
# rather than `npm run <script>` so the check is the case's own statement of what is run
# and does not depend on the model leaving the seeded scripts intact.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once here. It
# is reporter-side and never seeded; the seeded specification documents the surface
# independently, as an ordinary debugging feature the game needs (see
# `specs/instrumentation.md`). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its scenario
# through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface itself
# and installs it on `window.__deepcore` once the game has initialized, so the handle is
# what a person opening the console of such a build finds. An engine run has NO global at
# all: the build writes the surface, its `initialize` returns it — beside the state as
# `[state, debug]` under `simple-2d`, alone under `structured-2d` — and a caller reads it
# back off `engine.debug`. One handle, three ways to reach the same operations.
#
# There is deliberately no `tick_hz`. A validator now builds its own clock and advances
# it, rather than asking a case-wide rate to relate whole ticks back to real time, so the
# step size belongs to the validator and to the specification rather than to this table.
[instrumentation]
handle = "__deepcore"

# Common specs: seeded for EVERY run, at the `dest` path within the run workspace. The
# specification is decomposed by concern, one file per concern, and a spec is a
# Handlebars template ONLY where it branches on the selected engine: the overview (what
# the runtime hands the build and what the build writes), the mine's camera (the engine's
# own under `structured-2d`, the game's transform otherwise), the controls (raw key codes
# under `none`, registered actions under an engine), the asset contract (who loads a file
# and who owns the audio cues), the debug surface (three ways of reaching the same
# operations), and the showcase (a `.webm` clip under `none`, an engine replay otherwise).
# The rest are engine-invariant and seed verbatim. A spec's `dest` defaults to its
# `source` with a trailing `.hbs` stripped, so these need only name the source they seed.
[[spec]]
source = "specs/overview.md.hbs"

[[spec]]
source = "specs/world.md.hbs"

[[spec]]
source = "specs/character.md"

[[spec]]
source = "specs/mining.md"

[[spec]]
source = "specs/hazards.md"

[[spec]]
source = "specs/upgrades.md"

[[spec]]
source = "specs/rocket.md"

[[spec]]
source = "specs/gameplay.md"

[[spec]]
source = "specs/ui.md"

[[spec]]
source = "specs/modes.md"

[[spec]]
source = "specs/controls.md.hbs"

# The six single-use FIELD SUPPLY items (explosives, teleporters, nanobots, emergency fuel)
# bought at the SUPPLY DEPOT building and used in the mine, plus the Core Sample JETTISON
# with its GROUND ITEM (a one-way discard, not re-collectable) and location-aware detonation.
[[spec]]
source = "specs/items.md"

# The asset-production contract: every asset the game needs, which of the six on-PATH
# binaries produces it, where it lands in the workspace, and how it is wired into the
# build. This is the defining spec of a full-stack case, and its animated-miner section
# is the headline of what this build is judged on.
[[spec]]
source = "specs/assets.md.hbs"

# The debugging and automation surface every build exposes: a deterministic, render-free
# core; an API to drive and inspect the game from code through its own real input path;
# and a read-only debug overlay. Framed as an ordinary developer affordance of the game.
# The `[instrumentation]` table above names the same handle for the reporter, and the
# review items below drive it.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing description
# and a short ordered carousel of captured media under `showcase/`, which the variant's
# `showcase` key mirrors for the case itself.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`. Nothing pictorial is seeded as
# a target to match, no build is asked to screenshot itself, and no screen is scored
# against a baseline image: what a reviewer sees is captured by the validators below.

# Scoring domains. The reviewer rates each independently while playing the build, and
# the run's overall rating is the WORST across them — a flawless mining sim cannot mask
# a stiff, un-produced miner, and a gorgeous animated character cannot mask a mine that
# does not dig or an economy that cannot be won. Domains are case-level; a graded review
# item names the domains its failure lowers, and its `failure_cap` states how far.
[[domain]]
id = "simulation"
name = "Mine & Expedition Systems"
description = "How the mine actually plays: drilling and thrusting through the banded tile mine on a fuel budget that makes every dig a round-trip gamble, the weight-and-lift model that decides how much of a haul the jetpack can carry home, the ore and gemstone economy funding the seven-track upgrade shop, and the depth bands and their hazards gating the descent. It also covers the run's arc — the scanner-found materials, the timed Core Sample, the five-component escape rocket that is the only win, and the surface save with its Standard and Hardcore death modes."

[[domain]]
id = "presentation"
name = "Presentation & Character Animation"
description = "What the build looks and sounds like, above all the ANIMATED MINER and its distinct idle, walk, drill, jetpack, fall, hurt, and out-of-fuel cycles. Alongside it, the tool-produced band tiles, ore veins and gemstones, hazards, surface buildings, and the escape rocket that visibly assembles, plus the produced particle VFX and audio, and the in-code HUD, scanner, core countdown, and building panels that present them."

# Reviewer checklist, common to the (single) variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name grouping
# the points a reviewer grades — and each `[[review.categories.items]]` under it is one graded
# review item, worth one point (the default weight), so a category is worth the number of items
# it holds. A category carries no prose of its own; each item states its own requirement in
# `description`. The recorded verdict id is the COMPOSITE `<categoryId>.<itemId>`. The checklist
# is reporter-side material — never seeded into a run, so the model never sees it; each item
# restates a requirement the seeded specification already states.
#
# This version is VALIDATOR-RATED: it declares its starter projects per engine (`[workspaces]`
# above), so EVERY graded point below carries `validation`, `domains` and `failure_cap`, and
# resolution names any point that does not. Nothing here is left to a person to decide. A point
# whose requirement could not be settled objectively is not a graded point at all — how GOOD the
# miner animation feels, how handsome the tiles and buildings are, how the music sits under the
# game: those are the run-wide aesthetic rating's, and they are absent from this list rather than
# sitting in it as a point no validator could decide.
#
# `validation.script` names a suite RELATIVE TO `validation/<engine>/`, and the SAME relative
# path must resolve inside every engine's validator project — a point decided under one engine
# and left undecided under another would be the same case graded two ways. Each suite poses its
# own isolated world through the debug surface `specs/instrumentation.md` fixes, exercises one
# observable behavior in one direction, and asserts against a figure the SPECIFICATION states
# plus an honest tolerance, never against whatever the reference happens to do.
#
# `outputs` are the evidence a reviewer sees beside the verdict, synthesized against the
# reference baseline: `replay` for a drive (the engine's own draw-command recording, armed
# around the scenario), `image` for a posed frame. Video is legal and is not used here.
#
# `domains` names the scoring domains a failure lowers, and `failure_cap` is the best functional
# rating those domains keep while the point fails: `broken` (the game cannot be played as
# intended), `scuffed` (a rule the game is built on is noticeably wrong, or normal play is
# unpleasant), `passable` (a tolerance, a ceiling, an edge case or a secondary path), `great` (a
# cosmetic detail). Each domain takes the LOWEST cap among its failing points, and a domain with
# no failing point is flawless; `flawless` is therefore never a cap.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# expedition is driven and inspected from code, and every other suite on this
# checklist poses its scenario through it. These points check that it is really
# there, really wired to the running game, and really deterministic. A surface that
# reports a plausible-looking object unconnected to what is on screen is the failure
# mode worth naming, and it shows up as every other suite failing to run.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug and automation surface is present"
description = "Every operation specs/instrumentation.md names is present as a function on the surface, reached on the page as window.__deepcore in an engineless build and off engine.debug in an engine build, and the surface is live: setTile poses a cell, tileAt reads that cell back, setMinerPosition moves the miner, and both the snapshot and the drawn frame change to match."
domains = ["simulation", "presentation"]
failure_cap = "broken"
# Automated validation: reflect that every required operation is installed as
# a function (setAutoStep, advance, keyDown, keyUp, press and setMuted under
# none alone), then prove liveness by posing a cell and the miner and reading
# the snapshot and the canvas back.
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "state", name = "The driven in-mine state", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed expedition carrying cargo, a material, a live Core Sample, a scanner lock and a drill in progress, the snapshot reports version DEEPCORE_DEBUG_VERSION (1) and every field specs/instrumentation.md lists with its documented type, including the nested camera, miner, cargo, satchel, tiers, items, rocket, scanner and noticesFired objects."
domains = ["simulation"]
failure_cap = "broken"
# Automated validation: pose an expedition exercising every branch of the
# shape and hold each reported field against the documented shape, field by
# field.
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The posed expedition the snapshot reports", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-resting-values"
title = "Fields the current state does not use report their resting values"
description = "The shape is fixed whatever the screen: summary is null until the expedition ends, coreTimer and coreGround are null while no Sample is live, panel is null while no panel is open, notice is null while no card is armed, and menuIndex rests at 0 on in-mine. No field goes missing."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: read the snapshot on a fresh in-mine expedition and on
# the title screen and hold each unused field against the resting-values list
# in specs/instrumentation.md.
validation = { script = "instrumentation/snapshot-resting-values.test.ts", outputs = [
  { id = "resting", name = "The expedition at rest whose snapshot is read", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-derived"
title = "The derived snapshot figures follow their sources"
description = "depthMeters follows the miner position, overloaded follows loadKg against liftLimitKg, and drilling.progress runs 0 to 1 as the target cell health drains, so each moves when its source moves rather than being stored independently."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: pose the miner, the cargo and a partly cut cell in
# turn and read each derived field back against the formula
# specs/instrumentation.md states for it.
validation = { script = "instrumentation/snapshot-derived.test.ts", outputs = [
  { id = "derived", name = "A cut in progress whose derived figures are read", kind = "replay" },
] }
[[review.categories.items]]
id = "tile-at-outside-the-grid"
title = "A cell outside the grid reads as bedrock"
description = "tileAt on a column or row outside the grid returns kind bedrock with band, ore, material, health and maxHealth all null, rather than throwing or returning nothing."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: read tileAt at negative coordinates, past WORLD_COLS
# and past coreRow, and hold each result against the documented out-of-grid
# shape.
validation = { script = "instrumentation/tile-at-outside-the-grid.test.ts", outputs = [
  { id = "edge", name = "The mine at the border the read walks off", kind = "image" },
] }
[[review.categories.items]]
id = "set-world-size-extends-the-mine"
title = "A deeper world size leaves a mine that reaches the new depth"
description = "setWorldSize to a deeper size moves coreRow and leaves the mine emptied to that depth, so a row past the old Core chamber is an in-grid open tunnel that carries a band and takes a pose, the bedrock border stands beside it and the Core sits at (CORE_COL, coreRow)."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: take the size from quick to marathon, read a row past
# the old coreRow as an in-grid tunnel, pose it and read the posed cell back
# at its band's full health, then read the border and the Core chamber.
validation = { script = "instrumentation/set-world-size-extends-the-mine.test.ts", outputs = [
  { id = "deeper", name = "The mine extended to a Marathon depth", kind = "image" },
] }
[[review.categories.items]]
id = "set-world-size-shrinks-the-mine"
title = "A shallower world size drops the rows past the new depth"
description = "setWorldSize to a shallower size drops every row past the new coreRow, so a row that held generated terrain now reads with the documented out-of-grid shape, and what is left is the empty mine at the new depth with the Core at (CORE_COL, coreRow)."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: generate a marathon mine, take the size to quick, read
# a deep row back as bedrock with every other field null and a shallow row as
# open tunnel.
validation = { script = "instrumentation/set-world-size-shrinks-the-mine.test.ts", outputs = [
  { id = "shallower", name = "The mine cut back to a Quick depth", kind = "image" },
] }
[[review.categories.items]]
id = "posing-outside-the-domain-fails"
title = "A pose aimed outside the stated domain fails loudly"
