# --- Hazards ------------------------------------------------------------------
# The mine as the adversary. Each hazard is posed in a cleared world with the
# miner given only the faculties the requirement exercises, so a gas figure is read
# off one detonation and a lava figure off one contact rather than off whatever a
# descent happened to meet. The radiator appears twice because it reduces two
# separate drains, and its non-effect on gas is a point of its own.
[[review.categories]]
id = "hazards"
title = "Hazards"
[[review.categories.items]]
id = "gas-detonates"
title = "A gas pocket detonates instead of clearing cleanly"
description = "A gas pocket takes drill hits exactly as its band rock does, and when its health reaches 0 it detonates rather than clearing quietly. The cell becomes an open tunnel either way."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: pose a gas pocket under the miner in a cleared band,
# cut it through and read the hull dropped and the cell left as tunnel.
validation = { script = "hazards/gas-detonates.test.ts", outputs = [
