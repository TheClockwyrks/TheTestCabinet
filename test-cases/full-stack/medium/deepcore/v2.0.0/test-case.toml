# --- The Mine and the Camp ----------------------------------------------------
# The fixed geometry every other suite poses its scenario inside: the tile grid and
# its coordinate space, how depth is reported, where the borders and the Core
# chamber sit, which band a row belongs to and how much health that band gives a
# cell, and where the six camp buildings may stand. Nothing here is generated;
# these are the invariants of the world at every seed and every size.
[[review.categories]]
id = "world"
title = "The Mine and the Camp"
[[review.categories.items]]
id = "grid-geometry"
title = "A cell occupies its stated rectangle"
description = "The cell (col, row) occupies world x in [col * TILE, col * TILE + TILE] and y in [row * TILE, row * TILE + TILE] with TILE 80, so a miner dropped down a one-column shaft comes to rest with its feet exactly on the top of the first solid cell beneath it."
