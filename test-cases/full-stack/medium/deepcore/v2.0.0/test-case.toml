# --- Produced Assets ----------------------------------------------------------
# The half of a full-stack case the model produces rather than codes. Every point
# here decides something objective about a file on disk or about the game reaching
# for it: how many distinct frames a produced cycle carries, whether the drawn
# frame actually changes when the state does, whether a named particle system was
# played in response to the event it belongs to. How GOOD the art is stays the
# run-wide aesthetic rating; what is scored here is that the work was done, the
# files are real, and the game is wired to them.
