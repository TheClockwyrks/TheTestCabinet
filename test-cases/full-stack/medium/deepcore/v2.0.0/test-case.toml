# at known cells so the scanner is read against a distance rather than against
# whatever the generator placed, and every branch of the targeting rule is its own
# point.
[[review.categories]]
id = "materials"
title = "Materials and the Scanner"
[[review.categories.items]]
id = "material-takes-no-slot"
title = "A material takes no cargo slot and no weight"
