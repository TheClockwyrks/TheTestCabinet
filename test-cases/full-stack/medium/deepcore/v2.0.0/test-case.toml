# --- The Mine on Screen -------------------------------------------------------
# The part of the picture the game draws in code around the produced sprites. This
# case fixes no palette, no font and no layout on purpose, so the points here are
# the presentation facts the specification does fix: the stage fitted whatever the
# window is, one kind of cell telling itself from another, the shaping of a carved
# tunnel, and a screen shake that never moves the simulation. How good the mine
# looks is the run-wide aesthetic rating, not scored here.
[[review.categories]]
id = "rendering"
title = "The Mine on Screen"
[[review.categories.items]]
id = "stage-fit"
title = "The stage is fitted and centered"
description = "Over surfaces wider than the stage, taller than it, and at a raised device pixel ratio, the whole STAGE_W x STAGE_H (1280 x 720) stage is inside the surface at its own aspect ratio, centered with even letterboxing, and the bars carry the stage background color within an RGB distance of 25 of 441."
domains = ["presentation"]
failure_cap = "passable"
# Automated validation: size the surface wider, taller and at a raised ratio in
# turn; hold the drawn stage extent, aspect and centering at each, and sample a
# bar against the stage background the build fixes. The fit itself is the
# runtime's under an engine, but the bar color is the build's either way: it is
# the `BACKGROUND` src/game.ts exports under an engine, and the color the build
# clears to without one.
validation = { script = "rendering/stage-fit.test.ts", outputs = [
  { id = "fit", name = "The stage fitted in an off-aspect window", kind = "image" },
] }
[[review.categories.items]]
id = "bands-are-distinguishable"
title = "The four bands read as different rock"
description = "The four bands rock is drawn distinctly: sampling the interior of a rock cell in each band, the mean colors of each band and the band below it are at least an RGB distance of 30 apart, so a player descending reads the change of depth off the wall."
domains = ["presentation"]
failure_cap = "passable"
# Automated validation: pose a rock cell in each band, sample the interior of
# each drawn cell and hold each consecutive pair of mean colors at least 30
# apart. Consecutive, because a band runs hundreds of rows and only two bands
# that meet are ever on screen together.
