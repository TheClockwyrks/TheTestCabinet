# --- Credits, the Depot and the Shop ------------------------------------------
# Where Credits come from and where they go. Each sink is posed with a known
# balance so the price is read off the balance rather than inferred, and the two
# refusal paths (maxed out, unaffordable) are their own points because a build that
# lets an unaffordable purchase through breaks the loop the whole game rests on.
[[review.categories]]
id = "economy"
title = "Credits, the Depot and the Shop"
[[review.categories.items]]
id = "selling-is-the-only-source"
title = "Credits rise only at the Ore Market"
description = "Nothing but a sale adds Credits: mining, refuelling, using a field supply, dying and launching all leave the balance where it stood or lower it."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: pose a balance, drive a cut, a refuel, an item use and
# a death in turn and read the balance never rising outside a sale.
validation = { script = "economy/selling-is-the-only-source.test.ts", outputs = [
  { id = "balance", name = "The balance held through a dig", kind = "replay" },
] }
[[review.categories.items]]
id = "fuel-price"
title = "Fuel is bought by the increment at its stated price"
description = "The Fuel Depot fixed increment buys FUEL_BUY_INCREMENT (25) units of fuel for FUEL_PRICE (1) Credit each, so it costs 25 Credits and raises the tank by 25."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: pose a part-empty tank and a known balance, buy the
# increment and hold both the fuel gained and the Credits spent.
validation = { script = "economy/fuel-price.test.ts", outputs = [
  { id = "buy", name = "A fuel increment bought", kind = "image" },
] }
[[review.categories.items]]
id = "fill-pays-only-for-what-is-missing"
title = "Filling to full pays only for the missing fuel"
description = "Fill-to-full charges FUEL_PRICE for each unit the tank is short and no more, so filling a tank at 40 of 100 costs 60 Credits."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: pose a part-empty tank with ample Credits, fill to
# full and hold the Credits spent against the shortfall.
validation = { script = "economy/fill-pays-only-for-what-is-missing.test.ts", outputs = [
  { id = "fill", name = "The tank filled to full", kind = "image" },
] }
[[review.categories.items]]
id = "fill-stops-at-the-credits"
title = "Filling to full stops when the Credits run out"
description = "Fill-to-full buys only as far as the Credits reach, so a miner with 20 Credits and a tank 60 short leaves with 20 more fuel and a balance of 0 rather than a refused purchase or a debt."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: pose a tank short by more than the balance can cover,
# fill to full and hold the fuel gained against the balance and the balance at
# 0.
validation = { script = "economy/fill-stops-at-the-credits.test.ts", outputs = [
  { id = "short", name = "A partial fill on a thin balance", kind = "image" },
] }
[[review.categories.items]]
id = "repair-price"
title = "Hull repair is bought by the increment at its stated price"
description = "The Fuel Depot fixed increment buys REPAIR_BUY_INCREMENT (25) points of hull for REPAIR_PRICE (2) Credits each, so it costs 50 Credits and raises the hull by 25, and repair-to-full pays only for the missing points and only as far as the Credits reach."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: pose a damaged hull and a known balance, buy the
# increment and then repair to full, holding the Credits spent at each step.
validation = { script = "economy/repair-price.test.ts", outputs = [
  { id = "repair", name = "Hull repaired at the depot", kind = "image" },
] }
[[review.categories.items]]
id = "upgrade-prices"
title = "The upgrade ladder charges its stated prices"
description = "The six five-tier tracks share the UPGRADE_PRICES ladder, 300, 750, 1900 then 4100 for the four steps, and the scanner takes the first two rungs of it, 300 then 750."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: buy each step on a five-tier track and both scanner
# steps from a known balance, holding each deduction against the ladder.
validation = { script = "economy/upgrade-prices.test.ts", outputs = [
  { id = "shop", name = "The Upgrade Shop and its prices", kind = "image" },
] }
[[review.categories.items]]
id = "upgrade-applies-at-once"
title = "A purchased tier applies immediately"
description = "A purchase deducts its price and takes effect at once: a stronger drill cuts with its new damage on the very next cut rather than on the next expedition."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: cut a posed cell at tier 1, buy the drill tier, cut an
# identical posed cell and hold the hits taken against the new tier.
validation = { script = "economy/upgrade-applies-at-once.test.ts", outputs = [
  { id = "drill", name = "The next cut after a drill upgrade", kind = "replay" },
] }
[[review.categories.items]]
id = "tank-upgrade-adds-its-difference"
title = "A tank upgrade raises the maximum and adds the same amount"
description = "Buying a fuel tank tier raises the maximum and adds the same amount to the fuel held, so a 100 to 175 tank at 30 of 100 becomes 105 of 175. It is not a refill."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: pose a part-empty tank, buy the next fuel tier and
# hold both the new maximum and the new fuel held against the stated
# arithmetic.
validation = { script = "economy/tank-upgrade-adds-its-difference.test.ts", outputs = [
  { id = "tank", name = "The tank after an upgrade", kind = "image" },
] }
[[review.categories.items]]
id = "hull-upgrade-adds-its-difference"
title = "A hull upgrade raises the maximum and adds the same amount"
description = "Buying a hull tier raises the maximum and adds the same amount to the hull held, on the same rule as the fuel tank, so it is not a free repair to full."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: pose a damaged hull, buy the next hull tier and hold
# both the new maximum and the hull held against the stated arithmetic.
validation = { script = "economy/hull-upgrade-adds-its-difference.test.ts", outputs = [
  { id = "hull", name = "The hull after an upgrade", kind = "image" },
] }
[[review.categories.items]]
id = "maxed-track-refused"
title = "A track at its top tier cannot be bought further"
description = "A track already at its highest tier, 5 on the six long tracks and 3 on the scanner, refuses a further purchase: the tier does not rise and no Credits are taken."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: set a track to its top tier with ample Credits,
# attempt the purchase and read the tier and the balance unchanged.
validation = { script = "economy/maxed-track-refused.test.ts", outputs = [
  { id = "maxed", name = "A maxed track refusing a purchase", kind = "image" },
] }
[[review.categories.items]]
id = "unaffordable-refused"
title = "A purchase beyond the Credits is refused"
description = "An upgrade, a field supply, a fuel increment or a rocket component the balance cannot cover is refused outright: nothing is bought and the balance is unchanged, rather than a partial purchase or a negative balance."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: pose a balance one Credit short of an upgrade and of a
# supply in turn, attempt each and read the tier, the count and the balance
# unchanged.
validation = { script = "economy/unaffordable-refused.test.ts", outputs = [
  { id = "refused", name = "A purchase refused on a thin balance", kind = "image" },
] }
[[review.categories.items]]
id = "unaffordable-controls-are-disabled"
title = "A purchase the balance cannot cover is drawn disabled"
description = "The Fuel Depot's two fixed increments are held to the whole of what they buy: each is drawn disabled one Credit short of FUEL_BUY_INCREMENT * FUEL_PRICE and of REPAIR_BUY_INCREMENT * REPAIR_PRICE, and drawn live at it, while fill-to-full is a separate control that stays live on any balance that buys a unit."
domains = ["simulation", "presentation"]
failure_cap = "passable"
# Automated validation: open the Fuel Depot with one row full and read the
# panel drawn either side of the other row's increment price, against a control
# pair the same one Credit apart ten Credits higher.
validation = { script = "economy/unaffordable-controls-are-disabled.test.ts", outputs = [
  { id = "disabled", name = "The increment disabled on a thin balance", kind = "image" },
] }
[[review.categories.items]]
id = "credits-never-negative"
title = "Credits never go negative"
description = "No sequence of purchases takes the balance below 0, so every sink refuses rather than borrowing."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: drive every sink in turn from a balance of 0 and from
# a balance just short of each price, and hold the balance at or above 0
# throughout.
validation = { script = "economy/credits-never-negative.test.ts", outputs = [
  { id = "zero", name = "The balance held at zero", kind = "image" },
] }
[[review.categories.items]]
id = "credits-survive-death"
title = "Banked Credits survive a death"
description = "Credits already earned survive a death in either mode, so a run is never set back to 0 Credits by dying."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: pose a balance, drive a death in each mode and read
# the balance carried into the game-over state.
validation = { script = "economy/credits-survive-death.test.ts", outputs = [
  { id = "banked", name = "The balance surviving a death", kind = "image" },
] }

# --- Materials and the Scanner ------------------------------------------------
