# --- The Camera ---------------------------------------------------------------
# The scrolling view down the shaft. The lead is the part a build gets wrong: it is
# driven by time rather than by speed, it unwinds faster than it builds, and it has
# no upper clamp because the sky is open. Each of those is its own point.
[[review.categories]]
id = "camera"
title = "The Camera"
[[review.categories.items]]
id = "centers-horizontally"
title = "The camera centers the miner horizontally"
description = "camX is clamp(mx - VIEW_W / 2, 0, WORLD_W - VIEW_W), so the miner sits on the horizontal center of the viewport wherever the clamp allows it."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: pose the miner at several columns in the middle of the
# world and hold camera.x against the formula at each.
validation = { script = "camera/centers-horizontally.test.ts", outputs = [
  { id = "center", name = "The miner centered in the view", kind = "image" },
] }
[[review.categories.items]]
id = "horizontal-clamp"
