slug = "arc-foundry"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Arc Foundry"

# Test type. Arc Foundry is a `full-stack` case: an end-to-end (playable-browser-game)
# case with one addition — the model under test must PRODUCE the game's own assets
# DURING the run, using the asset-generation binaries on the run image's `PATH`, and
# then build a game that uses them. It is NOT the older two-run pattern where a
# separate asset-gen run makes an asset a later game merely consumes; here one model
# both produces the art/effects/audio and builds the game around it. The `full-stack`
# type schedules the run onto the `test-cabinet-full-stack-2d` image, which carries
# exactly six binaries on `PATH` — `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`,
# `sfx-sample`, and `music` — and no others; every asset the game needs is produced
# with one of them (`specs/assets.md` is the production contract). A root identity
# field, so it sits above the first table.
type = "full-stack"

# Relative difficulty (easy | medium | hard), surfaced on the site. Arc Foundry is
# medium: it asks for a GemTD-style tower defense — a real-time simulation of the Load
# pathfinding an ORDERED-WAYPOINT maze (with 4-tile waypoint platforms) across three
# chosen maps with a never-seal rule, a random scrap-press build with
# the place-and-reveal stamp, the keep-one-per-level rule, inert blockers, a quality-combine
# climb and an UPGRADE QUALITY track over a five-rung quality ladder, eight base component
# types (seven firing plus a non-firing support Regulator) with automatic targeting and
# traveling electrical projectiles, a dozen recipe-assembled COMBINATION TOWERS with exotic
# abilities (splash/chain/slow/burn/crit/multishot/aura), a scarce Charge / Grid
# Integrity economy (free placement, no interest), an escalating wave campaign that ends in a Dynamo boss, an in-game
# Easy/Medium/Hard difficulty menu,
# and multiple states — AND, on top of that, for the model to author every sprite,
# animation, particle effect, and sound the game plays, with the produced ELECTRICAL VFX
# as the headline. The interacting simulation plus a full asset-production pass make this
# a demanding medium case.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["tower-defense", "strategy", "2d"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
An electro-industrial GemTD: place rocks at a scrap-press that roll a random salvaged \
electrical component (one of eight base types) at a random quality tier on placement, \
keep exactly one per level firing while the rest harden into inert blockers, climb the \
Scrap-to-Tesla-Prime ladder by quality-combining matches, fold whole recipes of parts \
into a dozen exotic COMBINATION TOWERS, and refine the press with UPGRADE QUALITY — while \
every rock is also a maze wall the Load must crawl around an ordered chain of waypoint \
platforms, and you produce every sprite, arc, chain-lightning, discharge, and sound with \
the on-PATH asset tools."""

# Site-facing prose describing the case, relative to this version folder. NOT seeded
# into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version folder),
# recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run (with
# the seeded specs and the selected variant) and handed to the model as the build
# instruction. Injects absolute in-container paths via template variables. The
# harness auto-prepends the standing full-stack asset-quality preamble to the
# rendered prompt, so this template does NOT restate a global quality directive.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Arc Foundry is a large build — a real-time GemTD simulation with waypoint
# mazing, a random scrap-press build loop over a five-rung quality
# ladder, eight base component types plus a dozen recipe-assembled combination towers,
# three maps, an in-game difficulty menu, a dozens-of-waves
# campaign, and multiple states, plus a full asset-production pass through six tools — so
# it gets eight hours: comfortably more than a healthy build needs while still bounding a
# runaway session.
max_runtime_hours = 8

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. `npm install` — NOT `npm ci` — because `packages`
# injects the `@test-cabinet/particle-runtime` `file:` dependency this build plays
# its produced particle systems with, so the lockfile is completed at seed time; the
# same command downloads the Playwright Chromium build (the base image ships the OS
# libraries Chromium links against, but not the browser binary), so the model can
# build and verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the
# whole point of a full-stack case: the model PRODUCES the game's art, effects, and
# audio itself, during the run, with the six binaries on the run image's `PATH` (see
# `type` above and `specs/assets.md`). Nothing pre-made is handed to the build, and
# no picture of the finished game is seeded either: every requirement reaches the
# model as prose in `specs/`.

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and
# the seeded workspace `package.json` depends on it via its baked-in `file:` path, so
# the build imports it (its `/canvas` binding) like any other dependency and plays
# each produced `system.json` by simulating it live. The electrical VFX — the build
# spark, combine flash, arc bolts, chain-lightning, spark sprays, discharge rings,
# impacts, deaths, and the leak alarm — are all produced `particle-2d` systems played
# this way; see `specs/assets.md` for the consumption contract. (A root key, so it
# must sit above the first `[table]` header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Arc Foundry offers a single `base` variant (the standard SALVAGE campaign),
# declared in its own file under `variants/`. Difficulty (Easy / Medium / Hard) is an
# IN-GAME menu — it changes only the wave count and enemy toughness — not a variant, so
# there is no per-variant mode file; the campaign is one and the same at every
# difficulty (`specs/difficulty.md`). This list is a root key, so it must sit above the
# first `[table]` header below.
variants = [
  "variants/base.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the input
# actions a player drives it with, the audio bus, asset loading, and the on-screen
# diagnostics; one of them also owns rendering and the gameplay framework the game
# is written inside. It is a *run dimension*, chosen per run alongside the model,
# the harness, and the variant, and recorded on the run; it is not a property of
# the game.
#
# Arc Foundry supports three, and the game is the same foundry under all of them.
# What differs is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the frame loop, the canvas fit, the keyboard and pointer
#                     input, the audio, asset loading, the overlay and the
#                     `window.__foundry` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules around
#                     it (`src/constants.ts`, `src/main.ts`, and the `src/game.ts`
#                     the build writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds the same
#                     two case-owned modules; the build writes its game module — the
#                     game definition, its mode, its state and its actors — and the
#                     debug surface its instance's `initialize` returns.
# Neither engine supplies pathfinding, collision response, or a seeded random
# source, so the maze router, the never-seal test, the projectile flight and the
# scrap-press roll are the build's own work under every one of the three. The game
# they describe is the same one, so the review items are the same for every engine
# and a score recorded under one is comparable with a score recorded under another;
# the specs and the validators branch where the deliverable differs.
#
# `none` supplies no package and therefore carries no version, so it is named in the
# bare `engines` list; `simple-2d` and `structured-2d` each carry a range and are
# named in `[[engine]]` tables. A range is pinned because a specification is written
# against a runtime contract: `min_version` is the 1.0.0 API the specs and the
# validators are written against, and there is deliberately no `max_version`, so a
# later 1.x or 2.x from the host package store is accepted as it lands. Widening or
# moving a range means a new case version, so the pin is the statement that THIS
# spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes.
#
# `engines` is a root key, so it must sit above the first `[table]` header below.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the canvas, and a `package.json` declaring the produced-effect runtime
# (`packages`, above) as a baked-in `file:` dependency. What differs is how much of
# the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     keyboard and pointer input, audio, asset loading, the
#                     diagnostics overlay and the `window.__foundry` surface, and
#                     every figure the specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules. The build writes
#                     `src/game.ts`: the game definition the engine drives — its
#                     mode, its live state, and its actors — and the debug surface
#                     its instance's `initialize` returns.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults. The build
# must be self-contained: it bundles the committed produced assets without invoking the
# asset tools, which are on `PATH` only while the run is live (`specs/assets.md`).
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. A full-stack build is written in TypeScript, and the seeded
# workspace ships the configuration each of these commands reads (`tsconfig.json`,
# `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so what is checked
# here is the code the model wrote against configuration the case fixed. The
# commands run host-side over the collected tree after the run's container is gone,
# so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none. Each
# is spelled `npx` rather than `npm run <script>` so the check is the case's own
# statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents the
# surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its scenario
# through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__foundry` once the game has initialized, so the
# handle is what a person opening the console of such a build finds. An engine run
# has NO global at all: the build writes the surface, its `initialize` returns it —
# beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view, its
# surface is written in the shape of `update`: a pose takes the current state and
# returns the next, applied through `engine.apply`, and a reading takes the state
# and returns what it read. `structured-2d` holds the world live, so its poses take
# only their own arguments and act on it at the call, and its readings return plain
# data. One handle, three ways to reach the same operations.
#
# There is deliberately no `tick_hz`, and the case fixes no step size at all. Every
# rate the specification states is per second and integrated against the delta time
# the frame loop hands each update (`specs/controls.md`), so an interval of simulation
# time reaches the same state however it was divided into frames, and a validator
# builds whatever clock its scenario wants.
[instrumentation]
handle = "__foundry"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed one concern to a file: the overview, the
# yard grid and the three maps, the pathing and mazing model, the Load, the base
# components, the combination towers, the scrap-press build loop, the economy, the
# campaign and its finale, the difficulties, the HUD, the screens and menus, the
# controls, the asset-production contract, the debugging surface, and the showcase the
# finished game ships. A spec's `dest` defaults to its `source` (with a trailing `.hbs`
# stripped), so an `.md.hbs` source seeds to the same `.md` path and a plain `.md`
# source is seeded verbatim.
#
# A spec is a Handlebars template only where it actually branches. `overview.md.hbs`
# (the runtime layer the build is handed, and which files it writes) is the only one in
# this group that does; everything the simulation specs fix is the same whatever the
# build stands on.
[[spec]]
source = "specs/overview.md.hbs"

[[spec]]
source = "specs/yard.md"

[[spec]]
source = "specs/pathing.md"

[[spec]]
source = "specs/enemies.md"

[[spec]]
source = "specs/components.md"

[[spec]]
source = "specs/combinations.md"

[[spec]]
source = "specs/scrap-press.md"

[[spec]]
source = "specs/economy.md"

[[spec]]
source = "specs/campaign.md"

[[spec]]
source = "specs/difficulty.md"

# The heads-up display: the status bar, the build panel and its inspector, the two
# read-only overlays, and what is drawn over the yard itself. Seeded verbatim: what the
# panel carries is the same whatever the build stands on.
[[spec]]
source = "specs/hud.md"

# The screens, what each menu contains and where each choice leads, and the twelve audio
# cues. It branches on the engine only for where a cue is defined and played: the
# runtime layer the build writes under `none`, the engine's cue bus otherwise.
[[spec]]
source = "specs/ui.md.hbs"

# How a player operates the game: how simulation time advances, the pointer, the
# registered actions and their keys, and what each control commits. It branches on the
# engine for which layer owns the frame loop and delivers the pointer.
[[spec]]
source = "specs/controls.md.hbs"

# The asset-production contract: every asset the game needs, which of the six
# on-PATH binaries produces it, the exact path it lands at under `assets/`, and how it
# is wired into the build. Seeded for every variant so the produced-asset review items
# and this spec stay in lockstep. It is the defining spec of a full-stack case. It
# branches on the engine for how a produced file is loaded (the build's own
# page-relative loading under `none`, the engine's asset loader under a fixed root
# otherwise) and for how a cue is played.
[[spec]]
source = "specs/assets.md.hbs"

# The debugging and automation surface every build must expose: a deterministic core;
# an API to pose and read the game from code through its own real systems; and a
# read-only debug overlay. Framed as an ordinary developer affordance of the game. It
# branches on the engine for how the surface is reached, for the shape each operation
# takes, and for the clock and input operations only an engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing description
# and a short ordered carousel of captured media under `showcase/`, framed as the game's
# store-page presentation. It branches on the engine for how motion is captured.
[[spec]]
source = "specs/showcase.md.hbs"

# Scoring domains. A validator-rated version rates each independently, and the run's
# overall rating is the WORST across them — flawless GemTD systems cannot mask crude,
# un-produced art, and gorgeous produced VFX cannot mask a maze that does not path.
# Every graded item below names the domains its failure lowers, and each domain takes
# the LOWEST `failure_cap` among its failing items; a domain with no failing item is
# flawless.
#
# Arc Foundry is a full-stack case, so the assets the model PRODUCES during the run
# are first-class dimensions rather than a footnote on the code: `presentation`
# carries the drawn sprites, the animation cycles and the twelve electrical particle
# systems alongside the in-code HUD that presents them, and `audio` carries the twelve
# produced cues on their own, so a build that plays the game well and ships no sound
# is told apart from one that ships sound and cannot path.
[[domain]]
id = "simulation"
name = "Gameplay"
description = "How the foundry actually plays: the three ordered-waypoint maps and the maze the player builds across them, the random scrap-press build loop and its keep-one-per-level harvest, the quality and recipe combines, the components and their targeting and abilities, the Load, the Charge / Grid Integrity economy, the wave campaign, and difficulty."

[[domain]]
id = "presentation"
name = "Visuals"
description = "What the build looks like: the tool-produced component, combination-tower, blocker, projectile, and Load sprites across the quality ladder, the four-frame animation cycles, the yard art, the twelve produced electrical particle systems, and the in-code status bar, build panel, overlays, screens, and yard reads that present them."

[[domain]]
id = "audio"
name = "Audio"
description = "What the build sounds like: the twelve cues the run produced with the synthesis, sampling, and music tools, each played on the event it belongs to, told apart by ear, and silenced together by the mute control."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name
# grouping the points that are graded — and each `[[review.categories.items]]` under
# it is one graded review item, worth `weight` points (default 1), so a category is
# worth the number of items it holds. A category carries no prose of its own; each
# item states its own requirement in `description`. This is reporter-side material —
# never seeded into a run, so the model never sees it; each item restates a
# requirement the seeded specification already states.
#
# This version is VALIDATOR-RATED, because the case declares its starter projects per
# engine in `[workspaces]` above. Every point therefore carries three things and
# resolution rejects the manifest if any is missing:
#
#   - `validation`, naming a suite inside the validator project. The path is relative
#     to `validation/<engine>/`, NOT to this folder, and the SAME relative path must
#     resolve under all three engines: a point decided under one engine and left to a
#     person under another would be the same case graded two ways. Nothing here is
#     left to a person: a requirement either carries an assertion a machine can decide
#     or it is not a graded point at all, and how good the art, the effects and the
#     sound are is the run-wide aesthetic rating's rather than a validator's.
#   - `domains`, naming which of the three scoring domains above a failure lowers.
#   - `failure_cap`, the best functional rating those domains keep while the point
#     fails: `broken` (the game cannot be played as intended), `scuffed` (a rule the
#     game is built on is noticeably wrong, or normal play is unpleasant), `passable`
#     (a tolerance, a ceiling, an edge case, or a secondary path — the keyboard
#     accelerators of `specs/controls.md` are one, since every control is operable
#     with the pointer alone), or `great` (a cosmetic detail). `flawless` is never a
#     cap.
#
# Each `outputs` entry is the evidence a reviewer sees beside the reference baseline:
# a `replay` is the draw-command recording a validator takes off the frame it drove,
# and an `image` is a still of the frame it read. This case leans on stills more than
# a reflex-driven one does, because most of what it fixes is read off a posed yard
# rather than off motion.
#
# The items are narrowly scoped — ONE observable behavior each — and the edge cases
# the specification's own rules imply are points of their own rather than warnings in
# the prose: a weaker slow landing on a stronger one, a chain with nothing left to
# leap to, a placement that would strand a unit already on the yard, each of the six
# situations `back` resolves against. The count is high by design: it is what lets a
# grade say WHICH requirement a build failed rather than which area it failed.
# Together they taxonomize the whole specification — the debug surface, the yard and
# its placement rules, pathing and the maze, the scrap-press loop, the quality ladder
# and refinement, firing, targeting and the abilities, the combination towers, the
# Load, the campaign and its finale, difficulty, the screens, the controls and the
# pointer, the status bar, the build panel and the overlays, and the produced sprites,
# animation cycles, electrical effects and audio.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug and automation surface is a deliverable of the build, not a courtesy: it
# is how the yard is posed and read from code, and every other suite on this
# checklist establishes its scenario through it. These points check that it is
# really there, really wired to the running game, and really deterministic. A
# surface that reports a plausible-looking object unconnected to what is on the
# yard is the failure mode worth naming, and it shows up as every other suite
# failing to run as well.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug and automation surface is present"
description = "Every operation specs/instrumentation.md names is present as a function on the surface — reached on the page as window.__foundry in an engineless build and off engine.debug in an engine build — and the surface is live: placeComponent stands a Capacitor on the yard, snapshot reports it in structures, and the rendered frame changes."
domains = ["simulation", "presentation", "audio"]
failure_cap = "broken"
# Automated validation: reflect that every required operation is installed as
# a function (the clock and input operations under `none` alone), then prove
# liveness by standing a structure up, reading it back off the snapshot, and
# reading the canvas. See validation/<engine>/instrumentation/surface-
# present.test.ts.
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "posed", name = "The posed yard the surface stood a structure on", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed yard carrying a candidate, a component, a blocker, a combination tower, a live ground unit and a projectile in flight, the snapshot reports version FOUNDRY_DEBUG_VERSION (3) and every field specs/instrumentation.md lists with its documented type, each structures entry carrying its kind, type, quality, level, col, row, cx, cy, range, damage, fireRate, targeting, heading, firing, kills, damageDealt, auraRadius, auraBonus and abilities, and each units entry its id, type, x, y, hp, maxHp, speed, baseSpeed, flying, frozen, waypointIndex, progress, slowFactor, slowUntil, burnDps, burnUntil and invincible."
domains = ["simulation", "presentation", "audio"]
failure_cap = "broken"
# Automated validation: pose a yard exercising every branch of the shape and
# hold each reported field against the documented shape and its derivations.
# See validation/<engine>/instrumentation/snapshot-shape.test.ts.
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The posed yard the snapshot reports", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-resting-values"
title = "Fields the current screen does not use report their resting values"
description = "The shape is fixed whatever the screen: on the title screen phase is null, wave is 0, mazeRating is 0, selected and nextRoll are null, combineSet, units, structures and projectiles are empty, and held reads { active: false, col: 0, row: 0, legal: false }. No field goes missing."
domains = ["simulation"]
failure_cap = "passable"
# Automated validation: reset to the title and read every field of the
# resting-values table in specs/instrumentation.md. See
# validation/<engine>/instrumentation/snapshot-resting-values.test.ts.
validation = { script = "instrumentation/snapshot-resting-values.test.ts", outputs = [
  { id = "title", name = "The title screen whose snapshot is read", kind = "image" },
] }
[[review.categories.items]]
id = "reset-title-state"
title = "reset returns the game to its title-screen values"
description = "After a run has been driven — structures standing, Charge spent, refinement bought, a wave under way — reset({seed: 7}) restores the title screen with menuIndex 0, the map back to substation and the difficulty to medium, the yard emptied, the selection and combine set cleared, nothing held, the press unarmed, Charge at START_CHARGE (10), Grid Integrity at START_INTEGRITY (20), refinement 0, wave 0, stampsLeft at STAMPS_PER_LEVEL (5), the Maze Rating 0, speed 1, both overlays closed, the pause released and simTime 0."
domains = ["simulation"]
failure_cap = "broken"
# Automated validation: dirty every field first, then reset and hold the state
# against the full title-state list in specs/instrumentation.md. See
# validation/<engine>/instrumentation/reset-title-state.test.ts.
validation = { script = "instrumentation/reset-title-state.test.ts", outputs = [
  { id = "title", name = "The title state after reset", kind = "image" },
] }
[[review.categories.items]]
id = "reset-leaves-mute-and-pointer"
title = "reset leaves the mute bit and the pointer untouched"
