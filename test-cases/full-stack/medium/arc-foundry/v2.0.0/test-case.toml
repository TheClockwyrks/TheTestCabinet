[[review.categories.items]]
id = "panel-layout-stable"
title = "The inspector's controls never move on their own"
description = "Every action a selected structure can offer holds a fixed slot and is disabled rather than removed when it is momentarily unusable, so a change in game state the player did not trigger (a wave starting or ending, Charge accruing, a partner appearing) never adds, removes, or moves a control under the pointer."
validation = { script = "validation/controls/panel-layout-stable.mjs", outputs = [{ id = "panel", name = "The inspector's fixed action slots", kind = "image" }] }
[[review.categories.items]]
id = "advances-in-real-time"
title = "The game advances itself in real time"
description = "During normal play the game runs on its own: the animation-frame loop drives the fixed 60 Hz tick from the wall clock, so a live wave progresses — simulation time accumulates and the Load walks its route — without anything stepping it from outside."
validation = { script = "validation/controls/advances-in-real-time.mjs", outputs = [{ id = "released", name = "The instant a unit is released", kind = "image" }, { id = "advanced", name = "One second later, on the build's own clock", kind = "image" }] }

# --- Produced Art -------------------------------------------------------------
# The produced sprites, animations, VFX, and audio are what a full-stack case exists
# to measure, so each is decided by a validator that reads something objective off
# the running build rather than by a person looking at a picture.
[[review.categories]]
id = "presentation"
title = "Produced Art & Electrical VFX"
[[review.categories.items]]
id = "component-sprites"
title = "Produced component sprites across all five tiers"
description = "The eight base component types are drawn from produced sprites at each of the five quality tiers (a rotatable firing head on a fixed base; the Regulator a static support node), and the dozen combination towers each a unique gold-accented sprite — the tier reading by more than color."
[[review.categories.items]]
id = "blocker-candidate-read"
title = "Blocker, candidate, and kept component read apart"
description = "An inert blocker reads as unmistakably dead (a fused scrap rock, no head, no glow), and a still-selectable candidate reads as distinct from a kept firing component — not flat rectangles or ad-hoc fills."
[[review.categories.items]]
id = "load-and-yard"
title = "Produced, animated Load and yard art"
description = "The six Load types and the Dynamo are produced sprites that visibly animate (a charge/crackle cycle; the Filament airborne; the Dynamo an unstable wobble), and the yard art — substrate, feeder-vent Entry, grounding Collector, waypoint platforms, and Map C's housings — is produced too."
[[review.categories.items]]
id = "electrical-vfx"
title = "Produced electrical particle VFX (the headline)"
description = "The build spark, combine flash, arc bolt, chain-lightning, spark spray, discharge ring, slow snap, burn ember, aura pulse ring, impacts, death discharge, and leak alarm are produced particle systems simulated live through @test-cabinet/particle-runtime — varying shot to shot, not a flat flash or a hand-coded loop."
[[review.categories.items]]
id = "vfx-escalates"
title = "Firing VFX intensity escalates with quality"
description = "A firing effect's intensity escalates with the component's quality tier, so the quality ladder reads in the VFX as well as the sprite."
[[review.categories.items]]
id = "readable-hud"
title = "Readable board, HUD, and build panel"
description = "A player can tell at a glance — even at fast speed — each component's type and quality, read Charge, Grid Integrity, and the wave/BUILD indicator, and read the scrap-press, UPGRADE QUALITY, inspector, and next-wave-preview controls, all drawn in code in the palette."

# --- Audio --------------------------------------------------------------------
# Each mandated cue (specs/assets.md "Audio") is its own review item, decided
# automatically: a reporter-side Web Audio probe reads the sources the build has
# started (`api.audio`, see `validation/_helpers.mjs`'s `armAudio`/`audioCount`), so a
# check confirms a cue plays on its event without inspecting the sound itself — a build
# fails exactly the cue it omits, the same taxonomy floe's Audio category uses. The
# build must not autoplay, so each check arms audio with a real gesture (a key tap and
# a corner click) first. The exact timbre, the fire-cue-per-family distinctness, and
# the slow/burn status cues' quality stay for the reviewer; only that the matching
# produced clip is scheduled is scored here.
