description = "A quality-combine is offered on a base structure that has a matching partner and on nothing else: a Capacitor beside a Coil at the same tier, and a Scrap Capacitor beside a Tuned one, each offer no fold and a combine on either changes nothing."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: stand each mismatched pair in turn, read the offered
