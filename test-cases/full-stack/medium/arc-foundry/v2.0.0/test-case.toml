# --- Abilities ----------------------------------------------------------------
# Splash, chain, slow, burn and aura are what a yard's answer to a wave is built
# from, and each carries edge cases the general rules already imply: a weaker slow
# landing on a stronger one, a chain finding nothing left to leap to, several auras
# covering one structure. Each of those is its own point, so a failed grade names
# the edge case the build mishandled rather than the ability.
[[review.categories]]
id = "abilities"
title = "Abilities"
[[review.categories.items]]
id = "coil-chain-leaps"
title = "A Coil's hit leaps to the nearest unit it has not already struck"
description = "A Coil's projectile hits its primary target and the hit then leaps to the nearest unit it has not already struck within COIL_LEAP_RANGE (70) of the last unit struck, and again from there."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: park a line of frozen units 60 apart, fire one Coil
# shot, and read which units lost health. See
# validation/<engine>/abilities/coil-chain-leaps.test.ts.
validation = { script = "abilities/coil-chain-leaps.test.ts", outputs = [
  { id = "chain", name = "The chain leaping down the line", kind = "replay" },
] }
[[review.categories.items]]
id = "coil-chain-falloff"
