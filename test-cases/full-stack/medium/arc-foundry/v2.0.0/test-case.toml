description = "Each leap deals COIL_FALLOFF (0.7) times the previous hit's damage, so a Scrap Coil's 5 lands 5 on the primary, 3.5 on the first leap and 2.45 on the second."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: park a line of frozen units, fire one shot, and hold
# each unit's health loss against the falloff. See
