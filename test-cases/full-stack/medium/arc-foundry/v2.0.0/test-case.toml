# --- The yard and placement ---------------------------------------------------
# The grid, the footprint, and where a structure may stand. Every position in the
# game is measured against the tile geometry, so a yard drawn off the formula makes
# every hit test wrong. The placement conditions are the rules the build loop rests
# on, and each refusal is its own point so a failed grade names the condition a
# build mishandled.
[[review.categories]]
id = "yard"
title = "The yard and placement"
[[review.categories.items]]
id = "tile-centres"
title = "A structure sits on the tile centre the formula gives"
description = "A structure anchored at (col, row) reports its centre at (20 * (col + 1), 56 + 20 * (row + 1)), checked at the yard's corners and at its middle, so the grid is anchored at (0, 56) with TILE (20) square tiles."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: stand structures at four spread anchors and hold each
# reported cx and cy against the formula in specs/yard.md. See
# validation/<engine>/yard/tile-centres.test.ts.
validation = { script = "yard/tile-centres.test.ts", outputs = [
  { id = "grid", name = "Structures standing on the computed tile centres", kind = "image" },
] }
