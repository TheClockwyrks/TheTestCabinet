# --- Pathing and the maze -----------------------------------------------------
# The yard has no fixed track: the Load pathfinds, and every structure is a wall, so
# building is what lengthens the route. These points decide the route model, the
# never-seal rule that keeps the maze solvable, and the two ways the walls change.
# The never-seal refusals are two separate points because a build that guards the
# legs and forgets the units on the yard must grade differently from one that guards
# neither.
[[review.categories]]
id = "pathing"
title = "Pathing and the maze"
[[review.categories.items]]
id = "ordered-waypoints"
title = "The Load walks the waypoint chain in order"
description = "A ground unit released at the entry heads for WP1 first, then each waypoint in sequence, then the collector, where it grounds out and is removed. Its reported waypointIndex runs 1 through 7 without skipping a value and never decreases."
domains = ["simulation"]
failure_cap = "broken"
# Automated validation: release one ground unit on an empty yard and sample
# its waypointIndex across the whole walk. See
# validation/<engine>/pathing/ordered-waypoints.test.ts.
validation = { script = "pathing/ordered-waypoints.test.ts", outputs = [
  { id = "walk", name = "A unit walking the ordered waypoint chain", kind = "replay" },
] }
