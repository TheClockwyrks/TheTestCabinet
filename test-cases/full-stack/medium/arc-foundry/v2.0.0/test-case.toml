# --- The Load -----------------------------------------------------------------
# The roster's figures, the per-wave scaling, and the composition rules a wave
# obeys. The scaling is split from the rounding because a build that scales
# correctly and truncates instead of rounding is a different failure, and each
# composition rule is its own point.
[[review.categories]]
id = "load"
title = "The Load"
