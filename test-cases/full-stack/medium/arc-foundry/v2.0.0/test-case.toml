# --- Combining and the quality ladder -----------------------------------------
# Two matching rolls fold into one a tier higher, and that climb is where a run's
# power comes from. The points split the fold's preconditions from its result, and
# split the two kinds of combine by what they do to the phase, because a build that
# folds correctly but starts the wave on a plain combine plays a different game.
[[review.categories]]
id = "quality"
title = "Combining and the quality ladder"
[[review.categories.items]]
id = "combine-climbs"
title = "Two matching rolls fold into one a tier higher"
description = "Two base structures of the same type at the same quality fold into a single structure of that type one tier up: two Scrap Capacitors become one Tuned Capacitor, and the yard holds one fewer base structure and one more blocker."
domains = ["simulation"]
failure_cap = "scuffed"
# Automated validation: stand a matching pair, combine from one of them, and
# read the result and the consumed footprints back. See
# validation/<engine>/quality/combine-climbs.test.ts.
validation = { script = "quality/combine-climbs.test.ts", outputs = [
  { id = "fold", name = "The tier the fold produced", kind = "image" },
] }
[[review.categories.items]]
id = "combine-same-type-and-tier-only"
