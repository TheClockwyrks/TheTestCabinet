# --- The pointer, the menus and back ------------------------------------------
# The pointer is the path every screen and every control is fully operable through,
# and `back` resolves against a list of six situations in order. Each of those six
# is its own point, because a build that closes an overlay and cannot put a held
# rock away is a different failure from one that does neither.
