id = "cue-files-distinct"
title = "The eleven effect cues are eleven different sounds"
description = "No two of the eleven effect cue files are the same audio, so the events are told apart by ear rather than by one sound committed eleven times."
domains = ["audio"]
failure_cap = "great"
# Automated validation: decode the eleven files and compare their samples
# pairwise. See validation/<engine>/audio/cue-files-distinct.test.ts.
validation = { script = "audio/cue-files-distinct.test.ts", outputs = [
  { id = "run", name = "The run the cues were played over", kind = "replay" },
] }
