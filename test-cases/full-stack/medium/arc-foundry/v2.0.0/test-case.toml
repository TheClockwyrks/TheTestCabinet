# --- The scrap-press build loop -----------------------------------------------
# The defining loop: a rock is never chosen, it is rolled where it lands, and each
# level yields exactly one firing structure. Each rule of the loop is its own point,
# because a build that rolls on the pull rather than on the drop, or that lets a
# level harvest twice, is broken in a different way from one that miscounts the
# stamp allowance.
