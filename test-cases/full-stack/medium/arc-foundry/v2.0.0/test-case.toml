id = "playable-muted"
title = "The game plays identically with sound muted"
description = "With the mute bit engaged the same drive reaches the same state as an unmuted one — the same snapshot after the same calls and the same elapsed simulation — so nothing about the game depends on the audio being audible."
domains = ["audio"]
failure_cap = "passable"
# Automated validation: drive the same scenario muted and unmuted from the
# same seed and compare the two snapshots. See
# validation/<engine>/audio/playable-muted.test.ts.
validation = { script = "audio/playable-muted.test.ts", outputs = [
  { id = "muted", name = "The run driven with sound muted", kind = "replay" },
] }
