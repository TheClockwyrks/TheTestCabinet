# --- The campaign, the economy and the finale ---------------------------------
# What a run is: a build phase and the wave it launches, N times over, ending in the
# finale that produces the run's only score. The economy points sit here because
# every one of them is paid or spent by a campaign event, and each of the finale's
# rules is its own point because an Overload Dynamo that can be killed and one that
# costs Grid Integrity are different failures.
