# --- Firing and projectiles ---------------------------------------------------
# Every shot is a travelling projectile that carries the hit, so range, cadence and
# flight are three separate requirements a build can get wrong independently. The
# Regulator is the exception the specification names, and its two points are here
# because a Regulator that fires is a different failure from one that does not
# wall.
[[review.categories]]
id = "firing"
title = "Firing and projectiles"
[[review.categories.items]]
id = "fires-in-range"
title = "A structure fires at a unit inside its radius"
description = "A firing structure with a unit whose position lies within its range launches projectiles, and the structure reports firing true."
domains = ["simulation"]
failure_cap = "broken"
# Automated validation: stand a Capacitor, park a frozen unit inside its
# radius, advance, and count the projectiles that appeared. See
