description = "Each of the six types reports the speed, flying flag, bounty and leak value the roster fixes: a Mote at 60 and 1 and 1, a Spark at 120, a Slug at 38 with a leak of 2, a Cluster at 72, a Filament at 85 and flying, and a Dynamo at 30 with a bounty of 40 and a leak of 5."
