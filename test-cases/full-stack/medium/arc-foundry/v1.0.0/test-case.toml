slug = "arc-foundry"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Arc Foundry"

# Test type. Arc Foundry is a `full-stack` case: an end-to-end (playable-browser-game)
# case with one addition — the model under test must PRODUCE the game's own assets
# DURING the run, using the asset-generation binaries on the run image's `PATH`, and
# then build a game that uses them. It is NOT the older two-run pattern where a
# separate asset-gen run makes an asset a later game merely consumes; here one model
# both produces the art/effects/audio and builds the game around it. The `full-stack`
# type schedules the run onto the `test-cabinet-full-stack-2d` image, which carries
# exactly six binaries on `PATH` — `draw`, `draw-sheet`, `particle-2d`, `sfx-synth`,
# `sfx-sample`, and `music` — and no others; every asset the game needs is produced
# with one of them (`specs/assets.md` is the production contract). A root identity
# field, so it sits above the first table.
type = "full-stack"

# Relative difficulty (easy | medium | hard), surfaced on the site. Arc Foundry is
# medium: it asks for a GemTD-style tower defense — a fixed-step simulation of the Load
# pathfinding an ORDERED-WAYPOINT maze (with 4-tile waypoint platforms) across three
# chosen maps with a never-seal rule, a random scrap-press build with
# the place-and-reveal stamp, the keep-one-per-level rule, inert blockers, a quality-combine
# climb and an UPGRADE QUALITY track over a five-rung quality ladder, eight base component
# types (seven firing plus a non-firing support Regulator) with automatic targeting and
# traveling electrical projectiles, a dozen recipe-assembled COMBINATION TOWERS with exotic
# abilities (splash/chain/slow/burn/crit/multishot/aura), a scarce Charge / Grid
# Integrity economy (free placement, no interest), an escalating wave campaign that ends in a Dynamo boss, an in-game
# Easy/Medium/Hard difficulty menu,
# and multiple states — AND, on top of that, for the model to author every sprite,
# animation, particle effect, and sound the game plays, with the produced ELECTRICAL VFX
# as the headline. The interacting simulation plus a full asset-production pass make this
# a demanding medium case.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["tower-defense", "strategy", "2d", "gemtd"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
An electro-industrial GemTD: place rocks at a scrap-press that roll a random salvaged \
electrical component (one of eight base types) at a random quality tier on placement, \
keep exactly one per level firing while the rest harden into inert blockers, climb the \
Scrap-to-Tesla-Prime ladder by quality-combining matches, fold whole recipes of parts \
into a dozen exotic COMBINATION TOWERS, and refine the press with UPGRADE QUALITY — while \
every rock is also a maze wall the Load must crawl around an ordered chain of waypoint \
platforms, and you produce every sprite, arc, chain-lightning, discharge, and sound with \
the on-PATH asset tools."""

# Site-facing prose describing the case, relative to this version folder. NOT seeded
# into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version folder),
# recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run (with
# the seeded specs and the selected variant) and handed to the model as the build
# instruction. Injects absolute in-container paths via template variables. The
# harness auto-prepends the standing full-stack asset-quality preamble to the
# rendered prompt, so this template does NOT restate a global quality directive.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Arc Foundry is a large build — a fixed-step GemTD simulation with waypoint
# mazing, a random scrap-press build loop over a five-rung quality
# ladder, eight base component types plus a dozen recipe-assembled combination towers,
# three maps, an in-game difficulty menu, a dozens-of-waves
# campaign, and multiple states, plus a full asset-production pass through six tools — so
# it gets eight hours: comfortably more than a healthy build needs while still bounding a
# runaway session.
max_runtime_hours = 8

# Starter workspace seeded into the root of every run before the specs. It gives the
# model a baseline project to build on: a `package.json` that pins `playwright` as a
# dev dependency and declares the produced-effect runtime (`packages`, below) as a
# baked-in `file:` dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. `npm install` — NOT `npm ci` — because `packages`
# injects the `@test-cabinet/particle-runtime` `file:` dependency this build plays
# its produced particle systems with, so the lockfile is completed at seed time; the
# same command downloads the Playwright Chromium build (the base image ships the OS
# libraries Chromium links against, but not the browser binary), so the model can
# build and verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the
# whole point of a full-stack case: the model PRODUCES the game's art, effects, and
# audio itself, during the run, with the six binaries on the run image's `PATH` (see
# `type` above and `specs/assets.md`). The `reference/` mockups below are
# harness-side visual targets rendered via `[[reference]]`, not seeded game assets.

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and
# the seeded workspace `package.json` depends on it via its baked-in `file:` path, so
# the build imports it (its `/canvas` binding) like any other dependency and plays
# each produced `system.json` by simulating it live. The electrical VFX — the build
# spark, combine flash, arc bolts, chain-lightning, spark sprays, discharge rings,
# impacts, deaths, and the leak alarm — are all produced `particle-2d` systems played
# this way; see `specs/assets.md` for the consumption contract. (A root key, so it
# must sit above the first `[table]` header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Arc Foundry offers a single `base` variant (the standard SALVAGE campaign),
# declared in its own file under `variants/`. Difficulty (Easy / Medium / Hard) is an
# IN-GAME menu — it changes only the wave count and enemy toughness — not a variant, so
# there is no per-variant mode file; the campaign is one and the same at every
# difficulty (`specs/modes.md`). This list is a root key, so it must sit above the
# first `[table]` header below.
variants = [
  "variants/base.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults. The build
# must be self-contained: it bundles the committed produced assets without invoking the
# asset tools, which are on `PATH` only while the run is live (`specs/assets.md`).
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named once
# here so a review item's `validation` driver (and the validator that runs it) knows
# which `window` global to drive. The seeded specification documents the same handle
# independently as an ordinary game debug feature (see specs/instrumentation.md); this
# entry is reporter-side and never seeded.
[instrumentation]
handle = "__foundry"

# The fixed simulation rate, in Hz. Arc Foundry's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation runtime
# uses to relate that exact stepping back to real time — one tick is 1/60 of a
# second, so a second of game time is 60 ticks. It must match the timestep
# `specs/controls.md` mandates.
tick_hz = 60

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern: the overview, the board and
# maps, the Load, the components, the scrap-press build loop, the gameplay (the
# economy, Grid Integrity, the wave campaign and victory/overload, the post-final maze
# rating, the SALVAGE start, and the key behaviors), the UI (the game states, the
# required menus, the HUD, and out-of-scope), the difficulty and map/difficulty menus,
# the controls, the asset-production contract, the debugging surface, and the proof.
# All common specs are plain Markdown, seeded verbatim. A spec's `dest` defaults to its
# `source` (with a trailing `.hbs` stripped), so these need only name the source they
# seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/board.md"

[[spec]]
source = "specs/enemies.md"

[[spec]]
source = "specs/towers.md"

[[spec]]
source = "specs/build.md"

[[spec]]
source = "specs/gameplay.md"

[[spec]]
source = "specs/ui.md"

[[spec]]
source = "specs/modes.md"

[[spec]]
source = "specs/controls.md"

# The asset-production contract: every asset the game needs, which of the six
# on-PATH binaries produces it, where it lands in the workspace, and how it is wired
# into the build. Seeded for every variant so the produced-asset review items and
# this spec stay in lockstep. This is the defining spec of a full-stack case, and its
# electrical-VFX section is the headline of what this build is judged on.
[[spec]]
source = "specs/assets.md"

# The debugging and automation surface every build must expose: a deterministic,
# steppable core; a `window.__foundry` API to drive and inspect the game from code;
# and a read-only debug overlay. Seeded for every variant and framed as an ordinary
# developer affordance of the game.
[[spec]]
source = "specs/instrumentation.md"

# Proof of implementation: instructs the build to capture evidence at the exact paths
# the `[[proof]]` entries below declare. The paths in this spec and in the `[[proof]]`
# entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl build — the
# authored, correct game under `reference-impl/` — and served as-is (seeded into the
# run as a visual target, never rendered). See `reference/README.md` for how they are
# regenerated. The `title` view is variant-specific (declared per variant) because the
# menu differs by variant; `map-select`, `gameplay`, and `game-over` look the same in
# every variant.
[[reference]]
view = "map-select"
media = "reference/screenshots/map-select.png"

[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest` path
# (relative to the run workspace root) the build must write a screenshot or `.webm`
# clip to; `specs/proof.md` instructs the build to produce them at exactly these
# paths. Validation records whether each turned up (informational). The media kind is
# inferred from the extension: `.png` is an image, `.webm` a video (the format
# Playwright records natively; the public gallery transcodes it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "Live board"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Overload"
dest = "proof/game-over.png"

[[proof]]
id = "systems"
name = "Scrap-press build loop clip"
dest = "proof/systems.webm"

[[proof]]
id = "pressure"
name = "Late-wave pressure clip"
dest = "proof/pressure.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The reference
# screenshots are seeded as illustrative examples of the screens, not layouts to
# reproduce, so menus and screens are left to the model's design and are reviewed by
# a human rather than scored against a baseline. The automated load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build, and
# the run's overall rating is the WORST across them — flawless GemTD systems cannot
# mask crude, un-produced art, and gorgeous produced VFX cannot mask a maze that does
# not path. Domains are case-level; an individual review item rolls up to one through
# its optional `domain`, while a general item (states, window fit) omits it.
[[domain]]
id = "simulation"
name = "Gameplay"
description = "How the foundry actually plays: the three ordered-waypoint maps and the maze the player builds across them, the random scrap-press build loop and its keep-one-per-level harvest, the quality and recipe combines, the components and their targeting and abilities, the Load, the Charge / Grid Integrity economy, the wave campaign, and difficulty."

[[domain]]
id = "presentation"
name = "Visuals"
description = "What the build looks and sounds like: the tool-produced component, combination-tower, blocker, projectile, and Load sprites across the quality ladder, the yard art, the produced electrical particle VFX and audio, and the in-code HUD, map-select, and build panel that present them."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name
# grouping the points a reviewer grades — and each `[[review.categories.items]]`
# under it is one graded review item, worth `weight` points (default 1), so a
# category is worth the number of items it holds. A category carries no prose of its
# own; each item states its own requirement in `description`. This is reporter-side
# material — never seeded into a run, so the model never sees it; each item restates a
# requirement the seeded specification already states. An item with a `validation`
# script is decided automatically (a control-op / snapshot / rendered-pixel drive of
# window.__foundry, the reviewer may override); one without is reviewed by a person.
#
# The items are narrowly scoped — one observable behavior each — and taxonomize the
# whole spec: the maze and pathing, the economy, the scrap-press build loop, the
# quality ladder and Refinement, the components/targeting/abilities, the combination
# towers, the Load, difficulty, the game states, and the accelerator controls are all
# automated; the produced ART, VFX, and AUDIO — inherently visual/aural — stay
# human-judged (paired with the seeded references and the run's proof captures), as do
# the window-fit and the two feel-of-play captures.
[review]
format = 2

# --- Pathing & the Maze -------------------------------------------------------
[[review.categories]]
id = "pathing"
title = "Pathing & the Maze"
[[review.categories.items]]
id = "ordered-waypoints"
title = "The Load walks the waypoint chain in order"
description = "A ground unit spawned at the Entry heads to each waypoint platform in sequence (Entry, then WP1..WPk in order, then the Collector) and grounds out at the Collector — it never skips or reorders a waypoint."
validation = { script = "validation/pathing/ordered-waypoints.mjs", outputs = [{ id = "walk", name = "A unit walking the ordered waypoint chain", kind = "video" }] }
[[review.categories.items]]
id = "shortest-open-route"
title = "Building lengthens the shortest open route"
description = "Towers are walls: placing a rock across a leg lengthens the ground route the Load must take around it (the maze length rises), and the unit routes around the wall rather than through it."
validation = { script = "validation/pathing/shortest-open-route.mjs", outputs = [{ id = "reroute", name = "A wall lengthening the route", kind = "video" }] }
[[review.categories.items]]
id = "never-seal-refused"
title = "A placement that would seal a segment is refused"
description = "The never-seal rule: a placement that would fully seal a waypoint segment is refused and changes nothing (no candidate lands, the stamp allowance is unchanged), while a legal placement elsewhere is accepted."
validation = { script = "validation/pathing/never-seal-refused.mjs", outputs = [{ id = "refused", name = "The board after a refused seal and an accepted placement", kind = "image" }] }
[[review.categories.items]]
id = "no-build-on-waypoint"
title = "A waypoint platform is not buildable"
description = "A placement whose footprint would cover ANY tile of a 4-tile waypoint platform is refused — the anchor, either arm, or the stem — so a waypoint can never be walled off, and it is not merely the anchor tile that is protected."
validation = { script = "validation/pathing/no-build-on-waypoint.mjs", outputs = [{ id = "refused", name = "A refused placement on a waypoint platform", kind = "image" }] }
[[review.categories.items]]
id = "build-beside-waypoint"
title = "The tiles beside a waypoint platform are buildable"
description = "Only the platform's own four tiles are protected: a placement that merely touches the platform — hugging an arm, the anchor row, or the stem without covering any platform tile — is ACCEPTED, so the non-buildable zone is not dilated to the tiles around the waypoint."
validation = { script = "validation/pathing/build-beside-waypoint.mjs", outputs = [{ id = "beside", name = "Accepted placements hugging a waypoint platform", kind = "image" }] }
[[review.categories.items]]
id = "dismantle-repath"
title = "Dismantling a wall re-paths and shortens the route"
description = "Dismantling a structure frees its footprint and re-paths the floor: the ground route through the chain shortens back."
validation = { script = "validation/pathing/dismantle-repath.mjs", outputs = [{ id = "shorten", name = "The route shortening after a dismantle", kind = "video" }] }
[[review.categories.items]]
id = "flyer-ignores-maze"
title = "The Filament flyer ignores the maze"
description = "The Filament flies a straight line from the Entry through the waypoints to the Collector over the walls — heavy walls on the ground route do not divert or slow it."
validation = { script = "validation/pathing/flyer-ignores-maze.mjs", outputs = [{ id = "flyover", name = "The Filament flying straight over the walls", kind = "video" }] }
[[review.categories.items]]
id = "combine-wall-neutral"
title = "A combine is wall-neutral"
description = "A combine consumes its partner in place — the footprint hardens into a blocker rather than opening — so the maze length (the ground route) is unchanged across the combine."
validation = { script = "validation/pathing/combine-wall-neutral.mjs", outputs = [{ id = "neutral", name = "A combine leaving the maze wall intact", kind = "video" }] }
[[review.categories.items]]
id = "map-c-housings"
title = "Map C's transformer housings are fixed and unbuildable"
description = "On The Transformer Yard the two housing rectangles are pre-blocked and never buildable (a placement on a housing tile is refused), while the base waypoint route is open."
validation = { script = "validation/pathing/map-c-housings.mjs", outputs = [{ id = "housings", name = "A refused placement on a transformer housing", kind = "image" }] }
[[review.categories.items]]
id = "three-maps"
title = "Three maps with distinct waypoint topologies"
description = "The three maps (The Substation, The Switchyard, The Transformer Yard) define different ordered waypoint chains at pinned coordinates — chosen, not randomly generated — so they differ in topology, not in numbers."
validation = { script = "validation/pathing/three-maps.mjs", outputs = [{ id = "maps", name = "The three maps' waypoint layouts", kind = "image" }] }

# --- Economy & Grid Integrity -------------------------------------------------
[[review.categories]]
id = "economy"
title = "Economy & Grid Integrity"
[[review.categories.items]]
id = "kill-bounty"
title = "A kill pays its bounty in Charge"
description = "Destroying a unit pays exactly its bounty in Charge the instant it dies (a Mote pays 1)."
validation = { script = "validation/economy/kill-bounty.mjs", outputs = [{ id = "kill", name = "A kill paying its bounty", kind = "video" }] }
[[review.categories.items]]
id = "leak-integrity"
title = "A leak costs Grid Integrity"
description = "A unit that grounds out at the Collector costs the player its leak value in Grid Integrity (a Slug leaks 2)."
validation = { script = "validation/economy/leak-integrity.mjs", outputs = [{ id = "leak", name = "A unit leaking Grid Integrity", kind = "video" }] }
[[review.categories.items]]
id = "placement-free"
title = "Placing a rock is free"
description = "Placing a rock costs no Charge (GemTD-faithful): Charge is unchanged across a placement — the five-per-level stamp allowance is the only placement limit."
validation = { script = "validation/economy/placement-free.mjs", outputs = [{ id = "hud", name = "The build board after a free placement", kind = "image" }] }
[[review.categories.items]]
id = "wave-clear-bonus"
title = "Clearing a wave pays a small bonus"
description = "Clearing a wave pays a small flat wave-clear bonus in Charge (8 + 2*wave = 10 on Wave 1) and nothing else — there is no interest on banked Charge."
validation = { script = "validation/economy/wave-clear-bonus.mjs", outputs = [{ id = "hud", name = "Charge after a cleared wave", kind = "image" }] }
[[review.categories.items]]
id = "dismantle-no-refund"
title = "Dismantle refunds nothing"
description = "Dismantling a structure returns nothing — no Charge and no stamp — so the roll cannot be reclaimed and re-rolled."
validation = { script = "validation/economy/dismantle-no-refund.mjs", outputs = [{ id = "hud", name = "The board after a no-refund dismantle", kind = "image" }] }
[[review.categories.items]]
id = "overload-at-zero"
title = "Grid Integrity reaching zero overloads the run"
description = "When Grid Integrity is driven to 0 by a leak the run overloads and ends (the Overload/defeat screen), even mid-wave."
validation = { script = "validation/economy/overload-at-zero.mjs", outputs = [{ id = "overload", name = "The overload at zero Grid Integrity", kind = "video" }] }

# --- The Scrap-Press Build Loop -----------------------------------------------
[[review.categories]]
id = "build"
title = "The Scrap-Press Build Loop"
[[review.categories.items]]
id = "roll-on-placement"
title = "The roll happens when the rock lands"
description = "A rock rolls its component type and quality on placement (when it lands), not when the press is pulled — so re-seeded placements produce a varying spread of types across the eight."
validation = { script = "validation/build/roll-on-placement.mjs", outputs = [{ id = "roll", name = "Rocks rolling their component on placement", kind = "video" }] }
[[review.categories.items]]
id = "r0-only-scrap"
title = "The unrefined press rolls only Scrap"
description = "At Refinement R0 every placed rock rolls Scrap (T1) quality — the unrefined press hands out only the lowest tier."
validation = { script = "validation/build/r0-only-scrap.mjs", outputs = [{ id = "scrap", name = "R0 rolls landing only Scrap", kind = "image" }] }
[[review.categories.items]]
id = "type-uniform"
title = "The type roll spans all eight types"
description = "The component TYPE roll is uniform across the eight base types: over many re-seeded rolls, every one of the eight appears."
validation = { script = "validation/build/type-uniform.mjs", outputs = [{ id = "types", name = "The spread of rolled types", kind = "image" }] }
[[review.categories.items]]
id = "five-stamps-cap"
title = "Five stamps a level, capped"
description = "A level grants five stamps; a sixth placement is refused once the allowance is spent, and the cap is five regardless of how much Charge is held."
validation = { script = "validation/build/five-stamps-cap.mjs", outputs = [{ id = "cap", name = "The five-stamp allowance exhausted", kind = "image" }] }
[[review.categories.items]]
id = "cancel-free"
title = "Cancelling a held rock is free"
description = "Cancelling a held (un-dropped) rock costs no stamp and no Charge — the allowance is unchanged."
validation = { script = "validation/build/cancel-free.mjs", outputs = [{ id = "cancel", name = "A cancelled held rock costing nothing", kind = "image" }] }
[[review.categories.items]]
id = "stamp-onto-blocker"
title = "Stamping onto a blocker rerolls it"
description = "Dropping a rock onto an existing blocker rerolls that blocker into a fresh candidate in place."
validation = { script = "validation/build/stamp-onto-blocker.mjs", outputs = [{ id = "reroll", name = "A blocker rerolled into a candidate", kind = "video" }] }
[[review.categories.items]]
id = "keep-one-harvest"
title = "Keep exactly one; the rest harden into blockers"
description = "KEEPing a candidate takes exactly one firing component off the level, hardens every other candidate into an inert blocker, and launches the wave (there is no SEND)."
validation = { script = "validation/build/keep-one-harvest.mjs", outputs = [{ id = "harvest", name = "One kept, the rest hardened into blockers", kind = "video" }] }
[[review.categories.items]]
id = "combine-actions-only"
title = "Folding offers a quality climb and a recipe, and nothing else"
description = "The only two ways to fold pieces together are COMBINE (a matching same-type, same-quality pair climbs one quality tier) and COMBINE SPECIAL (a recipe multiset assembles a combination tower). No action folds a pair into a result of the same type and quality, which would spend a piece for no gain."
validation = { script = "validation/build/combine-actions-only.mjs", outputs = [{ id = "combine", name = "A matching pair climbing a quality tier", kind = "video" }] }
[[review.categories.items]]
id = "downgrade-keeps-lower"
title = "Downgrade keeps a candidate one tier lower"
description = "DOWNGRADE harvests the selected candidate as a firing component one quality tier lower and, being the harvest, launches the wave."
validation = { script = "validation/build/downgrade-keeps-lower.mjs", outputs = [{ id = "downgrade", name = "A candidate kept one tier lower", kind = "video" }] }
[[review.categories.items]]
id = "downgrade-restrictions"
title = "Downgrade applies only to a Tuned+ candidate"
description = "Only a candidate at Tuned (T2) or above can be downgraded; a Scrap (T1) candidate cannot, so the control is a fresh-roll-only correction."
validation = { script = "validation/build/downgrade-restrictions.mjs", outputs = [{ id = "restrict", name = "A Scrap candidate refusing to downgrade", kind = "image" }] }

# --- The Quality Ladder -------------------------------------------------------
[[review.categories]]
id = "quality"
title = "The Quality Ladder"
[[review.categories.items]]
id = "combine-climbs"
title = "A quality-combine climbs one tier"
description = "Folding two matching pieces (same type and quality) produces one component a tier higher at the initiating piece's footprint, and the consumed partner hardens into a blocker."
validation = { script = "validation/quality/combine-climbs.mjs", outputs = [{ id = "climb", name = "Two Scrap pieces combining a tier higher", kind = "video" }] }
[[review.categories.items]]
id = "teslaprime-terminal"
title = "Tesla-Prime is the quality apex"
description = "A Tesla-Prime (T5) piece offers no quality-combine — the top rung cannot climb further."
validation = { script = "validation/quality/teslaprime-terminal.mjs", outputs = [{ id = "apex", name = "Two Tesla-Prime pieces that will not combine", kind = "image" }] }
