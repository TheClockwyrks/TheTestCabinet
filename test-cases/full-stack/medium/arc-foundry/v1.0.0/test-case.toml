# Scoring domains. The reviewer rates each independently while playing the build, and
# the run's overall rating is the WORST across them — flawless GemTD systems cannot
# mask crude, un-produced art, and gorgeous produced VFX cannot mask a maze that does
# not path. Domains are case-level; an individual review item rolls up to one through
# its optional `domain`, while a general item (states, window fit) omits it.
[[domain]]
id = "simulation"
name = "Foundry Systems"
description = "The interacting GemTD systems: the map select and its three ordered-waypoint maps (The Substation's edge-hugging serpentine, The Switchyard's center-crossing star, The Transformer Yard's fixed housings), each waypoint a 4-tile non-buildable platform, the Load pathfinding the shortest OPEN route around the walls between consecutive waypoints with live re-pathing and the never-seal rule, the random scrap-press build (a rock that rolls a random component type at a random quality ON PLACEMENT, five stamps a level, keep exactly one and the rest harden into inert blockers), the quality-combine climb up the Scrap-to-Tesla-Prime ladder and the UPGRADE QUALITY refinement track, the recipe-combine that folds a multiset of base parts into one of a dozen terminal COMBINATION TOWERS, the eight base component types (seven firing plus the non-firing Regulator support aura) with their firing identities and automatic targeting, the ability vocabulary (slow, burn, crit, multishot, aura) the combos carry, the Load roster with its every-fourth-wave Filament flyer and Dynamo boss, the scarce Charge / Grid Integrity economy (free placement, no interest), the escalating wave campaign, and the in-game Easy/Medium/Hard difficulty that changes only wave count and enemy toughness."

[[domain]]
id = "presentation"
name = "Presentation & Electrical VFX"
description = "The genuinely tool-produced assets and how the build presents them: the eight base component sprites across all five quality tiers (finish escalating pitted-Scrap to mirror-chromed Tesla-Prime, a rotatable head over a fixed base — the Regulator drawn as a non-firing support node) plus the dozen gold-accented combination-tower sprites, the inert blocker rock, and the traveling projectiles, the six Load types with their charge-cycle animations, the airborne Filament, and the seething Dynamo, the yard art (substrate, feeder-vent Entry, grounding Collector, 4-tile waypoint platforms, Map C's transformer housings), and above all the produced ELECTRICAL PARTICLE VFX — the build spark, combine flash, arc bolts, chain-lightning, spark sprays, discharge rings, the slow snap, the burn ember, the aura pulse ring, impacts, death discharges, and leak alarm, simulated live through `@test-cabinet/particle-runtime` and escalating with quality — plus the produced audio, and the in-code HUD, map-select previews, and build panel that read the quality ladder and the coming wave at a glance."

# Reviewer checklist items, common to every variant. The major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss. Reporter-side material: never
# seeded into a run, so the model never sees the checklist; each restates a
# requirement the seeded specification already states. Each item is worth `weight`
# points toward the run's score; the reviewer records a pass/fail verdict for each
# before the run can be published. The per-domain ratings stay the reviewer's call.

# --- Foundry Systems ------------------------------------------------------------
[[review_item]]
id = "maps-and-waypoints"
title = "Three maps with ordered-waypoint topologies"
text = "A MAP SELECT lets the player choose among three fixed, hand-authored maps that differ in TOPOLOGY, not in numbers — The Substation (an edge-hugging serpentine), The Switchyard (a star whose legs criss-cross the center), and The Transformer Yard (different waypoints AND two large pre-blocked transformer housings that pre-shape the maze). Each map defines an ordered chain of checkpoints (Entry, then its waypoints in sequence, then the Collector) at the pinned tile coordinates, and every map plays the same campaign, economy, roster, and scaling — the waypoint placement and any fixed housings, not the numbers, are the difference. Maps are chosen, not per-game random layouts."
weight = 1
domain = "simulation"
reference = "map-select"
proof = "gameplay"

[[review_item]]
id = "waypoint-mazing"
title = "Towers are walls; ordered-waypoint mazing, 4-tile platforms, never-seal"
text = "There is no fixed track: every component, candidate, AND blocker is a wall, and the Load pathfinds the shortest OPEN route around them — but constrained to the map's ordered waypoint chain, reaching each 4-tile waypoint PLATFORM (non-buildable) in sequence and solving each leg (current position to next waypoint) rather than globally. Building lengthens a leg's route; a placement that would fully seal any waypoint segment, land on a waypoint platform, encircle a waypoint, or trap a unit already walking, is REFUSED and shown invalid (the never-seal rule), so the maze can only lengthen a route, never close it. Placing a rock, or DISMANTLING a structure (which frees its footprint), re-paths every walking unit LIVE from where it stands, with no teleporting; a combine is WALL-NEUTRAL and re-paths nothing (the consumed partner hardens into a blocker in place, never opening a hole)."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "systems"

[[review_item]]
id = "scrap-press-roll"
title = "The scrap-press rolls a random component at a random quality ON PLACEMENT"
text = "A component is NEVER bought at a chosen type or quality — the only way one enters the board (aside from a combine) is a scrap-press pull: STAMP arms a blank rock, and the ROLL happens WHEN THE ROCK LANDS (a random type, uniform 12.5% each of the eight, at a random quality on odds weighted LOW toward Scrap — only Scrap at R0 — and biased upward by the Refinement level), so there is no roll-then-cancel-then-re-pull exploit, and cancelling a held rock costs nothing. Each level grants a fixed allowance of FIVE stamps that placement is FREE against — a rock costs NO Charge (GemTD-faithful), so the five-per-level allowance (capped at five REGARDLESS of how much Charge you hold) is the ONLY limit on placement; it refreshes every build phase and does not carry over, and the allowance decrements on placement, not on the button click. Combining consumes no stamps. Stamps and this allowance are identical on every difficulty."
weight = 1
domain = "simulation"
proof = "systems"

[[review_item]]
id = "keep-one-per-level"
title = "Keep exactly one per level; the rest harden into blockers; combine"
text = "The heart of the game: each level you place up to five rocks (each revealing a random candidate on placement) and take EXACTLY ONE new firing tower off the level. That one harvest is a KEEP or a COMBINE SPECIAL. A plain KEEP marks one candidate to become a permanent firing component when you SEND. A COMBINE SPECIAL is an immediate combine that folds in AT LEAST ONE fresh candidate (a rock placed this phase): it resolves at once and then ENDS THE BUILD PHASE AND LAUNCHES THE WAVE, and it is the SOLE harvest — it supersedes any marked KEEP (the marked candidate hardens with the rest). Every candidate you do NOT harvest hardens into an inert BLOCKER at wave start — it walls its 2x2 footprint forever but never fires — so a level adds at most one tower and the rest becomes maze. A blocker can later be re-stamped into a fresh candidate. A combine comes in two kinds: a QUALITY-COMBINE folds two matching pieces — same TYPE and same QUALITY — one tier higher, and a RECIPE-COMBINE folds a whole multiset of base (type,quality) parts into one combination tower; in BOTH the result lands at the initiating piece's footprint and every consumed footprint HARDENS INTO A BLOCKER in place (WALL-NEUTRAL, never opening a hole) for no Charge. A combine that folds ONLY standing towers (no fresh candidate) is a plain COMBINE — NOT a harvest: it does not end the build phase and is the ONLY combine allowed DURING A LIVE WAVE (so a player climbs and assembles their standing board across the waves). When the player does not shift-select the exact pieces, auto-resolve ALWAYS prefers consuming a fresh candidate over a standing tower. COMBINE is offered only when a match or recipe exists; Tesla-Prime is the quality apex and combos are terminal. Taking more than one new tower off a single build phase is WRONG and must not happen — a combine that consumes a fresh roll MUST end the phase."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "systems"

[[review_item]]
id = "quality-ladder"
title = "The five-rung quality ladder is the power axis"
text = "Every component carries one of five quality tiers — Scrap, Tuned, Charged, Primed, Tesla-Prime — and quality is the power axis: damage multiplies steeply up the ladder (x1 / x3 / x9 / x40 / x110 over Scrap) while range nudges up and fire rate stays flat, so a board of Scrap is a junkyard of pea-shooters and a Tesla-Prime is a lightning god, and a combined component always out-damages the two it consumed. A single press roll never exceeds Charged (T3) — Primed and Tesla-Prime are reached ONLY by combining. The tier must read at a glance by MORE than color — the sprite finish and firing-VFX intensity escalate every rung (`specs/towers.md`, `specs/assets.md`)."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "upgrade-quality"
title = "UPGRADE QUALITY refines the press up a Refinement track"
text = "Beside combining, the second progression axis is UPGRADE QUALITY: a build-panel control that spends Charge to buy the next of six Refinement levels (R0..R5), each biasing the stamp's QUALITY roll toward higher tiers (the type roll stays uniform 12.5% each of eight). The current level and the next cost (60 / 130 / 240 / 400 / 620 up the track) are shown, it is disabled at R5 or when unaffordable, and refinement is permanent for the run. Buying levels must visibly shift future rolls upward — the press hands out stronger gems on average — so kill income has a real sink beyond stamping, and a late run can roll Charged/Primed rocks the way an unrefined press cannot."
weight = 1
domain = "simulation"
proof = "systems"

[[review_item]]
id = "component-types"
title = "Eight base component types, automatic targeting, projectile carries the hit"
text = "The eight base component types each have a distinct firing identity: the Capacitor (a clean single-target bolt), the Coil (chain-lightning that leaps to nearby extra targets, dimming per jump, its leap count growing with quality), the Emitter (a rapid low-damage anti-swarm spark), the Arc-Node (an area discharge damaging everything within a quality-scaling splash radius), the Discharge Rig (a slow long-range heavy bolt), the Choke (a low-damage single-target bolt that SLOWS the struck unit for a duration, slow amount growing with quality), the Rectifier (a low-damage single-target bolt that lights an overcurrent BURN, a damage-over-time), and the Regulator (a NON-FIRING support node that projects an AURA buffing nearby firing towers' damage — it never fires and has no head, range ring, projectile, or targeting). The seven firing types fire AUTOMATICALLY at valid in-range units with no manual trigger, all hit ground and air, each carries a selectable targeting priority (first / last / nearest / strongest / weakest, defaulting to first), each firing head ROTATES to aim, and every shot is a VISIBLE traveling projectile or arc that carries the hit on impact — not hitscan. Base towers are WEAK FEEDSTOCK: they are the salvage the run climbs and folds into higher tiers and combination towers, not the endgame firepower on their own."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "combination-towers"
title = "Combination towers assembled by a recipe combine"
text = "Beyond climbing quality, the headline power move is the COMBINATION TOWER — the redesign's central source of firepower. About a dozen unique combos (Fuse Cluster, Static Web, Slag Driver, Corroder, Ion Prism, Fork Array, Null Core, Rupture Node, Blight Coil, Reactor Pile, Aurora Lance, Singularity) each fold a fixed RECIPE — a specific multiset of base (type, quality) ingredients drawn from candidates and/or existing components, including the initiating piece — into one turret. The combo lands IMMEDIATELY at the initiating piece's footprint the moment the recipe is committed, and every consumed ingredient footprint HARDENS INTO A BLOCKER in place (wall-neutral, never opening a hole); if any ingredient is a fresh candidate the recipe is a COMBINE SPECIAL that IS the level's single harvest and ENDS the build phase (including the one-shot where every ingredient was placed this phase), while a recipe of only standing towers is a plain COMBINE that does not end the phase and may be assembled during a live wave. Combos are SINGLE-GRADE and TERMINAL: one fixed stat block, no quality tier, cannot be quality-combined or fed into another recipe, though they still fire, wall, and benefit from external auras. They carry exotic abilities (splash / chain / slow / burn / crit / multishot / aura) per the fixed table in `specs/towers.md`. Recipes gate the whole run — early combos take all-Scrap parts, apex combos (Aurora Lance, Blight Coil, Reactor Pile, Singularity) demand combine-only Primed/Tesla-Prime ingredients — so the late waves are UNWINNABLE on base towers alone; a run that keeps and refines but never assembles a combination tower falls short."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "systems"

[[review_item]]
id = "status-effects-abilities"
title = "Status effects and combo abilities: slow, burn, crit, multishot, aura"
text = "The ability vocabulary layers on top of raw damage. SLOW (the Choke base type and slow combos) scales the struck unit's speed by (1 − amt) for a duration — strongest slow wins, refreshed on hit, does NOT stack. BURN (the Rectifier base type and burn combos) sets a damage-over-time (burnDps = shotDamage × frac) ticking HP loss for a duration, strongest burnDps kept, refreshed on hit, credited to the applying tower, does NOT stack. CRIT (combination towers only) gives a shot a chance to deal ×critMult and shows a bigger impact — no base component crits. MULTISHOT (combination towers only) fires at up to N distinct in-range targets per cadence, each a separate traveling projectile — no base component multishots. AURA (the Regulator base type and aura combos) is a passive field: any firing tower whose center lies within auraRadius has its damage multiplied by (1 + auraBonus), auras sum on a covered tower capped at +100%, and the aura source never buffs itself. Critically, there is STILL NO armor or damage-type system — every unit takes HP loss the same way; an ability only ever changes a unit's SPEED (slow) or applies EXTRA HP LOSS (burn/crit), or buffs a tower's damage (aura)."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "pressure"

[[review_item]]
id = "load-and-flyer"
title = "The Load roster, the flyer, and the Dynamo"
text = "The Load is the six enemy types of `specs/enemies.md` — Mote, the fast fragile Spark, the slow tanky Slug (leaks 2), the pack-swarming Cluster, the maze-ignoring Filament flyer, and the Dynamo boss (leaks 5) — with their pinned base stats, mixed so no single component type answers everything. The Filament FLYER flies straight from Entry through the waypoints to the Collector over every wall (the maze cannot slow it, but a component in range can still hit it), and the Dynamo anchors the milestone waves. Only HP scales across waves (baseHP x baseMult x (1 + k x (w-1))); speeds, bounties, leaks, and every component stat are unchanged wave to wave."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "pressure"

[[review_item]]
id = "economy-integrity-campaign"
title = "Economy, Grid Integrity, and the wave campaign"
text = "Charge is earned from thin kill bounties and a small wave-clear bonus — there is NO interest (banking is not rewarded), so Charge is deliberately scarce. Placing rocks is FREE (GemTD-faithful — the five-per-level allowance is the only placement limit), so Charge is spent on only two things: UPGRADE QUALITY and combo upgrades. There is NO selling and NO slagging — rocks, blockers, and kept components are permanent. A leak costs Grid Integrity (starting 20), and reaching 0 overloads and ends the game even mid-wave. The run is a fixed sequence of N waves (50 on the reference Medium) on the chosen map; every build phase is UNTIMED (no countdown, no early-send bonus — START begins Wave 1, SEND resolves each level and starts the next wave, and building happens only in the build phase, not during a live wave), a Dynamo boss anchors the midpoint and final milestone waves, and victory is clearing the final wave with integrity left."
weight = 1
domain = "simulation"
proof = "pressure"

[[review_item]]
id = "difficulty-in-game"
title = "In-game difficulty changes only wave count and toughness"
text = "After MAP SELECT, a DIFFICULTY SELECT lets the player pick Easy / Medium / Hard, and each entry reads what it changes — its wave count and its enemy toughness — before it is chosen. Difficulty changes ONLY the number of waves (Easy 40, Medium 50, Hard 60) and the enemy HP scaling (the baseMult and k constants); starting Charge (130), Grid Integrity (20), builds-per-level (5, placement free), the Refinement track, the roster, and every economy value are IDENTICAL on all three. PLAY AGAIN replays the same map and difficulty."
weight = 1
domain = "simulation"
reference = "map-select"
proof = "gameplay"

[[review_item]]
id = "pause-in-place"
title = "Pause in place, distinct from the pause menu"
text = "The game can be paused IN PLACE — freezing all ticks (the Load, fire, projectiles, and the economy) with NO menu shown — via a status-bar pause control and, once a wave is live, `Space`; the paused state reads clearly as PAUSED, so the player can read the frozen board before resuming. A selected component's targeting may still be changed while paused. This is separate from the `Esc` pause MENU, which also freezes the game but covers it with the Resume / Restart / Quit menu; opening it freezes the game even when already paused in place."
weight = 1
domain = "simulation"
proof = "gameplay"

# --- Presentation & Electrical VFX ----------------------------------------------
[[review_item]]
id = "produced-component-sprites"
title = "Produced sprites: eight base types across all five tiers, plus combination towers"
text = "The eight base component types (Capacitor, Coil, Emitter, Arc-Node, Discharge Rig, Choke, Rectifier, Regulator) are drawn from sprites the build produced with `draw`/`draw-sheet` at EACH of the five quality tiers, so the ladder reads at a glance by more than color — a Scrap component is pitted, rusted, dim-flickering; a Tesla-Prime is mirror-chromed and wreathed in arcs — and each reads clearly as its TYPE and its QUALITY. Each FIRING component is a rotatable HEAD on a fixed base drawn to a canonical facing so the game aims it, its firing charge-and-discharge cycle animates, and the single-bolt components (including the Choke and Rectifier) have traveling projectile sprites; the NON-FIRING Regulator is drawn as a static support node with no rotating head and an aura-idle pulse instead of a fire cycle, still distinct across its five tier finishes. The dozen COMBINATION TOWERS are each one unique single-grade sprite wearing the gold accent so a combo reads unmistakably next to a base component. The inert BLOCKER reads as unmistakably dead (a fused scrap rock, no head, no glow), and a still-selectable CANDIDATE (a placed-but-not-yet-kept roll) reads as distinct from a kept component — not flat rectangles or ad-hoc canvas fills."
weight = 1
domain = "presentation"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "produced-load-and-yard"
title = "Produced, animated Load and yard art"
text = "The six Load types and the Dynamo boss are drawn from sprites the build produced with `draw`/`draw-sheet`, and they visibly ANIMATE — a short charge/crackle cycle per type so units seethe with charge as they crawl, the Filament reading as airborne, and the Dynamo seething with an unstable-overload wobble as it is worn down — not static dots. The yard art is produced too: the oil-dark concrete substrate the board tiles from, the glowing feeder-vent Entry and hazard-marked grounding Collector, a 4-tile waypoint platform at each map's checkpoint, and the steel transformer housings that fill Map C's fixed-blocked tiles — so the yard, its flow toward the Collector, and each map's waypoints read at a glance."
weight = 1
domain = "presentation"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "produced-electrical-vfx"
title = "Produced electrical particle VFX (the headline)"
text = "The build spark, the combine flash, the arc bolt (fatter on the Discharge Rig), the Coil's chain-lightning (forking between units and dimming per jump), the Emitter's spark spray, the Arc-Node's expanding discharge ring, the Choke's SLOW SNAP (an EM-drag snap clinging to the slowed unit), the Rectifier's BURN EMBER (an impact flare plus an ember-ticking flicker while the DoT burns), the Regulator/aura combo's AURA PULSE RING marking the buff field, the spark-burst impact, the death discharge (a big EMP-style burst for the Dynamo), and the leak alarm are particle systems the build authored with `particle-2d` and plays live through `@test-cabinet/particle-runtime`'s canvas binding — simulated bursts fired at the moment and position of each event, VARYING shot to shot, not a flat flash or a hand-coded loop. A CRIT needs no new system — it reuses the spark-burst impact at a larger scale — and a MULTISHOT is simply several normal projectiles at once. A firing effect's intensity ESCALATES with the component's quality tier, so the ladder reads in the VFX as well as the sprite. This is half of what the build is judged on."
weight = 1
domain = "presentation"
reference = "gameplay"
proof = "systems"

[[review_item]]
id = "produced-audio"
title = "Produced sound and music"
text = "The yard has real audio the build produced with the audio tools: a press/stamp clunk, a fire cue per component family (a sharp zap for the Capacitor/Emitter, a crackling chain for the Coil, a discharge boom for the Arc-Node/Discharge Rig), a combine chime (which doubles as the combination-tower spawn cue), a kill/ground-out pop, a rock-settle thunk (unkept rocks hardening into blockers at wave start), a slow hum (an icy/EM shimmer when a Choke or slow combo slows a unit), a burn sizzle (a crackling sizzle while a Rectifier or burn combo's DoT ticks), and a leak alarm (`sfx-synth` and/or `sfx-sample`), plus a tense, driving industrial-electro reactor music bed (`music`), played via Web Audio on the matching events and looping the bed — not silence, and not a downloaded or hand-oscillated stand-in. Audio does not autostart before the player interacts, and a mute toggle is present."
weight = 1
domain = "presentation"
proof = "pressure"

[[review_item]]
id = "readable-at-speed"
title = "Readable board, HUD, and build panel"
text = "A player can tell at a glance — even at fast speed — each board component's TYPE and QUALITY TIER (and a blocker from a candidate from a kept component), read Charge, Grid Integrity (turning to the alert color as it runs low), and the wave indicator with its progress or its BUILD read between waves, and read the scrap-press control (that placement is FREE and the remaining stamps of 5), the UPGRADE QUALITY control (Refinement level and next cost), the selected candidate/component inspector (type, quality, live stats, and the KEEP / COMBINE / COMBINE SPECIAL / targeting controls), and the next-wave preview. The HUD, build panel, menus, map-select waypoint previews, placement cues (legal vs never-seal), range rings, waypoint platforms, and health bars are drawn in code in the palette; only their small icons may be produced sprites."
weight = 1
