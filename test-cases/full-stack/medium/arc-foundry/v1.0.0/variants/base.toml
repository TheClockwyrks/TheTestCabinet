# The default (and only) Arc Foundry variant: the standard SALVAGE campaign. Listed
# first in the case manifest's `variants`, so it is the default. Difficulty
# (Easy / Medium / Hard) is chosen on the in-game DIFFICULTY SELECT menu and changes
# only the wave count and enemy toughness (`specs/modes.md`), so it is NOT a variant:
# there is one campaign, defined entirely by the common specs. This variant seeds no
# spec of its own; the SALVAGE start now lives in `specs/gameplay.md`. Every path here
# resolves against the version folder, exactly like the main manifest.
slug = "base"
name = "Base"
description = "The standard SALVAGE campaign: 10 starting Charge, 20 Grid Integrity, with Easy/Medium/Hard chosen in-game (they change only the wave count and enemy toughness)."

# This variant's own `title` reference. The main menu lists a single SALVAGE start, so
# the title view is variant-specific; `map-select`, `gameplay`, and `game-over` are
# common (declared in the main manifest). The `media` is a screenshot captured from
# this variant's reference-impl build and served as-is (seeded as a visual target,
# never rendered).
reference = [{ view = "title", media = "reference/screenshots/base/title.png" }]

# The authored, correct static build of this variant: the case-variant analogue of a
# run's playable build. A bare directory path (resolved against the version folder)
# holding a buildable web project, built with this case's `[build]` install/build
# commands and deployed like a published run build via `tcab publish-reference`, then
# shown on the case's "Reference" tab. It is never seeded into a run. This is a
# full-stack case, so this build also produced its own art, electrical effects, and
# audio during authoring (committed under `reference-impl/base/assets/`); the build
# itself only loads them, so `npm ci && npm run build` is self-contained.
reference_implementation = "reference-impl/base"
