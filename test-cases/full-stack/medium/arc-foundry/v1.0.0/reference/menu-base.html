<!DOCTYPE html>
<!--
  Arc Foundry — title / main menu reference mockup (base variant).
  Canonical view slug: title (variant: base)
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Title / main
  menu) and ../specs/modes.md (the single SALVAGE start; difficulty and map are
  chosen on the in-game menus that follow, not here). The menu lists the campaign
  start, then HOW TO PLAY. A dim slice of the yard shows behind for atmosphere.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arc Foundry — Main menu</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Dim yard furniture behind the menu: a scrap of maze, a waypoint route,
           salvaged components across the eight base types + quality tiers (including a
           non-firing Regulator projecting its aura and a gold combination tower), and a
           charge unit. -->
      <div class="board dim" style="top: 0; height: 720px; width: 1280px">
        <svg class="field" viewBox="0 0 1280 720" style="width: 1280px; height: 720px">
          <polyline points="80,610 300,610 300,560 240,560 240,640 1040,640 1040,560 1180,560"
            fill="none" stroke="#2f5a78" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
          <polyline points="80,610 300,610 300,560 240,560 240,640 1040,640 1040,560 1180,560"
            fill="none" stroke="#8fd6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
        </svg>
        <div class="comp rig t4" style="left: 120px; top: 560px">
          <span class="core">D</span><span class="head"></span><span class="pips"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="comp coil t2" style="left: 280px; top: 600px; transform: rotate(18deg)">
          <span class="core">L</span><span class="head"></span><span class="pips"><i></i><i></i></span>
        </div>
        <div class="aura-ring" style="left: 720px; top: 600px; width: 150px; height: 150px"></div>
        <div class="comp reg t3" style="left: 700px; top: 580px">
          <span class="core">G</span>
        </div>
        <div class="comp combo" style="left: 820px; top: 580px; transform: rotate(-10deg)">
          <span class="core">&#10022;</span><span class="head"></span>
        </div>
        <div class="slag" style="left: 980px; top: 600px"></div>
        <div class="comp node t3" style="left: 1080px; top: 560px">
          <span class="core">A</span><span class="head"></span><span class="pips"><i></i><i></i><i></i></span>
        </div>
        <div class="unit slug" style="left: 640px; top: 640px"><span class="body"></span></div>
        <div class="unit mote" style="left: 420px; top: 640px"><span class="body"></span></div>
      </div>

      <div class="center">
        <h1 class="title">ARC FOUNDRY</h1>
        <p class="tagline">STAMP &middot; WALL &middot; DISCHARGE</p>
        <div class="menu">
          <div class="menu-item selected">SALVAGE</div>
          <div class="menu-item">HOW TO PLAY</div>
        </div>
      </div>
      <div class="hint">&#8593;&#8595; SELECT &nbsp;&nbsp; ENTER CONFIRM</div>
    </div>
  </body>
</html>
