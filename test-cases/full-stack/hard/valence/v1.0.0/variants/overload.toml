# The standard campaign plus Overload, a scarcer, front-loaded start: less energy and
# integrity, interest disabled, and the tool-specific forms (molecules, nobles, heavies)
# arriving several rounds earlier, so the board is under pressure from the opening. Its
# review item rolls up to the common `simulation` domain, since Overload presses the same
# reaction systems harder rather than adding a new axis of judgement.
slug = "overload"
name = "Overload"
description = "The standard campaign, run scarce: 350 starting energy, 60 integrity, no interest, and molecules, nobles, and heavies arriving several rounds early — pressure from the opening."

# The campaign start is seeded to the stable path `specs/mode.md` that the common specs
# reference; overload seeds the scarce start in place of the standard one.
spec = [{ source = "specs/mode-overload.md", dest = "specs/mode.md" }]
reference = [{ view = "title", path = "reference/menu-overload.html" }]

[[review_item]]
id = "overload-scarcity"
title = "Overload scarcity"
text = "In Overload the campaign opens with less energy (350) and integrity (60) than standard, interest is disabled, and the tool-specific forms — molecules, nobles, and heavies — arrive several rounds earlier, so the player must field a Shear, a Catalyst, and Fission early rather than leaning on ionizers. The scarcer, front-loaded opening is real, not cosmetic: a build that plays identically to the standard start — same starting resources, interest still paid, forms held to their standard rounds — has not implemented it."
weight = 1
domain = "simulation"
