<!DOCTYPE html>
<!--
  Midway — park-closed (bankruptcy) reference mockup.
  Canonical view slug: game-over
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Park closed).
  Objects in .park use field-local coordinates (top = field row * 24).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Midway — Park Closed</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- A dim slice of the shuttered park behind the panel. -->
      <div class="park">
        <div class="region path dim" style="--c: 8; --r: 12; --w: 34; --h: 2"></div>
        <div class="region path dim" style="--c: 22; --r: 4; --w: 2; --h: 8"></div>
        <!-- Rides stopped, the crowd gone. -->
        <div class="ride broken dim" style="--c: 12; --r: 5; --w: 3; --h: 3">&#9784;</div>
        <div class="ride broken dim" style="--c: 34; --r: 5; --w: 2; --h: 4">&#8645;</div>
        <div class="stall dim" style="--c: 24; --r: 11; --w: 2">FOOD</div>
        <div class="guest angry dim" style="left: 360px; top: 356px"></div>
        <div class="guest angry dim" style="left: 540px; top: 356px"></div>
      </div>

      <div class="overlay"></div>

      <div class="panel">
        <p class="panel-eyebrow">THE MONEY RAN OUT</p>
        <h2 class="panel-title">PARK CLOSED</h2>
        <p class="panel-stat">OPEN 27 DAYS</p>
        <p class="panel-sub">PEAK 118 GUESTS &nbsp;&middot;&nbsp; &#9733;&#9733;&#9733; RATING</p>
        <nav class="menu">
          <div class="menu-item selected">TRY AGAIN</div>
          <div class="menu-item">MENU</div>
        </nav>
      </div>
    </div>
  </body>
</html>
