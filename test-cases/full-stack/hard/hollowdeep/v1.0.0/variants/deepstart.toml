# The standard colony plus Deepstart, a scarcer opening: a smaller starting oxygen
# pocket and no starting refined material, so the colony is under survival pressure
# from the first cycle. Its review item rolls up to the common `simulation` domain,
# since Deepstart presses the same survival systems harder rather than adding a new
# axis of judgement.
slug = "deepstart"
name = "Deepstart"
description = "The standard colony, started scarce: a smaller pocket of breathable air and no refined material on hand, so oxygen and construction are under pressure from the first cycle."

# The playable start is seeded to the stable path `specs/mode.md` that the common
# specs reference; deepstart seeds the scarce start in place of the standard one.
spec = [{ source = "specs/mode-deepstart.md", dest = "specs/mode.md" }]
reference = [{ view = "title", path = "reference/menu-deepstart.html" }]

[[review_item]]
id = "deepstart-scarcity"
title = "Deepstart scarcity"
text = "In Deepstart the colony opens with a markedly smaller pocket of breathable oxygen and zero refined build material — so the first jobs must be digging and refining ore before anything can be built, and the oxygen clock is already ticking down. The scarcer opening is real, not cosmetic: a build that plays identically to the standard start has not implemented it."
weight = 1
domain = "simulation"
