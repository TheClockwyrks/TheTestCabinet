slug = "wireworm-node"
name = "Wireworm Node"
difficulty = "medium"
tags = ["asset-generation", "2d", "sprite-sheet", "prop"]
summary = """
Draw the capacitor node that tiles the Wireworm circuit board — the terrain a \
data-worm charges as it descends — as a 32x32 five-frame sprite sheet: a small \
electronic component ramping from inert and dark to a white-hot critical state \
with a glow halo and amber overcharge sparks, produced one drawing operation at \
a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one small
# on-board component, sized to sit on a grid cell. Fixing the size keeps every run
# comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — five separate 32x32 frames of one node's charge
# states — and the named sequences a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.sequence]]
slug = "charge-up"
name = "Node — charge-up"
frames = [0, 1, 2, 3]
fps = 4

[[sheet.sequence]]
slug = "critical-pulse"
name = "Node — critical pulse"
frames = [3, 4]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated node matches the brief — the same centered \
capacitor component in every frame, a monotonic charge ramp from an inert dark \
core to a white-hot critical core with a glow halo and amber overcharge sparks, \
in the tight component palette on transparency."""

[[review_item]]
id = "charge-ramp"
title = "Monotonic charge ramp"
text = """
Played 0→1→2→3 the node reads as one component filling with charge: the core \
goes dark (0) → lit from the bottom (1) → fully lit mid (2) → white-hot (3), \
never dimmer in a later frame than an earlier one, and a glow halo first appears \
faintly at frame 2 and grows bright by frame 3. The can, top cap, and leads are \
the same in every frame — only the core and glow change."""
sequences = ["charge-up"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "critical-read"
title = "Critical reads as loaded"
text = """
The critical frames (3 and 4) unmistakably read as loaded and dangerous, clearly \
distinct from the charging frames: a white-hot core, a bright glow halo around \
the can, and a few amber overcharge sparks flicking off the top cap and leads. \
Amber sparks appear only at critical (never on frames 0–2), and the pulse peak \
(frame 4) is brighter and wider than frame 3, so 3↔4 reads as a pulse."""
sequences = ["critical-pulse"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "component-read"
title = "Reads as a capacitor component"
text = """
The sprite reads at a glance as a small upright electronic component — a capacitor \
can with a sealed top cap and two leads at its base — centered and the same size \
in every frame, not a formless blob of glow. The glowing core sits inside the can \
as a light pipe, not as a halo swallowing the silhouette."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette-and-transparency"
title = "Component palette on transparency"
text = """
Uses only the component palette from the brief (casing, metal rim, the inert / \
low / mid / white-hot core colors, and the amber spark) on full transparency — no \
out-of-palette pixels, no anti-aliased fringes, and no opaque background fill; \
only the node's pixels are opaque so it composites onto the dark board."""
weight = 1
domain = "fidelity"
