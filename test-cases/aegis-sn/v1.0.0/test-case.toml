title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze armor, iron legs \
and gun barrels, dark-iron recesses, and the solar-amber accent) with a clear amber \
accent showing from multiple angles, no out-of-palette colors, and no stray \
