weight = 1
domain = "fidelity"

[[review_item]]
id = "fills-volume"
title = "Fills the volume"
text = """
The fortress uses most of the volume — broad across the width at the leg \
stance, long along z, and rising from the feet on the ground up to the sensor vane, \
with only a little margin on every side — neither shrunk into one corner nor clipped \
where it runs past a face of the volume."""
weight = 1
domain = "fidelity"
