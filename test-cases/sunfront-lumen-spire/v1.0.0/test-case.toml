name = "Sunfront Lumen Spire"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Lumen Spire: a 44x88x44 opaque-voxel beacon spire \
whose halo ring spins and solar lens pulses up and down on their own auto clips \
while the base stays fixed, built and rigged one recorded operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 44
height = 88
depth = 44
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts and these joints; at run time it MAY add further
# parts, joints, and auto-play clips of its own (recorded in rig.json) beyond what
# this table requires. `pivot` is `[x, y, z]` in voxel coordinates. `rig.json` is
# pre-seeded from this table so the contract exists from the first operation.
[model]

# The spire tower and foundation: the root part (no parent), fixed to the world.
[[model.part]]
name = "base"
pivot = [0, 0, 0]

# The halo ring, encircling the spire near its crown. It turns on its own on the
# auto-driven `halo_ring_spin`.
[[model.part]]
name = "halo_ring"
parent = "base"
pivot = [22, 66, 22]

# The solar lens, riding atop the spire's crown. It bobs up and down on the
# auto-driven `lens_pulse`.
[[model.part]]
name = "lens"
parent = "base"
pivot = [22, 74, 22]

# The halo ring's own looping spin. An `auto` joint the case drives with a
# `[[model.clip]]`, a full rotation about `y` so the ring turns on its own without a
# caller.
[[model.joint]]
name = "halo_ring_spin"
part = "halo_ring"
kind = "rotation"
axis = "y"
pivot = [22, 66, 22]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "auto"

# The solar lens's own looping pulse. An `auto` joint the case drives with a
# `[[model.clip]]`, an upward translation along `y` so the lens bobs on its own
# without a caller. `rest = 0` is seated; `max = 4` is the top of the pulse.
[[model.joint]]
name = "lens_pulse"
part = "lens"
kind = "translation"
axis = "y"
pivot = [22, 74, 22]
min = 0.0
max = 4.0
rest = 0.0
drive = "auto"

# The auto-play clips — one per animated part, so the spire runs on its own. Only
# `auto` joints take a clip. Keyframes are inline `[t_ms, value]` pairs (radians for
# the ring spin, voxels for the lens pulse). The ring turns a full revolution and
# loops; the lens rises and settles back.
[[model.clip]]
joint = "halo_ring_spin"
period_ms = 2200
loop = true
keyframes = [[0, -3.14159], [2200, 3.14159]]

[[model.clip]]
joint = "lens_pulse"
period_ms = 1500
loop = true
keyframes = [[0, 0.0], [750, 4.0], [1500, 0.0]]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Lumen Spire \
and runs correctly — a slim beacon spire whose halo ring spins and solar lens \
pulses up and down on their own auto clips while the base stays put, with a strong \
solar-hot energy accent and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-spire"
title = "Reads as a beacon spire"
text = """
From more than one angle the model reads unmistakably as a Duneforged beacon \
spire: a slim, tall masonry tower crowned with a solar lens and encircled by a \
halo ring near its top. It is a slender signalling spire, not an abstract stack of \
boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Halo ring spins and lens pulses on their own"
text = """
The animated elements cycle on their own via their auto clips while the `base` \
stays fixed: the `halo_ring_spin` joint turns the halo ring a full revolution \
about the spire's vertical axis, and the `lens_pulse` joint bobs the solar lens \
straight up and back down. Across each cycle no voxel of the ring or lens tears \
away from its mount or clips into the spire — each moves as one solid piece about \
the correct axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Base stays fixed"
text = """
Only the moving parts move: the halo ring as it spins and the lens as it pulses. \
The spire base and its foundation stay put — they are the fixed root of the rig, \
not carried along by the ring or the lens."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Ring and lens stay attached"
text = """
Each child stays attached to the base across its joint's range: the halo ring \
encircles the spire's crown at its mount as it turns, and the lens meets the \
spire's tip at its seat as it bobs, with no gap and never floating free or \
detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber and solar-hot energy \
accents) with a strong solar-hot accent, no out-of-palette colors, and no stray \
voxels drifting off the parts."""
weight = 1
domain = "fidelity"
