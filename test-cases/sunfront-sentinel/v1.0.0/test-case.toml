name = "Sunfront Sentinel"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "mech"]
summary = """
Sculpt and rig the Sunfront Sentinel: a 44x64x40 opaque-voxel bipedal war-mech \
whose right-arm rifle aims up and down on a caller-driven weapon_pitch joint while \
it strides on two independent three-segment legs (a hip, a reverse knee, and a \
flat foot each) — built and rigged one recorded operation at a time, with a \
model-authored walk that plants each foot and a rifle-recoil the reviewer can play \
back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 44
height = 64
depth = 40
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts, these joints, AND these animations; at run time
# it MAY add further parts, joints, and animations of its own (recorded in
# rig.json) beyond what this table requires. `pivot` is `[x, y, z]` in voxel
# coordinates. `rig.json` is pre-seeded from this table so the contract exists from
# the first operation.
#
# The rig has two kinds of moving part, and the drive of each is deliberate:
#   * The right-arm rifle's `weapon_pitch` is `caller` — a game (and the review
#     viewer's `fire` animation) drives it by name to aim the rifle.
#   * The six leg joints are `auto` — they hold at their rest pose (a planted,
#     bent-knee stand) until the `walk` animation drives them, so the walk can
#     stride the legs while the rifle holds and `fire` can pose the rifle while the
#     legs stand.
[model]

# The mech's upper body and head: the root part (no parent), fixed to the world.
[[model.part]]
name = "torso"
pivot = [0, 0, 0]

# --- The two legs. Each leg is an INDEPENDENT three-segment chain — a thigh, a
# shin, and a short flat foot — on its OWN hip directly above its OWN foot (x and z
# held constant down the chain; only y descends), so no shared pivot drags a foot
# through the ground. Two joints bend each leg (a hip and a reverse/digitigrade
# knee) plus a small ankle tilt that keeps the foot flat. Left (l) and right (r),
# stepping in opposite phase. ---

# Left thigh, hung from the left hip under the torso.
[[model.part]]
name = "thigh_l"
parent = "torso"
pivot = [14, 26, 20]

# Left shin, hung from the left knee down toward the foot.
[[model.part]]
name = "shin_l"
parent = "thigh_l"
pivot = [14, 14, 20]

# Left foot: a short, FLAT foot hung from the left ankle.
[[model.part]]
name = "foot_l"
parent = "shin_l"
pivot = [14, 3, 20]

# Right leg, mirroring the left.
[[model.part]]
name = "thigh_r"
parent = "torso"
pivot = [30, 26, 20]

[[model.part]]
name = "shin_r"
parent = "thigh_r"
pivot = [30, 14, 20]

[[model.part]]
name = "foot_r"
parent = "shin_r"
pivot = [30, 3, 20]

# The right-arm rifle, mounted at the shoulder. It aims up and down on the
# caller-driven `weapon_pitch`.
[[model.part]]
name = "weapon"
parent = "torso"
pivot = [30, 40, 24]

# --- Joints ---

# The required caller-driven joint: a game addresses `weapon_pitch` by name to aim
# the right-arm rifle up and down about its shoulder mount. `rest = 0` levels the
# rifle straight forward (+z); `min`/`max` tilt it down and up. Only the weapon
# moves on this joint.
[[model.joint]]
name = "weapon_pitch"
part = "weapon"
kind = "rotation"
axis = "x"
pivot = [30, 40, 24]
min = -0.7
max = 0.7
rest = 0.0
drive = "caller"

# The left leg's three auto joints, driven by the `walk` animation. The hip makes
# the big fore/aft sweep; the knee is a reverse (digitigrade) fold that rests
# clearly BENT (rest = -0.7), never a straight column; the ankle tilts only ±~15°
# to keep the foot flat.
[[model.joint]]
name = "hip_l"
part = "thigh_l"
kind = "rotation"
axis = "x"
pivot = [14, 26, 20]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

[[model.joint]]
name = "knee_l"
part = "shin_l"
kind = "rotation"
axis = "x"
pivot = [14, 14, 20]
min = -1.4
max = 0.2
rest = -0.7
drive = "auto"

[[model.joint]]
name = "foot_l"
part = "foot_l"
kind = "rotation"
axis = "x"
pivot = [14, 3, 20]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

# The right leg's three auto joints, mirroring the left and stepping a half period
# out of phase.
[[model.joint]]
name = "hip_r"
part = "thigh_r"
kind = "rotation"
axis = "x"
pivot = [30, 26, 20]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

[[model.joint]]
name = "knee_r"
part = "shin_r"
kind = "rotation"
axis = "x"
pivot = [30, 14, 20]
min = -1.4
max = 0.2
rest = -0.7
drive = "auto"

[[model.joint]]
name = "foot_r"
part = "foot_r"
kind = "rotation"
axis = "x"
pivot = [30, 3, 20]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

# --- Required animations (declarations only — the model authors the F-curves) ---
# Each declares the animation's identity and intent; the model authors the motion
# (the keyframes and their F-curve interpolation) at run time with the voxel-anim
# `define-animation`/`add-keyframe` subcommands. NO keyframes live here.

# `walk`: the WALK. It drives all six leg joints — the two hips sweep fore-and-aft,
# the two reverse knees fold to lift each foot on its swing, and the two ankles
# counter-rotate to hold the foot flat — in a two-phase gait (a planted stance
# where the foot is flat and still on the ground while the mech passes over it,
# then a swing that lifts, carries forward, and plants), the legs in opposite
# phase. It touches NO weapon joint, so the rifle holds at rest.
[[model.animation]]
name = "walk"
period_ms = 800
loop = true
auto_play = false
joints = ["hip_l", "knee_l", "foot_l", "hip_r", "knee_r", "foot_r"]

# `fire`: the WEAPON showcase. It drives only `weapon_pitch` so the reviewer can
# watch the rifle snap into a quick recoil nod, overshoot back, and settle without
# dragging the joint slider by hand. It touches NO leg joint, so the legs stand.
[[model.animation]]
name = "fire"
period_ms = 500
loop = true
auto_play = false
joints = ["weapon_pitch"]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Sentinel and \
poses correctly — a bipedal war-mech whose right-arm rifle aims up and down on its \
shoulder mount without detaching while it strides on two independent three-segment \
legs whose feet lift clear and plant flat on the ground (never dragged, never \
flailing) and the torso stays put, with a clear solar-amber visor accent and the \
disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-mech"
title = "Reads as a bipedal war-mech"
text = """
From more than one angle the model reads unmistakably as a walking war-mech: an \
upright torso with a head on top, a pair of jointed legs planted beneath the hips, \
and a rifle carried on the right arm. It is a bipedal fighting machine, not an \
abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride with planted feet; rifle aims"
text = """
Playing `walk` strides the mech on its two independent legs: each leg swings on its \
own `hip_*` joint, folds at its own reverse `knee_*`, and keeps its foot flat on its \
own `foot_*` — the feet plant flat and still on the ground during stance (the mech \
passing over them) and lift clear on the swing, stepping in opposite phase, NOT \
dragged through the ground or flailing in a continuous arc. Driving `weapon_pitch` \
(and playing `fire`) tilts the right-arm rifle cleanly up and down about its \
shoulder mount, with no voxel of the weapon tearing away from the arm or clipping \
into the torso across the full range."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "torso-fixed"
title = "Torso stays fixed"
text = """
Only the moving parts move: the rifle when `weapon_pitch` is driven or `fire` plays, \
and the legs when `walk` plays. The torso and head stay put — they are the fixed \
root of the rig, not carried along by the weapon or the legs."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Legs and rifle stay attached"
text = """
Each child stays attached across its joint's range: each leg's shin stays attached \
to its thigh and each thigh to the torso at the hip, and the rifle meets the right \
shoulder, with no gap and never floating free or detaching as the legs stride and \
the rifle pitches."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass torso, sandstone panels, iron \
rifle and legs, and the solar-amber visor accent) with a clear amber visor on the \
head, no out-of-palette colors, and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
