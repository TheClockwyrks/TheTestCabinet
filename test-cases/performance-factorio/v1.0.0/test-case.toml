# The Test Cabinet test case manifest — Lattice (on-disk slug `performance-factorio`).
#
# This is a PERFORMANCE case: the model writes a wasm ENGINE that simulates a
# deterministic Factorio-style factory, and a run scores that engine on a set of
# held-out scenarios — first for correctness (its canonical state must match a
# reference oracle bit-for-bit at every snapshot, compared by checksum), then for
# the FUEL it consumed. Lower fuel is better. The harness reads this file to build
# the submission to wasm and run it once per scored scenario through the shared
# `lattice-host` (the same host the `lattice` CLI uses), recording correctness and
# the fuel total. There is no head-to-head match and no replay renderer in v1.

# Human-readable display name (in-fiction title; the on-disk slug stays
# `performance-factorio`, following the house convention pacman -> Fathom,
# adversarial-pacman -> Foray).
name = "Lattice"

# Relative difficulty (easy | medium | hard), surfaced on the site. Lattice asks
# the model to reimplement an exact fixed-point simulation (two-lane belt
# compaction, side-loading, splitters, inserters, assemblers) AND to do it with as
# little work as possible — the transport-line representation Factorio itself uses.
# Getting the bit-exact answer is hard; getting it cheaply is harder.
difficulty = "hard"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["performance", "factorio", "simulation", "wasm"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
Write the engine for a deterministic Factorio-style factory — two-lane belts, \
item compaction, splitters, inserters, assemblers — and reproduce a reference \
engine's exact state, bit for bit, with as little fuel as you can spend."""

# Site-facing prose introducing the case, relative to this version folder. NOT
# seeded into a run; it exists only to describe the case on the site.
description = "description.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects the in-container workspace path via `{{workspace}}`.
prompt = "prompt.hbs"

# This is a performance case. The type selects which manifest tables are required
# ([build]/[contract]/[sandbox] and the [[case]] scored set) and which are
# forbidden ([simulation]/[match]/[replay] — there is no real-time loop, no
# head-to-head match, and no replay renderer in v1 — plus [canvas]/[tool]/[output]
# and [[check]]).
type = "performance"

# Maximum wall-clock runtime, in seconds, for the harness session before the run
# is stopped. Writing, building, and iterating a from-spec fixed-point engine
# against the local CLI and training scenarios is a substantial session, so it
# gets a full hour.
max_runtime_seconds = 3600

# Starter workspace seeded into the root of every run before the specs. It is a
# small Cargo project: just the engine skeleton the model fills in. Everything it
# builds against and runs with — the engine SDK + contract types (the "buildkit"),
# the `lattice` CLI, the reference engines, and the training scenarios — is
# provided by the performance run-container image under `/opt/lattice`
# (`$LATTICE_HOME`) and on `PATH`, not vendored here (see
# `containers/performance/Dockerfile`). Seeded files land at the run root
# (`workspaces/base/engine/...` -> `engine/...`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. `cargo fetch` pre-downloads the engine's crate
# dependencies (it path-depends on the baked buildkit's `lattice-core`/SDK and
# pulls their registry deps) so the model's first build is offline-fast.
init = "cargo fetch"

# How the harness builds the model's submission into a wasm engine module.
# `install` fetches dependencies; `build` emits the module; `module` names the
# produced artifact (relative to the run root) the validator loads. The engine
# crate is a `cdylib` named `engine`, so the artifact path is stable. For v1 a
# submission is a `wasm32-unknown-unknown` core module (the host instantiates it
# with no imports, exactly as Foray does); `wasm32-wasip2` is a documented
# forward-looking option, not the shipped path. All three fields are required.
[build]
install = "cargo fetch"
build = "cargo build --release --target wasm32-unknown-unknown -p engine"
module = "target/wasm32-unknown-unknown/release/engine.wasm"

# The engine contract: the exported entry the host invokes once per scenario, and
# the JSON Schemas for the scenario passed in and the state returned. The two
# schemas are seeded for the model to read (the resolver seeds them at these exact
# dests). They are generated from `lattice-core`'s `Scenario`/`Snapshot` types, so
# they can never drift from the engine the harness scores against.
[contract]
entry = "simulate"
input = "schemas/scenario.json"
output = "schemas/state.json"

# Per-scenario sandbox limits applied to every `simulate` invocation. Unlike an
# adversarial case (which meters per tick), a performance engine simulates the
# whole scenario in one call, so the fuel ceiling and the consumed-fuel result are
# both per scenario. Exceeding fuel or memory fails that scenario (see
# specs/sandbox.md). The efficient transport-line engine finishes every scored
# scenario well inside this budget; a move-every-item engine does not.
[sandbox]
fuel_limit = 5_000_000_000
max_memory_bytes = 268_435_456   # 256 MiB

# The held-out scored set: the scenarios the validator actually grades, paired
# with the reference oracle's expected `state` (as produced by `lattice solve`).
# These are committed WITH the case and are NOT seeded into the run and NOT baked
# into the container image — they are the train/test split's test half, unseen by
# the model. They are deliberately larger and longer than the baked training
# scenarios so the efficiency gap between a naive and a transport-line engine
# dominates the fuel total (`large` is 64x24 over 200,000 ticks).
[[case]]
input = "cases/small.json"     # 24x12 over 50,000 ticks — confirms correctness
expected = "cases/small.out"

[[case]]
input = "cases/medium.json"    # 48x24 over 100,000 ticks
expected = "cases/medium.out"

[[case]]
input = "cases/large.json"     # 64x24 over 200,000 ticks — efficiency dominates here
expected = "cases/large.out"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# v1 ships a single base variant — the shipped ruleset and prototype table scored
# against the held-out set above. The harder directions the overview names (a much
# larger SCALE, realistic inner-lane-shorter CURVES, underground belts /
# long-handed inserters, priority/filter splitters and stack inserters) are future
# variants layered on this base ruleset, not part of v1.
[[variant]]
slug = "base"
name = "Base"
description = "The shipped base ruleset and prototype table, scored on the held-out small/medium/large scenarios for correctness then fuel."

# Scoring domains. A performance run's decisive signal is correctness plus the
# fuel number, not a reviewer's rating, but a human review may still accompany a
# published run. One domain covers the qualitative read of HOW the engine reached
# its answer — whether it earned its fuel number with a transport-line
# representation or merely got lucky on a forgiving scenario.
[[domain]]
id = "approach"
name = "Approach"
description = """
How the engine reached the correct state — whether it exploits the transport-line \
representation (storing the gaps in a compressed run rather than re-walking every \
item every tick) and drives its machines and fixtures event-style rather than \
polling, which is what separates a low fuel number from a merely-correct one."""

# Reviewer checklist items, surfaced to a human reviewing a published run. NOT
# seeded into the run, so the model never sees them; each restates an observable
# property the recorded result (correctness + fuel) and a reading of the approach
# can be checked against. The decisive signal is still correctness plus the fuel
# number; these items carry no automated weight in the scored gate.
[[review_item]]
id = "is-correct"
title = "Reproduces the reference state"
text = """
The engine is CORRECT: on every held-out scored scenario its canonical state \
matches the reference oracle's at every snapshot tick, compared by the \
`fnv1a64:…` checksum. A single divergent item position, inserter phase, assembler \
buffer, or sink count anywhere fails the scenario — there is no partial credit on \
correctness, so a correct verdict means the simulation is bit-for-bit faithful."""
weight = 3
domain = "approach"

[[review_item]]
id = "exploits-transport-line"
title = "Avoids re-walking steady state"
text = """
The fuel number reflects a genuinely efficient engine, not a forgiving scenario: \
the engine does work where state CHANGES rather than re-confirming every tick that \
a long compressed run of belt did not move. A transport-line representation \
(gaps between items, constant-time advance of a packed run, a cached last-open \
gap) or an equivalent steady-state shortcut should be evident — not a \
move-every-item-every-tick loop that happens to fit the budget."""
weight = 1
domain = "approach"

[[review_item]]
id = "gets-compaction-right"
title = "Handles compaction and forcing"
text = """
The engine reproduces the compaction contract exactly: belt motion never creates \
a sub-`SPACING` gap and relaxes a squashed pair back to standard spacing on the \
next move, while a forced insertion (an inserter, a source, or side-loading) is \
accepted only into a gap strictly larger than `SPACING` and otherwise stalls. \
The side-loaded-single-lane and backed-up-inserter cases pass — the places a \
naive engine most often gets compaction subtly wrong."""
weight = 1
domain = "approach"

[[review_item]]
id = "no-shortcut-around-simulating"
title = "Actually simulates the held-out set"
text = """
The correct checksums on the unseen scored scenarios were earned by simulating \
them in the sandbox, not by memorizing training outputs or reaching the reference \
engine — which the pure-wasm sandbox makes impossible anyway. The engine generalizes \
to scenarios it never saw, which is the whole point of grading on a held-out set."""
weight = 1
domain = "approach"

# Common specs: seeded for the (single) variant. The model-facing brief, split by
# concern — the simulation rules, the prototype table, the engine contract + ABI,
# the canonical-state + checksum model, and the `lattice` CLI. The `input`/`output`
# schemas are seeded automatically by the `[contract]` table above, so they are
# not repeated here.
[[spec]]
source = "specs/rules.md"
dest = "specs/rules.md"

[[spec]]
source = "specs/prototypes.md"
dest = "specs/prototypes.md"

[[spec]]
source = "specs/contract.md"
dest = "specs/contract.md"

[[spec]]
source = "specs/canonical-state.md"
dest = "specs/canonical-state.md"

[[spec]]
source = "specs/cli.md"
dest = "specs/cli.md"
