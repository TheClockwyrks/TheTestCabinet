slug = "flarefish"
experimental = true
name = "Flarefish"
difficulty = "medium"
tags = ["sprite-sheet", "enemy"]
summary = """
Draw the Flarefish, a deep-sea predator that hunts in the light of its own \
flare, as a 32x32 four-direction swim sprite sheet — eight frames carrying the \
orange body and its glowing flare organ, produced one drawing operation at a \
time. The flare bloom itself is a separate effect case (Flare Bloom)."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — eight separate 32x32 frames, a two-frame swim
# cycle in each of the four directions — and the named sequences a reviewer
# plays back. The flare bloom is NOT on this sheet: it covers a far larger area
# than the creature and is its own effect asset (see the Flare Bloom case);
# here the creature only carries the dim flare organ on its body.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "walk-down"
name = "Swim — down"
frames = [0, 1]
fps = 4

[[sheet.sequence]]
slug = "walk-up"
name = "Swim — up"
frames = [2, 3]
fps = 4

[[sheet.sequence]]
slug = "walk-left"
name = "Swim — left"
frames = [4, 5]
fps = 4

[[sheet.sequence]]
slug = "walk-right"
name = "Swim — right"
frames = [6, 7]
fps = 4

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Flarefish target — its orange \
silhouette and the warm flare organ it carries, and the four readable swim \
directions that mark it as the predator that hunts in its own light."""

[[review_item]]
id = "flare-organ"
title = "Flare organ"
text = """
Every frame's creature carries a bright flare organ on its body — a warm glowing \
spot — so it reads as the flare-maker even with no flare going off. It is the \
brightest fixed element of the sprite against the orange body."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "four-directions"
title = "Four readable directions"
text = """
The movement frames read as the creature swimming in four distinct directions — \
down, up, left, and right — each with its head leading its direction of travel \
and a forked tail trailing behind, not the same blob repeated."""
sequences = ["walk-down", "walk-up", "walk-left", "walk-right"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Orange-and-flare palette"
text = """
Uses the Flarefish's palette from the brief (orange body, lighter underside, dark \
outline, warm flare organ) with no out-of-palette colors and no halo of stray \
pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each creature fills most of its own 32x32 frame cell, centered with a small \
margin; a swimming body never spills across the grid lines into the neighboring \
frame."""
weight = 1
domain = "fidelity"
