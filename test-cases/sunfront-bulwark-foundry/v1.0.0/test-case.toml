slug = "sunfront-bulwark-foundry"
name = "Sunfront Bulwark Foundry"
difficulty = "medium"
tags = ["voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Bulwark Foundry: an opaque-voxel heavy \
armored bunker-forge whose blast door raises and whose flywheel turns on their \
own auto-play animations while the building body stays fixed, painting discrete \
opaque cells with the voxel-anim tool one recorded operation at a time. The model \
invents whatever parts and joints it needs; the fixed contract is the two \
self-playing animations it must author — a `blast_door_raise` and a \
`flywheel_spin` — the reviewer can play back."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt and rig the SAME foundry at three sizes — `base` (this
# case's volume), `half` (each extent halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 66
height = 56
depth = 66
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log and renders nothing — rendering is on request via `voxel-anim render`.
# Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, or pivots: the model invents whatever
# skeleton the foundry needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author and whether each is a
# game-triggered playable or a self-playing idle. The model authors each animation's
# F-curves at run time with the voxel-anim `define-animation`/`add-keyframe`
# subcommands; `rig.json` is pre-seeded with these declarations so the contract
# exists from the first operation.
[model]

# `blast_door_raise` — the door cycle. A self-playing idle that raises the heavy
# front blast door straight up, holds it open for a beat, then drops it back shut
# along its vertical track — a weighty portcullis cycle that runs on its own.
[[model.animation]]
name = "blast_door_raise"
loop = true
auto_play = true

# `flywheel_spin` — the drive wheel. A self-playing idle that turns the great flank
# flywheel steadily about its axle, a full continuous revolution each loop, on its
# own and at rest.
[[model.animation]]
name = "flywheel_spin"
loop = true
auto_play = true

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected size.
# The seeded dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Bulwark \
Foundry and animates correctly — a heavy armored Duneforged bunker-forge whose \
blast door raises and drops and whose flywheel turns on their own auto-play \
animations while the building body stays put, with a clear solar-amber forge \
accent and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-bunker-forge"
title = "Reads as an armored bunker-forge"
text = """
From more than one angle the model reads unmistakably as a heavy, armored \
Duneforged bunker-forge: a squat, thick-walled fortified building with a broad \
blast door set into its front and a great drive flywheel on its flank. It is a \
massive fortified forge, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Blast door and flywheel cycle on their own"
text = """
The animated elements cycle on their own. Playing `blast_door_raise` lifts the \
heavy front blast door straight up, holds it open for a beat, then drops it back \
shut along a clean vertical track — a weighty portcullis cycle, not a \
constant-speed slide. Playing `flywheel_spin` turns the great flank wheel steadily \
about its axle, a full continuous revolution each loop with no jerk at the seam. \
Across each cycle nothing tears away from its mount or clips into the building."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Building body stays fixed"
text = """
Only the moving elements move: the front blast door as it raises and the flank \
flywheel as it spins. The bunker-forge body is the fixed base of the foundry — it \
stays put, never carried along by the door or the wheel. Both idles (\
`blast_door_raise` and `flywheel_spin`) run continuously while nothing else \
shifts."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Door and flywheel stay attached"
text = """
The blast door and the flywheel each stay attached to the building across their \
full range of motion: the door meets its front frame with no gap as it raises and \
the wheel meets its flank axle with no gap as it turns, neither floating free nor \
detaching at any point in the cycle."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze plating, \
sandstone masonry, iron mechanisms, and the solar-amber forge accent) with a \
clear amber accent, no out-of-palette colors, and no stray voxels drifting off \
the parts."""
weight = 1
domain = "fidelity"
