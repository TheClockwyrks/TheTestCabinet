# The **Kindle** variant: the same dive, but your light is a wide radial glow you
# feed by eating. It replaces the standard Trench sensing model — it does not add a
# second mode. Instead of a remembered fog of war uncovered by line-of-sight light,
# your kindle-glow senses only the *rock* around you (bending around corners),
# swelling as you eat and guttering when you stop; nothing is remembered, and the
# plankton and predators inside the glow are found only by a small line-of-sight
# light pocket or a sonar ping. Every path resolves against the version folder.
slug = "kindle"
name = "Kindle"
description = "The Kindle dive: your light is a wide radial glow you feed by eating that senses only the rock around you; nothing is remembered, and plankton and predators are found only by a small light pocket or a sonar ping."

# Kindle seeds its own sensing model at the common `specs/sensing.md` path (the
# base variant seeds the Trench model there instead), so the model sees a single,
# self-contained sensing spec with no mention of any other model.
spec = [{ source = "specs/sensing-kindle.md", dest = "specs/sensing.md" }]

# Sensing review items specific to the Kindle model, rolling up to the common
# `sensing` domain. The `title`, `gameplay`, and `game-over` references are common
# (both variants share the same single-dive menu), so this variant declares none.
[[review_item]]
id = "kindle-glow-terrain"
title = "The kindle-glow senses rock"
text = "A wide radial glow around the forager reveals the maze geometry — walls and corridor floor — including around corners (not line-of-sight), out to a radius that grows as you eat (from smaller than a sonar ping, out to roughly a ping's reach after a streak of ~8 plankton, larger beyond) and shrinks back within a few seconds when you stop. It reveals terrain only — never plankton, predators, or the drifter."
weight = 1
domain = "sensing"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "kindle-no-memory"
title = "Nothing is remembered"
text = "The trench keeps no map: the instant a tile leaves your kindle-glow, light pocket, or a live sonar mark it returns to flat black fog. Walls, plankton, predators, and the drifter are shown only while currently lit — leave a corridor and it goes dark again, exactly as before you arrived."
weight = 1
domain = "sensing"

[[review_item]]
id = "kindle-life-vs-rock"
title = "Rock far, life near"
text = "Plankton and predators are found only by your small line-of-sight light pocket or a sonar ping — never by the wide kindle-glow, which shows only rock. You can see the shape of a corridor well ahead yet not the plankton or the hunter waiting in it until you light it or ping it."
weight = 1
domain = "sensing"
