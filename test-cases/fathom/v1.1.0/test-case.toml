slug = "fathom"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Fathom"

# Relative difficulty (easy | medium | hard), surfaced on the site. Fathom asks
# for a fog-of-war visibility system, tile-locked maze movement, three distinct
# sensory predator behaviors, and several states — a self-contained 2D build, so it
# sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "maze", "stealth"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A bioluminescent forager grazing a pitch-dark trench, where the maze is hidden \
until your light or a sonar pulse reveals it, and three predators each hunt by a \
different signal you give off — your light, your sound, or its own flare."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. Fathom is a substantial build (fog of war, maze generation, three
# AIs, multiple states), so it gets a full three hours — comfortably more than a
# healthy build needs while still bounding a runaway session.
max_runtime_hours = 3
# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Asset files or directories seeded alongside the specs, each kept at its path
# relative to this version folder when seeded (so `assets/glimmerfin/` lands at
# `assets/glimmerfin/` in the run). Fathom ships a fixed set of pre-drawn art —
# generated by The Test Cabinet's own asset-generation cases — so every build
# renders the same sprites, tiles, and effects and differs only in code. Each
# entry is a sprite-sheet directory of per-frame PNGs; the build is required to
# use them (their frame layouts and compositing are the contract in
# `specs/assets.md`). The model still designs its own maze layout from the tiles.
# (A root key, so it must sit above the first `[table]` header below.)
assets = [
  "assets/glimmerfin",   # the player forager (sprite)
  "assets/lanternjaw",   # the Lanternjaw predator (sprite)
  "assets/gloamfin",     # the Gloamfin predator (sprite)
  "assets/flarefish",    # the Flarefish predator (sprite)
  "assets/flare-bloom",  # the Flarefish's radial flare (effect)
  "assets/trench-walls", # the trench tileset: wall autotile + floor + fog + gate
]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. The two variants are the same dive with a different
# **sensing** model — the signature system of Fathom — so each seeds its own
# `specs/sensing.md` (the common specs never seed one) plus the sensing review
# items for its model (all rolling up to the case's sole scoring domain). The menu,
# `gameplay`, and `game-over` references are common — both variants show the same
# single-dive menu:
#   - base   — Trench: a StarCraft-style remembered fog of war, line-of-sight
#              passive light, and a corridor-flooding sonar pulse.
#   - kindle — Kindle: the same fog of war as base, plus an outer **vision circle**
#              you carry (grows as you eat) beyond which the explored map is pitch
#              black. The circle reveals nothing — it only limits what of the
#              already-revealed trench is shown.
# This list is a root key, so it must sit above the first `[table]` header below.
variants = [
  "variants/base.toml",
  "variants/kindle.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern so the signature
# **sensing** system can be seeded per variant (see the `variants/` files): each
# variant seeds its own `specs/sensing.md`, so it is deliberately NOT listed here.
# The common specs are self-contained — they reference `specs/sensing.md` only by
# its stable path (always present in a run) and never assume a particular sensing
# model. All common specs are plain Markdown, seeded verbatim. A spec's `dest`
# defaults to its `source` (with a trailing `.hbs` stripped), so these need only
# name the source they seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/movement.md"

[[spec]]
source = "specs/predators.md"

[[spec]]
source = "specs/flow.md"

# The art-asset contract: which seeded sprites/tiles/effects the build must use,
# their frame layouts, and what is left to draw in code. Seeded for every variant
# so the manifest's `assets` (above) and this spec stay in lockstep.
[[spec]]
source = "specs/assets.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from the playable `base` reference-impl — the authored,
# correct build — and served as-is (seeded as a visual target, never rendered). See
# `reference/README.md` for how they are regenerated. Both variants show the same
# single-dive menu (`DIVE`, then `HOW TO PLAY`), so `title` is common, alongside
# `game-over`; `gameplay` and `sonar` depict the Base sensing model (the Kindle
# variant adds its own `vision-circle` view in `variants/kindle.toml`).
[[reference]]
view = "title"
media = "reference/screenshots/title.png"

[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# The sonar pulse mid-flight: the travelling wavefront flooding the corridors and
# reaching past the light. Common to both variants (both dives have sonar).
[[reference]]
view = "sonar"
media = "reference/screenshots/sonar.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-trench"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Game over"
dest = "proof/game-over.png"

[[proof]]
id = "sonar"
name = "Sonar pulse clip"
dest = "proof/sonar.webm"

[[proof]]
id = "hunt"
name = "Predator hunt clip"
dest = "proof/hunt.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# The case's sole scoring domain. Fathom is rated as one dive — reading the dark and
# evading the predators are a single, inseparable experience — so what were once two
# domains (sensing/fog and the hunt) are merged into this one domain, which is the
# run's overall rating. Every review item (common below, and each variant's own
# sensing items) rolls up to it implicitly, so none names a `domain`.
[[domain]]
id = "dive"
name = "The Dive"
description = "The whole dive: reading the pitch-dark trench through your light and the corridor-flooding sonar, the fog and what is remembered, the brightness dial, and the three predators — each one's sense, its tell, and its counter — the den and release schedule, ink, and getting caught."

# Reviewer checklist items, common to every variant. The major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss. Reporter-side material: never
# seeded into a run, so the model never sees the checklist; each restates a
# requirement the seeded specification already states. A variant adds its own
# items in its `variants/*.toml` file. Each item is worth `weight` points
# toward the run's score; the reviewer records a pass/fail verdict for each before
# the run can be published. The single domain's rating stays the reviewer's call.
# The sensing model differs by variant, so the fog/memory, passive-light, and
# brightness review items are declared per variant (see `variants/*.toml`). Sonar
# is common to both variants, so its item stays here.
[[review_item]]
id = "sonar-flood"
title = "Sonar travels through corridors as a wavefront"
text = "A sonar pulse is a travelling wavefront (drawn procedurally, not a sprite ring): it flows outward through the open corridors — bending around corners and reflecting off walls, not expanding as a circle — out to its range, revealing near tiles before far ones and their walls, and marking any predator it reaches for a brief window beyond the bend, as the front arrives. The drawn crest should read as arcs that bulge the way the sound is moving, brightest at the leading edge."
weight = 1
reference = "sonar"
proof = "sonar"
sub_items = [
  { id = "wavefront", title = "Travels as a wavefront through corridors, bending and reflecting" },
  { id = "near-before-far", title = "Reveals near tiles before far ones" },
  { id = "marks-predators", title = "Marks any predator it reaches" },
]

[[review_item]]
id = "sonar-attracts-gloamfin"
title = "Sonar is heard"
text = "Emitting a sonar pulse makes noise: if it floods over the Gloamfin it hands the Gloamfin a fix on you and sets it chasing — pinging near the Gloamfin feeds the chase rather than helping you."
weight = 1

[[review_item]]
id = "lanternjaw-behavior"
title = "The Lanternjaw hunts light"
text = "The Lanternjaw's detection range grows with your brightness, and it is shaken by going dim or by ink. Its bulb-light is always visible at any distance — drawn to look almost identical to the bonus drifter, so you cannot tell the two apart at a glance — while its body stays hidden by the dark. Until it senses you it also *moves* exactly like a drifter — the same slow drift and wander at half the forager's speed (about 64 px/s), not the ordinary predator pace — so it is indistinguishable from a real drifter; the instant it fixes on you it drops the disguise and hunts at its chase speed. Eating a streak near it pulls it straight to you."
weight = 1
sub_items = [
  { id = "brightness-range", title = "Detection range grows with your brightness" },
  { id = "shaken", title = "Going dim or ink shakes it" },
  { id = "bulb-lookalike", title = "Bulb-light always visible, near-identical to the drifter" },
  { id = "wander-disguise", title = "While undetected it drifts exactly like a drifter (same slow 64 px/s wander)" },
]

[[review_item]]
id = "gloamfin-hunt"
title = "The Gloamfin hunts sound"
text = "The Gloamfin wanders at the ordinary predator speed with no speed wind-up over time, emitting its own violet pings. A ping — one of its own or yours — that catches you, or hearing you within about two tiles, hands it a fix and it chases the tile the ping found you on: it out-paces you slightly on a straight run (only about 5% faster), but every corner it turns to follow you drops it below your speed before it ramps back up, so cutting corners is how you open a gap and escape (a straight sprint alone won't). Reaching where it last heard you and finding you gone, it casts about and, after a short delay, fires a guaranteed 'lost you' ping — break away during that window to lose it. While it holds you at close range (within hearing) it goes silent instead of spamming pings. Ink does nothing to it."
weight = 1
proof = "hunt"
sub_items = [
  { id = "steady-wander", title = "Wanders at steady ordinary speed, no wind-up" },
  { id = "sprints-to-ping", title = "A ping (its or yours) or close hearing sets it chasing to that tile" },
  { id = "corners-slow-it", title = "Cornering drops it below your speed (then it ramps back) — cut corners to escape" },
  { id = "lost-you-window", title = "Fires a guaranteed 'lost you' ping you can break away during" },
  { id = "silent-when-close", title = "Goes silent while holding you at close range, not spamming pings" },
]

[[review_item]]
id = "flarefish-flare"
title = "The Flarefish's flare"
text = "The Flarefish makes no tell of its own but its flare — though your light or a sonar pulse still reveals its body like any predator, so it is not literally unseeable. It finds you two ways: by drifting up on you and catching your light exactly as the Lanternjaw does (a range that grows with your brightness, in line of sight), which runs even while it wanders — so it does not sit idle waiting to flare — or by its flare, a wall-ignoring bloom that locks on if you are anywhere in its radius at any moment while it burns (the disc moves with the Flarefish and can sweep over you). On either acquisition the detection alert fires and it chases exactly like the Lanternjaw, no longer flaring; lose it and its flare re-arms on a fresh timer. Staying outside the flare and out of light range, or dropping ink, prevents it acquiring you."
weight = 1
sub_items = [
  { id = "light-sense", title = "Also senses your light like the Lanternjaw — drifting into your glow fixes it on you, no flare needed" },
  { id = "flare-lock", title = "Its flare locks on if you're in the bloom at any moment (ignores walls, disc moves with it)" },
  { id = "chase-like-lanternjaw", title = "On acquiring you it stops flaring and chases like the Lanternjaw; lose it and the flare re-arms" },
]

[[review_item]]
id = "detection-alert"
title = "Detection alert"
text = "When the Gloamfin's ping, the Flarefish's flare, or the Flarefish's ordinary light-sense (it drifts up unseen and fixes on your glow) acquires you, a clear, unmistakable alert (a bright flash in the predator's color, the predator shown lit) fires so you know at a glance you have been detected. The Lanternjaw has no such alert — its always-visible bulb is its standing tell."
weight = 1

[[review_item]]
id = "enemy-effects-reveal"
title = "Enemy effects and the amber look-alikes"
text = "The Flarefish's flare reveals tiles for you (a radial disc, floor and wall, through walls); the Gloamfin's ping reveals nothing (only its violet wavefront, sweeping out through the corridors, is visible). The bonus drifter and the Lanternjaw's bulb-light are both drawn as near-identical amber look-alikes (shown at any distance in the Trench dive, only within your vision circle in Kindle)."
weight = 1
sub_items = [
  { id = "flare-reveals", title = "The Flarefish's flare reveals a radial disc of tiles (floor and wall, through walls)" },
  { id = "ping-reveals-nothing", title = "The Gloamfin's ping reveals nothing — only its violet wavefront is visible" },
  { id = "amber-lookalikes", title = "The drifter and the Lanternjaw's bulb are near-identical amber look-alikes" },
]

[[review_item]]
id = "ink-blinds-sight"
title = "Ink blinds the seers"
text = "Ink blinds the two sight-based predators — the Lanternjaw and the Flarefish — breaking their fix, but does nothing to the sound-based Gloamfin."
weight = 1

[[review_item]]
id = "catch-and-descend"
title = "Caught and descending"
text = "Contact with any predator costs a life and resets the trench — the forager returns to its start and the predators to the den — while the plankton you have already eaten stay eaten; clearing every plankton descends to a deeper trench that is faster and harder to read (lower sonar range)."
weight = 1
reference = "game-over"
proof = "game-over"
sub_items = [
  { id = "caught", title = "Contact costs a life and resets the trench, eaten plankton stay eaten" },
  { id = "descend", title = "Clearing every plankton descends to a deeper, harder trench" },
]

[[review_item]]
id = "audio"
title = "Synthesized audio"
text = "Audio is required and synthesized with the Web Audio API (no audio files): distinct short cues for eating a plankton, emitting a sonar pulse, releasing ink, a predator's own pulse or flare, getting caught, and descending. It stays fully playable muted (a mute toggle is provided), never fails to run or load if audio cannot start, and does not begin until the player first interacts."
weight = 1
sub_items = [
  { id = "cues", title = "Distinct synthesized cues for eating, sonar, ink, a predator's pulse/flare, being caught, and descending" },
  { id = "graceful", title = "Plays fully muted with a working mute toggle, and no sound plays until the player first interacts" },
]

[[review_item]]
id = "states-complete"
title = "Game states"
text = "Every game state is reachable and behaves correctly: title menu, how-to-play, the dive countdown, pause (resume/restart/quit), trench-cleared, and game-over (play again/menu)."
weight = 1
reference = "title"
proof = "title"

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The entire 1280x720 stage — the full maze region, the HUD, and all four edges — stays visible, fitted, and centered at any window size and pixel density, including on load before any input."
weight = 1
