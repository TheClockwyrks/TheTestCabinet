  visual design), ../specs/assets.md (the provided art), ../specs/sensing.md
  (fog, light, sonar), ../specs/predators.md, and ../specs/playfield.md (HUD).

  This frame embeds the real seeded assets (../assets/): the trench tileset draws
  the maze (floor + wall autotile), and the forager and predators are their sprite
  sheets; the sonar pulse has no sprite and is drawn procedurally (the sonar-wave
  SVG overlay of arcs below). Live positions and the maze layout vary at
  runtime; this is a representative layout for a soft palette/layout comparison,
  not a strict pixel match. A tile (col,row) has its top-left at
  (64 + col*32, 80 + row*32); inside .maze, at (col*32, row*32).

  The frame shows: a lit pocket of revealed corridors (rounded rock walls around
  open floor) fading into black fog around the forager; plankton in the corridors;
  the Lanternjaw glimpsed at the edge of the light; the forager's sonar wavefront
  travelling past the light and revealing a corridor around a bend, where the Gloamfin
  is glimpsed beyond sight, its own (violet) ping wavefront sweeping back toward you.
-->
