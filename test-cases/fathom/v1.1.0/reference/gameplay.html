  the maze (floor + wall autotile), and the forager, predators, and sonar pulse
  are their sprite/effect sheets. Live positions and the maze layout vary at
  runtime; this is a representative layout for a soft palette/layout comparison,
  not a strict pixel match. A tile (col,row) has its top-left at
  (64 + col*32, 80 + row*32); inside .maze, at (col*32, row*32).

  open floor) fading into black fog around the forager; plankton in the corridors;
