# The double-size variant: the same keep sculpted in a volume with each extent
# doubled from the case's base 90x120x90. Its `[voxel]` OVERRIDES the case volume for
# runs of this variant, and the brief is rendered at these dimensions.
slug = "double"
name = "Double Size"

[voxel]
width = 180
height = 240
depth = 180
background = "transparent"
