slug = "sunfront-bastion"
name = "Sunfront Bastion"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Bastion: an opaque-voxel fortified keep \
whose solar collector crown rotates, whose gate raises, and whose beacon slowly \
turns on their own self-playing animations while the keep stays fixed. The model \
invents whatever parts and joints it needs; the fixed contract is three animations \
it must author — a `crown_spin`, a `gate_raise`, and a `beacon_spin` — that a game \
plays back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME keep at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 90
height = 120
depth = 90
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log and renders nothing — rendering is on request via `voxel-anim render`.
# Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (a game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model authors
# each animation's F-curves at run time with `voxel-anim`
# `define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations
# so the contract exists from the first operation.
[model]

# `crown_spin` — the solar collector crown's sweep. A self-playing idle that turns
# the crown ringing the keep's summit continuously on its own, without a caller.
[[model.animation]]
name = "crown_spin"
loop = true
auto_play = true

# `gate_raise` — the front gate cycle. A self-playing idle that lifts the gate in the
# front wall straight up, holds it open, then lowers it back down, on its own each
# loop.
[[model.animation]]
name = "gate_raise"
loop = true
auto_play = true

# `beacon_spin` — the signal beacon's sweep. A self-playing idle that turns the
# beacon crowning the central spire slowly and continuously on its own.
[[model.animation]]
name = "beacon_spin"
loop = true
auto_play = true

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Bastion and \
runs correctly — a huge, detailed fortified keep whose solar collector crown \
rotates, whose gate raises and lowers, and whose beacon slowly turns on their own \
self-playing animations while the keep base stays put, with a clear solar-amber \
energy accent and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-bastion"
title = "Reads as a fortified keep"
text = """
From more than one angle the model reads unmistakably as a Duneforged home keep: a \
massive, heavily detailed fortress — thick ramparts and towers rising to a walled \
summit, a gated front wall, and a central spire — not an abstract stack of boxes. \
It is the biggest, most detailed building of the roster."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Crown rotates, gate raises, and beacon spins on their own"
text = """
The three animated elements cycle continuously on their own, each on its self-playing \
animation: `crown_spin` turns the solar collector crown a full revolution about the \
vertical axis through its center, `gate_raise` lifts the gate straight up and back \
down in the front wall, and `beacon_spin` turns the beacon slowly atop the spire. \
Across each cycle no part of the crown, gate, or beacon tears away from its mount or \
clips into the keep — each moves as one solid piece about the correct axis, with an \
eased, deliberate cadence rather than a mechanical linear slide."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Keep stays fixed; only the moving parts move"
text = """
Only the moving elements move: the crown as it rotates on `crown_spin`, the gate as \
it raises on `gate_raise`, and the beacon as it spins on `beacon_spin`. The keep \
itself — its ramparts, towers, and central spire — stays put, the fixed base of the \
machine, never carried along by the crown, the gate, or the beacon."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Crown, gate, and beacon stay attached"
text = """
Each animated element stays attached to the keep across its full range of motion: the \
crown meets the summit at its ring as it turns, the gate meets the front-wall opening \
at its mount as it lifts and lowers, and the beacon meets the spire top at its base as \
it turns, with no gap and never floating free or detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a clear \
amber accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
