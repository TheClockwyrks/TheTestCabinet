[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged Dual Contouring mesh reads as the Aegis and \
poses correctly — a colossal walking fortress, far larger than any buildable unit, \
its hard-surface hull carrying crisp panel seams and clean sharp edges, striding on \
six independent legs, each a three-segment thigh/shin/flat-foot chain that plants its \
foot flat and lifts it clear of the ground under the model-authored `march`, whose \
central main turret fine-traverses within a narrow forward cone and whose cannon \
elevates on their caller joints without detaching while the two side-mounted turrets \
independently swing to cover their own flanks, the decorative radar sweeps on its own, \
and the hull stays put, with a clear solar-amber accent and the disciplined Duneforged \
palette."""

[[review_item]]
id = "reads-as-fortress"
title = "Reads as a giant six-legged walking fortress"
text = """
From more than one angle the model reads unmistakably as a giant six-legged walking \
fortress — plainly far bigger and broader than an ordinary war machine, a colossal \
striding stronghold that dwarfs every buildable unit: a tiered, prowed armored \
citadel (not a plain box) riding raised on six heavy legs (three down each side), a \
big main turret with a long forward cannon on top, a rotating secondary turret out \
on each side sponson, and a sweeping radar vane above. It is a bristling, detailed \
multi-gun war machine, not an abstract stack of blobs on legs."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "sharp-hard-surface"
title = "Crisp hard-surface read with sharp edges and panel seams"
text = """
The mesh takes advantage of Dual Contouring's sharp-feature preservation: the hull \
and turrets read as hard-surface armor with CRISP edges, clean corners, and defined \
panel seams — not the rounded, melted look of a smoothed surface. Prow bevels, deck \
steps, sponson shelves, and plating seams meet at sharp lines (hard unions and/or the \
`--sharp` tag), while any intentionally rounded forms (a turret dome, a barrel) stay \
smooth by choice, so the model shows deliberate control of where edges are crisp \
versus soft. There is no stray floating geometry off the parts."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride on planted feet without clipping the ground"
text = """
Playing `march` strides the fortress on its six independent three-segment legs: each \
leg sweeps on its own `hip_*`, folds at its own reverse-bending `knee_*`, and keeps \
its foot flat on its own `foot_*` ankle. Each foot has a clear PLANTED STANCE — flat \
and still on the ground while the fortress passes over it — then lifts clear, swings \
forward, and plants again with weight, the six legs cycling as two alternating \
tripods (three feet always down), NOT as one rigid bank and never flailing in a \
continuous arc. No foot is dragged or driven down through the ground, the knees bend \
the right (digitigrade) way, and each shin stays attached to its thigh, each foot to \
its shin, and each thigh to the hull across the whole range."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "main-gun-forward"
title = "Main cannon aims forward; gun elevates"
text = """
Driving `main_turret_yaw` makes only small corrections that keep the main cannon \
pointed forward within a narrow cone — it does NOT spin the turret to the sides — \
and driving `main_gun_pitch` raises and lowers the cannon, with no geometry tearing \
away from the mount or clipping into the hull across either joint's range."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "side-turrets-traverse"
title = "Side turrets are side-mounted and traverse their own flank"
text = """
Each side turret is plainly mounted OUT ON ITS OWN SPONSON on the side of the hull \
(not on top) and rotates to aim independently through its caller joint — \
`left_turret_yaw` and `right_turret_yaw` — swinging only within an arc that covers \
its own flank (the left turret sweeping the left side, the right turret the right), \
each about its own mount without detaching from the hull."""
weight = 2
