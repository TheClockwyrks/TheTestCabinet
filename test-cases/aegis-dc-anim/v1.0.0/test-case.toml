# The required caller-driven main-turret traverse: a game addresses `main_turret_yaw`
# by name to make FINE corrections that keep the main cannon pointed forward. It is
# deliberately a NARROW forward cone (about a fifth of a turn each way), not a full
# swing — the fortress turns its whole hull to aim, and the main gun's target is
# what drives that facing. `rest = 0` faces straight forward (+z).
[[model.joint]]
name = "main_turret_yaw"
part = "main_turret"
kind = "rotation"
axis = "y"
pivot = [44, 60, 56]
min = -0.35
max = 0.35
rest = 0.0
drive = "caller"

# The required caller-driven main-gun elevation: a game addresses `main_gun_pitch`
# by name to raise and lower the main cannon. `rest = 0.1` is a slight combat
# elevation; `max = 0.8` lobs high, `min = -0.2` depresses the barrel.
[[model.joint]]
name = "main_gun_pitch"
part = "main_gun"
kind = "rotation"
axis = "x"
pivot = [44, 66, 74]
min = -0.2
max = 0.8
rest = 0.1
drive = "caller"

# The left side turret's own caller-driven traverse. A game aims it independently of
# the main turret, but only within an arc covering the fortress's LEFT flank — from
# roughly straight ahead round to straight out to the left (negative yaw turns it
# toward -x, the left side). `rest = -0.8` sits it pointed forward-left.
[[model.joint]]
name = "left_turret_yaw"
part = "left_turret"
kind = "rotation"
axis = "y"
pivot = [12, 44, 52]
min = -1.6
max = 0.0
rest = -0.8
drive = "caller"

# The right side turret's own caller-driven traverse, mirroring the left: an arc
# covering the RIGHT flank, from straight ahead round to straight out to the right
# (positive yaw turns it toward +x, the right side).
[[model.joint]]
name = "right_turret_yaw"
part = "right_turret"
kind = "rotation"
axis = "y"
pivot = [75, 44, 52]
min = 0.0
max = 1.6
rest = 0.8
drive = "caller"

# The decorative radar sweep: an `auto` joint driven by the self-playing `radar_spin`
# animation, so the vane turns on its own forever. rot y, a full turn each way. It is
# the only non-leg auto joint — it keeps sweeping under both playable animations.
[[model.joint]]
name = "radar_spin"
part = "radar"
kind = "rotation"
axis = "y"
pivot = [44, 72, 40]
min = -3.14159
max = 3.14159
rest = 0.0
drive = "auto"

# --- Required animations. Each is a DECLARATION ONLY — a name, its loop/auto_play
# intent, and the joints the model MUST drive. There are NO keyframes/tracks here:
# the model authors each animation's F-curves at run time with the `dc-anim`
# `define-animation` / `add-keyframe` subcommands (see the brief). rig.json is
# pre-seeded with these declarations so the contract exists from the first op. ---

# `march`: the WALK (playable — `auto_play = false`). It drives all EIGHTEEN leg
# joints — the hips sweep fore/aft, the knees fold to lift each foot, the ankles keep
# the feet flat — in an alternating two-TRIPOD gait (tripod A = lf/rm/lr steps
# together, tripod B = rf/lm/rr a half period out of phase, so three feet are planted
# at all times). It touches NO gun joint, so the turrets and cannon hold at rest; the
# `auto` radar keeps sweeping on its own.
[[model.animation]]
name = "march"
period_ms = 1600
loop = true
auto_play = false
joints = [
  "hip_lf", "knee_lf", "foot_lf",
  "hip_lm", "knee_lm", "foot_lm",
  "hip_lr", "knee_lr", "foot_lr",
  "hip_rf", "knee_rf", "foot_rf",
  "hip_rm", "knee_rm", "foot_rm",
  "hip_rr", "knee_rr", "foot_rr",
]

# `bombardment`: the WEAPON showcase (playable — `auto_play = false`). It drives only
# the four gun caller joints — the main cannon lobs forward within its narrow cone
# while the two side turrets each sweep their own flank arc independently and out of
# phase. It touches NO leg joint, so the legs hold planted (the fortress stands still
# and fights); the `auto` radar keeps sweeping on its own.
[[model.animation]]
name = "bombardment"
period_ms = 4000
loop = true
auto_play = false
joints = ["main_turret_yaw", "main_gun_pitch", "left_turret_yaw", "right_turret_yaw"]

# `radar_spin`: the decorative radar sweep (`auto_play = true` — a self-playing idle).
# It drives only the `radar_spin` auto joint and plays continuously under both
# playable animations and at idle.
[[model.animation]]
name = "radar_spin"
period_ms = 3000
loop = true
auto_play = true
joints = ["radar_spin"]

