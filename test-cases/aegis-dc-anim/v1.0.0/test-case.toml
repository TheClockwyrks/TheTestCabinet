slug = "aegis-dc-anim"
name = "Aegis (Dual Contouring, Animated)"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "mesh", "dual-contouring", "rig", "walker"]
summary = """
Mesh and rig the Aegis with the Dual Contouring animated binary: an 88x80x104 \
signed-distance-field colossal walking fortress, extracted as a crisp, hard-surface \
mesh with sharp panel seams and clean edges, striding on six independent legs — each a \
three-segment, two-joint chain (thigh + shin + flat foot) over its own footprint so \
every foot plants flat and lifts clear of the ground — its central main turret \
fine-correcting within a narrow forward cone while its cannon elevates, and two \
side-mounted turrets each traversing to cover only their own flank — composited one \
recorded primitive at a time from CSG primitives (with Dual Contouring's `--sharp` tag \
for crisp edges), and rigged with a model-authored march (a two-tripod walk), a \
weapon-only bombardment, and a self-playing radar sweep the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "dc-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed volume that frames each part's signed-distance field (the 3D analog of a
# 2D canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxel units. This is a MESHED case, so the volume bounds the continuous field the
# Dual Contouring surface is extracted from — primitive centers and extents are
# real-valued within these bounds, not snapped to an integer grid. The Aegis is
# deliberately huge — a walking fortress with a far larger footprint than any
# buildable unit, riding raised on legs — so its volume is broad, deep, and tall.
# Each part is authored as its OWN field in this shared volume's coordinates. The
# field always starts EMPTY; `background` is only the clear color behind the wgpu
# preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 88
height = 80
depth = 104
background = "transparent"

# The meshing tool. `dc-anim` (Dual Contouring, animated) is the only way to shape
# the field and edit the rig; every operation targets a part with `--part <name>`,
# records to that part's operation log, and re-renders that part's wgpu preview. Run
# `dc-anim --help` for the field primitives, the DC-only `--sharp`/`--smooth` tag,
# AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "dc-anim"
preview = "parts/{part}.png"

# The recorded operation log — the authoritative output the run collects, one per
# part (the `{part}` token expands to each declared part name): the ordered record of
# every `dc-anim` op the model issued for that part, from which the scored model is
# regenerated. The `dc-anim` binary additionally emits each part's extracted
# `mesh.json` (Dual Contouring extracts it from that part's field) at its own fixed
# path, and the composited rig rides in `rig.json`, so neither is named here.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts, these joints, and the required ANIMATIONS
# (declared here as name + intent + the joints each drives; the model authors their
# F-curves at run time). At run time it MAY add further parts, joints, and animations
# of its own (recorded in rig.json) beyond what this table requires. `pivot` is
# `[x, y, z]` in the volume's coordinates. `rig.json` is pre-seeded from this table so
# the contract exists from the first operation.
#
# The rig has two kinds of moving part, and the drive of each is deliberate:
#   * The eighteen leg joints (a hip, a knee, and a foot per leg) are `auto` —
#     driven by the model-authored `march` walk animation. The two gun turrets and
#     the cannon are `caller` — a game (and the review viewer's `bombardment`
#     animation) drive them by name — so the weapon animation can pose the guns while
#     the legs stay planted and the walk can stride the legs while the guns stay put.
#   * The `radar` sensor vane is `auto`, driven by the self-playing `radar_spin`
#     animation (auto_play), so it keeps sweeping under BOTH playable animations and
#     at idle.
[model]

# The armored fortress hull: the root part (no parent), fixed to the world. A
# tiered, prowed citadel — NOT a plain box — that carries the main turret up top, a
# side turret out on each sponson, the sweeping radar mast, and the six leg hips
# tucked under its belly. It rides raised well off the ground on the legs.
[[model.part]]
name = "chassis"
pivot = [0, 0, 0]

# --- The six legs. Each leg is an independent THREE-segment chain — an upper thigh,
# a lower shin, and a short FLAT foot — on THREE pivots (a hip on the chassis, a knee
# between thigh and shin, and an ankle between shin and foot). The bent knee lifts
# the foot clear on its swing while the flat foot stays level, and each leg is its
# OWN chain on its OWN hip directly above its OWN foot — so no single pivot drags a
# fore-and-aft bank of feet below ground. Three legs down each side: front (f),
# middle (m), rear (r). Parent chain per leg: thigh_<id>←chassis, shin_<id>←thigh_<id>,
# foot_<id>←shin_<id>. ---

# Left-front thigh, hung from its hip under the left-front corner of the hull.
[[model.part]]
name = "thigh_lf"
parent = "chassis"
pivot = [14, 30, 78]

# Left-front shin, hung from the left-front knee down toward the ankle.
[[model.part]]
name = "shin_lf"
parent = "thigh_lf"
pivot = [10, 14, 78]

