slug = "thunderhead"
experimental = true
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, which proofs the build
# must submit, and which validation checks run. The harness reads this file to
# resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Thunderhead"

# Relative difficulty (easy | medium | hard), surfaced on the site. Thunderhead asks
# for a procedurally generated 3D world of mountainous islands under an animated
# cloud sea; a fleet of provided rigid models rendered and articulated in real time;
# two-scale command-and-possession control across surface, air, and murk; a
# class-based gunnery model with per-turret and per-barrel simulation; a damage model
# of armor, shields, resonance, fire, and flooding; detection and a fog of war; a
# reinforcement economy; three asymmetric powers; and an AI opponent — the catalog's
# largest build, and the sole hard case, deliberately built to exceed current models.
difficulty = "hard"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["strategy", "action", "simulation", "3d", "naval"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A real-time combined-arms fleet-command game over a procedurally generated \
archipelago drowned in a cloud sea: command a fleet from a tactical view and drop \
into direct control of any unit — and any weapon station aboard it — to fly its \
fighters, lay its guns, or dive its submersibles, while the rest of the fleet fights \
on under your orders. Three asymmetric powers — the industrial Ironbound, the elegant \
Meridian, and the crystalline Geode — fight for command of the sky. Destroy the enemy \
flagship to win; lose your own and the battle is over."""

# Site-facing prose describing the case, relative to this version folder. NOT seeded
# into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run (with
# the seeded specs and the selected variant) and handed to the model as the build
# instruction. Injects the in-container workspace path via a template variable.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Thunderhead is the catalog's largest build — a procedural 3D world, a
# provided-model fleet rendered and articulated in real time, two-scale
# command-and-possession control, a class-based gunnery and damage model, fog of war,
# an economy, three asymmetric powers, and an AI opponent — so it gets ten hours.
max_runtime_hours = 10

# Starter workspace seeded into the root of every run before the specs. It gives the
# model a baseline project: a `package.json` that pins `playwright` as a dev
# dependency, so the browser tooling is a visible, project-local dependency. The
# seeded files land at the run root (`workspaces/base/package.json` → `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. Installs the workspace's dependencies and downloads the
# Playwright Chromium build (the base image ships the OS libraries Chromium links
# against, but not the browser binary), so the model can build and verify immediately
# against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# The provided unit models are seeded via the `assets` key once they are authored
# (via the dual-contouring asset-generation cases). Until then this case is not run;
# see `assets/README.md` and `specs/assets.md`. When the models are in place, add:
#   assets = ["assets"]
# so the model files and their manifest seed into the run root.

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This version offers a single `base` variant — the standard Open Battle. It supplies
# the `title` view's mockup; `tactical`, `control`, and `game-over` are common. This
# list is a root key, so it must precede the first table header (`[build]`).
variants = ["variants/base.toml"]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern. All common specs are plain
# Markdown, seeded verbatim.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/world.md"

[[spec]]
source = "specs/factions.md"

[[spec]]
source = "specs/units.md"

[[spec]]
source = "specs/command.md"

[[spec]]
source = "specs/combat.md"

[[spec]]
source = "specs/recon.md"

[[spec]]
source = "specs/battle.md"

[[spec]]
source = "specs/flow.md"

[[spec]]
source = "specs/assets.md"

[[spec]]
source = "specs/mode.md"

# Proof of implementation: instructs the build to capture evidence at the exact paths
# the `[[proof]]` entries below declare. The paths in this spec and in the `[[proof]]`
# entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup the harness renders to a screenshot and seeds as a visual target. The `title`
# view is variant-specific (declared per variant); `tactical`, `control` (both
# HUD-only), and `game-over` look the same in every variant.
[[reference]]
view = "tactical"
path = "reference/tactical.html"

[[reference]]
view = "control"
path = "reference/control.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title screen"
dest = "proof/title.png"

[[proof]]
id = "world"
name = "Generated world"
dest = "proof/world.png"

[[proof]]
id = "tactical"
name = "Tactical HUD"
dest = "proof/tactical.png"

[[proof]]
id = "control"
name = "Direct-control gunnery"
dest = "proof/control.png"

[[proof]]
id = "wireframe"
name = "Wireframe frame"
dest = "proof/wireframe.png"

[[proof]]
id = "engagement"
name = "Engagement clip"
dest = "proof/engagement.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. A reviewer rates each independently while playing the build, and
# the run's overall rating is the WORST across them — a polished world cannot mask a
# broken gunnery model or an AI that does not fight. Every case declares at least one.
[[domain]]
id = "worldgen"
name = "World & rendering"
description = "The procedurally generated 3D world — mountainous islands, floating islands, the animated cloud sea and murk, and procedural surface color — the tilted tactical camera and direct-control views, the frame rate, the wireframe mode, and the loading and articulation of the provided unit models."

[[domain]]
id = "command"
name = "Command & possession"
description = "The tactical command layer and fleet orders, and the two-scale possession model: taking a unit and a station aboard it, ambient steering with autopilot hand-off, station switching, and the auto-firing of everything not manned."

[[domain]]
id = "combat"
name = "Gunnery & damage"
description = "The class-based ship gunnery with its per-turret and per-barrel simulation and the crosshair status read-out, the per-power weapon families, aircraft and submarine ordnance, anti-air, and the damage model (armor, shields, resonance, and battle damage)."

[[domain]]
id = "factions"
name = "The three powers"
description = "The asymmetry of the Ironbound, Meridian, and Geode: their distinct weapon families, defense-and-sustain paradigms, mobility, roster gaps, and signature mechanics (damage control, shields and blink, and the resonance web), all playable and AI-commanded."

[[domain]]
id = "recon"
name = "Detection & fog"
description = "The fog of war: detection by sight and sensors, terrain occlusion and high-ground vantage, the concealing murk, and submarine stealth and sub-hunting."

[[domain]]
id = "battle"
name = "The battle"
description = "The match loop: deployment, the requisition economy and per-power reinforcement, aircraft supply, escalation, the flagship win/loss condition, and the AI opponent."

# Reviewer checklist items, common to every variant. These are the major, observable
# requirements a reviewer must explicitly check by playing the build — what validation
# cannot judge and is easy to miss. They are reporter-side: never seeded, so the model
# never sees the checklist; each restates a requirement the seeded specification
# already states. Each is worth `weight` points; the reviewer records a pass/fail
# verdict for each before the run can be published.
[[review_item]]
id = "islands-cloud-sea"
title = "Archipelago & cloud sea"
text = "Each match procedurally generates a coherent world of mountainous islands and ridges separated by murk-filled straits — peaks breaking ABOVE the cloud line as islands, low terrain drowned in the murk below it — with an ANIMATED cloud-sea surface that visibly moves, and at least a few FLOATING islands hanging in the sky or murk as vertical cover. Landmasses are watertight; it reads as a coherent world, not a flat plane or random noise."
weight = 3
domain = "worldgen"
proof = "world"

[[review_item]]
id = "worldgen-guarantees"
title = "Fair, varied generation"
text = "The terrain surface is varied by PROCEDURAL NOISE (grass, rock, scree, snow on high peaks), not flat fills. Two opposed deployment zones are clear, connected by cloud-top routes, and not materially unequal, with room to fight in all three bands (open sky, cloud-top lanes, and deep murk). Degenerate maps (fleets walled apart, a domain denied) are regenerated rather than shipped."
weight = 2
domain = "worldgen"
proof = "world"

[[review_item]]
id = "tactical-camera"
title = "Tilted 3D tactical camera"
text = "The tactical view is a TILTED, orbiting overhead camera (never straight top-down) that pans, rotates, and zooms and keeps the relief of the islands and the depth of the cloud sea legible — the world clearly reads as 3D, not a flat map."
weight = 2
domain = "worldgen"
proof = "tactical"

[[review_item]]
id = "renderer-perf"
title = "Real-time 3D & performance"
text = "The world renders in real-time 3D (WebGL/WebGPU) and sustains a playable frame rate (target 30+ FPS) during a large engagement with both fleets, aircraft, and effects on screen, with the performance overlay showing live FPS. The wireframe toggle reveals BOTH the generated terrain and the provided unit models as wireframe."
weight = 2
domain = "worldgen"
proof = "wireframe"

[[review_item]]
id = "provided-models"
title = "Provided models, articulated"
text = "The game LOADS and uses the provided rigid unit models (not primitives of its own) and DRIVES THEIR JOINTS from the simulation: turrets traverse and elevate to aim, gun barrels move, rotors and propellers spin, and a destroyed turret reads wrecked. Units are colored per power and carry an allied/hostile allegiance marker."
weight = 2
domain = "worldgen"
proof = "control"

[[review_item]]
id = "possession-two-scales"
title = "Two-scale command & possession"
text = "The player commands the fleet from the tactical view AND can drop into direct control of any owned unit and any station aboard it, then release back to command. Both granularities work: switching WHICH UNIT is inhabited and WHICH STATION is manned aboard it, with the rest of the fleet fighting on under orders while the player is away."
weight = 3
domain = "command"
proof = "engagement"

[[review_item]]
id = "ambient-steering"
title = "Ambient steering & autopilot"
text = "Possessing any ship, aircraft, or submarine gives its MOVEMENT directly (WASD steer/throttle; a submarine also controls depth) regardless of which station is manned, with the mouse aiming and firing — there is NO separate bridge station. A unit under an order auto-steers to carry it out until the player gives a movement input, which disconnects the autopilot into manual control."
weight = 2
domain = "command"

[[review_item]]
id = "autofire-orders"
title = "Auto-fire & standing orders"
text = "Manning one station leaves every OTHER weapon on the unit firing automatically under its AI (manning the surface guns never silences the anti-air). An unpossessed unit carries out its standing order, and a released unit and any station the player leaves resume AI control — nothing goes dark."
weight = 2
domain = "command"

[[review_item]]
id = "fleet-orders"
title = "Fleet orders"
text = "Selection (single, box, and control groups) and the order set all work and are carried out: Move, Attack, Escort, Hold, Patrol, Stance (aggressive/defensive/hold-fire), Altitude (dive/surface for capable units), and carrier Air operations. Ordered units path to their goal around the terrain rather than through it."
weight = 2
domain = "command"
proof = "tactical"

[[review_item]]
id = "gunnery-classes"
title = "Class-based ship gunnery"
text = "A warship's guns are controlled by CLASS through a single crosshair — surface guns, anti-air, torpedoes — not one turret at a time. The SURFACE-GUNS class holds both the long-ranged MAIN turrets and the short-ranged SECONDARY guns, so a DISTANT aim point fires only the main guns while a close one brings both to bear; every intact, bearing, in-range, loaded turret of the manned class fires at the crosshair."
weight = 3
domain = "combat"
proof = "control"

[[review_item]]
id = "gunnery-readout"
title = "Per-turret status read-out"
text = "While a gun class is manned, a ring of small, unlabeled dots around the crosshair shows one indicator PER TURRET (main guns arcing above, secondary below): GREEN ready (intact, bearing, in range, loaded), AMBER reloading with a CLOCK-LIKE radial sweep (not a linear bar), and RED unavailable (destroyed, OUT OF ARC, or OUT OF RANGE). The read-out stays unobtrusive, not a panel that blocks the view. Each BARREL within a turret reloads on its own clock, and both salvo and ripple fire modes work."
weight = 3
domain = "combat"
proof = "control"

[[review_item]]
id = "bomber-fighter"
title = "Bomber turrets & fighters"
text = "A bomber's defensive gun turrets are manned ONE AT A TIME, the player switching between them — the deliberate exception to a ship's class control. A fighter is a single fly-and-fire unit with no station to switch. Bombers deliver ordnance from the bombardier: bombs on a gravity arc and/or aerial torpedoes that run straight."
weight = 2
domain = "combat"
proof = "engagement"

[[review_item]]
id = "damage-model"
title = "Armor, shields, resonance & battle damage"
text = "The three defense paradigms behave distinctly: Ironbound ARMOR deflects light hits and yields to armor-piercing artillery and torpedoes; Meridian SHIELDS absorb until they collapse, then regenerate after time out of fire over a thin hull; Geode hulls REGENERATE while inside the resonance web. Battle damage is localized — turrets knocked out, fires that spread, breaches that cut speed — and recovered per paradigm (Ironbound crews, Meridian shields, Geode regeneration)."
weight = 2
domain = "combat"
proof = "engagement"

[[review_item]]
id = "ordnance-aa"
title = "Torpedoes, ordnance & anti-air"
text = "Torpedoes run straight at a fixed depth/altitude with an ARMING DISTANCE and heavy damage (submarines, destroyers, torpedo-bombers); destroyer depth ordnance flushes submarines from the murk; anti-air is rapid-fire, low-precision flak that engages aircraft. Terrain BLOCKS direct fire, while Ironbound arcing artillery can reach INDIRECTLY over a ridge or island."
weight = 2
domain = "combat"

[[review_item]]
id = "three-asymmetric"
title = "Three asymmetric powers"
text = "The Ironbound, Meridian, and Geode are genuinely asymmetric — distinct in material and color, weapons, defense, mobility, AND roster (Ironbound have no destroyer and only a heavy bomber; Meridian have no battleship and only a light bomber; Geode field the fullest roster with a medium bomber). All three are player-selectable and AI-commanded, and every matchup — INCLUDING a mirror of the same power — is playable."
weight = 3
domain = "factions"
proof = "tactical"

[[review_item]]
id = "weapon-families"
title = "Distinct weapon families"
text = "Each power's guns fire to its identity: Ironbound throw slow ARCING artillery (real lead and ranging, indirect fire over terrain) plus low-precision RAPID-FIRE; Meridian fire HIGH-VELOCITY shots that need only slight lead with small-but-real drop and cannot be lobbed over cover; Geode fire RESONANCE beams that chain or wash an area and overcharge inside the web."
weight = 2
domain = "factions"

[[review_item]]
id = "signature-mechanics"
title = "Signature mechanics"
text = "Each power's signature works: Ironbound DAMAGE-CONTROL crews are directed to fight fires, patch breaches, and restore knocked-out stations; Meridian SHIELDS regenerate out of fire and only AIRCRAFT blink (fighters charge quick, bombers slow with a visible wind-up; ships and submarines never blink); the Geode RESONANCE WEB is projected by lodestar support ships, heals and overcharges units inside it, and COLLAPSES when the lodestars are destroyed."
weight = 3
domain = "factions"
proof = "control"

[[review_item]]
id = "fog-of-war"
title = "Fog of war & detection"
text = "A fleet sees only what it detects: undetected enemies are hidden, and a detected one shows as a contact that FADES to a last-known mark when lost. Sight and sensors are BLOCKED by terrain and EXTENDED by height, so ridges and islands hide units and a high vantage or a scout reveals the enemy fleet."
weight = 2
domain = "recon"
proof = "tactical"

[[review_item]]
id = "murk-stealth"
title = "Murk concealment & submarines"
text = "The murk conceals units within it from outside detection (and blinds their own sight). A submarine running silent is very hard to detect, gives itself away by moving fast, firing, or surfacing, and is hunted by destroyers' sub-hunt and depth ordnance. Geode units endure the murk best, diving deeper and lingering longer."
weight = 2
domain = "recon"

[[review_item]]
id = "economy-reinforcement"
title = "Economy & reinforcement"
text = "Requisition accrues as income and is spent to call reinforcements that arrive at the fleet's home edge, with per-power styles (Ironbound cheap/steady/slow, Meridian expensive/few, Geode tied to the web's health). Carriers launch, recover, and RENEW aircraft over time, so a fleet with no surviving carrier cannot replace its air wing and the enemy carrier is a priority target."
weight = 2
domain = "battle"

[[review_item]]
id = "flagship-win-loss"
title = "Flagship victory & defeat"
text = "The battle is WON by destroying the enemy flagship and LOST by losing your own; the flagship is a tougher command capital that must be screened and reached through its fleet. Symmetric escalation drives the battle to a decision rather than a stalemate, and the end screen reports the outcome and the run's stats."
weight = 2
domain = "battle"
reference = "game-over"

[[review_item]]
id = "enemy-ai"
title = "AI opponent"
text = "The enemy fleet is a genuine AI admiral, not a passive target: it scouts, screens its flagship, commits reinforcements, and presses or withdraws, playing its assigned power to that power's identity — and it plays EVERY power, including in a mirror match against the player's own."
weight = 2
domain = "battle"

[[review_item]]
id = "states-controls"
title = "States & controls"
text = "Every state is reachable and behaves: the title (THUNDERHEAD with just PLAY and HOW TO PLAY), the DEPLOY screen (choose your power and the opponent), the in-battle state, a paused overlay that FREEZES the simulation, and the two end screens (victory and defeat). The tactical controls (camera, selection, orders, possess) and the possession controls all work."
weight = 1
reference = "title"
proof = "title"

[[review_item]]
id = "hud-complete"
title = "HUD"
text = "The tactical HUD shows the fleet roster, BOTH flagship health bars, requisition with income and the reinforcement call, the selection/order panel, and the minimap/contacts; the direct-control HUD shows the possessed unit and manned station with the station-switch indicator, the gunnery read-out, movement (speed, heading, altitude/depth), the unit's condition (health, shield, resonance, or damage-control), and a Meridian aircraft's blink charge. The performance overlay and wireframe toggle are present."
weight = 1
reference = "tactical"
proof = "tactical"

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The 3D view fills the window and every HUD element stays on screen, fitted, centered, and legible at any window size and pixel density, including on the title screen at load before any input."
weight = 1
reference = "tactical"
