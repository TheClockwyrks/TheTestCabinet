<!doctype html>
<!--
  Thunderhead — title screen (the `title` view, base variant).
  Rendered by the harness at 1280x720 as the deterministic view target and the
  screen shown on load: the THUNDERHEAD title, a tagline, the three power crests,
  and just two options — PLAY and HOW TO PLAY. PLAY opens the deploy screen (choose
  your power and opponent) and then drops the player into the battle. Static.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="hero">
        <div class="title">THUNDERHEAD</div>
        <div class="tagline">COMMAND THE FLEET · FIGHT EVERY GUN</div>

        <div class="crests">
          <span class="crest iron">IRONBOUND</span>
          <span class="crest mer">MERIDIAN</span>
          <span class="crest geo">GEODE</span>
        </div>

        <div class="menu">
          <div class="menu-btn primary">PLAY</div>
          <div class="menu-btn">HOW TO PLAY</div>
        </div>
      </div>
      <div class="hint">
        COMMAND &middot; POSSESS ANY UNIT &middot; MAN ANY STATION &middot; F4
        WIREFRAME
      </div>
    </div>
  </body>
</html>
