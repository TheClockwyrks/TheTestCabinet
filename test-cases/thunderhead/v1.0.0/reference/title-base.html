<!doctype html>
<!--
  Thunderhead — title screen (the `title` view, base variant).
  Rendered by the harness at 1280x720 as the deterministic view target and the
  screen shown on load: the THUNDERHEAD title, a tagline, and just two options —
  PLAY and HOW TO PLAY. Choosing a power is NOT done here; PLAY opens the deploy
  screen, where the player picks their power and the opponent, and then drops into
  the battle. Static.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="hero">
        <div class="title">THUNDERHEAD</div>
        <div class="tagline">COMMAND THE FLEET · FIGHT EVERY GUN</div>

        <div class="menu">
          <div class="menu-btn primary">PLAY</div>
          <div class="menu-btn">HOW TO PLAY</div>
        </div>
      </div>
      <div class="hint">
        COMMAND &middot; POSSESS ANY UNIT &middot; MAN ANY STATION &middot; F4
        WIREFRAME
      </div>
    </div>
  </body>
</html>
