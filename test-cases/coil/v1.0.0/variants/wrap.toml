# Wrap mode, where the board edges wrap into tunnels. Wrap replaces the base
# mode, so it is rated on its own scoring domain rather than folded into the
# common gameplay domain. Seeds its own mode spec, its own `title` menu, and the
# review item that rolls up to that domain.
slug = "wrap"
name = "Wrap"
description = "Wrap mode, where the board edges wrap into tunnels."

# This variant's single mode spec (Wrap) is seeded to the stable `specs/mode.md`
# the common specs reference. `dest` is explicit because the source name differs.
spec = [{ source = "specs/mode-wrap.md", dest = "specs/mode.md" }]
reference = [{ view = "title", path = "reference/menu-wrap.html" }]

[[domain]]
id = "wrap"
name = "Wrap"
description = "The Wrap mode: open perimeter tunnels the snake passes through, with no wall death."

[[review_item]]
id = "wrap-tunnels"
title = "Wrapping edges"
text = "In Wrap the four perimeter edges are open tunnels, not solid walls: a snake that leaves one edge reappears on the opposite edge of the same row or column, there is no wall death, and only the snake's own body can end the round."
weight = 1
domain = "wrap"
