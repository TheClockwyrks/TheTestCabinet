# Rough Terrain: a harder starting map where water and hills fragment the buildable land
# and raise the cost of carrying transit and utilities across it, so the city is under
# layout and budget pressure from the first periods. It seeds its own start spec to the
# stable `specs/mode.md` path (the path every common spec references), so the model sees
# a single, self-contained start spec with no mention of any other start. Its review
# item rolls up to the common `simulation` domain, since Rough Terrain presses the same
# city systems harder rather than adding a new axis of judgement.
slug = "roughterrain"
name = "Rough Terrain"
description = "A city started on fragmented land: water and hills break the buildable ground into pockets and force costlier bridge/tunnel spans to connect and serve it, so layout and solvency are under pressure from the first periods."

# Seed the Rough Terrain start to the common `specs/mode.md` path.
spec = [{ source = "specs/mode-roughterrain.md", dest = "specs/mode.md" }]
reference = [{ view = "title", path = "reference/menu-roughterrain.html" }]

[[review_item]]
id = "roughterrain-fragmentation"
title = "Rough Terrain fragmentation"
text = "In Rough Terrain the map opens fragmented by water and hills: buildable land is scarce and split into pockets, and connecting and serving them forces extra-cost bridge/tunnel spans for roads, rail, wires, and pipes — so the budget is under pressure earlier and layout matters more. The harder map is real, not cosmetic: a build that plays on the same open flat valley as the standard start has not implemented it."
weight = 1
domain = "simulation"
