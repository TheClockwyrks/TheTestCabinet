<!DOCTYPE html>
<!--
  Junction — in-city reference mockup (representative frame).
  Canonical view slug: gameplay
  Render at a 1280x720 viewport. See ../specs/overview.md (coordinate system,
  visual design), ../specs/map.md (tiles, zones, camera), ../specs/transit.md
  (roads, rail, congestion), ../specs/flow.md (the HUD dashboard), and
  ../specs/assets.md (these are stand-ins for PRODUCED sprites, animations, and
  particle overlays).

  The city layout, traffic, and demand shown vary at runtime; this frame is a
  representative moment for a soft palette/layout comparison, not a strict pixel
  match. Objects inside .city use FIELD-LOCAL coordinates (a tile at map row r
  sits at top = r * 24; the field itself starts at stage y=64).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Junction — Gameplay</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- ================= Top HUD: city vitals ========================= -->
      <div class="topbar">
        <div class="vital">
          <span class="k">TREASURY</span>
          <span class="v money">$24,680</span>
        </div>
        <div class="vital">
          <span class="k">BALANCE</span>
          <span class="v money">+$1,240/mo</span>
        </div>
        <div class="vital">
          <span class="k">POPULATION</span>
          <span class="v">8,410</span>
        </div>
        <div class="vital">
          <span class="k">POWER</span>
          <span class="v power">82%</span>
          <div class="meter"><span class="pw" style="width: 82%"></span></div>
        </div>
        <div class="vital">
          <span class="k">WATER</span>
          <span class="v water">67%</span>
          <div class="meter"><span class="wt" style="width: 67%"></span></div>
        </div>

        <div class="spacer"></div>

        <div class="alert-chip">&#9888; GRIDLOCK &mdash; 3RD AVE</div>
        <div class="clock">
          <span class="date">MAR 2027</span>
          <span class="speed">&#9654;&#9654; FAST</span>
        </div>
      </div>

      <!-- ================= City view (top-down camera onto the map) ===== -->
      <div class="city">
        <!-- River along the bottom-right; a hill rise upper-right. -->
        <div class="region water" style="--c: 39; --r: 17; --w: 15; --h: 8"></div>
        <div class="region water" style="--c: 36; --r: 20; --w: 4; --h: 5"></div>
        <div class="region hill" style="--c: 46; --r: 2; --w: 8; --h: 5"></div>
        <div class="region grass" style="--c: 2; --r: 19; --w: 8; --h: 5"></div>

        <!-- Rail / metro line across the top, with two stations. -->
        <div class="cell rail" style="--c: 6; --r: 6"></div>
        <div class="cell rail" style="--c: 7; --r: 6"></div>
        <div class="cell rail" style="--c: 8; --r: 6"></div>
        <div class="cell rail" style="--c: 9; --r: 6"></div>
        <div class="cell rail" style="--c: 10; --r: 6"></div>
        <div class="cell rail" style="--c: 11; --r: 6"></div>

        <div class="cell rail" style="--c: 28; --r: 6"></div>
        <div class="cell rail" style="--c: 29; --r: 6"></div>
        <div class="station" style="--c: 8; --r: 6"></div>
        <div class="station" style="--c: 24; --r: 6"></div>

        <!-- Road grid: a main avenue (row 11) and cross streets. -->
        <div class="cell road" style="--c: 4; --r: 11"></div>
        <div class="cell road" style="--c: 5; --r: 11"></div>
        <div class="cell road" style="--c: 6; --r: 11"></div>

        <div class="cell road" style="--c: 8; --r: 10"></div>
        <div class="cell road" style="--c: 8; --r: 12"></div>
        <div class="cell road" style="--c: 8; --r: 13"></div>

        <!-- Congestion on the main avenue near 3rd Ave (the alert). -->

        <!-- Residential district (left), climbing tiers away from industry. -->

        <!-- Commercial core (center, between rail and the avenue). -->

        <div class="bldg com t2" style="--c: 21; --r: 7"></div>
        <div class="bldg com t3" style="--c: 22; --r: 7"></div>

        <div class="zone com" style="--c: 27; --r: 7; --w: 3; --h: 3"></div>

        <!-- Industrial district by the river (right), dirtier and lower-tier. -->

        <div class="bldg ind t2" style="--c: 42; --r: 13"></div>
        <div class="bldg ind t2" style="--c: 43; --r: 13"></div>
        <div class="bldg ind t1" style="--c: 40; --r: 14"></div>

        <div class="bldg ind t2" style="--c: 42; --r: 14"></div>

        <div class="bldg ind t2" style="--c: 40; --r: 15"></div>
        <div class="bldg ind t1" style="--c: 41; --r: 15"></div>
        <div class="zone ind" style="--c: 44; --r: 12; --w: 2; --h: 4"></div>

        <!-- Power plant (top-left) + wires; water source on the river + pipes. -->
        <div class="plant power" style="--c: 3; --r: 3">&#9889;</div>
        <div class="cell wire" style="--c: 5; --r: 4"></div>
        <div class="cell wire" style="--c: 6; --r: 4"></div>
        <div class="cell wire" style="--c: 7; --r: 4"></div>

        <div class="cell pipe" style="--c: 41; --r: 17"></div>
        <div class="cell pipe" style="--c: 42; --r: 16"></div>

        <!-- Pollution haze over the industrial district. -->
        <div class="haze" style="--c: 38; --r: 11; --w: 9; --h: 6"></div>

        <!-- Vehicles moving along the roads (produced sprites). -->
        <div class="veh" style="left: 268px; top: 200px"></div>
        <div class="veh b" style="left: 340px; top: 202px"></div>
        <div class="veh c" style="left: 196px; top: 268px"></div>
        <div class="veh" style="left: 196px; top: 340px"></div>
        <div class="veh b" style="left: 588px; top: 200px"></div>
        <div class="veh c" style="left: 916px; top: 300px"></div>
      </div>

      <!-- ================= Bottom HUD: RCI meters + build palette ======= -->
      <div class="bottombar">
        <div class="rci">
          <div class="col">
            <div class="bar"><span class="r" style="height: 70%"></span></div>
            <span class="lbl">R</span>
          </div>
          <div class="col">
            <div class="bar"><span class="c" style="height: 48%"></span></div>
            <span class="lbl">C</span>
          </div>
          <div class="col">
            <div class="bar"><span class="i" style="height: 30%"></span></div>
            <span class="lbl">I</span>

        </div>

        <div class="divider"></div>

        <div class="palette">

</html>
