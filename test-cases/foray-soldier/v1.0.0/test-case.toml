slug = "foray-soldier"
name = "Foray Soldier"
difficulty = "hard"
tags = ["asset-generation", "2d", "sprite-sheet", "enemy"]
summary = """
Draw the Foray soldier: the heavy, mandibled defender caste of a top-down \
ant-colony raiding game, as a sixteen-frame 16x16 sprite sheet — a four-step \
walk cycle in each of four facings, drawn in a neutral recolorable ramp, \
produced one drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# Each frame is its own 16x16 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 16
height = 16
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — sixteen separate 16x16 files: a four-step WALK
# CYCLE in each of the four facings, laid out facing-major. Each facing's four
# frames are a named sequence the review UI plays as a walk; the renderer plays
# the matching cycle as the soldier crosses a tile.
#   down:  0,1,2,3   up: 4,5,6,7   left: 8,9,10,11   right: 12,13,14,15
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.frame]]
index = 8

[[sheet.frame]]
index = 9

[[sheet.frame]]
index = 10

[[sheet.frame]]
index = 11

[[sheet.frame]]
index = 12

[[sheet.frame]]
index = 13

[[sheet.frame]]
index = 14

[[sheet.frame]]
index = 15

[[sheet.sequence]]
slug = "walk-down"
name = "Walk — down"
frames = [0, 1, 2, 3]
fps = 8

[[sheet.sequence]]
slug = "walk-up"
name = "Walk — up"
frames = [4, 5, 6, 7]
fps = 8

[[sheet.sequence]]
slug = "walk-left"
name = "Walk — left"
frames = [8, 9, 10, 11]
fps = 8

[[sheet.sequence]]
slug = "walk-right"
name = "Walk — right"
frames = [12, 13, 14, 15]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Foray soldier — its heavy \
armored mandibled silhouette, the four facings each reading as the same soldier \
turned that way, a believable scuttling walk cycle in each facing, and the \
neutral recolorable grey ramp that lets the renderer tint it per colony."""

[[review_item]]
id = "mandibles"
title = "Forward mandibles"
text = """
Every frame's ant carries two forward-curving mandibles on a broad, armored \
head — the soldier's signature, marking it as the fighting caste and setting it \
apart from the lean raider. The mandibles lead the facing direction."""
frames = [0, 4, 8, 12]
weight = 3
domain = "fidelity"

[[review_item]]
id = "walk-cycle"
title = "Walk cycle reads as motion"
text = """
Played as a loop, each facing's four frames read as the soldier scuttling — its \
legs alternate (an insect's tripod gait) and the body bobs slightly along the \
travel axis between frames, so it walks rather than flickering between four \
identical poses. The cycle loops cleanly (frame 4 would follow frame 1)."""
sequences = ["walk-down", "walk-up", "walk-left", "walk-right"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "four-facings"
title = "Four readable facings"
text = """
The four sequences read as the same soldier turned to face four distinct \
directions — down, up, left, and right — each with its mandibled head leading \
that direction, not the same blob repeated. Left mirrors right; up mirrors \
down."""
sequences = ["walk-down", "walk-up", "walk-left", "walk-right"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "heavy-silhouette"
title = "Heavy armored silhouette"
text = """
The body reads as a stout, segmented, angular soldier — bulkier and slower than \
a forager — with a darker rim, mid body fill, and a lighter leading-edge \
highlight giving it rounded armor."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Neutral recolorable palette"
text = """
Uses only the neutral grey ramp from the brief (darkest, mid, light, accent) \
plus the fixed dark outline — no red, no blue, and no out-of-palette colors or \
halo of stray pixels — so the renderer's per-colony palette swap can tint it."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each ant fills most of its own 16x16 frame, centered with about a pixel of \
margin, neither tiny in a corner nor clipped at the edge or spilling across the \
grid into a neighboring frame; the small bob across a cycle stays in frame."""
weight = 1
domain = "fidelity"
