slug = "wireworm-worm"
name = "Wireworm"
difficulty = "medium"
tags = ["sprite-sheet", "enemy"]
summary = """
Draw the segmented data-worm that descends the Wireworm circuit board — the enemy \
the player splits — as a 32x32 six-frame sprite sheet of tileable parts: a \
right-facing head that chomps, body segments that undulate, and a tapering tail \
that swishes, each a two-pose wiggle, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one worm part
# sized to a grid cell so the game can tile a worm of any length. Fixing the size
# keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — six separate 32x32 frames of the worm's tileable
# parts in two-pose wiggles — and the named sequences a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.sequence]]
slug = "head-chomp"
name = "Worm — head chomp"
frames = [0, 1]
fps = 5

[[sheet.sequence]]
slug = "body-crawl"
name = "Worm — body crawl"
frames = [2, 3]
fps = 6

[[sheet.sequence]]
slug = "tail-crawl"
name = "Worm — tail crawl"
frames = [4, 5]
fps = 6

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated worm matches the brief — one consistent armored \
segment across all parts, a right-facing head with an eye and mandibles, plain \
body segments and a tapering tail, each wiggling in two poses, that tile \
edge-to-edge, in the tight worm palette on transparency."""

[[review_item]]
id = "tileable-segment"
title = "Consistent tileable segment"
text = """
Every part is clearly the same armored segment — the same plate shape, size, \
edge color, and belly seam, centered in the cell with link nubs at the same \
height — so a head-body-body-tail row tiles edge-to-edge and reads as one \
continuous worm, not four unrelated sprites."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "parts-read"
title = "Head, body, and tail read"
text = """
The head (frames 0–1) reads as the leading end — a red sensor eye and mandibles \
at the right edge — the body (2–3) is a plain segment with no face, and the tail \
(4–5) tapers to a rounded point at the trailing left edge with no left link nub. \
The face and pale mandible color appear only on the head."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "wiggle"
title = "Smooth two-pose wiggle"
text = """
Each part animates as a small (~2 px) undulation between its paired poses — the \
head chomps (0↔1), the body crawls (2↔3), the tail swishes (4↔5) — with the \
silhouette and size held steady so it reads as crawling, not jittering or \
resizing."""
sequences = ["head-chomp", "body-crawl", "tail-crawl"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette-and-transparency"
title = "Worm palette on transparency"
text = """
Uses only the worm palette from the brief (the carapace mid/dark/edge, the magenta \
data seam, and the head's eye and mandible colors) on full transparency — no \
out-of-palette pixels, no anti-aliased fringes, and no opaque background fill; only \
the worm's pixels are opaque so it composites onto the dark board."""
weight = 1
domain = "fidelity"
