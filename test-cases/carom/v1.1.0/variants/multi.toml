# Three independent balls, each played as its own contest. The change applies to
# both Solo and Versus, so multi is rated on the case's common `single-player` and
# `versus` domains — it adds no domain of its own.
slug = "multi"
name = "Multi-ball"
description = "Three independent balls at once — distinct spawns, per-ball respawns, and random launches."

# Same fixed, upright obstacles as base (`specs/obstacles.md`), but three
# independently-served balls replace the single ball at `specs/balls.md`.
spec = [
  { source = "specs/obstacles-static.md", dest = "specs/obstacles.md" },
  { source = "specs/balls-multi.md", dest = "specs/balls.md" },
]
reference = [{ view = "title", path = "reference/menu-multi.html" }]

# The distinctive requirements of this variant. They apply to the whole game (both
# Solo and Versus), so none names a domain. Note there is deliberately no
# serve-direction item here: multi launches every ball at a random angle.
[[review_item]]
id = "multi-three-balls"
title = "Three balls in play"
text = "Three balls are in play at once, each carrying its own velocity and its own spin, simulated independently of the others."
weight = 1

[[review_item]]
id = "multi-distinct-spawns"
title = "Distinct spawn points"
text = "Each ball has its own fixed home point on the centerline — one at 25%, one at 50%, one at 75% of the field height — and always returns to its own point, never all to the center together."
weight = 1

[[review_item]]
id = "multi-independent-respawn"
title = "Independent respawn"
text = "When a ball leaves the field it resets to its home point and relaunches on its own after a brief per-ball countdown, while the other two balls keep playing uninterrupted — the field never freezes and the other balls are never reset."
weight = 1

[[review_item]]
id = "multi-random-launch"
title = "Random launch angle"
text = "Every launch — the first serve and every relaunch — sends the ball out at a random angle over the full 360 degrees, independent of which side scored or where the ball was."
weight = 1

[[review_item]]
id = "multi-ball-collision"
title = "Ball-to-ball collision"
text = "The balls collide with one another as elastic circles, and a moving ball bounces off a ball that is held at its home point during its countdown; collisions never tunnel."
weight = 1
