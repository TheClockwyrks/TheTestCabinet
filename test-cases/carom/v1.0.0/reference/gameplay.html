<!DOCTYPE html>
<!--
  Carom — in-match reference mockup (representative frame).
  Canonical view slug: gameplay
  Render at a 1280x720 viewport. See ../specs/playfield.md and ../specs/flow.md (HUD).

  Live positions vary at runtime; this frame is a representative layout used
  for a soft palette/layout comparison, not a strict pixel match.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Carom — Gameplay</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="net"></div>

      <!-- Mode label -->
      <div class="mode-tag">SOLO</div>

      <!-- Scores: left = player one, right = opponent -->
      <div class="score" style="left: 460px">07</div>
      <div class="score" style="left: 700px">05</div>

      <!-- Static obstacles (mirror-symmetric about the center point) -->
      <div class="obstacle" style="left: 480px; top: 150px"></div>
      <div class="obstacle" style="left: 780px; top: 430px"></div>

      <!-- Paddles -->
      <div class="paddle player" style="left: 48px; top: 245px"></div>
      <div class="paddle opponent" style="left: 1216px; top: 365px"></div>

      <!--
        Ball traveling up-and-right with spin. The motion trail is a continuous
        comet: a single filled ribbon following the ball's recent (curving)
        path, tapering to a point at the oldest end and fading out through a
        gradient, so it reads as one smooth streak rather than a row of dots.
        Its length represents a fixed slice of recent travel, so it grows as the
        ball moves faster and collapses to nothing at rest.
      -->
      <svg class="trail" viewBox="0 0 1280 720" width="1280" height="720" aria-hidden="true">
        <defs>
          <linearGradient
            id="trail-fade"
            gradientUnits="userSpaceOnUse"
            x1="708"
            y1="330"
            x2="588"
            y2="438"
          >
            <stop offset="0" stop-color="#f2f5f7" stop-opacity="0.55" />
            <stop offset="0.55" stop-color="#f2f5f7" stop-opacity="0.18" />
            <stop offset="1" stop-color="#f2f5f7" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path
          fill="url(#trail-fade)"
          d="M 588 438 L 591.6 433.5 L 594.9 429 L 598.2 424.6 L 601.5 420.3 L 604.7 416.1 L 607.9 412 L 611.1 408 L 614.3 404.1 L 617.5 400.3 L 620.7 396.6 L 623.8 393.1 L 627 389.6 L 630.1 386.3 L 633.2 383.1 L 636.3 379.9 L 639.4 377 L 642.5 374.1 L 645.6 371.3 L 648.7 368.7 L 651.7 366.1 L 654.7 363.7 L 657.8 361.4 L 660.8 359.2 L 663.8 357.1 L 666.8 355.1 L 669.7 353.3 L 672.7 351.5 L 675.6 349.9 L 678.6 348.4 L 681.5 347 L 684.3 345.7 L 687.2 344.5 L 690.1 343.4 L 692.9 342.5 L 695.7 341.6 L 698.5 340.9 L 701.3 340.2 L 704 339.7 L 706.8 339.2 L 709.5 338.9 L 706.5 321.1 L 703.2 321.9 L 700 322.8 L 696.7 323.8 L 693.5 324.9 L 690.3 326.1 L 687.1 327.5 L 683.9 329 L 680.8 330.5 L 677.7 332.2 L 674.5 334 L 671.4 335.9 L 668.4 337.9 L 665.3 340 L 662.3 342.3 L 659.2 344.6 L 656.2 347.1 L 653.2 349.6 L 650.2 352.3 L 647.3 355 L 644.3 357.9 L 641.3 360.9 L 638.4 363.9 L 635.5 367.1 L 632.6 370.4 L 629.7 373.8 L 626.8 377.3 L 623.9 380.9 L 621 384.6 L 618.2 388.5 L 615.3 392.4 L 612.5 396.4 L 609.7 400.6 L 606.9 404.8 L 604.1 409.2 L 601.3 413.7 L 598.5 418.3 L 595.8 423 L 593.1 427.8 L 590.4 432.8 L 588 438 Z"

  </body>
