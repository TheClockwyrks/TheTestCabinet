# The default Carom variant: the standard modes only (Solo and Versus), with no
# extra mode spec on top of the always-present `specs/modes/standard.md`. Listed
# first in the case manifest's `variants`, so it is the default. Every path here
# resolves against the version folder, exactly like the main manifest.
slug = "base"
name = "Base"
description = "Standard game mode only."

# The main menu lists a different set of modes per variant, so each variant
# supplies its own `title` reference; `gameplay` and `game-over` are common.
reference = [{ view = "title", path = "reference/menu-base.html" }]
