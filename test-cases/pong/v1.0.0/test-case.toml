# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`;
# see `docs/test-cases.md`.

# Human-readable display name for this test case.
name = "Carom"

# Relative difficulty of this case, surfaced on the site. Carom's mechanics are
# simple, but a polished, playable build with spin, an AI opponent, and multiple
# states is a real front-end task — so it sits at the easy end of medium.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "paddle", "physics"]

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Common specs: seeded for EVERY variant of this case, at the `dest` path within
# the run workspace. The monolithic specification is decomposed by concern so
# that mode-specific material can be seeded per variant (see `[[variant]]`
# below). These five files are always present, so the mode specs may reference
# them freely; the common specs, in turn, must never reference a mode spec that a
# given variant does not seed (only `modes/standard.md` is always present).
[[spec]]
source = "specs/overview.md"
dest = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"
dest = "specs/playfield.md"

[[spec]]
source = "specs/physics.md"
dest = "specs/physics.md"

[[spec]]
source = "specs/flow.md"
dest = "specs/flow.md"

[[spec]]
source = "specs/modes/standard.md"
dest = "specs/modes/standard.md"

# Asset files or directories (relative to this folder) seeded alongside the
# specs. Carom is simple enough to need none.
assets = []

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each variant seeds the common specs above plus its own additive specs. The base
# variant is listed first, so it is the default. The three variants differ in
# which mode spec (if any) they add on top of the always-present standard mode,
# and in their `title` reference — the main menu lists a different set of modes
# per variant, so each variant declares its own menu mockup for the `title` view:
#   - base   — standard modes only (Solo and Versus).
#   - frenzy — adds the escalating, uncapped-speed Frenzy mode.
#   - multi  — adds a three-ball mode with ball-to-ball collisions.
#
# A variant's `reference` array is additive on top of the common references
# below, exactly like `spec`. Each variant supplies the `title` view; the
# `gameplay` and `game-over` views are common to every variant. A view slug must
# not appear both here and among the common references.
[[variant]]
slug = "base"
name = "Base"
description = "Standard game mode only."
reference = [{ view = "title", path = "reference/menu-base.html" }]

[[variant]]
slug = "frenzy"
name = "Frenzy"
description = "Standard plus the escalating Frenzy mode."
spec = [{ source = "specs/modes/frenzy.md", dest = "specs/modes/frenzy.md" }]
reference = [{ view = "title", path = "reference/menu-frenzy.html" }]

[[variant]]
slug = "multi"
name = "Multi-ball"
description = "Standard plus a three-ball mode with ball-to-ball collisions."
spec = [{ source = "specs/modes/multi.md", dest = "specs/modes/multi.md" }]
reference = [{ view = "title", path = "reference/menu-multi.html" }]

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup; the harness renders it to a screenshot that is seeded into the run as a
# visual target for the model. The reference source is rendered, then never
# seeded directly. References are not validated unless a `[[check]]` below names
# them. The `title` view is variant-specific (declared per variant above) because
# the main menu differs by variant; `gameplay` and `game-over` look the same in
# every variant, so they are common.
[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Validation checks (opt-in). Only the checks declared here run. Each drives the
# built implementation through `actions`, screenshots it, and compares against the
# rendered screenshot of `reference`. Only the title screen is deterministic
# enough to validate for Carom: it is whatever the game shows on load, so it needs
# no actions. Gameplay and game-over depend on live state and input, so they are
# seeded as references but not validated.
[[check]]
view = "title"
name = "Title Screen"
reference = "title"
actions = []
