<!DOCTYPE html>
<!--
  Floe — game-over reference mockup.
  Canonical view slug: game-over
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states — Game over):
  final score and level reached, with PLAY AGAIN and MENU. A dim strait shows
  behind the card. (Victory uses the same card layout with a VICTORY eyebrow and
  levels-cleared / lives-remaining lines.)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Floe — Game Over</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Dim strait furniture behind the overlay. -->
      <div class="strait dim">
        <div class="band shore"></div>
        <div class="band water"></div>
        <div class="band median"></div>
        <div class="band ice"></div>
        <div class="band near"></div>
        <div class="floe" style="left: 420px; top: 224px; width: 96px"></div>
        <div class="bear" style="left: 470px; top: 256px"><div class="mass"></div><div class="eye" style="left:12px"></div><div class="eye" style="left:18px"></div></div>
      </div>

      <div class="overlay"></div>
      <div class="card">
        <div class="card-eyebrow">CAUGHT ON THE ICE</div>
        <div class="card-title">GAME OVER</div>
        <div class="card-score">SCORE 18&#8202;250</div>
        <div class="card-line">REACHED LEVEL 5 / 8</div>
        <div class="card-actions">
          <div class="menu-item selected">PLAY AGAIN</div>
          <div class="menu-item">MENU</div>
        </div>
      </div>
    </div>
  </body>
</html>
