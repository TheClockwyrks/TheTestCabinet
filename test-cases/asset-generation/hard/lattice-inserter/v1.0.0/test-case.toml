[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lattice inserter — its flat, \
top-down viewpoint (looking down on the floor, never a side elevation), its fixed \
grey-blue pivot base at the centre, the swing arm and gripping hand that sweep an \
arc across the floor from the left pickup to the right drop, a clear slot reserved \
at the hand for the renderer to draw the cargo into, the hand reading as holding \
on the delivery stroke and empty on the return with no item drawn into the sprite \
itself, the strict palette, and the seamless loop — across its three upgrade \
tiers, and whether all three read as one machine family: each tier told apart by \
its arm accent (amber, red-orange, blue-cyan) and its rising mechanical detail, \
every tier sharing the same grey-blue base, reach, item slot, and swing so a \
higher tier is unmistakably the same inserter, and each higher tier's swing \
visibly running faster."""

# --- The three tiers are one machine family ------------------------------------
#
# These four items are why this is one case of three tiers rather than three
# cases, and they carry heavy weight: a sheet whose tiers are each handsome but do
# not read as one progressively-upgraded inserter scores badly.

[[review_item]]
id = "tier-distinct"
title = "Each tier is instantly distinguishable"
text = """
The three tiers are told apart at a glance by TWO rising axes. First, arm accent \
color: Tier 1's arm and hand are AMBER, Tier 2's are RED-ORANGE, and Tier 3's are \
BLUE-CYAN, each using that tier's arm / highlight / shadow trio. Second, mechanical \
detail: Tier 1 is the plainest arm; Tier 2 is visibly more complex (a secondary \
strut or rib along the arm, a bolt at the pivot, a sturdier gripper); Tier 3 is the \
most complex of all (the densest arm and hand detail plus a subtle pale-cyan energy \
glow along the arm). A viewer should be able to rank the three by refinement, not \
just by color."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "one-family"
title = "All three tiers read as one inserter family"
text = """
Across the tiers only the arm accent color, the amount of mechanical detail, and \
the playback speed change — everything else is shared. All three tiers use the SAME \
grey-blue base tones, the SAME fixed pivot at the centre, the SAME reach and grip \
distance, the SAME item slot, and the SAME swing arc and framing. Tier 2's and \
Tier 3's added reinforcement enriches the arm without changing the reach, the \
pivot, or the item slot. A tier that restyles the base, moves the pivot or grip \
distance, or reworks the swing breaks the family and is wrong even if it looks good \
alone."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "same-asset-not-different-machine"
title = "A higher tier is still unmistakably the same inserter"
text = """
Tier 2 and Tier 3 must still read as THE SAME inserter as Tier 1 — the \
reinforcement and glow enrich it, they do not turn it into a different machine. A \
player upgrading the machine should recognize it instantly as the inserter they \
had, only better. A tier whose extra detail overwhelms the arm, or that reads as an \
unrelated machine rather than an upgrade of the base one, fails this."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "tier-speed"
title = "Each higher tier's swing visibly runs faster"
text = """
Played back, Tier 2's swing runs visibly faster than Tier 1's, and Tier 3's faster \
than Tier 2's, so the three read as a slow, a fast, and a fastest inserter. Each \
tier's twelve-frame cycle must be a genuine even-stepped swing (not a jump between \
a couple of poses) for the rising rate to read as a faster machine rather than a \
faster twitch."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 2
domain = "fidelity"

# --- Each tier on its own ------------------------------------------------------

[[review_item]]
id = "pickup-swing-drop"
title = "Pickup-left, swing-across, drop-right arc, every tier"
text = """
In every tier, played in order the twelve frames read as one swing-arm motion seen \
from above: the hand starts over the LEFT pickup tile, sweeps in a smooth arc \
across the floor (bowing out through the far side of the centre tile at mid-swing), \
and reaches the RIGHT drop tile — then returns. The hand traces a clean arc between \
the two sides, not a jump, a straight slide, or a vertical pendulum lift, and the \
left side is clearly the pickup and the right the drop."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "flat-top-down-viewpoint"
title = "Flat, top-down viewpoint, every tier"
text = """
In every tier the inserter is drawn FLAT and top-down — looking down on the factory \
floor, consistent with the assembler and belts — NOT as a side elevation and NOT \
with faux-3D height (no beveled sides falling away, no cast shadow implying the arm \
floats). The pivot base sits on the floor at the centre of the frame (not on a \
ground line at the bottom), the two worked tiles lie flat to its left and right, \
and the arm sweeps across the ground plane rather than climbing up the screen."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "item-slot-reserved"
title = "A clear slot is reserved for the carried item, every tier"
text = """
In every tier the hand leaves a clear area of roughly 16x16 px (half a tile) at its \
grip point for the renderer to draw the carried item into, and that grip point sits \
at a FIXED distance from the pivot in every frame and every tier so the renderer \
can place an item from the swing angle alone. Nothing the sprite needs to \
communicate is drawn inside that slot — in particular, whatever distinguishes \
holding from empty must be legible from the hand itself, outside the slot, since an \
item painted over the slot would otherwise hide it. The hand surrounds, cradles, or \
backs the slot rather than crossing it; deliberate overlap between hand and item is \
fine, an item burying important structure is not."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "holding-versus-empty"
title = "Holding on delivery, empty on return, every tier"
text = """
In every tier the delivery stroke (the first six frames of the tier's loop, \
left-to-right) shows the hand HOLDING — closed on, clamped around, or cradling \
something — and the return stroke (the last six frames, right-to-left) shows it \
released and EMPTY. Draw NO item: the sprite is item-agnostic and the renderer \
supplies the cargo. How the hand is designed is the model's choice — pincers, \
clamp, cradle, pad — but holding versus empty must be obvious at a glance so the \
cycle reads as grip-and-carry-over then swing-back-empty."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "anchored-base"
title = "Anchored base, only the arm moves, every tier"
text = """
In every tier a small grey-blue base/mount sits fixed at the centre of every frame \
and does not move, jitter, or change between frames. Only the arm and hand pivot \
from it; the base is the still anchor the whole swing rotates around, and it is the \
same grey-blue base in every tier."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "seamless-loop"
title = "Seamless swing loop, every tier"
text = """
In every tier the arm ends the last frame back at the LEFT pickup position so the \
loop returns to its first frame with no jump, stutter, or backward slip — a clean \
continuous loop of one pickup-swing-drop-return cycle. The arc step between \
consecutive frames is even across the whole sweep."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Accent arm, grey base palette"
text = """
All 36 frames use only the inserter palette from the brief — the dark outline, the \
shared grey-blue base tones, and each tier's arm accent trio (amber for Tier 1, \
red-orange for Tier 2, blue-cyan with the pale energy glow for Tier 3) — with no \
out-of-palette colors and no halo of stray or anti-aliased pixels. The arm is the \
tier's accent color; the base is the same grey-blue in every tier; the two never \
bleed into each other's colors."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Centred framing with the reach fitting, every tier"
text = """
In every tier the base is centred in the 64x64 frame as the pivot and the arm's \
full reach to the left pickup and right drop fits inside the frame with a small \
margin — neither clipped at the edges nor cramped into the centre. The 64x64 box \
reads as a 2x2-tile span with the pivot at the centre."""
sequences = ["swing-t1", "swing-t2", "swing-t3"]
weight = 1
domain = "fidelity"
