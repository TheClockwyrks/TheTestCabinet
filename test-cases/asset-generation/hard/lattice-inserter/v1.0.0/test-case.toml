slug = "lattice-inserter"
experimental = true
name = "Lattice Inserter"
difficulty = "hard"
tags = ["sprite-sheet", "machine"]
summary = """
Draw the Lattice inserter: a swing-arm machine for a deterministic factory \
simulation, drawn flat and top-down, across three upgrade tiers, as thirty-six \
64x64 frames whose arm sweeps across the floor from the left pickup tile to the \
right drop tile holding an item, then swings back empty, in seamless loops — \
item-agnostic, since the renderer draws the cargo into a reserved slot at the \
hand — produced one drawing operation at a time. Every tier shares one grey-blue \
pivot base, reach, and item slot, recolored only at the arm and hand — amber, \
then red-orange, then blue-cyan — with rising mechanical detail and a faster \
swing, so the tiers read as one inserter progressively upgraded."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 64x64 transparent canvas (a separate file) — a 2x2-tile
# box (32 px/tile) so the arm's reach toward the neighboring pickup and drop
# tiles fits. Fixing the frame size keeps every run comparable.
[canvas]
width = 64
height = 64
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 64x64 file — and the three named
# animation sequences a reviewer plays back. The 36 frames are three tiers of
# twelve, each tier its own twelve-frame swing cycle (first six frames delivery,
# last six return):
#   Tier 1 (amber arm):      0-11  (fps 12)
#   Tier 2 (red-orange arm): 12-23 (fps 16)
#   Tier 3 (blue-cyan arm):  24-35 (fps 20)
