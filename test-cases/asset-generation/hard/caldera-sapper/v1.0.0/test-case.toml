slug = "caldera-sapper"
name = "Caldera Sapper"
difficulty = "hard"
tags = ["voxel", "rig", "creature"]
summary = """
Sculpt and rig the Caldera Sapper: the network-cutting technician of the Slag — a tall, \
spindly, insectile obsidian creature that stalks on four thin high-kneed legs, holds its \
narrow body high on a long segmented spine, reads by a row of acid-green beads running \
along that spine, and cuts pipes and structures with two long multi-jointed shear arms — \
painted cell by cell with the `voxel-anim` tool, one recorded operation at a time. \
The model invents whatever parts and joints it needs; the fixed contract is two \
animations it must author — a spidery `move` and a cutting `attack` — plus a contiguous \
accent region the game recolors to show the Sapper's tier."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Sapper at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Sapper's real size at the roster's shared scale — it is the TALL, SPINDLY
# Slag, and the volume's narrow, tall proportions carry that before a single voxel is
# placed. Each part is sculpted separately in this shared volume's coordinates. The
# volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 24
height = 48
depth = 28
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the Sapper's game events.
[model]

# `move` — the stalk. A game-triggered playable that loops: a quick, spidery,
# high-stepping walk on four thin legs, the body held high and level while the legs pick
# their way, authored in place so the leg cycle alone carries the stride and the game
# supplies the travel.
[[model.animation]]
name = "move"
loop = true
auto_play = false

# `attack` — the cut. A game-triggered playable that loops: the two shear arms open wide
# and scissor shut in a cutting stroke, then reset. It reads as cutting through a pipe,
# not punching; the legs stay planted.
[[model.animation]]
name = "attack"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera Sapper and poses \
correctly — the tall, spindly, insectile obsidian technician on four thin high-kneed \
legs, holding its narrow body high on a long segmented spine, carrying a row of acid-green \
beads along that spine and one contiguous accent region, whose spidery stalk and scissoring \
cut read as the only Slag that carries tools, in the disciplined Caldera palette."""

[[review_item]]
id = "reads-as-sapper"
title = "Reads as the Sapper"
text = """
From more than one angle the model reads unmistakably as the Sapper: a TALL, SPINDLY, \
insectile obsidian creature standing on four thin, high-kneed legs, its narrow body held \
high on a long segmented spine that curves up to a small, narrow head. Two long \
multi-jointed CUTTING SHEAR ARMS reach from the front — scissoring blades, not fists — the \
only Slag that carries tools. A row of acid-green beads runs along each segment of the \
spine, and there is NO other acid glow anywhere on the model — no eye, no chest seams — \
that beaded spine is the Sapper's whole glow signature. Nothing about it reads as armored, \
heavy, or brawling: it is the tall, thin technician."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "move-reads"
title = "Move stalks quick and in place"
text = """
Playing `move` stalks the Sapper forward: its four thin legs pick their way with a quick, \
spidery, high-stepping gait while the narrow body stays held high and level, so it reads as \
a light, precise creature stepping rather than flailing, gliding, or sliding weightlessly. \
The body does not translate across the scene — the leg cycle alone carries the stride — and \
the body holds high and level as the legs work under it. It loops seamlessly."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "attack-reads"
title = "Attack scissors the shears shut"
text = """
Playing `attack` opens the two shear arms wide and scissors them shut in one clean cutting \
stroke, then resets to its stance, with the feet staying planted. It reads unmistakably as \
a tool cutting through a pipe or structure — a scissoring shear, not a punch — with the \
blades meeting cleanly at the close."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-plates"
title = "A contiguous accent region on the shear arms"
text = """
The plates along the outer faces of both cutting shear arms — and only those — are sculpted \
in the accent color `#4a4358`, as coherent contiguous plates (one plate group per arm), not \
scattered flecks, and clearly visible from more than one angle. That color appears NOWHERE \
else on the model — not one stray voxel, highlight, or seam. The game finds every voxel of \
it and repaints it to show the Sapper's tier, so a scattered, broken, or misplaced accent \
region breaks the tier system outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Caldera palette discipline"
text = """
Uses only the brief's four colors — obsidian body, obsidian-dark recesses, the accent \
plate, and the acid glow — with no out-of-palette colors, and in particular NO steel \
`#c9ced6` and NO violet `#b56bff` anywhere on the model, since a game paints those on \
at run time. No stray voxels drift off the body."""
weight = 1
domain = "fidelity"
