# The double-size variant: the same Sapper sculpted in a volume with each extent
# doubled from the case's base 24x48x28. Its `[voxel]` OVERRIDES the case volume for
# runs of this variant, and the brief is rendered at these dimensions.
slug = "double"
name = "Double Size"

[voxel]
width = 48
height = 96
depth = 56
background = "transparent"
