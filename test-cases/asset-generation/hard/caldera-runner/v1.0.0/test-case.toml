slug = "caldera-runner"
name = "Caldera Runner"
difficulty = "hard"
tags = ["voxel", "rig", "creature"]
summary = """
Sculpt and rig the Caldera Runner: the fast, fragile chaff of the Slag — a low, \
long, ground-hugging obsidian creature that skitters on four sprung legs, reads by \
its single acid-green eye slit, and hurls its whole body at what it reaches — \
painted cell by cell with the `voxel-anim` tool, one recorded operation at a time. \
The model invents whatever parts and joints it needs; the fixed contract is two \
animations it must author — a darting `move` and a lunging `attack` — plus a \
contiguous dorsal accent ridge the game recolors to show the Runner's tier."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Runner at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Runner's real size at the roster's shared scale — it is the SMALLEST and
# LOWEST Slag, and the volume's low, long proportions carry that before a single
# voxel is placed. Each part is sculpted separately in this shared volume's
# coordinates. The volume always starts EMPTY; `background` is only the clear color
# behind the rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 20
height = 24
depth = 44
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the Runner's game events.
[model]

# `move` — the run. A game-triggered playable that loops: the feet plant and the body
# skitters over them, light and darting, authored in place so the leg cycle alone
# carries the stride and the game supplies the travel.
[[model.animation]]
name = "move"
loop = true
auto_play = false

# `attack` — the lunge. A game-triggered playable that loops: the Runner coils, throws
# its whole body forward in one fast strike, and recovers. It carries no weapon; the
# body IS the weapon.
[[model.animation]]
name = "attack"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera Runner and poses \
correctly — the low, long, ground-hugging obsidian sprinter on four thin sprung legs, \
carrying a single acid-green eye slit and one contiguous dorsal accent ridge, whose run \
and lunge carry the lightness and snap of the fastest thing on the field, in the \
disciplined Caldera palette."""

[[review_item]]
id = "reads-as-runner"
title = "Reads as the Runner"
text = """
From more than one angle the model reads unmistakably as the Runner: a LOW, LONG, \
wedge-shaped obsidian body held close to the ground on four thin, sprung legs, narrow \
at the front and broadening slightly toward the back. A single horizontal acid-green eye \
slit sits on the low head at the front, and there is NO other acid glow anywhere on the \
model — that one slit is the Runner's whole glow signature. It reads as a small, fast \
creature: nothing about it is heavy, top-heavy, armored, spindly, or massive. It carries \
no weapon, no armor plating, and no tools."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "move-reads"
title = "Move runs light and in place"
text = """
Playing `move` sprints the Runner: its feet plant on the ground and the body skitters \
over them so it reads as a light creature running rather than flailing, gliding, or \
sliding weightlessly. The motion is fast and darting, not the heavy ease of a big \
machine. The body does not translate across the scene — the leg cycle alone carries the \
stride — and the head holds steady and level with its eye slit forward. It loops \
seamlessly."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "attack-reads"
title = "Attack commits the whole body"
text = """
Playing `attack` coils the Runner back on its legs, throws its head and body forward in \
one fast strike, and recovers to its stance — a snap out and a recovery, with the feet \
staying planted. The whole body commits to the lunge, reading as a creature with no \
weapon hurling itself at a target."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-ridge"
title = "A contiguous dorsal accent ridge"
text = """
A raised dorsal ridge of plates runs along the spine from behind the head toward the \
back, sculpted as ONE CONTIGUOUS run in the accent color `#4a4358`, and clearly visible \
from the side and from above. That color appears NOWHERE else on the model — not one \
stray voxel, highlight, or seam. The game finds every voxel of it and repaints it to \
show the Runner's tier, so a scattered, broken, or misplaced accent region breaks the \
tier system outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Caldera palette discipline"
text = """
Uses only the brief's four colors — obsidian body, obsidian-dark recesses, the accent \
plate, and the acid glow — with no out-of-palette colors, and in particular NO steel \
`#c9ced6` and NO violet `#b56bff` anywhere on the model, since a game paints those on \
at run time. No stray voxels drift off the body."""
weight = 1
domain = "fidelity"
