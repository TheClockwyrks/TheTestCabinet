slug = "trench-walls"
experimental = true
name = "Fathom Trench Walls"
difficulty = "hard"
tags = ["sprite-sheet", "tileset"]
summary = """
Draw the Fathom trench tileset: pac-man-style rounded rock walls for a \
bioluminescent deep-sea maze chase, as a nineteen-frame 32x32 sprite sheet — the \
sixteen 4-neighbor autotile wall pieces plus the corridor floor, the unrevealed \
fog, and the den gate, each a seamless edge-to-edge tile, produced one drawing \
operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case ships a single `base` variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# Each frame is its own 32x32 canvas (a separate file). These are TILES: every
# frame fills the whole cell edge-to-edge and butts seamlessly against its
# neighbors — not a centered sprite with margin. 32x32 matches the trench's tile
# grid; fixing the size keeps runs comparable and the tiles aligned to that grid.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — nineteen separate 32x32 tiles.
#   0-15  the 4-neighbor wall AUTOTILE set. The frame INDEX is the connection
#         bitmask: N=1, E=2, S=4, W=8 (a set bit = the wall continues to that
#         edge and must run flush to it so it merges with the neighbor there;
#         an unset bit = that side is an open, rounded outer wall face against
#         the corridor). So frame 5 (N+S) is the vertical straight, 10 (E+W) the
#         horizontal, 3/6/12/9 the four elbows, 7/11/13/14 the four T-junctions,
#         15 the cross/interior, 0 the isolated pillar.
#   16    the revealed corridor FLOOR (open water) the maze sits on, seamless
#         when tiled.
#   17    the unrevealed FOG tile — flat near-black hiding wall from water.
#   18    the den GATE tile — a barred threshold on the floor.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.frame]]
index = 8

[[sheet.frame]]
index = 9

[[sheet.frame]]
index = 10

[[sheet.frame]]
index = 11

[[sheet.frame]]
index = 12

[[sheet.frame]]
index = 13

[[sheet.frame]]
index = 14

[[sheet.frame]]
index = 15

[[sheet.frame]]
index = 16

[[sheet.frame]]
index = 17

[[sheet.frame]]
index = 18

# Review groupings the UI flips through. A tileset is not really "animated", but
# rotating the four elbows / four T's makes inconsistencies obvious.
[[sheet.sequence]]
slug = "corners"
name = "Corners (rotating)"
frames = [3, 6, 12, 9]
fps = 2

[[sheet.sequence]]
slug = "junctions"
name = "T-junctions (rotating)"
frames = [7, 14, 13, 11]
fps = 2

[[sheet.sequence]]
slug = "straights"
name = "Straights & cross"
frames = [5, 10, 15]
fps = 2

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
