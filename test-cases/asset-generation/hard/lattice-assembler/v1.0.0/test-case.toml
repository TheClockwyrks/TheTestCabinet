slug = "lattice-assembler"
name = "Lattice Assembler"
difficulty = "hard"
tags = ["sprite-sheet", "machine"]
summary = """
Draw the Lattice assembler: a flat, top-down 2D 3x3 industrial crafting machine, \
as a 96x96 sprite sheet — eight frames of a seamless loop that reads as the \
machine actively making something while the chassis itself holds still, produced \
one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 96x96 transparent canvas (a separate file). The assembler
# covers a 3x3 block of 32px tiles, so one frame is 96x96. Fixing the frame size
# keeps every run comparable.
[canvas]
width = 96
height = 96
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 96x96 file — and the named
# animation sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "craft"
name = "Assembler — crafting"
frames = [0, 1, 2, 3, 4, 5, 6, 7]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lattice assembler brief — a \
flat, top-down 2D 3x3 industrial machine with no faux-3D height, the grey-blue \
plated chassis with amber hazard accents, the strict palette, and a seamless \
eight-frame loop that reads as the machine actively making something."""

[[review_item]]
id = "industrial-3x3"
title = "Flat top-down 2D 3x3 machine"
text = """
Every frame reads at a glance as a heavy 3x3 industrial crafting machine drawn \
FLAT and top-down: a clean 2D shape on the grid with crisp outlines and flat \
areas of color, its character coming from plating, seams, and markings drawn ON \
it. It is NOT faux-3D — no raised top face, no sides beveling away to the floor, \
no cast shadow implying height — and not a side elevation. It stays \
non-directional: symmetric with no front, back, or facing, so it reads correctly \
however the factory is oriented."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "working-animation"
title = "Reads as a machine at work"
text = """
Played 0->7 the eight frames read as the machine ACTIVELY MAKING SOMETHING — \
crafting, building, processing. How that is shown is the model's choice; what \
counts is that the animation clearly conveys work happening rather than an idle \
or merely decorative flicker. The chassis itself holds still in exactly the same \
place every frame — the animation is the work, not the machine moving or \
wobbling — and all eight frames are distinct rather than two images alternating \
in place."""
sequences = ["craft"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "seamless-loop"
title = "Seamless craft loop"
text = """
The eight frames form a seamless loop: frame 7 returns to where frame 0 begins, \
so the crafting animation cycles continuously with no visible jump or reset when \
it wraps 7->0."""
sequences = ["craft"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "chassis-hazard"
title = "Grey-blue chassis with hazard accents"
text = """
The chassis is grey-blue plated metal (using the light, mid, and dark shades to \
build up plating and detail) carrying amber hazard markings paired with the dark \
outline — stripes, chevrons, hatching, or similar — that read clearly as \
industrial warning marking and stay accents rather than taking over the body."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "teal-working-state"
title = "Teal reads as the working state"
text = """
Teal is used as the machine's 'it is running' signal in the animated working \
area, and appears nowhere else on the sprite, so a glance tells a viewer the \
machine is powered and busy rather than idle."""
sequences = ["craft"]
weight = 1
domain = "fidelity"

[[review_item]]
id = "palette-framing"
title = "Strict palette and framing"
text = """
Uses only the brief's colors (dark outline, three grey-blue chassis shades, two \
teals, amber hazard) with no out-of-palette colors and no halo of stray pixels, \
and the machine fills the 96x96 frame centered with only a 1-2 px margin."""
weight = 1
domain = "fidelity"
