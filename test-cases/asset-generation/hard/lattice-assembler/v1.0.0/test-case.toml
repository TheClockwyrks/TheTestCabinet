slug = "lattice-assembler"
experimental = true
name = "Lattice Assembler"
difficulty = "hard"
tags = ["sprite-sheet", "machine"]
summary = """
Draw the Lattice assembler: a chunky pseudo-3D 3x3 industrial crafting machine \
with visible height, as a 96x96 sprite sheet — eight frames of a seamless working \
loop whose central core rotates and pulses while the raised chassis holds still, \
produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 96x96 transparent canvas (a separate file). The assembler
# covers a 3x3 block of 32px tiles, so one frame is 96x96. Fixing the frame size
# keeps every run comparable.
[canvas]
width = 96
height = 96
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 96x96 file — and the named
# animation sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "craft"
name = "Assembler — crafting"
frames = [0, 1, 2, 3, 4, 5, 6, 7]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lattice assembler brief — its \
chunky pseudo-3D 3x3 industrial machine that reads as a raised block (a lit top \
face, beveled sides, a grounding contact shadow) rather than a flat top-down \
plate, the grey-blue chassis with hazard-stripe accents, the strict palette, and \
the central working core that visibly rotates and pulses across a seamless craft \
loop."""

[[review_item]]
id = "industrial-3x3"
title = "Chunky pseudo-3D 3x3 machine"
text = """
Every frame reads at a glance as a chunky, raised 3x3 industrial assembling \
machine drawn in Factorio's pseudo-3D style — a solid block standing off the \
floor with a lit, inset top face, beveled sides, and a grounding contact shadow, \
NOT a flat top-down plate and not a side elevation. It stays non-directional: \
symmetric on all four sides with no front, back, or facing, so it reads correctly \
however the factory is oriented."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "animated-core"
title = "Animated working core"
text = """
The central core visibly animates across the eight frames — a rotating \
gear/assembly element and/or a teal glow that brightens and dims — so playing \
0->7 reads as a machine actively crafting. The chassis itself stays static; only \
the core and its glow change frame to frame."""
sequences = ["craft"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "seamless-loop"
title = "Seamless craft loop"
text = """
The eight frames form a seamless loop: frame 7 returns to where frame 0 begins, \
so the crafting animation cycles continuously with no visible jump or reset when \
it wraps 7->0."""
sequences = ["craft"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "chassis-hazard"
title = "Grey-blue chassis with hazard accents"
text = """
The chassis is grey-blue metal (light, mid, and dark shades for plating and \
shadow) with yellow-and-black hazard-stripe accents at the corners or base. The \
hazard stripes are amber paired with the dark outline, reading clearly as \
warning markings."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "teal-working-state"
title = "Teal active glow"
text = """
The teal accent is used for the working state — the active glow of the central \
core — and is the only place teal appears, so the lit core clearly signals the \
machine is crafting."""
sequences = ["craft"]
weight = 1
domain = "fidelity"

[[review_item]]
id = "palette-framing"
title = "Strict palette and framing"
text = """
Uses only the brief's colors (dark outline, three grey-blue chassis shades, two \
teals, amber hazard) with no out-of-palette colors and no halo of stray pixels, \
and the machine fills the 96x96 frame centered with only a 1-2 px margin."""
weight = 1
domain = "fidelity"
