# The double-size variant: the same Aegis composited in a field with each extent
# doubled from the case's base 120x110x150. Its `[voxel]` OVERRIDES the case volume
# for runs of this variant, and the brief is rendered at these dimensions.
slug = "double"
name = "Double Size"

[voxel]
width = 240
height = 220
depth = 300
background = "transparent"
