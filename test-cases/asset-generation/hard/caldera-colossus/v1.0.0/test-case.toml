slug = "caldera-colossus"
experimental = true
name = "Caldera Colossus"
difficulty = "hard"
tags = ["voxel", "rig", "creature"]
summary = """
Sculpt and rig the Caldera Colossus: the massive elite bruiser of the Slag — a ponderous, \
columnar obsidian quadruped on four thick column legs, its enormous body carrying an open \
furnace crater in its back that exposes a molten acid-green core, that walks with immense \
weight and crushes what it reaches — painted cell by cell with the `voxel-anim` tool, one \
recorded operation at a time. The model invents whatever parts and joints it needs; the \
fixed contract is three animations it must author — a ponderous `move`, a crushing \
`attack`, and a self-playing `aura` idle — plus a contiguous accent region the game \
recolors to show the Colossus's tier."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 2.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Colossus at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Colossus's real size at the roster's shared scale — it is the MASSIVE Slag,
# the biggest thing on the field, and the volume's huge, columnar proportions carry that
# before a single voxel is placed. Each part is sculpted separately in this shared
# volume's coordinates. The volume always starts EMPTY; `background` is only the clear
# color behind the rasterized isometric preview PNG. A voxel case must NOT declare
# [canvas].
[voxel]
width = 64
height = 76
depth = 60
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. All three names here are the
# ones `caldera`'s `assets/models.json` binds to the Colossus's game events.
[model]

# `move` — the walk. A game-triggered playable that loops: a ponderous, immensely heavy
# walk on four thick column legs, each leg landing with weight and the whole mass
# settling onto it, authored in place so the leg cycle alone carries the stride and the
# game supplies the travel.
[[model.animation]]
name = "move"
loop = true
auto_play = false

# `attack` — the slam. A game-triggered playable that loops: the Colossus rears and
# brings its full mass down in one crushing slam, then settles. It carries no weapon; its
# whole body is the weapon, and the feet stay planted.
[[model.animation]]
name = "attack"
loop = true
auto_play = false

# `aura` — the armor-aura idle. A SELF-PLAYING idle (`auto_play = true`) that loops under
# everything else: the furnace core in the back crater pulses and breathes, and the molten
# seams swell and dim with it, so the armor aura it projects over nearby Slag reads
# continuously without being triggered. It moves no leg.
[[model.animation]]
name = "aura"
loop = true
auto_play = true

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
