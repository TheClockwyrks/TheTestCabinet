slug = "lanternjaw"
name = "Fathom Lanternjaw"
difficulty = "hard"
tags = ["sprite-sheet", "enemy"]
summary = """
Draw the Fathom Lanternjaw: the light-seeking deep-sea predator that hides as the \
harmless bonus drifter, as a 16-frame 32x32 sprite sheet — a four-direction hunting \
swim (a shared amber bell over dark, gaping jaws) plus an eight-frame jellyfish \
disguise loop identical to the drifter, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x32 file — and the named
# animation sequences a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.frame]]
index = 8

[[sheet.frame]]
index = 9

[[sheet.frame]]
index = 10

[[sheet.frame]]
index = 11

[[sheet.frame]]
index = 12

[[sheet.frame]]
index = 13

[[sheet.frame]]
index = 14

[[sheet.frame]]
index = 15

[[sheet.sequence]]
slug = "walk-down"
name = "Hunt — down"
frames = [0, 1]
fps = 6

[[sheet.sequence]]
slug = "walk-up"
name = "Hunt — up"
frames = [2, 3]
fps = 6

[[sheet.sequence]]
slug = "walk-left"
name = "Hunt — left"
frames = [4, 5]
fps = 6

[[sheet.sequence]]
slug = "walk-right"
name = "Hunt — right"
frames = [6, 7]
fps = 6

[[sheet.sequence]]
slug = "disguise"
name = "Jellyfish disguise"
frames = [8, 9, 10, 11, 12, 13, 14, 15]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lanternjaw target — the shared \
amber bell both its forms carry, the dark gaping jaws of its hunting swim, and the \
eight-frame jellyfish disguise (identical to the bonus drifter) it wears while \
wandering, so an undetected Lanternjaw passes for a harmless drifter."""

[[review_item]]
id = "shared-bell"
title = "Shared amber bell"
text = """
Every frame — hunting and disguised alike — carries the same glowing amber bell at \
the top of the sprite, in the same place and drawn the same way, the brightest \
element on the sheet. It is the anchor of the deception: only what hangs beneath it \
differs (the hunting jaws, or the drifter's tendrils), so the reveal is purely \
additive — the bell never jumps or changes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "four-directions"
title = "Four readable hunting directions"
text = """
The hunting frames (0–7) read as the predator swimming in four distinct directions \
— down, up, left, and right — each with the amber bell leading over dark, gaping \
jaws that chomp between the two frames, and a forked tail trailing behind, not the \
same blob repeated. This is the moment it drops the disguise and its jaws show."""
sequences = ["walk-down", "walk-up", "walk-left", "walk-right"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "jellyfish-disguise"
title = "Jellyfish disguise"
text = """
The disguise frames (8–15) read as a drifting jellyfish — the same amber bell over \
a frilled skirt and a few gently swaying tendrils — so playing them loops as a \
harmless bonus drifter and NOT as the hunting form. These frames must match the \
bonus drifter's sway pixel-for-pixel; up close a wandering Lanternjaw cannot be told \
from a real drifter."""
sequences = ["disguise"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Amber bell, dark jaws"
text = """
Uses the Lanternjaw's palette from the brief (amber bell with a bright core, dim-\
amber tendrils and skirt, dark-slate hunting jaws with pale tooth glints, near-black \
outline) with no out-of-palette colors and no halo of stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each creature fills most of its own 32x32 frame cell, centered with a small \
margin, neither tiny in a corner nor spilling across the grid lines into the \
neighboring frame."""
weight = 1
domain = "fidelity"
