slug = "foray-raider"
experimental = true
name = "Foray Raider"
difficulty = "hard"
tags = ["sprite-sheet", "enemy"]
summary = """
Draw the Foray raider: the lean forager caste of a top-down ant-colony raiding \
game, as a thirty-two-frame 16x16 sprite sheet — a four-step walk cycle in each \
of four facings, empty and again laden with a gold seed (the carry-weight tell), \
drawn in a neutral recolorable ramp, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# Each frame is its own 16x16 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 16
height = 16
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — thirty-two separate 16x16 files. A four-step WALK
# CYCLE in each of four facings, twice: empty (0-15) and laden with a seed
# (16-31), laid out facing-major. Each facing's four frames are a named sequence
# the review UI plays as a walk; the renderer plays the matching cycle (empty or
# laden) as the raider crosses a tile.
#   empty  down: 0-3   up: 4-7    left: 8-11   right: 12-15
#   laden  down:16-19  up:20-23   left:24-27   right:28-31
[sheet]

