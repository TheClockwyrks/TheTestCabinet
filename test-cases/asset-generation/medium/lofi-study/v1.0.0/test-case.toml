slug = "lofi-study"
experimental = false
name = "Lo-Fi Study Beat"
difficulty = "medium"
tags = ["music", "lo-fi"]
summary = """
Compose a chilled lo-fi hip-hop study beat: a ~30-second, seamlessly looping cue \
with a laid-back head-nod drum groove, a mellow electric-piano loop of jazzy 7th \
chords, a round bass, and sparse mallet motifs — warm, hazy, and unhurried, \
sequenced note by note over the gm-lite bank."""
description = "description.md"
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "music"

variants = ["variants/base.toml"]

# The output format the rendered clip is fixed to. A music case names the baked
# instrument bank it plays; `gm-lite@0.1.0` is a name@version palette baked into
# the run-container image, never a path in this repo.
[audio]
sample_rate = 44100                 # output sample rate in Hz (required)
channels = "stereo"                 # "mono" | "stereo" (required)
max_duration_ms = 30000             # cap on the rendered clip's length in ms (required, positive) — about 30 seconds
instrument_bank = "gm-lite@0.1.0"   # music ONLY: the baked instrument bank (name@version)

# The sequencer. `music` is the only way to shape sound; it records every
# operation to the action log and renders the waveform + spectrogram + piano-roll
# only when you run `render`. Run `music --help` to see the operations; no
# operations schema is seeded.
[tool]
binary = "music"
preview = "waveform.png"

# The recorded action log — the authoritative output the clip is regenerated
# from. Core emits the rendered clip.wav (and a portable clip.mid) automatically.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the clip reads as the lo-fi study beat the brief describes — a \
warm, hazy, unhurried head-nod groove with a soft drum kit, a mellow \
electric-piano loop of jazzy 7th chords, a round bass, and sparse mallet motifs — \
nostalgic and cozy rather than bright, busy, or aggressive."""

[[domain]]
id = "craft"
name = "Craft"
description = """
Musicianship in the writing — a coherent laid-back tempo and pocket, sensible \
instrument choices and voicings from the gm-lite bank, a groove that repeats \
without an audible seam so it can loop under study, and a soft, wide stereo mix \
with real warmth and space."""

[[review_item]]
id = "lofi-groove"
title = "Reads as a lo-fi study beat"
text = """
The clip reads at once as a chilled lo-fi hip-hop beat — a laid-back, head-nod \
drum groove (soft kick, snare, and hats) under a mellow electric-piano chord loop \
— unhurried and easy to study to, rather than bright pop, busy EDM, or a driving \
rock beat."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "jazzy-harmony"
title = "Jazzy, mellow harmony"
text = """
The chord loop leans on soft, jazzy extended harmony — 7th chords and gentle \
color — voiced warmly on the electric piano, over a round, supportive bass, so the \
cue feels nostalgic and hazy rather than plain or harsh."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "warm-nostalgic"
title = "Warm, hazy, nostalgic mood"
text = """
The overall color is warm, soft-edged, and a little nostalgic — a rainy window, \
late-night studying — with sparse mallet motifs (vibraphone or glockenspiel) \
drifting over the groove rather than crowding it, so the piece stays calm and \
spacious."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "seamless-loop"
title = "Loops seamlessly"
text = """
The groove returns cleanly to its opening with no click, gap, or jarring seam, so \
the beat can repeat under a long study session and stay steady in its pocket \
throughout."""
weight = 1
domain = "craft"

[[review_item]]
id = "stereo-mix"
title = "Soft, wide stereo mix"
text = """
The clip is stereo with a soft, wide image that gives the keys and mallets space \
