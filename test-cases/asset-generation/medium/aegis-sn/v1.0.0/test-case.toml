slug = "aegis-sn"
experimental = true
name = "Aegis (Surface Nets)"
difficulty = "medium"
tags = ["mesh", "surface-nets", "walker"]
summary = """
Sculpt the Aegis as a static smooth-surfaced model with the Surface \
Nets meshing tool (`sn`): a colossal six-legged walking fortress — a rounded, \
watertight, mid-fidelity mesh of softly beveled armor — composited from \
signed-distance primitives one recorded operation at a time and emitted as a \
single mesh.glb."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sn-model"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants mesh the SAME Aegis at three sizes — `base` (this case's field
# bounds), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The default volume the model shapes its signed-distance field within (the 3D
# analog of a 2D canvas): `width` across (x), `height` up (y), `depth`
# front-to-back (z), in voxel units. The Aegis is deliberately huge — a walking
# fortress with a far larger footprint than any buildable unit, riding raised on
# legs — so its volume is length-dominant: broad and long. A variant may OVERRIDE
# this with its own `[voxel]` (the `half`/`double` size axis); `base` inherits it.
# The field always starts EMPTY (everywhere outside, no surface); `background` is
# only the clear color behind the wgpu preview PNG. A meshed voxel case reuses the
# [voxel] volume table and must NOT declare [canvas].
[voxel]
width = 120
height = 110
depth = 150
background = "transparent"

# The meshing tool. `sn` is the only way to shape the surface: every operation
# composites a signed-distance primitive into the single field, records itself to
# the operation log, and renders nothing — rendering is on request via `sn render`. `sn` is the
# Surface Nets extractor — a fixed medium-grid resolution that relaxes the surface
# into rounded, uniformly tessellated, watertight triangles (no sharp-edge tag; that
# is Dual Contouring only). Run `sn --help` for the field operations; no operations
# schema is seeded.
[tool]
binary = "sn"
preview = "model.png"

# The recorded operation log — the authoritative output the run collects: the
# ordered record of every `sn` op the model issued, from which the scored model is
# regenerated. A static meshed case records a single log (a single implicit part),
# so its path carries no {part} token. The `sn` binary additionally emits its
# extracted mesh as `mesh.glb` — the triangle surface (positions, normals, colors,
# indices) the reviewer's 3D view is built from — at its own fixed path, so it is not
# named here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the field bounds it states match the selected
# size (`{{voxel.width}}`×`{{voxel.height}}`×`{{voxel.depth}}`). The seeded dest
# drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
