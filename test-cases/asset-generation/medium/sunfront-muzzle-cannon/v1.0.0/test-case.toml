slug = "sunfront-muzzle-cannon"
experimental = true
name = "Sunfront Heavy-Cannon Muzzle Flash"
difficulty = "medium"
tags = ["asset-generation", "particle", "3d", "vfx", "muzzle-flash"]
summary = """
Author the Sunfront heavy-cannon muzzle flash: a big, forward-directed gun blast \
— a white-hot bloom at the muzzle, a forward gout of orange flame and heavy \
embers, and a thick rolling smoke plume — as a one-shot particle-3d emitter system \
the game plays once per shot, built one recorded operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"

# A 3D particle effect: a forward-directed heavy-cannon muzzle flash the model
# authors as an emitter SYSTEM, simulated live by the review UI and the game. It is a
# ONE-SHOT blast (one shot's worth) — the game replays it once per shot, in sync with
# the firing unit's cadence, so the flash rate matches how fast the unit shoots.
asset_kind = "particle-3d"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The volume the effect plays in. particle-3d gives width/height/depth (a volume,
# like [voxel]); the blast fires forward along +z from a muzzle point near the rear.
# The volume is larger than the small-arms flash: a heavy cannon throws flame,
# embers, and a thick smoke plume further. duration_ms is one blast's length;
# loop = false, so the blast fires at the start and decays cleanly to empty. The game
# replays it once per shot.
[particle]
width       = 36             # extent along x
height      = 36             # extent along y — up
depth       = 48             # extent along z — forward; the blast projects toward +z
duration_ms = 800            # one blast: fires at the start and decays to empty (room for the smoke plume)
fps         = 60             # preview/playback frame rate
loop        = false          # ONE-SHOT — a single shot's blast; the game replays it per shot
background  = "transparent"  # preview clear color only

# The particle tool. `particle-3d` is the only way to shape the effect; it records
# every operation to the action log and, on `render`, simulates the system and
# emits system.json. Run `particle-3d --help` for the operations; none are seeded.
[tool]
binary  = "particle-3d"
preview = "effect.gif"

# The recorded operation log — the authoritative output. Core emits the authored
# system.json (the emitter/force/curve definition) automatically; it is not
# declared here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
