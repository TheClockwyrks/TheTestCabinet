slug = "ambient-exploration"
experimental = false
name = "Ambient Exploration"
difficulty = "medium"
tags = ["music", "ambient"]
summary = """
Compose a calm, spacious ambient exploration cue: a ~30-second seamless loop of \
slow evolving synth-pad and string beds with sparse piano or vibraphone motifs \
drifting over the top — serene, mysterious, awe-struck — sequenced note by note \
as instrument tracks over the gm-lite bank."""
description = "description.md"
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "music"

variants = ["variants/base.toml"]

# The output format the rendered clip is fixed to. A music case names the baked
# instrument bank it plays; `gm-lite@0.1.0` is a name@version palette baked into
# the run-container image, never a path in this repo.
[audio]
sample_rate = 44100                 # output sample rate in Hz (required)
channels = "stereo"                 # "mono" | "stereo" (required)
max_duration_ms = 30000             # cap on the rendered clip's length in ms (required, positive) — about 30 seconds
instrument_bank = "gm-lite@0.1.0"   # music ONLY: the baked instrument bank (name@version)

# The sequencer. `music` is the only way to shape sound; it records every
# operation to the action log and renders the waveform + spectrogram + piano-roll
# only when you run `render`. Run `music --help` to see the operations; no
# operations schema is seeded.
[tool]
binary = "music"
preview = "waveform.png"

# The recorded action log — the authoritative output the clip is regenerated
# from. Core emits the rendered clip.wav (and a portable clip.mid) automatically.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the clip reads as the calm ambient exploration cue the brief \
describes — spacious and unhurried, a slow evolving bed of pads and strings with \
sparse motifs drifting over the top, evoking serene wonder and gentle curiosity \
before a vast, quiet landscape, with little or no percussion driving it."""

[[domain]]
id = "craft"
name = "Craft"
description = """
Musicianship in the writing — a coherent tonality and slow sense of drift, \
sensible instrument choices and voicings from the gm-lite bank that build a deep, \
enveloping ambient bed, a seamless loop with no audible seam, and a wide stereo \
mix with real space and depth."""

[[review_item]]
id = "calm-spacious"
title = "Calm, spacious, and unhurried"
text = """
The clip reads at once as calm and spacious ambient music — a slow, evolving bed \
that breathes and drifts rather than driving forward, with plenty of air between \
events — not busy, rhythmic, or tense."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "wonder-mystery"
title = "Evokes wonder and gentle mystery"
text = """
The cue conjures serene awe and quiet curiosity — a vast, mysterious landscape \
opening up, inviting exploration — beautiful and a little unknown, rather than \
melancholy, ominous, or triumphant."""
weight = 2
domain = "fidelity"

[[review_item]]
