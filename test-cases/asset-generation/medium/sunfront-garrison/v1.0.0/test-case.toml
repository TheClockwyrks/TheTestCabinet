slug = "sunfront-garrison"
name = "Sunfront Garrison"
difficulty = "medium"
tags = ["voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Garrison: an opaque-voxel fortified infantry \
barracks — a low, wide brass-and-sandstone blockhouse whose front deployment \
ramp lowers from its muster gate and whose belfry bell swings, each a looping \
decorative auto-play animation the model authors, built and rigged one recorded \
operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt and rig the SAME garrison at three sizes — `base` (this
# case's volume), `half` (each extent ~halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 60
height = 64
depth = 60
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part
# the model defines), the authoritative output each part's regenerated model is
# rebuilt from. The composited rig rides in `rig.json`, so it is not named here.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (a game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model authors
# each animation's F-curves at run time with `voxel-anim`
# `define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations
# so the contract exists from the first operation.
[model]

# `muster_ramp_drop` — the front deployment ramp's fall. A self-playing idle that
# hinges the ramp down from the muster gate toward the ground and raises it back,
# continuously, on its own — the gangway troopers march down when they deploy.
[[model.animation]]
name = "muster_ramp_drop"
loop = true
auto_play = true

# `muster_bell_swing` — the belfry bell's swing. A self-playing idle that swings the
# muster bell side to side about its yoke, continuously, on its own — a pendulum bell
# calling the garrison to muster.
[[model.animation]]
name = "muster_bell_swing"
loop = true
auto_play = true

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected
# size. The seeded dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Garrison \
and animates correctly — a low, wide fortified infantry barracks whose front \
deployment ramp lowers from its muster gate and whose belfry bell swings, each a \
looping decorative auto-play animation the model authors, while the blockhouse \
stays put, with a clear solar-amber energy accent and the disciplined Duneforged \
palette."""

[[review_item]]
id = "reads-as-garrison"
title = "Reads as a fortified infantry barracks"
text = """
From more than one angle the model reads unmistakably as a Duneforged garrison: a \
low, wide fortified blockhouse of brass-and-sandstone masonry with a crenellated \
parapet and slit windows that read as manned quarters, a fortified muster gate on \
its front with a deployment ramp, and a belfry over the gate holding a bell. It is a \
military barracks/muster post — not an industrial foundry, and not an abstract stack \
of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Ramp lowers and bell swings on their own"
text = """
The animated elements cycle on their own via their self-playing animations. Playing \
`muster_ramp_drop`, the front deployment ramp hinges down from the muster gate toward \
the ground and rises back, looping continuously — a gangway falling and lifting on its \
hinge. Playing `muster_bell_swing`, the belfry bell swings side to side about its yoke, \
looping continuously — a pendulum bell. Both read as steady, weight-carrying motion — \
eased, not a flat linear slide — with no geometry tearing away from its mount across \
the cycle."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "The blockhouse stays put; only the moving parts move"
text = """
The barracks blockhouse is the fixed base of the building: it stays put, never carried \
along by the falling ramp or the swinging bell. When `muster_ramp_drop` plays the ramp \
hinges while the rest of the barracks holds; when `muster_bell_swing` plays the bell \
swings while the rest of the barracks holds. Nothing but the moving elements moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Ramp and bell stay attached"
text = """
The moving elements stay attached across their whole range of motion: the deployment \
ramp meets the muster gate's sill at its hinge with no gap and never floats free as it \
falls under `muster_ramp_drop`, and the bell hangs from its yoke in the belfry and \
never leaves it as it swings under `muster_bell_swing`."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, sandstone \
panels, iron mechanisms and the bell, and the solar-amber energy accent) with a clear \
amber glow at the muster gate and firing ports, no out-of-palette colors, and no stray \
voxels drifting off the parts."""
weight = 1
domain = "fidelity"
