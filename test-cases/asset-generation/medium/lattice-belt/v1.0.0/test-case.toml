slug = "lattice-belt"
experimental = true
name = "Lattice Transport Belt"
difficulty = "medium"
tags = ["sprite-sheet", "belt"]
summary = """
Draw the Lattice transport belt in both its forms — a straight East-flowing \
segment and the 90-degree curve that turns it — across three upgrade tiers, as \
forty-eight 32x32 frames whose tread blades and accent chevrons scroll in \
seamless loops, produced one drawing operation at a time. Each tier shares one \
metal body, cross-section, and construction language, recolored only at the \
movers — amber, then red-orange, then blue-cyan — with rising mechanical detail \
and a faster loop, so the tiers read as one belt progressively upgraded while the \
two forms still meet flush and scroll in phase."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one tile of
# belt at the game's normal tile resolution. The straight belt and the curve are
# drawn at the SAME tile size, which is what lets a curve butt flush against a
# straight segment. Fixing the frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x32 file — and the six named
# animation sequences a reviewer plays back. The 48 frames are three tiers of
# sixteen; within each tier the first eight are the straight belt and the next
# eight the curve, each its own eight-frame scrolling loop:
#   Tier 1 (amber):      straight 0-7,   curve 8-15   (fps 12)
#   Tier 2 (red-orange): straight 16-23, curve 24-31  (fps 16)
#   Tier 3 (blue-cyan):  straight 32-39, curve 40-47  (fps 20)
