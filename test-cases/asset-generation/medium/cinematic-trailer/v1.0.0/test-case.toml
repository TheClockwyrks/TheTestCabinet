slug = "cinematic-trailer"
experimental = false
name = "Cinematic Trailer Cue"
difficulty = "medium"
tags = ["music", "cinematic"]
summary = """
Compose an epic orchestral trailer cue: a ~30-second blockbuster teaser that opens \
sparse and tense, layers in rising ostinatos and heroic horns over taiko and \
bass-drum hits, and crests on a full choir-and-brass climax before a short \
resolving tail — sequenced note by note as instrument tracks over the cinematic \
bank."""
description = "description.md"
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "music"

variants = ["variants/base.toml"]

# The output format the rendered clip is fixed to. A music case names the baked
# instrument bank it plays; `cinematic@0.1.0` is a name@version palette baked into
# the run-container image, never a path in this repo.
[audio]
sample_rate = 44100                   # output sample rate in Hz (required)
channels = "stereo"                   # "mono" | "stereo" (required)
max_duration_ms = 30000               # cap on the rendered clip's length in ms (required, positive) — about 30 seconds
instrument_bank = "cinematic@0.1.0"   # music ONLY: the baked instrument bank (name@version)

# The sequencer. `music` is the only way to shape sound; it records every
# operation to the action log and renders the waveform + spectrogram + piano-roll
# only when you run `render`. Run `music --help` to see the operations; no
# operations schema is seeded.
[tool]
binary = "music"
preview = "waveform.png"

# The recorded action log — the authoritative output the clip is regenerated
# from. Core emits the rendered clip.wav (and a portable clip.mid) automatically.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the clip reads as the epic orchestral trailer cue the brief \
describes — grand, heroic, and emotional, a blockbuster teaser that opens sparse \
and tense, builds through rising ostinatos and heroic horns punctuated by taiko \
and bass-drum hits, and crests on a full choir-and-brass climax before a short \
resolving tail."""

[[domain]]
id = "craft"
name = "Craft"
description = """
Musicianship in the writing — a coherent tonality and pulse, sensible instrument \
choices and voicings from the cinematic bank that layer a convincing orchestral \
arc, controlled dynamics that reserve headroom for the climax, and a huge, wide \
stereo mix with real space and depth and no clipping."""

[[review_item]]
id = "epic-heroic"
title = "Epic, heroic, and emotional"
text = """
The clip reads at once as an epic orchestral trailer cue — grand, heroic, and \
emotional, the sound of a blockbuster teaser — with soaring brass and full-throated \
choir over a wide orchestral bed, rather than small, thin, or incidental."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "builds-to-climax"
title = "Builds from tension to a climax"
text = """
The cue has a clear dynamic arc: it opens sparse and tense — a lone voice over hushed \
tremolo strings and low choir — layers in more force as it goes, and crests on a full \
choir-and-brass climax before a short resolving tail, rather than sitting at one level \
throughout."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "driving-momentum"
title = "Driving, propulsive momentum"
text = """
Rising staccato and pizzicato string ostinatos and heroic horn lines drive the cue \
forward, punctuated by taiko and orchestral bass-drum hits and capped by a cymbal at \
the climax, so it feels propulsive and building rather than static or aimless."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "orchestral-voicing"
title = "Convincing orchestral voicing"
text = """
The voices are chosen and layered like a real orchestra — melody, counterline, \
sustained bed, and percussion each in their register — so the ensemble sounds full \
and balanced rather than muddy, cluttered, or dominated by a single line."""
weight = 1
domain = "craft"

[[review_item]]
id = "stereo-mix"
title = "Huge, wide stereo mix"
text = """
The clip is stereo with a huge, wide image that spreads the orchestra across the \
field with a sense of space and depth, reserves headroom so the climax lands with \
impact, and holds a clean balance with no clipping and no one voice swamping the \
rest."""
weight = 1
domain = "craft"
