slug = "caldera-core"
experimental = true
name = "Caldera Core"
difficulty = "medium"
tags = ["voxel", "rig", "building"]
summary = """
Sculpt and rig the Caldera Core: the Holdfast the whole game defends — a broad \
stepped brass keep, a ziggurat of receding tiers rising to a crowned summit, with \
banners hanging from its upper tiers and a beacon at the very top, the biggest built \
thing on the field — painted cell by cell with the `voxel-anim` tool, one recorded \
operation at a time. The model invents whatever parts and joints it needs; the fixed \
contract is two animations it must author — a self-playing `idle` and a one-shot \
`upgrade` that holds its final pose — plus a contiguous verdigris accent the game \
recolors to show the Core's upgrade level."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Core at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Core's real size at the roster's shared scale — it is by far the LARGEST
# built thing on the field, and the volume's broad footprint carries that before a
# single voxel is placed. Each part is sculpted separately in this shared volume's
# coordinates. The volume always starts EMPTY; `background` is only the clear color
# behind the rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 80
height = 70
depth = 80
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the Core's game events.
[model]

# `idle` — the self-playing life of the keep. A self-playing idle that loops on its
# own: the beacon at the summit turns and the banners stir, so the Core reads as alive
# and garrisoned. The keep itself stays fixed.
[[model.animation]]
name = "idle"
loop = true
auto_play = true

# `upgrade` — the moment of becoming more powerful. A game-triggered ONE-SHOT that
# plays once and HOLDS its final pose (`loop = false`): the keep's tiers grind and
# rise, the crown ring lifts and locks, and the beacon flares — played the instant the
# player pays for an upgrade.
[[model.animation]]
name = "upgrade"
loop = false
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera Core and poses \
correctly — the broad stepped brass keep, a ziggurat of receding tiers rising to a \
crowned summit with hanging banners and a beacon, the largest built thing of the \
roster, carrying one contiguous verdigris accent, whose banners and beacon stir on \
their own and whose upgrade grinds the tiers up and locks in a satisfying moment of \
power, in the disciplined Holdfast palette."""

[[review_item]]
id = "reads-as-core"
title = "Reads as the Core"
text = """
From more than one angle the model reads unmistakably as the Holdfast Core: a BROAD \
STEPPED BRASS KEEP — a ziggurat of receding tiers rising to a crowned summit, with \
BANNERS hanging from the upper tiers and a BEACON at the very top. It reads as a SEAT \
OF POWER, architecture rather than machinery, and plainly the LARGEST built thing of \
the roster. Nothing about it reads as small, slight, or machine-like."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "idle-reads"
title = "Idle keeps the Core alive on its own"
text = """
Playing `idle` turns the beacon at the summit and stirs the banners hanging from the \
upper tiers, cycling on its own with no caller, so the Core reads as alive and \
garrisoned even when nothing is happening. It loops seamlessly with an eased, \
deliberate cadence rather than a mechanical linear slide. Only the beacon and the \
banners move — the tiered keep beneath them stays fixed, never carried along — and \
nothing tears away from its mount."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "upgrade-reads"
title = "Upgrade grinds the tiers up and holds"
text = """
Playing `upgrade` plays ONCE and HOLDS its final pose: the keep's tiers grind and \
rise, the crown ring lifts and locks, and the beacon flares — a single visible, \
satisfying moment of the Core becoming more powerful, not a loop. Each moving element \
travels as one solid piece and stays attached, and the keep reads as taller and prouder \
at the end, holding that stronger pose rather than snapping back to its start."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-region"
title = "A contiguous verdigris accent"
text = """
The crown ring at the summit and the trim edging the banners — and only those — are \
sculpted in the accent color `#2f7d72`, each a clean, unbroken run and clearly visible \
from more than one angle. That color appears NOWHERE else on the model — not one stray \
voxel, highlight, or seam. The game finds every voxel of it and repaints it to show the \
Core's upgrade level, so a scattered, broken, or misplaced accent region breaks the \
upgrade system outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Holdfast palette discipline"
text = """
Uses only the brief's four colors — brass plating, brass dark, iron mechanisms, and the \
verdigris accent — with no out-of-palette colors, and in particular NO steel `#b8bcc2`, \
NO gold `#ffce54`, and NO white `#dfeaea` anywhere on the model, since a game paints \
those onto the accent at run time to show the Core's upgrade level. No stray voxels \
drift off the model."""
weight = 1
domain = "fidelity"
