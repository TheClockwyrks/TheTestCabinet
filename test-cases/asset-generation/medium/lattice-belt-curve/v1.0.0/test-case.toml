slug = "lattice-belt-curve"
experimental = true
name = "Lattice Curved Transport Belt"
difficulty = "medium"
tags = ["sprite-sheet", "belt"]
summary = """
Draw the Lattice curved transport belt: an animated, top-down 90-degree corner \
belt for a deterministic factory simulation, as eight 32x32 frames whose tread \
blades and amber chevrons follow the curve from the West entry to the South exit \
and scroll around it together in a seamless loop so the belt reads as moving, \
produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one tile of
# belt at the game's normal tile resolution, the same tile size as the straight
# belt so a curve butts flush to it. Fixing the frame size keeps every run
# comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x32 file — and the named
# animation sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "curve-flow"
name = "Curved belt — flowing"
frames = [0, 1, 2, 3, 4, 5, 6, 7]
fps = 12

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lattice curved belt — a single \
continuous top-down surface that turns 90 degrees from a full-width West entry \
face to a full-width South exit face (one belt, not two), the single rail that \
follows the outer edge of the curve, the strict amber-on-dark-metal palette \
matching the straight belt so a curve reads as the same belt, the tread blades \
patterned across the surface and the central row of chevrons that follow the arc to \
mark the direction of travel, and the seamless scroll of the whole surface — blades \
and chevrons together — around the curve so the belt itself reads as moving."""

[[review_item]]
id = "scroll-loop"
title = "Seamless scrolling loop around the curve"
text = """
Played in order, the eight frames read as one belt surface flowing steadily around \
the corner: the whole surface pattern — tread blades and chevrons together — \
advances along the curve by the same small step (one-eighth of the chevron pitch, \
measured along the arc) each frame, so all eight frames sit at distinct offsets and \
the pattern visibly creeps forward around the bend — it must NOT collapse into two \
frames oscillating between a pair of positions. Frame 7 returns to frame 0 with no \
jump, stutter, or backward slip: a clean continuous advancing loop."""
sequences = ["curve-flow"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "surface-moves"
title = "The belt surface itself moves"
text = """
The belt reads as a running conveyor because the SURFACE moves, not just the arrows. \
The tread blades (the cleats patterned across the belt) scroll around the arc from \
frame to frame together with the chevrons — a viewer watching the loop sees the \
whole surface travelling. It is WRONG for the surface to sit frozen while only the \
amber chevrons slide over a static floor; the blades and chevrons move as one. Only \
the outer rail and the tile's silhouette stay fixed."""
sequences = ["curve-flow"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "quarter-turn"
title = "Clean 90-degree turn"
text = """
The tile reads as ONE belt making a smooth quarter turn: flow enters at the West \
edge travelling East and leaves at the South edge travelling South, curving between \
the two by a single 90-degree arc. The belt is not a straight segment, not an L of \
two straight stubs meeting at a hard corner, and not a turn of the wrong angle or \
handedness — it is one continuous curved surface sweeping from the West face round \
to the South face."""
sequences = ["curve-flow"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "arc-chevrons"
title = "Chevrons follow the arc"
text = """
A single central row of amber chevrons is painted along the curve, each pointing \
in the direction of travel at its point on the arc — leading East where flow enters \
at the West edge and rotating round to lead South where it leaves at the South edge, \
their open ends trailing back upstream. They follow the bend rather than pointing \
one fixed direction, and the same chevron shape repeats along the single curved \
row."""
sequences = ["curve-flow"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "single-belt-surface"
title = "One continuous belt surface"
text = """
The tile reads as ONE belt with a single continuous curved surface, not two belts \
nor two lanes. The central row of chevrons is PAINTED on the surface purely as a \
movement marker — it does NOT carve the belt into lanes or reserve a strip of its \
own, and the surface under and around it is the same surface items rest on, which \
spans the full width of the belt from the sharp inner corner out to the outer rail. \
There is NO hard divider following the curve and NO lane rails: the whole filled \
quarter-round is one uninterrupted belt."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "flush-faces"
title = "Full-width faces at both edges"
text = """
The belt presents a full 32 px belt face at BOTH the West entry edge and the South \
exit edge — the same width as a straight belt tile — so the curve butts up flush to \
a straight belt or a machine mouth on either side with no overhang or gap. The \
filled surface reaches each of those two edges across its whole width and runs all \
the way into the inner (South-West) corner where the two mouths meet, so neither \
mouth is narrowed; only the far corner outside the arc is left off-belt. A thin \
curved band pulled back from the inner corner — which would shrink both faces below \
32 px — is wrong."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "matches-belt-look"
title = "Reads as the same belt"
text = """
The curved tile is unmistakably the SAME belt as the straight transport belt — the \
same dark-metal body tones, the same lighter side rails, and the same amber \
chevrons, only bent 90 degrees. A viewer should read a straight belt feeding into \
this corner as one continuous conveyor, not as two different belts meeting."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "metal-body-rails"
title = "Dark-metal body with an outer rail along the curve"
text = """
The belt body is dark metal in the base and mid tones, bounded by a single lighter \
rail running along the OUTER (convex) edge of the curve — the curved analogue of a \
straight belt's outer side rail. The inner side of the turn is the sharp South-West \
corner where the mouths meet and carries no rail arc. The surface reads as a solid \
mechanical belt, not bare chevrons floating on transparency."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Strict palette adherence"
text = """
Uses only the belt palette from the brief — the dark outline, the metal base, mid, \
and rail tones, and the amber mover with its highlight and shadow — with no \
out-of-palette colors and no halo of stray or anti-aliased pixels. It is the same \
palette as the straight belt."""
weight = 1
domain = "fidelity"
