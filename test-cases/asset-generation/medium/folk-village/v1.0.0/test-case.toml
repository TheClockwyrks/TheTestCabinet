slug = "folk-village"
experimental = false
name = "Folk Village Theme"
difficulty = "medium"
tags = ["music", "folk"]
summary = """
Compose a warm pastoral acoustic-folk village theme: a ~30-second cozy, sunlit \
cue for a peaceful town — fingerpicked nylon guitar under a lilting woodwind \
melody, soft sustained strings, and a gentle hand-percussion pulse — sequenced \
note by note as instrument tracks over the gm-lite bank."""
description = "description.md"
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "music"

variants = ["variants/base.toml"]

# The output format the rendered clip is fixed to. A music case names the baked
# instrument bank it plays; `gm-lite@0.1.0` is a name@version palette baked into
# the run-container image, never a path in this repo.
[audio]
sample_rate = 44100                 # output sample rate in Hz (required)
channels = "stereo"                 # "mono" | "stereo" (required)
max_duration_ms = 30000             # cap on the rendered clip's length in ms (required, positive) — about 30 seconds
instrument_bank = "gm-lite@0.1.0"   # music ONLY: the baked instrument bank (name@version)

# The sequencer. `music` is the only way to shape sound; it records every
# operation to the action log and renders the waveform + spectrogram + piano-roll
# only when you run `render`. Run `music --help` to see the operations; no
# operations schema is seeded.
[tool]
binary = "music"
preview = "waveform.png"

# The recorded action log — the authoritative output the clip is regenerated
# from. Core emits the rendered clip.wav (and a portable clip.mid) automatically.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the clip reads as the warm pastoral folk village theme the brief \
describes — a cozy, sunlit acoustic cue built on fingerpicked nylon guitar and a \
lilting woodwind melody over soft strings and a gentle hand-percussion pulse: \
wholesome, gently rustic, and inviting, the sound of a town square and home."""

[[domain]]
id = "craft"
name = "Craft"
description = """
Musicianship in the writing — a coherent tonality and lilting pulse, sensible \
instrument choices and voicings from the gm-lite bank that conjure a warm acoustic \
ensemble, a clean loopable ending, and a natural, open stereo mix with real space \
and depth."""

[[review_item]]
id = "warm-pastoral-folk"
title = "Warm, pastoral acoustic folk"
text = """
The clip reads at once as warm and pastoral acoustic folk — a fingerpicked \
nylon-guitar foundation, a lilting woodwind melody, and soft sustained strings — \
evoking a sunlit village square and the comfort of home, not a synthetic, \
electronic, orchestral-epic, or urban sound."""
weight = 3
domain = "fidelity"

