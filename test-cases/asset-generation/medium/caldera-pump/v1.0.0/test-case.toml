slug = "caldera-pump"
name = "Caldera Pump"
difficulty = "medium"
tags = ["voxel", "rig", "building"]
summary = """
Sculpt and rig the Caldera Pump: the Holdfast's walking-beam engine — a broad brass \
frame carrying a great iron rocking beam pivoted at its center, one end weighted by a \
counterweight and the other driving a piston rod into the ground, with a long intake \
snorkel reaching out to the deep water beside it and a flywheel turning on the frame \
— painted cell by cell with the `voxel-anim` tool, one recorded operation at a time. \
The model invents whatever parts and joints it needs; the fixed contract is two \
animations it must author — a slow self-playing `idle` and a hard-working `pump` — \
plus a contiguous verdigris accent the game recolors."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Pump at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Pump's real size at the roster's shared scale — it is a BROAD, low
# walking-beam engine, and the volume's wide, low-slung proportions carry that before
# a single voxel is placed. Each part is sculpted separately in this shared volume's
# coordinates. The volume always starts EMPTY; `background` is only the clear color
# behind the rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 40
height = 34
depth = 40
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the Pump's game events.
[model]

# `idle` — turning over, not delivering. A self-playing idle that loops on its own: the
# flywheel turns slowly and the beam sits nearly level, barely rocking, so the Pump
# reads as ticking over but not working. The frame stays fixed.
[[model.animation]]
name = "idle"
loop = true
auto_play = true

# `pump` — working. A game-triggered playable that loops: the beam rocks through its
# full stroke, see-sawing hard — the counterweight rising and falling, the piston rod
# driving down and up with real weight, the flywheel spinning fast. Played only while
# the Pump is delivering water, so it must read unmistakably as WORKING.
[[model.animation]]
name = "pump"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera Pump and poses \
correctly — the broad brass frame carrying a great iron rocking beam pivoted at its \
center, weighted by a counterweight at one end and driving a piston rod at the other, with \
a long intake snorkel and a flywheel, carrying one contiguous verdigris accent, whose idle \
ticks over slowly and whose pump see-saws the beam hard as real work, in the \
disciplined Holdfast palette."""

[[review_item]]
id = "reads-as-pump"
title = "Reads as the Pump"
text = """
From more than one angle the model reads unmistakably as the Pump: a WALKING-BEAM \
ENGINE — a broad brass frame carrying a great iron ROCKING BEAM pivoted at its center, \
one end weighted by a counterweight and the other driving a piston rod down into the \
ground, with a long INTAKE SNORKEL reaching out to the side and a flywheel turning on \
the frame. The rocking beam and the snorkel are the whole tell. It reads as brass-and- \
iron machinery — a static engine founded on the ground, not a creature."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "idle-reads"
title = "Idle ticks over slowly on its own"
text = """
Playing `idle` turns the flywheel slowly and holds the beam nearly level, barely \
rocking, so the Pump reads as ticking over but not delivering — an engine on standby, \
not working. It cycles on its own with no caller and loops seamlessly with an eased, \
deliberate cadence. Only the flywheel and the slight beam motion play — the frame and \
the snorkel stay planted, never carried along."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "pump-reads"
title = "Pump see-saws the beam as real work"
text = """
Playing `pump` rocks the beam through its full stroke, see-sawing hard — the \
counterweight rising and falling, the piston rod driving down and up with real weight, \
and the flywheel spinning fast — reading unmistakably as WORKING, plainly distinct from \
the slow idle. The beam pivots as one solid piece about its center and every element \
stays attached, and the frame stays planted throughout."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-region"
title = "A contiguous verdigris accent"
text = """
The counterweight at the beam's end and the rim of the flywheel — and only those — are \
sculpted in the accent color `#2f7d72`, each a clean, unbroken run and clearly visible \
from more than one angle. That color appears NOWHERE else on the model — not one stray \
voxel, highlight, or seam. The game finds every voxel of it and repaints it \
unconditionally when the model loads, so a scattered, broken, or misplaced accent region \
breaks the recolor outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Holdfast palette discipline"
text = """
Uses only the brief's four colors — brass plating, brass dark, iron mechanisms, and the \
verdigris accent — with no out-of-palette colors, and in particular NO steel `#b8bcc2`, \
NO gold `#ffce54`, and NO white `#dfeaea` anywhere on the model, since a game paints \
those onto Holdfast accent fittings at run time. No stray voxels drift off the model."""
weight = 1
domain = "fidelity"
