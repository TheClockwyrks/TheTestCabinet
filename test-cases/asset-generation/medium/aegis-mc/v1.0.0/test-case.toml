slug = "aegis-mc"
experimental = true
name = "Aegis (Marching Cubes)"
difficulty = "medium"
tags = ["mesh", "marching-cubes", "walker"]
summary = """
Sculpt the Aegis: a colossal, standing six-legged war-fortress meshed \
from a signed-distance field with the `mc` Marching Cubes binary — a bold, chunky, \
faceted low-poly surface — one recorded operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "mc-model"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants mesh the SAME Aegis at three sizes — `base` (this case's field
# bounds), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The default volume the Marching Cubes field is framed in (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. The Aegis is deliberately huge — a walking fortress with a far larger
# footprint than any buildable unit, riding raised on its legs — so its volume is
# length-dominant: broad and long, riding on its legs. A variant may OVERRIDE this
# with its own `[voxel]` (the `half`/`double` size axis); `base` inherits it. Unlike
# a cube case this volume frames a CONTINUOUS signed-distance field (primitive
# centers and extents are real-valued within it), not a discrete cell grid. The
# field always starts EMPTY; `background` is only the clear color behind the wgpu
# preview PNG. A voxel/mesh case must NOT declare [canvas].
[voxel]
width = 120
height = 110
depth = 150
background = "transparent"

# The meshing tool. `mc` is the only way to shape the surface: every operation
# composites a primitive into (or carves it out of) the signed-distance field,
# records itself to the op log and renders nothing — rendering is on request via
# `mc render`, which extracts the mesh and draws the wgpu preview PNG. Marching Cubes
# samples the field on a COARSE uniform grid, so
# the output is a chunky, faceted LOW-POLY surface — a fixed characteristic of the
# binary, not a manifest knob. Run `mc --help` for the operations; no operations
# schema is seeded.
[tool]
binary = "mc"
preview = "model.png"

# The recorded operation log — the authoritative output the run collects: the
# ordered record of every `mc` op the model issued, from which the scored model is
# regenerated. For a static model this is a single file (no `{part}` template). The
# `mc` binary additionally emits its extracted mesh as `mesh.glb` — the triangle
# surface (positions/normals/colors/indices) the review viewer renders — at its own
# fixed path, so it is not named here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the field bounds it states match the selected
# size (`{{voxel.width}}`×`{{voxel.height}}`×`{{voxel.depth}}`). The seeded dest
# drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
