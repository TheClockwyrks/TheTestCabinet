slug = "caldera-slag"
experimental = true
name = "Caldera Slag"
difficulty = "medium"
tags = ["skinned", "creature"]
summary = """
Sculpt and rig the Caldera Slag: a molten elemental creature — a hunched \
mass of glowing magma sheathed in cracked cooling-basalt crust — built as ONE \
continuous skin bound to a model-invented skeleton with the `sn-skin` tool, one \
recorded operation at a time. The model invents whatever bones and joints it needs; \
the fixed contract is three animations it must author — a lumbering `advance` walk, \
a one-shot `slam` attack, and an `emerge` rise from the ground — that deform the \
whole body as continuous skin the reviewer can play back."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "sn-skinned"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt and rig the SAME Slag at three field sizes — `base` (this
# case's volume), `half` (each extent ~halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The field bounds — the SAME [voxel] volume table a meshed case frames, here
# bounding the ONE whole-body signed-distance field the skin is extracted from:
# `width` across (x), `height` up (y), `depth` front-to-back (z), in field units.
# Material is opaque #rrggbb (no alpha); the field always starts EMPTY;
# `background` is only the clear color behind the rasterized preview PNG. A skinned
# case must NOT declare [canvas].
[voxel]
width = 44
height = 36
depth = 44
background = "transparent"

# The skinning tool. `sn-skin` (Surface Nets — smooth, watertight, mid-fidelity) is
# the only way to sculpt the field and edit the skeleton. Because a skinned model
# builds ONE whole-body field / ONE mesh, `preview` and (below) `actions` are SINGLE
# files and must NOT carry a `{part}` token. Run `sn-skin --help` for the field ops
# AND the skeleton/animation subcommands; no operations schema is seeded. Rendering
# is on request via `sn-skin render`.
[tool]
binary = "sn-skin"
preview = "model.png"

# The recorded operation log — a SINGLE op record (one field, one skeleton, one
# log), the authoritative output the regenerated model is rebuilt from. The skinned
# mesh.glb (geometry + the glTF skin: per-vertex bone weights and inverse-bind
# matrices) and rig.json (skeleton, joint interface, F-curve animations) are emitted
# automatically by core — they are NOT declared here.
[output]
actions = "actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe bones, joints, pivots, ranges, or the per-vertex weights
# that bind the skin: the model invents the whole skeleton and its binding, and is
# judged on whether it works out the right pieces and deforms the skin convincingly.
# What is fixed is the set of NAMED ANIMATIONS the model must author (a game plays
# them by name). The model authors each animation's F-curves at run time with
# `sn-skin define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these
# declarations so the contract exists from the first operation.
[model]

# `advance` — the lumbering walk. A game-triggered playable that loops: the creature
# hauls its heavy mass forward on planted limbs while the pelvis, spine, and crust
# flex across the joints so the whole molten body rolls with weight.
[[model.animation]]
name = "advance"
loop = true
auto_play = false

# `slam` — the one-shot attack. A game-triggered playable that plays once and holds:
# the creature rears and brings its mass down, the impact carrying up through the
# shoulders and spine as continuous-skin deformation, then settles.
[[model.animation]]
name = "slam"
loop = false
auto_play = false

# `emerge` — the one-shot rise. A game-triggered playable that plays once and holds:
# the creature forms and heaves up out of the ground, the crust splitting and the
# body unfolding to its standing pose as the skin stretches into shape.
[[model.animation]]
name = "emerge"
loop = false
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the field bounds it states match the selected
# size. The seeded dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
