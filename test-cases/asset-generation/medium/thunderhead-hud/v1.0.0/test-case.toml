slug = "thunderhead-hud"
experimental = true
name = "Thunderhead HUD"
difficulty = "medium"
tags = ["ui", "naval"]
summary = """
Paint the Thunderhead fleet-command HUD kit — a bezelled command panel, a \
stretchable health-bar frame, a square minimap bezel, a faction crest, and a \
primary button — as high-resolution interface art with the paint and ui \
binaries, one recorded operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "ui"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The base element size (also the single-image size) and initial background. A
# 512x512 transparent canvas keeps every element's declared size relative to a
# common frame.
[canvas]
width = 512
height = 512
background = "transparent"

# The drawing tools. `binary` names the PRIMARY painter (`paint`); the companion
# `ui` binary (crisp shapes, text, nine-slice) ships in the SAME run-container
# image and is on PATH — the brief directs the model to both. `preview` carries
# the {element} token: one preview file per element in the kit.
[tool]
binary = "paint"
preview = "elements/{element}.png"

# The recorded op log — a SINGLE interleaved record for the whole kit (each op
# carries its own --element). NOT an {element} template. Core emits the flattened
# per-element PNGs and ui.json automatically; those are not declared here.
[output]
actions = "actions.json"

# The KIT of named elements. Each is its own document of its own size — the
# interface analogue of a sprite sheet's frames.
[ui]

# A bezelled readout plate that stretches to any size: the corners and the top
# bezel bar stay fixed while the center readout field and edges tile to fit.
[[ui.element]]
name = "command-panel"
width = 512
height = 512
nine_slice = { left = 48, right = 48, top = 48, bottom = 48 }

# A wide gauge housing that stretches horizontally: the left cap, right cap, and
# top/bottom rails stay fixed while the center rail tiles to any bar length.
[[ui.element]]
name = "health-bar-frame"
width = 512
height = 96
nine_slice = { left = 40, right = 40, top = 24, bottom = 24 }

# A square radar surround that stretches to any minimap size, its riveted corners
# held while the framed edges tile.
[[ui.element]]
name = "minimap-bezel"
width = 384
height = 384
nine_slice = { left = 48, right = 48, top = 48, bottom = 48 }

# A fixed-size insignia — no nine-slice, it is never stretched.
[[ui.element]]
name = "faction-crest"
width = 256
height = 256

# A stretchable primary button: the rounded caps stay fixed while the label field
# stretches to fit any label.
[[ui.element]]
name = "button-primary"
width = 256
height = 72
nine_slice = { left = 24, right = 24, top = 20, bottom = 24 }

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
