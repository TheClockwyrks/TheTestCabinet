slug = "caldera-river-tap"
experimental = true
name = "Caldera River Tap"
difficulty = "medium"
tags = ["voxel", "rig", "building"]
summary = """
Sculpt and rig the Caldera River Tap: the smallest, lowest waterworks of the Holdfast \
— a low brass sluice gate spanning a river channel, a weir with a liftable gate in an \
iron frame, with an undershot paddle wheel turning in the flow beside it, gravity-fed \
and simple — painted cell by cell with the `voxel-anim` tool, one recorded operation \
at a time. The model invents whatever parts and joints it needs; the fixed contract is \
two animations it must author — a gentle self-playing `idle` and a steady `draw` — \
plus a contiguous verdigris accent the game recolors."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME River Tap at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the River Tap's real size at the roster's shared scale — it is the SMALLEST and
# LOWEST structure of the roster, and the volume's small, low proportions carry that
# before a single voxel is placed. Each part is sculpted separately in this shared
# volume's coordinates. The volume always starts EMPTY; `background` is only the clear
# color behind the rasterized isometric preview PNG. A voxel case must NOT declare
# [canvas].
[voxel]
width = 28
height = 26
depth = 28
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the River Tap's game events.
[model]

# `idle` — sitting in the current. A self-playing idle that loops on its own: the
# paddle wheel turns gently in the current and the gate stays still, so the Tap reads
# as sitting in the river, not drawing. The frame and gate stay fixed.
[[model.animation]]
name = "idle"
loop = true
auto_play = true

# `draw` — drawing water. A game-triggered playable that loops: the sluice gate lifts
# and the paddle wheel spins up as water is drawn through the weir, cycling steadily.
# Played while the Tap is drawing, so it reads as active but simple — gravity-fed, never
# heavy or powered.
[[model.animation]]
name = "draw"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera River Tap and poses \
correctly — the low brass sluice gate spanning a river channel, a weir with a liftable \
gate in an iron frame and an undershot paddle wheel turning beside it, the smallest and \
lowest structure of the roster, carrying one contiguous verdigris accent, whose paddle \
wheel turns gently at idle and whose gate lifts and wheel spins up as it draws, in the \
disciplined Holdfast palette."""

[[review_item]]
id = "reads-as-river-tap"
title = "Reads as the River Tap"
text = """
From more than one angle the model reads unmistakably as the River Tap: a LOW brass \
SLUICE GATE spanning a river channel — a weir with a liftable gate in an iron frame — \
with an undershot PADDLE WHEEL turning in the flow beside it. The sluice gate and the \
paddle wheel are the whole tell. It is plainly the SMALLEST and LOWEST structure of the \
roster, gravity-fed and simple, with nothing about it reading as powered, heavy, or \
tall. It reads as brass-and-iron machinery — a static weir founded on the ground, not a \
creature."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "idle-reads"
title = "Idle turns the paddle wheel gently"
text = """
Playing `idle` turns the paddle wheel gently in the current with the gate held still, so \
the Tap reads as sitting in the river rather than drawing. It cycles on its own with no \
caller and loops seamlessly with an eased, deliberate cadence. Only the paddle wheel \
turns — the sluice gate, the iron frame, and the weir stay fixed, never carried along — \
and no paddle tears away from the wheel."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "draw-reads"
title = "Draw lifts the gate and spins the wheel"
text = """
Playing `draw` lifts the sluice gate within its frame and spins the paddle wheel up as \
water is drawn through the weir, cycling steadily. It reads as active but simple — \
gravity-fed, never heavy or powered — plainly distinct from the gentle idle. The gate \
lifts and lowers as one solid piece within the frame and the wheel turns with every \
paddle staying attached, and the frame and weir stay planted throughout."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-region"
title = "A contiguous verdigris accent"
text = """
The sluice gate frame — and only it — is sculpted in the accent color `#2f7d72`, as one \
clean, unbroken run and clearly visible from more than one angle. That color appears \
NOWHERE else on the model — not one stray voxel, highlight, or seam. The game finds every \
voxel of it and repaints it unconditionally when the model loads, so a scattered, broken, \
or misplaced accent region breaks the recolor outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Holdfast palette discipline"
text = """
Uses only the brief's four colors — brass plating, brass dark, iron mechanisms, and the \
verdigris accent — with no out-of-palette colors, and in particular NO steel `#b8bcc2`, \
NO gold `#ffce54`, and NO white `#dfeaea` anywhere on the model, since a game paints \
those onto Holdfast accent fittings at run time. No stray voxels drift off the model."""
weight = 1
domain = "fidelity"
