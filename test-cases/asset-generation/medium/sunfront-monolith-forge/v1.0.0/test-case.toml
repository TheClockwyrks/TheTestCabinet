slug = "sunfront-monolith-forge"
experimental = true
name = "Sunfront Monolith Forge"
difficulty = "medium"
tags = ["voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Monolith Forge: an opaque-voxel great forge \
whose massive hammer stamps down and back up and whose gear crown turns on their \
own self-playing animations while the tower stays fixed, painted cell by cell with \
the voxel-anim tool. The model invents whatever parts and joints it needs; the \
fixed contract is two self-playing animations it must author — a `hammer_stamp` and \
a `crown_spin` — that the reviewer can watch cycle."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME great forge at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 90
height = 110
depth = 90
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton the forge needs and is judged on whether it works out the right
# pieces, attaches them where they belong, and animates them convincingly. What is
# fixed is the set of NAMED ANIMATIONS the model must author (a game plays them by
# name) and whether each is a game-triggered playable or a self-playing idle. The
# model authors each animation's F-curves at run time with the voxel-anim
# `define-animation`/`add-keyframe` subcommands; `rig.json` is pre-seeded with these
# declarations so the contract exists from the first operation.
[model]

# `hammer_stamp` — the STAMP. A self-playing idle that pounds the great hammer
# straight down deep into the forge's throat and back up to rest, on its own, so the
# forge works without a caller. It should land with weight — an eased drop, not a
# weightless linear slide.
[[model.animation]]
name = "hammer_stamp"
loop = true
auto_play = true

# `crown_spin` — the CROWN TURN. A self-playing idle that turns the toothed gear
# crown atop the forge one full, steady revolution about its vertical axis,
# continuously and seamlessly, on its own.
[[model.animation]]
name = "crown_spin"
loop = true
auto_play = true

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected size
# (`{{voxel.width}}`×`{{voxel.height}}`×`{{voxel.depth}}`). The seeded dest drops the
# `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
