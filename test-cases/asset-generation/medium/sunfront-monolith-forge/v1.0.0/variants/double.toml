# The double-size variant: the same great forge sculpted in a volume with each extent
# doubled from the case's base 90x110x90. Its `[voxel]` OVERRIDES the case volume for
# runs of this variant, and the brief is rendered at these dimensions.
slug = "double"
name = "Double Size"

[voxel]
width = 180
height = 220
depth = 180
background = "transparent"
