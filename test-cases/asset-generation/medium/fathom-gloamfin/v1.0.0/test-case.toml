slug = "gloamfin"
experimental = true
name = "Fathom Gloamfin"
difficulty = "medium"
tags = ["sprite-sheet", "enemy"]
summary = """
Draw the Fathom Gloamfin: the Listener, an eyeless deep-sea predator that hunts by \
sound, as a 32x32 four-direction swim sprite sheet — eight frames carrying its \
eyeless violet silhouette, produced one drawing operation at a time. The sonar \
pulse it emits is drawn by the game itself, not part of this sheet."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — eight separate 32x32 frames, a two-frame swim
# cycle in each of the four directions — and the named sequences a reviewer
# plays back. The sonar pulse is NOT on this sheet: it floods outward through
# the corridors, far larger than the creature, and the game draws it itself in
# code; here the creature only carries a faint sonar cue at the head.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "walk-down"
name = "Swim — down"
frames = [0, 1]
fps = 4

[[sheet.sequence]]
slug = "walk-up"
name = "Swim — up"
frames = [2, 3]
fps = 4

[[sheet.sequence]]
slug = "walk-left"
name = "Swim — left"
frames = [4, 5]
fps = 4

[[sheet.sequence]]
slug = "walk-right"
name = "Swim — right"
frames = [6, 7]
fps = 4

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Gloamfin target — its eyeless \
silhouette, the cold violet palette, and the four readable swim directions that \
mark it as the predator that hunts by sound."""

[[review_item]]
id = "eyeless"
title = "Eyeless head"
text = """
Every frame's creature has no eyes at all — a smooth, blunt head reading clearly \
as a predator that navigates without sight. A drawn eye is a failure for this \
case."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "four-directions"
title = "Four readable directions"
text = """
The movement frames read as the creature swimming in four distinct directions — \
down, up, left, and right — each with its blunt head leading its direction of \
travel and a forked tail trailing behind, not the same blob repeated."""
sequences = ["walk-down", "walk-up", "walk-left", "walk-right"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Cold violet palette"
text = """
Uses the Listener's cold palette from the brief (violet body, lighter violet \
underside, dark outline, pale sonar accent) with no out-of-palette colors and no \
halo of stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each creature fills most of its own 32x32 frame cell, centered with a small \
margin, neither tiny in a corner nor spilling across the grid lines into the \
neighboring frame."""
weight = 1
domain = "fidelity"
