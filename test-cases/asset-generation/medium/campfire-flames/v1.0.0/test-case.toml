slug = "campfire-flames"
experimental = false
name = "Campfire Flames"
difficulty = "medium"
tags = ["vfx", "particle", "3d", "fire"]
summary = """
Author a cozy, seamlessly looping campfire: licking flame tongues that rise and \
flicker — yellow-white at the base, cooling to orange then red at the tips — with \
small embers popping upward on the turbulence and a faint smoke wisp curling above, \
as a steady-state particle-3d emitter system, built one recorded operation at a \
time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"

# A 3D particle effect: a warm, cozy campfire the model authors as an emitter
# SYSTEM, simulated live by the review UI. It is a STEADY-STATE loop — the fire is
# already lit and keeps burning; the effect plays forever without a start or an end,
# so it must loop seamlessly with no burst-and-die.
asset_kind = "particle-3d"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The volume the effect plays in. particle-3d gives width/height/depth (a volume,
# like [voxel]); the fire burns UPWARD along +y from a small hearth footprint near
# the floor. duration_ms is the loop window; loop = true, so the tail of the window
# flows continuously back into its head with no visible seam.
[particle]
width       = 32             # extent along x — across the fire bed
height      = 32             # extent along y — up; flames rise toward +y
depth       = 32             # extent along z — across the fire bed
duration_ms = 2000           # the seamless loop window (steady-state fire)
fps         = 60             # preview/playback frame rate
loop        = true           # LOOPING — a fire already burning, no start or end
background  = "transparent"  # preview clear color only

# The particle tool. `particle-3d` is the only way to shape the effect; it records
# every operation to the action log and, on `render`, simulates the system and
# emits system.json. Run `particle-3d --help` for the operations; none are seeded.
[tool]
binary  = "particle-3d"
preview = "effect.gif"

# The recorded operation log — the authoritative output. Core emits the authored
# system.json (the emitter/force/curve definition) automatically; it is not
# declared here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "read"
name = "Effect read"
description = """
How clearly the simulated effect reads as a cozy campfire — licking flame tongues \
that are yellow-white at the base and cool to orange then red at the tips, small \
embers riding the heat upward, and a thin smoke wisp curling above — in the warm \
firelight palette, from multiple orbit angles and across replays."""

[[domain]]
id = "motion"
name = "Motion & timing"
description = """
How well the effect plays as a steady-state fire: flames rising and flickering with \
organic, gentle motion, embers drifting on turbulence, and smoke curling upward — \
all looping seamlessly over duration_ms with no visible seam, no burst-and-die, and \
reading the same across replays."""

[[review_item]]
id = "reads-as-campfire"
title = "Reads as a cozy campfire"
text = """
The effect reads at a glance as a small campfire burning: flame tongues licking \
upward off a low hearth, warm firelight, embers riding the heat, and a faint smoke \
wisp above — not a torch, an explosion, a bonfire filling the whole volume, or an \
abstract blob of orange. It is legible as a campfire from multiple orbit angles."""
weight = 3
domain = "read"

[[review_item]]
id = "distinct-layers"
title = "Flames, embers, and a smoke wisp"
text = """
All three authored layers are present and distinct: the licking flame tongues at \
the base; small embers that pop upward and drift; and a thin, faint smoke wisp \
curling above the flames. Each is its own emitter, not one undifferentiated glow — \
the embers and smoke read as separate from the body of the fire."""
weight = 2
domain = "read"

[[review_item]]
id = "seamless-loop"
title = "Seamless steady-state loop"
text = """
Plays as a fire that is already lit and keeps burning: it loops seamlessly over \
duration_ms with no visible seam, no fade-in or fade-out, and no burst-and-die — the \
end of the window flows continuously back into its start. There is no empty first \
frame and no dying-out at the end; the fire is in steady state throughout, and reads \
the same across replays despite the live simulation varying slightly."""
weight = 3
domain = "motion"

[[review_item]]
id = "organic-motion"
title = "Organic rising, flicker & turbulence"
text = """
The motion is organic and gentle, not mechanical: flame tongues rise and flicker \
and lick rather than shooting straight up in rigid columns; embers ride the heat \
upward and drift on a little turbulence rather than tracking identical paths; and \
the smoke curls and thins as hot gas would. Nothing snaps, teleports, or moves in \
lockstep."""
weight = 2
domain = "motion"

[[review_item]]
id = "color-over-life"
title = "Heat gradient & warm palette"
text = """
Each flame particle runs the heat gradient over its life — brightest yellow-white \
at the base, cooling to orange then deep red at the tips before it fades — and the \
whole effect stays in the warm firelight palette (no blues, greens, or purples in \
the flames). Embers glow warm and dim as they cool; the smoke stays a faint grey. \
Sizes and opacities ease rather than snap."""
weight = 2
domain = "read"
