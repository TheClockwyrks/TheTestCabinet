slug = "siege-rifle"
experimental = true
name = "Siege Warden Rifle"
difficulty = "medium"
tags = ["asset-generation", "3d", "blender", "prop", "static", "hard-surface"]
summary = """
Model the Warden service rifle — the weapon a Siege rifleman carries — as a STATIC \
hard-surface prop, by driving HEADLESS BLENDER through its Python API. The model writes a \
`build.py` (a `bpy` script) that builds ONE clean rifle mesh (receiver, barrel, handguard, \
stock, magazine, sight) in the Warden palette, then runs `tcab-blend` to export a standard \
native `model.glb` (an UNRIGGED glTF 2.0 — no armature, no animations). The emitted glTF is \
judged — rendered in the browser — and the script is re-run for provenance."""
description = "description.md"
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
# The first STATIC Blender-authored asset kind: a hard-surface PROP authored by driving
# headless Blender through a `build.py` script (NOT a constrained op-log tool). The
# authoritative output is the emitted `model.glb` (a native, UNRIGGED glTF 2.0 — no skin,
# no animations), rendered in-browser and judged; `build.py` is the recorded authoring
# trace, re-run for provenance. A prop declares NO `[model]` table (it is static). See
# /testing/asset-generation/blender-binaries/.
asset_kind = "blender-prop"

# Variants: exactly one runs per run, and its slug is recorded in the run record. The
# flagship ships a single `base` variant. This list is a root key, so it must precede the
# first table header.
variants = ["variants/base.toml"]

# The rifle's BOUNDING BOX — the volume the whole weapon must fit within, in world units
# (`width` across, `height` top-to-bottom, `depth` front-to-back — the barrel runs along
# depth). The prop is authored in Blender-native space (+Z up, muzzle facing -Y) and the
# bundled export converts it to the family's +Y-up/+Z-forward glTF. This is the `[voxel]`
# table reused as a bounds box (a Blender prop is a real mesh, not a voxel field).
# `background` is only the clear color behind the rendered preview PNG. A blender-prop case
# must NOT declare [canvas].
[voxel]
width = 8
height = 16
depth = 48
background = "transparent"

# The authoring tool. `tcab-blend` is the runner that executes the model's `build.py`
# under headless Blender (`blender --background --python build.py -- blender.config.json`),
# emits `model.glb`, and renders the preview. It is the ONLY sanctioned build path;
# anything produced outside it is discarded. Run `tcab-blend --help` for its usage; the
# Blender Python API (`bpy`) is the authoring surface. `preview` is a SINGLE file — a
# Blender prop is one asset, so no `{part}` token.
[tool]
binary = "tcab-blend"
preview = "model.png"

# The authored `build.py` IS the recorded output/trace (there is NO operation log): the
# validator re-runs it through `tcab-blend` for provenance and compares the re-exported
# glTF to the run's. The emitted `model.glb` (the native, unrigged geometry) is emitted by
# the runner and is NOT declared here — core provides its path.
[output]
actions = "build.py"

# NOTE: a blender-prop case declares NO `[model]` table. The prop is STATIC — there is no
# rig and no animation to require. The whole contract is the bounding box, the tool, the
# output, and the brief.

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""

# The self-contained brief, seeded for the run (dest defaults to source).
[[spec]]
source = "specs/brief.md"

# The `build.py` STARTER STUB, seeded to the run workspace ROOT as `build.py` (the path
# `[output].actions` names) so the model edits it in place and `tcab-blend` runs it.
# `kind = "script"` marks it an executable starter (not a prose spec), so the Inputs
# surfaces tag it "Script" rather than "Spec".
[[spec]]
source = "specs/build.py"
dest = "build.py"
kind = "script"
