slug = "explosion-sheet"
experimental = false
name = "Explosion Animation"
difficulty = "medium"
tags = ["sprite-sheet", "2d", "animation", "vfx"]
summary = """
Draw a classic hand-drawn cartoon explosion as a 48x48 seven-frame sprite sheet \
that plays once: an ignition spark blooms into a white-hot flash, an expanding \
orange fireball with jagged flame tongues, a smoke-and-debris peak, then grey \
smoke thinning to nearly empty — hot-to-cool frame to frame, produced one drawing \
operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 48x48 transparent canvas (a separate file) — one stage of
# the blast, centered in the frame. Fixing the size keeps every run comparable.
[canvas]
width = 48
height = 48
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — seven separate 48x48 stages of the explosion — and
# the single sequence a reviewer plays back as the one-shot boom.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.sequence]]
slug = "explode"
name = "Explode"
frames = [0, 1, 2, 3, 4, 5, 6]
fps = 15

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

# The single scoring domain. A produced asset is judged as a WHOLE against its
# brief — too subjective to break into pass/fail checklist items — so an
# asset-generation case declares this one domain and no `[[review_item]]`s: the
# reviewer's single rating here is the run's overall rating.
[[domain]]
id = "overall"
name = "Overall"
description = """
How good the produced asset is overall — judged as a whole against the brief: \
how well it reads, how well it is made, and how faithfully it matches what was \
asked for."""
