slug = "caldera-scald"
experimental = true
name = "Caldera Scald"
difficulty = "medium"
tags = ["voxel", "rig", "tower"]
summary = """
Sculpt and rig the Caldera Scald: the field tower of the Holdfast — a low, round, \
bulbous brass pressure drum ringed by a circle of short radial iron nozzle cowls \
pointing outward in every direction, like a steam manifold, with no barrel at all, \
that holds pressure on its own and vents a sustained steam field on demand while the \
base stays fixed — painted cell by cell with the `voxel-anim` tool, one recorded \
operation at a time. The model invents whatever parts and joints it needs; the fixed \
contract is two animations it must author — a self-playing `idle` and a triggered \
`emit` — plus a contiguous verdigris accent ring the game recolors to show the tower's \
upgrade level."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Scald at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Scald's real size at the roster's shared scale — it is a LOW, ROUND
# emplacement, and the volume's low, near-square proportions carry that before a single
# voxel is placed. Each part is sculpted separately in this shared volume's
# coordinates. The volume always starts EMPTY; `background` is only the clear color
# behind the rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 36
height = 40
depth = 36
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the Scald's game events.
[model]

# `idle` — the self-playing hold. A self-playing idle that loops on its own: the pressure
# drum swells and contracts slightly as it holds pressure and the nozzle cowls flex, so
# the tower reads as live even when it is not emitting. The base stays fixed.
[[model.animation]]
name = "idle"
loop = true
auto_play = true

# `emit` — the vent (NOT named `fire`). A game-triggered playable that loops: the nozzle
# cowls open and the drum pumps continuously, venting its steam-jet field in a sustained,
# cycling emission — a continuous field, never discrete shots. The base stays fixed.
[[model.animation]]
name = "emit"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera Scald and poses \
correctly — the low, round, bulbous brass pressure drum ringed by a circle of short \
radial iron nozzle cowls with no barrel at all, carrying one contiguous verdigris accent \
ring, whose drum holds pressure on its own and vents a sustained steam field while the \
base stays fixed, in the disciplined Holdfast palette."""

[[review_item]]
id = "reads-as-scald"
title = "Reads as the Scald"
text = """
From more than one angle the model reads unmistakably as the Scald: a LOW, ROUND, bulbous \
brass pressure drum founded on the ground, ringed by a circle of SHORT RADIAL IRON NOZZLE \
COWLS pointing outward in every direction, like a steam manifold — and it has NO BARREL AT \
ALL. No barrel and a ring of nozzles is the whole tell: it projects a field, it does not \
shoot. It is not slim, squat, or towering, and carries no barrel of any kind — no drum of \
short barrels, fat upward tub, or long horizontal rail. It is brass-and-iron machinery — a \
static emplacement, not a creature."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "idle-reads"
title = "Idle holds pressure on its own"
text = """
Playing `idle` swells and contracts the pressure drum slightly as it holds pressure and flexes \
the nozzle cowls, on its own with no caller, so the tower reads as live and powered even when \
it is not emitting. It loops seamlessly with an eased, deliberate cadence rather than a \
mechanical linear slide. Only the drum and cowls move — the ground base stays fixed, never \
carried along — and the cowls stay attached to their ring."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "emit-reads"
title = "Emit vents a sustained field"
text = """
Playing `emit` opens the nozzle cowls and pumps the drum continuously, venting a sustained, \
cycling emission that reads as a continuous steam-jet field rather than discrete shots — it \
never fires a single projectile. The cowls flex open as one with the ring and stay attached \
throughout, and the ground base stays fixed."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-ring"
title = "A contiguous verdigris accent ring"
text = """
The ring of nozzle cowls is sculpted as ONE CONTIGUOUS ring in the accent color `#2f7d72`, and \
clearly visible from more than one angle. That color appears NOWHERE else on the model — not \
one stray voxel, highlight, or seam. The game finds every voxel of it and repaints it to show \
the tower's upgrade level, so a scattered, broken, or misplaced accent region breaks the \
upgrade system outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Holdfast palette discipline"
text = """
Uses only the brief's four colors — brass plating, brass dark, iron mechanisms, and the \
verdigris accent — with no out-of-palette colors, and in particular NO steel `#b8bcc2`, NO \
gold `#ffce54`, and NO white `#dfeaea` anywhere on the model, since a game paints those \
onto the accent ring at run time to show the upgrade level. No stray voxels drift off the \
model."""
weight = 1
domain = "fidelity"
