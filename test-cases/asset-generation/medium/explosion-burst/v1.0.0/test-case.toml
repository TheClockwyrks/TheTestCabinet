slug = "explosion-burst"
experimental = false
name = "Explosion Burst"
difficulty = "medium"
tags = ["vfx", "particle", "3d", "explosion"]
summary = """
Author a generic action-game explosion: an overexposed white flash core, a \
fast-expanding orange fireball that cools to smoke, a radial burst of hot-orange \
spark streaks stretched along velocity, and a lingering dark smoke puff that rises \
and fades — as a one-shot particle-3d emitter system the game plays once per \
detonation, built one recorded operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"

# A 3D particle effect: a generic explosion the model authors as an emitter SYSTEM,
# simulated live by the review UI and the game. It is a ONE-SHOT burst — the game
# spawns a fresh instance each time something detonates, so the effect fires hard at
# the start and decays cleanly to empty.
asset_kind = "particle-3d"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The volume the effect plays in. particle-3d gives width/height/depth (a cubic
# volume, like [voxel]); the explosion detonates at the CENTER and throws particles
# radially outward in every direction. duration_ms is one burst's length; loop =
# false, so the effect fires at the start and decays cleanly to empty. The game
# replays it once per detonation.
[particle]
width       = 48             # extent along x
height      = 48             # extent along y — up
depth       = 48             # extent along z
duration_ms = 900            # one burst: fires at the start and decays to empty
fps         = 60             # preview/playback frame rate
loop        = false          # ONE-SHOT — a single detonation; the game replays it per hit
background  = "transparent"  # preview clear color only

# The particle tool. `particle-3d` is the only way to shape the effect; it records
# every operation to the action log and, on `render`, simulates the system and
# emits system.json. Run `particle-3d --help` for the operations; none are seeded.
[tool]
binary  = "particle-3d"
preview = "effect.gif"

# The recorded operation log — the authoritative output. Core emits the authored
# system.json (the emitter/force/curve definition) automatically; it is not
# declared here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "read"
name = "Effect read"
description = """
How clearly the simulated effect reads as a generic action-game explosion — an \
overexposed white flash core, a fast-expanding orange fireball cooling to smoke, a \
radial burst of hot-orange spark streaks, and a lingering dark smoke puff — in the \
declared warm fire palette, from multiple orbit angles and across replays."""

[[domain]]
id = "motion"
name = "Motion & timing"
description = """
How well the effect plays as a one-shot detonation — a hard burst at the start, a \
fireball and sparks thrown radially outward and slowing under drag and gravity, \
smoke rising off the top, and a clean decay to empty by the end of duration_ms, \
reading the same across replays so it holds up when the game plays it once per hit."""

[[review_item]]
id = "reads-as-explosion"
title = "Reads as an explosion"
text = """
The effect reads at a glance as an explosion going off: a blinding flash, an \
expanding ball of fire, sparks thrown out in every direction, and smoke left behind \
— not a muzzle flash, a directional jet, a small spark, or a steady fire. It is \
legible as a single, sharp detonation from multiple orbit angles."""
weight = 3
domain = "read"

[[review_item]]
id = "distinct-layers"
title = "Flash, fireball, sparks & smoke, cooling to smoke"
text = """
All four authored layers are present and distinct: an instantaneous, overexposed \
white flash core; a fast-expanding fireball that cools from hot orange toward dark \
smoke as it grows; a radial burst of small hot-orange spark streaks; and a lingering \
dark smoke puff. Each is a distinct emitter, not one undifferentiated blob, and the \
fireball visibly cools rather than simply vanishing."""
weight = 2
domain = "read"

[[review_item]]
id = "one-shot-decay"
title = "One-shot burst that decays to empty"
text = """
Plays as a single one-shot detonation: it fires hard at the start and decays cleanly \
to empty by the end of duration_ms, with no steady-state loop or continuous stream \
(the game supplies any repetition by spawning a fresh instance per hit). It reads the \
same across replays despite the live simulation varying slightly."""
weight = 3
domain = "motion"

[[review_item]]
id = "radial-outward-motion"
title = "Radial outward motion & velocity-stretched sparks"
text = """
The fireball and sparks expand radially outward from the center in every direction \
(a spherical burst, not a forward cone or jet). Sparks are stretched along their \
velocity into short streaks, slow under drag, and droop under a light gravity as they \
die; the smoke puff rises off the top under buoyancy. Nothing shoots off in a \
straight line forever or floats unnaturally."""
weight = 2
domain = "motion"

[[review_item]]
id = "curves-and-palette"
title = "Color, opacity & size over life in the fire palette"
text = """
Each particle's look eases over its life as the brief describes: the flash runs \
overexposed white to hot yellow and fades fast; the fireball swells and cools hot \
yellow → orange → dark smoke as its opacity fades; sparks are hot orange fading to \
deep ember, shrinking as they die; the smoke rises, grows, eases up in opacity then \
fades all the way out. It uses only the declared warm fire hues — flash white, hot \
yellow, orange, spark, ember, smoke grey — with no out-of-palette colors (no blues, \
greens, or purples)."""
weight = 2
domain = "read"
