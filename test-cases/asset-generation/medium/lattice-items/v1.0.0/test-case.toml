slug = "lattice-items"
name = "Lattice Items"
difficulty = "medium"
tags = ["sprite-sheet", "item"]
summary = """
Draw the Lattice item icon set — the seven factory items that ride the belts \
(iron/copper ore, iron/copper plate, an iron gear wheel, a coil of copper cable, \
and an electronic circuit) — as a 32x32 sprite sheet, one item per frame, \
produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file). Belt items are
# sub-tile in the world (roughly half a tile at 32 px/tile), but each icon is
# authored at a full 32x32 so there is enough resolution to read small items like
# the gear; fixing the frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x32 file holding one item icon —
# and the single showcase sequence a reviewer flips through.
#
# The frame order is NOT arbitrary: it mirrors the simulation's canonical item
# table (`lattice_core::prototypes::ITEMS`) one for one, so frame N is the icon for
# item index N — 0 iron-ore, 1 iron-plate, 2 iron-gear, 3 copper-ore,
# 4 copper-plate, 5 copper-cable, 6 circuit. That correspondence is what lets the
# browser playback renderer pick an icon straight from the item index in a belt's
# canonical state, with no lookup table to drift. Reordering these frames, or
# adding an icon for something the engine does not carry, breaks that.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

# A slow cycle through all seven icons so a reviewer can flip through the whole
# set in order. The frames are seven distinct static items, not an animation — the
# sequence exists only so the set can be judged as a whole in the review UI.
[[sheet.sequence]]
slug = "showcase"
name = "Item showcase"
frames = [0, 1, 2, 3, 4, 5, 6]
fps = 3

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated sheet realizes the seven Lattice item icons — \
each frame unmistakable as its named item at 32x32, the seven mutually \
distinguishable, and a consistent outline, lighting, and palette discipline \
binding the set into one cohesive icon family."""

[[review_item]]
id = "named-item-reads"
title = "Each frame reads as its named item"
text = """
At 32x32 each frame is instantly recognizable as the item the brief assigns it — \
frame 0 a cluster of iron ore, 1 a flat iron plate, 2 a toothed iron gear wheel \
with a central hole, 3 copper ore, 4 a copper plate, 5 a loose coil of copper \
cable, 6 a green electronic circuit board with traces and contacts — by \
silhouette and color alone, with no surrounding context. The frames are in the \
brief's fixed order, not reordered."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "mutually-distinguishable"
title = "The seven are mutually distinguishable"
text = """
No two icons read alike. The rough lumpy ores (frames 0 and 3) are clearly \
distinct from the smooth flat plates (frames 1 and 4), and both from the toothed \
gear ring (frame 2), the stringy cable coil (frame 5), and the green circuit \
board (frame 6), so a reviewer flipping the showcase never mistakes one item for \
another."""
sequences = ["showcase"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "iron-copper-told-apart"
title = "Iron and copper told apart by tone"
text = """
The two ores share one lumpy-cluster silhouette and the two plates share one \
flat-plate silhouette, so within each pair the metal is carried entirely by \
color: neutral blue-grey iron (frames 0 and 1) against warm orange copper \
(frames 3 and 4), the copper ore further marked by its teal-green flecks."""
frames = [0, 1, 3, 4]
weight = 1
domain = "fidelity"

[[review_item]]
id = "cable-reads-as-wire"
title = "Copper cable reads as wire, not as a plate"
text = """
The copper cable (frame 5) shares the copper plate's exact tones, so shape alone \
separates them: it must read as thin looping strands with visible gaps between \
them, NOT as a solid mass or a smaller copper plate. Getting this wrong makes two \
of the seven icons indistinguishable."""
frames = [4, 5]
weight = 2
domain = "fidelity"

[[review_item]]
id = "consistent-family"
title = "Consistent outline and lighting"
text = """
Every icon carries the same dark outline color and the same simple top-left \
light direction (highlight up-left, shadow down-right), so the seven read as one \
cohesive icon family rather than seven unrelated drawings."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette-discipline"
title = "Per-icon palette adherence"
text = """
Each icon uses only the colors the brief assigns it (plus the shared outline), \
with no off-palette colors and no anti-aliased or stray-pixel fringe around the \
silhouette — the drawing is regenerated pixel-for-pixel, so a halo of in-between \
colors counts against it."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "centred-margin"
title = "Centred with a small margin"
text = """
Each icon is centred in its own 32x32 frame with roughly a two-pixel margin — \
filling most of the frame, neither tiny in a corner nor clipped at the edge."""
weight = 1
domain = "fidelity"
