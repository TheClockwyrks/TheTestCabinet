slug = "caldera-boiler"
experimental = true
name = "Caldera Boiler"
difficulty = "medium"
tags = ["voxel", "rig", "building"]
summary = """
Sculpt and rig the Caldera Boiler: the Holdfast's steam plant — a tall riveted brass \
pressure vessel on short legs straddling a geothermal vent, capped by a tall iron \
chimney stack, with a bank of pistons down one flank, that takes water in and boils \
it into steam — painted cell by cell with the `voxel-anim` tool, one recorded \
operation at a time. The model invents whatever parts and joints it needs; the fixed \
contract is two animations it must author — a barely-moving self-playing `idle` and a \
hard-working `boil` — plus a contiguous verdigris accent the game recolors."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Boiler at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Boiler's real size at the roster's shared scale — it is a TALL, upright
# vessel-and-chimney, and the volume's tall, narrow proportions carry that before a
# single voxel is placed. Each part is sculpted separately in this shared volume's
# coordinates. The volume always starts EMPTY; `background` is only the clear color
# behind the rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 34
height = 44
depth = 34
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the Boiler's game events.
[model]

# `idle` — banked, not working. A self-playing idle that loops on its own: the vessel
# ticks and the pistons rest, barely moving, so the Boiler reads as banked but not
# producing. The legs, vessel body, and chimney stay fixed.
[[model.animation]]
name = "idle"
loop = true
auto_play = true

# `boil` — active production. A game-triggered playable that loops: the pistons pump
# hard down the flank, the vessel shudders, and the chimney works. Played only while
# the Boiler is actually fed water, so it must read unmistakably as ACTIVE PRODUCTION,
# distinct from the idle.
[[model.animation]]
name = "boil"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera Boiler and poses \
correctly — the tall riveted brass pressure vessel on short legs straddling a vent, \
capped by a tall iron chimney with a bank of pistons down one flank, carrying one \
contiguous verdigris accent, whose idle barely stirs while banked and whose boil pumps \
its pistons hard as active production, in the disciplined Holdfast palette."""

[[review_item]]
id = "reads-as-boiler"
title = "Reads as the Boiler"
text = """
From more than one angle the model reads unmistakably as the Boiler: a TALL RIVETED \
BRASS PRESSURE VESSEL on short legs that STRADDLE a geothermal vent beneath it, capped \
by a TALL IRON CHIMNEY STACK, with a bank of pistons down one flank. The vessel and \
chimney straddling a vent is the whole tell. It reads as brass-and-iron machinery — a \
static steam plant founded on the ground, not a creature."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "idle-reads"
title = "Idle barely stirs while banked"
text = """
Playing `idle` ticks the vessel and rests the pistons, barely moving, so the Boiler \
reads as banked but not working — a plant on standby, not producing. It cycles on its \
own with no caller and loops seamlessly with an eased, deliberate cadence. Only the \
small ticking motion plays — the legs, the vessel body, and the chimney stay planted, \
never carried along."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "boil-reads"
title = "Boil works hard as active production"
text = """
Playing `boil` pumps the bank of pistons hard down the flank, shudders the vessel, and \
works the chimney, reading unmistakably as ACTIVE PRODUCTION — plainly distinct from the \
barely-moving idle, so a viewer can tell a working Boiler from a banked one at a glance. \
Each piston travels as one solid piece and stays attached to the vessel, and the short \
legs stay planted straddling the vent throughout."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-region"
title = "A contiguous verdigris accent"
text = """
The riveted bands ringing the pressure vessel — and only those — are sculpted in the \
accent color `#2f7d72`, each a clean, unbroken run and clearly visible from more than \
one angle. That color appears NOWHERE else on the model — not one stray voxel, highlight, \
or seam. The game finds every voxel of it and repaints it unconditionally when the model \
loads, so a scattered, broken, or misplaced accent region breaks the recolor outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Holdfast palette discipline"
text = """
Uses only the brief's four colors — brass plating, brass dark, iron mechanisms, and the \
verdigris accent — with no out-of-palette colors, and in particular NO steel `#b8bcc2`, \
NO gold `#ffce54`, and NO white `#dfeaea` anywhere on the model, since a game paints \
those onto Holdfast accent fittings at run time. No stray voxels drift off the model."""
weight = 1
domain = "fidelity"
