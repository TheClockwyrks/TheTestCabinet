slug = "spectra-flux"
experimental = true
name = "Spectra Flux"
difficulty = "medium"
tags = ["sprite", "enemy"]
summary = """
Draw the Spectra Flux: the oscillating-band drone for a two-band formation \
shooter, caught mid-shimmer showing both bands, as a 64x64 enemy sprite produced \
one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

[canvas]
width = 64
height = 64
background = "transparent"

[tool]
binary = "draw"
preview = "canvas.png"

[output]
actions = "actions.json"

[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sprite matches the Spectra Flux target — a drone \
caught mid-shimmer showing BOTH bands at once (cyan and magenta, both glyphs), the \
identity of the band-flipping enemy, in the neon Spectra palette."""

[[review_item]]
id = "dual-band"
title = "Both bands at once"
text = """
The drone shows BOTH spectral bands at the same time — cyan and magenta, split \
across its body — because the Flux is caught mid-shimmer between flips. A \
single-band drone is the wrong creature for this case."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "both-glyphs"
title = "Both band glyphs"
text = """
Both band motifs are present and centered — the cyan RING glyph and the magenta \
DIAMOND glyph overlaid — so the dual-band identity reads by shape as well as \
color (the colorblind-safe convention the game uses)."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "oscillation-read"
title = "Reads as a flickering drone"
text = """
The sprite reads as a single drone unsettled between two bands (a shimmer), not as \
two separate objects or a flat two-tone shape. White shimmer flecks sell the \
flicker."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Spectra palette"
text = """
Uses only the Spectra colors from the brief (cyan band, magenta band, white rim \
and highlights) with no out-of-palette colors and no halo of stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Canvas framing"
text = """
The drone fills most of the 64x64 frame, roughly centered with a small margin, \
neither tiny in a corner nor clipped at an edge."""
weight = 1
domain = "fidelity"
