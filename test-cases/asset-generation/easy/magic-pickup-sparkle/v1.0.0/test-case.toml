slug = "magic-pickup-sparkle"
experimental = false
name = "Magic Pickup Sparkle"
difficulty = "easy"
tags = ["vfx", "particle", "2d", "magic"]
summary = """
Author a Magic Pickup Sparkle: a small looping collectible marker VFX — a soft \
pulsing cyan glow at the center, white four-point star sparkles that twinkle in \
and out around it, and a few slow rising violet motes — as a 64x64 particle-2d \
effect simulated live from an authored emitter system that loops seamlessly."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"

# A 2D (planar, screen-space) particle effect: a looping collectible-pickup marker
# the review UI and a game simulate live from the authored emitter system.
asset_kind = "particle-2d"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case ships a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The 2D field the effect plays in. particle-2d is planar — width/height only, no
# depth. duration_ms/fps/loop fix the playback; `background` is the preview's clear
# color only (the effect is composited over the game's field at play time).
[particle]
width       = 64             # extent along x, in pixels (required)
height      = 64             # extent along y — up — in pixels (required)
duration_ms = 1000           # a one-second loop cycle (required)
fps         = 60             # preview/playback frame rate (required, > 0)
loop        = true           # loops: the last frame flows back into the first
background  = "transparent"  # preview clear color only

# The particle tool. `particle-2d` is the only way to shape the effect; it records
# every operation and, on `render`, simulates the system and writes the preview GIF.
# Run `particle-2d --help` for the operations; no operations schema is seeded.
[tool]
binary  = "particle-2d"
preview = "effect.gif"

# The recorded op log — the authoritative output. Core emits the authored
# system.json (emitters/forces/curves) automatically; it is not declared here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id   = "read"
name = "Effect read"
description = """
How well the simulated effect reads as an enchanting collectible-pickup marker — \
its soft pulsing central glow, the twinkling four-point star sparkles around it, \
and the slow rising motes, in the cool magical palette, readable at small size."""

[[domain]]
id   = "motion"
name = "Motion & loop"
description = """
How well the effect is paced over its one-second cycle — a gentle pulse, sparkles \
twinkling in and out, motes drifting up — and how cleanly it loops seamlessly, \
reading the same across live replays."""

[[review_item]]
id     = "reads-as-pickup-sparkle"
title  = "Reads as a magic pickup sparkle"
text   = """
The effect reads at a glance as an enchanting, gentle marker over a collectible \
item: a soft glowing point that twinkles and shimmers, inviting the eye — not a \
harsh burst, an explosion, or a formless blob. It stays legible and appealing at \
small size."""
weight = 3
domain = "read"

[[review_item]]
id     = "three-elements"
title  = "Glow, star sparkles, and motes all present"
text   = """
All three distinct elements are legible in the simulated effect: the soft pulsing \
central glow, the small white four-point star sparkles that twinkle in and out at \
varying positions around it, and the few slow rising motes drifting upward."""
weight = 2
domain = "read"

[[review_item]]
id     = "palette"
title  = "Cool magical palette"
text   = """
Uses only the cool magical colors from the brief — soft cyan glow, white sparkle \
cores, gold star accents, and a hint of violet — reading as gentle enchantment. No \
out-of-palette hues, no harsh or muddy tones."""
weight = 1
domain = "read"

[[review_item]]
id     = "seamless-loop"
title  = "Loops seamlessly with a gentle pulse"
text   = """
The one-second cycle loops seamlessly — the last frame flows back into the first \
with no pop, jump, or empty gap. The central glow pulses softly and the sparkles \
twinkle in and out continuously, so the marker reads as always alive and never \
resetting visibly."""
weight = 3
domain = "motion"

[[review_item]]
id     = "reads-across-replays"
title  = "Reads the same across replays"
text   = """
Because the system is simulated live and varies slightly from one play to the next, \
the marker still reads as the same effect on every replay — the sparkles pop in \
different spots but the pulsing glow, the twinkling stars, and the rising motes are \
always the character on show."""
weight = 1
domain = "motion"
