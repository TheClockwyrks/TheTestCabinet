slug = "lattice-source"
name = "Lattice Source"
difficulty = "easy"
tags = ["sprite-sheet", "fixture"]
summary = """
Draw the Lattice source: a top-down test-fixture item emitter for a deterministic \
factory simulation, as six 32x32 frames whose green-lit East aperture pulses as it \
fires — the fixture's own reaction, with no item drawn — in a loop that closes \
seamlessly, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one tile of
# the source fixture at the game's normal tile resolution. Fixing the frame size
# keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x32 file — and the named
# animation sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.sequence]]
slug = "emit"
name = "Source — emitting"
frames = [0, 1, 2, 3, 4, 5]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lattice source — its flat \
top-down test-fixture emitter housing with an East-facing output aperture, the \
green source-accent status indicator, and the emit-pulse animation that brightens \
the indicator and aperture as it fires — the fixture's own reaction, with no item \
drawn — and loops seamlessly."""

[[review_item]]
id = "reads-as-emitter"
title = "Reads as a test-fixture emitter"
text = """
Every frame reads as a piece of top-down measurement equipment — a panel/housing \
with an output aperture/port on its East (right) edge — not as a length of belt or \
a generic factory machine. It must look like a rig that injects items into the \
factory, with the aperture clearly on the East side."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "emit-pulse"
title = "Emit pulse brightens then dims"
text = """
Played in order, the six frames read as the fixture emitting one item: frame 0 is \
idle (aperture dim/closed), then the green indicator and aperture brighten to a \
peak as the fixture fires, then dim back toward idle. The indicator and aperture \
must visibly pulse — a clear brighten-then-dim across the frames, not a flat glow. \
NO item is drawn in the sprite — the pulse is the fixture's own reaction, and the \
renderer draws the actual item being emitted."""
sequences = ["emit"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "no-fixed-item"
title = "No fixed item drawn into the sprite"
text = """
The sprite draws the fixture ONLY — no item is painted into any frame. A fixed \
item baked into the sprite would show the same item in every frame regardless of \
what the source is actually emitting, so a plate or other specific cargo drawn at \
the aperture counts against the sprite. The emitting is conveyed by the fixture's \
brightening aperture and pulsing green indicator, not by a drawn item."""
sequences = ["emit"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "seamless-loop"
title = "Seamless emit loop"
text = """
The six frames form a clean repeating cycle: frame 5 returns to frame 0 with no \
jump or stutter, so playing 0→1→…→5→0 reads as the fixture emitting one item every \
cycle, over and over. The idle state at frame 0 and the dim-down at the end must \
line up so the loop has no visible seam."""
sequences = ["emit"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "green-source-accent"
title = "Green source accent, distinct from a sink"
text = """
The fixture's signature accent is green — a green status indicator and a green-lit \
aperture mark it as a source (input). It must read as visibly distinct from a red \
drain/sink fixture: a reviewer should never mistake this emitter for a consumer, \
and no red accent appears anywhere."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Strict palette adherence"
text = """
Uses only the palette from the brief — the dark outline/shadow, the grey-blue \
housing light/mid/dark tones, and the green source-accent mid/dark/pale tones — \
with no out-of-palette colors and no halo of stray or anti-aliased pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
The housing fills most of the 32x32 frame with a small even margin, centered so it \
neither sits tiny in a corner nor clips at the edges — with the output aperture \
reaching toward the East (right) edge so the renderer's emitted item has room to \
slide out."""
weight = 1
domain = "fidelity"
