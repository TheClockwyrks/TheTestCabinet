slug = "snowfall"
experimental = false
name = "Ambient Snowfall"
difficulty = "easy"
tags = ["vfx", "particle", "2d", "weather"]
summary = """
Author an ambient snowfall weather layer: many soft white flakes of varied sizes \
drifting slowly downward and swaying on a light breeze, smaller flakes falling \
slower for parallax, as a seamlessly looping 128x128 particle-2d effect simulated \
live from an authored emitter system."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"

# A 2D (planar, screen-space) particle effect: an ambient weather layer the review
# UI and a game simulate live from the authored emitter system.
asset_kind = "particle-2d"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case ships a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The 2D field the effect plays in. particle-2d is planar — width/height only, no
# depth. duration_ms/fps/loop fix the playback; `background` is the preview's clear
# color only (the effect is composited over the game's field at play time).
[particle]
width       = 128            # extent along x, in pixels (required)
height      = 128            # extent along y — up — in pixels (required)
duration_ms = 3000           # a 3 s window that loops seamlessly (required)
fps         = 60             # preview/playback frame rate (required, > 0)
loop        = true           # continuous: the field stays populated and repeats
background  = "transparent"  # preview clear color only

# The particle tool. `particle-2d` is the only way to shape the effect; it records
# every operation and, on `render`, simulates the system and writes the preview GIF.
# Run `particle-2d --help` for the operations; no operations schema is seeded.
[tool]
binary  = "particle-2d"
preview = "effect.gif"

# The recorded op log — the authoritative output. Core emits the authored
# system.json (emitters/forces/curves) automatically; it is not declared here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id   = "read"
name = "Effect read"
description = """
How well the simulated effect reads as gentle ambient snowfall — many soft-edged \
white flakes of varied sizes, calm and wintry, in a cool white and pale-blue \
palette."""

[[domain]]
id   = "motion"
name = "Motion & timing"
description = """
How well the snow moves — a slow downward drift with a light side-to-side sway, \
smaller flakes falling slower for parallax — and how cleanly the 3 s window loops \
as a continuous, seamless ambient layer."""

[[review_item]]
id     = "reads-as-snowfall"
title  = "Reads as gentle snowfall"
text   = """
The effect reads at a glance as calm, ambient snowfall: many soft white flakes \
drifting gently downward across the field — not driving rain, not a blizzard or \
storm, not a sparse scatter of a handful of dots."""
weight = 3
domain = "read"

[[review_item]]
id     = "varied-soft-flakes"
title  = "Soft flakes of varied sizes"
text   = """
The flakes are soft-edged and rounded (not hard squares or sharp streaks) and come \
in a range of sizes, with a few flakes slowly twinkling or rotating as they fall so \
the snow feels alive rather than uniform."""
weight = 2
domain = "read"

[[review_item]]
id     = "palette"
title  = "Cool white and pale-blue palette"
text   = """
Uses only the cool wintry colors from the brief — bright white, cool white, and \
pale blue — reading as soft snow against a cool sky. No warm hues, no harsh \
saturated colors, no muddy fill."""
weight = 1
domain = "read"

[[review_item]]
id     = "drift-and-sway"
title  = "Slow drift, sway, and parallax"
text   = """
The flakes fall slowly downward with a light side-to-side sway, as if on a gentle \
breeze rather than straight down; smaller flakes fall slower than larger ones so \
the snow reads with depth and parallax rather than moving as one flat sheet."""
weight = 3
domain = "motion"

[[review_item]]
id     = "seamless-loop"
title  = "Seamless continuous loop"
text   = """
The 3 s window loops as a continuous, seamless ambient layer: the field stays \
evenly populated from start to finish with no build-up at the start or thinning at \
the end, and no visible pop or gap where the loop repeats."""
weight = 2
domain = "motion"
