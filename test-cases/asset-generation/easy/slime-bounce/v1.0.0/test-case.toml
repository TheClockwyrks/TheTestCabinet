slug = "slime-bounce"
experimental = false
name = "Slime Enemy Bounce"
difficulty = "easy"
tags = ["sprite-sheet", "2d", "animation", "enemy"]
summary = """
Draw a cute green slime enemy as a 32x32 six-frame sprite sheet: one squash-and-\
stretch hop loop — squashed wide on the ground, stretching tall as it launches, \
rounded at the apex, stretching as it drops, and squashing on landing — two simple \
eyes riding the body throughout, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one slime
# sized to sit within the cell with room to squash and stretch. Fixing the frame
# size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — six separate 32x32 frames of one hop — and the
# named sequence a reviewer plays back as the bounce loop.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.sequence]]
slug = "bounce"
name = "Bounce"
frames = [0, 1, 2, 3, 4, 5]
fps = 10

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated slime matches the brief — one cute, rounded, \
jelly-like green blob with two simple readable eyes, the same creature in every \
frame, drawn with a soft highlight and a translucent read in the green palette on \
transparency."""

[[domain]]
id = "animation"
name = "Animation"
description = """
How well the six frames read as motion when played back — a convincing squash-\
and-stretch hop that gathers, launches, floats, and lands, and a clean loop that \
returns to its start with no pop or jump."""

[[review_item]]
id = "reads-as-slime"
title = "Reads as a cute green slime"
text = """
The sprite reads at a glance as a cute green slime enemy — a soft, rounded, jelly-\
like blob with two simple readable eyes on its body, a gentle highlight, and a \
translucent gel feel. It is endearing and gooey, not a hard geometric shape, and \
sits within the frame as a little creature with room to squash and stretch."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "squash-and-stretch"
title = "Convincing squash-and-stretch"
text = """
Played back, the six frames read as one springy hop with real squash-and-stretch: \
squashed wide and low on the ground, stretching tall as it launches, rounded at \
the apex, stretching as it drops, and squashing wide again on landing. The volume \
looks conserved — it flattens as it lands and elongates as it moves — so the \
bounce has weight and snap rather than a stiff slide."""
sequences = ["bounce"]
weight = 3
domain = "animation"

[[review_item]]
id = "clean-loop"
title = "Clean bounce loop"
text = """
The sequence loops cleanly: frame 5 leads naturally back into frame 0 so the hop \
repeats forever with no visible pop, jump, or reset. The timing feels even, and \
the slime returns to the same footing each cycle."""
sequences = ["bounce"]
weight = 2
domain = "animation"

[[review_item]]
id = "eyes-stay-on-body"
title = "Eyes ride the body"
text = """
The two eyes stay on the slime and stay readable through every frame — they move \
and deform with the body as it squashes and stretches, keeping the creature \
looking at the viewer, and never detach, vanish, or drift off the blob."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "palette-and-transparency"
title = "Green palette on transparency"
text = """
Uses only the green slime palette from the brief (the body green, pale highlight, \
deep-green shadow, dark eyes, and eye shine) on full transparency — no out-of-\
palette pixels, no anti-aliased fringes, and no opaque background fill; only the \
slime's pixels are opaque so it composites onto any scene."""
weight = 1
domain = "fidelity"
