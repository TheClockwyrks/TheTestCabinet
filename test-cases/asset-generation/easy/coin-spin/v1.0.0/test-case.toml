slug = "coin-spin"
experimental = false
name = "Spinning Coin Pickup"
difficulty = "easy"
tags = ["sprite-sheet", "2d", "animation", "pickup"]
summary = """
Draw a spinning gold coin pickup as a 32x32 six-frame sprite sheet: a valuable \
collectible rotating about its vertical axis — full round face, narrowing ellipse, \
thin edge, widening ellipse, back toward the face — as a seamless loop, with a \
bright glint sweeping across the face, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one small
# coin sized to sit within a grid cell. Fixing the size keeps every run
# comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — six separate 32x32 frames of one turn of the coin —
# and the named sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.sequence]]
slug = "spin"
name = "Spin"
frames = [0, 1, 2, 3, 4, 5]
fps = 12

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "animation"
name = "Animation"
description = """
How well the six frames read as one continuous turn of the coin about its \
vertical axis — full face, narrowing ellipse, thin edge, widening ellipse, back \
toward the face — and how cleanly the sequence loops when played end to end."""

[[domain]]
id = "identity"
name = "Identity"
description = """
How clearly the sprite reads as a single valuable gold coin: a consistent round \
collectible in a warm gold palette with a bright glint sweeping its face, a dark \
rim, and everything else transparent."""

[[review_item]]
id = "reads-as-spinning"
title = "Reads as a spinning coin"
text = """
Played back, the six frames read at a glance as one gold coin turning about its \
vertical (up–down) axis: a full round face, then a narrowing ellipse, a thin \
edge-on sliver, a widening ellipse, and back toward the face. Each frame is a \
little narrower or wider than the last, so the motion reads as a smooth, \
continuous rotation rather than a jump or a flicker."""
sequences = ["spin"]
weight = 3
domain = "animation"

[[review_item]]
id = "clean-loop"
title = "Clean, seamless loop"
text = """
The sequence loops cleanly: the last frame flows back into the first with no \
visible pop, hitch, or repeated pose, so the coin appears to spin forever. The \
ellipse widths are symmetric about the edge-on frame, and the face never \
suddenly flips its shading or width between the loop's end and its start."""
sequences = ["spin"]
weight = 2
domain = "animation"

[[review_item]]
id = "valuable-gold-coin"
title = "Reads as a valuable gold coin"
text = """
The face frames read as a round gold coin — a warm gold disc with a darker gold \
rim outline and a hint of an inner face or emboss — clearly a valuable pickup a \
player would want to grab, not a flat plain circle or a button."""
weight = 2
domain = "identity"

[[review_item]]
id = "glint-sweep"
title = "Glint sweeps the face"
text = """
A bright white star/glint highlight sits on the face and sweeps across it over \
the face-on and near-face frames — catching the light as the coin turns — then \
disappears as the coin goes edge-on. The glint sells the metal as shiny gold \
rather than matte."""
weight = 1
domain = "identity"

[[review_item]]
id = "palette-and-transparency"
title = "Gold palette on transparency"
text = """
Uses only the palette from the brief (the two golds, the dark rim, and the white \
glint) on full transparency — no out-of-palette pixels, no anti-aliased fringes, \
and no opaque background fill; only the coin's own pixels are opaque so it \
composites onto any scene."""
weight = 1
domain = "identity"
