slug = "rain-downpour"
experimental = false
name = "Rain Downpour"
difficulty = "easy"
tags = ["vfx", "particle", "2d", "weather"]
summary = """
Author a looping heavy-rain effect: many thin near-vertical streaks falling fast \
with a slight wind slant, stretched along their velocity, plus occasional tiny \
splash flecks where drops reach the bottom edge — a 128x128 particle-2d effect \
simulated live from an authored emitter system, in a cool desaturated palette."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"

# A 2D (planar, screen-space) particle effect: a looping weather overlay the review
# UI and a game simulate live from the authored emitter system.
asset_kind = "particle-2d"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case ships a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The 2D field the effect plays in. particle-2d is planar — width/height only, no
# depth. duration_ms/fps/loop fix the playback; `background` is the preview's clear
# color only (the effect is composited over the game's scene at play time).
[particle]
width       = 128            # extent along x, in pixels (required)
height      = 128            # extent along y — up — in pixels (required)
duration_ms = 1500           # a 1.5 s window that loops seamlessly (required)
fps         = 60             # preview/playback frame rate (required, > 0)
loop        = true           # a steady, seamless downpour that repeats without a seam
background  = "transparent"  # preview clear color only

# The particle tool. `particle-2d` is the only way to shape the effect; it records
# every operation and, on `render`, simulates the system and writes the preview GIF.
# Run `particle-2d --help` for the operations; no operations schema is seeded.
[tool]
binary  = "particle-2d"
preview = "effect.gif"

# The recorded op log — the authoritative output. Core emits the authored
# system.json (emitters/forces/curves) automatically; it is not declared here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id   = "read"
name = "Effect read"
description = """
How well the simulated effect reads as heavy rain — many thin, fast, near-vertical \
streaks stretched along their velocity with a slight wind slant, and the occasional \
tiny splash fleck at the bottom edge, in a cool desaturated palette."""

[[domain]]
id   = "motion"
name = "Motion & timing"
description = """
How well the downpour reads as a steady, continuous fall over its 1.5 s window — \
fast falling motion, even density with no gaps or bursts — that loops seamlessly \
and reads the same across live replays."""

[[review_item]]
id     = "reads-as-rain"
title  = "Reads as heavy rain"
text   = """
The effect reads at a glance as a heavy downpour: a field of many thin, fast, \
near-vertical streaks falling across the frame with a slight wind slant — not a \
sparse drizzle, drifting snow, dots, or a formless wash."""
weight = 3
domain = "read"

[[review_item]]
id     = "streaks-and-splashes"
title  = "Streaks stretched, splashes at the bottom"
text   = """
The drops read as short streaks stretched along their velocity — not round dots — \
and small splash flecks appear where drops reach the bottom edge, kicking up briefly \
and fading. Both elements are legible in the simulated effect."""
weight = 2
domain = "read"

[[review_item]]
id     = "palette"
title  = "Cool desaturated rain palette"
text   = """
Uses only the cool desaturated colors from the brief — the pale blue-grey rain and \
the near-white splash flecks — reading as a muted, wet, cool-toned rain. No warm or \
saturated hues, no heavy opaque fill."""
weight = 1
domain = "read"

[[review_item]]
id     = "steady-seamless-loop"
title  = "Steady, seamless downpour"
text   = """
The rain falls at a steady rate with even density across the whole frame — no \
thinning, no bursts, no empty gaps — and the 1.5 s window loops with no visible \
seam: there is no moment where the field empties, restarts, or jumps."""
weight = 3
domain = "motion"

[[review_item]]
id     = "reads-across-replays"
title  = "Reads the same across replays"
text   = """
Because the system is simulated live and varies slightly from one play to the next, \
the downpour still reads as the same effect on every replay — individual drops fall \
on different paths, but the steady heavy rain in its cool palette is always the \
character on show."""
weight = 1
domain = "motion"
