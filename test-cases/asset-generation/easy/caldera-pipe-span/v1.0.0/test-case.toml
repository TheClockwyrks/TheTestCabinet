slug = "caldera-pipe-span"
name = "Caldera Pipe Span"
difficulty = "easy"
tags = ["voxel", "pipe"]
summary = """
Sculpt the Caldera Pipe Span: one straight, bolted run of Holdfast pipework built \
as an opaque-voxel model, one recorded operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version folder).
# The first version simply reads "Introduced.". Like `description`, it is NOT seeded
# into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"
asset_kind = "voxel-model"

# One variant only. `base` declares no `[voxel]` override, so the volume never
# varies; the brief states the dimensions literally. This list is a root key, so it
# must precede the first table header.
variants = ["variants/base.toml"]

# The voxel volume the model sculpts into (the 3D analog of a 2D canvas): `width`
# across (x), `height` up (y), `depth` front-to-back (z), in voxels. The volume
# always starts EMPTY; `background` is only the clear color behind the rasterized
# preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 12
height = 12
depth = 34
background = "transparent"

# The sculpting tool. `voxel` is the only way to place a voxel; every operation
# records to the action log and renders nothing — rendering is on request via
# `voxel render`. Run `voxel --help` to see the operations; no operations schema is
# seeded. `preview` is a SINGLE file (no {part} token — this is a static model).
[tool]
binary = "voxel"
preview = "model.png"

# The recorded action log — the authoritative output. A SINGLE file (no {part}
# token). `voxel render` also emits the `.glb` the 3D client renders (not declared
# here).
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run. It is plain Markdown (there is one
# variant, so the volume never varies and the brief states its dimensions literally).
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated model reads as one straight run of heavy, bolted \
Holdfast pipework — a riveted tube running the length of the volume with a raised \
flange collar at each end, the disciplined pipe palette, and ends that butt cleanly \
against another span."""

[[review_item]]
id = "reads-as-pipe-span"
title = "Heavy bolted pipe run"
text = """
From more than one angle the model reads unmistakably as a single straight run of \
heavy industrial pipework: a cylindrical tube running front-to-back along z, a \
raised FLANGE COLLAR ringing each end where it bolts to its neighbor, and a course \
of bolt heads around each collar. It reads as riveted, bolted, physical pipe — not a \
smooth, featureless cylinder."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "tiles-end-to-end"
title = "Butts cleanly, tiles against itself"
text = """
The pipe runs straight down the middle of the volume, centered in x and y and \
running the full depth along z, with no bend or taper. Both ends terminate in a \
flange collar flush with the front and back faces of the volume, and the tube is \
collared the same at both ends, so two copies laid nose-to-tail butt together into one \
continuous, unbroken pipeline — the piece is repeated hundreds of times across the \
map, so it must read right end-to-end and tile against itself."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "pipe-body-accent"
title = "Pipe body neutral, ironwork iron"
text = """
The whole pipe body — the tube itself — is sculpted in the neutral base color \
`#808890`, and the flanges, collars, and bolt heads are sculpted in iron `#3a3836`. \
The neutral base color appears on the pipe body and NOWHERE else: a game finds every \
voxel of it and repaints it to the network's fluid color, while the iron ironwork is \
never repainted, so the tube must be entirely the base color and the collars and \
bolts must be entirely iron."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Pipe palette discipline"
text = """
Uses only the two brief colors — the neutral pipe body `#808890` and the iron \
`#3a3836` — with no out-of-palette colors, and in particular NEITHER the water color \
`#3d9bd6` NOR the steam color `#7fcabc` anywhere on the model, and no stray voxels \
drifting outside the pipe."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "fills-volume"
title = "Fills the volume"
text = """
The pipe uses the volume it is given — running the full depth along z with its end \
collars flush to the front and back faces, a snug tube centered in x and y with a \
little margin around it — neither shrunk into one corner nor clipped where it runs \
past a face."""
weight = 1
domain = "fidelity"
