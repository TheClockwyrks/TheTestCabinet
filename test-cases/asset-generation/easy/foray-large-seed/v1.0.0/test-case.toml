slug = "foray-large-seed"
experimental = true
name = "Foray Large Seed"
difficulty = "easy"
tags = ["sprite", "item"]
summary = """
Draw the Foray large seed: the moving prize of a top-down ant-colony raiding \
game, worth three ordinary caches, as a 16x16 sprite — a single big rounded \
golden kernel outlined so it stays legible on the board, with a bright glint, in \
the fixed shared gold palette, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# A 16x16 transparent canvas keeps every run comparable.
[canvas]
width = 16
height = 16
background = "transparent"

# The drawing tool. `draw` is the only way to make a mark; it records every
# operation to the action log and re-renders the preview after each call. Run
# `draw --help` to see the operations; no operations schema is seeded.
[tool]
binary = "draw"
preview = "canvas.png"

# The recorded action log — the authoritative output the score is regenerated
# from.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sprite matches the Foray large seed — a single \
big rounded golden kernel that reads as the moving prize worth three ordinary \
caches, outlined so it stays legible on the board, in the fixed shared gold \
palette (never recolored)."""

[[review_item]]
id = "reads-as-large-seed"
title = "Reads as one big seed"
text = """
The sprite reads as a single large, rounded golden kernel filling most of the \
tile — the big sibling of an ordinary cache, not a pile of small seeds and not a \
tiny dot — with a dark outline all the way around so the one big shape stays \
legible against the board floor."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "valuable-glint"
title = "Rounded, glinting gold"
text = """
A brighter gold glint sits on top of the kernel so it reads as rounded and \
catches the light, making the seed look like the valuable moving prize worth \
three ordinary caches — not a flat gold blob."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Shared gold palette"
text = """
Uses only the shared gold palette from the brief (seed gold, bright glint, dark \
outline) — never recolored, no red or blue, no out-of-palette colors or halo of \
stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Canvas framing"
text = """
The seed is centered, filling most of the 16x16 tile with about a pixel of \
margin, neither tiny in a corner nor clipped at an edge."""
weight = 1
domain = "fidelity"
