slug = "confetti-pop"
experimental = false
name = "Confetti Pop"
difficulty = "easy"
tags = ["vfx", "particle", "2d", "celebration"]
summary = """
Author a celebratory confetti burst: a pop at center throws many small colorful \
confetti pieces up and outward, they tumble and spin, then flutter down under \
gravity with air drag — swaying side to side and fading near the end — as a \
128x128 particle-2d effect simulated live from an authored emitter system."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"

# A 2D (planar, screen-space) particle effect: a celebratory confetti burst the
# review UI and a game simulate live from the authored emitter system.
asset_kind = "particle-2d"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case ships a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The 2D field the effect plays in. particle-2d is planar — width/height only, no
# depth. duration_ms/fps/loop fix the playback; `background` is the preview's clear
# color only (the effect is composited over the host scene at play time).
[particle]
width       = 128            # extent along x, in pixels (required)
height      = 128            # extent along y — up — in pixels (required)
duration_ms = 1500           # a one-shot celebration ~1.5 s long (required)
fps         = 60             # preview/playback frame rate (required, > 0)
loop        = false          # one-shot: pops and flutters down to an empty field
background  = "transparent"  # preview clear color only

# The particle tool. `particle-2d` is the only way to shape the effect; it records
# every operation and, on `render`, simulates the system and writes the preview GIF.
# Run `particle-2d --help` for the operations; no operations schema is seeded.
[tool]
binary  = "particle-2d"
preview = "effect.gif"

# The recorded op log — the authoritative output. Core emits the authored
# system.json (emitters/forces/curves) automatically; it is not declared here.
[output]
actions = "actions.json"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id   = "read"
name = "Effect read"
description = """
How well the simulated effect reads as a celebratory confetti pop — a burst of \
many small, colorful tumbling confetti pieces in a festive multi-color palette, \
not a spark shower, a puff, or a formless blob."""

[[domain]]
id   = "motion"
name = "Motion & timing"
description = """
How well the confetti is paced over its 1500 ms — a pop that launches pieces up \
and outward, which then flutter down under gravity and air drag, swaying side to \
side and fading to a nearly empty field — and reads the same across live replays."""

[[review_item]]
id     = "reads-as-confetti-pop"
title  = "Reads as a celebratory confetti pop"
text   = """
The effect reads at a glance as a joyful confetti burst: a pop at the center throws \
a scatter of small colorful pieces up and outward that then flutter down — a party \
popper going off, not a spark shower, a firework, a puff of smoke, or a formless \
blob."""
weight = 3
domain = "read"

[[review_item]]
id     = "confetti-pieces"
title  = "Pieces read as confetti"
text   = """
The individual pieces read as confetti — small colorful rectangles or ribbons that \
tumble and spin as they fly and fall, catching the eye as flecks of paper — rather \
than round dots, streaks, or soft glowing sparks."""
weight = 2
domain = "read"

[[review_item]]
id     = "palette"
title  = "Festive multi-color palette"
text   = """
Uses the festive confetti palette from the brief — red, blue, green, yellow, pink, \
and cyan — mixed together across the burst so it reads as bright, cheerful, \
many-colored celebration. No muddy or washed-out colors, no single-hue field."""
weight = 1
domain = "read"

[[review_item]]
id     = "lifecycle"
title  = "Lifecycle over the duration"
text   = """
Pops hard at the very start — pieces launch up and outward from the center — then \
they arc over and flutter down under gravity and air drag, swaying side to side as \
they fall and fading near the end, so the field is nearly clear by the end of the \
1500 ms. A true one-shot with nothing frozen in the air at the finish."""
weight = 3
domain = "motion"

[[review_item]]
id     = "reads-across-replays"
title  = "Reads the same across replays"
text   = """
Because the system is simulated live and the scatter is randomized from one play to \
the next, the burst still reads as the same celebratory confetti pop on every \
replay — the pieces land in different places, but the pop, the colorful spread, and \
the fluttering fall are always the character on show."""
weight = 1
domain = "motion"
