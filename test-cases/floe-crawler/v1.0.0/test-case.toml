name = "Floe Crawler"
difficulty = "medium"
tags = ["asset-generation", "2d", "sprite", "hazard"]
summary = """
Draw the snow-crawler — a heavy tracked hazard machine in the Floe arctic-crossing \
game — as a 32x32 sprite: a hard-edged steel crawler on caterpillar treads with a \
glass cab, hazard-yellow stripes, and a red beacon, produced one drawing operation \
at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case ships a single `base` variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

[canvas]
width = 32
height = 32
background = "transparent"

[tool]
binary = "draw"
preview = "canvas.png"

[output]
actions = "actions.json"

[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sprite matches the brief — a hard-edged tracked \
crawler facing right, with a steel chassis on caterpillar treads, a glass cab, \
hazard-yellow leading stripes, and a red beacon, in the industrial palette on \
transparency."""

[[review_item]]
id = "dangerous-machine"
title = "Reads as a dangerous machine"
text = """
The sprite reads at a glance as a hard, heavy, dangerous industrial vehicle — \
straight lines, right angles, metal — clearly a hazard to dodge, not a creature and \
not a safe platform to stand on."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "crawler-details"
title = "Tracked crawler details"
text = """
It reads specifically as a tracked crawler: a steel chassis sitting on a heavy \
caterpillar tread, a raised cab with a glass window, hazard-yellow stripes on its \
leading (right) edge, and a red warning beacon on top — built and detailed, not a \
plain block."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette-and-framing"
title = "Industrial palette, transparency, and framing"
text = """
Uses only the industrial palette from the brief (steel, dark, tread, hazard yellow, \
beacon red, cab glass) on full transparency — no out-of-palette pixels, no fringes, \
no background fill — and fills most of the 32×32 frame, facing right, without \
clipping against an edge."""
weight = 1
domain = "fidelity"
