name = "Sunfront Bulwark"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "mech"]
summary = """
Sculpt and rig the Sunfront Bulwark: a 56x68x48 opaque-voxel heavy bipedal mech \
that braces a tower shield on its left arm and swings a heavy siege maul on its \
right arm — the maul arm raising and smashing on a caller-driven weapon_pitch joint \
while its two legs walk on their own, built and rigged one recorded operation at a \
time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 56
height = 68
depth = 48
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts and these joints; at run time it MAY add further
# parts, joints, and auto-play clips of its own (recorded in rig.json) beyond what
# this table requires. `pivot` is `[x, y, z]` in voxel coordinates. `rig.json` is
# pre-seeded from this table so the contract exists from the first operation.
[model]

# The mech's armored upper body and head: the root part (no parent), fixed to the
# world.
[[model.part]]
name = "torso"
pivot = [0, 0, 0]

# The left leg, mounted under the left hip. It walks on `leg_left_stride`.
[[model.part]]
name = "leg_left"
parent = "torso"
pivot = [18, 28, 24]

# The right leg, mirroring the left. It walks on `leg_right_stride` in opposite
# phase.
[[model.part]]
name = "leg_right"
parent = "torso"
pivot = [38, 28, 24]

# The right arm gripping the heavy siege maul, mounted at the right shoulder. It
# winds up and smashes on the caller-driven `weapon_pitch`. (The left arm and its
# tower shield are sculpted as part of the fixed `torso`.)
[[model.part]]
name = "weapon"
parent = "torso"
pivot = [40, 44, 26]

# The required caller-driven joint: a game addresses `weapon_pitch` by name to wind
# the right maul arm up over the head and smash it down about its shoulder mount.
# `rest = 0.2` holds the maul up and ready; `max = 1.1` raises it high overhead;
# `min = -0.5` swings it down and forward to strike. Only the weapon moves on this
# joint.
[[model.joint]]
name = "weapon_pitch"
part = "weapon"
kind = "rotation"
axis = "x"
pivot = [40, 44, 26]
min = -0.5
max = 1.1
rest = 0.2
drive = "caller"

# The left leg's own looping stride. An `auto` joint the case drives with a
# `[[model.clip]]`, so the mech walks on its own without a caller.
[[model.joint]]
name = "leg_left_stride"
part = "leg_left"
kind = "rotation"
axis = "x"
pivot = [18, 28, 24]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

# The right leg's stride, in opposite phase to the left.
[[model.joint]]
name = "leg_right_stride"
part = "leg_right"
kind = "rotation"
axis = "x"
pivot = [38, 28, 24]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

# The auto-play walk clips — one per leg, in opposite phase, so the heavy mech
# plods on its own. Only `auto` joints take a clip; the caller-driven `weapon_pitch`
# takes none. Keyframes are inline `[t_ms, value]` pairs (radians).
[[model.clip]]
joint = "leg_left_stride"
period_ms = 900
loop = true
keyframes = [[0, 0.0], [225, 0.5], [450, 0.0], [675, -0.5], [900, 0.0]]

[[model.clip]]
joint = "leg_right_stride"
period_ms = 900
loop = true
keyframes = [[0, 0.0], [225, -0.5], [450, 0.0], [675, 0.5], [900, 0.0]]

# A predetermined animation the review viewer offers as a play button, so a
# reviewer can watch the maul smash through its range without dragging the joint
# slider by hand. Each `[[model.animation.track]]` drives one joint over the shared
# `period_ms` timeline; keyframes are inline `[t_ms, value]` pairs (radians).
# `smash` winds the maul up overhead, slams it down and forward, then recovers to
# the ready pose.
[[model.animation]]
name = "smash"
period_ms = 700
loop = true

[[model.animation.track]]
joint = "weapon_pitch"
keyframes = [[0, 0.2], [150, 1.1], [400, -0.5], [700, 0.2]]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Bulwark and \
poses correctly — a heavy bipedal mech with two arms, a tower shield braced on the \
left and a siege maul in the right, whose right maul arm winds up and smashes on \
its shoulder mount without detaching while the two legs walk on their own and the \
torso stays put, with a clear solar-amber chest-core accent and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-mech"
title = "Reads as a heavy shield-and-maul mech"
text = """
From more than one angle the model reads unmistakably as a heavy walking war-mech \
with two arms: a broad, armored torso with a head on top, a pair of thick legs \
planted beneath the hips, a wide tower shield braced on a visible left arm, and a \
heavy siege maul gripped in a visible right arm. It is a bulky bipedal fighting \
machine, not an abstract stack of boxes, and it is plainly armed — not armless."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "weapon-pitches"
title = "Maul smashes and legs walk"
text = """
Driving the `weapon_pitch` joint swings the right maul arm cleanly up over the head \
and down in a smash about its shoulder mount, with no voxel of the arm or maul \
tearing away or clipping into the torso across the full range. The two legs walk on \
their own through the `leg_left_stride` and `leg_right_stride` auto joints, striding \
in opposite phase."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "torso-fixed"
title = "Torso stays fixed"
text = """
Only the moving parts move: the shield arm when `weapon_pitch` is driven and the \
legs as they stride. The torso and head stay put — they are the fixed root of the \
rig, not carried along by the weapon or the legs."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Legs and maul arm stay attached"
text = """
Each child stays attached to the torso across its joint's range: the two legs meet \
the hips at their mounts and the right maul arm meets the right shoulder, with no \
gap and never floating free or detaching as the legs stride and the maul swings. \
The left shield arm stays fixed to the torso."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (heavy brass and bronze armor, iron \
joints and maul head, and the solar-amber core accent) with a clear amber \
chest-core, no out-of-palette colors, and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
