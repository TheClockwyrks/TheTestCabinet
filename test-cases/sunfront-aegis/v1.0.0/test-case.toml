name = "Sunfront Aegis"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "vehicle"]
summary = """
Sculpt and rig the Sunfront Aegis: a 72x52x88 opaque-voxel siege fortress on \
treads — a great tracked hull bristling with guns, whose central main turret \
traverses and elevates its cannon on caller-driven joints while two side batteries \
sweep on their own, built and rigged one recorded operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 72
height = 52
depth = 88
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts and these joints; at run time it MAY add further
# parts, joints, and auto-play clips of its own (recorded in rig.json) beyond what
# this table requires. `pivot` is `[x, y, z]` in voxel coordinates. `rig.json` is
# pre-seeded from this table so the contract exists from the first operation.
[model]

# The tracked fortress hull and its two side treads: the root part (no parent),
# fixed to the world.
[[model.part]]
name = "chassis"
pivot = [0, 0, 0]

# The big central main turret, mounted on top-center of the hull. It traverses on
# the caller-driven `main_turret_yaw`.
[[model.part]]
name = "main_turret"
parent = "chassis"
pivot = [36, 32, 44]

# The main cannon, mounted at the front of the main turret so it swings with it. It
# elevates on the caller-driven `main_gun_pitch`.
[[model.part]]
name = "main_gun"
parent = "main_turret"
pivot = [36, 38, 58]

# The left side battery: a secondary gun on a sponson off the left flank of the
# hull. It sweeps up and down on its own via the auto `left_battery_pitch`.
[[model.part]]
name = "left_battery"
parent = "chassis"
pivot = [12, 30, 40]

# The right side battery, mirroring the left on the right flank. It sweeps on its
# own via the auto `right_battery_pitch`, in opposite phase.
[[model.part]]
name = "right_battery"
parent = "chassis"
pivot = [60, 30, 40]

# The required caller-driven turret traverse: a game addresses `main_turret_yaw` by
# name to swing the main turret (and its cannon with it) about its vertical mount, a
# full half-turn each way. `rest = 0` faces straight forward (+z).
[[model.joint]]
name = "main_turret_yaw"
part = "main_turret"
kind = "rotation"
axis = "y"
pivot = [36, 32, 44]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "caller"

# The required caller-driven main-gun elevation: a game addresses `main_gun_pitch`
# by name to raise and lower the main cannon. `rest = 0.1` is a slight combat
# elevation; `max = 0.8` lobs high, `min = -0.2` depresses the barrel.
[[model.joint]]
name = "main_gun_pitch"
part = "main_gun"
kind = "rotation"
axis = "x"
pivot = [36, 38, 58]
min = -0.2
max = 0.8
rest = 0.1
drive = "caller"

# The left battery's own looping sweep. An `auto` joint the case drives with a
# `[[model.clip]]`, so the side gun tracks up and down on its own without a caller.
[[model.joint]]
name = "left_battery_pitch"
part = "left_battery"
kind = "rotation"
axis = "x"
pivot = [12, 30, 40]
min = 0.0
max = 0.9
rest = 0.3
drive = "auto"

# The right battery's own looping sweep, in opposite phase to the left.
[[model.joint]]
name = "right_battery_pitch"
part = "right_battery"
kind = "rotation"
axis = "x"
pivot = [60, 30, 40]
min = 0.0
max = 0.9
rest = 0.3
drive = "auto"

# The auto-play sweep clips — one per side battery, in opposite phase, so the two
# secondary guns rove on their own. Only `auto` joints take a clip; the caller
# `main_turret_yaw` and `main_gun_pitch` take none. Keyframes are inline
# `[t_ms, value]` pairs (radians).
[[model.clip]]
joint = "left_battery_pitch"
period_ms = 2000
loop = true
keyframes = [[0, 0.1], [1000, 0.8], [2000, 0.1]]

[[model.clip]]
joint = "right_battery_pitch"
period_ms = 2200
loop = true
keyframes = [[0, 0.8], [1100, 0.1], [2200, 0.8]]

# A predetermined animation the review viewer offers as a play button, so a
# reviewer can watch the main turret bombard through its range without dragging the
# joint sliders by hand. Each `[[model.animation.track]]` drives one joint over the
# shared `period_ms` timeline; keyframes are inline `[t_ms, value]` pairs (radians).
# `bombardment` sweeps the turret left and right while the main gun lobs and recovers.
[[model.animation]]
name = "bombardment"
period_ms = 4000
loop = true

[[model.animation.track]]
joint = "main_turret_yaw"
keyframes = [[0, -1.2], [2000, 1.2], [4000, -1.2]]

[[model.animation.track]]
joint = "main_gun_pitch"
keyframes = [[0, 0.1], [1000, 0.6], [2000, 0.1], [3000, 0.6], [4000, 0.1]]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Aegis and \
poses correctly — a great multi-gun siege fortress riding on two tracks, whose \
central main turret traverses and whose cannon elevates on their caller joints \
without detaching while the two side batteries sweep on their own and the tracked \
hull stays put, with a clear solar-amber accent and the disciplined Duneforged \
palette."""

[[review_item]]
id = "reads-as-fortress"
title = "Reads as a fortress on treads"
text = """
From more than one angle the model reads unmistakably as a giant siege fortress on \
tracks: a low, broad armored hull riding on a pair of heavy treads down its sides, \
a big main turret with a long cannon on top, and a secondary gun battery out on \
each flank. It is a bristling multi-gun war machine, not an abstract stack of \
boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "turret-traverses"
title = "Main turret traverses and gun elevates"
text = """
Driving `main_turret_yaw` swings the whole main turret — and its cannon with it — \
cleanly about its vertical mount, and driving `main_gun_pitch` raises and lowers \
the cannon, with no voxel tearing away from the mount or clipping into the hull \
across either joint's range."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "batteries-sweep"
title = "Side batteries sweep on their own"
text = """
The two side batteries rove up and down on their own through the auto \
`left_battery_pitch` and `right_battery_pitch` joints, in opposite phase, each \
swinging about its own sponson mount without detaching from the hull."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "chassis-fixed"
title = "Tracked hull stays fixed"
text = """
Only the turret, cannon, and side batteries move. The tracked hull stays put — it \
is the fixed root of the rig, not carried along by the turret's traverse or the \
batteries' sweep."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "guns-attached"
title = "Guns stay attached"
text = """
Each child stays attached to its parent across its joint's range: the cannon meets \
the front of the main turret, the main turret meets the top of the hull, and each \
side battery meets its sponson — with no gap and never floating free as they \
traverse, elevate, and sweep."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze armor, iron treads \
and gun barrels, and the solar-amber accent) with a clear amber accent, no \
out-of-palette colors, and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
