# The obstacles sway and rotate, so the ball bounces off tilted, oriented faces.
# The change applies to both Solo and Versus, so gyre is rated on the case's
# common `single-player` and `versus` domains — it adds no domain of its own.
slug = "gyre"
name = "Gyre"
description = "The obstacles sway and rotate, so the ball bounces off tilted, oriented faces."

# The rules that vary live in the common `.hbs` specs, branched on this variant's
# slug when rendered: gyre keeps the same single-ball serving as base, but its
# field's moving, rotating obstacles and their oriented collision replace the static
# ones (the `gyre` branch of `specs/playfield.md.hbs`), and its extra debug operation
# and snapshot field are the `gyre` branch of `specs/instrumentation.md.hbs`. So gyre
# declares no `spec` of its own.

# The authored, *correct* static build of this variant, one per engine — see
# `variants/base.toml` for what a reference implementation is and how it is
# published. Under `none` the build carries its own runtime in `src/host.ts`;
# under `simple-2d` it hands the same surfaces to the vendored engine. The game
# either one implements is identical, which is what makes the two comparable.
[reference_implementation]
none = "references/none/gyre"
"simple-2d" = "references/simple-2d/gyre"

# This variant needs a starter project of its own: base's state carries no obstacle
# clock and no obstacle poses, and its debug API has no `setObstacleClock`. The
# table REPLACES the case's `[workspaces]` rather than layering on it, so it names
# one directory per engine exactly as the case's does, and each is the matching
# base project with those three additions.
[workspaces]
none = "workspaces/gyre/none"
"simple-2d" = "workspaces/gyre/simple-2d"

# The gyre-specific category, worth one point per item. It applies to the whole
# game (both Solo and Versus). Its points pose the obstacles through the
# `setObstacleClock` operation this variant's seeded `src/debug.ts` adds, then read
# their live pose back: that they sway vertically, that they rotate, and that the ball's
# bounce tracks their tilt. The `format` is inherited from the case manifest
# (`[review] format = 2`).
[[review.categories]]
id = "gyre"
title = "Gyre"
[[review.categories.items]]
id = "obstacles-sway"
title = "Obstacles sway"
description = "The two obstacles move — each sways vertically about its base center as time passes, and they sway in opposite directions so the field stays balanced."
# Automated validation: pose the obstacle clock at two times and read each obstacle's
# center back — both move well off their base y, in opposite directions. See
# validation/<engine>/gyre/obstacles-sway.test.ts.
validation = { script = "gyre/obstacles-sway.test.ts", outputs = [
  { id = "sway", name = "The obstacles swaying vertically", kind = "video" },
] }
[[review.categories.items]]
id = "obstacles-spin"
title = "Obstacles spin"
description = "The two obstacles rotate — each spins about its own center as time passes, presenting continuously tilting faces."
# Automated validation: pose the obstacle clock at three times and read each
# obstacle's rotation back — upright at the start, then rotating further as time
# advances. See validation/<engine>/gyre/obstacles-spin.test.ts.
validation = { script = "gyre/obstacles-spin.test.ts", outputs = [
  { id = "spin", name = "The obstacles rotating about their centers", kind = "video" },
] }
[[review.categories.items]]
id = "oriented-bounce"
title = "Oriented bounces"
description = "The ball bounces off the obstacles' tilted faces at oriented angles that track each obstacle's current orientation rather than axis-aligned reflections."
# Automated validation: pose an obstacle upright then tilted ~45deg and fire the same
# horizontal shot — the tilted face deflects it well off-axis while the upright face
# returns it straight, proving the bounce tracks orientation. See
# validation/<engine>/gyre/oriented-bounce.test.ts.
validation = { script = "gyre/oriented-bounce.test.ts", outputs = [
  { id = "oriented", name = "A shot deflecting off a tilted obstacle", kind = "video" },
] }

# Gyre serves toward the receiver exactly as base does, so — like base — it adds the
# three serve-direction points to the case's COMMON `gameplay` category (reusing its
# id) and drives the same shared serve scripts, rather than declaring points of its
# own. See base.toml for the fuller note on a variant extending a common category.
[[review.categories]]
id = "gameplay"
title = "Gameplay"
[[review.categories.items]]
id = "serve-initial"
title = "Initial serve direction"
description = "The very first serve of a match always travels toward player one."
validation = { script = "gameplay/serve-initial.test.ts", outputs = [
  { id = "serve", name = "First serve toward player one", kind = "video" },
] }
[[review.categories.items]]
id = "serve-after-p1"
title = "Serve after scoring on player one"
description = "After a point is scored on player one (player two scores), the next serve travels toward player one, the receiver."
validation = { script = "gameplay/serve-after-p1.test.ts", outputs = [
  { id = "serve", name = "Serve toward player one after a point on player one", kind = "video" },
] }
[[review.categories.items]]
id = "serve-after-p2"
title = "Serve after scoring on player two"
description = "After a point is scored on player two (player one scores), the next serve travels toward player two, the receiver."
validation = { script = "gameplay/serve-after-p2.test.ts", outputs = [
  { id = "serve", name = "Serve toward player two after a point on player two", kind = "video" },
] }
