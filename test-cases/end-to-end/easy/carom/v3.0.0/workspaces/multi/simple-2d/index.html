<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carom — Neon Paddle Duel</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
        overflow: hidden;
      }
      /*
        The canvas simply fills the window. The engine fits the fixed 1280x720
        logical field inside it — the uniform scale, the centered letterbox, and
        the device pixel ratio — so there is no sizing code here or in the game.
      */
      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0b0e14;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
