# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`; see `docs/test-cases.md`.

# The manifest format. Format 2 seeds one starter project PER ENGINE, through the
# `[workspaces]` table below, and it is the only format that may name an engine —
# a starter project is written against a runtime, so one directory cannot stand
# for two. Format 1's single `workspace` key is illegal here.
format = 2

# The case's stable identity, recorded in every run. It stays `pong` because runs
# published before the folder was renamed reference it.
slug = "pong"

# Human-readable display name for this test case.
name = "Carom"

# Relative difficulty of this case, surfaced on the site. Carom is one
# self-contained real-time loop — ball, paddles, spin, two obstacles, a light AI —
# with no subsystem big enough to need splitting out behind an interface, so easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "paddle", "physics"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A neon top-down paddle duel where the swing of a paddle puts spin on the ball, \
and two fixed obstacles turn the open field into a bank-shot puzzle."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. Carom is an easy case, so 90 minutes is comfortably more than a
# healthy build needs while still catching a session that never terminates.
max_runtime_hours = 1.5

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine — and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Every variant offers the same two ways to play — Solo
# and Versus — and is rated on the same common `single-player` and `versus`
# domains (no variant adds a domain of its own); the variants differ only in the
# *rules of the game itself*, which apply equally to Solo and Versus. That
# difference is carried by two common `.hbs` specs that branch on the selected
# variant — `specs/playfield.md.hbs` (the field, paddles, ball, and how the
# obstacles behave) and `specs/balls.md.hbs` (how the balls are served, plus the
# shared ball physics) — rendered before they land, so each variant's seeded spec
# set reads as one self-contained game.
#   - base  — fixed, upright obstacles and a single ball served toward the
#             receiver. The reference build.
#   - gyre  — obstacles that sway and rotate, so the ball bounces off tilted,
#             oriented faces instead of axis-aligned ones.
#
# The multi-ball variant of v2 is NOT carried forward into this version. Its three
# independently-served balls contradict points this case grades COMMONLY — a
# scored point does not return multi to the pre-serve countdown ("the other two
# balls carry on uninterrupted"), and its launches are random over the full circle
# rather than aimed at a receiver — and a variant may only ADD to a common review
# item, never replace the validator behind one (see `merge_review_items` in the
# core). Carrying it forward therefore means moving the serve, scoring, match-end
# and countdown points out of the common set and declaring them per variant, which
# is a change to how the case is graded rather than a port of the variant. See
# `changelog.md`.
# This list is a root key, so it must precede the first table header.
variants = [
  "variants/base.toml",
  "variants/gyre.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics. It is a *run dimension*, chosen per run alongside the
# model, the harness, and the variant, and recorded on the run; it is not a
# property of the game.
#
# Carom supports two, and the game is the same under both. What differs is where
# the runtime comes from: `simple-2d` vendors it as a package, and `none` has the
# seeded project carry it as `src/host.ts`. Both projects fix the same module
# contract — `src/constants.ts`, `src/debug.ts`, `src/main.ts`, and the
# `src/game.ts` the build writes — so the specs, the review items, and the
# validators are the same for either, and a score recorded under one engine is
# comparable with a score recorded under the other.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` carries a range and is named in an
# `[[engine]]` table. The range is pinned because a specification is written
# against a runtime contract: `min_version` is the 1.0.0 API the specs and the
# validators are written against, and there is deliberately no `max_version`, so a
# later 1.x or 2.x from the host package store is accepted as it lands. Widening or
# moving a range means a new case version, so the pin is the statement that THIS
# spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to *this game* under it —
# which surfaces the build still supplies, Carom's touch layout, and Carom's cue
# names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. Each is a complete TypeScript project the model builds inside rather
# than a bare `package.json`: the Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the canvas, and the case-owned modules a validator imports —
# `src/constants.ts` (every tunable this specification fixes), `src/debug.ts` (the
# `window.__carom` surface), and `src/main.ts` (the browser entry that stands the
# runtime up and runs it). The model writes `src/game.ts`, and writes the same
# `src/game.ts` whichever engine ran.
#
# There is one directory per engine because the runtime is what differs:
#   - `none`      seeds `src/host.ts` alongside the rest, so the project carries
#                 its own frame loop, canvas fit, input, audio, and overlay, and
#                 depends on no runtime package.
#   - `simple-2d` seeds no such module and declares the engine in its
#                 `package.json` instead; the package is vendored in at seed time,
#                 so the build imports it by its bare package name.
#
# A variant may replace this whole table with one of its own, which gyre does: its
# state carries the obstacle clock and both obstacles' live poses, and its debug
# API adds `setObstacleClock`. The seeded files land at the run root
# (`workspaces/base/none/package.json` seeds to `package.json`).
[workspaces]
none = "workspaces/base/none"
"simple-2d" = "workspaces/base/simple-2d"

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the
# build to commit a `package-lock.json`, so the validated build installs exactly
# what the deploy will. Both commands are required — there are no defaults, so
# every case states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded `workspace` ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken` and scores it zero,
# because code that does not compile is not reviewable. The other three are
# recorded and gate nothing — `test` additionally records the count and coverage
# the build's own suite reports, which is how a build that ships tests is told
# apart from one that ships none. Each is spelled `npx` rather than
# `npm run <script>` so the check is the case's own statement of what is run and
# does not depend on the model leaving the seeded scripts intact.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface every build carries, named once
# here. The handle is required as soon as any review item declares a `validation`
# script, which they do below. Under the engine the surface is not something the
# model invents: `src/debug.ts` is seeded with the workspace and installs
# `window.__carom` over the state the build's `src/game.ts` declares, so the handle
# names what a person opening the console finds and what the built page's own
# overlay is driven from. The seeded specification documents it independently as an
# ordinary game debug feature (see specs/instrumentation.md); this entry is
# reporter-side and never seeded.
#
# There is deliberately no `tick_hz`. It existed to tell the validation runtime what
# one stepped tick was worth, because a driver stepped the build's own fixed
# timestep through the debug API at a rate the manifest had to state. Nothing steps
# that way now: the engine mandates no timestep at all — it hands the game the real
# elapsed time of each frame — and a validator supplies its own clock object and
# calls `engine.advance(n)`, so the size of a step is stated in the validator that
# takes it and differs on purpose between suites (a steady clock, an uneven
# sequence, seeded jitter). A single case-wide rate could only get them wrong, and the
# key is optional precisely so a case whose build is clocked in real time omits it.
[instrumentation]
handle = "__carom"

# The specs: every one is seeded for EVERY variant of this case, at the `dest`
# path within the run workspace. The specification is decomposed by concern, and
# there is a single list — the two things a variant changes wholesale (the field
# with its obstacles, and the balls/serving/physics) are not separate per-variant
# files but branches inside `specs/playfield.md.hbs` and `specs/balls.md.hbs`,
# rendered for the selected variant before they land (see below). Every seeded set
# thus asserts exactly one game — the overview and visual design, the field and
# obstacles, the balls/serving/physics, the menus/screens/scoring, the two ways to
# play (Solo and Versus, with their controls, HUD, and the AI), and the
# debugging/automation surface — with no cross-variant language, because the
# branching resolves at seed time and the model never sees the alternative.
#
# There is no proof spec. Earlier versions asked the build to capture screenshots
# and a clip at fixed paths as evidence a feature worked; the evidence a reviewer
# looks at now is captured by this case's own validators from scenarios the case
# controls, so nothing is asked of the build.
#
# Most specs are plain Markdown, seeded verbatim. Two are `.hbs` templates,
# rendered with the selected variant before landing: `specs/playfield.md.hbs`
# (fixed, upright obstacles vs. the gyre variant's swaying, rotating ones) and
# `specs/instrumentation.md.hbs` (which adds gyre's `setObstacleClock` operation
# and the obstacle poses a snapshot reports). Each branches on `variant.slug`. A spec's `dest` defaults to its `source` with a
# trailing `.hbs` stripped, so an `.md.hbs` source seeds to the same `.md` path.
[[spec]]
source = "specs/overview.md.hbs"

[[spec]]
source = "specs/playfield.md.hbs"

[[spec]]
source = "specs/balls.md.hbs"

[[spec]]
source = "specs/ui.md.hbs"

[[spec]]
source = "specs/modes/single-player.md.hbs"

[[spec]]
source = "specs/modes/versus.md.hbs"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable core; a `window.__carom` API to drive and inspect the game from code;
# and a read-only debug overlay. Seeded for every variant and framed as an ordinary
# developer affordance of the game. Rendered from a `.hbs` template so its
# ball-count wording matches the selected variant; it seeds to `specs/instrumentation.md`.
[[spec]]
source = "specs/instrumentation.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`. All three belong to the
# browser-driven arrangement this version replaces. References were screenshots
# seeded as visual targets and checks scored a driven screenshot against one; a
# proof was a capture the build itself was told to write to a fixed path. Every
# piece of evidence a reviewer sees now comes from this case's validators, which
# pose the scenario themselves against the game the build wrote and capture what it
# renders — so menus and screens are still left to the model's design and judged by
# a person, but from media the case produced rather than media the model submitted.
# The automated load check still runs.

# Scoring domains. A reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless single-player
# mode cannot mask a broken versus mode. Every case must declare at least one.
# These qualitative per-domain ratings are separate from the point checklist below,
# which is scored globally (the categories grammar attaches no domain to a point).
# The mode-specific control categories are named plainly so the checklist still
# reads by mode.
[[domain]]
id = "single-player"
name = "Single Player"
description = "Solo play: a human paddle against the computer-controlled opponent."

[[domain]]
id = "versus"
name = "Versus"
description = "Two-player local play: two human-controlled paddles, no AI."
# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare
# name grouping the points a reviewer grades — and each
# `[[review.categories.items]]` under it is one graded review item, worth one
# point (the default weight), so a category is worth the number of items it holds
# (no fractional scoring). A category carries no prose of its own; each review item
# states its own requirement in `description`. Categories are common to every
# variant here; a point a variant changes lives in that variant's own file
# instead. The checklist is reporter-side material — never seeded into a run, so
# the model never sees it; each item restates a requirement the seeded
# specification already states. An item with a `validation` script is decided
# automatically (the reviewer can override); one without is left to the reviewer.
#
# EVERY point on this checklist now carries a validation script. Each is a vitest
# suite under `validation/<engine>/<category>/<item id>.test.ts` that runs in the
# same process as the build. The `<engine>` level is the ENGINE the suite is
# written against — a validator speaks one engine's vocabulary, so this case,
# which supports two, ships one directory per engine: `validation/none/` against
# the runtime the build carries in `src/host.ts`, and `validation/simple-2d/`
# against the vendored engine. The two are the same suites over the same
# scenarios; only the runtime they reach for differs. The directory for the run's
# engine is what gets staged into the built workspace at `validation/`, which is
# why a suite reaches the build with `../src/...`.
#
# A suite imports that runtime and the build's own `src/game.ts`, constructs it
# over a headless canvas with a clock it scripts, poses the scenario through
# `src/debug.ts`, and steps it with `advance`. It reads behavior back from the
# game's state, audio from the runtime's `cue:played` event, and drawing from the
# canvas — either the pixels or a recording proxy over the 2D context. Nothing
# drives a browser, so there is no waiting and no flake.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. A `replay` output is a draw-command recording: the suite arms the
# runtime's recorder around the section the point is about — the contact, the
# point played out, the paddle held still while paused — and never around the
# arrangement that got there, so what a reviewer scrubs is the build's own drawing
# of exactly the thing being graded. An `image` output is a single captured frame.
# Both are evidence beside the verdict rather than any part of it: a point still
# passes or fails on its assertions alone.
#
# Automation deciding a point does not make it un-reviewed. The two rendering
# points (window fit and the motion trail) and the four UI game-state points assert
# only the mechanically checkable half — that the field is fitted and centered,
# that a trail of the right shape is drawn, that each screen is reachable — and
# capture the frame; how a screen reads and lays out is still judged by a person
# from that capture, as is the character of every sound (only that a cue fires on
# its event is scored).
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# `src/debug.ts` is seeded, so what this point checks is not that the model wrote an
# API but that the state the build's `src/game.ts` declares actually backs it: every
# operation runs against a real game, and a snapshot reports the full documented
# shape with live values. Every other automated item poses its scenario through the
# same surface, so a state the build hollowed out or reshaped also shows up as those
# items failing to run — this point names the fault plainly and captures a live-match
# frame as proof the driven game is what was inspected.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "debug-api"
title = "Debug and automation API present"
description = "The build exposes the whole window.__carom debug and automation API and the read-only debug overlay described in specs/instrumentation.md, backed by a deterministic, steppable core."
# Automated validation: reflect that every required operation is installed as a
# function and that a snapshot reports the full documented shape, then capture the
# live match that was driven. See validation/<engine>/instrumentation/debug-api.test.ts.
validation = { script = "instrumentation/debug-api.test.ts", outputs = [
  { id = "state", name = "The driven in-game state", kind = "image" },
] }

# --- Gameplay -----------------------------------------------------------------
[[review.categories]]
id = "gameplay"
title = "Gameplay"
# The ball serves at a fixed speed after a fixed pre-serve countdown.
[[review.categories.items]]
id = "serve-speed"
title = "Serve speed"
description = "A served ball leaves at the base serve speed of 520 units per second."
# Automated validation: start a fresh match, serve, and read the ball's launch speed
# (~520 units per second). See validation/<engine>/gameplay/serve-speed.test.ts.
validation = { script = "gameplay/serve-speed.test.ts", outputs = [
  { id = "serve", name = "A ball leaving at the serve speed", kind = "replay" },
] }
[[review.categories.items]]
id = "countdown-length"
title = "Countdown length"
description = "The pre-serve countdown lasts a fixed 1.0 s at match start and after each point before the ball serves."
# Automated validation: start a match and advance until the ball serves, confirming
# the hold lasts ~1.0 s of simulated time on the validator's own clock. See
# validation/<engine>/gameplay/countdown-length.test.ts.
validation = { script = "gameplay/countdown-length.test.ts", outputs = [
  { id = "countdown", name = "The pre-serve countdown running out", kind = "replay" },
] }
# Scoring is checked per side — one point for each goal — so a build that scores on
# only one edge is caught rather than averaged away by the other.
[[review.categories.items]]
id = "scoring-p1"
title = "Player one scores past the right goal"
description = "A ball crossing the right goal edge scores a point for player one (the left player)."
# Automated validation: drive a real ball out the right goal and confirm player one's
# score increments and player two's does not. See validation/<engine>/gameplay/scoring-p1.test.ts.
validation = { script = "gameplay/scoring-p1.test.ts", outputs = [
  { id = "goal", name = "Player one scoring past the right goal", kind = "replay" },
] }
[[review.categories.items]]
id = "scoring-p2"
title = "Player two scores past the left goal"
description = "A ball crossing the left goal edge scores a point for player two (the right player)."
# Automated validation: drive a real ball out the left goal and confirm player two's
# score increments and player one's does not. See validation/<engine>/gameplay/scoring-p2.test.ts.
validation = { script = "gameplay/scoring-p2.test.ts", outputs = [
  { id = "goal", name = "Player two scoring past the left goal", kind = "replay" },
] }
[[review.categories.items]]
id = "match-win"
title = "Match win at 11, lead by 2"
description = "The match is first to 11 and must be won by two clear points."
# Automated validation: from 10-9, drive a real point across the goal to 11-9 and
# confirm the match ends with the correct winner and final score. See
# validation/<engine>/gameplay/match-win.test.ts.
validation = { script = "gameplay/match-win.test.ts", outputs = [
  { id = "game-over", name = "Match-over screen", kind = "image" },
] }
[[review.categories.items]]
id = "deuce"
title = "Deuce past 10-10"
description = "Any tie at or above 10-10 keeps playing until one player leads by two."
# Automated validation: from 10-10 a real point to 11-10 must NOT end the match, and
# a further point to 12-10 must. See validation/<engine>/gameplay/deuce.test.ts.
validation = { script = "gameplay/deuce.test.ts", outputs = [
  { id = "deuce", name = "The deciding deuce point", kind = "replay" },
] }
# Pausing is checked around the pre-serve countdown: that it is allowed there (not
# only once the ball is in flight), and that the countdown freezes while paused
# rather than ticking away behind the pause menu.
[[review.categories.items]]
id = "pause-during-countdown"
title = "Pausing during the countdown"
description = "The game can be paused during the pre-serve countdown, not only once the ball is in play."
# Automated validation: start a match (which opens on the countdown), dispatch a
# pause key there, and confirm the game pauses. See
# validation/<engine>/gameplay/pause-during-countdown.test.ts.
validation = { script = "gameplay/pause-during-countdown.test.ts", outputs = [
  { id = "paused", name = "Paused during the pre-serve countdown", kind = "image" },
] }
[[review.categories.items]]
id = "countdown-frozen"
title = "Countdown pauses with the game"
description = "While the game is paused the pre-serve countdown does not advance; it resumes where it left off rather than running out behind the pause menu."
# Automated validation: pause during the countdown, then let far more than the hold
# elapse in both simulation and real time — the game must stay paused with the ball
# still held, and resume back into the countdown. See
# validation/<engine>/gameplay/countdown-frozen.test.ts.
validation = { script = "gameplay/countdown-frozen.test.ts", outputs = [
  { id = "countdown", name = "The countdown frozen while paused", kind = "replay" },
] }
# Beatable AI is checked as three separate points, all in Solo, each driving the real
# computer opponent (setAiControl, see specs/instrumentation.md) against a posed shot
# and reading whether it blocks it or the shot gets past. Together they bound the AI:
# competent enough to run down a reachable ball, but neither superhumanly fast nor
# predicting bank shots — so a person can beat it.
[[review.categories.items]]
id = "ai-intercepts"
title = "Beatable AI — runs down a reachable shot (Solo)"
description = "In Solo the AI is competent: a ball aimed to arrive a moderate distance from its paddle, within reach at its movement speed, is tracked down and blocked."
# Automated validation: drive the real AI against a shot ~200 units off its paddle's
# start — within its reach — and confirm it blocks it (player one does not score). See
# validation/<engine>/gameplay/ai-intercepts.test.ts.
validation = { script = "gameplay/ai-intercepts.test.ts", outputs = [
  { id = "block", name = "The AI running down and blocking a reachable shot", kind = "replay" },
] }
[[review.categories.items]]
id = "ai-outrun"
title = "Beatable AI — a fast shot out of reach gets past (Solo)"
description = "In Solo the AI is clearly beatable and not superhuman: a fast shot placed well out of its reach — arriving before a paddle moving at its speed could cover the distance — gets past it and scores."
# Automated validation: drive the real AI against a fast, low-angle shot arriving far
# from its start and confirm the shot gets past it (player one scores) — an AI that
# moved faster than it should would block it. See validation/<engine>/gameplay/ai-outrun.test.ts.
validation = { script = "gameplay/ai-outrun.test.ts", outputs = [
  { id = "scored", name = "A fast shot outrunning the AI paddle", kind = "replay" },
] }
[[review.categories.items]]
id = "ai-no-predict"
title = "Beatable AI — no bank-shot prediction (Solo)"
description = "In Solo the AI does not predict bank shots: a fast, steep shot that banks off a wall before arriving gets past it, because it tracks the ball itself rather than aiming at the ball's post-bounce destination."
# Automated validation: drive the real AI against a fast, steep shot that banks off a
# wall and confirm the shot gets past it (player one scores) — an AI that predicted
# the reflected destination, or moved too fast, would block it. See
# validation/<engine>/gameplay/ai-no-predict.test.ts.
validation = { script = "gameplay/ai-no-predict.test.ts", outputs = [
  { id = "scored", name = "A bank shot beating the AI paddle", kind = "replay" },
] }
[[review.categories.items]]
id = "advances-in-real-time"
title = "The game advances itself in real time"
description = "During normal play the game runs on its own: it advances on the elapsed time the frame loop hands it, so a served ball crosses the court and the rally plays out without anything stepping it from outside."
# Automated validation: hand the game a real wall clock, let the loop run itself for
# a stretch of real time, and confirm the ball moved — a build that only advances
# when something pokes it stays where it was put. See
# validation/<engine>/gameplay/advances-in-real-time.test.ts.
validation = { script = "gameplay/advances-in-real-time.test.ts", outputs = [{ id = "before", name = "The instant play begins", kind = "image" }, { id = "after", name = "Moments later, on the build's own clock", kind = "image" }] }
# The simulation is driven by elapsed time, not by a count of frames. The frame clock
# is the engine's and a validator supplies it, so this is checkable head-on: the same
# scenario is replayed under several clocks and the outcomes must agree.
[[review.categories.items]]
id = "delta-time-independent"
title = "The simulation advances on elapsed time, not on frames"
description = "One scenario — a ball banked off a wall into the paddle, and the flight that follows — reaches the same outcome whatever the frame rate: the same paddle contact, the same bank, the same side scores, the ball ends travelling the same way at the same speed, and the whole thing takes the same amount of game time."
# Automated validation: drive that one scenario three times under three clocks — a
# `ConstantClock` at a steady 120 Hz, a `SequenceClock` repeating an uneven pattern of
# deltas, and a seeded `JitterClock` — and compare the outcomes. Only facts that survive a legitimate change
# in step size are compared, never a position: the sharpest of them is the game time
# each drive took, read from the engine's own frame clock, because a build that
# advances per frame rather than per second traces the identical path and can only give
# itself away on the clock. See validation/<engine>/gameplay/delta-time-independent.test.ts.
validation = { script = "gameplay/delta-time-independent.test.ts", outputs = [
  { id = "drive", name = "The scenario driven under a varying clock", kind = "replay" },
] }

