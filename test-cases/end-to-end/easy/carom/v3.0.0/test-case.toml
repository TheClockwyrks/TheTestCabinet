# --- Touch --------------------------------------------------------------------
# specs/ui.md gives every menu screen a finger as well as the keyboard and the
# mouse, and a finger is not a small mouse: it never hovers, so the first the
# build hears of it is the contact LANDING, and the landing is what selects. Each
# point below drives one real touch contact — carrying the device a finger
# carries — at the middle of the region the build reports through `menuItemRect`,
# so any layout passes and only the handling is graded. The three are the three
# behaviors specs/ui.md gives a contact: a landing selects, a lift inside the
# region it landed in confirms that item, and a lift in a different region
# confirms nothing while the selection follows the finger. All three are graded on
# the title menu, where a confirm that should not have happened is loud (a match
# opens) and one that should have is silent (the title stays).
#
# WHICH MENUS ARE GRADED follows the `pointer` category exactly, and for the same
# reason: the handling is one piece of code and is read once on the title, while
# whether a screen is wired to it is per screen, so `paused` and `matchover` each
# carry a tap point. `howto` carries none — its one item confirms to the title,
# which `navigation.howto-confirm` already decides. The remembered title selection
# is likewise not read here: specs/ui.md makes the keyboard, the pointer and the
# contact one rule, so `titleIndex` is decided once, by the three
# `navigation.title-remembers-*` points.
#
# The mouse's own edges are the `pointer` category's points, and the keyboard's the
# `navigation` category's, not these.
[[review.categories]]
id = "touch"
title = "Touch"
[[review.categories.items]]
id = "landing-selects"
title = "A touch contact selects the item it lands on"
description = "On the title with menuIndex 0, a touch contact landing inside the region menuItemRect reports for HOW TO PLAY, and not lifted, sets menuIndex to 2."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: land a real touch contact in the region the build reports
# for the third title item, leave it down so no lift can confirm, and read
# menuIndex back. See validation/<engine>/touch/landing-selects.test.ts.
validation = { script = "touch/landing-selects.test.ts", outputs = [
  { id = "selected", name = "The title menu with the item the contact landed on selected", kind = "image" },
] }
[[review.categories.items]]
id = "tap-confirms"
title = "A contact that lifts where it landed confirms that item"
description = "On the title with menuIndex 0, a touch contact landing and lifting inside the region menuItemRect reports for HOW TO PLAY sets screen to howto."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: land and lift a real touch contact inside the third title
# item's reported region, with no key pressed, and read the screen it confirmed
# to. See validation/<engine>/touch/tap-confirms.test.ts.
validation = { script = "touch/tap-confirms.test.ts", outputs = [
  { id = "howto", name = "The how-to screen opened by a tap", kind = "image" },
] }
[[review.categories.items]]
id = "drag-cancels"
title = "A contact that lifts on a different item confirms nothing"
description = "On the title, a touch contact landing inside SOLO's region, travelling onto HOW TO PLAY's and lifting there leaves screen at title, with menuIndex 2."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: slide one real touch contact from the first title item to
# the third and lift it there — the screen must stay on the title, and the
# selection must have followed the finger, which is what says the contact was read
# at all. See validation/<engine>/touch/drag-cancels.test.ts.
validation = { script = "touch/drag-cancels.test.ts", outputs = [
  { id = "title", name = "The title still showing after the contact slid off", kind = "image" },
] }
[[review.categories.items]]
id = "pause-tap-confirms"
title = "A tap confirms an item on the pause menu"
description = "With a live Solo match paused, a touch contact landing and lifting inside the region menuItemRect reports for RESUME sets screen to resumeScreen."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: pause a live match, read the pause menu's first region back,
# land and lift one real contact inside it, and confirm the match resumed. This
# grades whether `paused` takes a finger at all, which the title points cannot say —
# a build that reaches its pause menu only through a key is a build a player on a
# tablet cannot leave. See validation/<engine>/touch/pause-tap-confirms.test.ts.
validation = { script = "touch/pause-tap-confirms.test.ts", outputs = [
  { id = "resumed", name = "The match resumed by a tap on RESUME", kind = "image" },
] }
[[review.categories.items]]
id = "matchover-tap-confirms"
title = "A tap confirms an item on the match-over screen"
description = "On the match-over screen, a touch contact landing and lifting inside the region menuItemRect reports for MENU returns to the title."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: POSE the match-over screen with `openMatchOver` — driving
# twenty-two real points would fail this menu point whenever the scoring was broken —
# read the second match-over region back, land and lift one real contact inside it,
# and confirm the title is showing. See validation/<engine>/touch/matchover-tap-confirms.test.ts.
validation = { script = "touch/matchover-tap-confirms.test.ts", outputs = [
  { id = "title", name = "The title reached by a tap on MENU", kind = "image" },
] }

# --- Visibility (sampled from the rendered canvas) ----------------------------
# Each point samples the pixels the build actually RENDERS at a known on-field
# location (a paddle center, an obstacle center, the ball) TWICE: once with the body
# standing there, and once with the field bare under it after the body has been
# taken off the field or moved away through the debug API. A body the build drew
# separates the two readings; one it never drew leaves them the same ground. Each
# sample is taken well inside the shape, because a rounded edge is anti-aliased.
# The palette itself is the build's, and how it looks is the reviewer's to rate.
#
# THE BALL IS THE EXCEPTION among these four caps, and it is deliberate. A paddle or
# an obstacle the build never drew is still findable: a paddle sits on a known edge
# and the player is the one driving it, and an obstacle sits where the field always
# puts it, so losing either is normal play made unpleasant (`scuffed`). A ball that
# is not drawn cannot be tracked, and tracking the ball is the whole of what a
# player does here, so that point is `broken` — the game cannot be played as
# intended at all.
[[review.categories]]
id = "visibility"
title = "Visibility"
[[review.categories.items]]
id = "left-paddle"
title = "The left paddle is drawn"
description = "On a posed field, the pixels at the left paddle's center differ from the pixels the same point holds once both paddles have moved off it."
domains = ["single-player", "versus"]
failure_cap = "scuffed"
# Automated validation: sample the rendered pixels at the left paddle's center, move
# both paddles to the top of their travel, and sample the same point again. See
# validation/<engine>/visibility/left-paddle.test.ts.
validation = { script = "visibility/left-paddle.test.ts", outputs = [
  { id = "scene", name = "The posed field showing the paddles and the obstacles", kind = "image" },
] }
[[review.categories.items]]
id = "right-paddle"
title = "The right paddle is drawn"
description = "On a posed field, the pixels at the right paddle's center differ from the pixels the same point holds once both paddles have moved off it."
domains = ["single-player", "versus"]
failure_cap = "scuffed"
# Automated validation: sample the rendered pixels at the right paddle's center, move
# both paddles to the top of their travel, and sample the same point again. See
# validation/<engine>/visibility/right-paddle.test.ts.
validation = { script = "visibility/right-paddle.test.ts", outputs = [
  { id = "scene", name = "The posed field showing the paddles and the obstacles", kind = "image" },
] }
[[review.categories.items]]
id = "obstacle"
title = "An obstacle is drawn"
description = "On a posed field, the pixels at an obstacle's center differ from the pixels the same point holds once the obstacles have been taken off the field."
domains = ["single-player", "versus"]
failure_cap = "scuffed"
# Automated validation: sample the rendered pixels at an obstacle's center, clear the
# obstacles off the field, and sample the same point again. See
# validation/<engine>/visibility/obstacle.test.ts.
validation = { script = "visibility/obstacle.test.ts", outputs = [
  { id = "scene", name = "The posed field showing the paddles and the obstacles", kind = "image" },
