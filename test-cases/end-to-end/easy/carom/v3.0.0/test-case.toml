domains = ["single-player", "versus"]
failure_cap = "scuffed"
# Automated validation: drive that one scenario three times under three clocks — a
# `ConstantClock` at a steady 120 Hz, a `SequenceClock` repeating an uneven pattern of
# deltas, and a seeded `JitterClock` — and compare the outcomes. Only facts that survive
# a legitimate change in step size are compared, never a position: the sharpest of
# them is the game time each drive took, read from the engine's own frame clock,
# because a build that advances per frame rather than per second traces the identical
# path and can only give itself away on the clock. See
# validation/<engine>/gameplay/delta-time-independent.test.ts.
