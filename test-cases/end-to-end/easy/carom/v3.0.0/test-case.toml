# --- UI -----------------------------------------------------------------------
# What is drawn and which screens are reachable. The rendering points assert SOME of
# the figures the specification fixes about drawing — the field's containment and
# scale, its letterboxing, and a trail behind a moving ball — and the screen points
# reach each screen, read back the copy the spec fixes for it, and capture it. How a
# screen looks is rated through the domains, not here.
#
# WHAT THE SPECIFICATION FIXES AND NOTHING HERE ASSERTS, said plainly so the gap is
# on the record: specs/overview.md's "Visual design" requires a dashed center net
# drawn at `x = NET_X` (640), a label naming the mode drawn somewhere on the field,
# and a field that is dark. None of the three is graded. The net and the label are
# decoration whose copy and styling the spec hands to the build, and darkness is a
# property of a palette the build chooses, so an assertion would be reading a hex
# value the case deliberately does not fix (see "Appearance is loose and reviewed"
# in the authoring guide). They reach the score through the reviewer's aesthetic
# rating instead, which is where a field drawn white or a missing net is judged.
#
# Two more of the same kind: the same "Visual design" list makes the bars around
# the field the field's background color, and the trail behind the ball its path
# over the last TRAIL_TIME seconds, so the streak's length follows the ball's
# speed. Neither is graded either. A check on the first reads a color the case
# fixes no value for, and a check on the second measures how far a drawn mark
# reaches, which are both appearance. What the two rendering points below assert is
# that nothing the game drew reaches the bars and that a ball in flight leaves the
# lane behind it painted, and the stills they capture are what the reviewer rates
# the look from.
#
# The FIT is two points rather than one, because the two failures cost different
# things. A field that is cropped, stretched, scaled differently on the two axes, or
# drawn somewhere other than where the fit puts it takes part of the playfield away
# from the player, distorts the geometry the whole game is written in, or moves what
# the player reaches for, so `window-fit` is `scuffed`. A field that spilled into the
# bars beside it leaves the game untouched entirely, so `window-fit-bars` is `great`.
#
# `window-fit` IS SCOPED TO `none`, because under an engine the fit is the engine's:
# it owns the canvas element, the uniform scale, the centering and the device pixel
# ratio, and every build on that engine draws in logical units and gets the same
# verdict. Under `none` the build derives the fit itself, which is where the point
# grades the model's own code. What the bars hold is every engine's, because a build
# that draws outside the fitted field reaches them under any runtime.
#
# The SCREEN points are split the same way and for the same reason: a build that
# draws its menu but no heading is not the same build as one that draws neither. The
# menu-item halves (`state-title-items`, `state-pause`, `state-matchover`) are
# `passable`, because a player who cannot see the entries is choosing between them
# blind; the copy halves (`state-title`, `state-matchover-score`) are `great`,
# because a title screen missing the word CAROM still reads as a menu and still
# works. `state-howto` stays `great` for a third reason: the how-to screen is an
# OPTIONAL path — nothing on it is needed to start, play or finish a match — so a
# build that draws it empty has left the standard flow of gameplay alone.
[[review.categories]]
id = "ui"
title = "UI"
[[review.categories.items]]
id = "window-fit"
title = "The whole field fits the surface at one scale"
description = "Over surfaces wider than the field, taller than it, and at a raised device pixel ratio, the whole 1280x720 field is inside the surface, its aspect ratio is preserved, and it is centered: one scale on both axes, nothing cropped, and each body drawn at the device coordinate the centered fit puts it at. The fit is read on the first frame, before any input."
domains = ["single-player", "versus"]
failure_cap = "scuffed"
# Automated validation: build the game over several differently-shaped surfaces, and
# over each one check the canvas the build sized against the surface and sample the
# field at the device coordinate the fit the SPECIFICATION states implies, so the
# point says the build DREW into that map rather than only computing it. Scoped to
# `none`, where the build derives the fit; under an engine the runtime owns it. See
# validation/none/rendering/window-fit.test.ts.
validation = { script = "rendering/window-fit.test.ts", engines = ["none"], outputs = [
  { id = "fit", name = "The whole field inside an off-aspect window", kind = "image" },
] }
[[review.categories.items]]
id = "window-fit-bars"
title = "The letterbox bars hold nothing the game drew"
description = "On a surface wider than the field, the pixels in the letterbox bars either side of the fitted field are unchanged between two poses of the same match that move every body on the field."
domains = ["single-player", "versus"]
failure_cap = "great"
# Automated validation: sample four device columns across the two bars over a posed
# scene, re-pose the field with the obstacles removed and the paddles at the top of
# their travel, and sample the same columns again. A field that spilled past its fit
# paints those columns with content that moved between the two poses. What color the
# bars carry is the reviewer's to rate. See
# validation/<engine>/rendering/window-fit-bars.test.ts.
validation = { script = "rendering/window-fit-bars.test.ts", outputs = [
  { id = "bars", name = "The letterbox bars beside the fitted field", kind = "image" },
] }
[[review.categories.items]]
id = "trail-length"
title = "A moving ball leaves a trail"
description = "Behind a ball in steady flight down an empty lane, the lane holds pixels the same lane did not hold before the ball entered it."
domains = ["single-player", "versus"]
failure_cap = "great"
# Automated validation: read the lane bare, drive the ball down it, and read the lane
# behind the ball again: a build that draws a trail changed it. How long the streak
