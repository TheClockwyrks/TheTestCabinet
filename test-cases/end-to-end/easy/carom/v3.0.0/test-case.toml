# --- Gameplay -----------------------------------------------------------------
[[review.categories]]
id = "gameplay"
title = "Gameplay"
# The serve, the hold and the points a match is decided by are NOT common. Every
# variant has all of them, but multi has them differently: a launch is drawn over
# the full circle and so has no direction or angle to check, a hold belongs to a
# ball rather than to the match, and a scored point takes one ball out of play
# instead of freezing the field and opening a countdown. A variant may only ADD to
# a common review item, never replace the validator behind one (see
# `merge_review_items` in the core), so `serve-*`, `countdown-length`,
# `scoring-p1`, `scoring-p2`, `match-win` and `deuce` live in `variants/base.toml`
# and `variants/gyre.toml`, and multi states its own in `variants/multi.toml`.
