# --- Navigation ---------------------------------------------------------------
# The menu state machine specs/ui.md fixes, one transition per point: every
# transition is driven by dispatching the real key at the engine's event target and
# read back from screen and menuIndex. The wrap points check both ends of the title
# menu, and `space-confirms` checks the second confirm binding.
#
# specs/ui.md gives MOVEMENT to all three menus that have more than one item, so
# each of them carries its own movement point: the title's two, the pause menu's,
# and the match-over screen's. They cap differently because the screens are reached
# differently. A title menu that cannot be moved leaves a player on `SOLO` with no
# way to reach the other two entries, and a pause menu that cannot be moved leaves
# them on `RESUME` with no way to restart or quit — both are normal play made
# unpleasant (`scuffed`). The match-over screen's two entries both lead somewhere
# usable, so being stuck on the first of them only costs a path (`passable`).
# Wrapping is checked once per menu shape rather than once per menu: the title's two
# wrap points cover a three-item menu at both ends, so the pause menu carries one
# wrap point and the two-item match-over screen carries none.
#
# The three `same-frame-*` points are the resolution specs/ui.md fixes at the end of
# its keyboard section. They are rules a build only has once it decides what
# to do when two edges land together, and a build that reads its edges in a
# different order plays the same until the frame two arrive at once — which is why
# each of them is its own point rather than a clause on the movement points above.
# All three cap at `passable`: the wrong item is selected or confirmed on the odd
# frame, and the menu is still usable.
