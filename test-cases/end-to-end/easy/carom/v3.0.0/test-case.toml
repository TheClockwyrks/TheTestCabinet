# --- Single Player Controls ---------------------------------------------------
# Solo: the human controls player one (the left paddle). Each control is driven by
# dispatching real keyboard events at the event target the engine listens on, so the
# engine's own action binding resolves the key exactly as it does in a browser, and
# the effect is read back from the game's state. (Solo play is rated on the
# single-player domain, which the reviewer scores separately from this checklist.)
#
# All four movement points cap at `scuffed`, and the reason is the mode rather than
# the key. specs/modes/single-player.md routes ALL FOUR movement actions to the one
# left paddle, so W/S and the arrows are duplicates of each other here and a build
# that wired up only one pair is still fully playable in Solo — which is why none of
# the four is `broken`. They are not `great` either: a player who reaches for the
# pair the build left out finds the paddle dead with nothing on screen telling them
# to try the other one, which is normal play made unpleasant. That is the line
# between these and `navigation.space-confirms`, where `Space` is a second key for
# an action `Enter` already raises on the menu the player is looking at. In Versus
# each of the four keys is a player's ONLY binding, so the same four points in the
# next category stay at `broken`.
[[review.categories]]
id = "controls-solo"
title = "Single Player Controls"
