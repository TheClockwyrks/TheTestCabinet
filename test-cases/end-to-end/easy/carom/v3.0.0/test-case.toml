# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`; see `docs/test-cases.md`.

# The case's stable identity, recorded in every run. It stays `pong` because runs
# published before the folder was renamed reference it.
slug = "pong"

# Human-readable display name for this test case.
name = "Carom"

# Relative difficulty of this case, surfaced on the site. Carom is one
# self-contained real-time loop — ball, paddles, spin, two obstacles, a light AI —
# with no subsystem big enough to need splitting out behind an interface, so easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "paddle", "physics"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A top-down paddle duel where the swing of a paddle puts spin on the ball, and \
two obstacles turn the open field into a bank-shot puzzle."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. Carom is an easy case, so 90 minutes is comfortably more than a
# healthy build needs while still catching a session that never terminates.
max_runtime_hours = 1.5

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine — and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Every variant offers the same two ways to play — Solo
# and Versus — and is rated on the same common `single-player` and `versus`
# domains (no variant adds a domain of its own); the variants differ only in the
# *rules of the game itself*, which apply equally to Solo and Versus. That
# difference is carried by the specs that branch on the selected variant:
# `specs/overview.md.hbs`, `specs/playfield.md.hbs` (the field, paddles, ball, and
# how the obstacles behave), `specs/balls.md.hbs` (how many balls there are and how
# each is launched), `specs/ui.md.hbs` (the screens and the cues),
# `specs/modes/single-player.md.hbs` (which ball the AI defends),
# `specs/state.md.hbs` (the obstacle clock and poses gyre's state carries, and
# multi's array of balls) and `specs/instrumentation.md.hbs` (gyre's
# `setObstacleClock`, and what a snapshot reports). They are rendered before they
# land, so each variant's seeded spec set reads as one self-contained game.
#   - base  — fixed, upright obstacles and a single ball served toward the
#             receiver. The reference build.
#   - gyre  — obstacles that sway and rotate, so the ball bounces off tilted,
#             oriented faces instead of axis-aligned ones.
#   - multi — three independent balls that collide with each other, each with its
#             own hold, its own launch at a random angle, and its own respawn onto
#             a field that never freezes.
# This list is a root key, so it must precede the first table header.
variants = [
  "variants/base.toml",
  "variants/gyre.toml",
  "variants/multi.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics; one of them also owns rendering, collision detection,
# and the gameplay framework the game is written inside. It is a *run dimension*,
# chosen per run alongside the model, the harness, and the variant, and recorded
# on the run; it is not a property of the game.
#
# Carom supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop, the input, the audio, the overlay
#                     and the `window.__carom` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around it (`src/constants.ts`, `src/main.ts`, and the
#                     `src/game.ts` the build writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes its
#                     game module: the levels, the game mode(s) that hold the
#                     match rules, the actors and the controllers that drive the
#                     paddles, and the debug surface its instance's `initialize`
#                     returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable
# differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`, so a
# later 1.x or 2.x from the host package store is accepted as it lands. Widening or
# moving a range means a new case version, so the pin is the statement that THIS
# spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to *this game* under it —
# which surfaces the build still supplies, Carom's touch layout, and Carom's cue
# names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, and an `index.html`
# holding the canvas. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     input, audio, diagnostics overlay and `window.__carom`
#                     surface, and every figure the specification fixes, from the
#                     specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`: the state, the debug surface its `initialize`
#                     returns beside that state, the three functions, and the
#                     `BACKGROUND` color `src/main.ts` hands the engine.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules: `src/constants.ts`
#                     (every figure this specification fixes plus the level
#                     names, the actor tags, the action bindings and the cue
#                     names, which a validator imports; the look is NOT among
#                     them) and `src/main.ts` (the browser entry). The build
#                     writes `src/game.ts`: the `GameDefinition` the engine
#                     drives — its levels, its game mode(s), its actors and the
#                     controllers that drive the paddles — the debug surface its
#                     instance's `initialize` returns, and the `BACKGROUND` color
#                     `src/main.ts` hands the engine.
#
# A variant may replace this whole table with one of its own, which gyre and multi
# both do: under each engine that seeds one, gyre's seeded `src/constants.ts`
# documents the obstacle centers as the base centers the live poses sway about,
# and multi's carries the home points, the ball count, the contact distance and
# the fifth cue. What a variant changes about the surface (gyre's
# `setObstacleClock` and obstacle poses, multi's balls addressed by index and
# reported as an array) is carried by the specs. The engineless project holds no
# game code for a variant to differ in, so every variant shares it. The seeded
# files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/base/simple-2d"
"structured-2d" = "workspaces/base/structured-2d"

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the
# build to commit a `package-lock.json`, so the validated build installs exactly
# what the deploy will. Both commands are required — there are no defaults, so
# every case states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded `workspace` ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken` and scores it zero,
# because code that does not compile is not reviewable. The other three are
# recorded and gate nothing — `test` additionally records the count and coverage
# the build's own suite reports, which is how a build that ships tests is told
# apart from one that ships none. Each is spelled `npx` rather than
# `npm run <script>` so the check is the case's own statement of what is run and
# does not depend on the model leaving the seeded scripts intact.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. The handle is required as soon as any review item declares a `validation`
# script, which they do below. It names the ENGINELESS contract: an engineless
# build writes the surface itself and installs it on `window.__carom`, so the
# handle is what a person opening the console of such a build finds. An engine run
# has no global at all — the build writes the surface, its `initialize` returns
# it, and a validator reads it back off `engine.debug`. What shape the surface's
# operations take is the engine's contract. Under `simple-2d` the engine holds the
# state by value and hands every reader a read-only view, so the surface is
# written in the shape of `update`: a pose takes the current state and returns the
# next, which a validator applies through `engine.apply`, and a reading takes the
# state and returns what it read, which a validator calls with `engine.state`.
# Under `structured-2d` the state lives in the framework objects the engine owns,
# so the surface's operations are methods on the live game: a pose takes only its
# own arguments and arranges the open world through the same systems play uses,
# and a reading takes nothing and returns plain data. The seeded specification documents
# the surface independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded.
#
# There is deliberately no `tick_hz`. It existed to tell the validation runtime what
# one stepped tick was worth, because a driver stepped the build's own fixed
# timestep through the debug API at a rate the manifest had to state. Nothing steps
# that way now: the engine mandates no timestep at all — it hands the game the real
# elapsed time of each frame — and a validator supplies its own clock object and
# calls `engine.advance(n)`, so the size of a step is stated in the validator that
# takes it and differs on purpose between suites (a steady clock, an uneven
# sequence, seeded jitter). A single case-wide rate could only get them wrong, and the
# key is optional precisely so a case whose build is clocked in real time omits it.
[instrumentation]
handle = "__carom"

# The specs: every one is seeded for EVERY variant of this case, at the `dest`
# path within the run workspace. The specification is decomposed by concern, and
# there is a single list — what a variant changes wholesale (the field with its
# obstacles, and the state and debug operations that go with them) is not a
# separate per-variant file but a branch inside a common spec, rendered for the
# selected variant before it lands (see below). Every seeded set thus asserts
# exactly one game — the overview and visual design, the field and obstacles, the
# balls/serving/physics, the menus/screens/scoring, the two ways to play (Solo and
# Versus, with their controls, HUD, and the AI), the game's state, and the
# debugging/automation surface — with no cross-variant language, because the
# branching resolves at seed time and the model never sees the alternative.
#
# There is no proof spec: the media a reviewer looks at is captured by this
# case's own validators from scenarios the case controls. The showcase spec below
# does ask the build for media, but as the game's own store-page presentation
# rather than as evidence any point is judged on.
#
# Every spec is an `.hbs` template, rendered before it lands, and two axes are
# branched on. `variant.slug` selects the obstacles the game has and how many balls
# ricochet between them: `specs/playfield.md.hbs` (fixed, upright obstacles vs. the
# gyre variant's swaying, rotating ones), `specs/balls.md.hbs` (one served ball vs.
# multi's three independent ones and their collisions), `specs/overview.md.hbs`,
# `specs/ui.md.hbs` (multi's fifth cue and its screens),
# `specs/modes/single-player.md.hbs` (which ball the AI defends),
# `specs/state.md.hbs` (the obstacle clock and poses gyre's state carries, and
# multi's `balls` array) and `specs/instrumentation.md.hbs` (gyre's
# `setObstacleClock` operation and the obstacle poses a snapshot reports, and how
# multi's operations address a ball by index).
# `engine.slug` selects what the build is handed and what it writes:
# `specs/overview.md.hbs`, `specs/state.md.hbs`, `specs/instrumentation.md.hbs`
# and `specs/showcase.md.hbs`. A spec's `dest` defaults to its `source` with a
# trailing `.hbs` stripped, so an `.md.hbs` source seeds to the same `.md` path.
[[spec]]
source = "specs/overview.md.hbs"

[[spec]]
source = "specs/playfield.md.hbs"

[[spec]]
source = "specs/balls.md.hbs"

[[spec]]
source = "specs/ui.md.hbs"

[[spec]]
source = "specs/modes/single-player.md.hbs"

[[spec]]
source = "specs/modes/versus.md.hbs"

# The shape of the game's state. Under `simple-2d` this is the `CaromState`
# contract the debug surface reads and poses and the validators read back, stated
# by the case rather than by the seeded `src/game.ts`, which holds the three stubs
# alone. Under `none` the build owns the shape and the debug surface is the
# only contract over it. It seeds to `specs/state.md`.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable core; an API to drive and inspect the game from code; and a read-only
# debug overlay. Seeded for every variant and framed as an ordinary developer
# affordance of the game. It branches on the engine for how the surface is reached
# (`window.__carom` under `none`, `engine.debug` under `simple-2d`) and on the
# variant for gyre's extra operation; it seeds to `specs/instrumentation.md`.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured (a gzipped recording from the engine's own draw-command
# recorder on an engine run, screenshots and a short clip under `none`); it seeds
# to `specs/showcase.md`.
# The sounds the game plays, when each plays, and how muting behaves. The events
# themselves belong to the files that define them; this one names the sound each
# makes. It branches on `engine.slug`, because an engine run plays a cue through
# the runtime's bus under the seeded `CUES` names while an engineless build writes
# the audio layer under them, and on `variant.slug` for multi's fifth cue.
[[spec]]
source = "specs/audio.md.hbs"

[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`: the specification fixes
# behavior, not appearance, so there is no visual target to seed or to score
# against. Every piece of evidence a reviewer sees comes from this case's
# validators, which pose each scenario against the game the build wrote and
# capture what it renders. The automated load check still runs.

# Scoring domains. A run is rated on each independently, and the run's overall
# rating is the WORST across them — a flawless single-player mode cannot mask a
# broken versus mode. Every case must declare at least one. This case is on the
# engine format, so it is validator-rated: each domain's FUNCTIONAL rating is
# decided by the validators behind the point checklist below (every point names
# the domains its failure lowers and how far — see `domains` / `failure_cap`
# there), and the reviewer's judgement lives in the separate AESTHETIC rating of
# each domain: the look, the polish, and the feel of each mode. The mode-specific
# control categories are named plainly so the checklist still reads by mode.
[[domain]]
id = "single-player"
name = "Single Player"
description = "Solo play: a human paddle against the computer-controlled opponent."

[[domain]]
id = "versus"
name = "Versus"
description = "Two-player local play: two human-controlled paddles, no AI."
# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare
# name grouping the points a reviewer grades — and each
# `[[review.categories.items]]` under it is one graded review item, worth one
# point (the default weight), so a category is worth the number of items it holds
# (no fractional scoring). A category carries no prose of its own; each review item
# states in `description` the claim its validator checks. Categories are common to
# every variant here; a point a variant changes lives in that variant's own file
# instead. The checklist is reporter-side material — never seeded into a run, so
# the model never sees it; each item restates a rule the seeded specification
# already states, and every threshold a validator asserts is derived from a figure
# or rule in the specs plus a numeric tolerance.
#
# EVERY point on this checklist carries a validation script, and every point is one
# observable behavior, so a build fails exactly the rule it breaks (a top-edge hit
# and a bottom-edge hit are two points, not one). Each script is a vitest suite
# under `validation/<engine>/<suite directory>/<item id>.test.ts`, and for most
# points the suite directory IS the point's category. Three groups deliberately sit
# elsewhere, and are named here so a reader following this manifest looks in the
# right directory: the `ui` category's window-fit and trail points are under
# `rendering/`, because they read what the build DREW rather than a screen it
# reached; multi's `gameplay`, `audio` and `multi-ball` points are all under
# `multi/`, so that variant's suites stand together; and gyre's are under `gyre/`.
#
# The `<engine>` level is the ENGINE the suite is written against — a validator
# speaks one engine's vocabulary, so this case, which supports three, ships one
# directory per engine: `validation/none/` drives the build in Chromium through
# `window.__carom`, and `validation/simple-2d/` and `validation/structured-2d/`
# each run in process against their vendored engine. The three are the same
# scenarios; only how they reach the build differs. The directory for the run's
# engine is what gets staged into the built workspace at `validation/`.
#
# A `simple-2d` suite imports the runtime and the build's own `src/game.ts`,
# constructs it over a headless canvas with a clock it scripts, poses the scenario
# by applying the poses of the surface `engine.debug` returns through
# `engine.apply`, and steps it with `advance`. It reads behavior back from
# `engine.state` (or the surface's `snapshot` over it), audio from the runtime's
# `cue:played` event, and drawing from the canvas — either the pixels or a
# recording proxy over the 2D context.
#
# A `structured-2d` suite imports the engine and the build's own `src/game.ts`,
# constructs the engine over a headless canvas with a clock it scripts, poses the
# scenario by calling the operations of the surface `engine.debug` returns — the
# value the build's instance built in `initialize` — which arrange the live world
# through the same systems play uses, and steps it with `engine.advance`. It
# reads behavior back from the surface's readings and `engine.world`, audio from
# the engine's `cue:played` event, and drawing from the canvas — either the
# pixels or the engine's own draw-command recorder.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. A `replay` output is a draw-command recording: the suite arms the
# runtime's recorder around the section the point is about — the contact, the
# point played out, the paddle held still while paused — and never around the
# arrangement that got there. An `image` output is a single captured frame. Both
# are evidence beside the verdict rather than any part of it: a point passes or
# fails on its assertions alone.
#
# Nothing on this checklist asks a reviewer to judge how a screen looks. Appearance
# is rated through the domains above; the rendering points here assert SOME of what
# the specification fixes about what is drawn — that the field is fitted, that the
# solid bodies are told apart by color, that the scores are drawn, that the trail
# has the length the spec gives it — and capture the frame as evidence. What the
# specification fixes and no point asserts is named in the `ui` category's comment
# below, so the gap is on the record rather than implied away.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers — a "(Solo)" point
# lowers only `single-player`, a "(Versus)" point only `versus`, and a point about
# the game both modes share lowers both. `failure_cap` is the highest functional
# rating those domains may reach while the point fails; each domain gets the LOWEST
# cap among its failing points, and a domain with no failing point is flawless. The
# caps are graded by how much of the game a failure takes away: `broken` where the
# game cannot be played at all (no debug surface, the game never advances, a paddle
# that cannot be moved, a match that cannot start, a point that never scores);
# `scuffed` where a rule the game is built on is noticeably wrong (a hit angle, a
# bounce, spin, the AI, the serve, the visibility of the bodies); `passable` where
# the fault is a tolerance, a ceiling, an edge case or a secondary path (a speed
# within a percentage, a clamp at a bound, a corner, a countdown, a menu detail, a
# cue); and `great` where it is a cosmetic detail (the trail, the copy on a screen,
# a second key for an action another key already raises on the same screen). No
# point caps at `flawless`: a failure always costs.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The build writes the surface and returns it from `initialize`, so this point
# checks both that every operation is there and that the state the build's
# `src/game.ts` declares actually backs it: every operation runs against a real
# game, and a snapshot reports the full documented shape with live values. Every
# other automated item poses its scenario through the same surface, so a state the
# build hollowed out or reshaped also shows up as those items failing to run — this
# point names the fault plainly and captures a live-match frame as proof the driven
# game is what was inspected.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "debug-api"
title = "Debug and automation API present"
description = "Every operation specs/instrumentation.md names is present as a function on the debug surface, each poses or reads the running game, and snapshot reports the full documented shape with current values."
domains = ["single-player", "versus"]
failure_cap = "broken"
# Automated validation: reflect that every required operation is installed as a
# function and that a snapshot reports the full documented shape, then capture the
# live match that was driven. See validation/<engine>/instrumentation/debug-api.test.ts.
validation = { script = "instrumentation/debug-api.test.ts", outputs = [
  { id = "state", name = "The driven in-game state", kind = "image" },
] }
# `menuItemRect` is the one reading whose CONTRACT has a negative half, and the
# point above only establishes that the operation is there and answers on a menu.
# specs/instrumentation.md fixes two DIFFERENT conditions under which it reports
# nothing, and a build that hands back a region anyway sends a pointer driver at a
# rectangle no item occupies. They are two edge cases rather than one, so they are
# two points: a screen that shows no menu at all, and a menu that is on screen
# answering for an index it has no item at. A build that answers `null` on the two
# screens and hands back a stale rect past the end of the title menu has one of the
# two right, and the split is what says so. `countdown` and `playing` share a
# validator because they are the SAME edge case read twice — a screen with no menu —
# in the same way.
[[review.categories.items]]
id = "menu-rect-null"
title = "menuItemRect reports no region on a screen with no menu"
description = "menuItemRect returns null on playing and on countdown, the two screens that show no menu."
domains = ["single-player", "versus"]
failure_cap = "great"
# Automated validation: ask for a region on the countdown and on a live match and
# confirm each answers null. The cap is `great` because the fault is invisible to a
# player: it costs a driver its certainty, not the game its flow. See
# validation/<engine>/instrumentation/menu-rect-null.test.ts.
validation = { script = "instrumentation/menu-rect-null.test.ts", outputs = [
  { id = "live", name = "The live match whose regions were asked for", kind = "image" },
] }
