] }
# Muting is the other half of the audio spec, and every cue point above only ever
# runs unmuted. `controls-solo.m` and `controls-versus.m` establish that the key flips
# the bit; this establishes what the bit is FOR, which specs/audio.md states as
# "muting silences the cues and changes nothing else". The bit is POSED with
# `setMuted` rather than pressed, so a build whose `m` binding is broken loses the
# two controls points and this one is still decided on its own merits. What "silent"
# is read from differs by project, exactly as the cue's name does: under `none` no
# audio source may start at all, which specs/audio.md states for an engineless build,
# and under an engine the cue the bus announces carries a gain of zero, because the
# engines express a mute as a silent play rather than as a play that did not happen.
[[review.categories.items]]
id = "muted-silences"
title = "Muting silences the cues"
description = "With muted set, a real paddle contact sounds nothing: no audible cue is produced on the frame of the contact or on any frame after it."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: pose the mute bit with `setMuted`, drive the same paddle
# contact `audio.paddle-hit` drives, and confirm nothing audible came out of it. A game that
# cannot be silenced is playable, so `passable`. See
# validation/<engine>/audio/muted-silences.test.ts.
validation = { script = "audio/muted-silences.test.ts", outputs = [
  { id = "muted", name = "The muted paddle hit that sounded nothing", kind = "replay" },
] }

# --- Showcase (read off the produced tree, not off the running game) ----------
# The showcase is the store-page presentation of the finished game: a
# player-facing description and an ordered carousel of captured media, shipped in
# a `showcase/` directory at the root of the produced repository, which
# `specs/showcase.md` defines. It is worth THREE points rather than one, because
# it is a deliverable of its own — a whole file of the specification, and the one
# piece of a run a person meets before they meet the game — where every other
# point on this checklist is one behavior of the game itself.
#
# Its cap is `great` all the same: a build that shipped no showcase plays exactly
# as well as one that did, so the miss costs the presentation and leaves the
# standard flow of gameplay untouched. The weight and the cap say different
# things on purpose — how much of the score the point carries, and how far a
# failure may drag the ratings down.
#
# ONE point, and it grades EXISTENCE alone. Whether the description reads like
# something a player would want to play, whether the carousel opens on the
# strongest view of live play, and whether the media is worth looking at is a
# reviewer's judgement, and belongs to the AESTHETIC half of the domains rather
# than to an assertion. The validator's whole verdict is that the two
# files are there and that the carousel points at a file that is there with them:
# not a dimension, not a byte of a picture, not a word of the prose.
#
# The script drives nothing. It reads the produced tree with `node:fs`, so one
# suite stands unchanged in all three engine directories and the point means the
# same thing whichever engine the run selected. What it hands back as evidence is
# a `.png` copied out of the build's own showcase, so a reviewer sees the picture
# the build chose to present its game with beside the verdict.
[[review.categories]]
id = "showcase"
title = "Showcase"
[[review.categories.items]]
id = "exists"
title = "The game ships its showcase"
description = "showcase/showcase.md and showcase/showcase.toml are present at the root of the produced repository, and at least one file the carousel names is present in showcase/."
weight = 3
domains = ["single-player", "versus"]
failure_cap = "great"
# Automated validation: read the produced tree, confirm the description and the
# carousel are both there, and confirm the carousel names a file present beside
# them; the still handed back is a `.png` copied out of the showcase itself.
# Nothing about the media is checked beyond its being there. See
# validation/<engine>/showcase/exists.test.ts.
validation = { script = "showcase/exists.test.ts", outputs = [
  { id = "carousel", name = "A screenshot from the build's showcase", kind = "image" },
] }
