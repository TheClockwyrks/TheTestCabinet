# --- Pointer ------------------------------------------------------------------
# specs/ui.md drives every menu screen with a mouse as well as with the keyboard,
# over item regions the BUILD lays out and reports through `menuItemRect`. The case
# fixes no menu geometry, so each point below asks the build where it put the item
# and drives the real pointer at the middle of that region: any layout passes, and
# a build that reports a region it does not answer on fails. The first three points
# are the three behaviors specs/ui.md gives the pointer — a move selects, a press
# and its release inside one item confirms that item, and two edges that fall in
# different items confirm nothing — and `outside-confirms-nothing` is the edge that
# falls in NO item, which the same sentence fixes and which a build that hit-tests
# by nearest item rather than by containment gets wrong.
#
# WHICH MENUS ARE GRADED, and why not all four. The handling is one piece of code,
# so those four behaviors are read once, on the title menu, where the entries
# confirm to screens a check reads straight off `screen`. What is NOT one piece of
# code is whether a screen is wired to it at all, and that is per screen: `paused`
# and `matchover` therefore carry a confirm point each, because a build whose pause
# menu is mouse-dead is a build a player cannot quit with the mouse they started the
# match with. `howto` carries none — its single item confirms to the title, which is
# exactly where `navigation.howto-confirm` already leaves it, so a fifth drive of the
# same handling would only ever fail beside the points above it.
#
# `same-frame-pointer-wins` is the one ORDERING rule specs/ui.md gives the pointer:
# the pointer and the contacts are read in the same input read as the keyboard and
# applied after its edges. The spec states it for "a pointer or touch selection"
# together, so it is one rule read once, with the pointer, rather than a matching
# point in the `touch` category.
#
# The REMEMBERED title selection (`titleIndex`) is not read here. specs/ui.md makes
# the three input routes one rule — confirming an item on the title menu sets
# `titleIndex` to that item's index, from the keyboard, from a pointer and from a
# touch contact alike — so it is decided once, through the keyboard, by the three
# `navigation.title-remembers-*` points, rather than three more times here and three
# more again under Touch.
#
# The keyboard's own edges are the `navigation` category's points, not these.
