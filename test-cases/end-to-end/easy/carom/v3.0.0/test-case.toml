# What is drawn, rather than how the game moves. The two rendering points assert the
# mechanically checkable half of a visual requirement — the field fitted and centered
# in its window, a trail of the right shape behind the ball — and the four game-state
# points reach each screen and capture it, so a reviewer sees the actual title,
# how-to, pause, and match-over screens beside the reference build's own. Every
# auto-verdict here is deliberately narrow: whether a screen reads and lays out well
# is left to the reviewer looking at the capture.
[[review.categories]]
id = "ui"
title = "UI"
[[review.categories.items]]
id = "window-fit"
title = "Window fit"
description = "The entire 1280x720 field stays visible, fitted, and centered at any window size, including on load before any input."
# Automated validation: build the game over several differently-shaped surfaces —
# wider than the field, taller than it, and at a raised device pixel ratio — and read
# the viewport the engine derived back: the whole field is inside the surface at each,
# the aspect ratio is preserved, and the letterboxing is even on both axes, with the
# first frame checked before anything has been driven. See
# validation/<engine>/rendering/window-fit.test.ts.
validation = { script = "rendering/window-fit.test.ts", outputs = [
  { id = "fit", name = "The field fitted and centered in an off-aspect window", kind = "image" },
] }
[[review.categories.items]]
id = "trail"
title = "Motion trail"
description = "The ball leaves a continuous, tapering motion trail — a smooth comet, not discrete dots — that curves with spin and stretches with speed."
# Automated validation: drive a rally, then read the frame the build drew: the pixels
# behind the ball are lit along its recent path and fade with distance from it,
# rather than being either bare field or a row of separated blobs, and the lit run is
# longer behind a fast ball than a slow one. Captured for a person to judge whether
# it actually reads as a comet. See validation/<engine>/rendering/trail.test.ts.
validation = { script = "rendering/trail.test.ts", outputs = [
  { id = "trail", name = "The trail behind a ball at speed", kind = "image" },
] }
[[review.categories.items]]
id = "state-title"
title = "Title / main menu"
description = "The title / main menu state is reachable and correct, with the menu rendered cleanly and navigable."
# Automated validation: reset to the title and capture it. See
# validation/<engine>/ui/state-title.test.ts.
validation = { script = "ui/state-title.test.ts", outputs = [
  { id = "title", name = "The title / main menu", kind = "image" },
] }
[[review.categories.items]]
id = "state-howto"
title = "How to play"
description = "The how-to-play state is reachable and correct."
# Automated validation: navigate the menu to How to Play and capture it. See
# validation/<engine>/ui/state-howto.test.ts.
validation = { script = "ui/state-howto.test.ts", outputs = [
  { id = "howto", name = "The how-to-play screen", kind = "image" },
] }
[[review.categories.items]]
id = "state-pause"
title = "Pause (resume/restart/quit)"
description = "The pause state is reachable and correct, offering resume, restart, and quit."
# Automated validation: pause a live match and capture the pause menu. See
# validation/<engine>/ui/state-pause.test.ts.
validation = { script = "ui/state-pause.test.ts", outputs = [
  { id = "pause", name = "The pause menu", kind = "image" },
] }
[[review.categories.items]]
id = "state-matchover"
title = "Match over (play again/menu)"
description = "The match-over state is reachable and correct, offering play again and menu."
# Automated validation: drive a real match to its end and capture the match-over
# screen. See validation/<engine>/ui/state-matchover.test.ts.
validation = { script = "ui/state-matchover.test.ts", outputs = [
  { id = "matchover", name = "The match-over screen", kind = "image" },
] }

# --- Audio (read from the engine's `cue:played` event) ------------------------
# Cues are the engine's: the game defines them and asks for them by name, and the
# engine broadcasts a `cue:played` event on the frame each one is asked for. A
# validator subscribes to that event before the game initializes and asserts on what
# arrived, so a cue is confirmed to fire on its event without an audio device, an
# unlock gesture, or anything to wait for. The exact sound is the model's own — only
# that the right cue fires at the right moment is scored. The muted-playback,
# never-fail-to-load, and silent-until-interaction properties are reviewed by a
# person from play.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "paddle-hit"
title = "Paddle-hit cue"
description = "A distinct short cue plays when the ball strikes a paddle."
# Automated validation: drive a real paddle contact and confirm the `paddle-hit` cue
# is played on that frame. See validation/<engine>/audio/paddle-hit.test.ts.
validation = { script = "audio/paddle-hit.test.ts", outputs = [
  { id = "hit", name = "The paddle hit whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "wall-bounce"
title = "Wall bounce cue"
description = "A distinct short cue plays when the ball bounces off the side wall of the playfield (the top or bottom edge)."
# Automated validation: fire the ball into a wall and confirm the `wall-bounce` cue
# is played on that frame. See validation/<engine>/audio/wall-bounce.test.ts.
validation = { script = "audio/wall-bounce.test.ts", outputs = [
  { id = "bounce", name = "The wall bounce whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "obstacle-bounce"
title = "Obstacle bounce cue"
description = "A distinct short cue plays when the ball bounces off a mid-field obstacle."
# Automated validation: fire the ball into an obstacle and confirm the
# `obstacle-bounce` cue is played on that frame. See
# validation/<engine>/audio/obstacle-bounce.test.ts.
validation = { script = "audio/obstacle-bounce.test.ts", outputs = [
  { id = "bounce", name = "The obstacle bounce whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "scoring"
title = "Scoring cue"
description = "A cue plays when a point is scored."
# Automated validation: drive a real point and confirm the `score` cue is played on
# that frame. See validation/<engine>/audio/scoring.test.ts.
validation = { script = "audio/scoring.test.ts", outputs = [
  { id = "score", name = "The scored point whose cue is checked", kind = "replay" },
] }
