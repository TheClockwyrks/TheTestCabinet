# --- Audio (read from the engine's `cue:played` event) ------------------------
# Cues are the engine's: the game defines them and asks for them by name, and the
# engine broadcasts a `cue:played` event on the frame each one is asked for. A
# validator subscribes to that event before the game initializes and asserts on what
# arrived, so a cue is confirmed to fire on its event without an audio device, an
# unlock gesture, or anything to wait for. Under `none` the cue's name is not
# observable from outside the build, so what is checked there is that a sound is
# emitted on the event's frame and on no frame before it. The sound itself is the
# build's, and is rated through the domains.
#
# THE WALL CUE HAS TWO TRIGGERS. specs/audio.md gives `wall-bounce` to the top and
# bottom walls AND to a paddle's end caps, so it is two points: `wall-bounce` for
# the wall and `end-cap` for the cap. They are two rather than one because a build
# that resolves an end cap like a wall in the physics and then forgets to sound it
# fails only the second, which is what says where to look.
#
# "ONCE ON THAT FRAME" IS NOT GRADED on the four single-ball cues, and that is a
# limit of the reading rather than an oversight. specs/audio.md requires each cue to
# play once on its frame however many sub-steps raised it, but under `none` the only
# thing observable from outside the build is that a sound started, and one build
# starting two identical blips in a frame is indistinguishable from one starting the
# blip it should have. Grading a count under the engines alone would mean a point
# that can only ever fail on two of the three, which is worse than a point the
# reviewer is left to settle by ear. Multi's `ball-bounce` states the clause because
# a pair meeting is one event across two balls and double-sounding it is the
# plausible failure there; even there it is the engine buses that answer the count,
# and its `none` suite reads the frame alone.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "paddle-hit"
title = "Paddle-hit cue"
description = "The paddle-hit cue plays on the frame the ball hits a paddle, and on no frame before it."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: drive a real paddle contact and confirm the `paddle-hit` cue
# is played on that frame. See validation/<engine>/audio/paddle-hit.test.ts.
validation = { script = "audio/paddle-hit.test.ts", outputs = [
  { id = "hit", name = "The paddle hit whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "wall-bounce"
title = "Wall bounce cue"
description = "The wall-bounce cue plays on the frame the ball bounces off the top or bottom wall, and on no frame before it."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: fire the ball into a wall and confirm the `wall-bounce` cue
# is played on that frame. See validation/<engine>/audio/wall-bounce.test.ts.
validation = { script = "audio/wall-bounce.test.ts", outputs = [
  { id = "bounce", name = "The wall bounce whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "end-cap"
title = "End-cap cue"
description = "The wall-bounce cue plays on the frame the ball reflects off a paddle's top or bottom end cap, and on no frame before it."
domains = ["single-player", "versus"]
failure_cap = "passable"
# Automated validation: fire the ball into a paddle's end cap across an otherwise
# empty field and confirm the `wall-bounce` cue is played on the frame the vertical
# velocity reverses. The physics of that reflection is `paddles.end-cap-top` and
