# --- Ball ---------------------------------------------------------------------
[[review.categories]]
id = "ball"
title = "Ball"
# The obstacle bounce is checked per face — each obstacle's left, right, top and
# bottom — so a build that reflects off only some faces fails exactly those. Those
# eight strike each face at its midpoint; `corner-graze` covers the ends of a face,
# where deciding WHICH face was hit is the hard part. Tunneling is checked per body
# kind at SPEED_CAP, and the wall bounce per wall.
#
# Three further rules of specs/balls.md's resolution are their own points, because
# they are the rules a build gets wrong by leaving them out rather than by getting
# them backwards. The directional guard — a component is reversed only when it
# points INTO the face — is stated twice and is therefore TWO points:
# `already-leaving-wall` for the wall rule's `vy < 0` condition and
# `already-leaving-cap` for step 4 of the rectangle rule, read on a paddle's end
# cap. They are different rules over different components with different
# resolutions, so a build that guards one and not the other is graded as such.
# `corner-tie` is the tie-break in step 2: when two depths are equal the earlier
# face in the order left, right, top, bottom wins, and a build that picks the other
# one sends the ball off at a wholly different heading.
[[review.categories.items]]
