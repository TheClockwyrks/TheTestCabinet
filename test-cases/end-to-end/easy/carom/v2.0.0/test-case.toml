slug = "pong"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`;
# see `docs/test-cases.md`.

# Human-readable display name for this test case.
name = "Carom"

# Relative difficulty of this case, surfaced on the site. Carom is one
# self-contained real-time loop — ball, paddles, spin, two obstacles, a light AI —
# with no subsystem big enough to need splitting out behind an interface, so easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "paddle", "physics"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A neon top-down paddle duel where the swing of a paddle puts spin on the ball, \
and two fixed obstacles turn the open field into a bank-shot puzzle."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. Carom is an easy case, so 90 minutes is comfortably more than a
# healthy build needs while still catching a session that never terminates.
max_runtime_hours = 1.5
# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency rather than a global the model has to know is
# preinstalled. A variant may override this with its own `workspace` directory;
# none of Carom's variants need to. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Every variant offers the same two ways to play — Solo
# and Versus — and is rated on the same common `single-player` and `versus`
# domains (no variant adds a domain of its own); the variants differ only in the
# *rules of the game itself*, which apply equally to Solo and Versus. That
# difference is carried by two per-variant spec files seeded to stable paths —
# `specs/obstacles.md` (how the obstacles behave) and `specs/balls.md` (how the
# balls are served) — so each variant's seeded spec set reads as one self-contained
# game. Each variant also supplies its own `title` menu reference (`gameplay` and
# `game-over` are common):
#   - base  — fixed, upright obstacles and a single ball served toward the
#             receiver. The reference build.
#   - multi — three independent balls, each its own contest: distinct centerline
#             spawns, per-ball countdowns, random-360deg launches, and ball-to-ball
#             collisions.
#   - gyre  — obstacles that sway and rotate, so the ball bounces off tilted,
#             oriented faces instead of axis-aligned ones.
# This list is a root key, so it must precede the first table header (`[build]`).
variants = [
  "variants/base.toml",
  "variants/multi.toml",
  "variants/gyre.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the
# build to commit a `package-lock.json`, so the validated build installs exactly
# what the deploy will. Both commands are required — there are no defaults, so
# every case states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named
# once here so a review item's `validation` driver (and the validator that runs it)
# knows which `window` global to drive. The seeded specification documents the same
# handle independently as an ordinary game debug feature (see specs/instrumentation.md);
# this entry is reporter-side and never seeded. It is required because review items
# below declare `validation` scripts.
[instrumentation]
handle = "__carom"
# The fixed simulation rate, in Hz. Carom's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation
# runtime uses to relate that exact stepping back to real time — one tick is
# 1/120 of a second, so a second of game time is 120 ticks. It must match the
# timestep the seeded `specs/physics.md` mandates.
tick_hz = 120

# Common specs: seeded for EVERY variant of this case, at the `dest` path within
# the run workspace. The specification is decomposed by concern so that the
# material that varies between variants can be seeded per variant. These seven
# files are always present, and they assert only what is invariant across the
# variants: the field, paddles, ball physics and the spin mechanic, the state
# machine and scoring, the two ways to play, and the debugging/automation surface.
# Anything a variant changes wholesale — the obstacles and the balls/serving — is
# deferred to `specs/obstacles.md` and `specs/balls.md`, which each variant seeds
# from its own file to those stable paths (see the variant files). A common spec
# never asserts a fact a variant overrides, so each variant's seeded set reads as
# one self-contained game with no cross-variant language.
#
# Most common specs are plain Markdown, seeded verbatim. The exception is
# `specs/instrumentation.md`, whose source is a `.hbs` template: a little of its
# wording (how many balls a snapshot reports, how `setBall`'s index is numbered)
# depends on the variant, so it is rendered with the selected variant before
# landing at its `dest` and reads correctly for one ball or three without naming
# the other. A spec's `dest` defaults to its `source` with a trailing `.hbs`
# stripped, so an `.md.hbs` source seeds to the same `.md` path.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/physics.md"

[[spec]]
source = "specs/flow.md"

[[spec]]
source = "specs/modes.md"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable core; a `window.__carom` API to drive and inspect the game from code;
# and a read-only debug overlay. Seeded for every variant and framed as an ordinary
# developer affordance of the game. Rendered from a `.hbs` template so its
# ball-count wording matches the selected variant; it seeds to `specs/instrumentation.md`.
[[spec]]
source = "specs/instrumentation.md.hbs"

# Proof of implementation: instructs the build to capture evidence (screenshots
# and a short clip) at the exact paths the `[[proof]]` entries below declare, so a
# reviewer can see what the build actually produced. The paths in this spec and in
# the `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl builds — the
# authored, correct games under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. References are not validated unless a `[[check]]` below
# names them. The `title` view is variant-specific (declared per variant above):
# every variant lists the same menu (`SOLO` / `VERSUS` / `HOW TO PLAY`), but each
# build poses its own rules in the dimmed field behind the menu (static vs. tilted
# obstacles, one ball vs. three). `gameplay` and `game-over` look the same in every
# variant, so they are common and are captured from the `base` build.
[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot or
# `.webm` clip to as evidence the feature works; `specs/proof.md` instructs the
# build to produce them at exactly these paths. Validation records whether each
# turned up (informational — a missing proof does not fail the run), and a reviewer
# pairs each with its expected reference (see the `review_item` links below). The
# media kind is inferred from the extension: `.png` is an image, `.webm` a video
# (the format Playwright records natively; the public gallery transcodes it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "Gameplay"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Match over"
dest = "proof/game-over.png"

[[proof]]
id = "rally"
name = "Rally clip"
dest = "proof/rally.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. A reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless single-player
# mode cannot mask a broken versus mode. Every case must declare at least one.
# These qualitative per-domain ratings are separate from the point checklist below,
# which is scored globally (the categories grammar attaches no domain to a point).
# The mode-specific control categories are named plainly so the checklist still
# reads by mode.
[[domain]]
id = "single-player"
name = "Single Player"
description = "Solo play: a human paddle against the computer-controlled opponent."

[[domain]]
id = "versus"
name = "Versus"
description = "Two-player local play: two human-controlled paddles, no AI."
# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare
# name grouping the points a reviewer grades — and each
# `[[review.categories.items]]` under it is one graded review item, worth one
# point (the default weight), so a category is worth the number of items it holds
# (no fractional scoring). A category carries no prose of its own; each review item
# states its own requirement in `description`. Categories are common to every
# variant here; a point a variant changes lives in that variant's own file
# instead. The checklist is reporter-side material — never seeded into a run, so
# the model never sees it; each item restates a requirement the seeded
# specification already states. An item with a `validation` script is decided
# automatically (the reviewer can override); one without is judged by a person.
# The points still judged by eye (no validation script) are the ball's motion trail
# and the UI window-fit point. Audio is now driven automatically too: the validator
# reads the Web Audio sources a build starts, so each cue is confirmed to fire on its
# event (the exact sound is still the model's own). The UI game states carry a
# validation script too, but only to reach and CAPTURE each screen through the debug
# API (its auto-verdict confirms the state is reachable); how each screen actually
# reads and lays out is still judged by eye from the capture.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The build must install the whole window.__carom debug and automation surface the
# specification mandates. Every other automated item drives that surface to pose its
# scenario, so a missing or malformed API also shows up as those items failing to run
# — this point names the fault plainly and captures a live-match frame as proof the
# driven game is what was inspected.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "debug-api"
title = "Debug and automation API present"
description = "The build exposes the whole window.__carom debug and automation API and the read-only debug overlay described in specs/instrumentation.md, backed by a deterministic, steppable core."
# Automated validation: reflect that every required operation is installed as a
# function and that a snapshot reports the full documented shape, then capture the
# live match that was driven. See validation/instrumentation/debug-api.mjs.
validation = { script = "validation/instrumentation/debug-api.mjs", outputs = [
  { id = "state", name = "The driven in-game state", kind = "image" },
] }

# --- Gameplay -----------------------------------------------------------------
[[review.categories]]
id = "gameplay"
title = "Gameplay"
# The ball serves at a fixed speed after a fixed pre-serve countdown.
[[review.categories.items]]
id = "serve-speed"
title = "Serve speed"
description = "A served ball leaves at the base serve speed of 520 px/s."
# Automated validation: start a fresh match, serve, and read the ball's launch speed
# (~520 px/s). See validation/gameplay/serve-speed.mjs.
validation = { script = "validation/gameplay/serve-speed.mjs", outputs = [
  { id = "serve", name = "A ball leaving at the serve speed", kind = "video" },
] }
[[review.categories.items]]
id = "countdown-length"
title = "Countdown length"
description = "The pre-serve countdown lasts a fixed 1.0 s at match start and after each point before the ball serves."
# Automated validation: start a match and step until the ball serves, confirming the
# hold lasts ~1.0 s (120 ticks at 120 Hz). See validation/gameplay/countdown-length.mjs.
validation = { script = "validation/gameplay/countdown-length.mjs", outputs = [
  { id = "countdown", name = "The pre-serve countdown running out", kind = "video" },
] }
# Scoring is checked per side — one point for each goal — so a build that scores on
# only one edge is caught rather than averaged away by the other.
[[review.categories.items]]
id = "scoring-p1"
title = "Player one scores past the right goal"
description = "A ball crossing the right goal edge scores a point for player one (the left player)."
# Automated validation: drive a real ball out the right goal and confirm player one's
# score increments and player two's does not. See validation/gameplay/scoring-p1.mjs.
validation = { script = "validation/gameplay/scoring-p1.mjs", outputs = [
  { id = "goal", name = "Player one scoring past the right goal", kind = "video" },
] }
[[review.categories.items]]
id = "scoring-p2"
title = "Player two scores past the left goal"
description = "A ball crossing the left goal edge scores a point for player two (the right player)."
# Automated validation: drive a real ball out the left goal and confirm player two's
# score increments and player one's does not. See validation/gameplay/scoring-p2.mjs.
validation = { script = "validation/gameplay/scoring-p2.mjs", outputs = [
  { id = "goal", name = "Player two scoring past the left goal", kind = "video" },
] }
[[review.categories.items]]
id = "match-win"
title = "Match win at 11, lead by 2"
description = "The match is first to 11 and must be won by two clear points."
# Automated validation: from 10-9, drive a real point across the goal to 11-9 and
# confirm the match ends with the correct winner and final score. See
# validation/gameplay/match-win.mjs.
validation = { script = "validation/gameplay/match-win.mjs", outputs = [
  { id = "game-over", name = "Match-over screen", kind = "image" },
] }
[[review.categories.items]]
id = "deuce"
title = "Deuce past 10-10"
description = "Any tie at or above 10-10 keeps playing until one player leads by two."
# Automated validation: from 10-10 a real point to 11-10 must NOT end the match, and
# a further point to 12-10 must. See validation/gameplay/deuce.mjs.
validation = { script = "validation/gameplay/deuce.mjs", outputs = [
  { id = "deuce", name = "The deciding deuce point", kind = "video" },
] }
# Pausing is checked around the pre-serve countdown: that it is allowed there (not
# only once the ball is in flight), and that the countdown freezes while paused
# rather than ticking away behind the pause menu.
[[review.categories.items]]
id = "pause-during-countdown"
title = "Pausing during the countdown"
description = "The game can be paused during the pre-serve countdown, not only once the ball is in play."
# Automated validation: start a match (which opens on the countdown) with injected
# keys, press a pause key there, and confirm the game pauses. See
# validation/gameplay/pause-countdown.mjs.
validation = { script = "validation/gameplay/pause-countdown.mjs", outputs = [
  { id = "paused", name = "Paused during the pre-serve countdown", kind = "image" },
] }
[[review.categories.items]]
id = "countdown-frozen"
title = "Countdown pauses with the game"
description = "While the game is paused the pre-serve countdown does not advance; it resumes where it left off rather than running out behind the pause menu."
# Automated validation: pause during the countdown, then let far more than the hold
# elapse in both simulation and real time — the game must stay paused with the ball
# still held, and resume back into the countdown. See
# validation/gameplay/countdown-paused.mjs.
validation = { script = "validation/gameplay/countdown-paused.mjs", outputs = [
  { id = "countdown", name = "The countdown frozen while paused", kind = "video" },
] }
# Beatable AI is checked as three separate points, all in Solo, each driving the real
# computer opponent (setAiControl, see specs/instrumentation.md) against a posed shot
# and reading whether it blocks it or the shot gets past. Together they bound the AI:
# competent enough to run down a reachable ball, but neither superhumanly fast nor
# predicting bank shots — so a person can beat it.
[[review.categories.items]]
id = "ai-intercepts"
title = "Beatable AI — runs down a reachable shot (Solo)"
description = "In Solo the AI is competent: a ball aimed to arrive a moderate distance from its paddle, within reach at its movement speed, is tracked down and blocked."
# Automated validation: drive the real AI against a shot ~200 px off its paddle's
# start — within its reach — and confirm it blocks it (player one does not score). See
# validation/gameplay/ai-intercepts.mjs.
validation = { script = "validation/gameplay/ai-intercepts.mjs", outputs = [
  { id = "block", name = "The AI running down and blocking a reachable shot", kind = "video" },
] }
[[review.categories.items]]
id = "ai-outrun"
title = "Beatable AI — a fast shot out of reach gets past (Solo)"
description = "In Solo the AI is clearly beatable and not superhuman: a fast shot placed well out of its reach — arriving before a paddle moving at its speed could cover the distance — gets past it and scores."
# Automated validation: drive the real AI against a fast, low-angle shot arriving far
# from its start and confirm the shot gets past it (player one scores) — an AI that
# moved faster than it should would block it. See validation/gameplay/ai-outrun.mjs.
validation = { script = "validation/gameplay/ai-outrun.mjs", outputs = [
  { id = "scored", name = "A fast shot outrunning the AI paddle", kind = "video" },
] }
[[review.categories.items]]
id = "ai-no-predict"
title = "Beatable AI — no bank-shot prediction (Solo)"
description = "In Solo the AI does not predict bank shots: a fast, steep shot that banks off a wall before arriving gets past it, because it tracks the ball itself rather than aiming at the ball's post-bounce destination."
# Automated validation: drive the real AI against a fast, steep shot that banks off a
# wall and confirm the shot gets past it (player one scores) — an AI that predicted
# the reflected destination, or moved too fast, would block it. See
# validation/gameplay/ai-no-predict.mjs.
validation = { script = "validation/gameplay/ai-no-predict.mjs", outputs = [
  { id = "scored", name = "A bank shot beating the AI paddle", kind = "video" },
] }

# --- Paddles ------------------------------------------------------------------
[[review.categories]]
id = "paddles"
title = "Paddles"
# Hit angle is checked as two separate points — a center (no-angle) hit and an
# extreme-edge (steep-angle) hit — so a paddle that returns everything straight, or
# everything at the same angle, fails the half it gets wrong rather than the whole.
[[review.categories.items]]
id = "hit-center"
title = "Hit angle — center returns straight"
description = "A center hit off a stationary paddle sends the ball straight across, with no vertical angle."
# Automated validation: read back the outgoing angle of a real stationary-paddle
# bounce at the paddle center (~0 deg). See validation/paddles/hit-center.mjs.
validation = { script = "validation/paddles/hit-center.mjs", outputs = [
  { id = "straight", name = "A straight center hit", kind = "video" },
] }
[[review.categories.items]]
id = "hit-edge"
title = "Hit angle — edge deflects steeply"
description = "An extreme-edge hit off a stationary paddle sends the ball off at a steep angle of about 55 degrees."
# Automated validation: read back the outgoing angle of a real stationary-paddle
# bounce at the extreme edge (~55 deg). See validation/paddles/hit-edge.mjs.
validation = { script = "validation/paddles/hit-edge.mjs", outputs = [
  { id = "deflection", name = "A steep edge deflection", kind = "video" },
] }
# Rally acceleration is checked as two separate points — that a hit speeds the ball
# up, and that the speed-up stops at a ceiling — so a build that never accelerates and
# one that accelerates without bound each fail the point they break.
[[review.categories.items]]
id = "rally-accelerates"
title = "Rally accelerates after each hit"
description = "Each paddle hit speeds the ball up slightly (about 1.04x), so a rally accelerates gradually hit by hit."
# Automated validation: drive a real straight rally and record the ball's speed after
# each paddle hit — the per-hit ratio is ~1.04 and the sequence never decreases while
# below the cap. See validation/paddles/rally-accelerates.mjs.
validation = { script = "validation/paddles/rally-accelerates.mjs", outputs = [
  { id = "acceleration", name = "A rally accelerating hit by hit", kind = "video" },
] }
[[review.categories.items]]
id = "rally-caps"
title = "Rally speed caps at the ceiling"
description = "The per-hit speed-up stops at a ceiling (980 px/s): the ball plateaus there and never exceeds it, however long the rally."
# Automated validation: drive a real straight rally to its ceiling and confirm the
# ball's speed plateaus at 980 and never exceeds it. See validation/paddles/rally-caps.mjs.
validation = { script = "validation/paddles/rally-caps.mjs", outputs = [
  { id = "ceiling", name = "A rally plateauing at the speed ceiling", kind = "video" },
] }

# --- Paddle Movement ----------------------------------------------------------
# How fast each paddle moves under each way it is controlled: the human paddle at
# 720 px/s in Solo and for both players in Versus, and the AI paddle at its own,
# deliberately slower speed. Each is driven the way it really moves — a held key for
# the human paddles, the real AI's chase for the opponent — and its rate is measured
# back.
[[review.categories]]
id = "paddle-movement"
title = "Paddle Movement"
[[review.categories.items]]
id = "speed-solo-player"
title = "Human paddle speed (Solo)"
description = "In Solo the human's paddle (left) moves at about 720 px/s while a movement key is held."
# Automated validation: hold a movement key and measure the left paddle's rate. See
# validation/paddle-movement/speed-solo-player.mjs.
validation = { script = "validation/paddle-movement/speed-solo-player.mjs", outputs = [
  { id = "move", name = "The human paddle moving at its speed (Solo)", kind = "video" },
] }
[[review.categories.items]]
id = "speed-solo-ai"
title = "AI paddle speed (Solo)"
description = "In Solo the AI's paddle (right) chases the ball at a competent rate that stays slower than the human's 720 px/s, so the opponent is beatable."
# Automated validation: hand the real AI its paddle, give it a ball to chase, and
# measure its rate (competent, under 720). See validation/paddle-movement/speed-solo-ai.mjs.
validation = { script = "validation/paddle-movement/speed-solo-ai.mjs", outputs = [
  { id = "move", name = "The AI paddle chasing at its speed", kind = "video" },
] }
[[review.categories.items]]
id = "speed-versus-p1"
title = "Player one paddle speed (Versus)"
description = "In Versus player one's paddle (left) moves at about 720 px/s while a movement key is held."
# Automated validation: hold a movement key and measure the left paddle's rate. See
# validation/paddle-movement/speed-versus-p1.mjs.
validation = { script = "validation/paddle-movement/speed-versus-p1.mjs", outputs = [
  { id = "move", name = "Player one's paddle moving at its speed (Versus)", kind = "video" },
] }
[[review.categories.items]]
id = "speed-versus-p2"
title = "Player two paddle speed (Versus)"
description = "In Versus player two's paddle (right) moves at about 720 px/s while a movement key is held."
# Automated validation: hold a movement key and measure the right paddle's rate. See
# validation/paddle-movement/speed-versus-p2.mjs.
validation = { script = "validation/paddle-movement/speed-versus-p2.mjs", outputs = [
  { id = "move", name = "Player two's paddle moving at its speed (Versus)", kind = "video" },
] }

# --- Ball ---------------------------------------------------------------------
[[review.categories]]
id = "ball"
title = "Ball"
# The motion-trail point lives under UI (it is judged by eye from the gameplay
# reference and proof, like the window-fit point); the points here each carry their
# own automated clip. The obstacle bounce is checked per face — each obstacle's left
# and right side — so a bank shot is proven to work from either direction off both
# obstacles, and a build that reflects off only one face is caught.
[[review.categories.items]]
id = "bounce-a-left"
title = "Bounces off obstacle A (left face)"
description = "The ball reflects off the left face of the near mid-field obstacle, enabling a bank shot from that side."
# Automated validation: fire a real shot at obstacle A's left face and confirm it
# reflects, staying on the near side. See validation/ball/bounce-a-left.mjs.
validation = { script = "validation/ball/bounce-a-left.mjs", outputs = [
  { id = "bank", name = "Bank shot off obstacle A's left face", kind = "video" },
] }
[[review.categories.items]]
id = "bounce-a-right"
title = "Bounces off obstacle A (right face)"
