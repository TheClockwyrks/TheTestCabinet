slug = "pong"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`;
# see `docs/test-cases.md`.

# Human-readable display name for this test case.
name = "Carom"

# Relative difficulty of this case, surfaced on the site. Carom is one
# self-contained real-time loop — ball, paddles, spin, two obstacles, a light AI —
# with no subsystem big enough to need splitting out behind an interface, so easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "paddle", "physics"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A neon top-down paddle duel where the swing of a paddle puts spin on the ball, \
and two fixed obstacles turn the open field into a bank-shot puzzle."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. Carom is an easy case, so 90 minutes is comfortably more than a
# healthy build needs while still catching a session that never terminates.
max_runtime_hours = 1.5
# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency rather than a global the model has to know is
# preinstalled. A variant may override this with its own `workspace` directory;
# none of Carom's variants need to. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Every variant offers the same two ways to play — Solo
# and Versus — and is rated on the same common `single-player` and `versus`
# domains (no variant adds a domain of its own); the variants differ only in the
# *rules of the game itself*, which apply equally to Solo and Versus. That
# difference is carried by two per-variant spec files seeded to stable paths —
# `specs/obstacles.md` (how the obstacles behave) and `specs/balls.md` (how the
# balls are served) — so each variant's seeded spec set reads as one self-contained
# game. Each variant also supplies its own `title` menu reference (`gameplay` and
# `game-over` are common):
#   - base  — fixed, upright obstacles and a single ball served toward the
#             receiver. The reference build.
#   - multi — three independent balls, each its own contest: distinct centerline
#             spawns, per-ball countdowns, random-360deg launches, and ball-to-ball
#             collisions.
#   - gyre  — obstacles that sway and rotate, so the ball bounces off tilted,
#             oriented faces instead of axis-aligned ones.
# This list is a root key, so it must precede the first table header (`[build]`).
variants = [
  "variants/base.toml",
  "variants/multi.toml",
  "variants/gyre.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the
# build to commit a `package-lock.json`, so the validated build installs exactly
# what the deploy will. Both commands are required — there are no defaults, so
# every case states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named
# once here so a review item's `validation` driver (and the validator that runs it)
# knows which `window` global to drive. The seeded specification documents the same
# handle independently as an ordinary game debug feature (see specs/instrumentation.md);
# this entry is reporter-side and never seeded. It is required because review items
# below declare `validation` scripts.
[instrumentation]
handle = "__carom"

# Common specs: seeded for EVERY variant of this case, at the `dest` path within
# the run workspace. The specification is decomposed by concern so that the
# material that varies between variants can be seeded per variant. These seven
# files are always present, and they assert only what is invariant across the
# variants: the field, paddles, ball physics and the spin mechanic, the state
# machine and scoring, the two ways to play, and the debugging/automation surface.
# Anything a variant changes — the obstacles
# and the balls/serving — is deferred to `specs/obstacles.md` and `specs/balls.md`,
# which each variant seeds from its own file to those stable paths (see the
# variant files). A common spec therefore never asserts a fact a variant overrides,
# so each variant's seeded set reads as one self-contained game with no
# cross-variant language.
#
# Every common spec is plain Markdown, seeded verbatim. (A `.hbs` source would be
# rendered with the selected variant before landing at its `dest`; no common spec
# needs that here, since none of their text varies by variant or version.)
# A spec's `dest` defaults to its `source` (with a trailing `.hbs` stripped), so
# these need only name the source they seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/physics.md"

[[spec]]
source = "specs/flow.md"

[[spec]]
source = "specs/modes.md"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable core; a `window.__carom` API to drive and inspect the game from code;
# and a read-only debug overlay. Seeded for every variant and framed as an
# ordinary developer affordance of the game.
[[spec]]
source = "specs/instrumentation.md"

# Proof of implementation: instructs the build to capture evidence (screenshots
# and a short clip) at the exact paths the `[[proof]]` entries below declare, so a
# reviewer can see what the build actually produced. The paths in this spec and in
# the `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup; the harness renders it to a screenshot that is seeded into the run as a
# visual target for the model. The reference source is rendered, then never
# seeded directly. References are not validated unless a `[[check]]` below names
# them. The `title` view is variant-specific (declared per variant above): every
# variant lists the same menu (`SOLO` / `VERSUS` / `HOW TO PLAY`), but each hints
# at its own rules in the dimmed field behind the menu (static vs. tilted
# obstacles, one ball vs. three). `gameplay` and `game-over` look the same in
# every variant, so they are common.
[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot or
# `.webm` clip to as evidence the feature works; `specs/proof.md` instructs the
# build to produce them at exactly these paths. Validation records whether each
# turned up (informational — a missing proof does not fail the run), and a reviewer
# pairs each with its expected reference (see the `review_item` links below). The
# media kind is inferred from the extension: `.png` is an image, `.webm` a video
# (the format Playwright records natively; the public gallery transcodes it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "Gameplay"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Match over"
dest = "proof/game-over.png"

[[proof]]
id = "rally"
name = "Rally clip"
dest = "proof/rally.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. A reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless single-player
# mode cannot mask a broken versus mode. Every case must declare at least one. The
# point checklist below is scored globally; an individual item may name a domain
# (`domain = "..."`) when it only applies to one mode, but most apply to both.
[[domain]]
id = "single-player"
name = "Single Player"
description = "Solo play: a human paddle against the computer-controlled opponent."

[[domain]]
id = "versus"
name = "Versus"
description = "Two-player local play: two human-controlled paddles, no AI."

# Reviewer checklist items, common to every variant. Each top-level item is a
# CATEGORY grouping the individual points a reviewer grades; every graded point
# is a `sub_item`, so `weight` is set to the number of sub-items and each point is
# worth exactly one whole point (no fractional scoring). Categories are common to
# every variant here; a point a variant changes lives in that variant's own file
# instead. Review items are reporter-side material: never seeded into a run, so the
# model never sees the checklist; each restates a requirement the seeded
# specification already states. A sub-item with a `validation` script is decided
# automatically (the reviewer can override); one without is judged by a person. The
# points explicitly NOT auto-validated (judged by eye) are the ball's motion trail,
# the beatable AI, and everything under UI and Audio.

# --- Gameplay -----------------------------------------------------------------
[[review_item]]
id = "gameplay"
title = "Gameplay"
text = """
Core match rules. A ball fully crossing a goal edge scores a point for the player \
on the opposite side. The match is first to 11 and must be won by 2 — at 10-10 (or \
any tie at/above 10) play continues until someone leads by two. In Solo the AI \
opponent tracks the ball competently but is clearly beatable: a well-placed or \
well-curved shot can get past it — it is not a perfect wall."""
weight = 4
[[review_item.sub_item]]
id = "scoring"
title = "Scores when a ball crosses a goal"
# Automated validation: drive a real ball out each goal edge and confirm the correct
# player's score increments. See validation/gameplay/scoring.mjs.
validation = { script = "validation/gameplay/scoring.mjs", outputs = [
  { id = "goal", name = "A ball crossing the goal", kind = "video" },
] }
[[review_item.sub_item]]
id = "match-win"
title = "Match win at 11, lead by 2"
# Automated validation: from 10-9, drive a real point across the goal to 11-9 and
# confirm the match ends with the correct winner and final score. See
# validation/gameplay/match-win.mjs.
validation = { script = "validation/gameplay/match-win.mjs", outputs = [
  { id = "game-over", name = "Match-over screen", kind = "image" },
] }
[[review_item.sub_item]]
id = "deuce"
title = "Deuce past 10-10"
# Automated validation: from 10-10 a real point to 11-10 must NOT end the match, and
# a further point to 12-10 must. See validation/gameplay/deuce.mjs.
validation = { script = "validation/gameplay/deuce.mjs" }
[[review_item.sub_item]]
id = "beatable-ai"
title = "Beatable AI (Solo)"

# --- Paddles ------------------------------------------------------------------
[[review_item]]
id = "paddles"
title = "Paddles"
text = """
How the paddles return the ball. Hitting the center of a stationary paddle sends \
the ball straight across; hitting the extreme top or bottom edge sends it off at a \
steep (~55-degree) angle. A normal paddle hit speeds the ball up only slightly \
(about 1.04x) up to a ceiling, so rallies accelerate gradually over several hits \
rather than jumping to full speed, and stop getting faster once they reach the \
ceiling."""
weight = 2
[[review_item.sub_item]]
id = "paddle-angle"
title = "Hit angle — center straight, edge steep"
# Automated validation: read back the outgoing angle of a real stationary-paddle
# bounce for both a center hit (~0 deg) and an extreme-edge hit (~55 deg). See
# validation/paddles/paddle-angle.mjs.
validation = { script = "validation/paddles/paddle-angle.mjs", outputs = [
  { id = "deflection", name = "A steep edge deflection", kind = "video" },
] }
[[review_item.sub_item]]
id = "rally"
title = "Rally acceleration"
# Automated validation: drive a real straight rally and record the ball's speed after
# each paddle hit — the per-hit ratio is ~1.04, non-decreasing, plateauing at 980.
# See validation/paddles/rally.mjs.
validation = { script = "validation/paddles/rally.mjs", outputs = [
  { id = "acceleration", name = "Rally accelerating to the ceiling", kind = "video" },
] }

# --- Ball ---------------------------------------------------------------------
[[review_item]]
id = "ball"
title = "Ball"
text = """
The ball leaves a continuous, tapering motion trail (a smooth comet, not discrete \
dots) that curves with spin and stretches as the ball speeds up, collapsing to \
nothing during the pre-serve hold. It bounces off both mid-field obstacles, \
enabling bank shots, and never tunnels through an obstacle, paddle, or wall even at \
high speed."""
weight = 3
# The gameplay reference and submitted gameplay proof are shared context for the
# eyeballed motion-trail point; the two obstacle points below carry their own clips.
reference = "gameplay"
proof = "gameplay"
[[review_item.sub_item]]
id = "trail"
title = "Motion trail"
[[review_item.sub_item]]
id = "bounces"
title = "Bounces off both obstacles"
# Automated validation: fire real shots at both obstacles — they reflect, enabling
# bank shots. See validation/ball/bounces.mjs.
validation = { script = "validation/ball/bounces.mjs", outputs = [
  { id = "bank", name = "Bank shot off an obstacle", kind = "video" },
] }
[[review_item.sub_item]]
id = "no-tunnel"
title = "Never tunnels through at high speed"
# Automated validation: fire real shots at an obstacle, a paddle, and a wall at
# ~6000 px/s — none tunnel through. See validation/ball/no-tunnel.mjs.
validation = { script = "validation/ball/no-tunnel.mjs", outputs = [
  { id = "fast", name = "High-speed rebound without tunneling", kind = "video" },
] }

# --- Spin ---------------------------------------------------------------------
[[review_item]]
id = "spin"
title = "Spin"
text = """
The spin mechanic. A stationary paddle imparts no new spin — including a paddle \
held against the top or bottom bound while the movement key is still held, which \
cannot move and so is stationary. A paddle swung as it strikes the ball curves the \
ball's flight (up vs. down curve it opposite ways). Imparted spin decays after the \
hit, straightening a curved shot out within roughly a couple of seconds."""
weight = 4
[[review_item.sub_item]]
id = "stationary"
title = "No spin from a stationary paddle"
# Automated validation: a real stationary-paddle contact imparts no spin, so the
# return stays straight. See validation/spin/stationary.mjs.
validation = { script = "validation/spin/stationary.mjs", outputs = [
  { id = "straight", name = "Straight return, no curve", kind = "video" },
] }
[[review_item.sub_item]]
id = "at-bound"
title = "No spin at the field bound"
# Automated validation: a paddle pinned at the bound while holding the key into it
# imparts no spin (its real velocity clamps to zero), while the same held key
# mid-field does. See validation/spin/at-bound.mjs.
validation = { script = "validation/spin/at-bound.mjs", outputs = [
  { id = "at-bound", name = "Straight return off a bound-pinned paddle", kind = "video" },
] }
[[review_item.sub_item]]
id = "moving"
title = "Paddle imparts spin while moving"
# Automated validation: real moving-paddle contacts impart significant spin, with up
# vs. down curving the ball opposite ways. See validation/spin/moving.mjs.
validation = { script = "validation/spin/moving.mjs", outputs = [
  { id = "curve", name = "Curved shot", kind = "video" },
] }
[[review_item.sub_item]]
id = "decay"
title = "Spin decays"
# Automated validation: impart real spin, then step the real simulation forward and
# confirm the spin falls to roughly half after one half-life and to a small fraction
# after ~2 s. See validation/spin/decay.mjs.
validation = { script = "validation/spin/decay.mjs", outputs = [
  { id = "decay", name = "A curved shot straightening out", kind = "video" },
] }

# --- Single Player Controls ---------------------------------------------------
# Solo: the human controls player one (the left paddle). Rolls up to the
# single-player domain. Each control is driven with injected keyboard input through
# the debug API (see specs/instrumentation.md) and its effect read back.
[[review_item]]
id = "controls-solo"
title = "Single Player Controls"
text = """
In Solo the human controls player one — the left paddle. Up/Down or W/S move that \
paddle, Esc or P pauses the match, and M toggles mute."""
weight = 7
domain = "single-player"
[[review_item.sub_item]]
id = "up"
title = "Up arrow moves the paddle"
validation = { script = "validation/controls-solo/up.mjs", outputs = [{ id = "move", name = "Paddle moving up", kind = "video" }] }
[[review_item.sub_item]]
id = "down"
title = "Down arrow moves the paddle"
validation = { script = "validation/controls-solo/down.mjs", outputs = [{ id = "move", name = "Paddle moving down", kind = "video" }] }
[[review_item.sub_item]]
id = "w"
title = "W moves the paddle"
validation = { script = "validation/controls-solo/w.mjs", outputs = [{ id = "move", name = "Paddle moving up", kind = "video" }] }
[[review_item.sub_item]]
id = "s"
title = "S moves the paddle"
validation = { script = "validation/controls-solo/s.mjs", outputs = [{ id = "move", name = "Paddle moving down", kind = "video" }] }
[[review_item.sub_item]]
id = "escape"
title = "Esc pauses"
validation = { script = "validation/controls-solo/escape.mjs", outputs = [{ id = "pause", name = "Pausing the match", kind = "video" }] }
[[review_item.sub_item]]
id = "p"
title = "P pauses"
validation = { script = "validation/controls-solo/p.mjs", outputs = [{ id = "pause", name = "Pausing the match", kind = "video" }] }
[[review_item.sub_item]]
id = "m"
title = "M toggles mute"
validation = { script = "validation/controls-solo/m.mjs" }

# --- Multi Player Controls ----------------------------------------------------
# Versus: player one drives the left paddle with W/S, player two the right paddle
# with Up/Down. Rolls up to the versus domain.
[[review_item]]
id = "controls-versus"
title = "Multi Player Controls"
text = """
In Versus, player one controls the left paddle with W/S and player two controls the \
right paddle with Up/Down. Either player pauses with Esc or P, and M toggles mute."""
weight = 7
domain = "versus"
[[review_item.sub_item]]
id = "up"
title = "Up arrow moves player two's paddle"
validation = { script = "validation/controls-versus/up.mjs", outputs = [{ id = "move", name = "Right paddle moving up", kind = "video" }] }
[[review_item.sub_item]]
id = "down"
title = "Down arrow moves player two's paddle"
validation = { script = "validation/controls-versus/down.mjs", outputs = [{ id = "move", name = "Right paddle moving down", kind = "video" }] }
[[review_item.sub_item]]
id = "w"
title = "W moves player one's paddle"
validation = { script = "validation/controls-versus/w.mjs", outputs = [{ id = "move", name = "Left paddle moving up", kind = "video" }] }
[[review_item.sub_item]]
id = "s"
title = "S moves player one's paddle"
validation = { script = "validation/controls-versus/s.mjs", outputs = [{ id = "move", name = "Left paddle moving down", kind = "video" }] }
[[review_item.sub_item]]
id = "escape"
title = "Esc pauses"
validation = { script = "validation/controls-versus/escape.mjs", outputs = [{ id = "pause", name = "Pausing the match", kind = "video" }] }
[[review_item.sub_item]]
id = "p"
title = "P pauses"
validation = { script = "validation/controls-versus/p.mjs", outputs = [{ id = "pause", name = "Pausing the match", kind = "video" }] }
[[review_item.sub_item]]
id = "m"
title = "M toggles mute"
validation = { script = "validation/controls-versus/m.mjs" }

# --- UI (judged by eye) -------------------------------------------------------
[[review_item]]
id = "ui"
title = "UI"
text = """
The entire 1280x720 field — both paddles, both scores, every menu item, and all \
four edges — stays visible, fitted, and centered at any window size, including on \
load before any input. Menus render cleanly, are navigable, and are free of visual \
bugs, with arrow indicators oriented correctly and not obscuring options. Every \
game state is reachable and behaves correctly: title menu, how-to-play, pause \
(resume/restart/quit), and match-over (play again/menu)."""
weight = 6
# The title reference and submitted title proof are shared context for these
# eyeballed points.
reference = "title"
proof = "title"
[[review_item.sub_item]]
id = "window-fit"
title = "Window fit"
[[review_item.sub_item]]
id = "menu-rendering"
title = "Menu rendering"
[[review_item.sub_item]]
id = "state-title"
title = "Title / main menu"
[[review_item.sub_item]]
id = "state-howto"
title = "How to play"
[[review_item.sub_item]]
id = "state-pause"
title = "Pause (resume/restart/quit)"
[[review_item.sub_item]]
id = "state-matchover"
title = "Match over (play again/menu)"

# --- Audio (judged by ear/eye) ------------------------------------------------
[[review_item]]
id = "audio"
title = "Audio"
text = """
Audio is required and synthesized with the Web Audio API (no audio files): distinct \
short blips, playable fully muted (a mute toggle is provided), never failing to run \
if audio cannot start, and silent until the player first interacts. Two cues to \
confirm: a paddle hit, and a wall or obstacle bounce."""
weight = 2
[[review_item.sub_item]]
id = "paddle-hit"
title = "Paddle-hit cue"
[[review_item.sub_item]]
id = "obstacle-hit"
title = "Wall / obstacle bounce cue"
