# Three independent balls, each played as its own contest. The change applies to
# both Solo and Versus, so multi is rated on the case's common `single-player` and
# `versus` domains — it adds no domain of its own.
slug = "multi"
name = "Multi-ball"
description = "Three independent balls at once — distinct spawns, per-ball respawns, and random launches."

# Same fixed, upright obstacles as base (`specs/obstacles.md`), but three
# independently-served balls replace the single ball at `specs/balls.md`.
spec = [
  { source = "specs/obstacles-static.md", dest = "specs/obstacles.md" },
  { source = "specs/balls-multi.md", dest = "specs/balls.md" },
]
reference = [{ view = "title", path = "reference/menu-multi.html" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's `links.playableBuild`. A bare directory path (resolved
# against the version folder) holding a buildable web project, built with this
# case's `[build]` install/build commands and deployed like a published run
# build via `tcab publish-reference`, then shown on the case's "Reference" tab.
# It is **never seeded into a run**. See base.toml for the fuller note.
reference_implementation = "reference-impl/multi"

# The distinctive requirements of this variant, grouped as one category worth a
# point per item. They apply to the whole game (both Solo and Versus). Note there
# is deliberately no serve-direction point here: multi launches every ball at a
# random angle. These are judged by eye — the multi variant's reference
# implementation is not yet ported to the debug API. The `format` is inherited from
# the case manifest (`[review] format = 2`).
[[review.categories]]
id = "multi-ball"
title = "Multi-ball"
[[review.categories.items]]
id = "three-balls"
title = "Three balls in play"
description = "Three balls are in play at once, each an independent contest with its own velocity and spin."
[[review.categories.items]]
id = "distinct-spawns"
title = "Distinct spawn points"
description = "Each ball has its own centerline home point rather than sharing one spawn."
[[review.categories.items]]
id = "independent-respawn"
title = "Independent respawn"
description = "A ball that leaves the field respawns on its own while the others keep playing."
[[review.categories.items]]
id = "random-launch"
title = "Random launch angle"
description = "Each ball launches in a random direction rather than a fixed serve."
[[review.categories.items]]
id = "ball-collision"
title = "Ball-to-ball collision"
description = "Balls collide elastically with each other, never passing through or merging."
