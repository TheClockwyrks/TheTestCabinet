# The obstacles sway and rotate, so the ball bounces off tilted, oriented faces.
# The change applies to both Solo and Versus, so gyre is rated on the case's
# common `single-player` and `versus` domains — it adds no domain of its own.
slug = "gyre"
name = "Gyre"
description = "The obstacles sway and rotate, so the ball bounces off tilted, oriented faces."

# Same single-ball serving as base (`specs/balls.md`), but the moving/rotating
# obstacles and their oriented collision replace the static ones at
# `specs/obstacles.md`.
spec = [
  { source = "specs/obstacles-gyre.md", dest = "specs/obstacles.md" },
  { source = "specs/balls-standard.md", dest = "specs/balls.md" },
]
reference = [{ view = "title", path = "reference/menu-gyre.html" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's `links.playableBuild`. A bare directory path (resolved
# against the version folder) holding a buildable web project, built with this
# case's `[build]` install/build commands and deployed like a published run
# build via `tcab publish-reference`, then shown on the case's "Reference" tab.
# It is **never seeded into a run**. See base.toml for the fuller note.
reference_implementation = "reference-impl/gyre"

# The gyre-specific category, worth one point per item. It applies to the whole
# game (both Solo and Versus). Its one point poses the obstacles at a chosen tilt (the
# debug API's setObstacleClock, which the gyre reference implementation exposes) and
# confirms the reflection tracks the tilt. The `format` is inherited from the case
# manifest (`[review] format = 2`).
[[review.categories]]
id = "gyre"
title = "Gyre"
[[review.categories.items]]
id = "oriented-bounce"
title = "Oriented bounces"
description = "The two obstacles sway vertically and rotate, and the ball bounces off their tilted faces at oriented angles that track each obstacle's current orientation rather than axis-aligned reflections."
# Automated validation: pose an obstacle upright then tilted ~45deg and fire the same
# horizontal shot — the tilted face deflects it well off-axis while the upright face
# returns it straight, proving the bounce tracks orientation. See
# validation/gyre/oriented-bounce.mjs.
validation = { script = "validation/gyre/oriented-bounce.mjs", outputs = [
  { id = "oriented", name = "A shot deflecting off a tilted obstacle", kind = "video" },
] }

# Gyre serves toward the receiver exactly as base does, so — like base — it adds the
# serve-direction point to the case's COMMON `gameplay` category (reusing its id) and
# drives the same shared serve-direction script, rather than declaring a point of its
# own. See base.toml for the fuller note on a variant extending a common category.
[[review.categories]]
id = "gameplay"
title = "Gameplay"
[[review.categories.items]]
id = "serve-direction"
title = "Serve direction"
description = "After a point the next serve travels toward the player who was just scored on (the receiver), and the very first serve of a match always travels toward player one."
validation = { script = "validation/gameplay/serve-direction.mjs", outputs = [
  { id = "serve", name = "First serve toward player one", kind = "video" },
] }
