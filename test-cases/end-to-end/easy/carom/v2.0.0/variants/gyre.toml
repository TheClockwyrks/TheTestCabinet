# The obstacles sway and rotate, so the ball bounces off tilted, oriented faces.
# The change applies to both Solo and Versus, so gyre is rated on the case's
# common `single-player` and `versus` domains — it adds no domain of its own.
slug = "gyre"
name = "Gyre"
description = "The obstacles sway and rotate, so the ball bounces off tilted, oriented faces."

# Same single-ball serving as base (`specs/balls.md`), but the moving/rotating
# obstacles and their oriented collision replace the static ones at
# `specs/obstacles.md`.
spec = [
  { source = "specs/obstacles-gyre.md", dest = "specs/obstacles.md" },
  { source = "specs/balls-standard.md", dest = "specs/balls.md" },
]
reference = [{ view = "title", path = "reference/menu-gyre.html" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's `links.playableBuild`. A bare directory path (resolved
# against the version folder) holding a buildable web project, built with this
# case's `[build]` install/build commands and deployed like a published run
# build via `tcab publish-reference`, then shown on the case's "Reference" tab.
# It is **never seeded into a run**. See base.toml for the fuller note.
reference_implementation = "reference-impl/gyre"

# The gyre-specific category, worth one point per sub-item. It applies to the whole
# game (both Solo and Versus), so it names no domain. The oriented-bounce point is
# judged by eye; serve direction (shared behavior with base, since gyre also serves
# toward the receiver) is auto-validated.
[[review_item]]
id = "gyre"
title = "Gyre"
text = "The two obstacles sway vertically and rotate, and the ball bounces off their tilted faces at oriented angles that track each obstacle's current orientation rather than axis-aligned reflections. Serves travel toward the receiver, as in the base game."
weight = 2
[[review_item.sub_item]]
id = "oriented-bounce"
title = "Oriented bounces"
[[review_item.sub_item]]
id = "serve-direction"
title = "Serve direction"
# Automated validation: gyre serves toward the receiver exactly as base does (shared
# behavior), so it
# runs the same shared serve-direction check. See validation/gyre/serve-direction.mjs.
validation = { script = "validation/gyre/serve-direction.mjs", outputs = [
  { id = "serve", name = "First serve toward player one", kind = "video" },
] }
