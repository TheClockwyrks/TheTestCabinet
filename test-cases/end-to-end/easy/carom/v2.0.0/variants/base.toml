# The default Carom variant: fixed, upright obstacles and a single ball served
# toward the receiver. Listed first in the case manifest's `variants`, so it is
# the default. Every path here resolves against the version folder, exactly like
# the main manifest.
slug = "base"
name = "Base"
description = "Fixed obstacles and a single ball — the reference game."

# The rules that vary between variants are seeded to stable paths that the common
# specs reference: `specs/obstacles.md` (fixed, upright, axis-aligned) and
# `specs/balls.md` (one ball, served toward the receiver). `dest` is given
# explicitly because the source name differs from the seeded path.
spec = [
  { source = "specs/obstacles-static.md", dest = "specs/obstacles.md" },
  { source = "specs/balls-standard.md", dest = "specs/balls.md" },
]

# Every variant lists the same menu; each `title` reference hints at its own rules
# in the dimmed field behind it. `gameplay` and `game-over` are common.
reference = [{ view = "title", path = "reference/menu-base.html" }]

# The authored, *correct* static build of this variant — the case-variant analogue
# of a run's `links.playableBuild`. It is a bare directory path (resolved against
# the version folder) holding a buildable web project; it is built out-of-band with
# this case's `[build]` install/build commands run from that directory (its static
# output landing in `dist/`, exactly like a run's build) and deployed like a
# published run build via `tcab publish-reference`, then shown on the case's
# "Reference" tab. It is **never seeded into a run** — handing a model the finished
# game would defeat the test — so it takes no part in this variant's seed set.
reference_implementation = "reference-impl/base"

# Serving is a variant-scoped category: base (and gyre) serve toward the receiver,
# so serve direction is checked here rather than in the case's common Gameplay
# category — multi serves at a random angle and so does not check it. One sub-item,
# so the category is worth one whole point.
[[review_item]]
id = "serving"
title = "Serving"
text = "After a point the next serve travels toward the player who was just scored on (the receiver), and the very first serve of a match always travels toward player one."
weight = 1
[[review_item.sub_item]]
id = "direction"
title = "Serve direction"
# Automated validation: launch real serves and read the ball's horizontal
# direction — the first serve of every match goes toward player one, and after a
# point the serve travels toward the player just scored on. See
# validation/serving/direction.mjs.
validation = { script = "validation/serving/direction.mjs", outputs = [
  { id = "serve", name = "First serve toward player one", kind = "video" },
] }
