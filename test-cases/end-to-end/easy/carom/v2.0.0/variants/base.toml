# The default Carom variant: fixed, upright obstacles and a single ball served
# toward the receiver. Listed first in the case manifest's `variants`, so it is
# the default. Every path here resolves against the version folder, exactly like
# the main manifest.
slug = "base"
name = "Base"
description = "Fixed obstacles and a single ball — the reference game."

# The rules that vary between variants live in the common `.hbs` specs
# (`specs/playfield.md.hbs`, `specs/balls.md.hbs`), which branch on this variant's
# slug when rendered: base gets the field with fixed, upright, axis-aligned
# obstacles, and one ball served toward the receiver. So base declares no `spec`
# of its own.

# Variant-specific reference: every variant lists the same menu, but this one is
# captured from THIS variant's reference-impl build and served as-is, so the dimmed
# field behind the menu shows this variant's own rules — here the fixed, upright
# obstacles and the single posed ball. `gameplay` and `game-over` are common (in
# test-case.toml).
reference = [{ view = "title", media = "reference/screenshots/base/title.png" }]

# The authored, *correct* static build of this variant — the case-variant analogue
# of a run's `links.playableBuild`. It is a bare directory path (resolved against
# the version folder) holding a buildable web project; it is built out-of-band with
# this case's `[build]` install/build commands run from that directory (its static
# output landing in `dist/`, exactly like a run's build) and deployed like a
# published run build via `tcab publish-reference`, then shown on the case's
# "Reference" tab. It is **never seeded into a run** — handing a model the finished
# game would defeat the test — so it takes no part in this variant's seed set.
reference_implementation = "reference-impl/base"

# Serve direction is a base/gyre concern that lives in the case's COMMON `gameplay`
# category: a variant may reuse a common category's id to add its own review items to
# it (see `merge_review_items` in the core), so base and gyre — which both serve
# toward the receiver — contribute these points to Gameplay, while multi (random-angle
# launches) simply adds nothing and they are absent for it. The `format` is inherited
# from the case manifest (`[review] format = 2`); a variant only adds
# `[[review.categories]]`.
#
# It is checked as three separate points — the very first serve of a match, and the
# serve after a point is scored on each player — so a build fails exactly the rule it
# breaks. base and gyre both serve toward the receiver, so both drive these same
# shared scripts.
[[review.categories]]
id = "gameplay"
title = "Gameplay"
[[review.categories.items]]
id = "serve-initial"
title = "Initial serve direction"
description = "The very first serve of a match always travels toward player one."
# Automated validation: start fresh matches and read the first serve's horizontal
# direction (toward player one). See validation/gameplay/serve-initial.mjs.
validation = { script = "validation/gameplay/serve-initial.mjs", outputs = [
  { id = "serve", name = "First serve toward player one", kind = "video" },
] }
[[review.categories.items]]
id = "serve-after-p1"
title = "Serve after scoring on player one"
description = "After a point is scored on player one (player two scores), the next serve travels toward player one, the receiver."
# Automated validation: drive a real point out the left goal, then read the next
# serve's horizontal direction (toward player one). See
# validation/gameplay/serve-after-p1.mjs.
validation = { script = "validation/gameplay/serve-after-p1.mjs", outputs = [
  { id = "serve", name = "Serve toward player one after a point on player one", kind = "video" },
] }
[[review.categories.items]]
id = "serve-after-p2"
title = "Serve after scoring on player two"
description = "After a point is scored on player two (player one scores), the next serve travels toward player two, the receiver."
# Automated validation: drive a real point out the right goal, then read the next
# serve's horizontal direction (toward player two). See
# validation/gameplay/serve-after-p2.mjs.
validation = { script = "validation/gameplay/serve-after-p2.mjs", outputs = [
  { id = "serve", name = "Serve toward player two after a point on player two", kind = "video" },
] }
