<!DOCTYPE html>
<!--
  Carom — title / main menu reference mockup for the `multi` variant.
  Canonical view slug: title
  Lists SOLO / VERSUS / HOW TO PLAY, the same menu as every variant. Three dimmed
  balls sit at their home points on the centerline (25% / 50% / 75% of the field
  height) to hint at the multi variant's three-ball play.
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Title / main menu)
  and ../specs/balls.md (the multi variant seeds balls-multi.md here).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Carom — Title</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Dimmed gameplay furniture behind the menu. Three balls sit at their
           home points on the centerline (25% / 50% / 75% of field height) to
           convey the multi variant's three-ball play. -->
      <div class="net dim"></div>
      <div class="paddle player dim" style="left: 48px; top: 250px"></div>
      <div class="paddle opponent dim" style="left: 1216px; top: 380px"></div>
      <div class="obstacle dim" style="left: 480px; top: 150px"></div>
      <div class="obstacle dim" style="left: 780px; top: 430px"></div>
      <div class="ball dim" style="left: 629px; top: 169px"></div>
      <div class="ball dim" style="left: 629px; top: 349px"></div>
      <div class="ball dim" style="left: 629px; top: 529px"></div>

      <div class="center">
        <h1 class="title">CAROM</h1>
        <div class="tagline">NEON PADDLE DUEL</div>
        <nav class="menu">
          <div class="menu-item selected">SOLO</div>
          <div class="menu-item">VERSUS</div>
          <div class="menu-item">MULTI</div>
          <div class="menu-item">HOW TO PLAY</div>
        </nav>
      </div>

      <div class="hint">&#9650; &#9660; MOVE &nbsp;&nbsp; ENTER SELECT</div>
    </div>
  </body>
</html>
