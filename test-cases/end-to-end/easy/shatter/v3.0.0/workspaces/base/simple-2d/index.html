<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shatter</title>
    <!--
      An inline, empty icon: without one Chromium requests /favicon.ico on its
      own, and the dev server answers 404 — a console error a build did not
      cause, that the validators would otherwise hold against it.
    -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /*
        The canvas simply fills the window. The engine fits the fixed 1280x720
        logical field inside it — the uniform scale, the centred letterbox, and
        the device pixel ratio — so there is no sizing code here or in the game.
      */
      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
