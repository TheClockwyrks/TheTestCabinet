# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity, recorded in every run.
slug = "shatter"

# Human-readable display name for this test case.
name = "Shatter"

# Relative difficulty of this case, surfaced on the site. Shatter is one
# self-contained real-time loop — inertial flight, one gravity law applied to
# every ballistic body, rocks that split, escalating waves, a saucer that hunts —
# with no subsystem big enough to need splitting out behind an interface, so easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "space", "shooter", "physics"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A rock shooter built around a central gravity well: the star at the middle of \
the field pulls every rock and every shot, so bullets bend as they cross the \
centre and rocks churn on curved, wrapping paths, while your ship flies free of \
the pull."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version. The site aggregates every
# version's entry, newest first, into the case's changelog. Like `description`,
# it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. It rises from v2.x's 2.5 because an engineless run now writes the
# whole runtime layer beneath the game as well — the frame loop, the canvas fit,
# the keyboard, the audio and the overlay — and four hours is comfortably more
# than a healthy build of that size needs while still catching a session that
# never terminates.
max_runtime_hours = 4

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine — and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Both variants are the same single game, rated on the
# same four domains; what `warhead` changes is the rules of the game itself, and
# that difference is carried by the specs that branch on the selected variant
# (`specs/overview.md.hbs`, `specs/gravity.md.hbs`, `specs/weapons.md.hbs`,
# `specs/rocks.md.hbs`, `specs/collision.md.hbs`, `specs/controls.md.hbs`,
# `specs/ui.md.hbs`, `specs/state.md.hbs` and `specs/instrumentation.md.hbs`).
# They are rendered before they land, so each variant's seeded spec set reads as
# one self-contained game and no seeded text ever names the sibling variant.
#   - base    — the endless arcade game: a rock is destroyed by a single hit and
#               the ship carries only its gun. The reference build.
#   - warhead — the same game with ARMORED rocks (a rock carries health, so a
#               Large takes three hits) and a homing TORPEDO: one guided munition
#               on a ten-second recharge that flies true through the well and
#               destroys any rock outright, blasting its fragments outward far
#               harder than the gun does.
# This list is a root key, so it must precede the first table header.
variants = [
  "variants/base.toml",
  "variants/warhead.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics; one of them also owns rendering, collision detection, and
# the gameplay framework the game is written inside. It is a *run dimension*,
# chosen per run alongside the model, the harness, and the variant, and recorded
# on the run; it is not a property of the game.
#
# Shatter supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop and its fixed-step accumulator, the
#                     canvas fit, the keyboard, the audio, the overlay and the
#                     `window.__shatter` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around it (`src/constants.ts`, `src/main.ts`, and the
#                     `src/game.ts` stub the build replaces, debug surface
#                     included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes its
#                     game module: the level, the game mode that holds the run,
#                     the actors and components the field is drawn by, and the
#                     debug surface its instance's `initialize` returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable
# differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, and an `index.html`
# holding the canvas. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop and fixed-step
#                     accumulator, canvas fit, input, audio, diagnostics overlay
#                     and `window.__shatter` surface, and every figure the
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`: the state, the debug surface its `initialize`
#                     returns beside that state, the three functions, and the
#                     `BACKGROUND` color `src/main.ts` hands the engine.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules. `src/game.ts` is
#                     deliberately ABSENT: `src/main.ts` imports it, so
#                     `npx tsc --noEmit` on a freshly seeded workspace fails on the
#                     missing module, and that failure is the starting point.
#
# This table is the BASE variant's; `variants/warhead.toml` replaces it wholesale
# with one of its own, because the seeded `src/constants.ts` under each engine
# differs — warhead's carries the Armor and Torpedo groups and binds `b` to
# `KeyF`. The engineless project holds no game code for a variant to differ in, so
# both variants share it, and what warhead changes about the game is carried by
# the specs, which are rendered per variant before they land. The seeded files
# land at the run root (`workspaces/none/package.json` seeds to `package.json`).
#
# There is no `assets` key anywhere in this manifest: Shatter seeds no art, and
# every body on the field is drawn in code.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/base/simple-2d"
"structured-2d" = "workspaces/base/structured-2d"

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the
# build to commit a `package-lock.json`, so the validated build installs exactly
# what the deploy will. Both commands are required — there are no defaults, so
# every case states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`),
# so what is checked here is the code the model wrote against configuration the
# case fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken` and scores it zero,
# because code that does not compile is not reviewable. The other three are
# recorded and gate nothing — `test` additionally records the count and coverage
# the build's own suite reports, which is how a build that ships tests is told
# apart from one that ships none. Each is spelled `npx` rather than
# `npm run <script>` so the check is the case's own statement of what is run and
# does not depend on the model leaving the seeded scripts intact.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. The handle is required as soon as any review item declares a `validation`
# script, which every one of them does below. It names the ENGINELESS contract: an
# engineless build writes the surface itself and installs it on
# `window.__shatter`, so the handle is what a person opening the console of such a
# build finds. An engine run has no global at all — the build writes the surface,
# its `initialize` returns it, and a validator reads it back off `engine.debug`.
# What shape the surface's operations take is the engine's contract: under
# `simple-2d` a pose takes the current state and returns the next (driven through
# `engine.apply`) and a reading takes the state and returns what it read; under
# `structured-2d` a pose takes only its own arguments and arranges the live world,
# and a reading takes nothing and returns plain data. The seeded specification
# documents the surface independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded.
#
# There is deliberately no `tick_hz`. The key has two live roles: it is the rate
# the `--tick-hz` flag on the `browser::drive_script` path hands a driver stepping
# a build's own fixed timestep, and under an engine it is the default step a
# scripted engine clock takes. Shatter's three suites are vitest projects that
# each construct `ConstantClock(TICK_MS)` explicitly and never go through
# `browser::drive_script`, so neither role has anything to do here. Read the
# omission as "nothing in this case reads it", not as "nothing steps in ticks":
# Shatter's engineless surface does step in whole ticks, and its own fixed step —
# TICK_HZ, 120 — is a rule of the GAME stated in specs/simulation.md and asserted
# by instrumentation/advance-is-exact, not a property of the harness driving it.
[instrumentation]
handle = "__shatter"

# The specs: every one is seeded for EVERY variant of this case, at the `dest`
# path within the run workspace. The specification is decomposed by concern —
# seventeen files, each name predicting its contents, each rule living in exactly
# one of them — and there is a single list: what a variant changes is not a
# separate per-variant file but a branch inside a common spec, rendered for the
# selected variant before it lands. Every seeded set thus asserts exactly one
# game, with no cross-variant language, because the branching resolves at seed
# time and the model never sees the alternative.
#
# There is no proof spec: the media a reviewer looks at is captured by this case's
# own validators, from scenarios the case controls. The showcase spec below does
# ask the build for media, but as the game's own store-page presentation rather
# than as evidence any point is judged on.
#
# Every spec is an `.hbs` template where it branches and a plain `.md` where it
# does not, and two axes are branched on. `engine.slug` selects what the build is
# handed and what it writes; `variant.slug` selects the armor and the torpedo. A
# spec's `dest` defaults to its `source` with a trailing `.hbs` stripped, so an
# `.md.hbs` source seeds to the same `.md` path.
#
# What the specs deliberately do NOT fix is the look. No palette, no typeface and
# no HUD layout figure is seeded, stated or validated: appearance is loose and
# reviewed, `specs/overview.md` carries a legibility table asking only that each body is
# present and told apart from the rest, and the `presentation` items below assert an RGB
# distance out of 441 rather than a hex value.

# What the game is and what the finished build must be: the premise, the hard
# requirements, the fixed 1280x720 field and its centre convention, the field-fit
# requirement, that the field is drawn dark, and the legibility table.
[[spec]]
source = "specs/overview.md.hbs"

# The arena: the field, the wrap on both axes, the seam, and the star fixed at the
# centre with its solid core and decorative halo.
[[spec]]
source = "specs/field.md"

# The well: the pull law, the softening radius, which bodies are pulled and which
# are powered and never touched.
[[spec]]
source = "specs/gravity.md.hbs"

# The core the whole game advances on: the fixed timestep, the per-tick order, and
# seeded randomness.
[[spec]]
source = "specs/simulation.md.hbs"

# The ship the player flies: geometry, turn rate, thrust, drag, the speed cap, and
# the safe point.
[[spec]]
source = "specs/ship.md"

# What the ship shoots: the gun under both variants, and warhead's torpedo.
[[spec]]
source = "specs/weapons.md.hbs"

# The drifting rocks: the three sizes, the split ladder, star recycling, and —
# under warhead — armor.
[[spec]]
source = "specs/rocks.md.hbs"

# The enemy saucer: its cadence, its movement, its steering clear of the core, and
# its aimed fire.
[[spec]]
source = "specs/saucer.md"

# Every impact and what it does, including both fragment kicks and the
# swept-or-continuous requirement.
[[spec]]
source = "specs/collision.md.hbs"

# The run: lives, respawn, the grace window, and the wave loop.
[[spec]]
source = "specs/progression.md"

# Every score figure, and the extra ship. It branches on the variant so that only
# warhead is told a hit can leave a rock standing.
[[spec]]
source = "specs/scoring.md.hbs"

# The keys: every action the game answers to and what is bound to it.
[[spec]]
source = "specs/controls.md.hbs"

# The five screens, their menus, the HUD, and the wave banner.
[[spec]]
source = "specs/ui.md.hbs"

# The six audio cues, the mute toggle, and the requirement that the game runs
# whether or not audio does.
[[spec]]
source = "specs/audio.md.hbs"

# The shape of the game's state. Under `simple-2d` this is the `ShatterState`
# contract the debug surface reads and poses and the validators read back, stated
# by the case rather than by the seeded `src/game.ts`; under `structured-2d` it is
# the equivalent live class extending the engine's `GameState`; under `none` the
# build owns the shape and the debug surface is the only contract over it.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable core; an API to drive and inspect the game from code; and a read-only
# debug overlay. Framed as an ordinary developer affordance of the game. It
# branches on the engine for how the surface is reached and what shape its
# operations take, and on the variant for the torpedo operations.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`: the specification fixes
# behavior, not appearance, so there is no visual target to seed or to score
# against. v2.x seeded three rendered mockups and an eleven-entry palette, and
# every `color/*` validator asserted a hex value; none of that survives this major
# bump. Every piece of evidence a reviewer sees now comes from this case's
# validators, which pose each scenario against the game the build wrote and
# capture what it renders. The automated load check still runs.

# Scoring domains. A run is rated on each independently, and the run's overall
# rating is the WORST across them — a flawless gravity well cannot mask a ship
# that will not turn. Every case must declare at least one. This case is on the
# engine format, so it is validator-rated: each domain's FUNCTIONAL rating is
# decided by the validators behind the point checklist below (every point names
# the domains its failure lowers and how far — see `domains` / `failure_cap`
# there), and the reviewer's judgement lives in the separate AESTHETIC rating of
# each domain. Every warhead point rolls up to one of these four; the variant
# declares no domain of its own.
[[domain]]
id = "gravity"
name = "Gravity & the Star"
description = "The signature: the inverse-square pull on every ballistic body, the powered craft it never touches, and the solid core that deflects the ship, absorbs a shot and recycles a rock."

[[domain]]
id = "flight"
name = "The Ship"
description = "The ship the player flies: rotation, thrust, drag and the speed cap, the wrap it carries its velocity through, the gun it fires, and the lives, respawn and grace window around it."

[[domain]]
id = "arcade"
name = "Rocks, Saucer & Waves"
description = "The board the ship flies in: the rocks and how they split and recycle, the escalating waves, the saucer that hunts and fires, and the score."

[[domain]]
id = "presentation"
name = "Presentation"
description = "What the game looks and sounds like: the five screens and their menus, the HUD, whether the field the build drew is legible and its bodies told apart, and the audio cues."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare
# name grouping the points a reviewer grades — and each
# `[[review.categories.items]]` under it is one graded review item, worth one
# point (the default weight), so a category is worth the number of items it holds
# (no fractional scoring). A category carries no prose of its own; each review
# item states in `description` the claim its validator checks. A point a variant
# adds lives in that variant's own file instead. The checklist is reporter-side
# material — never seeded into a run, so the model never sees it; each item
# restates a rule the seeded specification already states, and every threshold a
# validator asserts is derived from a figure or rule in the specs plus a numeric
# tolerance, never tuned against a reference run.
#
# EVERY point on this checklist carries a validation script, and every point is
# ONE observable behavior, so a build fails exactly the rule it breaks (a wave
# that turns over and a wave that announces the wrong number are two points, not
# one). Each script is a vitest suite under
# `validation/<engine>/<group>/<item id>.test.ts`. The `<engine>` level is the
# ENGINE the suite is written against — a validator speaks one engine's
# vocabulary, so this case, which supports three, ships one directory per engine:
# `validation/none/` drives the build in Chromium through `window.__shatter`, and
# `validation/simple-2d/` and `validation/structured-2d/` each run in process
# against their vendored engine. The three are the same scenarios; only how they
# reach the build differs. The directory for the run's engine is what gets staged
# into the built workspace at `validation/`.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. Each point declares exactly one output. `kind = "image"` is the
# default — a single captured frame, the right evidence for a posed scenario read
# once — and `kind = "replay"` is the exception, on the twenty-two points whose
# requirement IS motion. There is no `kind = "video"` anywhere. A REPLAY ENDS ON
# THE OUTCOME, NOT ON THE INSTANT OF MEASUREMENT: the suite arms the recorder
# before the scenario's last beat and stops it after the effect has played out — a
# second of the fragments coming apart, of the wave arriving, of the core that
# took the torpedo — while the reading the verdict rests on is still taken at the
# instant the event happened. Both kinds are evidence beside the verdict rather
# than any part of it: a point passes or fails on its assertions alone.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers. `failure_cap` is
# the highest functional rating those domains may reach while the point fails;
# each domain gets the LOWEST cap among its failing points, and a domain with no
# failing point is flawless. The caps are graded by how much of the game a failure
# takes away: `broken` where the miss makes the game impossible to play as
# intended (no debug surface, a ship that will not turn or thrust, a gun that will
# not fire, a rock that does not split, a wave that never turns over, a game that
# cannot be started or lost, the well not pulling at all); `scuffed` where it
# makes an optional path unplayable or normal play unpleasant (the saucer moving
# or firing wrongly, a screen misreporting the run, the banner ordering wrong, the
# extra ship never awarded, the field not fitting the window); `passable` where it
# affects play without breaking it (a tolerance on a stated figure, an edge case
# of a rule whose main direction passes, a cue, a per-size figure where the other
# sizes are right); and `great` where the standard flow is untouched. No point
# caps at `flawless`: a failure always costs.
[review]
format = 2

# --- Instrumentation ---------------------------------------------------------
# The debug surface every scenario in this case is posed through, graded operation
# by operation. Each of the per-roster clears, the per-id removals, the two world
# gates and the three saucer faculties gets its own point, so a build that
# implements one of them wrongly is named by the item that decides it rather than
# contaminating every scenario that leans on it. `poses-read-back` is the rule the
# whole surface is built to: every operation sets one field, and `snapshot()`
# reports every field an operation can set, so each is verifiable by setting a
# value and reading it back.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug surface is present and complete"
description = "Every operation specs/instrumentation.md names is a function on the surface, version is SHATTER_DEBUG_VERSION (1), and the surface is live: a posed rock reads back and drifts when the game is advanced."
domains = ["gravity", "flight", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "surface", name = "The posed field the surface was exercised over", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed field carrying a rock of each size, a bullet, an enemy bullet and a saucer, every field listed in the snapshot shape specs/instrumentation.md fixes is present with its documented type."
domains = ["gravity", "flight", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "snapshot", name = "The field the reported snapshot describes", kind = "image" },
] }
[[review.categories.items]]
id = "poses-read-back"
title = "Every pose is reported by the snapshot"
description = "Each pose's value is read back from the snapshot: the screen, the menu index, the score, the lives, the wave, the wave banner, the ship's position, velocity, angle, invulnerability and fire cooldown, a rock's velocity, the two world gates, the ship's contact gate, and the saucer's three faculties. Mute is not in the list: there is no setMuted."
domains = ["gravity", "flight", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/poses-read-back.test.ts", outputs = [
  { id = "posed", name = "The fully posed game every value was read back from", kind = "image" },
] }
[[review.categories.items]]
id = "reset-restores-title"
title = "reset returns the game to its title values"
description = "After a run has been posed with a score, lives, a wave, rocks, bullets and a saucer, reset() restores every declared field to the title value specs/instrumentation.md lists and leaves muted untouched."
domains = ["gravity", "flight", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/reset-restores-title.test.ts", outputs = [
  { id = "reset", name = "The title screen reset restored", kind = "image" },
] }
[[review.categories.items]]
id = "reset-seeds-randomness"
title = "reset seeds the game's randomness"
description = "Two runs opened after reset({ seed: 7 }) spawn identical wave-1 layouts; a run opened after reset({ seed: 8 }) spawns a different one."
domains = ["arcade"]
failure_cap = "passable"
validation = { script = "instrumentation/reset-seeds-randomness.test.ts", outputs = [
  { id = "seeded", name = "The wave-1 layout two runs on one seed both produced", kind = "image" },
] }
[[review.categories.items]]
id = "advance-is-exact"
title = "Advancing moves exactly the time asked for"
description = "Advancing n ticks moves simTime by exactly n x TICK_DT within one tick, and one second of game time covered as one advance and as 120 single-tick advances leaves simTime and a posed rock in the same place."
domains = ["gravity", "flight", "arcade", "presentation"]
