# --- The gun -----------------------------------------------------------------
# What the ship shoots: the muzzle velocity, the drift it inherits, the lifetime,
# the on-screen cap and the fire gate, then the trail. `no-tunnelling-at-speed` is
# the bullet half of the swept-or-continuous requirement specs/collision.md states,
# and it is the one item a build with a per-tick overlap test fails while passing
# every radius point.
