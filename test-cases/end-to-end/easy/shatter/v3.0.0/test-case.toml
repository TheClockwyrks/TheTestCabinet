# --- Look and readouts -------------------------------------------------------
# Every item here checks that a thing is PRESENT and TOLD APART from what is
# behind or beside it, against a stated RGB distance out of 441, and never a hex value: no palette and no typeface is seeded
# or asserted, and the look is the build's. `field-background-is-dark` is the one
# item that fixes a color bound at all, because specs/overview.md states the dark
# field as a requirement in its own right and every other item here measures
# distance FROM whatever background the build chose. No item mandates a drawing
# style: a build drawing cratered, textured or lumpy-but-round rocks is legible and
# conformant, and a build blinking its invulnerable ship by color, by outline
# weight or by alpha is too.
