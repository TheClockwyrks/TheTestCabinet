id = "presentation"
title = "Look and readouts"
[[review.categories.items]]
id = "field-background-is-dark"
title = "The field reads as deep space"
description = "The field's background, sampled clear of every body, is dark: its luminance is below a quarter of full. The bound is the one specs/overview.md states as a requirement in its own right; every other item in this group measures distance from whatever background the build chose, so this is the only one that needs it fixed."
