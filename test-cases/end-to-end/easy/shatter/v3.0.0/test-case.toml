validation = { script = "saucer/first-arrives-at-18s.test.ts", outputs = [
  { id = "arrival", name = "The first saucer, twenty seconds into a game", kind = "image" },
] }
# There is no roster to count: the slot is single by construction, which is why the
# requirement is decided on the continuity of the arrival id rather than on a count.
# Without the id the item would pass vacuously for every build and the snapshot
