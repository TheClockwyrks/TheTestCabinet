# passed all five saucer items while handing a fresh wave 1 an enemy already
# firing. Its three anti-false-positive devices are each load-bearing: the saucer
# is read at the PAUSE as well as after the restart, since a visit is finite and
# one that left on its own is otherwise indistinguishable; a life is spent first,
# because a game that merely RESUMED also has three ships unless one was spent; and
# the pause selection is ADDRESSED through setMenuIndex(1) rather than counted in
# key presses, since specs/ui.md fixes the order of the pause entries but not which
# one the menu opens on.
