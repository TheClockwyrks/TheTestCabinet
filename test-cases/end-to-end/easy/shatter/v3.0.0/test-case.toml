# The item is deliberately NOT stated as "stays where it was posed". Every rock is a
# pulled body and specs/gravity.md fixes MU at 4,500,000, so even at the field's
# furthest corner from the star (734 units, an acceleration of 8.35 units/s^2) a
# conformant build's rock drifts 4.2 units in the second — an item asserting
# stillness would fail every spec-honouring build on all three engines. Gating
# gravity to rescue the wording is worse still: the well is this case's signature
# mechanic and the debug surface deliberately carries no operation that holds a
# rock out of it.
[[review.categories.items]]
id = "spin-is-cosmetic"
title = "A rock's spin does not move it"
description = "A rock posed at rest on a cleared field is read a second of game time later: the bearing of its velocity and of its displacement each point at the star's centre within one degree, and the component of each across that bearing is 0 within one unit per second and one unit. A drawn spin that leaks into the simulation shows up as exactly that tangential component."
domains = ["arcade"]
failure_cap = "passable"
validation = { script = "rocks/spin-is-cosmetic.test.ts", outputs = [
  { id = "spin", name = "The rock a second on, moved only by the well", kind = "image" },
] }

# --- The saucer --------------------------------------------------------------
# The saucer has three separable faculties — it decides, it shoots, and it moves —
# and each item below turns off the two it is not about, so every scenario reads
# one requirement. `avoids-the-core` is the item the fold-in fix of changelog.md
# reshaped: it flies 54 real crossings the specification's own entry rule produces
# and decides on the closest approach of all of them, rather than posing the saucer
# where the behavior is impossible.
