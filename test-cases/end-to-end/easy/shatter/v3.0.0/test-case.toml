# --- Waves -------------------------------------------------------------------
# A wave clears on a TRANSITION, not on a predicate: specs/progression.md states
# that a wave clears on the tick in which the last rock on the field is destroyed,
# so a field that holds no rocks and has had none destroyed is playing rather than
# cleared. Both directions carry an item, because a build that clears on an empty
# predicate and a build that never clears at all would otherwise be
# indistinguishable on one. Every item here reaches its cleared field by SHOOTING
# the rocks down through the harness, never through clearRocks — which the
# specification defines as a way to make room, awarding no score and destroying
