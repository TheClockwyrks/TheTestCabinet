# --- Audio -------------------------------------------------------------------
# Six cues, the mute toggle, and the requirement that the game runs whether or not
# audio does. The six cue items are capped `passable`, not `scuffed`: a cap is the
# ceiling on a whole domain and a run's functional rating is its worst domain, so a
# `scuffed` cue cap would let one absent sound effect cap the entire run. One
# missing cue leaves the standard flow of gameplay untouched, which is what the
# failure-cap table reserves `passable` for. `mute-silences` keeps `scuffed`,
# because mute is an optional path a player relies on.
