# --- The rocks ---------------------------------------------------------------
# The drift, the split ladder, the fan a kill throws and the star's recycling.
# The two fragment items are split in two directions on purpose (see the fold-in
# fix in changelog.md): the AVERAGE of the two fragment velocities is the parent's
# whatever the kick did, and the DIFFERENCE is twice the kick with the parent's
# motion cancelled. Both pose the parent far out at (320, 620) and give it a
# diagonal drift against a horizontal shot, so a build that kicks across the rock's
# course and a build that kicks across the bullet's travel differ by construction
# rather than by luck.
