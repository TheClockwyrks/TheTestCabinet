# The recording is of the CLOSEST crossing, not the first: the sweep runs all 54 and
# keeps the row, edge and seed of the worst approach, and the validator then arms
# the recorder over a re-posed run of exactly that crossing, so the reviewer
# watches the approach the verdict rests on. Filming the first crossing instead
# loses the fold-in fix — on a failing build the dead-on approach is frequently one
# it handles cleanly, and the item then reads as a false positive to anyone
# watching. The distance is measured to the LINE between samples rather than to the
# samples, because reading the samples alone at an eight-tick stride reports the
# saucer further out than it got, which is the wrong direction for a check hunting
# a build that came too close.
[[review.categories.items]]
id = "avoids-the-core"
title = "A saucer never overlaps the star's core"
description = "Across 54 crossings — nine rows from 80 units below the star's row to 80 above it in 20-unit steps, each from the left edge and from the right, the whole set repeated from three seeds, with the gun off — the closest approach of any of them to the star's centre, measured as the distance to the line between eight-tick samples, exceeds CORE_R + SAUCER_R (48)."
domains = ["arcade"]
failure_cap = "scuffed"
validation = { script = "saucer/avoids-the-core.test.ts", outputs = [
  { id = "closest", name = "The closest of the 54 crossings to the core", kind = "replay" },
] }
