# Armored rocks and a homing torpedo. Both changes apply to the one game the case
# describes, so warhead is rated on the case's common four domains — it adds no
# domain of its own, and every point below rolls up to one of them.
slug = "warhead"
name = "Warhead"
description = "Rocks carry armor and the ship carries a homing torpedo: one guided munition on a ten-second recharge that flies true through the well and destroys any rock outright."

# The rules that vary live in the common `.hbs` specs, branched on this variant's
# slug when rendered: `specs/rocks.md.hbs` gives a rock health and a damaged look,
# `specs/weapons.md.hbs` adds the whole torpedo section, `specs/collision.md.hbs`
# adds the armor rule and the torpedo rows, `specs/gravity.md.hbs` names the
# torpedo among the powered bodies the well never pulls, `specs/controls.md.hbs`
# binds the torpedo key, `specs/ui.md.hbs` adds the charge indicator,
# `specs/state.md.hbs` adds the torpedo fields, `specs/instrumentation.md.hbs`
# adds the torpedo operations and `setRockHealth`, and `specs/overview.md.hbs`
# carries the two extra rows of the legibility table. So warhead declares no
# `spec` of its own, and its seeded set reads as one self-contained game that
# never names a sibling variant.

# Curated demo media for this variant, captured from the reference build below.
showcase = "showcase/warhead"

# The authored, *correct* static build of this variant, one per engine — see
# `variants/base.toml` for what a reference implementation is and how it is
# published.
[reference_implementation]
none = "references/none/warhead"
"simple-2d" = "references/simple-2d/warhead"
"structured-2d" = "references/structured-2d/warhead"

# This variant needs a starter project of its own under each engine that seeds
# one: the seeded `src/constants.ts` under `simple-2d` and under `structured-2d`
# carries the Armor group (ROCK_HEALTH, HIT_FLASH_TIME) and the Torpedo group,
# and binds the `b` action to `KeyF` rather than to `Space`. The table REPLACES
# the case's `[workspaces]` rather than layering on it, so it names one directory
# per engine exactly as the case's does.
#
# The engineless project is the case's own, shared with every variant. It holds no
# game code for a variant to differ in — only the configuration the build is
# written against — and what this variant changes about the game is carried by the
# specs, which are rendered per variant before they land.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/warhead/simple-2d"
"structured-2d" = "workspaces/warhead/structured-2d"

# The warhead checklist: 50 points on top of the case's 207, so a warhead run is
# rated on 257. The `format` is inherited from the case manifest
# (`[review] format = 2`); a variant only adds `[[review.categories]]`. Every point
# carries `domains` and `failure_cap` on the same scale the case manifest sets out
# above its `[review]` table, and every point carries the validator that decides
# it.
#
# FIVE categories are declared, and three of them REUSE a common category's id so
# their points fold into it (see `merge_review_items` in the core):
#   - `instrumentation` — the four torpedo operations of the debug surface, which
#     belong beside the case's other per-operation instrumentation points. Their
#     scripts live in the COMMON `instrumentation/` directory of each validator
#     project; only a warhead checklist names them.
#   - `rocks` — the thirteen Armor points, which are rules about a rock and belong
#     beside the case's other rock points. Their scripts live in a directory of
#     their own, `armor/`, which never loads against a base build.
#   - `presentation` — the two things a warhead build draws that a base one does
#     not, the torpedo itself and the HUD's charge readout, which belong beside the
#     case's other legibility points. Their scripts live in the COMMON
#     `presentation/` directory.
#   - `torpedo` and `detonation` are NEW categories with headings of their own.
#
# Detonation is deliberately its own category rather than a second block with
# `id = "torpedo"`. Two blocks sharing an id resolve without a verdict collision —
# the sub-item sets are disjoint — but `merge_review_items` folds the second into
# the first by extending its items and DISCARDS the second block's `title`, so the
# reviewer would get thirty-one items under one "Homing torpedo" heading and no
# Detonation heading at all.

# --- Instrumentation ---------------------------------------------------------
# The four torpedo operations of the debug surface, folded into the case's common
# Instrumentation category by id-match. They exist because every other debug
# operation is graded by an item of its own — the per-roster clears, the per-id
# removals, the world gates, the saucer faculties, and (in Armor below)
# setRockHealth — and the torpedo operations otherwise got nothing. setTorpedoHeading
# is the fourth: the specification charges every warhead build for it, so an item
# drives it rather than leaving it a requirement the case never reads. The
# consequences are the ones an item count exists to prevent: clearTorpedoes sits
# inside the harness's clearWorld, so a build that implements it wrongly
# contaminates warhead scenarios across Homing torpedo, Detonation and Armor with
# no item naming the cause; and a setTorpedoHoming that does nothing fails
# torpedo/flies-true-through-the-well, whose domains are gravity and arcade, so a
# broken instrumentation gate would lower the GRAVITY rating of a build whose well
# is perfectly correct. Their scripts live in the common instrumentation
# directory; only a warhead checklist names them.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "clear-torpedoes"
title = "clearTorpedoes empties the torpedoes alone"
description = "clearTorpedoes() removes every torpedo and leaves the rocks, bullets, enemy bullets and saucer standing."
domains = ["gravity", "flight", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/clear-torpedoes.test.ts", outputs = [
  { id = "cleared", name = "The field with the torpedoes gone and the rest standing", kind = "image" },
] }
[[review.categories.items]]
id = "remove-torpedo"
title = "removeTorpedo removes one torpedo by id"
description = "Of three posed torpedoes, removeTorpedo(id) removes exactly the one named and leaves the other two carrying their ids."
domains = ["arcade"]
failure_cap = "passable"
validation = { script = "instrumentation/remove-torpedo.test.ts", outputs = [
  { id = "removed", name = "The two torpedoes that outlived the one addressed", kind = "image" },
] }
[[review.categories.items]]
id = "torpedo-heading"
title = "setTorpedoHeading turns a torpedo and its velocity with it"
description = "setTorpedoHeading(id, radians) reads back on the snapshot's heading, and the torpedo's reported velocity turns onto that heading while its magnitude stays the TORPEDO_SPEED it was carrying."
domains = ["arcade"]
failure_cap = "passable"
validation = { script = "instrumentation/torpedo-heading.test.ts", outputs = [
  { id = "turned", name = "The torpedo on the heading it was turned to", kind = "image" },
] }
[[review.categories.items]]
id = "torpedo-homing-gate"
title = "Homing off holds the torpedo's heading"
description = "With setTorpedoHoming(id, false) a torpedo holds its heading past a rock squarely inside its forward cone; with it on, the same pose turns it onto that rock."
domains = ["arcade"]
failure_cap = "passable"
validation = { script = "instrumentation/torpedo-homing-gate.test.ts", outputs = [
  { id = "held", name = "The torpedo holding its heading past an acquirable rock", kind = "image" },
] }

