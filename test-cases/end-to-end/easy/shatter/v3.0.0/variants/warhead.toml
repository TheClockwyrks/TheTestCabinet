# --- Homing torpedo ----------------------------------------------------------
# The warhead's secondary weapon: a single charge, a launch that carries none of
# the ship's drift, a flight the well never bends, and a forward acquisition cone.
# `flies-true-through-the-well` follows the torpedo PAST the star's column, so the
# reading is taken after the closest approach to the well the item exists to prove
# it flies through (see the fold-in fix in changelog.md); with setTorpedoHoming
# off, the only thing that could turn it is the well, so a build that treats the
# star as an acquirable body cannot confound the reading. Every item that then
# reads a torpedo hard-asserts it first, so a build that launched nothing fails
# `the-torpedo-action-launches-one` rather than crashing the suite and being
# misreported as failing to expose the debug surface.
