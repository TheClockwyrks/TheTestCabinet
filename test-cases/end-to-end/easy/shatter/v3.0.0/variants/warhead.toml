# --- Presentation ------------------------------------------------------------
# The two things a warhead build draws that a base one does not, folded into the
# case's common "Look and readouts" category by id-match. `specs/overview.md`'s
# legibility table adds a row for the torpedo and `specs/ui.md`'s HUD table adds
# the charge readout, and the base checklist grades every other row of both — so
# without these two a warhead build that draws its torpedo exactly like a bullet
# and ships no charge indicator loses nothing, while a base build that omits its
# ships-in-reserve glyphs loses a point. Both are presence-and-distinguishability
# checks, of the same kind as the base group's: no palette, no silhouette and no
# placement is asserted anywhere, because `specs/overview.md` leaves all three to
# the build.
[[review.categories]]
id = "presentation"
title = "Look and readouts"
[[review.categories.items]]
id = "torpedo-is-drawn-and-distinct"
title = "The torpedo reads apart from the bullets"
description = "Pixels inside a posed torpedo differ from the background by more than 60 of 441, and the colour it was drawn in differs from a posed bullet's by more than 40."
domains = ["presentation"]
failure_cap = "scuffed"
validation = { script = "presentation/torpedo-is-drawn-and-distinct.test.ts", outputs = [
  { id = "torpedo", name = "The torpedo beside a round, told apart", kind = "image" },
] }
[[review.categories.items]]
id = "hud-torpedo-charge-is-drawn"
title = "The torpedo charge is drawn in the HUD"
description = "With setTorpedoCharge posed at 1, 0.5 and 0, a torpedo readout is drawn in the upper portion of the field clear of the star, and the ink it carries falls with the charge: each of the two steps gives up at least a tenth of the whole full-to-empty swing."
domains = ["presentation"]
failure_cap = "scuffed"
validation = { script = "presentation/hud-torpedo-charge-is-drawn.test.ts", outputs = [
