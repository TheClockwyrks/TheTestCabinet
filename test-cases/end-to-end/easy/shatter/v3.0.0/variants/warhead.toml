# --- Detonation --------------------------------------------------------------
# Its own category, never a second block with id = "torpedo": merge_review_items in
# the core folds a same-id block into the first and discards the second block's
# title, so the reviewer would get thirty-one items under one "Homing torpedo"
# heading and no Detonation heading at all. What a torpedo hit does: it destroys
# outright whatever a rock's health, it scores like a gun kill, it blasts the
# fragments outward far harder, and it stops at the core. `harder-scatter` reads
# the gun spread and the torpedo spread each at the instant of ITS OWN kill, so
# gravity enters neither side of the comparison (see the fold-in fix in
# changelog.md).
