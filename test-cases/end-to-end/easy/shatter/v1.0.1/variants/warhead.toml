# The Warhead variant: the standard endless arcade game plus armored rocks and a
# homing torpedo secondary weapon. Listed after `base` in the case manifest's
# `variants`. Every path here resolves against the version folder, exactly like the
# main manifest. Warhead is the same single game mode as base — the extra rules just
# layer on — so it is rated on the case's sole common `arcade` domain, not a domain
# of its own; its review items below roll up to that common domain.
slug = "warhead"
name = "Warhead"
description = "The standard game plus armored rocks and a homing torpedo secondary weapon."

# Every variant seeds exactly one mode spec to the stable dest `specs/mode.md`, which
# the common specs reference by that name. The Warhead mode spec carries the armor,
# torpedo, and detonation rules; the common specs (which defer to `specs/mode.md`)
# supply everything else.
spec = [{ source = "specs/mode-warhead.md", dest = "specs/mode.md" }]

# A variant-only in-game reference view (the common `title`, `gameplay`, and
# `game-over` views are still seeded for this variant). `warhead` shows an armored
# rock mid-damage, a torpedo homing on its target, and the torpedo-charge HUD —
# captured from this variant's reference-impl build and served as-is.
reference = [{ view = "warhead", media = "reference/screenshots/warhead/warhead.png" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's playable build. A bare directory path (resolved against
# the version folder) holding a buildable web project, built with this case's
# `[build]` install/build commands and deployed like a published run build via
# `tcab publish-reference`, then shown on the case's "Reference" tab. It is
# **never seeded into a run**.
reference_implementation = "reference-impl/warhead"

# Variant-only proofs the standard modes do not ask for: a still of the armored
# rock + torpedo + charge HUD (paired with the `warhead` reference), and a clip of
# a torpedo run (the launch-straight-then-home behavior and the harder scatter no
# still can capture). The Warhead mode spec (seeded as `specs/mode.md`) instructs the
# build to write both at exactly these paths.
[[proof]]
id = "warhead"
name = "Warhead frame"
dest = "proof/warhead.png"

[[proof]]
id = "torpedo"
name = "Torpedo run clip"
dest = "proof/torpedo.webm"

# Reviewer checklist items for the extra rules this variant introduces, rolled up to
# the common `arcade` domain (Shatter's sole scoring domain). Additive on top of the
# common items; never seeded. Each omits `domain`, so it rolls up to that one common
# domain implicitly.
[[review_item]]
id = "warhead-armored-rocks"
title = "Armored rocks"
text = "Rocks have health by size — a Large takes 3 bullet hits, a Medium 2, a Small 1 — and a non-fatal hit shows visible damage (a flash and a progressively cracked/brighter rock) without splitting it; the rock only splits and scores on the hit that destroys it. Split fragments re-enter at full health for their size. A torpedo ignores armor and destroys any rock in one hit."
weight = 1
reference = "warhead"
proof = "warhead"
# Independently graded points: the item's weight splits evenly across them.
sub_items = [
  { id = "health-by-size", title = "Health by size — a Large takes 3 bullet hits, a Medium 2, a Small 1" },
  { id = "damage-feedback", title = "A non-fatal hit flashes and shows progressive damage without splitting the rock" },
  { id = "split-on-kill", title = "The rock only splits and scores on the destroying hit; split fragments re-enter at full health" },
]

[[review_item]]
id = "warhead-recycle-damage"
title = "Star recycling preserves damage"
text = "A damaged rock pulled into the star and recycled re-enters from the edge with the SAME remaining health it had — the star relocates the rock, it does not repair it (a Large already chipped to 1 HP comes back at 1 HP, not 3). Its move speed is still reset to a fresh base drift for its size, so rocks slung through the star and recycled repeatedly do not keep getting faster."
weight = 1
reference = "warhead"
sub_items = [
  { id = "preserves-health", title = "With a single heavily-damaged rock left on the field, when the star swallows it the rock that re-enters is still visibly damaged and dies in a few hits — the star relocates it, it doesn't repair it to full health" },
  { id = "resets-speed", title = "No rock becomes progressively or absurdly faster after being slung through the star and recycled several times" },
]

[[review_item]]
id = "warhead-torpedo"
title = "Homing torpedo"
text = "Secondary fire (F) launches a single torpedo on a 10-second recharge (at most one stored, one in flight; the recharge shows in the HUD and persists across respawn). The torpedo flies straight from the nose, then homes onto the nearest rock or saucer within a ±15° forward cone at a limited turn rate, and — being self-propelled — flies true through the gravity well instead of curving like a bullet."
weight = 1
proof = "torpedo"
sub_items = [
  { id = "one-charge", title = "Secondary fire (F) launches a single torpedo on a 10-second recharge (one stored, one in flight); the recharge shows in the HUD and persists across respawn" },
  { id = "homing", title = "It flies straight from the nose, then homes onto the nearest rock or saucer within a ±15° forward cone at a limited turn rate" },
  { id = "flies-true", title = "Being self-propelled, it flies true through the gravity well instead of curving like a bullet" },
]

[[review_item]]
id = "warhead-torpedo-kill"
title = "Torpedo detonation"
text = "A torpedo destroys any rock instantly regardless of its armor and blasts the fragments outward with clearly more force than a bullet shatter; it also destroys the saucer for points, and is absorbed by the star core."
weight = 1
proof = "torpedo"
sub_items = [
  { id = "one-hit-rock", title = "It destroys any rock instantly regardless of its armor" },
  { id = "harder-scatter", title = "It blasts the fragments outward with clearly more force than a bullet shatter" },
  { id = "saucer-and-core", title = "It also destroys the saucer for points and is absorbed by the star core" },
]
