slug = "shatter"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Shatter"

# Relative difficulty of this case, surfaced on the site. Shatter asks for inertial
# flight, a live gravity field acting on many bodies at once, splitting rocks,
# escalating waves, a hunting saucer, lives/respawns, and a full state machine — a
# meaty but well-specified 2D front-end build, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "space", "shooter", "physics"]

# Short site-facing abstract, shown on the test case card. Authored inline as plain
# text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A neon top-down rock shooter built around a central gravity well: the star at the \
middle of the field pulls your bullets and every rock — so shots bend around it and \
rocks churn on curved paths — while your ship flies free of the pull and the rocks \
it swallows recycle back in from the edge."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. This is the per-case default; a run can override it. Shatter is a medium
# case with a good deal to build (inertial flight, the gravity field, waves, the
# saucer, several states), so it gets more headroom than the easy cases while still
# bounding a session that never terminates.
max_runtime_hours = 2.5

# Starter workspace seeded into the root of every run before the specs. It gives the
# model a baseline project to build on: a `package.json` that pins `playwright` as a
# dev dependency, so the in-container browser tooling is a visible, project-local
# dependency rather than a global the model has to know is preinstalled. The seeded
# files land at the run root (`workspaces/base/package.json` seeds to
# `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. It installs the workspace's dependencies and downloads
# the Playwright Chromium build (the base image ships the OS libraries Chromium links
# against, but not the browser binary), so the model can build and verify immediately
# against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Shatter ships two: `base` (the default — the standard endless arcade game) and
# `warhead` (the standard game plus armored rocks and a homing-torpedo secondary
# weapon). Both are the same single game mode, rated on the case's sole common
# `arcade` domain. Each variant seeds exactly one mode spec to the stable dest
# `specs/mode.md`; `warhead` additionally adds an in-game reference view, proofs, and
# review items (which roll up to that same common domain). The first entry is the
# default. This list is a root key, so it must precede the first table header
# (`[build]`).
variants = [
  "variants/base.toml",
  "variants/warhead.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced into
# `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the build to
# commit a `package-lock.json`, so the validated build installs exactly what the
# deploy will. Both commands are required — there are no defaults, so every case
# states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named once
# here so a review item's `validation` driver (and the validator that runs it) knows
# which `window` global to drive. The seeded specification documents the same handle
# independently as an ordinary game debug feature (see specs/instrumentation.md); this
# entry is reporter-side and never seeded. It is required because review items declare
# `validation` scripts.
[instrumentation]
handle = "__shatter"

# The fixed simulation rate, in Hz. Shatter's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation runtime
# uses to relate that exact stepping back to real time — one tick is 1/120 of a
# second, so a second of game time is 120 ticks. It must match the timestep
# `specs/simulation.md` mandates.
tick_hz = 120

# Common specs: seeded for EVERY variant of this case, at the `dest` path within the
# run workspace. The specification is decomposed by concern: the overview, the field
# and the star, the ship and its bullets, the rocks and the saucer, the simulation and
# collision rules, the game's rules and flow, and the debugging/automation surface.
# Anything a variant changes wholesale — how rocks take damage and which weapons the
# ship carries — is deferred to `specs/mode.md`, which each variant seeds from its own
# file to that stable path (see the variant files). A common spec never asserts a fact
# a variant overrides, so each variant's seeded set reads as one self-contained game.
#
# Most common specs are plain Markdown, seeded verbatim; a spec's `dest` defaults to
# its `source`. The exception is `specs/instrumentation.md`, whose source is a `.hbs`
# template: a little of its wording (the torpedo state and the rock-health field a
# snapshot reports) depends on the variant, so it is rendered with the selected variant
# before landing at its `dest`. An `.md.hbs` source seeds to the same `.md` path.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/field.md"

[[spec]]
source = "specs/ship.md"

[[spec]]
source = "specs/hazards.md"

[[spec]]
source = "specs/simulation.md"

[[spec]]
source = "specs/rules.md"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable core; a `window.__shatter` API to drive and inspect the game from code;
# and a read-only debug overlay. Seeded for every variant and framed as an ordinary
# developer affordance of the game. Rendered from a `.hbs` template so its torpedo and
# rock-health wording matches the selected variant; it seeds to `specs/instrumentation.md`.
[[spec]]
source = "specs/instrumentation.md.hbs"

# Proof of implementation: instructs the build to capture evidence (screenshots and a
# short clip) at the exact paths the `[[proof]]` entries below declare, so a reviewer
# can see what the build actually produced. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl builds — the
# authored, correct games under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). The three common views are captured
# from the `base` build (the standard game); the `warhead` variant adds one
# variant-only view (declared in its variant file). See `reference/README.md` for
# how they are regenerated. References are not validated unless a `[[check]]` below
# names them.
[[reference]]
view = "title"
media = "reference/screenshots/title.png"

[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to as evidence the feature works; `specs/proof.md` instructs
# the build to produce them at exactly these paths. Validation records whether
# each turned up (informational — a missing proof does not fail the run), and a
# reviewer pairs each with its expected reference (see the review items that carry
# `reference`/`proof` links below). The media kind is inferred from the extension: `.png` is an image,
# `.webm` a video (the format Playwright records natively; the public gallery
# transcodes it to mp4).
[[proof]]
id = "title"
name = "Title screen"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "Gameplay"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Game over"
dest = "proof/game-over.png"

[[proof]]
id = "gravity"
name = "Gravity clip"
dest = "proof/gravity.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# The case's sole scoring domain, rated for every variant. Shatter is one game mode
# regardless of the selected variant, so both `base` and `warhead` are rated on this
# single domain — it is the run's overall rating. Every case must declare at least
# one common domain. Every review item (common here, and the `warhead` variant's own)
# rolls up to this domain implicitly, so none names a `domain` — `arcade` is the only
# domain there is.
[[domain]]
id = "arcade"
name = "Arcade"
description = "Endless survival: pilot the ship through the gravity well, shatter the rocks wave after wave, and outlast the saucer."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name
# grouping the points a reviewer grades — and each `[[review.categories.items]]`
# under it is one graded review item, worth one point (the default weight), so a
# category is worth the number of items it holds (no fractional scoring). A category
# carries no prose of its own; each review item states its own requirement in
# `description`. The checklist is reporter-side material — never seeded into a run,
# so the model never sees it; each item restates a requirement the seeded
# specification already states. An item with a `validation` script is decided
# automatically (a reviewer can override); one without is judged by a person. The
# points still judged by eye (no validation script) are the wrap "both sides" draw,
# the HUD and motion-trail rendering, the window fit, and everything under Audio; the
# UI game states carry a validation script too, but only to reach and CAPTURE each
# screen (its auto-verdict confirms the state is reachable), while how each screen
# reads is still judged by eye from the capture. The Warhead variant adds four more
# categories in its own file (`variants/warhead.toml`); the base game sees only these.
[review]
format = 2

# --- Flight -------------------------------------------------------------------
# Inertial flight is checked as four separate points — thrust, coasting, turn rate,
# and the speed cap — so a build fails exactly the part of the flight model it breaks.
[[review.categories]]
id = "flight"
title = "Flight"
[[review.categories.items]]
id = "thrust-accelerates"
title = "Thrust accelerates along the facing"
description = "Holding thrust accelerates the ship along its current facing at roughly 480 px/s^2 — it builds real speed from rest, in the direction it is pointing."
# Automated validation: pose the ship at rest facing +x, hold thrust, step the real
# sim, and read the velocity it gained. See validation/flight/thrust-accelerates.mjs.
validation = { script = "validation/flight/thrust-accelerates.mjs", outputs = [
  { id = "accel", name = "The ship accelerating under thrust", kind = "video" },
] }
[[review.categories.items]]
id = "coasts"
title = "Coasts under momentum"
description = "Releasing thrust leaves the ship coasting under momentum with a gentle drag (speed halves roughly every 3 s) — no instant stop and no reverse or brake."
# Automated validation: pose the ship moving with no keys held, step the real sim, and
# confirm the velocity persists and decays to ~half after 3 s. See validation/flight/coasts.mjs.
validation = { script = "validation/flight/coasts.mjs", outputs = [
  { id = "coast", name = "The ship coasting after thrust is released", kind = "video" },
] }
[[review.categories.items]]
id = "turn-rate"
title = "Turning changes only the facing"
description = "Turning rotates the facing at about 300 deg/s and changes only the facing, not the velocity's direction."
# Automated validation: hold a rotate key with the ship moving, step the real sim, and
# confirm the facing swings at ~300 deg/s while the velocity's heading is unchanged.
# See validation/flight/turn-rate.mjs.
validation = { script = "validation/flight/turn-rate.mjs", outputs = [
  { id = "turn", name = "The ship turning in place", kind = "video" },
] }
[[review.categories.items]]
id = "speed-cap"
title = "Speed caps at the ceiling"
description = "Thrust cannot drive the ship past its speed cap (~680 px/s): the ship plateaus there and never exceeds it, however long thrust is held."
# Automated validation: thrust continuously and confirm the ship's speed plateaus at
# ~680 and never exceeds it. See validation/flight/speed-cap.mjs.
validation = { script = "validation/flight/speed-cap.mjs", outputs = [
  { id = "cap", name = "The ship's speed plateauing at the cap", kind = "video" },
] }

