# The Warhead variant: the standard endless arcade game plus armored rocks and a
# homing torpedo secondary weapon. Listed after `base` in the case manifest's
# `variants`. Every path here resolves against the version folder, exactly like the
# main manifest. Warhead is the same single game mode as base — the extra rules just
# layer on — so it is rated on the case's sole common `arcade` domain, not a domain
# of its own; its review items below roll up to that common domain.
slug = "warhead"
name = "Warhead"
description = "The standard game plus armored rocks and a homing torpedo secondary weapon."

# Every variant seeds exactly one mode spec to the stable dest `specs/mode.md`, which
# the common specs reference by that name. The Warhead mode spec carries the armor,
# torpedo, and detonation rules; the common specs (which defer to `specs/mode.md`)
# supply everything else.
spec = [{ source = "specs/mode-warhead.md", dest = "specs/mode.md" }]

# A variant-only in-game reference view (the common `title`, `gameplay`, and
# `game-over` views are still seeded for this variant). `warhead` shows an armored
# rock mid-damage, a torpedo homing on its target, and the torpedo-charge HUD —
# captured from this variant's reference-impl build and served as-is.
reference = [{ view = "warhead", media = "reference/screenshots/warhead/warhead.png" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's playable build. A bare directory path (resolved against
# the version folder) holding a buildable web project, built with this case's
# `[build]` install/build commands and deployed like a published run build via
# `tcab publish-reference`, then shown on the case's "Reference" tab. It is
# **never seeded into a run**.
reference_implementation = "reference-impl/warhead"

# Variant-only proofs the standard modes do not ask for: a still of the armored
# rock + torpedo + charge HUD (paired with the `warhead` reference), and a clip of
# a torpedo run (the launch-straight-then-home behavior and the harder scatter no
# still can capture). The Warhead mode spec (seeded as `specs/mode.md`) instructs the
# build to write both at exactly these paths.
[[proof]]
id = "warhead"
name = "Warhead frame"
dest = "proof/warhead.png"

[[proof]]
id = "torpedo"
name = "Torpedo run clip"
dest = "proof/torpedo.webm"

# Reviewer checklist items for the extra rules this variant introduces, in the
# categories grammar (`[review] format = 2` is inherited from the case manifest).
# These categories are ADDITIVE on top of the common categories in
# `../test-case.toml`; every point rolls up to the common `arcade` domain (Shatter's
# sole scoring domain), so none names a `domain`. Never seeded. Each item with a
# `validation` script is decided automatically (a reviewer can override); the damage
# feedback and the recycled damaged look are judged by eye from the `warhead`
# reference and proof.

# --- Armored rocks ------------------------------------------------------------
# Health-by-size is checked per size so a build with the wrong health for one size
# fails only that size.
[[review.categories]]
id = "armor"
title = "Armored rocks"
[[review.categories.items]]
id = "health-large-3"
title = "A Large takes three hits"
description = "A Large rock takes three bullet hits to destroy."
validation = { script = "validation/armor/health-large-3.mjs", outputs = [
  { id = "hits", name = "A Large rock taking three hits", kind = "video" },
] }
[[review.categories.items]]
id = "health-medium-2"
title = "A Medium takes two hits"
description = "A Medium rock takes two bullet hits to destroy."
validation = { script = "validation/armor/health-medium-2.mjs", outputs = [
  { id = "hits", name = "A Medium rock taking two hits", kind = "video" },
] }
[[review.categories.items]]
id = "health-small-1"
title = "A Small takes one hit"
description = "A Small rock takes a single bullet hit to destroy."
validation = { script = "validation/armor/health-small-1.mjs", outputs = [
  { id = "hits", name = "A Small rock taking one hit", kind = "video" },
] }
[[review.categories.items]]
id = "no-split-until-dead"
title = "A non-fatal hit does not split"
description = "A non-fatal bullet hit spends the bullet and lowers the rock's health, but does not split it or score — only the destroying hit does."
validation = { script = "validation/armor/no-split-until-dead.mjs", outputs = [
  { id = "chip", name = "A non-fatal hit chipping a rock", kind = "video" },
] }
[[review.categories.items]]
id = "fragment-full-health"
title = "Fragments enter at full health"
description = "Rocks created by a split enter at full health for their size (a Medium fragment starts at 2, a Small at 1)."
validation = { script = "validation/armor/fragment-full-health.mjs", outputs = [
  { id = "fragments", name = "Split fragments at full health", kind = "video" },
] }
[[review.categories.items]]
id = "damage-feedback"
title = "Damage feedback"
description = "A non-fatal hit shows visible damage (a brief hit-flash and a progressively cracked/brighter rock) so a player can judge how many hits a rock has left."
reference = "warhead"
proof = "warhead"

# --- Star recycling preserves damage ------------------------------------------
[[review.categories]]
id = "recycle-armor"
title = "Star recycling preserves damage"
[[review.categories.items]]
id = "preserves-health"
title = "Recycling preserves remaining health"
description = "A damaged rock recycled by the star re-enters with the same remaining health it had — the star relocates it, it does not repair it (a Large chipped to 1 HP comes back at 1 HP, not 3)."
validation = { script = "validation/recycle-armor/preserves-health.mjs", outputs = [
  { id = "preserve", name = "A damaged rock recycled at the same health", kind = "video" },
] }
[[review.categories.items]]
id = "resets-speed"
title = "Recycling still resets speed"
description = "A recycled rock's move speed is still reset to a fresh base drift for its size, so a rock slung through the star and recycled repeatedly does not keep getting faster."
validation = { script = "validation/recycle-armor/resets-speed.mjs", outputs = [
  { id = "speed", name = "A recycled damaged rock at base speed", kind = "video" },
] }
[[review.categories.items]]
id = "damaged-look"
title = "Recycled rock still looks damaged"
description = "Because it keeps its remaining health, a recycled damaged rock re-enters still rendering its damaged look, never redrawn as a pristine full-health rock."
reference = "warhead"

