slug = "wireworm"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Wireworm"

# Relative difficulty (easy | medium | hard), surfaced on the site. Wireworm asks
# for a segmented worm that winds and splits over a tile field, a charged-terrain
# model with a chain-reaction discharge, three distinct foes, a persistent growing
# field, a 12-level progression with win and loss, and multiple states — a
# self-contained 2D build, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "shooter"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A fixed-shooter where a segmented data-worm winds down a circuit board and you cut \
it apart from a band at the bottom — and every node the worm bumps gains charge, so \
a critical node you shoot detonates a chain-arc that clears the cluster and fries \
the worm through it. Every segment you shoot leaves a node, so the field thickens \
and drives the worm down faster: build the charge, then release it."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Wireworm is a substantial build (a splitting worm over a tile field, the
# charge/discharge model, three foes, a persistent field, a 12-level progression,
# multiple states), so it gets a generous five hours.
max_runtime_hours = 5

# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins `playwright`
# as a dev dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Provided art assets, seeded into the run root under `assets/`. A directory is
# seeded recursively, so every sprite frame under `assets/` reaches the run. The
# build must render the game with these (see specs/assets.md) and load them with
# page-relative URLs so it works under any base path.
assets = ["assets"]

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This version offers a single `base` variant (the standard Descent run on the one
# board), declared in its own file under `variants/`. It supplies the `title`
# view's menu; `gameplay` and `game-over` are common. Future
# versions/variants are expected to add rule twists (e.g. a longer endless run or
# a denser starting field) as additional variants on top of this base. This list
# is a root key, so it must precede the first table header (`[build]`).
variants = ["variants/base.toml"]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named
# once here so a review item's `validation` driver (and the validator that runs it)
# knows which `window` global to drive. The seeded specification documents the same
# handle independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded.
[instrumentation]
handle = "__wireworm"
# The fixed simulation rate, in Hz. Wireworm's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation
# runtime uses to relate that exact stepping back to real time — one tick is
# 1/120 of a second, so a second of game time is 120 ticks. It must match the
# timestep the seeded specs/instrumentation.md mandates.
tick_hz = 120

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern. All common specs are
# plain Markdown, seeded verbatim.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/board.md"

[[spec]]
source = "specs/charge.md"

[[spec]]
source = "specs/worm.md"

[[spec]]
source = "specs/foes.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/progression.md"

[[spec]]
source = "specs/screens.md"

[[spec]]
source = "specs/assets.md"

# The debugging and automation surface every build must expose: a deterministic,
# steppable, manual-clocked core; a `window.__wireworm` API to drive and inspect
# the game from code; and a read-only debug overlay. Seeded for every variant and
# framed as an ordinary developer affordance of the game.
[[spec]]
source = "specs/instrumentation.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl build — the
# authored, correct game under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. The `title` view is variant-specific (declared per variant
# below); `gameplay` and `game-over` look the same in every variant.
[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-game"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "End screen"
dest = "proof/game-over.png"

[[proof]]
id = "discharge"
name = "Chain-arc discharge clip"
dest = "proof/discharge.webm"

[[proof]]
id = "worm"
name = "Worm split and field clip"
dest = "proof/worm.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless discharge
# system cannot mask a worm that does not wind and split, and vice versa. These
# qualitative per-domain ratings are separate from the point checklist below, which
# is scored globally (the categories grammar attaches no domain to a point).
[[domain]]
id = "charge"
name = "Charge & Discharge"
description = "The signature: nodes charging as the worm bumps them, the shot-into-a-node model (de-energize / clear / detonate), the chain-arc discharge that clears a cluster and cleanly fries the worm, critical nodes making the worm dive, and how shooting thickens the field while discharges thin it."

[[domain]]
id = "arcade"
name = "Worm & Arcade Core"
description = "The fixed-shooter core: the worm winding, dropping/reversing, oscillating, splitting on a mid-segment hit and shortening on an end hit while salting the board with nodes; the band-bound cursor firing up; the three foes; and lives, the 12-level progression, and the win/lose states."

# Reviewer checklist — the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY grouping the points a reviewer grades, and
# each `[[review.categories.items]]` under it is one narrowly-scoped review item,
# worth one point (the default weight), so a category is worth the number of items
# it holds. Every item states one observable behavior in its `description`. The
# checklist is reporter-side material — never seeded into a run, so the model never
# sees it; each restates a requirement the seeded specification already states. An
# item with a `validation` script is decided automatically (the reviewer can
# override); one without is reviewed by a person (the feel/art/audio points and the
# window-fit / HUD / asset-usage points). The UI state items carry a validation
# script too, but only to REACH and CAPTURE each screen through the debug API (the
# auto-verdict confirms the state is reachable); how each screen reads and lays out
# is still left to the reviewer from the capture.
[review]
format = 2

# --- Charge & Discharge -------------------------------------------------------
[[review.categories]]
id = "charge"
title = "Charge & Discharge"
[[review.categories.items]]
id = "bump-charges"
title = "A bumped node gains one charge"
description = "Each time the worm is turned by a chargeable node it energizes that node one level (an inert node bumped once becomes charge 1)."
validation = { script = "validation/charge/bump-charges.mjs", outputs = [
  { id = "bump", name = "The worm charging a node it bumps", kind = "video" },
] }
[[review.categories.items]]
id = "climbs-critical"
title = "Repeated bumps climb to critical and cap at 3"
description = "Successive bumps raise a node's charge one level per bump, 0→1→2→3, and it caps at critical (3): a node already at 3 stays at 3."
validation = { script = "validation/charge/climbs-critical.mjs", outputs = [
  { id = "climb", name = "A node climbing to critical", kind = "video" },
] }
[[review.categories.items]]
id = "shot-inert-destroyed"
title = "A shot into an inert node destroys it"
description = "A bolt into an inert node (charge 0) removes it from the board and scores; a shot never raises a node's charge."
validation = { script = "validation/charge/shot-inert-destroyed.mjs", outputs = [
  { id = "shot", name = "A bolt clearing an inert node", kind = "video" },
] }
[[review.categories.items]]
id = "shot-charged-deenergized"
title = "A shot into a charged node de-energizes it one level"
description = "A bolt into a charge-1 or charge-2 node knocks its charge down one level without removing it, so a charged node resists clearing (charge 2 → 1 → 0 → gone over successive shots)."
validation = { script = "validation/charge/shot-charged-deenergized.mjs", outputs = [
  { id = "deenergize", name = "A charged node de-energizing shot by shot", kind = "video" },
] }
[[review.categories.items]]
id = "shot-critical-detonates"
title = "A shot into a critical node detonates it"
description = "A bolt into a critical node (charge 3) detonates it — removing it entirely (not de-energizing) and scoring the discharge purge — rather than knocking it down one level."
validation = { script = "validation/charge/shot-critical-detonates.mjs", outputs = [
  { id = "detonate", name = "A critical node detonating", kind = "video" },
] }
[[review.categories.items]]
id = "discharge-chains"
title = "The discharge chains through the connected cluster"
description = "A detonation arcs to charged nodes within 2 tiles, which detonate and chain onward through the connected charged cluster, clearing the whole swath; a charged node beyond the chain's reach survives."
validation = { script = "validation/charge/discharge-chains.mjs", outputs = [
  { id = "chain", name = "A chain-arc clearing a charged cluster", kind = "video" },
] }
[[review.categories.items]]
id = "discharge-insulates"
title = "Inert nodes do not conduct the discharge"
description = "An inert node (charge 0) does not detonate and does not carry the chain: an inert node inside the blast stays standing, and a charged node reachable only through it survives."
validation = { script = "validation/charge/discharge-insulates.mjs", outputs = [
  { id = "insulate", name = "An inert node insulating the chain", kind = "video" },
] }
[[review.categories.items]]
id = "discharge-fries-clean"
title = "A discharge fries the worm and leaves no node"
description = "Worm segments within 2 tiles of a detonated node are destroyed by the discharge and leave NO node behind (unlike a bolt-killed segment, which leaves one)."
validation = { script = "validation/charge/discharge-fries-clean.mjs", outputs = [
  { id = "fry", name = "A discharge frying worm segments cleanly", kind = "video" },
] }
[[review.categories.items]]
id = "critical-dive"
title = "A critical node makes the worm dive"
description = "When the worm is blocked by a critical node it dives straight down its own column (ignoring nodes and walls) instead of the normal drop-and-reverse."
validation = { script = "validation/charge/critical-dive.mjs", outputs = [
  { id = "dive", name = "The worm diving down a critical column", kind = "video" },
] }

