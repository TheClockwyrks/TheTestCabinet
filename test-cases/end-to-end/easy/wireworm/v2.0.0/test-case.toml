# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.
#
# THE ORDER OF THIS FILE MATTERS. Every ROOT key — `variants`, `assets`, `init`,
# `max_runtime_hours`, `engines` and the metadata above them — must precede the
# first table header. A root key written after a header such as
# `[instrumentation]` parses as a member of THAT table (`instrumentation.assets`),
# and the case then resolves declaring no assets and no variants at all. The
# layout below is Refract's and Fathom's, key for key.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "wireworm"

# Human-readable display name for this test case.
name = "Wireworm"

# Relative difficulty of this case, surfaced on the site. Wireworm asks for a
# segmented worm that winds a tile field and splits into independent worms when
# shot, a charged-terrain model with a chain-reaction discharge, three foes that
# each manipulate the field, a field that thickens from the player's own fire, a
# band-bound cursor, and a twelve-level run with a win and a loss. It is a lot of
# machinery, but every piece of it is a rule stated over a 40x20 grid: there is no
# physics, no opponent to model, and nothing that has to be tuned by feel.
# Difficulty rates how demanding the THINKING is, not how long the build takes —
# `max_runtime_hours` below is where the size of the job is accounted for. So easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "shooter"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A fixed-shooter descent through a field of charged nodes: a segmented data-worm \
winds down the board, every node it bumps gains charge, and a bolt into a \
critical node detonates a chain-arc that clears the cluster and fries the worm \
through it."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version. The site aggregates every
# version's entry, newest first, into the case's changelog. Like `description`,
# it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected engine) and handed to the model as
# the build instruction. It injects absolute in-container paths through template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Wireworm is a substantial build — the worm's step clock and
# its splitting, the charge model and the chain-arc discharge, three foes with
# their own motion and their own effect on the field, a twelve-level run, six
# screens, ten cues, and, under the engineless run, the whole runtime layer
# beneath all of it. Four hours is comfortably more than a healthy build of that
# size needs while still catching a session that never terminates.
max_runtime_hours = 4

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine — and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# The seeded sprite art, each entry kept at its path relative to this version
# folder when seeded, so `assets/node/` lands at `assets/node/` in the run. Every
# build renders the game from the SAME art and differs only in the code around it,
# which is what makes two runs of this case comparable to look at. Each folder
# holds per-frame 32x32 PNGs; `specs/assets.md` is the contract for the frame
# counts, which frame is drawn for which state, and the animation rates. The
# board, the band, the HUD, the arcs and every screen are still drawn in code.
#
# `assets` is a root key, so it must precede the first table header.
assets = [
  "assets/node",      # the capacitor node, one frame per charge plus the critical pulse
  "assets/worm",      # the data-worm: head, body and tail, two frames each
  "assets/cursor",    # the player's cutter
  "assets/glitch",    # the skittering glitch
  "assets/dropper",   # the node-laying dropper
  "assets/corruptor", # the crawling corruptor
]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Wireworm declares exactly ONE, so every run of this case is the same game: the
# twelve-level Descent, on the one board geometry, with all three foes.
#
# The three FOES are not variants, and neither are the twelve LEVELS. A variant is
# a difference in the game a run is asked to BUILD; the foes and the levels are
# what a single build already contains, gated by the level the player has reached.
# Nothing in the seeded spec set branches on the variant at all — the only axis the
# specs branch on is `engine.slug`, which changes what the build is HANDED rather
# than what it is asked to make.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the input
# actions a player drives it with, the audio bus, asset loading, and the on-screen
# diagnostics; one of them also owns rendering and the gameplay framework the game
# is written inside. It is a *run dimension*, chosen per run alongside the model,
# the harness and the variant, and recorded on the run; it is not a property of the
# game.
#
# Wireworm supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the frame loop, the canvas fit, the keyboard input, the
#                     audio, the debug overlay, the `window.__wireworm` surface,
#                     and every figure the specification fixes, from the specs
#                     alone.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules around
#                     it (`src/constants.ts`, `src/main.ts`, and the `src/game.ts`
#                     stub the build replaces, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes the
#                     whole of `src/game.ts` — the game definition, its mode, its
#                     live state and its actors — and the debug surface its
#                     instance's `initialize` returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to THIS game under it —
# which surfaces the build still supplies, Wireworm's action list, and Wireworm's
# cue names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

# ---- Tables begin here. No root key may follow. -----------------------------

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the canvas, and a `vite.config.ts` that serves the seeded `assets/` tree
# in development and copies it into `dist/` at build. What differs is how much of
# the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     keyboard input, audio, debug overlay and `window.__wireworm`
#                     surface, and every figure the specification fixes, from the
#                     specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes;
#                     the look is NOT among them, and no validator reads it —
#                     each validator project transcribes those figures itself),
#                     `src/main.ts` (the browser entry) and the `src/game.ts` stub
#                     the build replaces.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds `src/constants.ts` and `src/main.ts`. It seeds NO
#                     `src/game.ts`: `src/main.ts` imports one, so a freshly seeded
#                     workspace fails `npx tsc --noEmit` on the missing module.
#                     That failure is the starting point, and `src/main.ts` says so
#                     in its header.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`.
# `npm ci` is deliberate — it requires the build to commit a `package-lock.json`,
# so the validated build installs exactly what the deploy will. Both commands are
# required; there are no defaults, so every case states exactly how its
# implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its
# scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__wireworm` once the game has initialized, so
# the handle is what a person opening the console of such a build finds. An engine
# run has NO global at all: the build writes the surface, its `initialize` returns
# it — beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view, its
# surface is written in the shape of `update` — a pose takes the current state and
# returns the next, applied through `engine.apply`, and a reading takes the state
# and returns what it read, called with `engine.state`. `structured-2d` holds the
# world live, so its poses take only their own arguments and act on it at the call,
# and its readings return plain data. One handle, three ways to reach the same
# operations.
#
# There is deliberately no `tick_hz`. Wireworm mandates no fixed timestep. The
# worm's tile step is CLOCKED — one step every `wormStepInterval(level)` seconds,
# with the catch-up rule `specs/worm.md` states — but that is the worm's own clock,
# started when each worm comes into existence, not a case-wide step size the
# harness could sample at; everything else in the game is a per-second rate
# integrated against the delta time the frame hands it. The key is optional
# precisely so a case clocked this way omits it.
[instrumentation]
handle = "__wireworm"

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. The single variant declares
# none of its own: there is one game here, so there is one spec set.
#
# The specification is decomposed by concern, and EACH RULE LIVES IN EXACTLY ONE
# FILE. Each file is self-contained enough to be read on its own while naming its
# siblings, by file name in plain text, where a fact lives elsewhere.
#
# Every `.hbs` source is rendered before it lands, and ONE axis is branched on:
# `engine.slug`, which selects what the build is handed and what it must write.
# Nothing branches on the variant; there is one variant. A spec's `dest` defaults
# to its `source` with a trailing `.hbs` stripped, so an `.md.hbs` source seeds to
# the same `.md` path and a plain `.md` source is seeded verbatim.

# What the game is and what the finished build must be: the premise, the hard
# requirements, the free choices, the fixed 1280x720 stage and the centre
# convention every reported (x, y) uses, the stage-fit requirement, and the
# legibility table — what a player must be able to read at a glance, which is all
# this case fixes about the look. It names specs/board.md as where the tile-to-
# stage map lives rather than restating it. It branches on the engine for what the
# runtime supplies against what the build writes.
[[spec]]
source = "specs/overview.md.hbs"

# The geometry of the board: the HUD bar and the board beneath it, the 40x20 grid
# of 32-unit tiles, the player band and the cursor's resulting y range, the worm's
# entry row, and SOLE OWNERSHIP of the tile-to-stage map and the inverse a centre
# is read through. Seeded verbatim: nothing in it differs by engine.
[[spec]]
source = "specs/board.md"

# The node field and its charge: the four charge states, what raises a node's
# charge and what caps it, what a bolt does to a node at each charge, what a foe
# does to one, the starting scatter, how the field grows and why it persists.
# Seeded verbatim.
[[spec]]
source = "specs/nodes.md"

# Detonating a critical node: the Chebyshev radius the arc reaches, that inert
# nodes neither detonate nor conduct, that the chain floods the connected charged
# cluster and detonates each node at most once, what it does to the worm standing
# in it, and the arcs it reports. It also owns the arc's DRAWN form — bright
# lightning joining two tile centres, its shape fixed when the arc is created —
# because the discharge owns the discharge. Seeded verbatim.
[[spec]]
source = "specs/discharge.md"

# The data-worm: head, body and tail; the step clock, its catch-up rule and the
# closed form the interval quickens by; the length formula; entry along the top
# row; what blocks a horizontal step and what a block does; that only a horizontal
# step can be blocked, so a drop passes through whatever stands below; the
# oscillation at the floor and the top; the dive on a critical node; and what a
# bolt into the head, the tail or the middle does. Seeded verbatim.
[[spec]]
source = "specs/worm.md"

# The three support foes: each one's motion and speed, its effect on the field,
# how many bolts it takes, and the level gate and pacing it arrives on. It does
# NOT state the life-loss rule — contact belongs to specs/cursor.md, which owns the
# half-extents that decide it, so the rule and the figure that decides it live in
# one file. Seeded verbatim.
[[spec]]
source = "specs/foes.md"

# The cursor and its bolts: the band clamp on all four bounds, the movement rate
# and the diagonal rule, where a bolt spawns, how fast it climbs, what it stops at,
# the fire interval and the bolt cap, and SOLE OWNERSHIP of the contact rule
# together with the extents that decide it. Seeded verbatim.
[[spec]]
source = "specs/cursor.md"

# The keys: every action the game answers to and the keys bound to it, menu
# navigation and confirm, pause, mute, and the overlay toggle. It branches on the
# engine because an engine run registers NAMED ACTIONS against the bindings
# src/constants.ts fixes and reads them from the engine, while an engineless build
# listens to the keyboard itself and reads KeyboardEvent.code.
[[spec]]
source = "specs/controls.md.hbs"

# The run: three starting lives, what costs one, the respawn sequence and its
# invulnerability, the twelve levels, the level-clear rule stated as a TRANSITION
# (so a board holding no segment from which none has been removed is playing rather
# than cleared), the banner and when the level's worm enters, victory, and game
# over. Seeded verbatim.
[[spec]]
source = "specs/progression.md"

# Every score figure the game pays, in one place. Seeded verbatim.
[[spec]]
source = "specs/scoring.md"

# The screens, the HUD and the audio: the six screens and what each shows, the
# title copy and the menu items, the how-to screen, the pause menu, the two end
# screens, the three HUD readouts, and the ten cues with the mute requirement. It
# branches on the engine because cues are defined and played through the engine's
# audio bus on an engine run and the mute bit is the engine's, while under `none`
# the build synthesizes them with the Web Audio API and owns the mute toggle.
[[spec]]
source = "specs/ui.md.hbs"

# The seeded sprite art: the six folders, their frame counts, what each covers, the
# frame size, which frame is drawn for which state, the animation rates and the
# mirroring rule, and what has no asset and is drawn in code. It branches on the
# engine because the engine resolves every path under the fixed `assets/` root
# while an engineless build loads the frames itself, page-relative, so the site
# runs at any base path.
[[spec]]
source = "specs/assets.md.hbs"

# The shape of the game's state. Three shapes, one per engine: under `none` a list
# of what the state must carry, because the build owns the shape; under
# `simple-2d` the exact `WirewormState` declaration to write into `src/game.ts`;
# under `structured-2d` the equivalent live class extending the engine's
# `GameState`.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# render-free core; every operation by name, signature and effect, the three world
# gates among them; the snapshot shape; and a read-only debug overlay. Framed as an
# ordinary developer affordance of the game. It branches on the engine for where
# the surface is reached, the operation shape, and the two clock operations only an
# engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured — a gzipped recording from the engine's own draw-command
# recorder on an engine run, a short clip under `none`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`.
#
# Wireworm v2.0.0 deliberately fixes NO palette, no typeface and no styling: the
# specification seeds the sprite art and states what a player must be able to read
# at a glance (specs/overview.md's legibility table), and everything else about the
# look is the build's own design. A reference view is a picture a build is compared
# AGAINST, so there is no honest one to seed here — every build is expected to look
# different, and a screenshot diff would score the build that copied the mockup best
# rather than the build that designed the best board. v1.x seeded reference mockups
# and a canonical palette; dropping both is one of the things this major bump is
# for.
#
# `[[proof]]` is likewise empty: no proof media is asked of the build. Every piece
# of media a reviewer sees beside a verdict is captured by this case's own
# validation suites, from scenarios the case controls. The showcase spec above does
# ask for media, but as the game's own store-page presentation rather than as
# evidence any point is judged on. The automated load check still runs.

# Scoring domains. This case is on the engine format, so it is validator-rated:
# each domain's FUNCTIONAL rating is decided by the validators behind the point
# checklist below (every point names the domains its failure lowers and how far —
# see `domains` / `failure_cap` there), and the run's overall functional rating is
# the WORST across the domains — an immaculate arcade frame cannot mask a discharge
# that never chains. The reviewer's judgement lives in the separate AESTHETIC
# rating: the look, the polish and the feel, everything this case fixes no picture
# of.
#
# Four domains, cut where a build can plausibly get one right and another wrong:
# the charge model that is this case's signature, the worm that is its subject, the
# arcade frame around both, and the presentation this case hands entirely to the
# build.
[[domain]]
id = "charge"
name = "Charge & Discharge"
description = "The signature: the node field, the charge the worm and the corruptor put into it, what a bolt does to a node at each charge, and the chain-arc discharge that clears a cluster and fries the worm through it."

[[domain]]
id = "worm"
name = "The Data-Worm"
description = "The worm itself: its cadence, how it winds, drops, reverses, oscillates and dives, how a bolt splits or shortens it, and the field it grows as it dies."

[[domain]]
id = "arcade"
name = "Cursor, Foes & Run"
description = "The fixed-shooter frame around the worm: the band-bound cursor and its bolts, the three foes, and the run of lives, levels, victory, loss and score."

[[domain]]
id = "presentation"
name = "Presentation"
description = "What the game looks and sounds like: the screens and their menus, the HUD, the seeded sprite art, whether the palette the build chose is legible and its states told apart, and the audio cues."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY — a bare name grouping the points — and
# each item entry under it is one graded review item, worth one point (the default
# weight), so a category is worth the number of items it holds. Every observable
# behavior on this checklist counts the same, and the relative importance of a
# failure is carried by `failure_cap` rather than by arithmetic, so only ONE item
# declares a `weight` — `showcase.exists`, which grades a deliverable of its own
# rather than a behavior of the game, and says so where it is declared.
#
# A category carries no prose of its own; each item states in `description` the
# claim its validator checks. The checklist is common to every run: there is one
# variant and the three engines produce the same game, so nothing here is
# conditional. It is reporter-side material — never seeded into a run, so the model
# never sees it. Every item restates a requirement the seeded specification already
# states, in the spec's own vocabulary and naming the spec's own constants, and
# every threshold a validator asserts is derived from a figure or rule in the specs
# plus a numeric tolerance stated in the item.
#
# EVERY point carries a validation script, and every point is ONE OBSERVABLE
# BEHAVIOR, so a build fails exactly the rule it breaks: the drop that passes
# through a node and the charge that node keeps are two points, not one. Each
# script is a vitest suite under `validation/<engine>/<category>/<item id>.test.ts`.
# The `<engine>` level is the ENGINE the suite is written against — a validator
# speaks one engine's vocabulary, so this case, which supports three, ships one
# directory per engine. `validation/none/` drives the build in Chromium through
# `window.__wireworm`, with a page-injected 2D-context recorder for the draws and
# an injected audio shim for the cues; `validation/simple-2d/` and
# `validation/structured-2d/` each run in process against their vendored engine,
# posing scenarios through the surface `engine.debug` returns, reading state back
# from the snapshot, audio from the engine's `cue:played` event, and drawing from
# the canvas pixels or the engine's own draw-command recorder. The three are the
# same scenarios; only how they reach the build differs. The directory for the
# run's engine is what gets staged into the built workspace at `validation/`.
#
# EVERY SCENARIO IS POSED, AND POSED EMPTY. The shared harness's `startPlaying`
# clears the nodes, worms, foes and bolts, turns the three world gates off, and
# opens an active level — so a validator's world holds only what its requirement
# concerns and nothing it did not ask for arrives, enters or costs a life. An empty
# board is safe because a level clears on a TRANSITION rather than on a predicate
# (`progression.empty-board-does-not-clear` is what holds a build to that). Turning
# a gate back on is the exception, and the point that does it is the point whose
# requirement the gate is.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. `kind` is decided ONCE here and serves all three engines —
# `validation = { script, outputs }` is a per-item key, there is no per-engine
# `outputs`, and the extension an output is served under is fixed by its kind, so a
# kind that varied by engine would serve one engine's file under another's name.
# `image` is the default: a single captured frame, which is the right evidence for
# a posed board read once. `replay` is the exception, declared on the handful of
# points whose requirement IS motion — the worm winding, the chain running down a
# line, a one-second hold, a foe's descent — where a reviewer wants to scrub. There
# is no `video` anywhere. Both are evidence beside the verdict rather than any part
# of it: a point passes or fails on its assertions alone.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers — a discharge point
# lowers `charge`, a point about the worm standing in that discharge lowers `worm`
# as well, and an instrumentation point, which every suite in every domain drives
# through, lowers all four. `failure_cap` is the highest functional rating those
# domains may reach while the point fails; each domain gets the LOWEST cap among
# its failing points, and a domain with no failing point is flawless. The caps are
# graded by how much of the game a failure takes away: `broken` where the game
# cannot be played as intended (no debug surface, a worm that does not wind, a
# discharge that never chains, a run that cannot be opened); `scuffed` where an
# optional path is unplayable or normal play is unpleasant (a foe that moves
# wrongly, a screen that misreports the run); `passable` where it affects play
# without breaking it (a tolerance, an edge case, a cue); and `great` where the
# standard flow is untouched (a cosmetic detail, a menu nicety). No point caps at
# `flawless`: a failure always costs.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# game is driven and inspected from code, and every other suite on this checklist
# poses its scenario through it. These points check that it is really there,
# really wired to the running game, really deterministic, and that each pose
# reads back — a surface that reports a plausible-looking object unconnected to
# what is on screen is the failure mode worth naming.
#
# Seven of them are the three GATES and the four FACULTY switches. A validator
# poses a world holding only what its requirement concerns, and Wireworm's own
# figures put a glitch on the board within twelve seconds and a level's worm on
# it the moment a banner gives way, so without the gates a posed scenario would
# be joined by traffic it never asked for. `setFoeSpawning`, `setWormEntry` and
# `setCursorContact` each gate ONE faculty and nothing else, default to on, and
# are restored to on by `reset`; `setWormStepping`, `setWormBody`, `setFoeMind`
# and `setFoeTravel` do the same per entity. Each is verifiable by set-then-read,
# and each has a point here because a gate the suite leans on has to be known to
# work before anything leaning on it means anything.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug surface is present and complete"
description = "Every operation specs/instrumentation.md names is a function on the surface, version is WIREWORM_DEBUG_VERSION (1), and the surface is live: a posed node reads back and a posed worm steps."
domains = ["charge", "worm", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "live", name = "The posed node and the stepped worm the surface drove", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed board carrying nodes at all four charges, two worms, one foe of each kind, a bolt in flight and a live discharge, every field listed in the snapshot shape is present with its documented type."
