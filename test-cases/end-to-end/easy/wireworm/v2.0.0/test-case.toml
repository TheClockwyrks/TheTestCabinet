# --- Controls -----------------------------------------------------------------
# Each point holds or presses ONE binding on a posed live board and reads the
# result, so a build that bound a key to the wrong action fails exactly the key
# it got wrong. The four movement pairs and the fire key are capped `broken`
# because the game cannot be played without them; the menu and system keys are
# `scuffed`. Every one names `arcade`: these are the keys the arcade frame is
# driven by.
#
# The points assert DIRECTION, not rate. How fast a held key moves the cursor is
