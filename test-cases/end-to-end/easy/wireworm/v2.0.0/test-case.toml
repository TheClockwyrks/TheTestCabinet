# --- Audio --------------------------------------------------------------------
# Ten cues, one point each, plus mute. Each drives its event on an otherwise
# silent board and reads the cue the build played: under an engine, from the
# engine's `cue:played` event; under `none`, from the Web Audio sources the build
# started.
#
# Mute is reached through the real KeyM binding and read from the snapshot's
# `muted`, because there is no `setMuted` operation — under simple-2d a pose is a
# pure transform over the state and could not reach the audio bus, so such an
# operation would be a boolean that silenced nothing.
#
# There is deliberately NO "the cues sound different from one another" point.
# Under `none` a cue is a Web Audio graph the build synthesizes, and no measure
# of two synthesized cues being distinct traces to any figure this specification
# fixes, so any threshold a validator invented would be the validator's opinion
# rather than the case's requirement. Cue character is what the presentation
# domain rating is for.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "fire"
title = "Firing a bolt plays the fire cue"
description = "Firing a bolt on an otherwise silent board plays the fire cue, once, on the frame the bolt appears."
