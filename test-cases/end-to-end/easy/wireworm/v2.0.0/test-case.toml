[[review.categories.items]]
id = "poses-read-back"
title = "Every pose is reported by the snapshot"
description = "Each pose operation's value is read back by snapshot: screen, phase, phase timer, menu index, score, lives, level, reached level, cursor position and invulnerability, fire cooldown, a node's charge, a worm's headings, diving flag and two faculties, a foe's velocity, hit flag and two faculties, a bolt's position, and the three world gates. Mute is not in the list: there is no setMuted, and muted is a live read of the runtime's bit (section 2)."
