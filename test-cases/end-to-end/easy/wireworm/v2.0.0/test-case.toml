# --- The run ------------------------------------------------------------------
# Lives, respawn, the twelve levels, and the two ways a run ends.
#
# `level-clears-on-last-segment` and `empty-board-does-not-clear` are two points,
# not one, because the level-clear rule is a TRANSITION rather than a predicate:
# a level clears on the step in which the last of its segments is removed, and a
# board that never held one is playing rather than cleared. The second direction
# is what makes the shared harness's empty posed board safe, so a build that
# fails it makes every mechanic scenario in the suite impossible to pose —
# which is why it is capped `broken` in its own right rather than folded into
