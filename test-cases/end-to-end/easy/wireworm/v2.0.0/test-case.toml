# --- The cursor and its bolts -------------------------------------------------
# The band-bound cursor, its rate, and the bolts it fires.
#
# EVERY probe here is sized to the band, and that sizing is load-bearing. The
# band is 32 units tall — y in [672, 704] — which a cursor at CURSOR_SPEED (430)
# crosses in 0.074 s, so a vertical probe over any useful window measures the
# CLAMP and not the rate. Hence: `move-speed` takes two HORIZONTAL probes only;
# `diagonal-speed` reads the HORIZONTAL component (304, which is 430 / sqrt(2))
# because that is what separates a normalized diagonal from an unnormalized one
# and it survives the vertical clamp; the two horizontal clamp points pose the
# cursor 120 units inside the bound they test so that no clamp point measures
# speed by accident; and the two vertical clamp points pose it at the OPPOSITE
# bound instead, because a 32-unit band cannot hold a 120-unit inset and
# `setCursor` applies the real clamp, so such a pose would silently land
# somewhere the point's own description never describes.
[[review.categories]]
id = "cursor"
title = "The cursor and its bolts"
[[review.categories.items]]
id = "clamped-left"
title = "The cursor stops at the left edge"
description = "Posed 120 units inside the left bound — the inset is the horizontal pair's, since only the horizontal axis is wide enough to hold it — and driven left for a second, the cursor's centre x rests at CURSOR_X_MIN (16) and goes no lower."
domains = ["arcade"]
failure_cap = "broken"
# Posed 120 units inside the bound, so the probe measures the clamp and not the
# rate. A horizontal clamp probe that starts far from its bound quietly demands
# a minimum speed of the build, which is the defect this inset exists to remove.
validation = { script = "cursor/clamped-left.test.ts", outputs = [
  { id = "clamped", name = "The cursor resting on the left bound", kind = "image" },
] }
[[review.categories.items]]
id = "clamped-right"
title = "The cursor stops at the right edge"
description = "Posed 120 units inside the right bound and driven right for a second, the cursor's centre x rests at CURSOR_X_MAX (1264) and goes no higher."
domains = ["arcade"]
failure_cap = "broken"
validation = { script = "cursor/clamped-right.test.ts", outputs = [
  { id = "clamped", name = "The cursor resting on the right bound", kind = "image" },
] }
[[review.categories.items]]
id = "clamped-top"
title = "The cursor stops at the band's top"
description = "Posed at CURSOR_Y_MAX (704), the opposite bound, and driven up for a second — thirteen times the 0.074 s the 32-unit band takes to cross — the cursor's centre y rests at CURSOR_Y_MIN (672) and goes no lower. The 120-unit inset the horizontal pair uses does not apply: the band cannot hold it, and setCursor applies the real clamp."
domains = ["arcade"]
failure_cap = "broken"
# No inset here, and that is not an oversight: the band is 32 units tall, so a
# pose 120 units inside a vertical bound would be clamped straight onto the other
# bound and the scenario the description states would never have happened.
validation = { script = "cursor/clamped-top.test.ts", outputs = [
  { id = "clamped", name = "The cursor resting on the band's top", kind = "image" },
] }
[[review.categories.items]]
id = "clamped-bottom"
title = "The cursor stops at the floor"
description = "Posed at CURSOR_Y_MIN (672) and driven down for a second, the cursor's centre y rests at CURSOR_Y_MAX (704) and goes no higher."
