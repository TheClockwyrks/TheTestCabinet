# --- The support foes ---------------------------------------------------------
# Each foe's motion, its effect on the field, how it dies, and when it starts
# appearing. A foe acts on the tile its CENTRE occupies, which is what makes
# `setFoeTravel(id, false)` produce a scenario with no motion in it at all: the
# eating, the laying and the slamming points each pose a stationary foe on a
# known tile and read one tile back.
#
# The two motion points are stated as distances against the figures the specs
# fix, never as booleans, and `glitch-darts` asserts a rule specs/foes.md states
# outright — at each GLITCH_DART_INTERVAL the glitch reverses its horizontal
# direction — rather than an unstated random re-pick. A validator that assumed
# randomness would fail a spec-honouring build on an unlucky seed.
