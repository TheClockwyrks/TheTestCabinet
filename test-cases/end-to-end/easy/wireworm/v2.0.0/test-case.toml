failure_cap = "passable"
validation = { script = "pointer/slide-off-cancels.test.ts", outputs = [
  { id = "title", name = "The title still showing after the pointer slid off", kind = "image" },
] }

# --- Touch --------------------------------------------------------------------
# specs/ui.md gives every menu screen a finger as well as the keyboard and the
# mouse, and a finger is not a small mouse: it never hovers, so the first the
# build hears of it is the contact LANDING, and the landing is what selects. Each
# point below drives one real touch contact — carrying the device a finger
# carries — at the middle of the region the build reports through `menuItemRect`,
# so any layout passes and only the handling is graded. The three are the three
# behaviors specs/ui.md gives a contact: a landing selects, a lift inside the
# region it landed in confirms that item, and a lift in a different region
# confirms nothing while the selection follows the finger. All three are graded on
# the title menu, where a confirm that should not have happened is loud (a run
# opens) and one that should have is silent (the title stays). The mouse's own
# edges are the `pointer` category's points, not these.
[[review.categories]]
id = "touch"
title = "Touch"
[[review.categories.items]]
id = "landing-selects"
title = "A touch contact selects the item it lands on"
description = "On the title with the highlight on DESCEND, a touch contact landing inside the region menuItemRect reports for HOW TO PLAY, and not lifted, sets menuIndex to that item."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "touch/landing-selects.test.ts", outputs = [
  { id = "selected", name = "The title menu with the item the contact landed on selected", kind = "image" },
] }
[[review.categories.items]]
id = "tap-confirms"
title = "A contact that lifts where it landed confirms that item"
description = "On the title with the highlight on DESCEND, a touch contact landing and lifting inside the region menuItemRect reports for HOW TO PLAY sets screen to howto."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "touch/tap-confirms.test.ts", outputs = [
  { id = "howto", name = "The how-to screen opened by a tap", kind = "image" },
] }
[[review.categories.items]]
id = "drag-cancels"
title = "A contact that lifts on a different item confirms nothing"
description = "On the title, a touch contact landing inside DESCEND's region, travelling onto HOW TO PLAY's and lifting there leaves screen at title, with menuIndex on HOW TO PLAY."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "touch/drag-cancels.test.ts", outputs = [
  { id = "title", name = "The title still showing after the contact slid off", kind = "image" },
] }

# --- Look and readouts --------------------------------------------------------
# This case seeds no palette and no typeface, so there is no hex value on this
# checklist to assert. Every color point instead checks PRESENCE and
# SEPARATION, against a stated RGB distance out of 441 — which is exactly
# what specs/overview.md's legibility table asks a player to be able to read at a
# glance, and nothing more. A build that designs a beautiful board its own way
# passes every one of them.
#
# Every sprite point reads the IMAGE SOURCE handed to each draw and matches it
# against the seeded PNG read off the workspace's own assets/ tree, rather than
# sampling stage pixels: the art is fixed by the case, so what is checkable is
# that the build drew from it.
[[review.categories]]
id = "presentation"
title = "Look and readouts"
