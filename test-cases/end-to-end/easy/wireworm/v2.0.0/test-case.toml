# --- The chain-arc discharge --------------------------------------------------
# What a bolt into a critical node sets off: the chain through the connected
# charged cluster, what it spares, and what it does to the worm standing in it.
# Both directions of each boundary are their own point — `chain-reaches` against
# `chain-stops`, `fries-segments-in-reach` against `spares-segments-beyond-reach`
# — because a build that detonates the whole board and a build that detonates
# nothing would score the same on a single paired point.
#
# What is asserted here is the LINK SET, never the drawn polyline. The chain rule
# fixes which pairs of tiles conduct; the lightning's shape is appearance, is
# reviewed rather than scored, and only `presentation.arcs-drawn` touches it, and
