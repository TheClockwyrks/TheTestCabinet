# --- Pointer ------------------------------------------------------------------
# specs/ui.md drives every menu screen with a mouse as well as with the keyboard,
# over item regions the BUILD lays out and reports through `menuItemRect`. The
# case fixes no menu geometry, so each point below asks the build where it put the
# item and drives the real pointer at the middle of that region: any layout passes,
# and a build that reports a region it does not answer on fails. The three points
# are the three behaviors specs/ui.md gives the pointer — a move selects, a press
# and its release inside one item confirms that item, and two edges that fall in
# different items confirm nothing. Each is graded on the title menu, where both
# entries confirm to screens a check reads straight off `screen`. The keyboard's
# own edges are the `controls` and `screens` categories' points, not these.
[[review.categories]]
id = "pointer"
title = "Pointer"
[[review.categories.items]]
id = "hover-selects"
title = "Moving the pointer onto an item selects it"
description = "On the title with the highlight on DESCEND, moving the pointer onto the region menuItemRect reports for HOW TO PLAY sets menuIndex to that item, with screen still title."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "pointer/hover-selects.test.ts", outputs = [
  { id = "menu", name = "The title menu with the hovered item selected", kind = "image" },
] }
[[review.categories.items]]
id = "click-confirms"
title = "A press and release inside one item confirms it"
description = "On the title with the highlight on DESCEND, pressing and releasing the pointer inside the region menuItemRect reports for HOW TO PLAY sets screen to howto."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "pointer/click-confirms.test.ts", outputs = [
  { id = "howto", name = "The how-to screen opened by a click", kind = "image" },
] }
[[review.categories.items]]
id = "slide-off-cancels"
