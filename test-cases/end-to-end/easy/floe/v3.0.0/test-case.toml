# --- Screens ------------------------------------------------------------------
# That the six screens are reachable, correct and navigable.
#
# The four end-screen entries are four items rather than one, and four rather than
# two. PLAY AGAIN and MENU are two transitions, and the victory screen and the
# game-over screen are two screens whose entries a build can get right on one and
# wrong on the other; a build whose victory MENU is broken must grade differently
# from one with all four broken. Each of the four reaches its own end screen
# through `setScreen`, so none passes through the other's screen on the way.
