# --- Screens ------------------------------------------------------------------
# That the six screens are reachable, correct and navigable.
#
# The four end-screen entries are four items rather than one, and four rather than
# two. PLAY AGAIN and MENU are two transitions, and the victory screen and the
# game-over screen are two screens whose entries a build can get right on one and
# wrong on the other; a build whose victory MENU is broken must grade differently
# from one with all four broken. Each of the four reaches its own end screen
# through `setScreen`, so none passes through the other's screen on the way.
#
# THE SUSPENSION specs/progression.md OWNS IS FIVE ITEMS, because `pause-freezes`
# and `pause-resume` decide less of it than their titles suggest. The first reads
# positions — every lane item's x, the critter's centre, each bear's centre — and
# the second reads the fields it lists back after RESUME, and both run on the
# empty, quiet strait every suite poses, with the four world gates shut. So neither
# of them can see the three things a build most easily gets wrong behind a pause
# menu, and each of those is its own item: `pause-holds-timer` (the crossing clock,
# whose `pause-resume` reading holds for any build at all while the timer gate is
# shut, since the clock was never going to move), `pause-holds-fish` (the bonus
# catch's bay and its linger), and `pause-holds-phase-timer` (a hold running out
# while the game is paused). The first two turn ONE world gate back on, the one
# their requirement IS, which is what puts them in the closed list of items that do.
# `simTime` is the one quantity that keeps accumulating while `paused` shows, so no
# item in the set reads it.
#
# EVERY ROUTE BACK TO `title` NAMES THE ENTRY IT LANDS ON, because specs/ui.md
# fixes both halves and a build can reach the right screen on the wrong entry.
# `howto-returns` and `howto-confirm-returns` land on HOW TO PLAY, the entry the
# how-to screen was opened from; `pause-quit`, `victory-menu`, `gameover-menu`,
# `victory-back` and `gameover-back` land on CROSS, the entry that started the run.
# The screen and the selection are one claim per route rather than two items,
# because a return that lands on the wrong entry is the same miss as a return that
# lands on the wrong screen: the player is not where the route said they would be.
