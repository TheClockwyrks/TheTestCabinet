# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "floe"

# Human-readable display name for this test case.
name = "Floe"

# Relative difficulty of this case, surfaced on the site. Floe is a great deal of
# *work* — sixteen lanes of moving traffic, a pursuing hunter with real routing
# across both bands, five bays, a timer, an eight-level run, six screens, and
# under `none` the whole runtime layer beneath all of it — but none of it is hard
# to reason about: the strait is a 40x20 grid of 32-unit tiles, every rate is a
# constant, and there is no physics and no opponent to tune. Difficulty rates how
# demanding the *thinking* is rather than how long the build takes;
# `max_runtime_hours` below is where the size of the job is accounted for. So
# easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "crossing"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A single-screen crossing game where a small critter hops across lanes of sliding \
ice and drifting floes to reach the far-shore bays, hunted the whole way by a polar \
bear that dodges the same traffic and swims out after it."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version. The site aggregates every
# version's entry, newest first, into the case's changelog. Like `description`, it
# is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected engine) and handed to the model as
# the build instruction. It injects absolute in-container paths through template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Floe asks for a fixed-step simulation, sixteen populated
# lanes that wrap without breaking their spacing, a hunter that routes around
# moving traffic and swims, five bays with a bonus catch on its own cadence, a
# timer, an eight-level run with a victory and a loss, six screens, ten audio
# cues, the seeded sprite art drawn correctly, and — under `none` — the frame
# loop, the canvas fit, the keyboard, the audio and the debug overlay beneath all
# of that. v2.0.0 gave it five hours and it stays at five.
max_runtime_hours = 5

# Init command, run in the run container once the workspace, the assets and the
# specs are seeded and before the harness starts. It installs the seeded project's
# dependencies — the TypeScript toolchain the `[toolchain]` commands invoke, the
# headless canvas the model's own vitest tests can draw through, and, on an engine
# run, the vendored engine — and downloads the Playwright Chromium build (the base
# image ships the OS libraries Chromium links against, but not the browser
# binary), so the model can build the game and look at it in a browser without any
# further setup.
init = "npm install && npx playwright install chromium"

# Provided art, seeded into the run root under `assets/`. Each entry is a
# directory, seeded recursively and landing at the same path in the run, so
# `assets/bear/` reaches the run as `assets/bear/`. Floe ships a fixed set of
# pre-drawn 32-unit sprite frames and the build renders the game FROM THEM rather
# than drawing shapes in code or bringing art of its own; `specs/assets.md` is the
# contract for what each folder holds, how many frames it has, and which frame is
# drawn for which state. Nothing else about the look is fixed — the bands, the
# HUD, the screens and the palette are the build's own design.
#
# `assets` is a root key, so it must precede the first table header.
assets = [
  "assets/crosser",  # the critter, eight frames: two per facing
  "assets/bear",     # the hunter, eighteen frames: run, swim and lunge
  "assets/plow",     # the three-tile ice vehicle
  "assets/dogsled",  # the two-tile ice vehicle
  "assets/car",      # the other two-tile ice vehicle
  "assets/pan",      # the one-tile floe
  "assets/raft",     # the three- and four-tile floes, two sheets
]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Floe declares exactly ONE, so every run of this case is the same game on the
# same strait.
#
# The eight levels are not variants. They are the run's own progression, reached
# by playing, exactly as Carom's Solo and Versus are modes inside every variant
# rather than variants of their own. A variant is a difference in the *game a run
# is asked to build*; a level is a difference in what the finished game does with
# the player who reaches it. Nothing in the seeded spec set branches on the
# variant at all — the only axis the specs branch on is `engine.slug`, which
# changes what the build is handed rather than what it is asked to make.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics; one of them also owns rendering and the gameplay
# framework the game is written inside. It is a *run dimension*, chosen per run
# alongside the model, the harness, and the variant, and recorded on the run; it
# is not a property of the game.
#
# Floe supports three, and the game is the same under all of them. What differs is
# how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop, the fixed-tick accumulator, the
#                     canvas fit, the keyboard, the audio, the overlay and the
#                     `window.__floe` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around it (`src/constants.ts`, `src/main.ts`, and the
#                     `src/game.ts` stub the build replaces, debug surface
#                     included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes its
#                     game module — the game definition, its mode, its live state
#                     and its actors — and the debug surface its instance's
#                     `initialize` returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable
# differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to *this game* under it —
# which surfaces the build still supplies, Floe's action list, and Floe's cue
# names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

# ---- Tables begin here. No root key may follow. ----------------------------
#
# `variants`, `assets`, `init`, `max_runtime_hours` and `engines` above are ROOT
# keys. Written after a header such as `[instrumentation]` they would parse as
# `instrumentation.variants` and `instrumentation.assets`, and the case would then
# declare no variants and no assets at all and be rejected at resolution.

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the canvas, and a `vite.config.ts` that serves the seeded `assets/` tree
# in development and copies it into `dist/` at build. What differs is how much of
# the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop and fixed-tick
#                     accumulator, canvas fit, keyboard input, audio, diagnostics
#                     overlay and `window.__floe` surface, and every figure the
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them),
#                     `src/main.ts` (the browser entry), and a `src/game.ts` stub
#                     written against types it does not declare, so the project
#                     does not type-check until the build declares them.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules — and NO `src/game.ts`
#                     at all. `src/main.ts` imports it, so the first `tsc` on a
#                     freshly seeded workspace fails on the missing module. That
#                     failure is the starting point, and `src/main.ts` says so.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`,
# `build/`, or `out/`. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. Both commands are required; there are no defaults, so every case states
# exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its
# scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__floe` once the game has initialized, so the
# handle is what a person opening the console of such a build finds. An engine run
# has NO global at all: the build writes the surface, its `initialize` returns it —
# beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view, its
# surface is written in the shape of `update` — a pose takes the current state and
# returns the next, applied through `engine.apply`, and a reading takes the state
# and returns what it read, called with `engine.state`. `structured-2d` holds the
# world live, so its poses take only their own arguments and act on it at the call,
# and its readings return plain data. One handle, three ways to reach the same
# operations.
#
# `tick_hz` states the game's own fixed rate, `TICK_HZ` (120) from
# `specs/overview.md` and asserted by `instrumentation.tick-length`. The engineless
# surface steps in whole simulation TICKS — `advance(ticks)`, one tick of `TICK_DT`
# each — and the contract is that a case which steps in ticks declares the rate the
# stepped ticks are worth, which is what lets a runtime relate them back to real
# time. Under an engine the validators still supply their own `ConstantClock` and
# call `engine.advance(n)`, so the declaration changes nothing they do; it states
# the rate of the step the debug surface itself takes.
[instrumentation]
handle = "__floe"
tick_hz = 120

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. The single variant declares
# none of its own: there is one game here, so there is one spec set.
#
# The specification is decomposed by concern into fifteen files, each named so its
# contents are predictable and each owning its rules outright — a rule lives in
# exactly one file, and a file that needs a fact from a sibling names that sibling
# in plain text rather than linking to it.
#
# Every `.hbs` source is rendered before it lands, and ONE axis is branched on:
# `engine.slug`, which selects what the build is handed and what it must write.
# Nothing branches on the variant. A spec's `dest` defaults to its `source` with a
# trailing `.hbs` stripped, so an `.md.hbs` source seeds to the same `.md` path and
# a plain `.md` source is seeded verbatim.

# The game, the project, and the model the whole simulation runs on: the premise,
# the hard requirements, the free choices, the fixed 1280x720 stage and its
# uniform fit, the centre convention for the critter and the bears against the
# left-edge convention for a lane item, the fixed timestep, and the legibility
# table that says what a player must be able to tell apart without fixing a single
# color. It branches on the engine for what the runtime supplies, which modules
# are seeded, where the figures come from, and how the fixed tick is driven.
[[spec]]
source = "specs/overview.md.hbs"

# The geometry of the strait: the HUD bar above it, the 40x20 grid of 32-unit
# tiles, SOLE OWNERSHIP of the tile-to-stage map every position in the game
# derives from, the five bands and their rows, the critter's start column, and the
# five bays' exact column pairs. Seeded verbatim: nothing in it differs by engine.
[[spec]]
source = "specs/strait.md"

# How the critter moves: one tile per press, the cooldown and the auto-repeat, the
# absolute-tile rule that holds however fast the floe under it is drifting, and
# sole ownership of every rule that refuses a hop. Seeded verbatim.
[[spec]]
source = "specs/hopping.md"

# The ice band: eight lanes of sliding vehicles, their kinds and lengths, the
# even-spacing population model and the wrap that keeps it uniform, the per-level
# scaling, and the covering rule a hop and a bear's route both read. Seeded
# verbatim.
[[spec]]
source = "specs/ice.md"

# The water band: eight lanes of drifting floes in the same shape as the ice band,
# plus what the water itself does — deep water that costs a life, a floe that
# carries its rider, and an edge that sweeps one away. Seeded verbatim.
[[spec]]
source = "specs/water.md"

# The five goal bays and the bonus catch: what fills a bay, that a level clears on
# the HOP that fills the last one rather than on the count reaching five, and the
# bonus catch's own cadence. Seeded verbatim.
[[spec]]
source = "specs/bays.md"

# The signature system: the bear. What it is, how it glides, how fast it travels
# on ice and in the water, when it emerges, how it routes toward the critter
# around moving traffic and what it does when no route exists, what resets it, and
# what happens when it arrives. Seeded verbatim.
[[spec]]
source = "specs/hunter.md"

# The run: lives and what costs one, the crossing timer, the three sub-phases and
# their pauses, the respawn, the eight-level progression with its victory and its
# loss, the bonus life, and what the paused screen suspends. Seeded verbatim.
[[spec]]
source = "specs/progression.md"

# Every score figure in one place, with the worked total for a completing hop.
# Seeded verbatim.
[[spec]]
source = "specs/scoring.md"

# The keys: every action the game answers to and what is bound to it, menu
# navigation, pause, mute and the overlay toggle. It branches on the engine
# because an engine run registers named actions and reads them back, while an
# engineless build listens to the keyboard itself and reads `KeyboardEvent.code`.
[[spec]]
source = "specs/controls.md.hbs"

# The six screens, the five HUD readouts, and the ten audio cues. It branches on
# the engine for where cues are defined and played and who owns the mute bit.
[[spec]]
source = "specs/ui.md.hbs"

# The seeded sprite art: the seven folders, their frame counts and sizes, which
# frame is drawn for which state, and HOW a frame is drawn — the extent a lane
# item's frame covers and the sub-rect each raft is taken from, neither of which
# is derivable from the folder table. It branches on the engine for how a frame is
# loaded.
[[spec]]
source = "specs/assets.md.hbs"

# The shape of the game's state. Under `simple-2d` this is the exact `FloeState`
# declaration the build writes into `src/game.ts`, stated by the case rather than
# by the seeded stub; under `structured-2d` it is the equivalent live class
# extending the engine's `GameState`; under `none` the build owns the shape and
# the file lists only what the state must carry, because the rest of the
# specification is written against those facts.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# render-free core; an API to drive and inspect the game from code through its own
# real input path, including the four world gates and the three per-bear gates;
# the snapshot shape; and a read-only debug overlay. Framed as an ordinary
# developer affordance of the game. It branches on the engine for how the surface
# is reached, the shape its operations take, and the two clock operations only an
# engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured (a gzipped recording from the engine's own draw-command
# recorder on an engine run, a clip under `none`); it seeds to
# `specs/showcase.md`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`.
#
# Floe deliberately fixes no palette, no typeface, no HUD layout and no
# background: the look of the strait is the build's own design, and
# `specs/overview.md` says so in as many words. A reference view is a picture a
# build is compared AGAINST, so there is no honest one to seed here — every build
# is expected to look different, and a screenshot diff would score the build that
# copied the mockup best rather than the build that designed the best strait. What
# the specification does fix about appearance is stated as legibility a player
# depends on (the five bands told apart, deep water distinct from a floe, a
# submerged bear still trackable, a vehicle reading as covering every tile it
# spans), and the `strait` and `presentation` items below decide exactly that,
# from the pixels the build renders and against thresholds each item states —
# while how GOOD the strait looks is rated through the run-wide aesthetic rating,
# not scored here. The seeded sprite art is the one thing a picture IS seeded for,
# and it is seeded as art to draw with rather than as a target to match.
#
# `[[proof]]` is likewise empty: no proof media is asked of the build. Every piece
# of media a reviewer sees beside a verdict is captured by this case's own
# validation suites, from scenarios the case controls. The showcase spec above
# does ask for media, but as the game's own store-page presentation rather than as
# evidence any point is judged on. The automated load check still runs.

# Scoring domains. This case is on the engine format, so it is validator-rated:
# each domain's FUNCTIONAL rating is decided by the validators behind the item
# checklist below (every item names the domains its failure lowers and how far —
# see `domains` / `failure_cap` there), and the run's overall functional rating is
# the WORST across the domains — an immaculate crossing cannot mask a bear that
# never emerges. The reviewer's judgement lives in the separate AESTHETIC rating:
# the look, the polish, and the feel — the designed strait, the legible HUD, the
# weight of a hop — everything this case fixes no picture of.
#
# Four domains: the signature system on its own, the crossing it hunts you
# through, the run that frames it, and the presentation this case hands entirely
# to the build. A build can plausibly get any one of them right and another wrong.
[[domain]]
id = "hunter"
name = "The Hunter"
description = "The signature: a bear emerging at the near shore and gliding continuously after the critter across the whole strait, routing around the sliding hazards and being reset by one that arrives on it, swimming out over the open water, catching a critter that hesitates, resetting between crossings, and speeding up and doubling with the level."

[[domain]]
id = "crossing"
name = "The Crossing"
description = "The crossing core: the one-tile hop and every rule that refuses it, the eight lanes of sliding vehicles, the eight lanes of drifting floes with their carry, fall-in and off-edge deaths, and the five far-shore bays."

[[domain]]
id = "run"
name = "The Run"
description = "The frame around the crossing: three lives and what costs one, the crossing timer, the death pause and the respawn, the eight-level progression with its victory and its loss, every score figure, and the six screens and their menus."

[[domain]]
id = "presentation"
name = "Presentation"
description = "What the game looks and sounds like: the seeded sprite art and how it is drawn, the HUD, whether the bands and the actors on them are told apart, and the ten audio cues."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY — a bare name grouping the items — and
# each item entry under it is one graded review item, worth one point (the default
# weight), so a category is worth the number of items it holds. A category carries
# no prose of its own; each item states in `description` the claim its validator
# checks. The checklist is common to every run: there is one variant and the three
# engines produce the same game, so nothing here is conditional. It is
# reporter-side material — never seeded into a run, so the model never sees it.
# Every item restates a requirement the seeded specification already states, in
# the spec's own vocabulary and naming the spec's own constants, and every
# threshold a validator asserts is derived from a figure or rule in the specs plus
# a numeric tolerance stated in the item.
#
# EVERY item on this checklist carries a validation script, and every item is one
# observable behavior, so a build fails exactly the rule it breaks (a bear that
# will not enter a covered tile and a bear that will not enter the far shore are
# two items, not one). Each script is a vitest suite under
# `validation/<engine>/<category>/<item id>.test.ts`. The `<engine>` level is the
# ENGINE the suite is written against — a validator speaks one engine's
# vocabulary, so this case, which supports three, ships one directory per engine.
# `validation/none/` drives the build in Chromium through `window.__floe`, with a
# page-injected draw-command recorder and an injected audio shim; `validation/
# simple-2d/` and `validation/structured-2d/` each run in process against their
# vendored engine, posing scenarios through the surface `engine.debug` returns,
# reading state back from the snapshot, audio from the engine's `cue:played`
# event, and drawing from the canvas pixels or the engine's own draw-command
# recorder. The three are the same scenarios; only how they reach the build
# differs. The directory for the run's engine is what gets staged into the built
# workspace at `validation/`.
#
# EVERY suite poses its scenario on an EMPTY, QUIET strait. The shared harness's
# `startCrossing` resets, sets the level, and only THEN clears the two lane
# rosters, the bears, the bays and the fish — the order is load-bearing, because
# `setLevel` re-lays the sixteen lanes by design, so clearing first and setting the
# level second would put the traffic straight back. It then turns all four world
# gates off, so no bear emerges into a scenario about a floe, no bonus catch adds
# 200 to a scenario about a bay, no crossing timer expires under a scenario that
# runs thirty seconds, and no incidental catch ends one. Exactly the items whose
# requirement IS one of those faculties turn the one they need back on, and those
# items say so.
#
# THE MEDIA an item declares is produced by its own suite, from the scenario the
# case controls. Floe is a game of motion, so the split leans on `replay` — a
# draw-command recording, armed around the section the item is about and never
# around the arrangement that got there — and uses `image` for a layout, a screen,
# a readout, or a value read at rest. There is no `kind = "video"` anywhere. Each
# item's `outputs` is declared ONCE, here, and serves all three engines: the
# extension an output is served under is fixed by its `kind`, so a kind
# substituted per engine would serve one file under a name resolution fixed for
# another. Both are evidence beside the verdict rather than any part of it: an
# item passes or fails on its assertions alone.
#
# Nothing on this checklist asks a reviewer to judge how a screen looks.
# Appearance is rated through the run-wide aesthetic rating; the rendering items
# here assert only what the specification fixes about what is drawn — the tile
# geometry, the seeded frame a thing is drawn from, a legibility floor stated as an
# RGB distance out of 441 — and capture the frame as evidence. Not one item names
# a color.
#
# EVERY item also carries `domains` and `failure_cap`, because this case is
# validator-rated: an item's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers — a hunter item
# lowers only `hunter`, a scoring item only `run`, and an instrumentation item,
# which every suite in every domain drives through, lowers all four. `failure_cap`
# is the highest functional rating those domains may reach while the item fails;
# each domain gets the LOWEST cap among its failing items, and a domain with no
# failing item is flawless. Two rules are applied consistently, because both are
# places a reviewer would otherwise argue. First, a WRONG-BUT-PLAYABLE RATE is
# `passable`, not `broken`: a lane at the wrong speed, a bear a little fast, a
# timer a little short — the game is still the game, and `broken` is reserved for a
# miss that makes it unplayable (no hop, no lanes, a bay that cannot be filled, a
# bear that never appears). Second, a NEGATIVE RULE CAPS ONE STEP SOFTER THAN ITS
# POSITIVE TWIN: `ice.crush-kills` is `broken` and `ice.crush-only-on-arrival` is
# `passable`, because a build that kills too eagerly is playable and annoying while
# one that never kills is not a game. No item caps at `flawless`: a failure always
# costs.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# game is driven and inspected from code, and every other suite on this checklist
# poses its scenario through it. These items check that it is really there, really
# wired to the running game, really deterministic, and that each pose reads back —
# a surface that reports a plausible-looking object unconnected to what is on
# screen is the failure mode worth naming, and it also shows up as every other
# suite failing to run.
#
# Seven of them are the four WORLD GATES and the three per-bear FACULTY gates. A
# validator poses a world holding only what its requirement concerns, and Floe's
# own figures put a bear on the strait 0.6 s after the critter has climbed three
# rows, a bonus catch in a bay every 8 s, and the crossing timer at zero after 30
# s, so without the gates a posed scenario would be joined by a hunt, a bonus and a
# death it never asked for. `setBearEmergence`, `setCatchTest`, `setFishCadence`
# and `setTimerRunning` each gate ONE faculty of the run and nothing else, default
# to on, and are restored to on by `reset`; `setBearSense`, `setBearRouting` and
# `setBearTravel` do the same per bear, because a check on where a bear routes and
# a check on how fast it travels are different questions and a switch that turns a
# whole creature off cannot express either. Each is verifiable by set-then-read,
# and each has an item here because a gate the suite leans on has to be known to
# work before anything leaning on it means anything.
#
# The two CLOCK operations sit deliberately outside the set-then-read rule.
# `setAutoStep` and `advance` pose no game state — they move time — so there is no
# field for the snapshot to report and `autoStep` is not a snapshot field. They are
# decided by their effect instead: `advances-in-real-time` decides `setAutoStep`,
# and `deterministic-core` and `tick-length` decide `advance`.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug surface is present and complete"
description = "Every operation specs/instrumentation.md names is a function on the surface, version is FLOE_DEBUG_VERSION (1), and the surface is live: a posed critter reads back on its tile and a posed bear given one step arrives on the next tile."
domains = ["hunter", "crossing", "run", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "state", name = "The game driven from the surface alone", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed strait carrying a critter, two bears, a vehicle in every ice lane, a floe in every water lane, one filled bay and a posed bonus catch, every field listed in the snapshot shape is present with its documented type."
domains = ["hunter", "crossing", "run", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The posed strait the snapshot reports", kind = "image" },
] }
[[review.categories.items]]
id = "poses-read-back"
title = "Every pose is reported by the snapshot"
description = "Each pose operation's value is read back by snapshot: screen, phase, phase timer, menu index, score, lives, level, reached level, timer, the critter's tile, centre, facing, hop cooldown and best row, a bear's tile, centre, committed step, target and three faculties, a vehicle's and a floe's position, a lane's speed and direction, a bay's filled flag, the fish's bay, and the four world gates. Mute is not in the list: there is no setMuted. The auto-step bit is not in it either: the clock operations pose no state, so nothing is set to read back (section 2)."
domains = ["hunter", "crossing", "run", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/poses-read-back.test.ts", outputs = [
