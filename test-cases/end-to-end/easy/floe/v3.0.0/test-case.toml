# --- Scoring ------------------------------------------------------------------
# That every scoring event pays exactly its figure, and that nothing pays twice.
#
# Four of these items read a TIME BONUS, and all four keep `setTimerRunning` off
# and pose the timer with `setTimer` instead. The whole-second count the award
# reads is then the one the item chose rather than one the drain moved between the
# pose and the hop — an item that let the timer run would be asserting an award
# against a figure it could not pin down.
