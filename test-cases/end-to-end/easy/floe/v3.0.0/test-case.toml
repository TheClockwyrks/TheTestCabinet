# --- Controls -----------------------------------------------------------------
# That each bound key drives the action it is bound to. Eight of these are the
# four directions under both of their bindings, and that split is what the arrow
# keys being `broken` and the WASD keys being `passable` expresses: a build with no
# arrow keys cannot be played, while one that binds only the arrows is playable by
# anyone who tries them.
#
# `Escape` deliberately drives both `pause` and `back`, and only the pause half has
# an item here. `back` is bound to `Escape` alone, so an item for it would be
# `screens.howto-returns` a second time under another name.
