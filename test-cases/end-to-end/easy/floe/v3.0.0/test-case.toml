# --- Hopping ------------------------------------------------------------------
# That the critter hops one absolute tile at its cadence, and that every hop the
# rules refuse is refused. There are five refusals and each is its own item,
# because a build can plausibly enforce the grid edge and forget the filled bay.
#
# There is deliberately no `hop-up` / `hop-down` / `hop-left` / `hop-right` here.
# A validator has exactly one way to drive an input under each engine — a real key
# edge under `none`, a KeyboardEvent-shaped event at the engine's own target
# otherwise — and under `none` there are no named actions at all, so "the up action
# hops one tile up" and "ArrowUp hops the critter one row up" resolve to the same
# test. `controls.arrow-*` (broken) and `controls.key-*` (passable) decide it per
# direction and per binding; this category keeps only the properties they do not.
#
# `absolute-over-floe` asserts the CENTRE rather than the column, because the
# centre is what the floe-carry rule and the footing derivation both read, and a
# build that translates by 32 instead of snapping to the target tile's centre
# leaves the critter between columns in a way a column reading would not catch.
#
# THE FACING IS FOUR ITEMS, ONE PER DIRECTION, for the reason `controls.arrow-*`
# is four: a build whose facing follows three hops and not the fourth must grade
# differently from one whose facing never moves, and a single item covering all
# four can only fail once. The reported facing is what
# `presentation.sprite-crosser-facing-*` then draws from, and those are four items
# for the same reason.
