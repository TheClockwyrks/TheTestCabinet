description = "On the pause menu with menuIndex 0, moving the pointer onto the region menuItemRect reports for RESTART sets menuIndex to 1, with screen still paused."
domains = ["run"]
failure_cap = "scuffed"
# The second menu, and its own point rather than a second reading inside
# `hover-selects`: the pause menu is drawn over a live crossing and reached from a
# different screen, so a build that hit-tests the title's regions and not this
# menu's fails here and passes there.
validation = { script = "pointer/paused-hover-selects.test.ts", outputs = [
  { id = "menu", name = "The pause menu with the hovered item selected", kind = "image" },
] }
[[review.categories.items]]
id = "paused-click-confirms"
