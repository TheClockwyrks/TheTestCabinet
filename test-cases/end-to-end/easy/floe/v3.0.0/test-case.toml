# --- The bays -----------------------------------------------------------------
# That a bay fills, stays filled, clears a level on the last one, and that the
# bonus catch keeps its own cadence.
#
# `all-five-clears` and `posed-full-does-not-clear` are the paired item here, and
# the pair is what makes the whole checklist's empty-strait posing safe: a level
# clears on the HOP that fills the last open bay, not on the count reaching five,
# so a strait posed with five filled bays and no hop keeps playing. Every suite in
# every category relies on that, so it is asserted rather than assumed.
