# --- Controls -----------------------------------------------------------------
# That each bound key drives the action it is bound to. Eight of these are the
# four directions under both of their bindings, and that split is what the arrow
# keys being `broken` and the WASD keys being `passable` expresses: a build with no
# arrow keys cannot be played, while one that binds only the arrows is playable by
# anyone who tries them.
#
# `Escape` deliberately drives both `pause` and `back`, and only the pause half has
# an item here. Where `back` goes is a screen's business rather than a key's, so
# the items that decide it are the `screens` ones, one per screen it can be pressed
# on: `howto-returns`, `pause-resumes-escape`, `victory-back` and `gameover-back`.
#
# FOUR ITEMS GRADE HOW A KEY IS READ RATHER THAN WHAT IT DRIVES.
# `held-menu-move-fires-once` and `held-confirm-fires-once` are
# specs/controls.md's "How each one is read" — movement held on `playing` and read
# as a press edge everywhere else, confirm read as a press edge everywhere — and
# without them a build that treats every key as held passes every other point in
# this category with menus nobody can use, because `hopping.held-repeats` grades
# the held half on `playing` alone. `up-beats-down` and `movement-beats-confirm`
# are specs/ui.md's order for edges that share a tick. All four are the build's
# input read rather than any one binding, which is why they sit here rather than
# under `screens`.
#
# `unbound-key-does-nothing` is the control sample for the whole category: it
# drives a key bound to no action over a strait posed with no lane items and reads
# every snapshot field but `simTime` back unchanged, which is what tells a build
# that routed its bindings apart from one that answers to everything.
