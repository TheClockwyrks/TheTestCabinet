] }

# --- Touch --------------------------------------------------------------------
# specs/ui.md gives the same four menus a finger, and a finger is not a small
# mouse: it never hovers, so the first the build hears of it is the contact
# LANDING, and the landing is what selects. Each point below drives one real touch
# contact at the middle of the region the build reports through `menuItemRect`, so
# any layout passes and only the handling is graded. The three are the three
# things specs/ui.md gives a contact: a landing selects, a lift inside the region
# it landed in confirms that item, and a lift in a different region confirms
# nothing while the selection follows the finger.
#
# The caps follow the `pointer` category's, and for the same reason: a menu no
# finger can reach is an ordinary path closed, and a contact that confirms after
# sliding off is a nuisance.
#
# THE THREE EFFECTS ARE GRADED ON `title` and a select and a confirm are graded
# again on `gameover`, which is this category's half of the second-menu coverage
# the `pointer` comment sets out: `pointer` adds its pair on `paused`, `touch`
# adds its pair on an end screen.
[[review.categories]]
id = "touch"
title = "Touch"
[[review.categories.items]]
id = "landing-selects"
title = "A touch contact selects the item it lands on"
description = "On the title with menuIndex 0, a touch contact landing inside the region menuItemRect reports for HOW TO PLAY, and not lifted, sets menuIndex to 1 with screen still title."
domains = ["run"]
failure_cap = "scuffed"
# The contact is left DOWN, so no lift can confirm and the reading is the
# selection alone. `tap-confirms` is the point that adds the lift.
validation = { script = "touch/landing-selects.test.ts", outputs = [
  { id = "selected", name = "The title menu with the item the contact landed on selected", kind = "image" },
] }
[[review.categories.items]]
id = "tap-confirms"
title = "A contact that lifts where it landed confirms that item"
description = "On the title with menuIndex 0, a touch contact landing and lifting inside the region menuItemRect reports for HOW TO PLAY sets screen to howto."
domains = ["run"]
failure_cap = "scuffed"
validation = { script = "touch/tap-confirms.test.ts", outputs = [
  { id = "howto", name = "The how-to screen opened by a tap", kind = "image" },
] }
[[review.categories.items]]
id = "drag-cancels"
title = "A contact that lifts on a different item confirms nothing"
description = "On the title, a touch contact landing inside CROSS's region, travelling onto HOW TO PLAY's and lifting there leaves screen at title, with menuIndex 1."
domains = ["run"]
failure_cap = "passable"
# The selection is read as well as the screen: it must have followed the finger,
# which is what says the contact was read at all rather than dropped.
validation = { script = "touch/drag-cancels.test.ts", outputs = [
  { id = "title", name = "The title still showing after the contact slid off", kind = "image" },
] }
[[review.categories.items]]
id = "ending-landing-selects"
title = "A touch contact selects the end-screen item it lands on"
description = "On the game-over screen with menuIndex 0, a touch contact landing inside the region menuItemRect reports for MENU, and not lifted, sets menuIndex to 1 with screen still gameover."
domains = ["run"]
failure_cap = "scuffed"
# The second menu a finger is graded on, and its own point rather than a second
# reading inside `landing-selects`: an end screen carries a different menu,
# reached at the end of a run rather than before one. The contact is left DOWN, so
# the reading is the selection alone.
validation = { script = "touch/ending-landing-selects.test.ts", outputs = [
  { id = "selected", name = "The game-over menu with the item the contact landed on selected", kind = "image" },
] }
[[review.categories.items]]
id = "ending-tap-confirms"
title = "A contact that lifts where it landed confirms an end-screen item"
description = "On the game-over screen with menuIndex 0, a touch contact landing and lifting inside the region menuItemRect reports for MENU sets screen to title."
domains = ["run"]
failure_cap = "scuffed"
# MENU is the entry aimed at because the entry beside it starts a fresh run and
# opens playing, so a confirm that never happened and a confirm that reached the
# wrong entry are both told apart from the right one by a single reading.
validation = { script = "touch/ending-tap-confirms.test.ts", outputs = [
  { id = "title", name = "The title screen a tap on MENU returned to", kind = "image" },
] }

# --- Presentation -------------------------------------------------------------
# That the game draws from the seeded sprites, and shows the HUD it must show.
#
# THE SPRITE ITEMS ASSERT A SEEDED FRAME: the critter, the bear in three states,
# and the six lane-item kinds are each drawn from art this case ships, and each is
# its own item because a build can wire six of the seven folders and draw the
# seventh in code. The two sets specs/assets.md tabulates PER FACING are four items
# apiece — `sprite-crosser-facing-*` and `sprite-bear-run-*` — for the reason
# `controls.arrow-*` is four: a build that draws three headings from the right pair
# and the fourth from whatever it had must grade differently from one that draws
# every heading from one frame, and a single item covering all four can only fail
# once. `sprite-raft3` and `sprite-raft4` additionally assert the SUB-RECT — the
# left 96x32 of `assets/raft/0.png` against the whole of `assets/raft/1.png` —
# which is why specs/assets.md states how a frame is drawn and not merely which
# frame.
#
# EVERY ROW OF specs/overview.md's LEGIBILITY TABLE IS THE REVIEWER'S. Floe fixes
# no palette, so whether two things the build drew can be told apart at a glance
# is appearance and the `presentation` rating judges it; no item here compares one
# drawn thing with another. `submerged-bear-visible` is the one reading a pixel
# still answers, and it answers it as PRESENCE: a bear over open water is drawn as
# a silhouette and a wake under the water layer rather than as a full sprite, so
# `sprite-bear-swim`'s draw-call reading proves the frame was submitted and not
# that anything survived on the canvas, and the item takes the tile with the bear
# on it against the same tile with the bear cleared. It lowers `presentation` and
# nothing else: `hunter` is declared as a domain of behavior — a bear that
# emerges, routes, swims, catches and doubles — so a build that hunts flawlessly
# and draws the wrong frame has a drawing fault, not a hunting one.
#
# `hud-timer` poses the timer at two values with `setTimerRunning` OFF throughout,
# so it reads the readout following the field rather than the drain, and stays
# outside the closed list of items that turn a world gate on.
