# --- Pointer ------------------------------------------------------------------
# specs/ui.md drives all four of this game's menus with a mouse as well as with
# the keyboard, over item regions the BUILD lays out and reports through
# `menuItemRect`. This case fixes no menu geometry, so each point below asks the
# build where it put the item and drives a real pointer at the middle of the
# region it named: any layout passes, and a build that reports a region it does
# not answer on fails. The three points are the three things specs/ui.md gives a
# pointer — a move selects, a press and its release inside one region confirm that
# item, and two edges falling in different regions confirm nothing.
#
# THE THREE EFFECTS ARE GRADED ON `title`, because it is the menu where a
# confirm that should not have happened is loud (CROSS opens a live crossing) and
# one that should have is silent (the title stays). The keyboard's own edges are
# the `controls` and `screens` points, not these.
#
# AND A SECOND MENU IS GRADED FOR TWO OF THEM. specs/ui.md drives all four menus
# this way, so a checklist that read only `title` would score a build that
# hit-tests the title's regions and no other's at full marks. `paused` is the
# second menu these two add — it is drawn over a live crossing and reached from a
# different screen — and it carries one select and one confirm, the two effects
# whose absence closes the path. `touch` adds the same pair on an end screen, so
# between the two categories every menu but `victory` is driven by a real device,
# and `victory` shows `ENDING_ITEMS`, the menu the ending points drive.
#
# THREE OF specs/ui.md's MENU RULES CARRY NO POINT YET, and are recorded here so
# the next pass does not read this category as closed: that Back on `title` does
# nothing, that an edge falling outside every region confirms no item, and that a
# press and the release that follows it may arrive on one tick and that tick
# confirms. The third needs a gesture the shared harness does not offer — it
# drives one tick per edge — so it waits on that; the first two are ordinary
# points this pass did not carry.
#
# THE TWO POSITIVE POINTS CAP `scuffed` AND THE NEGATIVE ONE `passable`, which is
# this checklist's standing rule that a negative caps one step softer than its
# positive twin. A menu no mouse can reach leaves the keyboard's play intact and
# makes an ordinary path unusable, which is `scuffed`; a menu that confirms a
# press the player slid off is annoying rather than closed.
[[review.categories]]
id = "pointer"
title = "Pointer"
[[review.categories.items]]
id = "hover-selects"
title = "Moving the pointer onto an item selects it"
description = "On the title with menuIndex 0, moving the pointer onto the region menuItemRect reports for HOW TO PLAY sets menuIndex to 1, with screen still title."
domains = ["run"]
failure_cap = "scuffed"
validation = { script = "pointer/hover-selects.test.ts", outputs = [
  { id = "menu", name = "The title menu with the hovered item selected", kind = "image" },
] }
[[review.categories.items]]
id = "click-confirms"
title = "A press and release inside one item confirms it"
description = "On the title with menuIndex 0, pressing and releasing the pointer inside the region menuItemRect reports for HOW TO PLAY sets screen to howto."
domains = ["run"]
failure_cap = "scuffed"
validation = { script = "pointer/click-confirms.test.ts", outputs = [
  { id = "howto", name = "The how-to screen opened by a click", kind = "image" },
] }
[[review.categories.items]]
id = "slide-off-cancels"
title = "A press and release in different items confirms nothing"
description = "On the title, pressing the pointer inside HOW TO PLAY's region and releasing it inside CROSS's leaves screen at title, confirming neither item."
domains = ["run"]
failure_cap = "passable"
validation = { script = "pointer/slide-off-cancels.test.ts", outputs = [
