# --- Audio --------------------------------------------------------------------
# That each of the ten cues plays on its event, and that mute silences them. All
# ten cues specs/ui.md names carry an item, because a cue that is defined and never
# played is the failure this category exists to catch.
#
# `controls.menu-up` and `controls.menu-down` decide the selection alone and say
# nothing about a cue; `cue-menu` here decides the sound. An item asserting both
# the highlight and the sound would be two behaviors in one point, and a silent
# menu would lower `run` rather than the `presentation` domain that owns the cues.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
id = "cue-hop"
title = "A hop plays its cue"
description = "An accepted hop plays the hop cue exactly once; a refused hop plays it none."
domains = ["presentation"]
failure_cap = "passable"
# Both halves are read from one scenario: an accepted hop plays the cue exactly
# once and a refused hop plays it none, which is what separates a build that cues
# the input from one that cues the movement.
validation = { script = "audio/cue-hop.test.ts", outputs = [
  { id = "hop", name = "An accepted hop beside a refused one", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-splash"
title = "Falling in plays its cue"
description = "Standing on open water plays the splash cue."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "audio/cue-splash.test.ts", outputs = [
  { id = "splash", name = "The critter falling in", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-crush"
title = "Being crushed plays its cue"
