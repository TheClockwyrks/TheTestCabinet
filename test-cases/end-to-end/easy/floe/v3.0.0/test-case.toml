# --- The ice band -------------------------------------------------------------
# The eight ice lanes: what they carry, how they move, how they scale with the
# level, and what their traffic does to a critter standing under it.
#
# `lane-directions` and `lane-speeds` EACH CARRY TWO CLAUSES ON PURPOSE, and the
# departure is worth naming because `strait.tile-map` and
# `strait.tiles-drawn-on-the-map` split the same shape of pair into two items. The
# difference is what the second clause is for. There the reported centre and the
# drawn position are two things a player can lose separately, so they are two
# points. Here the reported figure is not a thing a player has at all: the second
# clause — a vehicle's `x` really moving that way, really covering `speed * 32`
# units in a second — is what proves the first is not a lie, and a build whose
# lanes report the table and then sit still has failed one requirement, not two.
# Splitting them would hand that build a point for the report.
#
# `crush-kills` and `crush-only-on-arrival` are the paired item this category turns
# on. The rule is that a vehicle whose OWN MOTION brings the critter's centre under
# it crushes; a critter posed under a parked vehicle is not crushed until the lane
# is released. A build that kills on overlap rather than on arrival passes the
# first and fails the second, which is exactly the distinction worth grading, and
# the negative half caps one step softer than the positive.
