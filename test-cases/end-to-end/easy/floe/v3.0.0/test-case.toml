  { id = "gameover", name = "The death that emptied the lives", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-menu"
title = "A menu move plays its cue"
description = "Moving the title menu's selection plays the menu cue exactly once per move."
domains = ["presentation"]
failure_cap = "passable"
# The sound alone. `controls.menu-up` and `controls.menu-down` decide the
# selection, and an item asserting both would be two behaviors in one point — and
# would lower `run` for a fault that belongs to `presentation`.
validation = { script = "audio/cue-menu.test.ts", outputs = [
  { id = "menu", name = "The title menu's selection moving", kind = "image" },
] }
[[review.categories.items]]
id = "mute-silences"
title = "The game stays playable with sound muted"
description = "With muted on, an accepted hop moves the critter, a hop into an open bay fills it and is scored, and the fresh crossing that follows the hold begins from the near shore."
domains = ["presentation"]
failure_cap = "scuffed"
# The playability half of `specs/ui.md`'s "the game stays fully playable with sound
# muted", and the half that is the build's under every engine: whatever the mute bit
# does to the audio, the simulation goes on around it. That nothing came out is the
# item below, which is `engines = ["none"]`.
validation = { script = "audio/mute-silences.test.ts", outputs = [
  { id = "muted", name = "A hop and a bay fill with mute on", kind = "image" },
] }
[[review.categories.items]]
id = "mute-produces-no-sound"
title = "Nothing sounds while muted"
description = "With muted on, a quarter second of held strait, an accepted hop and a filled bay emit no sound at all, read both as the emissions attributed to the driven ticks and as the page's own running total."
domains = ["presentation"]
failure_cap = "scuffed"
# `engines = ["none"]`, BECAUSE SILENCE IS THE ENGINE'S UNDER AN ENGINE. The
# engineless build owns its whole audio layer, so whether the mute bit actually
# stops sound reaching the output is its own work and is read here. Under either
# engine the mute bit is the engine's own and its cue bus reports `gain: 0` for
# anything played on a muted bus, so "no cue sounded above zero gain" holds for
# every build on that engine and grades the engine rather than the build.
#
# THE MUTE BIT ITSELF IS `controls.mute-m`'s, and is read back here only as the
# situation the silence was heard in. What this item asserts is the silence alone.
validation = { script = "audio/mute-produces-no-sound.test.ts", engines = ["none"], outputs = [
  { id = "silent", name = "A muted hop and bay fill, with nothing emitted", kind = "image" },
] }

# --- Showcase -----------------------------------------------------------------
# specs/showcase.md asks the finished game to ship its own store-page
# presentation: a description written for a player, a carousel manifest, and the
# media both of them name, all directly in `showcase/` at the root of the produced
# repository. It is a deliverable of the build like the game itself, so it carries
# a point.
#
# ONE point, and it grades EXISTENCE alone. Whether the description reads like
# something a player would want to play, whether the carousel opens on the
# strongest view of live play, and whether the media is worth looking at is a
# reviewer's judgement and belongs to the run-wide AESTHETIC rating rather than to
# an assertion. The validator's whole verdict is that the two files are there and
# that the carousel points at a file that is there with them: not a dimension, not
# a byte of a picture, not a word of the prose. No other item on this checklist
# says anything about the media either.
#
# `weight = 3`, and it is the only weight declared in this file. The showcase is a
# whole deliverable beside the game — three to five paragraphs of player-facing
# prose and two to four captured pieces of media — so a build that ships none of
# it should lose more than it loses for one missing audio cue. The cap is `great`
# rather than the weight's opposite: a missing showcase leaves the standard flow
# of gameplay entirely unaffected, because it is not part of the game a player
# plays. The weight and the cap are saying different things on purpose — how much
# the point is worth, and how far its failure drags the functional rating down.
#
# The script drives nothing. It reads the produced tree with `node:fs`, so one
# suite stands unchanged in all three engine directories and the point means the
# same thing whichever engine the run selected. What it hands back as evidence is
# a `.png` copied out of the build's own showcase, so a reviewer sees the picture
# the build chose to present its game with beside the verdict.
[[review.categories]]
id = "showcase"
title = "Showcase"
[[review.categories.items]]
id = "exists"
title = "The game ships its showcase"
description = "showcase/showcase.md and showcase/showcase.toml are present at the root of the produced repository, and at least one file the carousel names is present in showcase/."
weight = 3
domains = ["presentation"]
failure_cap = "great"
validation = { script = "showcase/exists.test.ts", outputs = [
  { id = "carousel", name = "A screenshot from the build's showcase", kind = "image" },
] }
