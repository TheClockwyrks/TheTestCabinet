# --- The run ------------------------------------------------------------------
# The run: the lives, what costs one, the crossing timer, the death pause, the
# respawn, the level advance, and the two ways a run ends.
#
# The five deaths each have their own item — catch, crush, drown, off-edge and
# timer — because a build can wire four of them to the phase change and miss the
# fifth, and each names the domain the miss belongs to. `death-pause` then asserts
# the DURATION alone, posing the cheapest death to reach, because that the other
# four reach `dying` at all is each of their own items' requirement.
#
# `bonus-life-at-10000` IS THE ONLY BOUNDARY ITEM, and that is deliberate.
# specs/progression.md pays a life per boundary the score passes, "so a single
# award that carries it over two boundaries earns two lives" — but no award the
# rules can pay spans two boundaries. The largest single gain in play is a last-bay
# hop at level 8, which pays a little under two thousand against a ten-thousand
# boundary, and the only ways to stage a bigger one are to pose a crossing timer or
# a lives count far outside anything the specification allows. So the per-boundary
# clause is unreachable in play, and the boundary rule is decided in the one
# direction that is reachable rather than by posing a world the specs exclude.
#
# `game-over-at-zero` and `posed-zero-lives-does-not-end` are the paired item.
# `setLives(0)` is a PRECONDITION, not an ending: it leaves the game playing and
# the next death ends it. A build that ends the run the moment the counter hits
# zero fails the second, and a suite that could not pose zero lives without ending
# the run could not stage the first at all.
