# --- The hunter ---------------------------------------------------------------
# The signature system, and the largest category on the checklist. The bear has to
# emerge on the right conditions, glide rather than hop, turn only where the grid
# lets it, travel at two different speeds depending on what is under it, route
# toward the critter around traffic that is itself moving, survive being routed
# into a corner, be removed by a vehicle that arrives on it, come back, catch what
# it reaches, and double at level 5 without ever tripling.
#
# THE THREE ROUTING BRANCHES EACH CARRY AN ITEM. `routes-around-hazard`,
# `avoids-imminent-tile` and `pursues` decide the normal step;
# `no-route-steps-closer` decides the fallback where no open route exists and the
# bear must still take whichever open neighbor most shortens the tile distance;
# and `boxed-in-stands-still` decides the fallback where no neighbor is open at
# all. A build that implements only the happy path passes the first three and fails
# the last two, which is the grading this category exists to produce.
#
# THE PER-BEAR GATES ARE HOW ISOLATION IS REACHED. A speed item runs with routing
# off and one step committed, so the reading is a rate and not a route; a routing
# item runs with travel off, so the committed step is read with nothing moving; an
# obstacle item runs with all three off. `poseBear` takes them as an argument.
#
# `removed-on-death` and `removed-on-bay-fill` pose their bears with `addBear` and
# leave emergence OFF, because the removal at a crossing's end is not the emergence
# faculty; only the eight items whose requirement is emergence turn it on.
[[review.categories]]
id = "hunter"
title = "The hunter"
[[review.categories.items]]
id = "emerges-after-advance"
title = "A bear emerges once the critter has advanced"
description = "With emergence on and the critter posed BEAR_EMERGE_ADVANCE (3) rows above the near shore, a bear joins the roster once BEAR_EMERGE_DELAY (0.6 s) of the crossing has passed."
domains = ["hunter"]
failure_cap = "broken"
validation = { script = "hunter/emerges-after-advance.test.ts", outputs = [
  { id = "emerge", name = "The bear that emerged behind the advanced critter", kind = "replay" },
] }
[[review.categories.items]]
id = "no-emergence-on-near-shore"
title = "A critter on the near shore is not hunted"
description = "With emergence on and the critter left on row 19, no bear joins the roster over thirty seconds of game time."
domains = ["hunter"]
failure_cap = "scuffed"
# The `only` in the emergence rule, given its own item beside
# `emerges-after-advance`: a critter that has not left the near shore is not hunted
