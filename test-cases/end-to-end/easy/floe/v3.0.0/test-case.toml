# nowhere else, so these items assert the formula rather than any drawn artwork.
#
# `tile-map` and `tiles-drawn-on-the-map` are two items over one scenario on
# purpose. Reporting the right centre and drawing at it fail independently: a build
# that reports correctly and draws a few units off is entirely playable, which is
