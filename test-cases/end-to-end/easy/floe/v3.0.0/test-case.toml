# --- Presentation -------------------------------------------------------------
# That the game draws from the seeded sprites, in colors a player can tell apart,
# with the HUD it must show.
#
# ELEVEN of these items assert a SEEDED FRAME: the critter, the bear in three
# states, and the six lane-item kinds are each drawn from art this case ships, and
# each is its own item because a build can wire six of the seven folders and draw
# the seventh in code. `sprite-raft3` and `sprite-raft4` additionally assert the
# SUB-RECT — the left 96x32 of `assets/raft/0.png` against the whole of
# `assets/raft/1.png` — which is why specs/assets.md states how a frame is drawn
# and not merely which frame.
#
# THE FIVE LEGIBILITY ITEMS ASSERT A DISTANCE, NEVER A COLOR. Floe fixes no
# palette, so each of these reads the pixels the build rendered and holds them
# against an RGB distance out of 441 that the item states. `submerged-bear-visible`
# is the one that matters most: a bear over open water is drawn as a silhouette and
# a wake rather than a full sprite, and a build that draws nothing at all leaves the
# hunt invisible exactly where it is most dangerous.
#
# `hud-timer` poses the timer at two values with `setTimerRunning` OFF throughout,
# so it reads the readout following the field rather than the drain, and stays
# outside the closed list of items that turn a world gate on.
