# --- Audio --------------------------------------------------------------------
# That each of the ten cues plays on its event, and that mute silences them. All
# ten cues specs/ui.md names carry an item, because a cue that is defined and never
# played is the failure this category exists to catch.
#
# ALL TEN CUE ITEMS CAP AT `passable`, ON ONE JUDGEMENT APPLIED TO ALL OF THEM. A
# cue is feedback: the splash is how a player learns they drowned, the menu cue is
# how they learn the highlight moved, and the bonus-life cue is how they learn they
# were paid. One missing cue takes that feedback away and leaves the game entirely
# playable, which is `passable` exactly. Nothing distinguishes one cue from another
# here — a silent bonus life and a silent catch cost the same thing — so nothing
# distinguishes their caps either. `mute-silences` and `mute-produces-no-sound` are
# the two items in this category that sit a step lower, because a game whose sound
# cannot be turned off is one a player has to leave the room to escape, and
# `controls.mute-m` matches them. They are two items rather than one because they
# are decided on different engines: that the game keeps running while muted is the
# build's under all three, while that nothing comes out is only the build's where
# the build owns the audio layer, which is `none` alone.
#
# `controls.menu-up` and `controls.menu-down` decide the selection alone and say
# nothing about a cue; `cue-menu` here decides the sound. An item asserting both
# the highlight and the sound would be two behaviors in one point, and a silent
# menu would lower `run` rather than the `presentation` domain that owns the cues.
