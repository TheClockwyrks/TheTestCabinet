# --- The strait ---------------------------------------------------------------
# The stage, the grid, the five bands and the five bays, held against the figures
# specs/strait.md fixes. The tile-to-stage map is stated in that one file and
# nowhere else, so these items assert the formula rather than any drawn artwork.
#
# `tile-map` and `tiles-drawn-on-the-map` are two items over one scenario on
# purpose. Reporting the right centre and drawing at it fail independently: a build
# that reports correctly and draws a few units off is entirely playable, which is
# why the drawn half is `presentation` and `scuffed` while the reported half is
# `crossing` and `broken`.
#
# The bays are fixed as exact column PAIRS — (3,4), (11,12), (19,20), (27,28),
# (35,36) — so `bay-columns` and `far-shore-solid` between them close every column
# of row 1: ten accept a hop up and thirty refuse one.
#
# `filled-bay-reads-filled` reads a bay against ITSELF: the same point of the same
# bay, open and then posed filled, and the two readings must differ. That is the
# whole of what a pixel decides here — the build drew something where the
# specification says something is drawn.
#
# NO ITEM HERE READS ONE BAND AGAINST ANOTHER, AND THE GAP IS DELIBERATE. That the
# five bands are told apart, and that an open bay is told from the shore beside
# it, are appearance, which the reviewer's `presentation` rating judges; a check
# could only decide them by comparing two things the build drew in colors
# specs/overview.md leaves to the build. There is no presence reading to put in
# their place either: a band is the backdrop rather than an entity the debug
# surface can take off the strait, and "the row differs from the cleared
# background" would be the build's own background color compared with itself.
# So the reading is not made, and this note stands where it was rather than
# leaving the gap to be read as closed.
[[review.categories]]
id = "strait"
title = "The strait"
[[review.categories.items]]
id = "stage-fit"
title = "The build draws into the fitted stage"
description = "The critter posed on each of the strait's four extreme tiles changes what is drawn at that tile's own logical centre, mapped through the fit, at three window sizes and two pixel densities. Under none the fit itself is derived and read too, and the letterbox bars stay unchanged across a live crossing."
domains = ["presentation"]
failure_cap = "scuffed"
# THIS POINT IS THE BUILD'S ON ALL THREE ENGINES, which is why it declares no
# `engines`. What it grades under every engine is the BUILD DRAWING INTO THE FIT:
# `specs/overview.md` puts the obligation on the build beside the runtime's own —
# "Draw in logical units, and take the canvas element's own size from the runtime
# alone" — and a build that draws in device pixels, fits the stage a second time
# itself, or anchors to a corner of the canvas moves what lands on the surface
# away from the map. That is why the check reads the four extreme tiles, where a
# wrong fit shows, rather than the middle, where it hides, and why
# `strait/tiles-drawn-on-the-map` does not cover it: that item reads logical
# draw-call centres on one surface size and cannot see any of those three faults.
#
# UNDER `none` THE DERIVATION IS THE BUILD'S TOO, and only there. The engineless
# build writes the runtime layer, so the engineless script additionally reads the
# fit `specs/overview.md` requires against the surface it was given, and reads the
# letterbox bars across two frames of a live crossing: whatever the build drew in
# the bars, the moving lanes must not have changed it. Under either engine the
# canvas size, the viewport and the bars are the engine's, so those readings are
# not made there — the engine's viewport is used as the coordinate map alone.
validation = { script = "strait/stage-fit.test.ts", outputs = [
  { id = "fit", name = "The whole stage fitted and centred", kind = "image" },
] }
