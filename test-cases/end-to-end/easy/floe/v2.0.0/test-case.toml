slug = "floe"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Floe"

# Relative difficulty (easy | medium | hard), surfaced on the site. Floe asks for
# tile-based hopping across lanes of sliding hazards and drifting carry-floes, a
# pursuing hunter with real pathfinding across the hazard board and the water, a
# row of goal bays, a timer, an 8-level progression with a win and a loss, and
# multiple states — a self-contained 2D build, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "crossing"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A single-screen crossing game where a small critter hops across lanes of sliding \
ice hazards and drifting floes to reach the far-shore bays — while a polar bear \
hunts it across the whole strait, dodging the same hazards and swimming out after \
it. Its one limit is speed, so keep moving: hesitate and it catches you."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Floe is a substantial build (tile hopping with carry-floes, a pursuing
# hunter with pathfinding, the bays, a timer, an 8-level progression, multiple
# states), so it gets a full five hours despite being an easy case.
max_runtime_hours = 5

# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins `playwright`
# as a dev dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Provided art assets, seeded into the run root under `assets/`. A directory is
# seeded recursively, so every sprite frame under `assets/` reaches the run. The
# build must render the game with these (see specs/assets.md) and load them with
# page-relative URLs so it works under any base path.
assets = ["assets"]

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This version offers a single `base` variant (the standard Crossing run on the one
# strait), declared in its own file under `variants/`. It supplies the `title`
# view's menu; `gameplay` and `game-over` are common. Future
# versions/variants are expected to add rule twists (e.g. a longer endless run or a
# fog-of-war strait) as additional variants on top of this base. This list is a
# root key, so it must precede the first table header (`[build]`).
variants = ["variants/base.toml"]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named
# once here so a review item's `validation` driver (and the validator that runs it)
# knows which `window` global to drive. The seeded specification documents the same
# handle independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded. It is
# required because review items declare `validation` scripts.
[instrumentation]
handle = "__floe"
# The fixed simulation rate, in Hz. Floe's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation
# runtime uses to relate that exact stepping back to real time — one tick is
# 1/120 of a second, so a second of game time is 120 ticks. It must match the
# timestep the seeded `specs/gameplay.md` mandates.
tick_hz = 120

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern. All common specs are
# plain Markdown, seeded verbatim.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/hunter.md"

[[spec]]
source = "specs/hazards.md"

[[spec]]
source = "specs/water.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/gameplay.md"

[[spec]]
source = "specs/ui.md"

[[spec]]
source = "specs/assets.md"

# The debugging and automation surface every build must expose: a deterministic,
# steppable core; a `window.__floe` API to drive and inspect the game from code; and
# a read-only debug overlay. Seeded for every variant and framed as an ordinary
# developer affordance of the game.
[[spec]]
source = "specs/instrumentation.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl build — the
# authored, correct game under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. The `title` view is variant-specific (declared per variant
# below); `gameplay` and `game-over` look the same in every variant.
[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-game"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "End screen"
dest = "proof/game-over.png"

[[proof]]
id = "hunt"
name = "Hunter-pursuit clip"
dest = "proof/hunt.webm"

[[proof]]
id = "cross"
name = "Crossing clip"
dest = "proof/cross.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless hunter cannot
# mask a broken crossing, and vice versa. Domains are case-level; an individual
# review item rolls up to one through its optional `domain`, while a general item
# (states, window fit) omits it.
[[domain]]
id = "hunter"
name = "The Hunter"
description = "The signature: the bear emerging at the near shore and chasing the critter continuously (pacman-style, turning only at tile centers) across the whole strait, navigating around the hazards (and being reset if one slides into it), swimming out onto the water after it while staying visible, catching a critter that hesitates or errs, resetting fairly between crossings, and speeding up (and doubling) with the level."

[[domain]]
id = "crossing"
name = "The Crossing"
description = "The crossing core: one-tile hopping, the solid ice lanes of sliding hazards, the deadly water crossed on drifting carry-floes (with fall-in and off-edge death), filling the five far-shore bays, the timer, and the 8-level progression with its win and loss."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name
# grouping the points a reviewer grades — and each `[[review.categories.items]]`
# under it is one graded review item, worth one point (the default weight), so a
# category is worth the number of items it holds (no fractional scoring). A category
# carries no prose of its own; each review item states its own requirement in
# `description`. The checklist is reporter-side material — never seeded into a run,
# so the model never sees it; each item restates a requirement the seeded
# specification already states. An item with a `validation` script is decided
# automatically (the reviewer can override); one without is reviewed by a person.
#
# The taxonomy is deliberately narrow: each item asserts ONE observable behavior,
# split out from the broader v1 items so a build fails exactly the rule it breaks.
# The genuinely subjective points — the bear's submerged visibility, the HUD and
# window fit, whether each provided sprite set is drawn correctly, and everything
# under Audio — carry NO validation and are left to the reviewer. The UI game-state items carry a
# validation script only to REACH and CAPTURE each screen through the debug API (its
# auto-verdict confirms the state is reachable); how each screen reads is left to the
# reviewer from the capture. The scoring domains (`hunter`, `crossing`, above) are rated
# separately by the reviewer; the categories grammar attaches no domain to a point.
[review]
format = 2

