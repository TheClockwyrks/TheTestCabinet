slug = "floe"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Floe"

# Relative difficulty (easy | medium | hard), surfaced on the site. Floe asks for
# tile-based hopping across lanes of sliding hazards and drifting carry-floes, a
# pursuing hunter with real pathfinding across the hazard board and the water, a
# row of goal bays, a timer, an 8-level progression with a win and a loss, and
# multiple states — a self-contained 2D build, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "crossing"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A single-screen crossing game where a small critter hops across lanes of sliding \
ice hazards and drifting floes to reach the far-shore bays — while a polar bear \
hunts it across the whole strait, dodging the same hazards and swimming out after \
it. Its one limit is speed, so keep moving: hesitate and it catches you."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Floe is a substantial build (tile hopping with carry-floes, a pursuing
# hunter with pathfinding, the bays, a timer, an 8-level progression, multiple
# states), so as a hard case it gets a full five hours.
max_runtime_hours = 5

# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins `playwright`
# as a dev dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Provided art assets, seeded into the run root under `assets/`. A directory is
# seeded recursively, so every sprite frame under `assets/` reaches the run. The
# build must render the game with these (see specs/assets.md) and load them with
# page-relative URLs so it works under any base path.
assets = ["assets"]

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This version offers a single `base` variant (the standard Crossing run on the one
# strait), declared in its own file under `variants/`. It supplies the `title`
# view's menu; `gameplay` and `game-over` are common. Future
# versions/variants are expected to add rule twists (e.g. a longer endless run or a
# fog-of-war strait) as additional variants on top of this base. This list is a
# root key, so it must precede the first table header (`[build]`).
variants = ["variants/base.toml"]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern. All common specs are
# plain Markdown, seeded verbatim.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/hunter.md"

[[spec]]
source = "specs/hazards.md"

[[spec]]
source = "specs/water.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/flow.md"

[[spec]]
source = "specs/assets.md"

[[spec]]
source = "specs/standard.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl build — the
# authored, correct game under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. The `title` view is variant-specific (declared per variant
# below); `gameplay` and `game-over` look the same in every variant.
[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-game"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "End screen"
dest = "proof/game-over.png"

[[proof]]
id = "hunt"
name = "Hunter-pursuit clip"
dest = "proof/hunt.webm"

[[proof]]
id = "cross"
name = "Crossing clip"
dest = "proof/cross.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless hunter cannot
# mask a broken crossing, and vice versa. Domains are case-level; an individual
# review item rolls up to one through its optional `domain`, while a general item
# (states, window fit) omits it.
[[domain]]
id = "hunter"
name = "The Hunter"
description = "The signature: the bear emerging at the near shore and chasing the critter continuously (pacman-style, turning only at tile centers) across the whole strait, navigating around the hazards (and being reset if one slides into it), swimming out onto the water after it while staying visible, catching a critter that hesitates or errs, resetting fairly between crossings, and speeding up (and doubling) with the level."

[[domain]]
id = "crossing"
name = "The Crossing"
description = "The crossing core: one-tile hopping, the solid ice lanes of sliding hazards, the deadly water crossed on drifting carry-floes (with fall-in and off-edge death), filling the five far-shore bays, the timer, and the 8-level progression with its win and loss."

# Reviewer checklist items, common to every variant. The major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss. Reporter-side material: never
# seeded into a run, so the model never sees the checklist; each restates a
# requirement the seeded specification already states. Each item is worth `weight`
# points toward the run's score; the reviewer records a pass/fail verdict for each
# before the run can be published.

[[review_item]]
id = "bear-pursues"
title = "The bear hunts across the whole strait"
text = "The bear emerges at the near shore after the critter advances, then pursues the critter's position across every band — ice, floes, and water — by moving CONTINUOUSLY (pacman-style: gliding smoothly at a fixed speed, always heading up/down/left/right and turning only at tile centers, never a discrete hop and never diagonal), not confined to any section. It moves a touch slower than a cleanly-played critter, so steady forward hopping stays ahead, but it visibly closes whenever the critter hesitates, backtracks, or gets stuck."
weight = 1
domain = "hunter"
reference = "gameplay"
proof = "hunt"
sub_items = [
  { id = "continuous", title = "Glides continuously pacman-style, turning only at tile centers (never a hop or a diagonal)" },
  { id = "closes-on-mistakes", title = "Steady forward hopping stays ahead, but it visibly closes on any hesitation, backtrack, or stall" },
]

[[review_item]]
id = "bear-navigates"
title = "The bear navigates the hazards"
text = "The bear is not immune to the world: it avoids the sliding vehicles and routes AROUND them (a vehicle-choked lane delays and detours it), and if a vehicle slides into it — into either tile it is straddling, since it occupies both while between tiles — the bear is RESET — knocked out, removed, and re-emerging from the near shore after a delay — NOT merely staggered or dropped down a row. Luring it in front of a moving obstacle is a real way to open distance; the hunt returns rather than being permanently removed."
weight = 1
domain = "hunter"
proof = "hunt"
sub_items = [
  { id = "routes-around", title = "Routes around the sliding vehicles; a hazard-choked lane delays and detours it" },
  { id = "reset-on-hit", title = "A vehicle sliding into either tile it straddles resets it (removed, re-emerges) — not merely staggered or dropped a row" },
]

[[review_item]]
id = "bear-swims-visible"
title = "The bear swims, and stays visible"
text = "The bear follows the critter out onto the floes and swims through the open water after it (slower than on ice, but never walled out). While submerged it stays trackable — drawn as a silhouette with a wake/ripple — so it is never invisible, even passing under a floe."
weight = 1
domain = "hunter"
proof = "hunt"
sub_items = [
  { id = "swims-out", title = "Follows onto the floes and swims the open water after the critter — slower, but never walled out" },
  { id = "stays-visible", title = "Submerged it stays trackable as a silhouette with a wake — never invisible, even under a floe" },
]

[[review_item]]
id = "bear-fair-reset"
title = "Fair pursuit reset and safe bays"
text = "When a crossing ends (death or a filled bay), the bear is removed and re-emerges only after the fresh critter has advanced a few tiles — it is never sitting on a just-respawned critter. A critter safe in a FILLED bay is safe from the bear (it cannot enter the far-shore wall or a filled bay)."
weight = 1
domain = "hunter"
sub_items = [
  { id = "fair-respawn", title = "After a crossing ends, the bear re-emerges only once the fresh critter has advanced a few tiles" },
  { id = "safe-bays", title = "The bear never enters the far-shore wall or a filled bay — it stays off the far shore, so a filled bay is permanently safe" },
]

[[review_item]]
id = "one-tile-hops"
title = "One-tile hops only"
text = "The critter moves by discrete one-tile hops in four directions, one tile per press, with no long or charged jump and no diagonal. A hop that would leave the strait or hit the far-shore wall / a filled bay is refused (no move, no death)."
weight = 1
domain = "crossing"
proof = "cross"
sub_items = [
  { id = "discrete-hops", title = "Discrete one-tile hops, four directions, one per press — no charged, multi-tile, or diagonal jump" },
  { id = "refused-blocked", title = "A hop off the strait or into the far-shore wall / a filled bay is refused (no move, no death)" },
]

[[review_item]]
id = "ice-hazards"
title = "The ice band of sliding hazards"
text = "The ice band is solid lanes the critter hops freely on, each carrying sliding multi-tile vehicles — a 3-tile snow plow, a 2-tile dogsled, and a 2-tile car — moving at set speeds in alternating directions. The critter CANNOT step into a tile a vehicle occupies (the hop is refused, like a wall, with no death), but a vehicle that SLIDES INTO the critter's tile is death — you die only when traffic runs into you, never by stepping into it. The critter is safe in the gaps and on the shores/median (from vehicles), but never from the bear."
weight = 1
domain = "crossing"
reference = "gameplay"
sub_items = [
  { id = "lanes", title = "Solid lanes carry sliding multi-tile vehicles (3-tile plow, 2-tile dogsled, 2-tile car) at set speeds in alternating directions" },
  { id = "block-not-death", title = "Stepping into a vehicle-occupied tile is refused like a wall — no death" },
  { id = "crush-death", title = "A vehicle sliding into the critter's own tile is death" },
]

[[review_item]]
id = "water-floes-drift"
title = "Deadly water and drifting carry-floes"
text = "The water band is deadly: standing on a water tile with no floe is death. The critter crosses by riding drifting floes, which CARRY it sideways as it stands on them; hopping into open water is death, and riding a floe off the side edge is death. Floes come in a mix of lengths — single 1-tile pans and SOLID 3-tile and 4-tile rafts (one continuous piece, not tiled pans) — and speeds."
weight = 1
domain = "crossing"
proof = "cross"
sub_items = [
  { id = "deadly-water", title = "Open water is deadly — hopping onto (or standing on) a floe-less water tile is death" },
  { id = "carry", title = "A floe carries the critter sideways as it stands on it" },
  { id = "off-edge", title = "Riding a floe off the side edge is death" },
  { id = "floe-mix", title = "Floes are a mix of 1-tile pans and solid 3-/4-tile rafts (one continuous piece, not tiled pans) at varied speeds" },
]

[[review_item]]
id = "bays-goal"
title = "Filling the far-shore bays"
text = "The critter completes a crossing by hopping up into an open bay in the far shore; a filled bay is occupied and blocks re-entry, and the solid shore between bays cannot be entered. Filling all 5 bays clears the level."
weight = 1
domain = "crossing"
reference = "gameplay"
sub_items = [
  { id = "fill-bay", title = "Hopping up into an open bay completes the crossing and fills it" },
  { id = "blocked-shore", title = "A filled bay and the solid shore between bays cannot be entered (the hop is refused)" },
  { id = "clear-level", title = "Filling all 5 bays clears the level" },
]

[[review_item]]
id = "timer-lives-levels"
title = "Timer, lives, and the 8-level run"
text = "Each crossing is under a timer that costs a life if it expires; the critter has 3 lives, lost to the bear, a hazard, drowning/off-edge, or the timer; 0 lives ends the game. The game is a run of 8 levels that speed up (and add a second bear from level 5), and clearing level 8 wins it."
weight = 1
domain = "crossing"
sub_items = [
  { id = "timer", title = "Each crossing is under a timer; letting it expire costs a life" },
  { id = "lives", title = "3 lives, lost to the bear, a hazard, drowning/off-edge, or the timer; 0 lives ends the game" },
  { id = "progression", title = "A run of 8 levels that speed up (a second bear from level 5); clearing level 8 wins" },
]

[[review_item]]
id = "scoring"
title = "Scoring, bonus life, and the bonus catch"
text = "A score accumulates across the run and shows in the HUD and end screens: +10 per row advanced, +50 for reaching a bay plus a per-second time bonus, +100*level for clearing a level, and +250 per remaining life at Victory. A bonus life is awarded at every 10,000 points. A bonus catch — a fish — appears in one randomly chosen open bay, lingering about 5 s before moving to another open bay (at most one at a time, a new one about every 8 s); completing a crossing into the bay holding the fish scores +200."
weight = 1
domain = "crossing"
sub_items = [
  { id = "score-accrues", title = "Score accrues from advancing, reaching bays (with a time bonus), clearing levels, and Victory, shown in the HUD and end screens" },
