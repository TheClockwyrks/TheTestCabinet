  { id = "bonus-catch", title = "A fish periodically appears in an open bay and moves between bays; crossing into the fish's bay awards a visible bonus (a larger score jump than a normal bay)" },
]

[[review_item]]
id = "uses-assets"
title = "Renders with the provided sprites"
text = "The game renders the critter (4-dir hop) and bear (4-dir run, submerged swim, lunge) at 32x32, the 3-tile snow plow, 2-tile dogsled, and 2-tile car hazards at their wider native sizes, and the floes (the 1-tile pan and the solid 3-tile/4-tile rafts) — all using the provided assets/ sprites with nearest-neighbor scaling — while the strait (water, ice, bays), the HUD, and the splash/wake VFX are drawn in code."
weight = 1
