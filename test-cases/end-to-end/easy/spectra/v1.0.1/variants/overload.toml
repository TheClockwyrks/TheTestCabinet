# Overload, where mismatched shots feed the drone toward an overload instead of
# being wasted. Its review item rolls up to the common `polarity` domain, since
# Overload extends the band-matching system rather than adding a new axis of
# judgement.
slug = "overload"
name = "Overload"
description = "Overload, where mismatched shots feed the drone toward an overload instead of being wasted."

# This variant's mode spec, seeded to the stable path `specs/mode.md` (the same
# path every variant seeds its mode spec to). It is self-contained: it defines the
# single Overload mode and its menu entry, replacing the base Sortie mode.
spec = [{ source = "specs/mode-overload.md", dest = "specs/mode.md" }]

# This variant's own `title` reference (its menu lists the OVERLOAD mode, replacing
# the base Sortie), captured from this variant's reference-impl build and served
# as-is; `gameplay` and `game-over` are common.
reference = [{ view = "title", media = "reference/screenshots/overload/title.png" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's playable build. A bare directory path (resolved against
# the version folder) holding a buildable web project, built with this case's
# `[build]` install/build commands and deployed like a published run build via
# `tcab publish-reference`, then shown on the case's "Reference" tab. It is
# **never seeded into a run**.
reference_implementation = "reference-impl/overload"

[[review_item]]
id = "overload-feeds"
title = "Mismatch overloads"
text = "In Overload, a mismatched (wrong-band) shot no longer wastes — it adds 1 charge to the drone, shown on-drone by a charge telegraph (a row of pips above the drone that advances one step per mismatched hit), and at 3 charge (full telegraph) the drone overloads with a per-type reaction and its telegraph empties: a Shard launches a fast headlong dive at the player, a Flux flips its band and fires a 3-shot spread, and a Prism's exposed layer emits a two-band burst (with a wrong shell hit also spawning an extra Shard escort)."
weight = 1
domain = "polarity"
sub_items = [
  { id = "charges", title = "Each wrong-band hit advances the drone's charge telegraph one step; at full it overloads and the telegraph empties" },
  { id = "shard", title = "An overloaded Shard launches a fast headlong dive at the player" },
  { id = "flux", title = "Steering a Flux to full charge overloads it: it flips its band and fires a 3-shot spread" },
  { id = "prism", title = "Feeding a Prism's shell wrong-band eventually overloads it and spawns an extra Shard escort" },
]
