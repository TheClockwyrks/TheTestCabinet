# --- The two bands ---------------------------------------------------------
# Spectra's signature, from specs/bands.md: a band decides what a shot destroys,
# what the shield stops, and what an inversion swaps. EFFECTIVE band is the idea the
# whole case turns on — a stored band put through two swaps, the Prism's broken shell
# and the spectral inversion, which compose as toggles rather than additively — so
# the two swaps are graded apart and their composition is graded on its own.
#
# What a MISMATCHED shot does to the drone is not here: the bullet being consumed is
# specs/bands.md's rule under either mode and is graded commonly, and what happens to
# the DRONE is specs/mode.md's and is graded by whichever variant category is
