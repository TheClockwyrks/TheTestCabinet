# specs/ui.md states the mute rule at SOURCE strength — while sound is muted the
# game starts no sound at all; a muted cue is not played and then silenced, it is
# not played — so this traces to a stated rule under every engine. Under an engine
# no `cue:played` reaches the bus while muted; under `none` the page-side audio shim
# reports no source started. A build that mutes by riding a gain node to zero still
# starts its sources, and is failing the stated rule rather than being caught by an
# unstated one.
[[review.categories.items]]
id = "mute-silences"
title = "Mute silences the game"
description = "With mute on, firing, flipping and killing emit no sound."
