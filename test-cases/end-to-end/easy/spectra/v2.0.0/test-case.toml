# --- The swarm -------------------------------------------------------------
# How any drone behaves, from specs/swarm.md: the wave's field starts empty, the
# drones fly in in staggered groups, the entrance is continuous and ends in a slot,
# the assembled block sways as one body, dives launch off the wave's own dive clock,
# a dive bends toward the ship and either loops back or wraps, only divers fire, and
# a survivor comes home.
#
# The four DIVE-TIMING points each pose a complete formation, pose the dive clock at
# zero, and only then open the dive-launching gate. Without the posed clock there is
# no assembly moment for a hidden timer to start from, and the points would be
# undecidable against a build that starts its delay at the assembly transition; the
# clock is declared state precisely so the pose is well defined.
