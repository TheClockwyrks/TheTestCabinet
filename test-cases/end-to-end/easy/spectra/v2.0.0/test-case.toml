# Stage 7 is inside the ramp — the formula reaches its 0.55 floor at stage 10, where
# this item would assert the same figure its floor sibling does. The gap is a DRAWN
# quantity, so the item reads it twice. The mean of twenty gaps carries the spread
# of the draw and is given the 20% band that spread needs: at 1.40 s the band is
# [1.12, 1.68], clear of the 2.00 s a build that does not scale means, the 1.70 s
# one scaling at half the stated rate means, and the 1.10 s one already on the
# floor means. That band cannot separate a ramp one step out, at 1.30 s, and no
# band over a mean could — so every one of a hundred drawn gaps is also bracketed
# against the window itself, [DIVE_GAP_MIN, DIVE_GAP_MAX] * 0.70 = [0.98, 1.82] s,
# by posing the wave's own dive clock either side of it. A build drawing from a
# window one step out draws under 0.98 s about one time in eleven, so a hundred
# draws name it.
[[review.categories.items]]
id = "scaling-dive-gap"
title = "Dives come faster at a later stage"
description = "The game reports diveGapScale(7) as 0.70 exactly; over a posed complete formation with the dive clock posed at 0 and dive launching on, the mean of twenty stage-7 dive gaps is 1.40 s within 20%, and none of a hundred drawn gaps launches with the wave's clock under 0.98 s or fails to launch with it past 1.82 s."
domains = ["swarm"]
failure_cap = "passable"
validation = { script = "stages/scaling-dive-gap.test.ts", outputs = [
  { id = "tighter", name = "The tighter stage-seven dive cadence", kind = "replay" },
] }
[[review.categories.items]]
id = "scaling-dive-gap-floor"
title = "The dive-gap scale has a floor"
description = "diveGapScale is 0.55 at stage 20 and at stage 40."
domains = ["swarm"]
failure_cap = "passable"
validation = { script = "stages/scaling-dive-gap-floor.test.ts", outputs = [
  { id = "floor", name = "The dive-gap floor at a late stage", kind = "image" },
] }
[[review.categories.items]]
id = "scaling-flux-hold"
