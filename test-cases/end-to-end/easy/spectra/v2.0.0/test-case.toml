# --- Stages ----------------------------------------------------------------
# The stage sequence, from specs/stages.md: a standard stage is one wave, it clears
# on the MOMENT its last drone is destroyed, and clearing it advances the number. The
# challenge stage is graded as the flyover it is stated to be — single-band groups,
# alternating, non-firing, harmless, and sweeping off the field — with a group read as
# what a player sees (inside the field on BOTH axes, adjacent same-band waves merged)
# rather than as what a single frame happens to list.
#
# The four scaling formulas are each graded twice, once inside the ramp and once at
# the cap or floor, because a formula asserted only where it saturates leaves the ramp
# itself ungraded.
[[review.categories]]
id = "stages"
title = "Stages"
# This drives the game's OWN stage-1 wave — flown in, raked to its last drone, and
# that drone shot — rather than posing a drone into a cleared field. Posing it was
# the v1.0.0 defect: it made the verdict rest on an unwritten side effect (whether
# a debug clear leaves the wave live) and failed builds whose progression is
# correct in play.
[[review.categories.items]]
id = "clears-on-last-drone"
title = "A wave clears when its last drone dies"
description = "Destroying the last drone of the game's own stage-1 wave clears the wave in that frame."
domains = ["arcade"]
failure_cap = "broken"
validation = { script = "stages/clears-on-last-drone.test.ts", outputs = [
  { id = "cleared", name = "The wave cleared on its last drone", kind = "image" },
] }
# The other half of that fix, and the reason it is a point in its own right:
# specs/stages.md states that a stage clears on the MOMENT its last drone is
# destroyed, so a wave that never held a drone is playing rather than cleared. That
# stated rule is what makes the shared harness's empty posed wave safe for all 266
