# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.
#
# THE ORDER OF THIS FILE MATTERS. Every ROOT key — `variants`, `assets`,
# `packages`, `init`, `max_runtime_hours` and `engines`, together with the
# metadata above them — must precede the first table header. A root key written
# after a header such as `[instrumentation]` parses as a member of THAT table
# (`instrumentation.assets`), and the case then resolves declaring no assets and
# no variants at all. The layout below is Refract's, Fathom's and Wireworm's, key
# for key.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "spectra"

# Human-readable display name for this test case.
name = "Spectra"

# Relative difficulty of this case, surfaced on the site. Spectra asks for a
# fixed-position formation shooter whose cannon is also its shield, three drone
# kinds that each probe the band system differently, a resonance meter and a
# screen-clearing discharge, a spectral inversion that swaps the whole field, a
# stage ladder with challenge flyovers, and seven screens around it. It is a lot
# of machinery, but every piece is a rule stated over one 1280x720 stage: there is
# no physics beyond straight-line integration, no opponent to model, and nothing
# that has to be tuned by feel. Difficulty rates how demanding the THINKING is,
# not how long the build takes — `max_runtime_hours` below is where the size of
# the job is accounted for. So easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "shooter", "space"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A fixed-position formation shooter whose cannon is also its shield: a shot only \
kills a drone of the band you are tuned to, and the swarm always fires both."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version. The site aggregates every
# version's entry, newest first, into the case's changelog. Like `description`,
# it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected engine) and handed to the model as
# the build instruction. It injects absolute in-container paths through template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Spectra is a substantial build — the two-band polarity
# system and the effective-band composition beneath it, three drone kinds with
# their own rules, the wave choreography and its dive clock, the resonance meter
# and its discharge, a stage ladder with challenge flyovers and four scaling
# formulas, seven screens, nine cues, the seeded sprite art and the particle
# burst, and, under the engineless run, the whole runtime layer beneath all of it.
# Five hours is comfortably more than a healthy build of that size needs while
# still catching a session that never terminates.
max_runtime_hours = 5

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, the vendored particle runtime,
# and, on an engine run, the vendored engine — and downloads the Playwright
# Chromium build (the base image ships the OS libraries Chromium links against,
# but not the browser binary), so the model can build the game and look at it in a
# browser without any further setup.
init = "npm install && npx playwright install chromium"

# The seeded art and the seeded effect, each kept at its path relative to this
# version folder when seeded, so `assets/shard.png` lands at `assets/shard.png` in
# the run. Every build renders the game from the SAME art and differs only in the
# code around it, which is what makes two runs of this case comparable to look at.
# `specs/assets.md` is the contract for what each file depicts, the canvas it is
# drawn on, and how the other band-state is derived from it. The ship's bullets,
# the HUD, the starfield, the discharge wave and every screen are still drawn in
# code.
#
# `assets` is a root key, so it must precede the first table header.
assets = [
  "assets/fighter.png",     # the player's ship
  "assets/shard.png",       # the fixed-band Shard
  "assets/flux.png",        # the oscillating Flux
  "assets/prism.png",       # the two-layer Prism
  "assets/drone-burst.json",# the particle system a destroyed drone pops with
]

# The Test Cabinet runtime libraries the build imports, by npm name. Each is
# staged into the run from the host package store and declared in every seeded
# workspace's `package.json` by its in-repo `file:` spec under `.tcab/packages/`.
# Spectra needs one: the particle runtime plays `assets/drone-burst.json`, so the
# case ships the effect and the runtime that simulates it rather than asking every
# build to write a particle system of its own and then comparing the results.
#
# `packages` is a root key, so it must precede the first table header.
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Spectra declares TWO, and they differ in exactly one rule — what a MISMATCHED
# shot does to the drone it hits. Under `base` (Sortie) it does nothing: the shot
# is wasted. Under `overload` it charges the drone, and the third charge overloads
# it into a reaction that differs per kind. That one rule is worth a variant
# because it inverts the risk of a wrong-band shot, and only `specs/mode.md.hbs`
# branches on it.
#
# The three DRONE KINDS are not variants, and neither are the stages: they are what
# a single build already contains. A variant is a difference in the game a run is
# asked to BUILD.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/overload.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the input
# actions a player drives it with, the audio bus, asset loading, and the on-screen
# diagnostics; one of them also owns rendering and the gameplay framework the game
# is written inside. It is a *run dimension*, chosen per run alongside the model,
# the harness and the variant, and recorded on the run; it is not a property of the
# game.
#
# Spectra supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the frame loop, the canvas fit, the keyboard input, the
#                     audio, the debug overlay, the `window.__spectra` surface, and
#                     every figure the specification fixes, from the specs alone.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules around
#                     it (`src/constants.ts`, `src/main.ts`, and the `src/game.ts`
#                     stub the build replaces, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes the
#                     whole of `src/game.ts` — the game definition, its mode, its
#                     live state and its actors — and the debug surface its
#                     instance's `initialize` returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to THIS game under it —
# which surfaces the build still supplies, Spectra's action list, and Spectra's cue
# names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

# ---- Tables begin here. No root key may follow. -----------------------------

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, an `index.html`
# holding the canvas, and a `vite.config.ts` that serves the seeded `assets/` tree
# in development and copies it into `dist/` at build. What differs is how much of
# the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     keyboard input, audio, debug overlay and `window.__spectra`
#                     surface, and every figure the specification fixes, from the
#                     specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them),
#                     `src/main.ts` (the browser entry) and the `src/game.ts` stub
#                     the build replaces.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds `src/constants.ts` and `src/main.ts`. It seeds NO
#                     `src/game.ts`: `src/main.ts` imports one, so a freshly seeded
#                     workspace fails `npx tsc --noEmit` on the missing module.
#                     That failure is the starting point, and `src/main.ts` says so
#                     in its header.
#
# The two engine workspaces are per VARIANT as well as per engine, because the
# seeded `src/constants.ts` differs: the overload variant's carries the overload
# group (`OVERLOAD_AT` and the three reactions' figures), its own `TITLE_ITEMS`,
# and a tenth cue. `none` needs only one directory, because it seeds no `src/` at
# all. This table names the BASE variant's pair; `variants/overload.toml` REPLACES
# the whole table with the overload pair, since a variant's `[workspaces]` replaces
# rather than layers.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/base/simple-2d"
"structured-2d" = "workspaces/base/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`.
# `npm ci` is deliberate — it requires the build to commit a `package-lock.json`,
# so the validated build installs exactly what the deploy will. Both commands are
# required; there are no defaults, so every case states exactly how its
# implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its
# scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__spectra` once the game has initialized, so
# the handle is what a person opening the console of such a build finds. An engine
# run has NO global at all: the build writes the surface, its `initialize` returns
# it — beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view, its
# surface is written in the shape of `update` — a pose takes the current state and
# returns the next, applied through `engine.apply`, and a reading takes the state
# and returns what it read, called with `engine.state`. `structured-2d` holds the
# world live, so its poses take only their own arguments and act on it at the call,
# and its readings return plain data. One handle, three ways to reach the same
# operations.
#
# There is deliberately no `tick_hz`. Spectra mandates no fixed timestep: every
# rate is per second and integrated against the delta time the frame hands the
# game. What the specification DOES fix is a sub-step ceiling — a frame is divided
# into `n = max(1, ceil(dt / SUBSTEP_MAX))` sub-steps of `h = dt / n` — which is a
# rule about how a frame is subdivided rather than a rate the harness could sample
# at, so the key stays absent. It is optional precisely so a case modelled this way
# omits it.
[instrumentation]
handle = "__spectra"

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. Neither variant declares one
# of its own: the mode is `specs/mode.md.hbs`, branched on the variant slug and
# seeded commonly, so a run receives one description of one mode and no seeded text
# mentions the sibling.
#
# The specification is decomposed by concern, and EACH RULE LIVES IN EXACTLY ONE
# FILE. Each file is self-contained enough to be read on its own while naming its
# siblings, by file name in plain text, where a fact lives elsewhere.
#
# Every `.hbs` source is rendered before it lands, and two axes are branched on:
# `engine.slug`, which selects what the build is handed and what it must write, and
# `variant.slug`, which selects the mode. A spec's `dest` defaults to its `source`
# with a trailing `.hbs` stripped, so an `.md.hbs` source seeds to the same `.md`
# path and a plain `.md` source is seeded verbatim.

# What the game is and what the finished build must be: the premise, the hard
# requirements, the free choices, the fixed 1280x720 stage and the centre
# convention every reported (x, y) uses, the stage-fit requirement, and the
# legibility table — what a player must be able to read at a glance, which is all
# this case fixes about the look. It names specs/field.md as where the geometry
# lives and specs/simulation.md as where the frame is defined, and restates
# neither. It branches on the engine for what the runtime supplies against what the
# build writes.
[[spec]]
source = "specs/overview.md.hbs"

# The geometry of the stage: the two HUD strips and the play field between them,
# SOLE OWNERSHIP of the ship's lane and its clamp, the formation slot grid and the
# slotX/slotY map, the sway as a rigid translation of the whole block, where a
# drone enters and where a bullet leaves, where each HUD readout sits, and the
# starfield behind the field. Seeded verbatim: nothing in it differs by engine.
[[spec]]
source = "specs/field.md"

# How a frame advances: every rate is per second and integrated against the delta
# time the frame hands the game, the sub-step rule and the order a sub-step
# resolves in, that all randomness runs off one seeded generator, and SOLE
# OWNERSHIP of the contact model. Seeded verbatim.
[[spec]]
source = "specs/simulation.md"

# The two bands and what a band decides: EFFECTIVE band and the three swaps that
# produce it, match-to-destroy, that a mismatched shot is consumed and destroys
# nothing, the dual-use shield, the flip and its lockout, and the spectral
# inversion's own rules. What a mismatch does to the DRONE is deferred to
# specs/mode.md by name. Seeded verbatim.
[[spec]]
source = "specs/bands.md"

# The ship and its cannon: its footprint and half-extent, how it moves and stops,
# where a shot spawns and how fast it climbs, the fire interval and the bullet cap,
# the band a shot carries, and what blocks firing. Seeded verbatim.
[[spec]]
source = "specs/ship.md"

# The resonance meter and the discharge: what fills the meter and by how much, that
# it caps and does not decay and survives a death, that a discharge is available
# exactly at full, and what the burst takes and what it spares. Seeded verbatim.
[[spec]]
source = "specs/resonance.md"

# How any drone behaves: the four phases, the staggered entrance and its speed, the
# formation hold and the sway, the wave's dive clock and the dive it launches, that
# only divers fire and where a diver fires, and what a standard wave is made of.
# Seeded verbatim.
[[spec]]
source = "specs/swarm.md"

# The three drone kinds and what each one asks of the band system: the fixed-band
# Shard, the Flux's held window and shimmer, and the Prism's two layers, its escort,
# its two-band burst and the inversion it triggers at the bottom. Seeded verbatim.
[[spec]]
source = "specs/drones.md"

# The stage sequence: that a standard stage is one wave, the level-clear rule stated
# as a MOMENT (so a wave that never held a drone is playing rather than cleared),
# the challenge stage and everything that makes it a flyover rather than a wave, and
# the four scaling formulas with their caps and floors. Seeded verbatim.
[[spec]]
source = "specs/stages.md"

# Lives and the run: the starting lives, what costs one and what does not, the ready
# hold and the respawn, the extra life and the latch that pays it once, and the game
# over. Seeded verbatim.
[[spec]]
source = "specs/progression.md"

# Every score figure the game pays, in one place, including which figure a drone
# destroyed out of formation is worth. Seeded verbatim.
[[spec]]
source = "specs/scoring.md"

# The playable mode. THE ONE FILE THAT BRANCHES ON THE VARIANT: under `base` it is
# Sortie, whose mismatched shot is wasted; under `overload` it is Overload, whose
# mismatched shot charges the drone, with the telegraph, the three overload
# reactions and their figures, and the tenth cue. It owns ONLY what a mismatch does
# to the DRONE — that the bullet is consumed is specs/bands.md's rule under either
# mode and is not restated here.
[[spec]]
source = "specs/mode.md.hbs"

# The keys: every action the game answers to and the keys bound to it, menu
# navigation and confirm, back, pause, mute, and the overlay toggle. It branches on
# the engine because an engine run registers NAMED ACTIONS against the bindings
# src/constants.ts fixes and reads them from the engine, while an engineless build
# listens to the keyboard itself and reads KeyboardEvent.code.
[[spec]]
source = "specs/controls.md.hbs"

# The screens, the HUD and the audio: the seven screens and what each shows, the
# five HUD readouts, the mute indicator and the inversion overlay, and the nine cues
# with the mute requirement stated at SOURCE strength. It branches on the engine
# because cues are defined and played through the engine's audio bus on an engine
# run and the mute bit is the engine's, while under `none` the build synthesizes
# them with the Web Audio API and owns the mute toggle.
[[spec]]
source = "specs/ui.md.hbs"

# The seeded art and the seeded effect: the four PNGs, their canvas and straight
# alpha, which band-state each depicts, the ring/diamond glyph convention, how the
# other band-state is derived, how a shimmer and a broken shell are drawn, and the
# drone-burst system and how it is played. It branches on the engine because the
# engine resolves every path under the fixed `assets/` root while an engineless
# build loads both itself, page-relative, so the site runs at any base path.
[[spec]]
source = "specs/assets.md.hbs"

# The shape of the game's state. Three shapes, one per engine: under `none` a list
# of what the state must carry, because the build owns the shape; under `simple-2d`
# the exact `SpectraState` declaration to write into `src/game.ts`; under
# `structured-2d` the equivalent live class extending the engine's `GameState`. It
# branches on the variant too, for the drone's `charge` field.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# render-free core; every operation by name, signature and effect, the three world
# gates and the three per-drone faculty switches among them; the snapshot shape; and
# a read-only debug overlay. Framed as an ordinary developer affordance of the game.
# It branches on the engine for where the surface is reached, the operation shape,
# and the two clock operations only an engineless build owns, and on the variant for
# `setDroneCharge` and the drone's `charge` field.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured — a gzipped recording from the engine's own draw-command
# recorder on an engine run, a short clip under `none`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`.
#
# Spectra v2.0.0 deliberately fixes NO palette, no typeface and no styling: the
# specification seeds the sprite art and states what a player must be able to read
# at a glance (specs/overview.md's legibility table), and everything else about the
# look is the build's own design. A reference view is a picture a build is compared
# AGAINST, so there is no honest one to seed here — every build is expected to look
# different, and a screenshot diff would score the build that copied the mockup best
# rather than the build that designed the best field. v1.0.0 seeded reference
# mockups, an eleven-entry canonical palette and a monospace requirement; dropping
# all three is one of the things this major bump is for.
#
# `[[proof]]` is likewise empty: no proof media is asked of the build, and
# `specs/proof.md` is gone with it. Every piece of media a reviewer sees beside a
# verdict is captured by this case's own validation suites, from scenarios the case
# controls. The showcase spec above does ask for media, but as the game's own
# store-page presentation rather than as evidence any point is judged on. The
# automated load check still runs.

# Scoring domains. This case is on the engine format, so it is validator-rated:
# each domain's FUNCTIONAL rating is decided by the validators behind the point
# checklist below (every point names the domains its failure lowers and how far —
# see `domains` / `failure_cap` there), and the run's overall functional rating is
# the WORST across the domains — an immaculate arcade frame cannot mask a discharge
# that never fires. The reviewer's judgement lives in the separate AESTHETIC
# rating: the look, the polish and the feel, everything this case fixes no picture
# of.
#
# Four domains, cut where a build can plausibly get one right and another wrong:
# the polarity system that is this case's signature, the swarm that is its subject,
# the arcade frame around both, and the presentation this case hands entirely to the
# build.
[[domain]]
id = "polarity"
name = "Polarity & Survival"
description = "The signature: the two bands, match-to-destroy and what a mismatch does, the dual-use shield, the flip and its lockout, the resonance meter and the screen-clearing discharge, and the spectral inversion that swaps the field."

[[domain]]
id = "swarm"
name = "The Swarm"
description = "The choreographed entrances, the swaying formation, the dives and their fire, and the three drones — the fixed-band Shard, the oscillating Flux, and the two-band Prism."

[[domain]]
id = "arcade"
name = "Ship, Stages & Run"
description = "The arcade frame around the polarity: the ship and its cannon, the stages and their challenge flyovers, the lives, the respawn, the scoring, and the screens a run moves through."

[[domain]]
id = "presentation"
name = "Presentation"
description = "What the game looks and sounds like: the screens and their menus, the HUD, the seeded sprite art and the drone-burst, whether the palette the build chose is legible and its states told apart, and the audio cues."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY — a bare name grouping the points — and
# each item entry under it is one graded review item, worth one point (the default
# weight), so a category is worth the number of items it holds. No item declares a
# `weight`: every observable behavior on this checklist counts the same, and the
# relative importance of a failure is carried by `failure_cap`, not by arithmetic.
#
# A category carries no prose of its own; each item states in `description` the
# claim its validator checks. The fifteen categories here are COMMON to every run.
# Each variant declares ONE category of its own — `sortie` in `variants/base.toml`,
# `overload` in `variants/overload.toml` — because the two modes genuinely disagree
# about what a mismatched shot does, and a claim that is true under one and false
# under the other cannot be stated commonly. A base run's checklist is therefore
# 269 points and an overload run's is 287. The whole of it is reporter-side
# material — never seeded into a run, so the model never sees it. Every item
# restates a requirement the seeded specification already states, in the spec's own
# vocabulary and naming the spec's own constants, and every threshold a validator
# asserts is derived from a figure or rule in the specs plus a numeric tolerance
# stated in the item.
#
# EVERY point carries a validation script, and every point is ONE OBSERVABLE
# BEHAVIOR, so a build fails exactly the rule it breaks: the key that starts a
# discharge and the meter that discharge spends are two points, not one, and a
# wrapping dive's continuity and its return home are two more. Each script is a
# vitest suite under `validation/<engine>/<category>/<item id>.test.ts`. The
# `<engine>` level is the ENGINE the suite is written against — a validator speaks
# one engine's vocabulary, so this case, which supports three, ships one directory
# per engine. `validation/none/` drives the build in Chromium through
# `window.__spectra`, with a page-injected 2D-context recorder for the draws and an
# injected audio shim for the cues; `validation/simple-2d/` and
# `validation/structured-2d/` each run in process against their vendored engine,
# posing scenarios through the surface `engine.debug` returns, reading state back
# from the snapshot, audio from the engine's `cue:played` event, and drawing from
# the canvas pixels or the engine's own draw-command recorder. The three are the
# same scenarios; only how they reach the build differs. The directory for the run's
# engine is what gets staged into the built workspace at `validation/`. Both
# variant categories' directories ship in every engine's project; resolution runs
# one variant at a time, so the other simply does not run.
#
# EVERY SCENARIO IS POSED, AND POSED EMPTY. The shared harness's `startPosed`
# clears the drones, bullets and bursts, turns the three world gates off, and opens
# a live wave — so a validator's world holds only what its requirement concerns and
# nothing it did not ask for enters, launches, or costs a life. An empty wave is
# safe because a stage clears on the MOMENT its last drone is destroyed rather than
# on a predicate over an empty field (`stages.empty-wave-does-not-clear` is what
# holds a build to that). Turning a gate back on is the exception, and the point
# that does it is the point whose requirement the gate is.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. `kind` is decided ONCE here and serves all three engines —
# `validation = { script, outputs }` is a per-item key, there is no per-engine
# `outputs`, and the extension an output is served under is fixed by its kind, so a
# kind that varied by engine would serve one engine's file under another's name.
# `image` is the default: a single captured frame, which is the right evidence for
# a posed field read once. `replay` is the exception, declared on the nineteen
# points whose requirement IS motion — an entrance, the sway, a dive, the discharge
# wave, a Flux's cycle, a challenge flyover, an overloaded Shard's plunge — where a
# reviewer wants to scrub. There is no `video` anywhere.
#
# ONE OUTPUT PER POINT, with a closed list of exceptions. An output is evidence
# beside the verdict, not part of it, so a point that measures a difference INSIDE
# ONE RENDER — two drones of opposite bands side by side, a shimmering Flux beside
# a holding one, a charged drone beside an uncharged one — declares ONE output, the
# render its assertion turns on. The pair is declared only where the evidence is one
# subject in two states that cannot both appear in a single render, and that list is
# exactly seven: `instrumentation.advances-in-real-time`,
# `presentation.ship-reads-band`, `screens.hud-resonance-ready`,
# `screens.hud-polarity-indicator`, `screens.mute-indicator`,
# `screens.inversion-overlay` and `bursts.varies`.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers — a band point lowers
# `polarity`, a point about the drone that band decides the fate of lowers `swarm`
# as well, and an instrumentation point, which every suite in every domain drives
# through, lowers all four. `failure_cap` is the highest functional rating those
# domains may reach while the point fails; each domain gets the LOWEST cap among its
# failing points, and a domain with no failing point is flawless. The caps are graded
# by how much of the game a failure takes away: `broken` where the game cannot be
# played as intended (no debug surface, a shot that ignores bands, a wave that never
# assembles, a run that cannot be opened); `scuffed` where an optional path is
# unplayable or normal play is unpleasant (a control with no alternate binding, a
# screen that misreports the run); `passable` where it affects play without breaking
# it (a tolerance, an edge case, a cue); and `great` where the standard flow is
# untouched. No point caps at `flawless`: a failure always costs. Three rules resolve
# the cases this case argues about — a rate that is wrong but playable is `passable`
# rather than `broken` unless the wrong figure removes a whole mechanic; a control
# with an alternate binding is `passable` and one with a single binding is `scuffed`;
# and a point whose failure only lowers `presentation` is at most `scuffed`.
[review]
format = 2

# --- Instrumentation -------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# game is driven and inspected from code, and every other suite on this checklist
# poses its scenario through it. These points check that it is really there, really
# wired to the running game, really deterministic, and that each pose reads back — a
# surface that reports a plausible-looking object unconnected to what is on screen
# is the failure mode worth naming.
#
# Six of them are the three WORLD GATES and the three per-drone FACULTY switches. A
# validator poses a world holding only what its requirement concerns, and Spectra's
# own figures fly a wave in the moment a stage intro gives way and launch a dive two
# seconds after a formation assembles, so without the gates a posed scenario would
# be joined by traffic it never asked for. `setWaveEntry`, `setDiveLaunching` and
# `setShipContact` each gate ONE faculty and nothing else; `setDroneTravel`,
# `setDroneOscillation` and `setDroneFire` do the same per drone. Each has a point
# here because a gate the rest of the suite leans on has to be known to work before
# anything leaning on it means anything.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug surface is present and complete"
description = "Every operation specs/instrumentation.md names is a function on the surface, version is SPECTRA_DEBUG_VERSION (1), and the surface is live: a posed drone reads back and a posed ship moves under a held key."
domains = ["polarity", "swarm", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "live", name = "The posed drone and the moved ship the surface drove", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed field carrying a drone of each kind, a bullet each way, a live burst and a live discharge, every field the snapshot shape lists is present with its documented type."
domains = ["polarity", "swarm", "arcade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The posed field the snapshot reports", kind = "image" },
] }
[[review.categories.items]]
id = "poses-read-back"
title = "Every pose is reported by the snapshot"
description = "Each pose operation's value is read back by snapshot: screen, phase, phase timer, menu index, score, lives, the extra-life latch, stage, resonance, inversion, the ship's x, band, lockout and cooldown, a drone's position, band (on a Shard, a Flux and a Prism alike, since band is the stored field on every kind), phase, slot, band clock, shell and three faculties, a bullet's velocity, the three world gates, and the dive clock. Mute is not in the list: there is no setMuted."
domains = ["polarity", "swarm", "arcade", "presentation"]
