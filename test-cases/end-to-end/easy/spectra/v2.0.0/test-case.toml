# --- Art & legibility ------------------------------------------------------
# Each point samples what the build actually DRAWS — the sources it hands `drawImage`
# and the pixels it leaves on the canvas — so a build cannot pass by reporting a value
# it does not render.
#
# NO POINT ASSERTS A HEX VALUE, and there is no palette to assert one against: Spectra
# v2.0.0 fixes no palette and no typeface, and specs/overview.md's legibility table
# states the RELATIONSHIPS a player must be able to read instead. So these check
# that a thing is drawn and that two things are told apart, against a stated RGB distance out of 441. Two rows of
# that table are deliberately left to the reviewer rather than given a point — whether a
# band's shape accent is used consistently everywhere a band appears, and how bright the
# starfield reads — because neither is a question pixels can decide without asserting a
# layout the specification leaves to the build.
[[review.categories]]
id = "presentation"
title = "Art & legibility"
[[review.categories.items]]
id = "fighter-from-sprite"
title = "The ship is drawn from the seeded fighter"
description = "The image source drawn centred on the ship carries assets/fighter.png's alpha silhouette, matching at or above 99% of its pixels once scaled to SPRITE_SIZE."
domains = ["presentation"]
failure_cap = "scuffed"
validation = { script = "presentation/fighter-from-sprite.test.ts", outputs = [
  { id = "ship", name = "The ship drawn from the seeded fighter", kind = "image" },
] }
