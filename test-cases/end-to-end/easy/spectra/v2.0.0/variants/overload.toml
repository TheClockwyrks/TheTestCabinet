# The second Spectra variant: OVERLOAD — the same game, with one rule inverted.
# A shot of the wrong band is no longer wasted: it CHARGES the drone it hits, and
# the third charge overloads it into a reaction that differs by kind. Every path
# here resolves against the version folder, exactly like the main manifest.
slug = "overload"
name = "Overload"
description = "The same swarm, with mistakes that bite back: a wrong-band shot charges the drone, and the third one overloads it."

# This variant declares NO `spec` of its own, and that is deliberate.
#
# The rule the two modes disagree about lives in a COMMON spec that branches on this
# variant's slug when it is rendered: `specs/mode.md.hbs` becomes Overload, whose
# main-menu entry is OVERLOAD and which owns the charge, the telegraph drawn on the
# drone, the three overload reactions and their figures, and the tenth cue. Two other
# common specs branch on the slug for what that rule implies —
# `specs/state.md.hbs` for the drone's `charge` field and
# `specs/instrumentation.md.hbs` for `setDroneCharge` and the field the snapshot
# reports. Everything else in the seeded set is identical under both modes and is
# declared commonly in `test-case.toml`, so there is no spec of any kind to put here.

# What the game looks like played correctly, shown before anyone runs it: the same
# sustained stretch of real play as the other mode, with the charge telegraph filling
# on the drones a wrong-band shot found and one drone of each kind tipping over into
# its own reaction. Captured from `references/none/overload` driven through this
# case's own validator harness — see `variants/base.toml` for why the showcase is
# taken from the engineless reference — with every outcome arising from the game's
# own rules under scripted key input. `showcase/overload/showcase.toml` lists the
# media; `showcase/overload/showcase.md` carries the description, and
# `showcase/capture/README.md` says how each file was produced.
showcase = "showcase/overload"

# The authored, *correct* static build of this variant, one directory per engine —
# see `variants/base.toml` for what a reference implementation is, how it is built
# and published, and why it is never seeded into a run. It is the same game as the
# base build with the charge model added.
[reference_implementation]
none = "references/none/overload"
"simple-2d" = "references/simple-2d/overload"
"structured-2d" = "references/structured-2d/overload"

# This variant needs a starter project of its own under each engine that seeds one:
# the seeded `src/constants.ts` carries the overload group (`OVERLOAD_AT`,
# `OVERLOAD_DIVE_SCALE`, `OVERLOAD_FLUX_SPREAD`, `OVERLOAD_FLUX_SPREAD_ANGLE` and
# `OVERLOAD_PRISM_ESCORTS`), a `TITLE_ITEMS` whose first entry is OVERLOAD rather
# than LAUNCH, and a tenth cue, none of which the base workspaces carry.
#
# The table REPLACES the case's `[workspaces]` rather than layering onto it, so it
# must name EVERY engine the case supports — including `none`, whose starter project
# is the same one either mode is built from, because it seeds no `src/` at all and
# therefore has no constants to differ in.
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/overload/simple-2d"
"structured-2d" = "workspaces/overload/structured-2d"

# No `[[domain]]`. Overload changes only what a mismatched shot does, which is the
# common `polarity` domain's own subject, so every point below is rated within the
# common set rather than adding a domain an overload run has and a base run does not.

# --- Overload --------------------------------------------------------------
# Overload's difference is that a mismatched shot charges the drone instead of being
# wasted, and that a charged drone reacts when it overloads. Each point poses the drone
# through `setDroneCharge` and tips it over with a REAL mismatched shot, so the pose is
# the precondition and the shot is the trigger; posing the overload itself would grade
# the debug surface rather than the rule.
#
# The three kinds react differently, so each reaction is graded on its own, and the cue
# an overload plays is graded here rather than in the common `audio` category because
# specs/mode.md owns it and a base run has no such cue.
[[review.categories]]
id = "overload"
title = "Overload"
[[review.categories.items]]
id = "mismatch-charges"
title = "A mismatched shot charges the drone"
description = "A wrong-band shot into a drone at charge 0 leaves it alive at charge 1."
domains = ["polarity"]
failure_cap = "broken"
validation = { script = "overload/mismatch-charges.test.ts", outputs = [
  { id = "charged", name = "The drone alive at charge one", kind = "image" },
] }
[[review.categories.items]]
id = "charge-advances"
title = "Successive mismatches advance the charge"
description = "Two wrong-band shots carry the charge 0 to 1 to 2."
domains = ["polarity"]
failure_cap = "broken"
validation = { script = "overload/charge-advances.test.ts", outputs = [
  { id = "advanced", name = "The drone carried to charge two", kind = "image" },
] }
