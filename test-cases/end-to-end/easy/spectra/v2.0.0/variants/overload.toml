description = "Sampled over the drone's own footprint, a drone at charge 1 leaves pixels differing from a drone at charge 0 by an RGB distance of at least 25 of 441, and a drone at charge 2 differs from one at charge 1 by as much again. Where on the drone the charge is shown is not asserted: specs/mode.md fixes only that it is shown on the drone, so a build that rings it, tints its core or crowns it all pass."
