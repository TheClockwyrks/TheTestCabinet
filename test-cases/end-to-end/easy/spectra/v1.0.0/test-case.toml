text = "The Prism is a two-band boss: destroy the outer shell with the shell's band, then the exposed core with the opposite band. It enters escorted by two Shards and fires a two-band (one cyan, one magenta) burst while diving."
weight = 1
domain = "swarm"
sub_items = [
  { id = "shell-then-core", title = "Shell destroyed with its band, then the exposed core with the opposite band" },
