slug = "spectra"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Spectra"

# Relative difficulty (easy | medium | hard), surfaced on the site. Spectra asks
# for choreographed entrance and dive paths, a swaying formation, two-band
# polarity combat with a dual-use shield, three distinct drone behaviors, the
# resonance/discharge economy, challenge stages, and several states — several
# systems that want encapsulating behind interfaces, but a bounded 2D arcade
# shooter, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "shooter", "space"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A fixed-position formation shooter where your cannon is tuned to one of two \
spectral bands — and that band is also your shield. A shot only destroys a drone \
of the matching band, while the swarm always fires both, so survival is a \
constant gamble of which band to be."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. Spectra is a substantial build (choreographed paths, a formation,
# three drone AIs, two-band combat, multiple states), so it gets a full five
# hours — comfortably more than a healthy build needs while still
# bounding a runaway session.
max_runtime_hours = 5
# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Asset files or directories seeded alongside the specs, each kept at its path
# relative to this version folder when seeded (so `assets/fighter.png` lands at
# `assets/fighter.png` in the run). Spectra ships a fixed set of pre-drawn
# sprites — one per entity, generated by The Test Cabinet's own asset-generation
# cases (`spectra-fighter`, `spectra-shard`, `spectra-flux`, `spectra-prism`) — plus
# the drone-burst particle effect authored by the `spectra-burst` particle case: a
# live-simulated `system.json` the build plays when a drone pops. So every build
# renders the same ship, drones, and detonation and differs only in code. The build
# is required to render the ship and drones from the sprites and to play the burst
# from the provided system (the loading rule, the per-band derivation, how to play
# the effect, and what is left to draw in code are the contract in `specs/assets.md`).
# The model still designs its own paths and formation.
# (A root key, so it must sit above the first `[table]` header below.)
assets = [
  "assets/fighter.png",     # the player's resonator-fighter (cyan-tuned reference)
  "assets/shard.png",       # the fixed-band crystalline drone (magenta reference)
  "assets/flux.png",        # the oscillating drone, caught mid-shimmer (both bands)
  "assets/prism.png",       # the two-band boss: cyan shell around a magenta core
  "assets/drone-burst.json", # the drone-pop particle system (from `spectra-burst`)
]

# Test Cabinet runtime libraries installed into the run so the build can play the
# provided particle system. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and
# injects it into this case's workspace `package.json` as a `file:` dependency, so
# the build imports it (its `/canvas` binding) like any other dependency and plays
# `assets/drone-burst.json` by simulating it live. See `specs/assets.md` for the
# consumption contract. (A root key, so it must sit above the first `[table]` header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Neither variant seeds a spec of its own: what differs
# between them — the mode's menu entry, its identity, and what a mismatched shot
# does — is branched by variant slug inside the common `specs/gameplay.md.hbs`
# template. Each variant supplies its own `title` menu reference (the main menu
# lists a different mode per variant; `gameplay` and `game-over` are common), and —
# for the overload variant — the review category for the Overload mode (rated
# within the common `polarity` domain, since Overload extends the band system):
#   - base     — Sortie.
#   - overload — Overload, where a mismatched shot no longer wastes but charges the
#                drone toward a per-type overload.
# This list is a root key, so it must sit above the first `[table]` header below.
variants = [
  "variants/base.toml",
  "variants/overload.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named
# once here so a review item's `validation` driver (and the validator that runs it)
# knows which `window` global to drive. The seeded specification documents the same
# handle independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded. It is
# required because review items below declare `validation` scripts.
[instrumentation]
handle = "__spectra"
# The fixed simulation rate, in Hz. Spectra's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation
# runtime uses to relate that exact stepping back to real time — one tick is
# 1/120 of a second, so a second of game time is 120 ticks. It must match the
# timestep the seeded `specs/controls.md` mandates.
tick_hz = 120

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern: the overview, the stage
# geometry, polarity, the controls, the drones, the gameplay (the mode, waves,
# stages, scoring, lives, and scaling), the UI (menus, game states, the HUD, and
# audio), the provided-art contract, and the debugging/automation surface. The
# mode-varying material — the mode's menu entry, its identity, and what a mismatched
# shot does — is branched by variant slug inside `specs/gameplay.md.hbs` rather than
# seeded from a separate per-variant file, so each variant's rendered set reads as
# one self-contained game. Most common specs are plain Markdown, seeded verbatim.
# Two are `.hbs` templates, rendered with the selected variant before landing at
# their `dest`: `specs/gameplay.md.hbs`, which branches on the variant slug for the
# mode, and `specs/instrumentation.md.hbs`, a little of whose wording — the
# snapshot's mode string and charge field, and the Overload-only control op —
# depends on the variant.
# A spec's `dest` defaults to its `source` (with a trailing `.hbs` stripped), so
# these need only name the source they seed (an `.md.hbs` source seeds to `.md`).
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/polarity.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/drones.md"

[[spec]]
source = "specs/gameplay.md.hbs"

[[spec]]
source = "specs/ui.md"

# The provided art contract: which sprites are seeded under `assets/`, how to load
# them under any base path, how each entity's second band is derived at runtime,
# and what is left to draw in code. Seeded for every variant so the manifest's
# `assets` (above) and this spec stay in lockstep.
[[spec]]
source = "specs/assets.md"

# The debugging and automation surface every variant must expose: a deterministic,
# steppable, manual-clock core; a `window.__spectra` API to drive and inspect the
# game from code; and a read-only debug overlay. Framed as an ordinary developer
# affordance of the game. Rendered from a `.hbs` template so its snapshot wording
# matches the selected variant; it seeds to `specs/instrumentation.md`.
[[spec]]
source = "specs/instrumentation.md.hbs"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl builds — the
# authored, correct games under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. The `title` view is variant-specific (declared per variant
# above) because the menu differs by variant; `gameplay` and `game-over` (captured
# from the `base` build) look the same in every variant.
[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-wave"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Game over"
dest = "proof/game-over.png"

[[proof]]
id = "polarity"
name = "Dual-use polarity clip"
dest = "proof/polarity.webm"

[[proof]]
id = "assault"
name = "Swarm assault clip"
dest = "proof/assault.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — flawless polarity combat
# cannot mask a swarm that does not fly, and vice versa. Domains are case-level and
# rated separately from the point checklist below (the categories grammar attaches
# no domain to a point); the category names are chosen so the checklist still reads
# by concern.
[[domain]]
id = "polarity"
name = "Polarity & Survival"
description = "The two-band core: match-to-destroy and wasted mismatches, the dual-use shield, the flip and its lockout, and the resonance meter and discharge."

[[domain]]
id = "swarm"
name = "The Swarm"
description = "The choreographed entrances and swaying formation, the dive attacks, the three drones — Shard, Flux, and Prism — the Prism's spectral inversion, and the challenge stages."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare
# name grouping the points a reviewer grades — and each
# `[[review.categories.items]]` under it is one graded review item, worth one
# point (the default weight). A category carries no prose of its own; each item
# states its own requirement in `description`. The checklist is reporter-side
# material — never seeded into a run, so the model never sees it; each item
# restates a requirement the seeded specification already states. An item with a
# `validation` script is decided automatically (the reviewer can override); one
# without is reviewed by a person. The items left to a person are the provided-art
# points (drawn from the sprites, re-tint, code-drawn, the burst's look and
# variety), the window-fit point, and the two audio-cue points — none of which a
# script can judge. The taxonomy is deliberately narrow: one observable behavior
# per item, so a build fails exactly the rule it breaks rather than a broad item
# averaging several. A variant adds its own `mode` category in its own file.
[review]
format = 2

# --- Polarity & Survival ------------------------------------------------------
# The two-band core, each rule its own point so a build fails exactly the one it
# breaks. Every point poses the situation through the debug API and steps the real
# simulation forward, reading the outcome back (see specs/instrumentation.md).
[[review.categories]]
id = "polarity"
title = "Polarity & Survival"
[[review.categories.items]]
id = "match-destroys"
title = "Matching-band shot destroys a drone"
description = "A player shot whose band matches the drone's current band destroys it."
# Automated validation: pose a shard and fire a matching-band bullet into it; the
# real collision destroys it. See validation/polarity/match-destroys.mjs.
validation = { script = "validation/polarity/match-destroys.mjs", outputs = [
  { id = "kill", name = "A matching shot destroying a drone", kind = "video" },
] }
[[review.categories.items]]
id = "mismatch-no-destroy"
title = "Opposite-band shot never destroys a drone"
description = "A player shot whose band is opposite the drone's current band never destroys it (what else it does is the mode's business, specs/gameplay.md), so the drone survives an opposite-band hit."
# Automated validation: fire an opposite-band bullet into a shard and confirm the
# drone survives it, still in formation. See validation/polarity/mismatch-no-destroy.mjs.
validation = { script = "validation/polarity/mismatch-no-destroy.mjs", outputs = [
  { id = "wasted", name = "An opposite-band shot failing to destroy the drone", kind = "video" },
] }
[[review.categories.items]]
id = "shield-absorb"
title = "Same-band bullet is absorbed harmlessly"
description = "Your current band is your shield: an enemy bullet of the same band as the ship is absorbed on contact, costing no life."
# Automated validation: send a same-band enemy bullet into the ship and confirm no
# life is lost. See validation/polarity/shield-absorb.mjs.
validation = { script = "validation/polarity/shield-absorb.mjs", outputs = [
  { id = "absorb", name = "A same-band bullet absorbed by the shield", kind = "video" },
] }
[[review.categories.items]]
id = "shield-lethal"
title = "Opposite-band bullet costs a life"
description = "An enemy bullet of the band opposite the ship's is not shielded: it costs a life on contact."
# Automated validation: send an opposite-band enemy bullet into the ship and confirm
# a life is lost. See validation/polarity/shield-lethal.mjs.
validation = { script = "validation/polarity/shield-lethal.mjs", outputs = [
  { id = "hit", name = "An opposite-band bullet costing a life", kind = "video" },
] }
[[review.categories.items]]
id = "drone-body-lethal"
title = "A drone body is always lethal"
description = "A drone body on the ship always costs a life on contact, regardless of band — even a drone of the ship's own band (so it is never mistaken for a shield)."
# Automated validation: put a drone of the ship's own band onto the ship and confirm
# the body still costs a life. See validation/polarity/drone-body-lethal.mjs.
validation = { script = "validation/polarity/drone-body-lethal.mjs", outputs = [
  { id = "body", name = "A same-band drone body still costing a life", kind = "video" },
] }
[[review.categories.items]]
id = "flip-instant"
title = "Flip changes band instantly"
description = "Flipping bands is instant: the ship's band changes the moment the flip is triggered, with no delay."
# Automated validation: from a known band, perform a real flip and read the ship's
# band back immediately (no step). See validation/polarity/flip-instant.mjs.
validation = { script = "validation/polarity/flip-instant.mjs", outputs = [
  { id = "flip", name = "The ship's band changing on a flip", kind = "video" },
] }
[[review.categories.items]]
id = "flip-lockout"
title = "Flip imposes a fire lockout"
description = "A flip imposes a roughly 0.30s fire lockout: firing is blocked immediately after a flip and works again once the lockout elapses, so you cannot flip and fire in the same instant."
# Automated validation: flip, confirm firing is blocked while the lockout stands,
# then that it works after ~0.30s. See validation/polarity/flip-lockout.mjs.
validation = { script = "validation/polarity/flip-lockout.mjs", outputs = [
  { id = "lockout", name = "Fire blocked during the post-flip lockout", kind = "video" },
] }
[[review.categories.items]]
id = "resonance-absorb-fills"
title = "Absorbing a bullet fills resonance"
description = "Absorbing a same-band enemy bullet feeds the resonance meter (about 6 of 100 per bullet)."
# Automated validation: absorb one same-band bullet and read the resonance gain.
# See validation/polarity/resonance-absorb-fills.mjs.
validation = { script = "validation/polarity/resonance-absorb-fills.mjs", outputs = [
  { id = "fill", name = "Resonance rising from an absorbed bullet", kind = "video" },
] }
[[review.categories.items]]
id = "resonance-kill-fills"
title = "A matching kill fills resonance"
description = "A matching kill feeds the resonance meter (about 4 of 100). A Prism's core kill counts; breaking its shell does not."
# Automated validation: read the resonance gain from a shard kill, a Prism shell
# break (none), and a Prism core kill. See validation/polarity/resonance-kill-fills.mjs.
validation = { script = "validation/polarity/resonance-kill-fills.mjs", outputs = [
  { id = "fill", name = "Resonance rising from a matching kill", kind = "video" },
] }
[[review.categories.items]]
id = "discharge-clears"
title = "A full discharge clears the threat"
description = "At full resonance a discharge wipes every entering and diving drone and clears all enemy bullets (band-blind), but spares the formation."
# Automated validation: pose divers, a formation drone, and enemy bullets, fire a
# real discharge, and confirm the divers and bullets are gone while the formation
# drone survives. See validation/polarity/discharge-clears.mjs.
validation = { script = "validation/polarity/discharge-clears.mjs", outputs = [
  { id = "discharge", name = "A discharge clearing divers and bullets", kind = "video" },
] }
[[review.categories.items]]
id = "discharge-spends"
title = "A discharge spends the whole meter"
description = "Firing a discharge spends the entire resonance meter, dropping it to zero."
# Automated validation: fill the meter, fire a real discharge, and confirm resonance
# is spent to zero. See validation/polarity/discharge-spends.mjs.
validation = { script = "validation/polarity/discharge-spends.mjs", outputs = [
  { id = "spend", name = "The meter emptied by a discharge", kind = "video" },
] }
[[review.categories.items]]
id = "discharge-locked"
title = "A discharge needs a full meter"
description = "Below full resonance a discharge does nothing: the meter is not spent and no discharge wave fires."
# Automated validation: with the meter one point short of full, trigger a discharge
# and confirm nothing happens. See validation/polarity/discharge-locked.mjs.
validation = { script = "validation/polarity/discharge-locked.mjs", outputs = [
  { id = "locked", name = "A below-full discharge doing nothing", kind = "video" },
] }

# --- The Swarm ----------------------------------------------------------------
# The choreographed entrances, the swaying formation, and the dive attacks.
[[review.categories]]
id = "swarm"
title = "The Swarm"
[[review.categories.items]]
id = "fly-in"
title = "Drones fly in and assemble"
description = "Drones are absent at the start of a wave: they fly in along entrance paths (phase entering) and settle into the formation (phase formation)."
# Automated validation: start a real stage and confirm drones begin entering, then
# assemble into formation. See validation/swarm/fly-in.mjs.
validation = { script = "validation/swarm/fly-in.mjs", outputs = [
  { id = "flyin", name = "The formation flying in and assembling", kind = "video" },
] }
[[review.categories.items]]
id = "both-bands"
title = "The formation mixes both bands"
description = "The assembled formation holds drones of both bands — at least one cyan and one magenta — so clearing it forces flipping."
# Automated validation: assemble a real formation and confirm both bands are present.
# See validation/swarm/both-bands.mjs.
validation = { script = "validation/swarm/both-bands.mjs", outputs = [
  { id = "formation", name = "The assembled two-band formation", kind = "image" },
] }
[[review.categories.items]]
id = "sways"
title = "The formation sways as one body"
description = "The formation drifts side to side as one rigid body: its drones share the same horizontal sway, swinging about ±20 px between the peak and the trough."
# Automated validation: read formation drones' x at the sway peak and trough and
# confirm they move together by ~±20 px. See validation/swarm/sways.mjs.
validation = { script = "validation/swarm/sways.mjs", outputs = [
  { id = "sway", name = "The formation swaying side to side", kind = "video" },
] }
[[review.categories.items]]
id = "dive-bends-fires"
title = "A diver bends toward the player and fires"
description = "A diving drone leaves the formation, bends its path toward the player's x as it descends, and fires while diving."
# Automated validation: force a real dive and confirm the drone's x trends toward the
# ship and an enemy bullet spawns during the dive. See validation/swarm/dive-bends-fires.mjs.
validation = { script = "validation/swarm/dive-bends-fires.mjs", outputs = [
  { id = "dive", name = "A diver bending toward the player and firing", kind = "video" },
] }
[[review.categories.items]]
id = "dive-returns"
title = "A diver returns to its slot"
description = "A drone that survives its dive returns to its formation slot (phase returning, then formation back at its slot) rather than vanishing."
# Automated validation: force a real dive and confirm the drone returns to its slot.
# See validation/swarm/dive-returns.mjs.
validation = { script = "validation/swarm/dive-returns.mjs", outputs = [
  { id = "return", name = "A diver looping back to its slot", kind = "video" },
] }
[[review.categories.items]]
id = "only-divers-fire"
title = "Only divers fire"
description = "Drones in formation never fire; only diving drones do, which keeps the threat readable."
# Automated validation: hold an assembled formation with no dive and confirm zero
# enemy bullets, then force a dive and confirm bullets appear. See
# validation/swarm/only-divers-fire.mjs.
validation = { script = "validation/swarm/only-divers-fire.mjs", outputs = [
  { id = "divers", name = "Formation silent until a dive fires", kind = "video" },
] }

# --- The three drones ---------------------------------------------------------
# Each drone tests polarity differently; each behavior is its own point.
[[review.categories]]
id = "drones"
title = "The three drones"
[[review.categories.items]]
id = "shard-fixed-band"
title = "The Shard holds a fixed band"
description = "A Shard keeps a single fixed band for its whole life; it never changes."
# Automated validation: spawn a Shard and step across time, confirming its band never
# changes. See validation/drones/shard-fixed-band.mjs.
validation = { script = "validation/drones/shard-fixed-band.mjs", outputs = [
  { id = "shard", name = "A Shard holding its band over time", kind = "video" },
] }
[[review.categories.items]]
id = "flux-oscillates"
title = "The Flux oscillates its band"
description = "A Flux alternates its band on a telegraphed rhythm: a held window on one band, a brief shimmer settled on neither, then the other band."
# Automated validation: spawn a Flux at a known phase and step it through a cycle,
# confirming held-cyan → shimmer → held-magenta. See validation/drones/flux-oscillates.mjs.
validation = { script = "validation/drones/flux-oscillates.mjs", outputs = [
  { id = "flux", name = "A Flux cycling through its bands", kind = "video" },
] }
[[review.categories.items]]
id = "flux-shimmer-immune"
title = "A Flux cannot be killed mid-shimmer"
description = "During its shimmer a Flux has no settled band, so no shot destroys it; a matching shot during a held window does."
# Automated validation: fire a matching shot during a shimmer (no kill) and during a
# held window (kill). See validation/drones/flux-shimmer-immune.mjs.
validation = { script = "validation/drones/flux-shimmer-immune.mjs", outputs = [
  { id = "shimmer", name = "A shimmering Flux surviving a matching shot", kind = "video" },
] }
[[review.categories.items]]
id = "prism-shell-then-core"
title = "The Prism breaks shell then core"
description = "A Prism is broken in two bands in order: the shell falls only to the shell's band (exposing the core), then the core falls only to the opposite band."
# Automated validation: a mismatch leaves the shell; the shell's band breaks it; the
# core's band then destroys the drone. See validation/drones/prism-shell-then-core.mjs.
validation = { script = "validation/drones/prism-shell-then-core.mjs", outputs = [
  { id = "prism", name = "Breaking a Prism shell then core", kind = "video" },
] }
[[review.categories.items]]
id = "prism-escort"
title = "The Prism enters with two Shards"
description = "A Prism flies in escorted by two Shards, one cyan and one magenta, entering alongside it."
# Automated validation: start a real stage and confirm the Prism enters with two
# opposite-band Shards. See validation/drones/prism-escort.mjs.
validation = { script = "validation/drones/prism-escort.mjs", outputs = [
  { id = "escort", name = "The Prism's two-Shard escort flying in", kind = "video" },
] }
[[review.categories.items]]
id = "prism-two-band-burst"
title = "A diving Prism fires a two-band burst"
description = "A diving Prism fires a two-band burst — one cyan and one magenta bullet — so it threatens you whichever band you shield as."
# Automated validation: force a Prism dive and confirm its fire includes both a cyan
