[[review_item]]
id = "flux-oscillates"
title = "The Flux"
text = "The Flux alternates its band on a telegraphed rhythm: a held window, then a brief shimmer (settled on neither band), then the other band. It can be destroyed only by a matching shot during a held window — never mid-shimmer."
weight = 1
domain = "swarm"
sub_items = [
  { id = "oscillates", title = "Alternates band: held window, brief shimmer, then the other band" },
  { id = "shimmer-immune", title = "Killable only during a held window, never mid-shimmer" },
]

[[review_item]]
id = "prism-sequence"
