# The default variant: the standard Sortie defense only. Listed first in the case
# manifest's `variants`, so it is the default. Every path resolves against the
# version folder, exactly like the main manifest.
slug = "base"
name = "Base"
description = "The standard Sortie defense only."

# This variant's mode spec, seeded to the stable path `specs/mode.md` that every
# variant seeds its mode spec to (so the common specs can reference it by name).
# It defines only the standard Sortie mode.
spec = [{ source = "specs/mode-base.md", dest = "specs/mode.md" }]

# The main menu lists a different mode per variant, so each variant supplies its
# own `title` reference, captured from this variant's reference-impl build and
# served as-is; `gameplay` and `game-over` are common.
reference = [{ view = "title", media = "reference/screenshots/base/title.png" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's playable build. A bare directory path (resolved against
# the version folder) holding a buildable web project, built with this case's
# `[build]` install/build commands and deployed like a published run build via
# `tcab publish-reference`, then shown on the case's "Reference" tab. It is
# **never seeded into a run**.
reference_implementation = "reference-impl/base"

# ADDITIVE review category for the base Sortie mode. The common `mismatch-no-destroy`
# item only asserts that a mismatched shot never destroys the drone and defers what
# ELSE it does to the mode; Sortie's rule is that a mismatch is simply wasted, so
# this category's one point (mirroring Overload's `mode` category) checks that
# base-mode behavior. The `format` is inherited from the case manifest
# (`[review] format = 2`); a variant only adds `[[review.categories]]`. The point is
# rated within the case's common `polarity` domain (Sortie changes only the band
# system), which the reviewer scores separately from this checklist.
[[review.categories]]
id = "mode"
title = "Sortie"
[[review.categories.items]]
id = "mismatch-wasted"
title = "A mismatch is wasted"
description = "In Sortie a mismatched (wrong-band) shot is simply wasted: the bullet is consumed, and the drone is unchanged — still alive, still in formation, neither redirected nor otherwise altered. You cannot harm a drone of the band you are not tuned to."
# Automated validation: fire a wrong-band shot into a formation Shard and confirm it
# is left untouched. See validation/mode/mismatch-wasted.mjs.
validation = { script = "validation/mode/mismatch-wasted.mjs", outputs = [
  { id = "wasted", name = "A wrong-band shot wasted on a drone", kind = "video" },
] }
