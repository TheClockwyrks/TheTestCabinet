# --- Maze movement ------------------------------------------------------------
# How bodies travel the tile grid. Every point but the wrap tunnel is measured on
# a posed corridor whose geometry the suite chose, so the run is long enough to
# time and the wall is exactly where the check needs it. The wrap tunnel is read
# off the build's own board, because the pierced row is the build's to place.
[[review.categories]]
id = "maze-movement"
title = "Maze movement"
[[review.categories.items]]
id = "constant-speed"
title = "The forager travels at a constant speed"
description = "Running a straight corridor, the forager covers ground at FORAGER_SPEED (128 logical units per second) within 2 percent, measured over a stretch of at least four tiles, with no ramp at the start and no drift over the run, and the same figure on a corridor running down as on one running right."
domains = ["navigation"]
failure_cap = "scuffed"
# ONE RULE, ONE POINT, deliberately. specs/movement.md fixes FORAGER_SPEED as
# constant "wherever it is in the maze", so a corridor running right and one
# running down are two readings of the same rule rather than two rules, and a
# build whose figure is wrong is wrong on both axes at once. Splitting them would
# record one fault twice and make the grade say "the vertical axis is wrong"
# where what is wrong is the speed.
# Automated validation: pose a long straight corridor, hold the direction along
# it, and measure the distance covered against the simulated time it took; then
# the same reading on a corridor running down. See
# validation/<engine>/maze-movement/constant-speed.test.ts.
validation = { script = "maze-movement/constant-speed.test.ts", outputs = [
  { id = "run", name = "The forager running a straight corridor", kind = "replay" },
] }
