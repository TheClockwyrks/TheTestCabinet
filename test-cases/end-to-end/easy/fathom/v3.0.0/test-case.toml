# --- Diagnostics --------------------------------------------------------------
# The debug overlay specs/instrumentation.md requires, framed there as the
# developer affordance it is. It is two separate deliverables and so two points:
# what the game REGISTERS with it, which is Fathom's part under every engine, and
# whether the overlay itself starts hidden and toggles, which is Fathom's part
# under `none` alone and the engine's under the other two — so the second point
# names `none` and leaves the checklist of an engine run rather than grading the
# engine's work as the build's.
#
# Both cap at `great`: an overlay is a developer's window onto a running game and
# a player never opens it, so a build that shipped none plays exactly as well as
# one that did.
[[review.categories]]
id = "diagnostics"
title = "Diagnostics"
[[review.categories.items]]
id = "sources-registered"
title = "The game registers the diagnostics it owes"
description = "The diagnostic sources specs/instrumentation.md's Diagnostics section names are registered and read the running game: the screen, the depth, the score, the lives, the plankton remaining, the forager's tile and facing, and for each predator its kind, state and tile, each reporting the figure the snapshot reports for it at the same moment, and reading one changes nothing about the game."
domains = ["presentation"]
failure_cap = "great"
# Automated validation: pose a live dive carrying a hunter of each kind, each on
# a tile of its own, at figures well off their opening values, read what the
# sources report, and hold each against the snapshot taken at the same moment;
# then hold the whole snapshot against itself across the reads. Under an engine
# the registry is read off the engine and only what a source REPORTS is matched,
# never the name it was registered under; under `none` the frame is read with the
# overlay shut and again with it open, and only the runs the second frame added
# are the overlay's, so a build's own HUD does not answer for it.
#
# THE ITEM NAMES FEWER FACTS THAN THE SPECIFICATION DOES, and deliberately. The
# brightness G, the light radius V, the two cooldowns, a predator's speed and
# whether its alert is firing are continuous or derived figures a source renders
# however it likes — `G 0.42`, `G 42%` and `G .42` all report the same brightness
# honestly — so matching them would grade the formatting rather than the
# registry. The facts above are the ones whose reading is exact whatever the
# formatting, and the description says so rather than promising a verdict on the
# rest. See validation/<engine>/diagnostics/sources-registered.test.ts.
validation = { script = "diagnostics/sources-registered.test.ts", outputs = [
  { id = "sources", name = "The diagnostics over a live dive", kind = "image" },
] }
[[review.categories.items]]
id = "overlay-toggle"
title = "The overlay starts hidden and toggles on the backtick"
description = "The overlay draws nothing until it is asked for: on a live dive nothing of it is on the canvas, a Backquote press draws it over the running game, a second Backquote press takes it away again, and the game underneath is unchanged across both — no position, cooldown or score moves because the overlay was opened."
domains = ["presentation"]
failure_cap = "great"
# Automated validation: sample the canvas over a live dive, press Backquote and
# sample again, press it once more and sample a third time, holding the snapshot
# against itself throughout. Scoped to `none`, where the overlay and its toggle
# are the build's to write; under the two engines the engine draws and toggles
# it, so the point would grade the engine rather than the build. See
# validation/none/diagnostics/overlay-toggle.test.ts.
validation = { script = "diagnostics/overlay-toggle.test.ts", engines = [
  "none",
], outputs = [
  { id = "overlay", name = "The diagnostics overlay over a live dive", kind = "image" },
] }

# --- Presentation -------------------------------------------------------------
# The two things about the look this specification actually fixes: that the whole
# stage is on screen at any window size, and that the seeded art is what the game
# draws its creatures and tiles from. The palette, the glow, the HUD layout and
# every other aspect of the look are the build's, and how good they are is the
# aesthetic rating's, not scored here.
[[review.categories]]
id = "presentation"
title = "Presentation"
[[review.categories.items]]
id = "window-fit"
title = "The stage is fitted and centered"
description = "Over surfaces wider than the stage, taller than it, and at a raised device pixel ratio, the whole STAGE_W x STAGE_H (1280 x 720) stage is inside the surface at its own aspect ratio, centered with even letterboxing, and the bars carry the stage's background color within an RGB distance of 25 of 441."
domains = ["presentation"]
failure_cap = "passable"
# Automated validation: stand the game up over several surface sizes and pixel
# ratios, measure where the stage lands and what the bars are painted with, and on
# a letterboxed window read the drawn light's own midpoint off the canvas against
# where the specified fit puts the forager. See
# validation/<engine>/presentation/window-fit.test.ts.
validation = { script = "presentation/window-fit.test.ts", outputs = [
  { id = "fit", name = "The stage fitted in an off-aspect window", kind = "image" },
] }
[[review.categories.items]]
id = "provided-art"
title = "The seeded sheets are what the game draws from"
description = "Over a live dive drawing the forager, a maze of rock and corridor, all three predators, a drifter and a flare, every one of the seven seeded sheets is loaded and drawn: each element is drawn from an image source that is a frame of its own sheet, at the frame sizes specs/assets.md gives, rather than from shapes drawn in code or from art of the build's own."
domains = ["presentation"]
failure_cap = "scuffed"
# Automated validation: pose a board carrying every element, arm the draw recorder
# over one frame, and hold the image sources drawn against the seeded frames. See
# validation/<engine>/presentation/provided-art.test.ts.
validation = { script = "presentation/provided-art.test.ts", outputs = [
  { id = "art", name = "The maze and its creatures drawn from the seeded sheets", kind = "image" },
] }

# --- Showcase (read off the produced tree, not off the running game) ----------
# The showcase is the store-page presentation of the finished game: a
# player-facing description and an ordered carousel of captured media, shipped in
# a `showcase/` directory at the root of the produced repository, which
# `specs/showcase.md` defines. It is worth THREE points rather than one, because
# it is a deliverable of its own — a whole file of the specification, and the one
# piece of a run a person meets before they meet the game — where every other
# point on this checklist is one behavior of the game itself. It is the only
# weight declared anywhere in this file; every other point takes the default one.
#
# Its cap is `great` all the same: a build that shipped no showcase dives exactly
# as well as one that did, so the miss costs the presentation and leaves the
# standard flow of gameplay untouched. The weight and the cap say different
# things on purpose — how much of the score the point carries, and how far a
# failure may drag the ratings down.
#
# ONE point, and it grades EXISTENCE alone. Whether the description reads like
# something a player would want to play, whether the carousel opens on the
# strongest view of a dive, and whether the media is worth looking at is a
# reviewer's judgement and belongs to the AESTHETIC half of the domains rather
# than to an assertion. The validator's whole verdict is that the two files are
# there and that the carousel points at a file that is there with them: not a
# dimension, not a byte of a picture, not a word of the prose.
#
# The script drives nothing. It reads the produced tree with `node:fs`, so one
# suite stands unchanged in all three engine directories and the point means the
# same thing whichever engine the run selected. What it hands back as evidence is
# a `.png` copied out of the build's own showcase, so a reviewer sees the picture
# the build chose to present its game with beside the verdict.
[[review.categories]]
id = "showcase"
title = "Showcase"
[[review.categories.items]]
id = "present"
title = "The game ships its showcase"
description = "showcase/showcase.md and showcase/showcase.toml are present at the root of the produced repository, and at least one file the carousel names is present in showcase/."
weight = 3
domains = ["presentation"]
failure_cap = "great"
# Automated validation: read the produced tree, confirm the description and the
# carousel are both there, and confirm the carousel names a file present beside
# them; the still handed back is a `.png` copied out of the showcase itself.
# Nothing about the media is checked beyond its being there. See
# validation/<engine>/showcase/exists.test.ts.
validation = { script = "showcase/exists.test.ts", outputs = [
  { id = "showcase", name = "A screenshot from the build's showcase", kind = "image" },
] }
