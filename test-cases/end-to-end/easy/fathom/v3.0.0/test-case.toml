title = "Moving the pointer onto an item selects it"
description = "On the title with menuIndex 0, moving the pointer onto the region menuItemRect reports for HOW TO PLAY sets menuIndex to 1, with screen still title."
domains = ["progression"]
failure_cap = "scuffed"
# Automated validation: read the second title item's region off the build, move
# the real pointer to its middle, and read menuIndex and the screen. See
