# --- Pointer ------------------------------------------------------------------
# specs/ui.md drives every menu with a mouse as well as with the keyboard, over
# item regions the BUILD lays out and reports through `menuItemRect`. The case
# fixes no menu geometry, so each point below asks the build where it put the
# item and drives the real pointer at the middle of that region: any layout
# passes, and a build that reports a region it does not answer on fails. The
# first three points are three of the behaviors specs/ui.md gives the pointer — a
# move selects, a press and its release inside one item confirms that item, and
# two edges in different items confirm nothing — and the fourth is the way back
# off the screen the second of them opens. The keyboard's own edges are
# `navigation`'s points, not these.
#
# WHICH MENU EACH POINT IS GRADED ON, and why. The first three are read on the
# title menu alone, where every entry confirms to a screen a check reads straight
# off `screen`, and the pause and the game-over menus are not read again. The
# reason is that specs/ui.md gives the pointer rules to "Each menu item" as one
# rule over one code path: a build reads a gesture against the region its own
# `menuItemRect` reports, and `instrumentation.menu-rect` is the point that reads
# all three menus' geometry, expressly because a build may report the pause menu's
# from the title's table. What is left ungraded is a build that wired its gesture
# handling per screen and wired only one of them, which is a shape no rule of this
# specification suggests.
#
# WHICH HALF OF THE BOUNDARY SENTENCE IS GRADED. specs/ui.md says two edges in
# different regions AND an edge outside every region confirm no item.
# `slide-off-cancels` decides the first. The second is not graded on its own: a
# release off the menu entirely is the same comparison the first makes — the
# released item against the pressed one — with `null` on one side, so a build that
# fails it fails `slide-off-cancels` too unless it bounds-checks the release
# alone, and that build still confirms nothing a player did not aim at.
#
# The cap is `scuffed` throughout, on the same reading of this case's rubric that
# puts the alternate key bindings there: a menu a mouse cannot work is a whole
# input the player has, unusable, while the keyboard still opens every screen.
[[review.categories]]
