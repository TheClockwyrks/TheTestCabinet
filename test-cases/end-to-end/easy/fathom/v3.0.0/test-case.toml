# --- Navigation ---------------------------------------------------------------
# The edges between the screens: which input on which screen leads where. The
# `states` category asks what a screen IS; this one asks how a player gets from
# one to the next, which is the other half of specs/ui.md's transition table and
# the half a build most often leaves half-wired. Each point drives ONE input on
# ONE screen and reads the screen it reached, with the selection posed by
# `setMenuIndex` rather than walked to with the arrow keys, so a broken `down`
