# --- Audio --------------------------------------------------------------------
# Seven cues, one per event, each its own point so a build fails exactly the cue
# it omits. What a cue SOUNDS like is the build's; the check reads the cue bus for
# the name the specification fixes, played on the tick its event happens and at
# most once on that tick. The mute toggle is `controls.mute`.
#
# HOW MUCH OF THAT SENTENCE EACH ENGINE CAN DECIDE, recorded here once rather
# than hedged in seven descriptions. specs/progression.md fixes two things about
# every cue: that it is played ON the tick its event happens, and that it is
# played AT MOST ONCE on that tick. Under `simple-2d` and `structured-2d` the
# game asks the engine's cue bus for a cue BY NAME and the bus announces the
# play, so a suite reads both halves exactly. Under `none` the build writes the
# whole audio layer itself and specs/progression.md fixes the seven names inside
# the build's own code without saying how a build makes a sound, so what is
# observable in a browser is that a sound was emitted and on which tick — not
# which cue it was, and not how many plays one blip was made of, since a cue may
# honestly be a tone and a noise burst together. The seven points below therefore
# decide the ON-THE-TICK half on every engine and the AT-MOST-ONCE half under the
# two engines alone; each `none` scenario stages exactly one event with
# everything else held still, so the reading stays honest rather than lenient.
# `one-per-tick`, whose whole claim is the second half, names its two engines
# and leaves the checklist of a `none` run rather than pretending to decide
# there.
[[review.categories]]
id = "audio"
title = "Audio"
[[review.categories.items]]
