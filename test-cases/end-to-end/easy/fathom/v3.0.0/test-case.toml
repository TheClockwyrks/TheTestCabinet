# --- The HUD ------------------------------------------------------------------
# specs/ui.md fixes six things as present and readable whenever a maze is on
# screen, in two strips that leave the maze itself clear: the top strip, `y` in
# `[0, 80]`, and the bottom strip, `y` in `[656, 720]`. Each of the six is its
# own point, so a build that drew the score and forgot the gauges fails exactly
# the gauges.
#
# WHAT IS AND IS NOT ASSERTED. That the element is drawn, that it is drawn in the
# strip specs/ui.md gives it, that it reports the figure the snapshot reports at
# the same moment, and that it is legible where it stands — its own pixels more
# than 50 of 441 in RGB distance from the strip behind them, sampled well inside
# a stroke. Where inside its strip it sits, what color it is, what type it is set
# in and how it is styled are the build's, and specs/ui.md says so in as many
# words, so nothing here reads a position or a hue. How good the HUD LOOKS is the
# aesthetic rating's.
#
# The sixth element, the dive label, is the one thing on screen the two dives
# disagree about, so it lives in `variants/base.toml` and `variants/kindle.toml`
