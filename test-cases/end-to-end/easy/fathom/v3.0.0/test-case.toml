# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity, recorded in every run.
slug = "fathom"

# Human-readable display name for this test case.
name = "Fathom"

# Relative difficulty of this case, surfaced on the site. Fathom is one
# self-contained real-time loop over a tile grid — a fog-of-war visibility
# system, tile-locked movement, three predator behaviors, and a handful of
# screens — with no subsystem big enough to need splitting out behind an
# interface, so easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "maze", "stealth"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A bioluminescent forager grazing a pitch-dark maze, where the maze is hidden \
until your light or a sonar pulse reveals it, and three predators each hunt by a \
different signal you give off — your light, your sound, or its own flare."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version. The site aggregates every
# version's entry, newest first, into the case's changelog. Like `description`,
# it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs, the selected variant, and the selected engine) and
# handed to the model as the build instruction. It injects absolute in-container
# paths via template variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. This is the per-case default; a run can override it (for example
# `tcab run --max-runtime`). It exists so a stuck or runaway session cannot run
# unbounded. Fathom is a large build for an easy case — a fog-of-war visibility
# system, a maze generator, three predator minds, seven screens — so it gets a
# full three hours, comfortably more than a healthy build needs while still
# catching a session that never terminates.
max_runtime_hours = 3

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine — and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# Asset files or directories seeded alongside the specs, each kept at its path
# relative to this version folder when seeded (so `assets/glimmerfin/` lands at
# `assets/glimmerfin/` in the run). Fathom ships a fixed set of pre-drawn art, so
# every build renders the same creatures, tiles, and effects and differs only in
# the code around them. Each entry is a sprite-sheet directory of per-frame PNGs;
# the build renders each element from its sheet, and the frame layouts are the
# contract in `specs/assets.md`. The maze layout, the light, the plankton, the
# wavefronts, the ink, and the whole HUD are still drawn in code.
#
# `assets` is a root key, so it must precede the first table header.
assets = [
  "assets/glimmerfin",   # the player forager (sprite)
  "assets/lanternjaw",   # the Lanternjaw predator, both forms (sprite)
  "assets/gloamfin",     # the Gloamfin predator (sprite)
  "assets/flarefish",    # the Flarefish predator (sprite)
  "assets/drifter",      # the bonus drifter (sprite)
  "assets/flare-bloom",  # the Flarefish's radial flare (effect)
  "assets/trench-walls", # the maze tileset: wall autotile, floor, fog, den gate
]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Both variants are the same dive, the same maze, and
# the same three predators; they differ only in the SENSING model, which is
# Fathom's signature system. That difference is carried by the specs that branch
# on the selected variant — `specs/sensing.md.hbs` (the outer vision circle),
# `specs/ui.md.hbs` (the dive label on the HUD), `specs/state.md.hbs` (the
# `windowRadius` a snapshot reports) and `specs/instrumentation.md.hbs` (what
# `setBrightness` recomputes) — rendered before they land, so each variant's
# seeded spec set reads as one self-contained game.
#   - base   — Standard: a remembered fog of war, line-of-sight passive light,
#              and a corridor-flooding sonar pulse. The reference dive.
#   - kindle — the same fog of war, plus an outer vision circle the forager
#              carries, which grows as it eats. The circle reveals nothing: it
#              masks how much of the already-revealed maze is drawn, and beyond
#              it even explored ground is black.
# Both are rated on the case's common domains; neither adds a domain of its own.
# This list is a root key, so it must precede the first table header.
variants = [
  "variants/base.toml",
  "variants/kindle.toml",
]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics; one of them also owns rendering, collision detection, and
# the gameplay framework the game is written inside. It is a *run dimension*,
# chosen per run alongside the model, the harness, and the variant, and recorded
# on the run; it is not a property of the game.
#
# Fathom supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop, the canvas fit, the input, the image
#                     loading, the audio, the overlay and the `window.__fathom`
#                     surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around it (`src/constants.ts`, `src/main.ts`, and the
#                     `src/game.ts` the build writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes its
#                     game module: the one level the dive runs in, the game mode
#                     that holds the screens and the rules, the actors and
#                     components that draw the maze and its creatures, the
#                     controller the forager is driven through, and the debug
#                     surface its instance's `initialize` returns.
# Neither engine supplies a tile map, pathfinding, sprite-sheet animation, a
# fog-of-war mask, or a random generator, so the parts of Fathom that make it
# Fathom are the build's under every engine. The game they describe is the same
# one, so the review items are the same for every engine and a score recorded
# under one is comparable with a score recorded under another; the specs and the
# validators branch where the deliverable differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to *this game* under it —
# which surfaces the build still supplies, Fathom's touch layout, and Fathom's cue
# names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, and an `index.html`
# holding the canvas. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     input, image loading, audio, diagnostics overlay and
#                     `window.__fathom` surface, and every figure the
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`: the state, the debug surface its `initialize`
#                     returns beside that state, the three functions, and the
#                     `BACKGROUND` color `src/main.ts` hands the engine.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules: `src/constants.ts`
#                     (every figure this specification fixes plus the level name,
#                     the action bindings and the cue names, which a validator
#                     imports; the look is NOT among them) and `src/main.ts` (the
#                     browser entry). The build writes `src/game.ts`: the
#                     `GameDefinition` the engine drives — its one level, the game
#                     mode holding the screens and the rules, its actors and the
#                     controller the forager is driven through — the debug surface
#                     its instance's `initialize` returns, and the `BACKGROUND`
#                     color `src/main.ts` hands the engine.
#
# The table below is the BASE variant's. Kindle replaces it wholesale in
# `variants/kindle.toml`, because its seeded `src/constants.ts` carries
# `KINDLE_VISION_MIN` and `KINDLE_VISION_GAIN` and its dive label differs. The
# engineless project holds no game code for a variant to differ in — only the
# configuration the build is written against — so every variant shares it, and
# what Kindle changes about the game is carried by the specs, which are rendered
# per variant before they land. The seeded files land at the run root
# (`workspaces/none/package.json` seeds to `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/base/simple-2d"
"structured-2d" = "workspaces/base/structured-2d"

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. Both commands are required — there are no defaults, so every case states
# exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`),
# so what is checked here is the code the model wrote against configuration the
# case fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken` and scores it zero,
# because code that does not compile is not reviewable. The other three are
# recorded and gate nothing — `test` additionally records the count and coverage
# the build's own suite reports, which is how a build that ships tests is told
# apart from one that ships none. Each is spelled `npx` rather than
# `npm run <script>` so the check is the case's own statement of what is run and
# does not depend on the model leaving the seeded scripts intact.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. The handle is required as soon as any review item declares a `validation`
# script, which they all do below. It names the ENGINELESS contract: an engineless
# build writes the surface itself and installs it on `window.__fathom`, so the
# handle is what a person opening the console of such a build finds. An engine run
# has no global at all — the build writes the surface, its `initialize` returns
# it, and a validator reads it back off `engine.debug`. What shape the surface's
# operations take is the engine's contract. Under `simple-2d` the engine holds the
# state by value and hands every reader a read-only view, so the surface is
# written in the shape of `update`: a pose takes the current state and returns the
# next, which a validator applies through `engine.apply`, and a reading takes the
# state and returns what it read, which a validator calls with `engine.state`.
# Under `structured-2d` the state lives in the framework objects the engine owns,
# so the surface's operations are methods on the live game: a pose takes only its
# own arguments and arranges the open world through the same systems play uses,
# and a reading takes nothing and returns plain data. The seeded specification
# documents the surface independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded.
#
# There is deliberately no `tick_hz`. It existed to tell the validation runtime
# what one stepped tick was worth, because a driver stepped the build's own fixed
# timestep through the debug API at a rate the manifest had to state. Nothing
# steps that way now: the engine mandates no timestep at all — it hands the game
# the real elapsed time of each frame — and a validator supplies its own clock
# object and calls `engine.advance(n)`, so the size of a step is stated in the
# validator that takes it. Fathom's own fixed step, `TICK_HZ` (`120`), is a rule
# of the GAME stated in `specs/movement.md` and asserted by the checks below; it
# is not a property of the harness that drives it.
[instrumentation]
handle = "__fathom"

# The specs: every one is seeded for EVERY variant and every engine of this case,
# at the `dest` path within the run workspace. The specification is decomposed by
# concern, and there is a single list — what a variant changes is not a separate
# per-variant file but a branch inside a common spec, rendered for the selected
# variant before it lands. Every seeded set thus asserts exactly one game, with no
# cross-variant and no cross-engine language, because the branching resolves at
# seed time and the model never sees the alternative.
#
# There is no proof spec: the media a reviewer looks at is captured by this case's
# own validators from scenarios the case controls. The showcase spec below does
# ask the build for media, but as the game's own store-page presentation rather
# than as evidence any point is judged on.
#
# A spec's `dest` defaults to its `source` with a trailing `.hbs` stripped, so an
# `.md.hbs` source seeds to the same `.md` path and a plain `.md` source seeds
# verbatim.

# The stage, the tile grid, the project the build works in, the screens, and what
# a player must read at a glance. Branches on engine (the runtime and the module
# contract differ); it seeds to `specs/overview.md`.
[[spec]]
source = "specs/overview.md.hbs"

# The maze layout rules, the den, and the wrap tunnel.
[[spec]]
source = "specs/maze.md"

# The fixed-step core, how the forager and the predators travel the maze, and the
# controls. Branches on engine (how input reaches the game differs); it seeds to
# `specs/movement.md`.
[[spec]]
source = "specs/movement.md.hbs"

# The fog of war, the forager's light and brightness, the sonar pulse, and the
# ink. Branches on variant (the Kindle dive adds the outer vision circle); it
# seeds to `specs/sensing.md`.
[[spec]]
source = "specs/sensing.md.hbs"

# The plankton, the bonus drifters, and contact with a predator.
[[spec]]
source = "specs/gameplay.md"

# The predators: the common file, then one file per kind, each seeded at its path
# under `specs/predators/`.
[[spec]]
source = "specs/predators.md"

[[spec]]
source = "specs/predators/lanternjaw.md"

[[spec]]
source = "specs/predators/gloamfin.md"

[[spec]]
source = "specs/predators/flarefish.md"

# Scoring, lives, depth, the descent, and the audio cues. Branches on engine (the
# cue bus differs); it seeds to `specs/progression.md`.
[[spec]]
source = "specs/progression.md.hbs"

# The screens, the menus, the transitions, and the HUD. Branches on variant (the
# HUD's dive label differs); it seeds to `specs/ui.md`.
[[spec]]
source = "specs/ui.md.hbs"

# The art-asset contract: which seeded sheets the build renders each element
# from, their frame layouts, and what is left to draw in code. Branches on engine
# (asset loading differs); it seeds to `specs/assets.md`.
[[spec]]
source = "specs/assets.md.hbs"

# The observable state and the snapshot that reports it. Under an engine this is
# the `FathomState` contract the debug surface poses and reads and the validators
# read back, stated by the case rather than by the seeded `src/game.ts`, which
# holds the stub alone. Under `none` the build owns the shape and the debug
# surface is the only contract over it. Branches on engine (where the state
# lives) and on variant (the Kindle dive reports its vision-circle radius); it
# seeds to `specs/state.md`.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build exposes, over a deterministic,
# steppable core, framed as an ordinary developer affordance of the game.
# Branches on engine (how the surface is reached and its calling convention) and
# on variant (what `setBrightness` recomputes); it seeds to
# `specs/instrumentation.md`.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. Branches on engine (how motion is
# captured); it seeds to `specs/showcase.md`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`: the specification fixes
# behavior, and the appearance it does fix is a legibility floor decided from the
# pixels rather than a layout to reproduce, so there is no visual target to seed
# or to score against. Every piece of evidence a reviewer sees comes from this
# case's validators, which pose each scenario against the game the build wrote and
# capture what it renders. The automated load check still runs.

# Scoring domains. A run is rated on each independently, and the run's overall
# rating is the WORST across them — a flawless maze cannot mask predators that do
# not hunt. Every case must declare at least one. This case is on the engine
# format, so it is validator-rated: each domain's FUNCTIONAL rating is decided by
# the validators behind the checklist below (every point names the domains its
# failure lowers and how far — see `domains` / `failure_cap` there), and the
# reviewer's judgement lives in the separate AESTHETIC rating of each domain.
#
# The four gameplay domains are the four things a dive can independently be bad
# at, and a failure is attributable to exactly the ones it touches: a maze that
# generates rooms is a `navigation` fault and nothing else; a sonar pulse that
# arrives all at once is a `sensing` fault; a Gloamfin that never corners is a
# `predators` fault; a plankton that scores nothing is a `progression` fault. The
# fifth, `presentation`, holds the two points about the stage and the seeded art,
# and is the aesthetic home of the look this case leaves to the build.
[[domain]]
id = "navigation"
name = "Navigation"
description = "The maze and moving through it: how a layout is laid out, the den and the wrap tunnel, and how the forager travels the corridors under the controls."

[[domain]]
id = "sensing"
name = "Sensing"
description = "Reading the dark: the fog of war and what it remembers, the light the forager carries and the brightness that widens it, the corridor-flooding sonar pulse, and the ink."

[[domain]]
id = "predators"
name = "Predators"
description = "The hunt: the three hunters, the sense each one tracks you by, its tell and its counter, the den and its staggered release, and what contact costs."

[[domain]]
id = "progression"
name = "Progression"
description = "The run around the dive: the score, the lives, the descent to deeper mazes, the seven screens and the menus between them, and the audio cues."

[[domain]]
id = "presentation"
name = "Presentation"
description = "The look of the trench, which this case leaves to the build apart from the seeded art it renders from: the stage fitted in its window, the palette and glow, the HUD, and how a screen reads."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare
# name grouping the points a reviewer grades — and each
# `[[review.categories.items]]` under it is one graded review item, worth one
# point (the default weight), so a category is worth the number of items it holds
# (no fractional scoring). A category carries no prose of its own; each item
# states in `description` the claim its validator checks. The recorded verdict id
# is the composite `<categoryId>.<itemId>`. The checklist is reporter-side
# material — never seeded into a run, so the model never sees it; each item
# restates a rule the seeded specification already states, in the spec's own
# vocabulary and naming the spec's own constants, and every threshold a validator
# asserts is derived from a figure or rule in the specs plus a numeric tolerance
# stated in the item. The points where the two dives genuinely disagree — what is
# drawn of the explored map, and how far the amber lights carry — live in
# `variants/base.toml` and `variants/kindle.toml`; everything else is common and
# stays here.
#
# EVERY point on this checklist carries a validation script, and every point is
# one observable behavior, so a build fails exactly the rule it breaks (the
# Lanternjaw's light sense and the Flarefish's are two points, not one). Each
# script is a vitest suite under `validation/<engine>/<category>/`, named for the
# point it decides.
# The `<engine>` level is the ENGINE the suite is written against — a validator
# speaks one engine's vocabulary, so this case, which supports three, ships one
# directory per engine: `validation/none/` drives the build in Chromium through
# `window.__fathom`, and `validation/simple-2d/` and `validation/structured-2d/`
# each run in process against their vendored engine. The three are the same
# scenarios; only how they reach the build differs. The directory for the run's
# engine is what gets staged into the built workspace at `validation/`, so a
# script path here is written relative to that directory.
#
# A `simple-2d` suite imports the runtime and the build's own `src/game.ts`,
# constructs it over a headless canvas with a clock it scripts, poses the scenario
# by applying the poses of the surface `engine.debug` returns through
# `engine.apply`, and steps it with `advance`. It reads behavior back from
# `engine.state` (or the surface's `snapshot` over it), audio from the runtime's
# `cue:played` event, and drawing from the canvas — either the pixels or a
# recording proxy over the 2D context. A `structured-2d` suite does the same
# through the operations of the surface the build's instance returned from
# `initialize`, which arrange the live world through the same systems play uses.
#
# HOW THE SCENARIOS ARE POSED. Almost every point here is about a piece of
# geometry — a blind corner, a rock spine, a corridor long enough to measure a
# speed along — so a suite POSES the board it is about through `setMaze` rather
# than hunting for that shape in whatever maze the build generated. The
# exceptions are the `maze` points and the wrap-tunnel point, where finding the
# shape in the build's own board IS the check. A posed fixture is exempt from
# `specs/maze.md`'s validity rules, and posing one returns every predator to the
# den with the release schedule suspended, so a posed scenario does not share its
# corridor with a hunter that wandered in. Every fixture carries a sealed larder
# of plankton the forager cannot reach, so no amount of grazing clears the maze
# mid-measurement.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. A `replay` output is a draw-command recording: the suite arms the
# recorder around the section the point is about — the crossing, the acquisition,
# the flare cycle — and never around the arrangement that got there. An `image`
# output is a single captured frame. Both are evidence beside the verdict rather
# than any part of it: a point passes or fails on its assertions alone.
#
# Nothing on this checklist asks a reviewer to judge how a screen looks.
# Appearance is rated through the domains above; the rendering points here assert
# only what the specification fixes about what is drawn — that the fog is dark,
# that the amber lights are warm and alike, that a marked body appears, that the
# stage is fitted — and capture the frame as evidence.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers, and a point that
# straddles two names both — ink blinding a Lanternjaw is as much a sensing rule
# as a predator one. An instrumentation point every suite in every domain drives
# through lowers all five; the menu reading, which only the menu points rest on,
# lowers the two it serves. `failure_cap` is the highest functional rating
# those domains may reach while the point fails; each domain gets the LOWEST cap
# among its failing points, and a domain with no failing point is flawless. The
# caps are graded by how much of the game a failure takes away: `broken` where the
# game cannot be played as intended (no debug surface, a forager that cannot be
# moved, a maze whose corridors do not join up, a plankton that never scores, a
# catch that costs nothing); `scuffed` where a rule the game is built on is
# noticeably wrong or an optional path is unusable (a sense, a speed, a flare, the
# fog itself, the alternate key bindings); `passable` where the fault is a
# tolerance, a ceiling, an edge case or a secondary path (a cooldown, a wrap, a
# menu screen, a cue); and `great` where it is a cosmetic detail (the mute
# toggle, a tell that is drawn slightly differently). No point caps at `flawless`:
# a failure always costs.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# game is driven and inspected from code, and every other suite on this checklist
# poses its scenario through it. These points check that it is really there,
# really wired to the running game, and really deterministic. A surface that
# reports a plausible-looking object unconnected to what is on screen is the
# failure mode worth naming, and it also shows up as every other suite failing to
# run.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug and automation surface is present"
description = "Every operation specs/instrumentation.md names is present as a function on the surface — the menu trio setMenuIndex, setTitleIndex and menuItemRect among them — reached on the page as window.__fathom in an engineless build and off engine.debug in an engine build; version reports FATHOM_DEBUG_VERSION (1), and the surface is live: setMaze poses a board, setForagerTile moves the forager onto it, and both the snapshot and the rendered canvas change."
domains = ["navigation", "sensing", "predators", "progression", "presentation"]
failure_cap = "broken"
# Automated validation: reflect that every required operation is installed as a
# function (setAutoStep and advance under `none` alone; setMenuIndex,
# setTitleIndex and menuItemRect on every engine), then prove liveness by
# posing a board, placing the forager on it, and reading both the snapshot and the
# canvas back. See validation/<engine>/instrumentation/surface-present.test.ts.
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "state", name = "The driven in-game state", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "In live play on a posed board carrying a drifter, a pulse in flight, an ink cloud, and one predator of each kind, the snapshot reports every field specs/state.md lists with its documented type — version, the screen, menuIndex, titleIndex, depth, score, lives, muted (and autoStep on an engineless build), planktonRemaining, brightness, brightHold, visionRadius, the sonar and ink pairs, the grid block, tiles, plankton and visibility, the forager block, drifters, one predators entry per predator with every per-kind field present or null, pulses, inkClouds and simTime — with tiles, plankton and visibility all GRID_ROWS (18) strings of GRID_COLS (36) characters and every tile coordinate agreeing with the position it is derived from."
domains = ["navigation", "sensing", "predators", "progression", "presentation"]
failure_cap = "broken"
# Automated validation: pose a board exercising every branch of the shape, then
# hold each reported field against the documented shape and against the position
# it is derived from. See validation/<engine>/instrumentation/snapshot-shape.test.ts.
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The posed board the snapshot reports", kind = "image" },
] }
[[review.categories.items]]
id = "menu-rect"
title = "The surface reports where each menu item was drawn"
description = "specs/ui.md leaves the menu layout to the build and specs/instrumentation.md makes the build report it: on the title, on the pause menu and on the game-over menu, menuItemRect(index) returns an { x, y, w, h } region in logical units that lies inside the 1280 x 720 stage, contains the point that item's own text was drawn at, and overlaps no other item's region of the same menu; and it returns null on \"howto\", \"countdown\", \"playing\" and \"cleared\", which show no menu, and for an index the current menu does not hold."
domains = ["presentation", "progression"]
failure_cap = "scuffed"
# The cap is `scuffed`, level with the six `pointer` and `touch` points this
# reading gates rather than above them. `menuItemRect` is a pure debug read and
# the pointer's effect on a menu stays in the game's own input handling, so a
# build whose menus work perfectly on a mouse and whose region reading is wrong
# costs a player nothing directly. What it costs is the six points it hides, and
# each of those is `scuffed` on the manifest's own reading: a menu a mouse cannot
# work is a whole input the player has, unusable, while the keyboard still opens
# every screen. A gate is not held above what it gates. It lowers `presentation`
# and `progression` alone, because the menus are all it serves.
# Automated validation: read the region back for every item of each of the three
# menus, hold it against the stage, against the text the draw recorder saw that
# item written at, and against the other items' regions, then read it again on
# the four screens that show no menu and for an index past the menu's end. See
# validation/<engine>/instrumentation/menu-rect.test.ts.
validation = { script = "instrumentation/menu-rect.test.ts", outputs = [
  { id = "regions", name = "The title menu beside the regions it reports", kind = "image" },
] }
[[review.categories.items]]
id = "manual-clock"
title = "The game holds still on the driver's clock"
description = "The other half of the deterministic-core contract: with the simulation taken off the wall clock, nothing advances between steps — simTime does not move and no predator moves over a second of real time — while a step of n ticks advances simTime by exactly n * TICK_DT (1/120 s) within one tick, and covering one second of game time as one step and as sixty steps leaves simTime the same either way."
domains = ["navigation", "sensing", "predators", "progression", "presentation"]
failure_cap = "broken"
# The cap sits level with `surface-present` and `snapshot-shape` rather than a
# step below them, because the three are one deliverable: a core that will not
# hold still is a core no scenario can be posed against, so every point on this
# checklist ends up decided against a game that moved under the reading. That is
# the same loss to a player as a surface that was never installed.
# Automated validation: take the clock (setAutoStep(false) under `none`; the
# harness's own ConstantClock under an engine), let real time pass with nothing
# stepping the game, then cover the same second of game time under two step sizes.
# See validation/<engine>/instrumentation/manual-clock.test.ts.
validation = { script = "instrumentation/manual-clock.test.ts", outputs = [
  { id = "held", name = "The game held still while real time passes", kind = "replay" },
] }

