# Feast mode, with a periodic, time-limited bonus orb. Feast replaces the base
# mode, so it is rated on its own scoring domain rather than folded into the
# common gameplay domain. Seeds its own mode spec, its own `title` menu, and the
# review item that rolls up to that domain.
slug = "feast"
name = "Feast"
description = "Feast mode, with a periodic, time-limited bonus orb."

# This variant's single mode spec (Feast) is seeded to the stable `specs/mode.md`
# the common specs reference. `dest` is explicit because the source name differs.
spec = [{ source = "specs/mode-feast.md", dest = "specs/mode.md" }]
reference = [{ view = "title", path = "reference/menu-feast.html" }]

[[domain]]
id = "feast"
name = "Feast"
description = "The Feast mode: a periodic, time-limited bonus orb worth a large combo score."

[[review_item]]
id = "feast-bonus-orb"
title = "Bonus orb"
text = "A Feast match periodically shows a single time-limited bonus orb alongside the ordinary pellet (first at 8 s, staying 6 s, blinking faster in its final 2 seconds before it despawns). Eating it scores 50 x M and counts as a combo eat, but does not grow the snake or replace the pellet."
weight = 1
domain = "feast"
