# Maze mode, with fixed fatal interior obstacles. Maze replaces the base mode, so
# it is rated on its own scoring domain rather than folded into the common
# gameplay domain. Seeds its own mode spec, its own `title` menu, and the review
# item that rolls up to that domain.
slug = "maze"
name = "Maze"
description = "Maze mode, with fixed fatal interior obstacles."

# This variant's single mode spec (Maze) is seeded to the stable `specs/mode.md`
# the common specs reference. `dest` is explicit because the source name differs.
spec = [{ source = "specs/mode-maze.md", dest = "specs/mode.md" }]
reference = [{ view = "title", path = "reference/menu-maze.html" }]

[[domain]]
id = "maze"
name = "Maze"
description = "The Maze mode: fixed fatal interior obstacles the snake must navigate around."

[[review_item]]
id = "maze-obstacles"
title = "Fatal obstacles"
text = "A Maze match adds fixed interior obstacle bars, drawn in the obstacle color, that are fatal on contact exactly like walls; the layout is point-symmetric about the board center, the snake's start row is left clear, and pellets never spawn on an obstacle cell."
weight = 1
domain = "maze"
