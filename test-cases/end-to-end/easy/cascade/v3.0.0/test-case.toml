# The two `vx` items are decided through `drawLaunchVx`, the operation that
# performs one launch's draw and nothing else, rather than by reading a whole
# cascade. The magnitude item reads a handful of draws and holds each to the
# range; the sign item reads a small sample and holds it to carry more than one
# sign, which a fair sign fails with a chance of one in 2^31, beyond six standard
# deviations. Neither item asserts a ratio or a spread, because a sample cannot
# decide a distribution without failing conformant builds by chance; what they
