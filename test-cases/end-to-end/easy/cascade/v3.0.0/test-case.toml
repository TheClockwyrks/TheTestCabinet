# --- The menus (touch) --------------------------------------------------------
# A finger is not a small mouse. It never hovers, so the first the build hears of
# it is the contact LANDING, and the landing is what selects: that is a rule of
# its own in `specs/controls.md`'s pointer-and-touch table and cannot be reached
# by any mouse point. Each point below drives one real touch contact at the
# middle of the region the build reports, so any layout passes and only the
# handling is graded.
#
# ONLY THE LANDING IS GRADED ON EVERY ENGINE. `specs/controls.md` gives a finger
# ONE rule the mouse does not share — the contact landing inside a region selects
# that item, with no hover before it — and no `pointer/` point reaches it, so a
# build owes that answer under every engine. The other two touch rules ARE the
# mouse's: a contact that lifts where it landed activates, and one that lifts
# elsewhere does not, which is `pointer-click-confirms` and
# `pointer-split-gesture-confirms-nothing` word for word. Under an engine the
# engine resolves a contact into the same press, move and release a mouse raises,
# so those two would re-run the mouse points and charge a build twice for one
# defect; they carry `engines = ["none"]`, where the build owns the browser's
# events and a build that listens for the mouse alone genuinely fails them.
#
# The cap is `scuffed`: a player holding a mouse loses nothing, and a player
# holding a tablet loses the menus — an optional path unplayable.
