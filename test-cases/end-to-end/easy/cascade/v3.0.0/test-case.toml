# --- Presentation -------------------------------------------------------------
# What a player can actually READ. The case fixes no palette and no typeface, and
# `specs/overview.md` closes its visual design table with "The palette, the type,
# and every other aspect of the look are yours", so every point here decides
# PRESENCE and nothing else: the build drew something where the specification
# says something is drawn, or the region changed when the thing under test was
# posed. How any of it looks — colors, contrast, how much of a region carries a
# mark — is the reviewer's domain ratings to judge and no point's to measure.
#
# WHICH strings are drawn is the `screens` group's question and is not decided
# again here. Deciding one fact in two groups would dock one defect twice.
#
# THE OVERLAY'S TOGGLE, ITS DEFAULT AND ITS READ-ONLY-NESS ARE GRADED ON `none`
# ALONE. Under `simple-2d` and `structured-2d` the panel, the Backquote listener,
# the hidden-at-start default and the fact that reading the panel moves nothing
# are all the engine's, so a point about any of them could not fail on two of the
# three engines; under `none` they belong to the runtime layer the build writes,
# and `specs/controls.md` states them. So four of the eight overlay points carry
# `engines = ["none"]` and the other four, which are about which diagnostic
# sources the build registers, are what every engine is held to.
#
# `overlay-off-at-start`, `overlay-shows-on-backquote` and
# `overlay-hides-on-backquote` cap at `great`. The overlay is a developer
# affordance: a build whose backtick key does nothing plays exactly as well as one
# whose key works, and the standard flow of gameplay is untouched. They exist so
# that a missing Backquote binding docks the one point it costs rather than
# entangling the registration points, which have to reach the panel to read it.
# `overlay-changes-nothing` caps at `passable` instead, because an overlay that
# moves the game's own state as it is read changes how the game plays.
