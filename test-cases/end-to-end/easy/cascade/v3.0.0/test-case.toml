# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.
#
# THE ORDER OF THIS FILE MATTERS. Every ROOT key — `variants`, `init`,
# `max_runtime_hours` and `engines`, together with the metadata above them — must
# precede the first table header. A root key written after a header such as
# `[instrumentation]` parses as a member of THAT table
# (`instrumentation.variants`), and the case then resolves declaring no variants
# at all. The layout below is Refract's, Carom's and Wireworm's, key for key.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "cascade"

# Human-readable display name for this test case.
name = "Cascade"

# The test type. It decides which tables are required and which are rejected;
# `end-to-end` is the default and is stated here rather than left implied.
type = "end-to-end"

# Relative difficulty of this case, surfaced on the site. Cascade asks for the
# whole of Klondike — thirteen piles, what each accepts and refuses, ordered runs,
# a stock whose waste remembers each turn as a set, an auto-move, four screens, a
# HUD, ten cues — driven entirely by the pointer and capped by a physics-driven
# victory cascade. It is a lot of rules, but every one of them is a statement
# about a pile: there is no opponent to model and nothing that has to be tuned by
# feel. Difficulty rates how demanding the THINKING is, not how long the build
# takes — `max_runtime_hours` below is where the size of the job is accounted for.
# So easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["cards", "solitaire", "klondike", "2d"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A green-felt Klondike solitaire drawn entirely in code, capped by a \
physics-driven victory cascade that buries the table in bouncing cards."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version. The site aggregates every
# version's entry, newest first, into the case's changelog. Like `description`,
# it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs, the selected engine and the selected variant) and
# handed to the model as the build instruction. It injects absolute in-container
# paths through template variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Cascade is a substantial build — thirteen piles and every
# rule over them, ordered runs, the stock's set memory, the pointer's grab, drag,
# drop and double-click rules, four screens, a HUD, ten cues, the victory cascade,
# and, under the engineless run, the whole runtime layer beneath all of it. Four
# hours is comfortably more than a healthy build of that size needs while still
# catching a session that never terminates.
max_runtime_hours = 4

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine — and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# There is deliberately NO `assets` key. Cascade draws every card, the table, the
# HUD and every screen in code, so the case seeds no art at all. That is one place
# it is simpler than Wireworm and Fathom, and it is why nothing in the seeded
# workspaces copies an `assets/` tree into `dist/`.

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Cascade declares TWO, and they differ in one thing — how many cards a stock turn
# moves:
#   - `draw-one`   the gentler deal. A turn moves one card, so every card in the
#                  stock is reachable.
#   - `draw-three` the classic Klondike deal. A turn moves three cards, fanned,
#                  with only the frontmost playable.
#
# The four SCREENS are not variants, and neither are the two deal modes' shared
# rules. A variant is a difference in the game a run is asked to BUILD; a screen is
# what a single build already contains. Two seeded specs branch on the variant,
# `specs/stock.md.hbs` and `specs/table.md.hbs`, and they branch only over the turn
# count, the deal-mode id and label, and the fan. The set memory the waste keeps,
# the recycle rule and every other stock rule are common text, and the snapshot
# shape does not branch at all: `wasteSets` and `wasteVisibleCount` are reported by
# both variants, so one validator suite reads both.
#
# Each variant declares its own `[workspaces]`, because four entries of
# `src/constants.ts` differ, and its own additive review points under the case's
# common `stock` category.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/draw-one.toml", "variants/draw-three.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# pointer input, the audio bus, and the on-screen diagnostics; one of them also
# owns rendering and the gameplay framework the game is written inside. It is a
# *run dimension*, chosen per run alongside the model, the harness and the variant,
# and recorded on the run; it is not a property of the game.
#
# Cascade supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build writes
#                     the frame loop, the canvas fit, the pointer input, the audio,
#                     the debug overlay, the `window.__cascade` surface, and every
#                     figure the specification fixes, from the specs alone.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules around
#                     it (`src/constants.ts`, `src/main.ts`, and the `src/game.ts`
#                     stub the build replaces, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes the
#                     whole of `src/game.ts` — the game definition, its instance,
#                     its mode, its live state and its actors — and the debug
#                     surface its instance's `initialize` returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to THIS game under it.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

# ---- Tables begin here. No root key may follow. -----------------------------

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against and an `index.html`
# holding the canvas. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     pointer input, audio, debug overlay and `window.__cascade`
#                     surface, and every figure the specification fixes, from the
#                     specs alone. It is shared by both variants, because it holds
#                     no game code for a variant to differ in.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them),
#                     `src/main.ts` (the browser entry) and the `src/game.ts` stub
#                     the build replaces.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds `src/constants.ts` and `src/main.ts`. It seeds NO
#                     `src/game.ts`: `src/main.ts` imports one, so a freshly seeded
#                     workspace fails `npx tsc --noEmit` on the missing module.
#                     That failure is the starting point, and `src/main.ts` says so
#                     in its header.
#
# The two engine projects are PER VARIANT, because `src/constants.ts` differs in
# four entries — `TURN_COUNT`, `DEAL_MODE`, `DEAL_MODE_LABEL` and, on Draw Three,
# `WASTE_FAN`. The table below names the Draw One set, and each variant file
# declares its own `[workspaces]` that REPLACES this whole table rather than one
# entry of it, so no run depends on which set happens to be named here.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/draw-one/simple-2d"
"structured-2d" = "workspaces/draw-one/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`.
# `npm ci` is deliberate — it requires the build to commit a `package-lock.json`,
# so the validated build installs exactly what the deploy will. Both commands are
# required; there are no defaults, so every case states exactly how its
# implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its
# scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__cascade` once the game has initialized, so
# the handle is what a person opening the console of such a build finds. An engine
# run has NO global at all: the build writes the surface, its `initialize` returns
# it — beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view, its
# surface is written in the shape of `update` — a pose takes the current state and
# returns the next, applied through `engine.apply`, and a reading takes the state
# and returns what it read, called with `engine.state`. `structured-2d` holds the
# world live, so its poses take only their own arguments and act on it at the call,
# and its readings return plain data. One handle, three ways to reach the same
# operations.
#
# There is deliberately no `tick_hz`. Cascade mandates no fixed timestep, which is
# a change from v2.0.0's `tick_hz = 120`. Every rate in the game is per second and
# integrated against the delta time the frame hands it, so there is no case-wide
# step size for the harness to sample at, and each validator constructs its own
# clock and asks for exactly the frames it wants. The key is optional precisely so
# a case clocked this way omits it.
[instrumentation]
handle = "__cascade"

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. Neither variant declares one
# of its own: the two files the deal mode reaches branch inside themselves, so each
# run receives one self-contained spec set describing one game.
#
# The specification is decomposed by concern, and EACH RULE LIVES IN EXACTLY ONE
# FILE. Each file is self-contained enough to be read on its own while naming its
# siblings, by file name in plain text, where a fact lives elsewhere.
#
# Every `.hbs` source is rendered before it lands, on two axes: `engine.slug`,
# which selects what the build is handed and what it must write, and
# `variant.slug`, which selects this run's deal mode. A spec's `dest` defaults to
# its `source` with a trailing `.hbs` stripped, so an `.md.hbs` source seeds to the
# same `.md` path and a plain `.md` source is seeded verbatim.

# What the game is and what the finished build must be: the premise, the hard
# requirements, the free choices, the fixed 1280x720 stage and the TOP-LEFT
# convention every reported and accepted (x, y) uses, the stage-fit requirement,
# and the legibility table — what a player must be able to read at a glance, which
# is all this case fixes about the look. It names specs/table.md as where the pile
# geometry lives rather than restating it. It branches on the engine for what the
# runtime supplies against what the build writes.
[[spec]]
source = "specs/overview.md.hbs"

# The geometry of the table: the card footprint, the seven column anchors, the top
# row and its stock, waste and four foundation anchors, the two overlap offsets,
# long-column compression with its floor and its relaxation, the HUD strip, and
# SOLE OWNERSHIP of every pile's DROP RECTANGLE, which specs/controls.md resolves a
# release against. It branches on the variant for the waste alone: what the waste
# shows, and, under Draw Three, the fan's pitch and where it ends.
[[spec]]
source = "specs/table.md.hbs"

# The deck and the deal: fifty-two cards in four suits and thirteen ranks, Ace low
# and King high; the uniform shuffle at every new game; seven columns of 1..7 with
# each column's lowest card face-up; twenty-four cards to a face-down stock; an
# empty waste and four empty foundations; and that a new deal clears the painted
# table. Seeded verbatim: nothing in it differs by engine or by variant.
[[spec]]
source = "specs/deal.md"

# The four foundations and what they accept: an Ace onto an empty one and
# thereafter the next-higher card of the same suit, any suit onto any empty slot
# and locked to it once started, one card at a time and never a run, and the pull
# back onto a legal column. Seeded verbatim.
[[spec]]
source = "specs/foundations.md"

# The seven columns and what they accept: building down in rank and alternating in
# colour, only a King or a King-headed run onto an empty column, nothing at all
# onto a column whose lowest card is face-down, what a grab takes, that a
# face-down source is refused, and that a newly exposed lowest card turns face-up.
# Seeded verbatim.
[[spec]]
source = "specs/tableau.md"

# The stock, the waste, and this build's deal mode: the turn count and the deal
# mode's id and label; that a turn moves that many cards one at a time from the top
# of the stock; the waste's SET MEMORY and the rule it follows, including what a
# waste whose set memory is empty shows; that playing off the waste takes the top
# card of the shown set and a set played off entirely falls back to the one before
# it; the recycle; and that passes are unlimited. It branches on the variant for
# the turn count, the mode id and label, and nothing else.
[[spec]]
source = "specs/stock.md.hbs"

# The pointer and every control it answers: that a click and a touch tap are the
# same event and a mouse drag and a touch drag likewise; that every pointer sample
# a frame delivers is answered in the order it arrived; the grab rule and that a
# run enters the hand ON THE PRESS; the drag threshold and what it decides; the
# drop rule, resolved against the drop rectangles specs/table.md fixes; the
# double-click rule and the auto-move it performs; SOLE OWNERSHIP of the hit
# rectangles for the two title items, the how-to BACK item and the three HUD
# controls; and the overlay toggle. It branches on the engine because an engine run
# reads the pointer's ordered samples from the engine and the overlay toggle is the
# engine's, while an engineless build listens for pointer events itself.
[[spec]]
source = "specs/controls.md.hbs"

# Winning, and the victory cascade: the win condition, that play stops and the
# cascade begins on the win, the launch cadence and order and the position and
# velocity a card launches with, the per-frame integration order and every figure
# in it, the floor bounce with its damping and reseating, that a card collides with
# nothing, the painted trail, retiring past either side edge, the end of the
# cascade and its message, and that a press deals a fresh game. Seeded verbatim.
[[spec]]
source = "specs/victory.md"

# The four screens and the HUD: which screen the game opens on, what each shows,
# the title copy as the literal strings that must be drawn, the how-to screen's
# contents and its way back, the HUD's three controls, that the deal-mode label
# drawn on the title screen and in the HUD is this build's own, that the HUD stays
# clear of the piles, and what has no screen at all. Seeded verbatim.
[[spec]]
source = "specs/screens.md"

# The cues and muting: the ten cues, what each sounds on, and that muting silences
# them all. It branches on the engine because cues are defined and played through
# the engine's audio bus on an engine run and the mute bit is the engine's, while
# under `none` the build synthesizes them with the Web Audio API, owns the mute bit,
# and must not autoplay.
[[spec]]
source = "specs/audio.md.hbs"

# The shape of the game's state. Three shapes, one per engine: under `none` a list
# of what the state must carry, because the build owns the shape; under `simple-2d`
# the exact `CascadeState` declaration to write into `src/game.ts`; under
# `structured-2d` the equivalent live class extending the engine's `GameState`.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# render-free core; every operation by name, signature and effect, the four faculty
# gates among them; the snapshot shape; the identity rules for cards and flyers;
# and a read-only debug overlay. Framed as an ordinary developer affordance of the
# game. It branches on the engine for where the surface is reached, the operation
# shape, and the two clock operations only an engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured — a gzipped recording from the engine's own draw-command
# recorder on an engine run, a short clip under `none`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[proof]]`, and no `[[check]]`.
#
# Cascade v3.0.0 deliberately fixes NO palette, no typeface and no styling: the
# specification states what a player must be able to read at a glance
# (specs/overview.md's legibility table) and everything else about the look is the
# build's own design. A reference view is a picture a build is compared AGAINST, so
# there is no honest one to seed here — every build is expected to look different,
# and a screenshot diff would score the build that copied the mockup best rather
# than the build that designed the best table. v2.x seeded reference mockups and a
# canonical thirteen-colour palette; dropping both is one of the things this major
# bump is for.
#
# `[[proof]]` is likewise empty: no proof media is asked of the build, and
# specs/proof.md is gone. Every piece of media a reviewer sees beside a verdict is
# captured by this case's own validation suites, from scenarios the case controls.
# The showcase spec above does ask for media, but as the game's own store-page
# presentation rather than as evidence any point is judged on. The automated load
# check still runs.

# Scoring domains. This case is on the engine format, so it is validator-rated:
# each domain's FUNCTIONAL rating is decided by the validators behind the point
# checklist below (every point names the domains its failure lowers and how far —
# see `domains` / `failure_cap` there), and the run's overall functional rating is
# the WORST across the domains — an immaculate victory cascade cannot mask a
# foundation that accepts the wrong card. The reviewer's judgement lives in the
# separate AESTHETIC rating: the look, the polish and the feel, everything this
# case fixes no picture of.
#
# Four domains, cut where a build can plausibly get one right and another wrong:
# the rules underneath the game, the pointer that plays them, the signature ending,
# and the presentation this case hands entirely to the build.
[[domain]]
id = "rules"
name = "The Rules of Klondike"
description = "The game underneath: the deal, what the foundations and the tableau accept, how runs move, the stock and the waste and the sets they remember, the auto-move, the turning of an exposed card, and the win."

[[domain]]
id = "handling"
name = "Handling"
description = "The pointer that plays it: what a press picks up, how a held run follows and highlights, where a release resolves, the double click, and the controls on the table."

[[domain]]
id = "cascade"
name = "The Victory Cascade"
description = "The signature: the launch cadence, the arcs under gravity, the floor bounces, the trail that buries the table, and the ending."

[[domain]]
id = "presentation"
name = "Presentation"
description = "The table's geometry, the four screens and the HUD, whether the palette the build chose lets a player tell its cards apart, the debug overlay, and the audio cues."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY — a bare name grouping the points — and
# each item entry under it is one graded review item, worth one point (the default
# weight), so a category is worth the number of items it holds. No item declares a
# `weight`: every observable behaviour on this checklist counts the same, and the
# relative importance of a failure is carried by `failure_cap`, not by arithmetic.
#
# A category carries no prose of its own; each item states in `description` the
# claim its validator checks. The fourteen categories below hold 226 COMMON items,
# applying to every run whatever its engine or variant. Each variant contributes
# its own additive points to the common `stock` category — six on Draw One, ten on
# Draw Three — so a Draw One run is rated on 232 points and a Draw Three run on
# 236. The checklist is reporter-side material, never seeded into a run, so the
# model never sees it. Every item restates a requirement the seeded specification
# already states, in the spec's own vocabulary and naming the spec's own constants,
# and every threshold a validator asserts is derived from a figure or rule in the
# specs plus a numeric tolerance stated in the item.
#
# EVERY point carries a validation script, and every point is ONE OBSERVABLE
# BEHAVIOUR, so a build fails exactly the rule it breaks: the run that moves as a
# unit and the order it arrives in are two points, not one. Each script is a vitest
# suite under `validation/<engine>/<category>/<item id>.test.ts`. The `<engine>`
# level is the ENGINE the suite is written against — a validator speaks one
# engine's vocabulary, so this case, which supports three, ships one directory per
# engine, and resolution holds every declared script against all three.
# `validation/none/` drives the build in Chromium through `window.__cascade`, with
# a page-injected 2D-context recorder for the draws and an injected audio shim for
# the cues; `validation/simple-2d/` and `validation/structured-2d/` each run in
# process against their vendored engine, posing scenarios through the surface
# `engine.debug` returns, reading state back from the snapshot, audio from the
# engine's `cue:played` event, and drawing from the canvas pixels or the engine's
# own draw-command recorder. The three are the same scenarios; only how they reach
# the build differs. The directory for the run's engine is what gets staged into
# the built workspace at `validation/`.
#
# EVERY SCENARIO IS POSED, AND POSED EMPTY. The shared harness's `openTable` calls
# `reset()`, `setScreen("playing")` and `clearTable()`, and leaves the four faculty
# gates ON at their reset defaults — so a validator's table holds only what its
# requirement concerns. An empty table is safe without any world gate, because
# Cascade has no autonomous entity: the game is turn-based and moves only when the
# player moves it, so nothing arrives uninvited. Turning a FACULTY gate off is the
# exception, and the point that does it is the point whose requirement the gate is,
# or one whose requirement would otherwise be entangled with another rule.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. `kind` is decided ONCE here and serves all three engines —
# `validation = { script, outputs }` is a per-item key, there is no per-engine
# `outputs`, and the extension an output is served under is fixed by its kind, so a
# kind that varied by engine would serve one engine's file under another's name.
# `image` is the default: a single captured frame, which is the right evidence for
# a posed board read once. `replay` is the exception, declared on the eighteen
# common points (and two more on Draw Three) whose requirement IS motion — a run
# following the pointer, a column relaxing, a card arcing and bouncing, a cascade
# running out — where a reviewer wants to scrub. There is no `video` anywhere. Both
# are evidence beside the verdict rather than any part of it: a point passes or
# fails on its assertions alone.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers — a foundation point
# lowers `rules`, an auto-move point lowers `rules` and `handling` both, and an
# instrumentation point, which every suite in every domain drives through, lowers
# all four. `failure_cap` is the highest functional rating those domains may reach
# while the point fails; each domain gets the LOWEST cap among its failing points,
# and a domain with no failing point is flawless. The caps are graded by how much
# of the game a failure takes away: `broken` where the game cannot be played as
# intended (no debug surface, a foundation that takes the wrong card, a run that
# will not move, a cascade that never completes); `scuffed` where an optional path
# is unplayable or normal play is unpleasant (a pull-back that is refused, a screen
# that cannot be reached by its control); `passable` where it affects play without
# breaking it (a tolerance, an edge case, a cue); and `great` where the standard
# flow is untouched (a cosmetic detail). No point caps at `flawless`: a failure
# always costs.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# game is driven and inspected from code, and every other suite on this checklist
# poses its scenario through it. These points check that it is really there,
# really wired to the running game, really deterministic, and that each pose reads
# back. A surface that reports a plausible-looking object unconnected to what is on
# screen is the failure mode worth naming.
#
# Four of them are the FACULTY GATES. Cascade needs no world gates: nothing in
# Klondike arrives uninvited, the game moves only when the player moves it, and an
# empty posed table is already an isolated world. What does intrude is a faculty a
# scenario never asked for, so `setAutoFlip`, `setWinDetect`, `setLaunching` and
# `setTrailPainting` each gate ONE faculty and nothing else, default to on, are
# restored to on by `reset`, and are reported by `snapshot()`. Each has a point
# here because a gate the suite leans on has to be known to work before anything
# leaning on it means anything.
#
# `clear-trail`, `reset-clears-trail`, `trail-painting-gate` and
# `deal.deal-clears-trail` all decide on `trailStamps`, which is what makes them
# instrumentation points rather than drawing points: a build with a correct gate
# and a broken blit fails `cascade.trail-persists` and nothing else, and a build
# that paints correctly but never clears fails these four and nothing else.
#
# Three items cap at `passable` rather than `broken`, deliberately. A build whose
# seeded deal does not reproduce, or whose cascade is not reproducible from a seed,
# is a completely playable game of Klondike with a completely watchable ending: the
# player loses nothing. This category names all four domains, so capping such an
# item `broken` would rate an otherwise perfect build broken across the board for a
# defect no player can see. `broken` here is reserved for the surface every other
# suite drives through.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug surface is present and complete"
description = "Every operation specs/instrumentation.md names is a function on the surface, version is CASCADE_DEBUG_VERSION (1), and the surface is live: a posed card reads back and a posed move applies."
domains = ["rules", "handling", "cascade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "live", name = "The posed card and the applied move the surface drove", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed board carrying cards in all four pile kinds, a waste with two sets, a run in hand over a legal target, and two flyers in flight, every field of the documented shape is present with its documented type."
domains = ["rules", "handling", "cascade", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The board every reported field was read from", kind = "image" },
] }
[[review.categories.items]]
id = "poses-read-back"
title = "Every pose is reported by the snapshot"
description = "Each pose's value is read back: the screen, a card's face, the waste's sets, the four gates, a flyer's position and velocity, and the launch clock."
domains = ["rules", "handling", "cascade", "presentation"]
failure_cap = "broken"
# `autoStep` is deliberately not in the list and is deliberately not a snapshot
# field. `setAutoStep` changes no game state: under `none` the flag belongs to the
# frame loop, and under the two engines the clock belongs to the engine, so a field
# reporting it would be a field no game rule reads and two systems could disagree
# about. `muted` is not in the list either, for the same class of reason: no
# operation sets it, and `screens.hud-sound-toggles` and `audio.mute-silences`
# cover it instead.
validation = { script = "instrumentation/poses-read-back.test.ts", outputs = [
  { id = "posed", name = "The board each pose was applied to", kind = "image" },
] }
