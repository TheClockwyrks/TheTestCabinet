# The two sides of DRAG_THRESHOLD (`5`), one point each. Four units and six units
# are the same gesture either side of the figure, so a build reading the
# comparison the wrong way round fails exactly one of the two and a build that
# never measures at all fails both.
#
# BOTH ARE DRIVEN ON THE STOCK rather than on a card carried toward a column.
# `specs/table.md` puts the thirteen drop rectangles at least `16` units apart, so
# a run moved four or six units still has its leading card's centre inside its own
# source pile's rectangle or inside none at all, and both readings of the
# threshold leave the card where it started. The stock is the one place the two
# kinds of gesture part company over a distance this small: a click there turns
# the stock and a drop turns none.
