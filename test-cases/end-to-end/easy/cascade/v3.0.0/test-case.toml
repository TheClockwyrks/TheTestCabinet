# --- The Victory Cascade ------------------------------------------------------
# The signature: fifty-two cards launched one after another, each arcing under
# gravity, bouncing off the floor, painting the table and retiring past a side
# edge.
#
# A WRONG FIGURE IN THE CASCADE IS NOT `broken`. The cascade is the game's ending,
# not its play. A cascade that never starts, never completes, or leaves no trail is
# `broken`; a wrong gravity, damping, cadence or launch velocity is `passable`,
# because the ending still plays and only its motion is off.
#
# Every item in this group turns `setTrailPainting(false)` except
# `trail-persists`, `trail-accumulates` and `trail-survives-completion`, and every
# `replay` output in the group records with it off, which is what keeps a cascade
# replay inside the recorder's capture budget. `setLaunching(false)` is what lets
# every single-flyer point read one parabola instead of fifty-two.
#
# Unless an item says otherwise, a point here advances the clock in frames of
# 1/240 s, fine enough that a figure quantized to a frame boundary still meets the
# stated tolerances. A suite that advances in 1/60 s frames instead will fail
# conformant builds on the timing items.
#
# There is deliberately NO item saying that at most one card launches in a frame.
# The launch rule carries its remainder, so a frame long enough to cover several
# intervals launches several cards, and such an item would fail a conformant build
# on any coarse frame while passing vacuously on fine ones. What the rule
# guarantees is the count, and `launch-cadence` asserts exactly that.
[[review.categories]]
id = "cascade"
title = "The Victory Cascade"
# The mean is the honest figure because the launch rule carries its remainder, so
# the cadence does not drift; a per-gap tolerance tighter than a frame would only
# be measuring the validator's own step.
[[review.categories.items]]
