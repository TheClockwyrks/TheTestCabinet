# --- The menus (keyboard) -----------------------------------------------------
# `specs/controls.md` makes each screen's controls that screen's menu and gives
# the keyboard four actions over it — `menu-up`, `menu-down`, `menu-confirm` and
# `menu-back` — bound to literal `KeyboardEvent.code` values. Each point below
# drives the real key and reads the result off `screen` and `menuIndex`, one
# transition at a time, on one menu at a time: the title's two items, the how-to
# screen's one, and the HUD's three during play. `won` shows no menu and reads
# none of the four, which is why nothing here drives it.
#
# A KEY THAT IS BOUND TO TWO CODES IS ONE POINT. `menu-up` is `ArrowUp` and
# `KeyW`, `menu-confirm` is `Enter` and `Space`: the two codes raise the same
# action and exercise the same rule the same way, so one point drives both and a
# build that bound only one of the pair fails it.
#
