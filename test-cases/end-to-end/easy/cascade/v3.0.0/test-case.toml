# --- Handling -----------------------------------------------------------------
# The pointer that plays the game: what a press picks up, how a held run follows
# and highlights, where a release resolves, and the double click.
#
# DRAG_THRESHOLD decides one thing and one thing only, and
# `short-gesture-is-a-click` and `long-gesture-is-a-drop` are the two items that
# grade it, one on each side of the figure: a build that calls every gesture a
# click and a build that calls every gesture a drop are different defects, and
# bundled they scored the same. `specs/controls.md` states the rest of the rule
# the rest of this group depends on: the run enters the hand ON THE PRESS, before
# any motion, which is what makes `press-grabs-column-run`, `press-grabs-waste-top`,
# `press-grabs-foundation-top` and `press-face-down-grabs-nothing` readable from
# `snapshot().drag` immediately after a `pointerDown` with no move. Every item that
# completes a drop moves the pointer farther than DRAG_THRESHOLD before releasing.
#
# Four items resolve a release against a DROP RECTANGLE, which `specs/table.md`
# fixes beside the anchors. Without that figure a build could read a column's
# rectangle as the card footprint at its anchor or as the column's whole drawn
# extent, both honouring every other stated rule, and these items would be
# asserting the reference's choice rather than the specification's.
[[review.categories]]
id = "handling"
title = "Handling"
[[review.categories.items]]
id = "press-grabs-column-run"
title = "A press on a column card lifts it and the cards below"
description = "The held run is the grabbed card and every face-up card below it, in order."
