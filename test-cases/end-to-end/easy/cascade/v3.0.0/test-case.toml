# --- Audio --------------------------------------------------------------------
# Ten cues, one per event, and the mute that silences them.
#
# THE TEN CUES CAP AT `great`. A silent Klondike is a completely playable
# Klondike: every rule still resolves, every gesture still lands, and the standard
# flow of gameplay is untouched by a cue that never sounds. `mute-silences` and
# `unmute-restores` are the exception at `passable`, because they are not about a
# sound being made but about the player's own control over sound: a mute that does
# not silence leaves a player no way to quiet the game, and an unmute that does
# not restore takes the audio away permanently, and both of those affect play.
#
# There is deliberately NO `cues-defined` item. A cue's NAME is not observable from
# outside an engineless build: the probe wraps `AudioScheduledSourceNode.start` and
# `<audio>.play` and can see only that a sound was emitted and on which frame, and
# the `none` workspace ships no `src/` for a CUES constant to live in. The ten
# per-cue items already fail a build that defines no cues, and they degrade
# honestly under `none` to a sound was emitted on the frame of the event.
