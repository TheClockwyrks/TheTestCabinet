# `y` and `vy` are deliberately NOT compared. Under the semi-implicit Euler
# integration `specs/victory.md` fixes, a quantity under acceleration depends on
# how the interval was divided, so a build whose `y` agreed across the two
# divisions would be one that had not implemented the stated integration.
validation = { script = "instrumentation/advances-in-frames.test.ts", outputs = [
  { id = "one-frame", name = "The flyer after one second covered as one frame", kind = "image" },
  { id = "sixty-frames", name = "The flyer after the same second covered as sixty", kind = "image" },
] }

# --- The Table ----------------------------------------------------------------
