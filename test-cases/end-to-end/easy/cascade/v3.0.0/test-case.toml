# --- The menus (mouse) --------------------------------------------------------
# The three behaviors `specs/controls.md` gives the mouse over a menu: a move
# selects, a press and its release inside one region activate that item, and two
# edges falling in different regions activate nothing. Each is graded on the
# title menu, where the two entries confirm to screens a check reads straight off
# `screen`.
#
# THE CAPS FOLLOW WHAT EACH MISS COSTS A PLAYER, and only the first is `broken`.
# Cascade is a pointer game: the table is played with the mouse and nothing else,
# so a build whose menus never CONFIRM under the mouse cannot be started or left
# with the mouse at all. Activation does not wait on a hover — `specs/controls.md`
# has a press and the release that follows it inside one region select the item
# AND activate it — so a build that never highlights on the way past is still
# fully playable and merely unpleasant, which is `scuffed`; and a slide-off that
# still fires is an edge case of the general rule, which is the `passable` the
