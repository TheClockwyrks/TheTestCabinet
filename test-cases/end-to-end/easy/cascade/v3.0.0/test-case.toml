# --- Presentation -------------------------------------------------------------
# What a player can actually READ. The case fixes no palette and no typeface, so
# every point here checks PRESENCE and DISTINGUISHABILITY against a stated RGB
# distance out of 441, never a hex value. The thresholds come from
# `specs/overview.md`'s legibility table, which is the whole of what the
# specification fixes about the look.
#
# `text-legible` is the legibility table's Text row and is the only point in this
# group about drawn strings: WHICH strings are drawn is the `screens` group's
# question and is not decided again here. Deciding one fact in two groups would
# dock one defect twice.
#
# NO ITEM GRADES THE OVERLAY'S DEFAULT-OFF STATE, AND NONE GRADES THE TOGGLE KEY.
# Under `simple-2d` and `structured-2d` the panel, the Backquote listener and the
# default are all the engine's, so such an item could not fail on two of the three
# engines. What the build owns under every engine is which diagnostic sources it
# registers and that registering them changes nothing, and that is what the five
# overlay items below decide.
