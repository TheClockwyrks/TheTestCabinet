# --- Screens and the HUD ------------------------------------------------------
# The four screens, the copy each carries, and the three HUD controls. The category
# names both `presentation` and `handling`, because a screen that draws correctly
# but cannot be reached by its own control has failed the player either way.
#
# One item covers the how-to copy, not four and not two. A script can decide
# whether a token is drawn; it cannot decide whether wording names the goal, and
# `.claude/skills/test-cases/SKILL.md` forbids asking it to. The captured image is
# what the reviewer judges the prose from. `title-shows-title`,
# `title-shows-tagline` and `title-shows-items` stay three separate items, each
# asserting its own literal.
#
# `title-shows-mode-label` and `hud-shows-mode-label` hold the drawn label against
# the `dealModeLabel` the build itself reports, so they decide CONSISTENCY under
# both variants and all three engines. The LITERAL each variant must draw is the
# variant's own pair of points.
