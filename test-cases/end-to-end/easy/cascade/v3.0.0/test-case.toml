# --- The Stock and the Waste --------------------------------------------------
# The stock, the waste, and the SET MEMORY the waste keeps. This is the group the
# v2.1.0 fold-in fix landed in, and the rule it states is positive: the waste keeps
# each turn's cards together as a set, remembers the sets in the order they were
# turned, shows the cards still on the newest set that holds any, and falls back to
# what is left of the set turned before it once a set is played off entirely.
# `wasteVisibleCount` is a consequence of that rule rather than a counter reading.
#
# Six points here carry the rule directly (`turn-starts-a-set`,
# `set-shrinks-on-play`, `cancelled-drag-returns-to-set`, `recycle-clears-sets`,
# `no-sets-shows-nothing` and `no-sets-refuses-move`), and each variant contributes
# the fallback point that decides it, over a waste large enough that no wrong model
# is clamped into the right answer by the size of the pile.
#
# The last two of those six decide the END of the rule — the state a waste reaches
# when its memory is empty and its cards are not. `clearWasteSets()` reaches it
# directly (specs/instrumentation.md) and play reaches it by drawing three, playing
# one, drawing three and playing all three, and the specification states both of its
# consequences positively: such a waste SHOWS no card, and it OFFERS none to play.
# Neither had a reading before, which left the same class of under-determination the
# set memory exists to close.
#
# A common validator in this group NEVER hard-codes a turn count. Where a scenario
# has to size itself to the deal mode it reads `snapshot().turnCount`, which
# `draw-one.deal-mode-reported` and `draw-three.deal-mode-reported` separately pin
# to the specification's figure.
