title = "Ordered runs"
[[review.categories.items]]
id = "move-unit"
title = "A valid run moves as a unit"
description = "A descending, alternating-color run of face-up cards moves together onto a legal target, carrying every card above the grabbed card with it."
validation = { script = "validation/runs/move-unit.mjs", outputs = [
  { id = "run", name = "A run moving as a unit", kind = "image" },
] }
[[review.categories.items]]
id = "reject-illegal"
title = "An illegal run returns intact"
description = "A run dropped onto an illegal target is rejected and returns to its source column intact."
validation = { script = "validation/runs/reject-illegal.mjs", outputs = [
  { id = "reject", name = "An illegal run returning intact", kind = "image" },
] }
[[review.categories.items]]
id = "king-run-empty"
title = "A King-headed run onto an empty column"
description = "A run headed by a King moves onto an empty column (the empty-column rule applies to the run's head)."
validation = { script = "validation/runs/king-run-empty.mjs", outputs = [
  { id = "king-run", name = "A King-headed run on an empty column", kind = "image" },
] }

