[[review.categories]]
id = "color"
title = "Color"
[[review.categories.items]]
id = "suit-distinction"
title = "Red and black suits are distinct"
description = "Red-suit and black-suit cards render in clearly distinct colors, so a card's color is readable at a glance."
validation = { script = "validation/color/suit-distinction.mjs", outputs = [
  { id = "suits", name = "A red card beside a black card", kind = "image" },
] }
[[review.categories.items]]
id = "card-back"
title = "Card back is distinct"
description = "A face-down card back renders in a color clearly distinct from a face-up card face and from the table felt."
validation = { script = "validation/color/card-back.mjs", outputs = [
  { id = "back", name = "A face-down back beside a face-up card and the felt", kind = "image" },
] }
[[review.categories.items]]
