[[review.categories]]
id = "tableau"
title = "Tableau"
[[review.categories.items]]
id = "build-down"
title = "Builds down, alternating color"
description = "A card is accepted onto a face-up card one rank higher and of the opposite color."
validation = { script = "validation/tableau/build-down.mjs", outputs = [
  { id = "build", name = "A tableau build-down move", kind = "image" },
] }
[[review.categories.items]]
id = "reject-same-color"
title = "Rejects the same color"
description = "A one-lower card of the same color is rejected — the build must alternate color."
validation = { script = "validation/tableau/reject-same-color.mjs", outputs = [
  { id = "same-color", name = "A same-color build rejected", kind = "image" },
] }
[[review.categories.items]]
id = "reject-rank"
title = "Rejects the wrong rank"
description = "An opposite-color card that is not exactly one lower in rank is rejected."
validation = { script = "validation/tableau/reject-rank.mjs", outputs = [
  { id = "rank", name = "A wrong-rank build rejected", kind = "image" },
] }
[[review.categories.items]]
id = "king-to-empty"
title = "King onto an empty column"
description = "A King is accepted onto an empty column."
validation = { script = "validation/tableau/king-to-empty.mjs", outputs = [
  { id = "king", name = "A King placed on an empty column", kind = "image" },
] }
[[review.categories.items]]
id = "reject-nonking-empty"
