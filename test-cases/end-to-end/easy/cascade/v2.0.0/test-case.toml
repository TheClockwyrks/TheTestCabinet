slug = "cascade"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Cascade"

# Relative difficulty (easy | medium | hard), surfaced on the site. Cascade asks
# for a full deck model, legal-move validation across foundations and tableau,
# drag-and-drop of single cards and ordered runs, an auto-move to foundation, win
# detection, a physics-driven victory animation, and the menus and states that tie
# it together — a contained front-end build, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["cards", "solitaire", "klondike", "2d"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file); NOT seeded into a run.
summary = """
A green-felt Klondike solitaire built from the classic rules, capped by a \
physics-driven victory cascade — every foundation card bouncing off the table \
and painting the screen when you win."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. It injects absolute in-container paths via template variables
# rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Cascade is a medium build with several interacting systems (rules,
# drag-and-drop, the win animation), so two hours is comfortable headroom for a
# healthy build while still bounding a runaway session.
max_runtime_hours = 2.0

# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Each seeds the common specs plus its own deal-mode
# spec (a flat `specs/deal-mode-<slug>.md` source seeding to the stable
# `specs/deal-mode.md`, the only path ever seeded), declares its own `title` menu
# mockup (the menu shows the deal mode), and the
# review item for its turn count. The two differ in the stock's
# turn count and how the waste is shown, so each also declares its own `gameplay`
# mockup; only the `victory` view is common to both.
#   - draw-three — the classic Klondike deal (turns three; the default).
#   - draw-one   — the gentler deal (turns one; more winnable).
# This list is a root key, so it must precede the first table header (`[build]`).
variants = [
  "variants/draw-three.toml",
  "variants/draw-one.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced
# into `dist/`, `build/`, or `out/`. `npm ci` requires a committed
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. Both commands are required — there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named
# once here so a review item's `validation` driver (and the validator that runs it)
# knows which `window` global to drive. The seeded specification documents the same
# handle independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded.
[instrumentation]
handle = "__cascade"
# The fixed simulation rate, in Hz. Cascade's one time-driven system is the victory
# cascade, and its debug API advances that system in whole simulation ticks
# (`step(ticks)`) rather than in seconds, so there is no rounding and no ambiguity
# about what a step means. This is the rate the validation runtime uses to relate
# that exact stepping back to real time — one tick is 1/120 of a second, so a second
# of game time is 120 ticks. It must match the timestep `specs/victory.md` mandates.
tick_hz = 120

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern so that the deal-mode
# material can be seeded per variant (see the variant files). These seven files
# are always present, so the deal-mode spec may reference them freely; the common
# specs, in turn, refer to the deal-mode spec by its seeded path
# (`specs/deal-mode.md`), the stable dest every variant's deal-mode source seeds
# to, so a run only ever sees the single deal mode that is actually present.
#
# Every common spec is plain Markdown, seeded verbatim (no `.hbs`; none of their
# text varies by variant or version).
# A spec's `dest` defaults to its `source` (with a trailing `.hbs` stripped), so
# these need only name the source they seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/table.md"

[[spec]]
source = "specs/rules.md"

[[spec]]
source = "specs/states.md"

[[spec]]
source = "specs/victory.md"

# The debugging and automation surface every variant must expose: a deterministic,
# seedable, render-free core; a `window.__cascade` API to drive and inspect the
# game from code; and a read-only debug overlay. Seeded for every variant and
# framed as an ordinary developer affordance of the game.
[[spec]]
source = "specs/instrumentation.md"

# Proof of implementation: instructs the build to capture evidence (screenshots
# and the cascade clip) at the exact paths the `[[proof]]` entries below declare.
# The paths in this spec and in the `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl builds — the
# authored, correct games under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. References are not validated unless a `[[check]]` below
# names them. The `title` and `gameplay` views are variant-specific (declared per
# variant above): the menu shows the active deal mode, and the waste is fanned
# (Draw Three) or a single card (Draw One). Only `victory` looks the same in every
# variant, so it is common.
[[reference]]
view = "victory"
media = "reference/screenshots/victory.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to as evidence; `specs/proof.md` instructs the build to produce
# them at exactly these paths. Validation records whether each turned up
# (informational — a missing proof does not fail the run), and a reviewer pairs
# each with its expected reference (see the review items that carry `reference` /
# `proof` links below). The media
# kind is inferred from the extension: `.png` is an image, `.webm` a video (the
# format Playwright records natively; the public gallery transcodes it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "Gameplay"
dest = "proof/gameplay.png"

[[proof]]
id = "win"
name = "Win screen"
dest = "proof/win.png"

[[proof]]
id = "cascade"
name = "Victory cascade clip"
dest = "proof/cascade.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. A reviewer rates each independently while playing the build,
# and the run's overall rating is the worst across them. Cascade is a single
# solitaire game, so it declares one domain.
[[domain]]
id = "klondike"
name = "Klondike Play"
description = "The full game: dealing, legal moves across the tableau and foundations, the stock and waste, winning, and the victory cascade."

# Reviewer checklist, common to every variant, in the categories grammar
# (`[review] format = 2`). Each `[[review.categories]]` is a CATEGORY — a bare name
# grouping the points a reviewer grades — and each `[[review.categories.items]]`
# under it is one graded review item, worth one point (the default weight), so a
# category is worth the number of items it holds (no fractional scoring). A category
# carries no prose of its own; each item states its own requirement in
# `description`. Categories are common to every variant here; the per-variant point
# (the deal-mode turn count) lives in that variant's own file, which reuses the
# `stock` category id to add it. The checklist is reporter-side material — never
# seeded into a run, so the model never sees it; each item restates a requirement the
# seeded specification already states. An item with a `validation` script is decided
# automatically (the reviewer can override); one without is judged by a person.
#
# The items judged by eye (no validation script) are the two under UI that concern
# the look of the table — the window fit and the card legibility. Everything else is
# a single, observable rule the debug API can establish and read back, so each such
# item carries a `validation` script and a synthesized image or clip. The taxonomy is
# deliberately narrow — one observable behavior per item, with every edge case (each
# rejection, each boundary) split into its own item — so a build fails exactly the
# rule it breaks rather than a broad item averaging several behaviors together.
[review]
format = 2

# --- Deal ---------------------------------------------------------------------
# The opening deal is checked as four separate facts — the tableau shape, the stock
# size, the empty piles, and the reshuffle — so a build that gets one wrong fails
# only that one.
[[review.categories]]
id = "deal"
title = "Deal"
[[review.categories.items]]
id = "columns"
title = "Seven columns of 1..7, top card face-up"
description = "A new game deals seven tableau columns holding 1, 2, ... 7 cards, with exactly the top card of each face-up and the rest face-down."
reference = "gameplay"
# Automated validation: deal a fresh game and read the tableau back. See
# validation/deal/columns.mjs.
validation = { script = "validation/deal/columns.mjs", outputs = [
  { id = "layout", name = "The freshly dealt tableau", kind = "image" },
] }
[[review.categories.items]]
id = "stock-count"
title = "Twenty-four cards in the stock"
description = "After the tableau takes its 28 cards, the remaining 24 form the face-down stock."
validation = { script = "validation/deal/stock-count.mjs", outputs = [
  { id = "stock", name = "The face-down stock after the deal", kind = "image" },
] }
[[review.categories.items]]
id = "empties"
title = "Waste and foundations start empty"
description = "A fresh deal leaves the waste and all four foundations empty."
validation = { script = "validation/deal/empties.mjs", outputs = [
  { id = "empties", name = "Empty waste and foundations after the deal", kind = "image" },
] }
[[review.categories.items]]
id = "reshuffled"
title = "Reshuffled every new game"
description = "The deal is reshuffled and different every new game (the shuffle is seedable, so a given seed reproduces its deal)."
validation = { script = "validation/deal/reshuffled.mjs", outputs = [
  { id = "deal", name = "A shuffled deal", kind = "image" },
] }

# --- Foundations --------------------------------------------------------------
# Foundation building is checked as an acceptance plus three distinct rejections, so
# a build that accepts the wrong card fails exactly the rule it breaks.
[[review.categories]]
id = "foundations"
title = "Foundations"
[[review.categories.items]]
id = "ace-only"
title = "Empty foundation takes only an Ace"
description = "An empty foundation accepts an Ace and rejects any other rank."
validation = { script = "validation/foundations/ace-only.mjs", outputs = [
  { id = "ace", name = "An Ace accepted onto an empty foundation", kind = "image" },
] }
[[review.categories.items]]
id = "build-up"
title = "Builds up by suit"
description = "On a started foundation, the next-higher card of the same suit is accepted (Ace, then 2, then 3, ...)."
validation = { script = "validation/foundations/build-up.mjs", outputs = [
  { id = "build", name = "A foundation built up by suit", kind = "image" },
] }
[[review.categories.items]]
id = "reject-offsuit"
title = "Rejects the wrong suit"
description = "A next-rank card of the wrong suit is rejected — a foundation is a single suit."
validation = { script = "validation/foundations/reject-offsuit.mjs", outputs = [
  { id = "offsuit", name = "A wrong-suit card rejected", kind = "image" },
] }
[[review.categories.items]]
id = "reject-gap"
title = "Rejects a rank gap"
description = "A same-suit card that skips a rank is rejected — the foundation builds up strictly by one."
validation = { script = "validation/foundations/reject-gap.mjs", outputs = [
  { id = "gap", name = "A rank-skipping card rejected", kind = "image" },
] }

# --- Tableau ------------------------------------------------------------------
