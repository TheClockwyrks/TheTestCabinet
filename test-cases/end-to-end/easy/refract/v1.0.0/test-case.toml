# --- Board and rendering ------------------------------------------------------
# Where everything sits and how it reads. The geometry is the one part of
# Refract's appearance the specification does fix, because every pointer position
# in the game is measured against it: a board drawn off the cell centers makes the
# hit radius wrong and the game unplayable. The rest of these points are the
# legibility floor the player depends on to read a board at all, decided from the
# pixels the build actually renders — samples at known cell centers against a
# background sample, with every threshold stated in the item. The palette itself
# is the build's, and how good the bench looks is the aesthetic rating's.
