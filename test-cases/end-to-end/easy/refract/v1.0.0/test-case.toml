# THE DIFFICULTY FLOOR, ONE MEASURE PER POINT. specs/modes/cascade.md defines
# five measures and bounds each of them per tier, and they are five different
# pieces of generator work — shared crystals is a placement property, the
# determined share needs the whole solution set enumerated — so each is its own
# point and a failed grade names the measure the generator missed. Each of the
# five poses five boards at every tier through generateBoard, recomputes the
# measures with the oracle's own enumeration (metrics.ts, derived from
# specs/modes/cascade.md and specs/beams.md alone), and holds each board against
# ITS OWN bound in the row of the tier it was generated at. The enumeration stops one past the tier's
# solutions bound, which is a measurement reporting a board over its bound; a
# separate expansion budget is a runaway stop, and a board the budget abandons is
