# --- Presentation -------------------------------------------------------------
# This case fixes no palette, no font, no node artwork, no beam rendering and no
# background on purpose, so there is nothing to compare a build against, and the
# two points here are the two presentation facts the specification does fix: the
# stage fitted whatever the window is, and the readouts clear of the board. The
# fit is graded under `none` alone, because under an engine the engine derives
# it and every build on that engine gets the same answer; the readouts are the
