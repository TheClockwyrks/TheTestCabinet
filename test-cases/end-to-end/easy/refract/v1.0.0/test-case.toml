# pointer is a mouse, a pen, or a finger. The targets a screen carries are
# reported by the debug surface, so the geometry a player aims at is checked
# directly rather than inferred from what happened to be drawn: a build whose
# targets are the right size, do not overlap, and sit where its own hit test
