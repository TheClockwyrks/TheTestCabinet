# --- The ruleset --------------------------------------------------------------
# One point per limit and per completion condition, with R6 Endpoints and R7
# Coverage sharing a point because a beam that satisfies one and not the other is
# not a finished beam, and R5's three capacities split into three points because
# an emitter, a lens, and a crystal are each mis-capped in a different way. Each
# limit is checked by attempting a violating move and asserting refusal — the beam
# unchanged, the trace still live — on a board posed via loadBoard in the notation
# specs/board.md defines; each completion condition is read back from the derived
# fields. R5's crystal clause, where the charge is spent on entry, is the subtlest
# thing in the game, so the refused move into a spent crystal gets a point of its
# own.
[[review.categories]]
id = "ruleset"
title = "The ruleset"
[[review.categories.items]]
id = "r1-adjacency"
title = "R1 Adjacency"
description = "A segment joins two different nodes whose cells differ by at most 1 in column and at most 1 in row: a move to a node two columns from the live end is refused, and a sweep across an empty cell adds nothing."
domains = ["campaign", "cascade"]
failure_cap = "scuffed"
validation = { script = "ruleset/r1-adjacency.test.ts", outputs = [
  { id = "refused", name = "The beam unchanged by the non-adjacent move", kind = "image" },
] }
