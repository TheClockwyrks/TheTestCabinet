# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "refract"

# Human-readable display name for this test case.
name = "Refract"

# Relative difficulty of this case, surfaced on the site. Refract is a great deal
# of *work* — a rules engine, a board generator, twenty-four hand-built boards and
# two modes — but none of it is hard to reason about: the rules are stated as nine
# numbered conditions over a grid of at most 7x6 cells, there is no physics, no
# opponent, and no real-time contest to tune. Difficulty here rates how demanding
# the *thinking* is, not how long the build takes, and `max_runtime_hours` below
# is where the size of the job is accounted for. So easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["puzzle", "logic", "2d", "light"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A puzzle of light on a dark optical bench, where a beam is drawn from node to \
node with the pointer and the rules silently refuse any move that breaks them."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected engine) and handed to the model as
# the build instruction. It injects absolute in-container paths through template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Refract asks for substantially more construction than a
# single real-time loop does: a rule engine that decides every move against nine
# conditions, a pointer tracing model with grab, shorten and retract behavior, a
# seeded generator that must never emit an unsolvable board, twenty-four fixed
# boards transcribed exactly, two modes with six screens between them, and — under
# the engineless run — the whole runtime layer beneath all of that. Three hours is
# comfortably more than a healthy build of that size needs while still catching a
# session that never terminates.
max_runtime_hours = 3

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies —
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine — and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Refract declares exactly ONE, so every run of this case is the same game.
#
# Campaign and Cascade are NOT variants. They are the two ways to play, chosen by
# the player from the title menu and reported by the state as `mode`, exactly as
# Carom's Solo and Versus are modes inside every variant rather than variants of
# their own. A variant is a difference in the *game a run is asked to build*; a
# mode is a difference in what the finished game offers its player. Both modes
# ship in every build, so nothing in the seeded spec set branches on the variant
# at all — the only axis the specs branch on is `engine.slug`, which changes what
# the build is handed rather than what it is asked to make.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on — the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics; one of them also owns rendering and the gameplay
# framework the game is written inside. It is a *run dimension*, chosen per run
# alongside the model, the harness, and the variant, and recorded on the run; it
# is not a property of the game.
#
# Refract supports three, and the game is the same under all of them. What differs
# is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop, the canvas fit, the keyboard and
#                     pointer input, the audio, the overlay and the
#                     `window.__refract` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around it (`src/constants.ts`, `src/main.ts`, and the
#                     `src/game.ts` the build writes, debug surface included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes its
#                     game module — the game definition, its mode, its state and
#                     its actors — and the debug surface its instance's
#                     `initialize` returns.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable
# differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to *this game* under it —
# which surfaces the build still supplies, Refract's action list, and Refract's
# cue names — never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, and an `index.html`
# holding the canvas. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     keyboard and pointer input, audio, diagnostics overlay and
#                     `window.__refract` surface, and every figure the
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them) and
#                     `src/main.ts` (the browser entry). The build writes
#                     `src/game.ts`: the `RefractState`, the debug surface its
#                     `initialize` returns beside that state, and the game's
#                     update and render.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds the same two case-owned modules. The build writes
#                     `src/game.ts`: the game definition the engine drives — its
#                     mode, its live `RefractState`, and its actors — and the
#                     debug surface its instance's `initialize` returns.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`,
# `build/`, or `out/`. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. Both commands are required; there are no defaults, so every case states
# exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing —
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its
# scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__refract` once the game has initialized, so
# the handle is what a person opening the console of such a build finds. An engine
# run has NO global at all: the build writes the surface, its `initialize` returns
# it — beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` — and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view,
# its surface is written in the shape of `update` — a pose takes the current state
# and returns the next, applied through `engine.apply`, and a reading takes the
# state and returns what it read, called with `engine.state`. `structured-2d`
# holds the world live, so its poses take only their own arguments and act on it
# at the call, and its readings return plain data. One handle, three ways to reach
# the same operations.
#
# There is deliberately no `tick_hz`. Refract mandates no fixed timestep: every
# rate it has is per second and integrated against the delta time the frame hands
# it, and its pointer operations take effect the moment they are called rather than
# being sampled once per tick, so there is no case-wide step size to state. The key
# is optional precisely so a case clocked this way omits it.
[instrumentation]
handle = "__refract"

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. The single variant declares
# none of its own: there is one game here, so there is one spec set.
#
# The specification is decomposed by concern, and each file is self-contained
# enough to be read on its own while naming its siblings where a fact lives
# elsewhere: `overview.md` the game and the project it is built in, `board.md` the
# grid geometry and the notation boards are written in, `beams.md` the nine
# numbered rules, `controls.md` the pointer tracing model and the key actions,
# `state.md` what the game's state carries, `instrumentation.md` the debug and
# automation surface, `ui.md` the shared screens and the audio cues,
# `campaign-boards.md` the twenty-four fixed board layouts, and `modes/campaign.md`
# and `modes/cascade.md` the two ways to play.
#
# The two mode files are common specs like any other. Both modes ship in every
# build and both are reachable from the title menu, so both files are seeded into
# every run and each names the other where the game genuinely crosses between them
# (the title menu offers both, and the six screens are one union). What a mode file
# does not do is restate the other mode's rules; it points at the other file.
#
# Every `.hbs` source is rendered before it lands, and ONE axis is branched on:
# `engine.slug`, which selects what the build is handed and what it must write.
# `overview.md.hbs` (the runtime, what is implemented, where the figures come
# from), `controls.md.hbs` (where the pointer layer sits), `state.md.hbs` (the
# build's own shape versus the exact `RefractState` declaration each engine run
# writes), `instrumentation.md.hbs` (the global versus `engine.debug`, and the
# clock operations only an engineless build needs), `ui.md.hbs` (where cues are
# played), `showcase.md.hbs` (how motion is captured for the carousel) and the
# two mode files (how the state is referred to) all branch on it.
# Nothing branches on the variant. A spec's `dest` defaults to its `source` with a trailing
# `.hbs` stripped, so an `.md.hbs` source seeds to the same `.md` path and a plain
# `.md` source is seeded verbatim.
[[spec]]
source = "specs/overview.md.hbs"

# The board: cells, the cell center formula every position in the game derives
# from, the three node kinds and their silhouettes, the three channels, and the
# notation `campaign-boards.md` and the debug surface's `loadBoard` both speak.
# Seeded verbatim: nothing in it differs by engine.
[[spec]]
source = "specs/board.md"

# The ruleset: R1 through R5, the limits checked on every move, and R6 through R9,
# the completion conditions that decide when a beam is finished and when a board
# is solved. It is the heart of the case and is seeded verbatim.
[[spec]]
source = "specs/beams.md"

# How a player operates the game: the pointer targeting, the grab table, the drawn
# order a beam is held in, extending, retracting, releasing, clearing, and the
# registered key actions. It branches on the engine only to say which layer
# delivers the pointer: the engine on an engine run, the runtime layer the build
# writes on an engineless one.
[[spec]]
source = "specs/controls.md.hbs"

# The shape of the game's state. Under `simple-2d` this is the `RefractState`
# declaration the build writes into `src/game.ts` verbatim, stated by the case
# rather than by the seeded stub, and under `structured-2d` it is the equivalent
# declaration in that engine's idiom, a live `RefractState` class the world holds
# as its game state, written into `src/game.ts` verbatim as well. Under `none` the
# build owns the shape and the file lists only what the state must carry, because
# the rest of the specification is written against those facts.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a deterministic,
# render-free core; an API to drive and inspect the game from code through its own
# real input path; and a read-only debug overlay. Framed as an ordinary developer
# affordance of the game. It branches on the engine for how the surface is reached
# and for the clock operations only an engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The screens both modes share (`title`, `howto`, `playing`), how a mode is chosen,
# menu navigation, and the five audio cues.
[[spec]]
source = "specs/ui.md.hbs"

# The twenty-four fixed campaign boards, in the notation `board.md` defines. It is
# authoritative for every layout, so it is seeded verbatim and the build transcribes
# it exactly.
[[spec]]
source = "specs/campaign-boards.md"

# Campaign: the fixed course, its unlock rule, and the `select`, `solved` and
# `complete` screens it adds.
[[spec]]
source = "specs/modes/campaign.md.hbs"

# Cascade: the endless generated sequence, the generator's solvability contract,
# the tier ladder, and its `solved` screen.
[[spec]]
source = "specs/modes/cascade.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured (a gzipped recording from the engine's own draw-command
# recorder on an engine run, screenshots and a short clip under `none`); it seeds
# to `specs/showcase.md`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`.
#
# Refract deliberately fixes no palette, no font, no node artwork, no beam
# rendering and no background: the look of the optical bench is the build's own
# design, and `specs/board.md` and `specs/ui.md` say so in as many words. A
# reference view is a picture a build is compared AGAINST, so there is no honest
# one to seed here — every build is expected to look different, and a screenshot
# diff would score the build that copied the mockup best rather than the build that
# designed the best bench. What the specification does fix about appearance is
# stated as legibility a player depends on (a channel readable by silhouette as
# well as hue, a crystal's charges readable without counting, a beam visibly
# joining cell centers), and the Board and rendering validators below decide
# exactly that, from the pixels the build renders and against thresholds each
# item states — while how GOOD the bench looks is rated through the run-wide
# aesthetic rating, not scored here.
#
# `[[proof]]` is likewise empty: no proof media is asked of the build. Every piece
# of media a reviewer sees beside a verdict is captured by this case's own
# validation suites, from scenarios the case controls. The showcase spec above
# does ask for media, but as the game's own store-page presentation rather than
# as evidence any point is judged on. The automated load check still runs.

# Scoring domains. This case is on the engine format, so it is validator-rated:
# each domain's FUNCTIONAL rating is decided by the validators behind the point
# checklist below (every point names the domains its failure lowers and how far —
# see `domains` / `failure_cap` there), and the run's overall functional rating is
# the WORST across the domains — an immaculate Campaign cannot mask a Cascade that
# hands the player boards it cannot solve. The reviewer's judgement lives in the
# separate AESTHETIC rating: the look, the polish, and the feel — the designed
# bench, the legible copy, the boards worth solving — everything this case fixes
# no picture of.
#
# One domain per mode, because a build can plausibly get one right and the other
# wrong, plus the two things that cut across both: the tracing the whole game is
# operated by, and the presentation this case hands entirely to the build.
[[domain]]
id = "campaign"
name = "Campaign"
description = "The fixed course: the twenty-four boards, the select grid, and the sense of progress through the four sets."

[[domain]]
id = "cascade"
name = "Cascade"
description = "The endless sequence: whether the generated boards are worth solving and whether the difficulty climbs in steps a player can feel."

[[domain]]
id = "tracing"
name = "Tracing"
description = "How drawing a beam feels: targeting a node, sweeping a route, backing one out, and how a refused move reads in the hand."

[[domain]]
id = "presentation"
name = "Presentation"
description = "The look and sound of the optical bench, which this case leaves entirely to the build: the bench, the node forms, the beams, the screens, and the cues."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY — a bare name grouping the points — and
# each item entry under it is one graded review item, worth one point (the
# default weight), so a category is worth the number of items it holds.
# A category carries no prose of its own; each item states in `description` the
# claim its validator checks. The checklist is common to every run: there is one
# variant and the three engines produce the same game, so nothing here is
# conditional. It is reporter-side material — never seeded into a run, so the
# model never sees it. Every item restates a requirement the seeded specification
# already states, in the spec's own vocabulary and naming the spec's own
# constants, and every threshold a validator asserts is derived from a figure or
# rule in the specs plus a numeric tolerance stated in the item.
#
# EVERY point on this checklist carries a validation script, and every point is
# one observable behavior, so a build fails exactly the rule it breaks (a lens at
# capacity and a crystal at capacity are two points, not one). Each script is a
# vitest suite under `validation/<engine>/<category>/<item id>.test.ts`. The
# `<engine>` level is the ENGINE the suite is written against — a validator speaks
# one engine's vocabulary, so this case, which supports three, ships one directory
# per engine. `validation/none/` drives the build in Chromium through
# `window.__refract`, with a page-injected 2D-context recorder for the text and
# shape draws and an injected audio shim for the cues; `validation/simple-2d/` and
# `validation/structured-2d/` each run in process against their vendored engine,
# posing scenarios through the surface `engine.debug` returns, reading state back
# from the snapshot, audio from the engine's `cue:played` event, and drawing from
# the canvas pixels or the engine's own draw-command recorder. The three are the
# same scenarios; only how they reach the build differs. The directory for the
# run's engine is what gets staged into the built workspace at `validation/`.
#
# The suites pose boards through `loadBoard` in the notation `specs/board.md`
# defines and draw through `trace` and the pointer operations, all of which take
# effect the moment they are called, so even a whole campaign course walk costs
# milliseconds. Campaign progress has NO pose: a suite that needs a later course
# state really solves the boards, tracing routes precomputed from
# `specs/campaign-boards.md` under the `specs/beams.md` rules — derived from the
# specs, never copied from the reference. Cascade suites carry a solver derived
# from the specs alone, so a generated board is proven solvable by solving it.
#
# THE MEDIA a point declares is produced by its own suite, from the scenario the
# case controls. A `replay` output is a draw-command recording: the suite arms the
# recorder around the section the point is about — the segment appearing, the
# sweep, the solve — and never around the arrangement that got there. An `image`
# output is a single captured frame. Both are evidence beside the verdict rather
# than any part of it: a point passes or fails on its assertions alone.
#
# Nothing on this checklist asks a reviewer to judge how a screen looks.
# Appearance is rated through the run-wide aesthetic rating; the rendering points
# here assert only what the specification fixes about what is drawn — the cell
# geometry, the fill against the outline, a legibility floor stated as a pixel
# threshold — and capture the frame as evidence.
#
# EVERY point also carries `domains` and `failure_cap`, because this case is
# validator-rated: a point's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers — a Campaign point
# lowers only `campaign`, a tracing point only `tracing`, and an instrumentation
# point, which every suite in every domain drives through, lowers all four.
# `failure_cap` is the highest functional rating those domains may reach while the
# point fails; each domain gets the LOWEST cap among its failing points, and a
# domain with no failing point is flawless. The caps are graded by how much of the
# game a failure takes away: `broken` where the game cannot be played at all (no
# debug surface, a trace that cannot begin or extend, completion never detected, a
# mode that cannot be entered, a generator that deals a dead end); `scuffed` where
# a rule the game is built on is noticeably wrong (a limit not enforced, a grab
# row, boards not as written, a tier mis-shaped, a board that cannot be read);
# `passable` where the fault is a tolerance, an edge case or a secondary path (a
# wrap, a resting value, a replay path, a cue); and `great` where it is a cosmetic
# detail (a label, a menu nicety, the mute toggle). No point caps at `flawless`: a
# failure always costs.
[review]
format = 2

# --- Instrumentation ----------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# game is driven and inspected from code, and every other suite on this checklist
# poses its scenario through it. These points check that it is really there,
# really wired to the running game, and really deterministic — a surface that
# reports a plausible-looking object unconnected to what is on screen is the
# failure mode worth naming, and it also shows up as every other suite failing to
# run.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug and automation surface is present"
description = "Every operation specs/instrumentation.md names is present as a function on the surface — reached on the page as window.__refract in an engineless build and off engine.debug in an engine build — and the surface is live: loadBoard poses a board, trace draws a segment on it, and both the snapshot and the rendered canvas change."
domains = ["campaign", "cascade", "tracing", "presentation"]
failure_cap = "broken"
# Automated validation: reflect that every required operation is installed as a
# function (setAutoStep and advance under `none` alone), then prove liveness by
# posing a board, tracing a segment, and reading both the snapshot and the canvas
# back. See validation/<engine>/instrumentation/surface-present.test.ts.
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "state", name = "The driven in-game state", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed board carrying all three channels and a crystal, with a partial beam drawn, the snapshot reports version REFRACT_DEBUG_VERSION (1) and every field specs/instrumentation.md lists with its documented type — screen, mode, menuIndex, selectIndex, the four progress fields, the board, one beams entry per channel present, solved, tracing, pointer, muted, and simTime — with each node's x and y on the cell center formula in specs/board.md and spent, complete, and solved derived exactly as specs/beams.md states."
domains = ["campaign", "cascade", "tracing", "presentation"]
failure_cap = "broken"
# Automated validation: pose a board exercising every branch of the shape (three
# channels, a crystal, a partial beam) and hold each reported field against the
# documented shape and the derivations. See
# validation/<engine>/instrumentation/snapshot-shape.test.ts.
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The posed board the snapshot reports", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-resting-values"
title = "Fields the current mode does not use report their resting values"
description = "The shape is fixed whatever the mode: in Cascade, boardIndex is 0, solvedBoards is empty, unlockedCount is 1, and selectIndex is 0; in Campaign, solvedCount is 0 and tier is 1. No field goes missing."
domains = ["campaign", "cascade", "tracing", "presentation"]
failure_cap = "passable"
# Automated validation: reset into each mode in turn and read the other mode's
# fields against the resting-values table in specs/instrumentation.md. See
