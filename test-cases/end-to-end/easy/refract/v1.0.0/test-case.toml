# --- Cascade ------------------------------------------------------------------
# The endless sequence. The generator is where this mode's real work is: a board
# the player cannot finish is the one failure the sequence cannot absorb, because
# there is no way to skip it, so solvability is checked hardest and over many
# boards rather than one. The suites share a solver derived from the specs alone —
# constraint propagation over the limits in specs/beams.md — so a generated board
# is proven solvable by solving it, and the sweep that proves it also reads the
# ladder back.
