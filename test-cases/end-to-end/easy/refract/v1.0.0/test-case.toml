# --- Campaign -----------------------------------------------------------------
# The fixed course. The boards themselves are transcribed from
# specs/campaign-boards.md, which is authoritative for every layout, so the first
# course point is simply whether the build shipped the boards it was given rather
# than boards of its own invention — the single most likely shortcut in this mode.
# Campaign progress has no pose, so these suites reach later course states by
# REALLY solving boards: a shared harness helper traces routes precomputed from
# specs/campaign-boards.md under the specs/beams.md rules, derived from the specs
# and never copied from the reference. Traces are immediate, so a full course walk
# costs milliseconds.
