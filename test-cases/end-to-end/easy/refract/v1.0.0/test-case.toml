id = "cue-channel-complete"
title = "Channel-complete cue"
description = "The channel-complete cue plays exactly once on the frame a channel's beam becomes complete, alongside that same move's connect cue, each played once."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "audio/cue-channel-complete.test.ts", outputs = [
  { id = "complete", name = "The completing move whose cues are checked", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-solved"
title = "Solved cue"
description = "The solved cue plays exactly once on the frame the board becomes solved, and on no frame before it."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "audio/cue-solved.test.ts", outputs = [
  { id = "solve", name = "The solving move whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-clear"
title = "Clear cue"
description = "The clear cue plays exactly once on the frame the beams are cleared, when there was a segment to remove."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "audio/cue-clear.test.ts", outputs = [
  { id = "clear", name = "The clear whose cue is checked", kind = "replay" },
] }
[[review.categories.items]]
id = "cue-clear-silent"
title = "Clear on an empty board is silent"
description = "Clearing a board whose beams carry no segments emits nothing: the clear cue plays only when there was a segment to remove."
domains = ["presentation"]
failure_cap = "passable"
validation = { script = "audio/cue-clear-silent.test.ts", outputs = [
  { id = "silent", name = "The empty board the clear was fired on", kind = "image" },
] }
