# --- Audio --------------------------------------------------------------------
# The five cues. Under an engine the cues are the engine's: the game defines them
# and asks for them by name, the engine broadcasts a `cue:played` event on the
# frame each one is asked for, and a validator subscribes before the game
# initializes — so a cue is confirmed to fire on its event without an audio
# device, an unlock gesture, or anything to wait for. Under `none` the cue's name
# is not observable from outside the build, so an injected audio shim checks that
# a sound is emitted on the event's frame and on no frame before it. The sounds
# themselves are the build's, and are rated through the aesthetic rating.
