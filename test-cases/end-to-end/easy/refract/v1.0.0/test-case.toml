# --- Board and rendering ------------------------------------------------------
# Where everything sits and how it reads. The geometry is the one part of
# Refract's appearance the specification does fix, because every pointer position
# in the game is measured against it: a board drawn off the cell centers makes the
# hit radius wrong and the game unplayable. Every point here decides one thing off
# the rendered pixels — that the build drew something at the coordinates
# specs/board.md computes, or that what it drew changed when the state behind it
# changed. How a node, a beam or an empty cell LOOKS — the palette, the three
# silhouettes, outline against fill, a crystal's charge readout, how quiet a
# background is — is the reviewer's presentation rating and is decided nowhere
# here.
[[review.categories]]
id = "board"
title = "Board and rendering"
[[review.categories.items]]
id = "cell-geometry"
title = "Nodes sit on the cell centers the formula gives"
description = "On a posed 3x3 and a posed 7x6 board, every node's computed center carries something drawn: some pixel within NODE_R (30) of it differs from the board's own ground, with adjacent centers CELL_PITCH (96) apart on both axes and the grid centered on BOARD_CX, BOARD_CY (640, 392) whatever its dimensions, so the board does not drift as boards change size."
domains = ["tracing", "presentation"]
failure_cap = "scuffed"
# Automated validation: read the disc about every formula center on two board
# sizes and decide that the build drew there. Nothing is sampled off the board:
# specs/board.md leaves what sits behind and around it to the build, and how a
# node looks inside the disc is the reviewer's. See
# validation/<engine>/board/cell-geometry.test.ts.
validation = { script = "board/cell-geometry.test.ts", outputs = [
  { id = "board", name = "The posed boards whose centers are sampled", kind = "image" },
] }
[[review.categories.items]]
id = "crystal-charges-read"
title = "A crystal's charge count reads from its form"
description = "A 1-charge and a 3-charge crystal render differently within NODE_R (30) of one cell center: posed in turn at the same cell, the two regions differ at some paired sample, so the count is drawn rather than implied."
domains = ["presentation"]
failure_cap = "scuffed"
# Automated validation: pose a 1-charge crystal at one cell, read the disc about
# that center, pose a 3-charge crystal at the same cell, and compare the two
# readings sample against sample — the cell, its neighbours and the background
# are identical between them, so the only thing that moved is the charge count.
# The captured still is a third pose carrying both counts side by side, which is
# what a reviewer wants to look at. The spent half of specs/board.md's readout
# requirement carries no point of its own: every arrangement that moves a
# crystal's spent count also draws a beam over the region a script would read, so
