<!doctype html>
<!--
  Sunfront — match-over screen (common across variants).
  Rendered by the harness at 1280x720 as the `game-over` view target. The end card
  sits over a dimmed neutral viewport; the real build renders the frozen 3D
  battlefield behind it, so it is not faked here in flat CSS.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- dimmed viewport behind the end card -->
      <div class="overlay"></div>
      <div class="panel">
        <p class="panel-eyebrow">THE FRONT HOLDS</p>
        <h2 class="panel-title">VICTORY</h2>
        <p class="panel-sub">ENEMY BASE RAZED &middot; WAVE 14</p>
        <nav class="menu">
          <div class="menu-item selected">PLAY AGAIN</div>
          <div class="menu-item">MENU</div>
        </nav>
      </div>
    </div>
  </body>
</html>
