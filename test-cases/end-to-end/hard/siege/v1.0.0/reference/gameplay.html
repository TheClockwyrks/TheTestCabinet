<!doctype html>
<!--
  Siege — in-siege HUD (common across variants).
  Rendered by the harness at 1280x720 as the `gameplay` view target. This mockup is
  HUD-ONLY: it pins the HUD layout, palette, and type over a neutral dark viewport.
  The real build renders the WebGL/WebGPU 3D world (terrain, redoubt, the Scourge,
  the squad, the weapon viewmodel, and the artillery ground telegraph) behind this
  HUD itself — the flat CSS cannot depict that usefully, so it is deliberately not
  faked here. One example moment mid phase B. Exact values are illustrative.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- center crosshair -->
      <div class="crosshair"></div>

      <!-- performance overlay (toggled on) -->
      <div class="perf">
        <div><b>FPS</b> 58</div>
        <div><b>DRAWS</b> 41</div>
        <div><b>UNITS</b> 34</div>
      </div>

      <!-- survival clock + kills, top center -->
      <div class="hud-top">
        <div class="hud-clock">4:12</div>
        <div class="hud-kills">KILLS 128</div>
      </div>

      <!-- active redoubt status + health bar -->
      <div class="hud-redoubt">
        <div class="label">DEFENDING B</div>
        <div class="bar">
          <div class="fill" style="width: 54%; background: var(--hp-good)"></div>
        </div>
      </div>

      <!-- optional HUD cue: incoming artillery on the player -->
      <div class="hud-incoming">&#9888; INCOMING</div>

      <!-- squad panel: rifleman, machine gunner, medic, engineer -->
      <div class="squad">
        <h4>SQUAD</h4>
        <div class="member">
          <span class="chip rifle"></span><span class="name">RIFLEMAN</span>
          <span class="bar"><span class="fill" style="width: 82%"></span></span>
        </div>
        <div class="member">
          <span class="chip gunner"></span><span class="name">GUNNER</span>
          <span class="bar"><span class="fill" style="width: 61%"></span></span>
        </div>
        <div class="member">
          <span class="chip medic"></span><span class="name">MEDIC</span>
          <span class="bar"><span class="fill" style="width: 100%"></span></span>
        </div>
        <div class="member down">
          <span class="chip engr"></span><span class="name">ENGINEER</span>
          <span class="respawn">RESPAWN 0:12</span>
        </div>
      </div>

      <!-- health, bottom-left -->
      <div class="hud-health">
        <div class="num">76</div>
        <div class="bar"><div class="fill" style="width: 76%"></div></div>
      </div>

      <!-- ammo, bottom-right -->
      <div class="hud-ammo">
        <div class="mag">18 <small>/ 162</small></div>
        <div class="grenade">FRAG &times; 3</div>
      </div>
    </div>
  </body>
</html>
