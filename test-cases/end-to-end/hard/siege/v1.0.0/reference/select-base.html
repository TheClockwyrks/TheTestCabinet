<!doctype html>
<!--
  Siege — title screen (the `title` view, base variant).
  Rendered by the harness at 1280x720 as the deterministic view target and the
  screen shown on load: the SIEGE title, a tagline, and just two options — PLAY
  and HOW TO PLAY. No class or phase is chosen here: PLAY opens the starting-phase
  prompt and then drops the player into the game, where the class is picked on the
  in-game spawn UI (and can be changed on every respawn). Static.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="deploy">
        <div class="title">SIEGE</div>
        <div class="tagline">HOLD THE LINE UNTIL IT BREAKS</div>

        <div class="menu">
          <div class="menu-btn primary">PLAY</div>
          <div class="menu-btn">HOW TO PLAY</div>
        </div>
      </div>
      <div class="hint">
        WASD MOVE &middot; MOUSE AIM &middot; F3 PERF &middot; F4 WIREFRAME
      </div>
    </div>
  </body>
</html>
