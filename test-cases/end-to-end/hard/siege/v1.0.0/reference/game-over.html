<!doctype html>
<!--
  Siege — defeat screen (common across variants).
  Rendered by the harness at 1280x720 as the `game-over` view target. Shown when
  redoubt C falls: the run's survival time and total kills, with REDEPLOY and
  DEPLOY AGAIN. There is no "reached" line — a siege always ends at redoubt C, so
  it would carry no information. A dark, dimmed viewport sits behind the card.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- dimmed viewport behind the card -->
      <div class="overlay"></div>

      <div class="panel">
        <div class="panel-eyebrow">SIEGE OVER</div>
        <div class="panel-title">THE LINE HAS FALLEN</div>

        <div class="stat">
          <span class="k">SURVIVED</span>
          <span class="v accent">9:47</span>
        </div>
        <div class="stat">
          <span class="k">SCOURGE DESTROYED</span>
          <span class="v">271</span>
        </div>

        <div class="buttons">
          <span class="btn primary">DEPLOY AGAIN</span>
          <span class="btn">REDEPLOY</span>
        </div>
      </div>
    </div>
  </body>
</html>
