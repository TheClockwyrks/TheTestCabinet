validation = { script = "validation/conduction/movers-inert.mjs", outputs = [
  { id = "movers", name = "A mover staying cold beside a hot gun", kind = "image" },
] }

# --- The heat-averse Rime ----------------------------------------------------
[[review.categories]]
id = "rime"
title = "The Rime"
[[review.categories.items]]
id = "cold-slows-most"
title = "The Rime slows hardest when cold"
description = "A cold Rime cuts a unit's speed by its full cold-slow ceiling — it slows hardest when cold."
# Automated validation: a cold Rime hits a unit and its speed drops to about the
