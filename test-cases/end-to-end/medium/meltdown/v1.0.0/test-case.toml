# --- Audio -------------------------------------------------------------------
# All audio is synthesized with the Web Audio API (specs/ui.md — no audio files), so
# the validator reads the sources a build starts and confirms a distinct cue fires on
# each event. The build must not autoplay, so each check arms audio with a real
# gesture (a key press and a corner click — Meltdown is mouse-driven, so a build may
# unlock audio from a pointer rather than a key) first; the exact sound is the
# model's own, only that a cue plays is scored. Each mandated cue is its own review
# item so a build fails exactly the cue it omits. The muteable / never-fail-to-load /
# silent-until-interaction properties are reviewed by a person from play.
[[review.categories]]
id = "audio"
title = "Audio"
