  { id = "counts", title = "A selected placed tower shows its lifetime kills and total damage dealt" },
]

[[review_item]]
id = "surge-and-waves"
title = "Surge, waves, and the economy"
text = "The surge mixes Motes, Sprints, Hulks, Swarm packs, Drift flyers, and Core bosses (on the milestone waves — the midpoint and the finale), each with its trait, in large, dense waves; a leak costs lives, 0 lives ends the game, and clearing the final wave wins. The economy runs on kill bounties, wave bonuses, interest, and an early-send bonus — and the standard Medium start (250) affords an opening maze of about 16 basic Arc towers, so building and re-shaping a large maze is central to the game."
weight = 1
domain = "defense"

[[review_item]]
id = "opening-build"
title = "Untimed opening build phase"
text = "Before Wave 1 the opening build phase is untimed: it shows no countdown and never auto-starts, so the player can lay a full opening maze at leisure and presses Start (the wave control) to begin Wave 1 when ready. The between-wave build phases keep the up-to-15-second countdown, auto-start, and early-send bonus; the opening phase pays no early-send bonus."
weight = 1
domain = "defense"
sub_items = [
