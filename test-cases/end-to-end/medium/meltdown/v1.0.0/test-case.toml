# --- Upgrades ----------------------------------------------------------------
[[review.categories]]
id = "upgrades"
title = "Upgrades"
[[review.categories.items]]
id = "stronger-hotter"
title = "Upgrades run stronger and hotter"
description = "Upgrading an emitter makes it hit harder AND run hotter — a maxed emitter is a glass cannon that needs thermal support."
# Automated validation: an upgraded emitter shows higher damage at the same heat and
# heats faster when firing. See validation/upgrades/stronger-hotter.mjs.
validation = { script = "validation/upgrades/stronger-hotter.mjs", outputs = [
  { id = "upgrade", name = "A maxed emitter hitting harder and hotter", kind = "video" },
] }
[[review.categories.items]]
id = "geometry-unchanged"
title = "Size, redline, and radiators are unchanged"
description = "Upgrading leaves an emitter's footprint size, redline, and radiator layout the same — only its power and heat grow."
# Automated validation: size, redline, and radiator faces match before and after an
