] }
[[review.categories.items]]
id = "output-scales"
title = "The Sink's output rises with level"
description = "Upgrading a Sink increases its cooling, so a maxed Sink pulls heat down faster than a level-I one."
# Automated validation: a level-III Sink cools faster than a level-I Sink. See
