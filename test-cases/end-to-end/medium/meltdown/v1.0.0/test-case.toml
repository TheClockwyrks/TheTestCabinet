slug = "meltdown"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Meltdown"

# Relative difficulty (easy | medium | hard), surfaced on the site. Meltdown asks
# for multi-size, rotatable grid tower placement with live maze re-pathing, eight
# tower types each with distinct thermal behavior, a heat-to-damage plateau with a
# per-tower redline and a trip, a surface-cooling ("thermal blanket") model with
# radiator faces and conduction between neighbors, a thermostatic Forge and coolant
# Sink, upgrade and economy systems, several surge types including maze-ignoring
# flyers, a 20-wave progression with win and loss, and multiple states. The thermal
# simulation and the spatial heat-management it demands push it past the arcade
# cases; it is still a bounded, single-screen 2D build, so it sits at medium.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["strategy", "2d", "tower-defense"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
An open-field tower-defense game where your towers are also the walls, so you \
build the maze the surge must walk — and every emitter fires harder the hotter it \
runs, up to its redline, then trips if it overheats. Towers shed heat only through \
faces on open air, so pace heat across the floor: space and rotate your guns, run a \
core in its plateau, feed a sniper, hold the cryo line cold."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. Meltdown is a substantial build (grid maze and live pathing, eight
# towers, the heat/redline model, economy and upgrades, a 20-wave progression,
# multiple states), so it gets a full five hours.
max_runtime_hours = 5
# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This version offers a single `base` variant (the standard Containment defense on
# the one fixed floor), declared in its own file under `variants/`. It supplies the
# `title` view's menu screenshot; `mode-select`, `gameplay`, and `game-over` are
# common. Future
# versions/variants are expected to add alternate floors (a central reactor block,
# scattered cores) and rule twists as additional variants on top of this base.
# This list is a root key, so it must precede the first table header (`[build]`).
variants = ["variants/base.toml"]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Instrumentation: the debug-and-automation surface every build installs, named
# once here so a review item's `validation` driver (and the validator that runs it)
# knows which `window` global to drive. The seeded specification documents the same
# handle independently as an ordinary game debug feature (see
# specs/instrumentation.md); this entry is reporter-side and never seeded. It is
# required because review items below declare `validation` scripts.
[instrumentation]
handle = "__meltdown"
# The fixed simulation rate, in Hz. Meltdown's debug API advances time in whole
# simulation ticks (`step(ticks)`) rather than in seconds, so there is no rounding
# and no ambiguity about what a step means. This is the rate the validation
# runtime uses to relate that exact stepping back to real time — one tick is
# 1/60 of a second, so a second of game time is 60 ticks. It must match the
# timestep the seeded `specs/gameplay.md` mandates.
tick_hz = 60

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern. All common specs are
# plain Markdown, seeded verbatim.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/heat.md"

[[spec]]
source = "specs/towers.md"

[[spec]]
source = "specs/surge.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/economy.md"

[[spec]]
source = "specs/gameplay.md"

[[spec]]
source = "specs/ui.md"

[[spec]]
source = "specs/modes.md"

# The debugging and automation surface every build must expose: a deterministic,
# steppable core; a `window.__meltdown` API to drive and inspect the game from
# code; and a read-only debug overlay. Seeded for every variant and framed as an
# ordinary developer affordance of the game.
[[spec]]
source = "specs/instrumentation.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `media` is a screenshot
# captured (with Playwright) from this case's playable reference-impl build — the
# authored, correct game under `reference-impl/` — and served as-is (seeded into
# the run as a visual target, never rendered). See `reference/README.md` for how
# they are regenerated. The `title` view is variant-specific (declared per variant
# above); `mode-select`, `gameplay`, and `game-over` look the same in every variant.
[[reference]]
view = "mode-select"
media = "reference/screenshots/mode-select.png"

[[reference]]
view = "gameplay"
media = "reference/screenshots/gameplay.png"

[[reference]]
view = "game-over"
media = "reference/screenshots/game-over.png"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "mode-select"
name = "Mode select"
dest = "proof/mode-select.png"

[[proof]]
id = "gameplay"
name = "In-match"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "End screen"
dest = "proof/game-over.png"

[[proof]]
id = "heat"
name = "Heat-as-power clip"
dest = "proof/heat.webm"

[[proof]]
id = "siege"
name = "Maze and surge clip"
dest = "proof/siege.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless heat system
# cannot mask a maze that does not path, and vice versa. These qualitative
# per-domain ratings are separate from the point checklist below, which the
# categories grammar scores globally (a point attaches to no domain).
[[domain]]
id = "heat"
name = "Heat & Thermal Play"
description = "The signature: heat as power up to each tower's redline plateau, the trip as the sole failure, surface cooling through radiator faces (a boxed-in core bakes) with rotation and conduction, the thermostatic Forge and coolant Sink, the heat-averse Rime, and how spacing and orientation pace each tower's heat."

[[domain]]
id = "defense"
name = "Tower Defense"
description = "The TD core: towers-as-walls mazing and live re-pathing to the fixed opposite exhaust, the can't-seal rule, the tower roster and upgrades, the surge types and maze-ignoring flyers, and the economy and 20-wave progression."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY — a bare name (id + title) grouping the
# points a reviewer grades — and each `[[review.categories.items]]` under it is one
# graded review item worth one point (the default weight), so a category is worth
# the number of items it holds (no fractional scoring). Each item states a single
# observable requirement the seeded specification already states; the recorded
# verdict id is the composite `<categoryId>.<itemId>`. The checklist is
# reporter-side material — never seeded into a run.
#
# An item with a `validation` script is decided automatically (the reviewer can
# override); one without is reviewed by a person. The genuinely subjective points —
# the feel of the heat read, the art and layout of the screens, and everything
# under Audio — carry no script. A few UI captures carry a script only to REACH and
# capture a state (the auto-verdict confirms it is reachable); how it reads and
# lays out is still left to the reviewer.
[review]
format = 2

# --- Heat is power ------------------------------------------------------------
[[review.categories]]
id = "heat"
title = "Heat is power"
[[review.categories.items]]
id = "cold-feeble"
title = "A cold gun is feeble"
description = "A cold emitter fires at about 0.35x base damage — nearly useless — so an idle wall of cold guns is not a defense."
# Automated validation: pose an emitter's heat to 0 and read its live heat damage
# multiplier back (~0.35). See validation/heat/cold-feeble.mjs.
validation = { script = "validation/heat/cold-feeble.mjs", outputs = [
  { id = "cold", name = "A cold, low-power emitter", kind = "image" },
] }
[[review.categories.items]]
id = "climbs-to-redline"
title = "Damage climbs to the redline"
description = "An emitter's damage climbs on an accelerating curve with its heat, reaching 3.5x base at its per-tower redline (its max-efficiency mark)."
# Automated validation: sweep an emitter's heat from cold to its redline and read
# the heat multiplier climbing to ~3.5 at the redline. See
# validation/heat/climbs-to-redline.mjs.
validation = { script = "validation/heat/climbs-to-redline.mjs", outputs = [
  { id = "climb", name = "An emitter heating from feeble to full power", kind = "video" },
] }
[[review.categories.items]]
id = "plateau"
title = "The plateau above the redline"
description = "From the redline up to the 100 trip the multiplier holds flat at 3.5x — pushing past the redline adds trip risk, not more damage."
# Automated validation: read the heat multiplier at the redline, between the redline
# and 100, and just below 100 — all ~3.5. See validation/heat/plateau.mjs.
validation = { script = "validation/heat/plateau.mjs", outputs = [
  { id = "plateau", name = "Heat climbing past the redline while the multiplier holds at 3.5x", kind = "video" },
] }
[[review.categories.items]]
id = "glow-ramp"
title = "Glow tracks heat"
description = "A tower's glow tracks its heat from cold blue up to white-hot, so heat reads at a glance on the floor."
# Automated validation: sample the rendered pixels of the same tower cold and hot —
# the fill shifts from blue to warm/white. See validation/heat/glow-ramp.mjs.
validation = { script = "validation/heat/glow-ramp.mjs", outputs = [
  { id = "glow", name = "A tower glowing hotter", kind = "image" },
] }
[[review.categories.items]]
id = "inspector-read"
title = "Inspector shows damage and multiplier"
description = "The selected-tower inspector shows the current per-shot damage alongside the heat damage multiplier (e.g. x3.5) and the redline marker, so the climb and the plateau read directly."

# --- The trip ----------------------------------------------------------------
[[review.categories]]
id = "trip"
title = "The trip"
[[review.categories.items]]
id = "trips-at-100"
title = "Reaching 100 trips the tower"
description = "Driving an emitter's heat to 100 trips it offline (no damage) for its cooldown."
# Automated validation: drive a real firing emitter to 100 heat and confirm it
# trips (tripped, damage 0). See validation/trip/trips-at-100.mjs.
validation = { script = "validation/trip/trips-at-100.mjs", outputs = [
  { id = "trip", name = "An emitter overheating and tripping", kind = "video" },
] }
[[review.categories.items]]
id = "returns-cold"
title = "A tripped tower returns cold"
description = "After about five seconds offline a tripped tower comes back online cold (heat 0)."
# Automated validation: trip a tower, then step past the cooldown and confirm it is
# back online with heat 0. See validation/trip/returns-cold.mjs.
validation = { script = "validation/trip/returns-cold.mjs", outputs = [
  { id = "return", name = "A tripped tower coming back cold", kind = "video" },
] }
[[review.categories.items]]
id = "strobing-red"
title = "A tripped tower strobes red"
description = "While offline a tripped tower is drawn strobing red, so a gapped kill-box reads at a glance."
# Automated validation: sample the rendered pixels of a tripped tower — red
# dominates. See validation/trip/strobing-red.mjs.
validation = { script = "validation/trip/strobing-red.mjs", outputs = [
  { id = "strobe", name = "A tripped tower strobing red", kind = "video" },
] }
[[review.categories.items]]
id = "only-failure"
title = "The trip is the only failure"
description = "A tower is never destroyed or damaged by the surge — overheating is the only way it fails; surge walking past leaves it intact."
# Automated validation: drive units past a tower and confirm the tower persists,
# never removed or harmed. See validation/trip/only-failure.mjs.
validation = { script = "validation/trip/only-failure.mjs", outputs = [
  { id = "intact", name = "Surge passing an intact tower", kind = "video" },
] }

# --- Surface cooling ---------------------------------------------------------
[[review.categories]]
id = "cooling"
title = "Surface cooling"
[[review.categories.items]]
id = "open-faces-shed"
title = "Open faces shed heat"
description = "A hot tower with faces on open air cools itself down over time when not firing."
# Automated validation: pose a lone hot emitter and step with no target — its heat
# falls. See validation/cooling/open-faces-shed.mjs.
validation = { script = "validation/cooling/open-faces-shed.mjs", outputs = [
  { id = "shed", name = "A lone hot tower cooling off", kind = "video" },
] }
[[review.categories.items]]
id = "boxed-bakes"
title = "A boxed-in tower bakes"
description = "A firing emitter boxed in by neighbors on every face cannot shed its heat and bakes itself to the trip."
# Automated validation: box a firing emitter on all four faces and confirm it climbs
# to the trip. See validation/cooling/boxed-bakes.mjs.
validation = { script = "validation/cooling/boxed-bakes.mjs", outputs = [
  { id = "bake", name = "A boxed-in emitter baking to the trip", kind = "video" },
] }
[[review.categories.items]]
id = "radiator-better"
title = "Radiator faces shed better"
description = "The designated radiator (cyan-fin) faces shed heat far better than plain faces, so aiming them at open air cools a tower faster."
# Automated validation: with two faces blocked, an emitter whose radiator faces
# point at open air cools faster than one whose plain faces do. See
# validation/cooling/radiator-better.mjs.
validation = { script = "validation/cooling/radiator-better.mjs", outputs = [
  { id = "radiator", name = "Radiator faces cooling faster", kind = "video" },
] }

# --- Radiator faces and rotation ---------------------------------------------
[[review.categories]]
id = "rotation"
title = "Rotation"
[[review.categories.items]]
id = "aims-faces"
title = "Rotating aims the radiator faces"
description = "Rotating a tower 90 degrees turns its radiator faces, so the same tower placed at different rotations presents its cool faces in different world directions."
# Automated validation: place a tower at two rotations and read its world radiator
# faces rotate accordingly. See validation/rotation/aims-faces.mjs.
validation = { script = "validation/rotation/aims-faces.mjs", outputs = [
  { id = "faces", name = "Radiator faces at two rotations", kind = "image" },
] }
# There is deliberately no "rotation changes the outcome" point here. It used to sit
# between these two and made exactly the claim `cooling.radiator-better` already makes —
# that in the same spot, with the same faces blocked, a radiator face on the open air
# cools better than a plain one — differing only in how many faces it blocked. Two points
# scoring one behavior double-count it, and this category is about the CONTROL (that a
# quarter turn aims the faces, and that the choice is locked at placement); the thermal
# consequence of aiming them belongs with surface cooling, which is where it is checked.
[[review.categories.items]]
id = "locked"
title = "Orientation is locked at placement"
description = "A placed tower cannot be rotated — orientation is chosen on the held preview before placing, so the inspector offers no rotate action (re-aiming means selling and rebuilding)."

# --- The Forge ---------------------------------------------------------------
[[review.categories]]
id = "forge"
title = "The Forge"
[[review.categories.items]]
id = "warms"
title = "The Forge warms a cold gun"
description = "A Forge touching a cold emitter warms it up over time (it does not fire itself)."
# Automated validation: a cold emitter next to a Forge heats up when stepped. See
# validation/forge/warms.mjs.
validation = { script = "validation/forge/warms.mjs", outputs = [
  { id = "warm", name = "A Forge waking a cold gun", kind = "video" },
] }
[[review.categories.items]]
id = "caps-setpoint"
title = "The Forge never exceeds its setpoint"
description = "The Forge warms an emitter only toward its setpoint, never past it, so it can never push a gun to the trip on its own."
# Automated validation: an emitter fed by a Forge settles below the Forge's setpoint
# and never exceeds it. See validation/forge/caps-setpoint.mjs.
validation = { script = "validation/forge/caps-setpoint.mjs", outputs = [
  { id = "cap", name = "Heat settling below the setpoint", kind = "video" },
] }
[[review.categories.items]]
id = "setpoint-scales"
title = "The setpoint rises with level"
description = "Upgrading a Forge raises its setpoint, so a maxed Forge settles a fed gun hotter than a level-I one."
# Automated validation: a gun fed by a level-III Forge settles hotter than one fed
# by a level-I Forge. See validation/forge/setpoint-scales.mjs.
validation = { script = "validation/forge/setpoint-scales.mjs", outputs = [
  { id = "scales", name = "A stronger Forge settling a gun hotter", kind = "video" },
] }
[[review.categories.items]]
id = "inert"
title = "The Forge does not fire"
description = "The Forge has no heat of its own and deals no damage — it never fires at the surge."
# Automated validation: a Forge next to targets reports heat 0, damage 0, and never
# fires. See validation/forge/inert.mjs.
validation = { script = "validation/forge/inert.mjs", outputs = [
  { id = "inert", name = "A non-firing Forge beside the surge", kind = "image" },
] }

# --- The Sink ----------------------------------------------------------------
[[review.categories]]
id = "sink"
title = "The Sink"
[[review.categories.items]]
id = "cools"
title = "The Sink cools a gun"
description = "A Sink touching a hot emitter draws its heat down faster than open air alone (it does not fire itself)."
# Automated validation: a hot emitter cools faster with a Sink neighbor than
