validation = { script = "validation/sink/output-scales.mjs", outputs = [
  { id = "scales", name = "A stronger Sink cooling faster", kind = "video" },
] }
[[review.categories.items]]
id = "inert"
title = "The Sink does not fire"
description = "The Sink has no heat of its own and deals no damage — it never fires at the surge."
# Automated validation: a Sink next to targets reports heat 0, damage 0, and never
# fires. See validation/sink/inert.mjs.
validation = { script = "validation/sink/inert.mjs", outputs = [
  { id = "inert", name = "A non-firing Sink beside the surge", kind = "image" },
] }

# --- Conduction --------------------------------------------------------------
[[review.categories]]
id = "conduction"
title = "Conduction"
[[review.categories.items]]
id = "hot-to-cold"
title = "Heat conducts to a cooler neighbor"
description = "When two emitters touch, heat conducts from the hotter into the cooler across the shared edge — a cool tower against a hot one heats up even though it is not firing."
# Automated validation: a hot emitter and a touching cold one converge — the cold
# one heats, the hot one cools. See validation/conduction/hot-to-cold.mjs.
validation = { script = "validation/conduction/hot-to-cold.mjs", outputs = [
  { id = "conduct", name = "Heat spreading to a cool neighbor", kind = "video" },
] }
[[review.categories.items]]
id = "movers-inert"
title = "Movers do not conduct"
description = "The Forge and Sink have no heat of their own — a hot emitter touching one does not heat the mover up."
