[[review.categories.items]]
id = "degrades-with-heat"
title = "The slow degrades as the Rime heats"
description = "The Rime's slow fraction falls as it heats, degrading to nothing at the trip — it runs the heat rule backward."
# Automated validation: sweep the Rime's heat and read its slow fraction fall toward
