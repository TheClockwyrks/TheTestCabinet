# What the surface must NOT carry. specs/instrumentation.md gives muting to the
# runtime, so a build that added a pose for it would be silencing its own audio
# through a path no player has. Capped `great`: an extra debug operation costs a
# player nothing at the controls, and what a player's mute does is decided by
# controls.mute-key, controls.mute-control, hud.mute-read and audio.mute-silences.
