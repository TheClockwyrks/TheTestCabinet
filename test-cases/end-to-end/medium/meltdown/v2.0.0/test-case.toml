# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# engines a run may select, how the produced implementation is built and checked,
# and what a reviewer grades. The testing harness reads this file to resolve a
# `TestCaseVersion`.

# The case's stable identity: the definition-store key, recorded in every run.
slug = "meltdown"

# Human-readable display name for this test case.
name = "Meltdown"

# Relative difficulty of this case, surfaced on the site. Meltdown is a building
# game rather than a twitch one, and what makes it `medium` is the number of
# systems that must hold each other up at once: a maze that re-paths live under a
# grid of multi-size rotatable footprints, a two-phase thermal model in which
# every tower is coupled to its neighbours, a damage curve that plateaus and a
# trip that is the only failure, an economy with four income lines, and five
# modes over three difficulties. None of it is deep on its own; all of it
# together is a great deal to keep consistent. It is not `hard`, because every
# rule is stated as arithmetic over a grid and there is no physics, no opponent
# and no continuous collision to tune.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["strategy", "2d", "tower-defense"]

# Short site-facing abstract, shown on the test case card. Authored inline as
# plain text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
An open-field tower defense where the towers are the walls, so the maze is \
built rather than given, and every emitter fires harder the hotter it runs.
"""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"

# Required per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version. The site aggregates every
# version's entry, newest first, into the case's changelog. Like `description`,
# it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected engine) and handed to the model as
# the build instruction. It injects absolute in-container paths through template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. It exists so a stuck or runaway session cannot run unbounded, not to
# make the job tight. Meltdown asks for more construction than any arcade case in
# the catalogue: a tile grid with live re-pathing under multi-size rotatable
# footprints, eight towers each with its own thermal personality, a coupled
# two-phase heat model, six surge types including a flyer that ignores the maze,
# an economy, a twenty-wave progression, five modes, eight screens, a build panel
# with an inspector, and -- under the engineless run -- the whole runtime layer
# beneath all of it. Five hours is comfortably more than a healthy build of that
# size needs while still catching a session that never terminates.
max_runtime_hours = 5

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. It installs the seeded project's dependencies --
# the TypeScript toolchain the `[toolchain]` commands invoke, the headless canvas
# the model's own vitest tests can draw through, and, on an engine run, the
# vendored engine -- and downloads the Playwright Chromium build (the base image
# ships the OS libraries Chromium links against, but not the browser binary), so
# the model can build the game and look at it in a browser without any further
# setup.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Meltdown declares exactly ONE, so every run of this case is the same game.
#
# Containment, The Hundred, Deep Pockets, Bottleneck and Sudden Death are NOT
# variants. They are the five ways to play, chosen by the player from the mode
# menu and reported by the state as `mode`, exactly as Carom's Solo and Versus
# are modes inside every variant rather than variants of their own. A variant is
# a difference in the game a run is asked to BUILD; a mode is a difference in
# what the finished game offers its player. All five modes ship in every build,
# so nothing in the seeded spec set branches on the variant at all -- the only
# axis the specs branch on is `engine.slug`, which changes what the build is
# handed rather than what it is asked to make.
#
# This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The engines a run of this case may select. An engine is the runtime the produced
# game is built on -- the frame loop and the delta time it hands the game, the
# input actions a player drives it with, the audio bus, asset loading, and the
# on-screen diagnostics; one of them also owns rendering and the gameplay
# framework the game is written inside. It is a RUN DIMENSION, chosen per run
# alongside the model, the harness, and the variant, and recorded on the run; it
# is not a property of the game.
#
# Meltdown supports three, and the game is the same under all of them. What
# differs is how much of the build is handed over:
#   - `none`          supplies no runtime and no `src/` at all, so the build
#                     writes the frame loop, the canvas fit, the keyboard and
#                     pointer input, the audio, the overlay and the
#                     `window.__meltdown` surface itself.
#   - `simple-2d`     vendors the runtime as a package and seeds the modules
#                     around it (`src/constants.ts`, `src/main.ts`, and the
#                     `src/game.ts` stub the build replaces, debug surface
#                     included).
#   - `structured-2d` vendors its framework engine the same way and seeds
#                     `src/constants.ts` and `src/main.ts`; the build writes its
#                     game module -- the game definition, its instance, its mode,
#                     its state and its actors -- and the debug surface its
#                     instance's `initialize` returns. `src/game.ts` is
#                     deliberately absent, so the first `npx tsc --noEmit` on a
#                     freshly seeded workspace fails on the missing module, and
#                     that failure is the starting point.
# The game they describe is the same one, so the review items are the same for
# every engine and a score recorded under one is comparable with a score recorded
# under another; the specs and the validators branch where the deliverable
# differs.
#
# `none` supplies no package and therefore carries no version, so it is named in
# the bare `engines` list; `simple-2d` and `structured-2d` each carry a range and
# are named in `[[engine]]` tables. A range is pinned because a specification is
# written against a runtime contract: `min_version` is the 1.0.0 API the specs and
# the validators are written against, and there is deliberately no `max_version`,
# so a later 1.x or 2.x from the host package store is accepted as it lands.
# Widening or moving a range means a new case version, so the pin is the statement
# that THIS spec set matches THIS contract.
#
# What this declaration deliberately does NOT do is describe an engine. An engine
# ships its own documentation from its own package, and seeding puts it in the run
# for the model to read, so the specs seeded from this folder never restate an
# engine's API and never fall out of date when it changes. Where a spec speaks of
# the runtime it does so only to state what is specific to THIS game under it --
# which surfaces the build still supplies, Meltdown's action list, and Meltdown's
# cue names -- never to teach the runtime.
#
# `engines` is a root key, so it must precede the first table header.
engines = ["none"]

# ---- tables begin here; no root key may follow --------------------------------

[[engine]]
slug = "simple-2d"
min_version = "1.0.0"

[[engine]]
slug = "structured-2d"
min_version = "1.0.0"

# The starter project seeded into the root of every run before the specs, one per
# engine. All three carry the same Vite/TypeScript/ESLint/Prettier/Vitest
# configuration the `[toolchain]` commands below run against, and an `index.html`
# holding the canvas. What differs is how much of the build is supplied with them.
#
#   - `none`          supplies the configuration and nothing else. There is no
#                     `src/`: the build writes its own frame loop, canvas fit,
#                     keyboard and pointer input, audio, diagnostics overlay and
#                     `window.__meltdown` surface, and every figure the
#                     specification fixes, from the specs alone.
#   - `simple-2d`     declares the engine in its `package.json`, which is vendored
#                     in at seed time so the build imports it by its bare package
#                     name, and seeds the case-owned modules around the game:
#                     `src/constants.ts` (every figure this specification fixes,
#                     which a validator imports; the look is NOT among them),
#                     `src/main.ts` (the browser entry) and the `src/game.ts` stub
#                     whose `initialize`, `update` and `render` throw. The build
#                     replaces that stub: the `MeltdownState` declaration, the
#                     `MeltdownDebugApi` type, and the debug surface `initialize`
#                     returns beside the state as `[state, debug]`.
#   - `structured-2d` declares that engine in its `package.json` the same way and
#                     seeds `src/constants.ts` and `src/main.ts`. It seeds NO
#                     `src/game.ts`: `src/main.ts` imports it, so a freshly seeded
#                     workspace does not type-check until the build writes it.
#
# There is no `assets` key and no asset copy plugin in any of the three: Meltdown
# seeds no sprite art, no audio file and no data file. Every figure it fixes is
# in `src/constants.ts` and every pixel is drawn.
#
# The seeded files land at the run root (`workspaces/none/package.json` seeds to
# `package.json`).
[workspaces]
none = "workspaces/none"
"simple-2d" = "workspaces/simple-2d"
"structured-2d" = "workspaces/structured-2d"

# How validation (and the per-run static deploy) turns a produced implementation
# into a served site. These run verbatim from the build's repository root:
# dependencies are installed, then the static build is produced into `dist/`,
# `build/`, or `out/`. `npm ci` is deliberate -- it requires the build to commit a
# `package-lock.json`, so the validated build installs exactly what the deploy
# will. Both commands are required; there are no defaults, so every case states
# exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# The TypeScript toolchain run over the produced implementation once `[build]`'s
# install has completed. An end-to-end build is written in TypeScript, and the
# seeded workspace ships the configuration each of these commands reads
# (`tsconfig.json`, `eslint.config.js`, `.prettierrc.json`, `vitest.config.ts`), so
# what is checked here is the code the model wrote against configuration the case
# fixed. The commands run host-side over the collected tree after the run's
# container is gone, so a slow suite costs the run none of its runtime budget.
#
# `typecheck` GATES: a non-zero exit rates the run `broken`, because code that does
# not compile is not reviewable. The other three are recorded and gate nothing --
# `test` additionally records the count and coverage the build's own suite reports,
# which is how a build that ships tests is told apart from one that ships none.
# Each is spelled `npx` rather than `npm run <script>` so the check is the case's
# own statement of what is run and does not depend on the model leaving the seeded
# scripts intact. These four are exactly the commands `specs/overview.md` tells the
# build will be run over the finished repository.
[toolchain]
typecheck = "npx tsc --noEmit"
lint = "npx eslint ."
format = "npx prettier --check ."
test = "npx vitest run --coverage"

# Instrumentation: the debug-and-automation surface a build carries, named once
# here. It is reporter-side and never seeded; the seeded specification documents
# the surface independently, as an ordinary debugging feature the game needs (see
# specs/instrumentation.md). It is required because the review items below declare
# `validation` scripts, and the surface is what every one of them poses its
# scenario through.
#
# The handle names the ENGINELESS contract. An engineless build writes the surface
# itself and installs it on `window.__meltdown` once the game has initialized, so
# the handle is what a person opening the console of such a build finds. An engine
# run has NO global at all: the build writes the surface, its `initialize` returns
# it -- beside the state as `[state, debug]` under `simple-2d`, alone under
# `structured-2d` -- and a caller reads it back off `engine.debug`. Because
# `simple-2d` holds the state by value and hands every reader a read-only view,
# its surface is written in the shape of `update` -- a pose takes the current state
# and returns the next, applied through `engine.apply`, and a reading takes the
# state and returns what it read, called with `engine.state`. `structured-2d`
# holds the world live, so its poses take only their own arguments and act on it
# at the call, and its readings return plain data. One handle, three ways to reach
# the same operations.
#
# There is deliberately no `tick_hz`. v1.0.0 mandated a 60 Hz fixed timestep and
# advanced the surface in whole ticks; v2.0.0 drops both. Every rate in Meltdown
# is per second and is integrated against the delta time the frame hands it, the
# thermal model resolves from the heats a frame opened on rather than from a tick
# boundary, and the clock operations take seconds rather than ticks -- so there is
# no case-wide step size to state. The key is optional precisely so a case clocked
# this way omits it.
[instrumentation]
handle = "__meltdown"

# The specs. Every one of these is a COMMON spec, seeded for EVERY run of this
# case, at the `dest` path within the run workspace. The single variant declares
# none of its own: there is one game here, so there is one spec set.
#
# The specification is decomposed by concern, and each rule lives in exactly one
# file. A sibling is referred to by file name in plain text, never as a link, so
# the set reads the same in a run container as it does here.
#
# Every `.hbs` source is rendered before it lands, and ONE axis is branched on:
# `engine.slug`, which selects what the build is handed and what it must write.
# Nothing branches on the variant. A spec's `dest` defaults to its `source` with a
# trailing `.hbs` stripped, so an `.md.hbs` source seeds to the same `.md` path
# and a plain `.md` source is seeded verbatim.

# What the game is and what the finished build must be: the premise, the hard
# requirements, the fixed 1280x720 stage and its two regions, the centre
# convention every reported position follows, the legibility table -- which is all
# this case fixes about the look -- and what is out of scope. It branches on the
# engine for what the runtime supplies against what the build writes, and for
# where the figures come from.
[[spec]]
source = "specs/overview.md.hbs"

# The geometry of the reactor floor, and the sole owner of the tile-to-stage map:
# the casing band, the 50x36 grid of 19-unit tiles at origin (18, 18), a
# footprint's anchor tile, the four openings and the exact rows and columns each
# spans, each vent's fixed opposite exhaust, the two tile states, and the build
# panel's strip. Seeded verbatim.
[[spec]]
source = "specs/floor.md"

# Towers as walls, and how the surge crosses the floor: the step rule, the route
# metric, live re-pathing, the never-seal rule stated as the exact predicate a
# placement is checked against, and the flyer that ignores all of it. Seeded
# verbatim.
[[spec]]
source = "specs/mazing.md"

# The signature system: the heat scale, the two-phase per-frame resolution every
# figure below it is measured against, thermal mass, the per-shot gain, surface
# cooling through radiator and plain edges, conduction, the Forge's thermostat and
# the Sink's drain, the damage curve and its plateau, and the trip stated as a
# CROSSING rather than a state. Seeded verbatim.
[[spec]]
source = "specs/heat.md"

# The eight towers as data: the stat table, the three footprint sizes and how a
# footprint is anchored, radiator faces given in local orientation and what a
# placement rotation does to them, and the per-level upgrade multipliers. Seeded
# verbatim.
[[spec]]
source = "specs/towers.md"

# What an emitter does to a surge unit: range, the target rule, the fire clock and
# its catch-up, per-shot damage stated once for every emitter WITH NO EXEMPTION,
# the Flak's air-only targeting, the Bloom's splash, the Rime's slow and the
# one-slow-per-unit refresh rule, and the per-instance tallies. Seeded verbatim.
[[spec]]
source = "specs/combat.md"

# What a player does to a tower: arming, the preview and its valid/invalid
# predicate in full, rotation on the held preview only, placing, cancelling,
# selecting, upgrading and selling with the refund and the freshness rule. Seeded
# verbatim.
[[spec]]
source = "specs/building.md"

# The intruders: the six types and their base HP, speed, slowability, flight,
# bounty and leak value, and what removes a unit from the floor. It does NOT own
# the slow rule -- that belongs to specs/combat.md, which owns the figure that
# decides it. Seeded verbatim.
[[spec]]
source = "specs/surge.md"

# The run: the three phases and their clocks, the wave progression as closed
# forms, the spawn cadence and the per-unit vent draw, the per-wave HP scaling, what
# clears a wave, victory and loss, and what pausing and the speed toggle do to the
# simulation. Seeded verbatim.
[[spec]]
source = "specs/waves.md"

# Money and score: bounties, the wave-clear bonus, interest and its cap computed
# after that bonus, the early-send bonus, the floor at zero, and the three score
# terms. Seeded verbatim.
[[spec]]
source = "specs/economy.md"

# The five modes and the three difficulties, as one derived-figures table:
# starting money, wave count, starting lives, interest, build phases and build
# zone, with the rule that a mode changes only what its row states. Seeded
# verbatim.
[[spec]]
source = "specs/modes.md"

# How the game is operated: the pointer model, every keyboard action and the key
# bound to it, the Escape precedence rule, and the touch path. It branches on the
# engine for whether the actions are registered against the engine's input layer
# or the build listens to the keyboard itself.
[[spec]]
source = "specs/controls.md.hbs"

# The build panel and the on-floor reads: the status readouts, the shop's eight
# entries and their disabled state, the hover info panel, the selected-tower
# inspector, the next-wave preview, the wave controls, the mute read, the
# on-footprint heat read and the per-unit health bars. Seeded verbatim.
[[spec]]
source = "specs/hud.md"

# The eight screens and their menus: what each must contain, how each is navigated,
# that a menu highlight WRAPS at both ends, and what the two end screens report.
# Seeded verbatim.
[[spec]]
source = "specs/screens.md"

# The ten cues and the event each answers, that a cue is raised by the frame that
# resolves its event, that audio is synthesized rather than loaded, and that
# nothing plays before the first interaction. It branches on the engine for where
# cues are defined and played and whose mute bit is toggled.
[[spec]]
source = "specs/audio.md.hbs"

# The declared state. Under `none` this lists what the state must carry; under
# `simple-2d` it is the exact `MeltdownState` declaration the build writes into
# `src/game.ts` verbatim; under `structured-2d` it is the equivalent live
# `MeltdownState` class extending the engine's `GameState`.
[[spec]]
source = "specs/state.md.hbs"

# The debugging and automation surface every build must expose: a render-free
# core; every operation by name, signature and effect, including the world gate,
# the vent pose, and the three faculty gates, each stated as gating ONE faculty
# and nothing else; what `reset` restores; the snapshot shape; the identity rules; and
# the read-only debug overlay. Framed as an ordinary developer affordance of the
# game. It branches on the engine for how the surface is reached, for the
# operation shape, and for the two clock operations only an engineless build owns.
[[spec]]
source = "specs/instrumentation.md.hbs"

# The showcase the finished game ships beside its source: a player-facing
# description and a short ordered carousel of captured media under `showcase/`,
# framed as the game's store-page presentation. It branches on the engine for how
# motion is captured (a gzipped recording from the engine's own draw-command
# recorder on an engine run, a clip under `none`); it seeds to
# `specs/showcase.md`.
[[spec]]
source = "specs/showcase.md.hbs"

# No `[[reference]]`, no `[[check]]`, and no `[[proof]]`.
#
# v1.0.0 seeded a canonical 27-entry palette, a monospace requirement and a set of
# rendered mockup screenshots as reference views. v2.0.0 seeds none of it, and
# dropping it is one of the things the major bump is for. Meltdown fixes no
# palette, no typeface and no panel layout: the look of the reactor is the build's
# own design, and `specs/overview.md` says so in as many words, stating instead a
# legibility table of what a player must be able to READ -- an emitter's heat
# along a ramp, a tripped tower apart from an online one, radiator faces apart
# from plain ones, the surge apart from every color a tower shows. A reference
# view is a picture a build is compared AGAINST, so there is no honest one to seed
# here: every build is expected to look different, and a screenshot diff would
# score the build that copied the mockup best rather than the build that designed
# the best reactor. The `presentation` items below decide exactly the legibility
# the table asks for, from the pixels the build renders, against an RGB distance
# each item states -- while how GOOD it looks is rated through the run-wide
# aesthetic rating, not scored here.
#
# `[[proof]]` is likewise empty: no proof media is asked of the build. Every piece
# of media a reviewer sees beside a verdict is captured by this case's own
# validation suites, from scenarios the case controls. The showcase spec above
# does ask for media, but as the game's own store-page presentation rather than as
# evidence any point is judged on. The automated load check still runs.

# Scoring domains. This case is on the engine format, so it is validator-rated:
# each domain's FUNCTIONAL rating is decided by the validators behind the item
# checklist below (every item names the domains its failure lowers and how far --
# see `domains` / `failure_cap` there), and the run's overall functional rating is
# the WORST across the domains -- an immaculate maze cannot mask a heat model that
# never trips. The reviewer's judgement lives in the separate AESTHETIC rating:
# the look, the polish and the feel -- the designed reactor, the legible panel,
# the glow ramp worth watching -- everything this case fixes no picture of.
#
# Four domains: the signature system, the tower-defense core it sits on top of,
# the frame around a match, and the presentation this case hands entirely to the
# build. A build can plausibly get any one of them right and another wrong.
[[domain]]
id = "heat"
name = "Heat & Thermal Play"
description = "The signature: heat as power up to each tower's redline plateau, the trip as the sole failure, surface cooling through radiator faces so a boxed-in core bakes, rotation, conduction, the thermostatic Forge and the coolant Sink, and the heat-averse Rime."

[[domain]]
id = "defense"
name = "Mazing & Defense"
description = "The tower-defense core: towers-as-walls mazing, live re-pathing to the fixed opposite exhaust, the never-seal rule, the tower roster and how it is built, targeting, damage, splash, slowing, and the surge that walks and flies through all of it."

[[domain]]
id = "run"
name = "The Run"
description = "The frame around a match: money and its four income lines, the build phases and their clocks, the wave progression and its scaling, lives and leaks, victory and loss, and the five modes."

[[domain]]
id = "presentation"
name = "Presentation"
description = "What the game looks and sounds like: the eight screens and their menus, the build panel and every readout on it, the on-floor reads, whether the look the build chose is legible and its states told apart, and the audio cues."

# Reviewer checklist, in the categories grammar (`[review] format = 2`). Each
# `[[review.categories]]` is a CATEGORY -- a bare name grouping the items -- and
# each item entry under it is one graded review item, worth one point (the default
# weight), so a category is worth the number of items it holds. A category carries
# no prose of its own; each item states in `description` the claim its validator
# checks. The checklist is common to every run: there is one variant and the three
# engines produce the same game, so nothing here is conditional. It is
# reporter-side material -- never seeded into a run, so the model never sees it.
# Every item restates a requirement the seeded specification already states, in
# the spec's own vocabulary and naming the spec's own constants, and every
# threshold a validator asserts is derived from a figure or rule in the specs plus
# a numeric tolerance stated in the item.
#
# EVERY item on this checklist carries a validation script, and every item is one
# observable behavior, so a build fails exactly the rule it breaks (a tower that
# sheds through a blocked face and a tower that does not conduct at a corner are
# two items, not one). Each script is a vitest suite under
# `validation/<engine>/<category>/<item id>.test.ts`. The `<engine>` level is the
# ENGINE the suite is written against -- a validator speaks one engine's
# vocabulary, so this case, which supports three, ships one directory per engine.
# `validation/none/` drives the build in Chromium through `window.__meltdown`,
# with a page-injected 2D-context recorder for the text and shape draws and an
# injected audio shim for the cues; `validation/simple-2d/` and
# `validation/structured-2d/` each run in process against their vendored engine,
# posing scenarios through the surface `engine.debug` returns, reading state back
# from the snapshot, audio from the engine's `cue:played` event, and drawing from
# the canvas pixels or the engine's own draw-command recorder. The three are the
# same scenarios; only how they reach the build differs. The directory for the
# run's engine is what gets staged into the built workspace at `validation/`.
#
# The suites pose their scenarios from ATOMS -- addTower, removeTower,
# setTowerHeat, addUnit, removeUnit, setUnitPosition -- through the compound
# helpers in `validation/<engine>/harness.ts`, never through an ACT the item is
# not about. A validator that merely wants a tower gone calls `removeTower`; a
# validator about what selling does calls `sellTower`. Every thermal expectation
# is computed by `validation/<engine>/thermal.ts` from the specification's own
# figures, and every route expectation by `routes.ts` from the specification's own
# metric, so no threshold on this checklist is a number a reference produced.
#
# THE MEDIA an item declares is produced by its own suite, from the scenario the
# case controls. `outputs` is declared ONCE here and serves all three engines: the
# extension an output is served under follows its `kind`. A `replay` output is a
# draw-command recording, armed around the section the item is about and never
# around the arrangement that got there; the eleven of them are exactly the items
# whose motion is worth scrubbing. An `image` output is a single captured frame,
# and an item declares two where the evidence is a before-and-after pair. Both are
# evidence beside the verdict rather than any part of it: an item passes or fails
# on its assertions alone.
#
# EVERY item also carries `domains` and `failure_cap`, because this case is
# validator-rated: an item's validator, not a reviewer, decides the functional
# rating. `domains` names the scoring domains a failure lowers -- a heat item
# lowers `heat`, a mazing item `defense`, and an instrumentation item, which every
# suite in every domain drives through, lowers all four. `failure_cap` is the
# highest functional rating those domains may reach while the item fails; each
# domain gets the LOWEST cap among its failing items, and a domain with no failing
# item is flawless. Three standing rules set the caps:
#
#   - A figure that is merely WRONG is not `broken`. A tower whose fire rate is
#     1.8 instead of 2.0 is still a game a player can play, so every
#     transcribe-the-table item is `passable`. `broken` is reserved for a rule
#     whose absence stops the game working: no heat curve, no trip, no pathing, no
#     placement, no wave clear.
#   - A DRAWING item is not `broken` because it matters. A panel missing its money
#     figure, a victory screen without a score, a mode list without names: each
#     leaves a game a player can start, play and finish, so every such item caps at
#     `scuffed`, or `passable` where the surface is optional. The exceptions are
#     the items that stand between a cold start and a live run, where the failure
#     makes a run unreachable.
#   - A SPECIAL MODE is an optional path. Every `modes.hundred-*`,
#     `modes.deep-pockets-*`, `modes.bottleneck-*` and `modes.sudden-death-*` item
#     caps at `scuffed`, because a player who never chooses that mode is
#     unaffected. Containment Medium is the standard flow and its items cap at
#     `broken`.
#
# No item caps at `flawless`: a failure always costs.
[review]
format = 2

# --- Instrumentation -----------------------------------------------------------
# The debug surface is a deliverable of the build, not a courtesy: it is how the
# game is driven and inspected from code, and every other suite on this checklist
# poses its scenario through it. These items check that it is really there, really
# wired to the running game, and really render-free, and that each of the four
# gates it carries gates ONE faculty and leaves the rest running. A surface that
# reports a plausible-looking object unconnected to what is on screen is the
# failure mode worth naming, and it also shows up as every other suite failing to
# run.
[[review.categories]]
id = "instrumentation"
title = "Instrumentation"
[[review.categories.items]]
id = "surface-present"
title = "The debug surface is present and complete"
description = "Every operation specs/instrumentation.md names is a function on the surface, version is MELTDOWN_DEBUG_VERSION (1), and the surface is live: a posed tower reads back, a posed unit walks, and the canvas changes."
domains = ["heat", "defense", "run", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/surface-present.test.ts", outputs = [
  { id = "state", name = "The driven in-game state", kind = "image" },
] }
[[review.categories.items]]
id = "snapshot-shape"
title = "Snapshot reports the full documented shape"
description = "On a posed floor carrying towers of all three sizes at three levels and three heats, one of them tripped, a Forge, a Sink, units of every type, an armed preview, a selection and a pressed pointer, every field listed in the snapshot shape is present with its documented type, pointer and simTime included."
domains = ["heat", "defense", "run", "presentation"]
failure_cap = "broken"
validation = { script = "instrumentation/snapshot-shape.test.ts", outputs = [
  { id = "posed", name = "The posed floor the snapshot reports", kind = "image" },
] }
# The six poses-read-back items are one group of state each, so a build whose
# only broken pose is setUnitSlow loses one point rather than the whole group.
# Mute is in none of them, because there is no setMuted -- that the surface carries
# no such operation is its own reading, no-pose-for-muting below.
