# --- Look and legibility -------------------------------------------------------
# Every item here reads pixels only to decide that the build drew something where
# the specification says something is drawn, or that the same region changed when
# one thing about the world did. Where a mark has no frame without it to be read
# against -- an opening cut into the casing, the ink of a run of text -- the ground
# it is held against is the build's own plain casing or the run's own commonest
# color, and the bar is how far that ground varies by on its own. No item asserts
# a color, a contrast, a hex value or how far apart two things read, and none
# measures how large a drawn mark is: the palette, the type and the glow are the
# build's, and how the result looks is what the reviewer's presentation rating
# judges. Nor does any item enumerate what the floor may not draw -- a
# reactor-plate texture, lane markings, a vignette or a scanline are ordinary art
# direction the appearance rule leaves to the build. What such an item would have
# protected is already carried positively by floor.panel-strip,
# floor.no-floor-in-the-strip, floor.casing-band, hud.touch-targets,
