# --- Screens and menus ---------------------------------------------------------
# The five items that stand between the title screen and a live run --
# title-to-mode-select, containment-opens-difficulty-select,
# special-mode-starts-immediately, difficulty-starts-the-run and, with them,
# controls.confirm-key -- name EVERY functional domain rather than presentation
# alone. A build that cannot reach a run is unplayable in all of them, and since
# the run's overall functional rating is the worst across the effective domain set,
# a broken cap naming only presentation would leave such a build carrying a
# flawless heat, defense and run rating. Every other item in this group is about
# what a screen DRAWS, so it names presentation and caps at scuffed or lower: a
# victory screen that omits the score leaves a playable game.
