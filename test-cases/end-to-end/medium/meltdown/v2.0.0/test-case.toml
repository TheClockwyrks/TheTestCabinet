# --- Towers are walls ----------------------------------------------------------
# Towers are walls, and this is the group that decides it. One rule it
# deliberately does NOT carry: nothing here asserts that a re-pathed unit never
# steps back onto a tile it has left. The route is the shortest open route from
# the tile the unit stands on, and a wall dropped in front of a unit in a dead-end
# pocket can make that route run back over ground already covered. A never-reverse
# rule and a shortest-route rule are two rules deciding one thing, and a build
# honouring either would fail an item asserting the other. The shortest-route rule
# governs, and repath-does-not-teleport already carries what a never-reverse item
# was reaching for: a recomputation moves nothing.
[[review.categories]]
id = "mazing"
title = "Towers are walls"
[[review.categories.items]]
id = "towers-block-tiles"
title = "A tower blocks its whole footprint"
description = "A unit's route never passes through any tile of a placed tower's footprint, at all three footprint sizes."
