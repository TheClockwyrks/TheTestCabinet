<!doctype html>
<!--
  Caldera — title screen (the `title` view, base variant).
  Rendered by the harness at 1280x720 as the deterministic view target and the
  screen shown on load: the CALDERA title, a tagline, and just two options — PLAY
  and HOW TO PLAY. No wave is chosen here: PLAY opens the starting-wave prompt and
  then drops the player into the game. Static.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="hero">
        <div class="title">CALDERA</div>
        <div class="tagline">HOLD THE BASIN, WAVE BY WAVE</div>

        <div class="menu">
          <div class="menu-btn primary">PLAY</div>
          <div class="menu-btn">HOW TO PLAY</div>
        </div>
      </div>
      <div class="hint">
        DRAG PIPES &middot; BUILD ON VENTS &middot; V OVERLAY &middot; F4 WIREFRAME
      </div>
    </div>
  </body>
</html>
