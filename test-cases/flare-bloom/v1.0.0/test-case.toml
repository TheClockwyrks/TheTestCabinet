slug = "flare-bloom"
name = "Flare Bloom"
difficulty = "medium"
tags = ["sprite-sheet", "effect"]
summary = """
Draw the flare bloom: the bright radial burst the Flarefish predator sets off to \
hunt in a lightless trench, as a 128x128 eight-frame sprite sheet — a warm \
charge-up swelling into a white-cored bloom and fading back, produced one drawing \
operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 128x128 transparent canvas (a separate file). This is an
# area EFFECT, not a creature: the bloom lights a wide radius far larger than the
# 32x32 Flarefish sprite, so it gets a large frame. Fixing the size keeps every
# run comparable.
[canvas]
width = 128
height = 128
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — eight separate 128x128 frames of one flare in
# three beats — and the named sequences a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "flare-charge"
name = "Flare — charge-up"
frames = [0, 1, 2]
fps = 6

[[sheet.sequence]]
slug = "flare-bloom"
name = "Flare — bloom"
frames = [3, 4, 5]
fps = 8

[[sheet.sequence]]
slug = "flare-fade"
name = "Flare — fade"
frames = [6, 7]
fps = 6

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated effect matches the brief — a warm flare in three \
beats (a charge-up glow swelling, a bright radial bloom peaking toward a white \
core, then a fade) rendered as a wide, centered radial burst in the warm flare \
palette on transparency."""

[[review_item]]
id = "charge-to-bloom"
title = "Charge-to-bloom-to-fade"
text = """
The flare reads in three beats when played: a charge-up glow that grows brighter \
and tighter (frames 0–2), a bright radial bloom that expands to a peak (frames \
3–5), then a fade collapsing back toward dark (frames 6–7). The peak frame is the \
brightest and widest; it unmistakably reads as a flare going off, not a steady \
lamp."""
sequences = ["flare-charge", "flare-bloom", "flare-fade"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "radial-bloom"
title = "Radial burst with a white core"
text = """
At the bloom the effect is a round radial burst centered in the frame — a hot \
white-to-warm core with concentric warm rings (or rays) spreading outward and \
softening, like light flooding out in all directions, not a flat disc or a single \
hard circle."""
sequences = ["flare-bloom"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "warm-palette"
title = "Warm flare palette"
text = """
Uses only the warm flare palette from the brief (warm orange, warm glow, and a \
white-hot peak) on full transparency — no cold colors, no out-of-palette pixels, \
and no opaque background fill behind the bloom; only the flare's pixels are \
opaque so it composites over the dark trench."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Centered and uncropped"
text = """
The flare is centered on the frame (near 64,64) and the widest bloom stays inside \
the canvas rather than clipping flat against an edge, with the rest of the frame \
fully transparent."""
weight = 1
domain = "fidelity"
