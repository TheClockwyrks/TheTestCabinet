slug = "sunfront-sunhawk"
experimental = true
name = "Sunfront Sunhawk"
difficulty = "hard"
tags = ["voxel", "rig", "aircraft"]
summary = """
Sculpt and rig the Sunfront Sunhawk: an opaque-voxel gunship aircraft — a \
wide, flat armored fuselage with a rotor out on each side and an underslung forward \
cannon — built by painting discrete opaque cells one recorded operation at a time. \
The model invents whatever parts and joints it needs; the fixed contract is three \
animations it must author — a self-playing `rotor_spin` blur, a playable `hover`, and \
a playable `strafe` gun-run — the reviewer can play back."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt and rig the SAME Sunhawk at three sizes — `base` (this
# case's volume), `half` (each extent ~halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The default voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates. A
# variant may OVERRIDE this with its own `[voxel]` (the `half`/`double` size axis);
# `base` inherits it. The volume always starts EMPTY; `background` is only the clear
# color behind the rasterized isometric preview PNG. A voxel case must NOT declare
# [canvas].
[voxel]
width = 74
height = 28
depth = 76
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — the authoritative output the run collects, one per part
# (the `{part}` token expands to each part the model defines): the ordered record of
# every `voxel-anim` op the model issued for that part, from which the scored model is
# regenerated. The composited rig rides in `rig.json`, so it is not named here.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. The model authors each
# animation's F-curves at run time with `voxel-anim define-animation`/`add-keyframe`;
# `rig.json` is pre-seeded with these declarations so the contract exists from the
# first operation.
[model]

# `rotor_spin` — the decorative rotor blur. A self-playing idle that whirls the two
# rotors continuously on their own, under both playables and at rest, so the blades
# read as spinning.
[[model.animation]]
name = "rotor_spin"
loop = true
auto_play = true

# `hover` — the hover/cruise movement. A game-triggered playable (not self-playing)
# that bobs the whole craft gently up and down so it reads as a gunship holding
# station in the air.
[[model.animation]]
name = "hover"
loop = true
auto_play = false

# `strafe` — the WEAPON showcase. A game-triggered playable that works the underslung
# cannon — sweeping it down to rake the ground and tipping it back up — while the
# fuselage holds station.
[[model.animation]]
name = "strafe"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected
# size (`{{voxel.width}}`×`{{voxel.height}}`×`{{voxel.depth}}`). The seeded dest
# drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Sunhawk and poses \
correctly — a wide, flat gunship fuselage with two rotors that spin on their own and \
an underslung cannon that aims up and down about its mount while the hull holds \
station, with a clear solar-amber intake accent and the disciplined Duneforged \
palette."""

[[review_item]]
id = "reads-as-gunship"
title = "Reads as a wide, flat gunship aircraft"
text = """
From more than one angle the model reads unmistakably as a low, wide gunship: a flat \
armored fuselage, a large, prominent rotor out on each side, and an underslung cannon \
projecting forward beneath the nose. The rotors read at a glance as a major feature of \
the aircraft — a broad spread of blades, not a small disc or gear on the hull. It is a \
purpose-built war machine with real character, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "cannon-aims-rotors-spin"
title = "Cannon aims under strafe and the rotors spin"
text = """
Playing `strafe` sweeps the underslung forward cannon cleanly down to rake the ground \
and back up, tilting as one solid piece about its mount, with no voxel of it tearing \
away from the hull or clipping into the fuselage across the full sweep. Independently, \
the two rotors whirl on their own about their vertical axes (`rotor_spin`) — a \
continuous blur that reads as spinning blades, going under the other animations and \
at rest."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "hovers"
title = "Hovers like a craft holding station"
text = """
Playing `hover` bobs the whole craft gently up and down — a buoyant rise, a soft float \
near the top, and a settle — so it reads as a gunship holding station in the air, not \
a mechanical sawtooth. The bob carries the whole aircraft together; the parts do not \
slide apart or lag behind as it breathes."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "hull-fixed"
title = "Hull holds station; only the intended parts move"
text = """
The fuselage is the fixed base the moving parts work against: the cannon aims and the \
rotors spin without dragging the hull around with them. Aside from the deliberate \
whole-craft `hover` bob, the hull holds station — when `strafe` plays, the cannon \
works while the hull stays put, and the rotors' spin never carries the fuselage along. \
Nothing but the intended parts moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Rotors and cannon stay attached"
text = """
Every moving part stays attached to the hull across its whole range of motion: the \
rotors meet their side mounts and the cannon meets the underside of the nose, with no \
gap and never floating free or detaching as the rotors spin and the cannon aims \
through `strafe`."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and sandstone hull, iron \
rotors and cannon, and the solar-amber intake accent) with a clear amber accent, \
no out-of-palette colors, and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
