slug = "sunfront-lancer"
experimental = true
name = "Sunfront Lancer"
difficulty = "hard"
tags = ["voxel", "rig", "mech"]
summary = """
Sculpt and rig the Sunfront Lancer: an opaque-voxel bipedal marksman-mech with a \
heavy rail-lance cannon mounted on one shoulder — a turret bolted to the frame that \
elevates on its trunnion and kicks back along its own axis — while it strides on two \
legs whose feet lift clear of the ground and plant flat. Built by painting voxel \
cells one recorded operation at a time. The model invents whatever parts and joints \
it needs; the fixed contract is two animations it must author as F-curves — a \
striding `walk` and a weapon-only `fire` recoil — the reviewer can play back."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt and rig the SAME mech at three sizes — `base` (this
# case's volume), `half` (each extent halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 32
height = 50
depth = 50
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log and renders nothing — rendering is on request via `voxel-anim render`.
# Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part
# the model defines), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton the mech needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is the
# set of NAMED ANIMATIONS the model must author (a game plays them by name) and whether
# each is a game-triggered playable or a self-playing idle. The model authors each
# animation's F-curves at run time with `voxel-anim define-animation`/`add-keyframe`;
# `rig.json` is pre-seeded with these declarations so the contract exists from the first
# operation.
[model]

# `walk` — the WALK. A game-triggered playable (not self-playing) that strides the mech
# forward on its two legs: the feet plant flat and still on the ground while the body
# passes over them, then lift clear, swing forward, and plant again, the two legs in
# opposite phase so one foot is always planted — the machine pushing itself forward
# rather than flailing. Authored IN PLACE: the body does not translate across the scene
# (the leg cycle carries the stride; a game supplies the real travel). The legs move;
# the shoulder-mounted cannon holds steady.
[[model.animation]]
name = "walk"
loop = true
auto_play = false

# `fire` — the WEAPON showcase. A game-triggered playable (a viewer play button so a
# reviewer can watch the weapon work without dragging a slider) that recoils the whole
# shoulder-mounted cannon straight back along its own axis in its mount: a sharp kick
# back, an overshoot, and a settle, with the mount and frame taking the shock. Only the
# cannon and its recoiling parts move; the legs hold their stance and the body holds still.
[[model.animation]]
name = "fire"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected size.
# The seeded dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Lancer and \
poses correctly — a bipedal marksman-mech with a heavy rail-lance cannon mounted on \
one shoulder as a turret bolted to its frame, elevating on its trunnion and recoiling \
along its own axis without detaching or clipping the hull, while it strides on two \
articulated legs whose feet lift clear of the ground and plant flat, and the body stays \
put, with a clear solar-amber charge-coil accent and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-lancer"
title = "Reads as a bipedal mech with a shoulder-mounted rail-cannon"
text = """
From more than one angle the model reads unmistakably as a long-range walking mech: \
an upright body with a head on top, a pair of articulated legs planted beneath it, \
and a heavy rail-lance cannon MOUNTED ON ONE SHOULDER — seated on a structural turret \
mount (a trunnion cradle or pintle yoke) bolted to the frame, its barrel projecting \
forward past the hull. It reads as MACHINERY BUILT ONTO THE CHASSIS: a mechanical \
addition to the body, with no hand and no gripping arm. It is NOT a weapon held or \
wielded like a soldier's rifle, and NOT a barrel sunk into the chest on the centerline. \
It is a bipedal fighting machine, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride on planted feet without clipping the ground"
text = """
Playing `walk` strides the mech forward on its two legs. The clip is authored \
IN PLACE — the body holds its ground and does not drift across the scene; the \
forward stride is carried entirely by the legs, so played on its own the feet cycle \
and the planted foot slides straight back under the body (a treadmill) while a game \
supplies the real movement. Each foot has a clear \
PLANTED STANCE — flat and still on the ground while the body passes over it — then \
lifts clear, swings forward, and plants again with weight; the two legs step in \
OPPOSITE phase so one foot is always down, NOT flailing as one rigid bank. The feet \
stay flat as they carry the body (they don't tip onto toe or heel), no foot is \
dragged or driven down through the ground, and the legs stay attached across the \
whole cycle. The model had to invent an articulated leg (more than one segment and \
joint) for this to read as walking rather than swinging rigid poles."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "weapon-recoils"
title = "The shoulder-mounted cannon elevates and recoils in its mount"
text = """
The rail-lance cannon is mounted on one shoulder, seated on a structural turret mount \
bolted to the frame. It elevates cleanly up and down on its trunnion, and across the \
full elevation the barrel CLEARS the hull and head — it never clips into the body, and \
it is never sunk into the chest. Playing `fire` recoils the WHOLE cannon straight back \
along its own axis in its mount — a sharp kick, an overshoot, a settle — with the mount \
and frame taking the shock and no voxel tearing away from its mount. When `fire` plays \
only the cannon and its recoiling parts move and the legs stay planted; when `walk` \
plays only the legs move and the cannon holds steady."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "torso-fixed"
title = "Body stays fixed; only the moving parts move"
text = """
The upright body and head are the fixed core of the mech: they stay put, never \
carried along by the recoiling cannon or the legs. When `fire` plays, the cannon \
recoils in its shoulder mount while the legs hold their stance; when `walk` plays, the \
legs stride while the cannon holds steady. Nothing but the moving parts moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Legs and the shoulder-mounted cannon stay attached"
text = """
Every moving piece stays attached across its full range: each leg's segments meet \
their neighbors cleanly as the leg folds and extends, and the cannon stays seated on \
the shoulder mount that bears it — never floating free or detaching as the legs stride, \
the cannon elevates, and it recoils along its axis. The mount meets the frame cleanly \
with no gap, and the barrel clears the hull and head throughout, never clipping into \
the body."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (sandstone and brass frame, iron \
rail-lance and legs, and the solar-amber charge-coil accent) with a clear amber \
coil on the lance, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
