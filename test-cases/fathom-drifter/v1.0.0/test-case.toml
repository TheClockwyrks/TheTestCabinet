slug = "drifter"
experimental = true
name = "Fathom Drifter"
difficulty = "medium"
tags = ["sprite-sheet", "bonus"]
summary = """
Draw the Fathom bonus drifter: the harmless amber jellyfish the player grazes for \
bonus points in a deep-sea maze chase, as an 8-frame 32x32 sprite sheet — a single \
directionless sway loop of a glowing amber bell over drifting tendrils, produced one \
drawing operation at a time. Its frames double as the Lanternjaw's disguise."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.75
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — eight separate 32x32 frames, a single directionless
# sway loop of the amber jellyfish — and the named sequence a reviewer plays back.
# The always-visible amber bulb-POINT is a runtime glow the game adds at the
# creature's center; this sheet carries the bell, skirt, and tendrils, not that mote.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "drift"
name = "Drift"
frames = [0, 1, 2, 3, 4, 5, 6, 7]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the bonus drifter — its glowing amber \
bell with a bright core, the frilled skirt and gently swaying tendrils, and the \
single directionless drift loop that reads as a harmless jellyfish (the very frames \
the Lanternjaw wears as its disguise)."""

[[review_item]]
id = "amber-bell"
title = "Glowing amber bell"
text = """
Every frame carries a rounded glowing amber bell (the "bulb") with a bright core at \
the top of the sprite — the drifter's defining feature and its brightest element. It \
sits in the same place in every frame, unchanging, as a jellyfish's bell would."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "sway-loop"
title = "Gentle drift loop"
text = """
The eight frames read as a jellyfish drifting in place: the frilled skirt and the \
tendrils hanging below the bell ripple and sway a pixel or two across the loop, so \
playing 0→7 reads as a smooth, continuous drift. It is directionless — a single \
sway loop, not per-facing swim pairs."""
sequences = ["drift"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "jellyfish-form"
title = "Reads as a jellyfish"
text = """
The creature reads as a bell-and-tendrils jellyfish — an amber bell with a frilled \
skirt and a few tendrils hanging beneath it — NOT as a swimming fish with a \
head and forked tail. These frames must be able to pass for the Lanternjaw's \
wandering disguise, so nothing predatory (no jaws, no teeth) may show."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Amber palette"
text = """
Uses the drifter's palette from the brief (amber bell, bright core, dim-amber \
tendrils and skirt, near-black outline) with no out-of-palette colors and no halo \
of stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each jellyfish fills most of its own 32x32 frame cell, centered with a small \
margin, neither tiny in a corner nor spilling across the grid lines into the \
neighboring frame."""
weight = 1
domain = "fidelity"
