<!DOCTYPE html>
<!--
  Shatter — in-game reference mockup (representative frame).
  Canonical view slug: gameplay
  Render at a 1280x720 viewport. See ../specs/playfield.md, ../specs/physics.md
  (the gravity well), and ../specs/flow.md (HUD).

  Live positions vary at runtime; this frame is a representative layout used for a
  soft palette/layout comparison, not a strict pixel match. It shows the ship
  thrusting, the star with its halo, several rocks of each size mid-field, a
  bullet whose path bends around the star (the gravity signature), the saucer,
  and the HUD (score and remaining lives).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shatter — Gameplay</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- The star (gravity well) fixed at the field center (640, 360). -->
      <div class="star"></div>

      <svg
        class="field"
        viewBox="0 0 1280 720"
        width="1280"
        height="720"
        aria-hidden="true"
      >
        <defs>
          <!-- Fade for the curving bullet trail: faint at the tail, bright at
               the head, so the bent path reads as one streak. -->
          <linearGradient
            id="shot-fade"
            gradientUnits="userSpaceOnUse"
            x1="360"
            y1="520"
            x2="720"
            y2="250"
          >
            <stop offset="0" stop-color="#f2f5f7" stop-opacity="0" />
            <stop offset="0.6" stop-color="#f2f5f7" stop-opacity="0.35" />
            <stop offset="1" stop-color="#f2f5f7" stop-opacity="0.9" />
          </linearGradient>
        </defs>

        <!-- Rocks: irregular angular polygons, one of each size scattered around
             the field. Drawn as outlines with a faint fill and a soft glow. -->
        <!-- Large A -->
        <polygon
          points="-44,-12 -30,-40 -2,-46 24,-38 46,-10 40,20 20,44 -12,42 -38,26 -46,4"
          transform="translate(250,210) rotate(18)"
          fill="rgba(154,167,189,0.08)"
          stroke="#9aa7bd"
          stroke-width="2.5"
          stroke-linejoin="round"
          style="filter: drop-shadow(0 0 6px rgba(154, 167, 189, 0.35))"
        />
        <!-- Large B -->
        <polygon
          points="-44,-12 -30,-40 -2,-46 24,-38 46,-10 40,20 20,44 -12,42 -38,26 -46,4"
          transform="translate(940,545) rotate(-40)"
          fill="rgba(154,167,189,0.08)"
          stroke="#9aa7bd"
          stroke-width="2.5"
          stroke-linejoin="round"
          style="filter: drop-shadow(0 0 6px rgba(154, 167, 189, 0.35))"
        />
        <!-- Medium A -->
        <polygon
          points="-25,-6 -16,-22 2,-26 20,-18 26,2 18,22 -2,25 -20,16 -26,4"
          transform="translate(1082,250) rotate(26)"
          fill="rgba(154,167,189,0.08)"
          stroke="#9aa7bd"
          stroke-width="2.5"
          stroke-linejoin="round"
          style="filter: drop-shadow(0 0 6px rgba(154, 167, 189, 0.35))"
        />
        <!-- Medium B -->
        <polygon
          points="-25,-6 -16,-22 2,-26 20,-18 26,2 18,22 -2,25 -20,16 -26,4"
          transform="translate(196,560) rotate(-15)"
          fill="rgba(154,167,189,0.08)"
          stroke="#9aa7bd"
          stroke-width="2.5"
          stroke-linejoin="round"
          style="filter: drop-shadow(0 0 6px rgba(154, 167, 189, 0.35))"
        />
        <!-- Small A -->
        <polygon
          points="-13,-4 -6,-13 8,-12 14,-2 10,11 -4,14 -13,6"
          transform="translate(775,150) rotate(30)"
          fill="rgba(154,167,189,0.08)"
          stroke="#9aa7bd"
          stroke-width="2.5"
          stroke-linejoin="round"
          style="filter: drop-shadow(0 0 6px rgba(154, 167, 189, 0.35))"
        />

        <!-- A bullet's path bending around the star: the gravity signature. The
             streak curves past the star's lower-right and up toward a rock, with
             the live bullet at its bright head. -->
        <path
          d="M 360 520 C 470 470, 560 300, 720 250"
          fill="none"
          stroke="url(#shot-fade)"
          stroke-width="4"
          stroke-linecap="round"
        />
        <circle
          cx="720"
          cy="250"
          r="4"
          fill="#f2f5f7"
          style="filter: drop-shadow(0 0 6px rgba(242, 245, 247, 0.9))"
        />
        <!-- Two more of the ship's bullets in flight near it. -->
        <circle cx="512" cy="452" r="3" fill="#f2f5f7"
          style="filter: drop-shadow(0 0 5px rgba(242,245,247,0.9))" />
        <circle cx="556" cy="430" r="3" fill="#f2f5f7"
          style="filter: drop-shadow(0 0 5px rgba(242,245,247,0.9))" />

        <!-- The ship, thrusting, facing up-and-right. -->
        <g transform="translate(440,492) rotate(38)">
          <!-- Thrust flame from the tail. -->
          <polygon points="-6,15 0,32 6,15" fill="#ffd166"
            style="filter: drop-shadow(0 0 6px rgba(255,209,102,0.85))" />
          <polygon points="-3,15 0,24 3,15" fill="#fff2cc" />
          <!-- Hull. -->
          <path d="M 0 -20 L 13 15 L 0 8 L -13 15 Z" fill="rgba(108,240,255,0.12)"
            stroke="#6cf0ff" stroke-width="2.5" stroke-linejoin="round"
            style="filter: drop-shadow(0 0 7px rgba(108,240,255,0.75))" />
        </g>

        <!-- The enemy saucer, weaving in from the top-right. -->
        <g transform="translate(1088,150)">
          <polygon points="-22,0 -10,-8 10,-8 22,0 10,8 -10,8"
            fill="rgba(255,92,138,0.12)" stroke="#ff5c8a" stroke-width="2.5"
            stroke-linejoin="round"
            style="filter: drop-shadow(0 0 7px rgba(255,92,138,0.7))" />
          <path d="M -10 -8 Q 0 -19 10 -8" fill="none" stroke="#ff5c8a"
            stroke-width="2.5" />
        </g>

        <!-- HUD: remaining lives as small ship glyphs, below the score. -->
        <g transform="translate(60,118) scale(0.7)">
          <path d="M 0 -20 L 13 15 L 0 8 L -13 15 Z" fill="none"
            stroke="#6cf0ff" stroke-width="3" stroke-linejoin="round" />
        </g>
        <g transform="translate(102,118) scale(0.7)">
          <path d="M 0 -20 L 13 15 L 0 8 L -13 15 Z" fill="none"
            stroke="#6cf0ff" stroke-width="3" stroke-linejoin="round" />
        </g>
      </svg>

      <!-- HUD score, top-left. -->
      <div class="hud-score">24350</div>
    </div>
  </body>
</html>
