<!DOCTYPE html>
<!--
  Shatter — game-over reference mockup.
  Canonical view slug: game-over
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Game over).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shatter — Game Over</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- Frozen, dimmed final frame behind the result panel. -->
      <div class="star dim"></div>

      <svg
        class="field dim"
        viewBox="0 0 1280 720"
        width="1280"
        height="720"
        aria-hidden="true"
      >
        <polygon
          points="-44,-12 -30,-40 -2,-46 24,-38 46,-10 40,20 20,44 -12,42 -38,26 -46,4"
          transform="translate(240,220) rotate(18)"
          fill="rgba(154,167,189,0.08)" stroke="#9aa7bd" stroke-width="2.5"
          stroke-linejoin="round"
        />
        <polygon
          points="-25,-6 -16,-22 2,-26 20,-18 26,2 18,22 -2,25 -20,16 -26,4"
          transform="translate(1040,250) rotate(-20)"
          fill="rgba(154,167,189,0.08)" stroke="#9aa7bd" stroke-width="2.5"
          stroke-linejoin="round"
        />
        <polygon
          points="-13,-4 -6,-13 8,-12 14,-2 10,11 -4,14 -13,6"
          transform="translate(300,560) rotate(30)"
          fill="rgba(154,167,189,0.08)" stroke="#9aa7bd" stroke-width="2.5"
          stroke-linejoin="round"
        />
      </svg>

      <div class="overlay"></div>

      <div class="panel">
        <p class="panel-eyebrow">SHATTER</p>
        <h2 class="panel-title">GAME OVER</h2>
        <p class="panel-score">SCORE 24350</p>
        <p class="panel-sub">WAVE 6</p>
        <nav class="menu">
          <div class="menu-item selected">PLAY AGAIN</div>
          <div class="menu-item">MENU</div>
        </nav>
      </div>
    </div>
  </body>
</html>
