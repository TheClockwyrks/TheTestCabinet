slug = "shatter"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Shatter"

# Relative difficulty of this case, surfaced on the site. Shatter asks for inertial
# flight, a live gravity field acting on many bodies at once, splitting rocks,
# escalating waves, a hunting saucer, lives/respawns, and a full state machine — a
# meaty but well-specified 2D front-end build, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "space", "shooter", "physics"]

# Short site-facing abstract, shown on the test case card. Authored inline as plain
# text (not a file) so it renders safely inside the card's link and stays
# deliberately brief; the longer `description` below is shown on the detail page.
# Like `description`, this is NOT seeded into a run.
summary = """
A neon top-down rock shooter built around a central gravity well: the star at the \
middle of the field pulls your bullets and every rock — so shots bend around it and \
rocks churn on curved paths — while your ship flies free of the pull and the rocks \
it swallows recycle back in from the edge."""

# Site-facing prose describing the case, relative to this version folder. This is
# NOT seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. It is rendered per
# run (with the seeded specs and the selected variant) and handed to the model as
# the build instruction. It injects absolute in-container paths via template
# variables rather than hardcoding them.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. This is the per-case default; a run can override it. Shatter is a medium
# case with a good deal to build (inertial flight, the gravity field, waves, the
# saucer, several states), so it gets more headroom than the easy cases while still
# bounding a session that never terminates.
max_runtime_hours = 2.5

# Starter workspace seeded into the root of every run before the specs. It gives the
# model a baseline project to build on: a `package.json` that pins `playwright` as a
# dev dependency, so the in-container browser tooling is a visible, project-local
# dependency rather than a global the model has to know is preinstalled. The seeded
# files land at the run root (`workspaces/base/package.json` seeds to
# `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded and
# before the harness starts. It installs the workspace's dependencies and downloads
# the Playwright Chromium build (the base image ships the OS libraries Chromium links
# against, but not the browser binary), so the model can build and verify immediately
# against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Shatter ships two: `base` (the default — the standard endless arcade game, seeding
# only the common specs and rated on the common `arcade` domain) and `warhead` (the
# standard game plus armored rocks and a homing-torpedo secondary weapon, which adds
# its own mode spec, an in-game reference view, proofs, review items, and scoring
# domain). The first entry is the default. This list is a root key, so it must
# precede the first table header (`[build]`).
variants = [
  "variants/base.toml",
  "variants/warhead.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root: dependencies are installed, then the static build is produced into
# `dist/`, `build/`, or `out/`. `npm ci` is deliberate — it requires the build to
# commit a `package-lock.json`, so the validated build installs exactly what the
# deploy will. Both commands are required — there are no defaults, so every case
# states exactly how its implementation is built.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant of this case, at the `dest` path within the
# run workspace. The specification is decomposed by concern. Every spec is plain
# Markdown, seeded verbatim; a spec's `dest` defaults to its `source`, so these need
# only name the source they seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/physics.md"

[[spec]]
source = "specs/flow.md"

# Proof of implementation: instructs the build to capture evidence (screenshots and a
# short clip) at the exact paths the `[[proof]]` entries below declare, so a reviewer
# can see what the build actually produced. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup; the harness renders it to a screenshot that is seeded into the run as a
# visual target. The reference source is rendered, then never seeded directly.
# References are not validated unless a `[[check]]` below names them. Shatter has one
# variant, so all three views are common.
[[reference]]
view = "title"
path = "reference/title.html"

[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to as evidence the feature works; `specs/proof.md` instructs
# the build to produce them at exactly these paths. Validation records whether
# each turned up (informational — a missing proof does not fail the run), and a
# reviewer pairs each with its expected reference (see the `review_item` links
# below). The media kind is inferred from the extension: `.png` is an image,
# `.webm` a video (the format Playwright records natively; the public gallery
# transcodes it to mp4).
[[proof]]
id = "title"
name = "Title screen"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "Gameplay"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Game over"
dest = "proof/game-over.png"

[[proof]]
id = "gravity"
name = "Gravity clip"
dest = "proof/gravity.webm"

# Reference-similarity checks (opt-in) are intentionally not declared. The
# reference screenshots are seeded as illustrative examples of the screens, not
# layouts to reproduce, so menus and screens are left to the model's design and
# are reviewed by a human rather than scored against a baseline. The automated
# load check still runs.

# Common scoring domain, rated for every variant. The `base` variant is rated on
# this domain alone (its overall rating); the `warhead` variant is rated on this
# domain plus its own `warhead` domain (declared in `variants/warhead.toml`). Every
# case must declare at least one common domain. The common review items below roll
# up to this domain implicitly (an item names a `domain` only to scope itself,
# unnecessary for these since `arcade` is the only common domain).
[[domain]]
id = "arcade"
name = "Arcade"
description = "Endless survival: pilot the ship through the gravity well, shatter the rocks wave after wave, and outlast the saucer."

# Reviewer checklist items, common to every variant. These are the major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss at a glance. They are
# reporter-side material: never seeded into a run, so the model never sees the
# checklist; each one restates a requirement the seeded specification already states.
# Each item is worth `weight` points toward the run's score; the reviewer records a
# pass/fail verdict for each before the run can be published.
[[review_item]]
id = "inertial-flight"
title = "Inertial flight"
text = "Thrust accelerates the ship along its facing and it coasts afterward under momentum (no instant stop, no reverse/brake); turning changes only the facing, not the velocity. Motion reads at the spec's pace — 300 deg/s turn, 480 px/s^2 thrust, ~680 px/s cap — not noticeably fast or sluggish."
weight = 1

[[review_item]]
id = "screen-wrap"
title = "Screen wrap"
text = "The ship, bullets, and rocks that cross any edge reappear at the opposite edge carrying the same velocity, and a shape straddling an edge is drawn on both sides rather than popping."
weight = 1

[[review_item]]
id = "gravity-well"
title = "Gravity well"
text = "The star pulls bullets and rocks toward the center: a bullet fired past the star visibly curves and rocks travel on curved rather than straight paths. The ship and the saucer are powered craft and are never pulled — the ship flies exactly where the player steers it, unaffected by the well."
weight = 1
reference = "gameplay"
proof = "gravity"

[[review_item]]
id = "star-core"
title = "Solid star core"
text = "The star's core is solid but not lethal to the ship: flying into it costs no life and does not destroy the ship — the ship slides along the core rather than through it. A bullet that reaches the core is absorbed and removed, and a rock is destroyed and recycled, rather than passing through."
weight = 1

[[review_item]]
id = "rock-recycle"
title = "Rock recycling"
text = "A rock pulled into the star is destroyed and immediately replaced by a same-size rock entering from off-screen, so the number of rocks on the field is conserved and the star never empties the board (and no points are scored for it)."
weight = 1

[[review_item]]
id = "rock-split"
title = "Rock splitting"
text = "Shooting a Large rock yields two Medium, a Medium yields two Small, and a Small is destroyed outright; fragments fan apart to opposite sides based on the shot direction and inherit the parent's motion."
weight = 1
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "bullet-limits"
title = "Bullet limits"
text = "Bullets have a limited lifetime/range, at most four of the ship's bullets exist at once, fire is rate-limited, and a bullet's velocity carries the ship's own motion (a shot fired while moving is faster)."
weight = 1

[[review_item]]
id = "waves"
title = "Wave progression"
text = "Clearing every rock advances to a new wave with more (and faster) rocks, shown by a brief wave banner, and continues endlessly."
weight = 1

[[review_item]]
id = "saucer"
title = "Enemy saucer"
text = "A saucer appears on a cadence, weaves across the field and wraps, fires bullets aimed at the ship, steers clear of the star (never pulled into it), and can be destroyed with a bullet for points."
weight = 1

[[review_item]]
id = "lives-respawn"
title = "Lives and respawn"
text = "The game starts with 3 ships; losing one respawns the next at the safe point below the star with a brief invulnerability (during which it ignores all collisions), an extra ship is granted at each 10,000-point threshold, and the game ends at zero lives."
weight = 1

[[review_item]]
id = "scoring"
title = "Scoring"
text = "Destroying rocks scores by size (Large 20, Medium 50, Small 100) and the saucer 200; the HUD score increments correctly and only ever rises within a game."
weight = 1

[[review_item]]
id = "states-complete"
title = "Game states"
text = "Every game state is reachable and behaves correctly: title menu, how-to-play, in game, pause (resume/restart/quit), and game over (play again/menu)."
weight = 1
reference = "title"
proof = "title"

[[review_item]]
id = "game-over-screen"
title = "Game over"
text = "Losing the last life shows the game-over screen with GAME OVER, the correct final score, the wave reached, and the PLAY AGAIN / MENU options."
weight = 1
reference = "game-over"
proof = "game-over"

[[review_item]]
id = "controls"
title = "Controls"
text = "Rotate with Left/Right or A/D, thrust with Up or W, fire with Space, and pause with Esc or P; menu navigation with Up/Down (or W/S), Enter/Space to confirm, Esc to go back."
weight = 1

[[review_item]]
id = "hud-rendering"
title = "HUD and menu rendering"
text = "The score and remaining-lives glyphs render clearly, and every menu renders cleanly, is present and navigable, and is free of visual bugs — with the selection indicator oriented correctly and no visual bugs obscuring options."
weight = 1

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The entire 1280x720 field — the ship, the star, every rock, the HUD, every menu item, and all four edges — stays visible, fitted, and centered at any window size and pixel density, including on load before any input."
weight = 1
