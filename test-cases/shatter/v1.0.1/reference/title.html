<!DOCTYPE html>
<!--
  Shatter — title / main menu reference mockup.
  Canonical view slug: title
  Lists PLAY then HOW TO PLAY. Render at a 1280x720 viewport.
  See ../specs/flow.md (Game states: Title / main menu).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shatter — Title</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* On the title screen the star burns *behind* the menu, so it shows
         dimmed (see ../specs/flow.md — the field furniture may be dimmed behind
         the menu). At full brightness its core washed out the tagline that
         crosses the field center; dimming the star and shading the tagline
         restores the subtitle's contrast without moving the menu. */
      .star {
        opacity: 0.32;
        filter: saturate(0.9);
      }
      .tagline {
        text-shadow: 0 0 12px var(--bg), 0 1px 4px var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- The star still burns behind the menu. -->
      <div class="star"></div>

      <!-- Dimmed drifting furniture behind the menu. -->
      <svg
        class="field dim"
        viewBox="0 0 1280 720"
        width="1280"
        height="720"
        aria-hidden="true"
      >
        <polygon
          points="-44,-12 -30,-40 -2,-46 24,-38 46,-10 40,20 20,44 -12,42 -38,26 -46,4"
          transform="translate(170,150) rotate(20)"
          fill="rgba(154,167,189,0.08)" stroke="#9aa7bd" stroke-width="2.5"
          stroke-linejoin="round"
        />
        <polygon
          points="-25,-6 -16,-22 2,-26 20,-18 26,2 18,22 -2,25 -20,16 -26,4"
          transform="translate(1110,180) rotate(-24)"
          fill="rgba(154,167,189,0.08)" stroke="#9aa7bd" stroke-width="2.5"
          stroke-linejoin="round"
        />
        <polygon
          points="-25,-6 -16,-22 2,-26 20,-18 26,2 18,22 -2,25 -20,16 -26,4"
          transform="translate(210,590) rotate(40)"
          fill="rgba(154,167,189,0.08)" stroke="#9aa7bd" stroke-width="2.5"
          stroke-linejoin="round"
        />
        <polygon
          points="-13,-4 -6,-13 8,-12 14,-2 10,11 -4,14 -13,6"
          transform="translate(1080,600) rotate(12)"
          fill="rgba(154,167,189,0.08)" stroke="#9aa7bd" stroke-width="2.5"
          stroke-linejoin="round"
        />
        <!-- The ship, drifting at the lower left. -->
        <g transform="translate(300,470) rotate(-25)">
          <path d="M 0 -20 L 13 15 L 0 8 L -13 15 Z" fill="rgba(108,240,255,0.12)"
            stroke="#6cf0ff" stroke-width="2.5" stroke-linejoin="round" />
        </g>
      </svg>

      <div class="center">
        <h1 class="title">SHATTER</h1>
        <div class="tagline">GRAVITY WELL SHOOTER</div>
        <nav class="menu">
          <div class="menu-item selected">PLAY</div>
          <div class="menu-item">HOW TO PLAY</div>
        </nav>
      </div>

      <div class="hint">&#9650; &#9660; MOVE &nbsp;&nbsp; ENTER SELECT</div>
    </div>
  </body>
</html>
