slug = "sunfront-lancer-foundry"
name = "Sunfront Lancer Foundry"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Lancer Foundry: a 44x84x44 opaque-voxel spire whose \
rail-arm slides up and down and whose focus-ring spins, each on its own auto-play \
animation the model authors, while the base stays fixed, built and rigged one \
recorded operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 44
height = 84
depth = 44
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts, these joints, and these animations; at run time it
# MAY add further parts, joints, and animations of its own (recorded in rig.json)
# beyond what this table requires. `pivot` is `[x, y, z]` in voxel coordinates.
# `rig.json` is pre-seeded from this table so the contract exists from the first
# operation.
[model]

# The foundry tower and its footing: the root part (no parent), fixed to the
# world. Everything else hangs off the base and moves against it.
[[model.part]]
name = "base"
pivot = [0, 0, 0]

# The sliding rail-arm: a heavy assembly rail set into the tower's mid-shaft that
# rides up and down on its own. It slides on the auto `rail_arm_slide` joint.
[[model.part]]
name = "rail_arm"
parent = "base"
pivot = [22, 50, 22]

# The focus-ring: a machined ring crowning the spire that spins on its own about
# the vertical axis. It turns on the auto `focus_ring_spin` joint.
[[model.part]]
name = "focus_ring"
parent = "base"
pivot = [22, 68, 22]

# The rail-arm's own looping slide. An `auto` joint driven by the required
# `rail_arm_slide` animation, so the arm rides up and back down on its own without a
# caller. A translation along `y` (voxels): `rest = 0` is seated at the bottom,
# `max = 10` is fully raised.
[[model.joint]]
name = "rail_arm_slide"
part = "rail_arm"
kind = "translation"
axis = "y"
pivot = [22, 50, 22]
min = 0.0
max = 10.0
rest = 0.0
drive = "auto"

# The focus-ring's own looping spin. An `auto` joint driven by the required
# `focus_ring_spin` animation, so the ring turns on its own. A rotation about `y`
# (radians) through a full turn, `rest = 0`.
[[model.joint]]
name = "focus_ring_spin"
part = "focus_ring"
kind = "rotation"
axis = "y"
pivot = [22, 68, 22]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "auto"

# The required auto-play animations — one per animated sub-part — so the foundry
# works on its own while the base stays fixed. Each is a DECLARATION only (name,
# period, loop, auto_play, joints): the case does NOT ship keyframes. The model
# authors each animation's motion as F-curves at run time with the `voxel-anim`
# `define-animation`/`add-keyframe` subcommands, and the produced rig.json carries
# it. `auto_play = true` makes each a continuous decorative idle. The rail-arm
# animation rides the arm up to +10 voxels and back down over 1.6s; the focus-ring
# animation turns a full revolution over 2.0s.
[[model.animation]]
name = "rail_arm_slide"
period_ms = 1600
loop = true
auto_play = true
joints = ["rail_arm_slide"]

[[model.animation]]
name = "focus_ring_spin"
period_ms = 2000
loop = true
auto_play = true
joints = ["focus_ring_spin"]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Lancer \
Foundry and poses correctly — a tall, slender Duneforged spire whose rail-arm \
slides up and down its shaft and whose focus-ring spins on their own auto-play \
animations while the base stays put, with a clear solar-amber energy accent and \
the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-foundry"
title = "Reads as a foundry spire"
text = """
From more than one angle the model reads unmistakably as a tall, slender \
Duneforged foundry tower: a solid masonry base rising into a narrow shaft, a \
heavy rail-arm set into the mid-shaft, and a machined focus-ring crowning the \
top. It is a distinct industrial building, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Rail-arm slides and focus-ring spins"
text = """
The animated elements cycle on their own via their auto-play animations: the \
`rail_arm_slide` animation rides the `rail_arm` smoothly up and down its shaft on \
the `rail_arm_slide` joint, and the `focus_ring_spin` animation turns the \
`focus_ring` a full revolution on the `focus_ring_spin` joint, both looping \
without a caller and moving with weight (eased F-curves, not a linear slide). \
Across each joint's range no voxel of the moving part tears away from its mount or \
clips through the shaft."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Base stays fixed"
text = """
Only the moving parts move: the rail-arm as it slides and the focus-ring as it \
spins. The base tower and its footing stay put — they are the fixed root of the \
rig, not carried along by the arm or the ring."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Rail-arm and focus-ring stay attached"
text = """
Each sub-part stays attached to the base across its joint's range: the rail-arm \
meets the shaft along its rail and the focus-ring seats on the crown, with no gap \
and never floating free or detaching as the arm slides and the ring spins."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber and solar-hot energy \
accents) with a clear amber accent, no out-of-palette colors, and no stray \
voxels drifting off the parts."""
weight = 1
domain = "fidelity"
