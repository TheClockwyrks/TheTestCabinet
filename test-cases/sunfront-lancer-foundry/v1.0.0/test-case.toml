slug = "sunfront-lancer-foundry"
name = "Sunfront Lancer Foundry"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Lancer Foundry: an opaque-voxel spire whose \
rail-arm slides up and down its shaft and whose focus-ring spins at the crown, each \
on its own self-playing animation, while the base stays fixed — built by painting \
opaque cells one recorded operation at a time. The model invents whatever parts and \
joints it needs; the fixed contract is the two self-playing animations it must \
author — a `rail_arm_slide` and a `focus_ring_spin` — the reviewer can play back."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME foundry spire at three sizes — `base` (this
# case's volume), `half` (each extent ~halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 46
height = 86
depth = 46
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log and renders nothing — rendering is on request via `voxel-anim render`.
# Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required animation contract — and the ONLY thing this case fixes about the rig.
# A case does NOT prescribe parts, joints, or pivots: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays each by name) and that each is a
# self-playing idle. The model authors each animation's F-curves at run time with the
# `voxel-anim` `define-animation`/`add-keyframe` subcommands; `rig.json` is pre-seeded
# with these declarations so the contract exists from the first operation.
[model]

# `rail_arm_slide` — the sliding arm. A self-playing idle that rides the heavy rail-arm
# smoothly up its shaft and back down on its own, looping without a caller while the
# base stays put.
[[model.animation]]
name = "rail_arm_slide"
loop = true
auto_play = true

# `focus_ring_spin` — the spinning ring. A self-playing idle that turns the machined
# focus-ring at the crown a full revolution on its own, looping continuously while the
# base stays put.
[[model.animation]]
name = "focus_ring_spin"
loop = true
auto_play = true

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the volume it states matches the selected size
# (`{{voxel.width}}`×`{{voxel.height}}`×`{{voxel.depth}}`). The seeded dest drops the
# `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Lancer \
Foundry and poses correctly — a tall, slender Duneforged spire whose rail-arm \
slides up and down its shaft and whose focus-ring spins on their own auto-play \
animations while the base stays put, with a clear solar-amber energy accent and \
the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-foundry"
title = "Reads as a foundry spire"
text = """
From more than one angle the model reads unmistakably as a tall, slender \
Duneforged foundry tower: a solid masonry base rising into a narrow shaft, a \
heavy rail-arm set into the mid-shaft, and a machined focus-ring crowning the \
top. It is a distinct industrial building, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Rail-arm slides and focus-ring spins"
text = """
The animated elements cycle on their own via their self-playing animations: \
`rail_arm_slide` rides the rail-arm smoothly up its shaft and back down, and \
`focus_ring_spin` turns the focus-ring a full revolution — both looping without a \
caller and moving with weight (eased F-curves, not a linear slide). Across the full \
range of each motion nothing of the moving element tears away from its mount or clips \
through the shaft. The model had to invent the pieces and pivots that make a vertical \
slide and a clean spin about the vertical axis read plausibly."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Base stays fixed"
text = """
Only the moving elements move: the rail-arm as it slides and the focus-ring as it \
spins. The base tower and its footing stay put — they are the fixed foundation of the \
spire, never carried along by the arm or the ring."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Rail-arm and focus-ring stay attached"
text = """
The rail-arm and the focus-ring stay attached to the tower across the full range of \
their motion: the rail-arm meets the shaft along its rail and the focus-ring seats on \
the crown, with no gap and never floating free or detaching as the arm slides and the \
ring spins."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber and solar-hot energy \
accents) with a clear amber accent, no out-of-palette colors, and no stray \
voxels drifting off the parts."""
weight = 1
domain = "fidelity"
