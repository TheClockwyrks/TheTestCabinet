name = "Spectra Prism"
difficulty = "medium"
tags = ["asset-generation", "2d", "sprite", "enemy", "boss"]
summary = """
Draw the Spectra Prism: the two-band boss drone for a two-band formation shooter \
— a cyan shell around a magenta core — as a 64x64 enemy sprite produced one \
drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_seconds = 2400
type = "asset-generation"

[canvas]
width = 64
height = 64
background = "transparent"

[tool]
binary = "draw"
operations = "schemas/operations.json"
preview = "canvas.png"

[output]
actions = "actions.json"

[[reference]]
view = "target"
media = "reference/target.png"

[[spec]]
source = "specs/brief.md"
dest = "specs/brief.md"

[[variant]]
slug = "base"
name = "Base"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sprite matches the Spectra Prism target — its \
two-layer construction (a cyan shell around an opposite-band magenta core), both \
band glyphs, its boss scale, and the neon Spectra palette."""

[[review_item]]
id = "two-layer"
title = "Shell around an opposite-band core"
text = """
The drone reads as TWO concentric layers in opposite bands — an outer CYAN shell \
ring enclosing an inner MAGENTA core. The two-band, shell-then-core construction \
is the Prism's whole identity."""
weight = 3
reference = "target"
domain = "fidelity"

[[review_item]]
id = "both-glyphs-layered"
title = "Both band glyphs, layered"
text = """
The two bands read by shape as well as color: the cyan shell carries the RING \
motif and the magenta core carries the DIAMOND motif — the colorblind-safe \
convention the game uses everywhere a band appears."""
weight = 2
reference = "target"
domain = "fidelity"

[[review_item]]
id = "boss-scale"
title = "Boss scale"
text = """
The Prism reads as the large anchor of a wave — it fills more of the frame than a \
basic drone would, a substantial two-layer boss rather than a small drone."""
weight = 2
reference = "target"
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Spectra palette"
text = """
Uses only the Spectra colors from the brief (cyan shell, magenta core, the dark \
panel color for the gap, white glyphs) with no out-of-palette colors and no halo \
of stray pixels."""
weight = 1
reference = "target"
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Canvas framing"
text = """
The Prism fills most of the 64x64 frame, roughly centered with a small margin, \
neither tiny in a corner nor clipped at an edge."""
weight = 1
reference = "target"
domain = "fidelity"
