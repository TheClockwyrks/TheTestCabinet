slug = "sunfront-flakhound"
name = "Sunfront Flakhound"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "walker"]
summary = """
Sculpt and rig the Sunfront Flakhound: a 36x32x46 opaque-voxel four-legged \
anti-air walker painted cell by cell with the `voxel-anim` tool — it strides on \
legs, sweeps a back turret, and elevates twin flak barrels to track a target \
across the sky. The model invents whatever parts and joints it needs; the fixed \
contract is two animations it must author — a leg-striding `walk` and a \
weapon-tracking `flak_track` — the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 36
height = 32
depth = 46
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log and renders nothing — rendering is on request via `voxel-anim render`.
# Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# part the model defines), the authoritative output each part's regenerated model
# is rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (a game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model
# authors each animation's F-curves at run time with `voxel-anim
# define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations
# so the contract exists from the first operation.
[model]

# `walk` — the WALK. A game-triggered playable (not self-playing) that strides the
# walker forward on its legs: each foot plants flat and still on the ground while
# the body passes over it, then lifts, swings forward, and plants again, so the
# machine pushes itself forward rather than flailing. The weapon holds at rest while
# it plays. Authored IN PLACE: the body does not translate across the scene (the leg
# cycle carries the stride; a game supplies the real travel).
[[model.animation]]
name = "walk"
loop = true
auto_play = false

# `flak_track` — the WEAPON showcase. A game-triggered playable that works the
# anti-air guns — traversing the back turret onto a bearing and elevating the twin
# flak barrels to track a target across the sky — while the walker stands its ground
# and its legs stay planted.
[[model.animation]]
name = "flak_track"
loop = true
auto_play = false

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Flakhound and \
poses correctly — a four-legged anti-air walker striding on articulated legs whose \
feet plant flat and lift clear of the ground, whose back turret traverses and whose \
twin flak barrels elevate skyward to track a target without detaching while the body \
stays put, with a clear solar-amber targeting eye and the disciplined Duneforged \
palette."""

[[review_item]]
id = "reads-as-flakhound"
title = "Reads as a four-legged anti-air walker"
text = """
From more than one angle the model reads unmistakably as a four-legged anti-air \
walker: a squat armored body carried on four jointed legs splayed down its sides, \
and a turret up on its back carrying a pair of long flak barrels raked upward toward \
the sky. It is a striding flak platform, not an abstract stack of boxes on legs."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride on planted feet without clipping the ground"
text = """
Playing `walk` strides the walker forward on its legs. The clip is authored \
IN PLACE — the body holds its ground and does not drift across the scene; the \
forward stride is carried entirely by the legs, so played on its own the feet cycle \
and the planted foot slides straight back under the body (a treadmill) while a game \
supplies the real movement. Each foot has a clear \
PLANTED STANCE — flat and still on the ground while the body passes over it — then \
lifts clear, swings forward, and plants again with weight; the legs cycle in a stable \
gait so the walker is always supported and pushes itself forward, NOT flailing its \
legs in a continuous arc. The feet stay flat as they carry the body (they don't tip \
onto toe or heel), no foot is dragged or driven down through the ground, and the legs \
stay attached to the body across the whole cycle. The model had to invent an \
articulated leg (more than one segment and joint) for this to read as walking rather \
than swinging rigid poles."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "weapon-tracks"
title = "Turret traverses and barrels elevate to track the sky"
text = """
Playing `flak_track` works the anti-air weapon convincingly: the turret up on the \
walker's back traverses to swing its barrels onto a bearing, and the twin flak \
barrels elevate and depress to track a target across the sky — each moving about its \
own mount, with no geometry tearing away from its mount or clipping into the body \
as it moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "body-fixed"
title = "Body stays put; only the moving parts move"
text = """
The armored body is the fixed base of the walker: it stays put, never carried along \
by the turret or the legs. When `flak_track` plays, the weapon works while the legs \
stay planted; when `walk` plays, the legs stride while the turret and barrels hold. \
Nothing but the moving parts moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze body, iron legs, \
turret, and flak barrels, and the solar-amber targeting eye) with a clear amber \
targeting-eye accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
