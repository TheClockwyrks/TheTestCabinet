name = "Sunfront Flakhound"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "walker"]
summary = """
Sculpt and rig the Sunfront Flakhound: a 52x48x56 opaque-voxel four-legged \
anti-air walker striding on four independent, two-jointed legs (a hip, a reverse \
knee, and a flat foot each) so every foot plants and lifts clear of the ground, \
its back turret traversing on a caller-driven turret_yaw joint while its twin flak \
barrels elevate on a caller-driven barrel_pitch joint — built and rigged one \
recorded operation at a time, with a model-authored walk and a flak-tracking \
animation the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 52
height = 48
depth = 56
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts, these joints, and the required animations; at run
# time it MAY add further parts, joints, and animations of its own (recorded in
# rig.json) beyond what this table requires. `pivot` is `[x, y, z]` in voxel
# coordinates. `rig.json` is pre-seeded from this table so the contract exists from
# the first operation.
#
# The rig has two kinds of moving part, and the drive of each is deliberate:
#   * The FOUR legs' joints are `auto` — they are driven by the required `walk`
#     animation the model authors (a game plays `walk` to stride the walker). At
#     rest they hold the standing pose, so the `flak_track` weapon animation can
#     pose the turret while the legs stay put.
#   * The turret traverse and barrel elevation are `caller` — the procedural aim
#     interface a game (and the `flak_track` playback animation) drives by name.
[model]

# The walker's armored body: the root part (no parent), fixed to the world. It
# carries the traversing turret up top and the four independent leg hips tucked
# under its flanks. It rides raised off the ground on the legs.
[[model.part]]
name = "body"
pivot = [0, 0, 0]

# --- The four legs. Each leg is THREE parts (an upper thigh + a lower shin + a
# short flat foot) with two bending joints (a hip on the body and a reverse knee
# between thigh and shin) plus a small ankle tilt, so the foot lifts clear on the
# swing and plants flat on the ground instead of dragging. The legs are
# INDEPENDENT — each is its own chain on its own hip directly above its own foot
# (x,z held constant down the chain) — so no shared pivot drags a fore-and-aft bank
# of feet below ground. Two legs down each side: front (f), rear (r). ---

# Left-front leg: thigh -> shin -> foot, hung from its hip under the left-front
# corner of the body.
[[model.part]]
name = "thigh_lf"
parent = "body"
pivot = [12, 14, 38]

[[model.part]]
name = "shin_lf"
parent = "thigh_lf"
pivot = [12, 8, 38]

[[model.part]]
name = "foot_lf"
parent = "shin_lf"
pivot = [12, 2, 38]

# Left-rear leg.
[[model.part]]
name = "thigh_lr"
parent = "body"
pivot = [12, 14, 18]

[[model.part]]
name = "shin_lr"
parent = "thigh_lr"
pivot = [12, 8, 18]

[[model.part]]
name = "foot_lr"
parent = "shin_lr"
pivot = [12, 2, 18]

# Right-front leg.
[[model.part]]
name = "thigh_rf"
parent = "body"
pivot = [40, 14, 38]

[[model.part]]
name = "shin_rf"
parent = "thigh_rf"
pivot = [40, 8, 38]

[[model.part]]
name = "foot_rf"
parent = "shin_rf"
pivot = [40, 2, 38]

# Right-rear leg.
[[model.part]]
name = "thigh_rr"
parent = "body"
pivot = [40, 14, 18]

[[model.part]]
name = "shin_rr"
parent = "thigh_rr"
pivot = [40, 8, 18]

[[model.part]]
name = "foot_rr"
parent = "shin_rr"
pivot = [40, 2, 18]

# The traversing flak turret, mounted on the back of the body. It traverses on the
# caller-driven `turret_yaw`.
[[model.part]]
name = "turret"
parent = "body"
pivot = [26, 30, 28]

# The twin flak barrels, mounted on the turret front, so they swing with the
# turret and elevate on the caller-driven `barrel_pitch`.
[[model.part]]
name = "barrel"
parent = "turret"
pivot = [26, 36, 34]

# --- Joints ---

# --- The four legs: twelve `auto` joints (a hip, a knee, and a foot per leg),
# driven by the required `walk` animation. Each leg rests in a BENT-KNEE stance
# (knee rest -0.5, a clearly folded knee, never a straight column) so it can hold
# its foot flat and planted as the body passes over it. The knee folds the shin
# REARWARD (reverse / digitigrade). The foot joint counter-rotates against the shin
# to keep the foot flat (±~15°). ---

# Left-front hip: the big fore/aft sweep of the whole leg about its hip.
[[model.joint]]
name = "hip_lf"
part = "thigh_lf"
kind = "rotation"
axis = "x"
pivot = [12, 14, 38]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

# Left-front knee: reverse fold of the shin, lifting the foot on the swing.
[[model.joint]]
name = "knee_lf"
part = "shin_lf"
kind = "rotation"
axis = "x"
pivot = [12, 8, 38]
min = -1.4
max = 0.2
rest = -0.5
drive = "auto"

# Left-front foot: the small ankle tilt that keeps the foot flat.
[[model.joint]]
name = "foot_lf"
part = "foot_lf"
kind = "rotation"
axis = "x"
pivot = [12, 2, 38]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

[[model.joint]]
name = "hip_lr"
part = "thigh_lr"
kind = "rotation"
axis = "x"
pivot = [12, 14, 18]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

[[model.joint]]
name = "knee_lr"
part = "shin_lr"
kind = "rotation"
axis = "x"
pivot = [12, 8, 18]
min = -1.4
max = 0.2
rest = -0.5
drive = "auto"

[[model.joint]]
name = "foot_lr"
part = "foot_lr"
kind = "rotation"
axis = "x"
pivot = [12, 2, 18]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

[[model.joint]]
name = "hip_rf"
part = "thigh_rf"
kind = "rotation"
axis = "x"
pivot = [40, 14, 38]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

[[model.joint]]
name = "knee_rf"
part = "shin_rf"
kind = "rotation"
axis = "x"
pivot = [40, 8, 38]
min = -1.4
max = 0.2
rest = -0.5
drive = "auto"

[[model.joint]]
name = "foot_rf"
part = "foot_rf"
kind = "rotation"
axis = "x"
pivot = [40, 2, 38]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

[[model.joint]]
name = "hip_rr"
part = "thigh_rr"
kind = "rotation"
axis = "x"
pivot = [40, 14, 18]
min = -0.5
max = 0.5
rest = 0.0
drive = "auto"

[[model.joint]]
name = "knee_rr"
part = "shin_rr"
kind = "rotation"
axis = "x"
pivot = [40, 8, 18]
min = -1.4
max = 0.2
rest = -0.5
drive = "auto"

[[model.joint]]
name = "foot_rr"
part = "foot_rr"
kind = "rotation"
axis = "x"
pivot = [40, 2, 18]
min = -0.3
max = 0.3
rest = 0.0
drive = "auto"

# The required caller-driven turret traverse: a game addresses `turret_yaw` by name
# to swing the turret (and the barrels with it) about its vertical mount, a full
# half-turn each way. `rest = 0` faces straight forward (+z).
[[model.joint]]
name = "turret_yaw"
part = "turret"
kind = "rotation"
axis = "y"
pivot = [26, 30, 28]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "caller"

# The required caller-driven barrel elevation: a game addresses `barrel_pitch` by
# name to elevate the twin barrels up toward the air. `rest = 0.5` is a raised idle
# elevation; `max = 1.3` points them steeply skyward.
[[model.joint]]
name = "barrel_pitch"
part = "barrel"
kind = "rotation"
axis = "x"
pivot = [26, 36, 34]
min = 0.0
max = 1.3
rest = 0.5
drive = "caller"

# --- Required animations (declarations only — the model authors the F-curve
# keyframes at run time with `voxel-anim define-animation`/`add-keyframe`). Each
# declares the animation's identity and intent; it carries NO keyframes here. ---

# `walk`: the WALK. It drives all twelve leg joints — each leg's hip swings
# fore-and-aft, its reverse knee folds to lift the foot on the swing, and its ankle
# keeps the foot flat — in a DIAGONAL-PAIR gait (legs lf/rr step together, opposite
# rf/lr), so a game (and the reviewer) sees exactly how the walker strides. It
# touches NO weapon joint, so the turret and barrels hold at rest.
[[model.animation]]
name = "walk"
period_ms = 650
loop = true
auto_play = false
joints = [
  "hip_lf", "knee_lf", "foot_lf",
  "hip_lr", "knee_lr", "foot_lr",
  "hip_rf", "knee_rf", "foot_rf",
  "hip_rr", "knee_rr", "foot_rr",
]

# `flak_track`: the WEAPON showcase. It sweeps the turret left->right on
# `turret_yaw` while raising and lowering the barrels on `barrel_pitch`, so a
# reviewer can watch the walker track a target across the sky without dragging the
# sliders. It touches NO leg joint, so the legs hold their standing pose.
[[model.animation]]
name = "flak_track"
period_ms = 4000
loop = true
auto_play = false
joints = ["turret_yaw", "barrel_pitch"]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Flakhound and \
poses correctly — a four-legged anti-air walker striding on four independent \
two-jointed legs whose feet plant flat and lift clear of the ground, whose back \
turret traverses on its vertical mount and whose twin flak barrels elevate skyward \
without detaching while the body stays put, with a clear solar-amber targeting eye \
and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-flakhound"
title = "Reads as an anti-air walker"
text = """
From more than one angle the model reads unmistakably as a four-legged anti-air \
walker: a squat armored body, four independent jointed legs (each a thigh + shin + \
foot with a clearly bent knee) splayed down its sides, and a turret on its back \
carrying a pair of long flak barrels raked upward. It is a striding flak platform, \
not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride independently without clipping the ground"
text = """
Playing `walk` strides the walker on its four legs: each leg swings on its own \
`hip_*` joint and folds at its own reverse `knee_*` so the foot lifts clear of the \
ground on its swing, then plants flat and still (`foot_*` keeping it level) while \
the body passes over it — the legs step in a diagonal-pair gait, NOT as one rigid \
bank, and no foot is dragged or driven down through the ground. Each shin stays \
attached to its thigh and each thigh to the body across the whole range."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "turret-tracks"
title = "Turret traverses; barrels elevate"
text = """
Driving `turret_yaw` (and playing `flak_track`) swings the turret cleanly about \
its vertical mount and driving `barrel_pitch` raises and lowers the twin barrels \
about their hinge, each across its full range with no voxel tearing off its mount \
or clipping into the body below."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "body-fixed"
title = "Body stays fixed; only the moving parts move"
text = """
The armored body is the fixed root of the rig: it stays put, never carried along \
by the turret or the legs. When `flak_track` plays, only the turret and barrels \
move and the legs hold their standing pose; when `walk` plays, only the legs move \
and the turret stays put. Nothing but the moving parts moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Turret, barrels, and legs stay attached"
text = """
Each child stays attached across its joint's range: each leg's segments meet at \
the hip, knee, and ankle with no gap, the turret meets the back of the body, and \
the barrels meet the turret's front — with no gap and never floating free or \
detaching as the legs stride, the turret traverses, and the barrels elevate."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze body, iron legs \
and flak barrels, and the solar-amber eye accent) with a clear amber targeting eye \
on the turret, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
