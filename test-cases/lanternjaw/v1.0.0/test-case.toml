slug = "lanternjaw"
experimental = true
name = "Lanternjaw"
difficulty = "hard"
tags = ["sprite-sheet", "enemy"]
summary = """
Draw the Lanternjaw: the Lure, an anglerfish-style deep-sea predator that hunts \
by light with a dangling lure-light, as a 128x128 sprite sheet — four-direction \
movement plus a lure-bob animation, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x32 file — and the named
# animation sequences a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.frame]]
index = 8

[[sheet.frame]]
index = 9

[[sheet.frame]]
index = 10

[[sheet.frame]]
index = 11

[[sheet.frame]]
index = 12

[[sheet.frame]]
index = 13

[[sheet.frame]]
index = 14

[[sheet.frame]]
index = 15

[[sheet.sequence]]
slug = "walk-down"
name = "Swim — down"
frames = [0, 1]
fps = 4

[[sheet.sequence]]
slug = "walk-up"
name = "Swim — up"
frames = [2, 3]
fps = 4

[[sheet.sequence]]
slug = "walk-left"
name = "Swim — left"
frames = [4, 5]
fps = 4

[[sheet.sequence]]
slug = "walk-right"
name = "Swim — right"
frames = [6, 7]
fps = 4

[[sheet.sequence]]
slug = "lure-bob"
name = "Lure bob"
frames = [8, 9, 10, 11, 12, 13]
fps = 6

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Lanternjaw target — its bulky \
dark silhouette, the dangling amber lure-light, the four readable swim \
directions, and the lure-bob animation that marks it as the predator that hunts \
by light."""

[[review_item]]
id = "dangling-lure"
title = "Dangling lure-light"
text = """
Every frame shows a dangling lure-light leading the head — a small glowing amber \
bulb on a thin stalk, the brightest element of the sprite against the dark body. \
It is the bait of an ambush predator and the creature's defining feature."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "four-directions"
title = "Four readable directions"
text = """
The movement frames read as the creature swimming in four distinct directions — \
down, up, left, and right — each with its bulky head (and the lure ahead of it) \
leading its direction of travel and a forked tail trailing behind, not the same \
blob repeated."""
sequences = ["walk-down", "walk-up", "walk-left", "walk-right"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "lure-bob-tell"
title = "Lure-bob animation"
text = """
The tell frames (row 2 into row 3) show the dangling lure bobbing and its amber \
glow pulsing — bigger and brighter, then easing back — across the frames, so \
playing them reads as the lure beckoning."""
sequences = ["lure-bob"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Dark body, amber lure"
text = """
Uses the Lure's palette from the brief (dark slate body, lighter underside, near-\
black outline/maw, amber lure glow, bright lure core) with no out-of-palette \
colors and no halo of stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each creature fills most of its own 32x32 frame cell, centered with a small \
margin, neither tiny in a corner nor spilling across the grid lines into the \
neighboring frame."""
weight = 1
domain = "fidelity"
