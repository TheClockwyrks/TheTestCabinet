slug = "siege-husk"
name = "Siege Husk"
difficulty = "medium"
tags = ["skinned", "character"]
summary = """
Sculpt and rig the Siege Husk: a low-poly, shambling humanoid enemy for the Siege \
first-person last-stand game, built as ONE continuous skin with the `mc-skin` tool — a \
whole-body signed-distance field bound to a model-invented \
skeleton and deformed across its joints by per-vertex weights, not posed as rigid \
parts. The model invents the whole skeleton; the fixed contract is three animations it \
must author so the skin deforms convincingly — a looping `walk` shamble, a one-shot \
`lunge` attack, and a one-shot `collapse` death crumple — the reviewer can play back."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "mc-skinned"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt and rig the SAME husk at three field sizes — `base` (this
# case's volume), `half` (each extent ~halved), and `double` (each doubled) — each
# declaring its own `[voxel]` override. `base` is first, so it is the default. This
# list is a root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The field bounds — the same [voxel] volume table a meshed case frames, here bounding
# the ONE whole-body signed-distance field the skin is extracted from: `width` across
# (x), `height` up (y), `depth` front-to-back (z), in field units. A skinned model
# builds a single field for the whole body — there is no per-part field and no
# `--part` flag. Material is opaque `#rrggbb` (there is NO alpha); the volume always
# starts EMPTY; `background` is only the clear color behind the rendered preview PNG. A
# skinned case must NOT declare [canvas].
[voxel]
width = 24
height = 48
depth = 20
background = "transparent"

# The skinning tool. `mc-skin` is the only way to sculpt the field and edit the
# skeleton; it composites additive/subtractive primitives with an optional soft
# `--blend` into one whole-body field, records each op only, and renders on request via
# `mc-skin render` (which extracts the surface, derives the skin weights, and writes
# mesh.glb + the preview). Marching Cubes gives a fixed LOW-POLY, chunky faceted
# surface — it is the binary's character, not a knob. Run `mc-skin --help` for the field
# operations AND the skeleton/animation subcommands; no operations schema is seeded.
#
# `preview` is a SINGLE file — NOT a {part} template — because a skinned character is
# one field and one mesh. This is the skinned exception: the rigid mc/sn/dc-animation
# kinds template preview by part, but a skinned kind must NOT carry a {part} token.
[tool]
binary = "mc-skin"
preview = "model.png"

# The recorded operation log — the authoritative output the run collects: the ordered
# record of every `mc-skin` op the model issued, from which the scored character is
# regenerated. It is a SINGLE log — NOT a {part} template — since a skinned character is
# one field with one log. The skinned mesh.glb (geometry plus the glTF skin: per-vertex
# bone weights and inverse-bind matrices) and rig.json (skeleton, joint interface, and
# F-curve animations) are emitted automatically by core, so neither is named here.
[output]
actions = "actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe bones, joints, pivots, ranges, or the per-vertex weights: the model
# invents the whole skeleton and its binding to the skin and is judged on whether the
# character deforms convincingly. What is fixed is the set of NAMED ANIMATIONS the model
# must author (a game plays them by name) and whether each loops and self-plays. The
# model authors each animation's F-curves at run time with `mc-skin
# define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations so
# the contract exists from the first operation. Weights are derived automatically at
# render (bone-heat diffusion, capped at four influences per vertex).
[model]

# `walk` — the shamble (a game-triggered playable). A looping gait in which the legs
# plant and drag forward while the pelvis and spine flex, the arms hang and sway, and
# the head lolls — the skin bending smoothly across the hips, knees, shoulders, and
# spine with no seam or tear. Authored in place; a game supplies the real travel.
[[model.animation]]
name = "walk"
loop = true
auto_play = false

# `lunge` — the attack (a game-triggered playable, plays once and holds). A single
# forward wrench in which the torso and a shoulder carry an arm out to grab or swipe:
# the spine coils and snaps forward, then settles. The skin stretches across the
# shoulder and folds at the waist, one continuous surface throughout.
[[model.animation]]
name = "lunge"
loop = false
auto_play = false

# `collapse` — the death crumple (a game-triggered playable, plays once and holds). The
# legs buckle and the spine folds as the body crumples down and holds limp on the
# ground — the skin folding at the knees, waist, and neck as it goes slack, never
# tearing apart at a joint.
[[model.animation]]
name = "collapse"
loop = false
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template
# (`.hbs`), rendered per variant so the field volume it states matches the selected
# size. The seeded dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated character reads as the Siege Husk — a decrepit, \
low-poly shambling humanoid with ashen grey-green flesh, tattered dark cloth, and \
exposed bone, in the disciplined palette from the brief — and stands as a believable \
humanoid at rest."""

[[domain]]
id = "deformation"
name = "Deformation"
description = """
How convincingly the one continuous skin deforms ACROSS its joints in each animation — \
an elbow, hip, or spine that bends and folds without the surface tearing or a seam \
opening — rather than the body reading as rigid pieces snapping about pivots."""

[[review_item]]
id = "reads-as-husk"
title = "Reads as a shambling husk"
text = """
From more than one angle the model reads unmistakably as a decrepit humanoid enemy: a \
standing body with a head, a torso wrapped in tattered cloth, two arms, and two legs, \
gaunt and hunched rather than upright and healthy. It is a recognizable shambling \
figure, not an abstract blob or a stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "one-continuous-skin"
title = "One continuous skin that deforms across joints"
text = """
The body is a single continuous skin, not rigid parts posed about pivots: where a limb \
bends — an elbow, a knee, a hip, the spine — the surface stretches and folds smoothly \
across the joint, with no seam opening, no gap, and no part tearing away from the body. \
The character holds together as one skin through every pose."""
weight = 3
domain = "deformation"

[[review_item]]
id = "walk-shambles"
title = "Walk shambles convincingly"
text = """
Playing `walk` reads as a decrepit body dragging itself forward: the legs plant and \
swing while the pelvis and spine flex and the arms sway, looping smoothly. It carries \
the lurching weight of a husk rather than sliding stiffly, and the skin bends across \
the hips, knees, and shoulders without tearing."""
weight = 2
domain = "deformation"

[[review_item]]
id = "lunge-attacks"
title = "Lunge reads as a forward attack"
text = """
Playing `lunge` wrenches the body forward once and holds: the spine coils and snaps \
forward while a shoulder and arm carry out to grab or swipe, the torso following. The \
skin stretches across the shoulder and folds at the waist as one surface, and the pose \
reads as a deliberate attack lunge rather than a twitch."""
weight = 2
domain = "deformation"

[[review_item]]
id = "collapse-crumples"
title = "Collapse crumples into death"
text = """
Playing `collapse` buckles the legs and folds the spine so the body crumples down and \
holds limp on the ground once, reading as a death. The skin folds at the knees, waist, \
and neck as the body goes slack — it slumps and settles rather than tipping over rigid \
like a felled plank."""
weight = 2
domain = "deformation"

[[review_item]]
id = "palette"
title = "Husk palette discipline"
text = """
Uses only the Siege Husk colors from the brief (ashen grey-green flesh and its deeper \
recessed value, tattered dark cloth and its worn value, and exposed bone) with no \
out-of-palette colors and no stray material drifting off the body."""
weight = 1
domain = "fidelity"
