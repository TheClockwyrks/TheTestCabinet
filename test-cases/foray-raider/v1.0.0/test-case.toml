name = "Foray Raider"
difficulty = "hard"
tags = ["asset-generation", "2d", "sprite-sheet", "enemy"]
summary = """
Draw the Foray raider: the lean forager caste of a top-down ant-colony raiding \
game, as an eight-frame 16x16 sprite sheet — four empty facings plus the same \
four laden with a gold seed (the carry-weight tell), drawn in a neutral \
recolorable ramp, produced one drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_seconds = 3600
type = "asset-generation"
asset_kind = "sprite-sheet"

# Each frame is its own 16x16 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 16
height = 16
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 16x16 file. Frames 0-3 are the
# empty raider's four facings; 4-7 are the same facings laden with a seed. Two
# sequences let a reviewer compare empty vs laden across the facings.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "facings-empty"
name = "Facings — empty"
frames = [0, 2, 1, 3]
fps = 2

[[sheet.sequence]]
slug = "facings-laden"
name = "Facings — laden"
frames = [4, 6, 5, 7]
fps = 2

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"
dest = "specs/brief.md"

[[variant]]
slug = "base"
name = "Base"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Foray raider — its lean \
mandible-less silhouette, the four readable facings, the carry-weight tell (a \
laden raider visibly heavier under a gold seed), and the neutral recolorable \
grey ramp that lets the renderer tint it per colony."""

[[review_item]]
id = "lean-silhouette"
title = "Lean forager silhouette"
text = """
The empty raider reads as a slim, fast, unarmored forager with a small head and \
NO mandibles — clearly lighter and leaner than the heavy mandibled soldier. The \
slim body is how the caste reads apart from the defender."""
frames = [0, 1, 2, 3]
weight = 2
domain = "fidelity"

[[review_item]]
id = "four-facings"
title = "Four readable facings"
text = """
The empty frames read as the same raider turned to face four distinct directions \
— down, up, left, and right — each with its head leading that direction, not the \
same blob repeated. Left mirrors right; up mirrors down."""
sequences = ["facings-empty"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "carry-weight-tell"
title = "Carry-weight tell"
text = """
The laden frames (4–7) each carry a rounded GOLD seed riding on the raider's \
back — the most eye-catching element — and the laden body reads visibly slower \
and heavier than its matching empty frame, so empty-vs-laden is obvious at a \
glance. This is the raider's signature mechanic."""
sequences = ["facings-laden"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Neutral recolorable palette + gold seed"
text = """
The body uses only the neutral grey ramp from the brief (darkest, mid, light, \
accent) plus the fixed dark outline — no red, no blue — so the renderer's \
per-colony palette swap can tint it; the carried seed is the shared gold and the \
only non-grey color. No out-of-palette colors and no halo of stray pixels."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each ant fills most of its own 16x16 frame, centered with about a pixel of \
margin, neither tiny in a corner nor clipped at the edge or spilling across the \
grid into a neighboring frame; the carried seed stays within the frame."""
weight = 1
domain = "fidelity"
