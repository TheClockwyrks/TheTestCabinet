name = "Glimmerfin"
difficulty = "hard"
tags = ["asset-generation", "2d", "sprite-sheet", "player"]
summary = """
Draw the Glimmerfin: the player's bioluminescent forager in a deep-sea maze \
chase, as a 32x32 sprite sheet — a four-direction swim with a chomp cycle as it \
grazes, produced one drawing operation at a time. Its glow is a runtime effect, \
not part of the sheet."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — eight separate 32x32 frames, a two-frame
# mouth-closed / mouth-open chomp cycle in each of the four directions — and the
# named sequences a reviewer plays back. The forager's brightness GLOW is NOT on
# this sheet: it flares up at any time from the player's actions and is a runtime
# effect, so the sprite carries no baked-in halo.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.sequence]]
slug = "graze-down"
name = "Graze — down"
frames = [0, 1]
fps = 6

[[sheet.sequence]]
slug = "graze-up"
name = "Graze — up"
frames = [2, 3]
fps = 6

[[sheet.sequence]]
slug = "graze-left"
name = "Graze — left"
frames = [4, 5]
fps = 6

[[sheet.sequence]]
slug = "graze-right"
name = "Graze — right"
frames = [6, 7]
fps = 6

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Glimmerfin target — its bright \
cyan forager silhouette, the four readable swim directions, and the chomp cycle \
that reads as a small creature grazing, with no glow baked into the sprite."""

[[review_item]]
id = "four-directions"
title = "Four readable directions"
text = """
The frames read as the forager swimming in four distinct directions — down, up, \
left, and right — each with its mouth/head leading its direction of travel and a \
forked tail trailing behind, not the same blob repeated."""
sequences = ["graze-down", "graze-up", "graze-left", "graze-right"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "chomp"
title = "Chomp cycle"
text = """
The two frames of each direction read as a mouth opening and closing at the \
leading edge — one frame mouth-closed (a thin slit), one mouth-open (a clear \
wedge bitten out of the front) — so playing them reads as the forager grazing. \
This chomp is the player's signature animation."""
sequences = ["graze-down", "graze-up", "graze-left", "graze-right"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Cyan forager palette"
text = """
Uses the Glimmerfin's palette from the brief (bright cyan body, lighter belly, \
dark outline, a small bright highlight) with no out-of-palette colors. The sprite \
carries no drawn glow or halo of stray pixels — its brightness is a runtime \
effect, not baked into the frames."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each forager fills most of its own 32x32 frame cell, centered with a small \
margin, neither tiny in a corner nor spilling across the grid lines into the \
neighboring frame."""
weight = 1
domain = "fidelity"
