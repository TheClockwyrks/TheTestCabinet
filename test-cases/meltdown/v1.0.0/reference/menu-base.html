<!DOCTYPE html>
<!--
  Meltdown — title / main menu reference mockup for the `base` variant.
  Canonical view slug: title
  Lists PLAY (which opens mode select) then HOW TO PLAY. Render at a 1280x720
  viewport. See ../specs/flow.md (Game states: Title / main menu) and
  ../specs/modes.md (the mode flow). Illustrative only, not a layout to copy.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meltdown — Title</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- A dim slice of reactor floor with a few glowing towers behind the menu. -->
      <div class="floor">
        <div class="tower emitter h-cold dim" style="left: 120px; top: 120px">
          <span class="glyph">&#9650;</span>
          <div class="heatbar"><span></span></div>
        </div>
        <div class="tower emitter h-white dim" style="left: 200px; top: 470px">
          <span class="glyph">&#9670;</span>
          <div class="heatbar"><span></span></div>
        </div>
        <div class="tower forge dim" style="left: 160px; top: 470px">
          <span class="glyph">&#9608;</span>
        </div>
        <div class="tower emitter h-hot dim" style="left: 820px; top: 160px">
          <span class="glyph">&#9670;</span>
          <div class="heatbar"><span></span></div>
        </div>
        <div class="tower rime dim" style="left: 880px; top: 520px">
          <span class="glyph">&#10052;</span>
          <div class="heatbar"><span></span></div>
        </div>
      </div>

      <div class="center">
        <h1 class="title">MELTDOWN</h1>
        <div class="tagline">RUN IT HOT</div>
        <nav class="menu">
          <div class="menu-item selected">PLAY</div>
          <div class="menu-item">HOW TO PLAY</div>
        </nav>
      </div>

      <div class="hint">&#9650; &#9660; MOVE &nbsp;&nbsp; ENTER SELECT</div>
    </div>
  </body>
</html>
