slug = "meltdown"
experimental = true
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Meltdown"

# Relative difficulty (easy | medium | hard), surfaced on the site. Meltdown asks
# for grid-based tower placement with live maze re-pathing, eight tower types each
# with distinct thermal behavior, a heat-to-damage model with a redline trip,
# upgrade and economy systems, several surge types including maze-ignoring flyers,
# a 20-wave progression with win and loss, and multiple states. Those are several
# systems that want to be split out behind interfaces — real planning — but it is
# still a bounded, single-screen 2D build, so it sits at easy.
difficulty = "easy"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["strategy", "2d", "tower-defense"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
An open-field tower-defense game where your towers are also the walls, so you \
build the maze the surge must walk — and every emitter fires harder the hotter it \
runs, but trips offline at the redline. Pace heat across the floor: run a core \
white-hot, keep a sniper fed, hold the cryo line cold."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. Meltdown is a substantial build (grid maze and live pathing, eight
# towers, the heat/redline model, economy and upgrades, a 20-wave progression,
# multiple states), so it gets a full five hours.
max_runtime_hours = 5
# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This version offers a single `base` variant (the standard Containment defense on
# the one fixed floor), declared in its own file under `variants/`. It supplies the
# `title` view's menu mockup; `gameplay` and `game-over` are common. Future
# versions/variants are expected to add alternate floors (a central reactor block,
# scattered cores) and rule twists as additional variants on top of this base.
# This list is a root key, so it must precede the first table header (`[build]`).
variants = ["variants/base.toml"]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern. All common specs are
# plain Markdown, seeded verbatim.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/heat.md"

[[spec]]
source = "specs/towers.md"

[[spec]]
source = "specs/creeps.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/flow.md"

[[spec]]
source = "specs/standard.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup the harness renders to a screenshot and seeds as a visual target. The
# `title` view is variant-specific (declared per variant above); `gameplay` and
# `game-over` look the same in every variant.
[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-match"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "End screen"
dest = "proof/game-over.png"

[[proof]]
id = "heat"
name = "Heat-as-power clip"
dest = "proof/heat.webm"

[[proof]]
id = "siege"
name = "Maze and surge clip"
dest = "proof/siege.webm"

# Validation checks (opt-in). Only the checks declared here run. Each drives the
# built implementation, screenshots it, and compares against the rendered
# screenshot of `reference`. Only the title screen is deterministic enough to
# validate for Meltdown: it is whatever the game shows on load, so it needs no
# actions. Gameplay and game-over depend on live, player-built state, so they are
# seeded as references but not validated.
[[check]]
view = "title"
name = "Title Screen"
reference = "title"
actions = []

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — a flawless heat system
# cannot mask a maze that does not path, and vice versa. Domains are case-level; an
# individual review item rolls up to one through its optional `domain`, while a
# general item (states, window fit) omits it.
[[domain]]
id = "heat"
name = "Heat & Thermal Play"
description = "The signature: heat as power and the accelerating damage curve, the redline trip as the sole failure, the Forge/Vent coupling, the heat-averse Rime, and how the maze paces each tower's heat."

[[domain]]
id = "defense"
name = "Tower Defense"
description = "The TD core: towers-as-walls mazing and live re-pathing to the fixed opposite exhaust, the can't-seal rule, the tower roster and upgrades, the surge types and maze-ignoring flyers, and the economy and 20-wave progression."

# Reviewer checklist items, common to every variant. The major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss. Reporter-side material: never
# seeded into a run, so the model never sees the checklist; each restates a
# requirement the seeded specification already states. Each item is worth `weight`
# points toward the run's score; the reviewer records a pass/fail verdict for each
# before the run can be published.

[[review_item]]
id = "heat-is-power"
title = "Heat is power"
text = "An emitter's damage climbs with its heat on an accelerating curve — feeble when cold (about 0.5x base), roughly 3x just under the redline — and its glow tracks heat from cold blue to white-hot. A tower fed a steady stream of targets visibly hits harder than an idle one."
weight = 1
domain = "heat"
reference = "gameplay"
proof = "heat"

[[review_item]]
id = "redline-trip"
title = "The redline trip"
text = "Pushing a tower's heat to 100 trips it offline for about 3 seconds (strobing red, dealing no damage), then it returns cold — and this is the ONLY way a tower fails (towers are never destroyed or damaged by the surge). A redlined kill-box visibly gaps the defense for those seconds."
weight = 1
domain = "heat"
proof = "heat"

[[review_item]]
id = "maze-paces-heat"
title = "The maze paces heat"
text = "A tight, packed kill-box runs its towers hot (high damage, but climbing toward a trip) while an open, spread layout runs them cool (online but weak), so the maze shape is what sets each tower's heat baseline — concentration buys power and fragility at once."
weight = 1
domain = "heat"

[[review_item]]
id = "forge-source"
title = "The Forge (heat source)"
text = "The Forge does not fire; it adds heat to each orthogonally adjacent emitter continuously. In a lull it keeps a cold gun (e.g. a Lance) strong; in a heavy push it stacks heat onto an already-hot neighbor and can shove it over the redline. The same property is its upside and its downside."
weight = 1
domain = "heat"

[[review_item]]
id = "vent-sink"
title = "The Vent (heat sink)"
text = "The Vent does not fire; it removes heat from each orthogonally adjacent emitter continuously, letting a redline-prone tower (e.g. a Stutter) run flat out without tripping, or holding a packed core just under the redline at maximum damage. Coupling is orthogonal-neighbors only."
weight = 1
domain = "heat"

[[review_item]]
id = "rime-averse"
title = "The heat-averse Rime"
text = "The cryo Rime runs the rule backward: it slows the surge hardest when COLD and its slow degrades as it heats (to nothing at the redline), so it wants isolation or a Vent and is ruined by an adjacent Forge or a hot core. Some surge (the Core boss) is immune to slowing entirely."
weight = 1
domain = "heat"

[[review_item]]
id = "upgrades-hotter"
title = "Upgrades and selling"
text = "A tower upgrades through three levels, each making an emitter stronger AND hotter-running (a maxed emitter is a glass cannon that needs thermal support); the Forge/Vent grow their output. Selling refunds 70% of total spend and reopens the tile."
weight = 1
domain = "heat"

[[review_item]]
id = "mazing"
title = "Towers are walls"
text = "There is no fixed path: every tower is also a wall, and the surge pathfinds the shortest open route around them, so the player builds the maze. Placing or selling a tower re-paths every unit on the floor live, with no teleporting."
weight = 1
domain = "defense"
reference = "gameplay"
proof = "siege"

[[review_item]]
id = "cant-seal"
title = "You can never seal the floor"
text = "A placement that would leave any intake with no route to any exhaust (or trap a unit already walking) is refused and shown invalid — there is always at least one open path from each intake to an exhaust."
weight = 1
domain = "defense"

[[review_item]]
id = "opposite-exhaust"
title = "Two intakes, two exhausts"
text = "The surge enters at the mid-left and mid-top intakes and leaves at the mid-right and mid-bottom exhausts, each unit routing to its fixed opposite exhaust (left→right, top→bottom) and never the nearer one — so the maze must lengthen that crossing to be effective."
weight = 1
domain = "defense"

[[review_item]]
id = "flyers-and-flak"
title = "Flyers ignore the maze"
text = "Flyers (Drift) fly in a straight line from intake to the opposite exhaust, over every tower and wall, and any emitter can hit them while they are in range (the Flak is the dedicated air specialist, but not the only counter). Because the maze cannot stop them, a defense that leaves the flight line uncovered leaks flyers regardless of how good the maze is."
weight = 1
domain = "defense"
proof = "siege"

[[review_item]]
id = "tower-roster"
title = "The six emitters"
text = "All six emitters behave per their roles: the balanced Arc, the rapid low-damage Stutter, the long-range heavy-hitting Lance, the area-splash Bloom, the slowing Rime, and the anti-air Flak — each targeting and firing as specified."
weight = 1
domain = "defense"

[[review_item]]
id = "surge-and-waves"
title = "Surge, waves, and the economy"
text = "The surge mixes Motes, Sprints, Hulks, Swarm packs, Drift flyers, and Core bosses (on waves 10 and 20), each with its trait; a leak costs lives, 0 lives ends the game, and clearing wave 20 wins. The economy runs on kill bounties, wave bonuses, interest, and an early-send bonus."
weight = 1
domain = "defense"

[[review_item]]
id = "states-complete"
title = "Game states"
text = "Every game state is reachable and behaves correctly: title menu, how-to-play, in-match (the build phase between waves and the live wave), pause (resume/restart/quit), Victory, and Game over (reactor breached), each with the right screen and actions."
weight = 1
reference = "title"
proof = "title"

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The entire 1280x720 stage — the full reactor floor, the build panel, and all four edges — stays visible, fitted, and centered at any window size and pixel density, including on load before any input."
weight = 1
