name = "Wireworm Glitch"
difficulty = "medium"
tags = ["asset-generation", "2d", "sprite-sheet", "enemy"]
summary = """
Draw the glitch — the corrupted skittering foe that eats the board's nodes in the \
Wireworm circuit-board arcade game — as a 32x32 four-frame sprite sheet: an \
angular error-red mass split by chromatic fringes, torn by scanlines, and dotted \
with static, jittering in place, produced one drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one small
# on-board foe sized to a grid cell. Fixing the size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — four separate 32x32 frames of the glitch jittering
# in place — and the named sequence a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.sequence]]
slug = "flicker"
name = "Glitch — flicker"
frames = [0, 1, 2, 3]
fps = 10

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated glitch matches the brief — an angular error-red \
mass split by cyan/magenta chromatic fringes, torn by scanlines, and dotted with \
white static, jittered to a different corruption in each of four frames, in the \
tight glitch palette on transparency."""

[[review_item]]
id = "corruption-read"
title = "Reads as visible corruption"
text = """
The sprite reads as corruption made visible — a jagged, angular mass split by \
red/cyan/magenta chromatic-aberration fringes, torn by scanline breaks, and \
scattered with white static — not a smooth, solid creature with a face or legs. A \
glance says hostile error."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "flicker"
title = "Unstable flicker, not a walk"
text = """
Played fast, the four frames read as one mass jittering and tearing in place — the \
blob shifts a couple of px, the scanline tears and chromatic fringes move, and the \
static re-scatters each frame — never holding still and never traveling or growing \
across the loop. It is instability, not a walk cycle."""
sequences = ["flicker"]
weight = 3
domain = "fidelity"

[[review_item]]
id = "palette-and-transparency"
title = "Glitch palette on transparency"
text = """
Uses only the glitch palette from the brief (error-red core, cyan and magenta \
fringes, deep shadow, and white static) on full transparency — no out-of-palette \
pixels and no opaque background fill; only the glitch's pixels are opaque so it \
composites onto the dark board."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Centered and uncropped"
text = """
The mass stays centered near (16, 16) and its jitter keeps it inside the 32×32 \
frame rather than clipping flat against an edge, with the rest of each frame fully \
transparent."""
weight = 1
domain = "fidelity"
