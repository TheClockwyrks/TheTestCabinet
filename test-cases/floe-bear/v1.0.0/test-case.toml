slug = "floe-bear"
name = "Floe Bear"
difficulty = "hard"
tags = ["asset-generation", "2d", "sprite-sheet", "enemy"]
summary = """
Draw the ice bear that hunts the player in the Floe arctic-crossing game — a huge \
white predator — as a 32x32 eighteen-frame sprite sheet, all from a top-down \
camera: a four-direction run cycle, a four-direction mostly-submerged swim with a \
trailing wake, and an open-maw lunge, produced one drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1
type = "asset-generation"
asset_kind = "sprite-sheet"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header
# (`[canvas]`).
variants = ["variants/base.toml"]

# Each frame is its own 32x32 transparent canvas (a separate file) — one big
# predator sized to fill a grid cell. Fixing the size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each
# frame's regenerated image is built from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — eighteen separate 32x32 frames of the bear's
# movement set — and the named sequences a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0

[[sheet.frame]]
index = 1

[[sheet.frame]]
index = 2

[[sheet.frame]]
index = 3

[[sheet.frame]]
index = 4

[[sheet.frame]]
index = 5

[[sheet.frame]]
index = 6

[[sheet.frame]]
index = 7

[[sheet.frame]]
index = 8

[[sheet.frame]]
index = 9

[[sheet.frame]]
index = 10

[[sheet.frame]]
index = 11

[[sheet.frame]]
index = 12

[[sheet.frame]]
index = 13

[[sheet.frame]]
index = 14

[[sheet.frame]]
index = 15

[[sheet.frame]]
index = 16

[[sheet.frame]]
index = 17

[[sheet.sequence]]
slug = "run-down"
name = "Bear — run down"
frames = [0, 1]
fps = 6

[[sheet.sequence]]
slug = "run-up"
name = "Bear — run up"
frames = [2, 3]
fps = 6

[[sheet.sequence]]
slug = "run-left"
name = "Bear — run left"
frames = [4, 5]
fps = 6

[[sheet.sequence]]
slug = "run-right"
name = "Bear — run right"
frames = [6, 7]
fps = 6

[[sheet.sequence]]
slug = "swim-down"
name = "Bear — swim down (submerged)"
frames = [8, 9]
fps = 5

[[sheet.sequence]]
slug = "swim-up"
name = "Bear — swim up (submerged)"
frames = [10, 11]
fps = 5

[[sheet.sequence]]
slug = "swim-left"
name = "Bear — swim left (submerged)"
frames = [12, 13]
fps = 5

[[sheet.sequence]]
slug = "swim-right"
name = "Bear — swim right (submerged)"
frames = [14, 15]
fps = 5

[[sheet.sequence]]
slug = "lunge"
name = "Bear — lunge"
frames = [16, 17]
fps = 6

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated bear matches the brief — one big, heavy, \
dark-outlined white predator, the same bulk in every frame, drawn from a top-down \
camera in every frame, with a four-direction run cycle, a four-direction \
mostly-submerged swim with a trailing wake, and an open-maw lunge, in the tight \
arctic-predator palette on transparency."""

[[review_item]]
id = "dangerous-animal"
title = "Reads as a big dangerous predator"
text = """
The sprite reads at a glance as a huge, heavy, dangerous animal — a bulky bear with \
a low broad head, small dark predatory eyes, and thick, powerful legs (not thin \
twigs) — never cute or small. It fills the frame and is the same size and bulk in \
every frame, and its dark outline and cool shadow keep it from reading as a flat \
white blob."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "four-way-run"
title = "Four-direction run cycle"
text = """
The bear has a readable run facing down (0–1), up (2–3), left (4–5), and right \
(6–7), each a two-frame gait whose legs swap so it lumbers in place when played. \
The four facings are clearly distinct directions of the same animal seen from the \
SAME overhead (top-down) camera — the left and right runs look down on the bear's \
back turned sideways, NOT a side/profile view — and the right run is a clean mirror \
of the left."""
sequences = ["run-down", "run-up", "run-left", "run-right"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "submerged-swim"
title = "Readable submerged swim"
text = """
The swim frames read as the bear mostly UNDER water in all four headings — down \
(8–9), up (10–11), left (12–13), right (14–15) — each a muted, cool submerged \
silhouette (still top-down, not a profile) with only the top of its head/back \
breaking the surface in fur-white and a pale wake trailing behind its heading, so \
its position stays readable even when it is in the water. Played, each heading's \
wake and paddle animate."""
sequences = ["swim-down", "swim-up", "swim-left", "swim-right"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "lunge"
title = "The lunge reads as an attack"
text = """
The lunge frames (16–17) unmistakably read as a strike: the bear lunging forward \
with its maw OPEN (a red mouth) and front paws thrown forward with dark claws. The \
open red maw and claws appear ONLY here, not on the run or swim frames."""
sequences = ["lunge"]
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette-and-transparency"
title = "Arctic-predator palette on transparency"
text = """
Uses only the palette from the brief (the two fur tones, the dark outline/features, \
the submerged silhouette, the wake, and the maw red) on full transparency — no \
out-of-palette pixels, no anti-aliased fringes, and no opaque background fill; only \
the bear's pixels (and its wake) are opaque so it composites onto the ice and \
water."""
weight = 1
domain = "fidelity"
