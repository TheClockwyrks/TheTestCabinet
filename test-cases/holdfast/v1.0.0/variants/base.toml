# The default variant: the standard frontier start only, with no extra mode spec on
# top of the always-present `specs/modes/homestead.md`. Listed first in the case
# manifest's `variants`, so it is the default. Every path resolves against the
# version folder, exactly like the main manifest.
slug = "base"
name = "Base"
description = "The standard frontier colony start."

# The main menu lists a different set of starts per variant, so each variant
# supplies its own `title` reference; `gameplay` and `game-over` are common.
reference = [{ view = "title", path = "reference/menu-base.html" }]
