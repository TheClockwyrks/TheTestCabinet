slug = "holdfast"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Holdfast"

# Test type. Holdfast is a `full-stack` case: an end-to-end (playable-browser-
# game) case with one addition — the model under test must PRODUCE the game's own
# assets DURING the run, using the asset-generation binaries on the run image's
# `PATH`, and then build a game that uses them. It is NOT the older two-run pattern
# where a separate asset-gen run makes an asset a later game merely consumes; here
# one model both produces the art/effects/audio and builds the game around it. The
# `full-stack` type schedules the run onto the `test-cabinet-full-stack-2d` image,
# which carries exactly six binaries on `PATH` — `draw`, `draw-sheet`,
# `particle-2d`, `sfx-synth`, `sfx-sample`, and `music` — and no others; every
# asset the game needs is produced with one of them (`specs/assets.md` is the
# production contract). A root identity field, so it sits above the first table.
type = "full-stack"

# Relative difficulty (easy | medium | hard), surfaced on the site. Holdfast is
# hard: it asks for several interacting simulations — a top-down tile world with
# resource nodes, needs-and-mood-driven settler AI with skills, a priority job
# queue and pathfinding, a designate/haul/build/cook/farm economy, a day/night
# clock, and an escalating threat director that drives ranged raids and a colony-
# wipe loss condition — AND, on top of that, for the model to author every sprite,
# animation, particle effect, and sound the game plays. Systems that want careful
# encapsulation plus a full asset-production pass put this well above the catalog's
# bounded arcade cases.
difficulty = "hard"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["simulation", "2d", "survival", "colony"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A top-down colony survival-management sim: direct a handful of settlers to gather, \
build, cook, and farm on a single frontier map, keep their needs and mood from \
breaking, and hold the colony against escalating ranged raids — and the build must \
produce its own sprites, effects, and audio with the on-PATH asset tools."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
# The harness auto-prepends the standing full-stack asset-quality preamble to the
# rendered prompt, so this template does NOT restate a global quality directive.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Holdfast is a large build — several interacting simulations plus a full
# asset-production pass through six tools — so it gets eight hours: comfortably more
# than a healthy build needs while still bounding a runaway session.
max_runtime_hours = 8

# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins `playwright`
# as a dev dependency and declares the produced-effect runtime (`packages`, below)
# as a baked-in `file:` dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. `npm install` — NOT `npm ci` — because `packages`
# injects the `@test-cabinet/particle-runtime` `file:` dependency this build plays
# its produced particle systems with, so the lockfile is completed at seed time;
# the same command downloads the Playwright Chromium build (the base image ships
# the OS libraries Chromium links against, but not the browser binary), so the
# model can build and verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# NOTE: this case declares NO `assets = [...]` of pre-made game art. That is the
# whole point of a full-stack case: the model PRODUCES the game's art, effects, and
# audio itself, during the run, with the six binaries on the run image's `PATH`
# (see `type` above and `specs/assets.md`). The `reference/` mockups below are
# harness-side visual targets rendered via `[[reference]]`, not seeded game assets.

# Test Cabinet runtime libraries installed into the run so the build can play the
# particle systems it produces. `@test-cabinet/particle-runtime` is the same library
# the review UI plays a produced effect with; core bakes it into the run image and
# the seeded workspace `package.json` depends on it via its baked-in `file:` path, so
# the build imports it (its `/canvas` binding) like any other dependency and plays
# each produced `system.json` by simulating it live. The muzzle flash, blood/impact,
# fire spread, explosion, and construction dust are all produced `particle-2d`
# systems played this way; see `specs/assets.md` for the consumption contract. (A
# root key, so it must sit above the first `[table]` header.)
packages = ["@test-cabinet/particle-runtime"]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order — the
# first is the default. Each seeds the common specs plus its own additive specs,
# supplies its own `title` menu reference (the main menu lists a different set of
# starts per variant; `gameplay` and `game-over` are common), and — for the
# siegeworks variant — the review item for the harder raids it introduces (rolling
# up to the common `simulation` domain, since it presses the same threat systems):
#   - base       — the standard frontier start only.
#   - siegeworks — adds a harder start: larger raids with sappers that break walls.
# This list is a root key, so it must sit above the first `[table]` header below.
variants = [
  "variants/base.toml",
  "variants/siegeworks.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern so mode-specific material
# can be seeded per variant (see the variant files). These are always present, so
# the mode specs may reference them freely; the common specs must never reference a
# mode spec a given variant does not seed (only `modes/homestead.md` is always
# present). All common specs are plain Markdown, seeded verbatim. A spec's `dest`
# defaults to its `source` (with a trailing `.hbs` stripped), so these need only
# name the source they seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/world.md"

[[spec]]
source = "specs/settlers.md"

[[spec]]
source = "specs/economy.md"

[[spec]]
source = "specs/combat.md"

[[spec]]
source = "specs/time.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/flow.md"

# The asset-production contract: every asset the game needs, which of the six
# on-PATH binaries produces it, where it lands in the workspace, and how it is
# wired into the build. Seeded for every variant so the produced-asset review items
# and this spec stay in lockstep. This is the defining spec of a full-stack case.
[[spec]]
source = "specs/assets.md"

[[spec]]
source = "specs/modes/homestead.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup the harness renders to a screenshot and seeds as a visual target. The
# `title` view is variant-specific (declared per variant) because the menu differs
# by variant; `gameplay` and `game-over` look the same in every variant.
[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Proof of implementation, requested for every variant. Each declares a `dest` path
# (relative to the run workspace root) the build must write a screenshot or `.webm`
# clip to; `specs/proof.md` instructs the build to produce them at exactly these
# paths. Validation records whether each turned up (informational). The media kind
# is inferred from the extension: `.png` is an image, `.webm` a video (the format
# Playwright records natively; the public gallery transcodes it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-colony dashboard"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Colony lost"
dest = "proof/game-over.png"

[[proof]]
id = "colony"
name = "Colony work clip"
dest = "proof/colony.webm"

[[proof]]
id = "raid"
name = "Raid defense clip"
dest = "proof/raid.webm"

# Validation checks (opt-in). Only the checks declared here run. Each drives the
# built implementation, screenshots it, and compares against the rendered
# screenshot of `reference`. Only the title screen is deterministic enough to
# validate for Holdfast: it is whatever the game shows on load, so it needs no
# actions. The live colony depends on the running simulation, so `gameplay` and
# `game-over` are seeded as references but not validated.
[[check]]
view = "title"
name = "Title Screen"
reference = "title"
actions = []

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — flawless simulation
# cannot mask crude, un-produced art, and gorgeous produced art cannot mask a
# colony that does not simulate. Domains are case-level; an individual review item
# rolls up to one through its optional `domain`, while a general item (states,
# window fit) omits it.
[[domain]]
id = "simulation"
name = "Colony Systems"
description = "The interacting simulations: the top-down tile world and its resource nodes, needs-and-mood-driven settler AI with skills, the priority job queue and pathfinding, the designate/haul/build/cook/farm economy, the day/night cycle, and the escalating threat director that drives ranged raids, cover, downed settlers, and the colony-wipe loss condition."

[[domain]]
id = "presentation"
name = "Presentation & Assets"
description = "The genuinely tool-produced assets and how the build presents them: the animated settler and raider sprite sheets, the terrain/structure/item/icon sprites, the live combat and construction particle effects, the produced sound effects and music bed, and the in-code HUD dashboard — roster, needs, work-priority grid, stocks, and threat alerts — that reads it all at a glance."

# Reviewer checklist items, common to every variant. The major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss. Reporter-side material: never
# seeded into a run, so the model never sees the checklist; each restates a
# requirement the seeded specification already states. A variant adds its own items
# (see its variant file). Each item is worth `weight` points toward the run's
# score; the reviewer records a pass/fail verdict for each before the run can be
# published. The per-domain ratings stay the reviewer's call.

# --- Colony Systems -------------------------------------------------------------
[[review_item]]
id = "tile-world"
title = "Top-down tile world and resource nodes"
text = "The world is a top-down grid of terrain (soil, fertile ground, rock) with walkable and blocked tiles and scattered resource nodes — trees to chop and ore to mine. Designating a chop or mine sends a settler to work it over time; it yields wood or ore and, for a tree, clears the tile. Rock and the map border block movement and cannot be walked through."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "colony"

[[review_item]]
id = "settler-ai"
title = "Settler needs, mood, jobs, and pathfinding"
text = "Each settler has needs (hunger, rest) and a mood that drift over time, skills that affect work speed, and pulls jobs from a PRIORITY QUEUE — chop/mine, haul, build, cook, farm, fight — pathfinding across walkable tiles to reach them. A hungry settler eats, a tired one sleeps, and low mood degrades behavior; two settlers do not both claim the same job."
weight = 1
domain = "simulation"
proof = "colony"

[[review_item]]
id = "build-economy"
title = "Work, build, cook, and farm economy"
text = "The player designates work and places build orders; settlers haul materials and construct walls, doors, beds, a stove, farm plots, and defensive turrets from those materials. Harvested crops are cooked at the stove into meals that settlers eat, and running out of material blocks construction while running out of food starves the colony."
weight = 1
domain = "simulation"
proof = "colony"

[[review_item]]
id = "threat-combat"
title = "Threat director and ranged combat"
text = "An escalating threat director sends raids of hostiles on a timer/wealth curve. Combat is ranged: settlers and turrets shoot at raiders and take cover behind walls, which reduce incoming hits. A settler reduced to zero health is downed and bleeds out unless tended, and raiders can be killed or driven off. Raids grow harder as the colony ages and grows."
weight = 1
domain = "simulation"
reference = "gameplay"
proof = "raid"

[[review_item]]
id = "day-night"
title = "Day/night cycle"
text = "Time advances through a day/night cycle shown on the HUD clock. Daylight and darkness affect the colony — settlers rest at night and work by day, and raids favor certain times — so the cycle is a real pressure on scheduling, not merely a background tint."
weight = 1
domain = "simulation"
proof = "colony"

[[review_item]]
id = "survival-loss"
title = "Survival pressure and the loss state"
text = "The colony must gather, build defenses, and feed itself faster than the raids escalate and its needs run down. When every settler is dead — killed in a raid, bled out, or starved — the colony is lost: a clear loss state showing how many days it survived, with a restart."
weight = 1
domain = "simulation"
proof = "raid"

# --- Presentation & Assets ------------------------------------------------------
[[review_item]]
id = "produced-settler-animation"
title = "Produced, animated settler and raider sheets"
text = "The settlers and raiders are drawn from sprite sheets the build produced with `draw-sheet` — genuine per-frame pixel art — and animate through their actions (at least walk, work, fight, and downed cycles), not a static dot or an ad-hoc code-drawn figure."
weight = 1
domain = "presentation"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "produced-world-sprites"
title = "Produced world sprites"
text = "The terrain tiles, resource nodes, structures, item icons, and HUD icons are rendered from single sprites the build produced with `draw` — soil/rock/grass, trees and ore, built walls/doors/beds/stove/farm plots/turrets, wood and food and meal items — not flat rectangles or ad-hoc canvas fills."
weight = 1
domain = "presentation"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "produced-combat-effects"
title = "Produced particle effects"
text = "The muzzle flash, blood/impact spray, fire spread, explosion, and construction dust are all particle systems the build authored with `particle-2d` and plays live through `@test-cabinet/particle-runtime`'s canvas binding — simulated effects that vary play to play, not a flat flash or a hand-coded burst."
weight = 1
domain = "presentation"
reference = "gameplay"
proof = "raid"

[[review_item]]
id = "produced-audio"
title = "Produced sound and music"
text = "The colony has real audio the build produced with the audio tools: gunshot/hit/build-place/raid-alarm sound effects (`sfx-synth` and/or `sfx-sample`) and an ambient/tension music bed (`music`), played via Web Audio — not silence and not a downloaded or hand-oscillated stand-in."
weight = 1
domain = "presentation"
proof = "raid"

[[review_item]]
id = "hud-in-code"
title = "In-code HUD dashboard"
text = "The colony dashboard — the resource stocks (wood, food, meals), the settler roster and their needs and mood, the work-priority grid, the day/time clock and speed, and threat/raid warnings — plus the build palette and all menus and overlays are drawn in code (canvas/DOM); only the small icons within it may be produced sprites."
weight = 1
domain = "presentation"
reference = "gameplay"
proof = "gameplay"

# --- General (states, window fit) — no domain -----------------------------------
[[review_item]]
id = "states-complete"
title = "Game states"
text = "Every game state is reachable and behaves correctly: title menu, how-to-play, the live colony with its HUD, pause (resume/restart/quit to menu) with speed controls, and colony-lost (restart/menu) with the days survived shown."
weight = 1
reference = "title"
proof = "title"

# --- General (states, window fit) — no domain -----------------------------------
[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The entire 1280x720 stage — the full colony view, both HUD strips, and all four edges — stays visible, fitted, and centered at any window size and pixel density, including on load before any input."
weight = 1
