<!DOCTYPE html>
<!--
  Holdfast — colony-lost reference mockup.
  Canonical view slug: game-over
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Colony lost).
  Objects in .colony use field-local coordinates (top = field row * 24).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Holdfast — Colony Lost</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- A dim slice of the overrun colony behind the panel. -->
      <div class="colony">
        <div class="region rock dim" style="--c: 0; --r: 20; --w: 20; --h: 5"></div>
        <div class="region dim" style="--c: 8; --r: 8; --w: 9; --h: 6; background: var(--floor)"></div>
        <div class="region dim" style="--c: 7; --r: 7; --w: 11; --h: 1;
             background: linear-gradient(180deg, var(--built), var(--built-2)); border: 1px solid #9c7a4f"></div>
        <div class="build bed dim" style="--c: 9; --r: 9">&#9636;</div>
        <div class="build stove dim" style="--c: 14; --r: 11">&#9832;</div>
        <!-- The wall is breached; raiders stand over the fallen crew. -->
        <div class="person raider dim" style="left: 300px; top: 240px"></div>
        <div class="person raider dim" style="left: 372px; top: 300px"></div>
        <div class="person settler downed dim" style="left: 240px; top: 288px"></div>
        <div class="person settler downed dim" style="left: 420px; top: 240px"></div>
        <div class="fx blood dim" style="left: 232px; top: 282px"></div>
        <div class="night"></div>
      </div>

      <div class="overlay"></div>

      <div class="panel">
        <p class="panel-eyebrow">THE COLONY IS OVERRUN</p>
        <h2 class="panel-title">COLONY LOST</h2>
        <p class="panel-stat">SURVIVED 14 DAYS</p>
        <p class="panel-sub">6 RAIDS REPELLED &nbsp;&middot;&nbsp; 0 SETTLERS LEFT</p>
        <nav class="menu">
          <div class="menu-item selected">TRY AGAIN</div>
          <div class="menu-item">MENU</div>
        </nav>
      </div>
    </div>
  </body>
</html>
