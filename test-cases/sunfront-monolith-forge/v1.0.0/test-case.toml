name = "Sunfront Monolith Forge"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Monolith Forge: a 68x84x68 opaque-voxel great forge \
whose massive hammer stamps down and back up and whose gear crown turns on their \
own auto clips while the base stays fixed, built and rigged one recorded operation \
at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 68
height = 84
depth = 68
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts and these joints; at run time it MAY add further
# parts, joints, and auto-play clips of its own (recorded in rig.json) beyond what
# this table requires. `pivot` is `[x, y, z]` in voxel coordinates. `rig.json` is
# pre-seeded from this table so the contract exists from the first operation.
[model]

# The great forge and its foundation: the root part (no parent), fixed to the world.
[[model.part]]
name = "base"
pivot = [0, 0, 0]

# The massive forge hammer, riding in the forge's throat. It stamps straight down
# and back up on the auto-driven `hammer_stamp`.
[[model.part]]
name = "hammer"
parent = "base"
pivot = [34, 58, 34]

# The gear crown, mounted atop the forge. It turns on its own on the auto-driven
# `crown_spin`.
[[model.part]]
name = "gear_crown"
parent = "base"
pivot = [34, 74, 34]

# The forge hammer's own looping stamp. An `auto` joint the case drives with a
# `[[model.clip]]`, a deep downward translation along `y` so the hammer pounds on
# its own without a caller. `rest = 0` is fully raised; `min = -18` is the bottom of
# the stamp.
[[model.joint]]
name = "hammer_stamp"
part = "hammer"
kind = "translation"
axis = "y"
pivot = [34, 58, 34]
min = -18.0
max = 0.0
rest = 0.0
drive = "auto"

# The gear crown's own looping spin. An `auto` joint the case drives with a
# `[[model.clip]]`, a full rotation about `y` so the crown turns on its own without a
# caller.
[[model.joint]]
name = "crown_spin"
part = "gear_crown"
kind = "rotation"
axis = "y"
pivot = [34, 74, 34]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "auto"

# The auto-play clips — one per animated part, so the forge runs on its own. Only
# `auto` joints take a clip. Keyframes are inline `[t_ms, value]` pairs (voxels for
# the translation stamp, radians for the rotation spin). The hammer drops deep and
# rises back; the gear crown turns a full revolution and loops.
[[model.clip]]
joint = "hammer_stamp"
period_ms = 1600
loop = true
keyframes = [[0, 0.0], [800, -18.0], [1600, 0.0]]

[[model.clip]]
joint = "crown_spin"
period_ms = 2600
loop = true
keyframes = [[0, -3.14159], [2600, 3.14159]]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Monolith \
Forge and runs correctly — a towering great forge whose massive hammer stamps down \
and back up while the gear crown turns on their own auto clips and the base stays \
put, with a clear solar-amber energy accent and the disciplined Duneforged \
palette."""

[[review_item]]
id = "reads-as-forge"
title = "Reads as a great forge"
text = """
From more than one angle the model reads unmistakably as a towering Duneforged \
forge: a huge, blocky masonry structure with a massive hammer riding in its throat \
and a toothed gear crown mounted atop it. It is a working forge building, not an \
abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Hammer stamps and crown spins on their own"
text = """
The animated elements cycle on their own via their auto clips while the `base` \
stays fixed: the `hammer_stamp` joint drives the great hammer straight down and \
back up in its throat, and the `crown_spin` joint turns the gear crown a full \
revolution atop the forge. Across each cycle no voxel of the hammer or crown tears \
away from its mount or clips into the tower — each moves as one solid piece about \
the correct axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Base stays fixed"
text = """
Only the moving parts move: the hammer as it stamps and the gear crown as it \
spins. The forge base and its foundation stay put — they are the fixed root of the \
rig, not carried along by the hammer or the crown."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Hammer and crown stay attached"
text = """
Each child stays attached to the base across its joint's range: the hammer meets \
the forge's throat at its mount as it pounds up and down, and the gear crown meets \
the forge's crest at its hub as it turns, with no gap and never floating free or \
detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a clear \
amber accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
