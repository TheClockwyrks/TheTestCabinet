slug = "sunfront-monolith-forge"
name = "Sunfront Monolith Forge"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Monolith Forge: a 90x110x90 opaque-voxel great forge \
whose massive hammer stamps down and back up and whose gear crown turns on their \
own self-playing animations while the tower stays fixed, painted cell by cell with \
the voxel-anim tool. The model invents whatever parts and joints it needs; the \
fixed contract is two self-playing animations it must author — a `hammer_stamp` and \
a `crown_spin` — that the reviewer can watch cycle."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 90
height = 110
depth = 90
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton the forge needs and is judged on whether it works out the right
# pieces, attaches them where they belong, and animates them convincingly. What is
# fixed is the set of NAMED ANIMATIONS the model must author (a game plays them by
# name) and whether each is a game-triggered playable or a self-playing idle. The
# model authors each animation's F-curves at run time with the voxel-anim
# `define-animation`/`add-keyframe` subcommands; `rig.json` is pre-seeded with these
# declarations so the contract exists from the first operation.
[model]

# `hammer_stamp` — the STAMP. A self-playing idle that pounds the great hammer
# straight down deep into the forge's throat and back up to rest, on its own, so the
# forge works without a caller. It should land with weight — an eased drop, not a
# weightless linear slide.
[[model.animation]]
name = "hammer_stamp"
loop = true
auto_play = true

# `crown_spin` — the CROWN TURN. A self-playing idle that turns the toothed gear
# crown atop the forge one full, steady revolution about its vertical axis,
# continuously and seamlessly, on its own.
[[model.animation]]
name = "crown_spin"
loop = true
auto_play = true

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Monolith \
Forge and runs correctly — a towering great forge whose massive hammer stamps down \
and back up while the gear crown turns on their own self-playing animations and the \
tower stays put, with a clear solar-amber energy accent and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-forge"
title = "Reads as a great forge"
text = """
From more than one angle the model reads unmistakably as a towering Duneforged \
forge: a huge, blocky masonry structure with a massive hammer riding in its throat \
and a toothed gear crown mounted atop it. It is a working forge building, not an \
abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Hammer stamps and crown spins on their own"
text = """
The animated elements cycle on their own via their self-playing animations while \
the forge tower stays fixed: `hammer_stamp` drives the great hammer straight down \
deep into its throat and back up, landing with weight, and `crown_spin` turns the \
gear crown a full, steady revolution atop the forge. Across each cycle no part of \
the hammer or the crown tears away from its mount or clips into the tower — each \
moves as one solid piece about the correct axis."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "Forge tower stays fixed"
text = """
Only the moving elements move: the hammer as it stamps and the gear crown as it \
spins. The forge tower and its foundation stay put — the fixed base of the \
structure, never carried along by the hammer or the crown."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Hammer and crown stay attached"
text = """
Each moving element stays attached to the forge across its full motion: the hammer \
meets the forge's throat at its mount as it pounds up and down, and the gear crown \
meets the forge's crest at its hub as it turns, with no gap and never floating free \
or detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber energy accent) with a clear \
amber accent, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
