slug = "sunfront-lumen"
name = "Sunfront Lumen"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "mech"]
summary = """
Sculpt and rig the Sunfront Lumen: a 20x26x20 opaque-voxel floating beacon drone \
with a glowing solar-hot core, two counter-rotating rings, and a forward beam \
emitter, painted cell by cell with the voxel-anim tool one recorded operation at a \
time. The model invents whatever parts and joints it needs; the fixed contract is \
three animations it must author — a self-playing ring_spin, a hover, and an emitter \
pulse — the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 20
height = 26
depth = 20
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part
# the model defines), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents
# whatever skeleton it needs and is judged on whether it works out the right pieces,
# attaches them where they belong, and animates them convincingly. What is fixed is
# the set of NAMED ANIMATIONS the model must author (a game plays them by name) and
# whether each is a game-triggered playable or a self-playing idle. The model
# authors each animation's F-curves at run time with `voxel-anim
# define-animation`/`add-keyframe`; `rig.json` is pre-seeded with these declarations
# so the contract exists from the first operation.
[model]

# `ring_spin` — the continuous decorative idle: the drone's rings turn on their own
# around the core, in opposite directions. A self-playing idle (`auto_play = true`),
# so it plays without a caller, under the playables and at rest.
[[model.animation]]
name = "ring_spin"
loop = true
auto_play = true

# `hover` — the movement state a game triggers (parallel to a walker's `walk`): the
# whole legless craft bobs gently up and down so it reads as floating in place. A
# game-triggered playable, so `auto_play = false`.
[[model.animation]]
name = "hover"
loop = true
auto_play = false

# `pulse` — the emitter showcase a reviewer can trigger: the front beam emitter nods
# up, back to level, down, and level again about its mount. A game-triggered
# playable, so `auto_play = false`.
[[model.animation]]
name = "pulse"
loop = true
auto_play = false

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Lumen and \
poses correctly — a floating beacon drone whose front emitter nods on its mount \
while its two rings counter-rotate on their own around a glowing solar-hot core and \
the whole legless craft bobs in place, with a bright solar-hot core accent and the \
disciplined Duneforged palette. The model invents the rig; the fixed contract is \
the three animations it authors."""

[[review_item]]
id = "reads-as-lumen"
title = "Reads as a floating beacon drone"
text = """
From more than one angle the model reads unmistakably as a floating beacon drone: \
a compact hovering core carrying a glowing solar-hot heart, a pair of rings \
orbiting it on either side, and a beam emitter projecting forward from the core \
face. It hovers with no legs, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "emitter-nods"
title = "Emitter nods and rings spin"
text = """
Playing `pulse` tilts the front beam emitter up and down about its mount cleanly, \
with no part of the emitter tearing away from the core or clipping into it across \
the full range — the beam projector moving as one solid piece. The two rings turn \
on their own through `ring_spin`, spinning in opposite directions around the core. \
The model had to invent a hinge for the emitter and a spin axis for each ring for \
these to read."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "hovers-in-place"
title = "Hovers in place with weight"
text = """
Playing `hover` bobs the whole legless craft gently up and down so it reads as \
floating in place — a weighted rise and settle that eases rather than sliding in a \
straight saw-tooth. The craft hovers as one body without shedding, tearing, or \
distorting its parts."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "body-fixed-attached"
title = "Body stays put; rings and emitter stay attached"
text = """
Only the moving parts move on their own: the emitter nods under `pulse` and the \
rings spin under `ring_spin` without dragging the core body around with them. Each \
moving piece stays attached across its full range — the rings hold their orbit at \
the sides as they spin and the emitter meets the core face, with no gap and never \
floating free or detaching as the rings turn and the beam tilts."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze shell, iron \
rings, and the solar-hot core with its amber emitter) with a bright solar-hot core \
accent, no out-of-palette colors, and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
