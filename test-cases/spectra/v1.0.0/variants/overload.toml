# Sortie plus Overload, where mismatched shots feed the drone toward an overload
# instead of being wasted. Its review item rolls up to the common `polarity`
# domain, since Overload extends the band-matching system rather than adding a new
# axis of judgement.
slug = "overload"
name = "Overload"
description = "Sortie plus Overload, where mismatched shots feed the drone toward an overload instead of being wasted."

spec = [{ source = "specs/modes/overload.md" }]
reference = [{ view = "title", path = "reference/menu-overload.html" }]

# The authored, *correct* static build of this variant — the case-variant
# analogue of a run's playable build. A bare directory path (resolved against
# the version folder) holding a buildable web project, built with this case's
# `[build]` install/build commands and deployed like a published run build via
# `tcab publish-reference`, then shown on the case's "Reference" tab. It is
# **never seeded into a run**.
reference_implementation = "reference-impl/overload"

[[review_item]]
id = "overload-feeds"
title = "Mismatch overloads"
text = "In Overload, a mismatched (wrong-band) shot no longer wastes — it adds 1 charge to the drone, and at 3 charge the drone overloads with a per-type reaction: a Shard launches a fast headlong dive at the player, a Flux flips its band and fires a 3-shot spread, and a Prism's exposed layer emits a two-band burst (with a wrong shell hit also spawning an extra Shard escort)."
weight = 1
domain = "polarity"
