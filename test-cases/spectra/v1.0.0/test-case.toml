slug = "spectra"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, and which validation
# checks run. The testing harness reads this file to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Spectra"

# Relative difficulty (easy | medium | hard), surfaced on the site. Spectra asks
# for choreographed entrance and dive paths, a swaying formation, two-band
# polarity combat with a dual-use shield, three distinct drone behaviors, the
# resonance/discharge economy, challenge stages, and several states — several
# systems that want encapsulating behind interfaces, but a bounded arcade shooter,
# well short of the package-scale simulation games (SimCity and the like) that
# define hard, so it sits at medium.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["arcade", "2d", "shooter", "space"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A fixed-position formation shooter where your cannon is tuned to one of two \
spectral bands — and that band is also your shield. A shot only destroys a drone \
of the matching band, while the swarm always fires both, so survival is a \
constant gamble of which band to be."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. Spectra is a substantial build (choreographed paths, a formation,
# three drone AIs, two-band combat, multiple states), so it gets a full five
# hours — comfortably more than a healthy build needs while still
# bounding a runaway session.
max_runtime_hours = 5
# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project to build on: a `package.json` that pins
# `playwright` as a dev dependency, so the in-container browser tooling is a
# visible, project-local dependency. The seeded files land at the run root
# (`workspaces/base/package.json` seeds to `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Asset files or directories seeded alongside the specs, each kept at its path
# relative to this version folder when seeded (so `assets/fighter.png` lands at
# `assets/fighter.png` in the run). Spectra ships a fixed set of pre-drawn
# sprites — one per entity, generated by The Test Cabinet's own asset-generation
# cases (`spectra-fighter`, `spectra-shard`, `spectra-flux`, `spectra-prism`) — so
# every build renders the same ship and drones and differs only in code. The build
# is required to render the ship and drones from these (the loading rule, the
# per-band derivation, and what is left to draw in code are the contract in
# `specs/assets.md`). The model still designs its own paths and formation.
# (A root key, so it must sit above the first `[table]` header below.)
assets = [
  "assets/fighter.png", # the player's resonator-fighter (cyan-tuned reference)
  "assets/shard.png",   # the fixed-band crystalline drone (magenta reference)
  "assets/flux.png",    # the oscillating drone, caught mid-shimmer (both bands)
  "assets/prism.png",   # the two-band boss: cyan shell around a magenta core
]

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# Each is declared in its own file under `variants/` and listed here in order —
# the first is the default. Each seeds the common specs plus its own additive
# specs, supplies its own `title` menu reference (the main menu lists a different
# set of modes per variant; `gameplay` and `game-over` are common), and — for the
# overload variant — the review item for the mode it introduces (rolling up to the
# common `polarity` domain, since Overload extends the band system):
#   - base     — Sortie only.
#   - overload — adds Overload, where a mismatched shot no longer wastes but
#                charges the drone toward a per-type overload.
# This list is a root key, so it must sit above the first `[table]` header below.
variants = [
  "variants/base.toml",
  "variants/overload.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern so mode-specific material
# can be seeded per variant (see `[[variant]]`). These are always present, so the
# mode specs may reference them freely; the common specs must never reference a
# mode spec a given variant does not seed (only `modes/standard.md` is always
# present). All common specs are plain Markdown, seeded verbatim.
# A spec's `dest` defaults to its `source` (with a trailing `.hbs` stripped), so
# these need only name the source they seed.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/playfield.md"

[[spec]]
source = "specs/polarity.md"

[[spec]]
source = "specs/controls.md"

[[spec]]
source = "specs/enemies.md"

[[spec]]
source = "specs/flow.md"

# The provided art contract: which sprites are seeded under `assets/`, how to load
# them under any base path, how each entity's second band is derived at runtime,
# and what is left to draw in code. Seeded for every variant so the manifest's
# `assets` (above) and this spec stay in lockstep.
[[spec]]
source = "specs/assets.md"

[[spec]]
source = "specs/modes/standard.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup the harness renders to a screenshot and seeds as a visual target. The
# `title` view is variant-specific (declared per variant above) because the menu
# differs by variant; `gameplay` and `game-over` look the same in every variant.
[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title menu"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-wave"
dest = "proof/gameplay.png"

[[proof]]
id = "game-over"
name = "Game over"
dest = "proof/game-over.png"

[[proof]]
id = "polarity"
name = "Dual-use polarity clip"
dest = "proof/polarity.webm"

[[proof]]
id = "assault"
name = "Swarm assault clip"
dest = "proof/assault.webm"

# Validation checks (opt-in). Only the checks declared here run. Each drives the
# built implementation, screenshots it, and compares against the rendered
# screenshot of `reference`. Only the title screen is deterministic enough to
# validate for Spectra: it is whatever the game shows on load, so it needs no
# actions. Gameplay and game-over depend on live, moving state, so they are seeded
# as references but not validated.
[[check]]
view = "title"
name = "Title Screen"
reference = "title"
actions = []

# Scoring domains. The reviewer rates each independently while playing the build,
# and the run's overall rating is the WORST across them — flawless polarity combat
# cannot mask a swarm that does not fly, and vice versa. Domains are case-level;
# an individual review item rolls up to one through its optional `domain`, while a
# general item (states, window fit) omits it.
[[domain]]
id = "polarity"
name = "Polarity & Survival"
description = "The two-band core: match-to-destroy and wasted mismatches, the dual-use shield, the flip and its lockout, and the resonance meter and discharge."

[[domain]]
id = "swarm"
name = "The Swarm"
description = "The choreographed entrances and swaying formation, the dive attacks, the three drones — Shard, Flux, and Prism — the Prism's spectral inversion, and the challenge stages."

# Reviewer checklist items, common to every variant. The major, observable
# requirements a reviewer must explicitly check by playing the build — the things
# validation cannot judge and that are easy to miss. Reporter-side material: never
# seeded into a run, so the model never sees the checklist; each restates a
# requirement the seeded specification already states. A variant adds its own
# items (see the `review_item` arrays above). Each item is worth `weight` points
# toward the run's score; the reviewer records a pass/fail verdict for each before
# the run can be published. The per-domain ratings stay the reviewer's call.
[[review_item]]
id = "match-destroys"
title = "Match to destroy"
text = "A shot destroys a drone only when the bullet's band matches the drone's current band; a mismatched (opposite-band) shot is wasted, harming nothing. Because the formation always holds both bands, clearing it forces constant flipping."
weight = 1
domain = "polarity"
reference = "gameplay"
proof = "polarity"

[[review_item]]
id = "dual-use-shield"
title = "Band is your shield"
text = "Your current band is also your shield: a same-band enemy bullet is absorbed harmlessly (and feeds resonance), while an opposite-band bullet costs a life. A drone body always costs a life on contact, regardless of band."
weight = 1
domain = "polarity"
proof = "polarity"

[[review_item]]
id = "flip-lockout"
title = "Flip and its lockout"
text = "Flipping bands is instant — the ship core and polarity indicator change immediately — but imposes a roughly 0.30s fire lockout, so you cannot flip and fire in the same instant."
weight = 1
domain = "polarity"

[[review_item]]
id = "resonance-discharge"
title = "Resonance and discharge"
text = "The resonance meter fills from absorbed same-band bullets and matching kills; at full, a discharge wipes every entering and diving drone and clears all enemy bullets (band-blind) but spares the formation, and spends the whole meter."
weight = 1
domain = "polarity"

[[review_item]]
id = "entrance-and-formation"
title = "Entrances and formation"
text = "Drones are not present at the start of a wave — they fly in along smooth choreographed paths and assemble into a swaying formation that mixes both bands. The formation drifts side to side as one rigid body."
weight = 1
domain = "swarm"
reference = "gameplay"
proof = "assault"

[[review_item]]
id = "dive-attacks"
title = "Dive attacks"
text = "From the formation, drones peel off on swooping dive runs that bend toward the player and fire, then either loop back or wrap from the bottom to the top to return to their slots. Drones in formation do not fire — only divers do."
weight = 1
domain = "swarm"
proof = "assault"

[[review_item]]
id = "shard-fixed-band"
title = "The Shard"
text = "The Shard holds a single fixed band for its whole life; the formation is seeded with Shards of both bands. One matching shot destroys it."
weight = 1
domain = "swarm"

[[review_item]]
id = "flux-oscillates"
title = "The Flux"
text = "The Flux alternates its band on a telegraphed rhythm: a held window, then a brief shimmer (settled on neither band), then the other band. It can be destroyed only by a matching shot during a held window — never mid-shimmer."
weight = 1
domain = "swarm"

[[review_item]]
id = "prism-sequence"
title = "The Prism"
text = "The Prism is a two-band boss: destroy the outer shell with the shell's band, then the exposed core with the opposite band. It enters escorted by two Shards and fires a two-band (one cyan, one magenta) burst while diving."
weight = 1
domain = "swarm"

[[review_item]]
id = "spectral-inversion"
title = "Spectral inversion"
text = "A diving Prism that reaches the bottom of the field without being broken triggers a spectral inversion: for a few seconds the two bands are swapped across the whole field (with a clear inversion overlay), forcing the player to re-read every drone and bullet."
weight = 1
domain = "swarm"
proof = "assault"

[[review_item]]
id = "challenge-stage"
title = "Challenge stages"
text = "Every third stage is a challenge stage: a non-firing flyover of single-band groups that alternate bands and never cost a life, with points per drone and a perfect bonus for destroying them all."
weight = 1
domain = "swarm"

[[review_item]]
id = "lives-and-scaling"
title = "Lives and stage scaling"
text = "A hit costs a life while the wave persists (the ship respawns and the wave continues, keeping the resonance meter); clearing a wave advances a stage; deeper stages are faster, dive harder, and flip the Flux quicker as specified."
weight = 1

[[review_item]]
id = "uses-provided-art"
title = "Renders from the provided sprites"
text = "The ship and all three drones are drawn from the seeded `assets/` sprites (fighter, shard, flux, prism), not redrawn in code, and each entity's other band is the same sprite re-tinted with its glyph swapped (cyan/ring vs magenta/diamond) — never a cyan diamond or a magenta ring. Bullets, effects, and the HUD are drawn in code."
weight = 1
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "states-complete"
title = "Game states"
text = "Every game state is reachable and behaves correctly: title menu, how-to-play, the stage intro, pause (resume/restart/quit), stage-cleared, and game-over (play again/menu)."
weight = 1
reference = "title"
proof = "title"

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The entire 1280x720 stage — the full play field, both HUD strips, and all four edges — stays visible, fitted, and centered at any window size and pixel density, including on load before any input."
weight = 1
