<!DOCTYPE html>
<!--
  Spectra — game-over reference mockup.
  Canonical view slug: game-over
  Render at a 1280x720 viewport. See ../specs/flow.md (Game states: Game over).
  Objects in .field use field-local coordinates (top = stage y - 64).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spectra — Game Over</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- A dim slice of a frozen wave behind the panel. -->
      <div class="field">
        <div class="drone prism shell-magenta dim" style="left: 412px; top: 70px">
          <span class="core cyan"></span>
        </div>
        <div class="drone shard cyan dim" style="left: 360px; top: 80px"></div>
        <div class="drone shard magenta dim" style="left: 500px; top: 80px"></div>
        <div class="drone flux cyan dim" style="left: 920px; top: 120px"></div>
        <div class="drone shard magenta dim" style="left: 980px; top: 124px"></div>
        <div class="drone shard cyan dim" style="left: 860px; top: 124px"></div>
        <div class="ship dim" style="left: 740px; top: 470px"></div>
        <div class="ship-core magenta dim" style="left: 754px; top: 478px"></div>
      </div>

      <div class="overlay"></div>

      <div class="panel">
        <p class="panel-eyebrow">SIGNAL LOST</p>
        <h2 class="panel-title">GAME OVER</h2>
        <p class="panel-score">SCORE 0048120</p>
        <p class="panel-stage">REACHED STAGE 7</p>
        <nav class="menu">
          <div class="menu-item selected">PLAY AGAIN</div>
          <div class="menu-item">MENU</div>
        </nav>
      </div>
    </div>
  </body>
</html>
