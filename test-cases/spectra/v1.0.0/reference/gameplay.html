<!DOCTYPE html>
<!--
  Spectra — in-wave reference mockup (representative frame).
  Canonical view slug: gameplay
  Render at a 1280x720 viewport. See ../specs/overview.md (coordinate system,
  visual design), ../specs/polarity.md (bands, shield), ../specs/enemies.md
  (drones), and ../specs/playfield.md (formation, HUD).

  Live positions, the formation layout, and the paths vary at runtime; this
  frame is a representative moment used for a soft palette/layout comparison,
  not a strict pixel match.

  Objects inside .field use FIELD-LOCAL coordinates: the field starts at stage
  y=64, so an object at stage y=Y has top = Y - 64. The HUD sits directly on the
  stage. Cyan reads round, magenta reads diamond (see theme.css).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spectra — Gameplay</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- HUD: top strip -->
      <div class="hud-score">0024750</div>
      <div class="stage-label">STAGE 2</div>

      <div class="field">
        <!-- ============ The formation (swaying block, both bands) ========= -->
        <!-- Prism (center top): cyan shell over magenta core. -->
        <div class="drone prism shell-cyan" style="left: 612px; top: 58px">
          <span class="core magenta"></span>
        </div>

        <!-- Formation row 0 -->
        <div class="drone flux cyan" style="left: 497px; top: 61px"></div>
        <div class="drone flux cyan" style="left: 753px; top: 61px"></div>
        <div class="drone shard cyan" style="left: 564px; top: 64px"></div>
        <div class="drone shard cyan" style="left: 692px; top: 64px"></div>
        <div class="drone shard magenta" style="left: 436px; top: 64px"></div>
        <div class="drone shard magenta" style="left: 820px; top: 64px"></div>

        <!-- Formation row 1 -->
        <div class="drone flux magenta" style="left: 497px; top: 109px"></div>
        <div class="drone flux magenta" style="left: 753px; top: 109px"></div>
        <div class="drone shard cyan" style="left: 372px; top: 112px"></div>
        <div class="drone shard cyan" style="left: 884px; top: 112px"></div>
        <div class="drone shard cyan" style="left: 436px; top: 112px"></div>
        <div class="drone shard cyan" style="left: 820px; top: 112px"></div>
        <div class="drone shard magenta" style="left: 564px; top: 112px"></div>
        <div class="drone shard magenta" style="left: 692px; top: 112px"></div>

        <!-- Formation row 2 -->
        <div class="drone shard magenta" style="left: 628px; top: 160px"></div>
        <div class="drone shard cyan" style="left: 500px; top: 160px"></div>
        <div class="drone shard cyan" style="left: 756px; top: 160px"></div>
        <div class="drone shard cyan" style="left: 564px; top: 160px"></div>
        <div class="drone shard cyan" style="left: 692px; top: 160px"></div>
        <div class="drone shard magenta" style="left: 436px; top: 160px"></div>
        <div class="drone shard magenta" style="left: 820px; top: 160px"></div>
        <div class="drone shard magenta" style="left: 372px; top: 160px"></div>
        <div class="drone shard magenta" style="left: 884px; top: 160px"></div>

        <!-- ============ Divers (peeled off, firing) ======================= -->
        <!-- A magenta Shard diving toward the player, firing magenta. -->
        <div class="drone shard magenta" style="left: 508px; top: 364px"></div>
        <div class="ebullet magenta" style="left: 516px; top: 414px"></div>
        <div class="ebullet magenta" style="left: 518px; top: 448px"></div>

        <!-- A cyan-phase Flux diving on the right, firing cyan. -->
        <div class="drone flux cyan" style="left: 805px; top: 293px"></div>
        <div class="ebullet cyan" style="left: 816px; top: 346px"></div>
        <div class="ebullet cyan" style="left: 816px; top: 382px"></div>

        <!-- ============ Player ship (tuned CYAN) and its shots ============ -->
        <div class="pbullet cyan" style="left: 598px; top: 398px"></div>
        <div class="pbullet cyan" style="left: 598px; top: 476px"></div>
        <div class="ship" style="left: 580px; top: 522px"></div>
        <div class="ship-core cyan" style="left: 594px; top: 530px"></div>
      </div>

      <!-- HUD: bottom strip -->
      <div class="lives">
        <span class="life"></span>
        <span class="life"></span>
      </div>
      <div class="resonance">
        RESONANCE
        <div class="bar"><span style="width: 62%"></span></div>
      </div>
      <div class="polarity cyan">
        <span class="swatch"><span>&#9711;</span></span>
        <span class="label">CYAN</span>
      </div>
    </div>
  </body>
</html>
