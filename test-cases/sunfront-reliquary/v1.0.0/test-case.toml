slug = "sunfront-reliquary"
name = "Sunfront Reliquary"
difficulty = "medium"
tags = ["asset-generation", "3d", "voxel", "rig", "building"]
summary = """
Sculpt and rig the Sunfront Reliquary: a 60x96x60 opaque-voxel monument cradling a \
glowing solar core — built not from a fixed skeleton but by painting discrete cells \
one recorded operation at a time. Its ring turns, its core breathes, and its guardian \
fins counter-rotate while the plinth holds still. The model invents whatever parts and \
joints it needs; the fixed contract is three self-playing animations it must author — a \
`ring_spin`, a `core_pulse`, and a `fins_spin` — the reviewer can watch cycle."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 60
height = 96
depth = 60
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. All three here are self-playing
# idles, so the monument runs on its own with no caller. The model authors each
# animation's F-curves at run time with the `voxel-anim`
# `define-animation`/`add-keyframe` subcommands; `rig.json` is pre-seeded with these
# declarations so the contract exists from the first operation.
[model]

# `ring_spin` — the orbital ring's continuous spin. A self-playing idle that turns the
# ring steadily on its own, at rest and with no caller.
[[model.animation]]
name = "ring_spin"
loop = true
auto_play = true

# `core_pulse` — the solar core's breathing rise-and-fall. A self-playing idle that
# lifts the core and settles it back in a slow pulse on its own, with no caller.
[[model.animation]]
name = "core_pulse"
loop = true
auto_play = true

# `fins_spin` — the guardian fins' continuous counter-spin. A self-playing idle that
# turns the fins the OPPOSITE way from the ring on their own, with no caller.
[[model.animation]]
name = "fins_spin"
loop = true
auto_play = true

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Reliquary \
and runs correctly — a tall, precious monument cradling a glowing solar core, \
whose orbital ring turns, core rises and falls, and guardian fins counter-rotate \
on their own self-playing animations while the plinth stays put, with a heavy \
solar-hot and amber core glow and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-reliquary"
title = "Reads as a solar reliquary monument"
text = """
From more than one angle the model reads unmistakably as a precious, holy \
Duneforged monument: a tall masonry plinth and cradle holding a glowing solar \
core at its heart, encircled by an orbital ring and crowned by guardian fins. It \
looks like a revered reliquary enshrining its core, not an abstract stack of \
boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "elements-cycle"
title = "Ring turns, core pulses, and fins counter-rotate on their own"
text = """
The three animated elements cycle on their own, each on its self-playing animation, \
while the plinth stays fixed: playing `ring_spin` turns the orbital ring a full \
revolution about the vertical axis, `core_pulse` lifts the solar core up and settles \
it back in a breathing rise and fall, and `fins_spin` turns the guardian fins a full \
revolution the opposite way, so the ring and fins visibly counter-rotate. Across each \
cycle no voxel of the ring, core, or fins tears away from its mount or clips the \
monument — each moves as one solid piece about a clean, sensible axis. The model had \
to work out where to split the monument into a fixed body and these three independently \
moving pieces for this to read at all."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "base-fixed"
title = "The monument's body stays fixed"
text = """
Only the moving elements move: the orbital ring as it turns, the core as it rises \
and falls, and the guardian fins as they counter-rotate. The monument plinth and its \
cradle are the fixed root of the machine — they stay put throughout, never carried \
along or dragged by the ring, the core, or the fins."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Ring, core, and fins stay attached"
text = """
Each moving element stays attached to the monument across its whole cycle: the orbital \
ring stays centered as it turns, the core stays cradled in the monument as it rises \
and falls, and the guardian fins stay seated on their crown as they counter-rotate — \
with no gap opening up and nothing floating free or detaching."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze masonry, \
sandstone panels, iron mechanisms, and the solar-amber and solar-hot energy \
accents) with a clear, heavy amber and solar-hot glow at the core, no \
out-of-palette colors, and no stray voxels drifting off the parts."""
weight = 1
domain = "fidelity"
