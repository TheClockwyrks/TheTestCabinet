# The Test Cabinet test case manifest — Foray (on-disk slug `adversarial-pacman`).
#
# This is an ADVERSARIAL case: the model writes a wasm controller that drives one
# colony, and a run plays ONE canonical match of it against the case's committed
# baseline opponent (`border-soldier`). The harness reads this file to build the
# submission to wasm, run the match through the shared `foray-host`, and record the
# result plus a browser-playable replay.

# Human-readable display name (in-fiction title; the on-disk slug stays
# `adversarial-pacman`, following the house convention pacman -> Fathom).
name = "Foray"

# Relative difficulty (easy | medium | hard), surfaced on the site. Foray asks the
# model to write a classical-AI controller that reasons about role allocation,
# carry-weight banking, and royal-jelly timing under hard per-tick fuel/memory
# limits, and to BEAT a non-trivial baseline — a meaningfully harder ask than a
# single playable build.
difficulty = "hard"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["adversarial", "ctf", "wasm", "ai", "2d"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
Write the controller for one ant colony in a territorial maze-raid: every agent \
is a defender at home and a raider abroad, a heavy load slows you to an easy tag, \
and royal jelly buys a run home — beat the baseline head to head."""

# Site-facing prose introducing the case, relative to this version folder. NOT
# seeded into a run; it exists only to describe the case on the site.
description = "description.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects the in-container workspace path via `{{workspace}}`.
prompt = "prompt.hbs"

# This is an adversarial case. The type selects which manifest tables are required
# ([build]/[contract]/[sandbox]/[simulation]/[match]/[replay]) and which are
# forbidden ([canvas]/[tool]/[output], and [[check]]).
type = "adversarial"

# Maximum wall-clock runtime, in hours, for the harness session before the run
# is stopped. Writing, building, and iterating a classical-AI wasm controller
# against the local CLI is a substantial session, so it gets a full two hours.
max_runtime_hours = 2
# Starter workspace seeded into the root of every run before the specs. It is a
# small Cargo project: just the controller skeleton the model fills in. Everything
# it builds against and runs with — the engine + SDK (the controller "buildkit"),
# the `foray` CLI, and the reference controllers + map — is provided by the
# adversarial run-container image under `/opt/foray` (`$FORAY_HOME`) and on `PATH`,
# not vendored here (see `containers/adversarial/Dockerfile`). Seeded files land at
# the run root (`workspaces/base/controller/...` -> `controller/...`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. `cargo fetch` pre-downloads the controller's crate
# dependencies (it path-depends on the baked buildkit's `foray-core`/SDK and pulls
# their registry deps) so the model's first build is offline-fast.
init = "cargo fetch"

# How the harness builds the model's submission into a wasm controller module.
# `install` fetches dependencies; `build` emits the module; `module` names the
# produced artifact (relative to the run root) the validator loads as Red. The
# controller crate is a `cdylib` named `controller`, so the artifact path is
# stable. All three are required for an adversarial case.
[build]
install = "cargo fetch"
build = "cargo build --release --target wasm32-unknown-unknown -p controller"
module = "target/wasm32-unknown-unknown/release/controller.wasm"

# The controller contract: the exported entry the host invokes once per tick, and
# the JSON Schemas for the observation passed in and the action returned. The two
# schemas are seeded for the model to read (the resolver seeds them at these exact
# dests). They are generated from `foray-core`'s `World`/`Action` types, so they
# can never drift from the engine the harness scores against.
[contract]
entry = "tick"
world = "schemas/world.json"
action = "schemas/action.json"

# Per-tick sandbox limits applied to every controller invocation. Exhausting fuel
# or exceeding the memory cap is a disqualifying forfeit (see specs/sandbox.md).
# Sizing: a per-tick BFS over the small board costs a few hundred k to a few M
# fuel, and a competent controller that runs several (pathfinding, defender
# avoidance, role assignment) peaks around 10M; the ceiling sits well above that so
# a real submission has ample headroom and is not forced to micro-optimize. (An
# earlier 5M ceiling was too tight — the reference baselines alone already drew up
# to ~3M, and an agent-aware controller exceeded it.)
[sandbox]
fuel_per_tick = 50_000_000
max_memory_bytes = 67_108_864   # 64 MiB

# The simulation loop. The timestep is the fixed, faked 16 ms delta; the tick cap
# is the overview's 10-minute game-time bound (10 min / 16 ms = 37,500 ticks),
# reaching which ends the match on score (a draw if tied).
[simulation]
timestep_ms = 16
max_ticks = 37_500

# How implementations are paired into matches. Recorded faithfully — two
# controllers per match, round-robin, one round per pairing — though for v1 the
# validator runs only the single canonical match (submission vs the committed
# baseline). Cross-model tournaments are a separate future step.
[match]
participants = 2
structure = "round-robin"
rounds = 1

# How a recorded match is rendered for browser playback on the site. The renderer
# loads `foray-core` compiled to wasm, replays the recorded log through the same
# engine that produced it, and draws each reconstructed tick with the pixel-art
# sprite sheet — so what a visitor watches is the match itself, not an
# approximation.
[replay]
renderer = "replay/index.html"

# Common specs: seeded for the (single) variant. The model-facing brief, split by
# concern — the game rules, the controller contract, the sandbox limits, and the
# baselines. The `world`/`action` schemas are seeded automatically by the
# `[contract]` table above, so they are not repeated here.
[[spec]]
source = "specs/rules.md"
dest = "specs/rules.md"

[[spec]]
source = "specs/contract.md"
dest = "specs/contract.md"

[[spec]]
source = "specs/sandbox.md"
dest = "specs/sandbox.md"

[[spec]]
source = "specs/baselines.md"
dest = "specs/baselines.md"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# v1 ships a single base variant — the shipped `mirror-32x16` map, full
# observability, the canonical `border-soldier` opponent. Future variants (a noisy/
# limited-sensing world, an alternate map, a different opponent) layer on top.
[[variant]]
slug = "base"
name = "Base"
description = "The shipped mirror-32x16 maze, fully observable, scored against the border-soldier baseline."

# Scoring domains. An adversarial run's decisive signal is the recorded match, not
# a reviewer's rating, but a human review may still accompany a published run (see
# the adversarial evaluation doc). One domain covers that qualitative read of how
# the controller played.
[[domain]]
id = "play"
name = "Play"
description = """
How the controller actually played the match — whether it balanced offense and \
defense across its three agents, banked loads before they got too heavy to run \
home, used or ignored royal jelly, and beat the baseline on the merits rather than \
by a fluke of the seed."""

# Reviewer checklist items, surfaced to a human reviewing a published run. NOT
# seeded into the run, so the model never sees them; each restates an observable
# property of good Foray play the recorded replay can be checked against. The
# decisive signal is still the match record itself.
[[review_item]]
id = "beats-baseline"
title = "Beats the baseline"
text = """
The submission won the canonical match against `border-soldier` (recorded \
outcome `win`, not `loss`/`draw`/`forfeit`), and the replay shows it winning on \
the merits — banking seeds and/or sweeping the larder — rather than by the \
opponent forfeiting."""
weight = 3
domain = "play"

[[review_item]]
id = "balances-roles"
title = "Balances offense and defense"
text = """
Across the match the controller uses its three agents as both raiders and \
defenders rather than sending everyone to forage or everyone to guard — the \
replay shows at least some defensive tagging or border-holding, not a pure-greed \
rush that leaves its own caches undefended."""
weight = 1
domain = "play"

[[review_item]]
id = "manages-carry-weight"
title = "Manages carry weight"
text = """
Raiders bank loads before carry weight strands them — the replay does not show \
heavy raiders repeatedly crawling home and getting tagged with a full load (the \
greedy-raider failure). When to break off and bank reads as a deliberate \
decision."""
weight = 1
domain = "play"

[[review_item]]
id = "uses-jelly-correctly"
title = "Treats royal jelly correctly"
text = """
If the controller uses royal jelly, it uses it as tag-IMMUNITY for its own laden \
raiders (the correct, inverted semantics) — it does NOT chase enemy defenders \
expecting them to be made edible, the Berkeley-capsule mistake the case is \
designed to punish."""
weight = 1
domain = "play"

[[review_item]]
id = "stays-legal"
title = "Stays legal all match"
text = """
The controller never forfeited: it built and loaded, exported the `tick` entry, \
and across every tick stayed inside the fuel and memory limits, never trapped, and \
never returned a contract-invalid action."""
weight = 1
domain = "play"
