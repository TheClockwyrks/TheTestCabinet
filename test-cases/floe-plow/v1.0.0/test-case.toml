slug = "floe-plow"
name = "Floe Plow"
difficulty = "medium"
tags = ["asset-generation", "2d", "sprite", "hazard"]
summary = """
Draw the snow plow — a big, long tracked hazard vehicle in the Floe arctic-crossing \
game — as a 96x32 (three-tile) top-down sprite seen from overhead: a hard-edged \
steel plow flanked by caterpillar treads with a wide hazard-yellow blade across its \
leading edge, a cab, and a red beacon, produced one drawing operation at a time."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 0.5
type = "asset-generation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case ships a single `base` variant, declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The plow is a long, three-tile vehicle, so the canvas is 96x32 (three 32-pixel
# tiles). Fixing the size keeps every run comparable.
[canvas]
width = 96
height = 32
background = "transparent"

[tool]
binary = "draw"
preview = "canvas.png"

[output]
actions = "actions.json"

[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sprite matches the brief — a big, long, hard-edged \
plow seen from overhead, facing right and filling the 96x32 canvas, with a steel \
roof flanked by caterpillar treads, a wide hazard-yellow blade across the leading \
edge, a cab with a glass windshield, and a red beacon, in the industrial palette on \
transparency."""

[[review_item]]
id = "dangerous-machine"
title = "Reads as a big dangerous machine"
text = """
The sprite reads at a glance as a large, heavy, dangerous road machine seen from \
overhead — straight lines, right angles, metal, and clearly long (it fills the \
three-tile 96x32 canvas) — a hazard to dodge, not a creature and not a safe \
platform to stand on."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "plow-details"
title = "Snow-plow details"
text = """
It reads specifically as a top-down tracked snow plow: a long steel roof flanked by \
heavy caterpillar treads along both sides, a wide hazard-yellow blade across its \
leading (right) edge, a cab roof with a glass windshield, and a red warning beacon \
on top — built and detailed along its length, not a plain block."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette-and-framing"
title = "Industrial palette, transparency, and framing"
text = """
Uses only the industrial palette from the brief (steel, dark, tread, hazard yellow, \
beacon red, cab glass) on full transparency — no out-of-palette pixels, no fringes, \
no background fill — and fills most of the 96x32 canvas, facing right, without \
clipping flat against an edge."""
weight = 1
domain = "fidelity"
