name = "Sunfront Bombard"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "walker"]
summary = """
Sculpt and rig the Sunfront Bombard: a 56x52x80 opaque-voxel four-legged siege \
mortar walker whose turret swivels on a caller-driven turret_yaw joint and whose \
long mortar barrel lobs high on a caller-driven barrel_pitch joint while its two \
leg groups scuttle on their own, built and rigged one recorded operation at a \
time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 56
height = 52
depth = 80
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig — the stable, game-facing contract and the scoring targets. The
# model must produce these parts and these joints; at run time it MAY add further
# parts, joints, and auto-play clips of its own (recorded in rig.json) beyond what
# this table requires. `pivot` is `[x, y, z]` in voxel coordinates. `rig.json` is
# pre-seeded from this table so the contract exists from the first operation.
[model]

# The walker's armored hull: the root part (no parent), fixed to the world. It
# carries the turret ring and the four leg-hips.
[[model.part]]
name = "body"
pivot = [0, 0, 0]

# The left group of legs (front and rear), mounted low on the left flank. It
# scuttles on `legs_left_scuttle`.
[[model.part]]
name = "legs_left"
parent = "body"
pivot = [13, 14, 40]

# The right group of legs (front and rear), mirroring the left. It scuttles on
# `legs_right_scuttle` in opposite phase.
[[model.part]]
name = "legs_right"
parent = "body"
pivot = [43, 14, 40]

# The turret: mounted on top-center of the body. It swivels on `turret_yaw`.
[[model.part]]
name = "turret"
parent = "body"
pivot = [28, 30, 44]

# The long mortar barrel: mounted at the front of the turret, so it swings with
# the turret and lobs up and down on `barrel_pitch`.
[[model.part]]
name = "barrel"
parent = "turret"
pivot = [28, 38, 56]

# The required caller-driven turret swivel: a game addresses `turret_yaw` by name
# to swing the turret (and the barrel with it) left and right about its vertical
# mount, a full half-turn each way. `rest = 0` faces straight forward (+z).
[[model.joint]]
name = "turret_yaw"
part = "turret"
kind = "rotation"
axis = "y"
pivot = [28, 30, 44]
min = -3.14159265
max = 3.14159265
rest = 0.0
drive = "caller"

# The required caller-driven barrel elevation: `barrel_pitch` elevates and
# depresses the mortar barrel about its horizontal mount so it can lob high.
# `rest = 0.4` is a raised siege elevation; `max = 1.0` is a steep lob, `min = -0.2`
# a shallow aim.
[[model.joint]]
name = "barrel_pitch"
part = "barrel"
kind = "rotation"
axis = "x"
pivot = [28, 38, 56]
min = -0.2
max = 1.0
rest = 0.4
drive = "caller"

# The left leg group's own looping scuttle. An `auto` joint the case drives with a
# `[[model.clip]]`, so the legs walk on their own without a caller.
[[model.joint]]
name = "legs_left_scuttle"
part = "legs_left"
kind = "rotation"
axis = "x"
pivot = [13, 14, 40]
min = -0.6
max = 0.6
rest = 0.0
drive = "auto"

# The right leg group's scuttle, in opposite phase to the left.
[[model.joint]]
name = "legs_right_scuttle"
part = "legs_right"
kind = "rotation"
axis = "x"
pivot = [43, 14, 40]
min = -0.6
max = 0.6
rest = 0.0
drive = "auto"

# The auto-play scuttle clips — one per leg group, in opposite phase, so the walker
# strides on its own. Only `auto` joints take a clip; the caller-driven
# `turret_yaw` and `barrel_pitch` take none. Keyframes are inline `[t_ms, value]`
# pairs (radians).
[[model.clip]]
joint = "legs_left_scuttle"
period_ms = 550
loop = true
keyframes = [[0, 0.0], [137, 0.6], [275, 0.0], [412, -0.6], [550, 0.0]]

[[model.clip]]
joint = "legs_right_scuttle"
period_ms = 550
loop = true
keyframes = [[0, 0.0], [137, -0.6], [275, 0.0], [412, 0.6], [550, 0.0]]

# A predetermined animation the review viewer offers as a play button, so a
# reviewer can watch the mortar recoil and lob without dragging the joint slider by
# hand. Each `[[model.animation.track]]` drives one joint over the shared
# `period_ms` timeline; keyframes are inline `[t_ms, value]` pairs (radians here).
# `bombard_fire` kicks the barrel up in a quick recoil-lob then settles and loops.
[[model.animation]]
name = "bombard_fire"
period_ms = 1000
loop = true

[[model.animation.track]]
joint = "barrel_pitch"
keyframes = [[0, 0.4], [80, 0.95], [450, 0.4]]

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Bombard and \
poses correctly — a four-legged siege-mortar walker: a low hull carried on four \
legs, a turret that swivels on its mount without detaching while the body stays \
put, and a long mortar barrel that stays attached to the turret and lobs up and \
down, while the two leg groups scuttle on their own, with a clear solar-amber \
muzzle glow and the disciplined Duneforged palette."""

[[review_item]]
id = "reads-as-bombard"
title = "Reads as a four-legged siege-mortar walker"
text = """
From more than one angle the model reads unmistakably as a four-legged siege \
mortar walker: a low, boxy hull carried on four legs splayed out in two groups \
down its sides, a turret sitting on top, and a long mortar barrel projecting \
forward from the turret. It is a striding artillery walker, not an abstract stack \
of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "joints-move"
title = "Turret swivels, barrel lobs, legs scuttle"
text = """
Driving the `turret_yaw` joint swings the turret cleanly left and right about its \
vertical mount at the top-center of the body, and driving the `barrel_pitch` joint \
raises and lowers the mortar barrel about its horizontal mount. Across both joints' \
full ranges no voxel tears away from its mount or clips into the hull — each part \
rotates as one solid piece about the correct pivot. The four legs scuttle on their \
own through the `legs_left_scuttle` and `legs_right_scuttle` auto joints, stepping \
in opposite phase."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "body-fixed"
title = "Body stays fixed"
text = """
Only the moving parts move: the turret (and the barrel with it) when the joints \
are driven, and the legs as they scuttle. The body stays put — it is the fixed \
root of the rig, not carried along by the turret's swing, the barrel's lob, or the \
legs' stride."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "parts-attached"
title = "Barrel and legs stay attached"
text = """
Each child stays attached across its joint's range: the barrel is a child of the \
turret, so it projects from the turret's front, swings with it as `turret_yaw` \
turns, and pitches about its own mount as `barrel_pitch` drives, always meeting the \
turret's front face with no gap and never floating free. The two leg groups meet \
the body's flanks at their mounts and never detach as they scuttle."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze hull, iron legs \
and barrel, and the solar-amber muzzle accent) with a clear amber muzzle glow at \
the barrel's mouth, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
