slug = "sunfront-bombard"
name = "Sunfront Bombard"
difficulty = "hard"
tags = ["asset-generation", "3d", "voxel", "rig", "walker"]
summary = """
Sculpt and rig the Sunfront Bombard: a 56x52x80 opaque-voxel four-legged siege \
mortar walker whose turret swivels and whose long mortar barrel lobs high — built \
not from a fixed skeleton but by painting discrete opaque voxel cells one recorded \
operation at a time. The model invents whatever parts and joints it needs; the fixed \
contract is two animations it must author — a walking `walk` gait and a \
weapon-showcase `bombard_fire` — the reviewer can play back."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.5
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This case has a single default variant declared in its own file under
# `variants/`. This list is a root key, so it must precede the first table header.
variants = ["variants/base.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D
# canvas): `width` across (x), `height` up (y), `depth` front-to-back (z), in
# voxels. Each part is sculpted separately in this shared volume's coordinates.
# The volume always starts EMPTY; `background` is only the clear color behind the
# rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 56
height = 52
depth = 80
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the
# rig; every operation targets a part with `--part <name>`, records to that part's
# action log, and re-renders that part's isometric preview. Run `voxel-anim --help`
# for the operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each
# declared part name), the authoritative output each part's regenerated model is
# rebuilt from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A
# case does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. The model authors each
# animation's F-curves at run time with `voxel-anim define-animation`/`add-keyframe`;
# `rig.json` is pre-seeded with these declarations so the contract exists from the
# first operation.
[model]

# `walk` — the GAIT. A game-triggered playable (not self-playing) that strides the
# Bombard forward on its legs: feet plant flat and still on the ground while the body
# passes over them, then lift, swing forward, and plant again, so the machine pushes
# itself forward rather than flailing. The legs move; the guns hold. Authored IN
# PLACE: the body does not translate across the scene (the leg cycle carries the
# stride; a game supplies the real travel).
[[model.animation]]
name = "walk"
loop = true
auto_play = false

# `bombard_fire` — the WEAPON showcase. A game-triggered playable that kicks the
# mortar barrel up in a quick recoil-lob then settles, so the reviewer can watch the
# gun fire while the walker stands its ground on planted legs.
[[model.animation]]
name = "bombard_fire"
loop = true
auto_play = false

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Sunfront Bombard and \
poses correctly — a four-legged siege-mortar walker: a low hull carried on four \
articulated legs whose flat feet plant and lift clear of the ground under the \
model-authored `walk`, a turret that reads as swiveling to aim while the body stays \
put, and a long mortar barrel that stays attached to the turret and lobs up and \
fires under `bombard_fire`, with a clear solar-amber muzzle glow and the disciplined \
Duneforged palette."""

[[review_item]]
id = "reads-as-bombard"
title = "Reads as a four-legged siege-mortar walker"
text = """
From more than one angle the model reads unmistakably as a four-legged siege \
mortar walker: a low, boxy hull carried on four legs — one at each corner, each an \
articulated jointed chain rather than a rigid pole — a turret sitting on top, and a \
long mortar barrel projecting forward from the turret. It is a striding artillery \
walker, not an abstract stack of boxes."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "legs-walk"
title = "Legs stride on planted feet without clipping the ground"
text = """
Playing `walk` strides the Bombard forward on its four legs. The clip is authored \
IN PLACE — the body holds its ground and does not drift across the scene; the \
forward stride is carried entirely by the legs, so played on its own the feet cycle \
and the planted foot slides straight back under the body (a treadmill) while a game \
supplies the real movement. Each foot has a clear \
PLANTED STANCE — flat and still on the ground while the body passes over it — then \
lifts clear, swings forward, and plants again with weight; the four legs cycle in a \
supported gait (diagonal pairs, not one rigid bank) so the machine is always carried \
and pushes itself forward, NOT flailing its legs in a continuous arc. The feet stay \
flat as they carry the body (they don't tip onto toe or heel), no foot is dragged or \
driven down through the ground, and the legs stay attached to the hull across the \
whole cycle. The model had to invent an articulated leg (more than one segment and \
joint) for this to read as walking rather than swinging rigid poles."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "turret-and-barrel"
title = "Turret swivels and the barrel lobs and fires"
text = """
A distinct turret sits on top of the hull carrying a long mortar barrel that \
projects forward from it. The turret reads as a piece that swivels to aim left and \
right about a vertical mount, and the barrel elevates and depresses to lob high — \
each moving as one solid piece about a believable mount, the barrel always meeting \
the turret's front with no gap and never floating free. Playing `bombard_fire` kicks \
the barrel up in a quick recoil-lob and settles, with no geometry tearing away from \
its mount or clipping into the hull as it fires."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "body-fixed"
title = "Hull stays put; only the moving parts move"
text = """
The armored hull is the fixed base of the machine: it stays put, never carried along \
by the turret, the barrel, or the legs. When `bombard_fire` plays, the barrel works \
while the legs stay planted; when `walk` plays, the legs stride while the gun holds. \
Nothing but the moving parts moves."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Duneforged palette discipline"
text = """
Uses only the Duneforged colors from the brief (brass and bronze hull, iron legs \
and barrel, and the solar-amber muzzle accent) with a clear amber muzzle glow at \
the barrel's mouth, no out-of-palette colors, and no stray voxels drifting off the \
parts."""
weight = 1
domain = "fidelity"
