<!DOCTYPE html>
<!--
  Cascade — in-game reference mockup (representative mid-game table, Draw One).
  Canonical view slug: gameplay
  Render at a 1280x720 viewport. See ../specs/layout.md (positions) and
  ../specs/rules.md (what is legal). Live positions vary at runtime; this frame is
  a representative layout for a soft palette/layout comparison, not a strict match.

  Column anchors x: 224 346 468 590 712 834 956. Top row y=24, tableau top y=180.
  Face-down overlap 24, face-up overlap 34 (../specs/layout.md). Draw One shows a
  single waste card with no fan (../specs/modes/draw-one.md).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cascade — Gameplay</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <!-- ============ Top row (y = 24) ============ -->

      <!-- Stock: a face-down draw pile at column 1. -->
      <div class="card down" style="left: 224px; top: 24px"></div>

      <!-- Waste: Draw One shows a single playable top card at the waste position;
           any prior cards are squared beneath it (../specs/modes/draw-one.md). -->
      <div class="card black" style="left: 346px; top: 24px">
        <div class="corner"><div class="rank">K</div><div class="suit">♠</div></div>
        <div class="center-pip">♠</div>
        <div class="corner br"><div class="rank">K</div><div class="suit">♠</div></div>
      </div>

      <!-- Foundations at columns 4-7. Two are building; two are empty with a dim
           suit-pip hint. -->
      <div class="card black" style="left: 590px; top: 24px">
        <div class="corner"><div class="rank">2</div><div class="suit">♠</div></div>
        <div class="center-pip">♠</div>
        <div class="corner br"><div class="rank">2</div><div class="suit">♠</div></div>
      </div>
      <div class="card red" style="left: 712px; top: 24px">
        <div class="corner"><div class="rank">A</div><div class="suit">♥</div></div>
        <div class="center-pip">♥</div>
        <div class="corner br"><div class="rank">A</div><div class="suit">♥</div></div>
      </div>
      <div class="slot" style="left: 834px; top: 24px"><div class="hint">♦</div></div>
      <div class="slot" style="left: 956px; top: 24px"><div class="hint">♣</div></div>

      <!-- ============ Tableau (top y = 180) ============ -->

      <!-- Column 1 (x=224): a single face-up King. -->
      <div class="card black" style="left: 224px; top: 180px">
        <div class="corner"><div class="rank">K</div><div class="suit">♣</div></div>
        <div class="center-pip">♣</div>
        <div class="corner br"><div class="rank">K</div><div class="suit">♣</div></div>
      </div>

      <!-- Column 2 (x=346): 1 face-down + 1 face-up. -->
      <div class="card down" style="left: 346px; top: 180px"></div>
      <div class="card red" style="left: 346px; top: 204px">
        <div class="corner"><div class="rank">9</div><div class="suit">♥</div></div>
        <div class="center-pip">♥</div>
        <div class="corner br"><div class="rank">9</div><div class="suit">♥</div></div>
      </div>

      <!-- Column 3 (x=468): 2 face-down + a 8♥ 7♣ 6♦ run. -->
      <div class="card down" style="left: 468px; top: 180px"></div>
      <div class="card down" style="left: 468px; top: 204px"></div>
      <div class="card red" style="left: 468px; top: 228px">
        <div class="corner"><div class="rank">8</div><div class="suit">♥</div></div>
        <div class="center-pip">♥</div>
        <div class="corner br"><div class="rank">8</div><div class="suit">♥</div></div>
      </div>
      <div class="card black" style="left: 468px; top: 262px">
        <div class="corner"><div class="rank">7</div><div class="suit">♣</div></div>
        <div class="center-pip">♣</div>
        <div class="corner br"><div class="rank">7</div><div class="suit">♣</div></div>
      </div>
      <div class="card red" style="left: 468px; top: 296px">
        <div class="corner"><div class="rank">6</div><div class="suit">♦</div></div>
        <div class="center-pip">♦</div>
        <div class="corner br"><div class="rank">6</div><div class="suit">♦</div></div>
      </div>

      <!-- Column 4 (x=590): 3 face-down + a Q♣ J♥ 10♠ run. -->
      <div class="card down" style="left: 590px; top: 180px"></div>
      <div class="card down" style="left: 590px; top: 204px"></div>
      <div class="card down" style="left: 590px; top: 228px"></div>
      <div class="card black" style="left: 590px; top: 252px">
        <div class="corner"><div class="rank">Q</div><div class="suit">♣</div></div>
        <div class="center-pip">♣</div>
        <div class="corner br"><div class="rank">Q</div><div class="suit">♣</div></div>
      </div>
      <div class="card red" style="left: 590px; top: 286px">
        <div class="corner"><div class="rank">J</div><div class="suit">♥</div></div>
        <div class="center-pip">♥</div>
        <div class="corner br"><div class="rank">J</div><div class="suit">♥</div></div>
      </div>
      <div class="card black" style="left: 590px; top: 320px">
        <div class="corner"><div class="rank">10</div><div class="suit">♠</div></div>
        <div class="center-pip">♠</div>
        <div class="corner br"><div class="rank">10</div><div class="suit">♠</div></div>
      </div>

      <!-- Column 5 (x=712): 4 face-down + a face-up King. -->
      <div class="card down" style="left: 712px; top: 180px"></div>
      <div class="card down" style="left: 712px; top: 204px"></div>
      <div class="card down" style="left: 712px; top: 228px"></div>
      <div class="card down" style="left: 712px; top: 252px"></div>
      <div class="card red" style="left: 712px; top: 276px">
        <div class="corner"><div class="rank">K</div><div class="suit">♥</div></div>
        <div class="center-pip">♥</div>
        <div class="corner br"><div class="rank">K</div><div class="suit">♥</div></div>
      </div>

      <!-- Column 6 (x=834): 5 face-down + a 5♠ 4♥ run. -->
      <div class="card down" style="left: 834px; top: 180px"></div>
      <div class="card down" style="left: 834px; top: 204px"></div>
      <div class="card down" style="left: 834px; top: 228px"></div>
      <div class="card down" style="left: 834px; top: 252px"></div>
      <div class="card down" style="left: 834px; top: 276px"></div>
      <div class="card black" style="left: 834px; top: 300px">
        <div class="corner"><div class="rank">5</div><div class="suit">♠</div></div>
        <div class="center-pip">♠</div>
        <div class="corner br"><div class="rank">5</div><div class="suit">♠</div></div>
      </div>
      <div class="card red" style="left: 834px; top: 334px">
        <div class="corner"><div class="rank">4</div><div class="suit">♥</div></div>
        <div class="center-pip">♥</div>
        <div class="corner br"><div class="rank">4</div><div class="suit">♥</div></div>
      </div>

      <!-- Column 7 (x=956): 6 face-down + a face-up 9♦. -->
      <div class="card down" style="left: 956px; top: 180px"></div>
      <div class="card down" style="left: 956px; top: 204px"></div>
      <div class="card down" style="left: 956px; top: 228px"></div>
      <div class="card down" style="left: 956px; top: 252px"></div>
      <div class="card down" style="left: 956px; top: 276px"></div>
      <div class="card down" style="left: 956px; top: 300px"></div>
      <div class="card red" style="left: 956px; top: 324px">
        <div class="corner"><div class="rank">9</div><div class="suit">♦</div></div>
        <div class="center-pip">♦</div>
        <div class="corner br"><div class="rank">9</div><div class="suit">♦</div></div>
      </div>

      <!-- ============ HUD ============ -->
      <div class="hud">
        <div class="control">New Game</div>
        <div class="mode-label">Draw One</div>
        <div class="control">Menu</div>
      </div>
    </div>
  </body>
</html>
