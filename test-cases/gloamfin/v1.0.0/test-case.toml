name = "Gloamfin"
difficulty = "hard"
tags = ["asset-generation", "2d", "sprite-sheet", "enemy"]
summary = """
Draw the Gloamfin: the Listener, an eyeless deep-sea predator that hunts by \
sound, as a 128x128 sprite sheet — four-direction movement plus a sonar-pulse \
animation, produced one drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_seconds = 3600
type = "asset-generation"
asset_kind = "sprite-sheet"

# Each frame is its own 32x32 transparent canvas (a separate file). Fixing the
# frame size keeps every run comparable.
[canvas]
width = 32
height = 32
background = "transparent"

# The drawing tool. `draw-sheet` is the only way to make a mark; each operation
# targets a frame with `--frame`, records to that frame's action log, and
# re-renders that frame's preview. Run `draw-sheet --help` for the operations.
[tool]
binary = "draw-sheet"
preview = "frames/{frame}.png"

# The recorded action logs — one per frame, the authoritative output each frame's
# score is regenerated from.
[output]
actions = "frames/{frame}.actions.json"

# The frames the model draws — each a separate 32x32 file with its own target —
# and the named animation sequences a reviewer plays back.
[sheet]

[[sheet.frame]]
index = 0
target = "reference/frames/0.png"

[[sheet.frame]]
index = 1
target = "reference/frames/1.png"

[[sheet.frame]]
index = 2
target = "reference/frames/2.png"

[[sheet.frame]]
index = 3
target = "reference/frames/3.png"

[[sheet.frame]]
index = 4
target = "reference/frames/4.png"

[[sheet.frame]]
index = 5
target = "reference/frames/5.png"

[[sheet.frame]]
index = 6
target = "reference/frames/6.png"

[[sheet.frame]]
index = 7
target = "reference/frames/7.png"

[[sheet.frame]]
index = 8
target = "reference/frames/8.png"

[[sheet.frame]]
index = 9
target = "reference/frames/9.png"

[[sheet.frame]]
index = 10
target = "reference/frames/10.png"

[[sheet.frame]]
index = 11
target = "reference/frames/11.png"

[[sheet.frame]]
index = 12
target = "reference/frames/12.png"

[[sheet.frame]]
index = 13
target = "reference/frames/13.png"

[[sheet.frame]]
index = 14
target = "reference/frames/14.png"

[[sheet.frame]]
index = 15
target = "reference/frames/15.png"

[[sheet.sequence]]
slug = "walk-down"
name = "Swim — down"
frames = [0, 1]
fps = 4

[[sheet.sequence]]
slug = "walk-up"
name = "Swim — up"
frames = [2, 3]
fps = 4

[[sheet.sequence]]
slug = "walk-left"
name = "Swim — left"
frames = [4, 5]
fps = 4

[[sheet.sequence]]
slug = "walk-right"
name = "Swim — right"
frames = [6, 7]
fps = 4

[[sheet.sequence]]
slug = "sonar-pulse"
name = "Sonar pulse"
frames = [8, 9, 10, 11, 12, 13]
fps = 8

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"
dest = "specs/brief.md"

[[variant]]
slug = "base"
name = "Base"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Gloamfin target — its eyeless \
silhouette, the cold violet palette, the four readable swim directions, and the \
sonar-pulse animation that marks it as the predator that hunts by sound."""

[[review_item]]
id = "eyeless"
title = "Eyeless head"
text = """
Every frame's creature has no eyes at all — a smooth, blunt head reading clearly \
as a predator that navigates without sight. A drawn eye is a failure for this \
case."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "four-directions"
title = "Four readable directions"
text = """
The movement frames read as the creature swimming in four distinct directions — \
down (rows 0), up, left, and right — each with its blunt head leading its \
direction of travel and a forked tail trailing behind, not the same blob \
repeated."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "sonar-tell"
title = "Sonar-pulse animation"
text = """
The tell frames (row 2 into row 3) show a pale sonar pulse — concentric rings in \
the sonar accent color emanating from the body and expanding frame to frame — the \
signature of a creature that 'sees' by sound."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Cold violet palette"
text = """
Uses the Listener's cold palette from the brief (violet body, lighter violet \
underside, dark outline, pale sonar accent) with no out-of-palette colors and no \
halo of stray pixels."""
weight = 1
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each creature fills most of its own 32x32 frame cell, centered with a small \
margin, neither tiny in a corner nor spilling across the grid lines into the \
neighboring frame."""
weight = 1
domain = "fidelity"
