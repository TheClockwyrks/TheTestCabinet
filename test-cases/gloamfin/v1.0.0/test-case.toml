name = "Gloamfin"
difficulty = "hard"
tags = ["asset-generation", "2d", "sprite-sheet", "enemy"]
summary = """
Draw the Gloamfin: the Listener, an eyeless deep-sea predator that hunts by \
sound, as a 128x128 sprite sheet — four-direction movement plus a sonar-pulse \
animation, produced one drawing operation at a time."""
description = "description.md"
prompt = "prompt.hbs"
max_runtime_seconds = 3600
type = "asset-generation"
asset_kind = "sprite-sheet"

# A 128x128 transparent canvas, tiled into a 4x4 grid of 32x32 frames (one frame
# per maze tile), keeps every run comparable.
[canvas]
width = 128
height = 128
background = "transparent"

# The drawing tool. `draw` is the only way to make a mark; it records every
# operation to the action log and re-renders the preview after each call.
[tool]
binary = "draw"
operations = "schemas/operations.json"
preview = "canvas.png"

# The recorded action log — the authoritative output the score is regenerated
# from.
[output]
actions = "actions.json"

# The frame grid and the named animation sequences a reviewer plays back. Frames
# are numbered row-major from the top-left (frame i is at column i % 4, row i / 4).
[sheet]
frame_width = 32
frame_height = 32
columns = 4
rows = 4

[[sheet.sequence]]
slug = "walk-down"
name = "Swim — down"
frames = [0, 1]
fps = 4

[[sheet.sequence]]
slug = "walk-up"
name = "Swim — up"
frames = [2, 3]
fps = 4

[[sheet.sequence]]
slug = "walk-left"
name = "Swim — left"
frames = [4, 5]
fps = 4

[[sheet.sequence]]
slug = "walk-right"
name = "Swim — right"
frames = [6, 7]
fps = 4

[[sheet.sequence]]
slug = "sonar-pulse"
name = "Sonar pulse"
frames = [8, 9, 10, 11, 12, 13]
fps = 8

# The visual goal the regenerated sheet is scored against. Served as-is.
[[reference]]
view = "target"
media = "reference/target.png"

# The self-contained brief, seeded for the run.
[[spec]]
source = "specs/brief.md"
dest = "specs/brief.md"

[[variant]]
slug = "base"
name = "Base"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How faithfully the regenerated sheet matches the Gloamfin target — its eyeless \
silhouette, the cold violet palette, the four readable swim directions, and the \
sonar-pulse animation that marks it as the predator that hunts by sound."""

[[review_item]]
id = "eyeless"
title = "Eyeless head"
text = """
Every frame's creature has no eyes at all — a smooth, blunt head reading clearly \
as a predator that navigates without sight. A drawn eye is a failure for this \
case."""
weight = 3
reference = "target"
domain = "fidelity"

[[review_item]]
id = "four-directions"
title = "Four readable directions"
text = """
The movement frames read as the creature swimming in four distinct directions — \
down (rows 0), up, left, and right — each with its blunt head leading its \
direction of travel and a forked tail trailing behind, not the same blob \
repeated."""
weight = 3
reference = "target"
domain = "fidelity"

[[review_item]]
id = "sonar-tell"
title = "Sonar-pulse animation"
text = """
The tell frames (row 2 into row 3) show a pale sonar pulse — concentric rings in \
the sonar accent color emanating from the body and expanding frame to frame — the \
signature of a creature that 'sees' by sound."""
weight = 2
reference = "target"
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Cold violet palette"
text = """
Uses the Listener's cold palette from the brief (violet body, lighter violet \
underside, dark outline, pale sonar accent) with no out-of-palette colors and no \
halo of stray pixels."""
weight = 1
reference = "target"
domain = "fidelity"

[[review_item]]
id = "framing"
title = "Frame framing"
text = """
Each creature fills most of its own 32x32 frame cell, centered with a small \
margin, neither tiny in a corner nor spilling across the grid lines into the \
neighboring frame."""
weight = 1
reference = "target"
domain = "fidelity"
