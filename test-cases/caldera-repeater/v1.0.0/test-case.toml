slug = "caldera-repeater"
name = "Caldera Repeater"
difficulty = "medium"
tags = ["voxel", "rig", "tower"]
summary = """
Sculpt and rig the Caldera Repeater: the cheap workhorse tower of the Holdfast — a \
slim brass post rising to a rotating drum of many short iron barrels, like a rotary \
gun, that ticks over on its own and cycles its muzzles in a rapid burst on demand \
while the post and base stay fixed — painted cell by cell with the `voxel-anim` tool, \
one recorded operation at a time. The model invents whatever parts and joints it \
needs; the fixed contract is two animations it must author — a self-playing `idle` \
and a triggered `fire` — plus a contiguous verdigris accent collar the game recolors \
to show the tower's upgrade level."""
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"
prompt = "prompt.hbs"
max_runtime_hours = 1.0
type = "asset-generation"
asset_kind = "voxel-animation"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# The three variants sculpt the SAME Repeater at three sizes — `base` (this case's
# volume), `half` (each extent ~halved), and `double` (each doubled) — each declaring
# its own `[voxel]` override. `base` is first, so it is the default. This list is a
# root key, so it must precede the first table header.
variants = ["variants/base.toml", "variants/half.toml", "variants/double.toml"]

# The fixed voxel volume each part is sculpted into (the 3D analog of a 2D canvas):
# `width` across (x), `height` up (y), `depth` front-to-back (z), in voxels. Sized
# from the Repeater's real size at the roster's shared scale — it is a SLIM,
# medium-height emplacement, and the volume's slender proportions carry that before a
# single voxel is placed. Each part is sculpted separately in this shared volume's
# coordinates. The volume always starts EMPTY; `background` is only the clear color
# behind the rasterized isometric preview PNG. A voxel case must NOT declare [canvas].
[voxel]
width = 24
height = 50
depth = 24
background = "transparent"

# The sculpting tool. `voxel-anim` is the only way to place a voxel and edit the rig;
# every operation targets a part with `--part <name>`, recording to that part's action
# log; rendering is on request (`voxel-anim render`). Run `voxel-anim --help` for the
# operations AND the rig subcommands; no operations schema is seeded.
[tool]
binary = "voxel-anim"
preview = "parts/{part}.png"

# The recorded action logs — one per part (the `{part}` token expands to each part the
# model defines), the authoritative output each part's regenerated model is rebuilt
# from.
[output]
actions = "parts/{part}.actions.json"

# The required rig contract — and the ONLY thing this case fixes about the rig. A case
# does NOT prescribe parts, joints, pivots, or ranges: the model invents whatever
# skeleton it needs and is judged on whether it works out the right pieces, attaches
# them where they belong, and animates them convincingly. What is fixed is the set of
# NAMED ANIMATIONS the model must author (a game plays them by name) and whether each
# is a game-triggered playable or a self-playing idle. Both names here are the ones
# `caldera`'s `assets/models.json` binds to the Repeater's game events.
[model]

# `idle` — the self-playing tick-over. A self-playing idle that loops on its own: the
# barrel drum turns slowly and continuously so the tower reads as live even when it is
# not firing. The post and base stay fixed.
[[model.animation]]
name = "idle"
loop = true
auto_play = true

# `fire` — the burst. A game-triggered playable that loops: the drum spins up fast and
# the barrels cycle, one muzzle after another, in a rapid burst. The post and base stay
# fixed.
[[model.animation]]
name = "fire"
loop = true
auto_play = false

# The self-contained brief, seeded for the run. It is a Handlebars template (`.hbs`),
# rendered per variant so the volume it states matches the selected size. The seeded
# dest drops the `.hbs`, so the run still reads `specs/brief.md`.
[[spec]]
source = "specs/brief.md.hbs"

[[domain]]
id = "fidelity"
name = "Fidelity"
description = """
How convincingly the regenerated, rigged model reads as the Caldera Repeater and poses \
correctly — the slim brass post crowned by a rotating drum of many short iron barrels, \
carrying one contiguous verdigris accent collar, whose drum ticks over on its own and \
cycles its muzzles in a rapid burst while the post and base stay fixed, in the \
disciplined Holdfast palette."""

[[review_item]]
id = "reads-as-repeater"
title = "Reads as the Repeater"
text = """
From more than one angle the model reads unmistakably as the Repeater: a SLIM, \
medium-height brass post founded on the ground, rising to a ROTATING DRUM OF MANY SHORT \
IRON BARRELS — a cluster of muzzles arranged around a spinning axis, like a rotary gun. \
It reads as the cheap, fast, light workhorse: many short barrels is the whole tell. It \
is not squat, needle-thin, or barrel-less, and carries no single fat upward tub, long \
horizontal rail, or ring of nozzles. It is brass-and-iron machinery — a static \
emplacement, not a creature."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "idle-reads"
title = "Idle ticks the drum over on its own"
text = """
Playing `idle` turns the barrel drum slowly and continuously about its spin axis, ticking \
over on its own with no caller, so the tower reads as live and powered even when it is not \
firing. It loops seamlessly with an eased, deliberate cadence rather than a mechanical \
linear slide. Only the drum turns — the post and the ground base stay fixed, never carried \
along — and no barrel tears away from the drum."""
weight = 3
domain = "fidelity"

[[review_item]]
id = "fire-reads"
title = "Fire cycles the muzzles in a rapid burst"
text = """
Playing `fire` spins the drum up fast and cycles the barrels, one muzzle coming round after \
another in a rapid burst, reading as a light, fast-firing rotary gun rather than a single \
heavy shot. The drum turns as one solid piece about its axis with every barrel staying \
attached, and the post and ground base stay fixed throughout."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "accent-collar"
title = "A contiguous verdigris accent collar"
text = """
A collar ring where the barrel drum meets the top of the post is sculpted as ONE \
CONTIGUOUS band in the accent color `#2f7d72`, and clearly visible from more than one \
angle. That color appears NOWHERE else on the model — not one stray voxel, highlight, or \
seam. The game finds every voxel of it and repaints it to show the tower's upgrade level, \
so a scattered, broken, or misplaced accent region breaks the upgrade system outright."""
weight = 2
domain = "fidelity"

[[review_item]]
id = "palette"
title = "Holdfast palette discipline"
text = """
Uses only the brief's four colors — brass plating, brass dark, iron mechanisms, and the \
verdigris accent — with no out-of-palette colors, and in particular NO steel `#b8bcc2`, NO \
gold `#ffce54`, and NO white `#dfeaea` anywhere on the model, since a game paints those \
onto the accent collar at run time to show the upgrade level. No stray voxels drift off the \
model."""
weight = 1
domain = "fidelity"
