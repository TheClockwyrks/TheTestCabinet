slug = "caldera"
# The Test Cabinet test case manifest.
#
# Declares, for this exact version, which files are seeded into a run, which
# reference views are rendered and seeded as visual targets, which proofs the
# build must submit, and which validation checks run. The harness reads this file
# to resolve a `TestCaseVersion`.

# Human-readable display name for this test case.
name = "Caldera"

# Relative difficulty (easy | medium | hard), surfaced on the site. Caldera asks
# for a procedurally generated hex-mesh world with terraced elevation, cliffs,
# carved rivers, and animated water rendered in real-time 3D from a tilted RTS
# camera; a two-fluid flow-network simulation with elevation-aware flow; a
# build/economy layer; 3D-pathfinding enemy AI funneled by the terrain; and a
# discrete escalating wave loop with a win and a loss — a substantial 3D build, but
# short of the flagship hard cases (Sunfront, Siege, Thunderhead), so it sits at
# medium.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["strategy", "tower-defense", "3d", "hex", "simulation"]

# Short site-facing abstract, shown on the test case card. Authored inline (not a
# file) so it renders safely inside the card's link and stays brief; NOT seeded.
summary = """
A real-time strategy tower-defense over a procedurally generated hex caldera: \
draw water from rivers and lakes, pump it uphill to boilers on geothermal vents to \
raise steam, and pipe that steam to towers that only fire when supplied — then hold \
a fixed Core against fifteen escalating waves of the obsidian Slag pouring in from \
two rim breaches. The terrain's terraces, cliffs, and rivers are the rules the whole \
game is played against. Clear the last wave and the caldera holds; lose the Core and \
you are overrun."""

# Site-facing prose describing the case, relative to this version folder. NOT
# seeded into a run; it exists only to introduce the case on the site.
description = "description.md"
# Optional per-version changelog entry (Markdown, relative to this version
# folder), recording what changed in THIS version — the first version simply reads
# "Introduced.". The site aggregates every version's entry, newest first, into the
# case's changelog. Like `description`, it is NOT seeded into a run.
changelog = "changelog.md"

# Handlebars prompt template, relative to this version folder. Rendered per run
# (with the seeded specs and the selected variant) and handed to the model as the
# build instruction. Injects absolute in-container paths via template variables.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session before the run is
# stopped. Caldera is among the catalog's largest builds (a procedural hex-mesh
# renderer with terraces/cliffs/rivers, a two-fluid flow simulation, an economy,
# 3D-pathfinding AI, the wave loop, and multiple states), so it gets six hours.
max_runtime_hours = 6

# Starter workspace seeded into the root of every run before the specs. It gives
# the model a baseline project: a `package.json` that pins `playwright` as a dev
# dependency, so the browser tooling is a visible, project-local dependency. The
# seeded files land at the run root (`workspaces/base/package.json` → `package.json`).
workspace = "workspaces/base"

# Init command, run in the run container once the workspace and specs are seeded
# and before the harness starts. Installs the workspace's dependencies and
# downloads the Playwright Chromium build (the base image ships the OS libraries
# Chromium links against, but not the browser binary), so the model can build and
# verify immediately against a project-local Playwright.
init = "npm install && npx playwright install chromium"

# Variants: exactly one runs per run, and its slug is recorded in the run record.
# This version offers a single `base` variant — the standard The Hold defense. It
# supplies the `title` view's mockup; `gameplay` and `game-over` are common. Future
# versions/variants are expected to add rule twists (a longer siege, a one-breach
# skirmish, an endless survival run, a no-Core-upgrade economy) on top of this base.
# This list is a root key, so it must precede the first table header (`[build]`).
variants = ["variants/base.toml"]

# Provided models, seeded into the run root. Each listed directory is seeded verbatim
# (so `assets/runner/` lands at `assets/runner/` in the run), alongside the
# `assets/models.json` manifest. These are the ONLY art the case supplies — the
# finished 3D models the build loads and renders for every Slag unit, tower, the Core,
# the three fluid structures, and the two-piece pipe kit. Everything else (the terrain
# mesh and its procedural surface color, the animated water, the vents, the pipe
# routing and flow, effects, HUD) is generated in code. `specs/assets.md` tells the
# build what they are, how to found/pose/animate/RECOLOR them, and to load them by
# page-relative URL.
#
# The `assets` key is COMMENTED OUT until the model files exist: the harness rejects a
# manifest whose `assets` paths do not exist (`core`'s test-case resolution), so
# listing the entity directories before they are populated would fail resolution. This
# case is NOT run until then. `assets/models.json` already carries every entry — it is
# the record of what is owed — so landing an asset case is just uncommenting its line
# once its directory exists. When every directory below exists, UNCOMMENT the block:
#
# assets = [
#   "assets/models.json",
#   # The Slag (one model per archetype; tiers are a recolor, not new geometry)
#   "assets/runner", "assets/breaker", "assets/sapper", "assets/colossus",
#   # The Holdfast towers (upgrade levels are a recolor)
#   "assets/repeater", "assets/mortar", "assets/lance", "assets/scald",
#   # The Core and the fluid structures
#   "assets/core", "assets/boiler", "assets/pump", "assets/river-tap",
#   # The static pipe kit, recolored per network (water / steam)
#   "assets/pipe-span", "assets/pipe-hub",
# ]

# How the validator (and the per-run Cloudflare Pages deploy) turns a produced
# implementation into a served static site. These run verbatim from the build's
# repository root. `npm ci` is deliberate — it requires the build to commit a
# `package-lock.json`. Both commands are required; there are no defaults.
[build]
install = "npm ci"
build = "npm run build"

# Common specs: seeded for EVERY variant, at the `dest` path within the run
# workspace. The specification is decomposed by concern. All common specs are
# plain Markdown, seeded verbatim.
[[spec]]
source = "specs/overview.md"

[[spec]]
source = "specs/world.md"

# The provided models: the manifest, the clips, and the accent-recolor rules that turn
# one model per archetype into three Slag tiers and one per tower into three upgrade
# levels. Seeded now so the contract is authored alongside the specs that cite it,
# even though the `assets` key above stays commented until the models exist.
[[spec]]
source = "specs/assets.md"

[[spec]]
source = "specs/build.md"

[[spec]]
source = "specs/fluids.md"

[[spec]]
source = "specs/enemies.md"

[[spec]]
source = "specs/towers.md"

[[spec]]
source = "specs/waves.md"

[[spec]]
source = "specs/flow.md"

[[spec]]
source = "specs/standard.md"

# Proof of implementation: instructs the build to capture evidence at the exact
# paths the `[[proof]]` entries below declare. The paths in this spec and in the
# `[[proof]]` entries must match.
[[spec]]
source = "specs/proof.md"

# Common reference views, seeded for EVERY variant. Each `path` is a static HTML
# mockup the harness renders to a screenshot and seeds as a visual target. The
# `title` view is variant-specific (declared per variant); `gameplay` (HUD-only)
# and `game-over` look the same in every variant.
[[reference]]
view = "gameplay"
path = "reference/gameplay.html"

[[reference]]
view = "game-over"
path = "reference/game-over.html"

# Proof of implementation, requested for every variant. Each declares a `dest`
# path (relative to the run workspace root) the build must write a screenshot
# or `.webm` clip to; `specs/proof.md` instructs the build to produce them at
# exactly these paths. Validation records whether each turned up (informational).
# The media kind is inferred from the extension: `.png` is an image, `.webm` a
# video (the format Playwright records natively; the public gallery transcodes
# it to mp4).
[[proof]]
id = "title"
name = "Title screen"
dest = "proof/title.png"

[[proof]]
id = "gameplay"
name = "In-game HUD"
dest = "proof/gameplay.png"

[[proof]]
id = "terrain"
name = "Terrain close-up"
dest = "proof/terrain.png"

[[proof]]
id = "overlay"
name = "Fluid-network overlay"
dest = "proof/overlay.png"

[[proof]]
id = "wireframe"
name = "Wireframe frame"
dest = "proof/wireframe.png"

[[proof]]
id = "assault"
name = "Assault clip"
dest = "proof/assault.webm"

# Validation checks (opt-in). Only the checks declared here run. Each drives the
# built implementation, screenshots it, and compares against the rendered
# screenshot of `reference`. Only the title screen is deterministic enough to
# validate for Caldera: it is whatever the game shows on load, so it needs no
# actions. The live 3D game and the end screens depend on play, so they are seeded
# as references but not validated.
[[check]]
view = "title"
name = "Title Screen"
reference = "title"
actions = []

# Scoring domains. A reviewer rates each independently while playing the build, and
# the run's overall rating is the WORST across them — polished terrain cannot mask a
# broken fluid sim or a wave loop that never ends. Every case declares at least one.
# Most checklist items apply across domains; an item may name one when it is
# specific to that facet.
[[domain]]
id = "worldgen"
name = "World & rendering"
description = "The procedurally generated hex caldera — terraces, cliffs, rivers, lake, vents, and procedural surface color — the tilted 3D renderer's quality and performance, and the animated water."

[[domain]]
id = "economy"
name = "Economy & building"
description = "Funds and the Core upgrade lever, the buildable structures and their terrain-driven placement rules, pipe-laying, tower upgrades, and repair/demolish."

[[domain]]
id = "fluids"
name = "Fluid network"
description = "The water-to-steam-to-power flow-network simulation: sources and flow rates, boilers, elevation-aware flow, tower steam demand, brownouts, severed lines, and the overlay."

[[domain]]
id = "combat"
name = "Towers & the Slag"
description = "The four towers and their hitscan/arcing/field weapons and anti-armor, hit detection and elevation line of sight, and the Slag roster with its 3D pathfinding, tiers, and armor."

[[domain]]
id = "waves"
name = "Wave loop"
description = "The discrete numbered waves, the curve-driven composition and tier escalation, the build/defend rhythm, the win and loss conditions, and the balance."

# Reviewer checklist items, common to every variant. These are the major,
# observable requirements a reviewer must explicitly check by playing the build —
# what validation cannot judge and is easy to miss. They are reporter-side: never
# seeded, so the model never sees the checklist; each restates a requirement the
# seeded specification already states. Each is worth `weight` points; the reviewer
# records a pass/fail verdict for each before the run can be published.
[[review_item]]
id = "terrain-terraces"
title = "Terraces & cliffs"
text = "The hex terrain connects elevation correctly: adjacent cells one level apart are joined by visible STEPPED TERRACES (not a smooth ramp), cells two or more levels apart by a vertical CLIFF face (no terrace), and coplanar cells lie flat — with NO holes, gaps, or torn corners anywhere the treads, risers, cliffs, and three-cell corners meet, at any combination of neighbor levels. The mesh is watertight; nothing a unit falls through and no floating cliffs. Verifiable from the tilted camera and in wireframe mode."
weight = 3
domain = "worldgen"
proof = "terrain"

[[review_item]]
id = "terrain-coherent"
title = "Coherent generated caldera"
text = "Each match generates a coherent natural caldera — a bowl with a high cliffed rim, mid slopes, and a low central floor, with real and varied elevation, not a flat plane or random noise. Vertex irregularity makes it read organic (but gameplay stays on the true grid), and the surface color is varied by PROCEDURAL NOISE (grass, rock, ash), not flat single-color fills. 4–6 geothermal vents sit on the high rock, two breaches open on two different sides, and the Core is founded centrally with no floating or buried base."
weight = 2
domain = "worldgen"
proof = "terrain"

[[review_item]]
id = "water-rivers"
title = "Rivers, lake & animated water"
text = "One or two rivers run STRICTLY DOWNHILL from a high source to a low outlet (never climbing), carved visibly into the terrain, plus at least one lake / deep-water body. Both river and deep water have an ANIMATED, flowing surface — visibly moving ripples/waves, with river flow reading as directional — not a flat blue polygon."
weight = 2
domain = "worldgen"
proof = "terrain"

[[review_item]]
id = "camera-render"
title = "Tilted 3D camera & renderer"
text = "The world is viewed through a TILTED RTS camera (never straight top-down) that clearly shows the terrain is 3D — terraces stepping up, cliff faces, channel depth, structure and unit height — and can pan, rotate, and zoom. Wireframe mode reveals the underlying hex mesh and the built geometry. The world renders in real-time 3D and sustains a playable frame rate during a heavy late-wave assault, with the performance overlay showing live FPS."
weight = 2
domain = "worldgen"
proof = "wireframe"

[[review_item]]
id = "funds-core-upgrade"
title = "Funds & the Core upgrade lever"
text = "Funds accrue over time from the Core, are spent on every structure and repair, and cannot go negative. The Core can be UPGRADED for a lump of funds to raise its income, across rising-cost levels — a real opportunity cost against buying defense now, so upgrade timing is a genuine strategic decision. The HUD shows the balance and the live income rate."
weight = 2
domain = "economy"
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "build-placement"
title = "Terrain-driven placement"
text = "Structures place only where the terrain allows, with live valid/invalid cursor feedback and a reason: a Boiler only on a vent, a Pump only beside deep water, a River Tap only on a river, towers only on buildable land, and pipes never across a cliff edge or onto deep water. Pipes lay by click-dragging a run of cells that snaps to terrace-legal edges and stops at a cliff. Placed structures sit founded on the terrain at their cell's elevation."
weight = 2
domain = "economy"
proof = "gameplay"

[[review_item]]
id = "tower-upgrade-repair"
title = "Tower upgrades, repair & demolish"
text = "A placed tower can be upgraded in place through two levels (stronger, but drawing more steam), and READS as upgraded: its provided model's accent fitting is recolored by level (brass → steel → gold), leaving the rest of the tower unchanged. Damaged structures and pipes can be repaired for funds and any built structure demolished for a partial refund; a destroyed structure must be rebuilt, not repaired."
weight = 1
domain = "economy"

[[review_item]]
id = "fluid-chain"
title = "The water-steam-power chain"
text = "The full supply chain works: sources draw water into water pipes, boilers on vents convert piped-in water to steam, steam pipes carry it to towers, and a tower FIRES ONLY WHILE its steam demand is met. Water and steam are separate networks on separate pipe types. A boiler with no water makes no steam; a tower with no steam is dark. The flow is a continuous, frame-rate-independent simulation that re-solves as the network changes."
weight = 3
domain = "fluids"
proof = "overlay"

[[review_item]]
id = "elevation-flow"
title = "Elevation-aware flow"
text = "Flow depends on elevation: a River Tap is gravity-fed and can only deliver water at or below its own elevation (never uphill), while a Pump lifts water to any height but its deliverable flow drops with the net rise climbed. Steam flows to towers regardless of elevation (with only a mild distance loss). So reaching high vents with enough water is a real terrain puzzle, not just connectivity."
weight = 2
domain = "fluids"
proof = "overlay"

[[review_item]]
id = "brownout-sever"
title = "Brownouts & severed lines"
text = "When steam demand exceeds supply the network browns out, shedding towers in a stable, legible order (dark towers stop firing) rather than thrashing. A destroyed pipe cell BREAKS THE LINE, starving everything downstream — a cut water main stops its boilers and darkens the towers they fed — and the picture re-solves on repair or re-route. The fluid-network overlay shows flow, rates, and each tower's powered/brownout/dark state, with breaks flagged."
weight = 2
domain = "fluids"
proof = "overlay"

[[review_item]]
id = "slag-pathfinding"
title = "Slag roster & 3D pathfinding"
text = "The four Slag archetypes each pursue their intent: Runners and Breakers beeline the Core, Sappers march for the fluid network (pipes/sources/boilers) and cut it, and Colossi wade to the Core with an armor aura buffing nearby Slag. All path through the terrain in 3D — up and down terraces, AROUND cliffs and deep water, wading rivers at half speed — from BOTH breaches toward their targets, without walking through terrain or off the edge, and a crowd flows and spreads rather than clumping into a vibrating pile."
weight = 3
domain = "combat"
proof = "assault"

[[review_item]]
id = "tower-roster"
title = "Tower roster & elevation"
text = "All four towers work and are distinct: Repeater (fast hitscan anti-chaff), Mortar (arcing splash that clears a one-level terrace but not a cliff), Lance (long anti-armor hitscan that ignores armor), and Scald (a steam-jet slow + burn field). Hitscan towers gain range from higher ground and are BLOCKED by cliffs/higher terrain in their line of sight, so where on the relief a tower stands changes what it can hit. There is no friendly fire."
weight = 2
domain = "combat"
proof = "assault"

[[review_item]]
id = "slag-tiers"
title = "Slag tiers & armor"
text = "Each archetype climbs three visually distinct tiers as the wave schedule dictates — tougher, better-armored, hitting harder. The tier is produced by RECOLORING THE PROVIDED MODEL'S ACCENT REGION (plain obsidian → steel plating → violet elite trim), so a Tier III unit shows violet plates while its obsidian body and acid-green glow are UNCHANGED — not a whole-model tint that drags the glow with it, and not a substituted model. Armor reduces incoming tower damage EXCEPT from the anti-armor Lance, which ignores it; the Colossus aura stacks further armor on nearby Slag. Tier is driven by wave number, not the Core's health."
weight = 2
domain = "combat"
proof = "assault"

[[review_item]]
id = "wave-escalation"
title = "Curve-driven wave escalation"
text = "The run is discrete numbered waves that open EASY (all Runners, all Tier I) and escalate via two curves keyed on wave number: a composition curve that phases tougher archetypes in (Breakers, then Sappers, then Colossi) and a tier curve that ramps toward Tier III, through a mixed middle band, to a Tier-III-dominant final surge. There are no phase gates; escalation is by these curves, not by elapsed time or Core health. Waves arrive from both breaches with a bounded live-population cap."
weight = 2
domain = "waves"
proof = "assault"

[[review_item]]
id = "win-lose"
title = "Winning and losing"
text = "The run is WON by clearing the final wave with the Core still standing (a HELD end screen) and LOST if the Core's health reaches zero (an OVERRUN end screen); each end shows the result and stats (wave reached, Slag destroyed, time). The Core's health does not regenerate, so damage is permanent. A well-built, well-supplied defense can hold through the last wave; a sloppy one loses the Core."
weight = 2
domain = "waves"
reference = "game-over"

[[review_item]]
id = "wave-flow"
title = "Build rhythm, speed & starting wave"
text = "A build interval with a countdown precedes each wave and shows a preview of the next wave's composition; building is allowed at any time, during a wave as well as between. A pause and a fast-forward game-speed control both work and keep the sim frame-rate-independent. PLAY offers a starting-wave choice — wave 1 or a skip-ahead to later waves with a scaled treasury — so the tougher late content is reachable directly."
weight = 1
domain = "waves"

[[review_item]]
id = "hud-complete"
title = "HUD"
text = "The HUD shows the funds balance and live income rate, the Core health bar, the wave counter and build-interval countdown with the next-wave preview, the steam produced-vs-demanded readout, the build palette with costs, and a selection panel for the selected cell or structure — plus the toggleable fluid-network overlay, wireframe mode, and performance overlay."
weight = 1
reference = "gameplay"
proof = "gameplay"

[[review_item]]
id = "states-controls"
title = "States & controls"
text = "Every state is reachable and behaves: the title (CALDERA with just PLAY and HOW TO PLAY), the starting-wave prompt, the in-game state, a paused overlay that freezes the simulation and the survival clock, and the two end screens. The tilted camera pans, rotates, and zooms; selection, the build palette, and pipe click-drag all work."
weight = 1
reference = "title"
proof = "title"

[[review_item]]
id = "fits-window"
title = "Window fit"
text = "The 3D view fills the window and every HUD element stays on screen, fitted, centered, and legible at any window size and pixel density, including on the title screen at load before any input."
weight = 1
reference = "gameplay"
