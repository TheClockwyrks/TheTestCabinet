[profile.default]
retries = 2
flaky-result = "fail"
fail-fast = false

# Hard cap on any single test's execution. nextest marks a test "slow" after
# `period` and then forcibly terminates it after `terminate-after` such periods,
# so no test — or hung child process it spawned — can run longer than
# period × terminate-after (120s here). This bounds a wedged test instead of
# letting it hang the whole run until the CI job's own timeout fires.
slow-timeout = { period = "60s", terminate-after = 2 }

# The wasm sandbox's timeout-headroom assertion measures the guest's *wall clock* — the
# epoch-interruption budget is wall clock with bridged-call time subtracted, not CPU time —
# so it inflates under contention from the rest of the suite and fails on a busy machine
# while the property it checks is perfectly intact. Give it the whole runner: taking every
# slot is what makes the reading it takes a reading of the workload rather than of the
# machine's load average.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(=sandbox::tests::the_limits_stop_a_runaway_program)'
threads-required = "num-test-threads"

# gg's whole-loop sandbox tests drive real code turns end to end, and a code turn now
# type-checks the model's program: each one spawns `node` against the committed `tsc`
# for ~90 ms, and these tests run many turns each, several of them also compiling a
# code skill or memory. Measured on an idle 18-core dev container they take 40-72 s
# apiece under the package's own load, and one was observed at 119.5 s under heavier
# load — against a default hard kill at 120 s, which would present as a mysterious
# hang rather than as a checker that was too slow. The bound is kept (a wedged test
# still dies) but set from what the work actually costs, with room for a CI runner
# with a quarter of the cores and for the further checked language arms to come.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(agent::tests::sandbox_tests::)'
slow-timeout = { period = "120s", terminate-after = 3 }

# The truncation test writes `MAX_FILES + 50` — 20,050 — files and walks the tree twice,
# because the only honest way to assert what a cap drops is to exceed the real cap. That
# cost is inherent and it is filesystem-bound, so it scales with what else the run is
# doing rather than with this test: 18.6 s alone on an idle 18-core dev container, 50.9 s
# beside the gg sandbox tests above, and past the 60 s default under those same tests once
# each of them started spawning a type checker. It was killed mid-assertion, which reads as
# a broken analysis rather than as a slow one. Bounded, but from the work rather than from
# the default.
[[profile.default.overrides]]
filter = 'package(test-cabinet-code-analysis) and test(=tests::a_truncated_analysis_is_deterministic_and_says_so)'
slow-timeout = { period = "120s", terminate-after = 3 }

# The Ruby arm's per-turn measurement, for the same reason as the runaway-program test above and
# with the same remedy: it asserts that Opal's runtime and gg's SDK come out of the component's
# pre-initialised snapshot, and the only way to observe that is a wall-clock reading of an
# instantiate-and-evaluate. That reading is of the *machine* as much as of the artifact — 9 ms on an
# idle dev container, 91 ms beside the rest of this package, against a 25 ms bound chosen to sit far
# below the 45-51 ms a per-turn rebuild costs. Under contention it failed while the property it
# checks was perfectly intact. Giving it every slot is what makes the reading a reading of the
# workload rather than of the load average.
#
# That was not enough on its own, and the paragraph above is left standing because the remedy is
# still right — but this override was the *whole* defence, and a `cargo nextest run --workspace` with
# retries removed measured the test failing anyway, at 28.7 ms against that 25 ms ceiling, in the
# very same run that proved the JVM and PureScript arms fixed. Taking every runner slot does not
# undo the state a machine is left in by the four thousand tests before it, and the absolute
# millisecond ceiling had drifted from generous to a factor of two as the container got slower: the
# turn it bounds reads 12.2-12.9 ms here against the 4.8-7.7 ms the bound was chosen against.
#
# So the assertion is now a RATIO — the same turn against plain JavaScript on the same component in
# the same process, measured at 1.02-1.04 in every condition it was taken in, against a regression
# that would put it near seven — and this override is the second line rather than the first. It
# stays because a minimum-of-five reading of two interleaved measurements is still better taken with
# the machine than beside it, and because it costs ~4 s of exclusive runner against a ~700 s run.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(=sandbox::language::ruby::substrate::the_baked_runtime_makes_a_turn_affordable_and_requiring_gg_is_what_it_costs)'
threads-required = "num-test-threads"

# The seam's OWN isolation gate, for the same reason and by the same arithmetic. It drives every
# registered language's program and module steps sixteen ways, so each compiled arm added to the
# registry costs it another 32 real compiles — PureScript's, since `purs` reads 9 MB of externs
# before it reads the program; Java's and now Kotlin's, whose builds go through pools of four warm
# JVMs because TeaVM is the toolchain that was measured silently producing no output for three of
# four concurrent builds. Measured on this repository's dev container: 19.5 s alone with five arms
# registered, 36.9 s with Java's, 64.7 s with Kotlin's, and 116.8 s beside the whole
# workspace before either JVM arm landed — against the default hard kill at 120 s, which it reached
# on one run and then passed on the retry with 3.2 s to spare. A gate that is a coin flip under CI
# load reads as a hang rather than as the thing it proves, and the property it proves does not weaken
# when the machine is busy. Bounded from the work rather than from the default — and the headroom,
# rather than the timeout, is now the thing to watch: each further compiled arm adds its own 32
# builds here, and the two JVM arms additionally contend for cores, since eight warm JVMs holding a
# compiler and TeaVM apiece is several gigabytes of a container that has to hold everything else too.
# Rust's 32 are the cheapest of the compiled arms per compile — `rustc` is a one-shot process with
# nothing warm to be, and the arm's own hand-pointed copy of this gate ran its 32 in ~1.5 s
# standalone before it was deleted in favour of this one. What that copy could not show is what the
# same 32 cost *here*, beside seven other arms' compiles competing for the same cores: measured at
# 108.3 s run as its own group and **152.8 s** under `cargo nextest run --workspace`, against the
# 180 s this override then carried. A
# gate 27 s from its own ceiling is the coin flip this override exists to prevent, so the ceiling
# moves to 300 s. The headroom, not the timeout, is still the thing to watch — and the arithmetic to
# watch it with is now measured rather than assumed: an eighth arm nearly trebled the figure a
# seventh left, because these compiles contend rather than queue.
#
# A ninth arm — Swift, whose 32 builds are the dearest here at ~0.3 s of `swiftc` apiece — measured
# at 86.1 s run on its own, against the eighth arm's 108.3 s for the same shape of run. That is not
# a saving from Swift; it is the spread these readings have, and it is why the ceiling is set from
# the worst of them rather than the latest. What the reading does say is that the arm this override
# was raised for did not need raising again.
#
# A **tenth** arm — C++ — was measured four times on this machine within the hour, and the four
# readings are why the ceiling moves rather than what it moves to:
#
#   nine arms, this test run alone                            96.1 s
#   ten arms,  this test run alone                           256.1 s
#   ten arms,  this test run alone (again)                   212.9 s
#   ten arms,  under `cargo nextest run --workspace`          92.0 s
#
# The last one is the surprising half and it is reported rather than discarded: this gate is *faster*
# inside a full workspace run than on an idle machine, twice, by more than a factor of two. Nothing
# here explains that, and the arm's own numbers say it should not have moved much at all — C++'s 32
# builds are the **cheapest** of any compiled arm's at ~85 ms of `clang++` apiece once the
# precompiled prelude is warm, and this arm's own hand-pointed copy of this gate ran its 16-way
# program half in 2.7 s standalone before it was deleted in favour of this one.
#
# So what these readings establish is not a cost for C++. It is that this gate's wall time is
# dominated by something other than the work it does — it spawns 340 compilers under deliberate
# 16-way concurrency and spends most of its wall clock waiting rather than computing (`user` time on
# the 212.9 s reading was 1m46) — and that a single reading of it, in either direction, is worth
# very little. The ceiling therefore comes from the **worst** of them with room over: 256 s against
# 300 s is the coin flip this override exists to prevent, and a CI runner with a quarter of the cores
# has no chance at all, so it moves to 600 s. An eleventh arm should take several readings rather
# than one, and should not assume this arm's cost was the reason for any of them.
#
# The **eleventh** arm — C# — took four, on the advice above, and they are the tightest four
# readings this gate has ever produced:
#
#   eleven arms, this test run alone                          92.5 s
#   eleven arms, this test run alone (again)                  92.5 s
#   eleven arms, this test run alone (a third time)           91.0 s
#   eleven arms, under `cargo nextest run --workspace`        102.6 s
#
# They say three things. The ceiling does not move: the worst of them is nearly 500 s short of it,
# which is the headroom the note above asks to be watched rather than the timeout. The spread that
# made the C++ readings unreadable is absent — 11.6 s across four runs against that arm's 164 s
# across four — and so is the direction that contradicted the rest, since this arm's workspace
# reading is the *slowest* rather than the fastest, which is what one would expect and what the C++
# readings did not do. And the arm itself cost almost nothing here, which is consistent with the
# reading that this gate is dominated by waiting rather than by work: its 32 builds are one `csc`
# apiece, a one-shot process with nothing warm to be and nothing to contend over.
#
# Two further readings were taken when this gate's **byte-equality check was deleted** (see
# `crates/gg/src/sandbox/language/isolation.rs`), which if anything should have made it cheaper: the
# gate no longer walks a 7 MB artifact's section framing 64 times for the Swift arm — 16 serial
# baselines and 16 concurrent, across both the program half and the module half, since the baseline
# results were projected too before they were compared — and no longer
# derives that arm's module stamp — two extra `swiftc` runs — inside its own process. What it
# measured instead, on the same machine within the hour, both run alone:
#
#   eleven arms, no byte comparison, run alone               150.2 s
#   eleven arms, no byte comparison, run alone (again)       221.8 s
#   eleven arms, no byte comparison, beside four arms' tests 391.1 s
#
# A 72 s spread between two consecutive readings of the same code with nothing changed between them,
# and both above the four tight readings the C# arm took. The third is the one to keep in view: run
# in a group with the Swift, C++, C# and isolation tests — 242 tests, most of them starting a real
# compiler — it took 391.1 s against a 600 s ceiling. That is the closest this gate has ever been
# measured to its own bound, it is the shape a full workspace run has, and it is the headroom this
# override exists to keep rather than the timeout. A twelfth arm should read this figure, not the
# 92.5 s one.
#
# One arm was still paying for this gate twice, and that is recorded here because it is the shape of
# oversight a thirteenth arm can repeat. Ruby kept a hand-pointed copy of this gate —
# `every_ruby_compile_stands_on_ground_no_other_agent_can_reach` — driving its own `program.rb` and
# `module.rb` through the same `breaches()` this one drives them through, since Ruby is in
# `all_languages()` and so both its halves are already in `preparations()`. The Rust, Swift and C++
# arms each deleted theirs at registration; Ruby's was left behind. It proved nothing this gate's run
# does not and it cost sixty-four more real `node` compiles to prove it: **6.3 s** run on its own and
# **117.5 s** under `cargo nextest run --workspace`, against the 60 s x 2 default it had no override
# for. It passed that run with 2.5 s to spare — the coin flip every other compiled arm here is
# bounded away from — and on a CI runner with a quarter of the cores it is a termination naming a
# hang. It is deleted rather than bounded, because a duplicate gate is not made correct by being
# given longer to run.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(=sandbox::language::isolation::tests::every_registered_language_prepares_only_its_own_program_under_concurrency)'
slow-timeout = { period = "600s", terminate-after = 3 }

# The seam's two other per-language sweeps, which the eighth arm pushed past the default's *warning*
# line and within sight of its kill. Neither drives sixteen-way concurrency; each simply prepares one
# program per registered language, and an eighth compiled arm is an eighth compiler to start.
# Measured under `cargo nextest run --workspace`: the workspace gate at 61.6 s and the compile-cost
# gate at 64.6 s, against a default that warns at 60 s and kills at 120 s. Both passed and both are
# now one bad-tempered CI runner away from being terminated for doing exactly what they say, so both
# are bounded from the work in the same way every other sweep here is.
#
# The documentation-view sweep is the third of them and was left out of that reading rather than
# found to be under the line: measured since, over two full runs, at 47.7 s and 77.8 s, and the
# compile-cost gate it sits beside at 53.0 s and 85.0 s. Two readings that far apart on one machine
# are the whole argument — what the number is depends on what else the scheduler is holding, so the
# bound has to come from the work rather than from the best reading of it.
#
# The SESSION sweep is the fourth, and it was missed for the reason a fourth of anything gets missed:
# it is the documentation-view sweep's twin — one program per registered language, through the same
# `prepare_program` — and only one of the twins was named. Measured over two full
# `cargo nextest run --workspace` runs at 49.0 s and 73.3 s, which is the same spread its twin has
# and on the wrong side of the warning line in the second. Named now, so the pair is bounded
# together and a fifth sweep has a list to be added to rather than a precedent to rediscover.
#
# The AUTHORSHIP gate is that fifth, and it is the heaviest of them: it drives every registered arm's
# module step and its program step twice, through that arm's real preparation and its real compiler,
# so it is three preparations per arm where the four above are one. Measured under
# `cargo nextest run --workspace` at 37.1 s on an 18-core dev container and reported at 60.6 s on a
# busier one — where the attempt before it was terminated against the 60 s x 2 default it had no
# override for, and the run recorded a flaky result, which this repo counts as a failure. That is the
# coin flip every sweep in this list is bounded away from, so it joins them.
#
# The REUSE gate is the sixth, and it is the heaviest of them for the same arithmetic that made the
# authorship gate the fifth: it loads a code module into one agent and then prepares three programs
# in that agent's workspace, so it is four preparations per arm against the authorship gate's three
# and the four sweeps' one. Three programs rather than one is what the property needs — a single
# program after the load reads the same whether the module was rebuilt or the read was skipped — so
# the cost is inherent rather than wasteful, and there is nothing to trim that does not also weaken
# what the gate asserts. Measured on this dev container:
#
#   run on its own                                            12.6 s
#   beside six arms' substrate and surface tests              39.5 s
#   under `cargo nextest run --workspace`                     62.0 s
#   under `cargo nextest run --workspace` (again)             24.4 s
#
# The first workspace reading is over the default's 60 s warning line and inside a factor of two of
# the 120 s kill it would otherwise have had no override for. The second is the argument rather than
# a reprieve: two runs of the same code on the same machine, a factor of two and a half apart, so
# what this gate costs on any one run is a reading of what else the scheduler is holding. Bounded
# from the worst of them with room over, rather than left as the one sweep in this list without a
# ceiling.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and (test(=sandbox::language::isolation::tests::a_workspace_belongs_to_one_agent_and_to_all_of_its_preparations) or test(=sandbox::language::reuse_tests::every_registered_language_compiles_a_loaded_module_once_for_the_agent) or test(=sandbox::tests::compile_tests::every_language_reports_what_compiling_its_program_cost) or test(=sandbox::language::tests::every_language_writes_the_program_that_opens_a_documentation_view) or test(=sandbox::language::tests::every_language_writes_the_program_that_opens_the_session) or test(=sandbox::language::authorship::tests::every_registered_arm_compiles_the_bytes_it_was_handed_or_records_what_it_does_instead))'
slow-timeout = { period = "180s", terminate-after = 3 }

# The Java arm's warm-JVM measurement, for the same reason as the Ruby arm's per-turn reading above
# and with the same remedy: it asserts that a second build through the pool is meaningfully cheaper
# than the first, and the only way to observe that is a wall-clock reading of two real builds. Under
# contention the cold build and the warm ones inflate differently, so giving it every slot is what
# makes the reading a reading of the pool rather than of the load average. It is shaped like the
# Kotlin arm's copy below, whose note carries the argument for taking the cold reading beside the
# warm ones rather than a load average earlier.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(=sandbox::language::java::substrate::a_pooled_jvm_is_reused_and_the_first_one_is_the_expensive_one)'
threads-required = "num-test-threads"

# The Kotlin arm's warm-JVM measurement, for the same reason as the Java arm's directly above and
# with the same remedy — and it is here because that reason was proved on this arm rather than
# assumed. The test used to assert an ABSOLUTE bound, that each of three warm builds took under
# sixty seconds, which is a claim about the machine and not about the pool. It failed on its first
# attempt at 144.8 s under `cargo nextest run --workspace` and at 134.6 s beside six arms' substrate
# and surface tests — both against the 360 s the override below grants it, so neither was a
# termination and neither would have been helped by moving that ceiling. It was this assertion, and
# the retry that then passed at 60.3 s was 0.3 s from failing too.
#
# The assertion became the ratio the test's name claims — a cold build against the cheapest of three
# warm ones — on the reasoning that a cold build and a warm one inflate together. They do, but only
# while they are readings of the SAME machine, and taken tens of seconds apart they are not: on a
# thermally throttled laptop under a full workspace run the cold half read 4.7 s against warm builds
# of 9.63 s, 8.29 s and 6.25 s. That is an inversion, so no ratio and no tolerance would have saved
# it. The test now takes its cold reading in the middle, by evicting the pool's JVM after the warm
# builds and paying for a new one there, with a further warm build after it — and asserts the reuse
# itself off the pool's live count, which is not a clock at all. This override still applies, because
# a ratio of two adjacent readings is cheaper to keep honest with the runner to itself: measured
# cold-against-warm at 6.06 s / 1.52 s alone, 21.3 s / 4.67 s beside those six arms, and
# 72.9 s / 11.6 s on a busier reading of that same group. The spread of a single reading here is the
# whole argument for taking the runner.
#
# What it costs is head-of-line blocking, and that is reported rather than waved past: nextest cannot
# start a test wanting every slot until every other test has finished, so a full run drains to one
# process before this one goes. That was watched happening for the Java test above during a workspace
# run. This arm's reading takes ~10 s of the runner on an idle container against a ~790 s run.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(=sandbox::language::kotlin::substrate::a_pooled_jvm_is_reused_and_the_first_one_is_the_expensive_one)'
threads-required = "num-test-threads"

# The Kotlin arm's compile-driving tests, which are the dearest per-test work in this workspace and
# the only ones measured reaching the default hard kill. Every one of them is its own process under
# nextest, and the first thing each does is compile a 20 MB component and start a JVM that loads the
# Kotlin compiler AND TeaVM — so the cost is paid per test rather than amortised, and it is this
# arm's own: the same tests on the other JVM arm cost a third as much, because javac is not the
# Kotlin compiler. Measured on this repository's dev container: 54.1 s for the whole arm's 63 tests
# run as their own group, with the heaviest single test at 54.0 s — and under
# `cargo nextest run --workspace`, `a_real_kotlin_program_runs_through_the_real_membrane` was
# terminated at 120.3 s by the 60 s × 2 default and then passed at 60.1 s on the retry. That is the
# coin flip the PureScript and seam gates above are bounded away from: a retry that lands is a green
# run that cost two minutes of wall clock to a test doing exactly what it says, and three that do not
# are a red run naming the wrong thing. Bounded from the work rather than from the default, with room
# for a CI runner with a quarter of the cores.
#
# The ceiling stays where it is, and the paragraph above is left standing because the reading in it
# was real — but what came AFTER it says the ceiling was never the thing this arm was crossing, and
# that correction belongs here rather than in a commit message. Five of this arm's tests were
# reported flaky by a full workspace run. Every first-attempt failure was measured well under this
# 360 s bound — 144.8 s for the pooled-JVM reading, and this group's dearest test at 200.5 s while
# passing — so not one of them was a termination, and not one of them would have been helped by
# raising this number again.
#
# What they were is two defects with names. The pooled-JVM reading asserted an absolute wall clock;
# see the override above it. The other four went through this file's own `evaluate_as`, which built
# the store — and therefore armed the guest's 30 s execution deadline, which is WALL clock — and only
# then compiled the 13.4 MB shared ECMAScript guest inside the call that used it. That compile is 1.5 s
# alone and was measured at 12.1 s and 21.8 s beside six arms' substrate and surface tests, all of it
# charged to a program that had not started; a guest that ran for 228 µs came back as
# `Timeout { limit: 30s }`, and on the other JVM arm the panic said so in as many words. Production
# resolves the component before it builds the store and never had it. Both are fixed in the tests,
# which is why this ceiling is not moving: the headroom the note above asks to be watched is real,
# but the coin flip it was written for was not this one.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(/^sandbox::language::kotlin::(substrate|surface)::/)'
slow-timeout = { period = "120s", terminate-after = 3 }

# The other compiled arms' compile-driving tests, bounded exactly as the Kotlin arm's are above and
# for the same reason. That override was written when Kotlin was the only arm measured reaching the
# default hard kill; an eighth arm's compiles now contend with them all, and a full run of this
# workspace puts fourteen tests past the default's 60 s warning line with the heaviest at 114.5 s.
# Grouped by arm rather than named one by one, because what is slow here is not a particular
# assertion but the shape of the file: each test is its own process, and the first thing it does is
# start a real compiler.
#
# Measured over two full `cargo nextest run --workspace` runs on this dev container — one of them
# alongside a `cargo doc`, which is what a busy CI runner looks like. Worst reading per group, and
# how many of that group's tests crossed 60 s in the quieter of the two:
#
#   purescript::substrate      114.5 s   5 over the line
#   purescript::compile::tests 108.4 s   3
#   java::surface               79.9 s   2
#   ruby::substrate             78.8 s   1
#   java::substrate             73.5 s   2
#
# 180 s rather than Kotlin's 120 s for the two PureScript groups, because `purs` type-checks against
# a 1.2 MB library set on every one of them and they are the two slowest groups in the workspace;
# 120 s for the rest, which is where the JVM arms already sit. Every one of these passed at every
# reading — this bounds them away from a termination that would name the wrong thing, and it is not
# licence for one to get slower. Each further arm registered pushes on all of them at once, so the
# headroom rather than the timeout is the thing to watch.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(/^sandbox::language::purescript::(substrate|compile::tests)::/)'
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and (test(/^sandbox::language::java::(substrate|surface)::/) or test(/^sandbox::language::ruby::substrate::/))'
slow-timeout = { period = "120s", terminate-after = 3 }

# The Ruby arm's compile-driving tests, bounded exactly as the other compiled arms' are above and for
# the same reason: each is its own process, and every program in them is a real `node` running the
# embedded 2.9 MB Opal bundle at ~176-190 ms a compile.
#
# The group used to be dominated by this arm's own copy of the seam's isolation gate — sixty-four of
# those compiles, 117.5 s under `cargo nextest run --workspace` against the 60 s x 2 default it had
# no override for — and that test is gone rather than bounded, for the reason recorded above the
# seam's own override. What is left is bounded here all the same, and the two readings that say why
# are worth writing down because they are of the same seven tests on the same machine within the
# hour, under two full workspace runs:
#
#   worst test in the group, run one          7.6 s
#   worst test in the group, run two         41.5 s
#
# A factor of five and a half between two runs of tests that spawn nothing but `node`. Nothing in the
# group changed between them; what changed is what else the scheduler was holding. 41.5 s against a
# 60 s warning line is not the coin flip the deleted gate was, but it is the same shape of one, and
# the honest bound comes from the spread rather than from either reading of it. Three minutes, which
# is where the other compiled arms already sit.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(/^sandbox::language::ruby::compile::tests::/)'
slow-timeout = { period = "180s", terminate-after = 3 }

# The Swift arm's compile-driving tests, bounded exactly as the other compiled arms' are above and
# for the same reason: each is its own process, and the first thing it does is start a real
# compiler. This arm is dearer per program than any other — ~0.3 s for `swiftc` and then **~1.3 s**
# for `Component::new`, because it is the only arm whose artifact is a 7 MB statically linked Swift
# standard library the engine has to compile on every turn.
#
# Its own hand-pointed copy of the isolation gate is gone, deleted at registration in favour of the
# seam's exactly as the Rust arm's was — so the thirty-two builds it used to pay for here are paid
# in the sweep above instead, which is where the ceiling for them now has to be. Nothing about
# isolation is left in this group at all now: the derivation that stood here afterwards — the
# projection the seam's gate used to compare two artifacts through, which compiled one program four
# times to locate `swiftc`'s random module stamp — went with the byte-equality check that was its
# only consumer. Why that check was deleted is recorded in
# `crates/gg/src/sandbox/language/isolation.rs`, and the four compiles per process went with it.
#
# Measured on this repository's dev container after that deletion, run on its own: 16.7 s for the
# whole of this arm's seventy-four tests, the dearest of them at 16.6 s. The figures this comment
# carried before it were 32.6 s over seventy-two tests with the dearest at 32.5 s — but that was a
# different reading on a differently loaded machine, and this group's readings spread as widely as
# every other one here does (74 s for nine substrate tests alone, with the rest of the package
# running), so the honest claim is that the group got no dearer rather than that it halved.
#
# The bound stays at three minutes, which is far more headroom than any of those readings needs and
# is deliberately the same number the other compiled arms carry. What it is sized for is a CI runner
# with a quarter of the cores starting a real `swiftc` while every other arm's compiler contends for
# the same machine — bounded from the work rather than from the default, exactly as its neighbours
# are.
#
# The `surface` half is in the same group because it costs the same thing for the same reason: every
# one of its programs is a real `swiftc` and a real `Component::new`, and the one that imports the
# whole curated library set links the largest artifact this arm produces.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(/^sandbox::language::swift::(substrate|surface)::/)'
slow-timeout = { period = "180s", terminate-after = 3 }

# The C++ arm's compile-driving tests, bounded exactly as the other compiled arms' are above and for
# the same reason: each is its own process, and the first thing it does is start a real compiler.
#
# This arm is the CHEAPEST of the three compiled ones per program — ~85 ms for `clang++` and ~19 ms
# for `Component::new` on a small artifact, against `swiftc`'s ~0.3 s and 1.3 s — and it is bounded
# here all the same, because the first compile in each process additionally builds the ~26 MB
# precompiled prelude the rest of them read.
#
# Measured on this repository's dev container, this group run on its own: 6.8 s for all thirty-four
# tests with the arm's own copy of the isolation gate at 2.2 s and the largest program at 1.5 s.
# That copy is gone as of registration, deleted in favour of the seam's exactly as the Rust and Swift
# arms' were — so its sixteen concurrent compiles are paid in the sweep above instead, which is where
# the ceiling for them now has to be. What is left in this group is the arm's own claim that two
# preparations of one C++ program produce byte-identical components — worth keeping as a statement
# about `clang++`, but no longer something the seam's gate rests on: that gate searches an artifact
# for markers and never compares two artifacts. See `isolation.rs` for why the comparison went.
#
# Three minutes is far more headroom than the rest of it needs and is deliberately the same number
# the other compiled arms carry: what it is sized for is a CI runner with a quarter of the cores
# compiling a template-heavy program, not the figures above.
#
# The `surface` half is in the same group because it costs the same thing for the same reason: every
# one of its programs is a real `clang++` and a real `Component::new`, and the one that calls all
# thirty-five tools in a row links the largest artifact this arm produces.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(/^sandbox::language::cpp::(substrate|surface)::/)'
slow-timeout = { period = "180s", terminate-after = 3 }

# The C# arm's compile-driving tests. Its compiler is the second cheapest of the compiled arms
# per program — `csc` is ~0.27-0.37 s warm, behind `clang++`'s ~85 ms and ahead of everything
# else — but this arm pays for its guest where the three arms that emit wasm do not, and
# every test in this group is its own process under nextest, and the first thing each does is
# compile the **34.9 MB** committed guest, which is the largest artifact any arm here
# instantiates. Measured on this repository's dev container, this group run on its own: 2.5 s
# for all eight tests, the dearest at 2.46 s — nearly all of which is that one compile, paid
# once per process.
#
# Bounded from the work rather than from the default, at the same three minutes the other
# compiled arms carry, and for the same thing: a CI runner with a quarter of the cores
# compiling that component while seven other arms' compilers contend for the same machine.
#
# The `surface` and `modules` halves are in the same group because they cost the same thing for
# the same reason: every one of their programs is a real `csc` and a real instantiation of that
# same 34.9 MB component, and the modules group compiles two code modules beside each program.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(/^sandbox::language::csharp::(substrate|surface|modules)::/)'
slow-timeout = { period = "180s", terminate-after = 3 }

# The Python arm's substrate tests, which are neither compile-driven nor cheap: every one of them
# instantiates the 25 MB embedded guest, and each is its own process under nextest, so that cost is
# paid per test rather than amortised. Measured under `cargo nextest run --workspace`: 28.5 s for the
# dearest of them, against a default that warns at 60 s and kills at 120 s.
#
# The bound is here rather than left to the default because of what one of these tests deliberately
# does, which is sleep. `the_interpreters_own_landmines_are_defused` pins the acceptance in
# `crates/gg/src/sandbox/limits.rs` — that the deadline cannot fire inside a WASI park, so a program
# parked in one long hop runs the whole hop — and the only way to observe that is to run a park out.
# It was measured FAILING in that same run at 1.054 s against a `>= 2 s` assertion, because the
# budget it armed was spent instantiating the guest before the program reached its sleep at all: the
# reading was of the machine rather than of a park. It now waits for the program's own witness that
# it reached the park and doubles its budget when it did not, which on a wedged container can cost
# four attempts and 45 s of sleeping on top of the group's own 28.5 s. Bounded from that rather than
# from the default, at the same three minutes this file's other language groups carry.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and test(/^sandbox::language::python::substrate_tests::/)'
slow-timeout = { period = "180s", terminate-after = 3 }
