[profile.default]
retries = 2
flaky-result = "fail"
fail-fast = false

# Hard cap on any single test's execution. nextest marks a test "slow" after
# `period` and then forcibly terminates it after `terminate-after` such periods,
# so no test — or hung child process it spawned — can run longer than
# period × terminate-after (120s here). This bounds a wedged test instead of
# letting it hang the whole run until the CI job's own timeout fires.
slow-timeout = { period = "60s", terminate-after = 2 }

# gg tests that each compile many programs through a real toolchain: the per-language sweeps
# (every arm in series in one process), the Kotlin and Swift arms (a JVM running kotlinc + TeaVM,
# or a 7 MB Swift artifact Cranelift compiles per program), and the Ruby crossing test (one
# node + Opal compile per bound operation). Alone each takes 10-60 s; a full
# `cargo nextest run --workspace` on a 20-core dev container (2026-09-23) put 22 of them between
# 60 and 165 s, because every process compiles at once and contends for the cores.
[[profile.default.overrides]]
filter = 'package(test-cabinet-gg) and (test(/^sandbox::language::(kotlin|swift)::(substrate|surface)::/) or test(=sandbox::language::reuse_tests::every_registered_language_compiles_a_loaded_module_once_for_the_agent) or test(=sandbox::tests::compile_tests::every_language_reports_what_compiling_its_program_cost) or test(=sandbox::language::tests::every_language_writes_the_program_that_opens_a_documentation_view) or test(=sandbox::language::tests::every_language_writes_the_program_that_opens_the_session) or test(=sandbox::language::tests::every_language_prepares_an_opening_program_that_opens_nothing) or test(=sandbox::language::authorship::tests::every_registered_arm_compiles_the_bytes_it_was_handed_or_records_what_it_does_instead) or test(=sandbox::language::agreement::tests::every_registered_language_binds_exactly_the_operations_gg_offers) or test(=sandbox::language::ruby::substrate::every_operation_crosses_the_membrane_from_its_ruby_spelling) or test(=sandbox::language::isolation::tests::gate::kotlin))'
slow-timeout = { period = "120s", terminate-after = 3 }
