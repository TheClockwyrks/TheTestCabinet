# Google Antigravity harness definition. See `harnesses/README.md`.
#
# Antigravity authenticates only through a Google account, so it has no API-key
# mode and runs under subscription authentication alone: the adapter declares no
# api_key_env and instead reads the OAuth token the `agy` CLI writes when the user
# signs in, copying it into the run container. It is unavailable until that token
# exists, and reports no token usage in its non-interactive mode.

slug = "antigravity"
name = "Google Antigravity"
binary = "agy"

# A curl-piped installer; its install location and headless behavior are among
# the least predictable of the supported harnesses (confirm on a Docker host).
install = "curl -fsSL https://antigravity.google/cli/install.sh | bash"
