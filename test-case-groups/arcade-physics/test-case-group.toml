# The "Arcade & Physics" test-case group.
#
# A test-case group is a global, ordered set of related test-case (or game-jam)
# slugs; the home page renders one cross-case leaderboard per group. Groups are
# read from this directory at run time and ingested into the backend's
# definition store on a catalog scan. See `test-case-groups/README.md` and the
# design doc at `apps/docs/src/content/docs/components/core/test-case-groups.md`.

# Stable slug. Must match the folder name.
slug = "arcade-physics"

# Human-readable name, heading this group's home-page leaderboard.
name = "Arcade & Physics"

# Optional one-line description, shown beside the name.
summary = "Fast arcade loops built on hand-rolled physics: bounces, mazes, and particles."

# Optional ordering key: groups sort by rank ascending, then by name, and
# ranked groups precede unranked ones.
rank = 2

# The ordered member cases, by each case's manifest-declared slug (a test-case
# or game-jam identity, not a folder name). Non-empty, no duplicates, and every
# slug must resolve in the catalog — checked by the repo's manifest test and
# again at ingest. Note `pong` here: the Carom case lives in the renamed
# `carom/` folder, but its identity — the slug its runs record — is `pong`.
cases = ["pong", "fathom", "spectra"]
