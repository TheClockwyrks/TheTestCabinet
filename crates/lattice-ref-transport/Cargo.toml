[package]
name = "lattice-ref-transport"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The `transport` reference engine — the efficient baseline, and the worked
# example of "why this is a performance case" (architecture.md). It produces the
# oracle's exact per-snapshot checksums for a tiny fraction of the naive engine's
# fuel, by refusing to re-walk steady state.
#
# A Lattice scenario is driven entirely by periodic sources, so after a finite
# warm-up the whole factory settles into a *cycle*: the belts, splitters,
# inserters, and assemblers return to an identical configuration every P ticks and
# the sinks gain a fixed amount per cycle. Once the engine detects that cycle it
# stops simulating tick by tick and fast-forwards across whole cycles in constant
# time — incrementing the sink totals by the per-cycle delta and only simulating
# the short remainder up to each snapshot. This is the same idea as Factorio's
# transport-line optimization (FFF #176): a compressed, unchanging interior is not
# re-touched; only the ends, and only when they change, do work.
#
# Built as a `cdylib` to `wasm32-unknown-unknown` over `lattice-sdk`, it loads in
# the same sandbox a submission does. It is the committed efficient baseline the
# validator's self-test scores, and a worked example seeded into the model's
# workspace.
[lib]
name = "lattice_ref_transport"
crate-type = ["cdylib"]

[dependencies]
# The authoritative rules, the live world, and the canonical state/checksum. The
# transport engine drives `lattice_core`'s exact `World::advance` for the warm-up
# and the per-snapshot remainders — so its rules can never drift from the oracle —
# and layers cycle detection + fast-forward on top. `default-features = false`
# drops schemars, which a guest never needs.
lattice-core = { path = "../lattice-core", default-features = false }
# The guest-side ABI glue and the re-exported contract types.
lattice-sdk = { path = "../lattice-sdk" }

[dev-dependencies]
# The native cross-check test compares the transport engine's snapshots to the
# oracle's on a spread of scenarios; it needs the oracle and the contract types.
lattice-core = { path = "../lattice-core" }
