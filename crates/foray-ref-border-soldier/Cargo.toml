[package]
name = "foray-ref-border-soldier"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The `border-soldier` reference controller — a token balance and the STRONGEST
# baseline (references.md). It STATICALLY assigns a fixed agent to patrol the
# border and chase the nearest visible intruder, and sends the rest in as
# greedy-raider-style foragers. Its role assignment NEVER adapts: it does not
# reinforce a collapsing defence, recall a raider to bank before it is caught,
# reason about jelly, or weigh load against the distance home. Built as a `cdylib`
# to `wasm32-unknown-unknown` as the toughest of the seeded baselines.
[lib]
name = "foray_ref_border_soldier"
crate-type = ["cdylib"]

[dependencies]
foray-core = { path = "../foray-core", default-features = false }
foray-controller-sdk = { path = "../foray-controller-sdk" }
