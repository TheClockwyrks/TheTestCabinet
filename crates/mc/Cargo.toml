[package]
name = "test-cabinet-mc"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The `mc` binary and its library: the **marching-cubes** meshing tool for static 3D
# asset-generation cases. It is a thin CLI over `test-cabinet-voxel-mesh` (the signed-
# distance `Field`, the shared CSG `FieldOp` vocabulary, and the `MarchingCubesMesher`)
# and `test-cabinet-model-core` (the record/preview plumbing and the wgpu+Mesa mesh
# renderer): each recorded operation composites a primitive into the field, then the
# marching-cubes mesher re-extracts the surface to a `.glb` and the renderer draws
# the preview PNG. Marching cubes samples the field on a coarse grid, giving a chunky,
# faceted **low-poly** surface. The rigged, animated sibling binary is `mc-anim`.
[lib]
name = "test_cabinet_mc"
path = "src/lib.rs"

# The `mc` CLI the model invokes inside the run container to build a single static
# field-meshed model. Gated behind the `cli` feature (on by default) so a
# `default-features = false` library consumer links only the pure re-exports and never
# pulls in clap or the renderer stack.
[[bin]]
name = "mc"
path = "src/bin/mc.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "test-cabinet-voxel-mesh/cli", "test-cabinet-model-core/cli"]

[dependencies]
# The signed-distance meshing domain (field, ops, meshers, grid presets, `.glb` emission).
# Linked without default features so a `default-features = false` consumer of this
# crate never pulls in the wgpu preview renderer; the `cli` feature re-enables it.
test-cabinet-voxel-mesh = { path = "../voxel-mesh", default-features = false }
# The generic voxel-family core: the record/preview plumbing, config shapes, the rig
# model, and the shared mesh renderer this crate's CLI builds on.
test-cabinet-model-core = { path = "../model-core", default-features = false }
clap = { workspace = true, optional = true }

[lints]
workspace = true
