[package]
name = "test-cabinet-voxel"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The cube voxel domain for 3D asset-generation test cases: the dense voxel volume
# (`VoxelSet`/`Dims`), the sculpting `Operation`s and their log-replay `render`, the
# sparse `voxels.json` serializer, and the cube surface mesher (`voxels` ->
# face-culled `PartMesh`). Previews are drawn by the shared wgpu+Mesa mesh renderer
# in `test-cabinet-model-core`, which also owns the generic pieces — the
# rig/animation model, color, config, and the record/preview plumbing — that this
# crate depends on and re-exports. The `voxel` binary uses the library in the run
# container to turn the model's operations into a volume, a preview, and a
# per-part `.glb`; `crates/core` links the same library to replay the recorded log.
# `crates/voxel-anim` is the rigged, animated sibling binary over this same library.
[lib]
name = "test_cabinet_voxel"
path = "src/lib.rs"

# The `voxel` CLI the model invokes inside the run container to sculpt a single
# static model. Gated behind the `cli` feature (on by default) so that
# `crates/core`, which depends on this crate with `default-features = false`, links
# only the pure library and never pulls in clap or serde_json.
[[bin]]
name = "voxel"
path = "src/bin/voxel.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde_json", "test-cabinet-model-core/cli"]

[dependencies]
serde = { workspace = true }
# The generic voxel-family core: rig/animation model, color, principal axis, config
# shapes, and the record/preview/live-preview plumbing this crate's CLI builds on.
# Linked without default features so a `default-features = false` consumer of this
# crate (core) never pulls in the CLI plumbing (or the wgpu preview renderer the
# `cli` feature enables); the `cli` feature re-enables it.
test-cabinet-model-core = { path = "../model-core", default-features = false }
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
