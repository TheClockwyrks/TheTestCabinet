[package]
name = "tcab-publisher"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-publisher"
path = "src/main.rs"

[lib]
name = "tcab_publisher"
path = "src/lib.rs"

[dependencies]
# The run record, the run-tree layout and the publish-job wire types.
test-cabinet-contracts = { path = "../../contracts/crates/contracts" }
# The collected implementation a release stages (`execution::ArtifactCollection`).
test-cabinet-suites = { path = "../../contracts/crates/suites" }
# Secret scrubbing of the staged tree and the built output before egress.
test-cabinet-redact = { path = "../../contracts/crates/redact" }
# The backend's HTTP client, from contracts.
test-cabinet-backend-client = { path = "../../contracts/crates/backend-client" }
# The publisher is a binary: it owns telemetry init, so it pulls the heavy `otlp`
# feature (the propagation-only default is for libraries), exactly as
# the driver's main does.
test-cabinet-telemetry = { path = "../../contracts/crates/telemetry", features = ["otlp"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The HTTP client the publisher downloads the run tree with and streams
# progress/result back to the backend with. rustls (no system OpenSSL), `json`
# for the bodies.
reqwest = { workspace = true }
# The `CommandRunner` seam the release drives `gh`/`git`/`wrangler` through.
async-trait = { workspace = true }
# Untar the `application/x-tar` source tree the artifact service serves (pure
# Rust, matching the driver's upload side which tars the same layout).
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
axum = { workspace = true }

[lints]
workspace = true
