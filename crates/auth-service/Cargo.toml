[package]
name = "test-cabinet-auth-service"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-auth-service"
path = "src/main.rs"

[lib]
name = "test_cabinet_auth_service"
path = "src/lib.rs"

[dependencies]
# The shared account contract (Account/RegisterRequest/LoginRequest/AuthnResponse)
# lives in core, the data-contracts crate, so the service serializes exactly what
# every client deserializes. The auth service does not depend on the rest of core
# at runtime — only these wire types.
test-cabinet-core = { path = "../core" }
# Passwordless (Microsoft Entra managed-identity) auth for the managed-PostgreSQL
# deployment — mints a token as the Postgres password and rotates the pool.
# Engaged only when `TCAB_AUTH_DB_AZURE_AD` is truthy; the default password /
# SQLite path never touches it.
test-cabinet-db-auth = { path = "../db-auth" }
test-cabinet-telemetry = { path = "../telemetry", features = ["otlp"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
dotenvy = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
http = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
# Named directly (not used in code) so its `bundled` feature unifies onto the
# SQLite driver SeaORM pulls transitively, vendoring SQLite's C source — the same
# static-linking stance the backend takes.
libsqlite3-sys = { workspace = true }

# Password hashing (Argon2id) and the OS RNG used for both the per-password salt
# and the opaque bearer tokens; `sha2`/`hex` hash the tokens at rest.
argon2 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# `util` brings `ServiceExt::oneshot` so the router can be exercised end-to-end
# in tests without binding a socket.
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }

[lints]
workspace = true
