[package]
name = "test-cabinet-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "test_cabinet_core"
path = "src/lib.rs"

[dependencies]
# The shapes: the contract modules this crate re-exports at their old paths
# (`gg`, `metrics`, `toolchain`, `code_analysis`, `review`, ...) and the contract
# halves of the ones it splits (`run_record`, `event`, `validation`, `test_case`,
# `test_suite`, `engine`, `orchestrator`, `execution`, the ingest feed and the
# layout constants).
test-cabinet-contracts = { path = "../../contracts/crates/contracts" }
# The test-suite runtime and the manifest loaders: the `test_case`,
# `test_case_group` and `test_suite` catalogs, the resolver, `prompt`, the validator
# runners and the browser plumbing they use, the engine catalog and the content
# digests. Re-exported at the old paths (`test_case`, `test_case_group`,
# `test_suite`, `resolver`, `prompt`, `engine`, `browser`, `vitest_validator`,
# `content_digest`, `content_labels`, and the halves of `execution`, `validator` and
# `seeding` that moved).
test-cabinet-suites = { path = "../../contracts/crates/suites" }
# The backend's HTTP client, re-exported as `backend_client` at its old path beside
# the run engine's extensions of it (`materialize_version` and the renderer of the
# backend's rendered references).
test-cabinet-backend-client = { path = "../../contracts/crates/backend-client" }
# Secret scrubbing, re-exported as `redact` at its old path.
test-cabinet-redact = { path = "../../contracts/crates/redact" }
# The built-in engine catalog (`built_in_catalog`), re-exported as `engine::built_in_catalog`.
test-cabinet-engines = { path = "../engines" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
cuid2 = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
# Semantic-version ordering for the engine version ranges a test case declares
# (`[[engine]]`) and the run gate enforces (`resolve_engine`).
semver = { workspace = true }
tempfile = { workspace = true }
# Gzip framing for the run-tree analysis artifacts core assembles on the host
# (`gg_session_assembly` writes `replay.json.gz`); the same workspace codec the
# backend store's reader and the archive service use, so one encoder decides the
# framing for the whole path.
flate2 = { workspace = true }
png = { workspace = true }
which = { workspace = true }
base64 = { workspace = true }
# The audio stage's pack digests (`audio_stage`).
sha2 = { workspace = true }
hex = { workspace = true }
# The audio staging contract: the staged-audio root, its `packs.json` shape, and the
# rule that selects one pack out of a run's palette. Core writes that tree and the
# in-container audio binaries read it, so both link the one definition and cannot
# disagree about what a run was staged with. Linked without the `cli` feature (no
# clap/serde_json/toml of its own) — core needs the contract, not the loader.
test-cabinet-audio-core = { path = "../audio-core", default-features = false }
# The drawing tool for asset-generation cases. Core links only the library (not
# the `cli` feature's clap/serde_json) to regenerate the scored image from a run's
# recorded action log through the exact same logic the in-container binary used.
test-cabinet-draw = { path = "../draw", default-features = false }
# The voxel-sculpting tool for the two 3D asset-generation kinds (voxel-model /
# voxel-animation). As with `test-cabinet-draw`, core links only the library (not
# the `cli` feature's clap/serde_json) so it regenerates the scored voxel data and
# isometric preview from a run's recorded operation log through the exact same
# logic the in-container `voxel` / `voxel-anim` binaries used. The cube domain
# (`VoxelSet`, `Operation`, `render`, the rasterizer) lives here; the generic model
# types (rig, color) live in `test-cabinet-model-core`, which the voxel crate
# re-exports and core also links directly.
test-cabinet-voxel = { path = "../voxel", default-features = false }
# The signed-distance meshing domain for the six surface-meshed kinds
# (mc/sn/dc + `-anim`). Core links only the pure library (not the `cli` feature's
# serde_json/renderer) to deserialize and well-formedness-check the `Mesh`
# (`PartMesh`) each meshing binary emits to a per-part `.glb`; it never re-meshes.
test-cabinet-voxel-mesh = { path = "../voxel-mesh", default-features = false }
# The generic voxel-family model core: the rig/animation model and the opaque-RGB
# color type core reads the produced `rig.json` and `[voxel] background` through.
# Linked without the `cli` feature (no clap/serde_json), the same as the voxel dep.
test-cabinet-model-core = { path = "../model-core", default-features = false }
# The match runner over the Foray and Lattice wasm hosts. The `AdversarialValidator`
# plays a submission against the committed baselines through `play_match`, and the
# `PerformanceValidator` runs a submission engine over each held-out case through
# `performance::run_case`, so the validators, the arena and the `foray`/`lattice`
# CLIs play through one runner over one host implementation. The wasmtime
# dependency lives entirely in the hosts.
test-cabinet-match-play = { path = "../match-play" }
# The Foray rules and replay types the adversarial validator records a match from,
# and the Lattice snapshot type the performance validator writes a case's produced
# state in.
foray-core = { path = "../foray-core" }
lattice-core = { path = "../lattice-core", default-features = false }
tracing = { workspace = true }
# Propagation only — the library never pulls in the OTLP exporters/SDK (those
# live behind the `otlp` feature the binaries enable). This keeps `crates/core`
# exporter-free; it only injects/extracts trace context through the process
# global propagator a binary may have installed.
test-cabinet-telemetry = { path = "../../contracts/crates/telemetry", default-features = false }


[dev-dependencies]
tempfile = { workspace = true }
# `test_browser`, what a test driving a real browser needs (`crate::test_browser`).
test-cabinet-suites = { path = "../../contracts/crates/suites", features = ["test-support"] }
# The same audio contract crate the library links, with its `cli` feature: the audio
# staging test reads the tree core wrote back through the exact reader the
# in-container binaries use (`StagedPacks::load` and `sample::load_pack`), so what the
# writer emits and what the reader accepts are held together by a test rather than by
# two matching sets of constants.
test-cabinet-audio-core = { path = "../audio-core" }
# `test-util` enables paused/auto-advancing time so the runtime cap can be tested
# without waiting out a real wall-clock timeout.
tokio = { workspace = true, features = ["test-util"] }
# Assemble tiny engine submissions from inline WebAssembly text to exercise the
# performance validator's scoring paths (correct + wrong-answer) without compiling
# the reference engine crates, mirroring how `lattice-host`'s submission tests do
# it. The oracle (`lattice-core::Engine`) computes the expected answer the correct
# module echoes back, so the test stays self-contained and deterministic.
wat = "1"

[lints]
workspace = true
