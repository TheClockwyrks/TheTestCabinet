[package]
name = "test-cabinet-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "test_cabinet_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
handlebars = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
png = { workspace = true }
which = { workspace = true }
base64 = { workspace = true }
# The drawing tool for asset-generation cases. Core links only the library (not
# the `cli` feature's clap/serde_json/schemars) to regenerate the scored image
# from a run's recorded action log through the exact same logic the in-container
# binary used.
test-cabinet-draw = { path = "../draw", default-features = false }
# The Foray adversarial game engine and its wasm host. The `AdversarialValidator`
# loads a submission and the committed baseline opponent and runs the single
# canonical match through the **shared** host (`foray-host`), so the validator and
# the `foray` CLI use one host implementation. `foray-core` supplies the rules and
# the board/replay types; the wasmtime dependency lives entirely in `foray-host`.
foray-core = { path = "../foray-core" }
foray-host = { path = "../foray-host" }
http = { workspace = true }
tracing = { workspace = true }
# Propagation only — the library never pulls in the OTLP exporters/SDK (those
# live behind the `otlp` feature the binaries enable). This keeps `crates/core`
# exporter-free; it only injects/extracts trace context through the process
# global propagator a binary may have installed.
test-cabinet-telemetry = { path = "../telemetry", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` enables paused/auto-advancing time so the runtime cap can be tested
# without waiting out a real wall-clock timeout.
tokio = { workspace = true, features = ["test-util"] }
