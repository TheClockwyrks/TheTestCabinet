[package]
name = "test-cabinet-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "test_cabinet_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
handlebars = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
png = { workspace = true }
which = { workspace = true }
# Content hashing for served container build contexts. The recipe must match the
# backend's (`crates/backend/src/hash.rs`), so both depend on the same `sha2`.
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Used only by tests to recompute the container content-hash recipe independently.
hex = { workspace = true }
sha2 = { workspace = true }
# `test-util` enables paused/auto-advancing time so the runtime cap can be tested
# without waiting out a real wall-clock timeout.
tokio = { workspace = true, features = ["test-util"] }
