[package]
name = "test-cabinet-arena"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-arena"
path = "src/main.rs"

[lib]
name = "test_cabinet_arena"
path = "src/lib.rs"

[dependencies]
# The match runner, from the engines family: `run_quick_match` and
# `run_tournament` over `foray-host`/`wasmtime` (the CPU-bound wasm sandbox a match
# executes in), the same runner the driver's adversarial validator scores a run
# through. So the arena reuses the runner, not reinvents it.
test-cabinet-match-play = { path = "../match-play" }
# The resolved test case a match is configured from.
test-cabinet-contracts = { workspace = true }
# The backend's HTTP client, from contracts: it resolves pushed controllers and
# publishes tournaments through `HttpBackendClient`.
test-cabinet-backend-client = { workspace = true }
# A quick match's response carries a `foray-core` `Replay` (the browser-playable
# recording); depend on it for that one type, as the worker did.
foray-core = { path = "../foray-core" }
# A binary: it owns telemetry init, so it pulls the heavy `otlp` feature (the
# propagation-only default is for the libraries), exactly as the other
# services' mains do.
test-cabinet-telemetry = { workspace = true, features = ["otlp"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
cuid2 = { workspace = true }
dotenvy = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# The live tournament NDJSON stream chains a backlog and a live tail.
futures-util = { workspace = true }
# Tournament `created_at` timestamps, RFC3339, as in the worker.
time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# `util` brings `ServiceExt::oneshot` so the router can be exercised end-to-end in
# tests without binding a socket, exactly as the artifact service's tests do.
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }

[lints]
workspace = true
