[package]
name = "contract-codegen"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "contract-codegen"
path = "src/main.rs"

# The generator drives the `contract` feature of the two contract crates, so the
# `ts_rs::TS` / `schemars::JsonSchema` derives on their data-contract types are
# available to emit TypeScript bindings and JSON Schemas from a single source. The
# job-API control plane that replaced the worker lives in `core` (the shared wire
# types) and `backend` (the server outputs + relay), so the generator no longer
# references the (now-removed) worker crate.
[dependencies]
test-cabinet-core = { path = "../core", features = ["contract"] }
test-cabinet-backend = { path = "../backend", features = ["contract"] }
ts-rs = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
