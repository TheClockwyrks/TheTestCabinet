[package]
name = "contract-codegen"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "contract_codegen"
path = "src/lib.rs"

[[bin]]
name = "contract-codegen"
path = "src/main.rs"

# The generator drives the `contract` feature of `test-cabinet-contracts`, so the
# `ts_rs::TS` / `schemars::JsonSchema` derives on its data-contract types are
# available to emit TypeScript bindings and JSON Schemas from a single source. It
# depends on nothing else of ours: the backend API package and its schemas are
# `api-codegen`'s (crates/api-codegen), which reuses this crate's library and is the
# one that compiles the core and the backend.
[dependencies]
test-cabinet-contracts = { path = "../contracts", features = ["contract"] }
ts-rs = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
