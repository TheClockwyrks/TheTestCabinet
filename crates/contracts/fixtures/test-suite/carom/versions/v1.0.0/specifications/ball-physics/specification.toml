id = "ball-physics"
name = "Ball Physics"
summary = "How the ball moves, collides and comes to rest."
path = "ball-physics.md"

[[requirement]]
id = "constant-speed"
kind = "functional"
text = "The ball MUST travel at a constant speed between collisions."
validators = [
  "ball/constant-speed.ts",
  "ball/constant-speed-after-cushion.ts",
  "ball/constant-speed-after-pocket-rim.ts",
]

[[requirement]]
id = "cushion-reflection"
kind = "functional"
text = "The ball MUST reflect off a cushion at the angle it arrived at."
validators = ["ball/cushion-reflection.ts"]

[[requirement]]
id = "table-felt"
kind = "non-functional"
text = "The table felt SHOULD read as cloth rather than as flat colour."
