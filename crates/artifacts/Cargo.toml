[package]
name = "test-cabinet-artifacts"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-artifacts"
path = "src/main.rs"

[lib]
name = "test_cabinet_artifacts"
path = "src/lib.rs"

[dependencies]
# The run record and the run-tree layout the playable resolvers read
# (`find_build_output`, `serve_build_file`, the proof naming rules).
test-cabinet-contracts = { workspace = true }
# The content labels a served file is sent under (`content_labels`).
test-cabinet-suites = { workspace = true }
# A binary: it owns telemetry init, so it pulls the heavy `otlp` feature (the
# propagation-only default is for libraries), exactly as the other
# services' mains do.
test-cabinet-telemetry = { workspace = true, features = ["otlp"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
dotenvy = { workspace = true }
# RFC-3339 formatting for the stored-tree listing's `modifiedAt`. The store reports
# a `SystemTime`; the backend's sweep parses the wire form with the same crate.
time = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# Streaming an upload into the store and a stored tree out of it (`store`):
# `futures-util` drives the body chunk streams and the concurrent object writes.
futures-util = { workspace = true }
# The random half of an upload's generation name (`store`), so two replicas
# starting an upload of the same run at once cannot collide.
getrandom = { workspace = true }
# The HTTP client the service verifies a driver's per-job token with against the
# backend's internal verify endpoint. rustls (no system OpenSSL), `json` for the
# body. The R2 (`r2`) and Blob (`blob`) clients send their signed requests with
# it too, and relay object bodies through its `stream` feature.
reqwest = { workspace = true }
# Verifies the Cloudflare Access assertion every edge request carries (`src/access.rs`).
jsonwebtoken = { workspace = true }
# SigV4 signing for the R2 client (`r2`): signing the handful of requests directly
# is far cheaper than vendoring the AWS SDK for three verbs.
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
md-5 = { workspace = true }
base64 = { workspace = true }
# `tar` (pure Rust, no system deps) reads the run-artifact tree the driver
# streams up as a tarball, and frames the whole-tree downloads — the same crate the
# driver builds the upload with.
tar = "0.4"
# Gzip framing for the reviewer-facing run-archive download. A run tree is source
# and JSON/NDJSON, so compressing it is most of the point of offering the download
# at all. Inherited from the workspace, which owns the version because the run-tree
# artifact convention puts the same codec on the run host and in the backend too.
flate2 = { workspace = true }
# The public store (`public`) is one interface over the R2 and Blob clients,
# held as a trait object because the environment picks the store at startup.
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Decodes the fixed test keys the Access tests sign assertions with.
base64 = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
# `util` brings `ServiceExt::oneshot` so the router can be exercised end-to-end in
# tests without binding a socket, exactly as the auth service's tests do.
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
# Decodes the query strings the stub object stores (`blob.stub.test.rs`,
# `r2.stub.test.rs`) receive.
percent-encoding = { workspace = true }

[lints]
workspace = true
