[package]
name = "test-cabinet-backend"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-backend"
path = "src/main.rs"

[lib]
name = "test_cabinet_backend"
path = "src/lib.rs"

[dependencies]
test-cabinet-core = { path = "../core" }
# Passwordless (Microsoft Entra managed-identity) auth for the managed-PostgreSQL
# deployments — mints a token as the Postgres password and rotates the pool.
# Engaged only when `TCAB_BACKEND_DB_AZURE_AD` is truthy; the default password /
# SQLite path never touches it.
test-cabinet-db-auth = { path = "../db-auth" }
test-cabinet-telemetry = { path = "../telemetry", features = ["otlp"] }
test-cabinet-entities = { workspace = true }
test-cabinet-migration = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
cuid2 = { workspace = true }
time = { workspace = true }
dotenvy = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
http = { workspace = true }
sea-orm = { workspace = true }
# Named directly (not used in code) so its `bundled` feature unifies onto the
# SQLite driver SeaORM pulls transitively, vendoring SQLite's C source. This is
# what keeps `cargo build-portable-backend` linking statically under musl.
libsqlite3-sys = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
percent-encoding = { workspace = true }
# Gzip decoding for the run-tree artifact routes. The store keeps a run's analysis
# documents exactly as they were uploaded (gzipped), so serving a client that does
# not advertise `Accept-Encoding: gzip` — every caller built on the workspace
# `reqwest`, which has no `gzip` feature — means decoding them here.
flate2 = { workspace = true }

# Contract codegen for the backend HTTP API + snapshot wire types. See
# `crates/core`'s `contract` feature; this turns on core's too so the shared
# run-record types derive as well.
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
# Derive `ts_rs::TS` + `schemars::JsonSchema` on the backend API + snapshot wire
# types for the `contract-codegen` generator. Never enabled by a normal build.
contract = ["dep:ts-rs", "dep:schemars", "test-cabinet-core/contract"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
# Tests only. A `CodeAnalysisSummary` has ~95 required leaves, so the honest way to get
# one for a fixture is to run the real analyzer over a two-line tree rather than to write
# out a literal that would drift from the contract on the next field added. The backend
# itself never analyses anything — the driver does, at the post-run seam.
test-cabinet-code-analysis = { path = "../code-analysis" }

[lints]
workspace = true
