[package]
name = "test-cabinet-backend"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-backend"
path = "src/main.rs"

[lib]
name = "test_cabinet_backend"
path = "src/lib.rs"

[dependencies]
# The API wire types the backend serves, generated into `@clockwyrks/backend-api`,
# and the run record, run-tree layout and harness contract it stores and serves.
test-cabinet-contracts = { workspace = true }
# The suite runtime and manifest loaders, whose error the catalogs return.
test-cabinet-suites = { workspace = true }
# The built-in engine catalog ingest resolves a version's engines against.
test-cabinet-engines = { workspace = true }
# Secret scrubbing of the documents the snapshot publishes.
test-cabinet-redact = { workspace = true }
# The R2 client the snapshot refresh and ingest write and list the public bucket
# with. An interim edge onto the artifacts service's crate: the dataset writes move
# behind the artifacts service's API, after which the backend reaches it over HTTP.
test-cabinet-artifacts = { path = "../artifacts" }
# Passwordless (Microsoft Entra managed-identity) auth for the managed-PostgreSQL
# deployments — mints a token as the Postgres password and rotates the pool.
# Engaged only when `TCAB_BACKEND_DB_AZURE_AD` is truthy; the default password /
# SQLite path never touches it.
test-cabinet-db-auth = { path = "../db-auth" }
test-cabinet-telemetry = { workspace = true, features = ["otlp"] }
test-cabinet-entities = { workspace = true }
test-cabinet-migration = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
cuid2 = { workspace = true }
time = { workspace = true }
dotenvy = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
http = { workspace = true }
sea-orm = { workspace = true }
# Named directly (not used in code) so its `bundled` feature unifies onto the
# SQLite driver SeaORM pulls transitively, vendoring SQLite's C source. This is
# what keeps `cargo build-portable-backend` linking statically under musl.
libsqlite3-sys = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# Gzip decoding for the run-tree artifact routes. The store keeps a run's analysis
# documents exactly as they were uploaded (gzipped), so serving a client that does
# not advertise `Accept-Encoding: gzip` — every caller built on the workspace
# `reqwest`, which has no `gzip` feature — means decoding them here.
flate2 = { workspace = true }
# Unpacks the gzipped tar of a static build uploaded as a suite reference build.
tar = "0.4"


[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
