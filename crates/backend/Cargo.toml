[package]
name = "test-cabinet-backend"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-backend"
path = "src/main.rs"

[lib]
name = "test_cabinet_backend"
path = "src/lib.rs"

[dependencies]
test-cabinet-core = { path = "../core" }
test-cabinet-telemetry = { path = "../telemetry", features = ["otlp"] }
test-cabinet-entities = { workspace = true }
test-cabinet-migration = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
dotenvy = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
http = { workspace = true }
sea-orm = { workspace = true }
# Named directly (not used in code) so its `bundled` feature unifies onto the
# SQLite driver SeaORM pulls transitively, vendoring SQLite's C source. This is
# what keeps `cargo build-portable-backend` linking statically under musl.
libsqlite3-sys = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
percent-encoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
