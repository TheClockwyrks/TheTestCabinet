[package]
name = "test-cabinet-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Graphical desktop shell for The Test Cabinet, built with Tauri v2."

# Tauri v2 convention: the application logic lives in a library target shared by
# the binary and (on mobile) generated entry points, while the binary is a thin
# wrapper that calls into the library's `run()` entrypoint.
[lib]
name = "test_cabinet_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "test-cabinet-desktop"
path = "src/main.rs"

[dependencies]
test-cabinet-core = { path = "../core" }
# The arena's quick-match command returns a `foray-core` replay; depend on it
# directly to name that type in the result DTO.
foray-core = { path = "../foray-core" }
# Opt-in OpenTelemetry: the `otlp` feature pulls the SDK/exporter init path so the
# shell can export traces (and bridge logs/metrics) when a collector is configured;
# with no `OTEL_EXPORTER_OTLP_ENDPOINT` it degrades to today's stdout logging.
test-cabinet-telemetry = { path = "../telemetry", features = ["otlp"] }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The local arena runs CPU-bound wasm matches/tournaments off Tauri's async
# command runtime (via `spawn_blocking`), so the shell needs a Tokio handle of its
# own; the telemetry runtime in `run()` also relies on it.
tokio = { workspace = true }
# Mints the id a locally-run match/tournament is tracked and persisted under.
uuid = { workspace = true }
# Stamps a tournament's `createdAt` timestamp (RFC 3339) when the arena runs one.
time = { workspace = true }
# Loads harness API keys (e.g. ANTHROPIC_API_KEY) and TCAB_* configuration from a
# `.env` beside the project, matching the CLI, so the shell can be driven without
# exporting every variable into the launching shell.
dotenvy = { workspace = true }
# The self-contained k3d bootstrap (`cluster`) polls the backend's `/healthz` and
# triggers `POST /ingest` over HTTP. The blocking client keeps the bootstrap a
# single straight-line routine on its own OS thread (no async coloring), away from
# the long-running rollout waits.
reqwest = { workspace = true, features = ["blocking"] }
# Spans around each invoked IPC command so a desktop action that calls into core
# produces a trace; core supplies the deeper spans beneath these.
tracing = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true
