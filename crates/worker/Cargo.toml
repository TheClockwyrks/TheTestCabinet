[package]
name = "test-cabinet-worker"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab-worker"
path = "src/main.rs"

[lib]
name = "test_cabinet_worker"
path = "src/lib.rs"

[dependencies]
test-cabinet-core = { path = "../core" }
# The arena's quick-match endpoint returns a `foray-core` replay; depend on it
# directly to name that type in the response.
foray-core = { path = "../foray-core" }
# The worker is a binary: it owns telemetry init, so it pulls the heavy `otlp`
# feature (the propagation-only default is for libraries like `core`).
test-cabinet-telemetry = { path = "../telemetry", features = ["otlp"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
dotenvy = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
# Used directly for the OTel meter and request/run metric instruments. The
# `tracing-subscriber` subscriber is now installed by `test-cabinet-telemetry`.
opentelemetry = { workspace = true }
http = { workspace = true }

futures-util = { workspace = true }
bytes = { workspace = true }

# Contract codegen for the worker HTTP API types. See `crates/core`'s `contract`
# feature; this turns on core's too so the shared run-record types derive as well.
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Kubernetes runtime (`src/kubernetes.rs`): under TCAB_WORKER_RUNTIME=kubernetes the
# worker creates one run pod per run via the API instead of shelling out to a host
# Docker/Podman. `ws` enables the pod `exec`/attach websocket the runtime streams
# the session and `tar` copy in/out over; `rustls-tls` keeps the worker on the same
# no-system-OpenSSL stack as the rest of the workspace (no `default-features`, which
# would pull native-tls + openssl). `k8s-openapi`'s `latest` feature selects the
# newest Kubernetes API types; the runtime only uses the long-stable core `Pod`
# objects, so any supported cluster version works. `tar` (pure Rust, no system deps)
# frames the working tree streamed in and out of the pod over `exec`, the same
# mechanism `kubectl cp` uses. These are the worker's alone — the leaner crates and
# the CLI/desktop (which use the host-runtime path) never compile them.
kube = { version = "4", default-features = false, features = [
	"client",
	"ws",
	"rustls-tls",
] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tar = "0.4"

[features]
# Derive `ts_rs::TS` + `schemars::JsonSchema` on the worker API request/response
# types for the `contract-codegen` generator. Never enabled by a normal build.
contract = ["dep:ts-rs", "dep:schemars", "test-cabinet-core/contract"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
