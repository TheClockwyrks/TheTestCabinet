[package]
name = "gg-rac-interp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The **responses-as-code interpreter** — the guest side of gg's code-execution
# sandbox (`crates/gg`'s `rac` host). It implements `gg-script`, the small,
# well-specified scripting language a model emits *instead of* discrete tool calls
# (the [responses-as-code](../../apps/docs/src/content/docs/gg/responses-as-code.md)
# capability): variables/`let`, `if`/`else`, `while`/`for`, JSON values, operators,
# and TOOL CALLS as first-class calls that return values.
#
# Because a model cannot emit wasm directly, the faithful sandboxing approach is a
# **trusted interpreter compiled to wasm**: this crate is that interpreter. It
# compiles to `wasm32-unknown-unknown` as a `cdylib` (exporting `memory`, `alloc`,
# and `run_program`, importing the host's `gg.call_tool`) — mirroring the
# `foray-ref-*`/`lattice-ref-*` guest pattern — and the committed artifact is loaded
# by the `crates/gg` host under a wasmtime fuel + linear-memory ceiling. See
# `README.md` for the language grammar/semantics, the ABI, and the build step that
# refreshes the committed `.wasm`.
#
# It is ALSO built as an `rlib` so the pure interpreter (lexer/parser/tree-walk) is
# unit-tested natively against a mock tool host, with no wasm toolchain and no
# network — the wasm ABI glue is `#[cfg(target_arch = "wasm32")]` and absent from
# the native build.
[lib]
name = "gg_rac_interp"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The runtime value of the language IS a JSON value: literals, tool arguments, and
# tool results all cross the ABI as JSON, so reusing `serde_json::Value` as the
# interpreter's value type gives exact JSON semantics for free and keeps the guest
# and the host talking in the same units.
serde_json = { workspace = true }
# Derives for the request/outcome envelope types that cross the ABI.
serde = { workspace = true }

[lints]
workspace = true
