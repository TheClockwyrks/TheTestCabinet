[package]
name = "test-cabinet-suites"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The test-suite runtime: what reads a `test-suites/` checkout and turns an offered
# definition into a run, on the filesystem, in a process or in a browser. The suite
# catalog and its lowering onto a test case version, previews, the definition prompt,
# the validator runners (a suite's and a case's vitest project), the static server and
# browser driver they use, the built-in engine catalog, and the content digests and
# labels an ingest keys a version by. The shapes it reads and writes are
# `test-cabinet-contracts`'; the run that executes the result is `test-cabinet-core`'s,
# which depends on this crate and re-exports every module at its old path, so
# `test_cabinet_core::test_suite::TestSuiteCatalog` and the rest keep naming the same
# items.
[lib]
name = "test_cabinet_suites"
path = "src/lib.rs"

[dependencies]
test-cabinet-contracts = { path = "../contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
# An engine manifest (`engine.toml`) and a suite's TOML files.
toml = { workspace = true }
# The version of an engine's staged package (`engine::EngineCatalog`).
semver = { workspace = true }
thiserror = { workspace = true }
# A version's content digest (`content_digest`).
sha2 = { workspace = true }
hex = { workspace = true }
# A suite definition's prompt and the shared template helpers (`prompt`).
handlebars = { workspace = true }
# Scratch directories for a validator run and a browser smoke check.
tempfile = { workspace = true }
tracing = { workspace = true }
# A unique name for each capture's private temp file (`browser`).
cuid2 = { workspace = true }
# `test_browser` asks whether `node` is on `PATH`.
which = { workspace = true, optional = true }

[features]
# Exposes `test_browser`, what a test driving a real browser needs, to the tests of
# a crate that depends on this one (`test-cabinet-core` turns it on as a
# dev-dependency). Never enabled by a normal build.
test-support = ["dep:which"]

[dev-dependencies]
tempfile = { workspace = true }
which = { workspace = true }

[lints]
workspace = true
