[package]
name = "test-cabinet-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab"
path = "src/main.rs"

[dependencies]
test-cabinet-core = { path = "../core" }
test-cabinet-telemetry = { path = "../telemetry", features = ["otlp"] }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Scratch workspace an asset-generation reference is drawn into before its frames
# are uploaded. The bytes are derived from the committed script, so the directory
# is discarded once the upload finishes.
tempfile = { workspace = true }
anstyle = { workspace = true }
anstream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }

[lints]
workspace = true
