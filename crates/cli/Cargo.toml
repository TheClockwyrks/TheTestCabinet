[package]
name = "test-cabinet-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab"
path = "src/main.rs"

[dependencies]
# The run engine: the `tcab` binary is the driver repository's second binary, a thin
# shell over the same `RunEngine` the driver executes a run with, plus the CLI's own
# halves the library holds for it (the remote backend, the asset-reference builder,
# the Pages build deploy helper) and the static code analyzer `tcab analyze` runs.
test-cabinet-driver = { path = "../driver" }
# The account wire types the auth-service client (`accounts`) speaks.
test-cabinet-contracts = { path = "../../contracts/crates/contracts" }
# The R2 client `tcab publish-asset-reference` uploads a reference with. An interim
# edge onto the artifacts service's crate, until the upload goes through its API.
test-cabinet-artifacts = { path = "../artifacts" }
# The backend's HTTP client, from contracts.
test-cabinet-backend-client = { path = "../../contracts/crates/backend-client" }
test-cabinet-telemetry = { path = "../../contracts/crates/telemetry", features = ["otlp"] }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Scratch workspace an asset-generation reference is drawn into before its frames
# are uploaded. The bytes are derived from the committed script, so the directory
# is discarded once the upload finishes.
tempfile = { workspace = true }
anstyle = { workspace = true }
anstream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
# The auth-service client (`accounts`).
reqwest = { workspace = true }
http = { workspace = true }

[lints]
workspace = true
