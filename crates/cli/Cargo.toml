[package]
name = "test-cabinet-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tcab"
path = "src/main.rs"

[dependencies]
test-cabinet-core = { path = "../core" }
test-cabinet-telemetry = { path = "../telemetry", features = ["otlp"] }
# gg's harness library — `tcab gg-replay` drives its debug-only replay driver
# (`replay_driver`) in-process to reconstruct a run from a captured replay record.
test-cabinet-gg = { path = "../gg" }
# The static code analyzer — `tcab analyze` runs it in-process over a directory. The
# dependency lives here rather than in core on purpose: core owns the contract types, and
# keeping the parsers out of it is what stops `oxc` and `syn` from being linked into every
# binary that touches a run record.
test-cabinet-code-analysis = { path = "../code-analysis" }
clap = { workspace = true }
# Downloading an older `gg` release for `tcab gg-replay --gg <VERSION>`. The backend client in
# `core` already links this exact client, so this is a direct dependency on a crate `tcab` carries
# either way — not a second HTTP or TLS stack.
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Scratch workspace an asset-generation reference is drawn into before its frames
# are uploaded. The bytes are derived from the committed script, so the directory
# is discarded once the upload finishes.
tempfile = { workspace = true }
anstyle = { workspace = true }
anstream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }

[lints]
workspace = true
