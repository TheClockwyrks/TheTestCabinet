[package]
name = "test-cabinet-telemetry"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "test_cabinet_telemetry"
path = "src/lib.rs"

[features]
# Default features pull ONLY the light propagation deps so a library (e.g.
# `crates/core`) can extract/inject W3C trace context without dragging in any
# exporter, the SDK, or `tracing-subscriber`. The `propagation` module compiles
# with this set alone.
default = []
# `otlp` adds the heavy init path: the SDK, the OTLP exporter, the logs bridge,
# and `tracing-subscriber`. Binaries that call `init()` enable this feature.
otlp = [
	"dep:opentelemetry_sdk",
	"dep:opentelemetry-otlp",
	"dep:opentelemetry-appender-tracing",
	"dep:opentelemetry-semantic-conventions",
	"dep:tracing-subscriber",
]

[dependencies]
anyhow = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }

# Light propagation deps (always present): the API surface, the W3C propagator,
# the HTTP header extractor/injector, and the `OpenTelemetrySpanExt` used to read
# the current span's context.
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Heavy init deps (only with `otlp`).
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true
