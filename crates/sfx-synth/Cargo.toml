[package]
name = "test-cabinet-sfx-synth"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The `sfx-synth` binary: procedural sound-effect synthesis (`asset_kind =
# "sfx-synth"`) — a modular synth op graph, no samples. A thin CLI over
# `test-cabinet-audio-core` (the DSP, mixer, render engine, and preview renderers).
# See `apps/docs/src/content/docs/testing/asset-generation/audio-binaries.md`.
[[bin]]
name = "sfx-synth"
path = "src/main.rs"

[dependencies]
test-cabinet-audio-core = { path = "../audio-core" }
clap = { workspace = true }

[lints]
workspace = true
