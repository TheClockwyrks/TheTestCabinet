[package]
name = "test-cabinet-gg"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gg"
path = "src/main.rs"

[dependencies]
# gg's data contract (the capability set and the schema-v1 telemetry types) is
# owned by `core`, so the binary consumes those types from there rather than
# redefining them. `core` is also where the integration workflow will construct
# the invocation config that core hands this binary.
test-cabinet-core = { path = "../core" }

# The responses-as-code interpreter — gg embeds its committed `.wasm` and reads back
# its `ProgramOutcome` envelope, so it consumes the guest crate's shared types (built
# here for the native host, embedded as wasm for the sandbox). See `src/rac.rs`.
gg-rac-interp = { path = "../gg-rac-interp" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# The invocation config is parsed and the (future) turn loop is async, so the
# binary is a tokio program; the client/loop that arrive in the next workflow
# need the async runtime.
tokio = { workspace = true }
# Argument parsing: gg takes a single `--config <path>` flag (see the module
# rustdoc in `src/main.rs`).
clap = { workspace = true }
# RFC 3339 timestamps for the telemetry stream, matching how `core` stamps its
# own event/record times (`OffsetDateTime::now_utc().format(&Rfc3339)`).
time = { workspace = true }
# The HTTP client the model client (`src/client.rs`) reaches OpenRouter with — the
# workspace's rustls-backed `reqwest` (no system OpenSSL); see `crates/core`.
reqwest = { workspace = true }
# `async fn` in the `ModelClient` trait (`src/model.rs`), so a boxed `dyn ModelClient`
# can back the async turn loop and be shared across spawned subagents later.
async-trait = { workspace = true }
# The wasm runtime backing the responses-as-code sandbox (`src/rac.rs`): it runs an
# agent's code-shaped response — the committed `gg-rac-interp` interpreter — under a
# fuel + linear-memory ceiling, mirroring the `foray-host`/`lattice-host` pattern.
# Same pinned major version and minimal (`cranelift` + `runtime`) feature set as those
# hosts, so the fuel/memory sandbox semantics stay identical across the workspace.
wasmtime = { workspace = true }
# BPE tokenizer backing the default context-window token estimator (`src/context.rs`).
# gg accounts every context contribution per source in estimated tokens; the estimator
# is a trait so this is swappable, but the default counts with a fixed BPE base as a
# documented cross-model approximation. The crate embeds its vocab (no network).
tiktoken-rs = { workspace = true }

[dev-dependencies]
# A scratch workspace root for the tool tests (shell + filesystem): tools operate on
# the local filesystem rooted at the invocation's workspace, so the tests exercise
# them against a real temporary directory.
tempfile = { workspace = true }

[lints]
workspace = true
