[package]
name = "foray-host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The native wasm host for the Foray adversarial test case (on-disk slug
# `adversarial-pacman`). It loads two competing controller modules, drives a
# single match through `foray-core`'s authoritative rules, meters each per-tick
# controller invocation with a wasmtime fuel ceiling and a linear-memory cap, and
# returns the published `Replay`.
#
# This crate exists so the host lives in exactly ONE place: the `foray` CLI is a
# thin clap wrapper over `run_match`, and the core `AdversarialValidator` (a later
# phase) depends on this crate to score a submission. `foray-core` must stay
# wasm-compilable, so the wasmtime dependency lives here — never in core.
[lib]
name = "foray_host"

[dependencies]
# The authoritative rules, world/action contract, and replay format. The host
# never reimplements a rule — it only marshals JSON across the wasm boundary and
# hands actions to the engine.
foray-core = { path = "../foray-core" }
# The wasm runtime. Reused across the whole match (one Store + Instance per
# controller) so guest statics persist between ticks, with fuel metered per tick.
wasmtime = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The smoke test compiles a tiny controller to wasm at build time and runs a
# match against it; `wat` assembles the controller from inline WebAssembly text so
# the test needs no extra build step or committed binary.
wat = "1"

[lints]
workspace = true
