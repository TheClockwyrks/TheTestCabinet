[package]
name = "test-cabinet-engines"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The built-in engines: the `engines/<slug>/engine.toml` manifests baked into the
# binary, keyed by slug, and `built_in_catalog`, the suites crate's `EngineCatalog`
# bound to that table. Every caller that resolves an engine selection or checks the
# engines a case declares takes the catalog from here; the suites crate names no
# table of its own.
[lib]
name = "test_cabinet_engines"
path = "src/lib.rs"

[dependencies]
# The engine catalog the table is bound to, and the default host package store an
# engine's version is read from.
test-cabinet-suites = { workspace = true }

[dev-dependencies]
# The slug-order test holds the table to the contract's `BUILT_IN_SLUGS`.
test-cabinet-contracts = { workspace = true }
# The none-engine test compares the template views a prompt renders.
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
