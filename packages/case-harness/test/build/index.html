<!doctype html>
<meta charset="utf-8" />
<title>case-harness fixture</title>
<style>
  html,
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
<canvas id="stage"></canvas>
<script>
  // The fixture build the package's own suite drives.
  //
  // It is deliberately NOT a game: it is the smallest thing that satisfies what
  // `specs/instrumentation.md` asks of an engineless build, so the harness can be
  // checked against a build whose every answer is known in advance. The per-case
  // self-check suites this replaced could only check the harness against their own
  // case's reference implementation, which is why the four cases could never agree
  // on what the shared machinery does — this can.
  //
  // What it conforms to, and what each part is here to let a check pin down:
  //
  //   - A canvas fitted to the window on the uniform-scale letterbox every case's
  //     `specs/overview.md` fixes, so a pixel read at a logical point can be
  //     checked at more than one window shape.
  //   - A debug surface on `window.__fixture` with `setAutoStep`, `reset`,
  //     `snapshot` and a `count`-shaped `advance`, plus three operations of its
  //     own so a check can pose it.
  //   - Its own animation-frame loop, which keeps DRAWING while the game is off
  //     the wall clock — the behaviour the recorder's framing has to survive.
  //   - One sound every fourth tick of live play, so a cue lands on a frame a
  //     check can name.
  (() => {
    const STAGE_W = 200;
    const STAGE_H = 100;

    /** Where a sound lands: every fourth tick of live play, and no other. */
    const CUE_EVERY = 4;

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    const state = {
      screen: "title",
      auto: true,
      frames: 0,
      seed: null,
      x: 0,
      sounds: 0,
      /** Ticks that ran with at least one key held, which is what a tap makes. */
      heldTicks: 0,
      clicks: 0,
      taken: 0,
      pointer: { x: -1, y: -1 },
      /**
       * Every call the SECONDS-FRAMES step operation received, as
       * `[seconds, frames]`, in order.
       *
       * The one thing a build can report and a harness cannot see for itself:
       * WHO divided the interval. `advance(count)` below runs whole ticks of this
       * build's own length and logs nothing; `advanceSpan(seconds, frames)` is
       * the other shape `specs/instrumentation.md` fixes, and it records the call
       * it was made with — so a check can tell one call covering a second in
       * sixty frames from sixty calls covering a sixtieth each.
       */
      spans: [],
    };
    const held = new Set();

    // The two conformant ways a build reads a press, side by side. `clicks` is
    // latched in the handler the moment the event arrives; `pending` is the other
    // shape — the samples an input layer buffers and reads once a frame, which is
    // what an engineless build usually writes — and `taken` counts the edges a
    // TICK consumed out of it. `pending` belongs to the input layer rather than to
    // the game, so `reset` does not clear it, exactly as a real one does not.
    const pending = [];

    let audio = null;
    function blip() {
      audio ??= new (window.AudioContext || window.webkitAudioContext)();
      const source = audio.createOscillator();
      source.connect(audio.destination);
      source.start();
      source.stop(audio.currentTime + 0.01);
      state.sounds += 1;
    }

    // A looping bed, started well after the tick that asked for it — the way a
    // build whose bed waits on a decoded file starts its own. Nothing can observe
    // it on that tick, which is what a wait for it has to survive. The delay is
    // long enough that no single crossing into this page can cover it, and short
    // enough that a wait stepping one tick per crossing finds it easily.
    const BED_DELAY_MS = 100;
    let bedSource = null;
    function bed() {
      audio ??= new (window.AudioContext || window.webkitAudioContext)();
      setTimeout(() => {
        const source = audio.createBufferSource();
        source.buffer = audio.createBuffer(1, 128, audio.sampleRate);
        source.loop = true;
        source.connect(audio.destination);
        source.start();
        bedSource = source;
      }, BED_DELAY_MS);
    }

    function fit() {
      const dpr = window.devicePixelRatio;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
    }

    function draw() {
      const dpr = window.devicePixelRatio;
      const cssScale = Math.min(
        window.innerWidth / STAGE_W,
        window.innerHeight / STAGE_H,
      );
      const scale = cssScale * dpr;
      const offsetX = (canvas.width - STAGE_W * scale) / 2;
      const offsetY = (canvas.height - STAGE_H * scale) / 2;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, STAGE_W, STAGE_H);

      // A landmark that never moves, so a pixel read at one logical point is the
      // same answer at every window shape the fit maps.
      ctx.fillStyle = "#ff0000";
      ctx.fillRect(100, 50, 10, 10);

      // And one that does, so two recorded frames are not the same picture.
      ctx.fillStyle = "#00c8ff";
      ctx.fillRect(state.x, 4, 6, 6);

      ctx.fillStyle = "#ffffff";
      ctx.font = "10px sans-serif";
      ctx.fillText(state.screen.toUpperCase(), 8, 20);
    }

    function tick() {
      state.taken += pending.length;
      pending.length = 0;
      state.frames += 1;
      state.x = (state.x + 2) % STAGE_W;
      if (held.size > 0) state.heldTicks += 1;
      if (state.screen === "playing" && state.frames % CUE_EVERY === 0) blip();
      draw();
    }

    function loop() {
      requestAnimationFrame(loop);
      if (state.auto) tick();
      else draw();
    }

    window.addEventListener("resize", fit);
    window.addEventListener("keydown", (event) => held.add(event.code));
    window.addEventListener("keyup", (event) => held.delete(event.code));
    window.addEventListener("mousemove", (event) => {
      state.pointer = { x: event.clientX, y: event.clientY };
    });
    window.addEventListener("mousedown", () => {
      state.clicks += 1;
      pending.push("down");
    });
    window.addEventListener("mouseup", () => {
      pending.push("up");
    });

    window.__fixture = {
      version: 4,
      setAutoStep(on) {
        state.auto = on === true;
      },
      reset(options) {
        state.screen = "title";
        state.frames = 0;
        state.x = 0;
        state.sounds = 0;
        state.heldTicks = 0;
        state.clicks = 0;
        state.taken = 0;
        state.spans = [];
        state.seed = options?.seed ?? null;
        held.clear();
        bedSource?.stop();
        bedSource = null;
        draw();
      },
      advance(count) {
        for (let i = 0; i < count; i += 1) tick();
      },
      // The other step shape a case's specification may fix: a span of simulated
      // time the BUILD divides into whole frames. It runs the same ticks
      // `advance` does — this build's frames are of one fixed length whatever it
      // is told — and records the call, which is the only way a check can see
      // that the interval was handed over undivided.
      advanceSpan(seconds, frames) {
        state.spans.push([seconds, frames]);
        for (let i = 0; i < frames; i += 1) tick();
      },
      // Somewhere to put a value, so a batch of surface calls has an order that
      // can be read back and an argument that can be typed.
      setX(value) {
        state.x = value;
        draw();
      },
      startPlaying() {
        state.screen = "playing";
        draw();
      },
      blip,
      bed,
      snapshot() {
        return {
          screen: state.screen,
          auto: state.auto,
          frames: state.frames,
          seed: state.seed,
          x: state.x,
          sounds: state.sounds,
          heldTicks: state.heldTicks,
          clicks: state.clicks,
          taken: state.taken,
          keys: [...held].sort(),
          pointer: { ...state.pointer },
          spans: state.spans.map((span) => [...span]),
        };
      },
    };

    fit();
    draw();
    requestAnimationFrame(loop);
  })();
</script>
