# The libraries a PureScript program is written against, and the ONLY thing this file decides.
#
# gg's rule for every language arm is that commonly used libraries are available by default — a
# PureScript author reaches for `Data.Map`, `StateT` and a lens without asking, and an arm that made
# them ask would be measuring how well a model can live without its standard idioms rather than how
# well it works. So this set is deliberately generous and deliberately FIXED: it is compiled into the
# tree `packages/gg-sandbox-purescript/build.sh` commits, every program is compiled against exactly
# it, and nothing is installed at run time.
#
# What is NOT here is as deliberate. There is no JSON library, because neither an argument nor a
# result the SDK takes is a JSON document a program assembles or parses — that is one of the seam's
# rules, and shipping `argonaut` would invite a program to break it. There is no HTTP or Node
# binding, because the guest is a wasm component and the way out of it is the SDK. And there is no
# `aff`: every call in this sandbox is synchronous, so an asynchronous effect monad would be a
# library whose whole point the sandbox refuses.
#
# # The headings are machine-readable
#
# Every dependency sits under a `# --- Heading ---` line, and `tools/signatures.mjs` reads them: the
# catalogue's `libraries` section is the modules of the packages declared here, grouped by these
# headings, so what a model is TOLD it may import is reflected out of the file that decides the set
# rather than written into a prompt that would drift from it. Add a package under a heading, rebuild,
# and the prompt says so.
#
# Versions are resolved against the pinned registry package set (see `purescript-version.sh`) and
# recorded package by package in the committed `spago.lock`.
package:
  name: gg-sandbox-purescript
  dependencies:
    # --- The everyday ---
    - prelude
    - maybe
    - either
    - tuples
    - newtype
    - bifunctors
    - functions
    - partial
    - strings
    - integers
    - numbers
    - enums
    - record
    - datetime
    # --- Collections ---
    - arrays
    - lists
    - ordered-collections
    - foreign-object
    - foldable-traversable
    - unfoldable
    # --- Effects, including the two the sandbox's ambient WASI makes real ---
    - effect
    - exceptions
    - refs
    - st
    - now
    - random
    - console
    # --- Monad transformers and control ---
    - transformers
    - free
    - identity
    - control
    - tailrec
    # --- Optics ---
    - profunctor-lenses
    # --- JavaScript interop, which is what this arm's own SDK is built on ---
    - nullable
    - unsafe-coerce
workspace:
  packageSet:
    registry: 80.3.0
  extraPackages: {}
