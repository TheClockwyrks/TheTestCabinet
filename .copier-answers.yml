# This file records the answers this workspace was rendered with and the
# template version it was rendered against. Copier maintains it; changes made
# here are overwritten by the next render or update.
#
# `_commit` is the template version the workspace was last generated or updated
# against, and `_src_path` is the template repository it came from.
_commit: v0.21.0
_src_path: git@ssh.dev.azure.com:v3/genyume/nyxsis-template-k8s-standard/nyxsis-template-k8s-standard
azure_cluster: testcabinet-staging-westus2-aks
azure_resource_group: testcabinet-staging-westus2-rg
azure_service_connection: tcab-deploy
ci_registry: testcabinet.azurecr.io
deploy_branch: staging
deploy_environment: tcab-staging
deploy_namespace: tcab-staging
deploy_overlay: staging
deployment: azure-k8s
drain_skill_notes: 'This project''s changelogs, under `apps/docs/src/content/docs/changelogs/`,
    are

    written only immediately before a release and only when asked, so draining the

    queue writes no changelog entry. A test-case version whose directory carries a

    `.frozen` marker is never edited: an issue whose fix would change one is fixed
    in

    a new version of the case, or it is blocked. The unit tests of `crates/gg` are

    not part of `rust-test`: a change under `crates/gg/` also runs

    `scripts/ci/gg-test.sh`, which runs that suite.

    '
extra_gates:
-   files: (^|/)\.frozen$|^(test-cases|game-jams)/|^scripts/(freeze|lib/frozen)\.sh$|^ci/gates/frozen-paths\.py$
    hook: true
    id: frozen-paths
    name: frozen test-case versions
    track: web
-   files: ^packages/|^scripts/stage-tcab-packages\.mjs$|^scripts/ci/seeded-contract-check\.sh$|^ci/gates/seeded-contract\.py$
    hook: true
    id: seeded-contract
    name: seeded contract vocabulary
    track: web
-   files: ^(test-cases|game-jams)/.*/v[0-9]+\.[0-9]+\.[0-9]+/(prompt\.hbs$|specs/)|^crates/core/src/prompt\.rs$|^scripts/ci/spec-vocabulary-check\.mjs$|^ci/gates/spec-vocabulary\.py$
    hook: true
    id: spec-vocabulary
    name: seeded spec vocabulary
    track: web
-   files: ^(test-cases|game-jams|test-case-groups)/.*\.(md|html|css|toml|hbs)$|^\.cspell/|^\.markdownlint-cli2\.yaml$|^ci/gates/spec-prose\.py$
    hook: true
    id: spec-prose
    name: spec prose (markdownlint, cspell)
    track: web
-   files: ^(test-cases|game-jams)/.*/(test-case|game-jam)\.toml$|^containers/sample-packs/|^scripts/ci/audio-packs-check\.mjs$|^scripts/lib/audio-packs\.mjs$|^ci/gates/audio-packs\.py$
    hook: true
    id: audio-packs
    name: audio pack declarations
    track: web
-   files: (^|/)[^/]*[Dd]ockerfile[^/]*$|(^|/)\.dockerignore$|^rust-toolchain\.toml$|^packages/gg-sandbox|^scripts/stage-tcab-packages\.mjs$|^scripts/ci/build-context\.sh$|^ci/gates/build-context\.py$
    hook: true
    id: build-context
    name: Dockerfile build contexts
    track: web
-   files: ^deployments/k8s/|^scripts/ci/(deploy-environment|pin-images|pre-deploy|post-deploy|settle-workloads|retire-legacy-backend|k8s-deploy-sets|tcab-lib)\.sh$|^ci/gates/k8s-deploy-sets\.py$
    hook: true
    id: k8s-deploy-sets
    name: kubernetes deploy sets
    track: web
-   files: ^ci/images/tags\.yml$|^\.azure/project/jobs\.yml$|^scripts/ci/tcab-image-pin\.sh$|^ci/gates/ci-image-pins\.py$
    hook: true
    id: ci-image-pins
    name: project jobs pin the Rust CI image
    track: web
-   files: ^scripts/lib/.*\.m?js$|^ci/gates/scripts-test\.py$
    hook: true
    id: scripts-test
    name: script library tests (node --test)
    track: web
-   hook: false
    id: file-endings
    name: file endings outside frozen versions
    track: web
-   hook: false
    id: workspace-test
    name: npm workspace tests (vitest)
    track: web
-   hook: false
    id: validators-typecheck
    name: validator projects typecheck (tsc)
    track: web
-   hook: false
    id: site-build
    name: gallery build (vite build)
    track: web
-   hook: false
    id: contract-drift
    name: generated contract drift
    track: rust
