# Instrument bank — synthwave
#
# A synthwave / electronic instrument bank (analog synths, pads, drum machine) for the
# `music` sequencer: one representative one-shot per instrument, which the renderer
# pitch-shifts across a track's notes. A drum-machine one-shot sets `pitched = false`
# and plays at its recorded pitch.
#
# Each `clip` is the sha256 of the source audio and resolves through `clips.toml`, which
# holds the clip's licence, provenance and recorded pitch. `root_note` here overrides the
# registry's value for this bank only.

name = "synthwave"
version = "0.1.0"
kind = "instrument-bank"

# Instrument one-shots are baked stereo at full rate; the sequencer resamples per note.
[normalize]
sample_rate = 44100
channels = 2
loudness_lufs = -20.0
true_peak_dbfs = -1.0
trim_silence = true
max_duration_ms = 5000

