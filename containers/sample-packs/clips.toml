# Audio clip registry
#
# One entry per source clip. A clip's `id` is the sha256 of its original source bytes,
# which is also its key in the object store (`sources/<id>` and
# `normalized/<id>/<profile-id>.wav`). Only intrinsic facts live here; a clip's name,
# tags and description are chosen per pack, so the same clip can be `trombone` in one
# bank and `low_brass` in another.
#
# See `README.md` for the ingest path that adds a clip and uploads its bytes.

