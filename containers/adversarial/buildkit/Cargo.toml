# Workspace root for the baked Foray controller "buildkit".
#
# The adversarial run-container image bakes a model's controller *build
# dependencies* under `/opt/foray/buildkit` so the seeded run workspace never has
# to vendor them. This directory holds fresh copies of `foray-core` (the
# `World`/`Action` contract types plus the rules a controller links) and
# `foray-controller-sdk` (the guest-side ABI glue and the maze helpers), copied
# UNMODIFIED from `crates/` at image-build time (see
# `containers/adversarial/Dockerfile`). A run's `controller/Cargo.toml`
# path-depends on the two crates under this directory.
#
# The crate sources are copied verbatim — so they can never drift from the engine
# the validator scores against — but they inherit their package fields and
# dependency versions from the *repository* workspace via `workspace = true`. This
# root re-supplies that inheritance so the copies build standalone inside the
# image. The values below MIRROR the repository root `Cargo.toml`'s
# `[workspace.package]`, the `[workspace.dependencies]` entries those two crates
# reference (`serde`, `serde_json`, `schemars`, `toml`), and the `[workspace.lints]`
# both crates opt into with `[lints] workspace = true`; a mismatch after a version
# bump fails the image build loudly (the Dockerfile compiles the buildkit as a
# smoke check), which is the signal to update this file.
[workspace]
resolver = "2"
members = ["foray-core", "foray-controller-sdk"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.8"

# Both copied crates opt into the workspace lint policy with `[lints] workspace =
# true`, so this root must re-supply it for the standalone build. Mirrors the
# repository root `Cargo.toml`'s `[workspace.lints.rust]` / `[workspace.lints.clippy]`.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
