<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/cabinet.svg" />
    <title>The Test Cabinet — Console</title>
    <!--
      Runtime console config. Loaded BEFORE the module script so
      window.__TCAB_CONFIG__ exists before the app boots. In a local `npm run
      dev`/`vite build` this is the committed public/config.js placeholder
      (an empty object); the tcab-web container image overwrites /config.js at
      start with the backend/auth URLs envsubst'd from its environment.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
