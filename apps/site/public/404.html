<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Test Cabinet</title>
    <script>
      // GitHub Pages has no server-side routing: a deep link such as
      // /runs/<id> is served this 404 page. Stash the requested location and
      // redirect to the app root, where main.tsx restores it client-side.
      sessionStorage.setItem(
        "spaPath",
        location.pathname + location.search + location.hash,
      );
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
