# The short-link resolver behind tcab.ai.
#
# Deployed with `npm run deploy -w @test-cabinet/edge` (wrangler), not by a
# git-connected build: it is a Worker rather than a Pages project, and it has no
# build output to publish beyond the bundled script. See
# `apps/docs/src/content/docs/development/releasing.md`.
#
# It holds no state. The share index it resolves against is an asset of the gallery
# deployment, fetched over HTTP and edge-cached, so there is no KV namespace, no
# database, and nothing to redeploy when a run is published — the gallery rebuild
# that publishes the run is what makes its link resolvable.

name = "tcab-short-links"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Both the apex and www, so a link pasted either way resolves. `zone_name` is the
# registrable domain the route is attached to.
#
# The apex is PROD's, and only prod's. Staging gets its own hostname under the
# same zone (below) rather than sharing this one, for the same reason the two
# environments have separate namespaces everywhere else: a short code addresses one
# corpus of published runs, so a code resolved against the wrong environment points
# at a different run or at none. A shared apex would make that a coin flip.
routes = [
  { pattern = "tcab.ai/*", zone_name = "tcab.ai" },
  { pattern = "www.tcab.ai/*", zone_name = "tcab.ai" },
]

[vars]
# The gallery every link resolves to, and the origin the share index is read from.
# Overridden per environment below.
GALLERY_ORIGIN = "https://testcabinet.ai"

# The staging resolver: a separate script on a separate hostname, resolving against
# the staging gallery's own share index. Staging mirrors prod, so sharing has to
# work there too — it is where a share link is verified before the change reaches
# the live short domain.
#
# `staging.tcab.ai` rather than a second apex. The short apex is what buys a link
# its shortness, and that only matters for links people actually share; a staging
# link is shared with a developer or pasted into a test, where nine more characters
# cost nothing.
#
# Deployed with `npm run deploy:staging -w @test-cabinet/edge`.
[env.staging]
name = "tcab-short-links-staging"
routes = [{ pattern = "staging.tcab.ai/*", zone_name = "tcab.ai" }]

[env.staging.vars]
# The staging gallery. It is a Pages project of its own with no custom domain, so
# this is its `*.pages.dev` address rather than a subdomain of the prod gallery —
# which is what the previous value assumed, and which does not exist.
GALLERY_ORIGIN = "https://the-test-cabinet-staging.pages.dev"
