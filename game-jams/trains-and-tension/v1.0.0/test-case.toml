slug = "trains-and-tension"
experimental = true
# The Test Cabinet game-jam manifest.
#
# A game jam is unlike every other test case: it seeds NO specification and NO
# reference mockups. It hands the model only a THEME and asks it to conceive and
# build a complete game of any genre that is playable and enjoyable, producing its
# own 2D assets during the run exactly as a full-stack case does. There is nothing
# to reproduce and no rubric to satisfy point-for-point; the run is judged by a
# human who plays it and grades it on general categories (see the review model
# below). Because of that, a jam manifest declares none of the `[[spec]]`,
# `[[reference]]`, or `[[domain]]` tables a spec-driven case does — resolution
# rejects them here.

# Human-readable display name.
name = "Trains & Tension"

# Test type. `game-jam` schedules the run onto the same `test-cabinet-full-stack-2d`
# image a full-stack case uses (the six asset-generation binaries — `draw`,
# `draw-sheet`, `particle-2d`, `sfx-synth`, `sfx-sample`, `music` — on `PATH`), so
# the model produces the game's own art, effects, and audio during the run. What
# differs from `full-stack` is that no specification is seeded: the prompt is a
# theme brief, and the standing game-jam preamble (prepended by the harness) tells
# the model to invent and finish a playable, enjoyable game. A root identity field.
type = "game-jam"

# Jams are not tiered like the spec-driven cases; `difficulty` is a required field
# surfaced on the site, kept at `medium` as a neutral middle. A jam is judged on the
# game it inspires, not on hitting a difficulty bar.
difficulty = "medium"

# Free-form classification tags, surfaced on the site for browsing and search.
tags = ["game-jam", "trains", "tension", "2d", "open-genre"]

# Short site-facing abstract, shown on the jam card. NOT seeded.
summary = """
A game jam on the theme TRAINS & TENSION. Build a complete, playable, enjoyable \
game of any genre — the only brief is the theme; the design is yours to invent — \
and produce its own art, effects, and sound during the run."""

# Site-facing prose describing the jam, relative to this version folder. NOT seeded
# into a run; it introduces the jam on the site.
description = "description.md"
# Per-version changelog entry (Markdown, relative to this version folder). The site
# aggregates every version's entry, newest first. Like `description`, NOT seeded.
changelog = "changelog.md"

# The theme brief handed to the model, rendered per run. It states the theme and
# the two things that are judged (playable, enjoyable); the harness auto-prepends
# the standing game-jam quality/scope preamble, so this template does not restate
# it. Injects the absolute in-container workspace path via `{{workspace}}`.
prompt = "prompt.hbs"

# Maximum wall-clock runtime, in hours, for the harness session. A jam is a whole
# small game built from scratch — design, code, and a full asset pass — so it gets
# eight hours, matching a medium full-stack build.
max_runtime_hours = 8

# Starter workspace seeded into the run root: a `package.json` pinning Playwright as
# a dev dependency (so the model can build and verify immediately) and a
# `.gitignore`. There are no specs to seed — a jam provides only the theme.
workspace = "workspaces/base"

# Init command, run once after the workspace is seeded and before the harness
# starts: install dependencies and download Playwright's Chromium (the base image
# ships the OS libraries Chromium links against, but not the browser binary).
init = "npm install && npx playwright install chromium"

# Exactly one variant runs per run. A jam variant is a bare theme selector — it
# seeds no specs and declares no references or domains — so this single default
# variant carries only its identity. Additional variants could offer sub-themes.
variants = [
  "variants/base.toml",
]

# How the validator (and the per-run Cloudflare Pages deploy) turns the produced
# game into a served static site — the same fixed build interface a full-stack case
# uses. Both commands are required. `npm ci` requires the build to commit a
# `package-lock.json`.
[build]
install = "npm ci"
build = "npm run build"

# NOTE: no `[[spec]]`, `[[reference]]`, `[[domain]]`, or `[[review_item]]` tables.
# A jam seeds no specification and no reference mockups, and it is reviewed on the
# GENERIC graded checklist (Playability, Fun, Theme, Presentation, Audio, Polish,
# Creativity) that core injects when a jam declares no categories of its own, plus a
# whole-game overall grade the reviewer supplies. A future jam may author its own
# `[[review_item]]` categories to weight or specialize them.
