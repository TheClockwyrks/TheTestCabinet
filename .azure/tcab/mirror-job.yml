# GitHub holds a force-pushed mirror that only this job writes to, so the
# mirror holds gated commits and nothing else. The main pipeline pushes a
# master, staging or nightly commit once every check job passed
# (.azure/project/jobs.yml); the release pipeline pushes a tag once its release
# jobs did. scripts/ci/mirror.sh says what a push of a branch and of a tag is.
#
# `github-mirror-key` is a secure file: a deploy key with write access to the
# GitHub mirror and nothing else.

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()

jobs:
  - job: mirror
    displayName: GitHub mirror
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    steps:
      # GitHub refuses a push from a shallow clone, and a branch carries its tags.
      - checkout: self
        fetchDepth: 0
        fetchTags: true
        submodules: false
      - task: DownloadSecureFile@1
        name: mirrorKey
        displayName: Fetch the mirror's deploy key
        inputs:
          secureFile: github-mirror-key
      - script: scripts/ci/mirror.sh "$(mirrorKey.secureFilePath)" "$(Build.SourceBranch)"
        displayName: Push to the GitHub mirror
