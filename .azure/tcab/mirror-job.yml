# GitHub holds a mirror that only this job writes to, so the mirror holds gated
# commits and nothing else. The main pipeline pushes a master, staging or
# nightly commit once every check job passed (.azure/project/jobs.yml); the
# release pipeline pushes a tag once its release jobs did.
# scripts/ci/mirror.sh says what a push of a branch and of a tag is, and how it
# refuses one that would not move the mirror forward.
#
# THE TARGET is `url`, which has to be a mirror the repository's
# .nyxsis/mirrors.toml declares when that file declares any. A pipeline that
# passes no `url` carries no mirror job at all, not one that is skipped, so a
# pipeline copied into a new repository pushes nowhere until its own target is
# written here, and never needs the deploy key it has not been given.
#
# `secureFile` is the secure file holding a deploy key with write access to that
# mirror and nothing else. GitHub refuses one key on two repositories, so each
# mirror has its own; this repository's is `github-mirror-key`.
#
# THE OVERRIDE. The script refuses a push when the mirror's branch is not an
# ancestor of the new head, or a tag there names another object. Queue a run
# with the pipeline variable `mirrorAllowRewrite` set to `true` to push over the
# mirror anyway. Unset, the macro reaches the script unexpanded, which is not
# `true`, so the guard holds.
#
# `continueOnError` turns a failed push into a warning: the job ends
# SucceededWithIssues instead of failed. A pipeline passes `true` when the job
# sits in a stage that a stage the mirror is not an input to depends on, such as
# the main pipeline's gates stage, which the staging publish and deploy wait
# on. A refusal (a re-run of an older run, a branch rewritten here, a tag moved
# after it was mirrored) then leaves the mirror untouched and the warning on the
# run, and does not hold back a deploy of a commit that passed every check.

parameters:
  - name: url
    type: string
    default: ""
  - name: secureFile
    type: string
    default: github-mirror-key
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  - name: continueOnError
    type: boolean
    default: false

jobs:
  - ${{ if ne(parameters.url, '') }}:
      - job: mirror
        displayName: GitHub mirror
        dependsOn: ${{ parameters.dependsOn }}
        condition: ${{ parameters.condition }}
        steps:
          # GitHub refuses a push from a shallow clone, a branch carries its
          # tags, and the guard needs the mirror's head in the local history.
          - checkout: self
            fetchDepth: 0
            fetchTags: true
            submodules: false
          - task: DownloadSecureFile@1
            name: mirrorKey
            displayName: Fetch the mirror's deploy key
            inputs:
              secureFile: ${{ parameters.secureFile }}
          - script: >-
              scripts/ci/mirror.sh --url '${{ parameters.url }}'
              "$(mirrorKey.secureFilePath)" "$(Build.SourceBranch)"
            displayName: Push to the GitHub mirror
            continueOnError: ${{ parameters.continueOnError }}
            env:
              MIRROR_ALLOW_REWRITE: $(mirrorAllowRewrite)
