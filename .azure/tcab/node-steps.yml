# The steps that give a job the Node the dev container pins and, when asked, the
# installed npm workspace: scripts/ci/provision-node.sh into a directory under the
# pipeline workspace, which puts Node on PATH for the job's later steps, then
# scripts/ci/npm-install.sh, an `npm ci` from the lockfile.
#
# Every project job that needs `node` takes these: the jobs that compile Rust
# (through .azure/tcab/rust-job-steps.yml, and the template's `rust` job through
# .azure/project/setup-steps.yml), the audio store build and the docs deploy.
# Nothing here is cached: the download is one tarball of about 30 MB.

parameters:
  # Install the npm workspace too, for a job whose tests or build read it.
  - name: npmInstall
    type: boolean
    default: false

steps:
  - script: scripts/ci/provision-node.sh "$(Pipeline.Workspace)/node"
    displayName: Provision Node

  - ${{ if parameters.npmInstall }}:
      - script: scripts/ci/npm-install.sh
        displayName: Install the npm workspace
