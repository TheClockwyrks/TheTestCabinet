# gg's static musl binaries, one job per architecture, each built natively, and
# kept as the run's `gg-<arch>` artifact. The main pipeline builds them on
# master and staging for the run images (.azure/project/jobs.yml) and for the
# upload on master; the release pipeline builds them on a tag, where each also
# fails when `gg --version` differs from the tag.
#
# The amd64 leg runs inside the Rust CI image. The arm64 leg runs on the
# organisation's arm64 pool, for which no CI image is built: it installs the
# musl toolchain, Ruby and rustup there, and both legs then provision gg's
# toolchains and Node through the same steps and script, cached per flavor.

parameters:
  # The Rust CI image the amd64 leg runs in.
  - name: rustImage
    type: string
  # The organisation's arm64 agent pool.
  - name: arm64Pool
    type: string
  # The architectures to build, comma-separated.
  - name: architectures
    type: string
    default: amd64,arm64
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  # Fail when the binary's version is not the tag's (a tag build only).
  - name: versionGate
    type: boolean
    default: false

jobs:
  - ${{ each arch in split(parameters.architectures, ',') }}:
      - job: gg_${{ arch }}
        displayName: "gg: static build (${{ arch }})"
        dependsOn: ${{ parameters.dependsOn }}
        condition: ${{ parameters.condition }}
        timeoutInMinutes: 120
        ${{ if eq(arch, 'amd64') }}:
          container:
            image: ${{ parameters.rustImage }}
            endpoint: the-test-cabinet-acr
          variables:
            CARGO_HOME: $(Pipeline.Workspace)/ci-cache/cargo-home
            CARGO_INCREMENTAL: 0
            CARGO_PROFILE_DEV_DEBUG: line-tables-only
        ${{ else }}:
          pool:
            name: ${{ parameters.arm64Pool }}
        steps:
          - ${{ if eq(arch, 'amd64') }}:
              - template: rust-job-steps.yml
                parameters:
                  targetKey: 'cargo-target-gg-dist | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
                  targetRestoreKeys: 'cargo-target-gg-dist | v1 | "$(Agent.OS)" | rust-toolchain.toml'
          - ${{ else }}:
              - checkout: self
                fetchDepth: 1
              # musl-gcc links the C that `ring` and `wasmtime` compile for the
              # musl target, and gg's Ruby arm reflects its catalogue with YARD.
              - script: sudo apt-get update && sudo apt-get install -y musl-tools ruby
                displayName: Install the musl toolchain and Ruby
              - script: |
                  set -euo pipefail
                  if ! command -v rustup >/dev/null 2>&1; then
                    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                      | sh -s -- -y --profile minimal --default-toolchain none
                    echo "##vso[task.prependpath]$HOME/.cargo/bin"
                  fi
                displayName: Install rustup
              - script: rustup show
                displayName: Show Rust toolchain
              - template: gg-toolchains-steps.yml
                parameters:
                  flavor: host

          - script: scripts/ci/gg-dist.sh "$(Build.ArtifactStagingDirectory)/gg"
            displayName: Build gg (static musl)

          - ${{ if parameters.versionGate }}:
              - script: >-
                  scripts/ci/gg-version-gate.sh
                  "$(Build.ArtifactStagingDirectory)/gg/gg-$(uname -m)-unknown-linux-musl"
                  "$(Build.SourceBranch)"
                displayName: gg version matches the tag

          - publish: $(Build.ArtifactStagingDirectory)/gg
            artifact: gg-${{ arch }}
            displayName: Keep gg for the later jobs
