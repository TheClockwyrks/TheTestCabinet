# The steps that give a job everything building or testing this workspace's
# Rust needs beyond the Rust CI image: Node, gg's program-language and C# build
# toolchains, and the npm workspace. The template's `rust` job takes them
# through .azure/project/setup-steps.yml, and every project job that compiles
# Rust through .azure/tcab/rust-job-steps.yml or directly.
#
# scripts/ci/gg-ci-toolchains.sh does the work, and its header is the argument:
# it installs into one directory, which this cache saves and restores whole, and
# links the places under $HOME the installers write to into it. Every job using
# these steps restores and saves the same entry, so whichever job succeeds
# first warms the others, the template's `rust` job included. Cache@2 saves only
# when its key missed and the job succeeded.
#
# The key names every file that decides what is installed: the installers and
# their download helper, gg's shared build shell, every arm's version pin, the
# lock each npm-delivered build tool's tree is installed from, the Rust
# toolchain the wasm standard library follows, the Node pin in
# .devcontainer/docker-compose.yml, and the provisioner. `flavor` separates the
# Rust CI image's jobs from host jobs, whose home directory and account differ.
#
# `nodeOnly` provisions Node alone, uncached: a job that compiles no gg and
# only needs `node` on PATH downloads the one tarball rather than restoring
# gg's 3.4 GB.

parameters:
  - name: nodeOnly
    type: boolean
    default: false
  - name: flavor
    type: string
    default: rust-ci-image
    values:
      - rust-ci-image
      - host

steps:
  - ${{ if parameters.nodeOnly }}:
      - script: scripts/ci/gg-ci-toolchains.sh "$(Pipeline.Workspace)/gg-toolchains" --node-only
        displayName: Provision Node

  - ${{ else }}:
      - task: Cache@2
        displayName: Restore gg's toolchains
        inputs:
          key: 'gg-toolchains | v1 | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "${{ parameters.flavor }}" | scripts/ci/install-*.sh, scripts/ci/fetch.sh, scripts/gg-*.sh, packages/gg-sandbox-*/*-version.sh, scripts/gg-npm-locks/**/package-lock.json | rust-toolchain.toml | .devcontainer/docker-compose.yml | scripts/ci/gg-ci-toolchains.sh'
          path: $(Pipeline.Workspace)/gg-toolchains

      - script: scripts/ci/gg-ci-toolchains.sh "$(Pipeline.Workspace)/gg-toolchains"
        displayName: Provision Node and gg's toolchains

      # Building crates/gg reflects two of its catalogues with the pinned
      # `typescript` that lives in the npm workspace.
      - script: scripts/ci/npm-install.sh
        displayName: Install the npm workspace
