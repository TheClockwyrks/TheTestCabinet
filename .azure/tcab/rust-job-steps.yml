# The first steps of every project job that compiles Rust inside the Rust CI
# image, in the order the template's `rust` job takes them: the checkout, the
# disk reclaim, the cargo registry, the job's own build output, and then gg's
# toolchains and Node (.azure/tcab/gg-toolchains-steps.yml).
#
# The registry cache is the template `rust` job's exact entry: same key, same
# path. A job including these steps also names the job variables that job
# names (CARGO_HOME under $(Pipeline.Workspace)/ci-cache, CARGO_INCREMENTAL 0,
# CARGO_PROFILE_DEV_DEBUG line-tables-only) and runs in the image
# ci/images/tags.yml pins, so what it compiles has the fingerprints the
# template job's would, and a build output it saves under a key the template
# job's restore keys match is one that job reuses.
#
# The disk reclaim is the project's free-disk-linux.sh, on the agent. It
# removes what the template's free-disk.sh does and /usr/local/lib/android too,
# and it runs before any cache is restored, which the template job cannot do.

parameters:
  # The build output's cache: its key, the prefix a miss restores from, and
  # the variable a step reads to tell an exact hit (`true`) from the rest.
  - name: targetKey
    type: string
  - name: targetRestoreKeys
    type: string
  - name: targetCacheHitVar
    type: string
    default: ""
  # Node alone rather than gg's toolchains, for a job that compiles no gg.
  - name: nodeOnly
    type: boolean
    default: false

steps:
  - checkout: self
    fetchDepth: 1
    clean: true

  - script: scripts/ci/free-disk-linux.sh
    displayName: Reclaim agent disk
    target: host

  - task: Cache@2
    displayName: Restore the cargo registry
    inputs:
      key: 'cargo-home | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
      restoreKeys: |
        cargo-home | v1 | "$(Agent.OS)" | rust-toolchain.toml
      path: $(Pipeline.Workspace)/ci-cache

  - task: Cache@2
    displayName: Restore the build output
    inputs:
      key: ${{ parameters.targetKey }}
      restoreKeys: ${{ parameters.targetRestoreKeys }}
      path: target
      ${{ if ne(parameters.targetCacheHitVar, '') }}:
        cacheHitVar: ${{ parameters.targetCacheHitVar }}

  - template: gg-toolchains-steps.yml
    parameters:
      nodeOnly: ${{ parameters.nodeOnly }}
