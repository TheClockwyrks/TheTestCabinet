# gg's release artifacts, uploaded to the `gg-releases` blob container: the
# binaries both `gg_<arch>` jobs of the same run kept, and the reference
# documents the amd64 leg packed. scripts/ci/publish-gg.sh re-runs the version
# gate on a tag before it writes anything, so a tag whose gg reports another
# version uploads nothing. The main pipeline runs it on master
# (.azure/project/stages.yml), the release pipeline on a tag.
#
# `tcab-gg-publish` is an Azure Resource Manager connection (workload identity
# federation) holding Storage Blob Data Contributor on testcabinetartifacts,
# and nothing else.

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  - name: architectures
    type: string
    default: amd64,arm64

jobs:
  - job: gg_publish
    displayName: "gg: upload to gg-releases"
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    steps:
      - checkout: self
        fetchDepth: 1
      - ${{ each arch in split(parameters.architectures, ',') }}:
          - download: current
            artifact: gg-${{ arch }}
            displayName: Fetch gg (${{ arch }})
      - task: AzureCLI@2
        displayName: Upload gg's binaries and reference documents
        inputs:
          azureSubscription: tcab-gg-publish
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            dist="$(Agent.TempDirectory)/gg"
            mkdir -p "$dist"
            # By name, not by glob. Both architectures pack a
            # `gg-reference.tar.gz` (scripts/ci/gg-dist.sh projects the
            # documents on each, so the command is gated on each), and the
            # documents are architecture-independent, so a glob would copy two
            # files onto one name and whichever landed last would win in
            # silence. These three are exactly what publish-gg.sh uploads.
            cp "$(Pipeline.Workspace)/gg-amd64/gg-x86_64-unknown-linux-musl" "$dist"/
            cp "$(Pipeline.Workspace)/gg-arm64/gg-aarch64-unknown-linux-musl" "$dist"/
            cp "$(Pipeline.Workspace)/gg-amd64/gg-reference.tar.gz" "$dist"/
            scripts/ci/publish-gg.sh "$dist" "$(Build.SourceBranch)"
