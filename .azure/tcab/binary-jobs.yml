# The two jobs that validate the shipped `tcab` binary: each release-builds the
# CLI and its tests, runs them, and smoke-runs the produced binary, on Linux
# and on Windows. The main pipeline runs them as check jobs on every branch
# (.azure/project/jobs.yml); the release pipeline (azure-pipelines-release.yml)
# runs them on a tag and keeps the smoke-tested binary as the run's
# `tcab-<platform>` artifact, which is how a release of `tcab` is published.
#
# Two jobs rather than a matrix, because only the Linux leg runs inside the Rust
# CI image. Its tests look for `node`, which the image does not carry, so it
# provisions Node alone: nothing here builds gg.

parameters:
  # The Rust CI image the Linux leg runs in.
  - name: rustImage
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  # Keep each binary as an artifact of the run.
  - name: publish
    type: boolean
    default: false

jobs:
  - job: binary_linux
    displayName: "Binary: release build & smoke (linux)"
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    timeoutInMinutes: 90
    container:
      image: ${{ parameters.rustImage }}
      endpoint: the-test-cabinet-acr
    variables:
      CARGO_HOME: $(Pipeline.Workspace)/ci-cache/cargo-home
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Retries the CI image pull (.azure/project/jobs.yml says why).
      VSTSAGENT_DOCKER_ACTION_RETRIES: "true"
    steps:
      - template: rust-job-steps.yml
        parameters:
          targetKey: 'cargo-target-release | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
          targetRestoreKeys: 'cargo-target-release | v1 | "$(Agent.OS)" | rust-toolchain.toml'
          nodeOnly: true

      # The release build fetches only the crates the CLI links, and the
      # registry this job saves is the entry every Rust job restores. Fetching
      # the whole lockfile first keeps a save from this job complete.
      - script: cargo fetch --locked
        displayName: Fetch the workspace's crates

      - script: scripts/ci/release-build.sh
        displayName: Release build
      - script: scripts/ci/release-test.sh
        displayName: Release tests
      - script: scripts/ci/release-doctest.sh
        displayName: Release doctests
      - script: scripts/ci/binary-smoke.sh
        displayName: Smoke

      - ${{ if parameters.publish }}:
          - script: |
              set -euo pipefail
              mkdir -p tcab-dist
              cp target/release/tcab tcab-dist/
            displayName: Stage the tcab binary
          - publish: tcab-dist
            artifact: tcab-linux
            displayName: Publish tcab

      - script: scripts/ci/cargo-target-prune.sh
        displayName: Prune the linked binaries before the cache save

  - job: binary_windows
    displayName: "Binary: release build & smoke (windows)"
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    pool:
      vmImage: windows-2022
    variables:
      # A CARGO_HOME under the workspace, so the cache has a path the agent
      # can name (the predefined $(HOME) is not set on Windows agents).
      CARGO_HOME: $(Pipeline.Workspace)/.cargo
    steps:
      - checkout: self
        fetchDepth: 1
      - task: Cache@2
        displayName: Cache cargo home
        inputs:
          key: 'cargo-home-release | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-home-release | "$(Agent.OS)"
          path: $(CARGO_HOME)
      - task: Cache@2
        displayName: Cache cargo target
        inputs:
          key: 'cargo-target-release | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-target-release | "$(Agent.OS)"
          path: target
      - script: rustup show
        displayName: Show Rust toolchain
      # `bash` runs Git Bash on the Windows agent, so the same scripts drive
      # both legs, the cross-platform nextest install included.
      - bash: scripts/ci/install-nextest.sh
        displayName: Install cargo-nextest
      - bash: scripts/ci/release-build.sh
        displayName: Release build
      - bash: scripts/ci/release-test.sh
        displayName: Release tests
      - bash: scripts/ci/release-doctest.sh
        displayName: Release doctests
      - bash: scripts/ci/binary-smoke.sh
        displayName: Smoke
      - ${{ if parameters.publish }}:
          # Staged inside the checkout, because Git Bash would have to
          # translate the staging directory's drive-letter path.
          - bash: |
              set -euo pipefail
              mkdir -p tcab-dist
              cp target/release/tcab.exe tcab-dist/
            displayName: Stage the tcab binary
          - publish: tcab-dist
            artifact: tcab-windows
            displayName: Publish tcab
      - bash: scripts/ci/cargo-target-prune.sh
        displayName: Prune the linked binaries before the cache save
