# The project's own steps in the deployment job of azure-pipelines.yml, which
# includes them twice: before `scripts/ci/deploy.sh` rolls the staging overlay
# onto the commit, given `before`, and after it, given `after`.
#
# Work the deployed server needs before it starts, such as publishing a file
# it serves, goes before; work that follows a deployment whatever became of it,
# such as removing what no deployment names any more, goes after, on
# `succeededOrFailed()`. Work that needs the rolled-out server itself goes in
# `scripts/ci/post-deploy.sh`, which the deploy script runs once the rollout is
# ready. A deployment job downloads every artifact of the run under
# `$(Pipeline.Workspace)` before its first step. A step signing in to Azure
# does so through the `serviceConnection` parameter the job hands in, not the
# pipeline's variable of that name: a steps template is expanded before the
# pipeline's variables are, so the variable is empty here. For example:
#
#   steps:
#     - ${{ if eq(parameters.phase, 'before') }}:
#         - task: AzureCLI@2
#           displayName: An example
#           inputs:
#             azureSubscription: ${{ parameters.serviceConnection }}
#             scriptType: bash
#             scriptLocation: inlineScript
#             inlineScript: scripts/ci/example.sh

parameters:
  - name: phase
    type: string
    values:
      - before
      - after
  # The service connection a step signs in through, which the deployment job
  # names from the pipeline's serviceConnection variable.
  - name: serviceConnection
    type: string

steps:
  # Before the template's deploy.sh applies overlays/staging, which pins and
  # waits on the backend alone: scripts/ci/pre-deploy.sh pins the other seven
  # Test Cabinet images and the dispatcher's image and registry environment in
  # the overlay to the same commit, gives the rollout wait 600 seconds
  # (THE_TEST_CABINET_ROLLOUT_TIMEOUT), records the commit the cluster ran
  # before (TCAB_PREVIOUS_COMMIT) for scripts/ci/post-deploy.sh, and retires
  # the backend Deployment of its old name, which holds the backend's disk.
  - ${{ if eq(parameters.phase, 'before') }}:
      - task: AzureCLI@2
        displayName: Pin every image and retire the old backend
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: scripts/ci/pre-deploy.sh staging "$(Build.SourceVersion)"
        env:
          THE_TEST_CABINET_RESOURCE_GROUP: $(resourceGroup)
          THE_TEST_CABINET_CLUSTER: $(cluster)
          THE_TEST_CABINET_NAMESPACE: tcab-staging

  # Only when the deployment failed: scripts/ci/post-deploy.sh settles the
  # other workloads after a rollout that succeeded. This diagnoses the Test
  # Cabinet's pods (`app.kubernetes.io/part-of=test-cabinet`, which the
  # template's own diagnostics do not select), waits on and undoes the siblings
  # the failed apply rolled, and prints the command that recovers the backend.
  - ${{ if eq(parameters.phase, 'after') }}:
      - task: AzureCLI@2
        displayName: Diagnose and undo a failed deployment
        condition: failed()
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: scripts/ci/settle-workloads.sh --after-failure "$(Build.SourceVersion)"
        env:
          THE_TEST_CABINET_RESOURCE_GROUP: $(resourceGroup)
          THE_TEST_CABINET_CLUSTER: $(cluster)
          THE_TEST_CABINET_NAMESPACE: tcab-staging

      # Whatever became of the deployment: scripts/ci/registry-purge.sh
      # deletes the service and run images no environment runs any more. It
      # runs after, because only then has the cluster moved on to this commit;
      # it may not fail the deployment, because what it removes is a bill and
      # not a rollout, and a delete that fails is tried again next time. It
      # keeps what both clusters run, this commit, and the newest commit in
      # the registry.
      - task: AzureCLI@2
        displayName: Delete the images no environment runs
        condition: succeededOrFailed()
        continueOnError: true
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: scripts/ci/registry-purge.sh --keep "$(Build.SourceVersion)"
