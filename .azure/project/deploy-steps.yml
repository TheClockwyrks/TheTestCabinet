# The project's own steps in the deployment job of azure-pipelines.yml, which
# includes them twice: before `scripts/ci/deploy.sh` rolls the staging overlay
# onto the commit, given `before`, and after it, given `after`. It belongs to
# the project: the template rendered it empty once and never renders over it.
#
# Work the deployed server needs before it starts, such as publishing a file
# it serves, goes before; work that follows a deployment whatever became of it,
# such as removing what no deployment names any more, goes after, on
# `succeededOrFailed()`. Work that needs the rolled-out server itself goes in
# `scripts/ci/post-deploy.sh`, which the deploy script runs once the rollout is
# ready. A deployment job downloads every artifact of the run under
# `$(Pipeline.Workspace)` before its first step. A step signing in to Azure
# does so through the `serviceConnection` parameter the job hands in, not the
# pipeline's variable of that name: a steps template is expanded before the
# pipeline's variables are, so the variable is empty here. For example:
#
#   steps:
#     - ${{ if eq(parameters.phase, 'before') }}:
#         - task: AzureCLI@2
#           displayName: An example
#           inputs:
#             azureSubscription: ${{ parameters.serviceConnection }}
#             scriptType: bash
#             scriptLocation: inlineScript
#             inlineScript: scripts/ci/example.sh

parameters:
  - name: phase
    type: string
    values:
      - before
      - after
  # The service connection a step signs in through, which the deployment job
  # names from the pipeline's serviceConnection variable.
  - name: serviceConnection
    type: string

steps: []
