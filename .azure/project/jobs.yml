# The project's own jobs in the gates stage, which azure-pipelines.yml includes
# after the template's rust and web jobs.
#
# A job here runs beside the template's unless it names them in `dependsOn`,
# and on the hosted agent unless it names a `container:`. For example, a job
# that runs once both gate tracks passed on `master`:
#
#   jobs:
#     - job: example
#       dependsOn:
#         - rust
#         - web
#       condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
#       steps:
#         - checkout: self
#         - script: scripts/example.sh

# Every project job that compiles Rust in a container runs in the template's
# Rust CI image, at the commit ci/images/tags.yml pins as `ciImageTag`: the
# pipeline includes that file in its variables before it includes this one,
# so the same compile-time expression the template's `rust` job names its
# image with resolves here. The `ci-image-pins` gate holds every image this
# file and the release pipeline name to that expression, so no job can pin an
# image of its own and fall out of step with the template's caches.

parameters:
  # The Rust CI image the amd64 container jobs below run in, which
  # azure-pipelines.yml names as the template's `rust` job names its own,
  # `<repository>:${{ variables.ciImageTag }}`, and passes here: a template
  # cannot read that variable itself, and the `ci-image-pins` gate holds every
  # file under .azure/ to taking the image as a parameter rather than naming
  # one.
  - name: rustImage
    type: string
  # The organisation's arm64 agent pool, which every arm64 build runs on
  # natively. The clusters' nodes are arm64 and a hosted agent is x86_64, and
  # the run images compile Rust and wasm inside their builds, which is far too
  # slow emulated.
  - name: arm64Pool
    type: string
    default: pool-dev-linux-arm64-wus3-4c-eph-01
  # The two architectures every image is built for.
  - name: architectures
    type: string
    default: amd64,arm64
  # Every submodule .gitmodules declares, as its path and the name of its
  # repository in this project. The `submodule_pins` job checks each one out,
  # which is what puts it in the scope of the job's access token, so an entry
  # missing here fails that job's fetch. scripts/ci/submodules.sh check holds
  # this list to .gitmodules, and the shell-tests gate runs it.
  - name: submodules
    type: object
    default:
      - path: cold-storage
        repository: cold-storage
      - path: test-suites
        repository: test-suites
      - path: contracts
        repository: contracts
      - path: engines
        repository: engines
      - path: gg
        repository: gg
      - path: gg.rocks
        repository: gg.rocks
      - path: microservice-arena
        repository: microservice-arena
      - path: microservice-artifacts
        repository: microservice-artifacts
      - path: microservice-dispatcher
        repository: microservice-dispatcher
      - path: microservice-driver
        repository: microservice-driver
      - path: microservice-repos
        repository: microservice-repos
      - path: tool-model-core
        repository: tool-model-core
      - path: tool-paint
        repository: tool-paint
      - path: tool-particle
        repository: tool-particle
      - path: tool-sprite
        repository: tool-sprite
      - path: tool-voxel
        repository: tool-voxel
      - path: tool-mc
        repository: tool-mc
      - path: tool-sn
        repository: tool-sn
      - path: tool-dc
        repository: tool-dc
      - path: tool-audio-core
        repository: tool-audio-core
      - path: tool-sfx-synth
        repository: tool-sfx-synth
      - path: tool-sfx-sample
        repository: tool-sfx-sample
      - path: tool-music
        repository: tool-music
      - path: ui-common
        repository: ui-common
      - path: console.testcabinet.ai
        repository: console.testcabinet.ai

jobs:
  # THE CHECK JOBS, beside the template's `rust` and `web`, on every branch:
  #
  #   rust_build         every target linked, and the rust job's cache seeded
  #   submodule_pins     every submodule pin is on the submodule's branch of
  #                      the same name, or on its master
  #
  # The Rust ones run in the template's Rust CI image, with the template rust
  # job's variables and registry cache (.azure/tcab/rust-job-steps.yml).
  #
  # WHICH OF THEM A PULL REQUEST RUNS. A push runs every check job. A pull
  # request runs the ones its change reaches, which the `paths` job below
  # decides first: scripts/ci/changed-paths.sh diffs the merge commit against
  # its first parent, the target branch, and sets `detect.rust` and
  # `detect.submodules`. Each check job depends on `paths` and conditions on
  # its variable; a path the script has no rule for reaches everything. The
  # template's `rust` and `web` jobs take no condition from here and run on
  # every pull request. The `checks` join accepts a skipped check job only when
  # `paths` succeeded, so a failed `paths` job fails the run.
  #
  - job: paths
    displayName: "Changed paths"
    steps:
      # Two deep: a pull request's checkout is the merge of the source into
      # the target, and the script diffs it against its first parent.
      - checkout: self
        fetchDepth: 2
        submodules: false
      - script: scripts/ci/changed-paths.sh
        name: detect
        displayName: Which check jobs this change reaches
  #
  # RETRIES ON THE REGISTRY. A container job begins by pulling its CI image,
  # before any step of its own runs, and the registry answers that pull through
  # an OAuth token exchange that can time out on its side. Without a retry the
  # agent tries once and fails the job. Every container job here and under
  # .azure/tcab/ sets VSTSAGENT_DOCKER_ACTION_RETRIES, which the agent reads as
  # its `DockerActionRetries` knob and then gives each docker login, pull and
  # start three attempts ten seconds apart. It is the only thing that can retry
  # container initialisation: that runs before the first step, where
  # `retryCountOnTaskFailure` cannot reach. The template's `rust` and `web`
  # jobs cannot take a job variable from here; they are covered by the same
  # variable set as a pipeline variable on the the-test-cabinet pipeline
  # definition in Azure DevOps (scripts/ci/README.md).

  # Links every target of the workspace, which no template gate does: clippy,
  # rustdoc and nextest each stop short of linking one. It is also what warms
  # the template's `rust` job. That job saves its build output only when every
  # step of it succeeded, so a cold run that outlasts its timeout never
  # warms itself. When no seed exists for this Cargo.lock, this job runs that
  # job's clippy, rustdoc and test builds with the template gates' exact
  # commands and saves the result under a key the rust job's restore key
  # matches. A seed that fails is reported and does not fail the job.
  - job: rust_build
    displayName: "Rust: link every target & seed the rust job"
    dependsOn: paths
    condition: and(succeeded(), eq(dependencies.paths.outputs['detect.rust'], 'true'))
    timeoutInMinutes: 150
    uses:
      repositories:
        - contracts
        - engines
        - gg
        - microservice-arena
        - microservice-artifacts
        - microservice-dispatcher
        - microservice-driver
        - microservice-repos
        - tool-model-core
        - tool-paint
        - tool-particle
        - tool-sprite
        - tool-voxel
        - tool-mc
        - tool-sn
        - tool-dc
        - tool-audio-core
        - tool-sfx-synth
        - tool-sfx-sample
        - tool-music
        - ui-common
    container:
      image: ${{ parameters.rustImage }}
      endpoint: the-test-cabinet-acr
    variables:
      CARGO_HOME: $(Pipeline.Workspace)/ci-cache/cargo-home
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      VSTSAGENT_DOCKER_ACTION_RETRIES: "true"
    steps:
      - template: ../tcab/rust-job-steps.yml
        parameters:
          targetKey: 'cargo-target | v2 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock | "tcab-seed"'
          targetRestoreKeys: 'cargo-target | v2 | "$(Agent.OS)" | rust-toolchain.toml'
          targetCacheHitVar: TCAB_SEED_HIT
      - script: scripts/ci/rust-build.sh
        displayName: Build every target
      - script: scripts/ci/rust-build.sh --seed
        displayName: Seed the rust job's build output
        condition: and(succeeded(), ne(variables['TCAB_SEED_HIT'], 'true'))
        continueOnError: true
      - script: scripts/ci/cargo-target-prune.sh
        displayName: Prune the linked binaries before the cache save

  # The submodule check fetches each submodule's branches through the job token,
  # which reaches only the repositories the job names. Checking each submodule's
  # repository out is how this job names it. The pipeline declares contracts,
  # engines, gg, microservice-arena, microservice-artifacts, microservice-dispatcher, microservice-driver, microservice-repos, tool-model-core,
  # tool-paint, tool-particle, tool-sprite, tool-voxel, tool-mc, tool-sn,
  # tool-dc, tool-audio-core, tool-sfx-synth, tool-sfx-sample, tool-music,
  # test-suites and ui-common as repository resources, which the building jobs
  # name under `uses:`. It declares none for cold-storage, which only this job's
  # checkouts reach, so the template's gate jobs do not clone the baseline media,
  # and none for gg.rocks or console.testcabinet.ai, which no job builds, so
  # none names them under `uses:`.
  # With more than one checkout each repository gets a directory of its own,
  # named here. A pull request is checked against the branch it merges into, any
  # other run against the branch it built; the script reads both from the agent's
  # variables.
  - job: submodule_pins
    displayName: "Checks: submodule pins are on their branch or master"
    dependsOn: paths
    condition: and(succeeded(), eq(dependencies.paths.outputs['detect.submodules'], 'true'))
    steps:
      - checkout: self
        fetchDepth: 1
        submodules: false
        path: tcab
      - ${{ each submodule in parameters.submodules }}:
          - checkout: git://the-test-cabinet/${{ submodule.repository }}
            fetchDepth: 1
            submodules: false
            path: submodules/${{ submodule.repository }}
      - script: scripts/ci/submodule-pins.sh
        displayName: Every submodule pin is on its branch or master
        workingDirectory: $(Agent.BuildDirectory)/tcab
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # One job for "every check job passed", which the jobs below wait on. It runs
  # when `paths` and the template's two jobs succeeded and every project check
  # job either succeeded or was skipped, which with `paths` succeeded means its
  # own condition held it back; it is skipped otherwise, so a failed, cancelled
  # or timed-out check job, the template's included, stops everything after it.
  # It is agentless and does nothing, so it costs no agent.
  - job: checks
    displayName: Every check job passed
    pool: server
    dependsOn:
      - paths
      - rust
      - web
      - rust_build
      - submodule_pins
    condition: >-
      and(
        in(dependencies.paths.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.rust.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.web.result, 'Succeeded', 'SucceededWithIssues'),
        in(dependencies.rust_build.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
        in(dependencies.submodule_pins.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
      )
    steps:
      - task: Delay@1
        displayName: Nothing to wait for
        inputs:
          delayForMinutes: "0"

  # A gated master, staging or nightly commit, to GitHub. The
  # URL is the mirror .nyxsis/mirrors.toml declares, and the script refuses one
  # it does not. The job is in the gates stage, which the staging publish and
  # deploy wait on, and the mirror is no input to either, so a refused or failed
  # push is a warning on the run rather than a failed stage.
  - template: ../tcab/mirror-job.yml
    parameters:
      url: https://github.com/TheClockwyrks/TheTestCabinet
      continueOnError: true
      dependsOn:
        - checks
      condition: >-
        and(
          in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging', 'refs/heads/nightly'),
          in(dependencies.checks.result, 'Succeeded', 'SucceededWithIssues')
        )

  # THE IMAGE JOBS, on master and staging once every check job passed. They sit in the gates stage rather than a stage of their own
  # because the template's publish stage waits on this stage: the backend image
  # it retags (deployments/images/backend.Dockerfile) and every image the
  # overlays pin exist before it runs. Every image is built natively once per
  # architecture and pushed as `<image>:<commit>-<arch>`; a manifest job then
  # fuses the two into the multi-arch `<image>:<commit>` a deployment pins.
  # `latest` is never pushed. `the-test-cabinet-acr` is the Docker Registry
  # service connection holding AcrPush on the registry.
  #
  # Every registry login here retries, as does every manifest fuse: both are a
  # handful of registry round trips that are safe to repeat, and the registry's
  # OAuth token exchange is what has timed out ("Post .../oauth2/token: context
  # deadline exceeded"), which is a fact about the network and not the commit.
  # The builds themselves do not retry: a build that failed has a reason in its
  # log, and a repeat of an hours-long job would hide it.
  - ${{ each arch in split(parameters.architectures, ',') }}:
      # One job builds the service images of the architecture, on one
      # buildx builder, through scripts/ci/service-images.sh. Both are
      # targets of deployments/images/services.Dockerfile assembled from the
      # same `build` stage, one `cargo build --release` of both binaries.
      # As one job per image, each on a fresh agent with an empty builder, that
      # compile ran twice per architecture: twenty minutes each on a
      # hosted amd64 agent, ten on the arm64 pool, which runs one job at a
      # time and provisions a VM for each. On one builder it runs once and the
      # other target takes it from the builder's cache. The driver's
      # image, the run-container images and the audio store are
      # microservice-driver's, built by that repository's pipeline, the
      # artifacts service's image is microservice-artifacts' and the arena's
      # microservice-arena's and the console's console.testcabinet.ai's.
      #
      # The backend bakes the reference documents of the gg release the
      # driver pins. The `gg-release` stage of
      # deployments/images/services.Dockerfile fetches them from the release
      # container, so nothing here hands them over.
      #
      # A failed build names the service that failed and stops there; the
      # images before it are pushed. A re-run of the same commit takes every
      # stage already in the registry cache, the compiled `build` stage
      # included, so it compiles nothing that already succeeded.
      - job: services_${{ arch }}
        displayName: "Service images (${{ arch }})"
        dependsOn:
          - checks
        condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
        timeoutInMinutes: 240
        # The repositories of the submodules the build context admits, in the
        # token's scope for `submodules.sh init --build-context` below.
        uses:
          repositories:
            - contracts
            - engines
            - gg
            - microservice-arena
            - microservice-artifacts
            - microservice-dispatcher
            - microservice-driver
            - microservice-repos
            - tool-model-core
            - tool-paint
            - tool-particle
            - tool-sprite
            - tool-voxel
            - tool-mc
            - tool-sn
            - tool-dc
            - tool-audio-core
            - tool-sfx-synth
            - tool-sfx-sample
            - tool-music
            - ui-common
        pool:
          ${{ if eq(arch, 'amd64') }}:
            vmImage: ubuntu-24.04
          ${{ else }}:
            name: ${{ parameters.arm64Pool }}
        steps:
          - checkout: self
            fetchDepth: 1
          - script: scripts/ci/submodules.sh init --build-context
            displayName: The submodules the build context reads
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - ${{ if eq(arch, 'amd64') }}:
              - script: scripts/ci/free-disk-linux.sh
                displayName: Reclaim agent disk
          - task: Docker@2
            displayName: Log in to the registry
            retryCountOnTaskFailure: 2
            inputs:
              command: login
              containerRegistry: the-test-cabinet-acr
          - script: scripts/ci/service-images.sh "$(Build.SourceVersion)"
            displayName: Build and push every service image
          # The builder holds the compile's cache mounts and every image's
          # layers for the whole job; this reading says what that came to, so
          # the next disk failure arrives with a figure. Diagnostic, so a
          # failed build still reports it.
          - script: scripts/ci/report-disk.sh "after the service images"
            displayName: Disk after the service images
            condition: always()

  - job: services_manifest
    displayName: "Service images: multi-arch tags"
    dependsOn:
      - ${{ each arch in split(parameters.architectures, ',') }}:
          - services_${{ arch }}
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    steps:
      - checkout: self
        fetchDepth: 1
      - task: Docker@2
        displayName: Log in to the registry
        retryCountOnTaskFailure: 2
        inputs:
          command: login
          containerRegistry: the-test-cabinet-acr
      - script: >-
          scripts/ci/manifest.sh "$(Build.SourceVersion)"
          tcab-backend
          tcab-publisher
        displayName: Fuse the architectures
        retryCountOnTaskFailure: 2
