# The project's own steps for each job of azure-pipelines-ci-images.yml, which
# includes them at the end of the job, once its image is built and pushed. It
# belongs to the project: the template rendered it empty once and never
# renders over it.
#
# `image` names the track whose image the job built: `rust` or `web`. It lists no
# values, because this file is rendered once and an image a later answer adds
# passes its own name here too. The steps run on the hosted agent, signed in to
# the registry. What runs is the one step below: scripts/ci/ci-image-purge.sh
# removes the track's images no branch pins any more, with the job's token so
# it can fetch the live branches' ci/images/tags.yml.

parameters:
  - name: image
    type: string

steps:
  - script: scripts/ci/ci-image-purge.sh ${{ parameters.image }}
    displayName: Delete the CI images no branch pins
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
