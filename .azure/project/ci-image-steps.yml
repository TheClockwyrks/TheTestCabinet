# The project's own steps for each job of azure-pipelines-ci-images.yml, which
# includes them at the end of the job, once its image is built and pushed.
#
# `image` names the track whose image the job built: `rust`, `rust-browser` or
# `web`. It lists no values, so a track added later passes its own name here
# too. The steps run on the hosted agent, signed in to the registry. What runs
# is the one step below: scripts/ci/ci-image-purge.sh removes the track's images
# no branch pins any more, with the job's token so it can fetch the live
# branches' ci/images/tags.yml.

parameters:
  - name: image
    type: string

steps:
  - script: scripts/ci/ci-image-purge.sh ${{ parameters.image }}
    displayName: Delete the CI images no branch pins
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
