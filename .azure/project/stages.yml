# The project's own stages, which azure-pipelines.yml includes after the
# template's gates, publish and deploy stages. It belongs to the project:
# the template rendered it empty once and never renders over it.
#
# A stage here depends on the stage before it unless it says otherwise, and
# runs on `succeeded()` unless it names a condition. For example:
#
#   stages:
#     - stage: example
#       dependsOn: gates
#       condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
#       jobs:
#         - job: example
#           steps:
#             - checkout: self
#             - script: scripts/example.sh

stages:
  # Each stage names `dependsOn: gates` and its own branch condition. Without
  # them a stage here would follow the template's deploy stage, which runs on
  # staging alone. `dependsOn: gates` with `succeeded()` means the gates stage
  # passed, image jobs included.

  # Production, from master: the same backend retag the template's publish
  # stage builds for staging, through the template's own steps, then every
  # workload rolled onto the commit. The production environment is a second
  # cluster, which the template's deploy stage cannot name, so this stage runs
  # the whole of it with scripts/ci/deploy-environment.sh, which pins every
  # image, retires the old backend Deployment, applies overlays/prod, waits on
  # every workload and undoes those that do not become ready.
  #
  # `tcab-deploy` is an Azure Resource Manager connection (workload identity
  # federation) holding AcrPush on the registry, "Azure Kubernetes Service RBAC
  # Admin" on each cluster's application namespace and the custom "Test
  # Cabinet AKS Command Invoke" role on each cluster, and nothing else.
  - stage: prod
    displayName: Production
    dependsOn: gates
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: publish_backend
        displayName: the-test-cabinet-backend
        timeoutInMinutes: 60
        steps:
          - template: ../publish-image.yml
            parameters:
              image: the-test-cabinet-backend
              dockerfile: deployments/images/backend.Dockerfile
              serviceConnection: tcab-deploy

      - deployment: deploy_prod
        displayName: Roll prod
        dependsOn: publish_backend
        environment: tcab-prod
        timeoutInMinutes: 60
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  submodules: false
                - task: AzureCLI@2
                  displayName: Apply and wait for every rollout
                  inputs:
                    azureSubscription: tcab-deploy
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: scripts/ci/deploy-environment.sh prod "$(Build.SourceVersion)"
                # As after the staging deployment: whatever became of it,
                # scripts/ci/registry-purge.sh deletes the images no
                # environment runs, keeping what both clusters run, this
                # commit and the newest commit. It may not fail the
                # deployment; a delete that fails is tried again next time.
                - task: AzureCLI@2
                  displayName: Delete the images no environment runs
                  condition: succeededOrFailed()
                  continueOnError: true
                  inputs:
                    azureSubscription: tcab-deploy
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: scripts/ci/registry-purge.sh --keep "$(Build.SourceVersion)"

  # gg's binaries and reference documents, from the `gg_<arch>` jobs of the
  # gates stage, to the `gg-releases` blob container.
  - stage: gg_release
    displayName: gg release
    dependsOn: gates
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - template: ../tcab/gg-publish-job.yml

  # The docs site, to the Cloudflare Pages project for the branch
  # (scripts/ci/deploy-docs.sh), with the Node the gates ran.
  - stage: docs
    displayName: Docs
    dependsOn: gates
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    jobs:
      - job: docs
        displayName: Docs site
        variables:
          npm_config_cache: $(Pipeline.Workspace)/.npm
          ASTRO_TELEMETRY_DISABLED: "1"
        steps:
          - checkout: self
            fetchDepth: 1
          - template: ../tcab/gg-toolchains-steps.yml
            parameters:
              nodeOnly: true
          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm
          - script: scripts/ci/deploy-docs.sh "$(Build.SourceBranchName)"
            displayName: Build and deploy the docs
            env:
              CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
