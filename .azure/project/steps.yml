# The project's own steps for each job of the gates stage, which
# azure-pipelines.yml includes at the end of the job, after its last check: a
# build a later stage takes, and the artifact it keeps, belong here. It belongs
# to the project: the template rendered it empty once and never renders over
# it.
#
# `job` names the job including it: `rust` or `web`. It lists no
# values, because this file
# is rendered once and a job a later answer adds passes its own name here too. A
# step for one job alone goes under a conditional insertion, for example:
#
#   steps:
#     - ${{ if eq(parameters.job, 'rust') }}:
#         - script: scripts/example.sh
#           displayName: An example
#         - publish: target/example
#           artifact: example
#
# Every step runs inside the job's CI image unless it says `target: host`. A
# step here runs on `succeeded()` unless it says otherwise, so a job whose
# checks failed runs none of it.

parameters:
  - name: job
    type: string

steps:
  # Before the template's build output cache saves `target/`: the linked test
  # binaries are most of it and cheap to link again, and the tree and the
  # archive the save writes beside it do not fit on the agent together.
  - ${{ if eq(parameters.job, 'rust') }}:
      - script: scripts/ci/cargo-target-prune.sh
        displayName: Prune the linked binaries before the cache save
