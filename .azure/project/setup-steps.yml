# The project's own setup for each job of the gates stage, which
# azure-pipelines.yml includes in the job after its checkout and its caches, and before its first check. It belongs to
# the project: the template rendered it empty once and never renders over it.
#
# `job` names the job including it: `rust` or `web`. It lists no
# values, because this file
# is rendered once and a job a later answer adds passes its own name here too. A
# step for one job alone goes under a conditional insertion, for example:
#
#   steps:
#     - ${{ if eq(parameters.job, 'rust') }}:
#         - script: scripts/example.sh
#           displayName: An example
#
# Every step runs inside the job's CI image unless it says `target: host`.

parameters:
  - name: job
    type: string

steps: []
