# The project's own setup for each job of the gates stage, which
# azure-pipelines.yml includes in the job after its checkout and its caches, and
# before its first check.
#
# `job` names the job including it: `rust` or `web`. It lists no values, so a
# job added later passes its own name here too. A step for one job alone goes
# under a conditional insertion, for example:
#
#   steps:
#     - ${{ if eq(parameters.job, 'rust') }}:
#         - script: scripts/example.sh
#           displayName: An example
#
# Every step runs inside the job's CI image unless it says `target: host`.

parameters:
  - name: job
    type: string

steps:
  # The Rust track compiles the whole workspace, crates/gg included, whose build
  # reflects gg's signature catalogues with Node and every arm's toolchain. The
  # image carries neither, so they come from a cache
  # (.azure/tcab/gg-toolchains-steps.yml, whose steps the project's own Rust
  # jobs take too), after a second disk reclaim: the template's free-disk.sh
  # leaves /usr/local/lib/android, which the project's removes.
  - ${{ if eq(parameters.job, 'rust') }}:
      - script: scripts/ci/free-disk-linux.sh
        displayName: Reclaim the rest of the agent's disk
        target: host
      - template: ../tcab/gg-toolchains-steps.yml
      - script: echo "##vso[task.setvariable variable=CARGO_TERM_COLOR]always"
        displayName: Colour cargo's log

  - ${{ if eq(parameters.job, 'web') }}:
      # The web front ends, the gallery and the validators import the
      # workspace's own packages from their built `dist/`.
      - script: npm run build:packages
        displayName: Build the workspace packages
      # `astro build` records telemetry under $HOME/.config/astro without
      # awaiting the write, so a home it cannot create fails the docs build as
      # an unhandled rejection. Disabled, the build depends on the checkout
      # alone and does not phone out.
      - script: echo "##vso[task.setvariable variable=ASTRO_TELEMETRY_DISABLED]1"
        displayName: Disable Astro's telemetry
