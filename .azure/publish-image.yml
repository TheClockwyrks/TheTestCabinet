# The steps the job of the publish stage of azure-pipelines.yml runs,
# parameterized by the image name and the Dockerfile it is built from.
#
# A job carries no command of its own: the build, the tags, the labels and the
# push are scripts/ci/build-image.sh, which is the same file a developer runs,
# so azure-pipelines.yml decides which images are published and that script
# decides what publishing one is.
#
# The credential is the service connection the pipeline's variables name and
# nothing else, handed in as a parameter: a steps template is expanded before
# the pipeline's variables are, so one named here by the variable would reach
# the task empty and the task would refuse to start. The sign-in it makes is
# the registry's own, so the build script's push reaches the registry and
# reaches nothing else.
#
# The client is pinned to docker here rather than left to the script's probe of
# the agent, because `az acr login` writes the credential into the Docker CLI's
# configuration alone. A hosted agent ships podman too, and a build that
# resolved to it would push with a client nothing signed in and leave the
# sign-out below with nothing to remove.

parameters:
  # The image, which is also its repository in the registry and the name the
  # base manifests give the workload that runs it.
  - name: image
    type: string
  # The Dockerfile under deployments/images/ it is built from, spelled relative
  # to the repository root.
  - name: dockerfile
    type: string
  # The service connection the sign-in goes through, which the pipeline names
  # from its serviceConnection variable.
  - name: serviceConnection
    type: string

steps:
  - checkout: self
    fetchDepth: 1

  # The registry's name is the first label of the registry, which is what the
  # sign-in takes. The commit and the registry come from the run and the
  # pipeline's variables, so the two this step sets are the two that differ
  # between a run and a developer's build.
  - task: AzureCLI@2
    displayName: Build and push ${{ parameters.image }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az acr login --name "${THE_TEST_CABINET_REGISTRY%%.*}"
        scripts/ci/build-image.sh ${{ parameters.image }} ${{ parameters.dockerfile }}
    env:
      THE_TEST_CABINET_REGISTRY: $(registry)
      THE_TEST_CABINET_COMMIT: $(Build.SourceVersion)
      THE_TEST_CABINET_PUSH: "1"
      THE_TEST_CABINET_IMAGE_CACHE: "1"
      CONTAINER_TOOL: docker

  # `always()`, so a failed build leaves no credential behind on the agent.
  # The sign-in is recorded against the registry's host, which is the registry
  # up to its first slash, and the client is the one the step above built and
  # pushed with.
  - script: docker logout "${THE_TEST_CABINET_REGISTRY%%/*}"
    displayName: Sign out of the registry
    condition: always()
    env:
      THE_TEST_CABINET_REGISTRY: $(registry)
