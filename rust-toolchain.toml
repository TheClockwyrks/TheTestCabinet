# The Rust toolchain every checkout builds with. Pinned to an exact patch release
# rather than `stable` so a new stable never silently changes what the gate
# enforces: tracking `stable` lets a widened lint fail the gate on code nobody
# had touched. It is the compiler the toolchain image `TOOLCHAIN_IMAGE` in
# .devcontainer/docker-compose.yml names holds, and the two must stay on the
# same version, so it moves with the template version that moves that image.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
